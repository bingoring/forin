name: mobile

# The mobile side had no CI at all until now: tsc and 213 jest tests ran only on
# whoever remembered to run them. `packages/contract/**` is in the path filter
# because src/api/client.ts imports @contract/types — regenerating the contract
# can break mobile types, and a contract-only push must still be type-checked.
#
# `server/content/**` is here for the same reason one step removed: the reward icons
# on the briefing screen come from the scenario YAML, and contentIcons.test.ts reads
# that directory to check every value resolves to artwork. A content-only push can
# therefore break a mobile screen, and without this filter the test that catches it
# would not run.
on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - 'packages/contract/**'
      - 'server/content/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/contract/**'
      - 'server/content/**'
      - '.github/workflows/mobile.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # The design handoff lives in the `docs/dlc` submodule, and
          # src/theme/ficons.test.ts re-parses its forin-pixel-icons.jsx to compare all
          # 88 icons and 813 rects against the generated table. Without the submodule
          # that comparison skips, which means the one check that can catch a hand-edit
          # or a missed regeneration only ever ran on one laptop.
          #
          # No token needed: bingoring/waypoint is public and the submodule URL is
          # https, so the anonymous clone works. (I had assumed it was private and said
          # so — it is not.)
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # `npm ci` (not install): the lockfile is the contract, and a CI run that
      # silently resolves different versions than the developer had is not a gate.
      - run: npm ci

      # `.expo/types/router.d.ts` is what narrows expo-router's `Href` type to a
      # literal union of real routes — without it `Href` degrades to
      # `string | HrefObject` and a typo'd `router.push('/typoo')` type-checks
      # clean. The directory is gitignored (`.expo/`), so the tsc step below
      # would otherwise run without it. Confirmed by deleting the directory and
      # trying candidates: `expo customize tsconfig.json` and `expo export`
      # never touch it — only `expo start`'s Metro dev server regenerates it
      # (the type-generation code is wired into `MetroBundlerDevServer` only).
      # `expo start` never exits on its own, so this backgrounds it, polls for
      # the file, then kills it. See 01-deployment.md §12.2 for the full trail,
      # including a direct before/after repro of a route typo passing tsc
      # without this file and failing with it.
      - name: Generate typed-routes declarations (for tsc)
        run: |
          npx expo start --port 8090 --offline > /tmp/expo-start.log 2>&1 &
          EXPO_PID=$!
          FOUND=0
          for i in $(seq 1 30); do
            if [ -f .expo/types/router.d.ts ]; then FOUND=1; break; fi
            sleep 1
          done
          kill "$EXPO_PID" 2>/dev/null || true
          sleep 1
          pkill -f "expo start --port 8090" 2>/dev/null || true
          if [ "$FOUND" != "1" ]; then
            echo "::error::.expo/types/router.d.ts was not generated within 30s — tsc below would run without typed routes."
            cat /tmp/expo-start.log
            exit 1
          fi

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
