name: seed

# Content seeding replaces the whole catalog inside one transaction (Task 3's
# ContentRepo.Seed: DELETE across 6 tables, then INSERT), so it doesn't belong
# in every code deploy — a 6.8MB replace is a different risk than shipping a
# binary. Run this by hand when the content bundle changes.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to seed
        type: choice
        options: [staging, prod]
        required: true
      allow_removal:
        description: "Allow removing referenced content ids (intentional retirement)"
        type: boolean
        default: false

# Two dispatches against the same environment could otherwise interleave: A
# resolves and logs an image, B's `jobs update` overwrites it before A's
# `jobs execute` runs, and A silently seeds a different image than the one it
# reported. Scoped per environment (not globally) because a staging seed has
# no reason to block a prod seed. cancel-in-progress stays false — this is a
# replace operation; cutting one off mid-run is worse than queuing the next.
concurrency:
  group: seed-${{ inputs.environment }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-northeast3

jobs:
  seed:
    runs-on: ubuntu-latest
    # Seeding production goes through the same reviewer gate as deploying it.
    # Both branches resolve to a real Environment name (never ''), so a
    # staging run still records an environment in the GitHub UI — useful
    # history for a replace-style operation.
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    # No actions/checkout: this job only talks to gcloud, it never reads a
    # file out of the repo (same reasoning as promote.yml's production job).
    permissions:
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # A service's spec.template is the *desired* template for the next
      # revision, not necessarily what's serving traffic — a --no-traffic
      # deploy (promote.yml's candidate step) updates the template while
      # status.traffic stays on the old revision until the traffic shift
      # succeeds. If promotion ever fails after landing a candidate, the
      # template points at an unpromoted image. Content has to match the code
      # actually reading it, so resolve the revision holding 100% of traffic
      # first, then read that revision's image — not the service's template.
      #
      # Not exercised against the real service yet: if either field path
      # resolves empty on the first run, check the field name against the
      # actual `gcloud run services describe` / `gcloud run revisions
      # describe` output for this project.
      - name: Resolve the currently serving image
        id: image
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          REV_RAW=$(gcloud run services describe "forin-api-$ENVIRONMENT" \
            --region="$REGION" --format='value(status.traffic.filter("percent=100").extract(revisionName).flatten())')
          REV="${REV_RAW%%$'\n'*}"
          test -n "$REV" || {
            echo "could not resolve the revision serving 100% of traffic for forin-api-$ENVIRONMENT"
            exit 1
          }
          IMAGE_RAW=$(gcloud run revisions describe "$REV" \
            --region="$REGION" --format='value(spec.containers[0].image)')
          IMAGE="${IMAGE_RAW%%$'\n'*}"
          test -n "$IMAGE" || {
            echo "could not resolve the image for revision $REV (forin-api-$ENVIRONMENT)"
            exit 1
          }
          echo "seeding $ENVIRONMENT from revision $REV, image $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Always pass SEED_ALLOW_REMOVAL explicitly rather than branching
      # between --update-env-vars and --remove-env-vars: the seed binary
      # (server/cmd/seed/main.go) checks `os.Getenv("SEED_ALLOW_REMOVAL") !=
      # "1"`, so "0" and unset are already equivalent to the code. Setting it
      # every run removes both the risk of a stale value surviving from a
      # previous execution and any dependence on --remove-env-vars behaving
      # as a clean no-op on a variable that was never set.
      # --command is pinned explicitly for the same reason deploy.yml/promote.yml
      # pin --command/--args on the migrate Job: `gcloud run jobs update` only
      # changes the fields it's given and preserves the rest, so omitting
      # --command here would let it silently drift from Terraform's
      # `/seed` (runtime.tf) if any prior run of this job was ever updated
      # with a different command. Args are omitted on purpose — /seed takes
      # none; SEED_ALLOW_REMOVAL is passed as an env var, not an arg.
      - name: Seed
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ALLOW_REMOVAL: ${{ inputs.allow_removal }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          VALUE=0
          [ "$ALLOW_REMOVAL" = "true" ] && VALUE=1
          gcloud run jobs update "forin-seed-$ENVIRONMENT" --region="$REGION" \
            --image="$IMAGE" --command=/seed --update-env-vars="SEED_ALLOW_REMOVAL=$VALUE" --quiet
          gcloud run jobs execute "forin-seed-$ENVIRONMENT" --region="$REGION" --wait
