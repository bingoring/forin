name: promote

# Production is promoted by a human running this workflow, never by a push.
#
# Why not just `environment: production` on a job inside deploy.yml (the
# original design): a GitHub Environment that doesn't exist yet is
# auto-created by GitHub with NO protection rules the first time a workflow
# references it — it does not fail closed. If the human setup step (creating
# the Environment, adding required reviewers) is skipped or done out of
# order, a job gated only by `environment: production` deploys prod on the
# very next push with no approval at all. That's a configuration-dependent
# gate, and configuration can be missing.
#
# The structural fix is this file: it has only a workflow_dispatch trigger,
# so nothing in this repo can invoke it except a human clicking Run. That
# holds regardless of what's configured on the GitHub side. `environment:
# production` is kept below as a second layer on top of that — if the
# Environment *is* configured with required reviewers, the approval gate
# still applies here too. Either layer alone is enough; both together degrade
# gracefully if one is missing.
#
# The other half of the story: this file resolves image_tag to the
# staging-verified-<sha> tag (applied by deploy.yml only after its smoke test
# passes), not the bare <sha> tag. That's a different failure mode than the
# one above — it's not about whether a human pressed the button, it's about
# whether the human pressed it with a SHA that never passed staging. Splitting
# prod into its own workflow means a human must act; the verified tag means
# that even if the human acts on a wrong SHA, there is nothing for gcloud to
# deploy.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA of the image to promote (must be the SHA of a deploy.yml run whose staging job went green)'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-northeast3

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production   # second-layer approval gate, see header above
    permissions:
      id-token: write   # required to mint the WIF token; no repo checkout needed
    steps:
      # No actions/checkout here: this job only talks to gcloud/curl, it never
      # reads a file out of the repo.
      #
      # image_tag is operator-supplied free text from the workflow_dispatch
      # form. It's passed via `env:` and read back as "$TAG" rather than
      # interpolated as ${{ inputs.image_tag }} inside the run: body — the
      # regex check below can only run after the shell line is already
      # assembled, so an inline expression would let its content execute
      # before validation ever sees it. Every later step that needs the tag
      # follows the same pattern.
      - name: Validate image_tag and summarize the promotion
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          echo "$TAG" | grep -qE '^[0-9a-f]{40}$' || {
            echo "image_tag must be a 40-character hex commit SHA, got: $TAG"
            exit 1
          }
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/forin/api:staging-verified-${TAG}"
          echo "promoting $IMAGE"

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Fail closed before touching anything: if this SHA's staging job never
      # ran the smoke test (or ran it and failed), deploy.yml never applied
      # staging-verified-<sha>, and this describe call finds nothing.
      #
      # This is the first gcloud call of the very first prod promotion ever
      # run, so its most likely failure at that moment is NOT a missing tag —
      # it's WIF/IAM/repository-name misconfiguration. Swallowing stderr (the
      # old `>/dev/null 2>&1`) hid that distinction and always printed "not
      # verified", sending an operator hunting for a nonexistent staging
      # failure when the real problem was PERMISSION_DENIED. Surface stderr
      # and name both possibilities so the operator's next step is grounded.
      - name: Require the image to be staging-verified
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          REF="${REGION}-docker.pkg.dev/${PROJECT_ID}/forin/api:staging-verified-${TAG}"
          if ! ERR=$(gcloud artifacts docker images describe "$REF" 2>&1 >/dev/null); then
            echo "verified 태그를 확인할 수 없다: $REF"
            echo "gcloud: $ERR"
            echo "태그 부재라면 이 SHA가 staging 스모크를 통과하지 않았다는 뜻이다 — deploy 워크플로가 green으로 끝난 실행의 SHA를 써라."
            echo "PERMISSION_DENIED라면 배포 SA의 Artifact Registry 권한(WIF·IAM·리포지토리 이름)을 봐라."
            exit 1
          fi

      # Capture what's serving right now, before we touch anything (including
      # the migration) — a failed migration is the clearest case where traffic
      # never moved, and capturing this first means the rollback guidance
      # below always has a concrete answer for that case instead of falling
      # into the "couldn't determine" branch.
      - name: Capture currently serving revision
        id: prev
        run: |
          PREV_RAW=$(gcloud run services describe forin-api-prod --region="$REGION" \
            --format='value(status.traffic.filter("percent:100").extract(revisionName))')
          PREV="${PREV_RAW%%$'\n'*}"
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"

      # Migrations are additive/backward-compatible by policy (see
      # infra/README.md) — the previous revision's code keeps working against
      # the new schema. That's what makes it safe to run the migration before
      # the code deploy is confirmed healthy: if the deploy step below fails,
      # traffic stays on the old revision, which still runs fine against the
      # already-migrated schema. There is no down migration and no automatic
      # revert here — recovery is "redeploy the code", not "undo the schema".
      #
      # --command and --args are pinned explicitly on every run of this step,
      # even though Terraform already sets them this way (runtime.tf):
      # `gcloud run jobs update` only touches the fields you pass and
      # preserves everything else. The dirty-recovery runbook
      # (infra/README.md) deliberately leaves this Job with
      # `--args=force,<version>` mid-recovery; if an operator forgets the
      # runbook's final `--args=up` step, every later deploy's migrate step
      # would silently re-run `force <version>` instead of `up` — exiting 0,
      # rewinding schema_migrations, applying nothing new, and never printing
      # an error. Pinning both flags here means this step always restores the
      # intended command/args regardless of what a previous run (especially a
      # recovery) left behind.
      - name: Migrate production
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/forin/api:staging-verified-${TAG}"
          gcloud run jobs update forin-migrate-prod \
            --region="$REGION" --image="$IMAGE" --command=/migrate --args=up --quiet
          gcloud run jobs execute forin-migrate-prod --region="$REGION" --wait

      # Land the revision without traffic, tagged `candidate` so it has its
      # own URL we can probe directly before any real request reaches it.
      - name: Deploy production without traffic
        id: rev
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/forin/api:staging-verified-${TAG}"
          gcloud run deploy forin-api-prod \
            --region="$REGION" --image="$IMAGE" --no-traffic --tag=candidate --quiet
          REV=$(gcloud run services describe forin-api-prod --region="$REGION" \
                --format='value(status.latestCreatedRevisionName)')
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      # Ready is a named condition, not necessarily conditions[0] — the array
      # order isn't part of the API contract. Comparing the extracted value
      # directly (no grep) also avoids the classic pipefail flake where a
      # short-circuiting downstream reader (e.g. `grep -q`) closes the pipe
      # early and SIGPIPEs gcloud, failing the step even though it matched.
      - name: Verify the new revision is ready
        run: |
          READY=$(gcloud run revisions describe "${{ steps.rev.outputs.revision }}" --region="$REGION" \
            --format='value(status.conditions.filter("type:Ready").extract(status))')
          test "$READY" = "True" || { echo "revision is not Ready: $READY"; exit 1; }

      # Check the candidate BEFORE it carries any traffic. Checking after the
      # traffic shift is too late — by then the bad revision has already
      # served 100% of production requests, and this workflow doesn't revert
      # traffic automatically on failure.
      - name: Confirm candidate health and that the dev bypass is absent
        run: |
          CAND_RAW=$(gcloud run services describe forin-api-prod --region="$REGION" \
            --format='value(status.traffic.filter("tag:candidate").extract(url))')
          CAND="${CAND_RAW%%$'\n'*}"
          test -n "$CAND" || { echo "could not find the candidate URL"; exit 1; }
          curl -fsS "$CAND/readyz" >/dev/null
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$CAND/auth/dev")
          test "$CODE" = "404" || { echo "/auth/dev on candidate answered $CODE, expected 404"; exit 1; }

      # Only after the candidate proved healthy on its own URL do we move real
      # traffic to it. --remove-tags drops the candidate URL so it doesn't
      # linger as an unlisted way to reach whatever revision is tagged next.
      - name: Shift traffic
        id: shift
        run: |
          gcloud run services update-traffic forin-api-prod --region="$REGION" \
            --to-revisions="${{ steps.rev.outputs.revision }}=100" --remove-tags=candidate --quiet

      # Re-check the dev-bypass invariant here too, not just readiness. The
      # candidate check earlier (before any traffic moved) proves the image is
      # sound, but not that the traffic shift landed real requests on it
      # correctly — checking only /readyz after the shift would leave a
      # window where §8's invariant is unverified on the URL the mobile app
      # actually calls.
      - name: Confirm production is serving after the shift
        run: |
          URL=$(gcloud run services describe forin-api-prod --region="$REGION" --format='value(status.url)')
          curl -fsS "$URL/readyz" >/dev/null
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/auth/dev")
          test "$CODE" = "404" || { echo "/auth/dev after traffic shift answered $CODE, expected 404"; exit 1; }

      # `if: failure()` alone is not enough to decide what to print: whether
      # traffic actually moved depends on whether the Shift traffic step
      # itself succeeded, not on whether *this job* failed. If Shift traffic
      # succeeded and only the post-shift confirm above failed, prod is
      # already 100% on the new (unconfirmed) revision — printing "traffic is
      # still on $PREV, just redeploy" would be false in exactly the moment an
      # operator is reading it under pressure. Branch on the shift step's own
      # outcome so each branch's text is true in the situation it describes.
      - name: Rollback guidance
        if: failure()
        run: |
          PREV="${{ steps.prev.outputs.revision }}"
          # The candidate tag (if the revision that has it ever got created)
          # stays reachable at its own allUsers-invoker URL after a failure —
          # clean it up so a rejected revision doesn't linger as a live URL.
          # A cleanup failure shouldn't make an already-failed run look worse,
          # so this is best-effort.
          gcloud run services update-traffic forin-api-prod --region="$REGION" \
            --remove-tags=candidate --quiet || true
          {
            echo "### promote 실패"
            echo ""
            echo "스키마 마이그레이션은 하위호환 정책이라 이미 적용됐어도 위험하지 않다."
            echo ""
            if [ "${{ steps.shift.outcome }}" = "success" ]; then
              echo "**트래픽은 이미 새 리비전으로 넘어갔다.** 그 다음 단계(전환 후 확인)가 실패했다는 뜻이므로,"
              echo "prod는 지금 확인되지 않은 리비전을 100% 서빙 중이다. 다른 조치보다 먼저 되돌려라:"
              echo ""
              if [ -n "$PREV" ]; then
                echo "    gcloud run services update-traffic forin-api-prod --region=$REGION --to-revisions=$PREV=100"
              else
                echo "이전 리비전을 확인하지 못했다(이번이 첫 승격이었다면 정상이다 — \`\$PREV\`는 원래 hello 부트스트랩"
                echo "이미지였다). Cloud Run 콘솔에서 forin-api-prod 서비스의 리비전 목록과 현재 트래픽 분배를 확인하라."
              fi
            else
              echo "트래픽은 아직 넘어가지 않았다 — Shift traffic 단계 이전에 실패했다."
              if [ -n "$PREV" ]; then
                echo "트래픽은 여전히 이전 리비전(\`$PREV\`)에 있다. 코드만 다시 배포하면 복구된다."
                echo "(이번이 첫 승격이었다면 \`$PREV\`는 hello 부트스트랩 이미지다 — 되돌릴 필요는 없고, 승격 자체를 다시 돌려라.)"
                echo "그래도 되돌려야 한다면:"
                echo ""
                echo "    gcloud run services update-traffic forin-api-prod --region=$REGION --to-revisions=$PREV=100"
              else
                echo "이전 리비전을 확인하지 못했다(첫 배포였거나, 그 단계 이전에 실패했을 수 있다)."
                echo "Cloud Run 콘솔에서 forin-api-prod 서비스의 리비전 목록과 현재 트래픽 분배를 확인하라."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
