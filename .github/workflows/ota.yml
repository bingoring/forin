name: ota

# OTA bypasses store review: `eas update` pushes JS to every user immediately,
# while a new build goes through Apple/Google. It is the fastest and least
# reversible path we have, so it gets the same gate as promoting production —
# manual dispatch only (no GitHub setting can make this fire on its own) plus
# the production environment's reviewer as a second layer.
#
# The fingerprint runtimeVersion policy (app.json) is what makes this safe at
# all: if native dependencies changed, the fingerprint changes and this update
# simply will not be offered to the old binary. That safety net is also why
# the "Summarize what was published" step below calls out runtimeVersion
# explicitly — a fingerprint mismatch makes this run exit green while reaching
# zero devices, and that has to be visible somewhere.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to publish to
        type: choice
        options: [preview, production]
        required: true
      message:
        description: Update message (shown in the EAS dashboard)
        type: string
        required: true

concurrency:
  group: ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  # Runs unconditionally (no environment gate) so its summary is already on
  # the run page by the time an approver opens the production job's pending
  # deployment — `environment: production` blocks every step of that job,
  # including any step that would print this, until someone approves it. This
  # is the only way to show "here's what you're about to approve" before the
  # approval happens.
  summarize:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record what this dispatch would publish
        env:
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          {
            echo "### OTA dispatch requested"
            echo ""
            echo "- channel: \`$CHANNEL\`"
            echo "- commit: \`$SHA\` (\`$REF\`)"
            echo "- message: $MESSAGE"
            if [ "$CHANNEL" = "production" ] && [ "$REF" != "refs/heads/master" ]; then
              echo ""
              echo "**blocked**: production only publishes from \`master\`; the update job will not run for this ref."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  update:
    needs: summarize
    runs-on: ubuntu-latest
    # actions/checkout below checks out whatever ref this dispatch was run
    # against — workflow_dispatch lets an operator pick any branch, and
    # nothing else in this job confirms that ref was ever reviewed. Pin
    # production to master; preview is internal and isn't restricted.
    #
    # `success()` here is redundant, not required: unlike a step's `if:`, a
    # job's `if:` does not replace the implicit "only run if `needs`
    # succeeded" default just by being present — that default is only
    # bypassed by always()/failure()/cancelled(). Kept explicit anyway so
    # this line is correct read on its own, without depending on the reader
    # already knowing that job- and step-level `if:` defaults differ.
    if: success() && (inputs.channel != 'production' || github.ref == 'refs/heads/master')
    # Only the production channel needs the reviewer gate; preview is internal.
    environment: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
        # GitHub's default shell (when `shell:` is left unset) does not
        # enable pipefail — only an explicit `shell: bash` does. This job has
        # two steps that pipe a command's output (the eas.json env checks
        # below, and `eas update | tee`); without pipefail, a failure on the
        # left side of any of those pipes is silently swallowed by the
        # right side's exit code, letting a failed publish print "published"
        # and exit green. Verified with `bash -e` vs `bash -eo pipefail`
        # against the same failing pipe before writing this.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Publishing a bundle that does not type-check or pass tests would reach
      # users faster than any other path in this repo. Re-verify here rather
      # than trusting that mobile.yml ran on this commit.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # `eas update` cannot read a build profile's `env` block: it has no
      # --build-profile flag, and its own --environment flag loads server-side
      # EAS environment variables instead (this project has none registered —
      # `eas env:list` returns nothing for either environment). Duplicating
      # eas.json's values into EAS would create a second place to forget, so
      # this step reads them back out of eas.json and injects them as process
      # env for the bundler, keeping eas.json the one place that decides what
      # a bundle points at — the same values `eas build` already resolves for
      # this channel.
      #
      # Channel names and eas.json build-profile names are identical on
      # purpose (Task 2 set them up that way) — fail loudly if that pairing
      # ever breaks instead of silently shipping with nothing injected.
      - name: Load EXPO_PUBLIC_* from the matching build profile
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          jq -e --arg ch "$CHANNEL" '.build | has($ch)' eas.json >/dev/null || {
            echo "eas.json has no build profile named \"$CHANNEL\" — channel and profile names must match (Task 2)."
            exit 1
          }
          ENV_JSON=$(jq -c --arg ch "$CHANNEL" '.build[$ch].env // {}' eas.json)
          test "$ENV_JSON" != '{}' || {
            echo "eas.json build.$CHANNEL has no env block — nothing to inject."
            exit 1
          }

          # These four are exactly what client.ts/auth.ts read at runtime.
          # Checking only for blank values (as this step originally did)
          # misses a key being deleted outright — that silently reintroduces
          # the same dead-login/localhost fallback this step exists to
          # prevent, with no error anywhere in the pipeline.
          for KEY in EXPO_PUBLIC_API_URL EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID EXPO_PUBLIC_KAKAO_NATIVE_APP_KEY; do
            echo "$ENV_JSON" | jq -e --arg k "$KEY" 'has($k)' >/dev/null || {
              echo "eas.json build.$CHANNEL.env is missing required key: $KEY"
              exit 1
            }
          done

          # A non-string value (e.g. `null` from a bad edit) would still get
          # interpolated into a KEY=VALUE line below and ship as the literal
          # text "null" — reject it before that can happen.
          NOT_STRING=$(echo "$ENV_JSON" | jq -r 'to_entries[] | select(.value | type != "string") | .key')
          test -z "$NOT_STRING" || {
            echo "eas.json build.$CHANNEL.env values must be strings, got a non-string for: $NOT_STRING"
            exit 1
          }

          BLANK=$(echo "$ENV_JSON" | jq -r 'to_entries[] | select(.value == "") | .key')
          test -z "$BLANK" || {
            echo "eas.json build.$CHANNEL.env has empty values: $BLANK"
            exit 1
          }

          # $GITHUB_ENV is a line-oriented KEY=VALUE file — a newline in
          # either the key or the value lets one JSON entry inject a second,
          # unrelated env var into every later step in this job. Checked on
          # both key and value; the value-only check this step originally had
          # missed the key side.
          UNSAFE=$(echo "$ENV_JSON" | jq -r 'to_entries[] | select((.key | test("\n")) or (.value | test("\n"))) | .key')
          test -z "$UNSAFE" || {
            echo "eas.json build.$CHANNEL.env has a key or value containing a newline: $UNSAFE"
            exit 1
          }

          echo "$ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      # --environment is required on Expo SDK 55+ (this project is on 56) even
      # though it has nothing to load here — see the env-injection step above
      # for why the actual EXPO_PUBLIC_* values come from eas.json instead.
      #
      # --json makes the CLI's own stdout the source of truth for what got
      # published (update group id + resolved runtimeVersion per platform) —
      # saved to a file so the next step can parse it independently of this
      # step's own success/failure handling. Written to $RUNNER_TEMP, not the
      # checked-out mobile/ tree: an untracked file inside the repo, created
      # by this same command before eas-cli's own git-dirty check has any
      # reason to have already run, would risk tagging every publish's
      # gitCommitHash as coming from a dirty tree.
      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
        run: |
          npx eas-cli@21.8.0 update --channel "$CHANNEL" --message "$MESSAGE" \
            --environment "$CHANNEL" --non-interactive --json | tee "$RUNNER_TEMP/eas-update-result.json"

      # Fingerprint runtimeVersion fails silent by design (see header comment):
      # if native deps changed since the last build for this channel, this
      # update's runtimeVersion won't match any installed binary and it
      # reaches zero devices while the job still exits green. Surface the
      # runtimeVersion(s) actually published, plus the two rollback commands
      # (verified to exist on eas-cli 21.8.0), so an operator reading this
      # later isn't hunting for either fact.
      - name: Summarize what was published
        run: |
          RESULT="$RUNNER_TEMP/eas-update-result.json"
          # Not `GROUPS` — that's a bash special variable (the caller's
          # supplementary group ids) and a plain assignment to it is
          # silently a no-op, so every line below that read it would have
          # come up empty while the step still exited 0.
          UPD_GROUPS=$(jq -r '[.[].group] | unique | .[]' "$RESULT")
          {
            echo "### OTA update published"
            echo ""
            for GROUP in $UPD_GROUPS; do
              echo "**update group \`$GROUP\`**"
              echo ""
              jq -r --arg g "$GROUP" '.[] | select(.group == $g) | "- platform `\(.platform)`: runtimeVersion `\(.runtimeVersion)`"' "$RESULT"
              echo ""
            done
            echo "This update only reaches installations whose runtimeVersion matches the value(s) above."
            echo "If native dependencies changed since the last build for this channel, that match can be empty — this run still exits green even though it reached zero devices."
            echo ""
            echo "To roll back a group:"
            echo ""
            for GROUP in $UPD_GROUPS; do
              echo "    npx eas-cli@21.8.0 update:rollback $GROUP"
              echo "    npx eas-cli@21.8.0 update:republish --group $GROUP"
            done
          } >> "$GITHUB_STEP_SUMMARY"
