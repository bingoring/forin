name: server

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      # Catches sqlc-generated code drifting from db/queries + migrations (it
      # already happened once: a migration dropped columns a query still
      # SELECTed, and nobody re-ran `sqlc generate` to notice).
      - run: make sqlc-diff
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/api
