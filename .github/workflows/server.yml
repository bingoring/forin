name: server

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Postgres-backed tests (adapters/postgres, ~50) skip without TEST_DATABASE_URL — before this
    # service they never ran in CI ("a skipped test is not a test"). Same image as docker-compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forin
          POSTGRES_PASSWORD: forin
          POSTGRES_DB: forin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forin -d forin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://forin:forin@localhost:5432/forin_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      # Catches sqlc-generated code drifting from db/queries + migrations (it
      # already happened once: a migration dropped columns a query still
      # SELECTed, and nobody re-ran `sqlc generate` to notice).
      - run: make sqlc-diff
      - run: go vet ./...
      # The embedded runner — the same code path as prod.
      - run: go run ./cmd/migrate up
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: go test ./...
      - run: go build ./cmd/api
