name: deploy

# Deploys staging only. Promoting to production is a separate, human-triggered
# workflow (promote.yml) — see that file's header for why prod must never be
# reachable by a push, even if a GitHub Environment protection rule is
# missing or misconfigured.
on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-northeast3

jobs:
  # server.yml and contract.yml run in parallel with this workflow on the same
  # push — that's CI, not a gate. If deploy doesn't depend on their result, a
  # red commit (failing tests, or a contract that drifted from the Go code)
  # still gets built and pushed to staging. Re-run the same checks here so the
  # deploy pipeline is self-certifying and doesn't rely on branch-protection
  # settings being wired correctly in GitHub.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - working-directory: server
        run: go vet ./...
      - working-directory: server
        run: go test ./...
      - working-directory: server
        run: go build ./cmd/api

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: go install github.com/swaggo/swag/v2/cmd/swag@latest

      - name: Regenerate contract
        working-directory: server
        run: make contract

      - name: Fail on drift
        run: git diff --exit-code packages/contract

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required to mint the WIF token
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - id: meta
        run: echo "image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/forin/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        working-directory: server
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  staging:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Migrations first: the new code may need the new schema. Which migrations
      # to apply is decided by the schema_migrations table in the database, not
      # by this workflow.
      #
      # --command and --args are pinned explicitly on every run, even though
      # Terraform already sets them this way (runtime.tf): `gcloud run jobs
      # update` only touches the fields you pass and preserves everything
      # else. If the dirty-recovery runbook (infra/README.md) was ever used
      # here and its final `--args=up` step was forgotten, this job would
      # otherwise keep running `force <version>` instead of `up` on every
      # subsequent deploy — exiting 0, rewinding schema_migrations, and
      # applying no new migrations, silently. Pinning both flags here means
      # this step always restores the intended state regardless of what a
      # previous run left behind.
      - name: Migrate staging
        run: |
          gcloud run jobs update forin-migrate-staging \
            --region="$REGION" --image="${{ needs.build.outputs.image }}" --command=/migrate --args=up --quiet
          gcloud run jobs execute forin-migrate-staging --region="$REGION" --wait

      - name: Deploy staging
        run: |
          gcloud run deploy forin-api-staging \
            --region="$REGION" --image="${{ needs.build.outputs.image }}" --quiet

      # The script ends with `[ "$FAIL" -eq 0 ] || exit 1`, so its exit code is
      # the gate — no output parsing needed. A non-zero exit fails this job,
      # and promote.yml is a separate manual workflow that nobody has reason to
      # run against a SHA whose staging job never went green.
      - name: Smoke test staging
        run: |
          URL=$(gcloud run services describe forin-api-staging --region="$REGION" --format='value(status.url)')
          DEV_AUTH_SECRET=$(gcloud secrets versions access latest --secret=forin-dev-auth-secret-staging)
          echo "::add-mask::$DEV_AUTH_SECRET"
          export DEV_AUTH_SECRET
          server/scripts/e2e_smoke.sh "$URL"

      # The verified tag is what makes promotion safe: it is applied only after
      # the smoke passed, so an image that failed (or never ran) verification has
      # no verified tag and promote cannot resolve it. Without this, every image
      # that merely built would be promotable — separating prod into its own
      # workflow_dispatch (see promote.yml) stops an unattended push from
      # reaching prod, but on its own it does nothing to stop an operator from
      # promoting a SHA whose staging job never went green.
      - name: Tag the image as staging-verified
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          gcloud artifacts docker tags add \
            "$IMAGE" \
            "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/forin/api:staging-verified-${{ github.sha }}"

      # Promotion is a separate, human-triggered workflow (promote.yml) — it
      # takes a commit SHA as input rather than inferring "the latest staging
      # image", so the operator needs this value in front of them to copy.
      # promote.yml resolves it to the staging-verified-<sha> tag just applied
      # above, not the bare <sha> tag, so an unverified SHA can't be promoted.
      - name: Promotion hint
        run: |
          {
            echo "### staging 배포 완료 — staging-verified-${{ github.sha }} 태그를 붙였다"
            echo ""
            echo "승격하려면 \`promote\` 워크플로를 실행하고 아래 값을 넣어라:"
            echo ""
            echo "    image_tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
