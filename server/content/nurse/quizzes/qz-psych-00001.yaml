# mcq — therapeutic communication (v17 PSYCH quiz). Pick the most therapeutic
# response to a patient expressing paranoid delusions.
id: QZ-PSYCH-00001
type: mcq
title: "치료적 의사소통"
content:
  sub: "가장 치료적인 응답을 고르세요"
  zone: "정신과"
  scene: "환자: \"다들 나를 감시하고 있어요. 여기서 나가야 해요.\"\n가장 치료적인(therapeutic) 응답을 고르세요."
  note: "망상은 부정도 동조도 하지 않고, 감정을 반영하며 안전을 보장합니다."
  choices:
    - { text: "\"You seem frightened. I'm here, and you are safe.\"", ko: "감정 인정 + 안전 보장", correct: true }
    - { text: "\"That's not true, nobody is watching you.\"", ko: "망상을 즉시 부정" }
    - { text: "\"Calm down or I'll call security.\"", ko: "위협적 지시" }
    - { text: "\"Why do you think everyone watches you?\"", ko: "망상을 캐묻기" }
