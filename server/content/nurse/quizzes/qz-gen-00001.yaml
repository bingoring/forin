id: QZ-GEN-00001
type: abbr
title: "의료 약어 플래시카드"
content:
  sub: "약어의 뜻을 카드마다 고르세요"
  zone: "공통"
  context: "🗂 처방·기록에 자주 쓰는 약어입니다. 각 약어의 뜻을 고르세요."
  note: "약어는 투약 안전의 핵심 — 헷갈리면 반드시 풀어서 확인하세요."
  deck:
    - { term: "NPO", answer: "Nothing by mouth", options: ["Nothing by mouth", "Normal pulse output", "No pain observed"] }
    - { term: "PRN", answer: "As needed", options: ["Per routine now", "As needed", "Push right now"] }
    - { term: "STAT", answer: "Immediately", options: ["Standard order", "Immediately", "Stable, no change"] }
    - { term: "BID", answer: "Twice a day", options: ["Twice a day", "Before I dose", "By IV drip"] }
    - { term: "PO", answer: "By mouth (orally)", options: ["Post-op", "By mouth (orally)", "Pulse oximetry"] }
