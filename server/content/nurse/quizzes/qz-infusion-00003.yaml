# QZ-INFUSION-00003 — 일혈(extravasation) 대응 (mcq). 부서 멀티퀴즈 확장 (authored).
id: QZ-INFUSION-00003
type: mcq
title: "일혈(extravasation) 대응"
content:
  sub: "가장 먼저 할 일을 고르세요"
  zone: "주사센터"
  context: "💉 항암제 주입 중 주사 부위가 붓고 아픕니다."
  note: "즉시 주입 중단·라인 유지·사정. 계속 주입은 금기."
  choices:
    - { text: "Stop the infusion immediately and keep the line for assessment", ko: "즉시 주입 중단, 라인 유지 후 사정", correct: true }
    - { text: "Keep infusing to finish the dose", ko: "용량 채우려 계속 주입" }
    - { text: "Pull the line and ignore", ko: "라인 제거 후 방치" }
    - { text: "Apply firm massage to the site", ko: "부위를 강하게 마사지" }
