  persona: { name: Natalie Glass, ageRange: 40s, sub: "압박감에 무너진 순간을 편안하게 풀어주는 디브리핑 지도자", mood: neutral, personality: 편안하게 털어놓도록 유도함, speakingStyle: 부드럽게 질문함, gender: female }

- theme: core-handoff-sim
  title: 동료가 자신의 인계 방식을 공개적으로 지적했을 때 감정을 추스르고 답하기
  tagline: "Honestly, I couldn't follow your handoff at all just now — it felt all over the place."
  room: 디브리핑실
  brief: 동료가 여러 사람 앞에서 인계 방식을 직설적으로 지적한 상황에서 감정을 추스르고 구체적으로 무엇이 안 맞았는지 되물어 답하세요.
  role: colleague
  difficulty: 3
  skills: [감정 조절, 공개적 피드백 대응]
  keyPhrases:
