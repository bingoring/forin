    - 구체적으로 무엇이 문제였는지 되물어 개선점을 파악한다
  acuity: urgent
  persona: { name: Todd Irwin, ageRange: 20s, sub: "직설적으로 지적하는 동료 참가자", mood: neutral, personality: 직설적이지만 악의 없음, speakingStyle: 단도직입적으로 말함, gender: male }

- theme: core-handoff-sim
  title: 인계 역량이 기준 미달이라는 통보를 받고 보완 계획을 논의하기
  tagline: "Your handoff scores are below where we need them right now — let's talk about a plan."
  room: 디브리핑실
