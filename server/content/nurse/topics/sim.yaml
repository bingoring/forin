  goals:
    - 기준 미달 통보를 방어적이지 않게 받아들인다
    - 다음 실습 전까지 실행할 구체적 보완 계획에 합의한다
  acuity: routine
  persona: { name: Teresa Hyland, ageRange: 50s, sub: "보완 계획을 안내하는 시뮬레이션 프로그램 코디네이터", mood: neutral, personality: 절차를 명확히 안내함, speakingStyle: 사무적이지만 다정함, gender: female }

