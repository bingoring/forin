  tagline: We just found out the vaccines given on your unit this week came from the fridge that had the excursion.
  room: 약품정보실
  brief: 온도 이탈 백신이 이미 투여된 사실을 알고 약사와 함께 대상 환자를 파악하고 재접종 여부 판단을 지원하세요.
  role: colleague
  difficulty: 3
  skills:
  - 기투여 추적
  - 재접종 판단
  - 환자 통보
  keyPhrases:
  - I'll pull the administration records to identify every patient who received a dose from that stock.
  - Once the manufacturer tells us whether the doses are still valid, we can decide on revaccination.
  - I'll help notify the providers so patients get clear and honest information.
  goals:
  - 해당 백신을 투여받은 환자를 파악한다
  - 제조사 판단에 따른 통보·재접종 계획을 수립한다
  acuity: urgent
  persona:
    name: Patrick Doyle
    ageRange: 50s
    sub: 약사
    mood: worried
    personality: 책임감 강함
    speakingStyle: 무겁게 말한다
    gender: male
- theme: pharma-cold-chain-biologic
