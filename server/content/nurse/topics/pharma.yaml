- theme: pharma-cold-chain-biologic
  title: 블리나투모맙 주입 중 CRS 의심
  tagline: Her temp just jumped to 39.4 and her pressure's soft — she's on day one of the blinatumomab.
  room: 병실
  brief: 블리나투모맙 주입 첫날 발열과 저혈압이 나타난 환자의 사이토카인 방출 증후군 의심 소견을 종양내과에 즉시 보고하세요.
  role: colleague
  difficulty: 3
  skills:
  - 사이토카인 방출 증후군
  - 긴급 보고
  - 주입 중단 판단
  keyPhrases:
  - She's febrile at thirty-nine point four with a blood pressure of eighty-six over fifty, about six hours into the infusion.
  - I'm concerned about cytokine release syndrome — do you want me to stop the infusion now?
  - Should I start the CRS order set and page the oncology fellow to the bedside?
  goals:
  - CRS 의심 소견을 시간 경과와 함께 보고한다
  - 주입 중단 여부와 응급 처치 지시를 확인한다
  acuity: critical
  collabWith: ONCO
  persona:
    name: Dr. Hannah Takahashi
    ageRange: 40s
    sub: 종양내과 주치의
    mood: focused
    personality: 침착하고 신속함
    speakingStyle: 수치를 먼저 확인한다
    gender: female
- theme: pharma-cold-chain-biologic
  title: 보류된 생물학적 제제 가족 투여
  tagline: I gave him his Cosentyx shot this morning like I always do — was I not supposed to?
  room: 병실
  brief: 감염으로 보류 중인 생물학적 제제를 보호자가 임의로 투여한 사실을 파악하고 보고와 재교육을 시행하세요.
  role: family
  difficulty: 3
  skills:
  - 보류 약물 관리
  - 사건 보고
  - 보호자 교육
  keyPhrases:
  - His team held that medicine because of his infection — can you tell me what time you gave it?
  - I'm going to let his doctor know right away so they can adjust his monitoring.
  - From now on, please give any home medicines to the nurse first so nothing is given while it's on hold.
