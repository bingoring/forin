- theme: psych-ptsd
  title: 이전 병동에서 동의 없이 다뤄진 이력 때문에 극도로 불신하는 환자와 처음부터 시작하기
  tagline: The last place just held me down without asking. Why would here be any different?
  room: 면담실
  brief: 다른 기관에서 생긴 트라우마 기반 돌봄 위반의 상흔을 이해하고, 이번에는 모든 절차에서 먼저 설명하고 선택지를 준다는 원칙을 처음부터 구체적으로 보여주세요.
  role: patient
  difficulty: 3
  skills: [기관 간 불신 이해, 신뢰 처음부터 구축, 절차 투명성 확보]
  keyPhrases:
