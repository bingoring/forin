- theme: psych-benzo
  title: 약을 안 주면 가만 안 두겠다고 위협하는 환자와 거절을 유지하며 대치하기
  tagline: You give me that pill right now or you'll regret it, I promise you that.
  room: 투약 창구
  brief: 위협적인 언사 앞에서도 침착하게 안전거리를 확보하며 한계를 설정하고, 처방 원칙을 지키면서 지원 인력을 요청하세요.
  role: patient
  difficulty: 3
  skills: [위협 상황 한계 설정, 안전거리 확보, 지원 인력 요청]
  keyPhrases:
    - "I hear that you're upset, but I'm not able to give you additional medication right now."
    - "I need you to step back so we can both stay safe while we talk this through."
    - "I'm calling for additional staff to be here with us while we sort this out."
  goals:
