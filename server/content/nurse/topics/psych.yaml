- theme: psych-ptsd
  title: 가족이 허락 없이 몸에 손대려다 환자가 격렬히 반응한 뒤 관계를 수습하기
  tagline: I just wanted to hug my son, why did he react like that, is something wrong with him?
  room: 가족 상담실
  brief: 가족의 무심한 접촉이 촉발한 격렬한 반응 이후, 접촉 전 동의를 구하는 원칙을 가족에게 구체적으로 안내하며 병동 차원에서 관계를 수습하세요.
  role: family
  difficulty: 3
