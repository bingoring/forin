  keyPhrases:
    - "Help me understand what's going on when you decide to save doses up like that."
    - "Taking several at once raises the risk of them all hitting you at once — that's the part I'm worried about."
    - "Let's talk about what would make the regular schedule actually work for you."
  goals:
    - 몰아서 복용하는 습관의 이유를 비난 없이 확인한다
    - 안전한 복용법으로 유도할 구체적인 방법을 제시한다
  acuity: urgent
  persona: { name: Kimberly Swanson, ageRange: 30s, sub: 처방된 용량을 몰아서 먹어 온 습관이 드러난 환자, mood: worried, personality: 들키자 겸연쩍어함, speakingStyle: 별일 아니라는 듯 가볍게 말한다, gender: female }

- theme: psych-benzo
  title: 감량 계획에 동의해 놓고 매번 마지막 순간에 거부하는 환자의 양가감정을 다루기
  tagline: I said I'd do it, but when it actually comes down to it, I just can't.
  room: 면담실
  brief: 감량에 대한 환자의 양가감정을 있는 그대로 인정하면서, 이번에는 계획을 끝까지 밀고 나갈 수 있는 구체적인 지지 방법을 함께 찾으세요.
  role: patient
