  keyPhrases:
    - "It's not about you — his body reacted to being touched without warning, that's a trauma response."
    - "Next time, try asking out loud before you reach for him, even for something small like a hug."
    - "Let's plan your next visit together so it goes more smoothly for both of you."
  goals:
