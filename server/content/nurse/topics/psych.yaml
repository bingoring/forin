    - "This looks like a seizure related to the taper — call it in as an emergency now."
    - "I'm timing this and staying right here until it passes and she's stable."
  goals:
    - 경련을 금단의 중증 징후로 즉시 식별한다
    - 환자의 안전을 확보하며 응급 대응 절차를 신속히 실행한다
  acuity: critical
  persona: { name: Donna Turner, ageRange: 40s, sub: 감량 중 갑자기 경련을 일으킨 환자, mood: panic, personality: 발작 중 의사소통이 불가능함, speakingStyle: 반응 없음, gender: female }

- theme: psych-benzo
  title: 처방 외 약을 구하려고 다른 환자를 설득하는 정황을 포착해 개입하기
  tagline: I'm not doing anything wrong, we're just talking, back off.
  room: 밀리유 라운지
  brief: 병동 내 약물 거래를 시도하는 정황을 발견한 즉시 대화를 중단시키고, 안전 문제로서 신속하고 침착하게 개입해 상황을 분리하세요.
  role: patient
  difficulty: 3
  skills: [약물 거래 정황 개입, 신속한 상황 분리, 침착한 대응]
  keyPhrases:
    - "I need the two of you to stop this conversation and step apart right now."
    - "Whatever's being discussed here, it's not something we can allow between patients."
    - "Let's talk one-on-one about what just happened, away from everyone else."
