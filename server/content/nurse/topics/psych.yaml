- theme: psych-ptsd
  title: 예전 강박 경험이 떠오르는 상황에서 얼어붙어 말을 잃은 환자와 소통을 잇기
  tagline: 억제대와 비슷한 것을 보자마자 환자가 그대로 굳어 아무 말도 하지 못한다.
  room: 안정실
