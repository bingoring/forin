    - 환자 곁을 지키며 즉시 보고 체계를 가동해 지원을 요청한다
  acuity: critical
  persona: { name: Frank Thompson, ageRange: 30s, sub: 야간 단독 근무 중 도움을 요청한 동료 간호사, mood: panic, personality: 다급하지만 침착함을 유지하려 애씀, speakingStyle: 짧고 명확하게 상황을 전달한다, gender: male }

- theme: psych-benzo
  title: 오랜 단골 환자가 감량 협상 끝에 정면으로 배신감을 표현할 때 관계를 정리하기
  tagline: After everything we've talked about, I really thought you'd be on my side this time.
  room: 면담실
  brief: 오래 쌓아온 신뢰가 감량 협상으로 흔들리는 상황을 방어하지 않고 정면으로 마주하며, 관계가 여전히 유효하다는 점을 구체적으로 확인시키세요.
  role: patient
  difficulty: 3
