    - 환자의 자기결정권과 안전 사이에서 대안을 협상한다
  acuity: urgent
  persona: { name: Michelle Tucker, ageRange: 30s, sub: 감량을 거부하며 퇴원하겠다고 선언한 환자, mood: angry, personality: 좌절 끝에 충동적으로 결정함, speakingStyle: 단호하게 통보하듯 말한다, gender: female }

- theme: psych-benzo
  title: 금단 섬망 초기 증상을 보이는 환자를 야간에 홀로 마주해 즉시 알리기
  tagline: 환자가 방금까지 자기 이름을 잊고 벽에 벌레가 기어다닌다고 말하다가 갑자기 조용해졌다.
  room: 병동 복도
  brief: 야간 단독 근무 중 금단 섬망의 초기 징후를 신속히 식별하고, 환자 곁을 떠나지 않으면서 즉시 보고 체계를 가동해 지원을 요청하세요.
  role: colleague
  difficulty: 3
  skills: [금단 섬망 초기 식별, 야간 단독 근무 대응, 즉시 보고 체계 가동]
  keyPhrases:
    - "I'm staying right here with him — can you call the on-call physician now?"
    - "He's disoriented and reporting things that aren't there, this needs eyes on him immediately."
    - "Let's get another set of vitals while we wait for backup to arrive."
  goals:
