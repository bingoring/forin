  acuity: routine
  persona: { name: George Torres, ageRange: 40s, sub: 감량 계획에 매번 동의했다가 마지막 순간에 거부하는 환자, mood: sad, personality: 결심과 포기를 반복함, speakingStyle: 자책하며 말끝을 흐린다, gender: male }

- theme: psych-benzo
  title: 퇴원을 앞두고 외래에서도 계속 처방받을 수 있는지 불안해하는 환자를 안심시키기
  tagline: What happens when I leave here, does the outside doctor even know about this plan?
  room: 퇴원 상담실
  brief: 입원 중 감량 경과를 정리해 퇴원 후 외래 처방 계획과 구체적으로 연결하고, 인계 과정에서 정보가 끊기지 않는다는 점을 확인시켜 불안을 줄이세요.
  role: patient
  difficulty: 2
  skills: [퇴원 연계 계획 설명, 외래 인계 확인, 불안 완화]
  keyPhrases:
    - "Your taper schedule is being written up and sent directly to your outpatient provider before you leave."
    - "You'll have your first outside appointment scheduled before discharge, not after."
    - "If anything feels off once you're home, here's the number to call before your next visit."
  goals:
    - 입원 중 감량 경과를 퇴원 후 외래 처방 계획과 구체적으로 연결한다
    - 인계 과정이 끊기지 않는다는 점을 확인시켜 불안을 줄인다
  acuity: routine
