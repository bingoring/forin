    - 오늘 일정을 환자의 컨디션에 맞게 현실적으로 조정한다
  acuity: routine
  persona: { name: Jason Tsai, ageRange: 40s, sub: 밤새 악몽에 시달린 뒤 아침 컨디션이 저조한 참전군인 환자, mood: worried, personality: 힘든 티를 최소화하며 말함, speakingStyle: 짧고 담담하게 말한다, gender: male }

- theme: psych-ptsd
  title: 사고 경위를 캐묻지 않고 지금 편히 잘 수 있는지만 물어 신뢰 쌓기
