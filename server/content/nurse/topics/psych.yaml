    - 절차의 투명성을 처음부터 구체적으로 보여주며 신뢰를 쌓는다
  acuity: routine
  persona: { name: Justin Terrell, ageRange: 40s, sub: 이전 병동에서 동의 없이 다뤄진 이력 때문에 극도로 불신하는 환자, mood: angry, personality: 절차 자체를 믿지 않음, speakingStyle: 냉소적으로 미리 단정한다, gender: male }

# theme: psych-postpartum
- theme: psych-postpartum
