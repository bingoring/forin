    - 신속하고 침착하게 개입해 관련된 환자들을 분리한다
  acuity: urgent
  persona: { name: Timothy Tanaka, ageRange: 20s, sub: 처방 외 약을 구하려고 다른 환자를 설득하려던 환자, mood: angry, personality: 개입에 즉각 반발함, speakingStyle: 방어적으로 맞선다, gender: male }

- theme: psych-benzo
  title: 감량을 거부하며 퇴원하겠다고 선언한 환자와 위험을 설명하며 붙잡기
  tagline: I'm done with this taper nonsense, I'm signing myself out today.
  room: 퇴원 상담실
  brief: 감량을 중단하고 퇴원했을 때 생길 수 있는 위험을 정직하게 구체적으로 설명하고, 환자의 자기결정권을 존중하면서도 안전을 지킬 수 있는 대안을 협상하세요.
