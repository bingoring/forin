  acuity: urgent
  persona: { name: Ronald Tate, ageRange: 30s, sub: 약을 주지 않으면 위협하겠다고 말하는 환자, mood: angry, personality: 거절당하자 위협적으로 돌변함, speakingStyle: 목소리를 높이며 협박조로 말한다, gender: male }

- theme: psych-benzo
  title: 감량 중 경련을 일으킨 환자를 두고 응급으로 판단해 즉시 대응하기
  tagline: 환자가 갑자기 바닥에 쓰러져 온몸을 떨고 있다 — 말을 걸어도 반응이 없다.
  room: 관찰실
  brief: 경련이 벤조디아제핀 금단의 중증 징후임을 즉시 식별하고, 환자의 안전을 확보하며 응급 대응 절차를 순서대로 신속히 실행하세요.
  role: patient
  difficulty: 3
  skills: [금단 경련 식별, 응급 안전 확보, 신속한 대응 절차 실행]
  keyPhrases:
