  keyPhrases:
    - "I hear that this feels like a betrayal, and I'm not going to brush that off."
    - "Being on your side means keeping you safe, even when that means saying no to something you want."
    - "This doesn't undo everything we've built — I'm still here, and that hasn't changed."
  goals:
    - 오래 쌓아온 신뢰가 흔들리는 상황을 방어하지 않고 정면으로 마주한다
    - 관계가 여전히 유효하다는 점을 구체적으로 확인시킨다
  acuity: routine
  persona: { name: Frances Thibodeaux, ageRange: 60s, sub: 감량 협상 끝에 배신감을 정면으로 표현한 오랜 단골 환자, mood: angry, personality: 실망감을 숨기지 않고 드러냄, speakingStyle: 서운함을 직설적으로 말한다, gender: female }

# theme: psych-ptsd
- theme: psych-ptsd
  title: 채혈 전에 몸에 손대는 순간과 문 닫힘을 미리 설명하고 동의 구하기
