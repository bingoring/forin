  persona: { name: Larry Thao, ageRange: 50s, sub: 허락 없이 아들을 안으려다 격렬한 반응을 마주한 아버지, mood: worried, personality: 자신의 행동을 이해하지 못해 혼란스러워함, speakingStyle: 억울함을 섞어 되묻는다, gender: male }

- theme: psych-ptsd
  title: 새벽 악몽에서 깬 뒤 여기가 어딘지 확신 못 하는 환자를 안전한 현실로 데려오기
  tagline: 환자가 새벽에 비명을 지르며 깨어나 방 안을 두리번거리며 여기가 어디냐고 묻는다.
  room: 환자 병실
