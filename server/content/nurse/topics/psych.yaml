    - 처리 결과를 환자에게 구체적으로 안내한다
  acuity: routine
  persona: { name: Amanda Tobin, ageRange: 30s, sub: 남성 직원 대신 여성 간호사를 요청하는 성폭력 생존 환자, mood: anxious, personality: 요청이 받아들여질지 조심스럽게 살핀다, speakingStyle: 정중하지만 단호하게 요청한다, gender: female }

- theme: psych-ptsd
  title: 밤새 악몽에 시달린 참전군인 환자에게 아침 컨디션을 확인하고 일정 조율하기
  tagline: Didn't sleep much. Same dream as always. I'm not really up for group this morning.
