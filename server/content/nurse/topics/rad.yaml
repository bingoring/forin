# theme: rad-radiation-safety (방사선 차폐·피폭 최소화)
- theme: rad-radiation-safety
  title: 흉부 X-ray 한 장의 방사선량이 어느 정도인지 궁금해하는 환자에게 비유로 설명하기
  tagline: "So how much radiation is this, really? Is it like getting a sunburn or something way worse?"
  room: X-ray 촬영실
  brief: 실제 선량 단위 대신 자연 방사선 노출량 같은 일상적 비유로 바꿔 환자가 감을 잡을 수 있게 설명하세요.
  role: patient
  difficulty: 1
  skills: [선량 비유 설명, 환자 이해도 확인, 안심시키기]
  keyPhrases:
    - "A single chest X-ray gives you roughly what you'd naturally get from a few days of background radiation just living on Earth."
    - "It's a small, one-time dose, nothing like continuous exposure."
    - "If anything's still unclear, I'm happy to go over it again a different way."
  goals:
    - 실제 선량을 일상적 비유로 바꿔 환자가 이해하게 설명한다
    - 과장이나 축소 없이 정직하게 안심시킨다
  acuity: routine
  persona: { name: Timothy Danforth, ageRange: 40s, sub: "흉부 X-ray 한 장의 방사선량이 얼마나 되는지 궁금해하는 환자", mood: neutral, personality: 호기심이 많고 직접적으로 묻는다, speakingStyle: 비유를 요구하며 캐묻는다, gender: male }

- theme: rad-radiation-safety
