  keyPhrases:
    - "It's not a hole in her heart, it's a small blood vessel that's supposed to close after birth and hasn't yet."
    - "Every baby has this passage before birth, and in most babies it closes on its own within days."
    - "We're watching it and treating it now so it has a better chance of closing without surgery."
  goals:
    - 동맥관을 구멍이 아닌 통로 개념으로 정확히 이해하게 한다
    - 태아기에는 정상이었던 구조임을 알려 불안을 줄인다
