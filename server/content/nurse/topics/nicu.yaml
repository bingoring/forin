- theme: nicu-pda
  title: 동맥관개존 진단을 처음 들은 부모에게 심장의 통로가 무엇인지 그림처럼 설명하기
  tagline: "A hole in her heart? Nobody told us anything about her heart before."
  room: NICU 상담실
  brief: 태아 시기에는 정상적으로 열려 있던 혈관 통로가 출생 후에도 닫히지 않은 상태임을 그림을 그려가며 쉬운 말로 풀어주고, 구멍이 아니라 통로라는 개념 차이를 아버지가 구분하게 하세요.
