  persona: { name: Jeremy Otten, ageRange: 30s, sub: "심장 문제라는 말에 아기가 위독한 줄 알고 놀란 아버지", mood: worried, personality: 낯선 의학 용어를 들으면 최악부터 상상하는 성격, speakingStyle: 방금 들은 단어를 그대로 되묻는다, gender: male }

