- theme: nicu-pda
  title: 약물 치료 며칠 만에 심잡음이 옅어진 것을 확인하고 아버지에게 좋아지는 신호를 짚어주기
  tagline: "You keep listening to her chest every day, has anything actually changed?"
  room: NICU 병상
