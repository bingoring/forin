# 주제 레지스트리 (커리큘럼 v3 · P2 ER 정본). 각 key는 시나리오의 theme 태그가 참조하는 안정 식별자.
# track: core(부서 코어; dept 지정 시 그 부서 트랙을 이끎, dept 없으면 전역 공통) | depth(부서 고유) | collab(타 부서 접점)
# exam 생략 시 기본 true(주제 끝 '주제 시험'). order로 여정 정렬(R22).
# 결정 D-P2-D: 코어는 부서별(핸드오프·안전·가족·언어 모두 부서 맥락 상이). ER: 부서 코어 4 + 부서 심화 31 = 35주제.

# ── ER 부서 코어 (부서별 코어 · track:core + dept:ER, 여정에서 ER 트랙을 이끎) ──
