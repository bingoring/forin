- id: SCN-INFUSION-00900
  eventId: EVT-INFUSION-00900
  title: 첫 인사 · 주사센터
  tagline: Chairs fill up fast in the morning. I'm Denise — and you?
  persona:
    name: Denise Moore
    role: nurse
    ageRange: 40s
    sub: Infusion Nurse
    hair: '#7A3B2E'
    hairStyle: bob
    personality: 이야기를 잘 들어 준다. 환자 이름을 다 안다.
    speakingStyle: 편하게, 웃으면서.
    mood: happy
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 환자를 어디로 안내하는지 확인하기
  - 주입 중 무엇을 지켜보는지 묻기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse in the infusion center.
  - Where do I take the patients?
  - What should I watch during an infusion?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Chairs fill up fast in the morning. I'm Denise — and you?
      lineKo: 아침엔 자리가 금방 차요. 저는 Denise예요. 그쪽은?
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the infusion centre today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the infusion centre.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Have you run an infusion on your own before?
      lineKo: 환영해요. 수액 혼자 돌려본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you shadow me on chairs one to four. Same four people every Tuesday, so they'll know
        before I tell them you're new.
      lineKo: 그럼 1~4번 의자에서 저를 따라다녀요. 매주 화요일 같은 네 분이라, 제가 말하기 전에 당신이 새 사람인 걸 압니다.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me before they arrive.
      lineKo: 환자들 오기 전에 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Denise Moore. Denise.
      lineKo: Denise Moore예요. Denise.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Denise. What should I be watching during an infusion?
        why: 이 부서의 일 전체가 '지켜보는 것'입니다. 무엇을 보는지가 첫 질문이어야 합니다.
      - tier: strong
        text: Thank you, Denise. Where do I take the patients?
        why: 동선은 금방 배웁니다. 관찰 항목이 먼저입니다.
      - tier: fair
        text: Nice to meet you, Denise.
        why: 인사로 끝났어요. 관찰 항목은 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Check the site every fifteen minutes and ask them how the arm feels — they'll tell you before
        the pump does.
      lineKo: 15분마다 자리를 보고 팔이 어떤지 물어요. 펌프보다 환자가 먼저 알려줍니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: The site every fifteen minutes, and I ask how the arm feels. I'll ask, not just look.
        why: 두 가지를 되짚고 '묻는다'를 골랐어요. 여기선 그게 먼저 알아채는 방법입니다.
      - tier: strong
        text: I'll check the site every fifteen minutes.
        why: 묻는 부분이 빠졌어요. 환자가 펌프보다 빠릅니다.
      - tier: fair
        text: Okay, I'll keep an eye on them.
        why: '''보고 있겠다''는 15분도 질문도 아니에요.'
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers do is trust the pump alarm. A tissuing line doesn't alarm — it swells, and
        the patient says it stings.
      lineKo: 신입은 펌프 알람을 믿어요. 혈관 밖으로 새는 라인은 알람이 안 울려요. 붓고, 환자가 따갑다고 합니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — the pump won't tell me. If it's swelling, do I stop it before I call you?
        why: 실수를 확인하고, 순서를 먼저 확정했어요. 이 순서가 약을 되돌릴 수 없는 이유와 맞닿습니다.
      - tier: strong
        text: Understood. I'll watch for swelling.
        why: 맞아요. 발견했을 때 순서가 남습니다.
      - tier: fair
        text: I'll call you if the pump alarms.
        why: 방금 그 알람은 울리지 않는다고 들었어요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Stop the infusion first, then call me. Never the other way round — I can walk, the drug
        can't come back.
      lineKo: 먼저 수액을 멈추고, 그다음 저를 부르세요. 반대는 안 됩니다. 저는 걸어가면 되지만 약은 되돌아오지 않아요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: There's a fridge for your lunch behind the desk. Come on — chair one is already here.
      lineKo: 점심은 데스크 뒤 냉장고에 넣어요. 갑시다, 1번 의자 분이 벌써 왔어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. They'll bring you cake by month two.
      lineKo: 환영해요. 두 달이면 다들 케이크 들고 올 거예요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: INFU · 주사센터
    deptColor: '#059669'
    brief: 외래 주사센터 첫날입니다. 주사센터 간호사 Denise가 맞아 줍니다. 이름을 밝히고, 환자를 어느 자리로 안내하는지, 주입 중 무엇을 지켜보는지 물어보세요. 별관
      3 3F 외래 주사센터입니다.
    difficulty: 1
