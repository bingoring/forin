      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Staff room is past the day room. Come on — bed nine is waiting to tell you about his garden.
      lineKo: 직원실은 데이룸 지나서예요. 갑시다, 9번 침대가 정원 얘기 하려고 기다려요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Patience is the whole job here.
      lineKo: 환영해요. 여기선 인내가 일의 전부예요.
      mood: warm
      missions:
      - 1
