      lineKo: 낮은 목소리, 낮은 조명, 이유 없이 인큐베이터에 손대지 않기. 우리가 하는 모든 게 아기 에너지를 씁니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Low voice, low light, and no hands without a reason. I'll keep that.
        why: 세 가지를 다 되짚었어요. 여기선 이게 처치의 일부입니다.
      - tier: strong
        text: Low voice and low light. Understood.
        why: 손대지 않는 부분이 빠졌어요.
      - tier: fair
        text: Okay, I'll be quiet.
        why: 조용함만으로는 나머지 둘이 남습니다.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers get wrong is talking about the baby in front of the parents as if they weren't
        there. They hear everything.
      lineKo: 신입이 틀리는 건 부모 앞에서 부모가 없는 것처럼 아기 얘기를 하는 거예요. 다 듣습니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I'll speak to the parents, not over them. What should I say when they ask me
          how she is?
        why: 실수를 확인하고, 부모가 반드시 하는 질문을 미리 물었어요.
      - tier: strong
        text: Understood. I'll include the parents.
        why: 맞아요. 부모가 물을 때가 남습니다.
      - tier: fair
        text: I'll try not to say anything wrong.
        why: 말을 아끼는 것과 부모를 대화에 넣는 것은 다릅니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me at the bedside, or step out and ask me. Never guess with a baby this size.
      lineKo: 침상에서 묻거나, 나와서 물어요. 이만한 아기에게 추측은 없습니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Everything goes in the locker, including your phone. Come on — I'll introduce you to her
        parents first.
      lineKo: 다 사물함에 넣어요, 휴대폰도. 갑시다, 부모님부터 소개할게요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to pod B.
      lineKo: B파드에 온 걸 환영해요.
      mood: warm
