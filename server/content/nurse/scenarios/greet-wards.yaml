      lineEn: Ask me while it's quiet.
      lineKo: 조용할 때 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Rosa. Rosa Iglesias. Charge nurse today.
      lineKo: Rosa예요. Rosa Iglesias. 오늘 책임간호사입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Rosa. When a delivery starts, where should I be?
        why: 분만이 시작되면 어디 서는지는 이 병동에서 첫날에 반드시 물을 질문입니다.
      - tier: strong
        text: Thank you, Rosa. What should I do during a delivery?
        why: 넓어요. '어디에'가 여기선 정확한 질문입니다.
      - tier: fair
        text: Nice to meet you, Rosa.
        why: 인사로 끝났어요. 위치는 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: When it starts, you stand at the head of the bed with the mother, not at the foot. Your
        job is her, not the delivery.
      lineKo: 시작되면 침대 발치가 아니라 머리맡, 산모 옆에 서세요. 당신 일은 분만이 아니라 산모입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: At the head of the bed, with her. So my job is the mother, not the delivery.
        why: 위치와 그 이유를 함께 되짚었어요. 이유를 말하면 다음 방에서도 지켜집니다.
      - tier: strong
        text: At the head of the bed. Understood.
        why: 위치는 맞아요. 왜 그런지가 남습니다.
      - tier: fair
        text: Okay, I'll stay out of the way.
        why: 비켜 있는 것과 산모 옆에 있는 것은 다릅니다.
