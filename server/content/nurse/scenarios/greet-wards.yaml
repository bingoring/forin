      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Ben. How do you introduce yourself to the kids?
        why: 이 병동의 핵심 기술을 물었어요. 아이에게 자기를 소개하는 방식이 다음 30분을 정합니다.
      - tier: strong
        text: Thank you, Ben. Should I talk to the children directly?
        why: 예/아니오로 끝나요. '어떻게'가 답을 데려옵니다.
      - tier: fair
        text: Nice to meet you, Ben.
