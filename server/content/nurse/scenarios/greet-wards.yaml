- id: SCN-GERI-00900
  eventId: EVT-GERI-00900
  title: 첫 인사 · 노인병동
  tagline: Speak slowly here, and face them. I'm Joseph.
  persona:
    name: Joseph Adeyemi
    role: nurse
    ageRange: 50s
    sub: Charge Nurse / Geri
    hair: '#5A5A5A'
    hairStyle: short
    personality: 느긋하고 유머가 있다. 환자 이름을 크게 부른다.
    speakingStyle: 천천히, 또박또박. 한 번 더 말해 준다.
    mood: warm
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 잘 안 들리는 환자와 말하는 방법을 묻기
  - 넘어짐 예방에서 무엇을 먼저 보는지 확인하기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse on this floor.
  - How should I talk to a patient who can't hear well?
  - What do you check first for fall risk?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Speak slowly here, and face them. I'm Joseph.
      lineKo: 여기선 천천히, 얼굴을 보고 말해요. 저는 Joseph예요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in this floor today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for this floor.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Have you nursed older patients before?
      lineKo: 환영해요. 노인 환자 간호해본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you take the four beds by the window with me. Three of them are confused in the afternoons.
      lineKo: 그럼 저랑 창가 네 침대예요. 셋은 오후만 되면 혼동이 옵니다.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me while it's still morning.
      lineKo: 아직 오전일 때 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Joseph Adeyemi. Joseph.
      lineKo: Joseph Adeyemi예요. Joseph.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Joseph. How should I talk to a patient who can't hear me well?
        why: 이 병동에서 매 환자마다 쓰는 기술을 물었어요.
      - tier: strong
        text: Thank you, Joseph. Should I speak louder?
        why: 예/아니오이고, 게다가 답이 '아니오'입니다. 열린 질문이 더 배웁니다.
      - tier: fair
        text: Nice to meet you, Joseph.
        why: 인사로 끝났어요. 대화법은 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Face them, one question at a time, and wait. Most of what looks like confusion here is a
        hearing aid that isn't in.
      lineKo: 얼굴을 보고, 질문은 하나씩, 그리고 기다려요. 여기서 혼동처럼 보이는 것 대부분은 보청기를 안 낀 겁니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Face them, one question at a time, and wait. I'll check the hearing aid too.
        why: 세 가지를 되짚고 보청기까지 챙겼어요. 여기선 그게 혼동의 절반입니다.
      - tier: strong
        text: One question at a time. Understood.
        why: 얼굴을 보는 것과 기다리는 것이 빠졌어요.
      - tier: fair
        text: Okay, I'll speak clearly.
        why: '''또렷하게''가 무엇인지가 바로 지금 배운 내용입니다.'
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: The mistake is raising your voice. Louder isn't clearer — slower and lower is.
      lineKo: 실수는 목소리를 높이는 거예요. 크다고 또렷해지지 않아요. 느리고 낮게 하는 겁니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — slower and lower, not louder. When should I report confusion to you?
        why: 실수를 확인하고 보고 기준을 물었어요. 노인병동에서 혼동은 신호입니다.
      - tier: strong
        text: Understood. I won't raise my voice.
        why: 맞아요. 보고 기준이 남습니다.
      - tier: fair
        text: I'll speak up so they can hear me.
        why: 방금 하지 말라고 한 그 방법이에요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Tell me. Falls we report immediately, confusion we report the same shift — and both go in
        the notes.
      lineKo: 저한테 말해요. 낙상은 즉시, 혼동은 같은 근무 안에 보고. 둘 다 기록에 남깁니다.
