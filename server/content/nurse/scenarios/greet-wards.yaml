  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Clinic starts at nine, and we take them in the order on the screen — not the order they
        arrived.
      lineKo: 진료는 9시 시작이고, 도착 순이 아니라 화면 순서대로 들어와요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Nine, and in the order on the screen. I'll check the screen, not the waiting room.
        why: 규칙을 되짚고 무엇을 보겠다고 말했어요.
      - tier: strong
        text: Nine o'clock. Understood.
        why: 순서 규칙이 빠졌어요.
      - tier: fair
        text: Okay, I'll be ready at nine.
        why: 준비만으로는 순서가 지켜지지 않아요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers do is let someone skip because they look upset. Tell me instead — I'll move
        them properly.
      lineKo: 신입이 하는 건 화난 것 같아서 순서를 바꿔주는 거예요. 대신 저한테 말해요. 제가 제대로 옮깁니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I'll tell you instead of moving anyone. Who do I tell if you're with a patient?
        why: 실수를 확인하고, 당신이 바쁠 때를 물었어요.
      - tier: strong
        text: Understood. I'll come to you.
        why: 맞아요. 당신이 환자와 있을 때가 남습니다.
      - tier: fair
        text: I won't let anyone skip.
        why: 막는 것과 알리는 것은 다릅니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Just come and tell me. If I'm in with a patient, write the name down and I'll see it on
        the screen.
      lineKo: 와서 말해요. 제가 환자와 있으면 이름을 적어두면 화면에서 보입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Bags go under the desk here. Come on — first one's already waiting.
      lineKo: 가방은 이 데스크 아래에 두세요. 갑시다, 첫 환자가 벌써 기다려요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to the clinic!
      lineKo: 외래에 온 걸 환영해요!
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: DERM · 진료실
    deptColor: '#DB2777'
    brief: 피부과 외래 첫날입니다. 외래간호사 Nina가 맞아 줍니다. 이름을 밝히고, 오늘 진료가 몇 시에 시작하는지, 환자를 어디로 안내하는지 물어보세요. 본관 2F 피부과
      센터입니다.
    difficulty: 1
    timeLabel: 약 3분
    skills:
    - 자기소개
    - 일정 확인
    - 안내 묻기
    rewards:
    - icon: ⭐
      label: 경험치
      value: + 80 XP
    - icon: ❤
      label: 동료 신뢰
      value: + 2
    - icon: 🎖
      label: 진척
      value: + 1
    reqs:
    - label: 레벨 1+
      metric: level
      threshold: 1
    tone: '#FCE7F3'
    accent: '#9D174D'
- id: SCN-WOMENKIDS-00900
  eventId: EVT-WOMENKIDS-00900
  title: 첫 인사 · 여성소아외래
  tagline: Two clinics share this floor, so let me show you which side is which.
  persona:
    name: Yvonne Carter
    role: nurse
    ageRange: 50s
    sub: Clinic Coordinator / W&K
    hair: '#5A5A5A'
    hairStyle: bob
    personality: 여러 가족을 동시에 챙긴다. 신입에게 관대하다.
    speakingStyle: 따뜻하고 분명하게. 요점을 반복해 준다.
    mood: warm
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 어느 진료를 맡는지 확인하기
  - 보호자를 부를 때의 호칭을 묻기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse — which clinic am I on today?
  - How do you call families in?
  - Should I say the child's name or the parent's?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Two clinics share this floor, so let me show you which side is which.
      lineKo: 이 층은 두 진료과가 같이 써요. 어느 쪽이 어딘지 알려줄게요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the clinic today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the clinic.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: You're the new nurse. Have you worked with families before, or only adults?
      lineKo: 새로 온 간호사죠. 가족을 상대해본 적 있어요, 아니면 성인만?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then start on the paediatric side with me. Obstetrics is quieter in the morning anyway.
      lineKo: 그럼 저랑 소아 쪽부터 시작해요. 산부인과는 어차피 오전엔 조용해요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me now — once the doors open there's no time.
      lineKo: 지금 물어요. 문 열리면 시간이 없어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Yvonne. Yvonne Carter. I run the front of both clinics.
      lineKo: Yvonne이에요. Yvonne Carter. 두 진료과 접수를 다 봅니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Yvonne. When I call a family in, should I use the child's name or the parent's?
        why: 이 외래에서 매번 부딪히는 것을 물었어요. 호명 방식은 아이가 자기를 어떻게 보는지까지 바꿉니다.
      - tier: strong
        text: Thank you, Yvonne. How do I call families in?
        why: 방법은 얻어요. '누구 이름으로'가 여기선 핵심입니다.
      - tier: fair
        text: Nice to meet you, Yvonne.
        why: 인사로 끝났어요. 지금이 물어볼 시간이라고 상대가 말했습니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Call the child's name, not the parent's, and then check the date of birth with the parent.
      lineKo: 아이 이름을 부르세요, 보호자 이름 말고. 그다음 보호자와 생년월일을 확인해요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: The child's name, then the date of birth with the parent. I'll check both.
        why: 두 단계를 되짚었어요. 본인 확인은 두 단계가 하나입니다.
      - tier: strong
        text: The child's name. Understood.
        why: 생년월일 확인이 빠졌어요.
      - tier: fair
        text: Okay, I'll call them in.
        why: 무엇으로 부를지가 안 남았어요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: New nurses call the parent in and the child follows. Do it the other way and the child knows
        they're the patient.
      lineKo: 신입은 보호자를 부르고 아이가 따라오게 해요. 반대로 하면 아이가 자기가 환자라는 걸 압니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — the child first, then the parent follows. Where do I stand when I call them?
        why: 실수를 확인하고 실제 동선을 물었어요.
      - tier: strong
        text: Understood. I'll call the child.
        why: 맞아요. 어디서 부르는지가 남습니다.
      - tier: fair
        text: I'll try to remember.
        why: 기억은 순서를 지켜주지 않아요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Come to the front desk and say the name out loud. I'm always here, and if I'm not, the other
        coordinator is.
      lineKo: 접수로 와서 이름을 소리 내 말해요. 저는 늘 여기 있고, 없으면 다른 코디네이터가 있어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Coats behind the desk. Come on, the first family is already here.
      lineKo: 겉옷은 데스크 뒤에. 갑시다, 첫 가족이 벌써 왔어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. It's loud, but it's a good floor.
      lineKo: 환영해요. 시끄럽지만 좋은 층이에요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: W&K · 외래 접수
    deptColor: '#EC4899'
    brief: 여성·소아 외래 첫날입니다. 외래를 총괄하는 Yvonne이 맞아 줍니다. 이름을 밝히고, 산부인과와 소아과 중 어디를 맡는지, 보호자를 어떻게 부르는지 물어보세요.
      별관 1 1F 소아청소년·산부인과 외래입니다.
    difficulty: 1
    timeLabel: 약 3분
    skills:
