  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Bags in the staff room, and take your badge off the lanyard if you're lifting. Come on —
        room one.
      lineKo: 가방은 직원실에, 아이 안을 거면 명찰 줄에서 명찰 빼세요. 갑시다, 1호실.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
