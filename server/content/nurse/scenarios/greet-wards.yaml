      lineKo: Ana예요. Ana Rivera. 이 창구를 봅니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Ana. How do I request supplies for the ward?
        why: 절차를 통째로 물었어요. 그래야 정규와 급한 것의 차이까지 옵니다.
      - tier: strong
        text: Thank you, Ana. Can I just come to this window?
