      lineEn: Sit down before you speak, and say less than you want to. Silence is not something you have
        to fill.
      lineKo: 말하기 전에 앉으세요. 하고 싶은 말보다 적게 하세요. 침묵은 채워야 하는 게 아닙니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Sit down first, and say less than I want to. I'll try to leave the silence alone.
        why: 두 가지를 되짚고 침묵까지 받았어요. 여기선 그게 기술입니다.
      - tier: strong
        text: I'll sit down before I speak.
        why: '''적게 말하기''가 빠졌어요.'
      - tier: fair
        text: Okay, I'll be gentle.
        why: 부드러움은 앉는 것도 침묵도 대신하지 않아요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: New nurses reach for something comforting to say. 'They're in a better place' takes the
        family's grief and answers it with a sentence.
      lineKo: 신입은 위로가 될 말을 찾아요. '좋은 곳으로 가셨어요'는 가족의 슬픔을 한 문장으로 덮어버립니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I won't reach for a comforting line. What can I say instead?
        why: 하지 말아야 할 것을 확인하고, 대신 무엇을 할지 물었어요. 이게 가장 어려운 부분입니다.
      - tier: strong
        text: Understood. I won't say that.
        why: 맞아요. 대신 무엇을 말할지가 남습니다.
      - tier: fair
        text: I'll try to comfort them properly.
        why: '''제대로 위로''가 바로 지적받은 그 충동입니다.'
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Come and find me. There is no question here that has to wait, and none that has to be asked
        in front of the family.
      lineKo: 저를 찾아오세요. 여기선 기다려야 할 질문도, 가족 앞에서 해야 할 질문도 없습니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: There's tea in the family room and you're allowed to use it. Come on, I'll take you to room
        two.
      lineKo: 가족실에 차가 있고 써도 돼요. 갑시다, 2호실로 갈게요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Be kind to yourself here too.
      lineKo: 환영해요. 여기선 자기 자신에게도 친절하세요.
      mood: warm
      missions:
      - 1
