- id: SCN-ONCO-00900
  eventId: EVT-ONCO-00900
  title: 첫 인사 · 종양내과
  tagline: Most of our patients have been coming here for years. I'm Sarah.
  persona:
    name: Sarah Feldman
    role: nurse
    ageRange: 40s
    sub: Oncology Nurse / Clinic 2
    hair: '#7A3B2E'
    hairStyle: bob
    personality: 환자를 오래 봐 왔다. 이름과 사정을 다 기억한다.
    speakingStyle: 부드럽지만 정확하다.
    mood: warm
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 오래 다니는 환자에게 처음 인사하는 방법을 묻기
  - 오늘 무엇을 맡는지 확인하기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse on this floor.
  - How should I greet a patient who's been coming for years?
  - What will I be doing today?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Most of our patients have been coming here for years. I'm Sarah.
      lineKo: 여기 환자 대부분은 몇 년째 다녀요. 저는 Sarah예요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the clinic today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the clinic.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Have you given chemotherapy before?
      lineKo: 환영해요. 항암 투여해본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you don't touch the drugs today. You sit with me and you learn the people first.
      lineKo: 그럼 오늘은 약에 손대지 않아요. 저랑 앉아서 사람부터 익힙니다.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me before the first one arrives.
      lineKo: 첫 환자 오기 전에 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Sarah Feldman. Sarah.
      lineKo: Sarah Feldman이에요. Sarah.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Sarah. How should I greet a patient who's been coming here for years?
        why: 이 병동에서 첫인사가 왜 어려운지를 정확히 물었어요.
      - tier: strong
        text: Thank you, Sarah. Should I introduce myself to them?
        why: 예/아니오예요. '어떻게'가 답을 데려옵니다.
      - tier: fair
        text: Nice to meet you, Sarah.
        why: 인사로 끝났어요. 여기선 인사법 자체가 배울 거리입니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Don't say 'nice to meet you' as if it's their first day. Say you're new, and ask them how
        long they've been coming.
      lineKo: '''처음 뵙겠습니다''처럼 말하지 마세요. 내가 새로 왔다고 말하고, 얼마나 다니셨는지 물어요.'
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: So I say I'm new and ask how long they've been coming. Not 'nice to meet you'.
        why: 말할 것과 말하지 않을 것을 둘 다 되짚었어요.
      - tier: strong
        text: I'll tell them I'm new.
        why: 물어볼 질문이 빠졌어요.
      - tier: fair
        text: Okay, I'll be warm with them.
        why: 따뜻함은 무엇을 말할지 정해주지 않아요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers do is speak to a long-term patient like a stranger. They've explained their
        diagnosis a hundred times — don't make it a hundred and one.
      lineKo: 신입은 오래 다닌 환자를 처음 보는 사람처럼 대해요. 그 사람은 자기 진단을 백 번 설명했어요. 백한 번째로 만들지 마세요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I won't make them explain it again. Where do I read their history instead?
        why: 실수를 확인하고, 대신 어디서 알아볼지 물었어요.
      - tier: strong
        text: Understood. I won't ask them to explain.
        why: 맞아요. 그럼 어디서 아는지가 남습니다.
      - tier: fair
        text: I'll ask them about their diagnosis carefully.
        why: 하지 말라고 한 그 일을 조심해서 하겠다고 답했어요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me, not the patient. I've known most of them longer than their oncologist has.
      lineKo: 환자 말고 저한테 물어요. 대부분 담당 종양내과의보다 제가 더 오래 알았어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Bags under the desk, and eat before clinic — you won't get a chance. Come on.
      lineKo: 가방은 데스크 아래, 진료 전에 먹어둬요. 기회 없어요. 갑시다.
      mood: neutral
      missions:
      - 1
