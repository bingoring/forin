- id: SCN-ICU-00900
  eventId: EVT-ICU-00900
  title: 첫 인사 · 중환자실
  tagline: You're with me today. Have you worked in an ICU before?
  persona:
    name: Andre Boateng
    role: nurse
    ageRange: 30s
    sub: Charge Nurse / ICU
    hair: '#1F2937'
    hairStyle: short
    personality: 차분하고 빠르다. 질문을 반갑게 받는다.
    speakingStyle: 핵심만. 되물어 확인하는 습관.
    mood: focused
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 경험 수준을 솔직히 말하기
  - 오늘 무엇을 맡는지 확인하기
  - 알람이 울렸을 때 누구를 부르는지 묻기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm new here — I haven't worked in an ICU before.
  - What will I be doing today?
  - If an alarm goes off, who do I call first?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: You're with me today. Have you worked in an ICU before?
      lineKo: 오늘 저랑 같이 다녀요. 중환자실 근무해본 적 있어요?
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the ICU today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the ICU.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Honest answer, good. Where were you before this?
      lineKo: 솔직해서 좋아요. 그전엔 어디 있었어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you'll take bed three with me — one patient, ventilated, and we do everything together
        today.
      lineKo: 그럼 저랑 3번 침대예요. 환자 한 명, 인공호흡기, 오늘은 전부 같이 합니다.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me anything now, while it's quiet.
      lineKo: 조용한 동안 뭐든 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Andre. Andre Boateng. I'm the charge nurse today.
      lineKo: Andre예요. Andre Boateng. 오늘 책임간호사입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Andre. If an alarm goes off while I'm alone with him, what do I do first?
        why: 가장 무서운 순간을 먼저 물었어요. 중환자실에서 이건 첫날에 반드시 물을 질문입니다.
      - tier: strong
        text: Thank you, Andre. What should I do about the alarms?
        why: 물음이 넓어요. '혼자 있을 때 먼저 무엇을'이 정확합니다.
      - tier: fair
        text: Nice to meet you, Andre.
        why: 인사로 끝났어요. 알람은 첫날 물어두는 게 안전합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Not every alarm is an emergency. Look at the patient first, then the monitor — the patient
        tells you which it is.
      lineKo: 모든 알람이 응급은 아니에요. 모니터보다 환자를 먼저 보세요. 어느 쪽인지는 환자가 알려줍니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: So the patient first, then the monitor. I'll look at him before I touch anything.
        why: 순서를 되짚고 행동으로 옮겼어요. 이 순서가 이 병동의 규칙입니다.
      - tier: strong
        text: Patient first. Understood.
        why: 확인은 됐어요. 무엇을 하겠다는 말이 남습니다.
      - tier: fair
        text: Okay, I won't panic.
        why: 침착함은 순서를 대신하지 않아요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers do is silence the alarm and then look. Never in that order.
      lineKo: 신입이 하는 건 알람을 끄고 나서 보는 거예요. 그 순서는 절대 안 됩니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — look, then silence. And if I can't tell what the alarm means, I'll call you.
        why: 실수를 확인하고, 판단이 안 될 때를 미리 정했어요.
      - tier: strong
        text: Understood. I'll look first.
        why: 맞아요. 판단이 안 될 때가 남습니다.
      - tier: fair
        text: I'll be careful with the alarms.
        why: '''조심''은 순서가 아니에요.'
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Call me by name across the unit — we don't use the bell for each other. If I'm in a room,
        the second nurse on the board comes.
      lineKo: 병동 안에서는 제 이름을 부르세요. 서로 벨은 안 씁니다. 제가 방에 있으면 게시판의 두 번째 간호사가 옵니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else before we start?
      lineKo: 좋아요. 시작 전에 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Put your bag in the break room, and keep your phone out of the rooms. Let's go and meet
        him.
      lineKo: 가방은 휴게실에, 휴대폰은 병실에 들고 들어가지 마세요. 가서 환자 봅시다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to the unit.
      lineKo: 병동에 온 걸 환영해요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: 중환자실
    deptColor: '#0891B2'
    brief: 중환자실 첫 근무입니다. 책임간호사 Andre가 오늘 당신을 데리고 다닙니다. 이름을 밝히고, 경험을 솔직하게 말하고, 알람이 울리면 어떻게 해야 하는지 물어보세요.
      본관 4F 중환자실입니다.
