- id: SCN-LOUNGE-00900
  eventId: EVT-LOUNGE-00900
  title: 첫 인사 · 휴게실
  tagline: You're new, right? Sit down — the coffee's terrible but free.
  persona:
    name: Jasmine Park
    role: nurse
    ageRange: 20s
    sub: RN / 8F
    hair: '#1F2937'
    hairStyle: long
    personality: 처음 보는 사람에게 먼저 말을 건다.
    speakingStyle: 편하게, 짧게. 농담을 섞는다.
    mood: happy
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름과 병동을 편한 말로 밝히기
  - 상대의 이름과 병동을 물어보기
  - 잡담을 한 번 이어 가기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I just started on 8F.
  - Sorry, what was your name?
  - How long have you worked here?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: You're new, right? Sit down — the coffee's terrible but it's free.
      lineKo: 새로 왔죠? 앉아요. 커피는 맛없지만 무료예요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the eighth floor today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the eighth floor.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: I'm on eight too. Nights or days?
      lineKo: 저도 8층이에요. 나이트예요, 데이예요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Days is the right way to start. Everyone learns the floor on days.
      lineKo: 데이로 시작하는 게 맞아요. 다들 데이에서 병동을 배워요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me anything — I've been here two years, I know where everything is.
      lineKo: 뭐든 물어요. 여기 2년 있었고 뭐가 어디 있는지 다 알아요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Jasmine. Jasmine Park. Everyone just says Jas.
      lineKo: Jasmine이에요. Jasmine Park. 다들 Jas라고 불러요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thanks, Jas. How long is the break — and does someone come to find you?
        why: 휴식 시간과 '누가 찾아오는지'를 함께 물었어요. 편한 대화에서도 정보는 정보입니다.
      - tier: strong
        text: Thanks, Jas. How long do we get for break?
        why: 시간은 얻었어요. 자리를 비우는 방법이 남습니다.
      - tier: fair
        text: Nice to meet you, Jas.
        why: 인사로 끝났어요. 잡담은 정보를 얻는 자리이기도 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Break's thirty minutes, and nobody comes to find you unless it's a code. Take the whole
        thirty.
      lineKo: 휴식은 30분이고, 코드 아니면 아무도 찾아오지 않아요. 30분 다 쓰세요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thirty minutes, and nobody comes unless it's a code. I'll take the whole thirty.
        why: 들은 걸 되짚고 그렇게 하겠다고 말했어요. 여기선 이게 자기 자신을 지키는 일입니다.
      - tier: strong
        text: Thirty minutes. Good to know.
        why: 확인은 됐어요. 다 쓰겠다는 말이 남습니다.
      - tier: fair
        text: I probably won't take all of it.
        why: 이 대화에서 상대가 말하려던 것과 반대로 답했어요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: New people eat at the desk and skip the break. Two months of that and you'll hate this job.
      lineKo: 새로 온 사람들은 데스크에서 먹고 휴식을 건너뛰어요. 두 달만 그러면 이 일이 싫어져요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: You're right, I do that. How do I tell people I'm going on break?
        why: 지적을 인정하고 실제 방법을 물었어요. 인정이 대화를 이어줍니다.
      - tier: strong
        text: I'll try to take my breaks.
        why: 맞는 방향이에요. 방법이 남습니다.
      - tier: fair
        text: I don't mind eating at the desk.
        why: 상대의 조언을 흘려보냈어요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Tell whoever's covering you, and put it on the board. That's all it takes.
      lineKo: 당신 대신 봐주는 사람에게 말하고, 보드에 적어요. 그게 전부예요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Right. Anything else you want to know?
      lineKo: 좋아요. 더 알고 싶은 거 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Kettle's behind you, mugs are anyone's. See you upstairs.
      lineKo: 주전자는 뒤에 있고 컵은 아무거나 써요. 위에서 봐요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Glad you're here. It's a good floor.
      lineKo: 와줘서 좋아요. 좋은 병동이에요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: LOUNGE · 휴게실
    deptColor: '#A16207'
    brief: 휴게실에서 처음 보는 동료 Jasmine이 먼저 말을 걸었습니다. 이름과 병동을 밝히고, 이름을 물어보고, 짧은 잡담을 이어 보세요. 임상 이야기가 아닙니다. 지원동
      2F 의료진 휴게실입니다.
    difficulty: 1
    timeLabel: 약 3분
    skills:
    - 편한 자기소개
    - 이름 묻기
    - 잡담 이어가기
    rewards:
    - icon: ⭐
      label: 경험치
      value: + 80 XP
    - icon: ❤
      label: 동료 신뢰
      value: + 2
    - icon: 🎖
      label: 진척
      value: + 1
    reqs:
    - label: 레벨 1+
      metric: level
      threshold: 1
    tone: '#FEF9C3'
    accent: '#854D0E'
