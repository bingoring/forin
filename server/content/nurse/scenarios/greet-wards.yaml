        text: Understood — the window is for urgent only. What do I say when something is urgent?
        why: 실수를 확인하고, 급할 때 정확히 무엇을 말하는지 물었어요.
      - tier: strong
        text: Understood. I'll use the system for routine.
        why: 맞아요. 급할 때 무엇을 말하는지가 남습니다.
      - tier: fair
        text: I'll try not to come down too often.
