      lineKo: 신입이 하는 건 아이 머리 위로 보호자에게만 설명하는 거예요. 한 번에 신뢰를 잃습니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — the child first, not over their head. What if the child won't talk to me?
        why: 실수를 확인하고, 실제로 자주 생기는 상황을 물었어요.
      - tier: strong
        text: Understood. I'll talk to the child too.
        why: 맞아요. 아이가 대답하지 않을 때가 남습니다.
      - tier: fair
        text: I'll explain things to the parents clearly.
        why: 지적받은 그 행동을 그대로 말했어요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me — I'm on this corridor all day. If I'm in a room, the play specialist knows where
        I am.
      lineKo: 저한테 물어요, 하루 종일 이 복도에 있어요. 방에 있으면 놀이치료사가 어디 있는지 알아요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
