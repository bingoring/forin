        text: Nine o'clock. Understood.
        why: 순서 규칙이 빠졌어요.
      - tier: fair
        text: Okay, I'll be ready at nine.
        why: 준비만으로는 순서가 지켜지지 않아요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers do is let someone skip because they look upset. Tell me instead — I'll move
        them properly.
      lineKo: 신입이 하는 건 화난 것 같아서 순서를 바꿔주는 거예요. 대신 저한테 말해요. 제가 제대로 옮깁니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I'll tell you instead of moving anyone. Who do I tell if you're with a patient?
        why: 실수를 확인하고, 당신이 바쁠 때를 물었어요.
      - tier: strong
        text: Understood. I'll come to you.
        why: 맞아요. 당신이 환자와 있을 때가 남습니다.
      - tier: fair
        text: I won't let anyone skip.
        why: 막는 것과 알리는 것은 다릅니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Just come and tell me. If I'm in with a patient, write the name down and I'll see it on
        the screen.
      lineKo: 와서 말해요. 제가 환자와 있으면 이름을 적어두면 화면에서 보입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
