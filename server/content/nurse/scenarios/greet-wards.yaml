- id: SCN-SPECIALTY-00900
  eventId: EVT-SPECIALTY-00900
  title: 첫 인사 · 특수외래
  tagline: Patients here often can't see you coming. Say your name first.
  persona:
    name: Laila Haddad
    role: nurse
    ageRange: 30s
    sub: Ophthalmic Nurse / Clinic 3
    hair: '#1F2937'
    hairStyle: long
    personality: 세심하다. 환자 시야를 늘 신경 쓴다.
    speakingStyle: 조용하고 친절하게.
    mood: warm
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 시야가 좁은 환자에게 다가가는 방법을 묻기
  - 오늘 무엇을 맡는지 확인하기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse in the clinic today.
  - How should I approach a patient who can't see well?
  - What will I be helping with?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Patients here often can't see you coming. Say your name first.
      lineKo: 여기 환자들은 당신이 다가오는 게 잘 안 보여요. 이름부터 말하세요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the clinic today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the clinic.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Have you worked in an eye clinic before?
      lineKo: 환영해요. 안과 외래 근무해본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you're roomng patients with me. Ten today, and half of them have drops in already.
      lineKo: 그럼 저랑 환자 안내해요. 오늘 열 명, 절반은 이미 산동제 넣었어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me now.
      lineKo: 지금 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Laila. Laila Haddad. Laila is fine.
      lineKo: Laila예요. Laila Haddad. Laila라고 불러요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Laila. How should I approach a patient who can't see me?
        why: 이 외래의 핵심 기술을 물었어요. 다가가는 방식이 곧 안전입니다.
      - tier: strong
        text: Thank you, Laila. Should I help them walk?
        why: 돕겠다는 마음은 좋아요. 여기선 '어떻게'가 정반대의 답을 줍니다.
      - tier: fair
        text: Nice to meet you, Laila.
        why: 인사로 끝났어요. 접근 방식은 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Say your name and where you are before you touch them, and offer your arm — don't take theirs.
      lineKo: 만지기 전에 이름과 당신이 어디 있는지 말하고, 당신 팔을 내미세요. 상대 팔을 잡지 말고요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Name, where I am, then offer my arm — not take theirs. I'll do that.
        why: 세 단계를 되짚었어요. 마지막 하나가 이 병동의 핵심입니다.
      - tier: strong
        text: I'll say my name first.
        why: 팔을 내미는 부분이 빠졌어요.
      - tier: fair
        text: Okay, I'll guide them carefully.
        why: '''안내''가 바로 조심해야 하는 그 행동입니다.'
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: New nurses take the patient's elbow to steer them. It's meant kindly and it takes away the
        one thing they still control.
      lineKo: 신입은 안내한다고 환자 팔꿈치를 잡아요. 친절한 뜻이지만, 그 사람이 아직 통제하는 하나를 뺏는 겁니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I offer, they take. What if someone can't manage the corridor at all?
        why: 실수를 확인하고, 그래도 안 될 때를 물었어요.
      - tier: strong
        text: Understood. I won't take their elbow.
        why: 맞아요. 정말 못 걸을 때가 남습니다.
      - tier: fair
        text: I'll hold them so they don't fall.
        why: 방금 하지 말라고 한 그 행동입니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Come and tell me. If drops are in, they can't read anything for hours — so anything written
        has to come through me or a family member.
      lineKo: 와서 말해요. 산동제가 들어갔으면 몇 시간은 아무것도 못 읽어요. 적힌 건 저나 가족을 통해야 합니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Keep the corridor clear — no bags, no chairs out of line. Come on, first one is in the waiting
        room.
      lineKo: 복도를 비워두세요. 가방도, 줄 밖으로 나온 의자도 안 돼요. 갑시다, 첫 환자가 대기실에 있어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to the clinic.
      lineKo: 외래에 온 걸 환영해요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: SPEC · CLINIC 3
    deptColor: '#7C3AED'
    brief: 특수 외래(안과) 첫날입니다. 외래간호사 Laila가 맞아 줍니다. 이름을 밝히고, 잘 보이지 않는 환자에게 다가갈 때 무엇을 먼저 해야 하는지 물어보세요. 별관
      3 2F 특수 외래입니다.
