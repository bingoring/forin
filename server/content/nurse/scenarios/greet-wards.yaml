  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Routine goes in the system before ten, and you get it that afternoon. Anything after ten
        is tomorrow — plan around it.
      lineKo: 정규 청구는 10시 전에 시스템에 넣으면 그날 오후에 갑니다. 10시 넘으면 내일이에요. 그걸 감안해서 계획하세요.
      mood: neutral
      missions:
