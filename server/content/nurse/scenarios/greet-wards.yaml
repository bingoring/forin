    - 사전 확인
    - 위치 확인
    rewards:
    - icon: ⭐
      label: 경험치
      value: + 80 XP
    - icon: ❤
      label: 동료 신뢰
      value: + 2
    - icon: 🎖
      label: 진척
      value: + 1
    reqs:
    - label: 레벨 1+
      metric: level
      threshold: 1
    tone: '#CCFBF1'
    accent: '#0F766E'
- id: SCN-MORGUE-00900
  eventId: EVT-MORGUE-00900
  title: 첫 인사 · 영안실
  tagline: Not many people come down here twice. I'm Samuel.
  persona:
    name: Samuel Novak
    role: nurse
    ageRange: 50s
    sub: Mortuary Technician
    hair: '#5A5A5A'
    hairStyle: short
    personality: 말이 적고 정중하다. 절차를 정확히 지킨다.
    speakingStyle: 낮고 느리게. 존중하는 말투.
    mood: neutral
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함·소속을 밝히고 용건을 말하기
  - 필요한 서류나 준비물을 확인하기
  - 유가족이 오면 어디서 맞이하는지 묻기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
