# 병동별 첫 인사 — 27개 부서, 한 부서에 하나.
#
# 인사가 ER(SCN-ORIENT-*)에만 있었다. 다른 병동은 첫 커리큘럼의 첫 스텝부터 임상
# 상황으로 시작했고, 처음 그 병동에 들어선 사람이 실제로 먼저 하는 일 — 이름을
# 말하고, 상대의 이름을 확인하고, 무엇을 해야 하는지 묻는 일 — 을 연습할 자리가
# 없었다.
#
# 손으로 쓴 콘텐츠다(gen-*.yaml은 cmd/gencontent 생성물이니 손대지 않는다). 한
# 파일에 목록으로 둔 이유는 이 27개가 하나의 authored 세트이기 때문이다 —
# "각 병동의 첫 인사"는 한자리에서 읽고 고치는 편이 맞다.
#
# 공통 규칙:
#  · difficulty 1, 레벨 게이트 1 — 어느 병동이든 첫 스텝이 레벨에 막히면 안 된다.
#  · 임상 지식을 요구하지 않는다. 이름·호칭·질문만으로 끝낼 수 있어야 한다.
#  · goals의 첫/마지막은 content.OpenGoal/CloseGoal("nurse")과 같은 문장이다.
#    (professional 그룹 — cmd/migrategoals가 검사하는 그 형태)

- id: SCN-PHARMA-00900
  eventId: EVT-PHARMA-00900
  title: 첫 인사 · 약제부
  tagline: You must be the new nurse. Which ward are you picking up for?
  persona:
    name: Daniel Osei
    role: pharmacist
    ageRange: 30s
    sub: Pharmacist / Central Pharmacy
    hair: '#1F2937'
    hairStyle: short
    personality: 정확한 것을 좋아하고, 물어보면 끝까지 설명해 준다.
    speakingStyle: 짧게 되묻고 확인한다. 약 이름은 또박또박.
    mood: neutral
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함·소속 병동을 영어로 말하기
  - 상대 약사의 이름과 호칭 확인하기
  - 픽업 절차를 어디서·누구에게 확인하면 되는지 묻기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - Hi, I'm the new nurse on 8F.
  - Sorry, could you say your name again?
  - Who should I ask when I'm not sure about a pickup?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: You must be the new nurse. Which ward are you picking up for?
      lineKo: 새로 온 간호사죠? 어느 병동 약 받으러 왔어요?
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the pharmacy today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the pharmacy.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Eight — that's a busy floor. Have you picked up from a central pharmacy before?
      lineKo: 8층이면 바쁜 곳이네요. 중앙약제부에서 약 받아본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then start here at the window, not at the door. I'll hand you the tray and the list together.
      lineKo: 그럼 문이 아니라 이 창구로 오세요. 트레이랑 목록을 같이 드릴게요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Anything you want to ask before I start pulling for eight?
      lineKo: 8층 것 꺼내기 전에 물어볼 거 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Daniel. Daniel Osei. Everyone here just says Daniel.
      lineKo: Daniel이에요. Daniel Osei. 여기선 다 그냥 Daniel이라고 불러요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Daniel. Can I ask — what do I need to bring when I pick up a controlled drug?
        why: 이름을 부르고, 이 부서에서 가장 중요한 절차를 먼저 물었어요.
      - tier: strong
        text: Thank you, Daniel. Is there anything I should bring with me?
        why: 물어본 건 좋지만 범위가 넓어요. 구체적으로 물으면 답도 구체적입니다.
      - tier: fair
        text: Nice to meet you, Daniel.
        why: 인사로 끝났어요. 여기서 한 가지를 물어두면 다음번이 훨씬 쉬워집니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Two nurses, always, and both of you sign. If a controlled drug is on the list, don't take
        it alone.
      lineKo: 간호사 두 명, 항상. 둘 다 서명해요. 마약류가 목록에 있으면 혼자 가져가지 마세요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: So two nurses, and we both sign. I'll bring someone with me.
        why: 규칙을 되짚고 무엇을 할지 말했어요. 지시가 행동으로 이어집니다.
      - tier: strong
        text: Two nurses. Understood.
        why: 확인은 했지만 다음 행동이 없어요.
      - tier: fair
        text: Okay, I'll be careful.
        why: '''조심하겠다''는 규칙을 확인해주지 않아요.'
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: The mistake I see most is signing before counting. Count in front of me, then sign.
      lineKo: 제일 많이 보는 실수는 세기 전에 서명하는 거예요. 제 앞에서 세고, 그다음 서명하세요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — count first, then sign. What should I do if the count doesn't match?
        why: 실수를 확인하고, 그 실수가 실제로 벌어졌을 때를 물었어요.
      - tier: strong
        text: Understood. I'll count first.
        why: 맞는 답이에요. 어긋났을 때가 남습니다.
      - tier: fair
        text: I won't do that.
        why: 다짐만 남고 절차가 남지 않았어요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me. If I'm not at the window, the pharmacist on call is on the board — and page the
        charge nurse before you guess.
      lineKo: 저한테 물어요. 창구에 없으면 당직 약사가 게시판에 있어요. 그리고 추측하기 전에 책임간호사 호출하세요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Lockers are behind you, on the left. Right — let's get eight's tray.
      lineKo: 사물함은 뒤쪽 왼편이에요. 자, 8층 트레이 갑시다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to the hospital. You'll be down here often.
      lineKo: 병원에 온 걸 환영해요. 여기 자주 내려올 거예요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: PHARMA · 픽업 카운터
    deptColor: '#16A34A'
    brief: 약제부에 처음 내려왔습니다. 카운터의 약사 Daniel에게 이름과 소속 병동을 밝히고, 앞으로 무엇을 어떻게 받아 가면 되는지 물어보세요. 약 이름을 말할 일은 아직
      없습니다. 본관 P1 중앙 약제부입니다.
    difficulty: 1
    timeLabel: 약 3분
    skills:
    - 자기소개
    - 이름 확인
    - 절차 묻기
    rewards:
    - icon: ⭐
      label: 경험치
      value: + 80 XP
    - icon: ❤
      label: 동료 신뢰
      value: + 2
    - icon: 🎖
      label: 진척
      value: + 1
    reqs:
    - label: 레벨 1+
      metric: level
      threshold: 1
    tone: '#DCFCE7'
    accent: '#16A34A'
- id: SCN-OR-00900
  eventId: EVT-OR-00900
  title: 첫 인사 · 수술실
  tagline: First day in the OR? Don't touch anything blue just yet.
  persona:
    name: Marta Lindqvist
    role: nurse
    ageRange: 40s
    sub: Circulating Nurse / OR 2
    hair: '#C2A878'
    hairStyle: bob
    personality: 규칙에 엄격하지만 신입에게는 먼저 알려주는 편.
    speakingStyle: 지시를 먼저, 이유를 뒤에. 문장이 짧다.
    mood: warm
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 오늘 배정 확인하기
  - 어디에 서 있어야 하는지 묻기
  - 만지면 안 되는 것을 하나 확인하기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse — it's my first day in the OR.
  - Where should I stand during the case?
  - What shouldn't I touch?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: First day in the OR? Don't touch anything blue just yet.
      lineKo: 수술실 첫날이에요? 파란 건 아직 아무것도 만지지 마세요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the OR today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the OR.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Have you circulated before, or is this all new?
      lineKo: 좋아요. 순회 해본 적 있어요, 아니면 다 처음이에요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you're with me on room two all morning. Stand where you can see the door and the back
        table.
      lineKo: 그럼 오전엔 저랑 2번 방이에요. 문이랑 백테이블이 보이는 자리에 서세요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Questions before we open?
      lineKo: 시작 전에 물어볼 거 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Marta. Marta Lindqvist. Just Marta in the room.
      lineKo: Marta예요. Marta Lindqvist. 방 안에선 그냥 Marta.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Marta. Before we start — what shouldn't I touch in the room?
        why: 이름을 부르고, 이 방에서 가장 중요한 금기를 먼저 물었어요.
      - tier: strong
        text: Thank you, Marta. Is there anything I should be careful about?
        why: 물음이 넓어요. '무엇을 만지면 안 되나'가 여기선 정확한 질문입니다.
      - tier: fair
        text: Nice to meet you, Marta.
        why: 인사로 끝났어요. 수술실에서는 금기를 먼저 확인하는 게 안전합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Anything draped in blue is sterile. If you're not sure whether you touched it, you touched
        it — say so.
      lineKo: 파란 천이 덮인 건 다 멸균이에요. 만졌는지 확실치 않으면 만진 거예요. 말하세요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: So blue means sterile, and if I'm unsure I say I touched it. I'll say it.
        why: 규칙을 되짚고 말하겠다고 약속했어요. 이 병동에서 가장 중요한 약속입니다.
      - tier: strong
        text: Blue is sterile. Understood.
        why: 절반이에요. '확실치 않으면 말한다'가 규칙의 핵심입니다.
      - tier: fair
        text: I'll stay away from the blue.
        why: 피하는 건 방법이지만, 깨졌을 때 말하는 것이 규칙입니다.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers get wrong is staying quiet about a break in sterility. Nobody is ever angry
        that you said it.
      lineKo: 신입이 틀리는 건 멸균이 깨진 걸 말하지 않는 거예요. 말했다고 화내는 사람은 없어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood. If I break sterility, who do I tell — you, or the scrub nurse?
        why: 누구에게 말하는지가 실제로 필요한 정보예요.
      - tier: strong
        text: Understood. I'll speak up.
        why: 맞아요. 누구에게인지가 남습니다.
      - tier: fair
        text: I'll try not to.
        why: 노력은 절차가 아니에요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Say it out loud to me. If I'm scrubbed, tell the scrub nurse — and the surgeon hears it
        either way.
      lineKo: 저한테 크게 말하세요. 제가 손 씻고 들어가 있으면 스크럽 간호사에게. 어차피 집도의도 듣게 됩니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Right. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Bags go in the sub-sterile room, not the corridor. Gown up — we're on in ten.
      lineKo: 가방은 복도가 아니라 준비실에 두세요. 가운 입어요, 10분 뒤 시작입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to room two.
      lineKo: 2번 방에 온 걸 환영해요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: 수술실
    deptColor: '#9333EA'
    brief: 수술실에 처음 들어왔습니다. 순회간호사 Marta가 맞아 줍니다. 이름과 직함을 말하고, 오늘 어디에 서 있어야 하는지, 만지면 안 되는 것이 무엇인지 물어보세요.
      본관 3F 수술실입니다.
