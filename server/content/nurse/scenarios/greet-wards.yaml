  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Same patients, same chairs, three times a week. I'm Victor.
      lineKo: 같은 환자, 같은 자리, 주 3회예요. 저는 Victor예요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
