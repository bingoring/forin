      lineEn: What new nurses do is come to the window for everything. Then the window is full of routine
        and the urgent one waits behind it.
      lineKo: 신입은 뭐든 창구로 와요. 그러면 창구가 정규 청구로 막히고, 급한 게 뒤에서 기다립니다.
