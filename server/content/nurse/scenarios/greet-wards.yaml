    - 호칭 묻기
    rewards:
    - icon: ⭐
      label: 경험치
      value: + 80 XP
    - icon: ❤
      label: 동료 신뢰
      value: + 2
    - icon: 🎖
      label: 진척
      value: + 1
    reqs:
    - label: 레벨 1+
      metric: level
      threshold: 1
