  keyPhrases:
  - I'm the new nurse from 8F.
  - What do I need to bring with me?
  - Where do families wait?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Not many people come down here twice. I'm Samuel.
      lineKo: 여기 두 번 오는 사람은 많지 않아요. 저는 Samuel이에요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the mortuary today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the mortuary.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: You're from a ward, then. Have you brought a patient down before?
      lineKo: 병동에서 오셨군요. 환자 모시고 내려와본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then I'll walk you through it once, properly, so the first time isn't the day it happens.
      lineKo: 그럼 한 번 제대로 알려줄게요. 실제로 그날이 첫 경험이 되지 않게요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me anything. People are usually too uncomfortable to.
      lineKo: 뭐든 물어요. 대개는 불편해서 안 묻더군요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Samuel Novak. Samuel.
      lineKo: Samuel Novak이에요. Samuel.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Samuel. What do I need to bring with me when I come down?
        why: 실무를 먼저 물었어요. 이 자리에서 준비물을 모르면 가족이 기다립니다.
      - tier: strong
        text: Thank you, Samuel. Is there paperwork?
        why: 서류는 걸렸지만 밴드가 남습니다.
      - tier: fair
        text: Nice to meet you, Samuel.
        why: 인사로 끝났어요. 물어봐도 된다고 상대가 먼저 말했습니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Bring the notification form and the identity band — both, every time. The band stays on
        until the family has seen them.
      lineKo: 통지서와 신원 밴드를 가져오세요. 매번 둘 다요. 밴드는 가족이 볼 때까지 그대로 둡니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: The notification form and the identity band, both, and the band stays on. Understood.
        why: 두 가지와 '떼지 않는다'까지 되짚었어요. 뒤의 하나가 실제 문제입니다.
      - tier: strong
        text: The form and the band. Understood.
        why: 밴드를 그대로 둔다는 부분이 빠졌어요.
      - tier: fair
        text: Okay, I'll bring the paperwork.
        why: 밴드가 빠졌고, 그게 신원 확인의 전부입니다.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What goes wrong is the band coming off on the ward 'to tidy them up'. Then nobody can confirm
        who this is, and the family waits.
      lineKo: 잘못되는 건 '정리한다고' 병동에서 밴드를 떼는 거예요. 그러면 누구인지 확인할 사람이 없고 가족이 기다립니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — the band stays on. Where do families wait when they come down?
        why: 실수를 확인하고, 가족을 어디서 맞는지 물었어요. 그 자리에서 즉흥으로 정할 일이 아닙니다.
      - tier: strong
        text: Understood. I won't remove the band.
        why: 맞아요. 가족을 어디로 안내하는지가 남습니다.
      - tier: fair
        text: I'll make sure they look presentable.
        why: 그 마음이 바로 밴드를 떼게 만드는 이유입니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Call down before you come. I'll meet you at the lift, and the family goes to the viewing
        room, never the corridor.
      lineKo: 내려오기 전에 전화해요. 엘리베이터에서 맞을게요. 가족은 복도가 아니라 참관실로 갑니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: There's a chair in the office if you need a minute after. People do. Come on, I'll show
        you the book.
      lineKo: 끝나고 잠깐 앉고 싶으면 사무실에 의자 있어요. 다들 그래요. 갑시다, 장부 보여줄게요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. You'll be all right.
      lineKo: 환영해요. 괜찮을 거예요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
