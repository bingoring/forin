      - 2
      - 3
      choices:
      - tier: best
        text: In the system before ten for the same day. After ten it's tomorrow — I'll plan for that.
        why: 마감 시각과 그 결과를 되짚었어요. 이 부서에서 시간은 곧 재고입니다.
      - tier: strong
        text: Before ten in the system. Understood.
        why: 10시 이후가 어떻게 되는지가 빠졌어요.
      - tier: fair
        text: Okay, I'll use the system.
        why: 시각이 안 남았고, 여기선 그게 전부입니다.
