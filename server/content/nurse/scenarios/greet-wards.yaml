    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you're with me all shift. We have nine babies and two of them go home today.
      lineKo: 그럼 근무 내내 저랑 있어요. 아기 아홉이고 오늘 둘이 퇴원해요.
      mood: neutral
      missions:
