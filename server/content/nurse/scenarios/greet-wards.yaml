- id: SCN-PICU-00900
  eventId: EVT-PICU-00900
  title: 첫 인사 · 소아중환자실
  tagline: Families live in this unit. That changes how you talk. I'm Marcus.
  persona:
    name: Marcus Bell
    role: nurse
    ageRange: 30s
    sub: Charge Nurse / PICU
    hair: '#1F2937'
    hairStyle: short
    personality: 솔직하고 담담하다. 신입에게 먼저 상황을 설명한다.
    speakingStyle: 담담하게. 어려운 말은 풀어 준다.
    mood: neutral
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 가족이 상주할 때의 원칙을 하나 확인하기
  - 모르는 것을 물어볼 사람을 확인하기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse, starting in the PICU today.
  - How should I talk when the family is in the room?
  - Who do I ask when I'm not sure?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Families live in this unit. That changes how you talk. I'm Marcus.
      lineKo: 여기선 가족이 병실에서 지내요. 그래서 말하는 법이 달라집니다. 저는 Marcus예요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in the PICU today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the PICU.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good to meet you. Have you worked with critically ill children?
      lineKo: 반가워요. 중증 아이를 본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you're with me on bed one. Ventilated, sedated, and his mother sleeps in the chair
        beside him.
      lineKo: 그럼 저랑 1번 침대예요. 인공호흡기, 진정 중이고, 어머니가 옆 의자에서 잡니다.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me before we go in.
      lineKo: 들어가기 전에 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Marcus Bell. Marcus.
      lineKo: Marcus Bell이에요. Marcus.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Marcus. How should I talk when the family is in the room?
        why: 이 병동의 핵심을 물었어요. 가족이 상주하는 곳에서 말하는 법은 처치만큼 중요합니다.
      - tier: strong
        text: Thank you, Marcus. Should I talk to the parents?
        why: 예/아니오예요. '어떻게'가 여기선 답을 데려옵니다.
      - tier: fair
        text: Nice to meet you, Marcus.
        why: 인사로 끝났어요. 가족 앞에서의 말은 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Say hello to the parent first, then the child, then look at the monitor. In that order,
        every time you enter.
      lineKo: 보호자에게 먼저 인사, 그다음 아이, 그다음 모니터. 들어갈 때마다 그 순서로.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Parent, then child, then the monitor — every time I go in. I'll keep that order.
        why: 순서를 되짚고 매번이라고 말했어요. 이 순서가 이 병동의 태도입니다.
      - tier: strong
        text: Parent first. Understood.
        why: 나머지 두 단계가 빠졌어요.
      - tier: fair
        text: Okay, I'll greet the family.
        why: 인사만으로는 모니터를 먼저 보는 습관이 안 바뀝니다.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: New nurses walk in and look at the numbers first. The mother watches you do it and reads
        it as bad news.
      lineKo: 신입은 들어가서 숫자부터 봐요. 어머니는 그걸 보고 나쁜 소식으로 읽습니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — not the numbers first. If I do see something concerning, how do I tell you?
        why: 실수를 확인하고, 나쁜 걸 봤을 때를 물었어요. 가족 앞에서는 이게 어렵습니다.
      - tier: strong
        text: Understood. I won't look at the monitor first.
        why: 맞아요. 이상을 봤을 때가 남습니다.
      - tier: fair
        text: I'll be careful what I say.
        why: 조심은 방법이 아니에요.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me in the room — we don't take conversations outside unless the parent asks. If I'm
        not here, the charge nurse is at the desk.
      lineKo: 방 안에서 물어요. 보호자가 원하지 않는 한 대화를 밖으로 안 뺍니다. 제가 없으면 책임간호사가 데스크에 있어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: There's a family kitchen you can use, but not the family bathroom. Come on — I'll introduce
        you to his mum.
      lineKo: 가족용 주방은 써도 되고 가족 화장실은 안 돼요. 갑시다, 어머니께 소개할게요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to the unit.
      lineKo: 병동에 온 걸 환영해요.
      mood: warm
      missions:
      - 1
