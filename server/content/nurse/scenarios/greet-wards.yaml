        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for the dialysis unit.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Have you worked with dialysis patients before?
      lineKo: 환영해요. 투석 환자 본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you're on station three with me. Four hours a session — you'll get to know them.
      lineKo: 그럼 저랑 3번 스테이션이에요. 한 세션 4시간이니 곧 알게 될 거예요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me before we start the first run.
      lineKo: 첫 세션 시작 전에 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Victor Cruz. Victor.
      lineKo: Victor Cruz예요. Victor.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Victor. Is there anything I should never do with a fistula arm?
        why: 이 부서에서 절대 하면 안 되는 것을 먼저 물었어요. 누공은 환자의 생명선입니다.
      - tier: strong
        text: Thank you, Victor. What should I know about the fistula?
        why: 좋은 방향이에요. '절대 안 되는 것'이 더 빨리 안전에 닿습니다.
      - tier: fair
        text: Nice to meet you, Victor.
        why: 인사로 끝났어요. 금기는 첫날에 확인해야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Never take a blood pressure on the fistula arm, and never let anyone else either. Put a
        sign on the chair if you have to.
      lineKo: 누공 있는 팔에서는 혈압을 재지 마세요. 다른 사람도 못 하게 하고요. 필요하면 의자에 표시를 붙여요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: No blood pressure on that arm, and I stop anyone else too. I'll put a sign up.
        why: 금기를 되짚고 다른 사람까지 막겠다고 했어요. 여기선 그게 실제 위험입니다.
      - tier: strong
        text: No blood pressure on the fistula arm. Understood.
        why: '''다른 사람도 못 하게''가 빠졌어요. 실수는 대개 남이 합니다.'
      - tier: fair
        text: Okay, I'll be careful with that arm.
        why: '''조심''은 혈압계를 막지 못해요.'
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers do is greet them like new patients every week. They've been coming for six
        years — ask about their weekend, not their diagnosis.
      lineKo: 신입은 매주 처음 온 환자처럼 인사해요. 6년째 다니는 분들이에요. 진단 말고 주말 얘기를 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — ask about their weekend, not their diagnosis. What if the machine alarms?
        why: 인사법을 확인하고, 이 부서에서 가장 자주 겪을 일을 물었어요.
      - tier: strong
        text: Understood. I'll talk to them like regulars.
        why: 맞아요. 기계 알람이 남습니다.
      - tier: fair
        text: I'll ask them how their treatment is going.
        why: 그게 바로 백 번째로 설명하게 만드는 질문입니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Call me by name across the unit. If the machine alarms and I'm at another chair, don't reset
        it — wait for me.
      lineKo: 병동 안에서 제 이름을 부르세요. 기계가 울리는데 제가 다른 의자에 있으면, 리셋하지 말고 기다려요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Lockers by the door, and bring something to drink — four hours is long for us too. Come
        on.
      lineKo: 사물함은 문 옆이고, 마실 것 챙겨요. 4시간은 우리한테도 깁니다. 갑시다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome to station three.
      lineKo: 3번 스테이션에 온 걸 환영해요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: DIAL · STATION 3
    deptColor: '#2563EB'
    brief: 인공신장실 첫날입니다. 투석실 간호사 Victor가 맞아 줍니다. 이름을 밝히고, 같은 환자가 반복해 오는 이곳에서 첫인사를 어떻게 하는지, 기계 알람이 울리면 누구를
      부르는지 물어보세요. 별관 3 3F 인공신장실입니다.
    difficulty: 1
    timeLabel: 약 3분
    skills:
    - 자기소개
    - 단골 환자 인사
    - 보고 경로
    rewards:
    - icon: ⭐
      label: 경험치
      value: + 80 XP
    - icon: ❤
      label: 동료 신뢰
      value: + 2
    - icon: 🎖
      label: 진척
      value: + 1
    reqs:
    - label: 레벨 1+
      metric: level
      threshold: 1
    tone: '#DBEAFE'
    accent: '#1D4ED8'
- id: SCN-ENDO-00900
  eventId: EVT-ENDO-00900
  title: 첫 인사 · 내시경실
  tagline: Everything here happens in order. I'm Fiona — what's your name?
  persona:
    name: Fiona Walsh
    role: nurse
    ageRange: 30s
    sub: Endoscopy Nurse / Pre
    hair: '#C2A878'
    hairStyle: long
    personality: 확인을 두 번 한다. 신입에게 순서를 적어 준다.
    speakingStyle: 순서를 세어 가며 말한다.
    mood: focused
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 시술 전 첫 확인 항목을 묻기
  - 오늘 어디에 있어야 하는지 확인하기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse — my first day in endoscopy.
  - What do you check first before a procedure?
  - Where should I be today?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Everything here happens in order. I'm Fiona — what's your name?
      lineKo: 여긴 전부 순서대로 돌아가요. 저는 Fiona예요. 이름이 뭐예요?
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in endoscopy today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for endoscopy.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Have you looked after a sedated patient before?
      lineKo: 환영해요. 진정 중인 환자 본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you're in pre-op with me this morning, and in recovery after lunch. Same patients,
        both ends.
      lineKo: 그럼 오전엔 저랑 준비실, 점심 후엔 회복실이에요. 같은 환자를 양쪽에서 봅니다.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me before the list starts.
      lineKo: 리스트 시작 전에 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Fiona Walsh. Fiona.
      lineKo: Fiona Walsh예요. Fiona.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Fiona. What do you check before a procedure?
        why: 이 부서는 순서가 전부입니다. 확인 항목을 통째로 받는 게 맞습니다.
      - tier: strong
        text: Thank you, Fiona. Should I check their consent form?
        why: 하나만 물었어요. 목록 전체를 물으면 나머지 넷이 같이 옵니다.
      - tier: fair
        text: Nice to meet you, Fiona.
        why: 인사로 끝났어요. 확인 목록은 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: 'Before every procedure: name, date of birth, procedure, consent, and when they last ate.
        All five, out loud, with the patient.'
      lineKo: 시술 전마다 이름, 생년월일, 시술명, 동의서, 마지막 식사 시각. 다섯 개를 환자와 함께 소리 내어 확인해요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Name, date of birth, procedure, consent, last meal — out loud with the patient. Understood.
        why: 다섯 항목을 다 되짚고 '환자와 함께'까지 넣었어요. 그게 이 확인의 핵심입니다.
      - tier: strong
        text: Name, date of birth and consent. Understood.
        why: 두 개가 빠졌고, 빠진 것 중 하나가 진정을 못 하게 만드는 항목입니다.
      - tier: fair
        text: Okay, I'll go through the checklist.
        why: 무엇이 목록에 있는지가 안 남았어요.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What newcomers skip is the last meal. Someone who ate at six this morning cannot be sedated,
        and they will not volunteer it.
      lineKo: 신입이 건너뛰는 건 마지막 식사예요. 아침 6시에 먹은 사람은 진정 못 합니다. 그리고 먼저 말해주지 않아요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I always ask when they last ate. What if they've eaten this morning?
        why: 가장 자주 빠지는 항목을 확인하고, 실제로 걸렸을 때를 물었어요.
      - tier: strong
        text: Understood. I'll ask about the last meal.
        why: 맞아요. 먹었다고 하면 어떻게 하는지가 남습니다.
      - tier: fair
        text: I'll check the form carefully.
        why: 서류에 없는 걸 묻는 게 이 항목의 이유입니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Tell me before they go through the door. After that it's the endoscopist's call, and stopping
        it costs the whole list.
      lineKo: 문 통과하기 전에 저한테 말하세요. 그 뒤엔 내시경의가 판단하고, 멈추면 리스트 전체가 밀립니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Scrubs are in the changing room, take a size up. Come on — first one is in bay two.
      lineKo: 수술복은 탈의실에 있고, 한 치수 크게 가져가요. 갑시다, 첫 환자가 2번 베이에 있어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Order, always.
      lineKo: 환영해요. 언제나 순서대로.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
  briefing:
    dept: ENDO · 준비실
    deptColor: '#0D9488'
    brief: 내시경실 첫날입니다. 준비실에서 간호사 Fiona가 맞아 줍니다. 이름을 밝히고, 시술 전에 환자에게 무엇을 먼저 확인하는지 물어보세요. 별관 3 4F 내시경실입니다.
    difficulty: 1
    timeLabel: 약 3분
    skills:
