      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Karen. What are we practising today?
        why: 무엇을 배우는지 먼저 물었어요. 시뮬레이션은 목표를 알고 들어가야 남습니다.
      - tier: strong
        text: Thank you, Karen. How long does it take?
        why: 시간은 알게 되지만 무엇을 하는지가 남습니다.
      - tier: fair
        text: Nice to meet you, Karen.
        why: 인사로 끝났어요. 오늘의 목표는 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Say what you're doing out loud, even when it feels strange. The debrief works from what
        you said, not from what you meant.
      lineKo: 하는 걸 소리 내어 말하세요, 어색해도요. 디브리핑은 당신이 의도한 게 아니라 말한 것에서 시작합니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: So I say what I'm doing out loud, even if it feels strange. I'll try.
        why: 방법과 그게 어색하다는 것까지 받았어요. 여기선 그 어색함이 훈련의 일부입니다.
      - tier: strong
        text: I'll talk through what I'm doing.
        why: 맞아요. 어색해도 한다는 부분이 실제로 어려운 곳입니다.
      - tier: fair
        text: Okay, I'll do my best.
        why: '''최선''은 소리 내어 말하는 것과 다릅니다.'
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What people do is go quiet when they're unsure. Then we can't tell whether you didn't know
        or didn't say — and those need different help.
      lineKo: 사람들은 확신이 없으면 조용해져요. 그러면 몰랐던 건지 말을 안 한 건지 알 수 없고, 그 둘은 도움이 다릅니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — going quiet hides which help I need. What do I say if I'm stuck?
        why: 왜 조용해지면 안 되는지를 짚고, 막혔을 때의 문장을 물었어요.
      - tier: strong
        text: Understood. I'll try to keep talking.
        why: 맞아요. 막혔을 때 무엇을 말할지가 남습니다.
      - tier: fair
        text: I'll try not to make mistakes.
        why: 여긴 틀리라고 있는 방입니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Say 'I don't know what to do next' in the room. That is a legitimate move here, and it's
        the one I'm hoping to hear.
      lineKo: 방 안에서 'I don't know what to do next'라고 말하세요. 여기선 그게 정당한 수고, 제가 듣고 싶은 말입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Phones off, and nothing leaves this room — not the scenario, not what anyone did. Come on,
        let's start.
      lineKo: 휴대폰 끄고, 이 방에서 나가는 건 없어요. 시나리오도, 누가 뭘 했는지도. 갑시다, 시작해요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. Be wrong here, not upstairs.
      lineKo: 환영해요. 위층 말고 여기서 틀리세요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
