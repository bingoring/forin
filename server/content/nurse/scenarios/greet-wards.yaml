    payload:
      speaker: npc
      lineEn: Clinic starts at nine, and we take them in the order on the screen — not the order they
        arrived.
      lineKo: 진료는 9시 시작이고, 도착 순이 아니라 화면 순서대로 들어와요.
      mood: neutral
      missions:
