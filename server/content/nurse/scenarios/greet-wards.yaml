      - tier: strong
        text: Understood. I'll stay at the head of the bed.
        why: 맞아요. 말해주는 부분이 남습니다.
      - tier: fair
        text: I'll watch from where you tell me.
        why: 보는 게 아니라 곁에 있는 게 일입니다.
