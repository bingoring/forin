- id: SCN-ORTHOWARD-00900
  eventId: EVT-ORTHOWARD-00900
  title: 첫 인사 · 정형외과병동
  tagline: Everyone here is either waiting for surgery or learning to walk again.
  persona:
    name: Sofia Duarte
    role: nurse
    ageRange: 30s
    sub: Senior Nurse / 6F
    hair: '#3B2A1A'
    hairStyle: bob
    personality: 농담을 섞지만 안전 문제에는 단호하다.
    speakingStyle: 예를 들어 설명한다.
    mood: warm
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 환자를 일으킬 때의 원칙을 하나 확인하기
  - 도움이 필요할 때 부르는 방법을 묻기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - It's my first day on this floor.
  - Can I get a patient up by myself?
  - How do I call for help with a transfer?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: Everyone here is either waiting for surgery or learning to walk again.
      lineKo: 여기 사람들은 수술을 기다리거나, 다시 걷는 법을 배우는 중이에요.
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in this floor today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for this floor.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: I'm told you're new. Have you moved a patient with a fractured hip before?
      lineKo: 새로 왔다고 들었어요. 고관절 골절 환자 옮겨본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then you're not doing it alone today. Follow me and watch how many hands it takes.
      lineKo: 그럼 오늘은 혼자 안 해요. 따라오면서 손이 몇 개 필요한지 보세요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me now, before the physio round starts.
      lineKo: 물리치료 라운드 시작 전에 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Sofia. Sofia Duarte. Senior nurse — Sofia is fine.
      lineKo: Sofia예요. Sofia Duarte. 선임간호사. Sofia라고 불러요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Sofia. Can I get a patient up by myself, or do I always need someone?
        why: 이 병동에서 혼자 해도 되는 일의 경계를 물었어요. 낙상은 첫날에 정해둬야 합니다.
      - tier: strong
        text: Thank you, Sofia. How do I get patients up?
        why: 방법은 얻어요. '혼자 해도 되는가'가 더 중요한 질문입니다.
      - tier: fair
        text: Nice to meet you, Sofia.
        why: 인사로 끝났어요. 이동 원칙은 물어둬야 합니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Nobody gets up alone on this floor. Two people and the physio's plan, every time — the plan
        is in the notes.
      lineKo: 이 병동에선 아무도 혼자 못 일어나요. 두 사람과 물리치료 계획, 매번. 계획은 기록에 있어요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Two people and the physio's plan, every time. I'll read the plan before I go in.
        why: 규칙을 되짚고, 언제 확인할지까지 말했어요.
      - tier: strong
        text: Two people, always. Understood.
        why: 계획을 읽는 부분이 빠졌어요.
      - tier: fair
        text: Okay, I'll ask for help.
        why: 도움을 청하는 것과 계획을 확인하는 것은 다릅니다.
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: The mistake is pulling on the arm. Support the joint, never the limb — you'll dislocate
        a new hip that way.
      lineKo: 실수는 팔을 당기는 거예요. 관절을 받치고, 팔다리를 당기지 마세요. 그렇게 하면 새 고관절이 빠집니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — support the joint, not the limb. How do I call for hands?
        why: 실수를 확인하고, 실제로 손을 부르는 방법을 물었어요.
      - tier: strong
        text: Understood. I'll support the joint.
        why: 맞아요. 부르는 방법이 남습니다.
      - tier: fair
        text: I'll be gentle.
        why: '''부드럽게''는 관절을 받치는 것과 다릅니다.'
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ring the bell twice and say the bed number — that's how we ask for hands here. I come, or
        whoever is nearest.
      lineKo: 벨을 두 번 누르고 침대 번호를 말하세요. 여기선 그렇게 손을 부릅니다. 제가 가거나 가장 가까운 사람이 갑니다.
      mood: neutral
      missions:
