- id: SCN-NURSERY-00900
  eventId: EVT-NURSERY-00900
  title: 첫 인사 · 신생아실
  tagline: Wash your hands first, then I'll introduce you to everyone.
  persona:
    name: Aiko Tanaka
    role: nurse
    ageRange: 30s
    sub: Nursery Nurse
    hair: '#1F2937'
