- id: SCN-LD-00900
  eventId: EVT-LD-00900
  title: 첫 인사 · 분만실
  tagline: It's quiet right now, which never lasts. Who are you?
  persona:
    name: Rosa Iglesias
    role: nurse
    ageRange: 40s
    sub: Charge Nurse / L&D
    hair: '#3B2A1A'
    hairStyle: bun
    personality: 침착하다. 급할 때 목소리가 낮아진다.
    speakingStyle: 한 번에 한 가지만 지시한다.
    mood: focused
  goals:
  - 용건과 상황을 먼저 밝히고 대화 시작
  - 이름·직함을 밝히고 첫날임을 알리기
  - 분만이 시작되면 어디 있어야 하는지 확인하기
  - 산모를 부를 때의 호칭을 묻기
  - 합의된 조치와 후속 확인 후 마무리
  guardrails:
  - 완벽한 문장보다 알아듣게 말하는 것이 목표
  - 임상 지식이 필요 없는 대화
  keyPhrases:
  - I'm the new nurse, starting today.
  - Where should I be when a delivery starts?
  - What should I call the mothers?
  steps:
  - id: b1
    type: dialogue
    payload:
      speaker: npc
      lineEn: It's quiet right now, which never lasts. Who are you?
      lineKo: 지금은 조용한데 오래 안 가요. 누구세요?
      mood: warm
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Hi, I'm {name} — I'm the new nurse starting in labour and delivery today.
        why: 이름·직함·첫 출근을 한 문장에 담았어요. 상대가 되물을 필요가 없어집니다.
      - tier: strong
        text: Hello. I'm the new nurse for labour and delivery.
        why: 필요한 건 말했지만 이름이 빠졌어요. 상대는 이름을 다시 물어야 합니다.
      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Right. Have you been at a birth before?
      lineKo: 그렇군요. 분만 참관해본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
