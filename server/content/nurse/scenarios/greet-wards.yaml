      - tier: fair
        text: Hi. Nice to meet you.
        why: 예의는 갖췄지만 정보가 없어요. 첫 문장은 신원을 밝히는 자리입니다.
    next: b2
  - id: b2
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. You're the new nurse — have you brought patients down for scans before?
      lineKo: 좋아요. 새로 온 간호사죠. 검사 때문에 환자 데려와본 적 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I worked three years on a medical ward in Korea, but this is my first day here.
        why: 경력과 '여기는 처음'을 함께 말했어요. 상대가 무엇을 알려줘야 하는지 정해집니다.
      - tier: strong
        text: I have three years of experience.
        why: 사실이지만 어디서·무엇을인지 없어요. 상대가 한 번 더 물어야 합니다.
      - tier: fair
        text: Not much, I'm afraid.
        why: 겸손이 정보를 지웠어요. 실제 경력을 말하는 게 환자에게 더 안전합니다.
    next: b3
  - id: b3
    type: dialogue
    payload:
      speaker: npc
      lineEn: Then stay outside the line until I call you. I'll show you where the line is.
      lineKo: 그럼 제가 부를 때까지 선 밖에 있어요. 선이 어딘지 보여줄게요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: Got it — so I'll start with that. Should I do anything before I go in?
        why: 받은 지시를 확인하고 그 앞단을 물었어요. 이게 인계를 안전하게 만드는 습관입니다.
      - tier: strong
        text: Okay, I understand.
        why: 알아들었다고만 했어요. 무엇을 알아들었는지는 상대가 알 수 없습니다.
      - tier: fair
        text: Sorry, could you say that again, more slowly?
        why: 못 들었을 때 반드시 필요한 문장이에요. 다만 들었다면 확인이 먼저입니다.
    next: b4
  - id: b4
    type: dialogue
    payload:
      speaker: npc
      lineEn: Ask me while the room is empty.
      lineKo: 방 비었을 때 물어요.
      mood: neutral
      missions:
      - 1
      - 2
      choices:
      - tier: best
        text: I do — sorry, what was your name? And how should I address you?
        why: 이름과 호칭을 함께 물었어요. 호칭을 틀리는 건 첫날 가장 흔한 실수입니다.
      - tier: strong
        text: Yes — could you tell me your name again?
        why: 이름은 얻었지만 호칭은 못 얻었어요. Dr./first name 중 무엇인지 남습니다.
      - tier: fair
        text: No, I think I'm okay for now.
        why: 질문할 기회를 넘겼어요. 첫날에 물어두지 않으면 나중엔 더 묻기 어렵습니다.
    next: b5
  - id: b5
    type: dialogue
    payload:
      speaker: npc
      lineEn: Kevin. Kevin Zhao. Radiographer on CT today.
      lineKo: Kevin이에요. Kevin Zhao. 오늘 CT 담당 방사선사입니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: Thank you, Kevin. What are the rules for coming into the scan room?
        why: 출입 규칙은 여기서 안전 그 자체입니다. 첫날에 받아둬야 합니다.
      - tier: strong
        text: Thank you, Kevin. Can I go in with the patient?
        why: 한 경우만 물었어요. 규칙 전체를 물으면 나머지도 옵니다.
      - tier: fair
        text: Nice to meet you, Kevin.
        why: 인사로 끝났어요. 여긴 규칙을 먼저 확인하는 곳입니다.
    next: b6
  - id: b6
    type: dialogue
    payload:
      speaker: npc
      lineEn: Nothing metal past the line — that includes scissors in your pocket and the clip on your
        badge. And no one comes in without me saying so.
      lineKo: 선 너머로 금속은 안 됩니다. 주머니 가위도, 명찰 클립도요. 그리고 제가 말하기 전엔 아무도 안 들어와요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      choices:
      - tier: best
        text: No metal past the line, and I don't come in until you say so. Understood.
        why: 두 규칙을 되짚었어요. 여기선 이 둘이 전부입니다.
      - tier: strong
        text: No metal past the line. Understood.
        why: '''부를 때까지''가 빠졌어요. 그게 더 자주 깨지는 쪽입니다.'
      - tier: fair
        text: Okay, I'll be careful in there.
        why: '''조심''은 두 규칙 중 어느 것도 아닙니다.'
    next: b7
  - id: b7
    type: dialogue
    payload:
      speaker: npc
      lineEn: What goes wrong is a nurse walking in to comfort a frightened patient mid-scan. Understandable,
        and it stops the scan and exposes you.
      lineKo: 잘못되는 건 검사 중에 겁먹은 환자 달래려고 들어오는 거예요. 이해는 하지만 검사가 멈추고 당신이 피폭됩니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: Understood — I won't walk in mid-scan. How do I talk to a frightened patient then?
        why: 하지 말 것을 확인하고, 그럼 무엇을 하는지 물었어요. 겁먹은 환자는 실제로 매일 옵니다.
      - tier: strong
        text: Understood. I'll stay outside.
        why: 맞아요. 환자를 어떻게 안심시키는지가 남습니다.
      - tier: fair
        text: I'll only go in if they really need me.
        why: 판단을 스스로 하겠다는 답이라, 규칙과 충돌합니다.
    next: b8
  - id: b8
    type: dialogue
    payload:
      speaker: npc
      lineEn: Talk to them through the intercom — they can hear you the whole time. If they need someone
        in the room, I'll gown you and bring you in.
      lineKo: 인터콤으로 말해요. 환자는 내내 들을 수 있어요. 방에 사람이 필요하면 제가 가운 입혀서 데려갑니다.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: So I call you first, and if I can't reach you, the charge nurse. Is that right?
        why: 들은 경로를 되짚어 확인했어요(closed loop). 급할 때 틀릴 여지를 없앱니다.
      - tier: strong
        text: Okay, I'll come find you.
        why: 한 갈래만 남았어요. 상대가 없을 때 어떻게 할지가 비어 있습니다.
      - tier: fair
        text: Understood, thank you.
        why: 확인 없이 넘어갔어요. 보고 경로는 되짚어 말해두는 편이 안전합니다.
    next: b9
  - id: b9
    type: dialogue
    payload:
      speaker: npc
      lineEn: Good. Anything else?
      lineKo: 좋아요. 더 있어요?
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      choices:
      - tier: best
        text: That's clear, thank you. One more thing — where can I put my things?
        why: 확인한 뒤 실무적인 것을 물었어요. 첫날엔 이런 게 하루를 편하게 만듭니다.
      - tier: strong
        text: Yes, that's clear.
        why: 맞는 답이지만 물어볼 기회를 한 번 흘렸어요.
      - tier: fair
        text: I think so.
        why: '''아마도''는 상대를 불안하게 합니다. 확실하지 않으면 되묻는 게 낫습니다.'
    next: b10
  - id: b10
    type: dialogue
    payload:
      speaker: npc
      lineEn: Leave your things in the changing room, not the console. Come on — first patient is on their
        way down.
      lineKo: 물건은 콘솔이 아니라 탈의실에 두세요. 갑시다, 첫 환자가 내려오는 중이에요.
      mood: neutral
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
      choices:
      - tier: best
        text: Thank you — I'm ready. I'll ask you if I'm not sure about anything.
        why: 준비됐다는 말과 '모르면 묻겠다'를 함께 말했어요. 신입에게 가장 중요한 약속입니다.
      - tier: strong
        text: Thank you. Let's go.
        why: 짧고 좋아요. 다만 도움을 요청하겠다는 말이 빠졌습니다.
      - tier: fair
        text: Okay.
        why: 대답은 됐지만 감사도 준비도 담기지 않았어요.
    next: b11
  - id: b11
    type: dialogue
    payload:
      speaker: npc
      lineEn: Welcome. You'll be down here a lot.
      lineKo: 환영해요. 여기 자주 올 거예요.
      mood: warm
      missions:
      - 1
      - 2
      - 3
      - 4
      - 5
