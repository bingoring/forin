# ER language barrier — call the interpreter (v16 er-language-barrier). A patient
# with limited English reports abdominal pain; use simple English + gestures to
# locate the pain, then follow the Language Line interpreter-call procedure.
id: SCN-ER-00007
eventId: EVT-ER-00001
title: "언어 장벽 환자 — 통역 호출"
tagline: "... ... ... (아파요)"
persona:
  name: "Mrs. Patel"
  role: patient
  ageRange: "40s"
  sub: "45y / Female · Hindi speaker"
  hair: "#2A1A0E"
  hairStyle: bun
  personality: "복통으로 불편·불안. 영어가 서툴러 답답해함. 손짓으로 표현."
  speakingStyle: "짧은 단어·제스처, 영어 매우 제한적. 반복·확인 필요."
  mood: worried
goals:
  - "단순 영어·손짓으로 통증 부위·강도 파악"
  - "Language Line 통역 서비스 콜 절차 수행"
guardrails:
  - "천천히·쉬운 단어·yes/no 질문 활용"
  - "환자를 존중하며 통역 도움을 명확히 안내"
keyPhrases:
  - "Pain here? (point) Yes or no?"
  - "I will call an interpreter to help us."
  - "One moment, please. Help is coming."
briefing:
  dept: "ER · EXAM 1"
  deptColor: "#DC2626"
  brief: "영어가 서툰 환자가 복통을 호소합니다. 손짓과 단순한 영어로 통증 부위와 강도를 파악하고, 통역 서비스(Language Line)를 콜하는 표준 절차를 따르세요."
  difficulty: 2
  timeLabel: "약 6분"
  skills:
    - "단순 영어"
    - "통역 콜 매뉴얼"
    - "비언어 의사소통"
  rewards:
    - { icon: "⭐", label: "경험치", value: "+ 150 XP" }
    - { icon: "❤", label: "환자 만족도", value: "+ 8" }
  reqs:
    - { label: "레벨 B1+", metric: "level", threshold: 3 }
  tone: "#FFEDD5"
  accent: "#E8B584"
steps:
  - id: s1
    type: dialogue
    payload: { speaker: patient, expression: worried, lineEn: "...pain... (holds stomach)", lineKo: "…아파요… (배를 감싸쥠)" }
    next: s2
  - id: s2
    type: dialogue
    payload: { speaker: player, expression: focused, lineEn: "Okay. Pain here? (pointing) I will call an interpreter to help us." }
    next: s3
  - id: s3
    type: quiz
    payload: { quizId: QZ-ER-00004 }
