theme: or-timeout
changes:
- kind: word
  id: w-start
  fields:
  - ko
  why: w-begin과 ko(시작하다)가 같아 정답이 둘 — start는 수술·타임아웃에 들어가는 착수
- kind: word
  id: w-note
  fields:
  - ko
  why: w-document와 ko(기록하다)가 같아 정답이 둘 — note는 시각 등을 적어 두는 기재
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm과 ko(확인하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — check는 눈으로 살펴 점검하는 쪽
- kind: word
  id: w-run
  fields:
  - ko
  why: w-proceed(진행하다)와 겹치고, 태그 문장은 the case runs longer — 수술이 예정보다 이어진다는 뜻
- kind: word
  id: w-align
  fields:
  - ko
  why: w-match(일치하다)와 ko(일치시키다)가 겹친다 — align은 팀원의 이해·계획을 한 방향으로 맞추는 쪽
- kind: word
  id: w-circulating
  fields:
  - ko
  why: ko를 '순환하는'으로 — 문장 ko·뉘앙스 설명의 '순환 간호사'와 통일
- kind: word
  id: w-type
  fields:
  - ko
  why: type and cross의 type은 혈액형을 정하는 검사 — ko를 '혈액형 검사'로
- kind: word
  id: w-hold
  fields:
  - example
  why: example을 S19 문장(절개 보류)으로 — S8 'on hold'(혈액 확보)와 다른 뜻의 hold 태그를 떼었다
- kind: word
  id: w-double
  fields:
  - ko
  why: 태그된 말은 double-check의 double — ko를 '이중의(두 번)'로(재확인의 → 이중의)
- kind: word
  id: w-vital
  fields:
  - en
  - ipa
  why: 문장 두 곳 모두 명사 vitals — 헤드워드를 vitals로(id는 그대로)
- kind: word-remove
  id: w-patient
  why: 너무 쉬운 말(결정 11) — 어느 문장도 태그하지 않게 됨
