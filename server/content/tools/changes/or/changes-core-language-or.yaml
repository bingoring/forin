  id: w-sorry
  why: 너무 쉬움/구에 묶음 — 너무 쉬움 — 목록 밖 판단(sorry); 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-okay
  why: 너무 쉬움/구에 묶음 — 너무 쉬움 — 목록 밖 판단(okay); 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-away
  why: 너무 쉬움/구에 묶음 — right away는 right에 묶고 away는 따로 가르치지 않음 — w-immediately(즉시)와 ko도 겹침; 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-over
  why: 너무 쉬움/구에 묶음 — go over 구의 일부 — 단독 카드(살펴서)로는 뜻이 흐림; 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-down
  why: 너무 쉬움/구에 묶음 — slow down을 w-slow 한 카드(속도를 늦추다)로 묶음 — 단독 down(아래로)은 뜻이 틀림; 어느 문장도 태그하지 않게 됐다
- kind: word
  id: w-set
  fields:
  - en
  - ipa
  - ko
  why: 문장은 set up the line — 구 단위 헤드워드로, 설치하다는 장비 설치로 읽혀 세팅하다로
- kind: word
  id: w-slow
  fields:
  - en
  - ipa
  - ko
  why: 문장은 slow down(속도를 늦추다) — 형용사 slow 카드와 따로 뜻이 틀린 down 카드를 한 구로 묶음
- kind: word
  id: w-back
  fields:
  - ko
  why: w-again(다시)과 ko가 겹쳐 — explain it back·repeat back은 '되돌려' 말하기(teach-back)
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm(확인하다)과 ko가 같아 정답이 둘 — check는 눈으로 살펴 점검하는 쪽
- kind: word
  id: w-nothing
  fields:
  - ko
  why: w-anything과 ko(아무것도)가 같아 정답이 둘 — nothing은 하나도 없음
- kind: word
  id: w-anything
  fields:
  - ko
  why: w-nothing과 ko(아무것도)가 같아 정답이 둘 — anything은 '무엇이든'(물음·부정문)
- kind: word
  id: w-welcome
  fields:
  - ko
  why: '''is welcome to stay''는 머물러도 좋다는 뜻 — 환영하는이 아니라 환영받는'
- kind: word
  id: w-keep
  fields:
  - ko
  why: keep trying·keep it simple — 유지하다보다 계속하다가 두 문장에 맞음
- kind: word
  id: w-across
  fields:
  - ko
  why: '''get the essentials across''는 건너서가 아니라 상대에게 전달되는 것'
- kind: word
  id: w-flag
  fields:
  - ko
  why: ko에 괄호로 뜻이 둘(표시하다/경고하다) — 차트에 눈에 띄게 표시해 두는 쪽으로 정리
- kind: word
  id: w-arrange
  fields:
  - ko
  why: w-prep(준비)과 ko가 겹쳐 — arrange a interpreter는 통역사를 마련·섭외
