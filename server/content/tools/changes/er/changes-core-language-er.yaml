- kind: word
  id: w-listen
  fields:
  - ko
  why: w-hear와 ko(듣다)가 같아 듣고 뜻 고르기에서 정답이 둘 — read와 대비되는 귀로 듣기로 가른다
- kind: word
  id: w-speak
  fields:
  - ko
  why: w-say와 ko(말하다)가 같다 — 문장 대부분(5건 중 3건)이 언어를 말하는 뜻(speak English/dialect/Somali)이라 그쪽으로 가른다
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm과 ko(확인하다)가 같다 — check if he truly understands는 살펴보다로 가른다
- kind: word
  id: w-exam
  fields:
