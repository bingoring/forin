  situation: 이상성 반응 재악화
  index: 2
  fields:
  - words
  why: 형용사 헤드워드 w-exact에 부사 exactly가 묶였다 — 부사는 별도 단어라 태그를 뺐다(w-exact는 소아 s3에 남음)
- kind: word
  id: w-push
  fields:
  - ko
  why: Push the call button은 누르다 — 밀다만으로는 모자랐다
- kind: word
  id: w-calm
  fields:
  - ko
  why: keeping him calm·Stay as calm은 형용사 — 동사 뜻(진정시키다)만으로는 모자랐다
