  id: w-respond
  fields:
  - ko
  why: w-react와 ko(반응하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — help your body respond는 치료에 반응하는 것
- kind: word
  id: w-bother
  fields:
  - ko
  why: foods also bother you는 거슬리다가 아니라 (몸에) 문제를 일으키다
- kind: word
  id: w-fully
  fields:
  - ko
  why: w-completely와 ko(완전히)가 같아 정답이 둘 — didn't fully work는 충분히 듣지 않았다
- kind: word
  id: w-steady
  fields:
  - ko
  why: w-stable(안정적인)과 ko(안정된)가 사실상 같아 정답이 둘 — Vitals were steady는 변동 없이 일정했다
- kind: word
  id: w-bring
  fields:
  - ko
  why: 유일한 문장이 bring your blood pressure up — 가져오다가 아니라 구 안의 뜻(끌어올리다)으로
- kind: word
  id: w-hive
  fields:
  - en
  - ipa
  why: 단수 hive는 벌집 — 두드러기 뜻은 복수형 hives만 갖는다(사전 표제어도 hives). 태그된 문장 전부 hives
- kind: word
  id: w-vital
  fields:
  - en
  - ipa
  why: 단수 vital은 형용사(필수적인) — 활력징후 뜻은 복수형 vitals. 태그된 문장 전부 vitals
