  - ipa
  - ko
  why: 두 문장 모두 명사 'vitals'(full set of vitals · Get vitals again) — 형용사 vital/활력징후의가 아니라 명사로
- kind: word
  id: w-continue
  fields:
  - ko
  why: ko 계속하다가 w-keep(계속하다)과 겹쳤다
- kind: word
  id: w-bag
  fields:
  - ko
  why: 문장 셋이 명사(squeeze the bag · the bagging) — 동사 뜻만으로는 모자랐다
- kind: word
  id: w-flush
  fields:
  - ko
  why: '''Flush the IO line''(타동사)에도 쓰인다 — 잘 흐르다만으로는 모자랐다'
