  - example
  why: 태그된 세 문장 모두 명사 bleeding(history of bleeding · Control the bleeding) — 동사 bleed가 아니라 명사로
- kind: word
  id: w-switch
  fields:
  - ko
  why: switching to an IO(전환)에도 쓰인다 — 교대하다만으로는 모자랐다
- kind: word
  id: w-secure
  fields:
  - ko
  why: 헤드워드는 원형 secure인데 ko가 과거분사형(확보된)이었다
