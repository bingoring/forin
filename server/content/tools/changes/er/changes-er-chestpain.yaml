- kind: word
  id: w-stay
  fields:
  - ko
  why: 문장이 모두 stay still·stay calm·stay with me라 '머무르다'가 맞지 않았다
- kind: word
  id: w-burn
  fields:
  - en
  - ipa
  - ko
  why: 두 문장 모두 burning(화끈거림)인데 헤드워드는 동사 burn이었다
- kind: word
  id: w-squeeze
  fields:
  - en
  - ipa
  - ko
  why: 문장은 squeezing인데 헤드워드는 동사 squeeze였다; ko '조이는 느낌'이 w-tightness(조임)와 겹쳐 쥐어짜는 느낌으로
- kind: word
  id: w-confirm
  fields:
  - ko
  why: w-check와 ko(확인하다)가 같아 정답이 둘 — confirm with tests는 검사로 확정하는 것
- kind: word
  id: w-tell
  fields:
  - ko
  why: w-speak·w-talk와 ko(말하다)가 같아 정답이 셋 — tell me는 말해 주는 것
- kind: word
  id: w-lightheaded
  fields:
  - ko
  why: w-dizzy와 ko(어지러운)가 같고 같은 상황에 함께 나와 듣고 뜻 고르기에서 정답이 둘
- kind: word
  id: w-frighten
  fields:
  - en
  - ipa
  - ko
  why: 문장은 형용사 frightening인데 헤드워드는 동사 frighten이었다
- kind: word
  id: w-unsafe
  fields:
  - ko
  why: w-dangerous와 ko(위험한)가 같아 정답이 둘
- kind: word
  id: w-move
  fields:
  - ko
  - example
  why: Try not to move(움직이다)에 '옮기다'가 맞지 않았다 — move somewhere도 몸을 움직여 자리를 옮기는 것 · 예문도 새 ko에 맞게 대동맥 박리 장면의 Try not to move too much.로
- kind: word
  id: w-swell
  fields:
  - en
  - ipa
  - ko
  why: 문장은 명사 leg swelling인데 헤드워드는 동사 swell이었다
- kind: word
  id: w-listen
  fields:
  - ko
  why: w-hear와 ko(듣다)가 같아 정답이 둘
- kind: word
  id: w-open
  fields:
  - ko
  why: 문장은 open the blocked artery(뚫다)인데 ko가 '열다'였다
- kind: word
  id: w-block
  fields:
  - en
  - ipa
  why: 문장은 형용사 blocked(ko도 막힌)인데 헤드워드는 동사 block이었다
- kind: word
  id: w-talk
  fields:
  - ko
  why: w-speak·w-tell과 ko(말하다)가 같아 정답이 셋
- kind: word
  id: w-vital
  fields:
  - en
  - ipa
  why: 문장은 vitals(활력징후)인데 헤드워드 vital은 형용사(생명의)다 — er-arrest와 같게
- kind: word
  id: w-episode
  fields:
  - ko
  why: '''발작 시기''는 틀린 뜻이고 w-attack(발작)과 겹친다 — er-arrhythmia와 같게'
- kind: word-add
  id: w-breathe
  why: 동사 breathe 문장 4개가 명사 w-breath(숨)에 태그돼 있었다 — 품사가 다른 낱말이라 따로 만들었다
- kind: sentence
  situation: 흉통 중 급속 악화
  index: 0
  fields:
  - ko
  why: "ER 마무리 스윕: 'Stay with me'를 '제 곁에 있어요'로 옮겨 간호사·환자 역할이 뒤집혀 있었다 — 의식이 흐려지는 환자에게 하는 '정신 놓지 마세요'."
