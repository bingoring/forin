- kind: word
  id: w-short
  fields:
  - en
  - ipa
  why: ko '숨이 찬'은 낱말 short가 아니라 구의 뜻 — 태그 문장 셋 모두 short of breath라 구로
- kind: word
  id: w-move
  fields:
  - ko
  why: ko '진행하다'가 the baby moving less(태아 움직임)에 맞지 않았다
- kind: word
  id: w-confuse
  fields:
  - en
  - ipa
  - ko
  why: 태그 문장·예문이 모두 형용사 confused(he's cold and confused)인데 헤드워드가 동사 confuse, ko '혼란스럽게 하다'였다
- kind: word
  id: w-run
  fields:
  - ko
  - example
  why: ko '(열이) 나다'는 태그 문장 넷 중 하나(run a fever)에만 맞았다 — 나머지 셋은 run the pressor; run a fever는 새 단어 w-runfever로
- kind: word
  id: w-side
  fields:
  - ko
  why: w-flank와 ko(옆구리)가 같아 정답이 둘 — flank가 임상어 옆구리, side는 일상어 옆
- kind: word
  id: w-come
  fields:
  - en
  - ipa
  - ko
  - example
  why: 공통 쉬운 말 come이지만 유일한 태그 문장이 blood pressure came up이라 구(come up)로 둔다; ko '오르다'가 w-rise와 겹쳐 가른다
- kind: word
  id: w-thorough
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드에 부사가 묶였다 — 태그 문장은 check thoroughly
- kind: word
  id: w-continuous
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드에 부사가 묶였다 — 태그 문장은 monitoring continuously
- kind: word
  id: w-urgent
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드에 부사가 묶였다 — 태그 문장은 giving … urgently
- kind: word
  id: w-climb
  fields:
  - ko
  why: w-rise·w-come과 ko(오르다)가 같아 정답이 여럿
- kind: word
  id: w-mottle
  fields:
  - en
  - ipa
  - ko
  - example
  why: 태그 문장·예문이 모두 명사 mottling(the mottling of your skin)인데 헤드워드가 동사 mottle이었다 / 환자 말투 예문을 의료진 보고 말투로 — 단어 카드가 임상어 자리를 보여 주게(젖산 위기 context와 짝)
- kind: word
  id: w-immediate
  fields:
  - en
  - ipa
  - ko
  - example
