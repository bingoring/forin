  id: w-slowly
  why: 쉬운 w-hand를 빼 청력저하 환자 소통이 서로 다른 단어 7개가 됨 — 문장 0(keyPhrase)에 이미 있는 speak slowly
- kind: word-add
  id: w-dim
  why: 쉬운 w-body와 뜻이 다른 w-low 태그를 빼 급성 섬망+공격성이 7개가 됨 — 두 상황 문장에 이미 있는 dim the lights
- kind: word
  id: w-leave
  fields:
  - example
  why: 예문이 지킬 수 없는 비밀 보장 약속(nothing leaves this room without your say)을 굳혀 — 먼저 알리겠다는 문장으로
- kind: word
  id: w-say
  fields:
  - example
  why: 예문이 지킬 수 없는 비밀 보장 약속을 굳혀 — have a say in 문장으로
- kind: word
  id: w-cause
  fields:
  - ko
  - example
  why: 태그 문장 6개 중 5개가 동사(cause these symptoms 등)인데 ko가 명사 '원인' — ko를 일으키다로, 예문도 동사 문장으로
- kind: word
  id: w-fluid
  fields:
  - en
  - ipa
  why: 복수 헤드워드(fluids)를 원형으로 — 형제 주제 er-sepsis·er-shock의 w-fluid(fluid)와 맞춤
- kind: word
  id: w-stay
  fields:
  - ko
