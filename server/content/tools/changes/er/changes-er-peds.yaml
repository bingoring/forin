- kind: word
  id: w-steady
  fields:
  - ko
  why: w-stable(안정된)과 ko(안정적인)가 사실상 같아 정답이 둘 — stable and steady의 steady는 일정하게 유지되는 것
- kind: word-add
  id: w-alltime
  why: 쉬운 w-time을 빼 영아 SIDS 소생 실패가 서로 다른 단어 7개가 됨 — 문장 1(keyPhrase)에 이미 있는 사별 위로의 관용구
- kind: word-add
  id: w-jaundice
  why: 신생아 이상 징후 문장 4의 'the yellow level'을 her jaundice level로 고치며 새로 태그
- kind: word
  id: w-last
  fields:
  - example
  why: 예문이 열성 경련 S5 문장 — 그 문장을 call 911로 고친 것에 맞춤
- kind: word
  id: w-support
  fields:
  - ko
  why: 호흡 보조를 '지원'이라 하면 한국어가 어색 — '보조'로
