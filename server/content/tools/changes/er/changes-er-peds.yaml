  situation: 열성 경련 목격 부모
  index: 5
  fields:
  - en
  - chunks
  - ko
  why: 사실 오류 — 5분 넘는 경련은 911이 표준 귀가 교육(같은 상황 swap과도 어긋났다). keyPhrase 아님
- kind: sentence
  situation: 소아 DKA
  index: 3
  fields:
  - words
  why: w-bring(데려오다)이 bring her sugar down(낮추다)에 붙은 다른-뜻 태그 — 뺐다
- kind: word
  id: w-hold
  fields:
  - ko
  why: hold her hand(잡다)와 You can hold her(안다) — SIDS 상황이 정확히 8개라 태그를 못 빼고 ko를 넓혔다
- kind: word
  id: w-walk
  fields:
  - en
  - ipa
  - ko
  - example
  why: 낱말 walk에 구 뜻을 얹은 헤드워드 — er-diabetic처럼 구 헤드워드 walk you through로
- kind: sentence
  situation: 학대 의심 정황
  index: 3
  fields:
  - words
  why: walk me through는 구 헤드워드 walk you through와 연속 토큰이 달라 태그를 뺐다
- kind: sentence
  situation: 소아 아나필락시스
  index: 1
  fields:
  - ko
  why: 듣는 사람은 공황에 빠진 부모 — '함께 계세요'(동석)가 아니라 '저한테 집중해 주세요'
- kind: sentence
  situation: 학대 의심 신고 결정
  index: 1
  fields:
  - ko
  - words
  why: work with you는 협력 — '함께 일하고'를 고쳤고, w-work((처치에) 매달리다)와 뜻이 달라 태그를 뺐다
- kind: word
  id: w-work
  fields:
  - ko
  why: 남은 태그(working on her · while we work)가 모두 처치 뜻 — '애쓰다'보다 정확하게
- kind: sentence
  situation: 중증 천식 지속상태
  index: 3
  fields:
  - ko
  why: w-support ko를 '보조'로 바꾼 것에 맞춤 — '지원을 더하고'는 어색
