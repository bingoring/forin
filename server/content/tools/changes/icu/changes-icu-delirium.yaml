- kind: word
  id: w-lighten
  fields:
  - ko
  why: ko '얕추다'는 우리말이 아니다 — '가볍게 하다'로
- kind: word
  id: w-calm
  fields:
  - ko
  why: 태그된 문장 대부분이 형용사('he's calm', 'keep the room calm')라 ko '진정시키다'는 맞지 않고, 같은 ko를
    w-deescalate도 가졌다 — '차분한'으로
- kind: word
  id: w-support
  fields:
  - ko
  why: '''support his lines/brain''의 뜻을 ''지지하다''는 못 담는다 — ''받쳐 주다'''
- kind: word
  id: w-guide
  fields:
  - ko
  why: '''use CIWA to guide dosing''의 ''안내하다''가 어색 — ''이끌다'''
- kind: word
  id: w-back
  fields:
  - ko
  why: ko '다시'는 'step back'(뒤로)과 'get back to themselves'(되돌아)를 담지 못한다
- kind: word
  id: w-through
  fields:
  - ko
  why: '''talking this through''의 뜻은 ''통해''가 아니라 ''끝까지'''
- kind: word
  id: w-replace
  fields:
  - ko
  why: ko '재확보하다'가 w-secure '확보하다'와 거의 같아 정답이 둘이 된다 — '교체하다'로 가름
- kind: word
  id: w-turn
  fields:
  - ko
  why: 태그된 문장 대부분이 '몸을 돌리다'이고 ko '끄다'는 turn off(w-off와 함께) 한 군데뿐 — '돌리다'로, 해당 두 문장
    태그를 뺌
- kind: word
  id: w-turn
  fields:
