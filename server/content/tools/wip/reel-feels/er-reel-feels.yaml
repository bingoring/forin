# 스펙 2-9 §11-8 — ER 문장 릴 17개의 감상 칩(feels)과 해설(why). (주제, 상황 제목, 단어)로 맞춘다.
# why 가 이미 있는 릴(watch, crash)은 why 를 적지 않는다 — 기존 해설을 그대로 둔다.
- theme: er-pain-sedation
  title: 말기 환자 통증 완화
  word: comfort
  feels: [따뜻한 말, 완화 돌봄의 용어, 가족에게도 씀, 오더에선 건조함]
  why: "comfort는 가족에게 따뜻하게 쓰는 말이지만, 오더·인계의 comfort care는 치료 목표를 증상 완화로 바꿨다는 임상 용어예요. 가족에게는 용어 대신 '편안하게, 통증 없이'처럼 풀어 말해요."
- theme: er-procedures
  title: 골내주사(IO) 응급 확보
  word: stay
  feels: [부탁하는 말, 곁을 지키는 말, 급할 때 붙잡는 말, 동료에겐 안 씀]
  why: "stay는 '가만히 계세요', '곁에 있을게요', '정신 놓지 마세요(Stay with me)'처럼 환자에게 하는 말이에요. 동료에게 상태를 전할 때는 stay 대신 지금 어떤지(drowsy)와 할 일을 말해요."
- theme: core-language-er
  title: 이송 중 언어 인계
  word: interpreter
  feels: [안전 장치, 환자의 권리, 차트에 꼭 남김, 가족 통역은 피함]
  why: "의료 통역사(trained interpreter)는 정확한 소통을 위한 표준이에요. 미국 병원은 가족·보호자에게 통역을 맡기는 것을 피하고, 통역을 썼는지와 방식(영상·전화)을 차트에 남겨요."
- theme: core-family-er
  title: 원거리 가족 전화 소통
  word: update
  feels: [짧은 보고, 연락 기록, 사무적, 가족에게도 무난]
  why: "update는 의료진끼리 짧게 소식을 전하거나 '가족에게 연락함(updated)'을 기록하는 데 잘 맞아요. 가족에게 써도 틀리지 않지만, 'I wanted to let you know how your mom is doing'처럼 사람을 주어로 풀면 더 다정하게 들려요."
- theme: core-safety-er
  title: 다직역 안전 브리핑
  word: deteriorate
  feels: [딱딱한 임상어, 급하고 무거움, 보호자에겐 안 씀, 차트에 잘 맞음]
  why: "deteriorate는 의료진끼리는 정확해서 좋지만, 가족 앞에서는 차갑게 들려요. 보호자에게는 'getting worse'로 바꿔 말하고, 지금 하고 있는 조치를 함께 말해요."
- theme: er-chestpain
  title: 불안정 협심증 야간 재발
  word: episode
  feels: [의학 기록어, 횟수를 셈, 환자에겐 낯섦, 차트에 잘 맞음]
  why: "episode는 증상이 한 번 나타났다 사라진 '회차'를 세는 임상어라 인계·차트에 잘 맞아요. 환자에게는 'this last one', 'the pain you had'처럼 쉬운 말로 물어요."
- theme: er-arrhythmia
  title: ICD 반복 쇼크(전기폭풍)
  word: shock
  feels: [두려운 경험, 기계가 하는 일, 급한 보고, 환자의 말 그대로]
  why: "ICD shock은 이식된 기계가 심장에 전기 충격을 주는 것이고, 환자에게는 공포스러운 경험이에요. 의료진끼리는 횟수와 전기폭풍 가능성을 보고하고, 환자에게는 자석으로 충격을 잠시 멈출 수 있다는 것처럼 지금 할 일을 말해 안심시켜요."
- theme: er-shock
  title: 수액 반응성 평가
  word: watch
  feels: [곁에서 챙김, 맡기는 부탁, 쉬운 일상어, 감시처럼 들릴 수도]
- theme: er-shock
  title: 폐색전 폐쇄성 쇼크
  word: crash
  feels: [거친 구어, 급하고 무거움, 보호자에겐 안 씀, 동료끼리 짧게]
- theme: er-dyspnea
  title: 무증상 저산소(행복한 저산소) 인지
  word: low
  feels: [쉬운 말, 숫자와 함께 씀, 환자에게도 씀, 덜 무섭게 들림]
  why: "low는 의료진에게도 환자에게도 쓰는 쉬운 말이라, 보고할 때는 숫자(86% RA)를 붙여야 정확해요. 환자에게는 'lower than we'd like'처럼 걱정되는 정도를 담되 겁주지 않고, 숨이 편해도 산소가 낮을 수 있다는 점을 함께 알려요."
- theme: er-asthma-copd
  title: COPD 고탄산 호흡부전 BiPAP
  word: escalate
  feels: [단계를 올림, 윗선에 알림, 가족에겐 낯섦, 계획을 말함]
  why: "escalate는 치료 단계를 올리거나(BiPAP에서 삽관으로) 윗선에 보고하는(담당 전문의에게) 두 뜻으로 의료진끼리 쓰는 말이에요. 가족에게는 'we may need to do more to help him breathe'처럼 무엇을 위한 것인지 풀어 말해요."
- theme: er-stroke
  title: TIA 증상 소실
  word: stay
  feels: [붙잡는 말, 부탁하는 말, 짧고 또렷함, 상대마다 뜻이 다름]
  why: "stay는 듣는 사람에 따라 뜻이 갈려요. 의식이 흐려지는 환자에게 'Stay with me'는 '정신 놓지 마세요', 떠나려는 환자에게는 '남아 계세요', 보호자에게 'stay with him'은 '곁에 있어 주세요'예요. 영어가 서툰 환자에게는 관용구보다 'Open your eyes. Look at me.'처럼 동작을 말해요."
- theme: er-bleeding-wound
  title: 정맥성 다량출혈 지혈
  word: steady
  feels: [멈추지 않는 흐름, 덜 급하게 들림, 차분한 보고, 안심시키는 말]
  why: "steady bleeding은 멈추지 않고 꾸준히 흐르는 출혈로, 뿜어져 나오는(spurting) 동맥성 출혈과 구분하는 말이에요. 보고에서는 양상을 정확히 말하고, 보호자에게는 뿜어져 나오지 않는다는 것과 압박이 듣고 있다는 사실을 함께 말해 안심시켜요."
- theme: er-gi-bleed
  title: 재출혈 급변 야간 SBAR
  word: change
  feels: [넓고 막연함, 급변의 신호, 차트 표준어, 환자에게도 씀]
  why: "change in condition은 미국 병원에서 '상태 변화 — 담당의에게 보고함'을 뜻하는 표준 표현이에요. 의사에게는 무엇이 어떻게 바뀌었는지(수축기 84) 숫자로 말하고, 환자에게는 'something has changed'에 이어 지금 무엇을 하는지 말해요."
- theme: er-anaphylaxis
  title: 음식(견과) 아나필락시스
  word: swell
  feels: [눈에 보이는 변화, 급하고 무서움, 차트 관찰어, 보호자에겐 puffy]
  why: "swell은 붓는다는 말이에요. 얼굴·입술·혀가 부으면 기도가 막힐 수 있어 아나필락시스에서는 급한 신호예요. 차트와 호출에는 부위와 시각을 붙여 말하고, 보호자에게는 'puffy'처럼 쉬운 말과 이미 치료 중이라는 사실을 함께 말해요."
- theme: er-environmental
  title: 열사병 다장기부전
  word: dark
  feels: [쉬운 관찰어, 걱정의 신호, 차트에도 씀, 보호자에게도 씀]
  why: "dark urine은 누구에게나 쓰는 쉬운 말이지만, 열사병 뒤에는 횡문근융해를 의심하는 신호예요. 차트에는 'tea-colored'처럼 색을 구체적으로 적고, 보호자에게는 무엇을 뜻할 수 있는지와 지금 하는 조치를 함께 말해요."
- theme: er-alcohol-withdrawal
  title: 중증 금단 야간 급변 인계
  word: climb
  feels: [숫자가 오름, 추세를 그림, 급한 보고, 보호자에겐 안 씀]
  why: "climb은 점수나 수치가 계속 오르는 추세를 그려서 CIWA 같은 점수 보고에 잘 맞아요. 보호자에게는 점수 대신 'his withdrawal got worse'처럼 상태로 말해요."
