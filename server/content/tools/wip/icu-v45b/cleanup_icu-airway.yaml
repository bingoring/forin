# icu-airway 결정 11 정리 — build_icu-airway.py 가 읽는다.
# 쉬운 단어: 모든 문장에서 태그를 빼고, 남은 태그가 없으면 은행에서 지운다.
untag_everywhere:
  w-now: 공통 쉬운 단어(now)
  w-time: 공통 쉬운 단어(time)
  w-minute: 공통 쉬운 단어(minute)
  w-name: 공통 쉬운 단어(name)
  w-head: 공통 쉬운 단어(head)
  w-patient: 공통 쉬운 단어(patient)
  w-know: 공통 쉬운 단어(know)
  w-go: 공통 쉬운 단어(go)
  w-see: 공통 쉬운 단어(see)
  w-come: 공통 쉬운 단어(come)
  w-hand: 공통 쉬운 단어(hand)
  w-tell: 간호사가 이미 아는 말(tell)
  w-want: 간호사가 이미 아는 말(want)
  w-need: 간호사가 이미 아는 말(need)
  w-anything: 간호사가 이미 아는 말(anything)
  w-someone: 간호사가 이미 아는 말(someone)
  w-everyone: 간호사가 이미 아는 말(everyone)
  w-one: 간호사가 이미 아는 말 — 'the one who'의 one을 '사람'으로 가르칠 값이 없다
  w-water: 간호사가 이미 아는 말(water)
  w-nose: 간호사가 이미 아는 말(nose)
  w-got: 간호사가 이미 아는 말(I've got)

# 특정 문장에서만 태그를 뺀다(뜻이 카드와 다르다): [상황 번호, 문장 번호, id, why]
untag_at:
  - [10, 2, w-close, "keep the airway cart close는 형용사(가까이) — w-close(막히다) 태그를 뺐다"]
  - [12, 4, w-off, "take the valve off는 떼어 낸다는 불변화사 — w-off(이상한) 태그를 뺐다"]
  - [12, 5, w-alert, "he's alert는 형용사(의식이 또렷한) — 카드를 '알리다'로 가르고 이 태그를 뺐다"]
  - [16, 3, w-monitor, "watch the monitor는 기계(명사) — w-monitor(모니터링하다) 태그를 뺐다"]
  - [11, 0, w-position, "cuff positions는 위치(명사) — w-position(체위) 카드와 뜻이 달라 태그를 뺐다"]
  - [9, 0, w-safer, "w-safe와 겹치는 비교급 카드 — w-safe로 바꿔 태그"]

# 특정 문장에 태그를 더한다: [상황 번호, 문장 번호, id, why]
tag_at:
  - [9, 0, w-safe, "w-safer 대신 w-safe로 태그(safer는 safe의 비교급)"]

