situations:
- title: SBAR 구조 인계 기초
  sentences:
  - en: 'Situation: he''s a sixty-year-old with sepsis, day two.'
    ko: '상황: 그는 60세, 패혈증 2일째입니다.'
    chunks:
    - 'Situation:'
    - he's a sixty-year-old
    - with sepsis
    - ', day two'
    - .
    words:
    - w-situation
    - w-sepsis
    goal: 1
  - en: Background, assessment, and then my recommendation.
    ko: 배경, 평가, 그리고 제 권고 순서로 드릴게요.
    chunks:
    - Background
    - ', assessment'
    - ', and then'
    - my recommendation
    - .
    words:
    - w-background
    - w-assessment
    - w-recommendation
    goal: 1
  - en: Let's go through his SBAR from the top.
    ko: 처음부터 SBAR 순서로 짚어 볼게요.
    chunks:
    - Let's go through
    - his SBAR
    - from the top
    - .
    words:
    - w-sbar
    - w-from-the-top
    goal: 1
  - en: I'll walk you through the background first, then the assessment.
    ko: 먼저 배경부터, 그다음 평가로 안내해 드릴게요.
    chunks:
    - I'll walk you
    - through the background
    - first
    - ', then the assessment'
    - .
    words:
    - w-background
    - w-assessment
    goal: 1
  - en: Let me know if you want me to repeat anything.
    ko: 다시 말씀드릴 부분이 있으면 알려 주세요.
    chunks:
    - Let me know
    - if you want me
    - to repeat
    - anything
    - .
    words:
    - w-repeat
    goal: 2
  nuance:
  - kind: pair
    words:
    - w-situation
    - w-background
    - w-assessment
    - w-recommendation
    pairs:
    - - Situation
      - sixty-year-old with sepsis, day two
    - - Background
      - no prior ICU admissions
    - - Assessment
      - calm and cooperative
    - - Recommendation
      - keep the drip running
    decoys:
    - thanks for listening
    why: S는 지금 벌어진 문제, B는 병력·입원 경위, A는 내가 본 환자 상태, R은 인수자에게 바라는 조치예요. 칸이 정해져 있어서 듣는 쪽이 빠진 칸을 바로 알아챕니다.
  - kind: swap
    words:
    - w-recommendation
    who: 인수 간호사에게 · 권고(R)
    icon: speech
    before:
    - ''
    - Maybe we could keep
    - ' the drip running.'
    options:
    - I recommend we keep
    - Maybe we could keep
    - You have to keep
    answer: I recommend we keep
    notes:
      I recommend we keep: SBAR의 R답게 무엇을 바라는지 분명히 말한다.
      Maybe we could keep: 망설이는 말로 들려 인수자가 중요도를 낮게 받아들일 수 있다.
      You have to keep: 동료에게 명령처럼 들린다.
    why: R은 부탁이 아니라 분명한 권고로 말해요. 흐리게 말하면 인계받는 쪽이 얼마나 중요한지 놓칩니다.
