situations:
- title: 알람 설정·우선순위 이해
  sentences:
  - en: Red alarms are life-threatening and need immediate action.
    ko: 빨간 알람은 생명을 위협하는 상황이라 즉각 조치가 필요해요.
    chunks: [Red alarms are, life-threatening, and need, immediate action, .]
    words: [w-red, w-alarm, w-lifethreatening, w-action]
    goal: 1
  - en: Yellow alarms need attention, but they can wait a minute.
    ko: 노란 알람은 주의가 필요하지만 잠깐은 기다려도 돼요.
    chunks: [Yellow alarms need, 'attention,', but they can wait, a minute, .]
    words: [w-yellow, w-alarm, w-attention, w-wait]
    goal: 1
  - en: We set limits based on each patient's baseline.
    ko: 우리는 환자마다 기저치를 바탕으로 한계를 설정해요.
    chunks: [We set limits, based on, each patient's baseline, .]
    words: [w-limit, w-baseline]
    goal: 2
  - en: Let's customize these so only meaningful alarms sound.
    ko: 의미 있는 알람만 울리도록 이걸 맞춤 설정해요.
    chunks: [Let's customize these, so only meaningful, alarms sound, .]
    words: [w-customize, w-meaningful, w-alarm, w-sound]
    goal: 2
  - en: If it's not going to hurt him in the next minute, it's not a red alarm.
    ko: 앞으로 1분 안에 해를 끼치지 않는다면 빨간 알람이 아니에요.
    chunks: [If it's not going to hurt him, 'in the next minute,', it's not, a red alarm, .]
    words: [w-hurt, w-red, w-alarm]
    goal: 1
  - en: Once we personalize the limits, you'll trust every alarm that sounds.
    ko: 한계를 개인화하고 나면 울리는 모든 알람을 신뢰하게 될 거예요.
    chunks: [Once we personalize, 'the limits,', you'll trust, every alarm that sounds, .]
    words: [w-personalize, w-limit, w-trust, w-alarm, w-sound]
    goal: 2
  nuance:
  - kind: slider
    words: [w-alarm, w-red]
    cue: 'Monitor: HR 34, patient pale and not responding.'
    scale: [low-priority alarm, medium-priority alarm, high-priority alarm]
    answerAt: 2
    why: 지금 생명을 위협하고 즉각 조치가 필요하면 high-priority — 모니터에서는 빨간색이에요. 노란색이 medium, 그 아래가 low예요.
    example: That's a high-priority alarm — go now.
    exKo: 그건 최우선 알람이에요, 지금 가요.
  - kind: context
    words: [w-limit, w-baseline]
    scenes:
    - {who: 동료 간호사에게, icon: speech, en: 'His baseline heart rate is 110, so let''s set the high limit at 130.', ok: true}
    - {who: 차트 기록, icon: board, en: HR alarm limits adjusted to pt baseline., ok: true}
