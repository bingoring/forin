# [상황 번호, 문장 번호, ko, why]
sentence_ko:
  - [18, 3, "리듬이 자꾸 이런 위험한 연발 박동으로 넘어가요.", "dangerous runs(연발 박동)가 '위험한 상태'로 흐리게 옮겨져 있었다"]

word_edits:
  w-short: {en: short of breath, ipa: /ʃɔːrt əv brɛθ/, why: "헤드워드 short에 ko '숨이 찬'이 붙어 있었다 — 구 단위(short of breath)로"}
  w-board: {en: on board, ipa: /ɑn bɔːrd/, why: "헤드워드 board에 ko '투여 중인'이 붙어 있었다 — 구 단위(on board)로"}
  w-away: {en: right away, ipa: /raɪt əˈweɪ/, ko: 곧바로, why: "헤드워드 away에 ko '즉시'가 붙어 있었다 — 구 단위(right away)로, w-immediately(즉시)와 ko를 가른다"}
  w-right: {ko: 맞는; 바로, example: "Your heart is beating faster than normal right now.", why: "right away를 w-away로 넘긴 뒤 남은 문장은 right now·right after(바로)와 the right level(맞는)"}
  w-call: {ko: 부르다; 요청하다, why: "태그된 문장 대부분이 call for(요청하다)"}
  w-skip: {ko: (박동을) 건너뛰다, why: "heart skip은 박동을 건너뛰는 것이지 '두근거리다'가 아니다 — 문장 ko도 '건너뛰거나'"}
  w-replace: {ko: 보충하다, why: "replace potassium은 '교체'가 아니라 '보충' — 다른 ICU 주제의 w-replace(보충하다)와도 맞춘다"}
  w-push: {ko: 밀어 넣다; 힘주다, example: "We push epinephrine every few minutes during the code.", why: "태그된 문장 대부분이 약을 push(밀어 넣어 투여)하는 뜻 — 다른 ICU 주제(밀어 넣다)와도 맞춘다"}
  w-risk: {ko: 위험성, why: "w-danger(위험)와 ko가 같았다 — risk for torsades는 '위험성'"}
  w-beat: {ko: 박동; 뛰다, why: "태그된 문장 셋 중 둘이 명사(a beat·more beats)"}
  w-slow: {ko: 느린; 늦추다, why: "태그된 문장이 형용사(slow rate·slower)와 동사(slow the rate)"}
  w-fast: {ko: 빠른; 빠르게, why: "태그된 문장이 형용사(fast rhythm)와 부사(dropping fast·works fast)"}
  w-break: {ko: (갑자기 ~로) 넘어가다, why: "break into는 리듬이 갑자기 넘어가는 것 — '나타나다'보다 정확하게"}

remove_why:
  w-breath: "short of breath를 w-short 한 카드로 가르친다"
  w-up: "draw up의 up을 '위로'로 가르쳤다 — 뜻이 틀린 카드"
