word_edits:
  w-even: {en: even though, ipa: /ˈiːvən ðoʊ/, ko: 비록 ~이지만, why: "even(~조차)이 even though로만 쓰였다 — 구 단위 헤드워드로, w-though를 합친다"}
  w-aid: {en: hearing aid, ipa: /ˈhɪrɪŋ eɪd/, ko: 보청기, why: "aid(보조기기)가 hearing aids로만 쓰였다 — 구 단위로, core-language-icu와 맞춘다"}
  w-lighten: {ko: 얕게 하다, why: "'얕추다'는 표준어가 아니다"}
  w-clear: {ko: 맑아지다; 비우다, why: "태그된 문장이 clears the confusion·fully clear(맑아지다)와 clear the area(비우다) — 부사 clearly는 w-clearly로 갈랐다"}
  w-turn: {ko: 돌리다; 변하다, why: "태그된 문장이 turn off·turn him on his side·turning red인데 ko가 '끄다'뿐이었다"}
  w-back: {ko: 다시(원래대로), why: "남은 문장이 get back to themselves — icu-ards-proning과 맞춘다"}
  w-cause: {ko: 원인; 일으키다, why: "태그된 문장 셋 중 둘이 동사(cause injury·caused by) — 다른 ICU 주제(일으키다)와 맞춘다"}
  w-calm: {ko: 차분한, why: "태그된 문장 다섯 중 넷이 형용사(he's calm·a calm patient·calmer) — icu-airway와 맞추고, w-deescalate(진정시키다)와 ko를 가른다"}
  w-medication: {ko: 약물, why: "'투약'은 행위라 group his medications·any medication과 맞지 않는다 — 다른 ICU 주제(약물)와 맞춘다"}
  w-drug: {ko: 약, why: "w-medication을 '약물'로 맞추며 ko가 겹친다 — icu-airway·icu-aki-crrt(약)와 맞춘다"}
  w-med: {ko: 약(줄임말), why: "w-drug(약)와 ko가 같아 듣고 뜻 고르기에서 정답이 둘이 된다 — med는 medication의 구어 줄임말"}
  w-iv: {ko: 정맥주사, why: "다른 ICU 주제(정맥주사)와 맞춘다"}
  w-qt: {ko: QT간격, why: "icu-arrhythmia와 맞춘다"}
  w-stat: {ko: 즉시(시행), why: "w-immediately(즉시)와 ko가 같다 — icu-arrhythmia와 맞춘다"}
  w-flag: {ko: 표시해 알리다, why: "w-update(알리다)와 ko가 같다 — icu-ards-proning과 맞춘다"}
  w-assess: {ko: 사정하다, why: "'살피다'는 간호 용어가 아니다 — 다른 ICU 주제(사정하다)와 맞춘다"}
  w-cluster: {ko: 몰아서 하다, why: "w-group·w-tie와 ko(묶다)가 셋이 같다 — cluster care는 처치를 한 번에 몰아서 하는 것"}
  w-group: {ko: 한데 모으다, why: "w-cluster·w-tie와 ko(묶다)가 셋이 같다"}
  w-shorten: {ko: 단축하다, why: "w-reduce(줄이다)와 ko가 같다 — shorten delirium은 기간을 줄이는 것"}
  w-escalate: {ko: (용량을) 올리다, why: "w-increase(늘리다)와 ko가 같다 — escalate the dose"}
  w-danger: {ko: 위험한 존재, why: "w-risk(위험)와 ko가 같다 — a danger to himself"}
  w-completely: {ko: 전적으로, why: "w-fully(완전히)와 ko가 같다"}
  w-note: {ko: 적어 두다, why: "w-document(기록하다)와 ko가 같다"}
