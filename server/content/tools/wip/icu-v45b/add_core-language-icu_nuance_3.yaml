"소통 오류 확인·재확립":
  - kind: pair
    words: [w-page, w-try, w-again, w-quite, w-mean]
    pairs: [["on the same", "page"], ["let me try", "again"], ["That's not quite what I", "meant"]]
    decoys: ["mind"]
    why: "on the same page는 '같은 이해를 하고 있다', not quite what I meant는 '말하려던 것과 조금 다르다'예요. 오해가 생기면 상대를 탓하지 않고 내 설명을 고치겠다고 해요."
  - kind: swap
    words: [w-explain, w-part, w-poorly, w-try]
    who: "보호자에게 · 앞서 생긴 오해를 바로잡을 때"
    icon: home
    before: ["", "You misunderstood me", " — let me try again."]
    options: ["I think I explained that part poorly", "You misunderstood me", "You weren't listening"]
    answer: "I think I explained that part poorly"
    notes:
      "I think I explained that part poorly": "책임을 간호사 쪽에 둔다 — 상대가 다시 묻기 편해진다."
      "You misunderstood me": "오해의 책임을 상대에게 돌린다."
      "You weren't listening": "비난으로 들려 대화가 막힌다."
    why: "티치백에서 틀린 답이 나오면 '제 설명이 부족했어요'라고 말해요. 티치백은 상대를 시험하는 게 아니라 내 설명을 확인하는 방법이에요."
"급변 중 언어장벽 위기 소통":
  - kind: slider
    words: [w-trouble, w-breathe]
    cue: "To the family: her oxygen is dropping and she is working hard to breathe — but she is breathing."
    scale: ["a little short of breath", "having trouble breathing", "not breathing"]
    answerAt: 1
    why: "보호자에게는 지금 상태를 사실보다 가볍게도 무겁게도 말하지 않아요. 숨은 쉬지만 몹시 힘들어하면 having trouble breathing이에요. not breathing은 호흡이 멎은 상태라 전혀 다른 말이에요."
    example: "She's having trouble breathing, and we're helping her now."
    exKo: "숨쉬기 힘들어하셔서 지금 저희가 돕고 있어요."
  - kind: context
    words: [w-stay, w-interpreter, w-phone]
    scenes:
      - {who: "공황 상태 보호자에게", icon: home, en: "The interpreter phone is coming — stay with me.", ok: true}
      - {who: "동료에게", icon: speech, en: "Get the Spanish line on speaker — family's at the bedside.", ok: true}
      - {who: "공황 상태 보호자에게", icon: home, en: "The language line is being accessed; please remain here.", ok: false, fix: "The interpreter is coming — stay with me."}
    why: "급할수록 짧고 쉬운 말이 좋아요. language line·being accessed·remain처럼 딱딱한 말은 영어가 서툰 보호자에게 더 안 들려요."
  - kind: swap
    words: [w-right, w-here]
    who: "공황 상태 보호자에게"
    icon: home
    before: ["", "Calm down", " — more help is coming."]
    options: ["I'm right here", "Calm down", "Don't panic"]
    answer: "I'm right here"
    notes:
      "I'm right here": "곁에 있다는 사실을 말해 안심시킨다."
      "Calm down": "감정을 누르라는 명령으로 들려 오히려 불안과 반발을 키우기 쉽다."
      "Don't panic": "명령조이고, '패닉'이라는 말이 공포를 다시 떠올리게 한다."
    why: "겁에 질린 보호자에게 감정을 멈추라고 하기보다, 곁에 있다는 것과 지금 무엇을 하고 있는지를 짧게 말해요."
"나쁜 소식 통역 상황":
  - kind: pair
    words: [w-sorry, w-share, w-difficult, w-news, w-take, w-need]
    pairs: [["share difficult", "news"], ["I'm so", "sorry"], ["take all the time", "you need"]]
    decoys: ["gently"]
    why: "I'm so sorry는 사과가 아니라 '안타깝다'는 공감의 말이에요. 나쁜 소식 앞에 두고, 그 뒤에는 가족이 받아들일 시간을 줘요(take all the time you need)."
  - kind: swap
    words: [w-interpreter, w-convey, w-gently, w-completely]
    who: "보호자에게 · '통역사에게 부드럽게 말해 달라'고 할 때"
    icon: home
    before: ["The interpreter will convey this ", "softly, skipping the worst parts", "."]
    options: ["gently and completely", "softly, skipping the worst parts", "only partly"]
    answer: "gently and completely"
    notes:
      "gently and completely": "말투는 부드럽게, 내용은 빠짐없이 — 의료 통역의 원칙 그대로다."
      "softly, skipping the worst parts": "의료 통역사는 내용을 빼거나 바꾸지 않는다 — 지킬 수 없는 약속이다."
      "only partly": "가족이 결정에 필요한 정보를 받지 못하게 된다."
    why: "가족이 '부드럽게'를 부탁해도 의료 통역사는 들은 말을 빠짐없이 정확히 옮겨야 해요(정확성·완전성 원칙). 부드럽게 할 수 있는 건 말투와 속도예요."
"임종 결정 언어장벽":
  - kind: pair
    words: [w-single, w-right, w-answer, w-long, w-need, w-decide, w-alone]
    pairs: [["no single right", "answer"], ["the interpreter will stay for as long as", "you need"], ["you're not deciding", "alone"]]
    decoys: ["news"]
    why: "There's no single right answer는 정답이 없는 결정이라는 것을 인정하는 말, You're not deciding alone은 결정의 무게를 함께 진다는 말이에요."
  - kind: swap
    words: [w-decide, w-want]
    who: "대리 결정하는 가족에게"
    icon: home
    before: ["Let's decide based on ", "what you want for him", "."]
    options: ["what he would have wanted", "what you want for him", "what we think is best"]
    answer: "what he would have wanted"
    notes:
      "what he would have wanted": "대리 결정의 기준 — 환자가 말할 수 있었다면 무엇을 골랐을지."
      "what you want for him": "가족 자신의 바람이 기준이 되면 환자의 뜻이 빠진다."
      "what we think is best": "의료진은 권고를 할 수 있지만, 기준을 의료진의 생각으로 바꾸면 환자의 가치가 빠진다."
    why: "대리 결정에서는 환자 본인이 원했을 것(substituted judgment)을 기준으로 해요. 환자의 뜻을 알 수 없을 때에만 환자에게 가장 이로운 것(best interest)을 기준으로 삼아요."
"동의 능력·언어 혼재 판단":
  - kind: pair
    words: [w-explain, w-choice, w-happen, w-agree, w-mix, w-language]
    pairs: [["explain the choice", "back to us"], ["what happens if he", "agrees"], ["mixing", "languages"]]
    decoys: ["mean"]
    why: "판단 능력은 설명을 이해하고, 자기 상황에 적용하고, 따져 보고, 선택을 말할 수 있는지로 봐요. 그래서 선택을 되설명하게(explain the choice back) 하고, 동의하면 무슨 일이 생기는지(what happens if he agrees) 물어요."
  - kind: context
    words: [w-language, w-understand]
    scenes:
      - {who: "동료에게", icon: speech, en: "Code-switching isn't confusion — let's assess capacity with an interpreter.", ok: true}
      - {who: "차트 기록", icon: board, en: "Capacity assessed via Spanish interpreter; pt able to state risks, benefits, and alternatives.", ok: true}
      - {who: "보호자에게", icon: home, en: "Code-switching doesn't indicate impaired decisional capacity.", ok: false, fix: "Mixing languages doesn't mean he can't understand."}
    why: "code-switching(언어 섞어 쓰기)·decisional capacity는 의료진끼리의 말이에요. 보호자에게는 같은 뜻을 쉬운 말로 해요. 언어를 섞어 쓴다는 것만으로 판단 능력이 없다고 보지 않아요."
"통역 부재 응급 대응":
  - kind: pair
    words: [w-hold, w-phone, w-interpreter, w-line, w-picture, w-board]
    pairs: [["hold", "on"], ["phone interpreter", "line"], ["picture", "board"]]
    decoys: ["side"]
    why: "hold on은 '조금만 버텨요', phone interpreter line은 전화로 바로 연결되는 통역 서비스(많은 미국 병원이 24시간 운영해요), picture board는 그림을 가리켜 뜻을 전하는 판이에요."
  - kind: swap
    words: [w-ask, w-simple, w-yes, w-no, w-question]
    who: "통역이 오기 전 · 겁에 질린 환자에게"
    icon: me
    before: ["I'll ask ", "open-ended", " questions for now."]
    options: ["simple yes or no", "open-ended", "detailed"]
    answer: "simple yes or no"
    notes:
      "simple yes or no": "고개·손짓으로 답할 수 있다 — 안전에 필요한 것만 먼저 확인한다."
      "open-ended": "말로 길게 답해야 해서 통역 없이는 알아들을 수 없다."
      "detailed": "통역 없이 세부를 주고받으면 오해가 생긴다 — 통역이 연결된 뒤로 미룬다."
    why: "통역이 오기 전에는 생명·안전에 필요한 최소 정보만 예·아니오로 확인하고, 세부 내용은 통역이 연결되면 다시 확인해요."
"문화 갈등·치료 거부 소통":
  - kind: pair
    words: [w-approach, w-honor, w-value, w-ground, w-concern]
    pairs: [["an approach that honors", "your values and his safety"], ["find common", "ground"], ["Tell me more about what", "concerns you"]]
    decoys: ["force"]
    why: "common ground는 양쪽이 함께 설 수 있는 지점, honors your values는 가족의 가치를 받든다는 말이에요. 치료 거부 앞에서도 설득보다 먼저 무엇이 걱정인지 들어요(what concerns you)."
  - kind: swap
    words: [w-respect, w-belief, w-understand]
    who: "보호자에게 · 신념 때문에 치료를 거부할 때"
    icon: home
    before: ["", "I tolerate your beliefs", " and want to understand them."]
    options: ["I respect your beliefs", "I tolerate your beliefs", "I question your beliefs"]
    answer: "I respect your beliefs"
    notes:
      "I respect your beliefs": "존중을 먼저 말하고 이해하려는 뜻을 보인다."
      "I tolerate your beliefs": "'참아 준다'는 뜻이라 내려다보는 말로 들린다."
      "I question your beliefs": "신념을 따지겠다는 말로 들려 대화가 닫힌다."
    why: "치료 거부의 이유가 신념일 때는 존중을 먼저 말하고 듣는 데서 시작해요. 그 뒤 통역사·윤리팀과 함께 환자 안전과 가족의 가치를 함께 살릴 방법을 찾아요."
