지속 심전도 모니터·리드 관리:
  - kind: pair
    words: [w-reposition, w-lead, w-arm, w-still, w-clean, w-tracing]
    pairs: [[reposition, the leads], [keep your arm, still], [a clean, tracing]]
    decoys: [of sweat]
    why: "reposition은 리드를 떼어 '다시 붙이다', keep ... still은 '가만히 있게 하다', clean tracing은 잡음 없는 파형이에요."
  - kind: context
    words: [w-squiggle, w-movement, w-tracing]
    scenes:
      - {who: 차트 기록, icon: board, en: "Motion artifact on tele; leads repositioned, tracing clean.", ok: true}
      - {who: 동료에게, icon: speech, en: "That's just motion artifact — I'm fixing his leads.", ok: true}
      - {who: 환자에게, icon: me, en: "That's motion artifact on your tracing.", ok: false, fix: "Some of that squiggle is just movement, not your heart."}
    why: "artifact·tracing은 의료진끼리의 말이에요. 깨어 있는 환자에게는 '움직여서 생긴 선이지 심장 문제가 아니다'를 쉬운 말로 해요."
새 부정맥 인지·기록:
  - kind: pair
    words: [w-print, w-strip, w-notify, w-physician, w-newonset, w-atrial, w-fibrillation]
    pairs: [[print, a strip], [notify, the physician], [new-onset, atrial fibrillation]]
    decoys: [a pulse]
    why: "리듬 스트립은 print하고, 의사에게는 notify하고, 처음 생긴 부정맥은 new-onset을 앞에 붙여요."
  - kind: swap
    words: [w-change, w-newonset]
    who: "담당의에게 전화 보고"
    icon: speech
    before: ["Hi, this is the nurse in 12 — his rhythm ", "went crazy", " a few minutes ago."]
    options: [changed to new-onset a-fib, went crazy, got kind of weird]
    answer: changed to new-onset a-fib
    notes: {changed to new-onset a-fib: "무엇이 언제 바뀌었는지 한 번에 전한다. 의사가 바로 판단할 수 있다.", went crazy: "놀란 느낌만 전하고 어떤 리듬인지 알 수 없다.", got kind of weird: "흐릿해서 의사가 다시 물어야 한다."}
    why: "의사에게 하는 보고는 감정이 아니라 리듬 이름과 시점으로 해요."
항부정맥제 주입 준비:
  - kind: slider
    words: [w-drop, w-pressure]
    cue: "로딩 중 혈압 112/70 → 104/66 → 98/62, 환자는 증상 없음"
    scale: [drifting down, dropping, crashing]
    answerAt: 0
    why: "조금씩 내려가는 중이면 drifting down. dropping은 뚜렷하게 떨어질 때, crashing은 급격히 무너질 때라 팀이 바로 뛰어와요."
    example: "His pressure is drifting down during the load — I'm watching it."
    exKo: "로딩 중에 혈압이 조금씩 내려가고 있어요, 지켜보고 있어요."
  - kind: swap
    words: [w-away, w-call, w-drop]
    who: "동료에게 · 로딩 중 부탁"
    icon: speech
    before: ["Call me ", "at your earliest convenience", " if his blood pressure drops."]
    options: [right away, at your earliest convenience, later]
    answer: right away
    notes: {right away: "곧바로. 혈압이 떨어지는 건 기다릴 일이 아니라는 게 분명하다.", at your earliest convenience: "이메일체 격식 표현이라 급함이 사라진다.", later: "'나중에'로 들려 미뤄도 된다는 뜻이 된다."}
    why: "급한 부탁은 짧고 분명하게 — 공손한 격식이 오히려 긴급도를 지워요."
심박수·혈압 동반 사정:
  - kind: slider
    words: [w-sometimes, w-fast, w-lower]
    cue: "환자에게: 빠른 리듬이 늘 혈압을 떨어뜨리는 건 아니지만, 그럴 때가 있다"
    scale: [rarely, sometimes, often]
    answerAt: 1
    why: "sometimes는 '그럴 때도 있다'. often이면 더 겁을 주고, rarely면 환자가 어지러움을 말하지 않을 수 있어요."
    example: "A fast rhythm can sometimes lower your pressure."
    exKo: "빠른 리듬은 가끔 혈압을 낮출 수 있어요."
  - kind: context
    words: [w-beat, w-normal]
    scenes:
      - {who: 차트 기록, icon: board, en: "HR 148, irregular; BP 96/58; pt reports lightheadedness.", ok: true}
      - {who: 동료에게, icon: speech, en: "He's tachy in the 140s and his pressure's soft.", ok: true}
      - {who: 환자에게, icon: me, en: "You're tachy and your pressure's soft.", ok: false, fix: "Your heart is beating faster than normal right now."}
    why: "tachy·soft는 동료끼리 쓰는 줄임말이에요. 환자에게는 같은 사실을 쉬운 말로 해요."
K·Mg 전해질 채혈:
  - kind: slider
    words: [w-low, w-potassium, w-level]
    cue: "K 3.1 (정상 3.5–5.0) — 낮지만 검사실이 전화로 알리는 위급값까지는 아니다"
    scale: [borderline low, low, critically low]
    answerAt: 1
    why: "critically low는 위급값(critical value)에 쓰는 말이에요. 3.1은 그냥 low — 그래도 부정맥 환자라 바로 보고하고 보충을 준비해요."
    example: "His potassium is low at 3.1 — I'll report it and anticipate replacement."
    exKo: "칼륨이 3.1로 낮아요, 보고하고 보충을 준비해 둘게요."
  - kind: reel
    words: [w-draw]
    word: draw
    scenes:
      - {who: "동료에게", en: "I'll draw a potassium and magnesium level now.", ko: "지금 칼륨과 마그네슘 수치를 뽑을게요.", tone: 담담}
      - {who: "코드 중", en: "Draw up one milligram of atropine.", ko: "아트로핀 1mg 뽑아 주세요.", tone: 급함}
      - {who: "차트 기록", en: "K and Mg drawn and sent stat.", ko: "K·Mg 채혈, 응급으로 보냄.", tone: 건조}
      - {who: "환자에게는…", en: "I'm going to take a little blood to check your levels.", ko: "수치를 확인하려고 피를 조금 뽑을게요.", tone: 부드러움, swap: true}
텔레메트리 경보 응답:
  - kind: slider
    words: [w-real, w-artifact]
    cue: "'VT' 알람 — 가 보니 환자가 반응이 없고 경동맥이 안 잡힌다"
    scale: [probably artifact, might be real, definitely real]
    answerAt: 2
    why: "직접 확인해서 맞으면 단정해서 말해요 — 'This one's real.' 확인하기 전에는 might be real이고, 그래도 먼저 환자에게 가요."
    example: "This one's real, not artifact — I'm assessing him now."
    exKo: "이건 진짜예요, 아티팩트가 아니에요, 지금 사정하고 있어요."
  - kind: context
    words: [w-artifact, w-alarm]
    scenes:
      - {who: 동료에게, icon: speech, en: "That's artifact — he's just brushing his teeth.", ok: true}
      - {who: 차트 기록, icon: board, en: "Tele alarm: artifact from movement; pt asymptomatic.", ok: true}
      - {who: 보호자에게, icon: me, en: "Don't worry, that's just artifact.", ok: false, fix: "That alarm went off because he moved — I checked him, and his heart is okay."}
    why: "보호자는 artifact라는 말을 몰라요. 왜 울렸는지와 직접 확인했다는 것을 쉬운 말로 전해요."
새 심방세동 RVR 관리:
  - kind: slider
    words: [w-unstable]
    cue: "a-fib 150대, BP 78/40, 묻는 말에 엉뚱하게 대답한다"
    scale: [stable, borderline, unstable]
    answerAt: 2
    why: "저혈압과 의식 변화가 있으면 unstable이에요. 이 말이 나오면 팀은 약으로 속도를 늦추는 대신 동기화 심율동전환을 준비해요."
    example: "If she becomes unstable, we'll move straight to cardioversion."
    exKo: "불안정해지면 바로 심율동전환으로 갈 거예요."
  - kind: swap
    words: [w-afib, w-slow]
    who: "보호자에게 · 리듬 설명"
    icon: me
    before: ["Her heart is ", "in a-fib with RVR", " right now, and we're giving medicine to slow it down."]
    options: [beating fast and irregularly, in a-fib with RVR, going haywire]
    answer: beating fast and irregularly
    notes: {beating fast and irregularly: "보호자가 알아듣는 말로 사실 그대로 전한다.", in a-fib with RVR: "동료끼리의 약어라 보호자는 못 알아듣는다.", going haywire: "'고장 났다'처럼 들려 불안을 키운다."}
    why: "같은 리듬이라도 보호자에게는 무엇이 일어나는지를 쉬운 말로 설명해요."
