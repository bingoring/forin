- kind: word
  id: w-overwhelming
  fields: [ko]
  why: 감정의 overwhelming은 '압도적인'이 아니라 '감당하기 벅찬'
- kind: word
  id: w-step
  fields: [ko]
  why: 태그된 문장 대부분이 절차·단계(these steps, step by step, next steps) — '걸음'과 안 맞음
- kind: word
  id: w-support
  fields: [ko]
  why: 호흡 보조(the support he needs)·지원 서비스·애도 지원 — '지지'보다 '지원'이 문장들과 맞음
- kind: word
  id: w-rate
  fields: [ko]
  why: w-level과 ko(수치)가 같아 듣고 뜻 고르기에서 정답이 둘 — heart rate의 rate로 가름
- kind: word
  id: w-speak
  fields: [ko]
  why: w-say와 ko(말하다)가 같음 — speak for(대변하다) 용례까지 담아 가름
- kind: word
  id: w-wish
  fields: [ko]
  why: w-hope와 ko(바라다)가 같음 — I wish I could… 용법으로 가름
- kind: word
  id: w-outcome
  fields: [ko]
  why: w-result와 ko(결과)가 같음 — 예후로서의 결과로 가름
- kind: word
  id: w-respond
  fields: [ko]
  why: w-react와 ko(반응하다)가 같음 — responding to treatment 용법으로 가름
- kind: word
  id: w-believe
  fields: [ko]
  why: w-think와 ko(생각하다)가 같음 — 의료진 판단(We believe…)으로 가름
- kind: word
  id: w-update
  fields: [ko]
  why: 문장(hear the same update)에서 명사인데 ko가 동사(알려주다)
- kind: word
  id: w-get
  fields: [ko]
  why: 문장이 'get you a quiet space'(공간을 마련해 주다) — '데려다주다'와 안 맞음
- kind: word
  id: w-slow
  fields: [ko]
  why: 태그된 문장 3개 중 2개가 동사(slow down) — 형용사 뜻만으로는 안 맞음
- kind: word
  id: w-answer
  fields: [ko]
  why: 태그된 문장 5개 중 3개가 명사(a certain answer, straight answers, no wrong answer) — 동사 뜻만으로는 안 맞음
- kind: word
  id: w-rush
  fields: [ko]
  why: 유일한 문장이 'there's no rush'(명사) — ko가 동사(서두르다)
