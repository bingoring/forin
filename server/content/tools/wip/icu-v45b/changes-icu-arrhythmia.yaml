- kind: word-remove
  id: w-let
  why: 간호사가 이미 아는 말(let) — know를 뺀 뒤 let 홀로는 가르칠 값이 없다 — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-know
  why: 공통 쉬운 단어(know) — 어느 문장도 태그하지 않게 됐다
