- kind: word-remove
  id: w-up
  why: draw up의 up을 '위로'로 가르쳤다 — 뜻이 틀린 카드 — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-hour
  why: 공통 쉬운 단어(hour) — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-get
  why: 간호사가 이미 아는 말(get) — 문장마다 뜻이 달라(받다·하다·부르다) 카드 하나로 가르칠 수 없다 — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-time
  why: 공통 쉬운 단어(time) — timed를 '시간을 맞추다'로 가르칠 값이 적다 — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-anything
  why: 간호사가 이미 아는 말(anything) — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-need
  why: 간호사가 이미 아는 말(need) — 어느 문장도 태그하지 않게 됐다
