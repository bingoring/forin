- kind: word
  id: w-board
  fields:
  - en
  - ipa
  why: 헤드워드 board에 ko '투여 중인'이 붙어 있었다 — 구 단위(on board)로
- kind: word
  id: w-away
  fields:
  - en
  - ko
  - ipa
  why: 헤드워드 away에 ko '즉시'가 붙어 있었다 — 구 단위(right away)로, w-immediately(즉시)와 ko를 가른다
- kind: word
  id: w-right
  fields:
  - ko
  - example
  why: right away를 w-away로 넘긴 뒤 남은 문장은 right now·right after(바로)와 the right level(맞는)
- kind: word
  id: w-call
  fields:
  - ko
  why: 태그된 문장 대부분이 call for(요청하다)
- kind: word
  id: w-skip
  fields:
  - ko
  why: heart skip은 박동을 건너뛰는 것이지 '두근거리다'가 아니다 — 문장 ko도 '건너뛰거나'
- kind: word
  id: w-replace
  fields:
  - ko
  why: replace potassium은 '교체'가 아니라 '보충' — 다른 ICU 주제의 w-replace(보충하다)와도 맞춘다
- kind: word
  id: w-push
  fields:
  - ko
  - example
  why: 태그된 문장 대부분이 약을 push(밀어 넣어 투여)하는 뜻 — 다른 ICU 주제(밀어 넣다)와도 맞춘다
- kind: word
  id: w-risk
  fields:
  - ko
  why: w-danger(위험)와 ko가 같았다 — risk for torsades는 '위험성'
- kind: word
  id: w-beat
  fields:
  - ko
  why: 태그된 문장 셋 중 둘이 명사(a beat·more beats)
- kind: word
  id: w-slow
  fields:
  - ko
  why: 태그된 문장이 형용사(slow rate·slower)와 동사(slow the rate)
- kind: word
  id: w-fast
  fields:
  - ko
  why: 태그된 문장이 형용사(fast rhythm)와 부사(dropping fast·works fast)
- kind: word
  id: w-break
  fields:
  - ko
  why: break into는 리듬이 갑자기 넘어가는 것 — '나타나다'보다 정확하게
- kind: word-remove
  id: w-now
  why: 공통 쉬운 단어(now) — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-doctor
  why: 공통 쉬운 단어(doctor) — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-minute
  why: 공통 쉬운 단어(minute) — 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-tell
