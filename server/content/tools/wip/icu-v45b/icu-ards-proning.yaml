- title: ARDS 산소화 지표 이해
  sentences:
  - en: That ratio tells us how well his lungs are moving oxygen into his blood.
    ko: 그 비율은 폐가 혈액으로 산소를 얼마나 잘 보내는지 알려줘요.
    chunks:
    - That ratio
    - tells us
    - how well his lungs
    - are moving oxygen
    - into his blood
    - .
    words:
    - w-ratio
    - w-lung
    - w-move
    - w-oxygen
    - w-blood
    goal: 1
  - en: A lower number means his lung injury is more severe right now.
    ko: 숫자가 낮을수록 지금 폐 손상이 더 심하다는 뜻이에요.
    chunks:
    - A lower number
    - means
    - his lung injury
    - is more severe
    - right now
    - .
    words:
    - w-number
    - w-mean
    - w-lung
    - w-injury
    - w-severe
    - w-low
    goal: 1
  - en: We track it to see whether his lungs are improving.
    ko: 폐가 좋아지고 있는지 보려고 이 수치를 계속 지켜봐요.
    chunks:
    - We track it
    - to see
    - whether his lungs
    - are improving
    - .
    words:
    - w-track
    - w-lung
    - w-improve
    goal: 2
  - en: It compares the oxygen in his blood to the oxygen he's breathing in.
    ko: 혈액 속 산소와 들이마시는 산소를 비교하는 거예요.
    chunks:
    - It compares
    - the oxygen in his blood
    - to the oxygen
    - he's breathing in
    - .
    words:
    - w-compare
    - w-oxygen
    - w-blood
    - w-breathe
    goal: 1
  - en: I'll explain what each new number means as we go.
    ko: 새 수치가 나올 때마다 무슨 뜻인지 설명해 드릴게요.
    chunks:
    - I'll explain
    - what each new number
    - means
    - as we go
    - .
    words:
    - w-explain
    - w-each
    - w-number
    - w-mean
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-severe
    - w-injury
    cue: P/F ratio 90 — 의사가 보호자에게 ARDS 중증도를 설명한 직후
    scale:
    - mild
    - moderate
    - severe
    answerAt: 2
    why: 베를린 정의로 P/F 300 이하는 mild, 200 이하는 moderate, 100 이하는 severe ARDS예요. 보호자에게는 숫자보다 '지금 폐 손상이 심한 단계'라는 뜻을 전해요.
    example: A lower number means his lung injury is more severe right now.
    exKo: 숫자가 낮을수록 지금 폐 손상이 더 심하다는 뜻이에요.
  - kind: swap
    words:
    - w-ratio
    - w-oxygen
    - w-move
    who: 보호자에게 · 수치 설명
    icon: me
    before:
    - 'That number tells us '
    - the PaO2 over the FiO2
    - .
    options:
    - how well his lungs are moving oxygen
    - the PaO2 over the FiO2
    - whether he will survive
    answer: how well his lungs are moving oxygen
    notes:
      how well his lungs are moving oxygen: 그 수치가 무엇을 보여 주는지 보호자가 알아듣는 말로 말해요.
      the PaO2 over the FiO2: 계산식은 맞지만 의료진끼리의 말이라 보호자에게는 뜻이 전해지지 않아요.
      whether he will survive: 수치 하나로 생존을 말할 수는 없어요. 사실보다 무겁게 들려 불안만 키워요.
    why: 보호자는 계산식이 아니라 '이 숫자가 그에게 무슨 뜻이냐'를 물어요. 그 질문에 쉬운 말로 답해요.
  - kind: context
    words:
    - w-number
    - w-improve
    scenes:
    - who: 동료에게 인계
      icon: speech
      en: His P/F is up from 110 to 150 since yesterday.
      ok: true
    - who: 차트 기록
      icon: board
      en: P/F 150 (prev 110).
      ok: true
    - who: 보호자에게
      icon: me
      en: His P/F went from 110 to 150.
      ok: false
      fix: His oxygen number is better than yesterday, which is a good sign.
    why: 같은 호전이라도 보호자에게는 약어와 숫자 대신 '어제보다 나아졌다'는 뜻으로 말해요. 한 번 나아진 것을 회복 약속처럼 말하지는 않아요.
