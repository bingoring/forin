word_edits:
  w-prone: {ko: 복와위로 눕히다, why: "태그된 문장 대부분이 proning·proned(간호사가 눕히는 것) — '엎드리다'(자동사)가 아니라 '눕히다'로"}
  w-call: {ko: 부르다·연락하다, why: "태그된 문장 대부분이 call the doctor·code·team(부르다·연락하다) — '외치다'는 call the count 하나뿐"}
  w-steady: {ko: 흔들림 없는, why: "부사 ko(안정적으로)가 형용사 용법(keeps it steady·have been steady)과 어긋나고, w-stable(안정된)과도 겹친다"}
  w-tof: {ko: 4연속 자극(줄임말), why: "ko에 정답 영어 TOF가 그대로 들어 있어 회상 문제가 되지 않는다 — w-vent·w-sat처럼 줄임말 표시"}
  w-train-of-four: {ko: 4연속 자극, why: "ko의 (TOF)가 줄임말 카드 w-tof의 정답을 드러낸다"}
  w-vent: {ko: 인공호흡기(줄임말), why: "w-ventilator와 ko가 같아 듣고 뜻 고르기에서 정답이 겹친다"}
  w-sat: {ko: 산소포화도(줄임말), why: "w-saturation과 ko가 같아 듣고 뜻 고르기에서 정답이 겹친다"}
  w-confirm: {ko: 확실히 확인하다, why: "w-check(확인하다)와 ko가 같아 듣고 뜻 고르기에서 정답이 겹친다"}
  w-keep: {ko: 계속 ~하게 두다, why: "w-maintain(유지하다)과 ko가 같다 — keep X low·free·moist 용법에 맞춰"}
  w-flag: {ko: 표시해 알리다, why: "w-mark(표시하다)와 ko가 같다 — 차트에 표시해 팀에 알리는 뜻으로"}
  w-number: {ko: 수치, why: "태그된 문장이 모두 검사·바이탈 수치(numbers look better 등) — '숫자'보다 '수치'"}
  w-couple: {ko: 두어(두세), why: "every couple of hours의 couple — '두어 개'는 시간에 맞지 않는 단위"}
  w-ago: {ko: (지금부터) ~ 전, why: "w-before(전에)와 ko가 같아 듣고 뜻 고르기에서 정답이 겹친다"}
  w-deeply: {ko: 깊게, why: "w-depth(깊이)와 ko가 같아 듣고 뜻 고르기에서 정답이 겹친다"}

remove_why:
  w-lower: w-low와 겹치는 비교급 카드 — 유일한 태그를 w-low로 옮겼다
