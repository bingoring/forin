사건 보고·학습 문화:
  - kind: slider
    words: [w-nearmiss, w-harm]
    cue: "The wrong insulin bag was caught at the bedside scan — it never reached the patient."
    scale: [near-miss, no-harm event, adverse event]
    answerAt: 0
    why: "환자에게 닿기 전에 잡았으면 near-miss, 닿았지만 해가 없었으면 no-harm event, 해가 생겼으면 adverse event예요. 셋 다 보고 대상이에요."
    example: "That was a near-miss, but we still report it."
    exKo: "아차 사고였지만 그래도 보고해요."
  - kind: context
    words: [w-blame, w-report]
    scenes:
      - {who: 동료 간호사에게, icon: speech, en: "Reporting isn't about blame — it's about learning.", ok: true}
      - {who: 사건 보고서, icon: board, en: "Insulin bag mislabeled; caught at bedside scan. No patient harm.", ok: true}
      - {who: 동료 간호사에게, icon: speech, en: "You'd better report this, or it's on you.", ok: false, fix: "Let's write this up together — it helps the whole unit learn."}
    why: "보고를 벌처럼 말하면 다음엔 숨기게 돼요. 비난하지 않는 문화(just culture)에서는 함께 쓰고 배우자고 말해요."
라인·튜브 치명적 오류 대응:
  - kind: slider
    words: [w-immediate, w-stop, w-infusion]
    cue: "Tube feeding is running into his IV line right now."
    scale: [soon, promptly, immediately]
    answerAt: 2
    why: "지금 이 순간 해를 끼치고 있으면 immediately. promptly는 '지체 없이', soon은 '곧'이라 조금 미뤄도 되는 일에 써요."
    example: "Stop the infusion and disconnect it immediately."
    exKo: "주입을 멈추고 즉시 분리하세요."
  - kind: swap
    words: [w-physician, w-line, w-happen]
    who: "의사 콜 · 오연결 보고"
    icon: monitor
    before: ["Dr. Kim, ", "something weird happened with his lines", " — tube feeding was connected to his IV, and I've stopped it."]
    options: [I need to report a line misconnection, something weird happened with his lines, we have a total disaster here]
    answer: I need to report a line misconnection
    notes: {I need to report a line misconnection: "첫마디에 무엇이 일어났는지 분명한 용어로 말해 의사가 바로 상황을 잡아요.", something weird happened with his lines: "흐린 말이라 얼마나 급한지, 무엇이 문제인지 전해지지 않아요.", we have a total disaster here: "감정이 앞선 과장이라 정보 없이 불안만 전해요."}
    why: "의사 콜은 첫마디에 무엇이 일어났는지 정확히 말하고, 이미 한 조치를 이어서 말해요."
고위험약 용량사고 위기:
  - kind: slider
    words: [w-dose, w-heparin]
    cue: "Heparin was programmed at ten times the ordered rate."
    scale: [therapeutic dose, high dose, overdose]
    answerAt: 2
    why: "처방의 10배가 들어갔으면 high dose가 아니라 overdose(과량 투여)예요. 보고할 때는 'tenfold'처럼 배수로 분명히 말해요."
    example: "He received a tenfold heparin overdose."
    exKo: "헤파린이 10배 과량 투여됐어요."
  - kind: context
    words: [w-heparin, w-give, w-dose]
    scenes:
      - {who: 담당 의사 콜, icon: monitor, en: "He was given ten times the ordered heparin dose about twenty minutes ago; the drip is stopped.", ok: true}
      - {who: 사건 보고서, icon: board, en: "Heparin infused at 10x ordered rate; infusion stopped, MD notified.", ok: true}
      - {who: 동료 간호사에게, icon: speech, en: "Uh, I think I kind of messed up the heparin?", ok: false, fix: "I think he was given ten times the ordered dose of heparin — I've stopped the drip."}
    why: "위기 때는 동료에게도 흐린 말 대신 무엇이 얼마나 들어갔는지 수치로 말해야 바로 움직일 수 있어요."
억제대 관련 질식·손상 위기:
  - kind: slider
    words: [w-tight, w-restraint]
    cue: "You can't slide a finger under the vest, and he's gasping."
    scale: [snug, tight, constricting]
    answerAt: 2
    why: "억제대는 손가락 두 개가 들어갈 정도(snug)가 맞아요. 손가락도 안 들어가고 숨쉬기를 막고 있으면 constricting — 즉시 풀어요."
    example: "The restraint should be snug, with two fingers' room underneath."
    exKo: "억제대는 아래로 손가락 두 개가 들어갈 만큼 꼭 맞아야 해요."
  - kind: context
    words: [w-help, w-call]
    scenes:
      - {who: 복도의 동료에게, icon: speech, en: "I need help in 12 — now!", ok: true}
      - {who: 원내 호출, icon: siren, en: "Rapid response to ICU bed 12.", ok: true}
      - {who: 복도의 동료에게, icon: speech, en: "Sorry to bother you — could you maybe come help when you have a second?", ok: false, fix: "I need help in 12 right now — he can't breathe!"}
    why: "응급에서 정중하게 돌려 말하면 급하지 않다는 뜻으로 들려요. 위치와 상황을 짧고 분명하게 말해요."
알람 무시 급변 위기:
  - kind: slider
    words: [w-crash]
    cue: "SpO2 78%, HR 40 and dropping, and he's not responding."
    scale: [declining, deteriorating, crashing]
    answerAt: 2
    why: "crashing은 지금 당장 무너지는 중이라는 아주 급한 구어예요. 의료진끼리 말로 쓰고, 차트에는 'acutely deteriorating' 같은 말로 적어요."
    example: "He's crashing — call the rapid response."
    exKo: "급변하고 있어요, 신속대응팀 불러요."
  - kind: context
    words: [w-crash]
    scenes:
      - {who: 동료 간호사에게, icon: speech, en: "He's crashing — stop what you're doing and look at him!", ok: true}
      - {who: 신속대응팀 콜, icon: siren, en: "Rapid response to bed 8 — sats 78% and heart rate in the 40s.", ok: true}
      - {who: 보호자에게, icon: me, en: "He's crashing!", ok: false, fix: "His oxygen level dropped suddenly. The team is with him now, and I'll update you as soon as I can."}
    why: "crashing은 의료진끼리의 급한 말이에요. 보호자에게는 무엇이 일어났고 지금 누가 돌보고 있는지를 말해요."
전원·펌프 고장 위기 대응:
  - kind: pair
    words: [w-battery, w-backup, w-red, w-outlet, w-lifesustaining, w-infusion]
    pairs: [[battery, backup], [red, outlets], [life-sustaining, infusions]]
    decoys: [pressure]
    why: "정전 때 기대는 건 battery backup, 비상 전원이 들어오는 콘센트는 red outlets(미국 병원은 보통 빨간색), 끊기면 안 되는 주입은 life-sustaining infusions예요."
  - kind: context
    words: [w-power, w-drop, w-dead]
    scenes:
      - {who: 동료 간호사에게, icon: speech, en: "Power just dropped — every pump on this wall is dead!", ok: true}
      - {who: 시설팀 전화, icon: speech, en: "ICU beds 4 through 8 lost normal power; pumps are on battery.", ok: true}
      - {who: 보호자에게, icon: me, en: "The power's dead and all his pumps just died.", ok: false, fix: "We've lost power for a moment, but his medicines are on backup and I'm watching him closely."}
    why: "'dead·died'는 보호자에게 환자 이야기로 들릴 수 있어요. 무엇이 꺼졌고 어떻게 대비하고 있는지를 말해요."
심각 안전사건 공개·소통:
  - kind: pair
    words: [w-right, w-lead, w-disclosure, w-fact, w-empathy]
    pairs: [[make it, right], [lead, the disclosure], [with facts and, empathy]]
    decoys: [sorry]
    why: "바로잡다는 make it right, 공개 면담을 이끄는 건 lead the disclosure, 공개의 태도는 with facts and empathy로 함께 써요."
  - kind: swap
    words: [w-guess, w-cause, w-honestly]
    who: "보호자에게 · 원인 질문에 답하기"
    icon: me
    before: ["We don't know the full cause yet, but ", "it was probably a pump glitch", "."]
    options: [we'll tell you what we find, it was probably a pump glitch, there's nothing to worry about]
    answer: we'll tell you what we find
    notes: {we'll tell you what we find: "모르는 것은 모른다고 하고, 알게 되면 알리겠다고 약속해요 — 지킬 수 있는 약속이에요.", it was probably a pump glitch: "확인 안 된 원인을 추측해 말하면 나중에 말이 바뀌어 신뢰를 잃어요.", there's nothing to worry about: "사실과 다르게 안심시키는 말이라 공개의 정직성을 해쳐요."}
    why: "공개 면담에서는 원인을 추측하지 않고 아는 사실만 말하며, 모르는 것은 알아보고 알리겠다고 해요."
