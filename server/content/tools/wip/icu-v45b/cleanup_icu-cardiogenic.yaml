# [상황 번호, 문장 번호, ko, why]
sentence_ko: []

word_edits:
  w-short: {en: short of breath, ipa: /ʃɔːrt əv brɛθ/, ko: 숨이 찬, why: "헤드워드 short(짧은)가 short of breath로 쓰였다 — 구 단위로, 다른 ICU 주제(icu-arrhythmia)와 맞춘다"}
  w-away: {en: right away, ipa: /raɪt əˈweɪ/, ko: 곧바로, why: "헤드워드 away에 ko '즉시'가 붙어 있었다 — 구 단위(right away)로, w-immediately(즉시)와 ko를 가른다. icu-arrhythmia와 맞춘다"}
  w-right: {ko: 맞는; 바로, why: "태그된 문장이 right here·right after(바로)와 exactly right·looks right(맞는) — icu-arrhythmia와 맞춘다"}
  w-overwork: {en: overwork, ipa: /ˌoʊvərˈwɜːrk/, why: "활용형 헤드워드(overworking)를 원형으로"}
