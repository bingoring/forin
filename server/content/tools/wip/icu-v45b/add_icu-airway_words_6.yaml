w-hesitate:
  cue: "위기 때 누가 뭘 할지 몰라 머뭇거리는 것 — 'so no one ___s'"
  tag: 팀 소통
  distractorsEn: [estimate, meditate]
  distractorsKo: [서두르다, 지시하다]
  chips: [[hesi, tate]]
  decoyChips: [medi, tant]
w-later:
  cue: "지금 훈련해 두면 실제 위기가 올 그때에 — 'no one hesitates ___'"
  tag: 팀 소통
  distractorsEn: [sooner, lastly]
  distractorsKo: [미리, 마지막으로]
  chips: [[lat, er]]
  decoyChips: [late, ly]
w-intubate:
  cue: "기관에 튜브를 넣는 동사 — CICO에서 첫 번째로 '안 된다'는 것"
  tag: 기도 위기
  distractorsEn: [extubate, incubate]
  distractorsKo: [발관하다, 배양하다]
  chips: [[in, tu, bate]]
  decoyChips: [ex, cu]
w-oxygenate:
  cue: "CICO에서 두 번째로 '안 된다'는 것 — 마스크로도 SpO2를 못 올린다"
  tag: 기도 위기
  distractorsEn: [oxidize, ventilate]
  distractorsKo: [환기시키다, 산화시키다]
  chips: [[oxy, gen, ate]]
  decoyChips: [oxi, dize]
w-cricothyrotomy:
  cue: "CICO에서 목 앞 막을 째고 관을 넣는 응급 외과적 기도 확보"
  tag: 기도 위기
  distractorsEn: [tracheostomy, thyroidectomy]
  distractorsKo: [기관절개술, 갑상선절제술]
  chips: [[crico, thyro, tomy]]
  decoyChips: [thyroid, ectomy]
w-kit:
  cue: "필요한 기구를 한 묶음으로 포장해 둔 것 — 뜯어서 바로 펼친다"
  tag: 기도 위기
  distractorsEn: [kid, cut]
  distractorsKo: [가위, 지혈대]
  chips: [[kit]]
  decoyChips: [kid]
w-open:
  cue: "포장된 키트를 뜯어 바로 쓰게 — 'get the kit ___'"
  tag: 기도 위기
  distractorsEn: [upend, opine]
  distractorsKo: [닫다, 반납하다]
  chips: [[o, pen]]
  decoyChips: [up, pin]
w-stat:
  cue: "의료진끼리 '지금 당장'을 한 음절로 — 'call surgery ___'"
  tag: 팀 소통
  distractorsEn: [start, stand]
  distractorsKo: [나중에, 정기적으로]
  chips: [[stat]]
  decoyChips: [stab]
w-surgical:
  cue: "목을 째서 확보하는 기도 — '___ airway'"
  tag: 기도 위기
  distractorsEn: [cervical, sterile]
  distractorsKo: [경부의, 무균의]
  chips: [[sur, gi, cal]]
  decoyChips: [geon, cer]
w-mark:
  cue: "째기 전에 펜으로 윤상갑상막 자리를 그어 두는 것"
  tag: 기도 위기
  distractorsEn: [mask, make]
  distractorsKo: [자르다, 덮다]
  chips: [[mark]]
  decoyChips: [mask]
w-cricothyroid:
  cue: "윤상연골과 갑상연골 사이 — '___ membrane'"
  tag: 기도 위기
  distractorsEn: [thyrohyoid, cricoarytenoid]
  distractorsKo: [갑상설골, 윤상피열]
  chips: [[crico, thyroid]]
  decoyChips: [thyro, hyoid]
w-membrane:
  cue: "두 연골 사이를 잇는 얇은 조직 — CICO에서 째는 곳"
  tag: 기도 위기
  distractorsEn: [ligament, cartilage]
  distractorsKo: [연골, 인대]
  chips: [[mem, brane]]
  decoyChips: [brain, mam]
w-say:
  cue: "시간을 입 밖으로 — '___ the time out loud'"
  tag: 팀 소통
  distractorsEn: [sew, sigh]
  distractorsKo: [적다, 재다]
  chips: [[say]]
  decoyChips: [sae]
w-loud:
  cue: "팀 전체에 들리게 — 'out ___'"
  tag: 팀 소통
  distractorsEn: [load, cloud]
  distractorsKo: [조용히, 몰래]
  chips: [[loud]]
  decoyChips: [load]
w-stuck:
  cue: "삽관도 산소화도 안 되고 진전 없이 막혀 있는 상태 — 'every minute we're ___'"
  tag: 기도 위기
  distractorsEn: [struck, sick]
  distractorsKo: [안정된, 진행 중인]
  chips: [[stuck]]
  decoyChips: [stack]
w-stop:
  cue: "SpO2가 떨어지면 시도를 그만두고 백으로 — '___ the attempt'"
  tag: 기도 위기
  distractorsEn: [step, start]
  distractorsKo: [계속하다, 시작하다]
  chips: [[stop]]
  decoyChips: [step]
w-bagmask:
  cue: "마스크를 얼굴에 대고 백을 짜서 넣는 환기 — '___ ventilate'"
  tag: 산소화
  distractorsEn: [nasal-prong, non-rebreather]
  distractorsKo: [비강 캐뉼라, 비재호흡 마스크]
  chips: [[bag-, mask]]
  decoyChips: [bad-, mast]
w-percent:
  cue: "산소를 최대로 — '100 ___ oxygen'"
  tag: 산소화
  distractorsEn: [percept, present]
  distractorsKo: [리터, 배]
  chips: [[per, cent]]
  decoyChips: [pre, sent]
w-bradycardia:
  cue: "심박수가 60 아래로 — 삽관 중 저산소가 오면 뒤따른다"
  tag: 기도 위기
  distractorsEn: [tachycardia, bradypnea]
  distractorsKo: [빈맥, 서호흡]
  chips: [[brady, cardia]]
  decoyChips: [tachy, pnea]
w-hypoxia:
  cue: "조직에 산소가 모자란 상태 — 삽관 중 서맥의 흔한 원인"
  tag: 기도 위기
  distractorsEn: [hypotonia, hypercapnia]
  distractorsKo: [고탄산혈증, 저긴장증]
  chips: [[hyp, oxia]]
  decoyChips: [hyper, capnia]
w-heart:
  cue: "서맥을 볼 때 소리 내어 부르는 수치의 앞말 — '___ rate'"
  tag: 기도 위기
  distractorsEn: [hurt, heat]
  distractorsKo: [폐, 혈관]
  chips: [[heart]]
  decoyChips: [hart]
w-rate:
  cue: "1분에 몇 번 뛰는지 — 'heart ___'"
  tag: 기도 위기
  distractorsEn: [rhythm, ratio]
  distractorsKo: [리듬, 산소포화도]
  chips: [[rate]]
  decoyChips: [rait]
w-low:
  cue: "심박수가 바닥에서 안 올라올 때 — 'stays ___'"
  tag: 기도 위기
  distractorsEn: [high, law]
  distractorsKo: [높은, 불규칙한]
  chips: [[low]]
  decoyChips: [lo]
w-arrest:
  cue: "심장이 멈춘 상태 — 서맥이 안 돌아오면 이 알고리즘으로"
  tag: 기도 위기
  distractorsEn: [assist, attest]
  distractorsKo: [부정맥, 실신]
  chips: [[ar, rest]]
  decoyChips: [at, test]
w-algorithm:
  cue: "ACLS처럼 단계별로 정해 둔 흐름도"
  tag: 기도 위기
  distractorsEn: [logarithm, rhythm]
  distractorsKo: [로그, 리듬]
  chips: [[algo, rithm]]
  decoyChips: [loga, rhythm]
w-atropine:
  cue: "산소화로도 서맥이 안 풀릴 때 미는 약"
  tag: 기도 위기
  distractorsEn: [adenosine, epinephrine]
  distractorsKo: [아데노신, 에피네프린]
  chips: [[atro, pine]]
  decoyChips: [adeno, sine]
w-improve:
  cue: "산소를 줬는데 서맥이 나아지지 않으면 — 'doesn't ___'"
  tag: 기도 위기
  distractorsEn: [approve, imply]
  distractorsKo: [악화되다, 유지되다]
  chips: [[im, prove]]
  decoyChips: [ap, ply]
w-again:
  cue: "회복되면 한 번 더 — 'try ___'"
  tag: 동작·상태
  distractorsEn: [against, often]
  distractorsKo: [처음으로, 그만]
  chips: [[a, gain]]
  decoyChips: [ag, ainst]
w-recover:
  cue: "SpO2와 심박수가 원래대로 돌아오는 것"
  tag: 기도 위기
  distractorsEn: [discover, recur]
  distractorsKo: [재발하다, 떨어지다]
  chips: [[re, cover]]
  decoyChips: [dis, cur]
w-out:
  cue: "기관절개관이나 튜브가 제자리를 벗어나 빠져 버린 상태 — 'The trach is ___'"
  tag: 기관절개
  distractorsEn: ["off", "in"]
  distractorsKo: [끼워진, 막힌]
  chips: [[out]]
  decoyChips: [owt]
w-cover:
  cue: "빠진 자리 구멍을 거즈나 손으로 막아 둘 때"
  tag: 기관절개
  distractorsEn: [hover, covet]
  distractorsKo: [벌리다, 닦다]
  chips: [[cov, er]]
  decoyChips: [hov, et]
w-smaller:
  cue: "같은 크기가 안 들어가면 넣을 한 치수 아래 관 — 'a ___ trach'"
  tag: 기관절개
  distractorsEn: [larger, shorter]
  distractorsKo: [더 큰, 더 짧은]
  chips: [[small, er]]
  decoyChips: [smell, large]
w-reinsertion:
  cue: "빠진 기관절개관을 다시 넣는 일 — 명사"
  tag: 기관절개
  distractorsEn: [reintubation, reinflation]
  distractorsKo: [재삽관, 재팽창]
  chips: [[re, in, ser, tion]]
  decoyChips: [fla, tu]
w-fresh:
  cue: "만든 지 얼마 안 돼 길이 아직 안 잡힌 스토마 — 다시 넣기 어렵다"
  tag: 기관절개
  distractorsEn: [flesh, mature]
  distractorsKo: [오래된, 성숙한]
  chips: [[fresh]]
  decoyChips: [flesh]
w-hard:
  cue: "길이 안 잡힌 스토마는 다시 넣기가 — 'can be ___ to recannulate'"
  tag: 기관절개
  distractorsEn: [harsh, heard]
  distractorsKo: [쉬운, 빠른]
  chips: [[hard]]
  decoyChips: [heard]
w-recannulate:
  cue: "빠진 스토마에 관을 다시 꿰어 넣는 것 — 동사"
  tag: 기관절개
  distractorsEn: [decannulate, recalculate]
  distractorsKo: [발관하다, 다시 계산하다]
  chips: [[re, cannu, late]]
  decoyChips: [de, cal]
w-calm:
  cue: "당황한 동료에게 — '흥분하지 말고' 'Stay ___'"
  tag: 팀 소통
  distractorsEn: [warm, numb]
  distractorsKo: [급한, 화난]
  chips: [[calm]]
  decoyChips: [clam]
