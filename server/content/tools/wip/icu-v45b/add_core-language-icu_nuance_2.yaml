"통역 통한 동의·설명":
  - kind: pair
    words: [w-think, w-explain, w-procedure, w-fully, w-wrong, w-question]
    pairs: [["think this", "over"], ["explain the procedure", "fully"], ["no wrong", "question"]]
    decoys: ["about"]
    why: "think this over는 '곰곰이 생각해 보다', explain fully는 '빠짐없이 설명하다'예요. There's no wrong question은 질문을 망설이는 가족을 북돋는 말이에요."
  - kind: context
    words: [w-understand, w-tell]
    scenes:
      - {who: "통역 중 · 환자에게", icon: me, en: "Can you tell me in your words what you understood?", ok: true}
      - {who: "차트 기록", icon: board, en: "Consent obtained via Spanish interpreter (ID 4521); pt verbalized understanding.", ok: true}
      - {who: "통역 중 · 환자에게", icon: me, en: "You understand, right? Sign here.", ok: false, fix: "Before you sign, can you tell me in your own words what the procedure is?"}
    why: "'You understand, right?'는 '예'를 끌어내는 질문이라 정말 이해했는지 알 수 없어요. 서명 전에 환자 말로 되말하게(teach-back) 하고, 통역을 썼다면 통역사 이름이나 ID를 기록해요."
"문화적 표현·금기 고려":
  - kind: pair
    words: [w-follow, w-lead, w-respectful, w-correct, w-say, w-wrong]
    pairs: [["follow your", "lead"], ["be respectful", "of that"], ["correct me if I say", "something wrong"]]
    decoys: ["ahead"]
    why: "follow your lead는 '말씀하시는 대로 따르겠다', be respectful of ~는 '~을 존중하겠다'예요. 다른 문화의 금기를 다 알 수는 없으니 '틀리면 고쳐 달라'고 먼저 청해요."
  - kind: swap
    words: [w-talk, w-condition]
    who: "보호자에게 · 문화적 선호를 물을 때"
    icon: home
    before: ["", "Can I just", " talk about his condition?"]
    options: ["How would you like me to", "Why don't you want me to", "Can I just"]
    answer: "How would you like me to"
    notes:
      "How would you like me to": "가족의 방식을 묻는 열린 질문 — 존중이 담긴다."
      "Why don't you want me to": "이유를 따지는 말로 들려 가족을 방어적으로 만든다."
      "Can I just": "가족의 말을 건너뛰고 내 방식대로 하겠다는 뜻으로 들린다."
    why: "직접 말하지 않기를 바라는 가족에게는 어떻게 전하길 원하는지 먼저 물어요. 다만 알 권리는 환자 본인에게 있어서, 환자가 판단할 수 있으면 환자가 얼마나 알고 싶은지도 확인해요."
"가족 통역 한계·공식 통역 전환":
  - kind: pair
    words: [w-take, w-burden, w-trained, w-interpreter, w-fair]
    pairs: [["take the burden", "off you"], ["a trained", "interpreter"], ["It's not", "fair to ask so much of you"]]
    decoys: ["of me"]
    why: "takes the burden off you는 '당신 어깨의 짐을 덜어 준다'예요. 가족 통역을 공식 통역으로 바꿀 때 '못 믿어서'가 아니라 '가족을 위해서'라는 뜻을 담아요."
  - kind: swap
    words: [w-great, w-help, w-trained, w-interpreter, w-medical]
    who: "보호자에게 · 딸이 계속 통역하겠다고 할 때"
    icon: home
    before: ["", "You're not qualified", ", and for medical decisions we use a trained interpreter."]
    options: ["You've been a great help", "You're not qualified", "That's against policy"]
    answer: "You've been a great help"
    notes:
      "You've been a great help": "도와준 마음을 먼저 인정한다 — 거절이 아니라 배려로 들린다."
      "You're not qualified": "가족의 능력을 깎아내리는 말로 들린다."
      "That's against policy": "규칙을 앞세워 차갑게 들리고, 이유(환자의 안전)가 빠졌다."
    why: "가족 통역을 공식 통역으로 바꿀 때는 고마움을 먼저 말하고, 이유는 규칙보다 환자를 위한 정확성에 둬요."
"청각·시각 장애 병행 소통":
  - kind: pair
    words: [w-aid, w-read, w-lip]
    pairs: [["hearing", "aids"], ["read", "lips"]]
    decoys: ["pencil"]
    why: "hearing aids는 보청기(양쪽에 끼면 복수로 말해요), read lips는 입 모양을 읽는다는 말이에요. 입 모양만으로는 말소리를 다 알아볼 수 없어서 글씨·몸짓을 함께 써요."
  - kind: swap
    words: [w-speak, w-clearly, w-side]
    who: "보호자에게 · 귀가 어두운 남편과 말하는 법"
    icon: home
    before: ["I'll face him and ", "shout", " on his better side."]
    options: ["speak clearly", "shout", "whisper"]
    answer: "speak clearly"
    notes:
      "speak clearly": "또렷하게, 보통 속도로 — 입 모양도 자연스러워 읽기 쉽다."
      "shout": "소리를 지르면 소리가 일그러지고 입 모양도 바뀌어 오히려 알아듣기 어렵다."
      "whisper": "청력이 약한 사람에게는 들리지 않는다."
    why: "청력이 약한 환자에게는 얼굴을 마주 보고, 잘 들리는 쪽에서 또렷하게 말해요. 크게 소리치는 것은 도움이 되지 않아요."
"통역 통한 목표설정 대화":
  - kind: pair
    words: [w-convey, w-everything, w-carefully, w-rush, w-matter]
    pairs: [["convey everything", "carefully"], ["no", "rush"], ["what matters", "most"]]
    decoys: ["step"]
    why: "There's no rush는 결정을 재촉하지 않는다는 말, what matters most는 환자가 가장 소중히 여기는 것을 묻는 말이에요. 목표 설정 대화는 여기서 시작해요."
  - kind: reel
    words: [w-matter]
    word: "matter"
    scenes:
      - {who: "보호자에게", en: "Let's talk about what matters most to him.", ko: "그분에게 가장 중요한 것에 대해 이야기해 봐요.", tone: 열린 질문}
      - {who: "통역사에게 · 면담 전 설명", en: "This is a goals-of-care talk — what matters to him is the focus.", ko: "목표 설정 면담이에요 — 그분에게 무엇이 중요한지가 핵심이에요.", tone: 업무}
      - {who: "차트 기록", en: "Per family, what matters most to pt is being at home.", ko: "가족에 따르면 환자에게 가장 중요한 것은 집에 있는 것.", tone: 건조}
      - {who: "환자 본인에게는…", en: "What matters most to you right now?", ko: "지금 가장 중요하신 게 뭐예요?", tone: 직접, swap: true}
"다국어 약물·안전 교육":
  - kind: pair
    words: [w-miss, w-dose, w-medication, w-list, w-tell]
    pairs: [["missed", "a dose"], ["medication", "list"], ["tell me", "back"]]
    decoys: ["up"]
    why: "missed a dose는 약을 한 번 거르다, medication list는 복용 약 목록, tell me back은 들은 것을 되말해 달라는 티치백 표현이에요."
  - kind: context
    words: [w-dose, w-give]
    scenes:
      - {who: "보호자에게", icon: home, en: "Give him 5 mL — fill the syringe to this line.", ok: true}
      - {who: "차트 기록", icon: board, en: "Teach-back done: daughter demonstrated 5 mL dose with oral syringe.", ok: true}
      - {who: "보호자에게", icon: home, en: "Give him one teaspoon.", ok: false, fix: "Give him 5 mL — use this syringe, not a kitchen spoon."}
    why: "집의 숟가락은 크기가 제각각이라 투약 오류가 생겨요. 미국 소아과학회(AAP)와 FDA는 액상 약을 mL로 안내하고 계량 도구를 함께 주라고 권해요."
"원격 통역 활용":
  - kind: pair
    words: [w-keep, w-test, w-connection, w-hear, w-clearly]
    pairs: [["keep", "up"], ["test the", "connection"], ["can everyone hear", "clearly"]]
    decoys: ["slowly"]
    why: "keep up은 '(말을) 따라오다' — 통역사가 따라올 수 있게 끊어 말해요. 원격 통역은 시작 전에 연결(connection)을 확인하고, 모두에게 잘 들리는지(hear clearly) 물어요."
  - kind: context
    words: [w-video, w-position, w-screen]
    scenes:
      - {who: "보호자에게", icon: home, en: "Let's position the screen so she can see the interpreter clearly.", ok: true}
      - {who: "동료에게", icon: speech, en: "Can you help me angle the VRI cart toward the bed?", ok: true}
      - {who: "환자에게", icon: me, en: "I'm going to optimize the VRI cart angle now.", ok: false, fix: "I'm turning the screen so you can see her better."}
    why: "VRI(영상 원격 통역)는 병원 안에서 쓰는 말이에요. 환자에게는 '화면'·'통역사'처럼 눈앞에 보이는 것으로 말해요."
