word_edits:
  w-swab: {en: cotton swab, ipa: /ˈkɑtn swɑb/, why: "cotton swab을 구 단위로 — w-cotton(면)을 지운다"}
  w-gas: {ko: 혈액가스, why: "다른 ICU 주제의 w-gas(혈액가스)와 맞춘다 — 문장이 모두 blood gas"}
  w-map: {en: map out, ipa: /mæp aʊt/, why: "map out(정리하다)이 구동사 — map 홀로는 '지도'로 읽힌다"}
  w-exam: {ko: 진찰, why: "w-test(검사)와 ko가 같아 듣고 뜻 고르기에서 정답이 둘이었다 — brainstem reflex exam은 손으로 하는 진찰"}
  w-steady: {ko: 흔들림 없는, why: "w-stable(안정적인)과 ko가 같았다"}
  w-vent: {ko: 인공호흡기(줄임말), why: "w-ventilator(인공호흡기)와 ko가 같았다 — 다른 ICU 주제와도 맞춘다"}
  w-arrange: {ko: 마련하다, why: "w-coordinate(조율하다)와 ko가 같았다 — arrange for는 자리를 '마련하다'"}
  w-honor: {ko: 받들다, why: "w-respect(존중하다)와 ko가 같았다 — 다른 ICU 주제의 w-honor(받들다)와 맞춘다"}
  w-confirm: {ko: 확실히 확인하다, why: "w-check(확인하다)와 ko가 같았다 — 다른 ICU 주제와도 맞춘다"}
  w-begin: {ko: 시작되다, why: "w-start(시작하다)와 ko가 같았다 — 문장은 the test to begin(자동사)"}
  w-titrate: {ko: 적정하다, why: "다른 ICU 주제의 w-titrate(적정하다)와 맞춘다"}
  w-give: {ko: 투여하다, why: "태그된 문장이 모두 약·수액 투여 — 다른 ICU 주제의 w-give(투여하다)와 맞춘다"}
  w-vital: {ko: 활력징후, why: "문장은 모두 명사 vitals — '활력징후의'는 형용사"}
  w-support: {ko: 지지 요법; 지지하다, why: "태그된 문장이 명사(current support)와 동사(support you·supporting it)로 나뉜다"}

  w-volume: {ko: 체액량; 용적, why: "w-dose(용량)와 ko가 같았다 — 태그된 문장이 give volume·keep his volume(체액량)과 tidal volumes(용적)"}

