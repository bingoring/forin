    chunks: [If something is, truly urgent, ', I''ll come', to her right away, .]
    words: [w-urgent]
    goal: 2
  - en: Each color and sound on the monitor means something different.
    ko: 모니터의 각 색과 소리는 서로 다른 뜻이에요.
    chunks: [Each color and sound, on the monitor, means something, different, .]
    words: [w-color, w-sound, w-monitor, w-different]
    goal: 1
  nuance:
  - kind: slider
    words: [w-urgent, w-emergency]
    cue: '간호사 판단: 환자 상태는 그대로이고, 수액(생리식염수) 백이 거의 다 됐다는 펌프 알림'
    scale: [routine, urgent, emergent]
    answerAt: 0
    why: 환자 상태는 그대로인데 할 일을 알려 주는 알람이면 routine이에요. urgent는 몇 분 안에 처리해야 할 일, emergent는 생명이 걸려 바로 뛰어가야 하는 일이에요. 같은 펌프 알람이라도 승압제처럼 끊기면 안 되는 약이면 무게가 달라요.
    example: If something is truly urgent, I'll come to her right away.
    exKo: 정말 급한 일이면 바로 그녀에게 갈게요.
  - kind: swap
    words: [w-remind, w-alarm]
    who: 보호자에게 · 알람 설명
    icon: me
    before: ['That alarm is just ', a low-priority technical alert, .]
    options: [a reminder, a low-priority technical alert, noise]
