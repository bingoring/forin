situations:
- title: 면회 안내·환경 설명
  sentences:
  - en: Let me walk you through what you'll see at her bedside.
    ko: 그녀의 침상에서 무엇을 보게 될지 안내해 드릴게요.
    chunks: [Let me walk you through, what you'll see, at her, bedside, .]
    words: [w-walk, w-bedside]
    goal: 1
  - en: There will be monitors and tubes, and that's normal here.
    ko: 모니터와 튜브들이 있을 텐데, 여기서는 정상적인 거예요.
    chunks: [There will be, monitors and tubes, ', and that''s normal', here, .]
    words: [w-monitor, w-tube, w-normal]
    goal: 1
  - en: You can talk to her and hold her hand.
    ko: 말을 걸어도 되고 손을 잡아도 돼요.
    chunks: [You can, talk to her, and hold, her hand, .]
    words: [w-talk, w-hold]
    goal: 1
  - en: It can feel overwhelming at first, but you'll get used to it.
    ko: 처음엔 벅차게 느껴질 수 있지만, 곧 익숙해지실 거예요.
    chunks: [It can feel overwhelming, at first, ', but', you'll get used to it, .]
    words: [w-overwhelming]
    goal: 2
  - en: The sounds and lights are just part of how we watch over her.
    ko: 소리와 불빛은 저희가 그녀를 지켜보는 방식의 일부예요.
    chunks: [The sounds and lights, are just part, of how we watch, over her, .]
    words: [w-sound, w-light, w-watch]
    goal: 1
  - en: Take your time before you go in.
    ko: 들어가시기 전에 천천히 시간을 가지세요.
    chunks: [Take your time, before you, go in, .]
    words: []
    goal: 2
  nuance:
  - kind: pair
    words: [w-walk, w-hold, w-bedside]
    pairs:
    - [walk you, through]
    - [hold, her hand]
    - [at her, bedside]
    decoys: [bedrest]
    why: walk someone through는 '하나씩 짚어 가며 안내하다'라는 굳은 표현이에요. 손은 hold her hand, 침대 곁은 at her bedside.
  - kind: context
    words: [w-tube, w-normal]
    scenes:
    - {who: 동료에게 인계, icon: speech, en: 'She''s intubated on the vent, with a central line and an art line.', ok: true}
    - {who: 차트 기록, icon: board, en: Pt intubated on vent; CVC and arterial line in place., ok: true}
    - {who: 처음 면회 온 가족에게, icon: me, en: She's intubated with a central line and an art line., ok: false, fix: 'She has a breathing tube and a few IV lines. It looks like a lot, but that''s normal here.'}
    why: 같은 내용이라도 가족에게는 장비 이름 대신 그 장비가 하는 일을 쉬운 말로 말해요. 처음 보는 가족에게는 "that's normal here" 한마디가 큰 안심이 돼요.
- title: 장비·알람 설명
  sentences:
  - en: Most alarms are just reminders, not emergencies.
    ko: 대부분의 알람은 응급상황이 아니라 그냥 알림이에요.
    chunks: [Most alarms are, just reminders, ', not emergencies', .]
    words: [w-alarm, w-remind, w-emergency]
    goal: 1
  - en: This monitor shows her heart rate and oxygen.
    ko: 이 모니터는 심박수와 산소 수치를 보여줘요.
    chunks: [This monitor shows, her heart rate, and oxygen, .]
    words: [w-monitor, w-heart, w-rate, w-oxygen]
    goal: 1
  - en: I'm watching all of these closely for her.
    ko: 제가 이 모든 걸 그녀를 위해 꼼꼼히 지켜보고 있어요.
    chunks: [I'm watching all of these, closely, for her, .]
    words: [w-watch]
    goal: 2
  - en: The pump alarm means her IV bag needs changing.
    ko: 펌프 알람은 수액백을 갈아야 한다는 뜻이에요.
    chunks: [The pump alarm, means, her IV bag, needs changing, .]
    words: [w-pump, w-iv, w-bag, w-change]
    goal: 1
  - en: If something is truly urgent, I'll come to her right away.
