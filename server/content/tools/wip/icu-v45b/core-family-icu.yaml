    notes: {a reminder: '가족이 바로 알아듣는 쉬운 말이고, 사실 그대로예요.', a low-priority technical alert: 의료진끼리 쓰는 알람 분류어라 가족에게는 낯설어요., noise: '''그냥 소음''이라고 하면 알람을 무시해도 된다는 뜻이 돼요. 간호사는 알람을 늘 확인해요.'}
    why: 가족에게는 알람의 뜻을 쉬운 말(reminder)로 풀되, 가볍게 넘기는 말로 들리지 않게 해요.
