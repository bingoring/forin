# 결정 11 — core-family-icu 가벼운 정리
untag:
  w-time: 공통 쉬운 단어(time)
  w-home: 공통 쉬운 단어(home)
  w-doctor: 공통 쉬운 단어(doctor)
  w-family: 공통 쉬운 단어(family)
  w-hand: 공통 쉬운 단어(hand)
  w-know: 공통 쉬운 단어(know)
  w-come: 공통 쉬운 단어(come)
  w-see: 공통 쉬운 단어(see)
  w-day: 공통 쉬운 단어(day)
  w-body: 공통 쉬운 단어(body)
  w-room: 공통 쉬운 단어(room)
sentence_untag:
  - situation: 가족 급성 비탄·위기 대응
    index: 1
    remove: [w-hold, w-together]
    why: "'hold it together'(마음을 다잡다)는 w-hold 잡다·w-together 함께의 뜻이 아니다 — 태그 제거"
  - situation: 대리결정 부재 상황
    index: 3
    remove: [w-step]
    why: "'step up'(나서다)은 w-step(단계·절차)의 뜻이 아니다 — 태그 제거"
sentence_ko:
  - situation: 면회 안내·환경 설명
    index: 3
    ko: "처음엔 벅차게 느껴질 수 있지만, 곧 익숙해지실 거예요."
    why: "overwhelming(감정)을 '압도적으로'로 옮긴 오역 — '벅차게'로"
word_fields:
  w-overwhelming:
    set: {ko: "벅찬"}
    why: "감정의 overwhelming은 '압도적인'이 아니라 '감당하기 벅찬'"
  w-step:
    set: {ko: "단계·절차"}
    why: "태그된 문장 대부분이 절차·단계(these steps, step by step, next steps) — '걸음'과 안 맞음"
  w-support:
    set: {ko: "지원"}
    why: "호흡 보조(the support he needs)·지원 서비스·애도 지원 — '지지'보다 '지원'이 문장들과 맞음"
  w-rate:
    set: {ko: "(심박) 수·속도"}
    why: "w-level과 ko(수치)가 같아 듣고 뜻 고르기에서 정답이 둘 — heart rate의 rate로 가름"
  w-speak:
    set: {ko: "말을 하다·대변하다"}
    why: "w-say와 ko(말하다)가 같음 — speak for(대변하다) 용례까지 담아 가름"
  w-wish:
    set: {ko: "~라면 좋겠다"}
    why: "w-hope와 ko(바라다)가 같음 — I wish I could… 용법으로 가름"
  w-outcome:
    set: {ko: "최종 결과(예후)"}
    why: "w-result와 ko(결과)가 같음 — 예후로서의 결과로 가름"
  w-respond:
    set: {ko: "(치료에) 반응하다"}
    why: "w-react와 ko(반응하다)가 같음 — responding to treatment 용법으로 가름"
  w-believe:
    set: {ko: "~라고 보다·믿다"}
    why: "w-think와 ko(생각하다)가 같음 — 의료진 판단(We believe…)으로 가름"
  w-update:
    set: {ko: "최신 소식"}
    why: "문장(hear the same update)에서 명사인데 ko가 동사(알려주다)"
  w-get:
    set: {ko: "마련해 주다"}
    why: "문장이 'get you a quiet space'(공간을 마련해 주다) — '데려다주다'와 안 맞음"
  w-slow:
    set: {ko: "느린·늦추다"}
    why: "태그된 문장 3개 중 2개가 동사(slow down) — 형용사 뜻만으로는 안 맞음"
  w-answer:
    set: {ko: "답·답하다"}
    why: "태그된 문장 5개 중 3개가 명사(a certain answer, straight answers, no wrong answer) — 동사 뜻만으로는 안 맞음"
  w-rush:
    set: {ko: "서두름"}
    why: "유일한 문장이 'there's no rush'(명사) — ko가 동사(서두르다)"
