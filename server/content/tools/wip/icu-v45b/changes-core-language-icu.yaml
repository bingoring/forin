theme: core-language-icu
changes:
- kind: word
  id: w-speak
  fields:
  - ko
  why: w-say와 ko(말하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — 문장 대부분(can't speak·speak clearly·speak slowly)이 소리 내어 말하기라 그쪽으로 가른다
- kind: word
  id: w-talk
  fields:
  - ko
  why: w-say·w-speak와 ko(말하다)가 같다 — 다른 ICU 주제(16건)와 같은 이야기하다로
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm과 ko(확인하다)가 같다 — check on you·keep checking in은 살펴보다
- kind: word
  id: w-pause
  fields:
  - ko
  why: w-stop과 ko(멈추다)가 같다 — 다른 ICU 주제(5건)와 같은 잠시 멈추다로
- kind: word
  id: w-fully
  fields:
  - ko
  why: w-completely와 ko(완전히)가 같다 — explain the procedure fully는 충분히 설명하다
- kind: word
  id: w-honor
  fields:
  - ko
  why: w-respect와 ko(존중하다)가 같다 — honors your values는 가치를 받들다
- kind: word
  id: w-lot
  fields:
  - ko
  why: w-much와 ko(많이)가 같다 — 다른 ICU 주제와 같은 명사 뜻 많음으로
- kind: word
  id: w-fast
  fields:
  - ko
  why: 문장(going too fast)은 부사 — 다른 ICU 주제(10건)와 같은 빠르게로
- kind: word
  id: w-call
  fields:
  - ko
  why: 문장 3건 중 2건(call the doctor·call this number)이 전화하다 — 두 뜻을 함께 적는다
- kind: word
  id: w-keep
  fields:
  - ko
  why: 문장 6건 중 지키다로 읽히는 것은 keep … safe뿐 — keep using·keep checking·keep things simple까지 맞는 유지하다로(다른 ICU 주제 18건과 같다)
- kind: word
  id: w-concern
  fields:
  - ko
  why: 유일한 문장(what concerns you)이 동사인데 명사 카드(우려)였다 — 동사로
- kind: word
  id: w-ground
  fields:
  - en
  - ipa
  - ko
  why: ground 한 낱말에 ko '공통 기반'이 붙어 카드 홀로 뜻이 서지 않는다 — 구(common ground)로 헤드워드를 맞추고 w-common을 합친다
- kind: word
  id: w-page
  fields:
  - en
  - ipa
  - ko
  why: page에 ko '페이지'가 붙었지만 문장은 관용구 on the same page — 구로 헤드워드를 맞추고 w-same을 합친다
- kind: word
  id: w-aid
  fields:
  - en
  - ipa
  - ko
  why: aid(보조기기) 홀로는 문장(hearing aids)의 뜻을 못 담는다 — ER core-language와 같은 hearing aid로
- kind: word-remove
  id: w-away
  why: 어느 문장도 태그하지 않게 됐다 — right away의 away에 ko '즉시'가 붙어 카드 홀로 뜻이 서지 않는다 — 태그를 뺀다(w-right가 같은 문장에 있다)
- kind: word-remove
  id: w-mother
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(mother) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-family
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(family) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-know
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(know) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-time
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(time) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-hand
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(hand) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-now
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(now) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-minute
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(minute) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-zero
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(zero) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-ten
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(ten) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-body
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(body) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-down
  why: 어느 문장도 태그하지 않게 됐다 — write it down의 down에 ko '적어서'가 붙어 카드 홀로 뜻이 서지 않는다 — 태그를 뺀다(w-write가 같은 문장에 있다)
- kind: word-remove
  id: w-see
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(see) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-father
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(father) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-doctor
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(doctor) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
  id: w-same
  why: 어느 문장도 태그하지 않게 됐다 — on the same page를 w-page 한 장(헤드워드 on the same page)으로 합친다 — 겹치는 w-same 태그를 뺀다
- kind: word-remove
  id: w-come
  why: 어느 문장도 태그하지 않게 됐다 — 공통 쉬운 단어(come) — 태그만 뺀다(문장은 그대로)
- kind: word-remove
