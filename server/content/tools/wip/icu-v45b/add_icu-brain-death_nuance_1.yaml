뇌사 개념·법적 절차 이해:
  - kind: slider
    words: [w-permanently, w-stop, w-work]
    cue: "Family: \"So when the sedation wears off, he might wake up?\""
    scale: [for now, for a long time, permanently]
    answerAt: 2
    why: "뇌사 판정은 진정제 효과가 남아 있지 않은 것을 먼저 확인하고 나서 해요. 뇌사는 회복되지 않는 상태라, 'for now'나 'for a long time'처럼 들리면 가족이 깨어나기를 기다리게 돼요. 'permanently'로 분명히 말해요."
    example: "His brain has permanently stopped working. It will not start working again."
    exKo: "뇌가 영구적으로 기능을 멈췄어요. 다시 기능하지 않을 거예요."
  - kind: context
    words: [w-brain, w-death, w-confirm]
    scenes:
      - {who: 차트 기록, icon: board, en: "Brain death determination completed per hospital policy.", ok: true}
      - {who: 동료에게, icon: speech, en: "Brain death is confirmed — the exam and the apnea test are both done.", ok: true}
      - {who: 가족에게, icon: me, en: "The brain death determination has been completed per policy.", ok: false, fix: "The tests are done, and they confirm that his brain has died. That means he has died."}
    why: "의료진끼리는 'determination completed'가 정확한 말이지만 가족에게는 무슨 뜻인지 와닿지 않아요. 미국에서 뇌사는 법적으로 사망이에요 — 가족에게는 '그가 사망했다'는 결론을 분명한 말로 전해요."

뇌간반사 검사 준비 보조:
  - kind: pair
    words: [w-flashlight, w-pupil, w-swab, w-corneal]
    pairs: [[flashlight, pupils], [cotton swab, cornea], [ice water, eye movements]]
    decoys: [knee]
    why: "뇌사 판정은 뇌간 반사를 봐요. 손전등은 동공에, 면봉은 각막에, 찬물은 귀에 넣고 눈이 움직이는지(eye movements) 봐요. 무릎 반사 같은 척수 반사는 뇌사에서도 남을 수 있어서 판정 항목이 아니에요."
  - kind: context
    words: [w-pupil, w-fixed, w-nonreactive]
    scenes:
      - {who: 의사에게 보고, icon: speech, en: "Pupils are fixed and nonreactive on my check.", ok: true}
      - {who: 차트 기록, icon: board, en: "Pupils fixed and nonreactive bilaterally.", ok: true}
      - {who: 보호자에게, icon: me, en: "His pupils are fixed and nonreactive.", ok: false, fix: "When I shine a light in his eyes, his pupils don't respond."}
    why: "fixed and nonreactive는 의료진끼리의 정확한 기록어지만 가족에게는 뜻이 와닿지 않아요. 가족에게는 무엇을 해 봤고 어떤 반응이 없었는지를 쉬운 말로 전해요."

무호흡 검사 준비:
  - kind: pair
    words: [w-start, w-clock, w-draw, w-baseline, w-gas, w-preoxygenate]
    pairs: [[start, the clock], [draw, a baseline gas], [preoxygenate to, a hundred percent]]
    decoys: [the cornea]
    why: "무호흡 검사 준비의 세 동작이에요. 100% 산소로 미리 산소를 채우고(preoxygenate), 나중과 비교할 기저 혈액가스를 뽑고(draw), 인공호흡기를 떼는 순간부터 시간을 재요(start the clock)."
  - kind: context
    words: [w-set, w-apnea, w-test]
    scenes:
      - {who: 동료에게, icon: speech, en: "Everything is set for the apnea test to begin.", ok: true}
      - {who: 검사 직전 팀 확인, icon: check, en: "Apnea test — preox done, baseline gas sent, rescue gear at bedside. We're set.", ok: true}
      - {who: 보호자에게, icon: me, en: "Everything is set for the apnea test to begin.", ok: false, fix: "We're about to do a test to see whether his brain can make him take a breath on his own."}
    why: "'apnea test'는 가족에게 낯선 말이에요. 가족에게는 검사 이름보다 목적 — 뇌가 스스로 숨 쉬라는 신호를 보내는지 — 을 쉬운 말로 알려요."

가족에게 상태 설명 지원:
  - kind: slider
    words: [w-die]
    cue: "Family: \"So is he… is he still with us?\""
    scale: [He's not doing well, He's very sick, He has died]
    answerAt: 2
    why: "가족이 살아 있냐고 물으면 돌려 말하지 말고 'He has died'로 답해요. 'not doing well'·'very sick'은 아직 치료 중이고 회복할 수도 있다는 뜻으로 들려요."
    example: "I'm so sorry. He has died."
    exKo: "정말 유감입니다. 그는 사망했습니다."
  - kind: swap
    words: [w-die, w-sorry]
    who: "보호자에게 · 뇌사 판정 후 사망 고지"
    icon: me
    before: ["I'm so sorry. Your son ", "is gone", "."]
    options: [has died, is gone, has expired]
    answer: has died
    notes:
      has died: "분명해서 오해가 없다. 미국 사망 고지 교육이 '한 번은 꼭 쓰라'고 가르치는 말."
      is gone: "완곡어라 가족이 '아직 살아 있느냐'고 되물을 수 있다."
      has expired: "차트·의료진 용어라 가족에게는 사무적이고 차갑게 들린다."
    why: "사망을 알릴 때는 'died'를 한 번은 분명히 말해요. 그 뒤에 'passed away' 같은 말을 섞는 것은 괜찮지만, 완곡어만 쓰면 가족이 사실을 받아들이지 못해요."

장기기증 기관 연계 인지:
  - kind: slider
    words: [w-separately, w-donation]
    cue: "Policy: the death conversation and the donation conversation are kept apart — different times, different people."
    scale: [together, right after, separately]
    answerAt: 2
    why: "미국에서는 사망 고지와 기증 요청을 떼어 놓는 것(decoupling)이 표준이에요. 사망을 알린 자리에서 바로 기증을 꺼내면 가족이 둘을 엮어 생각할 수 있어요. 기증 이야기는 훈련받은 OPO 담당자가 따로 해요."
    example: "They'll speak with the family separately about donation."
    exKo: "그들은 가족과 따로 기증에 대해 이야기할 것입니다."
  - kind: context
    words: [w-opo, w-notify, w-protocol]
    scenes:
      - {who: 동료에게, icon: speech, en: "The OPO has been notified per protocol.", ok: true}
      - {who: 차트 기록, icon: board, en: "OPO notified per protocol; referral time documented.", ok: true}
      - {who: 보호자에게, icon: me, en: "We've already notified the OPO about donating his organs.", ok: false, fix: "I'm right here with you. Let's take this one step at a time."}
    why: "OPO 통보는 미국 병원이 사망했거나 사망이 임박한 환자마다 해야 하는 의무 절차예요. 간호사가 이 사실을 가족에게 먼저 알리거나 기증을 꺼내지 않아요 — 기증 이야기는 OPO 담당자가 따로 해요."

기증 전 신체 유지 기초:
  - kind: slider
    words: [w-hold, w-pressure]
    cue: "MAP 70, 71, 69, 70 over the last hour on the same norepinephrine rate."
    scale: [dropping, holding, climbing]
    answerAt: 1
    why: "같은 용량에서 수치가 거의 변하지 않으면 'holding'이에요. 인계나 보고에서 추세를 한 단어로 전할 때 써요."
    example: "His pressure is holding with the current support."
    exKo: "현재 지지 요법으로 혈압이 유지되고 있습니다."
  - kind: context
    words: [w-keep, w-warm, w-temperature, w-watch]
    scenes:
      - {who: 동료에게, icon: speech, en: "I'm keeping him warm and watching the temperature.", ok: true}
      - {who: 차트 기록, icon: board, en: "Temp monitored every 30 min; warming blanket in place.", ok: true}
      - {who: 보호자에게, icon: me, en: "His thermoregulation is impaired, so we're actively warming him.", ok: false, fix: "His body can't keep itself warm anymore, so we're keeping him warm with a blanket."}
    why: "뇌사 후에는 뇌가 체온을 조절하지 못해 몸이 식기 쉬워요. 의료진끼리는 'thermoregulation'이 정확하지만, 가족에게는 '몸이 스스로 따뜻하게 하지 못해 담요로 덮어 드린다'처럼 쉬운 말로 전해요."

무호흡 검사 중 안전 감시:
  - kind: slider
    words: [w-desaturate, w-saturation]
    cue: "SpO2 100%, then 97%, now 95% and still drifting down."
    scale: [holding steady, starting to desaturate, severely desaturated]
    answerAt: 1
    why: "아직 많이 낮지 않아도 계속 떨어지는 추세면 'starting to desaturate'로 일찍 알려요. 중단해야 할 때 팀이 바로 움직일 수 있어요."
    example: "He's starting to desaturate — I'm watching his saturation closely."
    exKo: "산소포화도가 떨어지기 시작해요 — 계속 지켜보고 있어요."
  - kind: swap
    words: [w-abort, w-reconnect, w-vent]
    who: "동료에게 · 검사 중 포화도 급락"
    icon: monitor
    before: ["Sats are dropping fast — let's ", "keep going", " and reconnect the vent."]
    options: [abort, keep going, wait it out]
    answer: abort
    notes:
      abort: "검사를 즉시 멈춘다는 정확한 말. 뒤의 reconnect the vent와 바로 이어진다."
      keep going: "포화도가 빠르게 떨어지는데 검사를 계속하면 저산소와 부정맥 위험이 커진다."
      wait it out: "조금 더 지켜보자는 말이라 급변 상황에서 대응이 늦어진다."
    why: "무호흡 검사 중 포화도가 급히 떨어지거나 혈압이 무너지면 검사를 중단하고 인공호흡기를 다시 연결해요. 이때 쓰는 말이 'abort'예요."
