# core-language-icu 가벼운 정리(결정 11) — build_core-language-icu.py가 읽는다
untag_everywhere:
  # 공통 쉬운 단어 목록
  w-time: "공통 쉬운 단어(time) — 태그만 뺀다(문장은 그대로)"
  w-now: "공통 쉬운 단어(now) — 태그만 뺀다(문장은 그대로)"
  w-minute: "공통 쉬운 단어(minute) — 태그만 뺀다(문장은 그대로)"
  w-doctor: "공통 쉬운 단어(doctor) — 태그만 뺀다(문장은 그대로)"
  w-family: "공통 쉬운 단어(family) — 태그만 뺀다(문장은 그대로)"
  w-mother: "공통 쉬운 단어(mother) — 태그만 뺀다(문장은 그대로)"
  w-father: "공통 쉬운 단어(father) — 태그만 뺀다(문장은 그대로)"
  w-body: "공통 쉬운 단어(body) — 태그만 뺀다(문장은 그대로)"
  w-hand: "공통 쉬운 단어(hand) — 태그만 뺀다(문장은 그대로)"
  w-know: "공통 쉬운 단어(know) — 태그만 뺀다(문장은 그대로)"
  w-see: "공통 쉬운 단어(see) — 태그만 뺀다(문장은 그대로)"
  w-come: "공통 쉬운 단어(come) — 태그만 뺀다(문장은 그대로)"
  w-zero: "공통 쉬운 단어(zero) — 태그만 뺀다(문장은 그대로)"
  w-ten: "공통 쉬운 단어(ten) — 태그만 뺀다(문장은 그대로)"
  # 홀로 뜻이 서지 않는 조각
  w-away: "right away의 away에 ko '즉시'가 붙어 카드 홀로 뜻이 서지 않는다 — 태그를 뺀다(w-right가 같은 문장에 있다)"
  w-down: "write it down의 down에 ko '적어서'가 붙어 카드 홀로 뜻이 서지 않는다 — 태그를 뺀다(w-write가 같은 문장에 있다)"
  w-common: "common ground를 w-ground 한 장(헤드워드 common ground)으로 합친다 — 겹치는 w-common 태그를 뺀다"
  w-same: "on the same page를 w-page 한 장(헤드워드 on the same page)으로 합친다 — 겹치는 w-same 태그를 뺀다"
untag_at:
  - {sit: 10, idx: 1, id: w-face, why: "I'll face him은 동사인데 명사 카드(얼굴)가 태그됐다 — 태그를 뺀다"}
  - {sit: 8, idx: 1, id: w-like, why: "How would you like는 동사 like인데 전치사 카드(~처럼)가 태그됐다 — 태그를 뺀다"}
  - {sit: 18, idx: 0, id: w-fair, why: "assess him fairly는 부사인데 형용사 카드(공정한)가 태그됐다 — 태그를 뺀다(같은 상황 be fair to him에 남는다)"}
  - {sit: 18, idx: 6, id: w-way, why: "either way는 '어느 쪽이든'이라 카드(방식)와 뜻이 다르다 — 태그를 뺀다"}
  - {sit: 19, idx: 5, id: w-way, why: "on the way는 '오는 중'이라 카드(방식)와 뜻이 다르다 — 태그를 뺀다"}
  - {sit: 16, idx: 6, id: w-matter, why: "no matter how small은 '아무리 ~해도'라 카드(중요하다)와 뜻이 다르다 — 태그를 뺀다"}
word_edits:
  w-speak: {set: {ko: "(소리 내어) 말하다"}, why: "w-say와 ko(말하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — 문장 대부분(can't speak·speak clearly·speak slowly)이 소리 내어 말하기라 그쪽으로 가른다"}
  w-talk: {set: {ko: "이야기하다"}, why: "w-say·w-speak와 ko(말하다)가 같다 — 다른 ICU 주제(16건)와 같은 이야기하다로"}
  w-check: {set: {ko: "살펴보다"}, why: "w-confirm과 ko(확인하다)가 같다 — check on you·keep checking in은 살펴보다"}
  w-pause: {set: {ko: "잠시 멈추다"}, why: "w-stop과 ko(멈추다)가 같다 — 다른 ICU 주제(5건)와 같은 잠시 멈추다로"}
  w-fully: {set: {ko: "충분히"}, why: "w-completely와 ko(완전히)가 같다 — explain the procedure fully는 충분히 설명하다"}
  w-honor: {set: {ko: "받들다"}, why: "w-respect와 ko(존중하다)가 같다 — honors your values는 가치를 받들다"}
  w-lot: {set: {ko: "많음"}, why: "w-much와 ko(많이)가 같다 — 다른 ICU 주제와 같은 명사 뜻 많음으로"}
  w-fast: {set: {ko: "빠르게"}, why: "문장(going too fast)은 부사 — 다른 ICU 주제(10건)와 같은 빠르게로"}
  w-call: {set: {ko: "부르다; 전화하다"}, why: "문장 3건 중 2건(call the doctor·call this number)이 전화하다 — 두 뜻을 함께 적는다"}
  w-keep: {set: {ko: "유지하다"}, why: "문장 6건 중 지키다로 읽히는 것은 keep … safe뿐 — keep using·keep checking·keep things simple까지 맞는 유지하다로(다른 ICU 주제 18건과 같다)"}
  w-concern: {set: {ko: "걱정시키다"}, why: "유일한 문장(what concerns you)이 동사인데 명사 카드(우려)였다 — 동사로"}
  w-ground: {set: {en: "common ground", ipa: "/ˈkɑːmən ˈɡraʊnd/", ko: "공통점"}, why: "ground 한 낱말에 ko '공통 기반'이 붙어 카드 홀로 뜻이 서지 않는다 — 구(common ground)로 헤드워드를 맞추고 w-common을 합친다"}
  w-page: {set: {en: "on the same page", ipa: "/ɑːn ðə seɪm peɪdʒ/", ko: "같은 이해를 하는"}, why: "page에 ko '페이지'가 붙었지만 문장은 관용구 on the same page — 구로 헤드워드를 맞추고 w-same을 합친다"}
  w-aid: {set: {en: "hearing aid", ipa: "/ˈhɪrɪŋ eɪd/", ko: "보청기"}, why: "aid(보조기기) 홀로는 문장(hearing aids)의 뜻을 못 담는다 — ER core-language와 같은 hearing aid로"}
