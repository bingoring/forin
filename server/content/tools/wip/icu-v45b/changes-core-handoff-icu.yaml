  id: w-repeat
  fields:
  - ko
  why: '''repeat lactate''·''Repeat her chest X-ray''(재검)에는 ''다시 말하다''가 안 맞는다 — ICU 다른 주제 다수와 같은 반복하다로'
- kind: word
  id: w-titrate
  fields:
  - ko
  why: ICU 다른 주제 11곳이 적정하다 — 같은 id의 ko를 맞춘다
- kind: word
  id: w-update
  fields:
  - ko
  why: '''Family wants an update''의 명사 — ''알려주기''는 어색하다'
- kind: word
  id: w-round
  fields:
  - ko
  - example
  why: 남은 태그 셋이 모두 투약·압박의 '차례'(rounds of epi, round three) — 회진(doctor rounds) 태그를 빼며 ko·example을 그 뜻으로
- kind: word
  id: w-advance
  fields:
  - ko
  why: '''advance her diet''·''advance the rate''(식이·속도를 올리다) — ''진전시키다''는 뜻이 흐리다'
- kind: word
  id: w-again
  fields:
  - ko
  why: w-back(다시)과 ko가 같아 정답이 둘 — 'say that again'의 한 번 더로
- kind: word
  id: w-confirm
  fields:
  - ko
  why: w-check(확인하다)와 ko가 같아 정답이 둘 — 라인·약물을 맞춰 보는 대조 확인으로
- kind: word
  id: w-assistance
  fields:
  - ko
  why: w-help(도움)와 ko가 같아 정답이 둘 — 'assistance to stand'의 부축으로
- kind: word
  id: w-sick
  fields:
  - ko
  why: '''your sickest''(가장 위중한 환자)로만 쓰이고 문장 ko도 위중 — ''아픈''은 너무 가볍다'
- kind: word
  id: w-call
  fields:
  - ko
  why: w-page(호출하다)와 ko가 같아 듣고 뜻 고르기에서 정답이 둘 — 'call me'의 부르다로(ICU 다른 주제 다수와 같음)
- kind: word
  id: w-feed
  fields:
  - ko
  why: '''tube feeds''의 feed — ''급식''은 학교 급식처럼 읽힌다'
- kind: word
  id: w-rather
  fields:
  - ko
  why: '''rather than waiting''의 rather — ''차라리''는 뜻이 다르다'
- kind: word
  id: w-close
  fields:
  - ko
  why: '''the closest eye''(가장 면밀한 관찰)로만 쓰이는데 ko가 거리의 ''가까운''이었다'
- kind: word-add
  id: w-from-the-top
  why: 쉬운 w-day·w-know를 빼 SBAR 구조 인계 기초가 V3(8개)를 못 채운다 — 문장 2에 이미 있는 구 'from the top'(인계를 처음부터)
