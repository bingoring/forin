situations:
- title: 통역 서비스 요청
  sentences:
  - en: Let me get a professional interpreter for you.
    ko: 제가 전문 통역사를 불러드릴게요.
    chunks:
    - Let me get
    - a professional interpreter
    - for you
    - .
    words:
    - w-professional
    - w-interpreter
    goal: 1
    tag: 통역 제안
    icon: speech
    why: '''Let me''로 시작하면 지시가 아니라 도와 드리겠다는 제안으로 들려요. professional은 가족이 아니라 훈련받은 통역사라는 점을 짚어요.'
    decoy: from you
    distractorsKo:
    - 제가 통역사를 부르기 전에 차트를 볼게요.
    - 제가 전문 통역사 이름을 알려드릴게요.
    blank:
      answer: professional
      options:
      - en: professional
      - en: family
      - en: volunteer
      - en: temporary
  - en: We have interpreter services available right away.
    ko: 지금 바로 이용할 수 있는 통역 서비스가 있어요.
    chunks:
    - We have
    - interpreter services
    - available
    - right away
    - .
    words:
    - w-interpreter
    - w-service
    - w-available
    - w-right
    - w-away
    goal: 1
    tag: 서비스 안내
    icon: hospital
    why: available은 지금 쓸 수 있다는 뜻이고 right away가 기다릴 필요 없다는 안심을 줘요. We have로 병원이 갖춘 서비스라고 말해요.
    decoy: for children
    distractorsKo:
    - 지금 바로 이용할 수 있는 통역 책자가 있어요.
    - 지금 바로 이용할 수 있는 휴게 공간이 있어요.
    blank:
      answer: services
      options:
      - en: services
      - en: forms
      - en: chairs
      - en: badges
  - en: I want to make sure you understand everything.
    ko: 다 이해하셨는지 확실히 하고 싶어요.
    chunks:
    - I want to
    - make sure
    - you understand
    - everything
    - .
    words:
    - w-want
    - w-make-sure
    - w-understand
    - w-everything
    goal: 2
    tag: 이해 확인
    icon: check
    why: '''make sure''는 빈틈없이 확인하겠다는 말이고, ''I want to''로 시작하면 시험이 아니라 내 바람으로 부드럽게 들려요.'
    decoy: I used to
    distractorsKo:
    - 이해하셨는지 확실히 하려고 앉으세요.
    - 다 이해하시도록 천천히 말하고 싶어요.
    blank:
      answer: understand
      options:
      - en: understand
      - en: memorize
      - en: recite
      - en: practice
  - en: What language do you speak at home?
    ko: 집에서는 어떤 언어를 쓰세요?
    chunks:
    - What language
    - do you speak
    - at home
    - '?'
    words:
    - w-language
    - w-speak
    - w-home
    goal: 2
    tag: 언어 질문
    icon: speech
    why: What language로 묻고 at home을 붙이면 병원이 아니라 가장 편한 일상 언어를 끌어내요. 의문문이라 do you speak 순서로 써요.
    decoy: Which country
    distractorsKo:
    - 집에서는 어떤 음식을 드세요?
    - 집에서는 어떤 약을 쓰세요?
    blank:
      answer: speak
      options:
      - en: speak
      - en: read
      - en: write
      - en: study
  - en: The interpreter will be here in just a few minutes.
    ko: 통역사가 몇 분 안에 도착할 거예요.
    chunks:
    - The interpreter
    - will be here
    - in just a few
    - minutes
    - .
    words:
    - w-interpreter
    - w-here
    - w-few
    - w-minute
    goal: 1
    tag: 도착 안내
    icon: bell
    why: will be here는 곧 온다는 약속이고 just가 오래 걸리지 않는다는 안심을 더해요. a few는 정확한 수가 아니라 짧다는 느낌을 줘요.
    decoy: The consent form
    distractorsKo:
    - 통역사가 몇 분 안에 서류를 가져올 거예요.
    - 통역사가 몇 분 안에 전화할 거예요.
    blank:
      answer: interpreter
      options:
      - en: interpreter
      - en: surgeon
      - en: pharmacist
      - en: transporter
  order:
    tag: 대화 흐름
    icon: compass
    ko: 통역사 요청 4문장 순서
    why: 통역사를 부르겠다고 제안한 뒤 쓰는 언어를 묻고, 대답에 감사하며 맞는 통역사를 요청했다고 알린 다음 곧 온다고 안심시켜요.
    lines:
    - en: I'd like to bring in a professional interpreter for you.
      icon: hospital
      ko: 전문 통역사를 불러드리고 싶어요
      note: 제안
    - en: First, what language do you speak at home?
      icon: speech
      ko: 먼저, 집에서는 어떤 언어를 쓰세요?
      note: 질문
    - en: Thanks — that helps me request the right interpreter.
      icon: check
      ko: 고마워요, 맞는 통역사를 요청하는 데 도움이 돼요
      note: 확인
    - en: They will be here in just a few minutes.
      icon: bell
      ko: 통역사가 몇 분 안에 도착할 거예요
      note: 도착
- title: 동의 통역 확인
  sentences:
  - en: The interpreter will explain the consent in your language.
    ko: 통역사가 동의서 내용을 환자분 언어로 설명해 드릴 거예요.
    chunks:
    - The interpreter
    - will explain
    - the consent
    - in your language
    - .
    words:
    - w-interpreter
    - w-explain
    - w-consent
    - w-language
    goal: 1
    tag: 동의 설명
    icon: speech
    why: in your language로 설명이 환자의 언어로 이루어진다는 점을 분명히 해요. will은 곧 일어날 일을 안내하는 미래형이에요.
    decoy: the billing form
    distractorsKo:
    - 통역사가 수술 일정을 환자분 언어로 설명해 드릴 거예요.
    - 통역사가 마취 순서를 환자분 언어로 설명해 드릴 거예요.
    blank:
      answer: interpreter
      options:
      - en: interpreter
      - en: technician
      - en: dietitian
      - en: chaplain
  - en: Do you understand what you're agreeing to?
    ko: 지금 동의하시는 게 뭔지 이해가 되세요?
    chunks:
    - Do you understand
    - what you're
    - agreeing to
    - '?'
    words:
    - w-understand
    - w-agree
    goal: 2
    tag: 이해 질문
    icon: magnify
    why: '''what you''re agreeing to''로 서명 자체가 아니라 동의하는 내용을 이해했는지 물어요. 끝의 전치사 to를 빼먹지 않는 게 포인트예요.'
    decoy: Do you recommend
    distractorsKo:
    - 지금 동의하시는 게 뭔지 설명해 드릴까요?
    - 지금 동의하시기 전에 질문이 있으세요?
    blank:
      answer: agreeing
      options:
      - en: agreeing
      - en: listening
      - en: objecting
      - en: pointing
  - en: Please ask any questions through the interpreter.
    ko: 궁금한 건 통역사를 통해 물어보세요.
    chunks:
    - Please ask
    - any questions
    - through the interpreter
    - .
    words:
    - w-ask
    - w-question
    - w-through
    - w-interpreter
    goal: 1
    tag: 질문 안내
    icon: speech
    why: Please ask로 정중하게 질문을 권하고, through the interpreter로 어떤 경로로 물어야 하는지 정해 줘요. any는 '아무 질문이든'이라는 폭을 줘요.
    decoy: with this pamphlet
    distractorsKo:
    - 궁금한 건 물어보려고 손을 들어 보세요.
    - 답변은 통역사를 통해 들으실 수 있어요.
    blank:
      answer: through
      options:
      - en: through
      - en: behind
      - en: beyond
      - en: beneath
  - en: Can you tell me in your own words what this means?
    ko: 이게 무슨 뜻인지 환자분 말로 다시 말씀해 주실래요?
    chunks:
    - Can you tell me
    - in your own words
    - what this
    - means
    - '?'
    words:
    - w-tell
    - w-own
    - w-word
    - w-mean
    goal: 2
    tag: 다시 말하기
    icon: speech
    why: '''what this means''는 방금 들은 내용의 뜻을 묻는 절이에요. ''in your own words''를 붙이면 따라 읽기가 아니라 자기 말로 풀어 보게 돼요.'
    decoy: where this hurts
    distractorsKo:
    - 이게 무슨 뜻인지 말씀해 주시려고 먼저 숨을 쉬세요.
    - 이게 무슨 뜻인지 아시는지 알고 싶어서 물어요.
    blank:
      answer: words
      options:
      - en: words
      - en: hands
      - en: eyes
      - en: notes
  - en: A nod isn't enough — I need you to explain it back.
    ko: 고개만 끄덕이시는 걸로는 부족해요 — 직접 다시 설명해 주셔야 해요.
    chunks:
    - A nod isn't enough
    - — I need you
    - to explain it
    - back
    - .
    words:
    - w-nod
    - w-enough
    - w-need
    - w-explain
    - w-back
    goal: 2
    tag: 복창 요청
    icon: redo
    why: A nod isn't enough로 끄덕임이 이해의 증거가 아니라고 먼저 말하고, I need you to로 해야 할 일을 직접 요청해요. 비난 없이 이유와 요청을 한 문장에 묶어요.
    decoy: to rewrite it
    distractorsKo:
    - 고개만 끄덕이시는 걸로는 부족해요 — 직접 다시 설명하려고 잠깐 쉬어 주세요.
    - 고개만 끄덕이시는 걸로는 부족해요 — 이해하셨는지 확인하려는 거예요.
    blank:
      answer: explain
      options:
      - en: explain
      - en: draw
      - en: copy
      - en: shout
  order:
    tag: 대화 흐름
    icon: compass
    ko: 동의 이해 확인 4문장 순서
    why: 통역사가 동의서를 설명해 준다고 알린 뒤 이해했는지 묻고, 자기 말로 다시 말하게 한 다음 끄덕임만으로는 부족하다고 마무리해요.
    lines:
