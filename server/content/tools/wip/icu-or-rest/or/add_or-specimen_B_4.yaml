  - ["이름 불일치", faceWorried, "'doesn't match'는 같아야 할 두 가지가 어긋났다는 뜻이에요. 환자 이름과 라벨이 어긋났다고 짚어요.", "is printed on", "이 환자분 이름이 이 용기와 일치하지 않아요.", "이 환자분 이름이 이 차트와 일치하지 않아요.", "name", "date", "room", "bed"]
