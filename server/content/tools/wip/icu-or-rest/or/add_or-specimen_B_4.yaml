situations:
- title: 병리 요청서 일치
  s:
  - ["일치 질문", magnify, "'Does … match …?'는 두 서류가 같은지 묻는 기본 형태예요. 'the specimen label'은 검체 용기에 붙은 라벨을 가리켜요.", "mention", "요청서가 검체 용기와 일치하나요?", "요청서가 검체 날짜와 일치하나요?", "requisition", "invoice", "schedule", "receipt"]
  - ["부위·쪽 확인", check, "'site'는 몸의 어느 부위인지, 'side'는 왼쪽·오른쪽을 가리켜요. 둘을 한 쌍으로 말해야 수술 부위가 확실해져요.", "and chart", "부위와 쪽을 찾아요.", "부위와 쪽을 보여 줘요.", "side", "size", "date", "name"]
  - ["불일치 정정", pencil, "'any'를 붙여 어떤 불일치든 예외 없이 고친다는 뜻이 돼요. 'before sending'은 보내기 전이 고칠 마지막 기회라는 뜻이에요.", "any smudge", "보내기 전에 불일치를 표시할게요.", "보내기 전에 불일치를 세어 볼게요.", "discrepancy", "invoice", "schedule", "delay"]
  - ["불일치 발견", faceWorried, "'doesn't match'는 같아야 할 두 가지가 어긋났다는 발견이에요. 어느 서류와 어느 라벨인지 'This'와 'the'로 짚어요.", "is clipped to", "이 요청서가 환자 차트와 일치하지 않아요.", "이 요청서가 검체 용기와 일치하지 않아요.", "label", "chart", "bill", "order"]
  - ["보내기 전 부위 확인", check, "'before we send this'는 보낸 뒤에는 부위를 바로잡기 어렵다는 이유예요. \"Let's check\"는 같이 보자는 제안이에요.", "while we wait", "보내기 전에 부위를 사진 찍어요.", "보내기 전에 부위를 그려요.", "site", "side", "size", "name"]
  - ["즉시 정정", pencil, "'right now'는 미루지 않고 지금이라는 뜻이에요. 'correct'는 틀린 것을 맞게 고친다는 동사예요.", "this stain", "지금 바로 이 불일치를 기록할게요.", "지금 바로 이 불일치를 읽어 드릴게요.", "correct", "copy", "count", "post"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 병리 요청서 일치 4문장 순서
    why: 요청서와 라벨이 같은지 묻고, 다르다고 답하고, 그 불일치를 바로 고친 뒤 보내기 전에 부위를 다시 확인해요.
    lines:
    - ["Does the requisition match the specimen label?", magnify, "요청서가 검체 라벨과 일치하나요?", "질문"]
    - ["No, the site on the two doesn't match.", faceWorried, "아니요, 둘의 부위가 일치하지 않아요", "답"]
    - ["I'll correct that discrepancy right now.", pencil, "그 불일치를 지금 바로 정정할게요", "정정"]
    - ["Once it's fixed, let's check the site again before we send this.", check, "고치면 보내기 전에 부위를 다시 확인해요", "재확인"]
- title: 라벨 없는 검체 발견
  s:
  - ["라벨 없음", faceWorried, "'has no'는 있어야 할 것이 없다는 가장 짧은 표현이에요. 'This container'로 지금 손에 든 용기를 가리켜요.", "This bottle", "이 용기에는 뚜껑이 없어요.", "이 용기에는 날짜가 없어요.", "label", "lid", "handle", "stand"]
  - ["발송 중지", siren, "문장 앞 'Stop'이 먼저 들려 급하다는 느낌을 줘요. 'unlabeled'는 un-이 붙어 라벨이 없다는 뜻이에요.", "open", "멈추세요—라벨 없는 검체는 포장할 수 없어요.", "멈추세요—라벨 없는 검체는 분류할 수 없어요.", "unlabeled", "unsealed", "oversized", "duplicate"]
  - ["신원 확인", handshake2, "'with the surgeon'으로 누구와 함께 하는지 밝혀요. 검체를 아는 사람은 수술 중 꺼낸 집도의예요.", "on the cart", "지금 집도의와 함께 사진을 찍어요.", "지금 집도의와 함께 용기를 닫아요.", "identify", "weigh", "measure", "photograph"]
  - ["라벨 필수", shield, "'without'은 없이는이라는 뜻이라 조건이 먼저 들려요. 'We can't'로 개인 판단이 아니라 규칙이라는 느낌을 줘요.", "without a pen", "요청서 없이는 이걸 보낼 수 없어요.", "서명 없이는 이걸 보낼 수 없어요.", "label", "lid", "cap", "box"]
  - ["누구 검체인지", magnify, "'whose'는 누구의라는 뜻이라 검체의 주인을 묻는 말이에요. \"Let's stop and\"로 일단 멈추고 알아본다는 순서를 말해요.", "this was", "멈추고 이게 무슨 검체인지 알아봐요.", "멈추고 이게 어디 검체인지 알아봐요.", "whose", "which", "what", "where"]
  - ["확인 후 라벨", pushpin, "'as soon as'는 그 일이 끝나는 즉시라는 시간 표현이에요. 환자를 확인해야 라벨에 쓸 이름이 정해져요.", "I'll mail it", "환자를 확인하는 대로 포장할게요.", "환자를 확인하는 대로 서명할게요.", "patient", "surgeon", "family", "donor"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 라벨 없는 검체 발견 4문장 순서
    why: 라벨이 없다고 알리고, 그래서 보낼 수 없다고 막고, 집도의와 함께 누구 것인지 확인한 뒤 확인되면 라벨을 붙여요.
    lines:
    - ["This container has no label.", faceWorried, "이 용기에는 라벨이 없어요", "발견"]
    - ["So we can't send it like this.", siren, "그러니 이대로는 보낼 수 없어요", "중지"]
    - ["To fix that, let's identify it now with the surgeon.", handshake2, "해결하려면 지금 집도의와 함께 신원을 확인해요", "확인"]
    - ["Once the surgeon says whose it is, I'll label it.", pushpin, "집도의가 누구 것인지 말하면 라벨할게요", "라벨"]
- title: 검체 분실 즉시 대응
  s:
  - ["분실 알림", siren, "'unaccounted for'는 어디 있는지 확인되지 않는다는 병원식 표현이에요. 'One specimen'으로 하나가 빠졌다고 짚어요.", "The tray", "검체 하나가 오염됐어요.", "검체 하나가 깨졌어요.", "unaccounted", "unlabeled", "unsealed", "unopened"]
  - ["멈추고 수색", siren, "\"Let's stop and\"로 하던 일을 멈추고 함께 찾자는 제안이에요. 'the field and containers'로 찾을 곳을 구체적으로 짚어요.", "the hallway and lobby", "수술 시야와 용기들을 수색하려고 조명을 켜요.", "수술 시야와 용기들을 수색하기 전에 장갑을 새로 껴요.", "field", "floor", "table", "cart"]
  - ["즉시 보고", pager, "'to the surgeon and pathology'로 알릴 사람 둘을 한 번에 말해요. 'now'로 미루지 않고 지금이라고 못 박아요.", "the weight", "집도의와 병리과에 보고하려고 번호를 찾을게요.", "집도의와 병리과에 보고하기 전에 시각을 적을게요.", "reporting", "reading", "printing", "filing"]
  - ["전부 수색", magnify, "'every'로 하나도 빼지 않는다는 뜻이에요. 'We need to'는 선택이 아니라 필요하다는 말이에요.", "under the bed", "수술 시야의 용기를 전부 수색하려고 조명을 켜야 해요.", "수술 시야의 용기를 전부 수색하기 전에 마스크를 바꿔야 해요.", "container", "drawer", "bin", "bag"]
  - ["바로 보고", pager, "'right away'는 미루지 않고 곧바로라는 뜻이에요. 'the missing specimen'은 없어진 바로 그 검체를 가리켜요.", "the empty tray", "검체를 보고하려고 번호를 찾아요.", "검체를 보고하기 전에 시각을 적어요.", "report", "weigh", "label", "photograph"]
  - ["체계적 수색", magnify, "'systematically'는 순서를 정해 빠짐없이라는 뜻이에요. 'before we panic'은 당황하면 놓치기 쉬워서라는 이유예요.", "with a flashlight", "당황하기 전에 수술 시야를 빠르게 수색할게요.", "당황하기 전에 수술 카트를 체계적으로 수색할게요.", "systematically", "quickly", "loudly", "alone"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 검체 분실 즉시 대응 4문장 순서
    why: 하나가 비었다고 알리고, 바로 집도의와 병리과에 보고하고, 그쪽이 바라는 대로 멈추고 시야와 용기를 찾은 뒤 용기는 하나씩 전부 수색해요.
    lines:
    - ["One specimen is unaccounted for.", siren, "검체 하나가 사라졌어요", "발견"]
    - ["I'm reporting this to the surgeon and pathology now.", pager, "지금 집도의와 병리과에 이걸 보고할게요", "보고"]
    - ["They'll need us to stop and search the field and containers.", magnify, "그쪽은 우리가 멈추고 시야와 용기들을 수색하길 원해요", "수색"]
    - ["That includes every container on the field, one by one.", magnify, "시야의 용기를 하나씩 전부 수색하는 것도 포함돼요", "전수"]
- title: 냉동절편 결과 수술 변경
  s:
  - ["양성 보고", faceWorried, "'are positive'는 암세포가 남았다는 뜻의 병리 결과 표현이에요. 'The frozen margins'로 어느 결과인지 짚어요.", "are tagged", "냉동절편 절제연이 도착했어요.", "냉동절편 절제연이 접수됐어요.", "positive", "ready", "labeled", "sealed"]
  - ["절제 확대", scalpel, "'extending'은 범위를 늘린다는 진행형이에요. 대시 뒤 \"let's set up\"으로 바로 이어지는 행동을 말해요.", "let's write down", "절제 범위를 확대할게요—정리해요.", "절제 범위를 확대할게요—기록해요.", "resection", "incision", "dressing", "drape"]
  - ["용기 준비", lab, "'additional'은 이미 있는 것 외에 더라는 뜻이에요. 'prep'은 'prepare'를 줄인 병원 속어예요.", "I'll weigh", "추가 검체 용기를 세어 볼게요.", "추가 검체 용기를 옮길게요.", "additional", "larger", "smaller", "clean"]
  - ["결과 공유", speech, "'came back positive'는 검사 결과가 돌아와 양성이었다는 말이에요. 'the team'에게 알려야 모두가 같이 움직여요.", "were on the form", "절제연이 접수됐다고 팀에 전해요.", "절제연이 도착했다고 팀에 전해요.", "tell", "ask", "thank", "remind"]
  - ["용기 추가", lab, "'if we're extending'은 확대가 사실일 때만이라는 조건이에요. 용기가 더 필요한 이유가 뒤에 와요.", "if we're closing", "절제 범위를 확대하면 라벨이 더 필요해요.", "절제 범위를 확대하면 요청서가 더 필요해요.", "more", "fewer", "larger", "clean"]
  - ["더 넓은 절제 준비", scalpel, "'wider'는 더 넓은 쪽으로의 변화라는 뜻이에요. 'right now'로 미루지 않고 지금 준비한다고 해요.", "a longer incision", "지금 바로 더 넓은 절제를 위해 기록할게요.", "지금 바로 더 넓은 절제를 위해 정리할게요.", "wider", "smaller", "shorter", "simpler"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 냉동절편 결과 수술 변경 4문장 순서
    why: 양성이라는 결과를 말하고, 그래서 절제를 확대하고, 새 조직용 용기를 준비한 뒤 나오는 대로 용기마다 라벨해요.
    lines:
    - ["The frozen margins are positive.", faceWorried, "냉동절편 절제연이 양성이에요", "결과"]
    - ["That means we're extending the resection.", scalpel, "그래서 절제 범위를 확대해요", "확대"]
    - ["I'll prep additional containers for the new tissue.", lab, "새 조직용 추가 용기를 준비할게요", "준비"]
    - ["I'll label each new container as soon as it's filled.", pushpin, "새 용기는 채워지는 대로 라벨할게요", "라벨"]
- title: 오염 검체 재채취
  s:
  - ["오염 발생", faceWorried, "'touched'는 닿았다는 과거형이고 'non-sterile'은 무균이 아니라는 뜻이에요. 무엇이 닿았는지가 먼저 들려요.", "the metal tray", "이 장갑이 무균이 아닌 표면에 닿았어요.", "이 가위가 무균이 아닌 표면에 닿았어요.", "touched", "wiped", "covered", "filled"]
  - ["버리고 재채취", bandage, "\"Let's\"로 같이 하자고 해요. 'discard'는 버린다는 뜻이고 're-'는 다시라는 뜻이에요.", "and re-label", "이걸 버리고 서둘러 다시 채취해요.", "이걸 버리고 천천히 다시 채취해요.", "discard", "label", "weigh", "count"]
  - ["새 키트", bandage, "'a new'가 새것이라는 점을 분명히 해요. 'sterile kit'는 포장이 뜯기지 않은 무균 도구 세트예요.", "I'll count", "새 무균 포를 열게요.", "새 무균 가운을 열게요.", "kit", "gown", "drape", "glove"]
  - ["무균 상실", faceWorried, "'isn't … anymore'는 예전에는 그랬지만 지금은 아니라는 뜻이에요. 대시 뒤에서 바로 할 일을 말해요.", "let's log it", "이 검체는 더 이상 무균이 아니에요—보고해요.", "이 검체는 더 이상 무균이 아니에요—사진 찍어요.", "sterile", "dry", "wet", "full"]
  - ["새 키트로 채취", bandage, "'a fresh sample'은 이미 쓴 것이 아닌 새 검체라는 뜻이에요. 'with a new kit'로 도구도 새것이라고 해요.", "a dry swab", "새 키트로 신선한 검체를 다시 포장해요.", "새 키트로 신선한 검체를 다시 세어요.", "fresh", "dry", "large", "small"]
  - ["접촉 확인", magnify, "'was touched'는 수동태라 누가 만졌는지보다 닿았다는 사실을 말해요. 'before we discard it'은 버리기 전에 확인한다는 순서예요.", "the label", "버리기 전에 표면이 젖었는지 확인할게요.", "버리기 전에 표면이 더러운지 확인할게요.", "touched", "wiped", "cleaned", "marked"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 오염 검체 재채취 4문장 순서
    why: 닿았다는 사실을 말하고, 그래서 무균이 아니라고 하고, 그 때문에 버리고 새 키트를 열고, 그 키트로 다시 채취해요.
    lines:
    - ["This sample touched a non-sterile surface.", faceWorried, "이 검체가 무균이 아닌 표면에 닿았어요", "발생"]
    - ["That means it isn't sterile anymore.", faceWorried, "그래서 더 이상 무균이 아니에요", "판단"]
    - ["Because of that, we'll discard it and open a new sterile kit.", bandage, "그래서 버리고 새 무균 키트를 열 거예요", "교체"]
    - ["I'll collect a fresh sample with that kit.", bandage, "그 키트로 신선한 검체를 채취할게요", "재채취"]
- title: 잘못된 환자 라벨
  s:
  - ["라벨 오류", faceWorried, "'belongs to'는 소유나 귀속을 말해요. 'another patient'로 지금 환자가 아니라 다른 사람의 것이라는 뜻이에요.", "another tray", "이 라벨은 다른 검체 것이에요.", "이 라벨은 다른 날짜 것이에요.", "belongs", "refers", "points", "goes"]
  - ["보내기 중지", siren, "'Stop'이 맨 앞에서 급하다는 느낌을 줘요. 'until it's corrected'는 고쳐질 때까지만이라는 조건이에요.", "open this", "멈추세요—정정될 때까지 이걸 서명하지 마세요.", "멈추세요—정정될 때까지 이걸 포장하지 마세요.", "send", "open", "move", "sign"]
