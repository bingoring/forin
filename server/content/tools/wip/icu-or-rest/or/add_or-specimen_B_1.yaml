# [tag, icon, why, decoy, ko1, ko2, ans, w1, w2, w3]
situations:
- title: 검체 용기 라벨 부착
  s:
  - ["라벨 부착", pushpin, "'with the patient's name'을 뒤에 붙여 무엇으로 표시하는지 밝혀요. 'I'm … -ing'는 지금 하는 중이라는 진행형이에요.", "that transport bag", "지금 이 가방에 환자분 이름으로 라벨을 붙이고 있어요.", "지금 이 용기에 환자분 이름으로 요청서를 붙이고 있어요.", "container", "monitor", "gown", "chart"]
  - ["종류 확인", magnify, "문장 끝에 'correct?'를 붙이면 단정이 아니라 상대에게 확인을 구하는 질문이 돼요. 'This is'로 눈앞의 것을 가리켜요.", ", ready", "이거 담낭 보셨죠?", "이거 담낭 받으셨죠?", "gallbladder", "appendix", "spleen", "kidney"]
  - ["기재", pencil, "'I'll'은 지금 정해서 하겠다는 말이라 바로 하겠다는 약속처럼 들려요. 날짜와 시간은 한 묶음으로 같이 적어요.", "on the lid", "라벨에 날짜와 크기를 적을게요.", "라벨에 날짜와 시간을 읽을게요.", "date", "size", "color", "brand"]
  - ["맞는지 확인", check, "'Can you …?'는 지시보다 부드러운 부탁이에요. 'the correct specimen'에서 correct를 앞에 두어 맞는 것인지를 묻는다고 분명히 해요.", "the surgeon's list", "이게 맞는 검체인지 보여 주시겠어요?", "이게 맞는 검체인지 찾아 주시겠어요?", "correct", "spare", "clean", "first"]
  - ["이름 기재", pencil, "문장 끝의 'now'는 지금 막 하는 중이라는 점을 더해요. 'the patient's name'은 소유격으로 누구의 이름인지 정해요.", "the surgeon's initials", "지금 라벨에 환자분 이름을 읽고 있어요.", "지금 서식에 환자분 이름을 적고 있어요.", "label", "gown", "drape", "curtain"]
  - ["봉합 전 확인", calendar, "\"Let's\"로 같이 하자는 제안이 돼요. 'before'는 뒤따르는 동작보다 이 확인이 먼저라는 순서를 말해요.", "the biohazard bag", "용기를 밀봉하기 전에 시간을 확인해요.", "용기를 옮기기 전에 날짜를 확인해요.", "seal", "open", "fill", "lift"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 검체 용기 라벨 부착 4문장 순서
    why: 라벨을 붙이는 중이라고 알린 뒤 그것에 이름을 적고, 날짜와 시간을 더한 다음 밀봉 전에 함께 훑어요.
    lines:
    - ["I'm labeling this container now.", pushpin, "지금 이 용기에 라벨을 붙이고 있어요", "개시"]
    - ["I'll write the patient's name on it.", pencil, "그 위에 환자분 이름을 적을게요", "이름"]
    - ["Then I'll add the date and time next to the name.", calendar, "이름 옆에 날짜와 시간을 더 적을게요", "날짜"]
    - ["Let's read all of that together before I seal it.", check, "밀봉 전에 그걸 다 함께 읽어봐요", "확인"]
- title: 조직명 구두 확인
  s:
  - ["구두 확인", speaker, "'this is the appendix'를 질문 안에 넣어 상대가 직접 말로 맞다고 해 주기를 청해요. 'Can you'로 부드럽게 부탁해요.", "the incision", "이거 맹장 맞는지 보여 주시겠어요?", "이거 맹장 맞는지 들어 주시겠어요?", "appendix", "colon", "ovary", "tonsil"]
  - ["함께 읽기", speaker, "'out loud'는 눈으로만 훑지 않고 입으로 말한다는 뜻이에요. 'together'는 둘이 한목소리라는 점을 더해요.", "from the report", "함께 소리 내어 적어봐요.", "각자 소리 내어 읽어봐요.", "together", "alone", "slowly", "twice"]
  - ["그대로 기록", pencil, "'exactly'는 말한 것에 손대지 않고 있는 그대로 적는다는 뜻이에요. 'write down'은 메모처럼 받아 적는다는 말이에요.", "after rounds", "말씀하신 그대로 따라 할게요.", "말씀하신 그대로 훑어볼게요.", "exactly", "briefly", "later", "roughly"]
  - ["또렷이 말하기", mic, "'clearly'를 문장 끝에 두어 알아듣기 쉽게 말해 달라고 해요. 'please'가 붙어 부탁의 어조가 돼요.", "to the nurse", "검체 이름을 천천히 말씀해 주세요.", "검체 이름을 크게 말씀해 주세요.", "clearly", "quickly", "softly", "twice"]
  - ["확인 내용 기록", pencil, "'what you confirm'은 상대가 확인해 준 내용 그 자체를 가리켜요. 기록은 상대가 말한 것에 맞춘다는 뜻이에요.", "if I can", "확인해 주신 그대로 읽어 드릴게요.", "확인해 주신 그대로 옮겨 드릴게요.", "record", "change", "erase", "skip"]
  - ["함께 확인", handshake2, "'before it leaves the room'은 방을 나가기 전이 확인의 마지막 기회라는 뜻이에요. 'We'는 혼자가 아니라 팀이 같이 한다는 말이에요.", "at the door", "검체가 포장되기 전에 함께 확인해요.", "검체가 방을 떠나기 전에 따로 확인해요.", "together", "alone", "twice", "later"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 조직명 구두 확인 4문장 순서
    why: 먼저 검체 이름을 말해 달라고 청하고, 말해 주면 그대로 받아 적고, 적은 것을 다시 읽어 맞는지 보고, 방을 떠나기 전에 함께 마무리해요.
    lines:
    - ["Can you say the specimen name clearly?", mic, "검체 이름을 또렷하게 말해 주시겠어요?", "요청"]
    - ["I'll write down exactly what you said.", pencil, "말씀하신 그대로 적을게요", "기록"]
    - ["Now let's read it back and check it matches.", speaker, "이제 다시 읽어서 맞는지 봐요", "대조"]
    - ["Once it matches, we'll both sign off.", handshake2, "맞으면 둘이 같이 마무리해요", "마무리"]
