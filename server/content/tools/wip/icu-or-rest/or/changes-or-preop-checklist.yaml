- kind: word
  id: w-heavy
  fields:
  - en
  - ipa
  - ko
  why: 문장은 bleeding heavily(부사) — 헤드워드를 부사로
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm(확인하다)·w-verify와 ko가 겹쳐 — check는 살펴 점검하다
- kind: word
  id: w-flag
  fields:
  - ko
  why: w-label과 ko(표시하다)가 같아 정답이 둘 — flag는 눈에 띄게 표시해 두다
- kind: word
  id: w-label
  fields:
  - ko
  why: w-flag와 ko(표시하다)가 같아 정답이 둘 — label은 이름표를 붙이다
- kind: word
  id: w-run
  fields:
  - ko
  why: w-flow와 ko(흐르다)가 같아 정답이 둘 — IV가 running은 수액이 들어가는 중
- kind: word
  id: w-burn
  fields:
  - ko
  why: 문장은 burning(화끈거림 증상) — 타는 듯하다보다 화끈거리다
- kind: word
  id: w-critical
  fields:
  - ko
  why: 문장 ko가 '꼭 필요한 수치' — critical은 위중이 아니라 결정적으로 중대한(w-critically와도 가름)
- kind: word
  id: w-timing
  fields:
  - ko
  why: w-time(삭제)과 겹치던 '시각' 대신 시점
- kind: word
  id: w-number
  fields:
  - ko
  why: w-level·w-value와 ko(수치)가 같아 정답이 셋 — number는 숫자
- kind: word
  id: w-value
  fields:
  - ko
  why: w-level·w-number와 ko(수치)가 같아 정답이 셋 — value는 측정값
- kind: word
  id: w-replacement
  fields:
  - ko
  why: joint replacement는 인공관절 치환술
- kind: word
  id: w-correct
  fields:
  - ko
  why: 문장은 correct side(형용사) — 괄호의 동사 뜻은 뺌(동사 문장은 태그를 뺌)
- kind: word
  id: w-clear
  fields:
  - ko
  why: 문장은 airway clear(트여 있다) — 괄호 줄임
- kind: word
  id: w-release
  fields:
  - ko
  why: 혈액은행이 혈액을 내주는 말은 불출하다(방출은 어색)
- kind: word
  id: w-cut
  fields:
  - ko
  why: w-incision(절개)과 ko가 겹쳐 — cut은 피부를 가르다
- kind: word
  id: w-push
  fields:
  - ko
  why: w-give·w-infuse와 ko가 겹쳐 — push는 주사기를 밀어 넣다
- kind: word
  id: w-give
  fields:
  - ko
  why: w-push와 ko(투여하다)가 겹쳐 push를 가르며 give를 투여하다로 정리
- kind: word
  id: w-draw
  fields:
  - ko
  why: 괄호 줄임 — 주사기로 약을 뽑다
- kind: word
  id: w-record
  fields:
  - ko
  why: w-document(기록하다)와 ko가 겹쳐 — record는 기록 문서
- kind: word
  id: w-reach
  fields:
  - ko
  why: 문장은 reach the family(연락하다) — 연락이 닿다보다 연락하다
- kind: word
  id: w-prevention
  fields:
  - ko
  why: w-prevent(예방하다)와 ko가 겹쳐 — prevention은 예방 조치
- kind: word
  id: w-risk
  fields:
  - ko
  why: w-dangerous(위험한)와 ko가 겹쳐 — risk는 위험성
- kind: word
  id: w-order
  fields:
  - ko
  why: 괄호 줄임 — 의사의 지시(오더)
- kind: word
