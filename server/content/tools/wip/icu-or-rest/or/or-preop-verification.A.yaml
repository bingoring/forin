      Which side are we operating on today?: 환자가 직접 쪽을 말하게 한다. 환자의 답을 차트·표시와 비교할 수 있다.
      It's your right knee today, correct?: 정답을 먼저 말해 버려서 환자가 '네'만 하면 된다. 반대 쪽이어도 지나치기 쉽다.
      Just tell me if the right knee sounds okay.: 정답을 미리 알려 주는 유도 질문이라 환자의 기억을 확인하지 못한다.
    why: 부위·측은 환자가 스스로 말하게 해야 해요. 간호사가 '오른쪽 맞죠?' 하고 답을 먼저 주면 환자가 그냥 맞다고 해서 틀린 쪽도 걸러지지 않아요.
