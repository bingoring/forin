양측 수술 측 혼동 방지:
  - kind: slider
    words: [w-verify, w-left, w-side]
    cue: "Both eyes are scheduled today. The right eye is finished, and the team wants to move on to the left."
    scale: ["We'll check it all later", "Go ahead, we checked both earlier", "I'll verify the left side first"]
    answerAt: 2
    why: "양쪽 수술이라도 각 쪽은 따로 확인해요. 앞서 둘 다 확인했다고 넘어가거나 나중으로 미루면 반대 쪽 혼동을 막지 못해요. 두 번째 쪽도 시작 전에 다시 확인해요."
    example: "I'll verify the left side first."
    exKo: "왼쪽을 먼저 확인할게요."
  - kind: context
    words: [w-side]
    word: side
    ko: 쪽
    scenes:
      - {who: 간호사 → 집도의, icon: speech, en: "Confirming the right side — the consent, the mark and the chart all say right.", ok: true}
      - {who: 수술 기록, icon: board, en: "Bilateral: right side done first; left side marked separately.", ok: true}
      - {who: 불안한 환자에게, icon: faceWorried, en: "Both sides are done sequentially, ipsilateral first.", ok: false, fix: "We'll do one eye at a time, and we'll double-check each side before we start."}
    why: "뜻은 셋 다 '쪽'이에요. 의료진끼리나 기록에서는 쪽을 짧게 말하지만, 환자에게 'ipsilateral' 같은 용어를 쓰면 무슨 말인지 몰라 불안해져요. 한 쪽씩 확인한다고 쉽게 풀어 줘요."
추가 시술 동의 범위:
  - kind: slider
    words: [w-cover, w-clarify]
    cue: "A patient asks, \"If they find something else, can they fix it too?\" You are not the surgeon."
    scale: ["The surgeon will explain what's covered", "I think it's probably covered", "Yes, they can fix anything they find"]
    answerAt: 0
    why: "동의서가 어디까지 포함하는지는 집도의가 설명해요. 간호사가 '아마 포함된다'거나 '다 고쳐 준다'고 약속하면 사실과 다를 수 있고 환자의 동의 범위를 흐려요."
    example: "The surgeon will explain exactly what's covered."
    exKo: "무엇이 포함되는지는 집도의가 정확히 설명해 드릴 거예요."
  - kind: context
    words: [w-consent]
    word: consent
    ko: 동의서
    scenes:
      - {who: 간호사 → 환자, icon: me, en: "Your consent covers the planned procedure, and the surgeon will explain the rest.", ok: true}
      - {who: 수술 기록, icon: board, en: "Consent covers planned procedure only; questions deferred to surgeon.", ok: true}
      - {who: 환자에게, icon: faceWorried, en: "Your consent is non-transferable to adjunctive procedures absent separate execution.", ok: false, fix: "This form covers only the planned surgery, and the surgeon can talk with you about anything else."}
    why: "뜻은 셋 다 '동의서'예요. 기록에서는 짧게 쓰지만, 환자에게 법률 문서 같은 말을 쓰면 알아듣지 못해요. 이 서식이 무엇을 포함하는지 쉽게 말하고, 나머지는 집도의가 설명한다고 안내해요."
타임아웃 중 표시 불일치:
  - kind: slider
    words: [w-voice, w-stop]
    cue: "At time-out, a scrub tech sees that the consent and the mark disagree, but the surgeon looks impatient."
    scale: ["Say nothing and trust the team", "Mention it to someone afterward", "Speak up right now, out loud"]
    answerAt: 2
    why: "타임아웃은 팀 누구든 이견이 있으면 멈출 수 있는 자리예요. 조용히 있거나 나중으로 미루면 그 기회가 사라져요. 눈치가 보여도 지금 소리 내어 말하는 것이 맞아요."
    example: "Speak up right now, out loud."
    exKo: "지금 바로 소리 내어 말해요."
  - kind: swap
    words: [w-stop, w-consent, w-mark]
    who: "순환 간호사 → 팀 · 타임아웃 중 이견"
    icon: speech
    before: ["", "I think there might be a small problem", ": the consent says left, the mark says right."]
    options: ["Stop, everyone", "I think there might be a small problem", "Let's keep moving"]
    answer: Stop, everyone
    notes: {"Stop, everyone": "한마디로 모두를 멈추게 한다. 누구든 멈출 수 있는 타임아웃의 목적에 맞다.", "I think there might be a small problem": "작은 문제처럼 돌려 말해서 팀이 그냥 지나칠 수 있다.", "Let's keep moving": "불일치를 알면서도 진행하자는 말이라 타임아웃의 의미가 사라진다."}
    why: "불일치를 발견하면 '문제가 있는 것 같다'고 돌려 말하지 말고 '멈추세요'라고 분명히 말해요. 타임아웃에서는 누구든 이렇게 멈출 수 있어요."
    ko: "모두 멈추세요"
동의 없이 유도 직전:
  - kind: slider
    words: [w-stop, w-consent, w-induction]
    cue: "The patient is on the table, the drug is drawn up, and there is no confirmed consent."
    scale: ["Should we maybe wait a little?", "I'm not comfortable going ahead", "Stop — no consent, no induction"]
    answerAt: 2
    why: "동의가 확인되지 않은 채 유도에 들어가면 되돌릴 수 없어요. '기다릴까요?'나 '마음이 불편해요'처럼 돌려 말하지 말고, 멈추라고 분명하게 말해요."
    example: "Stop — no consent, no induction."
    exKo: "멈추세요 — 동의 없이는 유도하지 않아요."
  - kind: swap
    words: [w-hold, w-induction, w-push, w-medication]
    who: "간호사 → 마취과 · 유도 전 보류 요청"
    icon: speech
    before: ["", "Go ahead and push the medication", "."]
    options: ["Please hold induction until the consent is confirmed", "Go ahead and push the medication", "Start with a small dose while I check"]
    answer: Please hold induction until the consent is confirmed
    notes: {"Please hold induction until the consent is confirmed": "동의 확인 전에는 유도를 보류하도록 분명히 요청한다.", "Go ahead and push the medication": "동의 없이 약을 주입하자는 말이다.", "Start with a small dose while I check": "소량이어도 동의 전에 약을 시작하는 것이다. 용량은 간호사가 정할 일도 아니다."}
    why: "동의가 확인되기 전에는 약을 시작하지 않아요. 적게 시작하거나 확인하면서 진행하자는 말도 동의 전 투약이라 안 돼요. '유도를 보류해 주세요'가 분명한 요청이에요."
    ko: "동의서가 확인될 때까지 유도를 보류해 주세요"
신원 밴드 없는 무의식 환자:
  - kind: slider
    words: [w-unidentified, w-identity, w-confirm]
    cue: "EMS gave you a name for the unconscious patient, but no ID or band has been seen."
    scale: ["Unidentified until verified", "He may be Mr. Brown", "This is Mr. Brown"]
    answerAt: 0
    why: "확인되지 않은 이름은 기록하되, 확인 전까지는 미확인 환자로 다뤄요. 임시 번호를 쓰고 이송팀이나 신분증으로 신원이 확인되면 정정해요. 짐작으로 이름을 확정하면 다른 환자와 섞일 수 있어요."
    example: "He's unidentified until we verify his identity."
    exKo: "신원이 확인될 때까지는 미확인 환자예요."
  - kind: context
    words: [w-identity]
    word: identity
    ko: 신원
    scenes:
      - {who: 간호사 → 책임간호사, icon: speech, en: "We'll confirm his identity through EMS and the transferring team.", ok: true}
      - {who: 수술 기록, icon: board, en: "Identity unknown; temp ID assigned per protocol.", ok: true}
      - {who: 도착한 가족에게, icon: me, en: "His identity remains unverified pending biometric reconciliation.", ok: false, fix: "We don't have his name on file yet, but we're working to find out who he is."}
    why: "뜻은 셋 다 '신원'이에요. 의료진끼리나 기록에서는 짧고 정확하게 쓰지만, 가족에게 어려운 용어로 말하면 차갑고 무슨 말인지 몰라요. 지금 어떤 상태이고 무엇을 하는지 쉽게 알려 줘요."
잘못된 환자 입실:
  - kind: slider
    words: [w-dob-abbr, w-match]
    cue: "A colleague says, \"Same last name — it's probably the same patient.\""
    scale: ["Sounds right to me", "Let me glance at the chart", "Both name and DOB must match first"]
    answerAt: 2
    why: "환자 확인은 이름 하나로 하지 않고 이름과 생년월일 두 가지가 모두 맞아야 해요. 성만 같다는 이유로 넘어가거나 차트를 흘끗 보는 것으로는 다른 환자를 걸러내지 못해요."
    example: "Both name and DOB have to match."
    exKo: "이름과 생년월일이 모두 맞아야 해요."
  - kind: swap
    words: [w-stop, w-wrong, w-list]
    who: "수술실 간호사 → 팀 · 환자 불일치"
    icon: speech
    before: ["", "Hmm, maybe it's the wrong patient?", ""]
    options: ["Stop — this isn't the patient on my list", "Hmm, maybe it's the wrong patient?", "Let's keep going and fix the chart later"]
    answer: Stop — this isn't the patient on my list
    notes: {"Stop — this isn't the patient on my list": "멈추라고 분명히 말하고 이유를 사실로 댄다. 팀이 바로 확인에 들어갈 수 있다.", "Hmm, maybe it's the wrong patient?": "추측하는 말투라 팀이 흘려듣는다. 환자 안전 문제는 분명하게 말해야 한다.", "Let's keep going and fix the chart later": "환자가 틀렸을 수 있는데 진행하자는 말이다. 되돌릴 수 없는 일이 시작될 수 있다."}
    why: "환자가 잘못된 것 같으면 '아닌 것 같은데요?'라고 흐리지 말고 '멈추세요'와 이유를 분명하게 말해요. 차트는 나중에 고칠 수 있지만 환자는 되돌릴 수 없어요."
    ko: "멈추세요 — 제 명단에 있는 환자가 아니에요"
동의 철회 의사 표현:
  - kind: pair
    words: [w-change, w-mind, w-let, w-surgeon]
    pairs: [[change, your mind], [let, your surgeon know]]
    decoys: [the stretcher]
    why: "'change your mind'는 생각을 바꾼다는 뜻의 고정 표현이고, 'let ~ know'는 ~에게 알린다는 틀이에요. 환자가 마음을 바꾸면 간호사는 설득하지 않고 멈추고 집도의에게 알려요."
  - kind: context
    words: [w-mind]
    word: mind
    ko: 마음
    scenes:
      - {who: 간호사 → 환자, icon: me, en: "You can change your mind at any time, even right now.", ok: true}
      - {who: 수술 기록, icon: board, en: "Pt changed mind; surgeon notified; procedure stopped.", ok: true}
      - {who: 환자에게, icon: faceWorried, en: "Changing your mind now will delay the whole schedule.", ok: false, fix: "It's completely your decision, and I'll let your surgeon know so you can talk it over."}
    why: "뜻은 셋 다 '마음'이에요. 기록에서는 짧게 쓰지만, 환자에게 일정이 늦어진다고 하면 마음을 바꾸지 못하게 누르는 말로 들려요. 동의는 언제든 철회할 수 있어서, 결정을 존중하고 집도의에게 알려요."
반대 측 수술 직전 인지:
  - kind: slider
    words: [w-incise, w-check]
    cue: "At time-out the surgeon says, \"I know which side — it's fine.\" But the consent says right and the drapes expose the left."
    scale: ["Okay, I'll trust you", "Could we double-check, please?", "No — nobody incises until we agree"]
    answerAt: 2
    why: "절개 직전에는 이견이 풀릴 때까지 아무도 진행하지 않아요. 공손하게 부탁만 하면 집도의가 그냥 진행할 수 있어서, 분명하게 멈추라고 말해야 해요. 말투가 부드러워도 요구는 흐려지면 안 돼요."
    example: "Nobody incises until we agree on the side."
    exKo: "쪽에 합의하기 전에는 아무도 절개하지 않아요."
  - kind: context
    words: [w-wrong]
    word: wrong
    ko: 잘못된
    scenes:
      - {who: 간호사 → 집도의, icon: speech, en: "Stop — I think that's the wrong side.", ok: true}
      - {who: 수술 기록, icon: board, en: "Wrong-side prep identified before incision; case stopped; no harm.", ok: true}
      - {who: 보호자에게, icon: me, en: "We averted a wrong-site surgical event on your husband's knee.", ok: false, fix: "We caught a wrong mark before we began, and your husband is safe."}
    why: "뜻은 셋 다 '잘못된'이에요. 의료진끼리나 기록에서는 'wrong-site event' 같은 용어가 정확하지만, 보호자에게는 무슨 일인지 알기 어렵고 사건처럼 들려요. 무엇을 잡았고 지금은 안전하다고 쉽게 말해요."
