# order 동기화 — 키 "상황 번호"(0부터). lines는 {줄 번호(1부터): {필드}}, why는 통째로. 시작점은 B 검토 사본의 order.
order:
  "4":    # S3 4.5 — 결과 연결
    lines:
      4: {en: "When they call back, I'll put them through to the surgeon.", ko: "다시 전화가 오면 집도의에게 바로 연결할게요", note: 연결, icon: speech}
    why: 냉동절편용이라고 용도를 말하고, 그래서 고정액을 넣지 않는다고 하고, 포장한 뒤 검사실에 가는 중이라 알리고, 전화가 오면 집도의에게 바로 연결해요.
  "14":   # S7 14.5 — 함께 바로잡기
    lines:
      4: {en: "Once both agree, let's correct it before we send this.", ko: "둘이 일치하면 보내기 전에 함께 바로잡아요", note: 정정, icon: handshake2}
    why: 요청서와 라벨이 같은지 묻고, 부위가 다르다고 답하면, 어느 쪽이 맞는지 집도의와 함께 차트와 대조한 뒤, 둘이 일치하면 보내기 전에 함께 고쳐요. that site·both가 앞 줄을 가리켜요.
  "15":   # KO1 15.2 — 식별
    lines:
      3: {en: "To fix that, let's identify it now with the surgeon.", ko: "해결하려면 지금 집도의와 함께 이 검체를 식별해요", note: 식별, icon: handshake2}
  "16":   # KO3 16.1 — 수색 -> 찾다
    lines:
      3: {en: "Alongside that, let's stop and search the field and containers.", ko: "그와 함께 멈추고 수술 시야와 용기들을 샅샅이 찾아봐요", note: 찾기, icon: magnify}
      4: {en: "That includes every container on the field, one by one.", ko: "수술 시야의 용기를 하나씩 전부 찾아보는 것도 포함돼요", note: 전수, icon: magnify}
    why: 하나가 비었다고 알리고, 바로 집도의와 병리과에 보고하고, 그와 함께 멈추고 시야와 용기를 찾은 뒤 용기는 하나씩 전부 찾아봐요.
  "18":   # S11 18.5 — 버리기 전 보고
    lines:
      3: {en: "Because of that, I'll report it and open a new sterile kit.", ko: "그래서 보고하고 새 무균 키트를 열게요", note: 보고, icon: pager}
      4: {en: "Then we'll collect a new sample with that kit.", ko: "그다음 그 키트로 새 검체를 함께 채취해요", note: 재채취, icon: bandage}
    why: 닿았다는 사실을 말하고, 그래서 무균이 아니라고 하고, 그 때문에 보고하고 새 키트를 열고, 그 키트로 다시 채취해요.
  "19":   # S12 19.5 — 재라벨 전 보고
    lines:
      4: {en: "Once we've confirmed, I'll report it before anyone relabels it.", ko: "확인되면 누가 다시 라벨하기 전에 보고할게요", note: 보고, icon: pager}
    why: 다른 환자의 라벨이라고 알리고, 그래서 고칠 때까지 멈추고, 맞는 환자를 함께 확인한 뒤 누가 다시 라벨하기 전에 보고해요.
