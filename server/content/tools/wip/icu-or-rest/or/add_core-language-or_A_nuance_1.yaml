통역 서비스 요청:
- kind: slider
  words:
  - w-interpreter
  - w-available
  - w-few
  cue: You paged the interpreter service, and dispatch says a video interpreter can join in a few minutes. What do you tell the patient?
  scale:
  - An interpreter will come at some point
  - A video interpreter joins in a few minutes
  - The interpreter is already on the screen right now
  answerAt: 1
  why: 통역 서비스가 알려 준 만큼만 전해요. 막연하게 '언젠가'라고 하면 불안하고, 아직 연결도 안 됐는데 '이미 화면에 있다'고 하면 거짓이 돼요.
  example: The interpreter will be here in just a few minutes.
  exKo: 통역사가 몇 분 안에 도착할 거예요.
- kind: context
  words:
  - w-interpreter
  word: interpreter
  ko: 통역사
  scenes:
  - who: 간호사 → 동료
    icon: speech
    en: The interpreter is on the line, so please speak to the patient, not to the interpreter.
    ok: true
  - who: 차트 기록
    icon: board
    en: Patient has limited English; interpreter joined by video at 07:15.
    ok: true
  - who: 간호사 → 불안한 환자
    icon: faceWorried
    en: LEP patient noted; the interpreter will be dispatched per VRI protocol.
    ok: false
    fix: I'm getting an interpreter for you, so you can ask me anything in your language.
  why: 뜻은 셋 다 '통역사'예요. 동료에게는 환자에게 직접 말하라고 일러 주고, 차트에는 짧고 건조하게 적어요. 하지만 막 도착한 환자에게 LEP·VRI 같은 약어를 쓰면 무슨 말인지 알 수 없고 차갑게 들려요. 환자에게는 쉬운 말로 안심시켜요.
- kind: swap
  words:
  - w-professional
  - w-interpreter
  - w-service
  who: 간호사 → 환자 · 통역 제안
  icon: me
  before:
  - ''
  - Do you need a translator?
  - ''
  options:
  - Do you need a translator?
  - Would you like a professional interpreter? There's no charge.
  - Your English isn't good enough, so we'll get an interpreter.
  answer: Would you like a professional interpreter? There's no charge.
  notes:
    Do you need a translator?: translator는 글을 옮기는 사람이에요. 말을 옮기는 사람은 interpreter고, 필요한지 묻기만 해서는 환자가 부담스러워 거절하기 쉬워요.
    Would you like a professional interpreter? There's no charge.: 자격 있는 통역사를 권하고 비용이 없다고 알려서 환자가 편하게 받아들여요.
    Your English isn't good enough, so we'll get an interpreter.: 환자의 영어 실력을 깎아내리는 말이라 자존심이 상해요.
  why: 통역은 환자가 거절하기 어려울 만큼 부담스럽지 않게 권해요. 필요 여부를 환자의 부족함으로 말하지 않고, 비용이 없다는 사실도 함께 알려요.
  ko: 전문 통역사를 불러 드릴까요? 비용은 없어요.
동의 통역 확인:
- kind: slider
  words:
  - w-nod
  - w-back
  - w-understand
  cue: The surgeon explained the procedure through the interpreter. The patient only nods after every sentence and asks nothing.
  scale:
  - Glance at his face and then move on
  - Ask one yes-or-no question about the plan
  - Ask him to say it back in his words
  answerAt: 2
  why: 끄덕임은 '듣고 있어요'라는 예의일 수 있어요. 간호사는 통역을 통해 환자가 자기 말로 다시 말해 보게 하고, 이해가 흐리면 시술자에게 알려 설명을 다시 하게 해요.
  example: A nod isn't enough — I need you to explain it back.
  exKo: 고개만 끄덕이시는 걸로는 부족해요 — 직접 다시 설명해 주셔야 해요.
- kind: context
  words:
  - w-explain
  word: explain
  ko: 설명하다
  scenes:
  - who: 간호사 → 집도의
    icon: speech
    en: Please explain each step slowly, so the interpreter can say it in her language.
    ok: true
  - who: 차트 기록
    icon: board
    en: Surgeon to explain risks through interpreter; patient to teach back.
    ok: true
  - who: 간호사 → 불안한 환자
    icon: faceWorried
    en: I will explain the sequelae of general anesthesia in clinical terms.
    ok: false
    fix: Let me explain what the anesthesia does, in plain words.
  why: 뜻은 셋 다 '설명하다'예요. 시술자에게는 천천히 한 단계씩 해 달라고 부탁하고, 환자에게는 쉬운 말로 풀어야 통역도 정확해지고 환자도 따라와요. 'sequelae'나 'clinical terms' 같은 말은 통역하기도 어렵고 환자를 더 불안하게 해요.
- kind: swap
  words:
  - w-understand
  - w-tell
  - w-own
  - w-word
  who: 간호사 → 환자 · 이해 확인
  icon: me
  before:
  - ''
  - Do you understand?
  - ''
  options:
  - Do you understand?
  - Can you tell me in your own words what will happen?
  - You understand everything, right?
  answer: Can you tell me in your own words what will happen?
  notes:
    Do you understand?: 예·아니오로 답하기 쉬워서, 몰라도 정중하게 '네' 하고 넘어가요.
    Can you tell me in your own words what will happen?: 환자가 직접 말하게 해서 실제로 이해했는지 드러나요.
    You understand everything, right?: 답을 먼저 정해 주는 말이라 환자가 '네'라고 하기 쉬워요.
  why: 이해 확인은 '알겠어요?'가 아니라 환자 자신의 말로 다시 말하게 해야 해요(teach-back). 통역사는 환자의 답을 그대로 옮겨 줘요.
  ko: 무슨 일이 일어날지 환자분 말로 말씀해 주실래요?
금식·준비 통역 안내:
- kind: slider
  words:
  - w-fast
  - w-confirm
  - w-tell
  cue: Through the interpreter the patient says, "I stopped eating at ten last night." How do you chart it?
  scale:
  - Last food at 10 PM, per patient
  - Fasting confirmed by the interpreter
  - Fasting verified, safe for surgery
  answerAt: 0
  why: 환자가 말한 것만 출처와 함께 적어요. 통역사가 환자의 말을 옮겼을 뿐 금식을 '확인'해 준 것은 아니고, 수술해도 안전한지는 마취팀이 판단해요.
  example: The interpreter will go over your fasting instructions.
  exKo: 통역사가 금식 지침을 하나하나 짚어 드릴 거예요.
- kind: context
  words:
  - w-instruction
  word: instruction
  ko: 지침
  scenes:
  - who: 간호사 → 통역사
    icon: speech
    en: I'll give each instruction, and please say it in the patient's language.
    ok: true
  - who: 차트 기록
    icon: board
    en: Fasting instruction given via interpreter; patient repeated it correctly.
    ok: true
  - who: 간호사 → 겁먹은 환자
    icon: faceWorried
    en: Compliance with the instruction is mandatory, or the case may be canceled.
    ok: false
    fix: Please follow each instruction, and ask the interpreter anything you're unsure about.
  why: 뜻은 셋 다 '지침'이에요. 통역사에게는 하나씩 전해 달라고, 차트에는 짧게 적어요. 하지만 '의무'나 '취소될 수 있다'는 말로 윽박지르면 환자가 겁을 먹고 모르는 것도 묻지 못해요.
- kind: swap
  words:
  - w-eat
  - w-stop
  - w-midnight
  who: 간호사 → 환자 · 금식 시작 시각
  icon: me
  before:
  - ''
  - Stop eating at midnight.
  - ''
  options:
  - Stop eating at midnight.
  - Please tell me what time you last ate, and when you plan to stop.
  - You didn't eat anything after midnight, did you?
  answer: Please tell me what time you last ate, and when you plan to stop.
  notes:
    Stop eating at midnight.: 지시만 하고 환자가 이해했는지 알 수 없어요.
    Please tell me what time you last ate, and when you plan to stop.: 환자가 시각을 직접 말해서 이해 여부와 마지막 식사 시각이 함께 드러나요.
    You didn't eat anything after midnight, did you?: 답을 먼저 말해 주는 질문이라 환자가 '네'로 답하기 쉬워요.
  why: 금식 안내는 지시로 끝내지 않고 환자가 시각을 직접 말하게 해야 해요. 통역사가 옮긴 환자의 대답을 그대로 차트에 적어요.
  ko: 마지막으로 드신 시각과 언제부터 안 드실지 말씀해 주세요.
마취 설명 통역:
- kind: slider
  words:
  - w-concern
  - w-feel
  - w-anesthesia
  cue: Through the interpreter the patient says, "I'm scared I won't wake up." How do you respond?
  scale:
  - Don't worry, nothing will go wrong at all here
  - That's common, and the anesthesia team will explain
  - Everyone fears that, so there's no need to discuss it
  answerAt: 1
  why: 걱정을 흔한 감정으로 인정하고 설명은 마취팀이 해 준다고 이어 줘요. 아무 일도 없을 거라는 약속은 간호사가 할 수 없는 말이고, 걱정을 무시하면 환자는 입을 닫아요.
  example: Tell me if you have any concerns about it.
  exKo: 걱정되는 게 있으면 말씀해 주세요.
- kind: context
  words:
  - w-asleep
  word: asleep
  ko: 잠든
  scenes:
  - who: 간호사 → 통역사
    icon: speech
    en: Please tell him he'll be asleep, and the anesthesia team will stay with him.
    ok: true
  - who: 차트 기록
    icon: board
    en: Patient asleep after induction; anesthesia team at bedside.
    ok: true
  - who: 간호사 → 겁먹은 환자
    icon: faceWorried
    en: You'll be completely asleep, like being put down.
    ok: false
    fix: You'll be asleep, and the anesthesia team will watch over you the whole time.
  why: 뜻은 셋 다 '잠든'이에요. 통역사에게는 환자에게 전할 말을, 차트에는 짧게 적어요. 하지만 '재워진다(put down)'는 말은 동물을 안락사할 때 쓰는 말과 겹쳐서 환자를 더 겁먹게 해요.
- kind: swap
  words:
  - w-remember
  - w-asleep
  who: 간호사 → 환자 · 마취 후 기억
  icon: me
  before:
  - ''
  - You won't remember anything.
  - ''
  options:
  - You won't remember anything.
  - Most people don't remember the surgery itself, and the team will explain.
  - You'll forget all of it, so don't worry.
  answer: Most people don't remember the surgery itself, and the team will explain.
  notes:
    You won't remember anything.: 모든 사람이 똑같다는 단정이에요. 마취 후 기억은 사람과 마취 방법에 따라 달라요.
    Most people don't remember the surgery itself, and the team will explain.: 흔한 경험을 말하되 단정하지 않고, 자세한 설명은 마취팀에 넘겨요.
    You'll forget all of it, so don't worry.: 걱정을 가볍게 덮는 말이고 보장도 할 수 없어요.
  why: 마취 중의 기억은 사람과 마취 방법에 따라 달라서 간호사가 장담하면 안 돼요. 흔한 경험으로 말하고 자세한 설명은 마취팀에 넘겨요.
  ko: 대부분은 수술 자체는 기억하지 못하세요, 자세한 건 마취팀이 설명해 드릴 거예요.
통증 소통 통역:
- kind: slider
  words:
  - w-pain
  - w-hurt
  - w-number
  cue: Through the interpreter, the patient points at his belly and says, "It hurts a little, but it's okay." Which number goes on the chart?
  scale:
  - About 2 out of 10
  - About 5 out of 10
  - Around 8 out of 10
  answerAt: 0
  why: 환자가 '조금 아프지만 괜찮다'고 했으니 낮은 숫자가 맞아요. 숫자는 환자가 정한 것을 그대로 적고, 간호사가 짐작해서 올리거나 내리지 않아요.
  example: Through the interpreter, tell me your pain from zero to ten.
  exKo: 통역사를 통해 통증이 0부터 10 중 어느 정도인지 말씀해 주세요.
- kind: context
  words:
  - w-manage
  word: manage
  ko: 조절하다
  scenes:
  - who: 간호사 → 통역사
    icon: speech
    en: Please tell her we'll manage her pain together, and to call us if it gets worse.
    ok: true
  - who: 차트 기록
    icon: board
    en: Pain managed per plan; patient reports 2 out of 10 via interpreter.
    ok: true
  - who: 간호사 → 힘들어하는 환자
    icon: faceWorried
    en: You need to manage your pain yourself and stop calling us.
    ok: false
    fix: We'll manage your pain together, so call me any time it gets worse.
  why: 뜻은 셋 다 '조절하다'예요. 통역사에게는 환자에게 전할 말을, 차트에는 계획대로 조절됐다고 적어요. 하지만 환자 혼자 알아서 하라며 호출을 막으면 안 돼요 — 통증은 말해야 간호사가 대응할 수 있어요.
