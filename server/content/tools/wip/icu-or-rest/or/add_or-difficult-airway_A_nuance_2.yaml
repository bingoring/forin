후두마스크 구조 환기:
  - kind: slider
    words: [w-chest, w-rise, w-confirm]
    cue: "You are watching the chest while anesthesia ventilates through the LMA, and it only barely lifts."
    scale: [Chest rise is shallow, Chest rise is good, Chest rise is full]
    answerAt: 0
    why: "본 그대로 정도를 맞춰 보고해요. 조금만 오르는데 'good'이라고 하면 환기가 잘 되는 줄 알아 위험하고, 환기가 약하다는 신호를 마취과가 바로 알아야 해요."
    example: "Chest rise is shallow."
    exKo: "흉곽이 얕게만 올라가요."
  - kind: swap
    words: [w-chest, w-rise, w-confirm]
    who: "순환 간호사 → 마취과 · 환기 확인"
    icon: speech
    before: ["Dr. Wu, ", "I think it's working", "."]
    options: [I see chest rise with each breath, I think it's working, it looks okay maybe]
    answer: I see chest rise with each breath
    notes: {I see chest rise with each breath: "눈으로 본 것을 구체적으로 말한다. 마취과가 환기가 되는지 바로 판단할 수 있다.", I think it's working: "무엇을 보고 하는 말인지 알 수 없다. 환기 확인 보고로는 모호하다.", it looks okay maybe: "'아마'는 확인하지 않았다는 말이다. 환기가 되는지는 보이는 것으로 전한다."}
    why: "환기 확인은 본 것을 구체적으로 말해요. '호흡마다 흉곽이 올라가요'는 마취과가 판단할 근거가 돼요."
    ko: "호흡마다 흉곽이 오르는 게 보여요"
부지·교환기 사용:
  - kind: slider
    words: [w-steady, w-hold, w-bougie]
    cue: "Anesthesia is advancing the tube over the bougie, and the bougie must not move."
    scale: [I hold the bougie loosely, I hold the bougie steady, I hold the bougie and push it in]
    answerAt: 1
    why: "관이 부지를 따라 들어가는 동안 부지가 밀리거나 빠지지 않게 안정적으로 잡아요. 느슨하게 잡으면 부지가 움직일 수 있고, 부지를 밀어 넣는 것은 시술하는 사람의 일이에요."
    example: "I hold the bougie steady."
    exKo: "부지를 단단히 잡고 있어요."
  - kind: swap
    words: [w-tube, w-exchanger, w-ready]
    who: "순환 간호사 → 마취과 · 교환기 준비 보고"
    icon: speech
    before: ["Dr. Ito, ", "something for swapping the tube", " is ready."]
    options: [the tube exchanger, something for swapping the tube, the swapper thing]
    answer: the tube exchanger
    notes: {the tube exchanger: "기구의 정확한 이름이다. 마취과가 무엇이 준비됐는지 바로 안다.", something for swapping the tube: "이름을 모르는 것처럼 돌려 말한다. 급한 상황에서는 정확한 이름이 필요하다.", the swapper thing: "'thing'은 기구를 가리키는 업무 용어가 아니다. 오해를 부를 수 있다."}
    why: "기구는 정확한 이름으로 보고해야 오해가 없어요."
    ko: "튜브 교환기가 준비돼 있어요"
목·비만 위험 인자:
  - kind: slider
    words: [w-flag, w-risk, w-factor, w-team]
    cue: "The chart lists a short neck, a beard, and snoring."
    scale: [I'll mention one risk factor, I'll flag these risk factors to the team, I'll tell the team the airway will be impossible]
    answerAt: 1
    why: "짧은 목·수염·코골이는 모두 어려운 기도의 위험 인자로 알려져 있어서 한꺼번에 팀에 알려요. 하나만 골라 말하면 나머지를 놓치고, '불가능하다'고 단정하는 건 예측일 뿐 사실이 아니에요."
    example: "I'll flag these risk factors to the team."
    exKo: "이 위험 인자들을 팀에 알릴게요."
  - kind: swap
    words: [w-ramping, w-position]
    who: "환자에게 · 자세 설명"
    icon: me
    before: ["We'll prop you up ", "in a ramped position", " to help with your breathing."]
    options: [with pillows under your shoulders, in a ramped position, in a head-elevated laryngoscopy position]
    answer: with pillows under your shoulders
    notes: {with pillows under your shoulders: "환자가 머릿속에 그릴 수 있는 쉬운 말이다. 무엇을 하는지 겁주지 않고 알려 준다.", in a ramped position: "의료진끼리 쓰는 말이다. 환자에게는 뜻이 전해지지 않는다.", in a head-elevated laryngoscopy position: "더 어려운 전문어라 환자가 알아듣기 어렵다."}
    why: "환자에게는 자세를 쉬운 말로 설명하고, 'ramped position' 같은 이름은 의료진끼리 써요."
    ko: "숨 쉬기 편하도록 어깨 밑에 베개를 받쳐 올려 드릴게요"
재시도 최소화 전략:
  - kind: slider
    words: [w-attempt, w-number, w-limit]
    cue: "Two intubation tries have not worked, and the team is deciding how many more to make."
    scale: [We keep trying until it works, We limit the number of attempts, We make one more attempt and stop]
    answerAt: 1
    why: "어려운 기도 지침들은 시도 횟수를 제한하라고 해요. 반복 시도는 외상과 부종을 만들어 기도를 더 좁히기 때문이에요. 횟수와 다음 방법은 마취과가 정하고, 간호사는 몇 번째인지 소리 내어 알려요."
    example: "We limit the number of attempts."
    exKo: "시도 횟수를 제한해요."
  - kind: swap
    words: [w-attempt, w-number]
    who: "순환 간호사 → 팀 · 시도 횟수 콜"
    icon: speech
    before: ["Okay, ", "that was the second try I think", "."]
    options: [that was attempt number two, that was the second try I think, we've done a couple of tries]
    answer: that was attempt number two
    notes: {that was attempt number two: "몇 번째인지 분명한 숫자로 말해서 팀 모두가 같은 횟수를 안다.", that was the second try I think: "'아마'가 붙으면 정확한 횟수를 모른다는 말로 들린다.", we've done a couple of tries: "'a couple'은 정확한 숫자가 아니다. 횟수 제한을 지키려면 숫자가 필요하다."}
    why: "횟수는 팀이 같은 숫자를 알도록 정확히 말해요. 얼버무리면 제한을 지키기 어려워요."
    ko: "이번이 두 번째 시도였어요"
산소화 우선 원칙:
  - kind: slider
    words: [w-saturation, w-saturate, w-well]
    cue: "His saturation dipped a little between tries but is already coming back up."
    scale: [Saturation dipped slightly, Saturation is dropping, Saturation is critically low]
    answerAt: 0
    why: "본 정도에 맞춰 말해요. 조금 떨어졌다 돌아오는 것을 'critically low'라고 하면 필요 없이 위기로 만들고, 정말 위험한 수치를 'slightly'라고 줄이면 대응이 늦어져요."
    example: "Saturation dipped slightly."
    exKo: "산소포화도가 살짝 떨어졌어요."
  - kind: swap
    words: [w-saturation, w-oxygenation, w-bag]
    who: "순환 간호사 → 마취과 · 시도 사이"
    icon: speech
    before: ["Dr. Rao, ", "you have to stop and bag him", "."]
    options: ["I'm concerned about his saturation — can we oxygenate first?", you have to stop and bag him, it's your call whether to keep trying]
    answer: "I'm concerned about his saturation — can we oxygenate first?"
    notes: {"I'm concerned about his saturation — can we oxygenate first?": "걱정되는 점을 구체적으로 말하고 제안으로 묻는다. 결정은 마취과가 하고, 간호사는 의견을 분명히 낸다.", you have to stop and bag him: "지시하는 말투다. 시술을 결정하는 것은 마취과이고, 명령은 간호사의 업무 범위 밖이다.", it's your call whether to keep trying: "우려를 말하지 않고 판단을 떠넘긴다. 환자가 위험한 순간에는 걱정을 분명히 전해야 한다."}
    why: "간호사는 우려를 구체적으로('I'm concerned') 말하고 결정은 마취과에 맡겨요. 지시하듯 말하거나 말을 아끼면 팀 소통이 막혀요."
    ko: "포화도가 걱정돼요 — 먼저 산소화할 수 있을까요"
팀 역할 배정:
  - kind: slider
    words: [w-unsure, w-ask, w-job]
    cue: "You aren't sure whether you or the anesthesia tech is holding cricoid pressure."
    scale: [I assume it's the tech, I wait to see who steps in, I ask before we begin]
    answerAt: 2
    why: "역할이 불분명하면 시작하기 전에 소리 내어 물어 확인해요. 짐작하거나 누가 나서는지 기다리면 아무도 맡지 않거나 둘이 겹칠 수 있어요."
    example: "I ask before we begin."
    exKo: "시작하기 전에 물어봐요."
  - kind: swap
    words: [w-manage, w-cart, w-role, w-job]
    who: "순환 간호사 → 팀 · 역할 확인"
    icon: speech
    before: ["Okay, ", "someone should handle the cart", "."]
    options: [I'll manage the cart, someone should handle the cart, the cart's kind of everybody's thing]
    answer: I'll manage the cart
    notes: {I'll manage the cart: "누가 맡는지 분명하다. 팀이 그 일은 신경 쓰지 않아도 된다.", someone should handle the cart: "'누군가'라고 하면 아무도 안 맡을 수 있다.", the cart's kind of everybody's thing: "모두의 일은 아무의 일도 아니다. 역할 배정으로는 모호하다."}
    why: "역할은 '누가'를 분명히 말해야 해요. 주어 없이 '누군가'라고 하면 위기에서 빠뜨리기 쉬워요."
    ko: "카트는 제가 맡을게요"
백업 장비 준비:
  - kind: slider
    words: [w-reach, w-backup, w-plan]
    cue: "Plan A is going fine, and you are just getting the backup tools ready."
    scale: [Everything's within reach, Everything's open and in use, We've moved to the backup plan]
    answerAt: 0
    why: "계획 A가 잘 되고 있을 때 백업은 손 닿는 곳에 준비해 두는 단계예요. 이미 쓰고 있다거나 백업으로 넘어갔다고 말하면 사실과 달라 팀이 혼동해요."
    example: "Everything's within reach."
    exKo: "모든 게 손 닿는 곳에 있어요."
  - kind: swap
    words: [w-lma, w-bougie, w-cric, w-kit, w-ready]
    who: "순환 간호사 → 마취과 · 백업 장비 보고"
    icon: speech
    before: ["Dr. Ito, ", "the backup equipment should be around", "."]
    options: ["the LMA, bougie, and cric kit are all ready", the backup equipment should be around, we probably have the backup things]
    answer: "the LMA, bougie, and cric kit are all ready"
    notes: {"the LMA, bougie, and cric kit are all ready": "장비 이름을 하나씩 대서 무엇이 준비됐는지 분명하다.", the backup equipment should be around: "어디 있는지 확인하지 않았다는 말이다. 백업 장비는 확인한 것만 보고한다.", we probably have the backup things: "'아마'와 'things'로 모호하다. 마취과가 계획에 쓸 수 없다."}
    why: "백업 장비는 이름을 하나씩 대고 준비됐다고 보고해야 마취과가 계획에 넣을 수 있어요."
    ko: "후두마스크, 부지, 윤상절개 키트가 모두 준비돼 있어요"
