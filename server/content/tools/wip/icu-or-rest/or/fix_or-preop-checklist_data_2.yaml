set:   # 직접 덮어쓰기 {id: {필드: 값}}
  w-thinner:      # W5 헤드워드 (결정 11)
    en: blood thinner
    ipa: /ˈblʌd ˌθɪnər/
    chips: [[blood], [thin, ner]]
    decoyChips: [flood, tin]
    distractorsEn: [blood donor, blood type]
  w-procedure:
    cue: 오늘 무엇을 받는지 환자 입으로 말하게 할 때 묻는 말 — 수술과 시술을 두루 이른다
  w-start:
    cue: 잘 안 흐르는 IV를 빼고 새 라인을 잡을 때 쓰는 동사
  w-stop:
    cue: 동의서와 차트가 어긋난 걸 보면 팀 모두가 손을 놓게 하는 말
  w-treat:
    cue: 정체 모를 기기를 '모르는 것'으로 여기고 대할 때의 동사
  w-feel:
    cue: 주사 자리에 화끈거림이 오면 알려 달라고 할 때, 환자가 몸으로 ~하는 일
remove:   # 문장이 쓰지 않게 돼 삭제 (changes의 word-remove)
  w-push: 16.4를 'A short delay is better…'로 고쳐 쓰는 문장이 없어졌다 (급속 주입으로 들리는 push 제거)
  w-critical: 7.3을 'This lab is required…'로 고쳐 쓰는 문장이 없어졌다 (15.0의 critically 위급 수치와 섞임)
# 문장이 새 문장으로 바뀌어 예문을 다시 지정하는 단어: {id: 새 문장 en}
