      - en: wash
      - en: weigh
      - en: cover
  order:
    tag: 대화 흐름
    icon: compass
    ko: 혈액 제제 확인 4문장 순서
    why: 제제 이름을 묻고 처방과 대조한 뒤, 라벨과 처방이 맞는지 보고하고, 둘이 동의하면 건다는 순서로 가요.
    lines:
