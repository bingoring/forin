    - w-number
    goal: 1
    tag: 번호 요청
    icon: mic
    why: Can you …?는 부탁을 질문으로 건네 상대가 부담 없이 따르게 해요. to me로 누구에게 읽는지 분명히 해요.
    decoy: the room number
    distractorsKo:
    - 제제 번호를 저에게 적어 주시겠어요?
    - 제제 번호를 저에게 보여 주시겠어요?
    blank:
