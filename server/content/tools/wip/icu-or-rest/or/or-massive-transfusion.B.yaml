    - Let's check
    - the unit
    - against the order
    - .
    words:
    - w-unit
    - w-order
    goal: 2
    tag: 처방 대조
    icon: pencil
    why: Let's로 시작하면 지시가 아니라 같이 하자는 제안이라 두 사람이 함께 대조하는 분위기가 돼요. against 뒤에 기준이 되는 것을 말해요.
    decoy: against the clock
    distractorsKo:
    - 처방과 대조하려고 제제 단위를 꺼내요.
    - 처방과 대조하러 장갑을 껴요.
    blank:
      answer: order
      options:
      - en: order
      - en: clock
      - en: map
      - en: scale
  - en: I'll confirm the product type out loud.
    ko: 제제 종류를 소리 내어 확인할게요.
