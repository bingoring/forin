    icon: check
    why: once we both agree는 둘의 합의를 걸기의 조건으로 못 박는 말이에요. hang this는 팩을 라인에 매다는 동작을 가리켜요.
    decoy: once we all
    distractorsKo:
    - 셋 다 확인되면 이걸 걸겠습니다.
    - 둘 다 확인되면 걸 팩을 닦을게요.
    blank:
