      note: 질문
    - en: Let's check it against the order.
      icon: pencil
      ko: 처방과 대조해 봅시다
      note: 대조
    - en: The blood type on the label matches the order.
      icon: lab
      ko: 라벨 혈액형이 처방과 일치해요
