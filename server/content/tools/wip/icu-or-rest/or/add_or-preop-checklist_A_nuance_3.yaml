"수술 전 VTE 예방 확인":
  - kind: slider
    words: [w-thinner, w-blood]
    cue: "Patient on a blood thinner says, 'My last dose was this morning.'"
    scale: ["Chart it.", "Mention it at handoff and in the chart notes.", "Tell the surgeon and anesthesia right away."]
    answerAt: 2
    why: "혈액희석제를 마지막으로 먹은 시각은 출혈 위험과 마취 계획에 영향을 줘요. 기록만 하거나 인계로 미루지 말고 집도의와 마취과에 바로 알려 판단받아요."
    example: "Have you been given a blood thinner today?"
    exKo: "오늘 혈액희석제를 투여받으셨나요?"
  - kind: context
    words: [w-compression]
    word: compression
    ko: 압박
    scenes:
      - {who: 환자에게, icon: me, en: "Bilateral intermittent pneumatic compression is running on both legs.", ok: false, fix: "These sleeves gently squeeze your legs to keep your blood moving."}
      - {who: 마취과 동료에게, icon: monitor, en: "Compression sleeves are on, both legs.", ok: true}
      - {who: 순환간호사에게, icon: board, en: "Compression is on, and the VTE orders are confirmed.", ok: true}
    why: "동료에게는 compression이 켜졌다고 짧게 보고하면 돼요. 환자에게 장비 이름을 늘어놓으면 알아듣지 못해요. 슬리브가 다리를 부드럽게 눌러 피가 돌게 한다고 말해요."
"당뇨 환자 혈당 조절":
  - kind: slider
    words: [w-bloodsugar, w-team]
    cue: "Fasting patient with diabetes: her blood sugar is well above the usual target."
    scale: ["Fine — no need to tell anyone.", "Tell the team and follow the orders.", "Give insulin on your own right away, to be safe."]
    answerAt: 1
    why: "수술 전 혈당이 높으면 마취과·집도의에게 알리고 지시나 프로토콜에 따라 조치해요. 알리지 않으면 위험하고, 인슐린은 지시 없이 간호사가 정해 주는 약이 아니에요."
    example: "Your blood sugar is a little high, so I'll let the team know."
    exKo: "혈당이 조금 높아서 팀에 알릴게요."
  - kind: swap
    words: [w-bloodsugar, w-insulin, w-team]
    who: "간호사 → 환자 · 혈당 높음"
    icon: me
    before: ["Your blood sugar is a bit above target, ", "so I'll give you some insulin right now", "."]
    options: ["so I'll give you some insulin right now", "so don't worry — it'll come down on its own", "so I'll tell the team and we'll follow the plan for it"]
    answer: "so I'll tell the team and we'll follow the plan for it"
    notes:
      "so I'll give you some insulin right now": "인슐린은 지시나 프로토콜에 따라 줘요. 간호사가 먼저 약속할 일이 아니에요."
      "so don't worry — it'll come down on its own": "근거 없는 안심이에요. 혈당이 저절로 내려간다고 장담할 수 없어요."
      "so I'll tell the team and we'll follow the plan for it": "팀에 알리고 정해진 계획대로 한다고 말해 정직하고 안심돼요."
    why: "혈당 조절은 지시와 프로토콜에 따라 해요. 환자에게는 팀에 알리고 계획대로 할 것이라고 말해요."
    ko: "팀에 알리고 정해진 계획대로 할게요"
"기록 간 정보 불일치":
  - kind: slider
    words: [w-mismatch, w-consent, w-side]
    cue: "Consent says left knee; the surgeon's site marking says right."
    scale: ["Tell the circulator when you have a free moment.", "Bring it up at the time-out with the team.", "Stop and report it now — we can't start yet."]
    answerAt: 2
    why: "부위(좌우)가 서류와 다르면 수술 전에 바로 멈추고 보고해서 해결해야 해요. 시간 날 때나 타임아웃에서 말하면 이미 늦어요."
    example: "This mismatch needs to be resolved before we start."
    exKo: "이 불일치는 시작 전에 해결돼야 해요."
  - kind: context
    words: [w-mismatch]
    word: mismatch
    ko: 불일치
    scenes:
      - {who: 집도의에게, icon: stetho, en: "There's a mismatch: the consent says left and the chart says right.", ok: true}
      - {who: 순환간호사에게, icon: board, en: "Laterality mismatch between the consent and the chart — we need to resolve it.", ok: true}
      - {who: 수술 전 환자에게, icon: me, en: "There's a mismatch — somebody wrote the wrong side on your paperwork.", ok: false, fix: "I want to double-check one detail on your paperwork with the surgeon before we go in."}
    why: "의료진끼리는 mismatch로 문제를 정확히 짚어 말해요. 환자에게 '누가 틀렸다'고 단정하면 불안과 불신만 커져요. 서류를 확인한다고만 말하는 게 좋아요."
"검사 이상치 수술 지연":
  - kind: slider
    words: [w-potassium, w-critically, w-value]
    cue: "Potassium is 6.8 and the case is next."
    scale: ["Recheck it at the next scheduled draw tomorrow.", "Mention it at handoff.", "Call the surgeon and anesthesia now."]
    answerAt: 2
    why: "칼륨 6.8은 위급한 수치라 곧바로 집도의와 마취과에 알려야 해요. 다음 채혈이나 인계까지 기다리면 위험해요."
    example: "I'm calling the surgeon and anesthesia right now."
    exKo: "지금 바로 집도의와 마취과에 전화할게요."
  - kind: swap
    words: [w-potassium, w-critically, w-call]
    who: "간호사 → 마취과 · 검사 결과 보고"
    icon: monitor
    before: ["The potassium is 6.8 — ", "slightly off, probably fine", ". I'm calling you now."]
    options: ["critically high", "slightly off, probably fine", "something to look at later"]
    answer: "critically high"
    notes:
      "critically high": "위급한 수치라는 사실을 그대로 전해요."
      "slightly off, probably fine": "수치를 축소해서 보고하면 대응이 늦어져요."
      "something to look at later": "급한 일을 나중 일로 돌려 말하는 것이라 위험해요."
    why: "위급 수치는 축소하지 않고 있는 그대로 말해야 해요. 그래야 받는 사람이 곧바로 움직여요."
    ko: "칼륨이 위급하게 높아요"
"항생제 미투여 절개 임박":
  - kind: slider
    words: [w-hold, w-incision, w-antibiotic]
    cue: "The surgeon picks up the scalpel, and the antibiotic isn't in."
    scale: ["Mention it after the case.", "Ask if it can go in soon.", "Ask to hold incision now."]
    answerAt: 2
    why: "절개 직전에 항생제가 없으면 바로 말해서 절개를 보류해 달라고 요청해야 해요. 나중에 말하거나 돌려 묻기만 하면 절개가 먼저 시작돼요."
    example: "Can we hold incision until it's infused?"
    exKo: "다 들어갈 때까지 절개를 보류할 수 있을까요?"
  - kind: context
    words: [w-hold]
    word: hold
    ko: 보류하다
    scenes:
      - {who: 마취과 동료에게, icon: monitor, en: "Please hold the case until the antibiotic is in.", ok: true}
      - {who: 집도의에게, icon: stetho, en: "Hold your scalpel — you're about to make a mistake!", ok: false, fix: "Can we hold incision for a moment? The antibiotic isn't in yet."}
      - {who: 순환간호사에게, icon: board, en: "We're holding incision until the antibiotic is in.", ok: true}
    why: "hold는 동료끼리는 짧게 해도 되지만, 집도의에게는 '실수한다'고 몰아붙이지 말고 정중하게 요청해야 해요. 이유를 함께 말하면 받아들이기 쉬워요."
"교차혈액 없이 출혈 수술":
  - kind: slider
    words: [w-bleed, w-heavy, w-blood]
    cue: "Heavy bleeding, and there's no crossmatched blood in the room."
    scale: ["Make a note of it.", "Tell anesthesia and the surgeon now, and call for blood.", "Take charge and start giving blood on your own authority."]
    answerAt: 1
    why: "대량 출혈에 교차적합 혈액이 없으면 마취과와 집도의에게 즉시 알리고 혈액은행에 응급 혈액을 요청해요. 메모만 하면 늦고, 혼자 수혈을 정하고 주는 것은 간호사의 몫이 아니에요."
    example: "This patient is bleeding heavily and needs blood right now."
    exKo: "이 환자는 출혈이 심해서 지금 바로 혈액이 필요해요."
  - kind: swap
    words: [w-activate, w-massive, w-transfusion, w-protocol]
    who: "간호사 → 집도의·마취과 · 대량 출혈"
    icon: monitor
    before: ["I'm ", "activating the massive transfusion protocol myself", "."]
    options: ["waiting to see if the bleeding slows down", "calling the blood bank to activate the massive transfusion protocol", "activating the massive transfusion protocol myself"]
    answer: "calling the blood bank to activate the massive transfusion protocol"
    notes:
      "waiting to see if the bleeding slows down": "대량 출혈에서 지켜보기만 하면 늦어요."
      "calling the blood bank to activate the massive transfusion protocol": "혈액은행에 전화해 프로토콜을 가동하는 간호사의 역할을 정확히 말해요."
      "activating the massive transfusion protocol myself": "발동 여부는 집도의·마취과가 정해요. 혼자 발동한다고 하면 업무 범위를 넘어요."
    why: "대량수혈 프로토콜은 의사가 필요하다고 판단하면 혈액은행에 연락해 가동해요. 간호사는 그 연락과 준비를 맡는다고 말해요."
    ko: "혈액은행에 전화해서 대량수혈 프로토콜을 가동할게요"
"심박동기 환자 소작 위험":
  - kind: slider
    words: [w-pacemaker, w-interfere, w-bipolar]
    cue: "The surgeon plans monopolar cautery near the chest; the patient has a pacemaker."
    scale: ["Mention it after the case.", "Raise it with the surgeon and anesthesia first.", "Refuse to let the case proceed until a cardiologist agrees."]
    answerAt: 1
    why: "심박동기 환자에게 단극 소작을 쓰면 기기가 방해받을 수 있어요. 간호사는 시작 전에 집도의와 마취과에 짚어 말해요. 나중에 말하면 늦고, 수술을 막는 결정은 간호사가 혼자 할 일이 아니에요."
    example: "The patient has a pacemaker—cautery could interfere with it."
    exKo: "이 환자는 심박동기가 있어서 소작이 방해될 수 있어요."
  - kind: context
    words: [w-bipolar]
    word: bipolar
    ko: 양극 소작의
    scenes:
      - {who: 집도의에게, icon: stetho, en: "With the pacemaker, would you consider bipolar cautery?", ok: true}
      - {who: 마취과 동료에게, icon: monitor, en: "The surgeon plans bipolar only — magnet's on standby.", ok: true}
      - {who: 걱정하는 보호자에게, icon: me, en: "We'll use bipolar for your husband because of his heart device.", ok: false, fix: "We'll use a type of cautery that's safer for his pacemaker."}
    why: "수술실에서 bipolar는 전기 소작 방식을 뜻해요. 보호자에게는 정신과 용어로 들려 오해할 수 있어요. '심박동기에 더 안전한 소작 방식'이라고 풀어 말해요."
"응급 체크리스트 생략 압박":
  - kind: slider
    words: [w-timeout, w-emergency, w-skip]
    cue: "Trauma surgeon: 'We don't have time for a time-out!'"
    scale: ["OK, we'll skip it.", "It only takes seconds — let's confirm the essentials.", "I won't do anything until the whole checklist is finished."]
    answerAt: 1
    why: "응급이어도 타임아웃은 짧게 줄여서라도 해야 해요. 생략하면 환자·부위 오류의 위험이 있고, 아무것도 안 하겠다는 말은 팀과 대립만 만들어요."
    example: "We still need the time-out even in an emergency."
    exKo: "응급 상황에서도 타임아웃은 여전히 필요해요."
  - kind: swap
    words: [w-timeout, w-emergency, w-site]
    who: "간호사 → 외상 팀 · 응급 타임아웃"
    icon: monitor
    before: ["Even in an emergency, we do a quick time-out — ", "it's only a formality", "."]
    options: ["it's only a formality", "it's up to the surgeon whether we do it", "it's how we confirm the right patient and site"]
    answer: "it's how we confirm the right patient and site"
    notes:
      "it's only a formality": "형식적인 절차처럼 말하면 생략해도 된다고 들려요."
      "it's up to the surgeon whether we do it": "타임아웃은 선택이 아니라 필수 절차예요."
      "it's how we confirm the right patient and site": "타임아웃의 목적을 정확히 말해 줘요."
    why: "타임아웃은 환자·부위·시술 확인을 위한 필수 절차예요. 응급이면 짧게 하되 목적을 분명히 말해요."
    ko: "그래야 맞는 환자와 부위를 확인할 수 있어요"
"이식물 정보 불명 응급":
  - kind: slider
    words: [w-unknown, w-mriunsafe, w-implant]
    cue: "Unconscious patient: a device shows on the chest film, and nobody knows what it is."
    scale: ["Note it for later.", "Check the records and call the family when you can.", "Treat it as MRI-unsafe until it's proven safe."]
    answerAt: 2
    why: "정체를 모르는 몸속 기기는 MRI에 안전하다고 확인되기 전까지 비호환으로 다뤄야 해요. 나중에 확인하겠다고 미루면 MRI실에서 사고가 날 수 있어요."
    example: "We should treat this device as unknown until we know more."
    exKo: "더 알기 전까지는 이 기기를 미상으로 다뤄야 해요."
  - kind: swap
    words: [w-assume, w-mriunsafe, w-device]
    who: "간호사 → 영상팀 · 이식물 불명"
    icon: monitor
    before: ["We don't know what that device is, so ", "let's assume it's MRI-safe", " until we hear otherwise."]
    options: ["let's assume it's MRI-unsafe", "let's assume it's MRI-safe", "let's ignore it for now"]
    answer: "let's assume it's MRI-unsafe"
    notes:
      "let's assume it's MRI-unsafe": "모르면 안전한 쪽(비호환)으로 가정해요."
      "let's assume it's MRI-safe": "확인 없이 안전하다고 가정하면 자기장 사고가 날 수 있어요."
      "let's ignore it for now": "모르는 기기를 무시하면 안 돼요."
    why: "정체를 모르는 기기는 가장 안전한 쪽으로 가정해요. 확인이 끝날 때까지 MRI에 들이지 않아요."
    ko: "일단 MRI 비호환으로 가정합시다"
