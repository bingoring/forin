    chunks:
    - Let's document
    - the emergency
    - and the consent
    - process
    - .
    words:
    - w-document
    - w-emergency
    - w-consent
    - w-process
    goal: 2
    tag: 기록 합의
    icon: pencil
    why: document는 명사만이 아니라 기록으로 남기다라는 동사로도 써요. the emergency and the consent process로
      기록할 두 대상을 짚어요.
    decoy: the lunch order
    distractorsKo:
    - 응급 상황을 기록하려고 시각을 봅시다.
    - 응급 상황과 동의 절차를 확인해 둡시다.
    blank:
      answer: document
      options:
      - en: document
      - en: announce
      - en: rehearse
      - en: film
  - en: Patient safety justifies proceeding under emergency provisions.
    ko: 환자의 안전을 위해 응급 규정에 따라 진행하는 게 정당해요.
    chunks:
    - Patient safety
    - justifies proceeding
    - under emergency
    - provisions
    - .
    words:
    - w-safety
    - w-justify
    - w-proceed
    - w-under
    - w-emergency
    - w-provision
    goal: 2
    tag: 정당화
    icon: shield
    why: justifies는 정당화한다는 격식 있는 동사로 보고와 기록 문장에 어울려요. proceeding under ~로 어떤 근거 아래
