    decoy: visiting hours
    distractorsKo:
    - 응급에서는 동의를 기다리는 사이 상태가 나빠져요.
    - 환자의 안전을 위해 병원 규정에 따라 진행하는 게 정당해요.
    blank:
      answer: justifies
      options:
      - en: justifies
      - en: delays
      - en: limits
      - en: replaces
  - en: We need to document why we're proceeding without an interpreter.
