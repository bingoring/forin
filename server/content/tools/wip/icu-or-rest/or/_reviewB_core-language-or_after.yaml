      - en: Mute
      - en: Label
      - en: Close
  nuance:
  - kind: slider
    words:
    - w-urgent
    - w-immediately
    - w-connect
    cue: A patient is crashing and speaks only Vietnamese. You pick up the phone to
      reach the interpreter line.
    scale:
    - Whenever someone is free
    - As soon as you possibly can
    - Right now, immediately
    answerAt: 2
    why: 환자가 급격히 나빠지는 상황이라 가장 급한 표현이 맞아요. 통역 서비스에 '지금 바로' 연결해 달라고 분명히 말해야 대기열에서 우선
      처리돼요.
    example: We need an interpreter on the line immediately.
    exKo: 지금 바로 전화선으로 통역사가 필요해요.
  - kind: context
    words:
    - w-urgent
    word: urgent
    ko: 긴급한
    scenes:
    - who: 간호사 → 통역 서비스
      icon: speech
      en: This is urgent, so please connect us to a Vietnamese interpreter now.
      ok: true
    - who: 차트 기록
      icon: board
      en: Urgent interpreter request placed at 08:40; connected at 08:42.
      ok: true
    - who: 간호사 → 환자
      icon: faceWorried
      en: This is urgent, and I'm panicking because nobody here understands you.
      ok: false
      fix: This is urgent, so we're connecting an interpreter now to explain.
    why: 뜻은 셋 다 '긴급한'이에요. 통역 서비스에는 필요한 언어와 함께 급하다고 짧게, 차트에는 시각과 함께 적어요. 하지만 환자에게 '나도
      당황했다'고 하면 불안만 커져요. 지금 하고 있는 일을 말해요.
  order:
    tag: 대화 흐름
    icon: compass
    ko: 응급 통역 확보 4문장 순서
    why: 긴급하다고 알려 연결을 요청하고, 연결되면 핵심부터 전하자고 하며, 말 그대로 통역하게 한 뒤 불명확하면 바로 알리게 해요.
    lines:
    - en: This is urgent — connect us as fast as possible.
      icon: siren
      ko: 긴급해요, 최대한 빨리 연결해 주세요
      note: 요청
    - en: Thank you — let's get the essentials across right now.
      icon: bell
      ko: 고마워요, 지금 바로 필수적인 것부터 전달해요
