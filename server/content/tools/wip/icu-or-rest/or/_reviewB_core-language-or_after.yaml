    - w-sign
    - w-arrange
    - w-language
    cue: A Deaf patient signs that sign language is her first language and she wants
      to use it for the consent talk.
    scale:
    - Gesture and point to things around the room
    - Write notes back and forth on a clipboard
    - Arrange a qualified sign interpreter
    answerAt: 2
    why: 수어는 독립된 언어라서 몸짓이나 필담으로는 동의 같은 중요한 내용을 정확히 나누기 어려워요. 병원은 의사소통이 제대로 되도록 자격
      있는 수어 통역사를 마련해야 해요(영상 통역도 방법이에요).
    example: We'll arrange a sign language interpreter for you.
    exKo: 환자분을 위해 수어 통역사를 준비해 드릴게요.
  - kind: context
    words:
    - w-miss
    word: miss
    ko: 놓치다
    scenes:
    - who: 차트 기록
      icon: board
      en: Sign interpreter present; patient did not miss any instruction (teach-back
        correct).
      ok: true
    - who: 간호사 → 동료
      icon: speech
      en: Don't miss it when she signs her pain level, because she may do it any time.
      ok: true
    - who: 간호사 → 청각장애 환자
      icon: faceWorried
      en: Don't miss the PACU instructions, because I won't repeat them.
      ok: false
      fix: If you miss anything, tell me and I'll go over it again.
    why: 뜻은 셋 다 '놓치다'예요. 차트에는 놓친 것이 없었다고, 동료에게는 신호를 놓치지 말라고 말해요. 하지만 환자에게 '다시 안 알려
      준다'고 하면 협박처럼 들려요. 놓치면 언제든 다시 알려 주겠다고 해야 해요.
  order:
    tag: 대화 흐름
    icon: compass
    ko: 수어 통역 4문장 순서
    why: 수어 통역사를 준비한다고 알리고, 도착하면 지침마다 통역사를 보게 하고, 너무 빠르면 알리게 한 뒤, 놓치지 않게 된다고 마무리해요.
    lines:
    - en: We'll arrange a sign language interpreter for you.
      icon: speech
      ko: 수어 통역사를 준비해 드릴게요
      note: 준비
    - en: Once they're here, please watch them for each instruction.
      icon: magnify
      ko: 오시면 지침마다 통역사를 봐 주세요
      note: 시선
    - en: If that's too fast, let me know and I'll slow down.
      icon: bell
      ko: 너무 빠르면 알려 주세요, 천천히 할게요
      note: 속도
    - en: At a slower pace, you won't miss anything.
      icon: check
      ko: 속도를 늦추면 아무것도 놓치지 않으실 거예요
      note: 마무리
- title: 응급 신속 통역 확보
  sentences:
  - en: We need an interpreter on the line immediately.
    ko: 지금 바로 전화선으로 통역사가 필요해요.
    chunks:
