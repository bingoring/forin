    chunks:
    - We need
    - to document
    - why we're proceeding
    - without an interpreter
    - .
    words:
    - w-need
    - w-document
    - w-proceed
    - w-interpreter
    goal: 2
    tag: 기록 필요
    icon: pencil
    why: document why …처럼 why절을 목적어로 두면 이유를 기록한다는 뜻이 돼요. without an interpreter로 통역사가
      없는 상태라는 사실을 정확히 짚어요.
    decoy: without a chart
    distractorsKo:
    - 통역사 없이 진행하는 이유를 점검해야 해요.
    - 통역사 없이 진행하는 순서를 기록해야 해요.
    blank:
      answer: document
      options:
      - en: document
      - en: guess
      - en: dispute
      - en: debate
  - en: This is an emergency, so we'll use every means available.
    ko: 응급 상황이라 쓸 수 있는 모든 방법을 다 쓸게요.
    chunks:
    - This is an emergency
    - ', so we''ll use'
    - every means
    - available
    - .
    words:
    - w-emergency
    - w-every
    - w-means
    - w-available
    goal: 1
    tag: 응급 판단
    icon: siren
    why: '''This is an emergency, so …''로 이유를 먼저 대고 결과를 이어요. every means available처럼
      형용사를 뒤에 두는 어순도 가능해요.'
    decoy: This is a drill
    distractorsKo:
    - 응급 상황이라 쓸 수 있는 방법부터 바로 찾을게요.
    - 응급 상황이라 쓸 수 있는 모든 물건을 다 쓸게요.
    blank:
      answer: so
      options:
      - en: so
      - en: but
      - en: because
      - en: although
  nuance:
  - kind: slider
    words:
    - w-document
    - w-consent
    - w-process
    cue: The surgeon decides to proceed under the emergency exception because no interpreter
      can be reached. What do you chart?
    scale:
    - Chart what you saw, what you did, who decided
    - Chart that the patient agreed by nodding to the plan
    - Chart that full informed consent was obtained
    answerAt: 0
    why: 간호사는 자기가 한 일과 본 것, 누가 결정했는지만 있는 그대로 적어요. 끄덕임을 동의라고 적거나 동의를 받았다고 적으면 사실과 달라요.
      응급 예외를 적용할지는 시술자가 판단하고 기록해요.
    example: We need to document why we're proceeding without an interpreter.
    exKo: 통역사 없이 진행하는 이유를 기록해야 해요.
  - kind: context
    words:
    - w-provision
    word: provision
    ko: 규정
    scenes:
    - who: 차트 기록
      icon: board
      en: Proceeding under the emergency provision; surgeon documented the reason.
      ok: true
    - who: 간호사 → 수술팀
      icon: speech
      en: The surgeon will proceed under the emergency provision, so please note the
        time.
      ok: true
    - who: 간호사 → 보호자
      icon: me
      en: Under provision 4.2(b), the hospital waives your family's consent.
      ok: false
      fix: We're going ahead under an emergency provision so we don't lose time, and
        we'll explain everything afterward.
    why: 뜻은 셋 다 '규정'이에요. 차트와 수술팀에는 짧게, 보호자에게는 쉽게 말해요. 하지만 보호자에게 조항 번호를 읽어 주며 '동의를
      면제한다'고 하면 차갑고, 간호사가 정할 수 없는 일을 선언하는 말이에요.
  - kind: swap
    words:
    - w-consent
    - w-emergency
    - w-provision
    - w-proceed
    who: 간호사 → 차트 · 응급 동의 기록
    icon: board
    before:
    - ''
    - Patient consented.
    - ''
    options:
    - Patient consented.
    - Consent not obtained; no interpreter reached; surgeon proceeded under the emergency
      provision.
    - Consent obtained by nodding.
    answer: Consent not obtained; no interpreter reached; surgeon proceeded under
      the emergency provision.
    notes:
      Patient consented.: 동의를 받지 못했는데 받은 것처럼 적은 거짓 기록이에요.
      Consent not obtained; no interpreter reached; surgeon proceeded under the emergency provision.: 사실과
        이유, 누가 결정했는지가 모두 들어 있어요.
      Consent obtained by nodding.: 끄덕임은 이해를 확인한 동의가 아니에요.
    why: 응급에서 동의를 못 받았다면 못 받았다고 사실대로 적고, 통역을 시도한 것과 누가 어떤 근거로 진행했는지를 함께 남겨요.
    ko: 동의 못 받음, 통역사 연결 안 됨, 집도의가 응급 규정에 따라 진행.
  order:
    tag: 대화 흐름
    icon: compass
    ko: 통역 없는 응급 동의 4문장 순서
    why: 응급이고 통역사가 없다고 상황을 말하고, 환자 안전이 근거라고 정당화한 뒤, 그 규정을 쓰니 이유를 기록해야 한다고 하고, 차트에
      적도록 요청해요.
    lines:
    - en: This is an emergency, and no interpreter is available yet.
      icon: siren
      ko: 응급이고 아직 통역사가 없어요
      note: 상황
    - en: Patient safety justifies proceeding under emergency provisions.
      icon: shield
      ko: 환자 안전이 응급 규정에 따라 진행하는 걸 정당화해요
      note: 정당화
    - en: Because we're using those provisions, we must document why.
      icon: pencil
      ko: 그 규정을 쓰는 만큼 이유를 기록해야 해요
      note: 기록
    - en: That note should go in the chart as soon as we can.
      icon: board
      ko: 그 기록은 가능한 한 빨리 차트에 남겨야 해요
      note: 차트
- title: 언어장벽 알레르기 미확인
  sentences:
  - en: We can't confirm allergies due to the language barrier.
