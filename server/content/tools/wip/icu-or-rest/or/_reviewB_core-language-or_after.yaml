    why: 가볍게 시작하면 충격이 크고, 과장하면 불필요하게 공포를 줘요. '어려운 소식이 있다'고 먼저 알리면 가족이 마음의 준비를 해요.
      소식은 시술자가 전하고 간호사는 곁에서 지지해요.
    example: I'm so sorry — the interpreter will help me share this news.
    exKo: 정말 죄송해요 — 통역사가 이 소식을 전하는 걸 도와드릴 거예요.
