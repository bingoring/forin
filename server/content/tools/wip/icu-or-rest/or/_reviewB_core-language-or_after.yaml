      ko: 그중 불명확한 게 있으면 바로 말해 주세요
      note: 확인
- title: 통역 없는 응급 동의
  sentences:
  - en: We'll use every available means to communicate now.
    ko: 지금 쓸 수 있는 모든 방법으로 소통할게요.
    chunks:
    - We'll use
    - every available means
    - to communicate
    - now
    - .
    words:
    - w-every
    - w-available
    - w-means
    - w-communicate
    goal: 1
    tag: 소통 수단
    icon: speech
    why: every available means는 쓸 수 있는 수단을 하나도 빼지 않겠다는 약속이에요. means는 단수·복수 모양이 같은
      명사라 every 뒤에서도 means 그대로 써요.
    decoy: a calm voice
    distractorsKo:
    - 소통하려고 그림판부터 꺼낼게요.
    - 그림과 몸짓도 응급에선 소통 수단이 돼요.
    blank:
