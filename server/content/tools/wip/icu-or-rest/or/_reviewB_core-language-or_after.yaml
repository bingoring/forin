      - en: stay
      - en: sleep
      - en: rest
  - en: Connect the line immediately so we don't lose time.
    ko: 시간을 놓치지 않게 바로 전화선을 연결해 주세요.
    chunks:
    - Connect the line
    - immediately
    - so we don't
    - lose time
    - .
    words:
    - w-connect
    - w-line
    - w-immediately
    goal: 2
    tag: 즉시 연결
    icon: siren
    why: so we don't lose time으로 서두르는 이유를 밝혀요. Connect the line은 곧바로 할 일을 명령형으로 말해요.
    decoy: Charge the tablet
    distractorsKo:
