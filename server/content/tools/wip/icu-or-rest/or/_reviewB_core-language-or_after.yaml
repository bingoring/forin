      ko: 그게 몇 시부터인지 다시 말씀해 주시겠어요?
      note: 복창
    - en: Thank you — I'll write that time on your chart.
      icon: pencil
      ko: 고마워요, 그 시각을 차트에 적을게요
      note: 기록
- title: 마취 설명 통역
  sentences:
  - en: The interpreter will explain how the anesthesia works.
