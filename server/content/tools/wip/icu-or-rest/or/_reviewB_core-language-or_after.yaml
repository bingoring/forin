        경험을 말하되 단정하지 않고, 자세한 설명은 마취팀에 넘겨요.
      You'll forget all of it, so don't worry.: 걱정을 가볍게 덮는 말이고 보장도 할 수 없어요.
    why: 마취 중의 기억은 사람과 마취 방법에 따라 달라서 간호사가 장담하면 안 돼요. 흔한 경험으로 말하고 자세한 설명은 마취팀에 넘겨요.
    ko: 대부분은 수술 자체는 기억하지 못하세요, 자세한 건 마취팀이 설명해 드릴 거예요.
