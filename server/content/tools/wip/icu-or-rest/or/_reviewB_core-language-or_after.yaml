  - en: We can't wait — get me an interpreter right now.
    ko: 기다릴 수 없어요 — 지금 바로 통역사를 데려다주세요.
    chunks:
    - We can't wait
    - — get me
    - an interpreter
    - right now
    - .
    words:
    - w-interpreter
    - w-right
    goal: 1
    tag: 긴급 요청
    icon: siren
    why: We can't wait로 이유를 앞세우고 get me ~ right now로 곧바로 요구해요. 명령형 get me는 급박할 때만
