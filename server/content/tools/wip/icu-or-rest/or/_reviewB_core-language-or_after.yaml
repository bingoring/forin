    why: 환자가 말한 것만 출처와 함께 적어요. 통역사가 환자의 말을 옮겼을 뿐 금식을 '확인'해 준 것은 아니고, 수술해도 안전한지는 마취팀이
      판단해요.
    example: The interpreter will go over your fasting instructions.
    exKo: 통역사가 금식 지침을 하나하나 짚어 드릴 거예요.
  - kind: context
