situations:
- title: 어려운 기도 예측 사정
  sentences:
  - en: Let me review the airway history and exam.
    ko: 기도 병력과 진찰 기록을 검토할게요.
    chunks:
    - Let me review
    - the airway history
    - and exam
    - .
    words:
    - w-review
    - w-airway
    - w-history
    - w-exam
    goal: 1
    tag: 검토 시작
    icon: magnify
    why: Let me로 시작하면 허락을 구하듯 내가 먼저 훑어본다는 뜻이 부드럽게 전해져요. history and exam으로 기록과 신체 소견 두 출처를 함께 본다고 알려요.
    decoy: and lab results
    distractorsKo:
    - 복용 병력과 진찰 기록을 검토할게요.
    - 기도 병력과 마취 기록을 검토할게요.
    blank:
      answer: review
      options:
      - en: review
      - en: sign
      - en: audit
      - en: copy
  - en: Are there any predictors of a difficult airway here?
    ko: 여기 어려운 기도를 예측할 만한 인자가 있나요?
    chunks:
    - Are there
    - any predictors
    - of a difficult airway
    - here
    - '?'
    words:
    - w-predictor
    - w-difficult
    - w-airway
    goal: 1
    tag: 예측 질문
    icon: magnify
    why: Are there any …?는 있다고 단정하지 않고 열어 두는 질문이라 없다는 답도 편하게 나와요. predictors는 결과가 아니라 미리 알려 주는 신호예요.
    decoy: of a heart murmur
    distractorsKo:
    - 여기 출혈을 예측할 만한 인자가 있나요?
    - 여기 어려운 기도를 예측할 만한 검사가 있나요?
    blank:
      answer: predictors
      options:
      - en: predictors
      - en: treatments
      - en: doses
      - en: drugs
  - en: I'll note the neck mobility and mouth opening.
    ko: 목 가동성과 입 벌어지는 정도를 기록할게요.
    chunks:
    - I'll note
    - the neck mobility
    - and mouth opening
    - .
    words:
    - w-note
    - w-neck
    - w-mobility
    - w-mouth
    - w-opening
    goal: 1
    tag: 기록 약속
    icon: pencil
    why: I'll은 지금 하겠다는 즉석 약속이에요. note는 길게 쓰기보다 핵심만 적어 둔다는 말이라 차트에 남기겠다는 가벼운 표현이 돼요.
    decoy: the dental condition
    distractorsKo:
    - 턱 가동성과 입 벌어지는 정도를 기록할게요.
    - 목 가동성과 입 벌어지는 정도를 측정할게요.
    blank:
      answer: mobility
      options:
      - en: mobility
      - en: pressure
      - en: rhythm
      - en: volume
  - en: He had a difficult intubation documented two years ago.
    ko: 2년 전에 어려운 삽관이 기록되어 있었어요.
    chunks:
    - He had
    - a difficult intubation
    - documented
    - two years ago
    - .
    words:
    - w-difficult
    - w-intubation
    - w-document
    - w-year
    goal: 1
    tag: 과거력
    icon: chartup
    why: had … documented는 차트에 이미 적혀 있는 사실을 말하는 틀이라 짐작이 아니라 근거 있는 정보로 들려요. 문장 끝의 two years ago가 그 기록의 시점이에요.
    decoy: a failed spinal block
    distractorsKo:
    - 5년 전에 어려운 삽관이 기록되어 있었어요.
    - 3년 전에 어려운 삽관이 기록되어 있었어요.
    blank:
      answer: difficult
      options:
      - en: difficult
      - en: routine
      - en: planned
      - en: awake
  - en: Does he have a beard, or any history of snoring?
    ko: 수염이 있거나 코골이 병력이 있나요?
    chunks:
    - Does he have
    - a beard
    - ', or any history'
    - of snoring
    - '?'
    words:
    - w-beard
    - w-history
    - w-snoring
    goal: 1
    tag: 위험 질문
    icon: stetho
    why: Does he have … or any …?로 두 가지를 한 번에 묻고, any가 있다 없다 어느 쪽 답이든 편하게 해요. beard는 마스크 밀착을, snoring은 폐쇄 기도 가능성을 떠올리게 하는 항목이에요.
    decoy: a pacemaker
    distractorsKo:
    - 문신이 있거나 코골이 병력이 있나요?
    - 수염이 있거나 천식 병력이 있나요?
    blank:
