      options:
      - en: beard
      - en: tattoo
      - en: limp
      - en: rash
  - en: I'll let anesthesia know about this history right away.
    ko: 이 병력을 마취과에 곧바로 알릴게요.
    chunks:
    - I'll let
    - anesthesia know
    - about this history
    - right away
    - .
