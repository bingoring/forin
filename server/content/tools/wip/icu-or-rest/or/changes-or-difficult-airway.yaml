- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm과 ko(확인하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — check는 살펴 점검하는 쪽
- kind: word
  id: w-note
  fields:
  - ko
  why: w-document·w-record와 ko(기록하다)가 겹쳐 정답이 셋 — note는 짧게 메모
- kind: word
  id: w-document
  fields:
  - ko
  why: w-note와 ko(기록하다)가 같아 정답이 둘 — document는 차트·서류에 문서로 남기는 쪽
- kind: word
  id: w-hard
  fields:
  - ko
  why: w-difficult와 ko(어려운)가 같아 정답이 둘 — hard는 '힘든'
- kind: word
  id: w-begin
  fields:
  - ko
  why: w-start와 ko(시작하다)가 같아 정답이 둘 — begin은 착수하다
- kind: word
  id: w-have
  fields:
  - ko
  why: w-got(가지고 있다)와 ko(가지다)가 겹쳐 정답이 둘 — have는 'a good reserve'를 보유하다
- kind: word
  id: w-sats
  fields:
  - ko
  why: w-saturation과 ko(산소포화도)가 같아 정답이 둘 — sats는 구어로 쓰는 수치
- kind: word
  id: w-job
  fields:
  - ko
  why: w-role과 ko(역할)가 겹쳐 정답이 둘 — job은 각자 맡은 일
- kind: word
  id: w-try
  fields:
  - ko
  why: w-attempt(시도)와 ko(시도하다)가 겹쳐 정답이 둘 — try는 동사 '해 보다'
- kind: word
  id: w-right
  fields:
  - ko
  why: w-away(곧바로)와 ko(바로)가 겹쳐 정답이 둘 — right는 크기에 알맞은 쪽
- kind: word
  id: w-advance
  fields:
  - ko
  why: w-railroad와 ko(밀어 넣다)가 같아 정답이 둘 — advance는 관을 앞으로 나아가게 하다
- kind: word
  id: w-flag
  fields:
  - ko
  why: ko가 길어(알리다/표시하다) 오답과 길이가 맞지 않고 w-call·w-alert와도 겹침 — flag는 문제를 짚어 알리는 쪽
- kind: word
  id: w-bag
  fields:
  - ko
  why: ko가 길고 설명조(백을 짜서 환기시키다) — 백으로 환기하다
- kind: word
  id: w-unsure
  fields:
  - ko
  why: 확실하지 않은 → 오답과 길이를 맞추기 쉬운 짧은 말(확신 없는)
- kind: word
  id: w-prep
  fields:
  - ko
  why: w-ready(준비된)와 ko(준비하다)가 겹쳐 정답이 둘 — prep for code는 대비하다
- kind: word
  id: w-code
  fields:
  - ko
  why: 코드(심정지 대응) → 심정지 코드(병원 코드 호출)
- kind: word
  id: w-railroad
  fields:
  - ko
  why: ko가 길어(괄호 설명) 오답과 길이가 맞지 않고 w-advance와 겹침 — railroad는 부지를 따라 밀다
- kind: word
  id: w-open
  fields:
  - ko
  why: 태그된 문장 대부분이 kit·cric kit를 '열다'(입을 벌리다는 한 문장뿐)
- kind: word
  id: w-plan
  fields:
  - ko
  why: 태그된 문장 대부분이 명사 plan(plan A, next plan, failed airway plan)
- kind: word
  id: w-move
  fields:
  - ko
  why: 태그된 문장 대부분이 '다음 단계로 넘어가다'(move to the next plan 등)
- kind: word
  id: w-work
  fields:
  - ko
  why: 태그된 문장이 모두 'doesn't work·what worked'처럼 '통하다'
- kind: word
  id: w-number
  fields:
  - ko
  why: '''set number of attempts''·''attempt number two'' — 횟수는 w-attempt와 겹친다'
