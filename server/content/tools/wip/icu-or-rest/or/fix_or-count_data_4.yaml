# or-count 수정 데이터 4 — 단어(A W1~W17)와 뉘앙스(A N1~N14).
word_remove:   # (id, 이유) — 문장 태그는 data_1에서 뺐다
  - [w-loud, "ko 큰 소리로가 out loud(소리 내어)의 뜻이 아니고 같은 뜻은 w-aloud가 가르침 — 1.0 태그를 빼 어느 문장도 태그하지 않게 됨"]
  - [w-eye, "너무 쉬움(눈) — two sets of eyes는 pair 13에서 구로 계속 가르침; 13.3 태그를 빼 어느 문장도 태그하지 않게 됨"]
  - [w-late, "w-run을 run late로 바꿔 같은 문장에서 같은 말을 두 카드가 가르치게 됨 — 20.3 태그를 빼 어느 문장도 태그하지 않게 됨"]
words:   # 단어별 덮어쓸 필드. changes = v44 필드(en·ipa·ko·icon·example)를 바꾼 것만 changes에 적는다.
  w-protocol: {distractorsEn: [prototype, propofol]}
  w-open: {distractorsEn: [own, omit]}
  w-check: {distractorsEn: [chase, change]}
  w-match: {distractorsEn: [catch, patch]}
  w-aloud: {distractorsEn: [around, alone], decoyChips: [i, load]}
  w-miss: {en: missing, ipa: "/ˈmɪsɪŋ/", chips: [[miss, ing]], decoyChips: [mess, ion]}
  w-rule: {en: rule out, ipa: "/ˌruːl ˈaʊt/", chips: [[rule], [out]], distractorsEn: [roll out, rub out], decoyChips: [role]}
  w-turn: {en: turn up, ipa: "/ˌtɝn ˈʌp/", chips: [[turn], [up]], distractorsEn: [turn in, tune up], decoyChips: [torn]}
  w-pick: {en: pick up, ipa: "/ˌpɪk ˈʌp/", chips: [[pick], [up]], distractorsEn: [pick out, pack up], decoyChips: [pink]}
  w-run: {en: run late, ipa: "/ˌrʌn ˈleɪt/", chips: [[run], [late]], distractorsEn: [run low, run out], decoyChips: [rung]}
  w-careful: {ko: 꼼꼼히}
  w-bin: {ko: 수거통, cue: "다 쓴 거즈를 버리지 않고 모아 두었다가 세는 통"}
  w-restart: {distractorsKo: [다시 정리하다, 다시 기록하다]}
  w-interrupt: {ko: 중단시키다}
  w-shake: {ko: 털다}
  # W13 decoyChips — 조각 맞추기에 실제로 나오는 단어의 decoy(★ 무기·술집 포함)
  w-begin: {decoyChips: [bee, gan]}
  w-number: {decoyChips: [mem, bur]}
  w-resolve: {decoyChips: [ri, sole]}
  w-magnet: {decoyChips: [mug, not]}
  w-discrepancy: {decoyChips: [dus, crop]}
  w-surgeon: {decoyChips: [sir, gown]}
  w-separate: {decoyChips: [sap, rote]}
cues:   # W14 cue — ko를 되풀이한 사전 풀이를 장면으로(정답 영어 없음)
  w-before: {cue: "봉합·시작·인계보다 앞서 끝내야 하는 때를 말할 때"}
  w-incision: {cue: "집도의가 칼을 대기 직전 — 그보다 먼저 초기 계수가 끝나야 하는 순간"}
  w-check: {cue: "쟁반 위 기구를 눈으로 하나씩 훑으며 이상 없는지 볼 때"}
  w-correct: {cue: "두 사람이 센 숫자가 기록지와 들어맞아 집도의에게 보고할 때"}
  w-account: {cue: "쓴 바늘이 하나도 빠짐없이 어디 있는지 다 맞췄다고 할 때"}
  w-verify: {cue: "상대가 센 숫자를 기록지와 대조해 틀림없다고 확정할 때"}
  w-closure: {cue: "계수가 다 맞아야 집도의가 실을 잡을 수 있는 마지막 단계"}
  w-field: {cue: "멸균포로 둘러싼 안쪽 — 새 거즈는 여기 들어가기 전에 기록함"}
  w-recount: {cue: "교대·중단·불일치 뒤 숫자를 믿을 수 없을 때 하는 일"}
  w-shake: {cue: "접힌 소독포를 쥐고 흔들어 끼어 있는 거즈를 떨어뜨리는 동작"}
  w-finalize: {cue: "수색까지 끝내고 계수를 최종 숫자로 확정할 때"}
  w-miss: {cue: "바늘 반쪽은 찾았는데 나머지 반쪽이 아직 안 보일 때"}
  w-restart: {cue: "응급이 가라앉은 뒤 끊겼던 계수를 확인된 지점부터 다시 돌릴 때"}
  w-stop: {cue: "응급 상황이 터져 하던 계수가 중간에 끊겼을 때"}
  w-pick: {cue: "끊긴 일을 그 자리에서 이어 가는 구동사 — 계수에서는 확인 없이 쓰면 안 됨"}
  w-aloud: {cue: "상대가 듣고 확인할 수 있게 숫자를 입 밖으로 내며 셀 때"}
  w-dual: {cue: "두 사람이 짝을 이뤄 함께 세는 계수 방식 앞에 붙는 말"}
  w-xray: {cue: "닫기 전 몸 안에 거즈가 남았는지 방사선으로 찍어 볼 때"}
  w-radiology: {cue: "찍은 영상을 판독해 \"안에 남은 게 없다\"고 답해 주는 부서"}
  w-reopen: {cue: "봉합 뒤 계수가 틀려, 이미 닫은 부위를 다시 벌려야 할지도 모를 때"}
  w-surgeon: {cue: "계수가 틀리면 가장 먼저 알려야 하는, 수술을 이끄는 사람"}
  w-possible: {cue: "판독 전이라 아직 확정할 수 없는 잔류를 기록할 때 붙이는 말"}
  w-protocol: {cue: "잔류 이물이 의심될 때 병원이 정해 둔 단계를 그대로 밟을 때"}
  w-skip: {cue: "늦었다고 계수를 빼고 넘어가자는 압박에 \"그건 안 돼요\"라고 할 때"}
  w-begin: {cue: "초기 계수를 마친 뒤 \"이제 시작합시다\"를 조금 격식 있게"}
nuance:   # 키 = 상황 번호. 각 항목은 kind와 순번(그 상황 nuance 리스트 안 위치)으로 지정.
  0:
    - {at: 0, set: {decoys: ["the monitor"]}}     # N2 pair 0
    - at: 1                                       # N4 context(incision) → baseline
      replace:
        kind: context
        words: [w-baseline]
        word: baseline
        ko: 기저치
        scenes:
          - {who: "순환 간호사 → 집도의", icon: speech, en: "Let's get the baseline count before the incision.", ok: true}
          - {who: "수술 기록", icon: board, en: "Baseline count correct x2 at 0905.", ok: true}
          - {who: "불안한 환자에게", icon: me, en: "We're doing a baseline count before your surgery.", ok: false, fix: "We count all our supplies before your surgery starts, to keep you safe."}
        why: "baseline count는 이후 계수의 비교 기준이 되는 첫 계수를 가리키는 팀 안의 말이에요. 환자에게는 낯선 업무 용어라, 물품을 모두 세어 안전을 지킨다고 쉽게 풀어요."
  1:
    - {at: 0, set: {words: [w-count]}}            # W6 slider(상황 1) w-loud 뺌
  2:
    - at: 0                                       # N7 slider 2 why
      set: {why: "혼자 한 번 센 결과는 '내가 보기엔 맞다'까지만 말할 수 있어요. 'We both confirmed'는 두 사람이 함께 소리 내어 세어 같은 숫자를 확인한 뒤에 쓰는 말이고, 'seems close'는 계수에서는 너무 느슨해요."}
  4:
    - at: 0                                       # N8 slider 4 순서
      set:
        scale: ["I told the team the count", "I wrote it on the board", "I documented it in the record"]
        answerAt: 1
        why: "말로만 전하면 남지 않고, 정식 기록은 아직 필요 없어요. 모두가 볼 수 있게 보드에 적어 두는 것이 지금 맞아요."
    - at: 1                                       # N11 swap 4 문법
      set:
        before: ["I always note ", "the approximate time", " of each count."]
        options: ["the exact time", "the approximate time", "a rough time"]
        notes:
          the exact time: "계수를 한 시각을 정확히 남겨 두면 나중에 어느 계수 사이에 일이 있었는지 가릴 수 있다."
          the approximate time: "어림 시각은 어느 계수 사이에 일이 있었는지 가리지 못한다."
          a rough time: "대략의 시각은 기록으로서 가치가 떨어진다."
  6:
    - {at: 1, set: {who: "스크럽 → 순환 간호사 · 새 포장을 열 때"}}   # N13
  7:
    - at: 0                                       # N9 slider 7 example
      set: {example: "Let's do a full count together before I take over.", exKo: "제가 넘겨받기 전에 전체 계수를 함께 해요."}
    - at: 1                                       # N3 context(recount) → swap
      replace:
        kind: swap
        words: [w-count, w-together, w-before]
        who: "교대 간호사 → 순환 간호사 · 넘겨받기 전"
        icon: speech
        before: ["Let's do ", "a quick look", " together before I take over."]
        options: ["a full count", "a quick look", "a rough tally"]
        answer: "a full count"
        notes:
          a full count: "교대 때는 둘이 함께 전부 세어 확인한 뒤 넘겨받는다."
          a quick look: "훑어보기는 계수가 아니라 빠진 물품을 놓친다."
          a rough tally: "어림셈은 계수 기록이 될 수 없다."
        why: "교대 간호사는 숫자를 전해 듣거나 훑어보는 데서 그치지 않고, 넘겨받기 전에 함께 전부 세어요."
        ko: "제가 넘겨받기 전에 전체 계수를 함께 해요"
  9:
    - {at: 0, set: {scale: ["Count the parts too", "Recount the parts now", "Hold closing for each piece"]}}   # N14
  11:
    - at: 1                                       # N12 swap 11
      set:
        options: ["we need every fragment back", "we can probably skip the tip", "we only need the big half back"]
        notes:
          we need every fragment back: "부러진 바늘은 조각까지 모두 회수하고 셈에 넣어야 닫을 수 있다."
          we can probably skip the tip: "작은 끝부분이라도 몸 안에 남으면 이물이 된다."
          we only need the big half back: "큰 조각만 찾으면 작은 끝이 몸 안에 남는다."
  13:
    - {at: 0, set: {words: [w-dual, w-count, w-mistake], decoys: ["a pause"]}}   # W7 w-eye 뺌, N2 pair 13
  15:
    - at: 0                                       # N10 slider 15 why
      set: {why: "불일치가 확인되면 닫기를 잠시 멈춰 달라고 분명히 요청해야 해요. 'double-check'만으로는 약해서 봉합이 이어질 수 있고, 'Everyone stop everything'은 마취·지혈 같은 환자 처치까지 멈추라는 말로 들려요 — 멈출 것은 봉합이에요."}
  16:
    - {at: 0, set: {decoys: ["an incision"]}}     # N1 pair 16
    - at: 1                                       # N6 context(retained) fix
      set_scene_fix: {index: 2, fix: "We took an X-ray to make sure nothing was left behind."}
  17:
    - at: 1                                       # N10 swap 17 notes
      set_note: {key: "hold everything", text: "봉합과 방 밖으로 나가는 물품을 멈추고 수색에 집중한다(환자 처치는 계속한다)."}
  19:
    - at: 1                                       # N5 context(incident) fix
      set_scene_fix: {index: 2, fix: "Something unexpected came up during your surgery, and your surgeon will explain it to you."}
  20:
    - {at: 0, set: {words: [w-skip, w-run]}}      # W9 w-late 뺌
