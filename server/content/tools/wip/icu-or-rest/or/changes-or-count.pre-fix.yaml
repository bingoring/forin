  why: w-additional과 ko(추가의)가 같아 정답이 둘 — extra는 계획보다 더 나온 여분
- kind: word
  id: w-call
  fields:
  - ko
  why: w-declare와 ko(선언하다)가 같아 정답이 둘 — call은 소리 내어 부르는 쪽(declare는 선언)
- kind: word
  id: w-match
  fields:
  - ko
  why: 태그 문장이 모두 '목록·총계와 일치한다'는 뜻이라 대조하다보다 일치하다가 맞다
- kind: word
  id: w-retain
