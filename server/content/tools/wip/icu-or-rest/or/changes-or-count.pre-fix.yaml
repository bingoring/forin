  why: w-start와 ko(시작하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — begin은 본격적으로 개시하는 쪽
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm·w-verify와 ko(확인하다)가 같아 정답이 셋 — check는 눈으로 살펴 점검하는 쪽
- kind: word
  id: w-verify
  fields:
  - ko
  why: w-confirm·w-check와 ko(확인하다)가 같아 정답이 셋 — verify는 기준과 대조해 검증하는 쪽
- kind: word
  id: w-note
  fields:
