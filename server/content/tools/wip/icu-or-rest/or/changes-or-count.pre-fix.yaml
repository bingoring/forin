  why: w-part와 ko(부품)가 같아 정답이 둘 — component는 기구를 이루는 구성품
- kind: word
  id: w-pick
  fields:
  - ko
  why: w-restart와 ko(다시 시작하다)가 같아 정답이 둘 — 'pick up'은 중단한 자리에서 이어 가는 것
