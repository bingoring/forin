- title: 응급 세팅 신속 준비
  sentences:
  - en: Let's get the room set up as fast as we can.
    ko: 우리가 할 수 있는 한 빨리 방을 세팅합시다.
    chunks:
    - Let's get
    - the room
    - set up
    - as fast as we can
    - .
    words:
    - w-set
    - w-fast
    goal: 1
  - en: I'm opening the basic emergency setup now.
    ko: 지금 기본 응급 세팅을 개봉하고 있어요.
    chunks:
    - I'm opening
    - the basic emergency setup
    - now
    - .
    words:
    - w-open
    - w-basic
    - w-emergency
    - w-setup
    goal: 1
  - en: Tell me what you need first and I'll grab it.
    ko: 먼저 뭐가 필요한지 말씀해 주시면 제가 가져올게요.
    chunks:
    - Tell me
    - what you need
    - first
    - and I'll grab it
    - .
    words:
    - w-need
    - w-grab
    goal: 2
  - en: We need everything ready in a few minutes.
    ko: 몇 분 안에 전부 준비돼야 해요.
    chunks:
    - We need
    - everything ready
    - in a few minutes
    - .
    words:
    - w-need
    - w-ready
    goal: 1
  - en: I'll bring extra basins and drapes right away.
    ko: 여분의 대야와 드레이프를 바로 가져올게요.
    chunks:
    - I'll bring
    - extra basins
    - and drapes
    - right away
    - .
    words:
    - w-bring
    - w-extra
    - w-basin
    - w-drape
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-ready
    - w-setup
    - w-open
    cue: The surgeon asks if the room is ready. The basic emergency setup is open, but extra basins and drapes are still on their way. What do you report?
    scale:
    - Basic setup open, more coming
    - Almost everything is ready now
    - Everything is ready to go right now
    answerAt: 0
    why: 집도의에게는 지금 열린 것과 아직 오는 것을 그대로 말해야 해요. '다 됐다'고 하면 모자란 물품이 수술 중에 드러나서 더 늦어져요. 기본 세팅이 열렸다는 사실도 함께 알려 주세요.
    example: The basic setup is open, and the extras are coming.
    exKo: 기본 세팅은 열었고 여분은 오는 중이에요.
  - kind: swap
    words:
    - w-need
    - w-grab
    who: 순환간호사 → 집도의 · 필요한 것 묻기
    icon: speech
    before:
    - ''
    - Could you maybe let me know when you get a chance what you'll need?
    - ''
    options:
    - Tell me what you need first and I'll grab it.
    - Could you maybe let me know when you get a chance what you'll need?
    - I'll just open everything we have.
    answer: Tell me what you need first and I'll grab it.
    notes:
      Tell me what you need first and I'll grab it.: 짧고 분명하게 먼저 필요한 것부터 말해 달라고 하고, 곧바로 가져오겠다고 한다. 응급에서 서로 시간을 아낀다.
      Could you maybe let me know when you get a chance what you'll need?: 너무 돌려 말해서 급한 때 집도의가 뭘 말해야 할지 알기 어렵고, 답이 늦어진다.
      I'll just open everything we have.: 묻지 않고 전부 열면 쓰지 않은 멸균 물품도 낭비되고, 정작 필요한 것을 찾기도 어려워진다.
    why: 응급일수록 에둘러 묻지 말고 짧게 요청해요. 먼저 필요한 것을 말해 달라고 하고, 바로 가져오겠다고 말하면 집도의의 한마디가 곧 행동으로 이어져요.
    ko: 먼저 필요한 것부터 말씀해 주세요, 제가 가져올게요.
