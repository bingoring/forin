  w-resuscitate: {cue: '손상통제 뒤 중환자실에서 체온·응고·혈액량을 바로잡아 환자를 되살려 놓는 일의 동사'}
  w-start: {cue: '맥박이 없을 때 흉부압박에, 아기가 숨을 안 쉴 때 소생술에 막 들어가며 하는 말'}
