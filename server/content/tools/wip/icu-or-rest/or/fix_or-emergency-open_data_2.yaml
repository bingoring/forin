  w-tell: {cue: '윤상연골 압박을 언제 풀지 마취과에게 알려 달라고 부탁할 때'}
  w-protect: {cue: '급한 집도의가 기구대 너머로 손을 뻗을 때 지켜야 하는 것을 말하는 동사'}
  w-role: {cue: '다중 위기에서 누가 기도, 누가 혈액을 맡을지 나눌 때의 몫'}
  w-need: {cue: '집도의에게 "먼저 뭐가 필요하세요?"라고 묻거나 모자란 인력·제제를 말할 때의 동사'}
  w-heart: {cue: '태아가 위험할 때 모니터에서 가장 먼저 숫자를 보는 장기'}
  w-blood: {cue: '쿨러에 담겨 혈액은행에서 오고 팩 단위로 세어 수혈하는 것'}
  w-change: {cue: '상황이 달라지면 팀에 알리거나 역할을 다시 정한다고 말할 때의 동사'}
  w-drop: {cue: '태아 심박수가 다시 내려가는 것을 집도의에게 알릴 때의 동사'}
  w-every: {cue: '들어가는 팩이나 나오는 검체를 하나도 빼놓지 않고 챙긴다고 말할 때'}
  w-else: {cue: '준비해 둔 것 말고 열어 둘 것이 더 있는지 집도의에게 물을 때 "무엇" 뒤에 붙는 말'}
  w-whole: {cue: '팀 일부가 아니라 방 안 모든 사람에게 변화를 알린다고 할 때'}
  w-crash:
