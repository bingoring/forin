  - "I'll stay with you until the surgeon comes to talk."
  - "I can't say anything; ask the front desk."
  answer: "I'll stay with you until the surgeon comes to talk."
  notes:
    "Complications happen all the time, so try not to worry.": "흔하다고 말해 지금의 충격을 가볍게 만들고, 걱정하지 말라는 것은 불가능한 부탁이에요."
    "I'll stay with you until the surgeon comes to talk.": "집도의가 올 때까지 곁에 있겠다는 약속이라 가장 힘이 돼요."
    "I can't say anything; ask the front desk.": "가장 힘든 순간에 혼자 두는 말이에요."
  why: "합병증 소식은 집도의가 직접 설명해요. 그때까지 간호사가 할 일은 곁을 지키는 것이에요."
  ko: 집도의 선생님이 이야기하러 오실 때까지 함께 있을게요
