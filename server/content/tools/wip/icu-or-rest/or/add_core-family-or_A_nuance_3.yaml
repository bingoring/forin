  example: "We'll do our best to honor your request."
  exKo: "요청하신 걸 존중해드리도록 최선을 다할게요."
- kind: context
  words: [w-request]
  word: request
  ko: 요청
  scenes:
  - {who: 간호사 → 동료, icon: speech, en: "The family's request is a short prayer before transport — can we make room?", ok: true}
  - {who: 차트 기록, icon: board, en: "Family requested chaplain visit; chaplain paged.", ok: true}
  - {who: 간호사 → 보호자, icon: faceWorried, en: "Request denied: religious activity is not permitted in pre-op.", ok: false, fix: "We'll do our best to honor your request, and I'll check with the team."}
  why: "뜻은 셋 다 '요청'이에요. 동료에게는 어떻게 맞출지 묻고, 차트에는 원목 호출을 적어요. 하지만 보호자에게 확인도 없이 '거절됨, 허용되지 않음'이라고 하면 정중한 부탁이 무시당한 느낌이 들어요. 보호자에게는 최선을 다하고 팀에 확인하겠다고 말해요."
- kind: swap
  words: [w-honor, w-request, w-best]
  who: "간호사 → 보호자 · 종교적 요청"
  icon: me
  before: ["", "That's not something we do here.", ""]
  options:
  - "That's not something we do here."
  - "We'll do our best to honor your request."
  - "We can promise you whatever you ask."
  answer: "We'll do our best to honor your request."
