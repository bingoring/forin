  answer: "Whatever you decide, we'll support you fully."
  notes:
    "The surgeon says do it, so you really should agree.": "가족의 결정을 한쪽으로 밀어붙이는 말이에요. 결정은 가족의 몫이에요."
    "Whatever you decide, we'll support you fully.": "어떤 결정이든 지지하겠다는 약속이라 가족이 압박 없이 고를 수 있어요."
    "It's up to you, but most people say yes.": "결정을 가족에게 맡기는 척하면서 한쪽으로 이끄는 말이에요."
  why: "가족이 결정할 때 간호사는 방향을 잡아 주지 않아요. 어떤 선택이든 곁에서 지지하겠다고 말해 줘요."
  ko: 무엇을 결정하시든, 저희가 온전히 지지할게요
