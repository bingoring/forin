    "That's not something we do here.": "확인도 없이 잘라 말해 가족의 소중한 요청을 무시하는 말이에요."
    "We'll do our best to honor your request.": "요청을 존중하고 최선을 다하겠다고 하되, 확답은 하지 않아요."
    "We can promise you whatever you ask.": "수술 일정과 안전상 지킬 수 없을 수도 있는 약속이에요."
  why: "종교적 요청은 존중하되, 지킬 수 있는 만큼만 말해요. 확인하겠다는 말이 약속도 거절도 아닌 정직한 중간이에요."
  ko: 요청하신 걸 존중해드리도록 최선을 다할게요
술중 합병증 소식 전달:
- kind: slider
  words: [w-hard, w-stay, w-until]
  cue: "A wife has just been told there was a complication, and the surgeon is on the way to explain. She is shaking, and you are the nurse in the room."
  scale:
