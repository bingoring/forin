  - I know this is hard news to hear, and I'm sorry.
  - I know this is hard, and I'll stay with you until the surgeon comes.
  answerAt: 2
  why: "어려운 소식을 들은 가족 곁에는 위로의 말과 함께 곁에 있겠다는 약속이 가장 힘이 돼요. 흔한 일이라거나 강해지라는 말은 지금의 마음을 가볍게 만들어요."
  example: "I'll stay with you until the surgeon comes to talk."
  exKo: "집도의 선생님이 이야기하러 오실 때까지 함께 있을게요."
- kind: context
  words: [w-news]
  word: news
  ko: 소식
  scenes:
  - {who: 간호사 → 동료, icon: speech, en: "The surgeon is coming to give the family news — please stay with them.", ok: true}
  - {who: 차트 기록, icon: board, en: "Family told surgeon coming with news; RN at bedside.", ok: true}
  - {who: 간호사 → 대기 가족, icon: faceWorried, en: "Bad news: complication in the OR. Details to follow.", ok: false, fix: "I know this is hard news. The surgeon is coming to explain everything."}
  why: "뜻은 셋 다 '소식'이에요. 동료에게는 곁을 지켜 달라고, 차트에는 누가 곁에 있는지 적어요. 하지만 가족에게 '나쁜 소식, 합병증, 자세한 건 나중에'라고 짧게 던지면 충격만 주고 곁에 아무도 없는 것 같아요. 가족에게는 힘든 소식이라는 것을 인정하고 집도의가 설명한다고 해요."
- kind: swap
