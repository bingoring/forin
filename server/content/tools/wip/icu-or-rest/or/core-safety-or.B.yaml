    - w-anyone
    - w-raise
    - w-concern
    goal: 1
    tag: 우려 제기
    icon: bell
    why: Anyone은 직급을 가리지 않고 모두를 가리켜요. can은 허락의 뜻이라 말해도 된다는 분위기를 만들어요.
    decoy: raise a hand
    distractorsKo:
    - 여기서는 누구든 우려를 정리할 수 있어요.
    - 여기서는 누구든 우려를 취합할 수 있어요.
    blank:
      answer: raise
      options:
      - en: answer
      - en: raise
      - en: settle
      - en: weigh
  - en: Patient safety comes before speed.
    ko: 환자 안전이 속도보다 우선이에요.
