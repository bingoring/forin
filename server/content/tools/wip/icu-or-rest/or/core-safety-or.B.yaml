    - Patient safety
    - comes before
    - speed
    - .
    words:
    - w-patient
    - w-safety
    - w-speed
    goal: 1
    tag: 안전 우선
    icon: shield
    why: comes before는 순서뿐 아니라 우선순위를 말해요. 속도 앞에 안전을 놓아 무엇이 먼저인지 짧게 못 박아요.
    decoy: Patient privacy
    distractorsKo:
    - 환자 정보가 속도보다 우선이에요.
    - 환자 안전이 비용보다 우선이에요.
    blank:
      answer: safety
      options:
      - en: risk
      - en: harm
      - en: delay
      - en: safety
  - en: We support each other in speaking up.
    ko: 우리는 말을 꺼내는 서로를 지지해요.
    chunks:
    - We support
    - each other
    - in speaking up
    - .
    words:
    - w-support
    - w-eachother
    - w-speak
    goal: 2
    tag: 서로 지지
    icon: handshake2
    why: each other는 지지하는 사람과 받는 사람이 같은 팀원이라는 뜻이에요. in speaking up은 어떤 일에서 지지하는지 짚어요.
    decoy: in training
    distractorsKo:
    - 우리는 말을 꺼내는 서로를 기억해요.
    - 우리는 말을 꺼내는 서로를 지켜봐요.
    blank:
      answer: support
      options:
      - en: copy
      - en: judge
      - en: rate
      - en: support
  - en: I feel safe speaking up in this room.
    ko: 이 방에서는 말을 꺼내도 안전하다고 느껴요.
    chunks:
    - I feel safe
    - speaking up
    - in this room
    - .
    words:
