    - en: When someone does, we thank them for it.
      icon: handshake2
      ko: 누가 그러면 우리는 고마워해요
      note: 감사
    - en: Since you'd get that same thanks, please speak up today if something feels wrong.
      icon: speech
      ko: 같은 고마움을 받을 테니 오늘 뭔가 이상하면 말해 주세요
      note: 요청
