    - 여기서는 지각한다고 탓하지 않아요.
    blank:
      answer: blamed
      options:
      - en: paged
      - en: billed
      - en: blamed
      - en: hired
  - en: This team wants to hear it if something feels wrong.
    ko: 이 팀은 뭔가 잘못됐다고 느껴지면 그 말을 듣고 싶어 해요.
    chunks:
    - This team wants
    - to hear it
    - if something feels
    - wrong
    - .
    words:
    - w-team
    - w-hear
    - w-something
    - w-wrong
    goal: 1
    tag: 듣고 싶어 함
    icon: mic
    why: if something feels wrong은 확실하지 않아도 느낌만으로 말해도 된다는 뜻이에요. to hear it은 팀이 그 말을 반긴다는 표현이에요.
    decoy: to read it
    distractorsKo:
    - 이 팀은 뭔가 잘못됐다고 느껴지면 그 말을 적고 싶어 해요.
    - 이 팀은 뭔가 바쁘다고 느껴지면 그 말을 듣고 싶어 해요.
    blank:
      answer: wrong
      options:
      - en: busy
      - en: funny
      - en: slow
      - en: wrong
  order:
    tag: 대화 흐름
    icon: compass
    ko: 수술 안전 문화 4문장 순서
    why: 먼저 우려를 다루는 방식을 소개하고, 누구나 제기할 수 있다고 말한 뒤, 그때 감사한다는 것을 보여 주고, 마지막에 오늘도 그렇게 해 달라고 청해요.
    lines:
    - en: Let me explain how we handle concerns in this room.
      icon: board
      ko: 이 방에서 우려를 다루는 방식을 설명할게요
      note: 소개
    - en: Anyone here can raise one, whatever their role.
      icon: bell
      ko: 여기서는 직책과 상관없이 누구든 제기할 수 있어요
