    - w-speak
    - w-room
    goal: 2
    tag: 안전한 분위기
    icon: shield
    why: I feel safe는 개인의 느낌을 말해서 강요처럼 들리지 않아요. in this room으로 어디서 그런지 한정해요.
    decoy: in the hallway
    distractorsKo:
    - 이 병동에서는 말을 꺼내도 안전하다고 느껴요.
    - 이 방에서는 걸어 다녀도 안전하다고 느껴요.
    blank:
      answer: safe
      options:
      - en: safe
      - en: tired
      - en: rushed
      - en: bored
  - en: No one gets blamed for asking a question here.
    ko: 여기서는 질문한다고 탓하지 않아요.
    chunks:
    - No one gets blamed
    - for asking
    - a question
    - here
    - .
    words:
    - w-blame
    - w-ask
    - w-question
    goal: 2
    tag: 질문 환영
    icon: speech
    why: No one gets blamed는 행동하는 사람을 밝히지 않는 수동형이라 누구도 탓하지 않는다는 뜻이 부드럽게 전해져요.
