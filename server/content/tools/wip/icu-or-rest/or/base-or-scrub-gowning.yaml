- title: 외과적 손씻기 절차
  sentences:
  - en: Start at your fingertips and work down to the elbows.
    ko: 손끝에서 시작해서 팔꿈치까지 내려가며 씻으세요.
    chunks:
    - Start at
    - your fingertips
    - and work down
    - to the elbows
    - .
    words:
    - w-start
    - w-fingertip
    - w-work
    - w-elbow
    goal: 1
  - en: Keep your hands above your elbows the whole time.
    ko: 내내 손을 팔꿈치보다 위에 두세요.
    chunks:
    - Keep
    - your hands
    - above your elbows
    - the whole time
    - .
    words:
