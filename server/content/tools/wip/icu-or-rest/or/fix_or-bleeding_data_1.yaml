    why: 라인 상태를 알리고, 수액을 최대로 열 준비를 말하고, 그것으로 모자랄 때 라인 추가를 제안한 뒤, 어느 쪽이든 개통을 계속 확인한다는 순서예요.
    lines:
    - en: Both IVs are patent and flowing freely.
      icon: check
      ko: 양쪽 정맥로 모두 개통돼 있고 잘 흘러요
      note: 상태
    - en: I've got fluids ready to run wide open if we need it.
      icon: pill
      ko: 필요하면 수액을 완전히 열 준비가 됐어요
      note: 대기
    - en: If that isn't enough, I can place another line for anesthesia.
      icon: handshake2
      ko: 그걸로 모자라면 마취과를 위해 라인을 하나 더 놓을게요
      note: 제안
    - en: Either way, I'll keep checking that the lines stay patent.
      icon: magnify
      ko: 어느 쪽이든 라인이 열려 있는지 계속 볼게요
      note: 확인
  11:
    tag: 대화 흐름
    icon: compass
    ko: 가온 수액 4문장 순서
    why: 가온기를 설치하고, 모든 수액이 그것을 거치게 하고, 그렇게 수액이 체온으로 유지된다고 설명한 뒤, 결론으로 체온 저하를 막겠다고 맺는 순서예요.
    lines:
    - en: I'm setting up the fluid warmer now.
      icon: gear
      ko: 지금 가온 수액기를 설치하고 있어요
      note: 설치
    - en: All the volume will run through it.
      icon: pill
      ko: 모든 수액량이 그걸 거쳐 흐를 거예요
      note: 경로
    - en: With all of it going through, the fluids stay at body temperature.
      icon: stetho
      ko: 전부 거쳐 가니 수액이 체온으로 유지돼요
      note: 효과
    - en: So we'll keep his temperature from dropping during the case.
      icon: faceWorried
      ko: 그래서 수술 동안 체온 저하를 막을게요
      note: 목표
  13:
    tag: 대화 흐름
    icon: compass
    ko: 출혈 원인 논의 4문장 순서
    why: 원인을 묻고, 검사가 치료 방향을 정해 준다고 말하고, 알기 전까지 둘 다 다루자고 한 뒤, 결과가 나오면 원인에 맞춰 좁히는 순서예요.
    lines:
    - en: Is this a surgical bleeder or a coagulopathy?
      icon: stetho
      ko: 이건 외과적 출혈인가요, 응고병증인가요
      note: 질문
    - en: The coags will tell us which way to treat.
      icon: lab
      ko: 응고검사가 치료 방향을 알려줄 거예요
      note: 근거
    - en: Until they do, let's address both.
      icon: handshake2
      ko: 결과가 나올 때까지는 둘 다 다룹시다
      note: 병행
    - en: When the coags are back, we'll narrow treatment to the cause.
      icon: check
      ko: 결과가 나오면 원인에 맞춰 치료를 좁힐게요
