# or-count 수정 데이터 3 — 순서 배열 카드(order)와 why. order 키 = 상황 번호, lines 키 = 줄 번호(0부터).
order:
  0:   # B — 초기 계수가 곧 기저치라 3줄이 순환
    lines:
      2: {en: "Both of us got those same numbers.", ko: "둘 다 그 숫자가 같았어요", note: 확인}
  2:   # B 정답 둘 — 3↔4 교환. 4줄을 3줄의 '일치'를 가리키게(같은 말 되풀이 없이)
    lines:
      3: {en: "That means I can confirm that total with you.", ko: "그러면 그 총계를 당신과 함께 확인할 수 있어요", note: 확인}
  3:   # B 조건(적기는 언제나 하는 일) + A S10 3.1 ko
    lines:
      1: {en: "All of them go back on the magnet for counting.", ko: "전부 세기 위해 자석 패드에 다시 꽂아 둬요", note: 회수}
      3: {en: "Once that number is called out, I'll write it on the board.", ko: "그 숫자를 부르면 게시판에 적을게요", note: 기록}
  4:   # B 논리 — 시각을 적었다고 총계가 맞는 게 보이지는 않음
    lines:
      2: {en: "Looking at that record, all totals match.", ko: "그 기록을 보면 총계가 전부 일치해요", note: 일치}
  7:   # B 정답 둘 — 1↔2 교환
    lines:
      1: {en: "While we count, tell me exactly what's still open on the field.", ko: "세는 동안 필드에 아직 열려 있는 게 뭔지 정확히 말해줘요", note: 요청}
  12:  # A S1·B — 끊긴 계수는 이어 가지 않고 다시 센다(12.4 새 문장과 맞춤)
    why: "응급 상황이 계수를 멈췄다고 알리고, 중단을 기록하고, 안정되면 확실한 지점부터 재개하고, 거기서부터 끊긴 묶음을 전부 다시 세요."
    lines:
      3: {en: "From there, we count every item in that group again.", ko: "거기서부터 그 묶음을 전부 다시 세요", note: 재계수}
  15:  # B — 2·3줄이 둘 다 닫기 멈춤이라 3줄을 '찾을 때까지'로(A S4의 3줄 ko 항목은 이 줄이 바뀌며 해소)
    why: "개수가 모자란다고 보고하고, 그 이유로 불일치를 선언하며 닫기를 멈추고, 찾을 때까지 닫을 수 없다고 한 뒤, 맞으면 닫을 수 있다고 해요."
    lines:
      2: {en: "Until it's found, we can't close.", ko: "찾을 때까지 닫을 수 없어요", note: 정지}
  17:  # A K1·S3 — 전원 정지가 아니라 방에서 아무것도 나가지 않게 하고 움직임을 줄임. 5.2 꼼꼼히(17.3 ko)
    why: "바늘이 모자라 봉합과 반출을 멈추게 하고, 방에서 아무것도 나가지 않게 한 채 체계적으로 수색하고, 거기 없으면 방 구석까지 확인해요."
    lines:
      1: {en: "Nothing leaves the room until we find it.", ko: "찾을 때까지 방에서 아무것도 나가지 않아요", note: 반출}
      2: {en: "While we limit movement here, let's search the field, drapes, and floor systematically.", ko: "여기서 움직임을 줄이는 동안 필드와 소독포, 바닥을 체계적으로 수색해요", note: 수색}
      3: {en: "If it's not there, check every corner of the room carefully.", ko: "거기 없으면 방 구석구석을 꼼꼼히 확인해요", note: 확대}
  18:  # A K3·B — 재개방 결정은 집도의. 성별 표현 없이
    why: "최종 계수가 틀렸다고 알리고, 바로 집도의에게 올린 뒤, 기다리는 동안 영상부터 찍고, 집도의가 돌아오면 집도의가 다시 열지 결정해요."
    lines:
      2: {en: "While we wait for the surgeon, let's image before deciding on re-exploration.", ko: "집도의를 기다리는 동안 재개방 탐색을 결정하기 전에 영상부터 찍어요", note: 영상}
      3: {en: "Once the surgeon is back in the room, they decide whether to reopen.", ko: "집도의가 방으로 돌아오면 다시 열지 여부를 결정해요", note: 결정}
  19:  # A S2·B 안전 — 영상 요청이 사건 보고서 제출보다 앞(환자가 방을 나가기 전)
    why: "잔류 가능성을 기록하겠다고 하고, 안전이 우선이라 보고하고, 환자가 방을 나가기 전에 후속 엑스선을 요청한 뒤, 그다음 사건 보고서를 제출해요."
    lines:
      2: {en: "As part of that, I'll request the follow-up X-ray the surgeon ordered.", ko: "그 일환으로 집도의가 처방한 후속 엑스선을 요청할게요", note: 영상, icon: monitor}
      3: {en: "Once that's requested, we need to file an incident report immediately.", ko: "그걸 요청하면 즉시 사건 보고서를 제출해야 해요", note: 서류, icon: pencil}
  20:  # B 정답 둘 — 3↔4 교환
    lines:
      3: {en: "Once it's resolved, we can close safely.", ko: "해결되면 안전하게 닫을 수 있어요", note: 수정}
sentence_why:   # B why 3건 (키 = "상황.문장")
  "18.0": "'may need to'는 다시 열지 여부가 영상과 집도의 판단에 달려 있어서 가능성으로 말하는 표현이에요. 're-'가 붙은 'reopen'은 이미 닫은 것을 다시 연다는 뜻이에요."
  "6.1": "'Let me'로 시작하면 허락을 구하듯 부드럽게 내 행동을 알려요. 'before they go into the field'는 멸균 필드에 올라가기 전에 기록한다는 시점이에요."
  "18.2": "'escalate'는 문제를 윗사람에게 올린다는 뜻이라 혼자 해결하지 않고 책임자에게 알려 함께 결정해요. 'immediately'는 미루지 않는다는 뜻이에요."
