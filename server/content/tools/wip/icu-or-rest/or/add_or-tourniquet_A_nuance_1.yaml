지혈대 압력 설정:
  - kind: slider
    words: [w-confirm, w-set, w-pressure]
    cue: "The surgeon told you the pressure to set, you entered it, and he says \"Go ahead and inflate.\""
    scale: [I assume the setting is right, I glance at the setting, I confirm the setting with you]
    answerAt: 2
    why: "압력은 집도의가 정하고, 간호사는 올리기 전에 입력한 값을 소리 내어 맞춰 봐요. 'confirm … with you'는 상대와 말로 확인한다는 뜻이라 가장 알맞아요. 혼자 훑어보거나 맞겠거니 하는 것은 확인이 아니에요."
    example: "I confirm the setting with you before I inflate."
    exKo: "올리기 전에 설정을 당신과 확인해요."
  - kind: swap
    words: [w-set, w-match, w-before]
    who: "순환 간호사 → 집도의 · 올리기 직전"
    icon: speech
    before: ["Dr. Kim, ", "I changed the setting a little", " — shall I inflate?"]
    options: [the setting matches your order, I changed the setting a little, the setting is probably fine]
    answer: the setting matches your order
    notes: {the setting matches your order: "집도의가 정한 값과 기계 값이 같다고 보고한다. 집도의가 안심하고 올리라고 말할 수 있다.", I changed the setting a little: "압력은 집도의가 정하는 값이다. 간호사가 마음대로 바꿨다고 말하면 업무 범위를 벗어난다.", the setting is probably fine: "'아마'는 확인하지 않았다는 말로 들린다. 값은 짐작이 아니라 맞춰 본 결과로 전한다."}
    why: "압력 숫자는 집도의가 정해요. 간호사는 기계에 들어간 값이 그 지시와 같은지 확인해 알리고, 임의로 바꾸거나 '아마 맞다'고 넘기지 않아요."
    ko: "설정이 지시하신 것과 일치해요"
적용 시각 기록:
  - kind: slider
    words: [w-mark, w-board, w-record]
    cue: "The cuff just went up, and everyone in the room needs to see the inflation time at a glance."
    scale: [Keep it in my head, Mark it on the board, Chart it after the case]
    answerAt: 1
    why: "올린 시각은 모두가 바로 볼 수 있게 보드에 표시하고, 정식 기록도 남겨요. 머릿속에만 두면 팀이 볼 수 없고, 수술 뒤에 적으면 그사이 경과 시간을 말해 줄 수 없어요."
    example: "I mark the inflation time on the board right away."
    exKo: "올린 시각은 바로 보드에 표시해요."
  - kind: swap
    words: [w-mark, w-board, w-record]
    who: "순환 간호사 → 스크럽 · 지혈대를 올린 직후"
    icon: speech
    before: ["Tourniquet is up, so ", "I'll remember the time", "."]
    options: [I'm marking the time on the board, I'll remember the time, I'll write it down later]
    answer: I'm marking the time on the board
    notes: {I'm marking the time on the board: "시각을 바로 보드에 표시해 팀이 함께 본다. 허혈 시간 추적이 올린 순간부터 시작된다.", I'll remember the time: "기억에만 맡기면 바쁜 수술 중 틀리기 쉽고, 다른 사람은 알 수 없다.", I'll write it down later: "나중에 적으면 정확한 시각을 놓칠 수 있다. 올린 시각은 그때 바로 남긴다."}
    why: "지혈대 시간은 올린 순간부터 세기 시작해요. 시각을 바로 보드에 적어 두면 모두가 경과 시간을 같은 숫자로 알 수 있어요."
    ko: "지혈대가 올라갔으니 시각을 보드에 표시하고 있어요"
하부 패딩 적용:
  - kind: slider
    words: [w-wrinkle, w-smooth, w-pad]
    cue: "While padding the limb, your fingers catch a fold in the padding."
    scale: [Leave it — the cuff will flatten it, Smooth the padding flat first, Ask the surgeon to smooth it]
    answerAt: 1
    why: "패딩이 접힌 곳은 커프 압력이 한 점에 몰려 피부 손상으로 이어질 수 있어요. 커프를 감기 전에 직접 매끄럽게 펴는 것이 맞고, 커프가 눌러 펴 주기를 기대하거나 집도의에게 맡길 일이 아니에요."
    example: "Smooth the padding flat before the cuff goes on."
    exKo: "커프를 감기 전에 패딩을 평평하게 펴요."
  - kind: swap
    words: [w-prevent, w-skin, w-pad]
    who: "환자에게 · 패딩을 대는 이유 설명"
    icon: me
    before: ["We put a soft pad under the cuff ", "to prevent skin breakdown", "."]
    options: [so it won't hurt your skin, to prevent skin breakdown, to avoid dermal compromise]
    answer: so it won't hurt your skin
    notes: {so it won't hurt your skin: "환자가 바로 알아듣는 쉬운 말이다. 겁주지 않고 이유를 알려 준다.", to prevent skin breakdown: "의료진끼리 쓰는 말이다. 환자에게는 딱딱하고 무겁게 들린다.", to avoid dermal compromise: "더 어려운 전문어라 환자가 알아듣기 어렵다."}
    why: "같은 이유라도 환자에게는 쉬운 말로, 의료진끼리는 'skin breakdown' 같은 임상어로 말해요."
    ko: "커프가 피부를 아프게 하지 않도록요"
부착부 상태 확인:
  - kind: slider
    words: [w-look, w-fine, w-breakdown]
    cue: "The skin where the cuff will sit has a small open area."
    scale: [The skin looks fine, The skin looks a bit pink, The skin shows breakdown]
    answerAt: 2
    why: "'breakdown'은 피부가 헐거나 열려 무너진 상태예요. 이미 열린 곳이 있는데 fine이나 a bit pink로 줄여 말하면 안 돼요. 감기 전 상태로 기록하고 집도의에게 알려요."
    example: "The skin shows breakdown at the cuff site."
    exKo: "커프 자리 피부에 손상이 있어요."
  - kind: context
    words: [w-baseline]
    word: baseline
    ko: 기저 상태
    scenes:
      - {who: 수술 기록, icon: board, en: "Baseline skin condition documented before cuff application.", ok: true}
      - {who: 집도의에게, icon: speech, en: "Dr. Lee, the baseline skin is intact — no breakdown at the cuff site.", ok: true}
      - {who: 걱정하는 환자에게, icon: me, en: "Your baseline skin condition is intact, ma'am.", ok: false, fix: "Your skin looks healthy where the cuff will go."}
    why: "뜻은 셋 다 '처음 상태'예요. baseline은 기록하고 의료진끼리 보고할 때 쓰는 말이고, 환자에게는 딱딱해서 '피부가 건강해 보인다'처럼 풀어 말해요."
