봉합 직전 거즈 불일치:
  - kind: slider
    words: [w-hold, w-closure, w-count, w-discrepancy]
    cue: "The closing count is one sponge short, and the surgeon is reaching for suture."
    scale: [Let's double-check the count, Please hold the closure, Everyone stop everything now]
    answerAt: 1
    why: "불일치가 확인되면 닫기를 잠시 멈춰 달라고 분명히 요청해야 해요. 'double-check'만으로는 약해서 봉합이 이어질 수 있고, 모두 전부 멈추라는 말은 지나쳐요."
    example: "Please hold — we can't close until this is resolved."
    exKo: "잠깐요 — 해결될 때까지 닫을 수 없어요."
  - kind: context
    words: [w-discrepancy]
    word: discrepancy
    ko: 불일치
    scenes:
      - {who: 순환 간호사 → 집도의, icon: speech, en: "Dr. Lee, there's a count discrepancy — please hold closure.", ok: true}
      - {who: 수술 기록, icon: board, en: "Count discrepancy noted at closure; one sponge short; surgeon notified.", ok: true}
      - {who: 기다리는 가족에게, icon: me, en: "There's a discrepancy in our count, so the surgery is taking longer.", ok: false, fix: "We're double-checking our supplies, so the surgery is taking a little longer."}
    why: "discrepancy는 수술팀 안에서 계수 문제를 정확히 알리는 말이에요. 가족에게는 어렵고 차갑게 들리니 쉬운 말로 풀어서 설명해요."
X선 잔류 거즈 확인:
  - kind: pair
    words: [w-xray, w-rule, w-retain, w-radiology, w-sponge]
    pairs: [[take, an X-ray], [rule out, a retained sponge], [call, radiology]]
    decoys: [the stretcher]
    why: "엑스선은 take, 가능성을 배제할 때는 rule out, 영상의학과에는 call을 써요. 이 세 표현은 잔류 이물이 의심될 때 자주 연달아 나와요."
  - kind: context
    words: [w-retain]
    word: retained
    ko: 잔류한
    scenes:
      - {who: 순환 간호사 → 집도의, icon: speech, en: "We'll image the field to rule out a retained sponge.", ok: true}
      - {who: 영상 판독 기록, icon: board, en: "Post-closure X-ray negative for retained sponge.", ok: true}
      - {who: 회복실의 환자에게, icon: me, en: "We took an X-ray to rule out a retained sponge in your abdomen.", ok: false, fix: "We took a picture to make sure nothing was left behind."}
    why: "retained는 몸 안에 남은 물건을 가리키는 의료진의 정확한 말이에요. 환자에게 '복부에 잔류한 거즈'라고 하면 불안만 키우니, 쉬운 말로 확인했다고 전해요."
소실 바늘 필드 수색:
  - kind: slider
    words: [w-needle, w-short]
    cue: "The final needle count is one short, and you haven't found it yet."
    scale: [We're one needle short, One needle is gone, A needle is in the patient]
    answerAt: 0
    why: "아직 찾지 못했다는 사실만 그대로 말해요. 'gone'은 사라졌다고 단정하고, 'in the patient'는 확인되지 않은 몸속 잔류를 단정해요."
    example: "We're one needle short — hold everything."
    exKo: "바늘이 하나 부족해요 — 전부 멈춰요."
  - kind: swap
    words: [w-hold, w-search, w-needle, w-short]
    who: "순환 간호사 → 수술실 전원 · 바늘이 부족할 때"
    icon: speech
    before: ["We're one needle short — ", "carry on as usual", " and let's search."]
    options: [hold everything, carry on as usual, speed things up]
    answer: hold everything
    notes: {hold everything: "하던 동작을 멈추고 바늘을 찾는 데 집중한다. 찾는 동안 상황이 더 복잡해지지 않는다.", carry on as usual: "평소처럼 계속하면 바늘이 더 멀리 가거나 찾기 어려워진다.", speed things up: "서두르면 수색이 허술해지고 닫기가 앞당겨질 수 있다."}
    why: "바늘이 맞지 않으면 먼저 멈추고 찾는 데 집중해요. 평소처럼 계속하거나 서두르면 바늘을 놓칠 위험이 커져요."
    ko: "전부 멈추고 찾아봐요"
봉합 후 계수 오류:
  - kind: slider
    words: [w-final, w-count, w-wrong, w-reopen]
    cue: "After closure, the final sponge count is off by one, and a recount confirms it."
    scale: [Something may be off, The final count is off, Reopen the wound right now]
    answerAt: 1
    why: "간호사는 확인된 사실, 즉 최종 계수가 맞지 않는다는 것을 집도의에게 분명히 알려요. 다시 열지 말지는 영상 확인과 집도의의 판단으로 정해요."
    example: "The final count is wrong — we may need to reopen."
    exKo: "최종 계수가 틀렸어요 — 다시 열어야 할 수도 있어요."
  - kind: context
    words: [w-escalate]
    word: escalate
    ko: 상급 보고하다
    scenes:
      - {who: 순환 간호사 → 스크럽, icon: speech, en: "I'm escalating this to the surgeon right now.", ok: true}
      - {who: 수술 기록, icon: board, en: "Count discrepancy escalated to surgeon at 1042.", ok: true}
      - {who: 걱정하는 가족에게, icon: me, en: "We escalated the count problem to the surgeon.", ok: false, fix: "We told the surgeon right away, and the surgeon is checking."}
    why: "escalate는 문제를 윗선에 올린다는 업무 용어예요. 가족에게는 관료적으로 들리므로 'told the surgeon right away'처럼 쉽게 풀어 말해요."
이물 잔류 의심 보고:
  - kind: slider
    words: [w-possible, w-retain, w-item, w-document]
    cue: "The count is off and the X-ray hasn't been read yet — you document it accurately."
    scale: [A possible retained item, A probable retained item, A confirmed retained item]
    answerAt: 0
    why: "영상을 판독하기 전에는 '가능성이 있는' 단계로 기록해요. probable이나 confirmed는 확인되지 않은 것을 더 단정하는 말이라 기록이 실제와 어긋나요."
    example: "This is a possible retained object — I'm documenting it."
    exKo: "잔류 이물일 가능성이 있어요 — 문서화할게요."
  - kind: context
    words: [w-incident]
    word: incident
    ko: 사건
    scenes:
      - {who: 순환 간호사 → 수간호사, icon: speech, en: "We need to file an incident report immediately.", ok: true}
      - {who: 보고 기록, icon: board, en: "Incident report filed; surgeon and charge nurse notified.", ok: true}
      - {who: 회복실의 환자에게, icon: me, en: "There was an incident during your surgery.", ok: false, fix: "The surgeon will talk with you about what we found."}
    why: "incident report는 병원 안전 보고 체계의 용어예요. 환자에게 'incident'라고만 하면 막연히 겁을 주니, 집도의가 직접 자세히 설명할 것이라고 전해요."
계수 불일치 은폐 압력:
  - kind: slider
    words: [w-skip, w-run, w-late]
    cue: "The surgeon says, \"We're late — just sign it off.\" The discrepancy hasn't been resolved."
    scale: [I'd rather not skip this, I shouldn't skip this, I won't skip this]
    answerAt: 2
    why: "해결되지 않은 불일치 앞에서는 완곡하게 돌려 말하기보다 분명하게 거절해야 해요. 일정 압박이 있어도 환자 안전이 우선이에요."
    example: "I understand we're running late, but I won't skip this."
    exKo: "늦어지는 건 알지만 이건 건너뛰지 않을게요."
  - kind: swap
    words: [w-fix, w-close, w-safe]
    who: "순환 간호사 → 집도의 · 서두르라는 압박에"
    icon: speech
    before: ["Let's ", "let it go", " so we can close safely."]
    options: [fix it now, hurry it along, let it go]
    answer: fix it now
    notes: {fix it now: "닫기 전에 불일치를 바로잡아야 환자에게 이물이 남지 않는다.", hurry it along: "서두르면 불일치가 해결되지 않은 채 닫힐 수 있다.", let it go: "불일치를 방치하는 말이다."}
    why: "불일치는 닫기 전에 바로잡아야 해요. 서두르거나 그냥 두면 환자 안전을 해칠 수 있어요."
    ko: "안전하게 닫을 수 있게 지금 바로잡아요"
