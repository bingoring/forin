nuance:   # slider 정답이 가장 짧은/긴 보기에 몰리지 않게 보기 길이를 섞음(A N11). 키는 상황.nuance번호
  '0.0': {scale: ['Basic setup open, more coming', Almost everything is ready now, Everything is ready right now]}
