  - ["언어 질문", speech, "What language로 묻고 at home을 붙이면 병원이 아니라 가장 편한 일상 언어를 끌어내요. 의문문이라 do you speak 순서로 써요.", "Which country", "집에서는 어떤 음식을 드세요?", "집에서는 어떤 약을 쓰세요?", "speak", "read", "write", "study"]
