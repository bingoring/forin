  - ["다시 말하기", speech, "'what this means'는 방금 들은 내용의 뜻을 묻는 절이에요. 'in your own words'를 붙이면 따라 읽기가 아니라 자기 말로 풀어 보게 돼요.", "where this hurts", "이게 무슨 뜻인지 말씀해 주시려고 먼저 숨을 쉬세요.", "이게 무슨 뜻인지 아시는지 알고 싶어서 물어요.", "words", "hands", "eyes", "notes"]
  - ["복창 요청", redo, "A nod isn't enough로 끄덕임이 이해의 증거가 아니라고 먼저 말하고, I need you to로 해야 할 일을 직접 요청해요. 비난 없이 이유와 요청을 한 문장에 묶어요.", "to rewrite it", "고개만 끄덕이시는 걸로는 부족해요 — 직접 다시 설명하려고 잠깐 쉬어 주세요.", "고개만 끄덕이시는 걸로는 부족해요 — 이해하셨는지 확인하려는 거예요.", "explain", "draw", "copy", "shout"]
