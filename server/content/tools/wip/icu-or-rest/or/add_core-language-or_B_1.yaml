  - ["차트 사용", board, "Show me on this chart로 도구와 행동을 한 번에 알려요. which number는 여러 숫자 중 하나를 고르게 하는 의문사 구문이에요.", "which doctor", "이 차트에서 어제 느끼셨던 것과 맞는 숫자를 보여주세요.", "이 차트에서 가장 아팠던 때와 맞는 숫자를 보여주세요.", "matches", "changes", "controls", "hides"]
