  - ["금식 설명", shield, "'nothing at all'로 범위를 최대로 넓히고, ', even water'로 사람들이 예외로 여기기 쉬운 물까지 짚어요. 'means'로 앞 표현의 뜻을 풀어 줘요.", ", even talking", "먹지도 마시지도 말라는 건 껌도 사탕도 안 된다는 뜻이에요.", "먹지도 마시지도 말라는 건 자정부터 그렇다는 뜻이에요.", "eat", "cook", "buy", "order"]
  - ["복창 요청", redo, "Tell me back은 들은 내용을 환자 입으로 다시 말하게 하는 표현이에요. 시각은 외우기 쉬운 값이라 말로 확인해야 어긋나지 않아요.", "what food", "다시 말씀하시려고 메모지부터 챙기세요.", "몇 시부터 금식해야 하는지 궁금해서 여쭤보는 거예요.", "eating", "walking", "working", "sleeping"]
