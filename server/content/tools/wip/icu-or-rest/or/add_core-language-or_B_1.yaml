  - ["기억 안내", bulb, "Once는 '일단 ~하고 나면'이라는 시점을 열어서 그 뒤에 일어날 일을 안내해요. any of this는 이 대화와 준비 전체를 가리켜요.", "the lights", "잠드시고 나면 이 순간을 전혀 느끼지 못하실 거예요.", "잠드시고 나면 이 방을 전혀 기억 못 하실 거예요.", "remember", "regret", "repeat", "resist"]
  - ["안심 설명", shield, "watch over you는 눈을 떼지 않고 돌본다는 뜻이고, the entire time이 한순간도 비지 않는다는 보증을 줘요. 팀이 주어라 한 사람에게 달리지 않아요.", "will talk to you", "마취팀이 내내 곁에서 이야기해 드릴 거예요.", "마취팀이 내내 문 앞에서 지켜봐 드릴 거예요.", "entire", "first", "last", "next"]
