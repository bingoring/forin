    ko: 절제 범위를 넓히게 됐어요—준비해요.
  "16.1":
    old: Let's stop and search the field and containers.
    ko: 멈추고 수술 시야와 용기들을 샅샅이 찾아봐요.
    tag: 멈추고 찾기
    distractorsKo:
      - 수술 시야와 용기들을 찾을 조명부터 켜요.
      - 잃어버린 건 쓰레기통과 린넨에서 자주 나와요.
    shape: [P, F]
  "2.1":
    old: The lab wants it fresh for this test.
    ko: 이 검사는 검사실에서 신선한 상태로 받기를 원해요.
    distractorsKo:
      - 이 검사는 집도의가 신선한 상태로 받기를 원해요.
      - 이 수술은 검사실에서 신선한 상태로 받기를 원해요.
    shape: [D, D]
  # ----- B 몫 보정: 둘 다 사실이던 문장의 한쪽을 같은 틀로 -----
  "4.0":
    old: This is for frozen section—no fixative.
    distractorsKo:
      - 고정액에 담그면 얼려 자를 수 없어요.
      - 이 셋은 냉동절편용이라 고정액은 안 씁니다.
    shape: [F, D]
  "4.4":
    old: No fixative goes on a frozen specimen.
    distractorsKo:
      - 고정액은 조직을 굳게 만들어요.
      - 냉동 검체 넷에는 고정액을 쓰지 않아요.
    shape: [F, D]
  "18.0":
    old: This sample touched a non-sterile surface.
    distractorsKo:
      - 무균이 아닌 표면에 닿은 검체는 배양이 틀어져요.
      - 이 검체가 무균이 아닌 장갑에 닿았어요.
    shape: [F, D]
  "19.0":
    old: This label belongs to another patient.
    distractorsKo:
      - 다른 환자 라벨은 오진으로 이어져요.
      - 이 라벨은 다른 병동 것이에요.
    shape: [F, D]

  "3.2":
    old: I'll log the time and your name.
    distractorsKo:
      - 기록할 시각을 시계에서 확인해요.
      - 그 기록으로 추적해요.
  "10.2":
    old: I'll document the margins on the requisition.
    distractorsKo:
      - 요청서에 문서화할 칸을 펼게요.
      - 요청서는 병리과로 같이 가는 서류예요.

  "16.2":
    old: I'm reporting this to the surgeon and pathology now.
    distractorsKo:
      - 병리과는 받은 것을 기록으로 대조해요.
      - 보고하고 나서 바로 같이 찾아볼게요.
  "16.4":
    old: Let's report the missing specimen right away.
    distractorsKo:
      - 보고한 뒤 찾는 범위를 넓혀요.
      - 늦으면 찾기 힘들어져요.

