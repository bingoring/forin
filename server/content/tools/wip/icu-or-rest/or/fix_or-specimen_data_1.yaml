    words_remove: [w-fresh]
  "18.4":
    old: Let's collect a fresh sample with a new kit.
    ko: 새 키트로 새 검체를 다시 채취해요.
    words_remove: [w-fresh]
    distractorsKo:
      - 새 키트로 채취할 땐 장갑도 새로 껴요.
