# 문장 수정 데이터 — 키 "상황.문장"(0부터). old = 고치기 전 en(검증용). 있는 필드만 덮어쓴다.
# blank는 answer + wrong 3개(자리는 스크립트가 en 해시로 정한다). shape는 오답 모양 표시(F 참인 사실 · A 행동 같은 틀 · D 해 없는 세부 · P 앞 단계(정답 동사 종속절)).
sentences:
  "2.3":   # S1 보존액 단정 -> 요청서 근거
    old: This specimen goes straight into formalin.
    en: Per the requisition, this specimen goes into formalin.
    ko: 요청서대로 이 검체는 포르말린에 넣어요.
    chunks: [Per the requisition, ", this specimen", goes into formalin, .]
    words: [w-requisition, w-specimen, w-formalin]
    tag: 요청서 기준
    icon: board
    why: Per the requisition,으로 근거를 문장 앞에 먼저 밝혀요. 보존액은 짐작이 아니라 요청서가 정한 대로 고른다는 순서가 들려요.
    decoy: Per the invoice
    distractorsKo:
      - 포르말린에 넣을 검체의 라벨을 확인해요.
      - 포르말린에 넣기 전에 요청서를 읽어요.
    shape: [P, P]
    blank: {answer: specimen, wrong: [glove, marker, pencil]}
  "12.4":  # S2 보존액 단정 -> 지침 근거
    old: This specimen goes on ice, not in formalin.
    en: Per the protocol, this specimen goes on ice, not in formalin.
    ko: 지침대로 이 검체는 포르말린이 아니라 얼음에 놓아요.
    chunks: [Per the protocol, ", this specimen goes", on ice, ", not in formalin", .]
    words: [w-protocol, w-specimen, w-ice, w-formalin]
    tag: 지침 기준
    icon: lab
    why: Per the protocol,로 근거를 앞에 두고, not in formalin으로 하지 않을 일을 대비해 말해요. 보존 방법은 검사실 지침이 정해요.
    decoy: Per the memo
    distractorsKo:
      - 포르말린에 넣으면 이 검사를 할 수 없게 돼요.
      - 지침대로 얼음에 놓을 것을 장갑 낀 손으로 들어요.
    shape: [F, P]
    blank: {answer: formalin, wrong: [saline, alcohol, water]}
  "4.5":   # S3 결과 전달 -> 연결
    old: I'll tell the surgeon as soon as I hear back.
    en: When pathology calls, I'll put them through to the surgeon.
    ko: 병리과에서 전화가 오면 집도의에게 바로 연결할게요.
    chunks: [When pathology calls, ", I'll", put them through, to the surgeon, .]
    words: [w-pathology, w-surgeon]
    tag: 결과 연결
    icon: pager
    why: When…으로 전화가 오는 때를 먼저 잡고, put them through로 결과를 말하는 사람과 듣는 집도의를 직접 이어 줘요. 간호사는 결과를 대신 전하지 않아요.
    decoy: When the nurse calls
    distractorsKo:
      - 집도의에게 연결할 병리과 번호를 적어 둘게요.
      - 병리과에서 오는 전화는 수술방 전화기로 와요.
    shape: [P, F]
    blank: {answer: surgeon, wrong: [pharmacist, porter, janitor]}
  "6.5":   # S4 고친 뒤 확인 -> 고치기 전에 어느 쪽이 틀렸는지
    old: I'll correct the name and confirm it again.
    en: Let's confirm which one is wrong before we fix it.
    ko: 고치기 전에 어느 쪽이 틀렸는지 확인해요.
    chunks: [Let's confirm, which one is wrong, before, we fix it, .]
    words: [w-confirm, w-fix]
    tag: 고치기 전 확인
    icon: magnify
    why: before we fix it으로 순서를 못 박아요. 어느 쪽이 틀렸는지 알아야 맞는 쪽으로 고칠 수 있다는 이유가 담겨 있어요.
    decoy: which one is faded
    distractorsKo:
      - 어느 쪽이 틀렸는지 확인하기 전에 차트를 펼쳐요.
      - 틀린 쪽을 모르면 고쳐도 또 틀릴지 몰라요.
    shape: [P, F]
    blank: {answer: confirm, wrong: [print, stamp, price]}
  "7.4":   # S5 직접 운반 -> 옮겨 줄 사람
    old: I'll carry it to the lab myself.
    en: I'll find someone to carry it to the lab now.
    ko: 지금 검사실로 옮겨 줄 사람을 찾을게요.
    chunks: [I'll find someone, to carry it, to the lab, now, .]
    words: [w-carry, w-lab]
    tag: 운반 부탁
    icon: pager
    why: find someone to carry it으로 수술 중에는 방을 비우지 않고 옮겨 줄 사람을 구해요. now를 끝에 붙여 서두른다는 느낌을 줘요.
    decoy: to stamp it
    distractorsKo:
      - 옮겨 줄 사람이 생겨야 제가 방을 지켜요.
      - 옮겨 줄 사람을 찾기 전에 이름을 읽어요.
    shape: [F, P]
    blank: {answer: carry, wrong: [fax, email, text]}
  "7.5":   # S6 결과 전달 요청 -> 병리과가 수술방으로 전화
    old: Let me know the result as soon as it's ready.
    en: Please have pathology call the room with the result.
    ko: 결과가 나오면 병리과에서 수술방으로 전화하도록 전해 주세요.
    chunks: [Please have, pathology, call the room, with the result, .]
    words: [w-pathology, w-result]
    tag: 결과 전달 요청
    icon: speech
    why: Please have…로 시키는 투가 아니라 부탁하는 투예요. call the room은 결과를 간호사가 아니라 수술방, 곧 집도의 쪽으로 곧장 보내 달라는 뜻이에요.
    decoy: with the menu
    distractorsKo:
      - 냉동절편 결과는 영구 절편보다 훨씬 일찍 나오는 편이에요.
      - 결과가 나오면 병리과에서 수술방으로 문자 보내도록 전해 주세요.
    shape: [F, D]
    blank: {answer: result, wrong: [slide, ticket, memo]}
  "14.5":  # S7 부위 불일치 혼자 정정 -> 함께 바로잡기
    old: I'll correct this discrepancy right now.
    en: Let's resolve this discrepancy before it goes.
    ko: 보내기 전에 이 불일치를 함께 바로잡아요.
    chunks: [Let's resolve, this discrepancy, before it goes, .]
    words: [w-discrepancy]
    tag: 함께 바로잡기
    icon: handshake2
    why: Let's…로 혼자가 아니라 함께 바로잡자고 제안해요. before it goes로 검체가 나가기 전이라는 기한을 붙여요.
    decoy: this invoice
    distractorsKo:
      - 바로잡을 불일치를 먼저 차트와 맞춰요.
      - 불일치를 그대로 두면 오진으로 이어져요.
    shape: [P, F]
    blank: {answer: resolve, wrong: [copy, rebill, retype]}
  "15.5":  # S8 환자 -> 무슨 검체인지
    old: I'll label it as soon as we identify the patient.
    en: I'll label it once the surgeon confirms what it is.
    ko: 집도의가 무엇인지 확인해 주면 라벨할게요.
    chunks: [I'll label it, once, the surgeon confirms, what it is, .]
    words: [w-surgeon, w-confirm]
    tag: 확인 후 라벨
    icon: pushpin
    why: once로 라벨을 붙이는 때를 집도의의 확인 뒤로 잡아요. what it is는 용기 안의 검체가 무엇인지를 가리켜요.
    decoy: I'll color it
    distractorsKo:
      - 라벨할 용기를 평평한 트레이 위에 올릴게요.
      - 라벨에는 이름과 생년월일이 들어가요.
    shape: [P, F]
    blank: {answer: surgeon, wrong: [receptionist, dietitian, auditor]}
  "16.5":  # S9 혼자 수색 -> 시야는 집도의, 용기는 간호사
    old: I'll search the field systematically before we panic.
    en: While you check the field, I'll search the containers.
    ko: 수술 시야를 확인해 주시는 동안 저는 용기들을 찾아볼게요.
    chunks: [While you check, the field, ", I'll search", the containers, .]
    words: [w-check, w-field, w-search, w-container]
    tag: 동시에 찾기
    icon: magnify
    why: While you…, I'll…로 두 사람이 동시에 나눠 찾는 모양이에요. 수술 시야는 집도의 쪽, 용기는 간호사 쪽을 맡아요.
    decoy: the lockers
    distractorsKo:
      - 수술 시야를 확인해 주시는 동안 저는 용기들을 찾을 조명을 켤게요.
      - 작은 조각은 흔히 수술포 주름과 거즈에 붙기 쉬워요.
    shape: [P, F]
    blank: {answer: field, wrong: [cafeteria, admissions, laundry]}
  "17.3":  # S10 출처 밝히기
    old: Let's tell the team the margins came back positive.
    en: Pathology told the surgeon the margins came back positive.
    ko: 병리과에서 집도의에게 절제연이 양성으로 나왔다고 알렸어요.
    chunks: [Pathology told, the surgeon, the margins, came back positive, .]
    words: [w-pathology, w-surgeon, w-margin, w-positive]
    tag: 결과 출처
    icon: faceWorried
    why: 주어를 Pathology로 먼저 세워 결과가 어디서 나왔는지 밝혀요. 간호사가 해석한 말이 아니라 병리과가 전한 사실이라는 점이 들려요.
    decoy: Pathology tagged
    distractorsKo:
      - 병리과는 절제연마다 따로 판독해서 결과를 정리해요.
      - 양성이면 집도의가 그 가장자리를 더 넓게 잘라 내요.
    shape: [F, F]
    blank: {answer: positive, wrong: [labeled, sealed, stapled]}
  "18.5":  # S11 닿았는지 확인 후 폐기 -> 버리기 전 보고
    old: I'll confirm the surface was touched before we discard it.
    en: I'll report it before we discard it.
    ko: 버리기 전에 보고할게요.
    chunks: [I'll report it, before, we discard it, .]
    words: [w-report, w-discard]
    tag: 버리기 전 보고
    icon: pager
    why: before we discard it으로 보고가 버리는 일보다 먼저라고 못 박아요. 버릴지 말지는 알린 뒤에 정해요.
    decoy: we bill it
    distractorsKo:
      - 버리면 되돌릴 길이 없어요.
      - 보고 전에 경위를 살펴요.
    shape: [F, P]
    blank: {answer: discard, wrong: [reprice, retype, reorder]}
  "19.5":  # S12 혼자 재라벨 -> 보고 후
    old: I'll verify identity again before we relabel it.
    en: I'll report this before we relabel it.
    ko: 다시 라벨하기 전에 이 일을 보고할게요.
    chunks: [I'll report this, before, we relabel it, .]
    words: [w-report]
    tag: 재라벨 전 보고
    icon: pager
    why: before we relabel it으로 보고가 재라벨보다 앞선다고 못 박아요. this는 방금 발견한 라벨 오류를 가리켜요.
    decoy: this menu
    distractorsKo:
      - 라벨을 다시 붙일 때도 기록이 남아요.
      - 보고하기 전에 이 일의 경위를 살필게요.
    shape: [F, P]
    blank: {answer: relabel, wrong: [reschedule, rebill, reprice]}
  "20.5":  # S13 직접 들고 가기 -> 전화로 도착 확인
    old: I'll carry this to pathology and confirm it arrived safely.
    en: I'll call pathology to confirm it arrived safely.
    ko: 병리과에 전화해서 잘 도착했는지 확인할게요.
    chunks: [I'll call pathology, to confirm, it arrived safely, .]
    words: [w-pathology, w-confirm]
    tag: 도착 확인
    icon: pager
    why: to confirm으로 전화를 거는 목적을 밝혀요. 보낸 쪽이 잘 도착했는지 직접 확인해야 인계가 마무리돼요.
    decoy: it came off
    distractorsKo:
      - 병리과는 도착한 용기를 바로 접수해요.
      - 병리과에 문자 보내서 잘 도착했는지 확인할게요.
    shape: [F, D]
    blank: {answer: pathology, wrong: [radiology, dietary, security]}
