  "2.5":
    old: I'll call pathology if we're not sure.
    chunks: [I'll call, pathology, if we're not sure, .]
  "20.3":
    old: Let's not lose this specimen—it can't be replaced.
    chunks: [Let's not lose, this specimen—it, can't be replaced, .]
