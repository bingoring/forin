      - 작은 조각은 거즈 사이에 끼어 있기 쉬워요.
      - 용기를 다 찾아본 뒤에는 바닥도 살펴요.
    shape: [F, A]
  "9.5":
    old: Each container gets its own label right away.
    ko: 용기마다 바로 따로 라벨을 붙여요.
  "1.5":
    old: We confirm the specimen together before it leaves the room.
    ko: 검체가 수술방을 나가기 전에 함께 확인해요.
  "15.2":
    old: Let's identify it now with the surgeon.
    ko: 지금 집도의와 함께 이 검체를 식별해요.
    tag: 검체 식별
    distractorsKo:
