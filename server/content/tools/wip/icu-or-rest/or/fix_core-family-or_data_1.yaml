orders:
  2:
    tag: 대화 흐름
    icon: compass
    ko: 진행 상황 4문장 순서
    why: 수술실에 확인하고, 그 내용을 전한 뒤, 아는 것이 그게 전부라고 한정하고, 새 소식이 오면 다시 오겠다고 약속하는 순서예요. 'They said'·'Those'가 앞 줄을 가리켜요.
    lines:
    - en: I just checked in with the surgical team.
      icon: speech
      ko: 방금 수술팀에 확인했어요
      note: 확인
    - en: They said she's stable and the surgery is progressing.
      icon: monitor
      ko: 환자분은 안정적이고 수술도 진행 중이라고 하네요
      note: 전달
    - en: Those are the only details I have so far.
      icon: check
      ko: 지금까지 제가 아는 건 그게 전부예요
      note: 한정
    - en: I'll come back with anything new as soon as I hear it.
      icon: redo
      ko: 새 소식은 들으면 바로 와서 알려드릴게요
      note: 약속
  3:
    tag: 대화 흐름
    icon: compass
    ko: 통증 걱정 응대 4문장 순서
    why: 걱정을 인정하고, 그 걱정이 흔해 대비가 있음을 알리고, 그 계획을 구체적으로 말한 뒤, 더 물어도 된다고 여는 순서예요. 'That worry'·'That plan'이 앞 줄을 가리켜요.
    lines:
    - en: It's normal to worry about pain after surgery.
      icon: handshake2
      ko: 수술 후 통증을 걱정하는 건 자연스러운 일이에요
      note: 공감
    - en: That worry is very common, and we plan for it.
      icon: faceWorried
      ko: 그런 걱정은 아주 흔하고, 저희도 대비하고 있어요
      note: 인정
    - en: That plan includes closely managing his pain in recovery.
      icon: stetho
      ko: 그 계획에는 회복실에서 통증을 세심하게 관리하는 것도 있어요
      note: 계획
    - en: Please let us know if you have more questions.
      icon: speech
      ko: 더 궁금하신 게 있으면 말씀해 주세요
      note: 질문
  8:
    tag: 대화 흐름
    icon: compass
    ko: 불안 가족 지지 4문장 순서
    why: 느낌을 인정하고, 그 느낌을 혼자 견디지 않아도 된다며 곁에 있음을 알린 뒤, 곁에 있으니 함께 숨을 쉬자고 하고, 그다음 이야기 나눌지 묻는 순서예요. 'feel it'·'Since I'm right here'·'After that'이 앞 줄을 가리켜요.
    lines:
    - en: It's completely understandable to feel this way.
      icon: handshake2
      ko: 이렇게 느끼시는 건 충분히 이해돼요
      note: 인정
    - en: You don't have to feel it alone — I'm here with you.
      icon: handshake2
      ko: 그 마음을 혼자 견디지 않으셔도 돼요, 제가 함께 있어요
      note: 지지
    - en: Since I'm right here, let's take a breath together.
      icon: faceWorried
      ko: 제가 바로 여기 있으니 같이 숨을 쉬어봐요
      note: 제안
    - en: After that, would it help to sit down and talk?
      icon: handshake2
      ko: 그다음에 앉아서 이야기하면 도움이 될까요?
      note: 질문
  9:
    tag: 대화 흐름
    icon: compass
    ko: 정보 범위 소통 4문장 순서
    why: 말할 수 있는 것을 알리고, 말할 수 없는 부분의 한계를 밝힌 뒤, 그 질문은 집도의가 답한다고 잇고, 그분께 들으면 추측이 아닌 정확한 정보라고 맺는 순서예요. 'But'·'that question'·'From him'이 앞 줄을 가리켜요.
    lines:
    - en: I can share that he's stable and doing well.
      icon: speech
      ko: 안정적이고 잘 지내고 계신다는 건 말씀드릴 수 있어요
      note: 공유
    - en: But I'm not able to speak to the specifics right now.
      icon: lock
      ko: 하지만 지금은 구체적인 내용을 말씀드릴 수는 없어요
      note: 한계
    - en: The surgeon is the right person to answer that question.
      icon: stetho
      ko: 그 질문은 집도의 선생님이 답하시는 게 맞아요
      note: 연결
    - en: From him, you'll get accurate information, not guesses.
      icon: shield
      ko: 집도의 선생님께 들으시면 추측이 아닌 정확한 정보예요
      note: 이유
  10:
    tag: 대화 흐름
    icon: compass
    ko: 다국어 가족 소통 4문장 순서
    why: 상태를 먼저 전하고, 그 이상은 통역사를 통해 전하겠다고 한 뒤, 통역사가 할 일을 알리고, 그래도 모르면 말해 달라고 청하는 순서예요. 'more than that'·'They'·'any of it still'이 앞 줄을 가리켜요.
    lines:
    - en: Your son is doing well and he's stable.
      icon: monitor
      ko: 아드님은 잘 지내고 안정적이에요
      note: 상태
    - en: To tell you more than that, let me get an interpreter.
      icon: speech
      ko: 그 이상 말씀드리려면 통역사를 불러올게요
      note: 제안
    - en: They can explain everything in your language.
      icon: speech
      ko: 통역사가 모든 걸 어머님 언어로 설명해요
      note: 안내
    - en: If any of it still isn't clear, please tell me.
      icon: bell
      ko: 그래도 명확하지 않은 게 있으면 말씀해 주세요
      note: 확인
  11:
    tag: 대화 흐름
    icon: compass
    ko: 소아 보호자 소통 4문장 순서
    why: 아이를 잘 맡았다고 안심시키고, 그 근거로 소아 전문 팀을 들고, 그 팀 간호사가 곁에서 지켜본다고 알린 뒤, 회복실에서 직접 보게 해 주겠다고 맺는 순서예요. 'That's because'·'their'가 앞 줄을 가리켜요.
    lines:
    - en: Your daughter is in very good hands.
      icon: shield
      ko: 따님은 아주 잘 돌봐드리고 있어요
      note: 안심
    - en: That's because the pediatric team specializes in caring for children.
      icon: baby
      ko: 소아과 팀이 아이들을 돌보는 데 전문이라서 그래요
      note: 근거
    - en: One of their nurses will watch her closely the whole time.
      icon: stetho
      ko: 그 팀 간호사가 내내 세심하게 지켜볼 거예요
      note: 관찰
    - en: As soon as she's in recovery, I'll bring you to her to see for yourself.
      icon: baby
      ko: 회복실에 오면 바로 모셔가서 직접 보실 수 있게 할게요
      note: 약속
  12:
    tag: 대화 흐름
    icon: compass
    ko: 면회 규정 4문장 순서
    why: 규정을 이유와 함께 알리고, 그 규정의 효과를 설명한 뒤, 교대 방법을 안내하고, 교대를 위해 누가 먼저 들어갈지 가족이 정하게 맡기는 순서예요. 'That rule'·'For that'이 앞 줄을 가리켜요.
    lines:
    - en: We keep recovery calm, so it's one visitor at a time.
      icon: lock
      ko: 회복실을 차분하게 유지하려고 한 번에 한 분이에요
      note: 규정
    - en: That rule helps us monitor her closely and safely.
      icon: monitor
      ko: 그 규정 덕분에 더 세심하고 안전하게 지켜볼 수 있어요
      note: 이유
    - en: You can switch out so everyone gets to see her.
      icon: handshake2
      ko: 교대로 들어가시면 다들 뵐 수 있어요
      note: 방법
    - en: For that, please decide together who goes in first.
      icon: handshake2
      ko: 그러려면 누가 먼저 들어가실지 함께 정해주세요
      note: 맡김
  13:
    tag: 대화 흐름
    icon: compass
    ko: 추가 시술 결정 4문장 순서
    why: 무엇을 발견했는지 알리고, 계획이 바뀌어도 안정적이라고 전한 뒤, 집도의가 직접 와서 이야기한다고 잇고, 그때 질문이 다 답변되도록 챙기겠다고 맺는 순서예요. 'This'·'then'이 앞 줄을 가리켜요.
    lines:
    - en: They found something that needs to be addressed now.
      icon: speech
      ko: 지금 바로 처리해야 할 걸 발견했어요
      note: 알림
    - en: This changes the plan a little, but she's still stable.
      icon: shield
      ko: 계획이 조금 바뀌었지만 여전히 안정적이세요
      note: 상태
    - en: The surgeon will come speak with you as soon as possible.
      icon: stetho
      ko: 집도의 선생님이 가능한 한 빨리 와서 말씀 나눌 거예요
      note: 면담
    - en: I'll make sure all of your questions get answered then.
      icon: bell
      ko: 그때 궁금하신 것들이 다 답변되도록 챙길게요
      note: 약속
  15:
    tag: 대화 흐름
    icon: compass
    ko: 술중 합병증 4문장 순서
    why: 합병증이 있었다는 사실을 먼저 알리고, 팀이 대응 중이고 안정적이라는 현재를 전한 뒤, 그 두 가지를 설명할 사람을 알리고, 곁에 있겠다고 약속하는 순서예요. 'it'·'both of those'·'until then'이 앞 줄을 가리켜요.
    lines:
    - en: There was a complication during the surgery.
      icon: bell
      ko: 수술 중에 합병증이 하나 있었어요
      note: 사실
    - en: The team is managing it, and she's stable right now.
      icon: monitor
      ko: 팀이 대응하고 있고 지금은 안정적이세요
      note: 현황
    - en: The surgeon will explain both of those in detail.
      icon: stetho
      ko: 집도의 선생님이 그 두 가지를 자세히 설명해드릴 거예요
      note: 연결
    - en: I know that's hard news, and I'll stay with you until then.
      icon: handshake2
      ko: 힘든 소식이라는 거 알아요, 그때까지 함께 있을게요
      note: 지지
  16:
    tag: 대화 흐름
    icon: compass
    ko: 나쁜 소식 전달 4문장 순서
    why: 앉자고 청하며 예고하고, 그 소식을 쉽게 말할 방법이 없으니 바로 말하겠다고 한 뒤, 무슨 일이 있었는지 솔직히 말하고, 그 뒤에 시간을 가지라며 곁에 있겠다고 맺는 순서예요. 'it'·'Being direct'·'Afterward'가 앞 줄을 가리켜요.
    lines:
    - en: Let's sit down together — I have some difficult news.
      icon: faceWorried
      ko: 함께 앉아요, 힘든 소식이 있어요
      note: 예고
    - en: There's no easy way to say it, so I'll be direct.
      icon: faceWorried
      ko: 쉽게 말씀드릴 방법이 없어서 바로 말씀드릴게요
      note: 인정
    - en: Being direct means telling you honestly what happened.
      icon: speech
      ko: 바로 말씀드린다는 건 무슨 일이 있었는지 솔직히 말씀드린다는 거예요
      note: 솔직
    - en: Afterward, take whatever time you need — I'm right here.
      icon: handshake2
      ko: 그 뒤에 필요한 만큼 시간을 가지세요, 제가 여기 있어요
      note: 곁
  17:
    tag: 대화 흐름
    icon: compass
    ko: 사망 소식 지원 4문장 순서
    why: 애도를 먼저 전하고, 그 말로는 부족하다고 인정한 뒤, 시간을 가지라고 하고, 때가 되면 다음 일을 이야기하자고 맺는 순서예요. 'Those words'·'Whenever that is'가 앞 줄을 가리켜요.
    lines:
    - en: I'm so deeply sorry for your loss.
      icon: handshake2
      ko: 깊은 애도의 마음을 전합니다
      note: 애도
    - en: Those words feel too small for a loss like this.
      icon: faceWorried
      ko: 그 말로는 이런 상실에 턱없이 부족하네요
      note: 인정
    - en: Take all the time you need — I'm here with you.
      icon: handshake2
      ko: 필요한 만큼 시간을 가지세요, 제가 곁에 있을게요
      note: 곁
    - en: Whenever that is, we can talk about what comes next.
      icon: compass
      ko: 그때가 언제든 다음에 무엇을 할지 이야기해요
      note: 다음
  19:
    tag: 대화 흐름
    icon: compass
    ko: 응급 상황 소통 4문장 순서
    why: 상태가 바뀌었음을 알리고, 팀을 도우러 들어가야 한다고 말한 뒤, 그동안 이 자리에 있어 달라고 청하고, 그래야 소식을 들고 찾아올 수 있다고 맺는 순서예요. 'them'·'While I'm gone'·'That way'가 앞 줄을 가리켜요.
    lines:
    - en: Her condition changed, and the team is acting fast.
      icon: siren
      ko: 환자분 상태가 바뀌어서 팀이 빠르게 움직이고 있어요
      note: 알림
    - en: I need to go back in to help them.
      icon: redo
      ko: 들어가서 팀을 도와야 해요
      note: 이유
    - en: While I'm gone, please stay right here.
      icon: pushpin
      ko: 제가 없는 동안 바로 여기 계세요
      note: 안내
    - en: That way, someone can find you with any update.
      icon: bell
      ko: 그래야 누군가 소식을 들고 찾아올 수 있어요
      note: 약속
  20:
    tag: 대화 흐름
    icon: compass
    ko: 위기 중 가족 결정 4문장 순서
    why: 선택지를 설명하고, 그것을 염두에 두고 환자의 뜻을 떠올리게 하고, 어떤 결정이든 지지하겠다고 약속한 뒤, 결정하실 때까지 질문을 환영하며 맺는 순서예요. 'those'·'Until then'이 앞 줄을 가리켜요.
    lines:
    - en: Let me explain the options as clearly as I can.
      icon: board
      ko: 선택지를 최대한 명확하게 설명해드릴게요
      note: 설명
    - en: With those in mind, think about what he would have wanted.
      icon: compass
      ko: 그걸 염두에 두고 환자분이 원하셨을 걸 생각해보세요
      note: 기준
    - en: Whatever you decide, we'll support you fully.
      icon: handshake2
      ko: 무엇을 결정하시든 저희가 온전히 지지할게요
      note: 지지
    - en: Until then, take your time, and ask me anything you need.
      icon: speech
      ko: 그때까지 천천히 생각하시고, 필요한 건 뭐든 물어보세요
      note: 질문
