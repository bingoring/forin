# [tag, icon, why, decoy, ko1, ko2, ans, w1, w2, w3]
situations:
- title: 계수 방해 응급 상황
  s:
  - ["계수 재개", redo, "'Once'는 조건이 끝나는 순간을 가리켜 안정된 뒤에 재개한다는 뜻이에요. 'a known point'는 확실히 맞는 지점을 뜻해요.", "a quiet room", "상황이 진정되면 확실한 지점부터 청소를 다시 시작해요.", "상황이 진정되면 확실한 지점부터 수술을 다시 시작해요.", "known", "random", "rough", "old"]
  - ["재계수", redo, "'Let's'로 같이 다시 하자고 제안하고, 'recount'의 're-'로 이미 센 것을 다시 센다는 뜻이 돼요. 'to be safe'는 이유를 짧게 붙인 표현이에요.", "to be polite", "안전하게 전부 다시 놔요.", "안전하게 전부 다시 포장해요.", "safe", "quick", "kind", "fair"]
  - ["중단 기록", pencil, "'document that …'은 that 절로 기록할 사실을 말해요. 'was interrupted'는 중단된 사실을 수동태로 남겨 누구 탓인지는 말하지 않아요.", "the power", "회의가 중단됐다는 것을 문서화할게요.", "통화가 중단됐다는 것을 문서화할게요.", "interrupted", "repeated", "approved", "ordered"]
  - ["중단 설명", siren, "'stopped our count'에서 응급 상황이 주어라 누구 탓도 아닌 사건이 원인임을 말해요. 'halfway through'는 절반쯤 진행된 지점을 가리켜요.", "all night long", "응급 상황 때문에 계수가 처음에 멈췄어요.", "응급 상황 때문에 계수가 두 번 멈췄어요.", "stopped", "started", "finished", "ordered"]
  - ["이어서 계수", redo, "'pick up'은 구동사로 하던 일을 다시 이어 간다는 뜻이에요. 'exactly where we left off'는 멈춘 바로 그 지점을 가리켜요.", "slowly", "멈췄던 지점부터 빠르게 다시 시작해요.", "멈췄던 지점부터 차분히 다시 시작해요.", "exactly", "loosely", "vaguely", "partly"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 계수 방해 응급 상황 4문장 순서
    why: 응급 상황이 계수를 멈췄다고 알리고, 중단을 기록하고, 안정되면 확실한 지점부터 재개하고, 멈춘 바로 그 지점부터 이어 가요.
    lines:
    - ["The emergency stopped our count halfway through.", siren, "응급 상황 때문에 계수가 중간에 멈췄어요", "중단"]
    - ["I'll document that, so the record shows the interruption.", pencil, "그걸 문서화해서 기록에 중단이 남게 할게요", "기록"]
