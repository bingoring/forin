"체크리스트 항목 순차 점검":
  - kind: slider
    words: [w-routine, w-check]
    cue: "Anxious patient: 'Why are you asking me all of this again? Is something wrong?'"
    scale: ["It's routine — we ask everyone.", "It's an important safety step.", "It's critical, so answer exactly."]
    answerAt: 0
    why: "불안한 환자에게는 '모든 환자에게 늘 하는 일'이라고 담담히 말하는 게 사실이고 안심도 돼요. 'critical'은 과장이라 오히려 겁을 주고, 안전 확인이라는 설명은 맞지만 불안한 환자에게는 무겁게 들려요."
    example: "We ask every patient the same questions."
    exKo: "모든 환자분께 같은 질문을 드려요."
  - kind: swap
    words: [w-confirm, w-explain]
    who: "간호사 → 환자 · 점검 시작"
    icon: me
    before: ["Hi, I'm going to confirm a few things before surgery — ", "so you don't forget anything important", ". I'll explain each step as we go."]
    options: ["so you don't forget anything important", "it's the same list we use with every patient", "because mistakes happen here a lot"]
    answer: "it's the same list we use with every patient"
    notes:
      "so you don't forget anything important": "확인이 환자의 기억력 탓인 것처럼 들려요. 점검은 환자가 아니라 병원이 하는 안전 절차예요."
      "it's the same list we use with every patient": "모든 환자에게 같은 점검표를 쓴다고 말해 부담도 불안도 줄여 줘요."
      "because mistakes happen here a lot": "사실과 다르게 병원이 자주 틀리는 곳처럼 들려서 환자를 불안하게 해요."
    why: "수술 전 확인은 모든 환자에게 똑같이 하는 절차예요. 그렇게 말하면 환자가 의심받는다는 느낌 없이 협조해요."
    ko: "모든 환자분께 똑같이 쓰는 점검표예요"
"검사 결과 도착 확인":
  - kind: slider
    words: [w-pending, w-flag, w-potassium]
    cue: "It's 6 p.m. The potassium for tomorrow's 7 a.m. case isn't back yet."
    scale: ["Mention it at shift change.", "Flag it and follow up with the lab.", "Call the surgeon at home right now to report it."]
    answerAt: 1
    why: "아직 시간이 있는 누락 결과는 표시(flag)해 두고 검사실에 확인하는 게 알맞아요. 인계 때 말만 하면 놓칠 수 있고, 집도의 자택 전화는 시간 여유가 있을 때는 과해요."
    example: "I'll flag anything that's still pending."
    exKo: "아직 대기 중인 게 있으면 표시해 둘게요."
  - kind: context
    words: [w-pending]
    word: pending
    ko: 대기 중인
    scenes:
      - {who: 걱정하는 보호자에게, icon: speaker, en: "His labs are pending and nobody knows when they'll be back.", ok: false, fix: "We're still waiting on one lab result, and I'm following up on it right now."}
      - {who: 마취과 동료에게, icon: monitor, en: "Potassium is still pending — I've flagged it.", ok: true}
      - {who: 환자에게, icon: me, en: "One of your labs is still pending, and I'm following up with the lab.", ok: true}
    why: "pending은 의료진끼리나 환자에게 쓰는 평범한 말이에요. 하지만 걱정하는 보호자에게 '아무도 모른다'고 하면 방치처럼 들려요. 누가 언제까지 확인 중인지를 함께 말해야 안심해요."
"정맥로 개통 확인":
  - kind: slider
    words: [w-swell, w-burn, w-site]
    cue: "Patient: 'My arm is swelling and burning right at the IV, and it's getting worse.'"
    scale: ["Keep watching it and chart any changes.", "Slow the drip and recheck it a little later.", "Stop the infusion and assess the site now."]
    answerAt: 2
    why: "IV 부위가 붓고 화끈거리며 나빠지면 수액이 혈관 밖으로 새고 있을 수 있어요. 주입을 멈추고 부위를 바로 살핀 뒤 필요하면 보고해야 해요. 지켜보기만 하거나 속도만 줄이면 손상이 커질 수 있어요."
    example: "Let me know if you feel any burning at the site."
    exKo: "부위에 타는 듯한 느낌이 들면 말씀해 주세요."
  - kind: swap
    words: [w-feel, w-burn, w-site]
    who: "간호사 → 환자 · IV 확인"
    icon: me
    before: ["Let me know ", "if anything feels off", " at the IV site."]
    options: ["if anything feels off", "if it gets too painful to bear", "if you notice any burning or swelling"]
    answer: "if you notice any burning or swelling"
    notes:
      "if anything feels off": "막연해서 환자가 무엇을 알려야 하는지 몰라요."
      "if it gets too painful to bear": "참을 수 없을 때까지 기다리게 만들어 발견이 늦어져요."
      "if you notice any burning or swelling": "알려야 할 증상을 구체적으로 짚어 줘서 이른 발견에 도움이 돼요."
    why: "구체적인 증상(화끈거림·부기)을 말해 두면 환자가 일찍 알려 주고, 새는 수액도 빨리 잡을 수 있어요."
    ko: "IV 부위가 화끈거리거나 붓는 것 같으면 말씀해 주세요"
"장신구·의치 제거 확인":
  - kind: slider
    words: [w-metal, w-interfere, w-piercing]
    cue: "Patient: 'It's just a tiny piercing — it can't matter.'"
    scale: ["It's small, so it's probably fine.", "Even small metal can interfere, so it comes out.", "Any metal is deadly, so it must be cut off right away."]
    answerAt: 1
    why: "작은 금속도 수술 장비와 전기 소작에 영향을 줄 수 있어 빼는 게 원칙이에요. '괜찮다'고 하면 안전 절차를 흐리고, 치명적이라는 말은 과장이라 겁만 줘요."
    example: "We remove metal so it doesn't interfere with the equipment."
    exKo: "장비에 방해가 되지 않도록 금속은 제거해요."
  - kind: context
    words: [w-interfere]
    word: interfere
    ko: 방해하다
    scenes:
      - {who: 불안한 환자에게, icon: me, en: "Your piercing will interfere with the cautery and could burn you.", ok: false, fix: "Metal can get in the way of our equipment, so we take it off to keep you safe."}
      - {who: 환자에게 · 차분한 설명, icon: me, en: "Metal can interfere with the equipment, so we take it off before surgery.", ok: true}
      - {who: 수술팀 동료에게, icon: board, en: "Jewelry can interfere with the cautery, so it comes off.", ok: true}
    why: "동료에게는 소작기에 방해된다고 짧게 말하면 충분해요. 불안한 환자에게 '화상을 입는다'고 하면 사실이어도 겁이 나요. '장비에 방해가 되니 안전하게 빼 둔다'고 말하는 게 좋아요."
"방광 비움 확인":
  - kind: slider
    words: [w-empty, w-bladder, w-recently]
    cue: "Patient: 'I went right before I changed into the gown.'"
    scale: ["That's fine — I'll note it.", "Let's try once more to be safe.", "You must go again before we move."]
    answerAt: 0
    why: "방금 비웠다면 그렇게 기록하면 충분해요. 다시 가라고 하면 환자가 불필요하게 불편하고, 반드시라고 말하는 것은 사실과 달라요."
    example: "Have you emptied your bladder recently?"
    exKo: "최근에 방광을 비우셨나요?"
  - kind: swap
    words: [w-need, w-restroom]
    who: "간호사 → 환자 · 화장실 확인"
    icon: me
    before: ["Let me know if you ", "need to void", " before we head back."]
    options: ["need the restroom", "need to void", "are about to burst"]
    answer: "need the restroom"
    notes:
      "need the restroom": "환자가 알아듣기 쉬운 평범한 말이에요."
      "need to void": "의료진끼리 쓰는 말이라 환자는 무슨 뜻인지 헷갈릴 수 있어요."
      "are about to burst": "민망하게 들려 환자가 말하기 꺼려요."
    why: "환자에게는 'restroom'처럼 쉬운 말로 물어야 편하게 대답해요. 'void'는 차트용 임상어예요."
    ko: "들어가시기 전에 화장실이 필요하면 말씀해 주세요"
