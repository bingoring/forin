cues:
  w-wait: "대기실에 처음 들어온 가족에게 '이 자리에 계시면 된다'고 안내할 때"
  w-vary: "수술 시간을 묻는 가족에게 '정확히 장담은 못 하고 그때그때 다르다'고 단서를 달 때"
  w-moment: "약이 필요한 시점에 '그때 맞춰 바로'라고 짚어 약속할 때"
  w-call: "번호를 남긴 가족에게 '제가 직접 걸어서 알려 드릴게요'라고 연락 방법을 정해 줄 때"
  w-pager: "자리를 비우는 가족의 손에 쥐여 주는, 부르면 진동하는 작은 장치"
  w-system: "호출기를 어떻게 돌리는지, 병원이 갖춘 운영 방식을 가족에게 소개할 때"
  w-news: "수술실에서 나올 결과나 진행 상황 — 대기 가족이 제일 기다리고, 있으면 연락 드린다고 할 때"
  w-page: "진동하는 장치로 가족을 부르겠다고 연락 약속을 할 때"
  w-feel: "겁먹은 가족에게 '그렇게 느끼는 게 당연하다'고 감정을 짚어 줄 때"
  w-alone: "불안해 떠는 가족 곁에 앉으며 '혼자가 아니에요, 제가 여기 있어요'라고 할 때"
  w-accurate: "추측 말고 확인된 사실만 드리겠다고 가족에게 정보의 질을 약속할 때"
  w-person: "가족의 질문에 '그걸 답해 줄 맞는 상대는 집도의'라고 말할 때"
  w-specialize: "아이를 맡긴 보호자에게 '소아만 오래 본 팀'이라며 팀의 강점을 소개할 때"
  w-fast: "급변 상황에서 팀이 바삐 움직이는 속도를 가족에게 알릴 때"
  w-available: "원하는 가족에게 '원목님도 부르면 오실 수 있다'고 이용할 수 있음을 알릴 때"
  w-condition: "급변이 생겼을 때 '환자분이 지금 이렇다'고 현재 모습을 가족에게 전할 때"
  w-act: "변화가 생기자 팀이 곧바로 손을 쓰는 모습을 가족에게 설명할 때"
  w-return: "환자에게 가야 해서 자리를 뜨는 간호사가 '곧 다시 오겠다'고 약속할 때"
  w-until: "집도의가 올 때까지 곁에 있겠다며 그 약속의 끝 시점을 정해 줄 때"
  w-either: "이쪽이든 저쪽이든 우리는 곁에 있다며 어느 결정에도 같다고 할 때"
remove: [w-little, w-other, w-coffee]
