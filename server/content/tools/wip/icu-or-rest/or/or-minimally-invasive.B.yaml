    ko: 시야를 잃었습니다 — 필드가 피로 가득합니다.
    chunks:
    - We've lost
    - the view—the field
    - is full
    - of blood
    - .
    words:
    - w-lose
    - w-view
    - w-field
    - w-full
    - w-blood
    goal: 1
    tag: 시야 상실
    icon: siren
    why: We've lost로 이미 잃은 결과를 알리고, 대시 뒤에 이유를 이어 시야를 잃은 까닭이 출혈이라고 한 호흡에 전해요.
    decoy: of tape
    distractorsKo:
    - 시야를 잃으면 영상이 온통 붉게 보입니다.
    - 복강경 시야는 렌즈로만 확보합니다.
    blank:
      answer: lost
      options:
      - en: found
      - en: kept
      - en: moved
      - en: lost
  - en: Let's apply pressure and prepare to convert.
    ko: 압박을 가하고 전환을 준비합시다.
    chunks:
    - Let's apply pressure
    - and prepare
    - to convert
    - .
    words:
    - w-apply
    - w-pressure
    - w-prepare
    - w-convert
    goal: 2
    tag: 압박·전환 준비
    icon: bandage
    why: apply와 prepare 두 동사를 and로 이어 지혈과 전환 준비를 함께 말하고, to convert로 준비의 목적을 밝혀요.
    decoy: to document
    distractorsKo:
    - 압박을 가하기 앞서 장갑을 낍시다.
    - 전환 준비에는 기구가 필요합니다.
    blank:
      answer: convert
      options:
      - en: document
      - en: relocate
      - en: restart
      - en: convert
  - en: Suction and get more units in the room.
    ko: 흡인하고 방에 혈액 팩을 더 들여오세요.
    chunks:
    - Suction and get
    - more units
    - in the room
    - .
    words:
    - w-suction
    - w-unit
    - w-room
    goal: 2
    tag: 흡인·혈액
    icon: siren
    why: Suction을 동사로 써서 바로 시작하는 명령이고, units는 수혈용 혈액 팩 단위를 줄여 부르는 현장 말이에요.
    decoy: with a label
    distractorsKo:
    - 혈액 팩은 혈액은행에서 받아 옵니다.
    - 흡인은 시야를 가리는 피를 뺍니다.
    blank:
      answer: units
      options:
      - en: tools
      - en: gowns
      - en: units
      - en: masks
  - en: Let's get two more units on the way.
    ko: 혈액 팩 두 개를 더 오는 중으로 합시다.
    chunks:
    - Let's get
    - two more units
    - on the way
    - .
    words:
    - w-unit
    goal: 2
    tag: 혈액 추가
    icon: pill
    why: get A on the way는 A가 오는 중이 되게 한다는 틀이고, two more units로 지금 필요한 양을 숫자로 못 박아요.
    decoy: in the fridge
    distractorsKo:
    - 혈액 팩은 교차적합 뒤에 보냅니다.
    - 대량 출혈에는 혈액 팩이 계속 쓰입니다.
    blank:
      answer: way
      options:
      - en: floor
      - en: desk
      - en: wall
      - en: way
  - en: I'll pack the area and hold pressure.
    ko: 부위를 패킹하고 압박을 유지할게요.
    chunks:
    - I'll pack
    - the area
    - and hold pressure
    - .
    words:
    - w-pack
    - w-area
    - w-hold
    - w-pressure
    goal: 2
    tag: 패킹·압박
    icon: bandage
    why: pack과 hold 두 동사를 and로 이어 채워 넣고 눌러 유지하는 두 동작을 말해요. hold pressure는 계속 눌러 둔다는 뜻이에요.
    decoy: the bag
    distractorsKo:
    - 패킹은 거즈로 부위를 채웁니다.
    - 압박을 유지하면 출혈이 줄어듭니다.
    blank:
      answer: pack
      options:
      - en: pour
      - en: pack
      - en: paint
      - en: wash
  - en: We need the surgeon back at the table now.
    ko: 지금 집도의가 다시 테이블로 와야 합니다.
    chunks:
    - We need
    - the surgeon back
    - at the table
    - now
    - .
    words:
    - w-need
    - w-surgeon
    - w-table
    goal: 2
    tag: 집도의 호출
    icon: pager
    why: need A back은 A가 다시 와야 한다는 틀이고, at the table로 어디로 와야 하는지, now로 급하다는 시점을 붙여요.
    decoy: at the door
    distractorsKo:
    - 수술은 집도의가 이끄는 팀 작업입니다.
    - 위급 때는 집도의 판단이 우선입니다.
    blank:
      answer: table
      options:
      - en: desk
      - en: table
      - en: sink
      - en: scale
  order:
    tag: 대화 흐름
    icon: compass
    ko: 시야 상실 대량 출혈 4문장 순서
    why: 시야를 잃었다고 알리고, 그러니 집도의를 부르고, 그가 올 때를 대비해 압박하며 전환을 준비하고, 압박이 걸린 채로 흡인하며 혈액 팩을 더 들이는 순서예요. 각 줄이 앞 줄을 가리켜 순서가 하나로 정해져요.
    lines:
    - en: We've lost the view—the field is full of blood.
      icon: siren
      ko: 시야를 잃었어요 — 필드가 피로 가득해요
      note: 보고
    - en: With the view gone, we need the surgeon back at the table now.
      icon: pager
      ko: 시야가 없으니 집도의가 지금 와야 해요
      note: 호출
    - en: For when he's back, let's apply pressure and prepare to convert.
      icon: bandage
      ko: 그가 오면 대비해 압박하고 전환을 준비해요
      note: 준비
    - en: With pressure on, suction and get more units in the room.
      icon: siren
      ko: 압박한 채 흡인하고 혈액 팩을 더 들여요
      note: 흡인
