# 뉘앙스 (A N1~N13) — s=상황 번호, n=nuance 번호
nuance:
  - s: 19
    n: 0   # N1
    set:
      cue: "The surgeon announces damage control: pack the abdomen, close it temporarily, then go to the ICU. The temporary closure supplies are already open on the back table. What do you tell the room?"
      scale: ["I think there are closure supplies somewhere", "The temp closure supplies are open and ready", "Every closure supply we own is open now"]
      answerAt: 1
      why: 손상통제 전환은 집도의가 정하고, 순환간호사는 준비 상태를 있는 그대로 알려요. '어딘가 있을 것'은 찾느라 늦어지고, '있는 걸 다 열었다'는 쓰지 않을 멸균 물품을 버리게 되는 과장이에요.
  - s: 6
    n: 1   # N2
    set:
      who: 스크럽 간호사 → 집도의 · 랩패드 전달
  - s: 10
    n: 1   # N3
    set:
      who: 스크럽 간호사 → 집도의 · 가운 입히기
  - s: 4
    n: 1   # N4
    note_sub:
      "I'll skip the count since this is an emergency.": 계수를 건너뛰면 몸 안에 남은 것을 계수로 확인할 수 없어, 병원 정책에 따라 기록하고 영상으로 확인하는 절차에 기대야 한다.
    set:
      why: 병원 정책이 허락하는 한 응급에서도 시작 계수는 해요. 생략하면 병원 정책에 따라 그 사실을 기록하고 영상으로 확인하는 절차를 밟아요.
  - s: 19
    n: 1   # N5
    scene:
      2:
        fix: She's still very sick, so the surgeon covered her belly for now and will go back in later.
    set:
      why: 뜻은 셋 다 '임시 봉합'이에요. 팀과 기록에서는 짧은 임상어가 정확하지만, 가족에게 '패킹 상태로 임시 봉합'이라고 하면 무슨 말인지 몰라 불안해요. 배를 덮어 두고 나중에 다시 들어간다고 쉬운 말로 풀어 줘요.
  - s: 2
    n: 0   # N6
    scale_set: {0: "We don't have any spare canisters in here"}
  - s: 11
    n: 0   # N7
    set:
      scale: ["I'll just wait until you tell me what to do", "Tell me your priority and I'll set up for it", "I'll set up for the leg first, then the abdomen"]
      answerAt: 1
      why: 무엇을 먼저 할지는 집도의가 정해요. 손 놓고 기다리면 늦고, 혼자 순서를 정하면 집도의의 순서와 어긋나요. 우선순위를 물어 그에 맞춰 세팅해요.
  - s: 20
    n: 0   # N8
    scale_swap: [0, 1]
  - s: 8
    n: 0   # N9
    scale_swap: [1, 2]
  - s: 17
    n: 0   # N12
    set:
      cue: The neonatal team arrives and asks what is at the warmer. The bag-mask is checked at the warmer and suction is on at 80.
  - s: 3
    n: 0   # N12
    set:
      cue: The surgeon asks how we are on blood. There are units in the room's cooler, and the blood bank has told you more could arrive in a few minutes, but nothing has been sent yet. What do you tell the surgeon?
  - s: 20
    n: 1   # N13 (ko는 문장 ko 전파로도 바뀜)
    set:
      ko: 한 사람 한 사람에게 역할을 정해 줍시다.
  - s: 7
    n: 1
    set:
      ko: NICU팀은 방에 와 있나요?
