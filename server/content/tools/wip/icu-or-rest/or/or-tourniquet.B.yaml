    - w-arm
    - w-typically
    - w-use
    - w-set
    goal: 1
    tag: 조건부 설정
    icon: chartup
    why: For an arm으로 조건을 먼저 깔고 we typically로 항상은 아니라는 여지를 남겨요. 상황에 따라 값이 달라지는 설정이라 조건부터 말하는 순서예요.
    decoy: a louder setting
    distractorsKo:
    - 팔이면 매번 더 낮게 설정해요.
    - 팔이면 보통 더 낮게 저장해요.
    blank:
      answer: setting
      options:
      - en: setting
      - en: volume
      - en: brightness
      - en: speed
  - en: Let me confirm the pressure with you before inflation.
    ko: 올리기 전에 압력을 당신과 확인할게요.
    chunks:
    - Let me confirm
    - the pressure
    - with you
    - before inflation
    - .
    words:
    - w-confirm
    - w-pressure
    - w-before
    - w-inflation
    goal: 2
    tag: 압력 확인
    icon: check
    why: Let me …는 곧 하겠다고 미리 알리는 정중한 틀이에요. with you가 혼자가 아니라 같이 맞춰 본다는 점을 분명히 해요.
    decoy: with the label
    distractorsKo:
    - 올리기 전에 압력을 간호사와 확인할게요.
    - 올리기 전에 압력을 큰 소리로 확인할게요.
    blank:
      answer: inflation
      options:
      - en: inflation
      - en: discharge
      - en: transfer
      - en: extubation
  - en: We always calculate this before we inflate.
    ko: 올리기 전에 항상 이걸 계산해요.
    chunks:
    - We always calculate
    - this
    - before we inflate
    - .
    words:
    - w-always
    - w-calculate
    - w-before
    - w-inflate
    goal: 1
    tag: 사전 계산
    icon: chartup
    why: always를 동사 앞에 두면 예외 없는 습관으로 들려요. before we inflate로 계산이 올리기 앞에 온다는 순서를 못 박아요.
    decoy: the dose
    distractorsKo:
    - 올리기 전에 항상 이걸 소독해요.
    - 올리기 전에 항상 이걸 주문해요.
    blank:
      answer: calculate
      options:
      - en: calculate
      - en: sterilize
      - en: restock
      - en: relabel
  - en: This setting matches what we agreed on.
    ko: 이 설정값은 우리가 합의한 것과 일치해요.
    chunks:
    - This setting
    - matches
    - what we agreed on
    - .
    words:
    - w-set
    - w-match
    - w-agree
    goal: 2
    tag: 설정 일치
    icon: check
    why: matches 한 낱말로 대조 결과를 짧게 보고해요. what we agreed on은 '합의한 것'을 한 덩어리 명사처럼 만드는 관계절이에요.
    decoy: when we agreed
    distractorsKo:
    - 이 설정값은 우리가 주문한 것과 일치해요.
    - 이 알람값은 우리가 합의한 것과 일치해요.
    blank:
      answer: matches
      options:
      - en: matches
      - en: exceeds
      - en: contradicts
      - en: replaces
  order:
    tag: 대화 흐름
    icon: compass
    ko: 지혈대 압력 설정 4문장 순서
    why: 먼저 사지를 기준으로 압력을 정하고, 그 값이 팔에서는 보통 낮다는 점을 말한 뒤, 올리기 전에 그 설정을 같이 확인하고, 합의가 되면 올립니다.
    lines:
    - en: I'm setting the cuff pressure based on the limb.
      icon: gear
      ko: 사지를 기준으로 커프 압력을 설정해요
      note: 설정
    - en: For an arm, that usually means a lower setting.
      icon: chartup
      ko: 팔이면 보통 더 낮은 설정이에요
      note: 조건
    - en: Let me confirm that setting with you before inflation.
      icon: check
      ko: 올리기 전에 그 설정을 같이 확인할게요
      note: 확인
    - en: Now that we agree, we can inflate.
      icon: handshake2
      ko: 합의했으니 올릴 수 있어요
      note: 합의
