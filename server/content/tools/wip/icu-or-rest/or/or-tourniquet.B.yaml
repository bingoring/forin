situations:
- title: 지혈대 압력 설정
  sentences:
  - en: I'm setting the cuff pressure based on the limb occlusion pressure.
    ko: 사지압을 기준으로 커프 압력을 설정하고 있어요.
    chunks:
    - I'm setting
    - the cuff pressure
    - based on
    - the limb occlusion pressure
    - .
    words:
    - w-set
    - w-cuff
    - w-pressure
    - w-base
    - w-limb
    - w-occlusion
    goal: 1
    tag: 압력 설정
    icon: gear
    why: based on 뒤에 기준을 말해 압력이 임의로 정해지는 게 아니라 측정값에서 나온다는 점을 알려요. 진행형 I'm setting은 지금 하는 중이라는 뜻이에요.
    decoy: the cuff alarm
    distractorsKo:
    - 사지압을 기준으로 커프 경보를 설정하고 있어요.
    - 사지압을 기준으로 커프 크기를 설정하고 있어요.
    blank:
      answer: occlusion
      options:
      - en: occlusion
      - en: venous
      - en: atmospheric
      - en: hydrostatic
  - en: For an arm, we typically use a lower setting.
    ko: 팔이면 보통 더 낮게 설정해요.
    chunks:
    - For an arm
    - ', we typically'
    - use
    - a lower setting
    - .
