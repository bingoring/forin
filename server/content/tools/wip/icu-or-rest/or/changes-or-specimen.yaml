  why: 너무 쉬움 — 공통 쉬운 단어 목록(go); 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-add
  why: 너무 쉬움 — 너무 쉬움 — 목록 밖 판단(add); 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-call
  why: 너무 쉬움 — 너무 쉬움 — 목록 밖 판단(call); 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-next
  why: 너무 쉬움 — 너무 쉬움 — 목록 밖 판단(next); 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-open
  why: 너무 쉬움 — 너무 쉬움 — 목록 밖 판단(open); 어느 문장도 태그하지 않게 됐다
- kind: word-remove
  id: w-another
  why: 너무 쉬움 — 너무 쉬움 — 목록 밖 판단(another); 어느 문장도 태그하지 않게 됐다
- kind: word-add
  id: w-mixup
  why: 문장 3에 이미 있는 말 — 상황 단어 수(V3)를 채우고 가르칠 값이 있는 구
- kind: word-add
  id: w-figureout
  why: 문장 4에 이미 있는 구 — 상황 단어 수(V3)를 채움
- kind: word-add
  id: w-unlabeled
  why: 문장 1에 이미 있는 말 — 상황 단어 수(V3)를 채움
- kind: word
  id: w-hand
  fields:
  - en
  - ipa
  - ko
  why: 문장은 handing off(넘겨주다) — 단독 hand(손)는 뜻이 틀리고 공통 쉬운 단어
- kind: word
  id: w-way
  fields:
  - en
  - ipa
  - ko
  why: 문장은 on the way(가는 중) — 단독 way(길)는 뜻이 틀림
- kind: word
  id: w-label
  fields:
  - ko
  why: tag된 문장 대부분이 명사(on the label·this label) — 동사 문장은 태그를 뺌
- kind: word
  id: w-count
  fields:
  - ko
  why: tag된 문장 대부분이 명사(the count) — 동사(count the pieces) 문장은 태그를 뺌
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm·w-verify와 ko(확인하다)가 같아 정답이 둘 — check는 눈으로 살피는 쪽
- kind: word
  id: w-verify
  fields:
  - ko
  why: w-confirm·w-check와 ko(확인하다)가 같아 정답이 둘 — verify는 기록과 맞춰 보는 쪽
- kind: word
  id: w-identify
  fields:
  - ko
  why: w-confirm 등과 ko가 겹치지 않게 — identify는 누구 것인지 밝히는 일
- kind: word
  id: w-search
  fields:
  - ko
  why: 수색하다는 간호 현장에 어색 — search the field는 빠짐없이 찾아보는 일
- kind: word
  id: w-sample
  fields:
  - ko
  why: w-specimen(검체)과 ko가 같아 정답이 둘 — sample은 덜어 낸 시료
- kind: word
  id: w-fragment
  fields:
  - ko
  why: w-piece(조각)와 ko가 같아 정답이 둘 — fragment는 떨어져 나온 단편
- kind: word
  id: w-log
  fields:
  - ko
  why: w-record(기록하다)와 ko가 같아 정답이 둘 — log는 기록부(일지)에 올리는 일
- kind: word
  id: w-run
  fields:
  - ko
  why: run it to pathology는 '달리다'가 아니라 서둘러 가져가는 일
