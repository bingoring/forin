- title: 바늘 회수 확인
  s:
  - ["바늘 계수", pushpin, "'account for'는 단순히 세는 것을 넘어 어디 있는지 다 안다는 뜻이에요. 'every'로 하나라도 빠지면 안 된다는 점을 짚어요.", "we've ordered", "사용한 바늘을 전부 통에 넣어요.", "사용한 바늘을 전부 쟁반에 올려요.", "needle", "sponge", "towel", "gown"]
  - ["바늘 회수", pushpin, "'go back on'은 쓴 바늘이 정해진 자리로 돌아온다는 뜻이에요. 자석 위에 모아 두면 개수를 한눈에 세기 쉬워요.", "on the monitor", "바늘은 전부 보관을 위해 자석 위로 돌아가요.", "바늘은 전부 정리를 위해 자석 위로 돌아가요.", "magnet", "bench", "mat", "stand"]
  - ["하나씩 계수", check, "'each one'은 묶어서 어림하지 않고 하나하나 센다는 뜻이에요. 'before we move on'은 다음 단계 전에 끝내야 한다는 신호예요.", "each tray", "넘어가기 전에 하나씩 꺼내요.", "넘어가기 전에 하나씩 펴요.", "one", "pair", "set", "kit"]
  - ["바늘 반납", handshake2, "'as soon as'는 다 쓴 즉시라는 뜻이라 바늘이 손에 남지 않아요. 'Please hand me'는 직접 건네 달라는 정중한 요청이에요.", "the scissors", "다 쓰면 바로 가위를 건네줘요.", "다 쓰면 바로 실을 건네줘요.", "needle", "scissors", "clamp", "stapler"]
  - ["정확성", check, "'has to be'는 선택이 아닌 의무를 말해요. 'exact'는 대략이 아니라 하나도 틀리지 않는 값이라, 작은 바늘은 한 개 차이도 안전과 이어져요.", "ready", "바늘 계수는 간단해야 해요.", "바늘 계수는 깔끔해야 해요.", "exact", "quick", "simple", "cheap"]
  order:
