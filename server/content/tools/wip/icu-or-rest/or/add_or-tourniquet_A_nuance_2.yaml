커프 크기 선택:
  - kind: slider
    words: [w-loose, w-fit, w-tight]
    cue: "After the cuff is wrapped, it keeps sliding down the limb."
    scale: [It's too loose, It fits well, It's too tight]
    answerAt: 0
    why: "자꾸 흘러내리면 너무 느슨한 거예요. 커프는 흘러내리지 않으면서도 피부를 조이지 않는 상태로 맞춰야 해요. 'too tight'는 반대로 너무 꽉 조인 경우예요."
    example: "The cuff is too loose and keeps sliding down."
    exKo: "커프가 너무 느슨해서 계속 흘러내려요."
  - kind: swap
    words: [w-overlap, w-properly, w-tight]
    who: "순환 간호사 → 스크럽 · 커프 감기"
    icon: speech
    before: ["Please ", "just wrap it however it lands", " around the padded limb."]
    options: [wrap it so it overlaps properly, just wrap it however it lands, tighten it as much as you can]
    answer: wrap it so it overlaps properly
    notes: {wrap it so it overlaps properly: "커프 끝이 제대로 겹치도록 감아 달라는 말이다. 겹침이 맞아야 압력이 고르게 전달된다.", just wrap it however it lands: "겹침이 제각각이면 압력이 고르지 않고 흘러내릴 수 있다.", tighten it as much as you can: "최대한 조이면 피부와 조직이 눌려 손상될 수 있다."}
    why: "커프는 겹침이 제대로 맞게 감아요. 아무렇게나 감거나 있는 힘껏 조이는 것은 둘 다 안전하지 않아요."
    ko: "겹치도록 제대로 감아 주세요"
시간 알람 확인:
  - kind: slider
    words: [w-audible, w-reminder, w-alert]
    cue: "The OR is loud with suction and monitors, and the surgeon wants to be reminded before the time limit."
    scale: [A faint beep, A clearly audible reminder, A distracting siren]
    answerAt: 1
    why: "시끄러운 수술방에서도 들릴 만큼 분명한 소리 알림이 필요해요. 너무 약하면 묻히고, 너무 시끄러우면 수술에 방해가 돼요."
    example: "We'll get an audible reminder before the limit."
    exKo: "한계 전에 들리는 알림이 와요."
  - kind: swap
    words: [w-timer, w-run, w-alert, w-active]
    who: "순환 간호사 → 집도의 · 시작 전 타이머 확인"
    icon: speech
    before: ["Dr. Lee, ", "the timer might be on", " — shall we begin?"]
    options: [the timer is running and the alert is active, the timer might be on, the timer should be fine]
    answer: the timer is running and the alert is active
    notes: {the timer is running and the alert is active: "타이머가 돌고 알림이 켜졌다는 것을 확인한 대로 보고한다. 집도의가 믿고 시작할 근거가 된다.", the timer might be on: "'아마 켜졌다'는 확인하지 않았다는 말이다.", the timer should be fine: "'괜찮을 것'은 짐작이다. 시작 전에는 확인한 결과를 전한다."}
    why: "시작 전에는 '켜져 있을 것 같다'가 아니라 타이머가 돌고 알림이 켜져 있다는 확인된 사실을 말해요."
    ko: "타이머가 작동 중이고 알림이 켜져 있어요"
최대 허용 시간 관리:
  - kind: slider
    words: [w-approach, w-limit, w-close]
    cue: "The timer shows the limit is still a few minutes away — not here yet."
    scale: [We're approaching the limit, We're at the limit, We've passed the limit]
    answerAt: 0
    why: "한계가 아직 오지 않았으니 approaching이 맞아요. 그래도 이때 미리 알려야 집도의가 마무리 계획을 세울 수 있어요. at은 딱 도달했을 때, passed는 넘었을 때예요."
    example: "We're approaching the safe limit."
    exKo: "안전 한계에 다가가고 있어요."
  - kind: swap
    words: [w-safe, w-limit, w-surgeon]
    who: "순환 간호사 → 집도의 · 시간 한계"
    icon: speech
    before: ["Dr. Kim, ", "I'm deflating it now", "."]
    options: [we're approaching the safe time limit, FYI the cuff has been up a while, I'm deflating it now]
    answer: we're approaching the safe time limit
    notes: {we're approaching the safe time limit: "남은 시간을 분명히 알려 준다. 풀지 말지는 집도의가 판단한다.", FYI the cuff has been up a while: "'꽤 오래됐다'는 시간이 얼마나 남았는지 알 수 없는 말이다.", I'm deflating it now: "공기를 빼는 결정은 집도의 몫이다. 간호사가 알리지 않고 혼자 풀면 수술이 위험해진다."}
    why: "간호사는 시간 한계가 다가온다는 사실을 분명히 알리고, 풀지 말지는 집도의가 정해요."
    ko: "안전 시간 한계에 가까워지고 있어요"
재관류 전 팀 고지:
  - kind: slider
    words: [w-team, w-ready, w-release]
    cue: "The surgeon says, \"Let the team know I'll release the tourniquet in a moment.\""
    scale: [Whisper it to anesthesia, Tell the person next to you, Announce it so everyone hears]
    answerAt: 2
    why: "풀기 전에는 방 안 모두가 듣도록 알려야 마취과와 스크럽이 대비해요. 옆 사람에게만 말하면 나머지 팀은 모르고 있어요."
    example: "Everyone ready? I'm about to release it."
    exKo: "다들 준비됐나요? 곧 풀 거예요."
  - kind: swap
    words: [w-anesthesia, w-prepare, w-reperfusion, w-change]
    who: "순환 간호사 → 마취과 · 풀기 직전"
    icon: speech
    before: ["Anesthesia, ", "carry on", " — the tourniquet is about to come off."]
    options: [be prepared for reperfusion changes, carry on, don't worry about it]
    answer: be prepared for reperfusion changes
    notes: {be prepared for reperfusion changes: "풀리면 혈압 등이 변할 수 있으니 미리 대비하라고 알린다.", carry on: "알림 없이 하던 일을 계속하라는 말이라 대비할 틈이 없다.", don't worry about it: "대비가 필요한 순간에 안심시키는 말이라 위험하다."}
    why: "지혈대를 풀면 몸에 변화가 생길 수 있어서 마취과가 미리 대비해야 해요. '대비하세요'라고 분명히 알려요."
    ko: "마취과, 재관류 변화에 대비해 주세요"
