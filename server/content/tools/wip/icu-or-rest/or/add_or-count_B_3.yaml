# [tag, icon, why, decoy, ko1, ko2, ans, w1, w2, w3]
situations:
- title: 방사선 표지 거즈 확인
  s:
  - ["거즈 규칙", shield, "'Only'를 맨 앞에 두면 허용되는 것이 하나뿐이라는 규칙이 먼저 들려요. 'X-ray detectable'은 영상에 보이는 표지가 있다는 뜻이에요.", "this window", "X선으로 탐지 가능한 거즈만 카트에 올려요.", "X선으로 탐지 가능한 거즈만 탁자에 올려요.", "sponges", "towels", "gloves", "blades"]
  - ["표지 확인", magnify, "'Let me confirm'은 내가 직접 확인하겠다고 알리는 부드러운 선언이에요. 'radiopaque'는 X선에서 하얗게 보여 영상에서 찾을 수 있다는 뜻이에요.", "each pair", "상자마다 방사선 불투과 표지가 있는지 확인할게요.", "포장마다 방사선 불투과 표지가 있는지 확인할게요.", "radiopaque", "reusable", "fragile", "sterile"]
  - ["금지 규칙", shield, "'No'로 시작해 금지 규칙을 짧게 못 박아요. 'non-detectable'은 탐지되지 않는다는 뜻이라 몸 안에 남으면 영상으로 찾을 수 없어요.", "near the doorway", "젖은 거즈는 상처 근처에 두지 않아요.", "찢어진 거즈는 상처 근처에 두지 않아요.", "wound", "tray", "door", "chart"]
  - ["필수 조건", shield, "'must'는 'need to'보다 강한 필수 조건이에요. 'we use'는 사용하는 거즈 전체를 가리키는 관계절이에요.", "this lid", "사용하는 거즈는 전부 이 날짜가 있어야 해요.", "사용하는 거즈는 전부 이 서명이 있어야 해요.", "marker", "lid", "strap", "hook"]
  - ["즉시 제거", shield, "'right away'는 곧바로라는 뜻이라 미루지 않는다는 규칙이 돼요. 'without'은 '없이'라서 표지가 없는 거즈만 골라낸다는 뜻이에요.", "from the pack", "표지 없는 포장은 바로 빼요.", "표지 없는 상자는 바로 빼요.", "remove", "stow", "sort", "label"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 방사선 표지 거즈 4문장 순서
    why: 탐지되는 거즈만 쓴다는 규칙을 말하고, 표지를 하나씩 확인한 뒤, 표지 없는 것은 바로 빼고, 쓰는 거즈 전부에 표지가 있다고 마무리해요.
    lines:
    - ["Only X-ray detectable sponges go on this field.", shield, "X선으로 탐지 가능한 거즈만 필드에 올려요", "규칙"]
    - ["Let me confirm each one has the radiopaque marker.", magnify, "하나하나 방사선 불투과 표지가 있는지 확인할게요", "확인"]
    - ["If one doesn't, we remove it right away.", shield, "없는 게 있으면 바로 빼요", "제거"]
    - ["Now every sponge we use has that marker.", check, "이제 사용하는 거즈는 전부 그 표지가 있어요", "완료"]
- title: 기구 분해 부품 계수
  s:
  - ["부품 계수", scalpel, "'each component'로 기구 하나가 아니라 부품마다 센다는 뜻이에요. 분해되는 기구는 작은 부품이 빠져도 모르고 지나가기 쉬워요.", "of this schedule", "이 기구의 부품을 하나씩 펴요.", "이 기구의 부품을 하나씩 조여요.", "count", "wipe", "tighten", "label"]
  - ["작은 부품", magnify, "'All'과 'small'을 함께 써서 작아서 놓치기 쉬운 부품까지 포함한다는 뜻이에요. 'need to be accounted for'는 반드시 소재를 확인하라는 필수 표현이에요.", "the spare keys", "작은 부품들도 전부 통에 넣어야 해요.", "작은 부품들도 전부 세척에 넣어야 해요.", "accounted", "oiled", "stored", "sharpened"]
  - ["개수 보고", check, "'has three pieces'로 기준이 되는 개수를 먼저 말한 뒤 'all three'로 그 모두를 확인한다고 이어요. 세트 개수를 알아야 빠진 조각을 알아차려요.", "I weigh", "세트는 네 조각이에요 — 넷 다 확인할게요.", "세트는 두 조각이에요 — 둘 다 확인할게요.", "pieces", "boxes", "clips", "bags"]
  - ["분해 설명", scalpel, "'comes apart'는 부품으로 풀린다는 구동사라 분해되는 기구를 설명할 때 써요. 'into separate pieces'는 따로 떨어진다는 점을 말해요.", "This blanket", "이 견인기는 분리된 조각으로 분류돼요.", "이 견인기는 분리된 조각으로 보관돼요.", "separate", "broken", "spare", "tiny"]
  - ["닫기 전 확인", check, "'Make sure'는 확실히 하라는 지시로 'check'보다 결과를 책임진다는 느낌이에요. 'is back'은 쓰던 자리로 돌아왔다는 뜻이에요.", "every pillow", "닫기 전에 손잡이가 전부 돌아왔는지 확인해요.", "닫기 전에 나사가 전부 돌아왔는지 확인해요.", "back", "clean", "ready", "open"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기구 분해 부품 계수 4문장 순서
    why: 기구가 분해된다고 설명하고, 부품마다 세자고 하고, 세트 개수를 확인한 뒤, 닫기 전에 전부 돌아왔는지 마무리 확인을 해요.
    lines:
    - ["This retractor comes apart into separate pieces.", scalpel, "이 견인기는 분리된 조각으로 나뉘어요", "설명"]
    - ["So let's count each component of it.", scalpel, "그러니 그 부품을 하나씩 세요", "제안"]
    - ["It has three pieces — I confirm all three.", check, "세 조각이에요 — 셋 다 확인할게요", "보고"]
    - ["Make sure every piece is back before we close.", magnify, "닫기 전에 조각이 전부 돌아왔는지 확인해요", "마무리"]
- title: 소독포 안 잔류 확인
  s:
  - ["숨은 것 수색", magnify, "'search … for'는 무엇을 찾는지를 for 뒤에 붙여요. 'hidden'은 눈에 안 띄게 접힌 곳에 들어간 것을 가리켜요.", "for dust", "소독포 가장자리에 숨은 게 없는지 수색해요.", "소독포 안쪽 주머니에 숨은 게 없는지 수색해요.", "search", "count", "polish", "tidy"]
  - ["털어서 확인", magnify, "'Shake out'은 구동사라 안에 들어 있는 것을 흔들어 떨어낸다는 뜻이에요. 'before we finalize'는 계수를 마무리하기 전에 끝내야 한다는 시점이에요.", "the curtains", "계수를 마무리하기 전에 소독포를 걷어요.", "계수를 마무리하기 전에 소독포를 모아요.", "finalize", "print", "post", "send"]
  - ["잔류 금지", shield, "'should'는 'must'보다 부드럽지만 안전 규칙에서는 반드시 지킬 일로 들려요. 'left'는 'leave'의 과거분사로 남겨진 상태를 말해요.", "in the freezer", "주머니에 아무것도 남으면 안 돼요.", "서랍에 아무것도 남으면 안 돼요.", "folds", "pockets", "drawers", "boxes"]
  - ["습관", magnify, "'always'를 동사 앞에 두면 예외 없는 습관이라는 뜻이에요. 'of every drape'로 소독포마다 빠짐없이 본다는 범위를 말해요.", "every glove", "가운마다 접힌 부분을 항상 확인해요.", "소독포마다 가장자리를 항상 확인해요.", "drape", "gown", "towel", "pad"]
  - ["확인 보고", check, "'this time'으로 지금 이 수술에 한정해 말해서 지난번과 구분해요. 'left behind'는 뒤에 남겨졌다는 뜻이에요.", "this week", "지난번에는 아무것도 남지 않았어요.", "어제는 아무것도 남지 않았어요.", "left", "found", "moved", "kept"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 소독포 안 잔류 확인 4문장 순서
    why: 계수를 마치기 전에 소독포를 털고, 펼친 채로 접힌 곳을 수색하고, 아무것도 안 나왔다고 보고한 뒤 계수를 마무리해요.
    lines:
    - ["Shake out the drapes before we finalize the count.", magnify, "계수를 마무리하기 전에 소독포를 털어요", "털기"]
    - ["While they're open, let's search the folds for anything hidden.", magnify, "펼친 동안 접힌 부분에 숨은 게 없는지 수색해요", "수색"]
    - ["Nothing was left behind this time.", check, "이번에는 아무것도 남지 않았어요", "보고"]
    - ["So the drapes are clear, and I can finalize the count.", star, "그러니 소독포는 깨끗하고 계수를 마무리할 수 있어요", "마무리"]
- title: 바늘 파손 조각 확인
  s:
  - ["파손 대응", siren, "'every fragment'로 부러진 조각 하나도 남기지 않는다는 뜻이에요. 'back'은 몸 밖으로, 본래 자리로 돌려받는다는 뜻이에요.", "The needle bent", "가위 날이 부러졌어요 — 조각을 전부 회수해야 해요.", "클립이 부러졌어요 — 조각을 전부 회수해야 해요.", "broke", "bent", "dulled", "jammed"]
  - ["양쪽 확인", check, "'both halves'는 부러진 바늘이 두 조각이라는 것을 전제로 둘 다 확인하라는 말이에요. 'before closing'으로 닫기 전 시점을 못 박아요.", "both gowns", "닫기 전에 세 조각을 전부 셈에 넣어요.", "닫기 전에 네 조각을 전부 셈에 넣어요.", "halves", "hands", "wings", "gloves"]
  - ["수색 약속", magnify, "'until'은 끝나는 조건을 붙여 조각을 다 찾기 전에는 멈추지 않는다는 약속이 돼요. 'are found'는 찾아지는 쪽에 초점을 둔 수동태예요.", "the lobby", "조각을 전부 찾을 때까지 바닥을 수색할게요.", "조각을 전부 찾을 때까지 쟁반을 수색할게요.", "until", "after", "before", "while"]
  - ["미회수 보고", siren, "'still missing'은 아직도 찾지 못했다는 뜻이에요. 'A piece of'는 전체가 아니라 일부 하나라는 걸 말해요.", "is still warm", "바늘 조각 두 개가 아직 없어요.", "바늘 조각 세 개가 아직 없어요.", "missing", "bent", "dull", "wet"]
  - ["닫기 보류", siren, "'can't close'는 금지가 아니라 불가능이라 팀이 반박하기 어렵게 말해요. 'until'은 조건이 충족될 때까지 보류한다는 뜻이에요.", "until every bolt", "조각 두 개를 확인할 때까지 닫을 수 없어요.", "조각 세 개를 확인할 때까지 닫을 수 없어요.", "close", "start", "transfer", "dress"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 바늘 파손 조각 4문장 순서
    why: 바늘이 부러졌다고 알리고, 조각 하나가 아직 없다고 보고하고, 찾을 때까지 수색하겠다고 한 뒤, 전부 찾으면 확인하고 닫는다고 말해요.
    lines:
    - ["The needle broke — we need every fragment back.", siren, "바늘이 부러졌어요 — 조각을 전부 회수해야 해요", "알림"]
    - ["A piece of it is still missing.", siren, "그 조각 하나가 아직 없어요", "보고"]
    - ["So I'll search the field until all pieces are found.", magnify, "그러니 조각을 전부 찾을 때까지 필드를 수색할게요", "수색"]
    - ["Once they're all found, we confirm every one before we close.", check, "다 찾으면 닫기 전에 하나하나 확인해요", "확인"]
