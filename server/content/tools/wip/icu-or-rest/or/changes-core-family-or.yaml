  id: w-sure
  why: 너무 쉬움/구에 묶음 — make sure를 w-make 한 카드로 묶음 — 단독 sure(확실한)와 make(만들다)는 이 구의 뜻이 아님; 어느 문장도 태그하지 않게 됐다
