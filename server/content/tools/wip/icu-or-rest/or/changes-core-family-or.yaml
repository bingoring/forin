- kind: word
  id: w-matter
  fields:
  - ko
  why: w-important(중요한)와 뜻이 겹쳐 — matter to you는 그 사람에게 의미가 있다는 뜻
- kind: word
  id: w-settle
  fields:
  - ko
  why: w-stable(안정된)과 ko(안정되다)가 거의 같아 정답이 둘 — settled in recovery는 회복실에 자리를 잡은 것
- kind: word
  id: w-afterward
  fields:
  - ko
  why: w-after(~후에)와 ko(그 후에)가 거의 같아 정답이 둘 — afterward는 '나중에·그 뒤에'
- kind: word
  id: w-everyone
