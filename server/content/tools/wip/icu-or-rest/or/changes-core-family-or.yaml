  why: 문장은 on track(계획대로 순조롭게) — 단독 track(궤도)은 뜻이 틀림
- kind: word
  id: w-far
  fields:
  - en
  - ipa
  - ko
  why: 문장은 so far(지금까지) — 단독 far(멀리)는 뜻이 틀림
- kind: word
  id: w-make
  fields:
  - en
  - ipa
  - ko
  why: 세 문장 모두 make sure — 구 단위 헤드워드로(w-sure는 흡수)
- kind: word
  id: w-sit
  fields:
  - en
  - ipa
  - ko
  why: 세 문장 모두 sit down — 구 단위 헤드워드로(w-down은 흡수)
- kind: word
  id: w-step
  fields:
  - en
  - ipa
  - ko
  why: 문장은 step out(자리를 비우다) — w-out은 흡수, 나가다(단계)는 뜻이 둘로 갈려 정리
- kind: word
  id: w-back
  fields:
  - ko
  why: w-again(다시)과 ko가 같아 정답이 둘 — come/bring/take back은 '되돌아(오다·가다)'
- kind: word
  id: w-progress
  fields:
  - ko
  why: w-run(진행되다)과 ko가 같아 정답이 둘 — progress는 일이 앞으로 나아가는 쪽
- kind: word
  id: w-completely
  fields:
  - ko
  why: w-fully와 ko(완전히)가 같아 정답이 둘 — 두 문장 모두 '충분히 이해할 만한·충분히 정당한' / 충분히는 sufficiently — "전적으로"(A D21)
- kind: word
  id: w-fully
  fields:
  - ko
  why: w-completely와 ko(완전히)가 같아 정답이 둘 — fully support는 '온전히 지지'
- kind: word
  id: w-like
  fields:
  - ko
  why: w-want(원하다)와 ko가 같아 정답이 둘 — if you'd like는 '~하고 싶으시면'
- kind: word
  id: w-tell
  fields:
  - ko
