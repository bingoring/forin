cues:
  w-small: 크기가 작다는 뜻 — 아이 팔처럼 가는 사지에 맞춰 고르는 쪽
  w-short: 길이나 시간이 얼마 되지 않는다는 뜻
  w-calculate: 사지 폐색압에 여유분을 더해 압력 값을 셈하는 일 — 최종 값은 집도의가 확인
  w-check: 커프·장비·피부를 하나하나 눈으로 살펴 이상이 없는지 보는 일
  w-document: 일어난 일을 공식 차트에 글로 적어 남기는 일
  w-period: 어떤 일이 시작해서 끝날 때까지 이어지는 한동안
  w-together: 서로 따로 하지 않고 같은 일을 나란히
  w-continue: 멈추지 않고 이어지는 일 — 출혈이 아직 안 멎었을 때
  w-condition: 피부나 사지가 지금 어떤 모양인지 통틀어 가리키는 말
  w-limit: 넘으면 안 되는 선 — 지혈대 시간의 상한
  w-adequate: 필요한 만큼 모자람이 없는 정도 — 구혈이 잘 됐는지 볼 때
