- kind: word
  id: w-document
  fields:
  - ko
  why: w-record·w-note와 ko(기록하다)가 같아 정답이 셋 — document는 서류·차트에 문서로 남기는 쪽
- kind: word
  id: w-damage
  fields:
  - ko
  why: w-injury와 ko(손상)가 같아 정답이 둘 — damage는 조직이 훼손된 것
- kind: word
  id: w-underneath
  fields:
  - ko
  why: w-below와 ko(아래에)가 같아 정답이 둘 — underneath는 바로 밑에 가려진 자리
- kind: word
  id: w-below
  fields:
  - ko
  why: w-underneath와 ko(아래에)가 같아 정답이 둘 — below는 기준 지점보다 더 아래쪽
- kind: word
  id: w-call
  fields:
  - ko
  why: w-announce·w-flag·w-inform과 ko(알리다)가 같아 정답이 넷 — call은 소리 내어 알려 주는 쪽
- kind: word
  id: w-announce
  fields:
  - ko
  why: ko(알리다)가 call·flag·inform과 같아 정답이 넷 — announce는 모두에게 공지하는 쪽
- kind: word
  id: w-flag
  fields:
  - ko
