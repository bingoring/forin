- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm과 ko(확인하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — check는 살펴 점검하는 쪽
- kind: word
  id: w-note
  fields:
  - ko
  why: w-record·w-document와 ko(기록하다)가 같아 정답이 셋 — note는 짧게 메모
- kind: word
  id: w-document
  fields:
  - ko
  why: w-record·w-note와 ko(기록하다)가 같아 정답이 셋 — document는 서류·차트에 문서로 남기는 쪽
- kind: word
  id: w-damage
  fields:
  - ko
  why: w-injury와 ko(손상)가 같아 정답이 둘 — damage는 조직이 훼손된 것; 조직에는 훼손이라 하지 않음 — 손상(망가짐)으로(검토 A D2); w-injury와 서로의 오답이 아니라 정답 둘은 아님
- kind: word
  id: w-underneath
  fields:
  - ko
  why: w-below와 ko(아래에)가 같아 정답이 둘 — underneath는 바로 밑에 가려진 자리
- kind: word
  id: w-below
  fields:
  - ko
  why: w-underneath와 ko(아래에)가 같아 정답이 둘 — below는 기준 지점보다 더 아래쪽
- kind: word
  id: w-call
  fields:
  - ko
  why: w-announce·w-flag·w-inform과 ko(알리다)가 같아 정답이 넷 — call은 소리 내어 알려 주는 쪽
- kind: word
  id: w-announce
  fields:
  - ko
  why: ko(알리다)가 call·flag·inform과 같아 정답이 넷 — announce는 모두에게 공지하는 쪽
- kind: word
  id: w-flag
  fields:
  - ko
  why: ko(알리다)가 call·announce·inform과 같아 정답이 넷 — flag는 문제점을 짚어서 알리는 쪽
- kind: word
  id: w-inform
  fields:
  - ko
  why: ko(알리다)가 call·announce·flag와 같아 정답이 넷 — inform은 모르는 사람에게 알려 주는 쪽
- kind: word
  id: w-right
  fields:
  - ko
  why: w-correct와 ko(맞는)가 같아 정답이 둘 — right는 크기·적절함에 알맞은 쪽
- kind: word
  id: w-correct
  fields:
  - ko
  why: w-right와 ko(맞는)가 같아 정답이 둘 — correct는 틀림없이 정확한 쪽
- kind: word
  id: w-alarm
  fields:
  - ko
  why: w-alert와 ko(경보)가 같아 정답이 둘 — alarm은 정한 때 울리는 알람
- kind: word
  id: w-alert
  fields:
  - ko
  why: w-alarm과 ko(경보)가 같고 w-reminder(알림)와도 겹쳐 정답이 둘 — alert는 주의를 끄는 경고 알림
- kind: word
  id: w-max
  fields:
  - ko
  why: w-maximum과 ko(최대)가 같아 정답이 둘 — max는 형용사로 '최대의'(maximum은 최대치)
- kind: word
  id: w-maximum
  fields:
  - ko
  why: w-max와 ko가 겹치지 않게 명사 '최대치'로
- kind: word
  id: w-run
  fields:
  - ko
  why: w-active와 ko(작동 중인)가 겹쳐 정답이 둘 — run은 돌아가며 작동하는 동작
- kind: word
  id: w-active
  fields:
  - ko
  why: w-run과 ko(작동)가 겹쳐 정답이 둘 — active는 켜져 활성인 상태
- kind: word
  id: w-sit
  fields:
  - ko
  why: '''where the cuff will sit'' — 위치하다보다 놓이다가 자연스럽다'
- kind: word
  id: w-pinch
  fields:
  - ko
  why: w-tight(조이는)·w-compress와 겹쳐 정답이 둘 — 문장은 피부가 끼이는 뜻('isn't pinched')
- kind: word
  id: w-field
  fields:
  - ko
  - example
  why: '''필드''는 외래어 그대로라 뜻이 흐리다 — 수술 영역; 18.3 문장을 바꿔 예문도 맞춤(검토 A S6)'
- kind: word
  id: w-block
  fields:
  - ko
  why: 블록은 외래어 그대로라 뜻이 흐리다 — 이중 커프 정맥 부위마취의 신경차단
- kind: word
  id: w-congest
  fields:
  - en
  - ipa
  - ko
  why: 태그된 문장이 모두 congested 형태의 형용사로 쓰여 헤드워드를 그 모습으로
- kind: word
  id: w-prolong
  fields:
