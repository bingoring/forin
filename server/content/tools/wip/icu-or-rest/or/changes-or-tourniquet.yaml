  id: w-correct
  fields:
  - ko
  why: w-right와 ko(맞는)가 같아 정답이 둘 — correct는 틀림없이 정확한 쪽
- kind: word
  id: w-alarm
  fields:
  - ko
  why: w-alert와 ko(경보)가 같아 정답이 둘 — alarm은 정한 때 울리는 알람
- kind: word
  id: w-alert
  fields:
  - ko
  why: w-alarm과 ko(경보)가 같고 w-reminder(알림)와도 겹쳐 정답이 둘 — alert는 주의를 끄는 경고 알림
- kind: word
  id: w-max
  fields:
  - ko
  why: w-maximum과 ko(최대)가 같아 정답이 둘 — max는 형용사로 '최대의'(maximum은 최대치)
- kind: word
  id: w-maximum
  fields:
  - ko
  why: w-max와 ko가 겹치지 않게 명사 '최대치'로
- kind: word
  id: w-run
  fields:
  - ko
  why: w-active와 ko(작동 중인)가 겹쳐 정답이 둘 — run은 돌아가며 작동하는 동작
- kind: word
  id: w-active
  fields:
  - ko
  why: w-run과 ko(작동)가 겹쳐 정답이 둘 — active는 켜져 활성인 상태
- kind: word
  id: w-sit
  fields:
  - ko
  why: '''where the cuff will sit'' — 위치하다보다 놓이다가 자연스럽다'
- kind: word
  id: w-pinch
  fields:
  - ko
  why: w-tight(조이는)·w-compress와 겹쳐 정답이 둘 — 문장은 피부가 끼이는 뜻('isn't pinched')
- kind: word
  id: w-field
  fields:
  - ko
  why: '''필드''는 외래어 그대로라 뜻이 흐리다 — 수술 영역'
- kind: word
  id: w-block
  fields:
  - ko
  why: 블록은 외래어 그대로라 뜻이 흐리다 — 이중 커프 정맥 부위마취의 신경차단
- kind: word
  id: w-congest
