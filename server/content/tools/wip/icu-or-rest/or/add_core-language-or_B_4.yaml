  - ["함께 약속", handshake2, "every step of the way는 처음부터 끝까지 빠짐없이라는 관용구예요. Through the interpreter로 지지의 말도 통역을 거쳐 전해진다고 알려요.", "your neighbors", "통역사를 통해 매 순간 가족분들께 인사드릴게요.", "통역사를 통해 매 순간 가족분들을 모셔 드릴게요.", "family", "team", "guests", "clients"]
