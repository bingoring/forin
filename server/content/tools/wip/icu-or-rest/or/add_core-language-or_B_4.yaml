- title: 나쁜 소식 통역 전달
  s:
  - ["사과·안내", faceWorried, "I'm so sorry로 먼저 마음을 전하고 대시 뒤에 진행 방식을 안내해요. help me share this news에서 통역사는 대신 말하는 사람이 아니라 내 말을 돕는 사람이에요.", "carry this box", "정말 죄송해요 — 통역사가 이 소식을 전하는 걸 지켜볼 거예요.", "정말 죄송해요 — 통역사가 이 일정을 전하는 걸 도와드릴 거예요.", "news", "bill", "plan", "video"]
