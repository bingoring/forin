    - ["That's a safety risk, so I'm flagging it now.", bell, "그건 안전 위험이라 지금 표시해 둘게요", "표시"]
    - ["To fix that, let's get an interpreter before any medication.", speech, "그걸 해결하려면 약 전에 통역사부터 데려옵시다", "해결"]
    - ["Until we confirm the allergy history, we won't give any.", lock, "알레르기 이력을 확인하기 전엔 주지 않을 거예요", "기준"]
- title: 오역 위험 정보 누락
  s:
  - ["불일치 지적", magnify, "didn't match로 틀렸다고 단정하지 않고 두 말이 어긋난다는 사실만 짚어요. what I said로 비교 기준이 내 원래 말임을 분명히 해요.", "what I ordered", "그 번역지는 제가 한 말과 안 맞았어요.", "그 통역 순서는 제가 한 말과 안 맞았어요.", "match", "rhyme", "finish", "change"]
  - ["즉시 명확화", siren, "to avoid a critical error로 멈추는 이유를 밝혀요. clarify는 모호한 부분을 분명하게 한다는 뜻이고, Let's로 함께 하자고 해요.", "a critical delay", "명확히 하려고 멈추고 번호를 확인합시다.", "치명적인 실수가 생기기 쉬운 순간이에요.", "clarify", "apologize", "celebrate", "relax"]
  - ["위험 인식", shield, "can't risk ~ing는 ~하는 위험을 무릅쓸 수 없다는 뜻이에요. key information처럼 key는 핵심이라는 형용사로 써요.", "the room key", "핵심 장비를 잃는 위험을 감수할 수 없어요.", "핵심 인력을 놓치는 위험을 감수할 수 없어요.", "losing", "gaining", "finding", "buying"]
  - ["중단 요청", siren, "Stop for a moment로 먼저 멈추게 한 뒤 이유를 붙여요. that doesn't match what I said는 비난 없이 사실만 말하는 짚기예요.", "what I wrote", "잠깐 멈춰 주세요 — 그건 제 차트와 안 맞아요.", "잠깐 멈춰 주세요 — 환자분이 질문이 있으세요.", "said", "wrote", "drew", "ordered"]
  - ["즉시 명확화", bell, "Let's clarify this now로 바로 하자고 제안하고, before we risk ~ing으로 미루면 생길 위험을 붙여요. risk losing은 잃을 위험을 안다는 뜻이에요.", "closing the chart", "핵심 장비를 놓치기 전에 지금 바로 명확히 합시다.", "핵심 시간을 놓치기 전에 지금 바로 명확히 합시다.", "key", "hidden", "secret", "old"]
  order:
    tag: 대화 흐름
    icon: compass
