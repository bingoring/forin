- title: 언어장벽 알레르기 미확인
  s:
  - ["한계 공유", shield, "can't confirm … due to ~로 못 하는 일과 그 이유를 함께 알려요. due to 뒤에는 명사구가 와서 the language barrier처럼 써요.", "thanks to", "알레르기를 확인하려고 손부터 씻을게요.", "언어 장벽 때문에 환자분이 불안해하실 수 있어요.", "allergies", "insurance", "symptoms", "address"]
  - ["통역 우선", speech, "before any medication으로 약보다 통역이 먼저라는 순서를 못 박아요. Let's get으로 혼자가 아니라 같이 움직이자고 말해요.", "a witness", "통역사를 데려오려고 번호부터 눌러요.", "약을 주기 전에 손부터 씻읍시다.", "interpreter", "witness", "porter", "chaplain"]
  - ["위험 표시", bell, "'safety risk'처럼 명사 둘을 겹쳐 위험의 종류를 분명히 해요. flagging은 차트나 시스템에 눈에 띄게 표시한다는 뜻이고, now가 지금 하겠다는 약속이에요.", "a billing error", "이건 안전 위험이에요 — 표시해 두려고 펜을 꺼내요.", "이건 안전 위험이에요 — 언어 장벽 때문이에요.", "flagging", "filming", "printing", "naming"]
  - ["투약 보류", lock, "We won't ~ until …은 조건이 채워질 때까지 하지 않겠다는 틀이에요. 확인이 끝나기 전에는 투약하지 않는다는 기준을 분명히 말해요.", "directions", "알레르기 이력을 확인하기 전엔 환자분을 이동하지 않을 거예요.", "알레르기 이력을 확인하기 전엔 식사를 주지 않을 거예요.", "medication", "paperwork", "directions", "bracelets"]
  - ["위험 설명", shield, "a real risk는 막연한 걱정이 아니라 실제로 일어날 수 있는 위험이라는 뜻이에요. to safety로 위험이 향하는 대상을 정해 줘요.", "a real help", "언어 장벽은 여기서 속도에 실제 위험이 돼요.", "언어 장벽은 여기서 비용에 실제 위험이 돼요.", "risk", "help", "benefit", "gain"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 알레르기 미확인 4문장 순서
    why: 알레르기를 확인할 수 없다는 한계를 말하고 위험으로 표시한 뒤, 해결책으로 통역사를 부르고, 확인 전에는 약을 주지 않겠다고 기준을 세워요.
    lines:
