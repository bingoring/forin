    why: 통역이 내 말과 어긋났다고 짚고 멈춰 명확히 하자고 한 뒤, 핵심 정보를 잃을 수 없다는 이유를 대고, 다시 통역해 달라고 요청해요.
    lines:
    - ["That interpretation didn't match what I said.", magnify, "그 통역은 제가 한 말과 안 맞았어요", "지적"]
    - ["Stop for a moment — let's clarify that before we go on.", siren, "잠깐 멈추고 계속하기 전에 그걸 명확히 해요", "멈춤"]
    - ["We can't risk losing key information.", shield, "핵심 정보를 놓치는 위험을 감수할 수 없어요", "이유"]
    - ["So please interpret it again, slowly and word for word.", redo, "그러니 천천히 한 마디씩 다시 통역해 주세요", "재요청"]
- title: 위기 설명 신속 통역
  s:
  - ["통역 요청", speech, "Please interpret this로 정중히 시키고 urgently and clearly로 방식 두 가지를 덧붙여요. 같은 -ly 부사를 and로 묶으면 속도와 명료함을 동시에 요구하는 느낌이에요.", "Please print this", "이걸 정중하고 크게 통역해 주세요.", "통역하려고 단어를 정리해 주세요.", "clearly", "quietly", "secretly", "lazily"]
  - ["상태 변화", bell, "has changed는 현재완료로 방금 일어난 변화가 지금도 영향을 준다는 뜻이에요. they는 한 사람인 환자를 성별 없이 가리킬 때 쓰는 단수 they예요.", "has been charted", "환자분 일정이 변했어요 — 지금 바로 알려야 해요.", "환자분 병실이 변했어요 — 지금 바로 알려야 해요.", "condition", "schedule", "room", "wristband"]
  - ["간단히", bulb, "Keep it simple은 말을 복잡하게 만들지 말라는 짧은 명령형이에요. so nothing is misunderstood는 오해가 하나도 없게 하자는 목적을 수동태로 말해요.", "it secret", "잘못 이해하지 않도록 조용하게 유지하세요.", "서두르지 않도록 간단하게 유지하세요.", "simple", "quiet", "secret", "slow"]
  - ["급한 통역", siren, "before her condition changes again으로 서두르는 이유를 밝혀요. urgently는 형용사 urgent의 부사형으로 interpret이라는 동사를 꾸며요.", "a longer", "환자분 가족이 또 오기 전에 급히 통역해야 해요.", "상태가 또 변하기 전에 통역하려고 화면을 켜요.", "urgently", "politely", "casually", "cheaply"]
  - ["쉬운 전달", bulb, "Explain this simply는 형용사 simple 대신 부사 simply를 써서 설명하는 방식을 말해요. gets는 be 동사 대신 쓰는 구어체 수동이라 부드러워요.", "in riddles", "잘못 이해되지 않게 간단하게 보여 주세요.", "잘못 이해되지 않게 크게 말해 주세요.", "misunderstood", "interrupted", "repeated", "recorded"]
  order:
    tag: 대화 흐름
    icon: compass
