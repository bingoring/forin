    why: 상태가 변했다고 알리고 급히 통역해 달라고 요청한 뒤, 간단히 말하게 하고, 끝나면 환자가 되받아 한 말을 알려 달라고 해요.
    lines:
    - ["The patient's condition has changed — they need to know now.", bell, "환자분 상태가 변했어요, 지금 알려야 해요", "상황"]
    - ["Please interpret this urgently and clearly.", speech, "이걸 긴급하고 또렷하게 통역해 주세요", "요청"]
    - ["Keep it simple so nothing is misunderstood.", bulb, "잘못 이해하지 않도록 간단하게 하세요", "방식"]
    - ["When you're done, tell me what they said back.", redo, "끝나면 환자분이 되받아 한 말을 알려 주세요", "확인"]
- title: 이해 불가 응급 진행
  s:
  - ["응급 판단", siren, "but으로 이해 부족이라는 한계와 응급이라는 판단을 대비시켜요. true emergency의 true는 진짜로 시간이 없는 응급임을 강조해요.", "a casual chat", "환자분 가족이 완전히 이해하지 못해도 이건 진짜 응급 상황이에요.", "환자분이 완전히 깨어나지 못해도 이건 진짜 응급 상황이에요.", "emergency", "request", "outcome", "diagnosis"]
  - ["진행 방침", shield, "We proceed under ~로 어떤 근거로 진행하는지 말하고 and document why로 이유 기록까지 한 문장에 묶어요. 현재형은 정해진 절차를 말할 때 써요.", "under normal rules", "응급 동의 절차에 따라 진행하고 그 이유를 확인해요.", "응급 동의 절차에 따라 진행하고 그 시각을 기록해요.", "consent", "orders", "forms", "badges"]
