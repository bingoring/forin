  - ["응급 진행", siren, "'This is ~, so …'로 이유를 먼저 대고 결과를 이어 판단의 근거를 분명히 해요. emergency가 두 번 나와 응급이라는 조건이 곧 절차의 근거임을 보여 줘요.", "under a signed form", "응급 동의 절차로 진행하려고 서류를 펴요.", "진짜 응급 상황이라 환자분 가족이 놀라실 수 있어요.", "true", "false", "rare", "minor"]
  - ["소통·기록", pencil, "keep trying to … and document …처럼 두 동사를 and로 묶어 동시에 하겠다고 약속해요. every step은 빠짐없이 기록한다는 범위를 정해요.", "every visitor", "계속 소통을 시도하면서 매 단계를 점검할게요.", "계속 소통을 시도하면서 매 시각을 기록할게요.", "step", "sound", "breath", "visitor"]
  order:
