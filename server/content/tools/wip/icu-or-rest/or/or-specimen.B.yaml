situations:
- title: 검체 용기 라벨 부착
  sentences:
  - en: I'm labeling this container with the patient's name.
    ko: 지금 이 용기에 환자분 이름으로 라벨을 붙이고 있어요.
    chunks:
    - I'm labeling
    - this container
    - with the patient's name
    - .
    words:
    - w-label
    - w-container
    - w-patient
    - w-name
    goal: 1
    tag: 라벨 부착
    icon: pushpin
    why: '''with the patient''s name''을 뒤에 붙여 무엇으로 표시하는지 밝혀요. ''I''m … -ing''는 지금 하는 중이라는 진행형이에요.'
    decoy: that transport bag
    distractorsKo:
    - 지금 이 가방에 환자분 이름으로 라벨을 붙이고 있어요.
    - 지금 이 용기에 환자분 이름으로 요청서를 붙이고 있어요.
    blank:
      answer: container
      options:
      - en: container
      - en: monitor
      - en: chart
      - en: stand
  - en: This is gallbladder, correct?
    ko: 이거 담낭 맞죠?
    chunks:
    - This is
    - gallbladder
    - ', correct'
    - '?'
    words:
    - w-gallbladder
    - w-correct
    goal: 2
    tag: 종류 확인
    icon: magnify
    why: 문장 끝에 'correct?'를 붙이면 단정이 아니라 상대에게 확인을 구하는 질문이 돼요. 'This is'로 눈앞의 것을 가리켜요.
    decoy: ', ready'
    distractorsKo:
    - 이거 담낭 보셨죠?
    - 이거 담낭 받으셨죠?
    blank:
      answer: correct
      options:
      - en: ready
      - en: correct
      - en: sealed
      - en: clean
  - en: I'll add the date and time on the label.
    ko: 라벨에 날짜와 시간을 적을게요.
    chunks:
    - I'll add
    - the date
    - and time
    - on the label
    - .
    words:
    - w-add
    - w-date
    - w-time
    - w-label
    goal: 1
    tag: 기재
    icon: pencil
    why: '''I''ll''은 지금 정해서 하겠다는 말이라 바로 하겠다는 약속처럼 들려요. 날짜와 시간은 한 묶음으로 같이 적어요.'
    decoy: on the lid
    distractorsKo:
    - 라벨에 날짜와 크기를 적을게요.
    - 라벨에 날짜와 시간을 읽을게요.
    blank:
      answer: date
      options:
      - en: size
      - en: brand
      - en: date
      - en: owner
  - en: Can you confirm this is the correct specimen?
    ko: 이게 맞는 검체인지 확인해 주시겠어요?
    chunks:
    - Can you confirm
    - this is
    - the correct specimen
    - '?'
    words:
    - w-confirm
    - w-correct
    - w-specimen
    goal: 2
    tag: 맞는지 확인
    icon: check
    why: '''Can you …?''는 지시보다 부드러운 부탁이에요. ''the correct specimen''에서 correct를 앞에 두어 맞는 것인지를 묻는다고 분명히 해요.'
    decoy: the surgeon's list
    distractorsKo:
    - 이게 맞는 검체인지 보여 주시겠어요?
    - 이게 맞는 검체인지 찾아 주시겠어요?
    blank:
      answer: correct
      options:
      - en: spare
      - en: clean
      - en: extra
      - en: correct
  - en: I'm writing the patient's name on the label now.
    ko: 지금 라벨에 환자분 이름을 적고 있어요.
    chunks:
    - I'm writing
