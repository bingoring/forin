situations:
- title: 예상 출혈량 파악
  sentences:
  - en: What's the expected blood loss for this procedure?
    ko: 이 수술의 예상 출혈량이 얼마나 될까요?
    chunks:
    - What's
    - the expected blood loss
    - for this procedure
    - '?'
    words:
    - w-expect
    - w-blood
    - w-loss
    - w-procedure
    goal: 1
    tag: 출혈량 질문
    icon: chartup
    why: What's로 시작해 예상 수치를 묻고, for this procedure로 어느 수술인지 한정해요. 수술 전 브리핑에서 팀이 출혈 대비 수준을 맞추는 표준 질문이에요.
    decoy: the expected case length
    distractorsKo:
    - 이 수술의 예상 출혈량이 어디에 적혀 있나요?
    - 이 수술의 예상 출혈량을 누가 정하나요?
    blank:
      answer: expected
      options:
      - en: expected
      - en: actual
      - en: previous
      - en: recorded
  - en: I'll have extra suction and lap pads ready.
    ko: 여분의 흡인기와 랩패드를 준비해 둘게요.
    chunks:
    - I'll have
    - extra suction
    - and lap pads
    - ready
    - .
    words:
    - w-extra
    - w-suction
    - w-lappad
    - w-ready
    goal: 2
    tag: 대비 준비
    icon: bandage
    why: have X ready는 쓰기 전에 미리 갖춰 둔다는 틀이에요. extra를 붙여 평소 분량 이상으로 대비한다는 점을 알려요.
    decoy: and spare gowns
    distractorsKo:
    - 흡인기를 준비하려고 상자를 풀게요.
    - 여분의 흡인기와 랩패드를 수술 후에 정리해 둘게요.
    blank:
      answer: ready
      options:
      - en: ready
      - en: torn
      - en: stained
      - en: expired
  - en: I'll track EBL as we go.
    ko: 진행하면서 EBL을 계속 기록할게요.
    chunks:
    - I'll track
    - EBL
    - as we go
    - .
    words:
    - w-track
    - w-ebl
    goal: 1
    tag: 기록 약속
    icon: pencil
    why: as we go는 수술이 진행되는 내내 이어서 한다는 뜻이라, 한 번이 아니라 계속 기록한다는 약속이 돼요.
    decoy: the irrigation
    distractorsKo:
    - EBL을 계속 기록하려고 시계를 볼게요.
    - 진행하면서 EBL은 계속 달라져요.
    blank:
      answer: as we go
      options:
      - en: as we go
      - en: as we scrub
      - en: as we wait
      - en: as we leave
  - en: We could lose a lot of blood with this procedure.
    ko: 이 수술에서는 출혈이 많을 수 있어요.
    chunks:
    - We could
    - lose a lot
    - of blood
    - with this procedure
    - .
    words:
    - w-lose
    - w-blood
    - w-procedure
    goal: 1
    tag: 위험 공유
    icon: faceWorried
    why: could는 확정이 아닌 가능성을 말해 팀이 미리 대비하게 하되 불안을 키우지 않아요. 위험을 수술 이름에 붙여 한정해요.
    decoy: of heat
    distractorsKo:
    - 이 수술에서는 통증이 많을 수 있어요.
    - 이 수술에서는 시간이 오래 걸릴 수 있어요.
    blank:
      answer: lose
      options:
      - en: lose
      - en: gain
      - en: save
      - en: give
  - en: I'll keep extra lap pads within reach in case we need them.
    ko: 필요할 경우를 대비해 여분의 랩패드를 손 닿는 곳에 둘게요.
    chunks:
    - I'll keep
    - extra lap pads
    - within reach
    - in case we need them
    - .
    words:
    - w-keep
    - w-extra
    - w-lappad
    goal: 2
    tag: 대비 준비
    icon: bandage
    why: within reach는 손만 뻗으면 닿는다는 뜻이고, in case…로 지금 필요해서가 아니라 대비임을 밝혀요.
    decoy: extra sterile gowns
    distractorsKo:
    - 필요할 경우를 대비해 여분의 랩패드는 멸균 포장으로 둬요.
    - 필요할 경우를 대비해 여분의 랩패드를 손 닿는 곳에 두려고 봉지를 풀게요.
    blank:
      answer: need
      options:
      - en: need
      - en: drop
      - en: waste
      - en: break
  order:
    tag: 대화 흐름
    icon: compass
    ko: 출혈 대비 4문장 순서
    why: 예상 출혈량을 묻고, 그에 맞춰 물품을 갖추고, 그와 함께 추정치 대비 기록을 이어 가며 변화를 알리는 순서예요. 앞 줄을 가리키는 말이 순서를 잡아 줘요.
    lines:
    - en: What's the expected blood loss for this procedure?
      icon: chartup
      ko: 이 수술의 예상 출혈량이 얼마나 될까요?
      note: 질문
    - en: Based on that, I'll have extra suction and lap pads ready.
      icon: bandage
      ko: 그에 맞춰 여분의 흡인기와 랩패드를 준비할게요
      note: 준비
    - en: Alongside that, I'll track EBL against that estimate as we go.
      icon: pencil
      ko: 그와 함께 진행하며 그 추정치 대비 EBL을 기록할게요
      note: 기록
    - en: I'll update you whenever the total changes much.
      icon: speech
      ko: 합계가 많이 변하면 그때마다 알릴게요
      note: 보고
- title: 흡인 출혈량 측정
  sentences:
  - en: The canister shows about 300 milliliters so far.
    ko: 흡인통에 지금까지 약 300밀리리터가 보입니다.
    chunks:
    - The canister shows
    - about 300 milliliters
    - so far
    - .
    words:
    - w-canister
    - w-show
    - w-milliliter
    goal: 1
    tag: 수치 보고
    icon: chartup
    why: shows 뒤에 읽은 값을 그대로 이어 말해 해석 없이 중립적으로 전달해요. so far로 아직 진행 중인 누적값임을 알려요.
    decoy: a few bubbles
    distractorsKo:
    - 흡인통에 지금까지 쌓인 양은 눈금으로 읽어요.
    - 흡인통에 지금까지 쌓인 건 피와 세척액이 섞인 양이에요.
    blank:
      answer: milliliters
      options:
      - en: milliliters
      - en: milligrams
      - en: millimeters
      - en: micrograms
  - en: I'll subtract the irrigation from that number.
    ko: 저 숫자에서 세척액을 빼겠습니다.
    chunks:
    - I'll subtract
    - the irrigation
    - from that number
    - .
    words:
    - w-subtract
    - w-irrigation
    - w-number
    goal: 2
    tag: 세척액 제외
    icon: lab
    why: subtract A from B 틀에서 빼는 것이 앞, 기준 값이 뒤에 와요. 겉보기 수치에서 혈액이 아닌 것을 덜어 낸다는 의도가 어순에 드러나요.
    decoy: the tubing
    distractorsKo:
    - 세척액을 빼려고 양을 적겠습니다.
    - 저 숫자는 세척액 때문에 많아 보입니다.
    blank:
      answer: irrigation
      options:
      - en: irrigation
      - en: blood
      - en: tubing
      - en: suction
  - en: I'm keeping a running total of the EBL.
    ko: EBL의 누적 합계를 계속 기록하고 있어요.
    chunks:
    - I'm keeping
    - a running total
    - of the EBL
    - .
    words:
    - w-keep
    - w-run
    - w-total
    - w-ebl
    goal: 2
    tag: 누적 기록
    icon: pencil
    why: a running total은 더해 갈 때마다 바뀌는 합계라서, 수술 내내 갱신하고 있음을 한 구로 전해요.
    decoy: a spare copy
    distractorsKo:
    - EBL 합계를 기록하려고 펜을 쥐고 있어요.
    - EBL의 누적 합계는 계속 바뀌고 있어요.
    blank:
      answer: running
      options:
      - en: running
      - en: final
      - en: single
      - en: double
  - en: Let me check the suction canister again.
    ko: 흡인통을 다시 확인해 볼게요.
    chunks:
    - Let me check
    - the suction canister
    - again
    - .
    words:
    - w-check
    - w-suction
    - w-canister
    goal: 1
    tag: 재확인
    icon: magnify
    why: Let me …는 허락을 묻는 질문 없이 곧바로 내가 하겠다는 말이라 빠르고 부드러워요. again으로 앞서 본 것을 다시 본다는 점이 분명해요.
    decoy: the pump display
    distractorsKo:
    - 흡인통을 먼저 확인해 볼게요.
    - 다시 확인하려고 불을 켤게요.
    blank:
      answer: again
      options:
      - en: again
      - en: twice
      - en: slowly
      - en: gently
  - en: Once I subtract the irrigation, the real blood loss is lower.
    ko: 세척액을 빼고 나면 실제 출혈량은 더 적습니다.
    chunks:
    - Once I subtract
    - the irrigation
    - ', the real blood loss'
    - is lower
    - .
    words:
    - w-subtract
    - w-irrigation
    - w-blood
    - w-loss
    goal: 2
    tag: 실혈량 설명
    icon: lab
    why: Once …는 앞 동작이 끝난 시점에 뒤의 결과가 성립한다는 순서를 알려요. the real blood loss로 겉보기 수치와 실제 출혈을 구분해요.
    decoy: the drape count
    distractorsKo:
    - 세척액을 빼고 나면 실제 출혈량은 다시 기록합니다.
    - 세척액을 빼도 흡인통의 숫자는 그대로입니다.
    blank:
      answer: lower
      options:
      - en: lower
      - en: higher
      - en: unknown
      - en: steady
  order:
    tag: 대화 흐름
    icon: compass
    ko: 흡인 출혈량 보고 4문장 순서
    why: 읽은 값을 보고하고, 세척액을 덜어 낸 뒤, 남은 값을 합계에 넣고, 다시 읽어 그 합계와 비교하는 순서예요. 마지막 줄의 that total이 앞 줄을 가리켜 순서를 잡아 줘요.
    lines:
    - en: The canister shows about 300 milliliters so far.
      icon: chartup
      ko: 흡인통에 지금까지 약 300밀리리터가 보입니다
      note: 보고
    - en: I'll subtract the irrigation from that number.
      icon: lab
      ko: 저 숫자에서 세척액을 빼겠습니다
      note: 보정
    - en: What's left goes into the running EBL.
      icon: pencil
      ko: 남은 값은 누적 EBL에 들어갑니다
      note: 합산
    - en: I'll read the canister again and compare it with that total.
      icon: magnify
      ko: 흡인통을 다시 읽고 그 합계와 비교할게요
      note: 재확인
- title: 거즈 무게 출혈 추정
