라벨 정보 불일치:
- kind: slider
  words:
  - w-label
  - w-match
  - w-requisition
  cue: The name on the container reads 'Jon Smith', but the requisition says 'John Smith'.
  scale:
  - I'm holding it until we sort this out.
  - It's probably a typo, so I'll send it.
  - It's fine, pathology will catch it later.
  answerAt: 0
  why: 라벨과 요청서가 한 글자라도 다르면 보내지 않고 멈춰서 바로잡아요. 오타일 거라 넘기거나 병리과가 알아채길 기대하면 다른 환자의 결과와 섞일 수 있어요.
  example: I won't send it until this is corrected.
  exKo: 이게 정정될 때까지 보내지 않을게요.
- kind: context
  words:
  - w-label
  word: label
  ko: 라벨
  scenes:
  - who: 간호사 → 순환간호사
    icon: speech
    en: The label doesn't match the requisition — one of us has to fix it.
    ok: true
  - who: 차트 기록
    icon: board
    en: Label discrepancy found; specimen held and corrected before sending.
    ok: true
  - who: 간호사 → 병리 기사
    icon: pager
    en: The label is a bit off, whatever, you'll figure it out.
    ok: false
    fix: The label reads Jon Smith but the requisition says John Smith, so I'm correcting it before I send it.
  why: 뜻은 셋 다 '라벨'이에요. 동료에게는 라벨이 요청서와 다르다고 바로 알리고, 차트에는 발견하고 멈추고 정정했다고 적어요. 하지만 병리 쪽에 '조금 틀렸는데 알아서 하세요'라고 하면 어느 쪽이 맞는지 알 수 없어요. 무엇이 어떻게 다른지 구체적으로 알려야 해요.
- kind: swap
  words:
  - w-label
  - w-match
  who: 간호사 → 집도의 · 라벨 불일치
  icon: me
  before:
  - ''
  - It's close enough, I'll send it as is.
  - ''
  options:
  - The label doesn't match the requisition, so I'll fix it first.
  - It's close enough, I'll send it as is.
  - Pathology can sort out the spelling later.
  answer: The label doesn't match the requisition, so I'll fix it first.
  notes:
    The label doesn't match the requisition, so I'll fix it first.: 다른 점을 말하고 보내기 전에 바로잡는 올바른 순서예요.
    It's close enough, I'll send it as is.: 한 글자 차이로도 다른 환자와 혼동될 수 있어요.
    Pathology can sort out the spelling later.: 병리과는 어느 철자가 맞는지 알 수 없어요.
  why: 라벨과 요청서가 다르면 보내기 전에 바로잡아요. 비슷하다고 넘기거나 병리과에 미루지 않아요.
  ko: 라벨이 요청서와 일치하지 않아서 먼저 고칠게요
냉동절편 신속 이송:
- kind: slider
  words:
  - w-run
  - w-frozen
  - w-surgeon
  - w-result
  cue: The frozen section is ready, and the surgeon is waiting on the result.
  scale:
  - I'll bring it down when I get a minute.
  - I'm carrying it to pathology right now.
  - I'll hand it to the first person I see.
  answerAt: 1
  why: 냉동절편은 수술 중 결과를 기다리는 검체라 미루지 않고 바로 병리과로 가져가요. 짬이 날 때로 미루면 집도의가 기다리고, 아무에게나 넘기면 누가 가져갔는지 알 수 없어요.
  example: Please run it straight to pathology.
  exKo: 곧바로 병리과로 가져다주세요.
- kind: context
  words:
  - w-pathology
  word: pathology
  ko: 병리과
  scenes:
  - who: 간호사 → 보호자
    icon: faceWorried
    en: Pathology is checking right now whether it's cancer.
    ok: false
    fix: The surgeon will explain everything after the surgery.
  - who: 간호사 → 집도의
    icon: speech
    en: Pathology will call the result as soon as they have it.
    ok: true
  - who: 차트 기록
    icon: board
    en: Frozen section sent to pathology at 10:35.
    ok: true
  why: 뜻은 셋 다 '병리과'예요. 집도의에게는 병리과가 나오는 대로 전화한다고 알리고, 차트에는 언제 보냈는지 적어요. 하지만 보호자에게 병리과가 암인지 보고 있다고 말하는 것은 간호사의 일이 아니에요. 결과는 집도의가 수술 후 직접 설명해요.
- kind: swap
  words:
  - w-result
  - w-surgeon
  who: 간호사 → 병리 기사 · 결과 요청
  icon: me
  before:
  - ''
  - Call us whenever the result happens to be ready.
  - ''
  options:
  - Call us whenever the result happens to be ready.
  - The surgeon is waiting on this frozen result — please call it to the room.
  - Send us the result when the day's work is done.
  answer: The surgeon is waiting on this frozen result — please call it to the room.
  notes:
    Call us whenever the result happens to be ready.: 급한 검체라는 느낌이 없어 순서가 밀릴 수 있어요.
    The surgeon is waiting on this frozen result — please call it to the room.: 누가 기다리는지 말해 우선순위를 분명히 전해요.
    Send us the result when the day's work is done.: 수술 중인 검사는 하루 일이 끝날 때까지 기다릴 수 없어요.
  why: 냉동절편은 집도의가 기다린다는 점을 분명히 하며 나오는 대로 알려 달라고 부탁해요. 마냥 기다리겠다는 투도, 재촉하는 투도 아니에요.
  ko: 집도의가 이 냉동절편 결과를 기다리고 있으니 방으로 전화해 주세요
배양 검체 무균 채취:
- kind: slider
  words:
  - w-sterile
  - w-swab
  - w-culture
  cue: The surgeon asks for a culture. As you open the swab, its tip brushes the drape.
  scale:
  - I'll open a new sterile swab and redo it.
  - I'll just wipe the tip off and use it.
  - It's only a drape, so I'll use it as it is.
  answerAt: 0
  why: 닿으면 안 되는 곳에 닿은 면봉은 더 이상 무균이 아니라서 새 무균 면봉으로 바꿔요. 닦아서 쓰거나 그냥 쓰면 오염된 균이 검사 결과에 섞여요.
  example: Let's use a fresh sterile swab.
  exKo: 새 무균 면봉을 써요.
- kind: context
  words:
  - w-sterile
  word: sterile
  ko: 무균의
  scenes:
  - who: 간호사 → 집도의
    icon: speech
    en: The swab touched the drape, so it is no longer sterile.
    ok: true
  - who: 간호사 → 미생물 검사실
    icon: pager
    en: The swab was sterile at first, then not really, probably fine.
    ok: false
    fix: The swab touched the drape, so it is no longer sterile — I'm opening a new one.
  - who: 차트 기록
    icon: board
    en: Culture obtained with a sterile swab and sent to microbiology.
    ok: true
  why: 뜻은 셋 다 '무균'이에요. 집도의에게는 무균이 깨졌다고 짧게 알리고, 차트에는 무균 면봉으로 채취해 보냈다고 적어요. 하지만 미생물검사실에 '처음엔 무균이었다가 아닌 것 같은데 아마 괜찮다'고 하면 믿을 수 없는 배양이 돼요. 무균이 깨졌는지 분명히 말하고 어떻게 했는지 알려요.
- kind: swap
  words:
  - w-sterile
  - w-swab
  who: 간호사 → 집도의 · 면봉 오염
  icon: me
  before:
  - ''
  - The tip touched the drape, but it's fine to use.
  - ''
  options:
  - The tip touched the drape, but it's fine to use.
  - Just wipe the tip off and use it.
  - The tip touched the drape, so I'm opening a new sterile swab.
  answer: The tip touched the drape, so I'm opening a new sterile swab.
  notes:
    The tip touched the drape, but it's fine to use.: 무균이 깨진 면봉을 그대로 쓰면 배양 결과를 믿을 수 없어요.
    Just wipe the tip off and use it.: 닦아도 무균 상태는 되돌릴 수 없어요.
    The tip touched the drape, so I'm opening a new sterile swab.: 닿은 사실을 말하고 새 무균 면봉으로 바꾸는 올바른 대응이에요.
  why: 무균이 깨졌다면 새 무균 면봉으로 바꿔요. 닦아 쓰거나 괜찮다고 넘기지 않아요.
  ko: 끝이 가림포에 닿아서 새 무균 면봉을 열게요
다수 검체 혼동 방지:
- kind: pair
  words:
  - w-label
  - w-specimen
  - w-confirm
  - w-field
  pairs:
  - - one at
    - a time
  - - right
    - away
  - - as soon
    - as it's out
  decoys:
  - on the field
  why: '''one at a time(하나씩)'', ''right away(바로)'', ''as soon as(~하자마자)''는 서로 바꿔 끼울 수 없는 굳은 짝이에요. 검체가 여러 개일 때는 하나씩, 나오자마자 바로 라벨을 붙여 섞이지 않게 해요.'
- kind: context
  words:
  - w-specimen
  word: specimen
  ko: 검체
  scenes:
  - who: 간호사 → 순환간호사
    icon: speech
    en: Let's not mix up these two specimens.
    ok: true
  - who: 차트 기록
    icon: board
    en: 'Two specimens labeled separately: A left, B right.'
    ok: true
  - who: 간호사 → 병리 기사
    icon: pager
    en: I'm sending two specimens, the left one and the other one.
    ok: false
    fix: Specimen A is the left side and specimen B is the right side, each in its own labeled container.
  why: 뜻은 셋 다 '검체'예요. 동료에게는 섞이지 않게 하자고 짧게 말하고, 차트에는 각각 따로 라벨했다고 적어요. 하지만 병리 쪽에 '왼쪽 것과 다른 것'이라고 하면 어느 것이 무엇인지 알 수 없어요. 각 검체의 이름과 쪽을 분명히 알려야 해요.
- kind: swap
  words:
  - w-label
  - w-specimen
  who: 간호사 → 순환간호사 · 다수 검체
  icon: me
  before:
  - ''
  - I'll label them both at the end of the case.
  - ''
  options:
  - I'll label each specimen as it comes off the field.
  - I'll label them both at the end of the case.
  - I'll label one and let the other share it.
  answer: I'll label each specimen as it comes off the field.
  notes:
    I'll label each specimen as it comes off the field.: 나오는 대로 하나씩 라벨하니 어느 것이 어느 것인지 헷갈리지 않아요.
    I'll label them both at the end of the case.: 나중에 몰아서 하면 어느 용기가 어느 조직인지 알 수 없어요.
    I'll label one and let the other share it.: 검체마다 자기 라벨이 있어야 하니 하나를 나눠 쓸 수 없어요.
  why: 검체가 여러 개일 때는 나오는 대로 하나씩 각자 라벨을 붙여요. 나중에 몰아서 하지도, 나눠 쓰지도 않아요.
  ko: 검체가 수술 시야에서 나오는 대로 하나씩 라벨을 붙일게요
margin 방향 보존:
- kind: slider
  words:
  - w-stitch
  - w-mark
  - w-margin
  - w-suture
  cue: The surgeon reaches for scissors right beside the orientation suture.
  scale:
  - I'll just keep working around it.
  - Please leave that suture in place.
  - Cut it, pathology won't need it.
  answerAt: 1
  why: 방향을 표시한 봉합사는 병리과가 절제연의 방향을 알 수 있는 유일한 표지라서 자르지 않고 두라고 말해요. 모른 척 두거나 자르면 방향 정보가 사라져요.
  example: Let's keep the orientation sutures in place.
  exKo: 방향 봉합사는 그대로 유지해요.
- kind: context
  words:
  - w-margin
  word: margin
  ko: 절제연
  scenes:
  - who: 간호사 → 병리 기사
    icon: pager
    en: One of the margins has a stitch somewhere on the edge, probably.
    ok: false
    fix: The long stitch marks the lateral margin and the short stitch marks the superior margin.
  - who: 간호사 → 집도의
    icon: speech
    en: Which stitch marks which margin?
    ok: true
  - who: 차트 기록
    icon: board
    en: Margins marked with sutures per surgeon and noted on requisition.
    ok: true
  why: 뜻은 셋 다 '절제연'이에요. 집도의에게는 어느 땀이 어느 절제연인지 묻고, 차트에는 집도의 설명대로 표시하고 요청서에 적었다고 기록해요. 하지만 병리 쪽에 '가장자리 어딘가 한 땀 있다'고 하면 방향을 알 수 없어요. 어느 땀이 어느 절제연인지 분명히 알려야 해요.
- kind: swap
  words:
  - w-stitch
  - w-margin
  who: 간호사 → 집도의 · 방향 봉합사
  icon: me
  before:
  - ''
  - That stitch doesn't matter, I'll trim it off.
  - ''
  options:
  - That stitch doesn't matter, I'll trim it off.
  - That stitch marks a margin, so I'll leave it in place.
  - That stitch will fall off on its own.
  answer: That stitch marks a margin, so I'll leave it in place.
  notes:
    That stitch doesn't matter, I'll trim it off.: 방향 표시용일 수 있어 함부로 자르면 방향 정보가 사라져요.
    That stitch marks a margin, so I'll leave it in place.: 절제연을 표시한 땀이라는 사실을 알고 그대로 둬요.
    That stitch will fall off on its own.: 봉합사는 저절로 떨어지지 않아요.
  why: 절제연을 표시한 땀은 그대로 둬요. 중요하지 않다며 자르지 않아요.
  ko: 그 땀은 절제연을 표시하니 그대로 둘게요
검체 크기·개수 기록:
- kind: slider
  words:
  - w-size
  - w-count
  - w-form
  - w-piece
  cue: The surgeon sends three small pieces and you're filling out the specimen form.
  scale:
  - Three pieces, with each size on the form.
  - Several small pieces, sizes aren't needed.
  - A few bits, and the lab can count them.
  answerAt: 0
  why: 서식에는 조각 수와 각 조각의 크기를 정확히 적어요. '몇 개쯤'이라고 적거나 검사실이 세어 주길 기대하면 나중에 조각이 빠졌는지 알 수 없어요.
  example: I'll record the size and count on the form.
  exKo: 서식에 크기와 개수를 기록할게요.
- kind: context
  words:
  - w-fragment
  word: fragment
  ko: 단편
  scenes:
  - who: 간호사 → 순환간호사
    icon: speech
    en: Let's confirm there are three fragments before I seal the container.
    ok: true
  - who: 차트 기록
    icon: board
    en: Three fragments received in one container, recorded on the form.
    ok: true
  - who: 간호사 → 병리 기사
    icon: pager
    en: There's a fragment or two in there, or a bunch, I dunno.
    ok: false
    fix: Three fragments are in the container, and each size is listed on the form.
  why: 뜻은 셋 다 '단편'이에요. 동료에게는 밀봉하기 전에 수를 확인하자고 말하고, 차트에는 몇 단편을 서식에 기록했는지 적어요. 하지만 병리 쪽에 '한두 개 아니면 여러 개'라고 하면 단편이 빠져도 알 수 없어요. 정확한 개수와 서식에 적은 크기를 말해요.
- kind: swap
  words:
  - w-count
  - w-piece
  who: 간호사 → 병리 기사 · 조각 수
  icon: me
  before:
  - ''
  - There are a few pieces, give or take.
  - ''
  options:
  - There are a few pieces, give or take.
  - Let pathology tell us how many there are.
  - There are three pieces, and I'm writing the count on the form.
  answer: There are three pieces, and I'm writing the count on the form.
  notes:
    There are a few pieces, give or take.: 정확한 수가 없으면 조각이 빠져도 알 수 없어요.
    Let pathology tell us how many there are.: 보내는 쪽이 먼저 세어 기록해야 빠진 것을 알 수 있어요.
    There are three pieces, and I'm writing the count on the form.: 정확한 수를 말하고 서식에 적어 두니 확인할 수 있어요.
  why: 조각 수는 세어서 정확히 말하고 서식에 적어요. 대충 말하거나 병리과에 세어 달라고 미루지 않아요.
  ko: 세 조각이고 개수는 서식에 적고 있어요
