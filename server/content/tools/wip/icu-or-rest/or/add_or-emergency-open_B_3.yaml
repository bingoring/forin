- title: 시간 압박 무균 유지
  s:
    - {tag: "원칙 선언", icon: shield, why: "Even in a rush로 조건을 먼저 깔고 we protect …로 원칙을 말하면 급해도 양보하지 않는 것이 분명해져요.", decoy: "Even at night", dk: ["급해도 순서는 지켜요.", "밤중에도 무균 영역은 지켜요."], bl: [sterile, quiet, dark, wide]}
    - {tag: "가운 보조", icon: handshake2, why: "Let me …는 제가 해 드릴게요라는 정중한 제안이에요. gown과 glove를 동사로 써서 입히는 동작을 짧게 말해요.", decoy: "mask and cap you", dk: ["제가 조용히 가운과 장갑을 입혀 드릴게요.", "제가 차례로 가운과 장갑을 입혀 드릴게요."], bl: [glove, wrap, wash, tape]}
    - {tag: "주의 안내", icon: faceWorried, why: "Watch your hands는 손이 닿지 않게 조심하라는 짧은 주의예요. 대시 뒤에 I'll guide you in을 붙여 혼자 헤매지 않게 도와 주겠다고 닫아요.", decoy: "your head", dk: ["손 조심하세요 — 제가 가운을 잡아 드릴게요.", "손 조심하세요 — 제가 장갑을 끼워 드릴게요."], bl: [guide, carry, lift, drag]}
    - {tag: "원칙 공유", icon: shield, why: "even when we rush로 같은 원칙을 다른 틀로 말해요. we로 말해 팀 모두의 약속임을 드러내요.", decoy: "the doors", dk: ["급해도 우리는 약속을 지켜요.", "붐벼도 우리는 영역을 지켜요."], bl: [rush, rest, relax, wait]}
    - {tag: "시작 준비", icon: gear, why: "so we can start가 서두르는 목적을 말해 줘요. 서두름이 무균을 해치지 않게 quickly를 쓰되 동작은 정확히 하는 거예요.", decoy: "so you can see", dk: ["시작할 수 있게 바르게 가운을 입혀 드릴게요.", "시작할 수 있게 먼저 가운을 입혀 드릴게요."], bl: [quickly, neatly, gently, slowly]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 시간 압박 무균 유지 4문장 순서
    why: 급해도 무균 영역을 지킨다는 원칙을 먼저 말하고, 그래서 가운 입는 걸 손 조심시키며 안내하고, 가운을 입은 뒤 장갑을 끼우고, 끼운 장갑 손을 앞에 두게 해요. That's why·Once you're gowned·gloved가 앞 줄을 가리켜요.
    lines:
      - {en: "Even in a rush, we protect the sterile field.", icon: shield, ko: "급해도 무균 영역은 지켜요", note: 원칙}
      - {en: "That's why I'll guide you into the gown — watch your hands.", icon: handshake2, ko: "그래서 가운을 입도록 안내할게요 — 손 조심하세요", note: 안내}
      - {en: "Once you're gowned, let me glove you quickly.", icon: gear, ko: "가운을 입으셨으니 제가 빨리 장갑을 끼워 드릴게요", note: 장갑}
      - {en: "Keep your gloved hands in front of you.", icon: faceWorried, ko: "장갑 낀 손은 앞에 두세요", note: 주의}
- title: 다발성 외상 우선순위
  s:
    - {tag: "우선순위", icon: siren, why: "comes first는 가장 먼저 다룬다는 우선순위 표현이에요. 가장 큰 출혈을 문장 첫머리에 두어 판단 기준을 먼저 밝혀요.", decoy: "The brightest light", dk: ["가장 큰 출혈 부위부터 둘이 처치해요.", "가장 큰 출혈 부위부터 서둘러 처치해요."], bl: [bleeding, swelling, bruising, itching]}
    - {tag: "물품 대기", icon: pushpin, why: "have + 물건 + 과거분사는 그렇게 되어 있도록 해 둔다는 뜻이에요. staged로 쓸 순서대로 놓아 두겠다는 사전 준비를 말해요.", decoy: "for each shift", dk: ["두 부상 모두를 위해 물품을 한꺼번에 준비해 둘게요.", "두 부상 모두를 위해 기구를 단계별로 준비해 둘게요."], bl: [staged, boxed, washed, wrapped]}
    - {tag: "순서 묻기", icon: speech, why: "Tell me … and I'll …은 말해 주면 내가 맞춘다는 협조 구조예요. 우선순위 판단은 집도의가 하고 간호사는 거기에 맞춰 준비해요.", decoy: "your gown size", dk: ["원하는 기구를 말씀해 주시면 그에 맞춰 세팅할게요.", "우선순위를 외쳐 주시면 그에 맞춰 세팅할게요."], bl: [priority, size, name, shift]}
    - {tag: "순서 문의", icon: speech, why: "Which …?는 선택지가 정해져 있을 때 쓰는 which 의문문이에요. 어느 쪽을 먼저 처치할지 판단은 집도의에게 묻는 질문이에요.", decoy: "is bleeding", dk: ["어느 환자를 먼저 처치해야 하나요?", "어디 부상을 먼저 처치해야 하나요?"], bl: [injury, floor, shift, order]}
    - {tag: "대기 약속", icon: pushpin, why: "keep + 목적어 + 과거분사로 그 상태를 유지한다는 뜻이에요. 우선순위가 바뀌어도 바로 따라가도록 양쪽을 다 대비해요.", decoy: "for both shifts", dk: ["두 우선순위 모두를 위해 물품을 한 칸에 준비해 둘게요.", "두 우선순위 모두를 위해 물품을 따로따로 준비해 둘게요."], bl: [priorities, positions, quadrants, rotations]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 다발성 외상 우선순위 4문장 순서
    why: 어느 부상이 먼저인지 묻고, 가장 큰 출혈이 먼저라는 답을 받고, 그쪽부터 세팅하고, 그동안 다른 부상 물품도 대기시켜 둬요. Whichever·that one·meanwhile이 앞 줄을 가리켜요.
    lines:
      - {en: "Which injury needs us first?", icon: speech, ko: "어느 부상을 먼저 처치해야 하나요", note: 질문}
      - {en: "Whichever is the biggest bleeding source comes first.", icon: siren, ko: "가장 큰 출혈 부위가 먼저예요", note: 기준}
      - {en: "I'll set up for that one first.", icon: gear, ko: "그쪽부터 세팅할게요", note: 세팅}
      - {en: "I'll keep supplies staged for the other injury meanwhile.", icon: pushpin, ko: "그동안 다른 부상 물품도 대기시켜 둘게요", note: 대기}
- title: 신속 수혈 조율
  s:
    - {tag: "추적 보고", icon: check, why: "tracking … as it goes in은 들어가는 순간마다 따라가며 파악하는 진행형이에요. every unit으로 빠지는 팩이 없음을 약속해요.", decoy: "as it gets labeled", dk: ["나가는 팩 하나하나를 추적하고 있어요.", "들어가는 팩 하나하나를 표로 추적하고 있어요."], bl: [unit, chart, scale, ticket]}
    - {tag: "다음 준비", icon: check, why: "ready when this one's done처럼 조건을 뒤에 붙여 끊김 없이 이어진다고 안심시켜요. this one이 지금 쓰는 쿨러를 가리켜요.", decoy: "if this one's cold", dk: ["이번 것이 끝나면 다음 교대가 준비돼 있어요.", "이번 것이 끝나면 다음 쿨러가 열려 있어요."], bl: [ready, locked, open, closed]}
    - {tag: "총계 호창", icon: mic, why: "call out은 소리 내어 알린다는 구동사예요. as we transfuse로 수혈이 진행되는 내내 반복한다는 뜻을 더해요.", decoy: "the dates", dk: ["수혈하는 동안 시각을 소리 내어 말할게요.", "수혈하는 동안 속도를 소리 내어 말할게요."], bl: [totals, names, labels, prices]}
    - {tag: "기록 약속", icon: pencil, why: "record every unit and the time은 무엇을과 언제를 한 번에 기록한다는 말이에요. 수혈 기록은 몇 번째 팩이 몇 시에 들어갔는지가 핵심이에요.", decoy: "and the cooler color", dk: ["팩 하나하나와 나온 시각을 기록할게요.", "팩 하나하나와 들어간 속도를 기록할게요."], bl: [time, size, brand, cost]}
    - {tag: "총계 질문", icon: speech, why: "Tell me …는 정보를 요청하는 가장 간단한 명령형이에요. so far로 지금까지의 누적을 묻고 있음을 분명히 해요.", decoy: "the total cost", dk: ["지금까지 총 몇 시간인지 말씀해 주세요.", "지금까지 총 몇 명인지 말씀해 주세요."], bl: [total, first, next, last]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신속 수혈 조율 4문장 순서
    why: 들어가는 팩을 추적하고, 팩마다 들어간 시각을 기록하고, 그 기록에서 총계를 소리 내어 말하고, 그 총계를 기록과 맞춰 보라고 해요. each one·that record·my totals가 앞 줄을 가리켜요.
    lines:
      - {en: "I'm tracking every unit as it goes in.", icon: check, ko: "들어가는 팩을 하나하나 추적해요", note: 추적}
      - {en: "I'll record each one with the time it went in.", icon: pencil, ko: "팩마다 들어간 시각을 기록할게요", note: 기록}
      - {en: "I'll call out the totals from that record as we transfuse.", icon: mic, ko: "그 기록으로 총계를 소리 내어 말할게요", note: 호창}
      - {en: "Check my totals against that record anytime.", icon: magnify, ko: "제 총계를 언제든 기록과 맞춰 보세요", note: 대조}
- title: 태아 곤란 신속 분만
  s:
    - {tag: "준비 보고", icon: siren, why: "대시 앞에 상황, 뒤에 내 준비 상태를 붙여 무슨 일이 벌어졌고 나는 바로 움직일 수 있다를 한 문장에 담아요. ready to go는 즉시 시작 가능하다는 관용 표현이에요.", decoy: "is being charted", dk: ["태아 심박수가 떨어지고 있어요 — 저는 가운을 입었어요.", "태아 심박수가 떨어지고 있어요 — 저는 손을 씻었어요."], bl: [dropping, rising, steady, normal]}
    - {tag: "대기 보고", icon: check, why: "standing by는 호출만 기다리며 준비해 둔 상태라는 병원 표현이에요. 두 대상을 and로 묶어 한 번에 상태를 보고해요.", decoy: "are in the hall", dk: ["워머와 신생아팀이 이동 중이에요.", "카트와 신생아팀이 대기 중이에요."], bl: [neonatal, adult, dental, geriatric]}
    - {tag: "준비 안내", icon: check, why: "Everything you need는 필요한 건 전부를 한 덩어리로 말해 요청 전에 안심시켜요. right here로 위치까지 짚어 찾을 필요가 없게 해요.", decoy: "on the counter", dk: ["봉합에 필요한 모든 것이 바로 여기 있어요.", "분만에 필요한 모든 기구가 바로 여기 있어요."], bl: [deliver, transfer, discharge, admit]}
    - {tag: "요청 약속", icon: pager, why: "I'll call for …는 제가 불러 올게요라는 즉각적인 약속이에요. right now로 지금 바로임을 분명히 해요.", decoy: "for the delivery tray", dk: ["지금 바로 신생아팀을 크게 요청할게요.", "지금 바로 신생아팀을 직접 요청할게요."], bl: [team, tray, room, floor]}
    - {tag: "분만 제안", icon: siren, why: "again으로 이미 한 번 떨어졌음을 환기해 판단 근거를 보여 줘요. let's deliver now는 제안형이라 분만 결정은 집도의에게 맡기는 말투예요.", decoy: "Her blood pressure dropped", dk: ["심박수가 두 번 떨어졌어요 — 지금 분만합시다.", "심박수가 다시 떨어졌어요 — 분만 전에 준비해요."], bl: [dropped, rose, held, jumped]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 태아 곤란 신속 분만 4문장 순서
    why: 상황과 내 준비를 알리고, 그에 따라 신생아팀을 부르고, 그 팀과 워머가 대기 중이라고 알리고, 다시 떨어진 심박수에 분만을 제안해요. With that·The team I called·all of that이 앞 줄을 가리켜요.
    lines:
      - {en: "Fetal heart rate is dropping — I'm ready to go.", icon: siren, ko: "태아 심박수가 떨어지고 있어요 — 준비됐어요", note: 보고}
      - {en: "With that, I'll call for the neonatal team right now.", icon: pager, ko: "그래서 지금 바로 신생아팀을 요청할게요", note: 요청}
      - {en: "The team I called and the warmer are standing by.", icon: check, ko: "부른 팀과 워머가 대기 중이에요", note: 대기}
      - {en: "Her heart rate dropped again — with all of that standing by, let's deliver now.", icon: siren, ko: "심박수가 다시 떨어졌어요 — 다 대기 중이니 지금 분만합시다", note: 제안}
- title: 응급 검체·계수 관리
  s:
    - {tag: "검체 표시", icon: lab, why: "labeling each specimen as it comes off는 나오는 즉시 한 개씩 이름을 붙인다는 뜻이에요. 나중에 몰아서 하면 섞일 위험이 있어요.", decoy: "as it dries", dk: ["검체가 들어올 때마다 표시하고 있어요.", "검체가 나올 때마다 손으로 표시하고 있어요."], bl: [specimen, sponge, needle, glove]}
    - {tag: "계수 기록", icon: pencil, why: "despite the pace는 속도에도 불구하고라는 뜻이에요. documented는 문서로 남긴이라는 수동태라 바쁜 와중에도 기록이 이어짐을 말해요.", decoy: "despite the noise", dk: ["속도가 빨라도 진행 중인 계수는 저장되고 있어요.", "속도가 빨라도 진행 중인 계수는 공유되고 있어요."], bl: [Running, Opening, Final, Closing]}
    - {tag: "대조 예고", icon: check, why: "full reconciliation은 기준 계수와 현재 계수를 전부 맞춘다는 뜻이에요. before closing으로 마지막 점검 시점을 정해요.", decoy: "a final photo", dk: ["봉합 전에 전체 재고 확인을 할게요.", "봉합 전에 전체 대조 확인을 함께 할게요."], bl: [reconciliation, presentation, observation, orientation]}
    - {tag: "표시 약속", icon: lab, why: "the moment it comes off는 나오는 바로 그 순간이라는 관용 표현이에요. 나중으로 미루지 않고 즉시 표시한다는 약속이에요.", decoy: "every tray", dk: ["검체가 나오는 순간마다 세 번 표시할게요.", "검체가 들어오는 순간마다 표시할게요."], bl: [moment, reason, place, size]}
    - {tag: "기록 유지", icon: pencil, why: "no matter …는 와 상관없이라는 뜻이에요. 속도가 빨라져도 계수 기록이 끊기지 않게 하자는 팀 약속을 Let's로 제안해요.", decoy: "no matter the shift", dk: ["속도와 상관없이 검체 목록을 계속 기록합시다.", "속도와 상관없이 시각을 계속 기록합시다."], bl: [pace, table, tray, price]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 응급 검체·계수 관리 4문장 순서
    why: 검체를 나오는 대로 표시하고, 계수도 같은 방식으로 기록하고, 봉합 전에 둘을 대조하고, 맞지 않으면 닫기 전에 보고해요. the same way·both·Anything that doesn't match가 앞 줄을 가리켜요.
    lines:
      - {en: "I'm labeling each specimen as it comes off.", icon: lab, ko: "검체가 나올 때마다 표시하고 있어요", note: 표시}
      - {en: "The running count is documented the same way despite the pace.", icon: pencil, ko: "계수도 속도와 상관없이 같은 방식으로 기록돼요", note: 기록}
      - {en: "We'll do a full reconciliation of both at closing.", icon: check, ko: "봉합 때 둘을 전체 대조할게요", note: 대조}
      - {en: "Anything that doesn't match gets reported before we close.", icon: bell, ko: "맞지 않는 건 닫기 전에 보고해요", note: 보고}
