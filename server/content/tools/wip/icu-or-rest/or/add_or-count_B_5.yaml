situations:
- title: X선 잔류 거즈 확인
  s:
  - ["영상 요청", monitor, "'Let's get'은 함께 요청하는 말이고, 'get an X-ray'는 영상을 찍는다는 일상 표현이에요. 'before we close'는 닫기 전에 해야 한다는 시점이에요.", "for the record", "닫기 전에 조명을 맞춰요.", "닫기 전에 흡인기를 닦아요.", "X-ray", "ECG", "MRI", "EEG"]
  - ["영상 목적", magnify, "'to rule out'은 가능성을 하나씩 지워 나간다는 뜻이라 없다는 것을 확인하려는 목적을 말해요. 'retained'는 몸 안에 남아 있다는 뜻이에요.", "a loose tooth", "출혈 원인을 찾으려고 필드를 영상으로 찍어요.", "감염 여부를 보려고 필드를 영상으로 찍어요.", "retained", "extra", "wet", "damaged"]
  - ["영상 판독", monitor, "'needs to confirm'은 그 부서의 판독이 있어야 끝난다는 뜻이에요. 'nothing's left inside'는 몸 안에 아무것도 남지 않았다는 부정 표현이에요.", "to eat", "영상의학과에서 방 안에 아무것도 안 남았는지 확인해야 해요.", "영상의학과에서 통에 아무것도 안 남았는지 확인해야 해요.", "inside", "outside", "upstairs", "nearby"]
  - ["영상 판독", monitor, "'will show'는 영상이 근거가 된다는 미래형 확신이에요. 'if anything was left behind'의 if는 '~인지 아닌지'라는 뜻이에요.", "overnight", "엑스선을 보면 뭔가 부러졌는지 알 수 있어요.", "엑스선을 보면 뭔가 막혔는지 알 수 있어요.", "X-ray", "alarm", "chart", "camera"]
  - ["결과 대기", monitor, "'wait for'는 결과가 올 때까지 움직이지 않는다는 뜻이에요. 'before we proceed'는 다음 단계로 넘어가기 전이라는 시점이에요.", "the coffee", "영상 촬영이 끝날 때까지 기다린 뒤 진행해요.", "영상 장비가 도착할 때까지 기다린 뒤 진행해요.", "proceed", "leave", "finish", "relax"]
  order:
