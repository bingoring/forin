    - ["While everyone stays still, let's search the field, drapes, and floor systematically.", magnify, "모두 가만히 있는 동안 필드와 소독포, 바닥을 체계적으로 수색해요", "수색"]
    - ["If it's not there, check every corner of the room carefully.", magnify, "거기 없으면 방 구석구석을 조심스럽게 확인해요", "확대"]
- title: 봉합 후 계수 오류
  s:
  - ["최종 오류", siren, "'may need to'는 아직 확정이 아니라 가능성으로 말해 상대가 놀라지 않게 해요. 'reopen'은 're-'가 붙어 이미 닫은 것을 다시 연다는 뜻이에요.", "is heavy", "최종 계수가 틀렸어요 — 다시 닦아야 할 수도 있어요.", "최종 계수가 틀렸어요 — 다시 서명해야 할 수도 있어요.", "wrong", "light", "loud", "empty"]
  - ["영상 우선", monitor, "'Let's image'는 'image'를 동사로 써서 영상으로 찍는다는 뜻이에요. 'before deciding'은 결정 전에 근거부터 확인한다는 순서예요.", "the budget", "재개방 탐색을 설명하기 전에 영상부터 찍어요.", "재개방 탐색을 기록하기 전에 영상부터 찍어요.", "image", "vote", "argue", "rest"]
  - ["즉시 보고", pager, "'escalate'는 문제를 윗사람에게 올린다는 뜻이라 혼자 해결하지 않고 책임자에게 넘겨요. 'immediately'는 미루지 않는다는 뜻이에요.", "to the window", "지금 바로 집도의의 지시를 적을게요.", "지금 바로 집도의의 답을 기다릴게요.", "immediately", "eventually", "gradually", "occasionally"]
  - ["숫자 불일치", siren, "'don't add up'은 합이 맞지 않는다는 관용구예요. 'after closure'는 이미 닫은 뒤라는 점이 문제를 무겁게 만들어요.", "in the report", "봉합 후 시간이 맞지 않아요.", "봉합 후 서류가 맞지 않아요.", "numbers", "doors", "colors", "walls"]
  - ["호출", pager, "'calling … back'은 이미 나간 사람을 다시 부른다는 뜻이에요. 'into the room'은 목적지를 말해 수술 방으로 돌아오라는 뜻이에요.", "the elevator", "집도의를 다시 복도로 불러올게요.", "집도의를 다시 대기실로 불러올게요.", "room", "lobby", "office", "garage"]
  order:
