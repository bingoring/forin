    lines:
    - ["The final count is wrong — we may need to reopen.", siren, "최종 계수가 틀렸어요 — 다시 열어야 할 수도 있어요", "오류"]
    - ["I'm escalating this to the surgeon immediately.", pager, "지금 바로 집도의에게 상급 보고할게요", "보고"]
