    - ["Once he's back in the room, we decide together.", check, "그가 방으로 돌아오면 함께 결정해요", "결정"]
- title: 이물 잔류 의심 보고
  s:
  - ["잔류 의심", siren, "'possible'은 아직 확정은 아니라는 단서라 확인되기 전까지 단정하지 않아요. 'I'm documenting it'은 지금 기록하고 있다는 진행 표현이에요.", "a possible heavy object", "오염 가능성이 있어요 — 문서화할게요.", "누출 가능성이 있어요 — 문서화할게요.", "retained", "sharp", "spare", "sterile"]
  - ["사건 보고", pencil, "'file'은 공식 서류로 제출한다는 뜻이에요. 'incident report'는 환자 안전 사건을 병원 시스템에 남기는 보고서예요.", "yesterday", "즉시 사건 보고서를 인쇄해야 해요.", "즉시 사건 보고서를 복사해야 해요.", "file", "print", "copy", "mail"]
  - ["안전 우선", shield, "'comes first'는 순서상 가장 앞에 둔다는 뜻이라 다른 사정보다 환자 안전이 먼저라고 말해요. 대시 뒤 'I'm reporting this'로 그 원칙을 행동으로 이어요.", "Patient lunch", "환자 편안함이 우선이에요 — 이걸 보고할게요.", "환자 비밀이 우선이에요 — 이걸 보고할게요.", "reporting", "moving", "weighing", "sorting"]
  - ["절차 준수", shield, "'follow the protocol'은 정해진 절차를 그대로 따른다는 뜻이라 임의로 판단하지 않는다는 걸 보여 줘요. 'retained item'은 몸에 남은 물품이에요.", "the recipe", "오염 물품에 대한 절차를 따르고 있어요.", "파손 물품에 대한 절차를 따르고 있어요.", "retained", "damaged", "expired", "borrowed"]
  - ["후속 검사", monitor, "'request'는 직접 하지 않고 담당 부서에 요청한다는 뜻이에요. 'follow-up'은 처음 검사 뒤에 이어지는 추가 검사를 가리켜요.", "a follow-up lunch", "후속 스캔 안내문을 요청해줘요.", "환자를 위한 후속 스캔 동의서를 요청해줘요.", "follow-up", "initial", "routine", "private"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이물 잔류 의심 보고 4문장 순서
    why: 잔류 가능성을 기록하겠다고 하고, 안전이 우선이라 보고하고, 그에 따라 사건 보고서를 내고, 서류가 들어가면 후속 스캔을 요청해요.
    lines:
    - ["This is a possible retained object — I'm documenting it.", siren, "잔류 이물일 가능성이 있어요 — 문서화할게요", "의심"]
    - ["Patient safety comes first — I'm reporting this.", shield, "환자 안전이 우선이에요 — 이걸 보고할게요", "보고"]
    - ["As part of that, we need to file an incident report immediately.", pencil, "그 일환으로 즉시 사건 보고서를 제출해야 해요", "서류"]
    - ["Please request a follow-up scan for the patient once it's filed.", monitor, "그게 제출되면 환자를 위한 후속 스캔을 요청해줘요", "후속"]
- title: 계수 불일치 은폐 압력
  s:
  - ["은폐 거부", shield, "'can't ignore'는 하고 싶지 않다가 아니라 할 수 없다는 단호한 거절이에요. 대시 뒤에 'patient safety is first'로 이유를 한마디로 대요.", "a joke", "불일치를 무시할 수 없어요 — 환자 가족이 우선이에요.", "불일치를 무시할 수 없어요 — 환자 안내가 우선이에요.", "ignore", "explain", "measure", "predict"]
  - ["제대로 처리", pencil, "'have to'는 선택이 아니라 의무를 말해요. 'document and resolve'는 기록과 해결을 한 짝으로 묶어 둘 다 필요하다고 말해요.", "this politely", "이걸 차분히 문서화하고 해결해야 해요.", "이걸 천천히 문서화하고 해결해야 해요.", "properly", "quickly", "lightly", "briefly"]
  - ["서명 거부", pencil, "'won't'는 'can't'보다 의지를 담은 거절이에요. 'sign off'는 서명으로 공식 확인하는 일이라 맞을 때까지 미루겠다는 뜻이에요.", "until the coffee", "서류가 맞을 때까지 서명하지 않을게요.", "시간이 맞을 때까지 서명하지 않을게요.", "correct", "empty", "loud", "slow"]
  - ["압박 거절", shield, "'I understand'로 상대 사정을 먼저 인정한 뒤 'but'으로 거절하면 공격적으로 들리지 않아요. 'won't skip'은 의지를 담아 단호하게 거절해요.", "we're running low", "늦어지는 건 알지만 이건 반복하지 않을게요.", "늦어지는 건 알지만 이건 취소하지 않을게요.", "skip", "cancel", "rename", "print"]
  - ["즉시 수정", check, "'Let's fix it now'는 같이 지금 바로잡자는 제안이에요. 'so we can close safely'는 목적을 붙여 왜 지금 해야 하는지를 보여 줘요.", "lift safely", "편하게 닫을 수 있게 지금 바로잡아요.", "깔끔하게 닫을 수 있게 지금 바로잡아요.", "safely", "quickly", "gently", "neatly"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 계수 불일치 은폐 압력 4문장 순서
    why: 계수가 안 맞는데 시간이 촉박하다고 말하고, 정중히 인정하되 맞을 때까지 서명하지 않겠다고 거절한 뒤, 제대로 처리하자고 하고 지금 바로잡아요.
    lines:
    - ["The count is off, but we're already running late.", siren, "계수가 안 맞는데 이미 늦어지고 있어요", "상황"]
    - ["I understand, but I won't sign off until the count is correct.", pencil, "알지만 계수가 맞을 때까지 서명하지 않을게요", "거절"]
    - ["We have to document and resolve this properly.", pencil, "이걸 제대로 문서화하고 해결해야 해요", "원칙"]
    - ["Let's fix it now so we can close safely.", check, "안전하게 닫을 수 있게 지금 바로잡아요", "수정"]
