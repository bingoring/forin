    - ["Radiology needs to confirm nothing's left inside.", monitor, "영상의학과에서 안에 아무것도 안 남았는지 확인해야 해요", "판독"]
    - ["We wait for that answer before we proceed.", check, "그 답이 나올 때까지 기다린 뒤 진행해요", "대기"]
- title: 소실 바늘 필드 수색
  s:
  - ["정지 선언", siren, "'hold everything'은 모든 작업을 멈추라는 강한 명령이에요. 'one needle short'는 바늘이 하나 모자란다는 정확한 보고예요.", "one bucket", "바늘이 두 개 부족해요 — 전부 멈춰요.", "바늘이 세 개 부족해요 — 전부 멈춰요.", "hold", "move", "carry", "pack"]
  - ["체계적 수색", magnify, "'systematically'는 구역을 정해 빠짐없이 차례로 본다는 뜻이에요. 쉼표로 필드·소독포·바닥을 나열해 수색 범위를 정해 줘요.", "randomly", "필드와 소독포, 바닥을 빠르게 수색해요.", "필드와 소독포, 바닥을 각자 수색해요.", "floor", "ceiling", "window", "shelf"]
  - ["이동 금지", siren, "'Nobody'는 주어 자체가 부정이라 예외가 없다는 뜻이에요. 'until we find it'는 찾는 것을 풀리는 조건으로 걸어요.", "until we leave", "마칠 때까지 아무도 움직이지 않아요.", "부를 때까지 아무도 움직이지 않아요.", "until", "after", "unless", "since"]
  - ["구석 확인", magnify, "'every corner'는 구석까지 하나도 빼지 않는다는 비유적 범위 표현이에요. 'carefully'는 서두르지 않고 주의해서 본다는 뜻이에요.", "of the ceiling", "홀 구석구석을 조심스럽게 확인해요.", "창고 구석구석을 조심스럽게 확인해요.", "corner", "shelf", "drawer", "wall"]
  - ["동작 정지", siren, "'turns up'은 찾던 것이 불쑥 나타난다는 구동사예요. 'all movement'는 사람과 물건의 이동까지 모두 가리켜요.", "until the rain", "교대가 올 때까지 모든 움직임을 멈춰요.", "의사가 올 때까지 모든 움직임을 멈춰요.", "needle", "doctor", "nurse", "pager"]
