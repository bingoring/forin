situations:
- title: 응급 세팅 신속 준비
  sentences:
  - en: Let's get the room set up as fast as we can.
    ko: 우리가 할 수 있는 한 빨리 방을 세팅합시다.
    chunks:
    - Let's get
    - the room
    - set up
    - as fast as we can
    - .
    words:
    - w-room
    - w-set
    - w-fast
    goal: 1
    tag: 신속 요청
    icon: siren
    why: Let's로 함께 하자고 제안해 팀을 다그치지 않고, as fast as we can로 속도를 분명히 해요.
    decoy: the back table
    distractorsKo:
    - 우리가 할 수 있는 한 꼼꼼히 방을 세팅합시다.
    - 우리가 할 수 있는 한 깔끔히 방을 세팅합시다.
    blank:
      answer: room
      options:
      - en: room
      - en: ward
      - en: clinic
      - en: lab
  - en: I'm opening the basic emergency setup now.
    ko: 지금 기본 응급 세팅을 개봉하고 있어요.
    chunks:
    - I'm opening
    - the basic emergency setup
    - now
    - .
    words:
    - w-open
    - w-basic
    - w-emergency
    - w-setup
    goal: 1
    tag: 세트 개봉
    icon: gear
    why: I'm opening은 진행형이라 지금 손이 움직이고 있음을 알려요. basic으로 꼭 필요한 세트부터 연다는 범위를 밝혀요.
    decoy: the standard tray cover
    distractorsKo:
    - 지금 큰 응급 세팅을 개봉하고 있어요.
    - 지금 기본 외래 세팅을 개봉하고 있어요.
    blank:
      answer: emergency
      options:
      - en: routine
      - en: elective
      - en: emergency
      - en: outpatient
  - en: Tell me what you need first and I'll grab it.
    ko: 먼저 뭐가 필요한지 말씀해 주시면 제가 가져올게요.
    chunks:
    - Tell me
    - what you need
    - first
    - and I'll grab it
    - .
    words:
    - w-need
    - w-first
    - w-grab
    goal: 2
    tag: 필요 묻기
    icon: speech
    why: Tell me … first로 순서를 상대에게 맡기고, I'll grab it으로 가져오는 일을 내가 맡겠다고 해요.
    decoy: which gown you wear
    distractorsKo:
    - 먼저 뭐가 필요한지 말씀해 주시면 제가 빌려 올게요.
    - 먼저 몇 개가 필요한지 말씀해 주시면 제가 가져올게요.
    blank:
      answer: grab
      options:
      - en: grab
      - en: sterilize
      - en: borrow
      - en: return
  - en: We need everything ready in a few minutes.
    ko: 몇 분 안에 전부 준비돼야 해요.
    chunks:
    - We need
    - everything ready
    - in a few minutes
    - .
    words:
    - w-need
    - w-ready
    - w-minute
    goal: 1
    tag: 기한 알림
    icon: bell
    why: 마감을 숫자 대신 a few minutes로 말해, 급하지만 공황을 만들지 않고 목표 시간을 분명히 해요.
    decoy: with the sterile covers
    distractorsKo:
    - 몇 분 안에 전부 포장돼야 해요.
    - 몇 분 안에 전부 분류돼야 해요.
    blank:
      answer: ready
      options:
      - en: sealed
      - en: labeled
      - en: ready
      - en: folded
  - en: I'll bring extra basins and drapes right away.
    ko: 여분의 대야와 드레이프를 바로 가져올게요.
    chunks:
    - I'll bring
    - extra basins
    - and drapes
    - right away
    - .
    words:
    - w-bring
    - w-extra
    - w-basin
    - w-drape
    goal: 2
    tag: 추가 준비
    icon: pushpin
    why: I'll bring … right away는 말이 끝나자마자 움직이겠다는 약속이에요. extra는 지금 있는 것 말고 더 얹는다는 뜻이에요.
    decoy: extra stools
    distractorsKo:
    - 여분의 대야와 가운을 바로 가져올게요.
    - 여분의 장갑과 드레이프를 바로 가져올게요.
    blank:
      answer: drapes
      options:
      - en: drapes
      - en: pillows
      - en: mattresses
      - en: stretchers
  order:
    tag: 대화 흐름
    icon: compass
    ko: 응급 세팅 준비 4문장 순서
    why: 요청으로 시작해, 그 요청에 맞춰 세트를 열고, 세트 밖에 더 필요한 것을 묻고, 말한 것을 가져오는 순서예요. 뒤 줄이 앞 줄을 가리키는 말(for that·beyond that·whatever you name)로 이어져요.
    lines:
    - en: Let's get the room set up as fast as we can.
      icon: siren
      ko: 빨리 방을 세팅합시다
      note: 요청
    - en: I'm opening the basic emergency setup for that now.
      icon: gear
      ko: 그걸 위해 기본 응급 세팅을 개봉해요
      note: 개봉
    - en: Tell me what else you need beyond that setup.
      icon: speech
      ko: 그 세팅 말고 또 필요한 걸 말씀해 주세요
      note: 질문
    - en: Whatever you name, I'll bring it with extra drapes right away.
      icon: pushpin
      ko: 말씀하신 걸 여분의 드레이프와 바로 가져올게요
      note: 약속
- title: 응급 기구 세트 개방
  sentences:
  - en: Opening the emergency lap set now.
    ko: 지금 응급 개복 세트를 개봉하고 있어요.
    chunks:
    - Opening
    - the emergency lap set
    - now
    - .
    words:
    - w-open
    - w-emergency
    goal: 1
    tag: 세트 개봉
    icon: gear
    why: I를 줄인 -ing 문장이라 손을 움직이며 하는 현장 말투가 돼요. now로 지금 진행 중임을 알려요.
    decoy: a sterile table cover
    distractorsKo:
    - 지금 표준 개복 세트를 개봉하고 있어요.
    - 지금 소형 개복 세트를 개봉하고 있어요.
    blank:
      answer: lap
      options:
      - en: chest
      - en: lap
      - en: eye
      - en: hand
  - en: Major instruments are up and counted.
    ko: 주요 기구가 준비됐고 계수도 됐어요.
    chunks:
    - Major instruments
    - are up
    - and counted
    - .
    words:
    - w-major
    - w-instrument
    - w-up
    - w-count
    goal: 1
    tag: 계수 보고
    icon: check
    why: up은 펼쳐져 쓸 수 있는 상태를 뜻해요. counted를 함께 말해 개복 전에 기구 수를 맞춰 봤다는 점을 빠뜨리지 않아요.
    decoy: and labeled
    distractorsKo:
    - 작은 기구가 준비됐고 계수도 됐어요.
    - 주요 기구가 준비됐고 보관도 됐어요.
    blank:
      answer: counted
      options:
      - en: boxed
      - en: stacked
      - en: moved
      - en: counted
  - en: What else do you want opened for backup?
    ko: 백업용으로 또 뭘 열어 두길 원하세요?
    chunks:
    - What else
    - do you want opened
    - for backup
    - '?'
    words:
    - w-else
    - w-want
    - w-open
    - w-backup
    goal: 2
    tag: 백업 묻기
    icon: speech
    why: do you want opened로 열 물건을 상대가 정하게 해요. for backup이 목적을 밝혀 질문이 짧게 끝나요.
    decoy: for the next case
    distractorsKo:
    - 교체용으로 또 뭘 열어 두길 원하세요?
    - 백업용으로 또 몇 개 열어 두길 원하세요?
    blank:
      answer: opened
      options:
      - en: folded
      - en: opened
      - en: wrapped
      - en: stacked
  - en: I'll open the backup tray in case we need it.
    ko: 필요할 경우를 대비해 백업 트레이를 열어 둘게요.
    chunks:
    - I'll open
    - the backup tray
    - in case
    - we need it
    - .
    words:
    - w-open
    - w-backup
    - w-tray
    - w-need
    goal: 2
    tag: 백업 개봉
    icon: gear
    why: in case는 지금 쓰지는 않지만 미리 대비한다는 표현이에요. 바로 열지 않고 열어 둔다는 점까지 알려요.
    decoy: as we count it
    distractorsKo:
    - 필요할 경우를 대비해 백업 가운을 열어 둘게요.
    - 필요할 경우를 대비해 백업 대야를 열어 둘게요.
    blank:
      answer: tray
      options:
      - en: gown
      - en: basin
      - en: bin
      - en: tray
  - en: The major set is fully counted and ready to go.
    ko: 주요 세트는 계수가 끝났고 진행할 준비가 됐어요.
    chunks:
    - The major set
    - is fully counted
    - and ready
    - to go
    - .
    words:
    - w-major
    - w-count
    - w-ready
    - w-go
    goal: 1
    tag: 준비 보고
    icon: check
    why: ready to go는 바로 진행해도 된다는 관용 표현이에요. fully counted를 앞에 두어 준비의 근거를 먼저 말해요.
    decoy: is neatly stacked
    distractorsKo:
    - 작은 세트는 계수가 끝났고 진행할 준비가 됐어요.
    - 주요 세트는 포장이 끝났고 진행할 준비가 됐어요.
    blank:
      answer: fully
      options:
      - en: partly
      - en: fully
      - en: quickly
      - en: loosely
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기구 세트 개방 4문장 순서
    why: 세트를 열고, 그 세트의 계수를 보고한 뒤, 그 계수를 마친 상태에서 백업을 묻고, 고른 것을 바로 여는 순서예요. 뒤 줄이 앞 줄의 세트·계수·답을 가리켜요.
    lines:
    - en: Opening the emergency lap set now.
      icon: gear
      ko: 응급 개복 세트를 개봉해요
