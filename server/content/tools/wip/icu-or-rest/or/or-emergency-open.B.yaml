situations:
- title: 응급 세팅 신속 준비
  sentences:
  - en: Let's get the room set up as fast as we can.
    ko: 우리가 할 수 있는 한 빨리 방을 세팅합시다.
    chunks:
    - Let's get
    - the room
    - set up
    - as fast as we can
    - .
    words:
    - w-room
    - w-set
    - w-fast
    goal: 1
    tag: 신속 요청
    icon: siren
    why: Let's로 함께 하자고 제안해 팀을 몰아붙이지 않으면서, as fast as we can으로 속도를 분명히 해요.
    decoy: as far as we can
    distractorsKo:
    - 우리가 할 수 있는 한 조용히 방을 세팅합시다.
    - 우리가 할 수 있는 한 깨끗이 방을 세팅합시다.
    blank:
      answer: fast
      options:
      - en: fast
      - en: quiet
      - en: clean
      - en: neat
  - en: I'm opening the basic emergency setup now.
    ko: 지금 기본 응급 세팅을 개봉하고 있어요.
    chunks:
    - I'm opening
    - the basic emergency setup
    - now
    - .
    words:
    - w-open
    - w-basic
    - w-emergency
    - w-setup
    goal: 1
    tag: 개봉 알림
    icon: gear
    why: I'm opening은 지금 하고 있는 일을 알리는 말이라, 옆 사람이 같은 세트를 또 열지 않게 해요.
    decoy: the back-table cover
    distractorsKo:
    - 지금 추가 응급 세팅을 개봉하고 있어요.
    - 지금 기본 멸균 세팅을 개봉하고 있어요.
    blank:
      answer: emergency
      options:
      - en: emergency
      - en: routine
      - en: elective
      - en: outpatient
  - en: Tell me what you need first and I'll grab it.
    ko: 먼저 뭐가 필요한지 말씀해 주시면 제가 가져올게요.
    chunks:
    - Tell me
    - what you need
    - first
    - and I'll grab it
    - .
    words:
    - w-need
    - w-first
    - w-grab
    goal: 2
    tag: 요청 받기
    icon: speech
    why: Tell me … and I'll …은 요청과 바로 실행을 한 문장에 묶어, 상대가 설명 없이 필요한 것만 말하게 해요.
    decoy: what they ordered
    distractorsKo:
    - 뭐가 더 필요한지 말씀해 주시면 제가 가져올게요.
    - 먼저 뭐가 필요한지 말씀해 주시면 제가 나눠 드릴게요.
    blank:
      answer: first
      options:
      - en: first
      - en: last
      - en: twice
      - en: often
  - en: We need everything ready in a few minutes.
    ko: 몇 분 안에 전부 준비돼야 해요.
    chunks:
    - We need
    - everything ready
    - in a few minutes
    - .
    words:
    - w-need
    - w-ready
    - w-minute
    goal: 1
    tag: 준비 기한
    icon: bell
    why: in a few minutes로 기한을 몇 분으로 못 박아, 얼마나 급한지와 준비 범위(everything)를 함께 전해요.
    decoy: for a few patients
    distractorsKo:
    - 몇 분 안에 전부 정리돼야 해요.
    - 몇 분 안에 전부 보관돼야 해요.
    blank:
      answer: ready
      options:
      - en: ready
      - en: dirty
      - en: packed
      - en: stored
  - en: I'll bring extra basins and drapes right away.
    ko: 여분의 대야와 드레이프를 바로 가져올게요.
    chunks:
    - I'll bring
    - extra basins
    - and drapes
    - right away
    - .
    words:
    - w-bring
    - w-extra
    - w-basin
    - w-drape
    goal: 2
    tag: 물품 보충
    icon: pushpin
    why: right away는 지금 바로라는 뜻이고, extra를 붙여 기본 분량 위에 더 얹어 가져오겠다는 약속이 돼요.
    decoy: and spare towels
    distractorsKo:
    - 새 대야와 드레이프를 바로 가져올게요.
    - 여분의 대야와 가운을 바로 가져올게요.
    blank:
      answer: extra
      options:
      - en: extra
      - en: used
      - en: soiled
      - en: torn
  order:
    tag: 대화 흐름
    icon: compass
    ko: 응급 세팅 준비 4문장 순서
    why: 요청으로 시작해, 그 요청에 맞춰 세트를 열고, 세트 밖에 더 필요한 것을 묻고, 그 답을 받아 가져오는 순서예요. 뒤 줄이 앞 줄을 가리키는 말(that·beyond that)로 이어져요.
    lines:
    - en: Let's get the room set up as fast as we can.
      icon: siren
      ko: 우리가 할 수 있는 한 빨리 방을 세팅합시다
      note: 요청
    - en: I'm opening the basic emergency setup for that now.
      icon: gear
      ko: 그걸 위해 지금 기본 응급 세팅을 개봉하고 있어요
      note: 개봉
    - en: Tell me what else you need beyond that setup.
      icon: speech
      ko: 그 세팅 말고 또 뭐가 필요한지 말씀해 주세요
      note: 질문
    - en: I'll bring that and extra drapes right away.
      icon: pushpin
      ko: 그것과 여분의 드레이프를 바로 가져올게요
      note: 가져옴
- title: 응급 기구 세트 개방
  sentences:
  - en: Opening the emergency lap set now.
    ko: 지금 응급 개복 세트를 개봉하고 있어요.
    chunks:
    - Opening
    - the emergency lap set
    - now
    - .
    words:
    - w-open
    - w-emergency
    goal: 1
    tag: 세트 개봉
    icon: gear
    why: Opening처럼 주어를 줄이면 손을 쓰면서 짧게 알릴 수 있어요. 지금 열고 있다는 사실이 핵심이에요.
    decoy: the instrument stand
    distractorsKo:
    - 지금 기본 개복 세트를 개봉하고 있어요.
    - 지금 새 개복 세트를 개봉하고 있어요.
    blank:
      answer: lap
      options:
      - en: lap
      - en: hand
      - en: spine
      - en: eye
  - en: Major instruments are up and counted.
    ko: 주요 기구가 준비됐고 계수도 됐어요.
    chunks:
    - Major instruments
    - are up
    - and counted
    - .
    words:
    - w-major
    - w-instrument
    - w-up
    - w-count
    goal: 1
    tag: 준비 보고
    icon: check
    why: 준비됐다(are up)와 계수됐다(counted)를 한 문장에 묶어, 기구가 쓸 수 있고 빠짐없이 센 상태임을 함께 보고해요.
    decoy: and sterilized
    distractorsKo:
    - 작은 기구가 준비됐고 계수도 됐어요.
    - 주요 기구가 열렸고 계수도 됐어요.
    blank:
      answer: counted
      options:
      - en: counted
      - en: boxed
      - en: dated
      - en: moved
  - en: What else do you want opened for backup?
    ko: 백업용으로 또 뭘 열어 두길 원하세요?
    chunks:
    - What else
    - do you want opened
    - for backup
    - '?'
    words:
    - w-else
    - w-want
    - w-open
    - w-backup
    goal: 2
    tag: 추가 요청
    icon: speech
    why: What else do you want …?는 열어 둘 것을 상대가 직접 정하게 하는 열린 질문이에요. opened는 '열린 상태로 둔다'는 수동이에요.
    decoy: for tonight
    distractorsKo:
    - 교체용으로 또 뭘 열어 두길 원하세요?
    - 백업용으로 또 몇 개 열어 두길 원하세요?
    blank:
      answer: backup
      options:
      - en: backup
      - en: cleanup
      - en: display
      - en: inventory
  - en: I'll open the backup tray in case we need it.
    ko: 필요할 경우를 대비해 백업 트레이를 열어 둘게요.
    chunks:
    - I'll open
    - the backup tray
    - in case
    - we need it
    - .
    words:
    - w-open
    - w-backup
    - w-tray
    - w-need
    goal: 2
    tag: 예비 개방
    icon: shield
    why: in case we need it은 지금 필요해서가 아니라 대비임을 밝히는 틀이에요. 백업 트레이는 쓰지 않아도 열어 둘 수 있어요.
    decoy: in case it spills
    distractorsKo:
    - 필요할 경우를 대비해 예비 가운을 열어 둘게요.
    - 필요할 경우를 대비해 백업 램프를 켜 둘게요.
    blank:
      answer: tray
      options:
      - en: tray
      - en: label
      - en: sponge
      - en: lamp
  - en: The major set is fully counted and ready to go.
    ko: 주요 세트는 계수가 끝났고 진행할 준비가 됐어요.
    chunks:
    - The major set
    - is fully counted
    - and ready
    - to go
    - .
    words:
    - w-major
    - w-count
    - w-ready
    - w-go
    goal: 1
    tag: 세트 완료
    icon: check
    why: fully counted와 ready to go를 나란히 놓으면 '센 것이 끝났다'와 '바로 시작해도 된다'가 한 번에 전달돼요.
    decoy: and well labeled
    distractorsKo:
    - 작은 세트는 계수가 끝났고 진행할 준비가 됐어요.
    - 주요 세트는 계수가 끝났고 가져올 준비가 됐어요.
    blank:
      answer: go
      options:
      - en: go
      - en: stay
      - en: sit
      - en: rest
  order:
    tag: 대화 흐름
    icon: compass
    ko: 개복 세트 개방 4문장 순서
    why: 세트를 열고, 그 세트의 기구 상태를 보고하고, 추가로 열 것을 묻고, 그 답을 받아 여는 순서예요. from that set, that이 앞 줄을 가리켜 순서를 잡아요.
    lines:
    - en: Opening the emergency lap set now.
      icon: gear
      ko: 지금 응급 개복 세트를 개봉하고 있어요
