수술 안전 문화 인지:
- kind: slider
  words: [w-hear, w-something, w-wrong]
  cue: "A newer team member says, \"Sorry, it's probably nothing, but something looks off to me.\""
  scale:
  - "Okay, noted. We can talk about it later if you want."
  - "Thank you — I want to hear it, so tell me what you see."
  - "Never say sorry; everyone here must speak up about everything."
  answerAt: 1
  why: 작은 우려일수록 반갑게 받아야 다음에도 말해요. 건성으로 넘기면 입을 닫게 되고, '무조건 다 말해야 한다'고 몰아붙이면 오히려 부담이 돼요.
  example: "Thank you — I want to hear it, so tell me what you see."
  exKo: 고마워요 — 듣고 싶으니 뭐가 보이는지 말해 주세요.
- kind: context
  words: [w-concern]
  word: concern
  ko: 우려
  scenes:
  - {who: 간호사 → 신입 동료, icon: speech, en: "If you have a concern, say it now — we'll listen.", ok: true}
  - {who: 안전 기록, icon: board, en: "Concern raised by the scrub tech; surgeon addressed it before incision.", ok: true}
  - {who: 간호사 → 불안한 환자, icon: faceWorried, en: "Your concern has been logged as a perioperative risk variable for review.", ok: false, fix: "If anything worries you, tell me now — we'll go over every concern before we start."}
  why: 뜻은 셋 다 '우려'예요. 동료에게는 지금 말하라고 간단히 권하고, 기록에는 누가 무엇을 제기했고 어떻게 처리됐는지 건조하게 적어요. 하지만 불안한 환자에게 '위험 변수로 기록했다'고 하면 차갑고 더 불안해져요. 환자에게는 걱정을 듣겠다고 쉬운 말로 해요.
- kind: swap
  words: [w-ask, w-blame, w-question]
  who: 간호사 → 신입 동료 · 질문 격려
  icon: speech
  before: ["", "Please don't interrupt the surgeon with questions.", ""]
  options:
  - "Ask only if you're sure it's important."
  - "If you're unsure, ask — no one gets blamed for a question here."
  - "Please don't interrupt the surgeon with questions."
  answer: "If you're unsure, ask — no one gets blamed for a question here."
  notes:
    "Ask only if you're sure it's important.": 확신이 설 때만 물으라고 하면 애매한 우려를 삼키게 돼요.
    "If you're unsure, ask — no one gets blamed for a question here.": 헷갈릴 때 묻는 것이 맞다고 분명히 해 주고 탓하지 않겠다고 약속해서 입을 열게 해요.
    "Please don't interrupt the surgeon with questions.": 질문을 막는 말이라 안전 문화와 반대예요.
  why: 질문하는 문화는 말로 분명히 해 줘야 신입이 입을 열어요. 질문을 막거나 조건을 달면 정작 위험한 의문이 묻혀요.
  ko: 헷갈리면 물어보세요 — 여기서는 질문한다고 탓하지 않아요
부위 표시 확인:
- kind: slider
  words: [w-mark, w-match, w-consent, w-visible]
  cue: "You look at the mark on the left knee. It is clear, and it matches the consent."
  scale:
  - "The mark is visible and it matches the consent."
  - "I'd like everyone to re-verify the mark one more time."
  - "Stop everything — we must triple-check this mark now!"
  answerAt: 0
  why: 표시가 분명하고 동의서와 맞으면 본 대로 짧게 말하면 돼요. 맞는 것을 또 전원이 다시 확인하자거나 '멈춰요!'라고 하면 상황보다 무겁고, 진짜 불일치가 났을 때 써야 할 강한 말의 힘이 약해져요.
  example: "The mark is visible and it matches the consent."
  exKo: 표시가 보이고 동의서와 일치해요.
- kind: context
  words: [w-mark]
  word: mark
  ko: 표시
  scenes:
  - {who: 간호사 → 불안한 환자, icon: faceWorried, en: "The mark identifies the laterality of the incision; do not disturb it.", ok: false, fix: "That mark shows which knee we're operating on — please don't rub it off, and we'll check it again before we start."}
  - {who: 간호사 → 동료, icon: speech, en: "The mark is still visible after prep and draping.", ok: true}
  - {who: 수술 기록, icon: board, en: "Operative site marked by surgeon; mark visible at time-out.", ok: true}
  why: 뜻은 셋 다 '표시'예요. 동료에게는 보인다고 짧게, 기록에는 건조하게 적어요. 하지만 환자에게 'laterality'나 'disturb' 같은 말을 쓰면 무슨 뜻인지 모르고 겁만 나요. 환자에게는 어느 쪽 무릎인지 쉬운 말로 알려 줘요.
- kind: swap
  words: [w-show, w-mark, w-visible, w-drape]
  who: 간호사 → 집도의 · 표시가 안 보임
  icon: speech
  before: ["", "Looks fine to me.", ""]
  options:
  - "Looks fine to me."
  - "The mark must be under there somewhere; let's go on."
  - "I can't see the mark under the drape — could you show me where it is?"
  answer: "I can't see the mark under the drape — could you show me where it is?"
  notes:
    "Looks fine to me.": 보이지도 않는 표시를 확인했다는 듯 넘기는 말이에요.
    "The mark must be under there somewhere; let's go on.": 눈으로 확인하지 않고 짐작으로 진행하자는 말이라 위험해요.
    "I can't see the mark under the drape — could you show me where it is?": 안 보인다는 사실을 말하고 어디 있는지 보여 달라고 구체적으로 정중히 요청해요.
  why: 표시가 보이지 않으면 짐작하지 않고 보이지 않는다고 말한 뒤 보여 달라고 요청해요. 구체적이고 정중하면 방어 없이 확인이 이어져요.
  ko: 수술포 밑에서 표시가 안 보여요 — 어디 있는지 보여 주시겠어요?
타임아웃 참여:
- kind: slider
  words: [w-timeout, w-everyone, w-during]
  cue: "You start the time-out, but two people keep working at the back table."
  scale:
  - "Could you finish up first, then we'll do the time-out?"
  - "Please stop what you're doing for the time-out, if you can."
  - "Time-out — everyone stops what they're doing, right now."
  answerAt: 2
  why: 타임아웃은 협상이 아니라 모두가 하던 일을 멈추는 규칙이에요. '끝내고 하자'거나 '가능하면'이라고 하면 일부는 계속 일하고 확인이 흐려져요. 고함이나 협박 없이 분명하고 단호하게 말해요.
  example: "Time-out — everyone stops what they're doing, right now."
  exKo: 타임아웃 — 모두 하던 일을 지금 바로 멈춥니다.
- kind: context
  words: [w-timeout]
  word: time-out
  ko: 타임아웃
  scenes:
  - {who: 간호사 → 팀, icon: speech, en: "Time-out, everyone — patient, procedure, and site.", ok: true}
  - {who: 간호사 → 불안한 환자, icon: faceWorried, en: "Time-out protocol initiated; all personnel are to cease activity.", ok: false, fix: "We're taking a short time-out so the whole team can double-check your name and surgery."}
  - {who: 수술 기록, icon: board, en: "Time-out completed at 08:02 with all team members present.", ok: true}
  why: 뜻은 셋 다 '타임아웃'이에요. 팀에는 짧고 힘 있게 시작을 알리고, 기록에는 시각과 참석을 건조하게 적어요. 하지만 환자에게 '프로토콜 개시, 모든 인원은 활동을 중지'라고 하면 군대식으로 차갑고 놀라요. 환자에게는 이름과 수술을 다시 확인하려고 잠깐 멈춘다고 풀어 말해요.
- kind: swap
  words: [w-concern, w-start, w-unclear, w-moment]
  who: 간호사 → 팀 · 시작 전 우려 확인
  icon: speech
  before: ["", "Anything you want to say, say it later.", ""]
  options:
  - "Any concerns before we start? Please speak up now."
  - "Anything you want to say, say it later."
  - "Only mention a concern if it's a big one."
  answer: "Any concerns before we start? Please speak up now."
  notes:
    "Any concerns before we start? Please speak up now.": 시작 전에 우려를 묻고 지금 말해 달라고 열어 둬요.
    "Anything you want to say, say it later.": 나중으로 미루라는 말이라 시작한 뒤에는 막기 어려워요.
    "Only mention a concern if it's a big one.": 작아 보이는 우려를 삼키게 만들어요.
  why: 타임아웃은 시작 전에 우려를 꺼낼 마지막 순간이에요. 모두가 들을 수 있게 열어 놓고 물어야 해요. 미루게 하거나 큰 것만 말하라고 하면 입이 닫혀요.
  ko: 시작하기 전에 우려되는 점 있으세요? 지금 말씀해 주세요.
계수 기본 참여:
- kind: slider
  words: [w-count, w-initial, w-correct]
  cue: "You and your partner just finished the initial count, and your numbers match."
  scale:
  - "Our counts match — the count is correct."
  - "Let's count once more, just in case, to be safe."
  - "Count again until I'm sure nothing is missing."
  answerAt: 0
  why: 둘의 숫자가 맞으면 맞다고 말하고 기록해요. 맞는 계수를 '혹시 모르니' 반복하자고 하면 수술이 지연되고 기준이 흐려져요. 불일치가 날 때만 멈추고 다시 세요.
  example: "Our counts match — the count is correct."
  exKo: 우리 숫자가 맞아요 — 계수가 맞습니다.
- kind: context
  words: [w-count]
  word: count
  ko: 계수하다
  scenes:
  - {who: 간호사 → 동료, icon: speech, en: "Let's count the sponges and needles together.", ok: true}
  - {who: 간호사 → 보호자, icon: faceWorried, en: "Our count reconciled against the initial tally per protocol.", ok: false, fix: "We count every sponge and needle during surgery, and the numbers have all matched so far."}
  - {who: 수술 기록, icon: board, en: "Initial count correct; counted by scrub and circulator.", ok: true}
  why: 뜻은 셋 다 '계수'예요. 동료에게는 같이 세자고 하고, 기록에는 건조하게 남겨요. 하지만 보호자에게 'reconciled against the initial tally' 같은 말을 쓰면 무슨 얘기인지 알 수 없어요. 보호자에게는 모든 거즈와 바늘을 세고 있고 지금까지 맞았다고 쉬운 말로 해요.
- kind: swap
  words: [w-count, w-loud, w-together, w-number]
  who: 간호사 → 동료 · 계수 방식
  icon: speech
  before: ["", "I'll count on my own and tell you the total.", ""]
  options:
  - "I'll count on my own and tell you the total."
  - "You count, and I'll just trust your number."
  - "I'll count out loud with you so we both hear the same number."
  answer: "I'll count out loud with you so we both hear the same number."
  notes:
    "I'll count on my own and tell you the total.": 각자 세면 같은 숫자를 확인한 것이 아니에요.
    "You count, and I'll just trust your number.": 독립 이중 확인이 아니라 한 사람의 숫자를 믿는 거예요.
    "I'll count out loud with you so we both hear the same number.": 둘이 소리 내어 함께 세면 같은 숫자를 서로 듣고 맞출 수 있어요.
  why: 계수는 두 사람이 같은 물품을 함께 보고 소리 내어 세요. 각자 세거나 한 사람 숫자를 믿으면 틀려도 걸러지지 않아요.
  ko: 함께 소리 내어 세요 — 같은 숫자를 둘 다 듣도록요
검체 라벨 확인:
- kind: slider
  words: [w-label, w-specimen, w-site, w-send]
  cue: "The surgeon hands you a specimen. The label has the patient's name, but the site is blank."
  scale:
  - "The name is right, so the rest can be filled in later."
  - "Let me fix the site on the label when I get a chance."
  - "I won't send it until the label is complete — site included."
  answerAt: 2
  why: 라벨은 이름만으로 되지 않고 검체 이름·부위·날짜까지 채워져야 해요. 나중에 채우자고 하면 검체가 뒤섞일 수 있어요. 보내기 전에 라벨이 완성됐는지 확인하겠다고 분명히 말해요.
  example: "I won't send it until the label is complete — site included."
  exKo: 라벨이 완성될 때까지 보내지 않을게요 — 부위까지요.
- kind: context
  words: [w-specimen]
  word: specimen
  ko: 검체
  scenes:
  - {who: 간호사 → 집도의, icon: speech, en: "I'll read the specimen label back to you before it leaves the room.", ok: true}
  - {who: 수술 기록, icon: board, en: "Specimen labeled and handed off to the courier; read-back done.", ok: true}
  - {who: 간호사 → 보호자, icon: faceWorried, en: "Your husband's specimen is being processed by anatomic pathology for histologic examination.", ok: false, fix: "The tissue we removed goes to the lab, and we make sure it's labeled with his name before it leaves."}
  why: 뜻은 셋 다 '검체'예요. 집도의에게는 라벨을 다시 읽어 주겠다고, 기록에는 건조하게 인계를 남겨요. 하지만 보호자에게 'anatomic pathology'나 'histologic examination' 같은 전문 용어를 쓰면 이해하지 못하고 불안해져요. 보호자에게는 쉬운 말로 풀어요.
- kind: swap
  words: [w-label, w-read, w-specimen]
  who: 간호사 → 집도의 · 검체 건네받음
  icon: speech
  before: ["", "I'll label it after we close.", ""]
  options:
  - "I'll label it after we close."
  - "I'll label it now and read it back to you."
  - "The requisition has his name, so it's fine."
  answer: "I'll label it now and read it back to you."
  notes:
    "I'll label it after we close.": 미루면 어느 용기가 어느 조직인지 헷갈리기 쉬워요.
    "I'll label it now and read it back to you.": 받은 자리에서 바로 붙이고 다시 읽어 주면 틀린 곳을 바로 잡을 수 있어요.
    "The requisition has his name, so it's fine.": 용기 자체에 라벨이 없으면 요청서만 믿고 보낼 수 없어요.
  why: 라벨은 검체를 받은 자리에서 바로 붙이고 소리 내어 읽어 확인해요. 미루지도, 요청서에 기대지도 않아요.
  ko: 지금 라벨을 붙이고 다시 읽어 드릴게요
화재 위험 인지:
- kind: slider
  words: [w-prep, w-pool, w-drape, w-dry]
  cue: "The skin prep is alcohol-based, the cautery is about to be used, and some prep has pooled near the drapes."
  scale:
  - "A bit of prep near the drapes is usually fine."
  - "Wait — let me wipe up the pooled prep before we drape."
  - "Everyone stop, leave the room, a fire is certain!"
  answerAt: 1
  why: 알코올 소독액이 고인 채 수술포를 덮고 소작기를 쓰면 불이 붙을 수 있어요. 괜찮다고 넘기지도, 대피를 외치며 과장하지도 말고 고인 것을 닦고 마르게 두자고 구체적으로 말해요.
  example: "Wait — let me wipe up the pooled prep before we drape."
  exKo: 잠깐만요 — 수술포를 덮기 전에 고인 소독액을 닦을게요.
- kind: context
  words: [w-prep]
  word: prep
  ko: 소독액
  scenes:
  - {who: 간호사 → 불안한 환자, icon: faceWorried, en: "The prep is a hydroalcoholic antiseptic solution; it is highly flammable.", ok: false, fix: "That cold wash is the skin prep — it's alcohol-based, so we let it dry fully before anything else."}
  - {who: 간호사 → 동료, icon: speech, en: "Let's let the prep dry before we drape.", ok: true}
  - {who: 수술 기록, icon: board, en: "Alcohol-based prep applied and allowed to dry before draping.", ok: true}
  why: 뜻은 셋 다 '소독액'이에요. 동료에게는 마른 뒤에 덮자고 짧게, 기록에는 건조하게 적어요. 하지만 환자에게 'hydroalcoholic antiseptic'이나 'highly flammable'이라고 하면 무슨 말인지 모르고 겁만 나요. 환자에게는 차가운 것이 소독이고 마른 뒤에 시작한다고 쉬운 말로 해요.
- kind: swap
  words: [w-prep, w-dry, w-drape]
  who: 간호사 → 집도의 · 소독액 건조
  icon: speech
  before: ["", "We can drape now, it's dry enough.", ""]
  options:
  - "Let's wait until the prep is fully dry before we drape."
  - "We can drape now, it's dry enough."
  - "The prep will dry under the drapes."
  answer: "Let's wait until the prep is fully dry before we drape."
  notes:
    "Let's wait until the prep is fully dry before we drape.": 알코올 소독액이 완전히 마른 뒤에 덮어야 불꽃 위험이 줄어요.
    "We can drape now, it's dry enough.": 눈으로 대충 보고 '충분히' 말랐다고 하면 증기가 남을 수 있어요.
    "The prep will dry under the drapes.": 수술포 밑에서는 마르지 않고 증기가 갇혀 위험해요.
  why: 알코올 소독액은 완전히 마른 뒤에 수술포를 덮어야 해요. 대충 마른 것 같다거나 덮은 뒤 마르겠다는 말은 화재 위험을 키워요.
  ko: 수술포를 덮기 전에 소독액이 완전히 마를 때까지 기다려요
speak-up 우려 표현:
- kind: slider
  words: [w-concern, w-comfortable, w-pause]
  cue: "You told the surgeon twice you were uncomfortable, and the incision is about to start anyway."
  scale:
  - "I have a concern — could we double-check something?"
  - "I'm uncomfortable with this — can we pause for a second?"
  - "This is a safety issue, and I need everyone to stop now."
  answerAt: 2
  why: 우려는 'concerned → uncomfortable → safety issue'(CUS)로 단계를 올려요. 두 번 말했는데도 시작하려 하면 안전 문제라고 분명히 하고 모두 멈추라고 요청해요. 결정은 팀이 하지만 멈춤 요청은 누구나 할 수 있어요.
  example: "This is a safety issue, and I need everyone to stop now."
  exKo: 안전 문제예요. 모두 지금 멈춰 주셔야 해요.
- kind: context
  words: [w-proceed]
  word: proceed
  ko: 진행하다
  scenes:
  - {who: 간호사 → 집도의, icon: speech, en: "I'm not comfortable proceeding until we've confirmed the site.", ok: true}
  - {who: 수술 기록, icon: board, en: "RN voiced concern; team agreed to confirm the site before proceeding.", ok: true}
  - {who: 간호사 → 불안한 가족, icon: faceWorried, en: "Per protocol, the team will not proceed until verification is complete.", ok: false, fix: "We're double-checking one detail, and then we'll proceed."}
