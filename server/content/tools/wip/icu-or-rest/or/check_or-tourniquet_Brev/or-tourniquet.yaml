      I changed the setting a little: 압력은 집도의가 정하는 값이다. 간호사가 마음대로 바꿨다고 말하면 업무 범위를 벗어난다.
      the setting is probably fine: '''아마''는 확인하지 않았다는 말로 들린다. 값은 짐작이 아니라 맞춰 본 결과로 전한다.'
    why: 압력 숫자는 집도의가 정해요. 간호사는 기계에 들어간 값이 그 지시와 같은지 확인해 알리고, 임의로 바꾸거나 '아마 맞다'고 넘기지 않아요.
    ko: 설정이 지시하신 것과 일치해요
