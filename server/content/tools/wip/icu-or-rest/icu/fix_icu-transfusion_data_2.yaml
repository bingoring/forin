# 뉘앙스·order 수정 (A N1~N11, S16·S19·S12·S20·S0 order 줄). 뉘앙스 키 = [상황, kind, (word|ko 선택)].
nuance:
  - {s: 3, kind: pair, set: {words: [w-packed, w-platelet, w-replace, w-treat, w-plasma], pairs: [["Packed red cells", "raise oxygen-carrying capacity"], ["Platelets", "treat thrombocytopenia"], ["Plasma units", "replace clotting factors"]]}}
  - s: 3
    kind: context
    set:
        word: fibrinogen
        ko: 섬유소원
        words: [w-fibrinogen]
        why: "의료진끼리는 fibrinogen 같은 검사 이름을 그대로 말하는 게 빠르고 정확해요. 가족에게는 fibrinogen·INR·coagulopathy가 한꺼번에 나오면 알아듣기 어려워요. 왜 이 성분을 주는지 한 가지로 쉽게 설명해요."
        scenes:
          - {en: "His fibrinogen is low, so I'm asking about cryo."}
          - {en: "His fibrinogen came back low, so cryo is on the way."}
          - {en: "His fibrinogen is low and his INR is up — consistent with coagulopathy.", fix: "His blood isn't clotting well, so we're giving him the part of blood that helps it clot."}
  - s: 13
    kind: swap
    set:
        before: ["You have ", "urticaria", " from the blood, so I've paused it."]
        options: ["a few itchy bumps", "urticaria", "a dangerous reaction"]
        answer: "a few itchy bumps"
        ko: "피 때문에 가려운 두드러기가 조금 올라와서 수혈을 잠시 멈췄어요"
        why: "urticaria 같은 의학 용어보다 눈에 보이는 모습을 쉬운 말로 알려 줘요. hives는 환자도 쓰는 말이에요."
        notes: {"a dangerous reaction": "사실보다 무겁게 들려 불안을 키운다."}
  - s: 18
    kind: slider
    set:
        scale: ["slow the plasma down and keep watching her", "pause it and recheck in a minute or two", "stop it, call the provider, and report it"]
        why: "수혈 직후의 급성 호흡부전에 충만압이 정상이면 TRALI를 의심해요. 수혈을 멈추고 호흡을 지지하며 의료진에게 알리고, 혈액은행에 백과 튜빙을 반납하며 보고해요. 공여자 조사가 필요하기 때문이에요. 천천히 줄이거나 잠깐 멈췄다 다시 보면 같은 혈장이 계속 들어갈 수 있어요."
  - s: 12
    kind: slider
    set:
        scale: ["hold off and recheck later", "ask the provider about transfusing", "transfuse right away"]
        answerAt: 0
        why: "보류도 의료진 계획(처방)에 따라요. 활동성 출혈이 없고 시술 계획도 없으면 보통 예방적 수혈 역치(흔히 1만/μL) 위의 수치에서는 수혈하지 않고 수치를 다시 확인해요. 기준은 병원과 환자에 따라 달라서 처방을 따르고, 출혈이 시작되거나 시술이 잡히면 기준이 달라져요."
  - {s: 19, kind: slider, set: {cue: "Colleague: \"His QT is getting longer, but he still has a pulse and a pressure.\""}}
  - s: 4
    kind: slider
    set:
        scale: ["hang it now", "call the blood bank first", "send it back for a new one"]
        answerAt: 0
        why: "대부분의 병원 정책은 냉장고를 나온 지 30분 안에 시작하라고 해요. 20분이면 아직 시작할 수 있어서 혈액은행에 먼저 전화하거나 새 제제로 바꿀 필요가 없어요. 정확한 기준은 병원 정책을 따라요."
  - s: 19
    kind: context
    set:
        scenes_fix: {2: "His heart may stop, and the team is getting ready to help him. Someone will stay with you."}
        why: "의료진끼리는 code가 심정지 응급 호출을 뜻하는 짧은 말이에요. 가족에게는 code라는 은어가 무슨 뜻인지 모르고, 곧 죽는다는 말로 들려 충격이 커요. 무슨 일이 생길 수 있고 팀이 무엇을 준비하는지 쉬운 말로 알려 줘요."
  - {s: 12, kind: context, set: {scenes_en: {0: "Which threshold applies for him today?"}}}
  - {s: 16, kind: context, set: {scenes_en: {0: "Her airway is compromised, so I'm setting up for intubation."}}}
  - s: 6
    kind: context
    set:
        word: hemolytic
        ko: 용혈성의
        words: [w-hemolytic]
        scenes_en: {1: "I need to report a possible hemolytic reaction."}
        why: "의료진끼리는 hemolytic처럼 반응의 종류까지 정확히 말해야 해요. 환자에게 진단명과 용어를 단정해 읽어 주면 겁이 나고 알아듣기도 어려워요. 무슨 일이 의심되는지와 지금 하는 일을 쉬운 말로 알려 줘요."
  - s: 7
    kind: context
    set:
        word: oxygenation
        ko: 산소화
        words: [w-oxygenation]
        scenes_en: {0: "Her oxygenation is getting worse on high-flow.", 1: "Let's sit her up to help her oxygenation.", 2: "I'm supporting your oxygenation with a non-rebreather."}
        why: "의료진끼리는 oxygenation처럼 상태를 한 단어로 정확히 말해요. 환자에게는 oxygenation·non-rebreather 같은 말이 낯설어요. 무엇을 하는지와 왜 하는지만 쉬운 말로 알려 줘요."
order:
  # (상황, 줄 1~4): en, ko — B의 새 줄과 겹치지 않는 A·대명사 수정
  - {s: 0, l: 2, en: "So let's read his name and date of birth out loud together.", ko: "그러니 이름과 생년월일을 소리 내어 함께 읽어요"}
  - {s: 12, l: 2, en: "So the team may hold off and just recheck his count later.", ko: "그래서 팀에서 보류하고 나중에 수치만 다시 확인할 수도 있어요"}
  - {s: 12, l: 3, en: "But if he starts bleeding, I'll call the provider right away.", ko: "하지만 출혈이 시작되면 바로 의료진에게 연락할게요"}
  - {s: 13, l: 2, en: "Should we premedicate this time, given her history?", ko: "과거력을 감안하면 이번엔 전처치해야 할까요?"}
  - {s: 19, l: 1, en: "His QT is getting longer and he's about to arrest.", ko: "QT가 늘어나고 있고 곧 심정지가 올 것 같아요"}
  - {s: 16, l: 2, en: "This looks like anaphylaxis — stop the transfusion and get the epi now.", ko: "아나필락시스 같아요 — 수혈을 멈추고 지금 에피네프린 가져와 주세요"}
  - {s: 16, l: 4, en: "If she still doesn't improve, I'll give a second IM dose per protocol.", ko: "그래도 호전되지 않으면 프로토콜에 따라 근육주사로 두 번째 용량을 줄게요"}
  - {s: 19, l: 4, en: "With them coming, I'll keep giving calcium per protocol as we hang more units.", ko: "그들이 오는 동안 제제를 더 거는 동안 프로토콜에 따라 칼슘을 계속 줄게요"}
  - {s: 20, l: 3, en: "Did he ever say what mattered most to him?", ko: "그분께 가장 중요했던 게 뭔지 말한 적이 있나요?"}
  - {s: 20, l: 4, en: "Whatever he said, we'll work with the team so his care matches his wishes.", ko: "그분이 무슨 말을 했든 그분의 돌봄이 뜻에 맞도록 팀과 함께 애쓸게요"}
order_why:
  12: "수치와 상태를 말하고 보류 가능성을 밝힌 뒤, 출혈이 생기면 바로 의료진을 부르고 그때는 기준이 달라진다고 설명해요."
  16: "증상을 보고하고 중단과 에피네프린을 지시한 뒤, 수액과 코드 호출을 하고, 호전이 없으면 프로토콜에 따라 두 번째 근육주사 용량을 줘요."
  19: "위험을 보고하고 칼슘을 주면서 코드 팀을 부른 뒤, 제제를 더 거는 동안에도 프로토콜에 따라 칼슘을 계속 줘요."
  20: "현재 상황을 알린 뒤 현실을 이야기하겠다고 열고, 환자의 뜻을 묻고, 그 뜻에 맞도록 팀과 함께 애쓰겠다고 해요."
