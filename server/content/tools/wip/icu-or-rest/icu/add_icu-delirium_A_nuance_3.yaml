- situation: "극심 초조 자타해 위험 위기"
  items:
    - kind: slider
      words: [w-security, w-call]
      cue: "RN: \"He swung at staff twice and is trying to get out of the bed.\""
      scale: ["talk to him", "call security", "restrain him"]
      answerAt: 1
      why: "팔을 휘두르는 상황에서는 혼자 맞서지 말고 보안과 도움을 먼저 불러요. 말로 달래는 것은 계속하고, 억제는 마지막 수단이에요."
      example: "I'll page the physician while you call security."
      exKo: "제가 의사를 호출할 테니 보안팀은 불러주세요."
    - kind: context
      words: [w-danger]
      word: "danger"
      ko: "위험"
      scenes:
        - {who: "야간 의사 콜", icon: monitor, en: "He's a danger to himself — we need orders now.", ok: true}
        - {who: "차트 기록", icon: board, en: "Pt danger to self; security called.", ok: true}
        - {who: "환자에게", icon: me, en: "You're a danger to yourself!", ok: false, fix: "I'm worried you could get hurt, so I'm here to keep you safe."}
      why: "의료진끼리는 'danger to self'가 정확한 위험 평가예요. 환자 면전에서 소리치듯 말하면 위협받는 느낌이 들어 더 격해져요. 걱정과 보호의 말로 바꿔요."
- situation: "섬망 중 라인·튜브 자가제거 급변"
  items:
    - kind: pair
      words: [w-hold, w-replace, w-page]
      pairs: [["hold", "pressure"], ["replace", "access"], ["page", "the physician"]]
      decoys: ["the bleeding"]
      why: "출혈에는 pressure를 hold(유지)하고, 빠진 접근로는 replace(교체)하고, 의사는 page(호출)해요."
    - kind: context
      words: [w-pressure]
      word: "pressure"
      ko: "압박"
      scenes:
        - {who: "야간 의사 콜", icon: monitor, en: "Central line pulled — holding pressure at the site.", ok: true}
        - {who: "차트 기록", icon: board, en: "Pressure held until bleeding stopped.", ok: true}
        - {who: "환자에게", icon: me, en: "We have an uncontrolled bleed — I'm applying pressure.", ok: false, fix: "You're bleeding a little where the line came out; I'm pressing on it to stop it."}
      why: "의료진에게는 'uncontrolled bleed' 같은 말이 상황을 정확히 전해요. 환자에게는 겁이 나는 말이니, 무슨 일이 있었고 지금 무엇을 하는지를 차분히 말해요."
- situation: "할로페리돌 사용·QT 감시"
  items:
    - kind: slider
      words: [w-stat]
      cue: "Before the first haloperidol dose: \"Get the ECG now — we can't wait.\""
      scale: ["routine", "urgent", "stat"]
      answerAt: 2
      why: "stat은 '지금 당장'이에요. urgent보다 더 급해서 바로 시행하라는 뜻으로 병원에서 쓰는 약어예요."
      example: "I'll pull a stat ECG before the first dose."
      exKo: "첫 용량 전에 즉시 심전도를 찍을게요."
    - kind: swap
      words: [w-qt, w-prolongation]
      who: "의사에게 보고"
      icon: stetho
      before: ["His QT is ", "bad", ", so I'd like to talk before we give haloperidol."]
      options: ["bad", "prolonged", "scary"]
      answer: "prolonged"
      notes: {"bad": "얼마나 나쁜지 알 수 없어요.", "prolonged": "'QT가 연장됐다'는 정확한 임상어예요.", "scary": "느낌만 전해서 판단 근거가 안 돼요."}
      why: "의사에게는 'prolonged'처럼 정확한 임상어로 보고해요. 'bad'나 'scary'는 어느 정도인지 전달하지 못해요."
      ko: "QT가 연장돼 있어서, 할로페리돌을 주기 전에 상의하고 싶어요."
- situation: "금단 발작·진전섬망 위기"
  items:
    - kind: pair
      words: [w-seizure, w-turn, w-airway]
      pairs: [["time", "the seizure"], ["turn", "him on his side"], ["protect", "his airway"]]
      decoys: ["the weekend"]
      why: "발작 때는 시간을 재고(time the seizure), 옆으로 돌려 눕히고(turn him on his side), 기도를 지켜요(protect his airway)."
    - kind: context
      words: [w-seizure]
      word: "seizure"
      ko: "발작"
      scenes:
        - {who: "야간 의사 콜", icon: monitor, en: "He had a seizure at 0230 — lasted two minutes.", ok: true}
        - {who: "차트 기록", icon: board, en: "Seizure activity noted, benzo given.", ok: true}
        - {who: "가족에게", icon: me, en: "He's having a grand mal seizure!", ok: false, fix: "His body is shaking because of a seizure. We're treating it right now."}
      why: "의료진끼리는 'seizure'와 시각, 지속 시간을 정확히 전해요. 가족에게 'grand mal'은 낡은 용어이고 겁을 주니, 지금 무슨 일이고 무엇을 하는지만 알려요."
- situation: "섬망 지속·예후 소통"
  items:
    - kind: slider
      words: [w-hope]
      cue: "Wife: \"Will he be back to normal by Friday?\""
      scale: ["I can't promise", "we're hopeful", "I guarantee"]
      answerAt: 0
      why: "섬망이 언제 걷힐지는 사람마다 달라서 날짜는 약속할 수 없어요. 대부분 회복된다는 희망은 전하되, 날짜는 'I can't promise'로 정직하게 말해요."
      example: "His delirium is lasting longer than we'd hoped."
      exKo: "섬망이 저희 예상보다 더 오래가고 있어요."
    - kind: context
      words: [w-recovery]
      word: "recovery"
      ko: "회복"
      scenes:
        - {who: "의료진끼리", icon: stetho, en: "Recovery from delirium can be gradual.", ok: true}
        - {who: "차트 기록", icon: board, en: "Family updated on recovery timeline.", ok: true}
        - {who: "아내에게", icon: me, en: "His recovery will take exactly three weeks.", ok: false, fix: "Recovery looks different for everyone — we'll keep you updated."}
      why: "'정확히 3주'처럼 기간을 단정하면 지킬 수 없는 약속이에요. 사람마다 다르다는 사실과 계속 알리겠다는 약속(지킬 수 있는)을 전해요."
- situation: "억제대 관련 손상·질식 위험 위기"
  items:
    - kind: pair
      words: [w-pad, w-recheck, w-document]
      pairs: [["pad", "the wrists"], ["recheck", "the fit"], ["document", "the injury"]]
      decoys: ["the weather"]
      why: "억제대를 쓴다면 손목은 pad(패딩), 조임은 recheck(재확인), 손상은 document(기록)로 이어져요."
    - kind: swap
      words: [w-release, w-restraint, w-choke]
      who: "동료에게 긴급 지시"
      icon: siren
      before: ["Hey, ", "maybe loosen", " the restraints — he's choking!"]
      options: ["maybe loosen", "release", "think about adjusting"]
      answer: "release"
      notes: {"maybe loosen": "'maybe'가 지시를 흐려 몇 초를 잃어요.", "release": "짧은 명령이라 즉시 행동할 수 있어요.", "think about adjusting": "생각해 보라는 말이라 위기에 맞지 않아요."}
      why: "숨이 막히는 위기에서는 짧고 직접적인 명령형이 맞아요. 완곡하게 돌려 말하면 몇 초가 사라져요."
      ko: "저기, 억제대 풀어요 — 숨이 막혀요!"
