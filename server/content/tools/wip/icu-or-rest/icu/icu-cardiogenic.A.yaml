  nuance:
  - kind: slider
    words:
    - w-low
    cue: 'Chart: BP 98/62 — a hair under his usual 104/64, and he has no symptoms.'
    scale:
    - a little low
    - quite low
    - dangerously low
    answerAt: 0
    why: 평소보다 살짝만 낮고 증상도 없으면 a little low. quite low·dangerously low는 수치가 크게 떨어졌을 때 쓰는 말이라 같은 '낮다'여도 무게가 달라요.
    example: Your blood pressure is a little low right now.
    exKo: 지금 혈압이 조금 낮아요.
  - kind: context
    words:
    - w-report
    word: report
    ko: 보고하다
    scenes:
    - who: 의사 호출
      icon: monitor
      en: I'm reporting a drop in his blood pressure.
      ok: true
    - who: 팀 인계
      icon: board
      en: Please report any change in rhythm right away.
      ok: true
    - who: 환자에게
      icon: me
      en: I'm reporting your hemodynamic instability to the physician.
      ok: false
      fix: I'm telling the doctor about your blood pressure right now so we can help.
    why: 의료진끼리는 report가 자연스럽지만, 환자에게는 hemodynamic instability 같은 임상어가 겁을 주고 알아듣기 어려워요. 쉬운 말로 무엇을 하는지 전하세요.
