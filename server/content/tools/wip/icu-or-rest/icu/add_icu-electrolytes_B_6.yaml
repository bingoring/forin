situations:
- title: 급격 저나트륨 경련 위기
  s:
  - ["위기 인지", siren, "'acute severe'는 갑자기 심해졌다는 뜻이라 위기임을 한 번에 전해요. 'from'으로 경련의 원인을 바로 이어 말해요.", "on the monitor", "급성 심한 저혈당으로 경련하고 있습니다.", "급성 심한 저칼슘혈증으로 경련하고 있습니다.", "seizing", "sleeping", "sweating", "coughing"]
  - ["고장성 식염수", pill, "'per protocol'은 기관의 지침에 따라 정해진 방식으로 준다는 뜻이에요. 'to stop the seizures'로 목적을 밝혀요.", "at the bedside", "프로토콜대로 고장성식염수 줘서 혈압 올리겠습니다.", "프로토콜대로 고장성식염수 줘서 열 내리겠습니다.", "seizures", "bleeding", "headaches", "nausea"]
  - ["교정 제한", shield, "'must'는 선택이 아니라 반드시라는 뜻이에요. 경련을 멈춘 뒤에도 너무 많이 올리면 뇌가 상할 수 있어서 총량을 제한해요.", "in the unit", "폐 손상 피하려면 전체 교정 폭을 제한해야 합니다.", "신장 손상 피하려면 전체 교정 폭을 제한해야 합니다.", "brain", "lung", "liver", "skin"]
  - ["상태 보고", siren, "수치와 현재 상태를 'and'로 이어 보고하면 얼마나 급한지 한 번에 전해져요. 'actively'는 지금 진행 중이라는 뜻이에요.", "on the chart", "나트륨 108, 현재 구토 중입니다.", "나트륨 108, 현재 출혈 중입니다.", "convulsing", "vomiting", "laughing", "sneezing"]
  - ["즉시 투여", siren, "명령형으로 시작하고 'now'로 끝내 지금 바로 하라는 지시가 분명해요. 숫자는 한 자리씩 또박또박 말해 오해를 줄여요.", "at the desk", "지금 3% 식염수 100mL 준비하세요.", "지금 3% 식염수 100mL 확인하세요.", "Push", "Label", "Weigh", "Count"]
  - ["교정 한도", shield, "'Once'로 조건을 걸고 'still'로 상황이 끝나지 않았음을 알려요. 경련이 멎어도 하루 교정 한도는 그대로예요.", "in the room", "경련 멈춰도 내일은 그 이상 교정하면 안 됩니다.", "경련 멈춰도 이번 주는 그 이상 교정하면 안 됩니다.", "today", "tomorrow", "yesterday", "Monday"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저나트륨 경련 대응 4문장 순서
    why: 경련의 원인을 먼저 알리고, 고장성 식염수로 멈추라고 지시한 뒤, 구체적인 용량과 방법을 말하고, 경련이 멎은 뒤에도 교정 한도를 지키라고 마무리해요.
    lines:
    - ["He's seizing from acute severe hyponatremia.", siren, "급성 심한 저나트륨혈증으로 경련하고 있습니다", "인지"]
    - ["Give hypertonic saline per protocol to stop the seizures.", pill, "경련을 멈추려고 프로토콜대로 고장성식염수를 주세요", "지시"]
    - ["That means pushing one hundred mLs of three percent saline now.", pill, "그러니 지금 3% 식염수 100mL를 미세요", "용량"]
    - ["Once the seizure stops, we still can't correct him too far today.", shield, "경련이 멈춰도 오늘은 그 이상 교정하면 안 됩니다", "한도"]
- title: 삼투성 탈수초증 위기
  s:
  - ["위기 인지", siren, "'too fast'가 원인임을 말하고 'and'로 결과를 바로 이어 보고해요. 'neurologic changes'는 신경 쪽 이상을 한 번에 가리키는 말이에요.", "on the monitor", "나트륨이 너무 빨리 올라서 피부 변화 보이고 있습니다.", "칼륨이 너무 빨리 올라서 신경학적 변화 보이고 있습니다.", "neurologic", "dietary", "hormonal", "seasonal"]
  - ["재저하 계획", pill, "'may need'는 아직 결정 전의 가능성을 말하는 표현이에요. 'relower'는 너무 오른 나트륨을 다시 내린다는 뜻이에요.", "in the unit", "유리수분이나 DDAVP로 칼륨을 다시 내려야 할 수도 있습니다.", "유리수분이나 DDAVP로 나트륨을 다시 확인해야 할 수도 있습니다.", "DDAVP", "heparin", "aspirin", "insulin"]
  - ["팀 소집", pager, "'urgently'는 지금 바로 급히 움직인다는 뜻이에요. 'Let's'로 시작해 팀이 함께 한다는 느낌을 줘요.", "at the desk", "팀을 급히 참여시키고 유심히 기록하겠습니다.", "팀을 급히 소개하고 유심히 모니터하겠습니다.", "team", "lab", "bed", "floor"]
  - ["변화 보고", chartup, "'in the last ten hours'로 기간을 붙이면 변화의 속도가 보여요. 숫자는 'twelve points'처럼 단위와 함께 말해요.", "on the chart", "지난 10시간 동안 칼륨이 12 올라갔습니다.", "지난 10시간 동안 혈당이 12 올라갔습니다.", "points", "pounds", "inches", "years"]
  - ["증상 보고", siren, "'more'로 이전보다 나빠졌음을 말하고 'now'로 현재 상태를 알려요. 혼란과 어눌한 발음은 신경 증상이에요.", "in the room", "더 혼란스러워하고 지금 걸음도 어눌합니다.", "더 혼란스러워하고 지금 시력도 흐립니다.", "confused", "hungry", "cold", "happy"]
  - ["즉시 호출", pager, "'right away'는 기다리지 않고 지금 바로 한다는 뜻이에요. 'I'm paging'은 지금 하고 있다는 진행형 보고예요.", "on the unit", "지금 바로 신경과와 신장내과 호출번호 확인하겠습니다.", "지금 바로 신경과와 신장내과 호출 내용 기록하겠습니다.", "paging", "signing", "filing", "naming"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 삼투성 탈수초증 4문장 순서
    why: 상승 폭을 먼저 알리고, 신경 증상을 보고한 뒤, 그래서 바로 전문과를 호출하고, 그들이 오면 나트륨을 다시 내릴 수 있다고 알려요.
    lines:
    - ["His sodium went up twelve points in the last ten hours.", chartup, "지난 10시간 동안 나트륨이 12 올라갔습니다", "변화"]
    - ["That's too fast, and now he's more confused with slurred speech.", siren, "너무 빠르고, 이제 더 혼란스러워하며 발음도 어눌합니다", "증상"]
    - ["Because of that, I'm paging neurology and the nephrologist right away.", pager, "그래서 지금 바로 신경과와 신장내과를 호출하겠습니다", "호출"]
    - ["Once they're here, we may need to relower the sodium with free water or DDAVP.", pill, "그들이 오면 유리수분이나 DDAVP로 나트륨을 다시 내려야 할 수도 있습니다", "계획"]
- title: 심한 저마그네슘 TdP 위기
  s:
  - ["위기 인지", siren, "진단을 먼저 외치고 대시 뒤에 바로 지시를 붙이면 팀이 한 번에 움직여요. 'now'는 지체 없이 하라는 뜻이에요.", "on the monitor", "심실세동입니다 — 지금 정맥 마그네슘 주세요.", "서맥입니다 — 지금 정맥 마그네슘 주세요.", "Torsades", "asystole", "bradycardia", "tachycardia"]
  - ["제세동 준비", siren, "'Let's'로 시작해 모두의 일로 만들고 'and'로 두 일을 잇는 팀 표현이에요. 'call for help'는 도움을 부르라는 뜻이에요.", "at the bedside", "제세동기 점검하고 응원 요청하겠습니다.", "제세동기 설명하고 응원 요청하겠습니다.", "defibrillator", "stretcher", "scale", "printer"]
  - ["교정 계획", pill, "'any other'로 마그네슘 말고도 모자란 것을 함께 말해요. 'fast'는 이 위기에서는 서두른다는 뜻이에요.", "in the unit", "마그네슘과 다른 결핍도 빠르게 확인하겠습니다.", "마그네슘과 다른 결핍도 빠르게 보고하겠습니다.", "deficits", "rooms", "rules", "drawers"]
  - ["리듬 보고", monitor, "'way out'은 정상 범위에서 크게 벗어났다는 구어 표현이에요. 'just went'는 방금 바뀌었다는 뜻이에요.", "on the screen", "PR이 크게 벗어났고 리듬이 다형성으로 바뀌었습니다.", "QT가 크게 벗어났고 리듬이 느려졌습니다.", "rhythm", "pulse", "skin", "voice"]
  - ["용량 지시", siren, "'over one to two minutes'로 속도를 분명히 말해 한 번에 넣지 않게 해요. 용량과 시간은 한 문장에 묶어 말해요.", "at the desk", "1~2분에 걸쳐 마그네슘 2그램 준비하세요.", "1~2분에 걸쳐 마그네슘 2그램 확인하세요.", "Push", "Print", "Sign", "Copy"]
  - ["곁에 머물기", siren, "대시 뒤에 이유를 붙이면 왜 떠나지 않는지 분명해요. 'recur'는 한 번 가라앉았다가 다시 생긴다는 뜻이에요.", "in the room", "침상 곁에서 계속 기록하겠습니다 — 빠르게 재발할 수 있습니다.", "침상 곁에 계속 있겠습니다 — 가끔 재발할 수 있습니다.", "recur", "spread", "freeze", "melt"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 토르사드 대응 4문장 순서
    why: 진단을 외치며 마그네슘을 지시하고, 용량과 속도를 말한 뒤, 그동안 제세동기와 도움을 준비하고, 약이 들어간 뒤에도 곁을 지킨다고 알려요.
    lines:
    - ["This is Torsades — give IV magnesium now.", siren, "토르사드입니다 — 지금 정맥 마그네슘 주세요", "진단"]
    - ["Push two grams of it over one to two minutes.", siren, "그걸 1~2분에 걸쳐 2그램 미세요", "용량"]
    - ["While that goes in, let's have the defibrillator ready and call for help.", siren, "그게 들어가는 동안 제세동기를 준비하고 도움을 요청해요", "준비"]
    - ["Once it's in, stay at the bedside — this can recur fast.", siren, "다 들어가면 침상 곁에 머물러요 — 빠르게 재발할 수 있어요", "관찰"]
- title: 저칼슘 후두경련·발작 위기
  s:
  - ["위기 인지", siren, "'Severe'와 'is causing'으로 지금 진행 중인 심한 상태임을 알려요. 'laryngospasm'은 성대 근육이 갑자기 조여 기도가 좁아지는 상태예요.", "on the monitor", "심한 저칼륨이 후두경련과 경련을 일으키고 있습니다.", "심한 저칼슘이 후두부종과 경련을 일으키고 있습니다.", "laryngospasm", "hiccups", "sneezing", "blushing"]
  - ["칼슘·기도", pill, "'and'로 두 가지 일을 묶어 한 번에 지시해요. 'now'는 지체 없이 하라는 뜻이에요.", "at the bedside", "지금 정맥 칼슘 주고 기도 확인하겠습니다.", "지금 정맥 칼슘 주고 기도 기록하겠습니다.", "airway", "skin", "hair", "shoes"]
  - ["감시·재검", monitor, "'monitor'와 'recheck'를 한 문장에 이으면 지켜보는 일과 다시 재는 일이 함께 정해져요. 'ionized'는 활성 형태 칼슘이에요.", "at the desk", "혈압 모니터하고 이온화칼슘 재검하겠습니다.", "심장 모니터하고 이온화칼슘 기록하겠습니다.", "heart", "hair", "shoes", "chart"]
  - ["호흡 보고", siren, "'can't … well'은 공기 이동이 부족하다는 뜻이에요. 'getting worse'는 악화되는 중이라는 진행 표현이에요.", "on the chart", "공기 이동이 잘 안 되고 천명음이 심해지고 있습니다.", "공기 이동이 잘 안 되고 기침이 심해지고 있습니다.", "stridor", "cough", "hiccup", "fever"]
  - ["기도 준비", siren, "'in case'는 아직 필요하지 않아도 미리 준비한다는 뜻이에요. 'Have … ready'는 바로 쓸 수 있게 두라는 지시예요.", "in the hall", "삽관 필요할 수 있어 약 카트 준비해 주세요.", "삽관 필요할 수 있어 기도 카트 확인해 주세요.", "intubation", "discharge", "visitors", "breakfast"]
  - ["천천히 투여", pill, "'slowly'와 'through the central line'을 함께 말해 속도와 경로를 한 번에 지시해요. 빠른 칼슘은 정맥과 심장에 부담이 돼요.", "on the unit", "중심 라인으로 글루콘산칼슘 천천히 준비하세요.", "중심 라인으로 글루콘산칼슘 천천히 확인하세요.", "line", "bag", "door", "wall"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저칼슘 위기 대응 4문장 순서
    why: 위기 소견을 먼저 알리고, 정맥 칼슘을 바로 주라고 지시한 뒤, 속도와 경로를 구체적으로 말하고, 그동안 기도 카트를 준비하게 해요.
    lines:
    - ["Severe low calcium is causing laryngospasm and seizures.", siren, "심한 저칼슘이 후두경련과 경련을 일으키고 있습니다", "인지"]
    - ["Give IV calcium now and protect his airway.", pill, "지금 정맥 칼슘을 주고 기도를 보호하겠습니다", "지시"]
    - ["That calcium is gluconate, pushed slowly through the central line.", pill, "그 칼슘은 글루콘산칼슘이고 중심 라인으로 천천히 밉니다", "방법"]
    - ["While it goes in, have the airway cart ready in case he needs intubation.", siren, "들어가는 동안 삽관이 필요할 수 있으니 기도 카트를 준비해 주세요", "대비"]
- title: 다중 전해질 붕괴 다장기 위기
  s:
  - ["위기 인지", siren, "'critically off'는 정상에서 위험할 만큼 벗어났다는 뜻이에요. 'and'로 전해질과 장기 상태를 한 문장에 묶어요.", "on the monitor", "여러 약물이 심각하게 벗어났고 장기들이 기능을 잃고 있습니다.", "여러 전해질이 심각하게 벗어났고 장비들이 기능을 잃고 있습니다.", "organs", "monitors", "pumps", "lights"]
  - ["우선순위", siren, "'the most life-threatening one first'는 위험도 순으로 일한다는 원칙이에요. 대시 뒤에 이름을 붙여 어느 것인지 분명히 해요.", "in the unit", "가장 생명을 위협하는 것부터 확인하겠습니다 — 칼륨입니다.", "가장 생명을 위협하는 것부터 보고하겠습니다 — 칼륨입니다.", "life-threatening", "recent", "common", "expensive"]
  - ["에스컬레이션", pager, "'escalate to'는 더 높은 단계의 전문가에게 올려 알린다는 뜻이에요. 'consider'는 아직 결정 전의 가능성을 말해요.", "at the desk", "중환자전담의에게 에스컬레이션하고 투석 설명해야 합니다.", "중환자전담의에게 에스컬레이션하고 투석 예약해야 합니다.", "consider", "price", "copy", "sign"]
  - ["장기 보고", monitor, "'all'과 'at once'로 여러 장기가 동시에 힘든 상황을 한 번에 전해요. 'struggling'은 기능이 따라가지 못한다는 구어 표현이에요.", "on the chart", "신장, 간, 뇌가 한꺼번에 어려움을 겪고 있습니다.", "신장, 간, 폐가 차례로 어려움을 겪고 있습니다.", "liver", "skin", "hair", "bones"]
  - ["패널 확인", lab, "'full panel'은 일부가 아니라 전체 검사를 뜻하고 'every'는 하나도 놓치지 않는다는 뜻이에요. 'flagging'은 눈에 띄게 표시한다는 말이에요.", "at the bedside", "전체 패널 뽑고 모든 수치마다 표시하고 있습니다.", "전체 패널 뽑고 위험 수치마다 기록하고 있습니다.", "panel", "chart", "tray", "shelf"]
  - ["목록 처리", board, "'in order of'로 기준을 말하면 무엇부터 할지 정해져요. 'tackle'은 문제를 맡아 해결한다는 구어 표현이에요.", "in the room", "목록 만들어서 위험한 순서대로 공유하겠습니다.", "목록 만들어서 위험한 순서대로 정리하겠습니다.", "tackle", "file", "count", "copy"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 다중 전해질 위기 4문장 순서
    why: 상황을 먼저 알리고, 전체 패널로 위험 수치를 표시한 뒤, 가장 위험한 것부터 치료한다고 정하고, 그 밖의 문제는 상급자에게 올리며 투석을 고려해요.
    lines:
    - ["Multiple electrolytes are critically off and his organs are failing.", siren, "여러 전해질이 심각하게 벗어났고 장기들이 기능을 잃고 있습니다", "상황"]
    - ["To see how bad it is, I'm pulling a full panel and flagging critical values.", lab, "얼마나 나쁜지 보려고 전체 패널을 뽑고 위험 수치를 표시하고 있습니다", "검사"]
    - ["From those flags, let's treat the most life-threatening one first — the potassium.", siren, "그 표시를 보고 가장 생명을 위협하는 것부터 치료하겠습니다 — 칼륨입니다", "우선순위"]
    - ["Beyond that, we need to escalate to the intensivist and consider dialysis.", pager, "그 밖에는 중환자전담의에게 에스컬레이션하고 투석을 고려해야 합니다", "보고"]
