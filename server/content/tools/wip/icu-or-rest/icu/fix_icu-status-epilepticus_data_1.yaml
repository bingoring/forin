# A 검토 + 새로 쓰는 문장의 v46 필드. 상황 제목 + 옛 en으로 위치를 찾는다.
sentence_rewrites:
  - sit: 지속 SE 예후·목표 소통
    old_en: "I know this is hard to hear, and I won't hide anything from you."
    en: "I know this is hard to hear, and we'll keep you updated as we learn more."
    ko: "듣기 힘드시다는 거 알아요. 새로 알게 되는 것이 있으면 계속 알려 드릴게요."
    chunks: ["I know this", "is hard to hear,", "and we'll keep you updated", "as we learn more", "."]
    words: [w-hear, w-update]
    why: "'we'll keep you updated'는 결과를 장담하는 대신 계속 알리겠다는 약속이에요. 'I know this is hard to hear'로 먼저 상대의 마음을 인정해요."
    decoy: "as the shift ends"
    distractorsKo:
      - "믿기 힘드시다는 거 알아요. 새로 알게 되는 것이 있으면 계속 알려 드릴게요."
      - "듣기 힘드시다는 거 알아요. 새로 알게 되는 것이 있으면 내일 알려 드릴게요."
    blank: {answer: hard, wrong: [easy, nice, great]}
  - sit: 지속 SE 예후·목표 소통
    old_en: "We'll support whatever matters most to your family."
    en: "We'll support your family as we focus on what matters most to him."
    ko: "환자분께 가장 중요한 것에 집중하면서, 가족분들도 저희가 도와 드릴게요."
    chunks: ["We'll support your family", "as we focus", "on what matters most", "to him", "."]
    words: [w-support, w-matter, w-most]
    why: "'as we focus on what matters most to him'으로 결정의 기준이 환자(him)의 가치임을 분명히 해요. 'We'll support your family'로 가족은 지지를 받는 사람으로 말해요."
    decoy: "for the tour"
    distractorsKo:
      - "환자분께 가장 급한 것에 집중하면서, 가족분들도 저희가 도와 드릴게요."
      - "환자분께 가장 중요한 것에 집중하면서, 친구분들도 저희가 도와 드릴게요."
    blank: {answer: support, wrong: [question, judge, record]}
  - sit: 발작 후 상태 사정
    old_en: "This is normal, and he wasn't in pain during the seizure."
    en: "This is normal, and he most likely wasn't aware of anything during the seizure."
    ko: "정상적인 거예요. 발작하는 동안에는 아마 아무것도 의식하지 못하셨을 거예요."
    chunks: ["This is normal,", "and he most likely", "wasn't aware of anything", "during the seizure", "."]
    words: [w-normal, w-anything, w-during, w-seizure]
    why: "'This is normal'로 먼저 안심시키고, 'most likely'로 간호사가 확인할 수 없는 부분은 단정하지 않고 가능성으로 말해요."
    decoy: "for the staff"
    distractorsKo:
      - "정상적인 거예요. 발작하기 전에는 아마 아무것도 의식하지 못하셨을 거예요."
      - "다행이에요. 발작하는 동안에는 아마 아무것도 의식하지 못하셨을 거예요."
    blank: {answer: aware, wrong: [proud, ashamed, jealous]}
chunk_fixes:
  - {sit: 발작 관찰·시간 기록, en: "I'll write down how long it lasts and how his body moves.", chunks: ["I'll write down", "how long it lasts", "and how his body moves", "."]}
  - {sit: 발작 중 기도·안전 확보, en: "I'll keep the airway open and never force anything between his teeth.", chunks: ["I'll keep", "the airway open", "and never force anything", "between his teeth", "."]}
  - {sit: 활력·산소 감시, en: "His oxygen saturation is ninety-two percent and holding steady.", chunks: ["His oxygen saturation", "is ninety-two percent", "and holding steady", "."]}
  - {sit: 항경련제 혈중농도·부작용, en: "No new side effects since we adjusted the dose.", chunks: ["No new side effects", "since we adjusted", "the dose", "."]}
  - {sit: 비경련성 SE 인지, en: "He looks calm, but that doesn't rule out a hidden seizure.", chunks: ["He looks calm,", "but that doesn't rule out", "a hidden seizure", "."]}
  - {sit: 발작 중 심한 저산소·서맥 위기, en: "His heart rate is dropping fast while he's still seizing.", chunks: ["His heart rate", "is dropping fast", "while he's still seizing", "."]}
kp_ko:
  - sit: 비경련성 SE 인지
    en: "Let's get an urgent EEG to check his brain activity."
    ko: "뇌 활동을 확인하게 응급 EEG를 하죠."
    distractorsKo: ["보호자에게 보여 주게 응급 EEG를 하죠.", "연구에 쓰려고 응급 EEG를 하죠."]
sentence_words_remove:   # 결정 11 — (상황, en, 뺄 word)
  - {sit: 비경련성 SE 인지, en: "Let's get an urgent EEG to check his brain activity.", rm: w-get}
  - {sit: 비경련성 SE 인지, en: "I'm getting the EEG ordered right now.", rm: w-get}
  - {sit: 발작 중 심한 저산소·서맥 위기, en: "I've got the bag ready — call the code now.", rm: w-get}
  - {sit: 발작 후 뇌부종·ICP 위기, en: "Let's get imaging and consider osmotic therapy.", rm: w-get}
  - {sit: 발작 중 심한 저산소·서맥 위기, en: "Open the airway and bag him with high-flow oxygen now.", rm: w-open}
  - {sit: 발작 후 뇌부종·ICP 위기, en: "Prolonged seizures can cause brain swelling and raised pressure.", rm: w-pressure}
  - {sit: 발작 후 뇌부종·ICP 위기, en: "His pupils look uneven, which can point to rising pressure in his brain.", rm: w-pressure}
word_remove: [w-hide, w-whatever, w-get]
word_add:
  - id: w-update
    en: update
    ipa: "/ʌpˈdeɪt/"
    ko: 새 소식을 알리다
    icon: speech
    example: "I know this is hard to hear, and we'll keep you updated as we learn more."
    exKo: "듣기 힘드시다는 거 알아요. 새로 알게 되는 것이 있으면 계속 알려 드릴게요."
    cue: 상태가 바뀔 때마다 가족에게 바뀐 내용을 전해 주는 동사
    tag: 소통·팀
    distractorsEn: [upgrade, uphold]
    distractorsKo: [미뤄 두다, 감춰 두다]
    chips: [[up, date]]
    decoyChips: [op, data]
word_set:
  w-clear:
    ko: "(물건 없이) 비워 둔"
    cue: 침대 둘레에 부딪힐 만한 물건이 하나도 없이 비워진 상태
    distractorsEn: [close, clever]
    distractorsKo: [붐비는, 어질러진]
  w-thank: {cue: 발작을 보자마자 간호사를 불러 준 보호자에게 고마움을 전하는 동사}
  w-trigger: {cue: 발작 같은 일이 방아쇠를 당기듯 터지게 만드는 동사}
  w-target: {cue: 치료가 이르러야 할 수준을 겨냥해 정하는 동사}
  w-sign: {distractorsKo: [원인, 처방]}
  w-agent: {distractorsKo: [용량, 간호사]}
  w-stroke: {distractorsKo: [뇌전증, 치매]}
