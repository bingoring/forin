nuance:
  # (상황, kind, 앞에서 몇 번째 같은 kind 인지) → 바꿀 필드
  - {sit: 혈당·전해질 확인, kind: context, set: {
      fix_for_scene_idx: 2,
      fix: "His sodium is very low, so we're carefully bringing it up with a special IV fluid.",
      why: "의료진끼리는 진단명과 약 이름을 그대로 써도 돼요. 가족에게는 낯선 말이 불안만 키우니, 무엇이 낮았고 어떻게 되돌리는지를 쉬운 말로 전해요. 발작을 일으킬 만큼 낮은 나트륨은 처방에 따라 고장성 식염수로 처음에 조금 빠르게 올리고, 그 뒤에는 하루에 올리는 폭을 넘지 않게 지켜봐요(너무 빨리 교정하면 삼투성 탈수초 위험)."}}
  - {sit: 지속 SE 예후·목표 소통, kind: context, set: {
      scene_en_idx: 2,
      scene_en: "Honestly, his status epilepticus is refractory and his prognosis is guarded.",
      fix_for_scene_idx: 2,
      fix: "I want to be honest: this is very serious. The doctors will sit down with you to talk about what it means, and we'll stay with you.",
      why: "솔직하게 말하는 것은 중요하지만, 가족에게 refractory나 guarded prognosis 같은 말은 낯설고 차갑게 들려요. 예후는 의사가 가족과 함께 설명하고, 간호사는 심각하다는 사실과 곁에 있겠다는 말을 쉬운 말로 전해요."}}
  - {sit: 2차 항경련제 로딩, kind: slider, set: {
      cue: "Colleague: \"He's still seizing after two doses of the benzodiazepine.\"",
      scale: [wait to see if it stops by itself, move on to the ordered second drug, keep repeating benzos with no limit],
      answerAt: 1,
      why: "벤조디아제핀을 충분히 주고(보통 한 번 반복)도 발작이 계속되면 기다리지 않고 처방된 2차 항경련제(예: levetiracetam)로 넘어가요. 저절로 멈추길 기다리거나, 벤조디아제핀만 끝없이 되풀이하지 않아요(호흡억제 위험).",
      example: "He's still seizing after two doses, so we're loading the second drug now.",
      exKo: "벤조디아제핀을 두 번 줬는데도 아직 발작 중이라 이제 2차 약물을 로딩하고 있어요."}}
  - {sit: 발작 중 기도·안전 확보, kind: slider, set: {scale: [nothing at all in his mouth, a soft cloth between his teeth, a spoon across his tongue], answerAt: 0}}
  - {sit: 벤조디아제핀 초기 투여 보조, kind: slider, set: {
      scale: [write it down and recheck it again much later, "stay, support his breathing, call for help", give flumazenil on your own to reverse it],
      answerAt: 1,
      why: "벤조디아제핀 뒤에 호흡이 느리고 얕아지면 호흡억제일 수 있어요. 곁을 지키며 기도와 호흡을 지지하고 바로 도움을 불러요. 기록만 하고 한참 뒤에 다시 보지 않아요. 플루마제닐은 벤조디아제핀으로 발작을 누르고 있는 환자에게 발작을 다시 일으킬 수 있어 간호사가 혼자 주지 않아요."}}
  - {sit: 발작 후 상태 사정, kind: slider, set: {
      words: [w-drowsy],
      scale: [drowsy, stuporous, unresponsive],
      answerAt: 0,
      why: "이름을 부르면 눈을 떴다가 다시 잠드는 건 졸린(drowsy) 상태예요. 세게 자극해야 잠깐 반응하면 stuporous, 자극해도 반응이 없으면 unresponsive예요. 발작 후 잠시 졸린 건 흔하지만, 깨우기 점점 어려워지거나 반응이 없으면 바로 보고해요."}}
  - {sit: 혈당·전해질 확인, kind: slider, set: {scale: [recheck it at the next vitals, treat the low glucose now per the order, "delay the seizure drugs until it's normal"], answerAt: 1}}
  - {sit: 지속 EEG 모니터 연계, kind: slider, set: {scale: [the seizure is definitely over, the EEG will show if it continues, the seizure is definitely still going], answerAt: 1}}
  - {sit: 유발원인 검사·교정, kind: slider, set: {scale: ["assume it's only the seizure", send cultures and look for an infection, stop seizure drugs until the fever is gone for good], answerAt: 1}}
  - {sit: 반복 발작 약물 단계화, kind: slider, set: {scale: [wait and see what happens next, "tell the team, start the next step", double the second drug on your own now], answerAt: 1}}
  - {sit: 기도확보 준비·삽관 판단, kind: slider, set: {scale: [just keep watching him for now and chart it, "call the team, ready airway equipment", try to intubate him yourself], answerAt: 1}}
  - {sit: 항경련제 혈중농도·부작용, kind: slider, set: {scale: [treat it as fine because the level is normal, report the new sleepiness to the team, raise the dose to be safe], answerAt: 1}}
  - {sit: 원인별 치료 연계, kind: slider, set: {scale: [no there is no chance of that, "we won't know until the imaging is read", yes it is most likely going to be a tumor], answerAt: 1}}
  - {sit: 발작 중 심한 저산소·서맥 위기, kind: slider, set: {
      words: [w-bag, w-high-flow, w-help],
      scale: [wait for the seizure to stop on its own first, just keep watching the heart rate drop, "open airway, bag with oxygen, call for help"],
      answerAt: 2}}
  - {sit: 발작 후 뇌부종·ICP 위기, kind: slider, set: {scale: [keep his head flat so he can rest, recheck at the next routine vitals, report it to neuro right now], answerAt: 2}}
  - {sit: 항경련 마취 중 혈역학 붕괴, kind: slider, set: {scale: [turn the infusion up to stop the seizure faster, support his pressure and have the team reassess, just record the number], answerAt: 1}}
  - {sit: 발작 후 상태 사정, kind: swap, set: {ko: 한동안 졸리고 혼란스러워하는 건 정상이에요}}
  - {sit: 기도확보 준비·삽관 판단, kind: swap, set: {ko: 안전을 위해 호흡관이 필요할 수 있어요}}
