# 뉘앙스·order 수정. 뉘앙스 키 "상황.번호"
nuance:
  "6.0":
    kind: slider
    set:
      scale: [low dose, moderate dose, high dose]
      answerAt: 0
      why: 승압제는 낮은 용량으로 시작해 처방된 목표 혈압(보통 평균동맥압 65 이상)에 맞춰 조금씩 올려요. 처음부터 high dose로 시작하지 않아요.
  "12.0":
    kind: slider
    set:
      why: puffiness는 가벼운 부은 느낌, swelling은 일반적인 부기, edema는 조직에 수분이 고인 부종을 가리키는 의료 용어예요. 누르면 자국이 남으면 차트에 pitting edema로 적어요.
  "13.0":
    kind: slider
    set:
      scale: [conservatively, moderately, aggressively]
      answerAt: 2
    why_replace: [cautiously, conservatively]
  "13.1":
    kind: context
    scene_fix: [1, "Please wash your hands well before you come in, and please don't visit if you feel sick."]
    why_replace: ["가운, 장갑, 손 씻기처럼 해야 할 행동으로 말해 주세요.", "손 씻기, 아플 때 방문하지 않기처럼 해야 할 행동으로 말해 주세요."]
  "19.0":
    kind: slider
    why_replace: ["괴사성 연조직 감염은 spread가 빠른 게 문제라, 펜으로 경계를 표시해 두고 변화를 봐요.", "펜으로 경계를 표시해 변화를 보지만, 괴사성 감염은 피부 경계가 그대로여도 속에서 퍼질 수 있어 이것만으로 안심하지 않아요."]
  "4.0":
    kind: slider
    set:
      why: 한국어로는 다 '아프다'지만 영어는 결이 달라요. 둔하게 계속되는 아픔은 ache, 아픔을 두루 가리키는 말은 pain, 견디기 힘든 극심한 고통은 agony예요.
  "2.1":
    kind: context
    set: {ko: 지연(시키다)}
  "7.1":
    kind: context
    set: {ko: 좋아지다}
  "12.1":
    kind: context
    set: {ko: 균형(을 맞추다)}
  "2.2":
    kind: swap
    swap_option: ["an antibiotic that covers many germs", "an antibiotic that works on many germs"]
    set: {ko: 의심되는 감염을 잡으려고 여러 균에 듣는 항생제를 드리고 있어요}
  "11.2":
    kind: swap
    set: {ko: 지금 중환자실 의사를 불러서 그분을 보게 할게요}
order:
  "1":
    lines:
      2:
        en: "As soon as that moment is over, the antibiotic starts."
        ko: 그 순간이 끝나자마자 항생제를 시작해요
        note: 안내
    why: 채취하는 중이라고 먼저 말하고, 그 채취가 짧다고 안심시킨 뒤, 끝나는 즉시 항생제가 이어진다고 알려요. 3줄의 that moment는 2줄의 a moment를 받고, 마지막 줄은 Later로 항생제 시작 뒤의 일임을 못 박아서 순서가 하나예요.
  "8":
    lines:
      3:
        en: "That matters because once the fluid is drained, the infection often gets better faster."
        ko: 액체를 배액하고 나면 감염이 더 빨리 좋아지는 경우가 많기 때문이에요
    why_replace: ["4줄의 All of that은", "4줄의 That은"]
  "9":
    lines:
      2:
        en: "We'll keep the current one until the first dose of the new one."
        ko: 새 항생제의 첫 투여 전까지 지금 쓰는 걸 유지할게요
  "13":
    lines:
      0:
        en: "His white count is very low, so even a small infection can become serious fast."
        ko: 백혈구 수치가 아주 낮아서 작은 감염도 빠르게 심각해질 수 있어요
      3:
        en: "Under those precautions, please wash your hands and wear what the door sign says."
        ko: 그 조치에 따라 손을 씻고, 병실 문 안내문에 쓰여 있는 대로 착용해 주세요
  "15":
    ko: 불응성 쇼크 치료 단계 올리기 4문장 순서
    why: 상태를 먼저 알리고, 그것을 치료 단계를 올려야 하는 이유로 해석한 뒤, 호출하고, 호출을 기다리는 동안 기록하는 순서예요. 2줄의 This는 1줄을, 3줄의 To do that은 2줄의 escalate를, 4줄의 the intensivist는 3줄에서 부른 사람을 가리켜서 순서가 하나예요.
    lines:
      1:
        ko: 이건 지금 치료 단계를 올려야 한다는 뜻이에요
      3:
        en: "While we wait for the intensivist, please document the pressor doses before we add more."
        ko: 중환자전담의를 기다리는 동안 더 추가하기 전에 승압제 용량을 기록해 주세요
  "18":
    lines:
      1:
        en: "That's because his kidneys are failing fast — creatinine doubled in a day."
      2:
        en: "With kidneys failing that fast, he needs continuous dialysis to control fluid and electrolytes."
        ko: 신장이 그렇게 빠르게 멈추고 있어서 수액과 전해질을 조절하려면 지속적 투석이 필요해요
    why: 소견을 알리고, 그 이유인 신장 악화를 설명하고, 투석이 필요하다고 이은 뒤, 투석을 시작하려고 신장내과팀을 부르는 순서예요. 2줄의 That's because는 1줄을, 3줄의 that fast는 2줄을, 4줄의 it은 3줄의 dialysis를 가리켜서 순서가 하나예요.
  "19":
    lines:
      3:
        en: "Until they arrive, I'll keep monitoring his pressure and lactate."
        ko: 수술실 팀이 도착할 때까지 혈압과 젖산을 계속 감시할게요
    why: 상태를 알리고, 그것이 응급 수술이 필요하다는 뜻이라고 이은 뒤, 수술실에 알리고, 수술팀이 올 때까지 계속 감시한다고 마무리해요. 2줄의 That means는 1줄을 받고, 4줄의 they는 3줄의 수술실 팀을 가리켜서 순서가 하나예요.
  "20":
    lines:
      3:
        en: "Once we know that, the team can help you weigh the options honestly."
        ko: 그걸 알면 팀이 선택지를 솔직하게 저울질하도록 도울 수 있어요
