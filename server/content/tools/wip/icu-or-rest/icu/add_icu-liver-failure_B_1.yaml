- title: 암모니아·응고·간효소 추적
  s:
  - ["검사 설명", lab, "'show how your liver is working'은 검사를 간이 일하는 정도를 보여 주는 지표로 풀어 줘요. 어려운 수치 대신 환자가 이해할 목적을 말해요.", "in the lab", "이 검사들은 지금 신장이 어떻게 일하고 있는지 보여 줘요.", "이 검사들은 지금 간이 어떻게 쉬고 있는지 보여 줘요.", "working", "growing", "shrinking", "sleeping"]
  - ["암모니아 설명", pill, "'relates to'는 원인이라고 단정하지 않고 관련이 있다고만 말해서 정확하고 부드러워요. 암모니아는 간이 약해지면 쌓여 혼란과 이어져요.", "that we check", "암모니아 수치는 저희가 지켜보는 어지럼과 관련이 있어요.", "콜레스테롤 수치는 저희가 지켜보는 혼란과 관련이 있어요.", "ammonia", "oxygen", "glucose", "sodium"]
  - ["반복 이유", redo, "'to see if'로 목적을 먼저 말하면 환자가 같은 검사를 왜 또 하는지 납득해요. 추세를 봐야 호전인지 알 수 있어요.", "to see why", "퇴원해도 되는지 보려고 반복해서 검사해요.", "좋아지고 있는지 보려고 반복해서 설명해요.", "improving", "leaving", "resting", "waiting"]
  - ["응고 설명", bandage, "'how well'로 정도를 말하면 응고 수치가 피가 굳는 능력의 척도라는 점이 환자에게 쉽게 전달돼요.", "that your", "응고 수치는 피가 얼마나 빨리 굳는지 알려 줘요.", "소변 수치는 피가 얼마나 잘 굳는지 알려 줘요.", "clot", "flow", "thin", "pool"]
  - ["효소 설명", stetho, "'because'로 이유를 이어 주면 수치가 높은 까닭이 한 문장에 풀려요. 간 세포가 다치면 효소가 혈액으로 새어 나와요.", "even if the", "근육 세포가 손상받아서 간효소 수치가 높아요.", "간 세포가 손상받아서 혈당 수치가 높아요.", "stressed", "healthy", "rested", "normal"]
  - ["매일 추적", calendar, "'every morning'은 규칙적인 시점을 알려 줘서 환자가 일정을 예측하게 해요. 'to track any change'는 검사의 목적을 말해요.", "as for", "변화를 추적하려고 매일 저녁 이 검사를 확인해요.", "변화를 추적하려고 매일 아침 이 검사를 예약해요.", "labs", "meals", "shifts", "visits"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 간 검사 설명 4문장 순서
    why: 검사가 무엇을 보여 주는지 먼저 말하고, 세부 의미를 설명한 뒤, 얼마나 자주 하는지와 반복의 이유로 마무리해요.
    lines:
    - ["These tests show how your liver is working right now.", lab, "이 검사들은 지금 간이 어떻게 일하고 있는지 보여 줘요", "목적"]
    - ["The ammonia level relates to the confusion we watch for.", pill, "암모니아 수치는 저희가 지켜보는 혼란과 관련이 있어요", "의미"]
    - ["We check that level every morning to track any change.", calendar, "변화를 추적하려고 그 수치를 매일 아침 확인해요", "빈도"]
    - ["Repeating the checks tells us if you're improving.", redo, "반복해서 확인하면 좋아지고 있는지 알 수 있어요", "이유"]
