    - ["That's why I'll check how alert and oriented he is now.", magnify, "그래서 지금 그가 얼마나 각성돼 있고 지남력이 있는지 확인할게요", "사정"]
    - ["Please tell me if he becomes more sleepy or agitated.", speech, "더 졸려하거나 초조해하면 저에게 알려 주세요", "요청"]
