- title: 간부전 사정·의식 관찰
  s:
  - ["원인 설명", stetho, "'can'은 가능성만 말해서 가족에게 확정처럼 들리지 않아요. 간 기능이 떨어지면 독소가 뇌에 영향을 줄 수 있다는 설명이에요.", "from the stomach", "혼란은 췌장이 뇌에 영향을 주면서 생길 수 있어요.", "혼란은 간이 눈에 영향을 주면서 생길 수 있어요.", "brain", "skin", "bone", "throat"]
  - ["의식 사정", magnify, "'alert and oriented'는 의식 사정의 두 축을 한 번에 말해요. 깨어 있는지와 자기 상태를 아는지를 함께 봐요.", "to the family", "지금 얼마나 각성돼 있고 지남력이 있는지 보고할게요.", "지금 얼마나 각성돼 있고 지남력이 있는지 적어 둘게요.", "oriented", "jaundiced", "swollen", "feverish"]
  - ["변화 알림", speech, "'Please tell me if'로 시작하면 가족에게 부담 없이 변화를 알려 달라는 요청이 돼요. 졸림과 초조함은 의식이 변하는 대표 신호예요.", "so that he", "더 배고파하거나 초조해하면 저에게 알려 주세요.", "더 졸려하거나 목말라하면 저에게 알려 주세요.", "agitated", "thirsty", "hungry", "chilly"]
  - ["기저치 비교", chartup, "'against yesterday's baseline'은 비교 기준을 분명히 말해 줘요. 같은 사람의 이전 상태와 견줘야 변화가 보여요.", "than before", "어제 기저치와 비교해서 정신 상태 등급을 기록하고 있어요.", "어제 기저치와 비교해서 정신 상태 등급을 공유하고 있어요.", "baseline", "labs", "scan", "weight"]
  - ["가족 질문", speech, "'on his own'은 누가 깨우지 않았는데도 눈을 떴는지를 묻는 말이에요. 자발적 눈 뜨기는 의식 정도를 가르는 단서예요.", "by the window", "어젯밤에 스스로 눈을 뜬 적이 있나요?", "오늘 아침에 스스로 눈을 비빈 적이 있나요?", "eyes", "gown", "tray", "curtain"]
  - ["가족 협력", handshake2, "'It's very helpful when'으로 가족의 관찰이 도움이 된다고 말하면 계속 알려 달라는 뜻이 따뜻하게 전해져요.", "that you saw", "그가 간호사를 못 알아봤다고 말씀해 주시는 게 큰 도움이 돼요.", "그가 의사를 못 알아봤다고 말씀해 주시는 게 큰 도움이 돼요.", "helpful", "harmful", "rude", "costly"]
  order:
