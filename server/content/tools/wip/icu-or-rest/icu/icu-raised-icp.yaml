    words:
    - w-alert
    cue: 'Chart: "He opens his eyes only when I call his name loudly."'
    scale:
    - alert
    - to voice
    - to pain
    - none
    answerAt: 1
    why: 신경 ICU에서는 의식 수준을 흔히 AVPU로 적어요. alert는 스스로 깨어 있는 상태, to voice는 부르면 눈을 뜨는 상태, to pain은 통증 자극에만 반응하는 상태, 마지막은 반응이 없는 상태예요. 소리쳐 불러야 눈을 뜬다면 to voice예요.
    example: He's alert at baseline, but now he only opens his eyes to voice.
    exKo: 원래는 또렷했는데 지금은 부를 때만 눈을 떠요.
  - kind: context
    words:
    - w-reactive
    word: reactive
    ko: 반응하는
    scenes:
    - who: 의사에게 보고
      icon: monitor
      en: Left pupil is no longer reactive to light, and he's more drowsy.
      ok: true
    - who: 가족에게
      icon: me
      en: Pupils reactive bilaterally, PERRL, GCS 14, no acute change.
      ok: false
      fix: His eyes still react to light, which is a good sign, and we're checking them often.
    - who: 차트 기록
      icon: board
      en: Pupils equal, round, and reactive to light at 0800.
      ok: true
    why: 의료진끼리는 PERRL, GCS 같은 약어가 빠르고 정확해요. 하지만 가족에게는 무슨 뜻인지 알 수 없고 오히려 불안하게 들려요. 같은 사실을 눈이 빛에 반응한다는 쉬운 말로 풀어 주세요.
