    words:
    - w-change
    who: 가족에게 · 변화 안내
    icon: me
    before:
    - 'We''ll tell you right away if there is any '
    - neuro change
    - ' in him.'
    options:
    - difference you can see
    - neuro change
    - GCS drop
    answer: difference you can see
    notes:
      difference you can see: 가족도 바로 알아볼 수 있는 쉬운 말이라 무엇을 알려 주겠다는 건지 분명하다.
      neuro change: 의료진끼리 쓰는 말이라 가족은 무엇이 바뀌는지 감이 오지 않는다.
