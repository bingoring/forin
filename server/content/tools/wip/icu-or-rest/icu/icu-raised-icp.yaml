  order:
    tag: 대화 흐름
    icon: compass
    ko: 신경학적 사정 설명 4문장 순서
    why: 무엇을 보는지 먼저 말하고, 나온 소견을 알린 뒤, 이전 사정과 견주고, 차이는 팀으로 넘긴다고 맺어요.
