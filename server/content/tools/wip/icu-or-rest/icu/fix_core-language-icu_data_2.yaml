# 단어 수정. set = 필드 덮어쓰기. changes = changes 파일에 적을 v44 필드(en ipa ko icon example)
words:
  - {id: w-member, set: {decoyChips: [men, bur]}}
  - {id: w-letter, set: {decoyChips: [lat, tor]}}
  - {id: w-gently, set: {decoyChips: [gem, tle]}}
  - {id: w-appropriate, set: {decoyChips: [app, prime]}}
  - {id: w-clearly, set: {decoyChips: [clean, lee]}}
  - {id: w-naturally, set: {decoyChips: [net, ful]}}
  - {id: w-basic, changes: [en, ipa, ko],
     set: {en: basics, ipa: "/ˈbeɪsɪks/", ko: "기본 사항", chips: [[ba, sics]], decoyChips: [bay, sick],
           distractorsEn: [details, bases], distractorsKo: ["세부 사항", "기초 공사"]}}
  - {id: w-much, set: {distractorsEn: [little, match], distractorsKo: ["그렇게 조금", "가장 많이"]}}
  - {id: w-clear, set: {distractorsKo: ["복잡한", "영리한"]}}
  - {id: w-lot, set: {distractorsEn: [plot, slot], distractorsKo: ["줄거리", "틈"]}}
  - {id: w-concern, changes: [ko],
     set: {ko: "걱정되게 하다", distractorsEn: [conceal, concede], distractorsKo: ["숨기게 하다", "인정하게 하다"],
           cue: "마음에 걸려 신경 쓰이게 하는 것 — 거부나 망설임의 이유를 물을 때 쓰는 동사"}}
  - {id: w-help, changes: [ko], set: {ko: "돕다·도움"}}
  - {id: w-print, changes: [ko], set: {ko: "활자"}}
  - {id: w-everything, set: {distractorsEn: [nothing, everyone], distractorsKo: ["아무것도", "모든 사람"]}}
  - {id: w-anything, set: {distractorsEn: [anyone, something], distractorsKo: ["누구든", "무언가"]}}
  - {id: w-great, set: {distractorsEn: [grain, grand]}}
  - {id: w-fair, set: {distractorsEn: [faint, fade]}}
  # cue가 ko를 되풀이한 9개
  - {id: w-response, set: {cue: "말을 걸거나 손을 잡았을 때 환자가 보이는 눈 뜨기·손 쥐기 — 진정 환자에게서 기다리는 것"}}
  - {id: w-news, set: {cue: "새로 알게 된 일 — 좋든 나쁘든 가족에게 전하는 내용, 앞에 '힘든'이 붙기도"}}
  - {id: w-alone, set: {cue: "곁에 아무도 없이 — 슬픈 소식 뒤 가족을 홀로 두지 않겠다고 할 때"}}
  - {id: w-fully, set: {cue: "일부만이 아니라 빠짐없이 — 이해할 때까지 시간을 줄 때"}}
  - {id: w-way, set: {cue: "어떤 일을 해 나가는 방법 — 상대가 편한 말투로 맞추겠다고 할 때"}}
  - {id: w-rather, set: {cue: "'would ○○'로 써서 어느 쪽을 더 바라는지 물을 때 — 피했으면 하는 말을 물을 때"}}
  - {id: w-own, set: {cue: "남의 것이 아니라 그 사람 것 — 들은 내용을 자기 말로 되풀이하게 할 때(teach-back)"}}
  - {id: w-moment, set: {cue: "아주 짧은 시간 — 반응을 기다려 주겠다고 할 때"}}
  - {id: w-small, set: {cue: "크기나 중요도가 하찮은 — 사소해 보여도 물어보라고 용기를 줄 때"}}
exko:
  # 문장 ko를 바꿨으니 그 문장을 예문으로 쓰는 단어의 exKo도 같은 ko로
  - {ids: [w-interpreter, w-professional], example: "I'll get a professional interpreter for us right away.", exKo: "제가 바로 전문 통역사를 불러드릴게요."}
  - {ids: [w-worry, w-translate], example: "Please don't worry about translating everything yourself.", exKo: "혼자서 전부 통역하실 걱정은 안 하셔도 돼요."}
remove: [w-long]
