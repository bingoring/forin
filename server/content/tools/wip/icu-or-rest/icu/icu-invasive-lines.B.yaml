situations:
- title: 중심정맥관 삽입 보조·준비
  sentences:
  - en: I've confirmed his consent and set up the sterile field.
    ko: 동의서 확인했고, 멸균 시야도 준비했어요.
    chunks:
    - I've confirmed
    - his consent
    - and set up
    - the sterile field
    - .
    words:
    - w-confirm
    - w-consent
    - w-sterile
    - w-field
    goal: 1
    tag: 준비 보고
    icon: board
    why: 현재완료 I've …로 이미 끝낸 일을 보고해요. 동의서와 멸균 시야 두 가지를 and로 묶어 한 번에 전해요.
    decoy: the supply cart
    distractorsKo:
    - 동의서 확인했고, 물품 카트도 옮겨뒀어요.
    - 동의서 확인했고, 초음파 기기도 준비했어요.
    blank:
      answer: consent
      options:
      - en: consent
      - en: insurance
      - en: wristband
      - en: address
  - en: Full barrier precautions are ready — gown, gloves, mask, drape.
    ko: 최대 멸균 차단 다 준비됐어요, 가운, 장갑, 마스크, 방포까지요.
    chunks:
    - Full barrier precautions
    - are ready
    - — gown,
    - gloves,
    - mask,
    - drape
    - .
    words:
    - w-barrier
    - w-precaution
    - w-ready
    - w-gown
    - w-glove
    - w-mask
    - w-drape
    goal: 1
    tag: 차단 준비
    icon: shield
    why: 품목을 대시 뒤에 나열하면 무엇이 갖춰졌는지 한눈에 확인돼요. Full은 일부가 아니라 전부라는 뜻이에요.
    decoy: towel
    distractorsKo:
    - 최대 멸균 차단 다 준비됐어요, 가운, 장갑, 마스크, 수건까지요.
    - 최대 멸균 차단 다 준비됐어요, 모자, 장갑, 마스크, 방포까지요.
    blank:
      answer: drape
      options:
      - en: drape
      - en: towel
      - en: brush
      - en: tray
  - en: Let's do the time-out before you start.
    ko: 시작하기 전에 타임아웃부터 할게요.
    chunks:
    - Let's do
    - the time-out
    - before you start
    - .
    words:
    - w-timeout
    - w-start
    goal: 2
    tag: 타임아웃
    icon: pushpin
    why: Let's는 시술자와 내가 함께 한다는 느낌을 줘서 멈춤 확인이 지시가 아니라 합의로 들려요. before you start가 시점을 못 박아요.
    decoy: the sign-in
    distractorsKo:
    - 시작하기 전에 손 위생부터 할게요.
    - 시작하기 전에 물품 점검부터 할게요.
    blank:
      answer: start
      options:
      - en: start
      - en: scrub
      - en: leave
      - en: drape
  - en: I've verified his coags and the ultrasound is set up.
    ko: 응고 수치 확인했고, 초음파도 준비해뒀어요.
    chunks:
    - I've verified
    - his coags
    - and the ultrasound
    - is set up
    - .
    words:
    - w-verify
    - w-coag
    - w-ultrasound
    goal: 2
    tag: 준비 확인
    icon: lab
    why: coags는 응고 수치를 줄인 현장 약어예요. 검사 확인과 장비 준비를 한 문장에 묶어 시술자가 바로 시작할 수 있다고 알려요.
    decoy: and the guidewire
    distractorsKo:
    - 응고 수치 확인했고, 의자도 가져다 뒀어요.
    - 응고 수치 확인했고, 소독액도 준비해뒀어요.
    blank:
      answer: ultrasound
      options:
      - en: ultrasound
      - en: x-ray
      - en: bronchoscope
      - en: stretcher
  - en: I told him the drape will cover his face, but he can still breathe fine.
    ko: 방포가 얼굴을 덮을 거라고 말씀드렸어요, 그래도 숨쉬는 덴 문제없다고요.
    chunks:
    - I told him
    - the drape will cover
    - his face
    - ', but he can'
    - still breathe fine
    - .
    words:
    - w-drape
    - w-cover
    - w-face
    - w-breathe
    goal: 1
    tag: 환자 안심
    icon: faceWorried
    why: but으로 불안 요인(얼굴을 덮음)에 곧바로 안심(숨쉬기 문제없음)을 붙이면 환자가 놀라지 않아요.
    decoy: his hands
    distractorsKo:
    - 방포가 가슴을 덮을 거라고 말씀드렸어요, 그래도 숨쉬는 덴 문제없다고요.
    - 아내분께 방포가 얼굴을 덮을 거라고 말씀드렸어요, 그래도 숨쉬는 덴 문제없다고요.
    blank:
      answer: breathe
      options:
      - en: breathe
      - en: swallow
      - en: see
      - en: bend
  order:
    tag: 대화 흐름
    icon: compass
    ko: 중심정맥관 삽입 준비 4문장 순서
    why: 동의서와 응고 수치부터 확인하고, 그다음 멸균 준비를 하고, 그 사이 환자를 안심시킨 뒤, 덮고 나서 타임아웃을 해요.
    lines:
    - en: I've checked his consent and his coags.
      icon: board
      ko: 동의서랑 응고 수치 확인했어요
      note: 확인
    - en: With those done, I'll set up the sterile field.
      icon: shield
      ko: 그게 끝났으니 멸균 시야를 준비할게요
      note: 준비
    - en: While that's going on, I'll tell him he can still breathe under the drape.
      icon: faceWorried
      ko: 그동안 방포 밑에서도 숨 쉴 수 있다고 말씀드릴게요
      note: 안심
    - en: Once he's draped, let's do the time-out before you start.
      icon: pushpin
      ko: 덮고 나면 시작하기 전에 타임아웃을 해요
      note: 타임아웃
- title: 동맥관 삽입 보조·영점
  sentences:
  - en: I'll level the transducer at the phlebostatic axis and zero it.
    ko: 트랜스듀서를 정맥정수압축에 맞춰 수평 잡고 영점 조정할게요.
    chunks:
    - I'll level
    - the transducer
    - at the phlebostatic axis
    - and zero it
    - .
    words:
    - w-level
    - w-transducer
    - w-phlebaxis
    - w-zero
    goal: 1
    tag: 영점 조정
    icon: gear
    why: level과 zero를 and로 이으면 수평 잡기에서 영점으로 가는 순서가 그대로 들려요. 높이가 틀리면 수치가 어긋나서 두 동작을 한 문장에 묶어요.
    decoy: the flush bag
    distractorsKo:
    - 트랜스듀서를 정맥정수압축에 맞춰 수평 잡고 케이블도 정리할게요.
    - 트랜스듀서를 정맥정수압축에 맞춰 수평 잡고 폴대도 고정할게요.
    blank:
      answer: level
      options:
      - en: level
      - en: tilt
      - en: swap
      - en: clean
  - en: The arterial waveform looks sharp with a good dicrotic notch.
    ko: 동맥 파형이 또렷하고 중복파도 잘 보여요.
    chunks:
    - The arterial waveform
    - looks sharp
    - with a good
    - dicrotic notch
    - .
    words:
    - w-arterial
    - w-waveform
    - w-sharp
    - w-dicrotic
    - w-notch
    goal: 2
    tag: 파형 확인
    icon: monitor
    why: looks + 형용사는 눈으로 본 상태를 말해요. 중복파(dicrotic notch)를 짚어 파형이 제대로 나오는지 구체적으로 보고해요.
    decoy: mean pressure
    distractorsKo:
    - 동맥 파형이 규칙적이고 중복파도 잘 보여요.
    - 동맥 파형이 또렷하고 수축기 정점도 잘 보여요.
    blank:
      answer: arterial
      options:
      - en: arterial
      - en: venous
      - en: pulmonary
      - en: cardiac
  - en: Cuff pressure and the A-line correlate within range.
    ko: 커프 압력이랑 동맥관 수치가 범위 안에서 잘 맞아요.
    chunks:
    - Cuff pressure
    - and the A-line
    - correlate within range
    - .
    words:
    - w-cuff
    - w-pressure
    - w-aline
    - w-correlate
    - w-range
    goal: 2
    tag: 수치 비교
    icon: chartup
    why: 두 측정값을 and로 나란히 놓고 correlate라고 하면 "똑같다"가 아니라 "임상적으로 맞는다"는 뜻이 돼요. 영점과 수평을 맞춘 뒤에 하는 확인이에요.
    decoy: and the monitor
    distractorsKo:
    - 커프 압력이랑 맥박 수치가 범위 안에서 잘 맞아요.
    - 커프 크기랑 동맥관 수치가 범위 안에서 잘 맞아요.
    blank:
      answer: correlate
      options:
      - en: correlate
      - en: differ
      - en: expire
      - en: rotate
  - en: I'm flushing the line to clear the tubing of air.
    ko: 튜빙 안 공기 없애려고 라인을 세척하고 있어요.
    chunks:
    - I'm flushing
    - the line
    - to clear
    - the tubing of air
    - .
    words:
    - w-flush
    - w-line
    - w-clear
    - w-tubing
    - w-air
    goal: 1
    tag: 라인 세척
    icon: gear
    why: to clear로 목적을 문장 안에 붙이면 왜 지금 flush하는지 바로 이해돼요. clear A of B는 A에서 B를 없앤다는 틀이에요.
    decoy: the room of visitors
    distractorsKo:
    - 튜빙 안 혈액 없애려고 라인을 세척하고 있어요.
    - 수액 주머니 안 공기 없애려고 라인을 세척하고 있어요.
    blank:
      answer: air
      options:
      - en: air
      - en: blood
      - en: dust
      - en: saline
  - en: I'll document the zero and note the transducer height.
    ko: 영점 조정 기록하고 트랜스듀서 높이도 적어둘게요.
    chunks:
    - I'll document
    - the zero
    - and note
    - the transducer height
    - .
    words:
    - w-document
    - w-zero
