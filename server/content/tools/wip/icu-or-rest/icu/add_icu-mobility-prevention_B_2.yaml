situations:
- title: 수동 관절운동
  s:
  - ["관절 운동", run, "'so'로 목적을 붙이면 왜 관절을 움직이는지 환자와 동료가 바로 알아요. 움직이지 않는 관절은 점점 굳어요.", "his gentle massage", "관절이 붓지 않도록 수동 관절가동범위 운동을 해요.", "피부가 갈라지지 않도록 수동 관절가동범위 운동을 해요.", "stiffen", "swell", "bleed", "itch"]
  - ["부드럽게", run, "'gently'로 힘의 정도를 말하고 'full range'로 움직이는 폭을 말해요. 수동 운동은 환자가 힘을 쓰지 않아서 돌보는 사람이 속도를 조절해요.", "each finger firmly", "각 관절을 절반 범위까지 부드럽게 움직일게요.", "각 발가락을 전체 범위까지 부드럽게 움직일게요.", "full", "half", "small", "short"]
  - ["중단 기준", siren, "'if'로 멈추는 조건을 먼저 밝혀 두면 환자가 불편을 말하기 쉬워요. 통증과 저항은 더 움직이면 안 된다는 신호예요.", "or relief", "통증이나 저항이 줄면 범위를 넓힐게요.", "통증이나 저항이 줄면 한 번 더 할게요.", "resistance", "relief", "comfort", "calm"]
  - ["운동 목적", shield, "'helps prevent'는 확정이 아니라 위험을 줄인다는 표현이라 정확해요. 구축은 관절이 굳어 펴지지 않는 상태예요.", "from falling", "움직이지 못하는 동안 폐렴을 예방하는 데 도움이 돼요.", "움직이지 못하는 동안 경련을 예방하는 데 도움이 돼요.", "contractures", "seizures", "fractures", "allergies"]
  - ["근력 설명", bulb, "'fast'로 근육이 약해지는 속도를 강조해요. 가만히 누워 있으면 근육이 하루하루 빠르게 줄어요.", "when families sleep", "환자가 가만히 누워만 있으면 시력이 빨리 약해져요.", "환자가 가만히 누워만 있으면 청력이 빨리 약해져요.", "Muscles", "Lungs", "Kidneys", "Nerves"]
  - ["격려", star, "'look at you now'는 어제와 오늘을 견줘 진전을 눈앞에 보여 줘요. 환자가 회복을 느끼면 운동에 참여할 힘이 생겨요.", "you could lift it", "그녀에게 '지난주에는 전혀 못 들었는데 — 지금 보세요'라고 말했어요.", "그녀에게 '어제는 전혀 못 걸었는데 — 지금 보세요'라고 말했어요.", "now", "later", "soon", "again"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 수동 관절운동 4문장 순서
    why: 목적을 밝히고, 움직이는 방법을 말한 뒤, 멈추는 기준을 알리고, 이렇게 하면 구축을 예방한다고 마무리해요.
    lines:
    - ["Let's do his passive range-of-motion so his joints don't stiffen.", run, "관절이 굳지 않도록 수동 관절가동범위 운동을 해요", "시작"]
    - ["I'll take each joint gently through its full range.", run, "각 관절을 전체 범위까지 부드럽게 움직일게요", "방법"]
    - ["If he shows pain or resistance at any joint, I'll stop there.", siren, "어느 관절이든 통증이나 저항이 보이면 거기서 멈출게요", "중단"]
    - ["Done this way, it helps prevent contractures while he's immobile.", shield, "이렇게 하면 움직이지 못하는 동안 구축을 예방해요", "효과"]
- title: 인공호흡 환자 조기 이동
  s:
  - ["안전 선별", check, "'but'으로 인공호흡기라는 불리한 조건과 안정이라는 유리한 조건을 함께 말해요. 안정적이어야 이동이 안전하다는 판단이에요.", ", so let's bathe", "산소마스크를 썼지만 안정적이니 안전하게 이동시켜요.", "기관절개관을 달았지만 안정적이니 안전하게 이동시켜요.", "stable", "agitated", "febrile", "jaundiced"]
  - ["인력 확보", handshake2, "'enough hands'는 사람 수가 충분해야 한다는 관용 표현이에요. 인공호흡기 회로와 여러 라인은 한 사람이 다 보기 어려워요.", "enough time", "인공호흡기와 모든 라인을 관리할 시간이 충분히 필요해요.", "인공호흡기와 모든 라인을 관리할 공간이 충분히 필요해요.", "hands", "gloves", "chairs", "blankets"]
  - ["기도 담당", stetho, "'one person'으로 역할을 한 사람에게 못 박으면 기도를 서로 미루지 않아요. 이동 중 튜브가 빠지면 가장 위험해서예요.", "one person to weigh", "기도를 지킬 사람을 두 명 배정할게요.", "기도를 지킬 사람을 세 명 배정할게요.", "assign", "invite", "hire", "teach"]
  - ["중단 기준", siren, "'immediately'로 망설이지 않고 멈춘다는 약속이에요. 이동 중 산소포화도나 혈압이 떨어지면 먼저 멈추고 살펴야 해요.", "if his pain rises", "산소포화도나 혈압이 안정되면 계속 진행해요.", "산소포화도나 혈압이 안정되면 한 단계 올려요.", "drop", "rise", "settle", "improve"]
  - ["가족 안심", speech, "'but'으로 걱정되는 모습을 인정한 뒤 이로운 점을 말해요. 먼저 공감하면 가족이 설명을 받아들이기 쉬워요.", "it sounds loud", "시끄럽지만 회복에 도움이 된다고 가족에게 말했어요.", "무서워 보이지만 회복에 도움이 된다고 아들에게 말했어요.", "scary", "loud", "messy", "crowded"]
  - ["이동의 이유", bulb, "'would only'는 가만히 있는 것의 불이익을 강조해요. 오래 누워 있으면 근육이 하루에도 빠르게 줄어요.", "his heart faster", "이렇게 오래 가만히 누워 있으면 폐만 더 빨리 약해져요.", "이렇게 오래 가만히 누워 있으면 신장만 더 빨리 약해져요.", "muscles", "lungs", "kidneys", "eyes"]
  - ["알람 설명", speech, "'during this move'로 알람이 울리는 때를 한정해서 말해요. 이동 중에는 알람이 잠깐 울릴 수 있어서 미리 안내하는 경우가 있어요.", "during this meal", "이동 중 호출벨 알람은 응급 상황이 아니라고 말했어요.", "이동 중 문 알람은 응급 상황이 아니라고 말했어요.", "alarm", "hose", "cart", "pole"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 인공호흡 환자 이동 4문장 순서
    why: 안정 여부를 보고 이동을 정하고, 필요한 인력을 말한 뒤, 기도 담당을 정하고, 멈추는 기준을 정해요.
    lines:
    - ["He's vented but stable, so let's mobilize him safely.", check, "인공호흡기를 달았지만 안정적이니 안전하게 이동시켜요", "선별"]
    - ["We'll need enough hands to manage the vent and every line.", handshake2, "인공호흡기와 모든 라인을 관리할 손이 충분히 필요해요", "인력"]
    - ["Of those hands, I'll assign one person to guard the airway.", stetho, "그 손 중 한 명에게 기도를 지키게 배정할게요", "담당"]
    - ["With the airway covered, we stop immediately if his sats or pressure drop.", siren, "기도를 맡겼으니 산소포화도나 혈압이 떨어지면 바로 멈춰요", "중단"]
- title: 낙상 위험 관리
  s:
  - ["낙상 사정", magnify, "'before we help her up'으로 일으키기 전에 사정한다고 못 박았어요. 낙상은 일어나는 순간에 가장 많이 생겨요.", "her pain score", "휠체어로 옮기기 전에 낙상 위험을 사정해요.", "화장실에 데려가기 전에 낙상 위험을 사정해요.", "fall", "bleeding", "choking", "dehydration"]
  - ["안전 장비", handshake2, "'so'가 위험 판정에서 대책으로 이어요. 보행벨트와 직원 둘을 말하면 장비와 인력을 한 번에 밝혀요.", "and one chair", "낙상 고위험군이라 보행벨트와 직원 세 명을 쓸게요.", "낙상 고위험군이라 보행벨트와 치료사 두 명을 쓸게요.", "two", "three", "four", "six"]
  - ["환경 정리", check, "'first'로 이동 전에 한다는 순서를 알려요. 바퀴가 잠겨 있어야 침대나 의자가 움직이지 않아요.", "and open the door", "먼저 길을 치우고 문을 잠글게요.", "먼저 길을 치우고 서랍을 잠글게요.", "wheels", "door", "drawer", "locker"]
  - ["앉히기 기준", siren, "'at the first sign'은 증상이 심해지기 전, 낌새만 보여도 움직인다는 말이에요. 어지러우면 바로 앉혀야 넘어지지 않아요.", "at the first sign of pain", "배고픈 첫 낌새만 보여도 앉힐게요.", "심심한 첫 낌새만 보여도 앉힐게요.", "dizziness", "hunger", "boredom", "thirst"]
  - ["동행 보행", run, "'with the gait belt on'으로 벨트를 이미 채웠다고 말해요. 옆에서 벨트를 잡고 걸으면 휘청일 때 바로 붙잡아요.", "with the belt off", "보행벨트를 채우고 복도에서 함께 걷고 있어요.", "보행벨트를 채우고 옆에서 함께 이야기하고 있어요.", "walking", "talking", "waiting", "standing"]
  - ["대기 인력", handshake2, "'ready to'는 이미 자리에 서서 대기한다는 말이에요. 휘청이는 순간은 짧아서 미리 서 있어야 해요.", "ready to weigh her", "휘청거리면 잡아줄 직원 세 명이 준비돼 있어요.", "휘청거리면 잡아줄 가족 두 명이 준비돼 있어요.", "catch", "weigh", "feed", "bathe"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 보행 전 낙상 대비 4문장 순서
    why: 위험을 먼저 사정하고, 그 결과로 장비와 인력을 정한 뒤, 환경을 정리하고, 이동 중 어지러우면 앉히겠다고 말해요.
    lines:
    - ["Let's assess her fall risk before we help her up.", magnify, "일으켜 세우기 전에 낙상 위험을 사정해요", "사정"]
    - ["That makes her high risk, so we'll use a gait belt and two staff.", handshake2, "그러면 고위험이라 보행벨트와 직원 두 명을 쓸게요", "장비"]
    - ["With both in place, I'll clear the path and lock the wheels.", check, "둘 다 갖췄으니 길을 치우고 바퀴를 잠글게요", "정리"]
    - ["If she looks dizzy even once on the way, we'll sit her down right away.", siren, "가는 길에 한 번이라도 어지러워 보이면 바로 앉힐게요", "중단"]
- title: 욕창 단계별 관리
  s:
  - ["단계 평가", chartup, "'before we treat it'으로 치료 전에 단계를 먼저 본다고 말해요. 단계가 맞아야 드레싱과 치료가 맞아요.", "this wound twice", "치료하기 전에 이 창상의 깊이를 정확히 평가해요.", "치료하기 전에 이 창상의 크기를 정확히 평가해요.", "stage", "suture", "staple", "cauterize"]
  - ["2단계 소견", bandage, "'looks like'는 눈으로 본 소견이라 단정을 피해요. 2단계는 피부 일부 층만 손실된 상태예요.", "a stage-four wound", "부분층 손실이 있는 3단계 손상으로 보여요.", "부분층 손실이 있는 4단계 손상으로 보여요.", "injury", "burn", "rash", "bruise"]
  - ["드레싱 선택", bandage, "'that keeps'로 드레싱을 고르는 기준을 한 줄에 말해요. 촉촉한 환경은 상처가 아무는 데 도움이 돼요.", "that costs less", "창상 바닥을 깨끗하게 유지하는 드레싱을 고를게요.", "창상 바닥을 시원하게 유지하는 드레싱을 고를게요.", "moist", "dry", "cold", "hard"]
  - ["압력 분산", shield, "'offload'와 'reassess'를 한 문장에 묶으면 압력 덜기와 다시 보기를 함께 한다는 말이 돼요. 'with each change'는 교체 때마다라는 뜻이에요.", "the area twice", "부위를 압력분산시키고 체위 변경 때마다 재사정할게요.", "부위를 압력분산시키고 식사 때마다 재사정할게요.", "reassess", "restock", "rename", "relabel"]
  - ["회복 신호", star, "'which is'로 앞 소견을 평가해요. 촉촉하고 분홍빛인 상처 바닥은 새 조직이 자란다는 신호예요.", "which is normal", "창상 가장자리가 촉촉하고 분홍빛이라 좋은 신호예요.", "주변 피부가 촉촉하고 분홍빛이라 좋은 신호예요.", "pink", "black", "yellow", "gray"]
  - ["단계 기록", pencil, "'every time'으로 반복 기록을 약속해요. 단계가 바뀌면 치료도 바뀌어서 교체 때마다 적어요.", "every shift", "드레싱을 바꿀 때마다 크기를 기록할게요.", "드레싱을 바꿀 때마다 색깔을 기록할게요.", "stage", "size", "color", "depth"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 욕창 단계 관리 4문장 순서
    why: 단계를 먼저 평가하고, 소견을 말하고, 그에 맞는 드레싱을 고른 뒤, 교체 때마다 단계를 기록해요.
    lines:
    - ["Let's stage this wound accurately before we treat it.", chartup, "치료하기 전에 이 창상의 단계를 정확히 평가해요", "평가"]
    - ["This looks like a stage-two injury with partial-thickness loss.", bandage, "부분층 손실이 있는 2단계 손상으로 보여요", "소견"]
    - ["I'll choose a dressing that keeps the wound bed moist.", bandage, "창상 바닥을 촉촉하게 유지하는 드레싱을 고를게요", "선택"]
    - ["I'll document the stage every time I change that dressing.", pencil, "그 드레싱을 바꿀 때마다 단계를 기록할게요", "기록"]
- title: 의료기기 관련 욕창 예방
  s:
  - ["기기 점검", magnify, "'too'로 기기도 욕창 원인이라는 점을 앞세워 이유를 말해요. 튜빙이 피부를 눌러서 생겨요.", "under his blanket", "기기도 욕창을 일으키니 소변줄 아래를 확인해요.", "기기도 욕창을 일으키니 압박양말 아래를 확인해요.", "under", "over", "near", "above"]
  - ["정기 확인", calendar, "'on a schedule'은 생각날 때가 아니라 정해진 때에 한다는 뜻이에요. 기기 아래 피부는 보이지 않아서 일부러 봐야 해요.", "on a whim", "모든 기기 아래 피부를 확인하기 전에 손부터 씻을게요.", "모든 기기 아래 피부를 확인하기 전에 커튼부터 칠게요.", "skin", "tubing", "strap", "wire"]
  - ["쿠션과 회전", shield, "'cushion'과 'rotate'를 'and'로 이으면 완충과 위치 바꾸기를 같이 한다는 말이에요. 같은 곳이 계속 눌리지 않게 해요.", "and trim", "튜빙에 거즈를 대고 위치를 돌려줄게요.", "튜빙에 테이프를 대고 위치를 돌려줄게요.", "cushion", "tape", "label", "bag"]
  - ["흔한 압박점", bulb, "'common'은 흔히 생기는 곳이라는 뜻이라 어디를 먼저 볼지 알려 줘요. 칼라와 마스크는 뼈와 가까운 곳을 눌러요.", "rare pressure points", "칼라와 마스크 가장자리는 흔한 감염 부위예요.", "칼라와 마스크 가장자리는 흔한 출혈 부위예요.", "pressure", "bleeding", "infection", "fracture"]
  - ["마스크 위치", shield, "'to offload pressure'로 목적을 뒤에 붙이면 왜 돌리는지 분명해요. 같은 자리가 계속 눌리지 않게 매 근무 위치를 바꿔요.", "to offload noise", "냄새를 줄이려고 매 근무마다 마스크 위치를 돌려줄게요.", "소리를 줄이려고 매 근무마다 마스크 위치를 돌려줄게요.", "position", "size", "color", "brand"]
