- situation: "ROSC 직후 안정화 사정"
  items:
    - kind: slider
      words: [w-ventilator, w-breathe]
      cue: "Colleague: \"He has a pulse, but his breathing is slow and shallow.\""
      scale: [keep watching him closely, bag him and prep the vent, move him to the floor]
      answerAt: 1
      why: "ROSC 직후 호흡이 느리고 얕으면 스스로 충분히 숨 쉬는 게 아니라서, 백으로 환기를 도우며 인공호흡기를 준비해요. 지켜만 보는 건 위험하고, 병동 이동은 안정화 전에는 말이 안 돼요."
      example: "His breathing looks adequate on the bag, but let's get him on the ventilator soon."
      exKo: "백 마스크로는 호흡이 충분해 보이지만, 곧 인공호흡기에 연결합시다."
    - kind: context
      words: [w-assessment]
      word: assessment
      ko: 사정(평가)
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Initial assessment: airway secure, pulses present, ventilating on the bag.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "I'll finish the assessment while you hook up the vent.", ok: true}
        - {who: 가족에게, icon: me, en: "Our initial assessment shows ABCs intact, GCS three T, post-ROSC day zero.", ok: false, fix: "We've checked his breathing and his heart, and we're getting him settled."}
      why: "의료진끼리는 ABC나 GCS 같은 약어로 짧게 주고받아요. 가족에게는 그 약어가 무슨 뜻인지 몰라 오히려 불안해져요. 무엇을 살폈는지를 쉬운 말로 알려 줘요."
- situation: "12유도 심전도·원인 검사"
  items:
    - kind: slider
      words: [w-stemi, w-activate, w-cathlab]
      cue: "Colleague: \"The twelve-lead shows ST elevation in the anterior leads.\""
      scale: [repeat it in an hour, just trend the troponin, activate the cath lab now]
      answerAt: 2
      why: "ROSC 직후 12유도에서 ST분절 상승이 보이면 STEMI로 보고 카테터실을 바로 가동해요. 심전도 반복이나 트로포닌 추세만 기다리면 막힌 관상동맥을 여는 시간이 늦어져요."
      example: "If it's a STEMI, we activate the cath lab."
      exKo: "STEMI라면 카테터실을 가동합니다."
    - kind: context
      words: [w-troponin]
      word: troponin
      ko: 트로포닌
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Troponin is trending up, so cardiology is aware.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Send the troponin and a full metabolic panel now.", ok: true}
        - {who: 가족에게, icon: me, en: "His troponin is elevated with a significant delta at three hours.", ok: false, fix: "A blood test shows his heart muscle may be injured, and the heart doctors are already involved."}
      why: "의료진끼리는 troponin처럼 검사 이름만 말해도 뜻이 통해요. 가족에게는 검사 이름과 변화량이 어려워서, 무엇을 알아냈고 누가 맡고 있는지를 쉬운 말로 전해요."
- situation: "TTM 목표체온 준비"
  items:
    - kind: slider
      words: [w-probe, w-reading, w-coolingdevice]
      cue: "Colleague: \"The cooling device is on, but the probe isn't giving a reading.\""
      scale: [fix the probe before cooling, start cooling and fix it later, silence the alarm and wait]
      answerAt: 0
      why: "체온 측정값이 없으면 냉각 중 얼마나 식었는지 알 수 없어서 목표를 지나칠 위험이 있어요. 탐침부터 고치고 측정값을 확인한 뒤에 냉각을 시작해요."
      example: "I'll place the probe rectally per protocol and confirm the reading."
      exKo: "프로토콜대로 직장으로 탐침을 넣고 측정값을 확인할게요."
    - kind: context
      words: [w-protocol]
      word: protocol
      ko: 프로토콜
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Per protocol, we'll cool to thirty-six degrees and hold.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Follow the TTM protocol: probe first, then the pads.", ok: true}
        - {who: 가족에게, icon: me, en: "Per protocol we use a rectal probe with a continuous core reading every minute.", ok: false, fix: "We follow a careful hospital plan to cool him gently and protect his brain."}
      why: "의료진끼리는 protocol 한마디로 정해진 절차를 가리켜요. 가족에게는 탐침 위치와 측정 주기까지 늘어놓으면 무섭고 복잡해요. 왜 하는지를 쉬운 말로 전해요."
- situation: "체온·전해질 모니터"
  items:
    - kind: pair
      words: [w-core, w-potassium, w-panel]
      pairs: [[core, temperature], [serum, potassium], [send a, metabolic panel]]
      decoys: [the trend line]
      why: "core temperature는 피부가 아니라 몸 깊은 곳의 체온이에요. serum potassium은 혈청(혈액의 맑은 부분)에서 잰 칼륨 수치이고, 대사 패널(metabolic panel)은 여러 수치를 한 번에 보내는 검사라 send와 함께 써요."
    - kind: context
      words: [w-trend]
      word: trend
      ko: 추세(경향)
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "The potassium trend is down since we started cooling.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Watch the temperature trend, not just one reading.", ok: true}
        - {who: 가족에게, icon: me, en: "His potassium trend shows a negative delta of zero point eight over six hours.", ok: false, fix: "We check his blood tests often so we can catch any change early."}
      why: "의료진끼리는 trend와 변화량 숫자로 흐름을 빠르게 공유해요. 가족에게는 숫자와 단위가 낯설어서, 자주 확인해서 변화를 일찍 잡는다는 정도로 쉽게 말해요."
- situation: "진정·통증 관리 기초"
  items:
    - kind: slider
      words: [w-pain, w-reposition]
      cue: "Colleague: \"His pain score is seven and he grimaces when we turn him.\""
      scale: [give the ordered analgesic, wait until the next round, turn him more quickly]
      answerAt: 0
      why: "체위 변경 때 통증 점수가 높고 찡그리면 처방된 진통제를 먼저 주고 편안해진 뒤 돌려요. 다음 회진까지 기다리거나 빨리 돌리는 건 통증을 키워요."
      example: "I'll sedate him a little more before we reposition him."
      exKo: "체위를 바꾸기 전에 좀 더 진정시킬게요."
    - kind: context
      words: [w-comfort]
      word: comfort
      ko: 편안함
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His comfort is part of the cooling plan, and his sedation is at goal.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Let's think about his comfort before we turn him.", ok: true}
        - {who: 가족에게, icon: me, en: "Comfort measures include a sedation scale target of minus two on the RASS.", ok: false, fix: "We're keeping him as comfortable as we can while he's being cooled."}
      why: "의료진끼리는 RASS 같은 진정 척도로 목표를 말해요. 가족에게는 점수 얘기보다 아프거나 불편하지 않게 돌보고 있다는 사실이 중요해요."
- situation: "지속 심전도·혈역학 감시"
  items:
    - kind: slider
      words: [w-arterial, w-pressure, w-drop]
      cue: "Colleague: \"The arterial line just fell to seventy over forty.\""
      scale: [wait for the next reading, chart it at the next hour, check him and call the doctor]
      answerAt: 2
      why: "동맥관 혈압이 갑자기 70/40으로 떨어지면 환자를 직접 확인하고 바로 의사에게 알려요. 다음 측정을 기다리거나 시간마다 기록하는 사이에 재정지로 갈 수 있어요."
      example: "Blood pressure dropped a bit, so I bumped the pressor."
      exKo: "혈압이 조금 떨어져서 승압제를 올렸어요."
    - kind: context
      words: [w-monitor]
      word: monitor
      ko: 모니터
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "The monitor shows sinus rhythm with no ectopy.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Keep your eyes on the monitor while I draw labs.", ok: true}
        - {who: 가족에게, icon: me, en: "The monitor shows a normal sinus rhythm with no PVCs or ST changes.", ok: false, fix: "The monitor shows his heartbeat is steady right now, and we're watching it closely."}
      why: "의료진끼리는 sinus rhythm, PVC, ST changes 같은 파형 이름으로 한 번에 말해요. 가족에게는 용어가 낯서니 지금 심장이 안정적인지만 쉬운 말로 알려 줘요."
- situation: "TTM 냉각 유도·유지 관리"
  items:
    - kind: slider
      words: [w-overshoot, w-target]
      cue: "Colleague: \"He's already one degree below the target we set.\""
      scale: [keep cooling a bit more to be safe, stop cooling and tell the doctor, speed up the cooling to catch up]
      answerAt: 1
      why: "목표보다 더 내려가면 안 되는 치료라, 이미 목표 아래면 냉각을 멈추고 의사에게 알려 조절해요. 더 식히거나 빨리 식히는 건 과냉각(overshoot)을 키워요."
      example: "Avoid overshooting below the target range."
      exKo: "목표 범위 아래로 지나치지 않게 하세요."
    - kind: context
      words: [w-steady]
      word: steady
      ko: 일정한
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Temperature is steady at target for the last two hours.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Is his pressure steady while we hold at target?", ok: true}
        - {who: 가족에게, icon: me, en: "His thermoregulatory setpoint remains steady within the target band.", ok: false, fix: "His temperature is holding steady where we want it, which helps protect his brain."}
      why: "의료진끼리는 목표 범위나 setpoint 같은 말로 간단히 보고해요. 가족에게는 체온이 원하는 곳에서 안정적이라는 것과 뇌를 지키는 데 도움이 된다는 점을 쉬운 말로 전해요."
