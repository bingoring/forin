- situation: "유발약물 검토·조정"
  items:
    - kind: pair
      words: [w-benzodiazepine, w-anticholinergic]
      pairs: [["lorazepam", "is a benzodiazepine"], ["diphenhydramine", "is an anticholinergic"]]
      decoys: ["is a vasopressor"]
      why: "로라제팜은 벤조디아제핀 계열, 디펜히드라민(Benadryl)은 항콜린성 약물이에요. 둘 다 섬망을 악화시킬 수 있어 노인에게 특히 조심해요."
    - kind: swap
      words: [w-propose, w-dose]
      who: "의사에게 제안 · 팀 소통"
      icon: stetho
      before: ["Dr. Lee, ", "you need to change", " his lorazepam dose."]
      options: ["you need to change", "could we consider lowering", "why did you order"]
      answer: "could we consider lowering"
      notes: {"you need to change": "지시처럼 들려 의사와 마찰이 생기기 쉬워요.", "could we consider lowering": "질문형 제안이라 협력적이고 의견이 잘 전달돼요.", "why did you order": "따지는 말투라 방어적인 반응이 나와요."}
      why: "간호사가 처방 의견을 낼 때는 질문·제안 형태가 협업에 맞아요. 곧 위험해지는 상황이라면 더 단호하게 말하는 방식이 따로 있어요."
      ko: "리 선생님, 로라제팜 용량을 낮추는 걸 고려해 볼 수 있을까요."
- situation: "수면-각성 주기 회복 전략"
  items:
    - kind: pair
      words: [w-sun, w-set, w-blind]
      pairs: [["The sun", "sets at dusk"], ["We", "open the blinds"], ["He", "sleeps through the night"]]
      decoys: ["the schedule"]
      why: "주어에 맞는 동사가 짝이에요. 해(The sun)는 지고(sets), 우리(We)는 블라인드를 열고(open), 환자(He)는 밤새 자요(sleeps)."
    - kind: context
      words: [w-sleep]
      word: "sleep"
      ko: "수면"
      scenes:
        - {who: "야간 인계", icon: bell, en: "Let's protect a block of uninterrupted sleep tonight.", ok: true}
        - {who: "차트 기록", icon: board, en: "Sleep protected overnight; no interruptions.", ok: true}
        - {who: "환자에게", icon: me, en: "Your circadian sleep architecture is disrupted.", ok: false, fix: "You've had broken sleep, so we'll help you rest tonight."}
      why: "동료·차트에서는 수면 보호를 간결하게 써요. 환자에게 'circadian sleep architecture' 같은 전문 용어는 와닿지 않으니, 겪은 일과 해 줄 일로 말해요."
- situation: "섬망 중 진정 최소화"
  items:
    - kind: slider
      words: [w-sedation]
      cue: "RN: \"No response to my voice or gentle shaking — he moves only to a painful stimulus.\""
      scale: ["light sedation", "moderate sedation", "deep sedation"]
      answerAt: 2
      why: "목소리에 반응이 없고 통증 자극에만 움직이면 깊은 진정(deep)이에요. 섬망 중에는 목소리에 깨어나는 가벼운 진정을 목표로 해요."
      example: "We'll target a lighter sedation goal today."
      exKo: "오늘은 진정 목표를 조금 더 얕게 잡을게요."
    - kind: context
      words: [w-sedative]
      word: "sedative"
      ko: "진정제"
      scenes:
        - {who: "야간 의사 콜", icon: monitor, en: "Can we cut the sedative and aim for lighter sedation?", ok: true}
        - {who: "차트 기록", icon: board, en: "Sedative reduced overnight; following commands.", ok: true}
        - {who: "보호자에게", icon: me, en: "We're titrating the sedative infusion to a RASS of -1.", ok: false, fix: "We're giving him less of the sleepy medicine so his mind can clear."}
      why: "의료진끼리는 'sedative infusion'과 RASS 같은 정확한 용어가 맞아요. 가족에게는 숫자와 약어 대신 무엇을 왜 줄이는지를 쉬운 말로 알려요."
- situation: "감각 보조 제공"
  items:
    - kind: pair
      words: [w-aid, w-lens]
      pairs: [["hearing", "aids"], ["contact", "lenses"]]
      decoys: ["blinds"]
      why: "hearing aids(보청기), contact lenses(콘택트렌즈)는 굳어진 짝이에요. 서로 바꿔 쓰면 영어가 안 돼요."
    - kind: context
      words: [w-clear]
      word: "clearly"
      ko: "또렷하게"
      scenes:
        - {who: "안경을 낀 환자에게", icon: me, en: "Can you see clearly with your glasses on?", ok: true}
        - {who: "차트 기록", icon: board, en: "Pt hearing clearly with aids in.", ok: true}
        - {who: "보청기를 낀 환자에게", icon: me, en: "Are you perceiving auditory input clearly?", ok: false, fix: "Can you hear me okay now?"}
      why: "환자에게는 쉬운 질문이 맞아요. 'auditory input' 같은 말은 환자가 못 알아듣고 위축돼요. 차트에서는 간결한 사정 표현이 좋아요."
- situation: "억제대 최소화 대안"
  items:
    - kind: slider
      words: [w-sitter, w-restraint]
      cue: "RN: \"He keeps reaching for his IV, but he settles when I sit with him and explain.\""
      scale: ["reorient him", "use a sitter", "use restraints"]
      answerAt: 0
      why: "가장 덜 제한적인 방법부터 써요. 말로 재지남을 해서 가라앉으면 거기서 멈추고, 억제대는 다른 방법이 통하지 않을 때의 마지막 수단이에요."
      example: "We use the least restrictive option that keeps him safe."
      exKo: "안전을 지키는 선에서 가장 덜 제한적인 방법을 써요."
    - kind: context
      words: [w-restraint]
      word: "restraints"
      ko: "억제대"
      scenes:
        - {who: "야간 의사 콜", icon: monitor, en: "Can we try a sitter before restraints?", ok: true}
        - {who: "차트 기록", icon: board, en: "Restraints not used; sitter at bedside.", ok: true}
        - {who: "가족에게", icon: me, en: "We may need to tie him down with restraints.", ok: false, fix: "We're doing all we can to keep him safe, and we try other things first."}
      why: "의료진끼리는 'restraints'가 정확한 용어예요. 가족에게 'tie him down'은 거칠게 들려요. 안전을 위해 다른 방법부터 한다고 말해요."
- situation: "알코올 금단 섬망 감별"
  items:
    - kind: slider
      words: [w-withdrawal]
      cue: "RN: \"Drenching sweats, severe agitation, and he's seeing things on the wall.\""
      scale: ["mild", "moderate", "severe"]
      answerAt: 2
      why: "심한 발한·초조·환시는 금단이 중증(severe)일 때의 모습이에요. CIWA 점수가 높을수록 중증이고, 벤조 용량 판단도 달라져요."
      example: "Withdrawal can get severe quickly."
      exKo: "금단은 빠르게 심해질 수 있어요."
    - kind: context
      words: [w-withdrawal]
      word: "withdrawal"
      ko: "금단"
      scenes:
        - {who: "야간 의사 콜", icon: monitor, en: "He's showing signs of alcohol withdrawal.", ok: true}
        - {who: "차트 기록", icon: board, en: "CIWA q1h for alcohol withdrawal.", ok: true}
        - {who: "가족에게", icon: me, en: "He's in withdrawal from alcohol — those are DTs.", ok: false, fix: "His body is reacting to stopping alcohol, which can cause shakiness and confusion."}
      why: "의료진끼리는 'withdrawal'과 DTs 같은 약어가 통해요. 가족에게는 낙인처럼 들리지 않게, 몸에서 일어나는 일을 비난 없이 풀어 말해요."
- situation: "가족에게 섬망 설명·교육"
  items:
    - kind: pair
      words: [w-delirium, w-dementia]
      pairs: [["Delirium", "comes on quickly"], ["Dementia", "builds up slowly"]]
      decoys: ["has no cause"]
      why: "섬망은 며칠 안에 갑자기(quickly), 치매는 수개월에서 수년에 걸쳐 서서히(slowly) 진행돼요. 가족이 가장 많이 묻는 구분이에요."
    - kind: context
      words: [w-temporary]
      word: "temporary"
      ko: "일시적인"
      scenes:
        - {who: "의료진끼리", icon: stetho, en: "Delirium is usually temporary once the cause is treated.", ok: true}
        - {who: "차트 기록", icon: board, en: "Family educated: confusion is usually temporary.", ok: true}
        - {who: "아들에게", icon: me, en: "It's temporary, so he'll be back to normal in a few days.", ok: false, fix: "It's usually temporary, but it can take days to weeks to clear."}
      why: "'usually temporary'는 맞지만 기간을 며칠로 단정하면 지킬 수 없는 약속이 돼요. 보통은 일시적이지만 며칠에서 몇 주까지 걸릴 수 있다고 말해요."
