  - ["작동 보고", monitor, "running smoothly는 경보나 흔들림 없이 돌아간다는 뜻이에요. 호흡기 상태를 짧게 알려야 이동 중 다들 안심하고 환자에게 집중해요.", "on a timer", "이송용 인공호흡기가 조용하게 작동하고 있어요.", "이송용 모니터가 순조롭게 작동하고 있어요.", "smoothly", "slowly", "loudly", "hot"]
