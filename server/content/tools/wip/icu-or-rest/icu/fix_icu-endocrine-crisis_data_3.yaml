  alert: {alarm: inert, alter: alike}
  fluid: {fluent: flux}
  safe: {save: same}
  tell: {tall: yell}
  work: {word: worry}
  move: {mode: mold}
  mean: {meal: lean}
  pressure: {preserve: posture}
  trouble: {tremble: rubble}
  pump: {plump: plume}
  hold: {hole: hone}
  pull: {pill: poll, pool: peel}
  heart: {heard: heat}
  pace: {pale: pact}
  stable: {table: able}
  affect: {effect: infect}
  effect: {affect: defect}
  mental: {metal: menial}
  treat: {trait: cheat}
  give: {gift: live}
  temperature: {temporary: temperance}
  warm: {worm: swarm}
  fever: {fewer: fervor}
  adrenal: {adenoid: atrial}
  blood: {blond: brood}
# 불쾌·판단 조각 — decoyChips 교체 (dangerous 는 dan 이 정답 조각이라 dim 으로)
decoy:
  protocol: {pot: pod}
  potassium: {pot: pat}
  dangerous: {dam: dim}
  number: {bar: bur}
  recheck: {rye: rue}
  mean: {moan: mown}
  hormone: {moan: mode}
