    - to keep
    - any fluids down
    - today
    - '?'
    words:
    - w-keep
    - w-fluid
    goal: 1
  - en: Your fast breathing can be your body reacting to acid, so I'm watching it closely.
    ko: 숨이 빠른 건 몸이 산에 반응하는 걸 수도 있어서, 제가 잘 지켜보고 있어요.
    chunks:
    - Your fast breathing
    - can be your body
    - reacting to acid,
    - so I'm watching it closely
    - .
    words:
    - w-fast
    - w-breathing
    - w-react
    - w-acid
    - w-watch
    - w-closely
    goal: 1
  - en: I'll ask you a few questions to check how alert you are.
    ko: 의식이 얼마나 또렷한지 확인하려고 몇 가지 여쭤볼게요.
    chunks:
    - I'll ask you
    - a few questions
    - to check how alert
    - you are
    - .
    words:
    - w-ask
    - w-question
    - w-check
    - w-alert
    goal: 1
  - en: I'm seeing early signs of DKA, so I'll report this to the team right away.
    ko: 당뇨병성 케토산증 초기 소견이 보여서, 바로 팀에 보고할게요.
    chunks:
    - I'm seeing early signs
    - of DKA,
    - so I'll report this
    - to the team right away
    - .
    words:
    - w-sign
    - w-report
    - w-team
    goal: 2
  - en: I'm right here with you, so try to stay calm.
    ko: 제가 바로 옆에 있으니까 최대한 편하게 있으세요.
    chunks:
    - I'm right here
    - with you,
    - so try
    - to stay calm
    - .
    words:
    - w-stay
    - w-calm
    goal: 1
  nuance:
  - kind: slider
    words:
    - w-fast
    cue: Her breathing rate is 34 breaths a minute, and each breath is deep.
    scale:
    - a little fast
    - fast
    - very fast
    answerAt: 2
    why: 성인의 정상 호흡수는 보통 분당 12~20회예요. 34회에 깊은 호흡이 이어지면 very fast이고, DKA에서는 산을 내보내려는 몸의 반응일 수 있어서 바로 팀에 보고해요.
    example: Her breathing is very fast and deep.
    exKo: 그녀의 호흡이 아주 빠르고 깊어요.
  - kind: context
    words:
    - w-sign
    word: sign
    ko: 징후
    scenes:
    - who: 의사 라운드
      icon: monitor
      en: He has early signs of DKA — deep, fast breathing and a dry mouth.
      ok: true
    - who: 야간 인계
      icon: board
      en: No new signs of fluid overload overnight.
      ok: true
    - who: 환자에게
      icon: me
      en: Your Kussmaul respirations are a sign of severe metabolic acidosis.
      ok: false
      fix: Your fast, deep breathing is a sign that your blood has too much acid, and we're treating it.
    why: 의료진끼리는 Kussmaul·metabolic acidosis 같은 용어가 정확하고 빨라요. 환자에게는 같은 sign을 쉬운 말로 풀어 무엇이 일어나고 있고 무엇을 하는지 알려 주세요.
  - kind: swap
    words:
    - w-hydration
    who: 환자에게 · 첫 사정 설명
    icon: me
    before:
    - 'I''m checking '
    - your volume status
    - ' first.'
    options:
    - how dry you are
    - your volume status
    - your hypovolemia
    answer: how dry you are
    notes:
      how dry you are: 환자가 바로 알아듣고, 무엇을 보는지 분명해요.
      your volume status: 의료진끼리 쓰는 말이라 환자는 무슨 뜻인지 모를 수 있어요.
      your hypovolemia: 어려운 진단명을 환자에게 그대로 던지는 말이라 불안만 키워요.
    why: 탈수 사정은 환자 몸 상태를 묻는 일이라, 진단명 대신 '얼마나 말라 있는지' 같은 쉬운 말로 시작해요.
    ko: 먼저 몸에 수분이 얼마나 모자란지 확인할게요
