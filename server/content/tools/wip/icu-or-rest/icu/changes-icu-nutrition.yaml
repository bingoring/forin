theme: icu-nutrition
changes:
- kind: word
  id: w-need
  fields:
  - ko
  why: 문장 대부분이 동사(he needs, we need to)라 명사 '필요'보다 동사가 맞는다
- kind: word
  id: w-check
  fields:
  - ko
  why: ko '확인하다'가 w-verify·w-confirm과 같아 듣고 뜻 고르기에서 정답이 셋이 된다 — check는 '점검하다'로 가름
- kind: word
  id: w-verify
  fields:
  - ko
  why: ko '확인하다'가 w-check·w-confirm과 같아 가름
- kind: word
  id: w-placement
  fields:
  - ko
  why: ko '위치'가 w-position과 같아 정답이 둘이 된다 — placement는 관을 넣은 자리라 '삽입 위치'
- kind: word
  id: w-position
  fields:
  - ko
  - example
  why: ko '위치'가 w-placement와 같아 가름 — 태그된 문장은 'comfortable in this position'(자세)이라 tube position 문장은 태그를 뺌 — 옛 예문 문장에서 태그를 뺐으므로 예문을 태그된 문장으로 바꿈
- kind: word
  id: w-elevate
  fields:
  - ko
  why: ko '올리다'가 w-raise와 같아 정답이 둘이 된다 — 가름
- kind: word
  id: w-reduce
  fields:
  - ko
  why: ko '줄이다'가 w-lower·w-cutback과 같아 정답이 셋이 된다 — 가름
- kind: word
  id: w-lower
  fields:
  - ko
  why: ko '줄이다'가 w-reduce·w-cutback과 같아 가름
- kind: word
  id: w-alert
  fields:
  - ko
  why: ko '알리다'가 w-flag·w-notify와 같아 정답이 셋이 된다 — 가름
- kind: word
  id: w-flag
  fields:
  - ko
  why: ko '알리다'가 w-alert·w-notify와 같아 가름
- kind: word
  id: w-notify
  fields:
  - ko
  why: ko '알리다'가 w-alert·w-flag와 같아 가름
- kind: word
  id: w-document
  fields:
  - ko
  why: ko '기록하다'가 w-chart와 같아 정답이 둘이 된다 — 가름
- kind: word
  id: w-chart
  fields:
  - ko
  why: ko '기록하다'가 w-document와 같아 가름
- kind: word
  id: w-tense
  fields:
  - ko
  why: ko '팽팽한'이 w-tight와 같아 정답이 둘이 된다 — 가름
- kind: word
  id: w-rigid
  fields:
  - ko
  why: ko '단단한'이 w-hard와 같아 정답이 둘이 된다 — 가름 (rigid belly는 널빤지처럼 굳은 배)
- kind: word
  id: w-listen
  fields:
  - ko
  why: ko '듣다'가 w-hear와 같아 정답이 둘이 된다 — listen for/to는 '귀 기울여 듣다(청진)'
- kind: word
  id: w-aspirate
  fields:
  - ko
  why: '''흡인하다(음식이)''는 w-suction과 겹친다 — 문장은 환자가 흡인되는 뜻(keeps aspirating)'
- kind: word
  id: w-bowel
  fields:
  - ko
  why: ko '배변'은 bowel sounds·dead bowel 문장과 안 맞고 w-movement와도 겹친다 — 가름
- kind: word
  id: w-slow
  fields:
  - ko
  why: 태그된 문장은 동사(we can slow it down)라 형용사 '느린'을 동사로
- kind: word
  id: w-support
  fields:
  - ko
  why: '''혈압을 지지하다''는 어색하다 — support her pressure는 혈압을 보조(유지)하다'
- kind: word
  id: w-target
  fields:
  - ko
  why: 태그된 문장은 target range(명사) — '목표로 하다'는 w-goal '목표'와 겹친다
- kind: word
  id: w-movement
  fields:
  - ko
  why: 태그된 문장은 bowel movement 하나뿐이라 '움직임'은 오해를 부른다
- kind: word
  id: w-surgery
  fields:
  - ko
  why: 문장 4개 중 3개가 '수술팀을 부르다'(calling surgery) 뜻이라 '수술'만으로는 맞지 않는다
- kind: word
  id: w-suction
  fields:
  - ko
  why: 문장 2개는 동사, 2개는 명사(suction ready) — ko를 둘 다 되는 '석션'으로. w-aspirate와 겹치지 않게 가름
- kind: word
  id: w-anything
  fields:
  - ko
  why: 문장 ko가 '무엇이든 넣기 전에' — '아무것도'는 부정문 뜻이라 긍정 문장(before anything goes through)에 맞지 않는다
- kind: word
  id: w-change
  fields:
  - ko
  why: change the dressing·hold or change the rate는 '교체/변경' — 명사 문장(any new changes)은 태그를 뺌
- kind: word
  id: w-respiratory
  fields:
  - ko
  why: '''calling respiratory''는 호흡치료팀을 부른다는 뜻이라 ''호흡기''보다 맞는다'
