theme: icu-hemodynamics
changes:
- kind: word
  id: w-close
  fields:
  - en
  - ipa
  - ko
  why: 문장 4개가 모두 부사 closely(watching … closely) — 형용사 헤드워드를 부사로, ko도 '자세히'로
- kind: word
  id: w-check
  fields:
  - ko
  why: ko '확인하다'가 w-confirm과 같아 듣고 뜻 고르기에서 정답이 둘이 된다 — '점검하다'로 가름
- kind: word
  id: w-chart
  fields:
  - ko
  why: ko '기록하다'가 w-document와 같아 정답이 둘이 된다 — '차트에 기록하다'로 가름
- kind: word
  id: w-document
  fields:
  - ko
  why: ko '기록하다'가 w-chart와 같아 정답이 둘이 된다 — '문서로 남기다'로 가름
- kind: word
  id: w-raise
  fields:
  - ko
  why: ko '들어올리다'가 w-elevate와 같아 정답이 둘이 된다 — '올리다'로 가름
- kind: word
  id: w-elevate
  fields:
  - ko
  why: ko '들어올리다'가 w-raise와 같아 정답이 둘이 된다 — 팔을 심장보다 높이 두는 '높이 들다'로 가름
- kind: word
  id: w-injury
  fields:
  - ko
  why: ko '손상'이 w-damage와 같아 정답이 둘이 된다 — injury는 '부상'으로 가름
- kind: word
  id: w-damage
  fields:
  - ko
  why: ko '손상'이 w-injury와 같아 정답이 둘이 된다 — damage 쪽에 '손상'을 남김
- kind: word
  id: w-hurt
  fields:
  - ko
  why: 문장 2개 중 하나는 'can hurt her organs'(해치다)라 ko '아프다'만으로는 모자라다
- kind: word
  id: w-heal
  fields:
  - ko
  why: ko '낫다, 회복하다'의 '회복하다'가 w-recover와 같아 정답이 둘이 된다 — '치유되다'로 가름
- kind: word
  id: w-hand
  fields:
  - ko
  why: 문장 'extra hands'(일손)는 구의 값이 있어 은행에 남기고 ko에 '일손'을 더함 — 목록의 쉬운 단어지만 태그를 빼면 그 문장이 빈다
- kind: word
  id: w-true
  fields:
  - ko
  why: ko '정확한, 참인'의 '정확한'이 w-accurate와 같아 정답이 둘이 된다 — '실제의, 참인'으로 가름
- kind: word
  id: w-rate
  fields:
  - ko
  why: ko '속도, 수치'의 '수치'가 w-number와 같아 정답이 둘이 된다 — '속도, 횟수'(heart rate)로 가름
- kind: word-remove
  id: w-hour
  why: 공통 쉬운 단어 목록 — 어느 문장도 태그하지 않게 됐다
