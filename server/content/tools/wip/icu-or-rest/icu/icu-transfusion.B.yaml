situations:
- title: 수혈 전 확인·동의
  sentences:
  - en: Two of us will verify the patient ID and unit at the bedside.
    ko: 두 사람이 침상에서 환자 ID와 제제를 확인할 거예요.
    chunks:
    - Two of us
    - will verify
    - the patient ID
    - and unit
    - at the bedside
    - .
    words:
    - w-verify
    - w-patient
    - w-unit
    - w-bedside
    goal: 1
    tag: 두 사람 확인
    icon: shield
    why: 독립 이중 확인은 두 사람이 침상에서 직접 해야 해요. 'Two of us'로 시작하면 혼자 하지 않는다는 점이 먼저 전해져요.
    decoy: at the front desk
    distractorsKo:
    - 세 사람이 침상에서 환자 ID와 제제를 확인할 거예요.
    - 네 사람이 침상에서 환자 ID와 제제를 확인할 거예요.
    blank:
      answer: bedside
      options:
      - en: bedside
      - en: pharmacy
      - en: blood bank
      - en: lobby
  - en: Let's read her name and date of birth out loud together.
    ko: 이름과 생년월일을 소리 내어 함께 읽어요.
    chunks:
    - Let's read
    - her name
    - and date of birth
    - out loud
    - together
    - .
    words:
    - w-read
    - w-name
    - w-birth
    - w-together
    goal: 1
    tag: 환자 식별
    icon: speech
    why: 이름과 생년월일은 환자 식별에 쓰는 두 가지 식별자예요. 소리 내어 읽으면 눈으로만 볼 때 놓치는 불일치를 잡아내요.
    decoy: and her diagnosis
    distractorsKo:
    - 보호자 이름과 생년월일을 소리 내어 함께 읽어요.
    - 이름과 진단명을 소리 내어 함께 읽어요.
    blank:
      answer: date of birth
      options:
      - en: date of birth
      - en: room number
      - en: blood type
      - en: diagnosis
  - en: I'll say the blood type and you check it against the bag.
    ko: 제가 혈액형을 말하면 백에 대조해서 확인해 주세요.
    chunks:
    - I'll say
    - the blood type
    - and you check
    - it against the bag
    - .
    words:
    - w-say
    - w-bloodtype
    - w-check
    - w-bag
    goal: 1
    tag: 백 대조
    icon: check
    why: 한 사람이 말하고 다른 사람이 백 라벨을 보며 확인해야 서로 독립된 확인이 돼요. 'against'는 말한 값을 실물과 맞대 본다는 뜻이에요.
    decoy: it against the tubing
    distractorsKo:
    - 제가 혈액형을 말하면 모니터에 대조해서 확인해 주세요.
    - 제가 혈액형을 말하면 펌프에 대조해서 확인해 주세요.
    blank:
      answer: blood type
      options:
      - en: blood type
      - en: heart rate
      - en: temperature
      - en: blood pressure
  - en: If anything doesn't match, we stop right here.
    ko: 하나라도 어긋나면 바로 여기서 멈춰요.
    chunks:
    - If anything
    - doesn't match
    - ', we stop'
    - right here
    - .
    words:
    - w-match
    - w-stop
    goal: 1
    tag: 불일치 중단
    icon: bell
    why: 하나라도 어긋나면 진행하지 않는 것이 수혈 확인의 원칙이에요. 'right here'는 그 자리에서 바로 멈춘다는 느낌을 줘요.
    decoy: over there
    distractorsKo:
    - 하나라도 늦어지면 바로 여기서 멈춰요.
    - 하나라도 어긋나면 바로 저기서 멈춰요.
    blank:
      answer: match
      options:
      - en: match
      - en: leak
      - en: expire
      - en: clot
  - en: Blood type, unit number, and expiration all match.
    ko: 혈액형과 제제 번호, 유효기간이 모두 일치해요.
    chunks:
    - Blood type
    - ', unit number'
    - ', and expiration'
    - all match
    - .
    words:
    - w-bloodtype
    - w-unit
    - w-expiration
    - w-match
    goal: 2
    tag: 일치 보고
    icon: check
    why: 항목을 하나씩 짚어 말하면 확인이 빠짐없이 끝났다는 점이 상대에게 분명히 전해져요.
    decoy: ', and donor age'
    distractorsKo:
    - 혈액형과 제제 색깔, 유효기간이 모두 일치해요.
    - 혈액형과 제제 번호, 채혈 날짜가 모두 일치해요.
    blank:
      answer: expiration
      options:
      - en: expiration
      - en: temperature
      - en: destination
      - en: description
  - en: Consent is signed and in the chart.
    ko: 동의서는 서명되어 차트에 있어요.
    chunks:
    - Consent is signed
    - and in
    - the chart
    - .
    words:
    - w-consent
    - w-sign
    - w-chart
    goal: 2
    tag: 동의서 확인
    icon: pencil
    why: 응급이 아니라면 서명된 동의서가 차트에 있어야 수혈을 시작할 수 있어요. 서명과 보관 위치를 함께 말해 확인 범위를 분명히 해요.
    decoy: the fridge
    distractorsKo:
    - 동의서는 서명되어 서랍에 있어요.
    - 동의서는 복사되어 차트에 있어요.
    blank:
      answer: signed
      options:
      - en: signed
      - en: pending
      - en: withdrawn
      - en: expired
  - en: I'll confirm consent with him before we hang this unit.
    ko: 이 제제를 걸기 전에 환자에게 동의를 다시 확인할게요.
    chunks:
    - I'll confirm consent
    - with him
    - before we hang
    - this unit
    - .
    words:
    - w-confirm
    - w-consent
    - w-hang
    - w-unit
    goal: 2
    tag: 동의 재확인
    icon: speech
    why: 서명이 있어도 환자는 언제든 마음을 바꿀 수 있어요. 'before we hang'은 걸기 전에 본인 뜻을 한 번 더 듣겠다는 시점을 밝혀요.
    decoy: with the lab
    distractorsKo:
    - 이 제제를 걸기 전에 동료에게 동의를 다시 확인할게요.
    - 이 제제를 걸기 전에 약사에게 동의를 다시 확인할게요.
    blank:
      answer: consent
      options:
      - en: consent
      - en: payment
      - en: insurance
      - en: visitation
  order:
    tag: 대화 흐름
    icon: compass
    ko: 수혈 전 확인 4문장 순서
    why: 두 사람이 하겠다고 알린 뒤 이름과 생년월일을 함께 읽고, 일치를 보고한 다음 걸기 전에 동의를 다시 확인해요.
    lines:
    - en: Two of us will verify the patient ID and unit at the bedside.
      icon: shield
      ko: 두 사람이 침상에서 환자 ID와 제제를 확인할 거예요
      note: 안내
    - en: So let's read her name and date of birth out loud together.
      icon: speech
      ko: 그러니 이름과 생년월일을 소리 내어 함께 읽어요
      note: 식별
    - en: With those read, blood type, unit number, and expiration all match.
      icon: check
      ko: 그걸 읽고 나니 혈액형과 제제 번호, 유효기간이 모두 일치해요
      note: 일치
    - en: With all of that matching, I'll confirm consent with him before we hang this unit.
      icon: pencil
      ko: 그게 다 맞으니 이 제제를 걸기 전에 환자에게 동의를 다시 확인할게요
      note: 동의
- title: 수혈 시작·초기 감시
  sentences:
  - en: I'll run it slow for the first fifteen minutes.
    ko: 처음 십오 분은 천천히 흐르게 할게요.
    chunks:
    - I'll run it
    - slow
    - for the first
    - fifteen minutes
    - .
    words:
    - w-run
    - w-slow
    - w-fifteen
    - w-minute
    goal: 1
    tag: 초기 속도
    icon: gear
    why: 첫 십오 분은 반응이 가장 잘 나타나는 시간이라 천천히 시작하며 지켜봐요. 시간을 숫자로 붙여 말하면 감시 구간이 분명해져요.
    decoy: on the pump
    distractorsKo:
    - 처음 십오 분은 서류를 천천히 살필게요.
    - 처음 십오 분은 침대를 천천히 낮출게요.
    blank:
      answer: run
      options:
      - en: run
      - en: flush
      - en: spike
      - en: pause
  - en: We'll start the transfusion now that everything checks out.
    ko: 다 확인됐으니 이제 수혈을 시작할게요.
    chunks:
    - We'll start
    - the transfusion
    - now that
    - everything checks out
    - .
    words:
    - w-start
    - w-transfusion
    - w-check
    goal: 1
    tag: 수혈 시작
    icon: play
    why: '''now that''은 확인이 끝났다는 이유를 앞세워 시작한다는 뜻이에요. 확인 없이 시작하지 않는 순서가 문장에 담겨요.'
    decoy: so that
    distractorsKo:
    - 다 확인됐으니 이제 환자 이송을 시작할게요.
    - 다 확인됐으니 이제 환자 교육을 시작할게요.
    blank:
      answer: transfusion
      options:
      - en: transfusion
      - en: surgery
      - en: dialysis
      - en: intubation
  - en: Baseline vitals are recorded before we start.
    ko: 시작 전에 기저 활력징후를 기록해요.
    chunks:
    - Baseline vitals
    - are recorded
    - before we start
    - .
    words:
    - w-baseline
    - w-vital
    - w-record
    - w-start
    goal: 2
    tag: 기저 기록
    icon: chartup
