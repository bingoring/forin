# [tag, icon, why, decoy, ko1, ko2, ans, w1,w2,w3]
situations:
- title: ARDS 산소화 지표 이해
  s:
  - [수치 설명, chartup, '''how well''로 정도를 묻는 간접 의문문을 쓰면 숫자 하나가 폐의 산소 전달 능력을 말해 준다는 점이 가족에게도 쉽게 들려요.', from his kidneys, 그 비율은 폐가 혈액으로 이산화탄소를 얼마나 잘 보내는지 알려줘요., 그 비율은 심장이 혈액으로 산소를 얼마나 잘 보내는지 알려줘요., oxygen, fluid, medicine, sugar]
  - [수치 해석, monitor, '''A lower number means…''는 숫자의 방향과 의미를 한 문장에 묶어요. ''right now''를 붙이면 지금 상태라는 점이 분명해 가족이 영구적 판정으로 오해하지 않아요.', in his kidneys, 숫자가 낮을수록 지금 신장 손상이 더 심하다는 뜻이에요., 숫자가 낮을수록 어제 폐 손상이 더 심했다는 뜻이에요., severe, mild, recent, common]
  - [추적 이유, magnify, '''to see whether…''로 목적을 먼저 밝히면 수치를 계속 보는 이유가 불안이 아니라 회복 확인이라는 인상을 줘요.', twice a day, 폐가 좋아지고 있는지 보려고 이 수치를 계속 알려드려요., 간이 좋아지고 있는지 보려고 이 수치를 계속 지켜봐요., lungs, kidneys, veins, bones]
  - [비교 설명, compass, '''compares A to B''로 두 값을 나란히 놓으면 비율이 무엇을 비교하는지 쉽게 그려져요.', in the room air, 혈액 속 당과 들이마시는 산소를 비교하는 거예요., 소변 속 산소와 들이마시는 산소를 비교하는 거예요., blood, urine, saliva, skin]
  - [소통 약속, speech, '''as we go''는 수치가 나올 때마다 곧바로 설명하겠다는 약속이에요. 가족이 숫자 앞에서 혼자 남지 않게 해요.', to your family, 새 수치가 나올 때마다 무슨 뜻인지 메모해 드릴게요., 새 사진이 나올 때마다 무슨 뜻인지 설명해 드릴게요., means, costs, weighs, hides]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 산소화 지표 설명 4문장 순서
    why: 숫자가 무엇인지 먼저 소개하고, 무엇을 비교하는지 풀어 준 뒤, 낮을 때의 의미를 알려요. 마지막에 그래서 계속 지켜본다고 이어요.
    lines:
    - [That number shows how well his lungs move oxygen., chartup, 그 숫자는 폐가 산소를 얼마나 잘 보내는지 보여줘요, 소개]
    - [It compares the oxygen in his blood to what he breathes in., compass, 혈액 속 산소와 들이마시는 산소를 비교해요, 비교]
    - ['When that comparison comes out lower, the injury is more severe.', monitor, 그 비교 결과가 낮으면 손상이 더 심해요, 의미]
    - [That is why we keep watching it as new results come in., magnify, 그래서 새 결과가 나올 때마다 계속 지켜봐요, 추적]
- title: 저 TV 폐보호 환기 유지
  s:
  - [설정 안내, gear, '''is set to''로 지금 맞춰진 값임을 알리면 의료진끼리 설정을 말로 대조할 때 헷갈리지 않아요. ''ideal body weight''는 키와 성별로 계산한 기준 체중이에요.', with the bed, 일회 호흡량은 어제 표준 체중 킬로그램당 6밀리리터로 맞춰졌어요., 일회 호흡량은 아침에 표준 체중 킬로그램당 6밀리리터로 맞춰졌어요., ideal, actual, total, average]
  - [보호 원리, shield, '''protects''는 동사 하나로 이유를 알려 줘요. 낮은 구동압이 손상된 폐를 지킨다는 인과가 한 문장에 들어 있어요.', by hand, 구동압을 낮게 유지하면 손상된 신장을 보호할 수 있어요., 구동압을 낮게 유지하면 손상된 간을 보호할 수 있어요., lungs, liver, heart, brain]
  - [수치 확인, check, '''Let''s confirm''은 혼자가 아니라 함께 확인하자는 말투여서 동료와 값을 맞출 때 부담이 적어요. 고평부압은 흡기 말 정지 상태에서 재는 압력이에요.', at night, 가습기 물이 30 밑으로 떨어지지 않는지 확인할게요., 수액 속도가 30 밑으로 유지되는지 확인할게요., plateau, venous, abdominal, ocular]
  - [설정 재확인, check, '''before rounds''로 시점을 밝히면 회진 전에 설정이 맞는지 마쳐 둔다는 계획이 분명해져요.', with the doctor, 교대 전에 인공호흡기 설정을 다시 확인할게요., 회진 전에 수액 펌프 설정을 다시 확인할게요., rounds, lunch, dinner, visiting]
  - [목표 제시, star, '''is our target''으로 끝내면 숫자가 개인 의견이 아니라 팀의 공통 목표라는 느낌을 줘요. ''below''로 상한을 알려요.', for the shift, 병실 소음은 15 이하가 목표예요., 대기 인원은 15 이하가 목표예요., driving, plateau, mean, venous]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저 TV 환기 확인 4문장 순서
    why: 설정을 먼저 알리고, 그 설정이 폐를 지키는 이유를 말한 뒤, 확인할 압력과 목표를 정해요. 마지막에 점검 시점을 약속해요.
    lines:
    - [His tidal volume is set to 6 milliliters per kilo of ideal body weight., gear, 일회 호흡량은 표준 체중 킬로그램당 6밀리리터로 맞춰져 있어요, 설정]
    - [Keeping the pressure low with that setting protects his injured lungs., shield, 그 설정으로 압력을 낮게 유지하면 손상된 폐를 보호해요, 이유]
    - [So let's confirm the plateau pressure stays under 30., check, 그러니 고평부압이 30 밑인지 확인해요, 확인]
    - [I'll look at those settings again before rounds., monitor, 회진 전에 그 설정을 다시 볼게요, 재확인]
