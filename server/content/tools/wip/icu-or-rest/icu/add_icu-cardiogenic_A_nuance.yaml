# 상황 순번(0부터) → nuance 목록
0:
  - kind: slider
    words: [w-low]
    cue: "Chart: BP 98/62 — a hair under his usual 104/64, and he has no symptoms."
    scale: [a little low, quite low, dangerously low]
    answerAt: 0
    why: "평소보다 살짝만 낮고 증상도 없으면 a little low. quite low·dangerously low는 수치가 크게 떨어졌을 때 쓰는 말이라 같은 '낮다'여도 무게가 달라요."
    example: "Your blood pressure is a little low right now."
    exKo: "지금 혈압이 조금 낮아요."
  - kind: context
    words: [w-report]
    word: report
    ko: 보고하다
    scenes:
      - {who: 의사 호출, icon: monitor, en: "I'm reporting a drop in his blood pressure.", ok: true}
      - {who: 팀 인계, icon: board, en: "Please report any change in rhythm right away.", ok: true}
      - {who: 환자에게, icon: me, en: "I'm reporting your hemodynamic instability to the physician.", ok: false, fix: "I'm telling the doctor about your blood pressure right now so we can help."}
    why: "의료진끼리는 report가 자연스럽지만, 환자에게는 hemodynamic instability 같은 임상어가 겁을 주고 알아듣기 어려워요. 쉬운 말로 무엇을 하는지 전하세요."
1:
  - kind: slider
    words: [w-continuous]
    cue: "Order: \"Cardiac and BP monitoring with no gaps while on dobutamine.\""
    scale: [intermittent, regular, continuous]
    answerAt: 2
    why: "강심제를 쓰는 동안은 중간에 끊기지 않는 감시가 필요해요. intermittent는 간격을 두고, regular는 정해진 때마다 보는 것이라 이 지시와 달라요."
    example: "He needs continuous cardiac monitoring."
    exKo: "그는 지속적인 심장 모니터링이 필요해요."
  - kind: swap
    words: [w-titrate]
    who: "보호자에게 · 약 설명"
    icon: me
    before: ["We'll ", "titrate the drip", " while we watch how he responds."]
    options: [adjust it little by little, titrate the drip, change it at random]
    answer: adjust it little by little
    notes: {adjust it little by little: "보호자가 알아듣는 쉬운 말이면서 titrate의 뜻(반응을 보며 조금씩 조절)을 그대로 담아요.", titrate the drip: "의료진끼리의 말이라 가족은 무슨 뜻인지 몰라요.", change it at random: "무작위로 바꾼다는 뜻이라 사실과 달라요."}
    why: "titrate는 의료진 용어예요. 가족에게는 '조금씩 조절한다'로 풀어 말하면 불안 없이 같은 뜻이 전해져요."
    ko: "그가 어떻게 반응하는지 보면서 조금씩 조절할 거예요"
2:
  - kind: slider
    words: [w-immediately]
    cue: "ECG shows new ST elevation in a patient with chest pain."
    scale: [when you can, soon, immediately]
    answerAt: 2
    why: "흉통에 새 ST 변화가 있으면 심전도를 지체 없이 의사에게 보여야 해요. when you can·soon은 미뤄도 된다는 느낌을 줘요."
    example: "I'll show this to the physician immediately."
    exKo: "이걸 즉시 의사에게 보여줄게요."
  - kind: context
    words: [w-tracing]
    word: tracing
    ko: 파형 기록
    scenes:
      - {who: 의사에게, icon: monitor, en: "Here's the tracing — new ST changes in V2 through V4.", ok: true}
      - {who: 차트 기록, icon: board, en: "Tracing printed and placed in the chart.", ok: true}
      - {who: 환자에게, icon: me, en: "Your tracing shows ST-segment deviation in the precordial leads.", ok: false, fix: "The tracing shows your heart is under some strain, and the doctor will go over it with you."}
    why: "의사와 차트에서는 ST·유도 번호까지 정확히 말하지만, 환자에게는 전문용어 대신 '심장에 부담이 보인다'처럼 뜻 중심으로 말해요."
3:
  - kind: pair
    words: [w-sit, w-turn, w-slow]
    pairs: [[sit, you upright], [turn up, your oxygen], [take, slow breaths]]
    decoys: [a heartbeat]
    why: "sit은 환자를 앉히는 동작이라 you upright과, turn up은 다이얼을 올리는 말이라 oxygen과, take는 숨을 쉬는 것이라 slow breaths와 짝이에요."
  - kind: context
    words: [w-short, w-breath]
    word: short of breath
    ko: 숨이 차다
    scenes:
      - {who: 환자에게, icon: me, en: "Tell me if you feel more short of breath.", ok: true}
      - {who: 차트 기록, icon: board, en: "Pt reports feeling short of breath on exertion.", ok: true}
      - {who: 겁먹은 환자에게, icon: me, en: "You are tachypneic and acutely short of breath at rest.", ok: false, fix: "I can see breathing is hard right now, so we're helping you right away."}
    why: "short of breath는 환자와 차트 모두에 쓰는 말이에요. tachypneic 같은 임상어를 숨 가쁜 환자에게 그대로 쓰면 겁만 주니 쉬운 말로 바꿔요."
4:
  - kind: slider
    words: [w-swelling]
    cue: "Both ankles are clearly puffy and the sock leaves a mark, but the calves are soft."
    scale: [mild swelling, visible swelling, severe swelling]
    answerAt: 1
    why: "양말 자국이 남을 만큼 눈에 띄지만 종아리까지는 아니면 visible. mild는 거의 안 보이는 정도, severe는 훨씬 넓고 심할 때예요."
    example: "I'm checking your legs for any swelling."
    exKo: "다리에 부종이 있는지 확인하고 있어요."
  - kind: swap
    words: [w-swelling]
    who: "환자에게 · 부종 설명"
    icon: me
    before: ["Your legs show some ", "edema", " from the extra fluid."]
    options: [puffiness, edema, anasarca]
    answer: puffiness
    notes: {puffiness: "환자가 알아듣는 쉬운 말이에요.", edema: "의료진끼리 쓰는 말이라 환자는 낯설어해요.", anasarca: "전신에 심하게 퍼진 부종을 가리켜 사실보다 무겁게 들려요."}
    why: "같은 부종도 의료진은 edema라고 하지만, 환자에게는 puffiness처럼 익숙한 말이 편해요."
    ko: "여분의 수분 때문에 다리가 조금 부어 있어요"
5:
  - kind: slider
    words: [w-cool]
    cue: "Chart: skin slightly cooler than normal from the knees down."
    scale: [warm, cool, cold]
    answerAt: 1
    why: "정상보다 조금 서늘하면 cool이에요. cold는 확실히 차가운 것이라 더 나쁜 신호로 읽혀요."
    example: "Your skin feels cool from your knees down."
    exKo: "무릎 아래로 피부가 서늘하게 느껴져요."
  - kind: context
    words: [w-circulation]
    word: circulation
    ko: 순환
    scenes:
      - {who: 의사 호출, icon: monitor, en: "His circulation is getting worse — mottling now above the knees.", ok: true}
      - {who: 차트 기록, icon: board, en: "Pt circulation poor, feet cool, pulses weak.", ok: true}
      - {who: 환자에게, icon: me, en: "Your peripheral circulation is compromised with delayed capillary refill.", ok: false, fix: "Your blood isn't reaching your legs as well as it should, so your skin looks blotchy."}
    why: "의료진끼리는 circulation에 정확한 임상 표현을 덧붙이지만, 환자에게는 피가 어디에 덜 가는지를 쉬운 말로 설명해요."
6:
  - kind: slider
    words: [w-borderline]
    cue: "Rhythm: a few extra beats, no runs of VT — not clearly stable, not clearly unstable."
    scale: [stable, borderline, unstable]
    answerAt: 1
    why: "안정도 불안정도 아닌 경계는 borderline이에요. 어느 쪽에 가까운지는 의사와 함께 판단하니 숫자와 함께 보고하세요."
    example: "His rhythm has been borderline for the last hour."
    exKo: "지난 한 시간 동안 리듬이 경계선에 있었어요."
  - kind: swap
    words: [w-arrhythmia, w-dobutamine]
    who: "보호자에게 · 약 부작용 설명"
    icon: me
    before: ["Dobutamine can sometimes cause ", "arrhythmias", "."]
    options: [an uneven heartbeat, arrhythmias, ventricular ectopy]
    answer: an uneven heartbeat
    notes: {an uneven heartbeat: "보호자가 바로 이해하는 쉬운 표현이에요.", arrhythmias: "의료진끼리의 말이라 가족은 낯설어해요.", ventricular ectopy: "더 전문적인 용어라 환자·가족에게는 전혀 전달되지 않아요."}
    why: "같은 부작용도 의료진은 arrhythmia, 가족에게는 '심장이 고르지 않게 뛴다'처럼 풀어 말하면 불필요한 공포 없이 전해져요."
    ko: "도부타민은 가끔 심장이 불규칙하게 뛰게 할 수 있어요"
7:
  - kind: pair
    words: [w-give, w-track]
    pairs: [[give, the IV diuretic], [track, her urine output]]
    decoys: [a heartbeat]
    why: "give는 약을 투여하는 동사라 the IV diuretic과, track은 값을 따라가며 기록하는 동사라 urine output과 어울려요."
  - kind: swap
    words: [w-diuretic]
    who: "환자에게 · 이뇨제 설명"
    icon: me
    before: ["This ", "diuretic", " will make you urinate more."]
    options: [water pill, diuretic, natriuretic agent]
    answer: water pill
    notes: {water pill: "미국에서 diuretic을 환자에게 풀어 말할 때 흔히 쓰는 쉬운 말이에요.", diuretic: "의료진끼리의 말이라 환자는 뜻을 모를 수 있어요.", natriuretic agent: "훨씬 전문적이라 환자에게 쓸 말이 아니에요."}
    why: "환자에게는 diuretic 대신 water pill처럼 이해되는 말로 설명하는 게 좋아요."
    ko: "이 약은 소변을 더 보게 해줄 거예요"
8:
  - kind: slider
    words: [w-continuously]
    cue: "Order: \"Rhythm and BP watched on the monitor with no gaps.\""
    scale: [now and then, every hour, continuously]
    answerAt: 2
    why: "monitor continuously는 한순간도 끊기지 않는다는 뜻이에요. now and then이나 every hour는 사이사이 공백이 있어요."
    example: "I'll monitor his rhythm and pressure continuously."
    exKo: "리듬과 혈압을 지속적으로 모니터할게요."
  - kind: context
    words: [w-damaged]
    word: damaged
    ko: 손상된
    scenes:
      - {who: 차트 기록, icon: board, en: "Echo: damaged anterior wall, EF reduced.", ok: true}
      - {who: 의사 호출, icon: monitor, en: "Part of his heart muscle is damaged after the MI.", ok: true}
      - {who: 보호자에게, icon: me, en: "Your husband's myocardium is damaged and non-viable.", ok: false, fix: "Part of his heart muscle was hurt by the heart attack, and we're protecting what's left."}
    why: "의료진끼리는 damaged가 정확한 설명이지만, 가족에게 non-viable 같은 단정적인 말은 희망을 일방적으로 끊는 것처럼 들려요."
9:
  - kind: pair
    words: [w-place, w-work, w-watch]
    pairs: [[place it, through a small opening], [work, with each heartbeat], [watch, the insertion site]]
    decoys: [a recipe]
    why: "place it은 삽입 방법을, work with는 박동과 함께 움직이는 장치를, watch는 부위를 지켜보는 일을 가리켜요."
  - kind: context
    words: [w-pump]
    word: pump
    ko: 펌프
    scenes:
      - {who: 의사에게, icon: monitor, en: "The pump is triggering off the ECG, and augmentation looks good.", ok: true}
      - {who: 환자 가족에게, icon: me, en: "The pump helps his heart push blood more easily.", ok: true}
      - {who: 겁먹은 환자에게, icon: me, en: "The intra-aortic counterpulsation pump reduces your afterload.", ok: false, fix: "It's a small balloon that helps your heart pump blood more easily."}
    why: "pump는 의료진과 가족 모두 쓰는 쉬운 말이에요. 다만 counterpulsation·afterload 같은 설명은 환자에게는 어렵고 겁이 나요."
10:
  - kind: slider
    words: [w-early]
    cue: "Waveform: inflation starts slightly before the dicrotic notch on this cycle."
    scale: [right on time, a bit early, way too early]
    answerAt: 1
    why: "약간만 앞서면 a bit early예요. way too early는 훨씬 많이 어긋난 경우이고, 보조 효과가 떨어지니 조정이 필요해요."
    example: "The waveform looks a little early on this cycle."
    exKo: "이번 주기에서 파형이 조금 이르게 나타나요."
  - kind: context
    words: [w-timing]
    word: timing
    ko: 타이밍
    scenes:
      - {who: 팀원에게, icon: monitor, en: "The timing is off — inflation is early on this cycle.", ok: true}
      - {who: 의사에게, icon: board, en: "I'll recheck the timing after the adjustment.", ok: true}
      - {who: 환자에게, icon: me, en: "The counterpulsation timing is dyssynchronous with your cardiac cycle.", ok: false, fix: "The machine needs a small adjustment so its timing matches your heartbeat."}
    why: "의료진끼리는 timing을 주기와 파형으로 설명해도 되지만, 환자에게는 dyssynchronous 같은 말보다 기계를 맞춘다는 정도로 말해요."
11:
  - kind: slider
    words: [w-regularly]
    cue: "Order: \"Check pulses and color in that leg every hour.\""
    scale: [rarely, regularly, nonstop]
    answerAt: 1
    why: "정해진 간격으로 빠짐없이 하는 것은 regularly예요. rarely는 거의 안 하는 것, nonstop은 쉬지 않고 계속한다는 뜻이에요."
    example: "I'm checking the pulses and color in that leg regularly."
    exKo: "그 다리의 맥박과 색깔을 규칙적으로 확인하고 있어요."
  - kind: context
    words: [w-bleeding]
    word: bleeding
    ko: 출혈
    scenes:
      - {who: 의사 호출, icon: monitor, en: "There's bleeding at the insertion site — the dressing is soaked.", ok: true}
      - {who: 팀 인계, icon: board, en: "Watch the site for any bleeding.", ok: true}
      - {who: 환자에게, icon: me, en: "You're bleeding from the access site and may need a transfusion.", ok: false, fix: "There's a little blood where the tube went in, and we're pressing on it."}
    why: "의료진끼리는 bleeding의 정도와 위치를 곧바로 말해요. 환자에게는 사실을 숨기지 않되 수혈 가능성부터 말해 겁을 주지 말고 지금 하는 조치를 먼저 전해요."
12:
  - kind: slider
    words: [w-delicate]
    cue: "Right heart failing: small fluid changes swing his pressure, but he is not crashing."
    scale: [steady, delicate, critical]
    answerAt: 1
    why: "작은 변화에도 흔들리지만 당장 무너지지는 않으면 delicate예요. steady는 안정적, critical은 즉각 위험할 때예요."
    example: "His right ventricle is failing, so preload balance is delicate."
    exKo: "우심실 기능이 저하돼서 전부하 균형이 예민해요."
  - kind: context
    words: [w-oxygenation]
    word: oxygenation
    ko: 산소화
    scenes:
      - {who: 의사 호출, icon: monitor, en: "Oxygenation dropped after the fluid bolus.", ok: true}
      - {who: 팀 인계, icon: board, en: "I'll watch his oxygenation and CVP closely.", ok: true}
      - {who: 환자에게, icon: me, en: "Your oxygenation index is suboptimal with elevated PVR.", ok: false, fix: "Your oxygen level is a little lower than we want, and we're watching it closely."}
    why: "의료진끼리는 oxygenation을 지표와 함께 말하지만, 환자에게는 지표 약어보다 '산소 수치가 조금 낮다'가 이해돼요."
13:
  - kind: slider
    words: [w-slowly]
    cue: "Weaning plan: lower the drip a little every few hours as his heart tolerates it."
    scale: [suddenly, quickly, slowly]
    answerAt: 2
    why: "강심제 이탈은 심장이 버티는지 보면서 줄여요. suddenly나 quickly는 갑자기 순환이 무너질 위험이 있는 방식이에요."
    example: "We're slowly lowering the medication as his heart holds steady."
    exKo: "심장이 안정적으로 유지되는 만큼 약물을 천천히 줄이고 있어요."
  - kind: context
    words: [w-dose]
    word: dose
    ko: 용량
    scenes:
      - {who: 의사에게, icon: monitor, en: "Can we lower the dose another step?", ok: true}
      - {who: 환자 가족에게, icon: me, en: "We're lowering the dose a little at a time.", ok: true}
      - {who: 걱정하는 환자에게, icon: me, en: "Dose reduction is contingent on MAP, lactate and cardiac index trending favorably.", ok: false, fix: "We're lowering the dose a little at a time while we watch how your heart does."}
    why: "의료진끼리는 dose 조정 기준을 수치로 말하지만, 환자에게는 약을 조금씩 줄이며 지켜본다는 한 줄이면 충분해요."
14:
  - kind: slider
    words: [w-below]
    cue: "Her ACT is a hair under the lower limit of her target range."
    scale: [just below, below, way below]
    answerAt: 0
    why: "한계선 바로 아래면 just below예요. way below는 많이 벗어난 것이라 조치도 더 급해져요."
    example: "Her last ACT was a little below target."
    exKo: "지난 ACT 수치가 목표보다 조금 낮았어요."
  - kind: context
    words: [w-circuit]
    word: circuit
    ko: 회로
    scenes:
      - {who: 의사에게, icon: monitor, en: "I'm checking the circuit for clots and kinks.", ok: true}
      - {who: 팀 인계, icon: board, en: "I'm watching the circuit and her for any bleeding.", ok: true}
      - {who: 보호자에게, icon: me, en: "The circuit's oxygenator and cannulae are being monitored for thrombus.", ok: false, fix: "The machine's tubing is being checked all the time, and we'd tell you right away if anything changes."}
    why: "의료진끼리는 circuit의 각 부분을 정확히 가리켜도 되지만, 가족에게는 산소화기·캐뉼라 같은 말보다 기계를 계속 확인한다는 점이 중요해요."
15:
  - kind: slider
    words: [w-call]
    cue: "Blood in the IABP tubing — the balloon may have ruptured."
    scale: [at the next round, within the hour, right now]
    answerAt: 2
    why: "IABP 튜브에 피가 보이면 풍선 파열을 의심해 펌프를 멈추고 즉시 의사를 불러야 해요. 다음 회진까지 기다리면 안 돼요."
    example: "I'm stopping the pump and calling the physician now."
    exKo: "펌프를 멈추고 지금 의사를 부르고 있어요."
  - kind: swap
    words: [w-rupture]
    who: "환자에게 · 상황 설명"
    icon: me
    before: ["The balloon may have ", "ruptured", ", and we're fixing it right away."]
    options: [sprung a leak, ruptured, catastrophically failed]
    answer: sprung a leak
    notes: {sprung a leak: "풍선에 구멍이 났을 수 있다는 뜻을 쉽고 차분하게 전해요.", ruptured: "의료진끼리의 말이라 환자는 크게 놀랄 수 있어요.", catastrophically failed: "사실보다 훨씬 무겁게 들려 공포를 키워요."}
    why: "같은 사건도 의료진은 rupture라고 하지만, 환자에게는 상황을 차분히 풀어 말하고 바로 조치한다는 점을 함께 전해요."
    ko: "풍선에 구멍이 났을 수 있어서 바로 조치하고 있어요"
16:
  - kind: slider
    words: [w-fail]
    cue: "On the IABP and inotropes, but his pressure keeps falling and urine output is dropping."
    scale: [struggling, failing, crashing]
    answerAt: 1
    why: "지원을 다 해도 계속 나빠지면 failing이에요. struggling은 아직 버티는 정도, crashing은 지금 무너지는 중이라는 뜻이에요."
    example: "He's failing despite the IABP and inotropes."
    exKo: "풍선펌프와 강심제에도 불구하고 상태가 나빠지고 있어요."
  - kind: swap
    words: [w-activate, w-team]
    who: "보호자에게 · ECMO 설명"
    icon: me
    before: ["We're ", "activating the ECMO team", " so a machine can help his heart and lungs."]
    options: [calling in the ECMO team, activating the ECMO team, initiating VA-ECMO cannulation]
    answer: calling in the ECMO team
    notes: {calling in the ECMO team: "가족이 무슨 일인지 알아듣는 쉬운 말이에요.", activating the ECMO team: "의료진 사이의 호출 용어라 가족에게는 낯설어요.", initiating VA-ECMO cannulation: "시술 이름 그대로라 가족이 한꺼번에 받아들이기 어려워요."}
    why: "activate는 팀을 가동하는 의료진 용어예요. 가족에게는 '전문팀을 부른다'로 말하면 이해가 쉬워요."
    ko: "기계가 심장과 폐를 도울 수 있도록 ECMO 팀을 부르고 있어요"
17:
  - kind: pair
    words: [w-call, w-resume, w-clear]
    pairs: [[call, a code], [resume, CPR], [clear, the bed]]
    decoys: [a recipe]
    why: "call은 호출하는 말이라 a code와, resume은 멈췄던 일을 다시 잇는 말이라 CPR과, clear는 비켜서라는 말이라 the bed와 짝이에요."
  - kind: swap
    words: [w-shock]
    who: "가족에게 · 소생 설명"
    icon: me
    before: ["We gave his heart a ", "defibrillation", " to reset the rhythm."]
    options: [shock, defibrillation, countershock]
    answer: shock
    notes: {shock: "가족이 알아듣는 말이에요. 전기 자극으로 리듬을 되돌린다는 뜻을 전해요.", defibrillation: "의료진 용어라 가족에게 낯설어요.", countershock: "더 드문 전문 용어라 가족에게 전해지지 않아요."}
    why: "같은 처치도 의료진은 defibrillation이라 하지만, 가족에게는 shock처럼 짧고 이해되는 말이 낫고 이어서 왜 했는지를 덧붙여요."
    ko: "심장 리듬을 되돌리려고 전기 충격을 줬어요"
18:
  - kind: slider
    words: [w-soaked]
    cue: "The dressing is wet all the way through — blood has run onto the sheets."
    scale: [dry, damp, soaked]
    answerAt: 2
    why: "드레싱이 속까지 젖고 시트까지 번졌으면 soaked예요. damp는 살짝 축축한 정도라 출혈량을 줄여 말하게 돼요."
    example: "Her sheets are soaked and the dressing is saturated."
    exKo: "시트가 흠뻑 젖었고 드레싱도 흠뻑 젖었어요."
  - kind: context
    words: [w-pressure]
    word: pressure
    ko: 압박
    scenes:
      - {who: 의사 호출, icon: monitor, en: "I'm holding pressure on the cannula site.", ok: true}
      - {who: 팀원에게, icon: board, en: "Hold pressure while I get the dressing.", ok: true}
      - {who: 환자에게, icon: me, en: "Applying manual pressure to achieve hemostasis at the cannulation site.", ok: false, fix: "I'm pressing firmly on the spot to slow the bleeding."}
    why: "의료진끼리는 hold pressure만으로 충분해요. 환자에게는 hemostasis 같은 말 대신 지금 무엇을 하는지 쉬운 말로 전해요."
19:
  - kind: slider
    words: [w-ready]
    cue: "Everything checked: lines secured, monitor charged, cath lab waiting."
    scale: [not ready, almost ready, ready]
    answerAt: 2
    why: "점검을 모두 마쳤으면 ready예요. almost ready는 아직 확인할 게 남았다는 뜻이라 이송을 시작하면 안 돼요."
    example: "I'll call ahead so the cath lab is ready for him."
    exKo: "카테터실이 준비되도록 미리 전화할게요."
  - kind: context
    words: [w-line]
    word: line
    ko: 라인
    scenes:
      - {who: 팀원에게, icon: monitor, en: "Check that all lines are secured before we move.", ok: true}
      - {who: 환자에게, icon: me, en: "We're making sure your lines stay put during the move.", ok: true}
      - {who: 겁먹은 환자에게, icon: me, en: "Your central venous and arterial access lines are secured per transport protocol.", ok: false, fix: "The tubes in your body are taped down so they won't pull."}
    why: "의료진끼리는 line의 종류까지 말해도 되지만, 환자에게는 중심정맥·동맥 같은 설명보다 안전하게 고정했다는 점만 전해요."
20:
  - kind: slider
    words: [w-hope]
    cue: "His daughter asks, \"Will he get better?\" — the outcome is genuinely uncertain."
    scale: [we hope, we expect, we promise]
    answerAt: 0
    why: "결과가 불확실하면 we hope가 정직해요. we promise는 지킬 수 없는 약속이라 간호사가 해서는 안 되고, we expect도 확신처럼 들려요."
    example: "His heart isn't recovering the way we hoped."
    exKo: "심장이 저희가 바랐던 만큼 회복되고 있지 않아요."
  - kind: context
    words: [w-choice]
    word: choice
    ko: 선택
    scenes:
      - {who: 가족에게, icon: me, en: "There is no wrong choice here.", ok: true}
      - {who: 팀 회의, icon: board, en: "Whatever choice the family makes, we'll support it.", ok: true}
      - {who: 가족에게, icon: me, en: "You must make the choice between a heart pump and hospice today.", ok: false, fix: "Whatever you decide, we'll be with you — there's no wrong choice."}
    why: "가족이 큰 결정을 앞두고 있을 때는 재촉하지 않고 곁에 있겠다고 말해요. must ... today는 압박하는 말로 들려요."
