situations:
- title: 다장기부전 진행 위기
  s:
  - ["우선순위", compass, "'prioritize'는 여러 문제 중 먼저 챙길 것을 정한다는 뜻이에요. 혈압과 산소화는 모든 장기에 피와 산소를 보내는 기본이에요.", "first of", "혈압과 산소화 기록에 우선순위를 둡시다.", "혈압과 산소화 일정에 우선순위를 둡시다.", "pressure", "diet", "weight", "mood"]
  - ["의사 호출", pager, "'escalating'은 더 높은 책임자에게 올린다는 뜻이에요. 'for more support'로 목적을 붙여 왜 올리는지 알려요.", "to ask", "더 많은 지지를 위해 의사에게 설명하고 있어요.", "더 많은 지지를 위해 의사에게 메모를 보내고 있어요.", "support", "paperwork", "visitors", "space"]
  - ["치료 예고", gear, "'may need'는 아직 확정이 아니라 대비하자는 뜻이에요. 투석은 신장을, 인공호흡기 설정은 폐를 돕는 조치예요.", "might be", "수혈과 더 높은 인공호흡기 설정이 필요할 수도 있어요.", "투석과 더 높은 수액 속도가 필요할 수도 있어요.", "dialysis", "surgery", "transfusion", "oxygen"]
  - ["상황 보고", siren, "'all … at once'는 여러 장기가 동시에 무너지고 있다는 점을 한 번에 전해요. 보고를 받는 사람이 위중함을 바로 알아요.", "one by", "신장, 피부, 혈압이 한꺼번에 기능을 멈추고 있어요.", "신장, 폐, 혈압이 서서히 기능을 멈추고 있어요.", "failing", "improving", "resting", "healing"]
  - ["일손 요청", bell, "'so'로 상황과 행동을 이으면 왜 사람을 더 부르는지 알려요. 'spiraling'은 빠르게 나빠진다는 뜻이에요.", "as the", "상황이 급격히 악화돼서 장비를 더 부르고 있어요.", "상황이 천천히 악화돼서 일손을 더 부르고 있어요.", "spiraling", "stabilizing", "resolving", "calming"]
  - ["장기 지지", shield, "'every organ we can'은 가능한 모든 장기를 챙긴다는 뜻이에요. 'while'로 안정시키는 일과 지지가 동시에 이뤄진다고 말해요.", "any of", "그를 안정시키는 동안 가능한 모든 가족을 지지하고 있어요.", "그를 이송하는 동안 가능한 모든 장기를 지지하고 있어요.", "organ", "drug", "tool", "test"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 다장기부전 대응 4문장 순서
    why: 장기들이 동시에 무너진다고 보고하고 의사에게 올린 뒤, 그 지지가 어떤 치료로 이어질지 예고하고, 모든 장기를 지지하며 안정시켜요.
    lines:
    - ["His kidneys, lungs, and pressure are all failing at once.", siren, "신장, 폐, 혈압이 한꺼번에 기능을 멈추고 있어요", "보고"]
    - ["I'm escalating to the physician for more support.", pager, "더 많은 지지를 위해 의사에게 에스컬레이션하고 있어요", "호출"]
    - ["That support may mean dialysis and higher vent settings.", gear, "그 지지는 투석과 더 높은 인공호흡기 설정을 뜻할 수도 있어요", "예고"]
    - ["Through all of it, we're supporting every organ we can while we stabilize him.", shield, "그 모든 과정에서 그를 안정시키는 동안 가능한 모든 장기를 지지하고 있어요", "지지"]
- title: 응급 이식 조율 위기
  s:
  - ["이송 준비", run, "'for immediate transfer'는 안정시키는 목적이 곧 이송임을 알려요. 이송 중에 상태가 나빠지지 않게 먼저 버티게 해요.", "to make", "즉각적인 이송을 위해 그의 서류를 챙깁시다.", "즉각적인 이송을 위해 그의 짐을 챙깁시다.", "stabilize", "weigh", "feed", "bathe"]
  - ["인계", handshake2, "'full handoff'는 빠짐없는 인계라는 뜻이에요. 받는 센터가 환자를 한 번에 이해하게 해 줘요.", "to the", "이식센터에 전체 일정을 요청할게요.", "이식센터에 전체 비용을 문의할게요.", "handoff", "invoice", "refund", "tour"]
  - ["이동 물품", pill, "'for the trip'은 이동 중에 필요하다는 목적을 말해요. 혈액과 응급 약은 이동 중 출혈이나 악화에 바로 쓰려는 거예요.", "to take", "이동을 위해 혈액과 응급 약 목록을 가져오세요.", "이동을 위해 혈액과 응급 약 서류를 가져오세요.", "emergency", "daily", "vitamin", "allergy"]
  - ["등록 상태", pushpin, "'so'로 이유를 이으면 센터가 급하게 원하는 까닭이 분명해져요. 1A는 가장 긴급한 등록 상태예요.", "and then", "상태 2A로 등록돼서 센터가 지금 그를 원해요.", "상태 1A로 등록돼서 센터가 지금 그에게 전화해요.", "status", "stage", "grade", "class"]
  - ["팀·시간 확인", calendar, "'and'로 팀과 시간을 함께 확인한다고 말해서 받는 쪽 준비가 끝났는지를 한 번에 챙겨요.", "to the", "받아들이는 팀과 이송 시간을 기록할게요.", "받아들이는 팀과 이송 시간을 공유할게요.", "time", "cost", "color", "weight"]
  - ["이송 중 감시", monitor, "'during the whole transfer'는 일부가 아니라 처음부터 끝까지라는 뜻이에요. 이동 중에는 변화를 놓치기 쉬워서 계속 봐요.", "for the", "전체 이송 동안 그를 자세히 기록할게요.", "전체 이송 동안 그를 자세히 보고할게요.", "monitor", "weigh", "bathe", "dress"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 응급 이식 이송 4문장 순서
    why: 등록 상태로 급한 이유를 알린 뒤 안정시키고, 이동 물품을 챙기며, 이송 내내 계속 지켜본다고 말해요.
    lines:
    - ["He's listed as status 1A, so the center wants him now.", pushpin, "상태 1A로 등록돼서 센터가 지금 그를 원해요", "이유"]
    - ["So let's stabilize him for immediate transfer.", run, "그러니 즉각적인 이송을 위해 그를 안정시킵시다", "안정"]
    - ["For the trip, bring blood and emergency meds.", pill, "이동을 위해 혈액과 응급 약을 가져오세요", "물품"]
    - ["We'll monitor him closely during all of it.", monitor, "그 모든 과정에서 그를 자세히 모니터링할게요", "감시"]
- title: 이식 불가 목표·완화 소통
  s:
  - ["선택지 설명", speech, "'isn't a safe option'은 불가능이 아니라 위험이 크다는 뜻이라 환자 가족에게 이유를 정직하게 전해요.", "does not", "투석이 그에게 안전한 선택지가 아니라는 뜻이에요.", "이식이 그에게 편한 선택지가 아니라는 뜻이에요.", "safe", "cheap", "quick", "local"]
  - ["편안 중심", faceWorried, "'But'으로 앞의 나쁜 소식 뒤에 남은 일을 말해 가족이 희망을 잃지 않게 해요. 'still a lot'은 아직 할 일이 많다는 뜻이에요.", "yet there", "하지만 그를 깨어 있게 해 드릴 수 있는 게 아직 많아요.", "하지만 그를 편안하게 해 드릴 수 있는 시간이 아직 많아요.", "comfortable", "awake", "alone", "busy"]
  - ["가치 묻기", speech, "'what would matter most to him'은 의료진이 아니라 환자 본인의 가치를 묻는 말이에요. 목표를 정할 때 환자가 중심이 돼요.", "to ask", "그에게 가장 편한 게 뭔지 이야기해 봅시다.", "그에게 가장 중요한 게 뭔지 기록해 봅시다.", "talk", "write", "think", "guess"]
  - ["공감 표현", faceWorried, "나쁜 소식은 먼저 '힘든 소식'이라고 이름 붙이고 사과를 이어 가족이 마음의 준비를 하게 해요. 'so sorry'는 깊은 유감을 뜻해요.", "that is", "힘든 소식이고, 정말 놀라워요.", "힘든 하루고, 정말 유감이에요.", "sorry", "glad", "busy", "early"]
  - ["완화 목표", shield, "'focus on his comfort'는 치료의 목표가 편안함으로 옮겨 갔음을 말해요. 통증과 호흡곤란은 가장 먼저 덜어야 할 증상이에요.", "to keep", "편안함에 집중하고 통증과 호흡을 설명할게요.", "편안함에 집중하고 통증과 호흡을 기록할게요.", "comfort", "diet", "schedule", "visitors"]
  - ["곁에 있기", home, "'as much as you want'는 시간 제한이 없다고 가족에게 허락하는 말이에요. 마지막 시간을 함께하도록 열어 줘요.", "as long", "원하시는 만큼 그의 물건을 쓰셔도 돼요.", "원하시는 만큼 그와 함께 먹으셔도 돼요.", "stay", "hide", "argue", "shout"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이식 불가 소통 4문장 순서
    why: 나쁜 소식에 공감을 먼저 전하고, 그 뜻을 설명한 뒤, 아직 할 수 있는 일을 알리고 곁에 있어도 된다고 마무리해요.
    lines:
    - ["This is hard news, and I'm so sorry.", faceWorried, "힘든 소식이고, 정말 유감이에요", "공감"]
    - ["It means transplant isn't a safe option for him.", speech, "이식이 그에게 안전한 선택지가 아니라는 뜻이에요", "설명"]
    - ["But there is still a lot we can do to keep him comfortable.", shield, "하지만 그를 편안하게 해 드릴 수 있는 게 아직 많아요", "희망"]
    - ["Through all of it, you can stay with him as much as you want.", home, "그 모든 과정에서 원하시는 만큼 그와 함께 있으셔도 돼요", "허락"]
