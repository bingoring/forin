  # B 검토 — why·tag
  "0.1":
    why: "'can cause'는 항상이 아니라 가능성을 말해 겁주지 않고 위험을 알려 줘요. 'lows'는 저혈당을 짧게 부르는 구어예요."
  "1.0":
    why: "'so we can'은 자주 확인하는 이유를 바로 이어 붙여 손끝을 찌르는 것처럼 불편한 일을 납득시켜요. 'safely'는 목적이 안전임을 마지막에 못 박아요."
  "19.2":
    why: "'propose'는 결정하는 게 아니라 제안한다는 뜻이라 팀의 승인 절차를 존중해요. 'the next low'로 막으려는 대상을 분명히 해요."
