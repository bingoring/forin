# 문장 수정 — 키는 "상황.문장"(0부터). en/ko/chunks/words는 v44 필드(changes에 적힘), 나머지는 v46 필드.
sentences:
  "2.6":
    en: "You won't be on this drip forever, and we'll switch or stop it as you improve."
    ko: "이 주입을 평생 맞는 건 아니고, 호전되면 주사로 바꾸거나 중단할 거예요."
    chunks: ["You won't be", "on this drip forever", ", and we'll switch or stop it", "as you improve", "."]
    words: [w-drip, w-forever, w-stop, w-improve]
    tag: 안심
    icon: star
    why: "'You won't be … forever'로 먼저 부담을 덜어 주고, 'switch or stop'으로 바꾸거나 멈추는 길이 있다고 말해요. 'as you improve'가 그 기준이에요."
    dko: ["이 주입을 평생 맞는 건 아니고, 퇴원하면 주사로 바꾸거나 중단할 거예요.", "이 주입을 평생 맞는 건 아니고, 호전되면 알약으로 바꾸거나 중단할 거예요."]
  "4.3":
    en: "If a scan means you skip a meal, we adjust your insulin to match."
    ko: "검사 때문에 식사를 거르면 그에 맞춰 인슐린을 조정해요."
    chunks: ["If a scan", "means you skip a meal", ", we adjust", "your insulin to match", "."]
    words: [w-scan, w-mean, w-skip, w-meal, w-adjust, w-insulin, w-match]
    tag: 금식 대비
    icon: pill
    why: "'means'로 검사와 식사 거름의 연결을 말하고, 'adjust … to match'로 식사가 빠지는 만큼 인슐린도 맞춘다고 해요. 어떻게 맞출지는 병원 프로토콜을 따라요."
    decoy: ", we adjusts"
    dko: ["수술 때문에 식사를 거르면 그에 맞춰 인슐린을 조정해요.", "검사 때문에 식사를 늦추면 그에 맞춰 인슐린을 조정해요."]
  "5.4":
    ko: "더 오르기 전에 지금 짚어서 알릴게요."
    why: "'before it climbs further'는 지금 행동하는 이유를 미래의 악화에 두는 표현이에요. 'flag'는 문제로 짚어 팀에 알린다는 뜻이에요."
    dko: ["더 오르기 전에 지금 짚어서 재볼게요.", "더 오르기 전에 지금 정리해둘게요."]
  "10.4":
    en: "Once you're stable on shots, we'll check your sugar less often."
    ko: "주사로 안정되면 혈당 확인 횟수를 줄일게요."
    chunks: ["Once you're stable", "on shots", ", we'll check your sugar", "less often", "."]
    words: [w-stable, w-shot, w-check, w-often]
    tag: 확인 줄이기
    icon: check
    why: "'Once you're stable'은 안정이라는 조건이 먼저 충족돼야 다음 단계로 간다는 뜻이에요. 'less often'은 확인 간격을 넓힌다는 말이에요."
    dko: ["알약으로 안정되면 혈당 확인 횟수를 줄일게요.", "주사로 안정되면 체온 확인 횟수를 줄일게요."]
  "12.4":
    ko: "작고 꾸준한 변화가 큰 급변보다 더 효과적이에요."
    chunks: ["Smaller, steadier changes", "work better", "than big jumps", "."]
    dko: ["작고 꾸준한 변화가 큰 급변보다 더 조용해요.", "작고 꾸준한 변화가 큰 급변보다 더 자주 나타나요."]
  "13.3":
    en: "This is more than his baseline diabetes. The illness is driving it up."
    ko: "원래 있던 당뇨만으로 오르는 게 아니에요. 병이 혈당을 끌어올리고 있어요."
    chunks: ["This is more than", "his baseline diabetes", ". The illness", "is driving it up", "."]
    why: "'more than'은 당뇨를 탓하지 않으면서 다른 원인이 더 있다고 말해요. 당뇨 탓이라는 환자나 가족의 걱정을 덜어 줘요."
    dko: ["원래 있던 천식만으로 오르는 게 아니에요. 병이 혈당을 끌어올리고 있어요.", "원래 있던 당뇨만으로 오르는 게 아니에요. 병이 열을 끌어올리고 있어요."]
  "14.3":
    en: "When they don't match, the lab value is usually more accurate."
    ko: "값이 안 맞으면 대개 검사실 수치가 더 정확해요."
    chunks: ["When they don't match", ", the lab value", "is usually", "more accurate", "."]
    words: [w-match, w-lab, w-value, w-accurate]
    tag: 판단 기준
    icon: check
    why: "'When they don't match'로 조건을 말하고 'usually more accurate'로 단정을 피해요. 증상이 있는 저혈당이면 검사실 결과를 기다리지 않고 프로토콜대로 먼저 처치해요."
    dko: ["값이 안 맞으면 대개 검사실 수치가 더 늦게 나와요.", "값이 안 맞으면 가끔 검사실 수치가 더 정확해요."]
  "15.4":
    en: "Call the provider to the bedside now."
    ko: "지금 담당의를 병상으로 불러 주세요."
    chunks: ["Call the provider", "to the bedside", "now", "."]
    words: [w-call, w-provider]
    tag: 호출 지시
    icon: speech
    why: "명령문이라 주어 없이 'Call'로 시작해요. 'to the bedside'로 어디로 부르는지 분명히 하고 'now'로 즉시 부르라는 뜻을 줘요. 중환자실에서는 신속대응팀이 아니라 담당 의사를 병상으로 바로 불러요."
    decoy: "Called the provider"
    dko: ["도착하면 바로 상황을 보고해 주세요", "담당의가 오면 자리를 비켜 주세요"]
    blank: {answer: provider, wrong: [dietitian, chaplain, courier]}
  "17.2":
    ko: "DKA로 진행되고 있으면 치료 단계를 빨리 올릴게요."
    dko: ["패혈증으로 진행되고 있으면 치료 단계를 빨리 올릴게요.", "DKA로 진행되고 있으면 검사 단계를 빨리 올릴게요."]
  "18.4":
    en: "I'll ask to add that alert to the flow sheet."
    ko: "그 알람을 흐름표에 넣어 달라고 요청할게요."
    chunks: ["I'll ask", "to add", "that alert", "to the flow sheet", "."]
    words: [w-add, w-alert, w-flow, w-sheet]
    tag: 알람 요청
    icon: speech
    why: "'I'll ask to add'로 알람을 직접 만들지 않고 요청한다고 말해 간호사의 업무 범위를 지켜요. 'that alert'는 앞에서 말한 그 알람이에요."
    decoy: "I'll asks"
    dko: ["그 알람을 침상에 달아 달라고 요청할게요.", "그 알람을 벽에 붙여 달라고 요청할게요."]
    blank: {answer: alert, wrong: [dressing, sticker, blanket]}
  "20.2":
    ko: "어느 쪽이든 이 변화를 팀에 보고할게요."
  "16.3":
    chunks: ["We always", "double-check", "the dose", "before we give it", "."]
    words: [w-always, w-double, w-dose, w-give]
    blank: {answer: give, wrong: [move, order, wash]}
