- title: 활력·관류 재평가
  s:
  - {t: "재확인", i: stetho, w: "rechecking의 re-는 이미 한 확인을 다시 한다는 뜻이에요. how warm his skin is는 간접 의문이라 어순이 평서문 그대로이고, 피부 온도로 순환 상태를 가늠해요.", d: "for your visit", k: ["혈압, 심박수, 그리고 피부가 얼마나 건조한지 다시 확인하고 있어요", "혈압, 호흡수, 그리고 피부가 얼마나 따뜻한지 다시 확인하고 있어요"], a: "warm", o: ["loud", "sweet", "wide"]}
  - {t: "호전 징후", i: chartup, w: "are good signs 뒤의 he's responding은 접속사 that이 생략된 절이에요. 생각이 맑아지는 것도 보는 이유는 뇌로 가는 혈류가 좋아졌는지도 알려 주기 때문이에요.", d: "on the whiteboard", k: ["땀이 늘고 생각이 더 맑아지는 건 반응하고 있다는 좋은 징후예요", "소변량이 늘고 식욕이 더 좋아지는 건 반응하고 있다는 좋은 징후예요"], a: "clearer", o: ["cheaper", "shorter", "sweeter"]}
  - {t: "재평가 약속", i: redo, w: "keep reassessing처럼 keep 뒤의 -ing는 같은 행동을 계속한다는 모양이에요. in the right direction은 한 번의 수치보다 변화의 방향을 본다는 말이에요.", d: "on the second floor", k: ["빠른 속도로 가고 있는지 확실히 하려고 계속 재평가할게요", "편안히 잘 자고 있는지 확실히 하려고 계속 재평가할게요"], a: "direction", o: ["distance", "division", "donation"]}
  - {t: "호전 설명", i: chartup, w: "warmer now의 비교급은 이전보다 달라졌다는 변화를 말해요. which is a good sign of …로 따뜻해진 손발이 순환 회복을 뜻한다고 연결해 줘요.", d: "in the waiting room", k: ["손과 귀가 더 따뜻해졌는데, 이건 순환이 좋아졌다는 좋은 징후예요", "손과 발이 더 따뜻해졌는데, 이건 호흡이 좋아졌다는 좋은 징후예요"], a: "warmer", o: ["wiser", "noisier", "lighter"]}
  - {t: "확인 간격", i: calendar, w: "every fifteen minutes는 every 뒤에 주기를 붙여 확인 간격을 정확히 알려 줘요. until 절이 끝나는 조건이라서 언제까지 이어지는지도 함께 전해져요.", d: "in the stairwell", k: ["확실히 더 안정될 때까지 십 분마다 계속 확인할게요", "확실히 더 편안해질 때까지 십오 분마다 계속 확인할게요"], a: "stable", o: ["cheerful", "curious", "hungry"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "재평가 결과 설명 4문장 순서"
    why: "먼저 재확인한다고 말하고, 그 확인으로 본 변화를 알려요. 3줄의 That은 2줄의 변화를 좋은 징후로 해석하고, 4줄의 Even so는 좋은 소식 뒤에도 확인을 이어 간다는 뜻이라 맨 끝에 와서 순서가 하나예요."
    lines:
    - {en: "I'm rechecking his blood pressure, heart rate, and how warm his skin is.", icon: stetho, ko: "혈압, 심박수, 피부 온도를 다시 확인하고 있어요", note: "확인"}
    - {en: "From that, I can see his hands and feet are warmer now.", icon: magnify, ko: "그걸 보니 손과 발이 더 따뜻해졌어요", note: "관찰"}
    - {en: "That is a good sign of better circulation.", icon: chartup, ko: "그건 순환이 좋아졌다는 좋은 징후예요", note: "해석"}
    - {en: "Even so, I'll keep checking him every fifteen minutes until he's clearly more stable.", icon: calendar, ko: "그래도 확실히 안정될 때까지 십오 분마다 계속 확인할게요", note: "약속"}
- title: 패혈성 쇼크 승압 시작
  s:
  - {t: "약물 추가", i: pill, w: "isn't responding to … alone의 alone은 그것만으로는 부족하다는 뜻이에요. so we're adding은 부족해서 더한다는 흐름을 한 문장으로 이어요.", d: "by the pole", k: ["열이 수액만으로는 반응하지 않아서, 약물을 하나 추가하고 있어요", "소변이 수액만으로는 반응하지 않아서, 약물을 하나 추가하고 있어요"], a: "alone", o: ["aloud", "ahead", "abroad"]}
  - {t: "약 설명", i: pill, w: "helps tighten처럼 help 뒤에는 to 없이 동사원형이 올 수 있어요. tighten은 혈관을 좁혀 압력을 올린다는 뜻이라, 승압제가 하는 일을 쉬운 동사로 풀어 줘요.", d: "from the pharmacy window", k: ["이 점적 주입이 혈관을 조여서 체온을 지지하는 데 도움을 줘요", "이 점적 주입이 신장을 조여서 혈압을 지지하는 데 도움을 줘요"], a: "tighten", o: ["brighten", "whiten", "frighten"]}
  - {t: "투여 경로", i: monitor, w: "through a central line은 약이 들어가는 경로를 전치사 through로 밝혀요. 승압제는 작은 정맥에서 새면 조직이 상할 수 있어서 큰 정맥으로 가는 중심정맥관을 쓰는 경우가 많아요.", d: "in the corner", k: ["중심정맥관으로 줄 거고, 아주 오랫동안 지켜볼게요", "중심정맥관으로 줄 거고, 아주 세심하게 지켜보고 있었어요"], a: "central", o: ["rented", "glass", "wooden"]}
  - {t: "약 소개", i: pill, w: "is called …는 이름을 소개하는 수동태예요. very common을 덧붙여 낯선 약 이름이 특별한 일이 아니라 늘 쓰는 치료라는 안도감을 줘요.", d: "from the supply room", k: ["이 약물은 승압제라고 불리고, 응급실에서 아주 흔해요", "이 약물은 승압제라고 불리고, 어린이 병원에서 아주 흔해요"], a: "common", o: ["crowded", "creative", "careful"]}
  - {t: "용량 설명", i: pill, w: "only as much as는 필요한 만큼으로 상한을 두는 표현이에요. 낮게 시작해서 반응에 맞춰 올린다는 순서를 알리면 가족이 서서히 조절하는 이유를 이해해요.", d: "for the guests", k: ["낮은 용량으로 시작하기 전에 혈압부터 확인하고 기록해요", "낮은 용량을 쓰기 전에 약 이름과 라벨을 소리 내어 확인해요"], a: "low", o: ["loud", "lazy", "lucky"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "승압제 시작 설명 4문장 순서"
    why: "수액에 반응이 없다는 상황에서 시작해 약물을 더한다고 이어요. 3줄의 It은 2줄의 약물을 가리키고, 4줄의 go up은 3줄의 low dose에서 올린다는 뜻이라서 순서가 하나예요."
    lines:
    - {en: "His blood pressure isn't responding to fluids alone.", icon: monitor, ko: "혈압이 수액만으로는 반응하지 않아요", note: "상황"}
    - {en: "So we're adding a medication called a vasopressor.", icon: pill, ko: "그래서 승압제라는 약물을 더하고 있어요", note: "추가"}
    - {en: "It will go in through a central line, and we'll start at a low dose.", icon: gear, ko: "중심정맥관으로 들어가고 낮은 용량으로 시작해요", note: "방법"}
    - {en: "From there, we'll go up only as much as his pressure needs.", icon: chartup, ko: "거기서부터 혈압이 필요한 만큼만 올려요", note: "조절"}
- title: 젖산 클리어런스 재평가
  s:
  - {t: "수치 해석", i: chartup, w: "A falling lactate처럼 현재분사가 명사 앞에서 변화 방향을 꾸며 줘요. 젖산은 조직이 산소를 충분히 못 받을 때 오르는 수치라, 떨어지면 순환이 나아졌다는 신호로 읽어요.", d: "near the bench", k: ["젖산이 떨어지고 있다는 건 호흡이 치료로 좋아지고 있다는 뜻이에요", "혈당이 떨어지고 있다는 건 순환이 치료로 좋아지고 있다는 뜻이에요"], a: "falling", o: ["calling", "selling", "singing"]}
  - {t: "재검 이유", i: lab, w: "to make sure …는 확인하려고 한다는 목적을 말하는 표현이에요. resuscitation은 소생 처치를 가리키는 명사라서, 검사를 다시 하는 이유가 치료의 효과를 보는 것임을 보여 줘요.", d: "on the shelf", k: ["소생 처치가 효과가 있는지 확인하려고 혈당을 다시 검사해요", "소생 처치가 끝났는지 확인하려고 다시 검사해요"], a: "recheck", o: ["rename", "repaint", "rehearse"]}
  - {t: "대비 설명", i: bulb, w: "may need to처럼 may는 확정이 아닌 가능성을 말해요. stays high의 stay는 같은 상태로 머문다는 뜻이라, 수치가 내려가지 않는 경우를 부드럽게 미리 알려 줘요.", d: "for the cart", k: ["소변이 계속 적으면, 더 지지해 드릴 조치가 필요할 수도 있어요", "계속 높으면, 더 알려 드릴 내용이 있을 수도 있어요"], a: "high", o: ["soft", "sour", "shy"]}
  - {t: "수치 해석", i: chartup, w: "dropped from six to two처럼 from A to B는 변화의 출발과 도착을 숫자로 보여 줘요. strong response는 수치가 눈에 띄게 좋아졌다는 평가를 쉬운 말로 전해요.", d: "at the bus stop", k: ["젖산이 9에서 2로 떨어졌는데, 이건 치료에 강하게 반응한다는 뜻이에요", "젖산이 6에서 2로 떨어졌는데, 이건 어제 검사와 같았다는 뜻이에요"], a: "dropped", o: ["painted", "mailed", "whispered"]}
  - {t: "계획 재검토", i: redo, w: "If … doesn't improve, we'll …은 조건이 실현되지 않을 때의 계획을 미리 말해요. together with the team은 혼자 결정하지 않고 팀과 함께 한다는 점을 밝혀 줘요.", d: "at the gift shop", k: ["수치가 나아지지 않으면, 팀과 함께 전체 일정을 다시 검토할게요", "소변량이 늘지 않으면, 팀과 함께 전체 계획을 다시 검토할게요"], a: "team", o: ["tour", "tape", "tent"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "젖산 재검 결과 설명 4문장 순서"
    why: "수치의 의미를 먼저 알리고, 그래서 다시 검사한다고 이어요. 3줄의 the new result는 2줄의 재검 결과를, 4줄의 In that case는 3줄의 높은 경우를 받아서 순서가 하나예요."
    lines:
    - {en: "A falling lactate tells us his circulation is improving with treatment.", icon: chartup, ko: "젖산이 떨어지면 치료로 순환이 좋아진다는 뜻이에요", note: "의미"}
    - {en: "That is why we recheck it to make sure the resuscitation is working.", icon: lab, ko: "그래서 소생 처치가 효과가 있는지 다시 검사해요", note: "재검"}
    - {en: "If the new result stays high, we may need to do more to support him.", icon: bulb, ko: "새 결과가 계속 높으면 더 지지해 드릴 조치가 필요할 수도 있어요", note: "대비"}
    - {en: "In that case, we'll reassess the whole plan together with the team.", icon: redo, ko: "그 경우 팀과 함께 전체 계획을 다시 검토할게요", note: "계획"}
- title: 감염원 제거 조율
  s:
  - {t: "원칙 설명", i: bulb, w: "work best는 work가 효과가 있다는 뜻이고 best가 최상의 조건을 말해요. when 절이 그 조건이라서, 약만으로는 부족하고 원인 제거가 함께 필요하다는 점이 드러나요.", d: "in the break room", k: ["항생제는 상처도 함께 제거할 때 가장 효과가 좋아요", "수액은 감염원도 함께 제거할 때 가장 효과가 좋아요"], a: "remove", o: ["reward", "rehearse", "recycle"]}
  - {t: "계획 설명", i: scalpel, w: "is planning to …는 이미 정해진 계획을 말하는 진행형이에요. drain은 고인 액체를 관으로 빼내는 것이라서 감염원을 직접 없앤다는 뜻을 쉬운 동사로 전해요.", d: "for the staff", k: ["팀이 회복을 돕기 위해 감염된 액체를 검사할 계획이에요", "팀이 비용을 줄이기 위해 감염된 액체를 배액할 계획이에요"], a: "drain", o: ["drape", "drive", "drum"]}
  - {t: "협조 약속", i: handshake2, w: "keep you updated는 keep 뒤에 사람과 상태가 이어져, 계속 새 소식을 준다는 모양이에요. coordinate with는 여러 팀의 일정을 맞춘다는 뜻이라 가족이 기다리는 동안 안심하게 돼요.", d: "at the vending machine", k: ["시술 팀과 조율하면서 메모로 알려드릴게요", "시술 팀과 조율하면서 직접 만나서 알려드릴게요"], a: "coordinate", o: ["celebrate", "collect", "copy"]}
  - {t: "한계 설명", i: bulb, w: "the way a drain can은 비교 대상을 the way로 이어, 배액관은 닿을 수 있다는 차이를 보여 줘요. pocket은 고여 있는 작은 공간이라서 혈류를 타는 약이 들어가기 어렵다는 점과 이어져요.", d: "from the lab window", k: ["항생제는 배액관처럼 고인 피까지는 닿지 못해요", "수액은 배액관처럼 고인 감염된 액체까지는 닿지 못해요"], a: "reach", o: ["retire", "refuse", "resign"]}
  - {t: "경과 설명", i: chartup, w: "Once …는 앞 일이 끝나는 순간부터 뒤 결과가 이어진다는 접속사예요. often은 항상이 아니라 자주라는 빈도 부사라서 경과를 단정하지 않고 말해요.", d: "at the ice machine", k: ["액체를 배액하고 나면, 통증이 훨씬 더 빨리 좋아지는 경우가 많아요", "상처를 봉합하고 나면, 감염이 훨씬 더 빨리 좋아지는 경우가 많아요"], a: "faster", o: ["fatter", "flatter", "funnier"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "감염원 제거 설명 4문장 순서"
    why: "약의 한계를 먼저 말하고, 그래서 배액을 계획한다고 이어요. 3줄의 them은 2줄의 the team을, 4줄의 All of that은 앞의 계획과 조율을 받아서 순서가 하나예요."
    lines:
    - {en: "Antibiotics can't reach a pocket of infected fluid the way a drain can.", icon: bulb, ko: "항생제는 배액관처럼 고인 감염 액체까지 닿지 못해요", note: "한계"}
    - {en: "So the team is planning to drain it to help him recover.", icon: scalpel, ko: "그래서 팀이 회복을 돕기 위해 그걸 배액할 계획이에요", note: "계획"}
    - {en: "I'll coordinate with them and keep you updated.", icon: handshake2, ko: "그분들과 조율하면서 계속 알려드릴게요", note: "조율"}
    - {en: "All of that matters because once the fluid is drained, the infection often gets better much faster.", icon: chartup, ko: "액체를 배액하고 나면 감염이 훨씬 더 빨리 좋아지는 경우가 많기 때문이에요", note: "이유"}
- title: 항생제 스튜어드십·조정
  s:
  - {t: "항생제 조정", i: lab, w: "so we can narrow는 결과가 있어야 다음 행동이 가능하다는 뜻이에요. narrow는 범위를 좁힌다는 뜻이라서 처음의 광범위 항생제를 균에 맞는 약으로 바꾸는 일을 가리켜요.", d: "near the copier", k: ["배양검사가 정확한 용량을 보여줘서 항생제를 좁힐 수 있어요", "혈액검사가 정확한 균을 보여줘서 항생제를 좁힐 수 있어요"], a: "shows", o: ["sings", "shaves", "shouts"]}
  - {t: "이점 설명", i: bulb, w: "more targeted는 비교급으로 이전보다 대상을 정확히 겨냥한다는 뜻이에요. 쓰는 약의 범위가 좁을수록 몸의 정상 세균에도 덜 영향을 줘서 내성 위험이 줄어요.", d: "on the bulletin board", k: ["더 표적화된 약을 쓰면 부작용과 체중을 줄일 수 있어요", "더 비싼 약을 쓰면 부작용과 내성을 줄일 수 있어요"], a: "targeted", o: ["tasted", "tinted", "tilted"]}
  - {t: "치료 조정", i: gear, w: "based on …은 판단의 근거를 밝히는 전치사구예요. adjusting처럼 진행형을 쓰면 이미 결정한 것이 아니라 지금 바꾸는 중이라는 느낌을 줘요.", d: "for the interns", k: ["팀이 이 결과를 근거로 식단을 조정하고 있어요", "팀이 어제 결과를 근거로 치료를 조정하고 있어요"], a: "adjusting", o: ["admiring", "polishing", "decorating"]}
  - {t: "장점 설명", i: shield, w: "lowers his risk of …에서 risk of 뒤에는 명사형이 와요. Narrowing처럼 -ing가 주어가 되면 그 행동 자체가 이유라서, 지금 약을 좁히는 목적이 먼 훗날의 위험이라는 점이 보여요.", d: "in the elevator", k: ["항생제를 좁히면 나중에 낙상 위험이 낮아져요", "수액을 줄이면 나중에 내성균 감염 위험이 낮아져요"], a: "resistant", o: ["residential", "reluctant", "regional"]}
  - {t: "전환 설명", i: pill, w: "until the new one is fully in effect에서 one은 antibiotic을 대신 받아요. in effect는 효과를 내기 시작했다는 뜻이라, 약을 바꾸는 사이에 치료가 비지 않게 하는 순서가 드러나요.", d: "on the cart", k: ["새 항생제가 약국에 도착할 때까지 지금 쓰는 걸 유지할게요", "새 항생제가 완전히 효과를 낼 때까지 지금 쓰는 걸 유지하고 있었어요"], a: "current", o: ["curious", "cloudy", "cuddly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항생제 좁히기 4문장 순서"
    why: "배양 결과가 먼저이고, 그래서 항생제를 좁힐 수 있다고 이어요. 3줄의 the current one은 2줄의 항생제를, 4줄의 it은 3줄의 새 항생제를 가리켜서 순서가 하나예요."
    lines:
    - {en: "The culture shows the exact bacteria.", icon: lab, ko: "배양검사가 정확한 균을 보여줘요", note: "결과"}
    - {en: "So we can narrow the antibiotic.", icon: pill, ko: "그래서 항생제를 좁힐 수 있어요", note: "조정"}
    - {en: "We'll keep the current one until the new one is fully in effect.", icon: calendar, ko: "새 항생제가 완전히 효과를 낼 때까지 지금 쓰는 걸 유지할게요", note: "전환"}
    - {en: "Once it takes over, a more targeted drug reduces side effects and resistance.", icon: shield, ko: "그게 이어받으면 표적화된 약이 부작용과 내성을 줄여요", note: "이점"}
