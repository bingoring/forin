    ko: 급성 폐부종 응급 4문장 순서
    why: 상태를 알리고, 원인을 설명한 뒤, 제거가 필요하다는 판단을 말하고, 시작한 뒤 기대하는 결과를 말해요.
    lines:
    - ["He's in fluid overload with acute pulmonary edema.", siren, "그는 용량 과부하로 급성 폐부종이 왔어요", "상태"]
    - ["That means extra fluid backed up into his lungs and made it hard to breathe.", chartup, "그건 여분의 체액이 폐로 역류해서 숨쉬기 힘들다는 뜻이에요", "원인"]
    - ["So we need urgent fluid removal to relieve his breathing.", gear, "그래서 호흡을 편하게 하려면 긴급하게 체액을 제거해야 해요", "판단"]
    - ["Once we start, his breathing should get easier as the fluid comes off.", chartup, "시작하면 체액이 빠지면서 호흡이 더 편해질 거예요", "기대"]
- title: 카테터 관련 대량출혈·감염 위기
  s:
  - ["상황 보고", siren, "'site'는 카테터가 들어간 피부 부위를 가리키는 임상 단어예요. 'heavily'는 양이 많다는 뜻이라 급한 상황임을 알려요.", "near the neck", "투석 카테터 부위에서 열이 심해요.", "투석 카테터 부위가 많이 부어 있어요.", "bleeding", "swelling", "itching", "burning"]
  - ["압박·평가", gear, "'firm'은 약하게 대지 않고 단단히 누른다는 뜻이에요. 지혈을 먼저 하고 감염 징후를 보는 순서가 문장에 담겨요.", "and rest it", "단단히 압박하고 알레르기 징후를 평가합시다.", "단단히 압박하고 감염 징후를 기록합시다.", "infection", "allergy", "fracture", "seizure"]
  - ["중단 가능성", pager, "'may need to'는 상황에 따라 필요할 수 있다는 가능성이에요. 'hold'는 끝내는 게 아니라 잠시 세운다는 뜻이에요.", "and call for family", "CRRT를 중단하고 라인 교육을 요청해야 할 수도 있어요.", "CRRT를 중단하고 식이 평가를 요청해야 할 수도 있어요.", "evaluation", "education", "delivery", "inventory"]
  - ["지금 하는 일", pager, "'I'm holding'처럼 현재진행형으로 말하면 지금 하는 중이라는 뜻이라 동료가 바로 상황을 알아요. 두 행동을 'and'로 이어 동시에 한다고 알려요.", "and waiting", "지금 그녀가 압박을 유지하며 도움을 요청하고 있어요.", "아까 압박을 유지하며 도움을 요청했어요.", "holding", "measuring", "timing", "recording"]
  - ["감염 징후", faceWorried, "'looks red and warm'은 눈으로 보고 하는 판단이에요. 'can mean'은 가능성이라 확진이 아니라는 뜻이에요.", "cold and pale", "부위가 붉고 차갑게 보이면 감염일 수 있어요.", "부위가 붉고 따뜻해 보이면 탈수일 수 있어요.", "red", "pale", "dry", "clean"]
  - ["재시작 기준", check, "'Once'는 조건이 이루어진 뒤라는 뜻이에요. 'before we restart'는 재개 전에 반드시 다시 본다는 순서를 못 박아요.", "after we restart", "열이 멎으면 재시작 전에 다시 평가해요.", "출혈이 멎으면 퇴원 전에 다시 평가해요.", "reassess", "rewrite", "rearrange", "rename"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 카테터 출혈 대응 4문장 순서
    why: 출혈을 알리고, 압박하며 도움을 부른 뒤, 그동안 감염 징후를 평가하고, 출혈이 멎으면 재시작 전 평가를 해요.
    lines:
    - ["The dialysis catheter site is bleeding heavily.", siren, "투석 카테터 부위에서 출혈이 심해요", "상황"]
    - ["I'm holding pressure now and calling for help.", pager, "지금 압박을 유지하며 도움을 요청하고 있어요", "조치"]
    - ["While I hold it, let's assess the site for infection signs, since red and warm can mean infection.", magnify, "누르는 동안 감염 징후를 평가합시다, 붉고 따뜻하면 감염일 수 있어요", "평가"]
    - ["Once bleeding stops, we reassess before we restart.", check, "출혈이 멎으면 재시작 전에 다시 평가해요", "재시작"]
- title: 신대체 지속 여부 목표 논의
  s:
  - ["공감 표현", faceWorried, "'how hard it is'는 상대의 감정을 알아준다는 표현이에요. 'this long'은 오랜 시간이 이어졌다는 점을 짚어요.", "in the hospital", "이렇게 오래 그가 병원에 있는 걸 보는 게 얼마나 힘든지 이해해요.", "이렇게 오래 그가 기계에 있는 걸 기다리는 게 얼마나 힘든지 이해해요.", "machine", "bed", "monitor", "ventilator"]
  - ["회복 전망", compass, "'might'는 확정이 아니라 가능성이라는 정직한 단서예요. 'realistically'는 막연한 희망이 아니라 현실적인 그림을 준다는 뜻이에요.", "can describe the cost", "팀이 퇴원이 현실적으로 어떤 모습일지 알려드릴 수 있어요.", "팀이 회복이 현실적으로 얼마나 걸릴지 알려드릴 수 있어요.", "recovery", "dialysis", "visiting", "discharge"]
  - ["목표 논의", handshake2, "'what he would want'는 환자의 뜻을 중심에 둔다는 표현이에요. 'together'는 일방적인 통보가 아니라 함께 정한다는 뜻이에요.", "for him", "그가 무엇을 좋아했을지 이야기하고 함께 목표를 정합시다.", "그가 무엇을 원할지 이야기하고 함께 일정을 정합시다.", "goals", "menus", "rules", "dates"]
  - ["불확실성 인정", shield, "'no easy answer'는 쉬운 해답이 없다고 인정해 거짓 확신을 피해요. 'every family … differently'는 느끼는 방식이 달라도 괜찮다는 뜻이에요.", "for everyone", "쉬운 답은 없고, 의사마다 이걸 다르게 느껴요.", "쉬운 답은 없고, 가족마다 이걸 다르게 설명해요.", "answer", "rule", "map", "sign"]
  - ["솔직함 약속", handshake2, "'keep being'은 앞으로도 계속한다는 약속의 틀이에요. 'as things change'는 좋은 소식이든 나쁜 소식이든 이어 말한다는 뜻이에요.", "in writing", "상황이 바뀌어도 계속 정중하게 말씀드릴게요.", "상황이 바뀌어도 계속 서면으로 말씀드릴게요.", "things", "days", "tests", "visits"]
  - ["지지 약속", shield, "'Whatever you decide'는 어떤 결정도 존중한다는 뜻이에요. 'you and him'은 환자뿐 아니라 가족도 돌본다는 말이에요.", "and judge you", "무엇을 결정하시든 저희가 두 분을 안내할게요.", "무엇을 결정하시든 저희가 두 분을 기다릴게요.", "support", "teach", "thank", "visit"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신대체 목표 논의 4문장 순서
    why: 가족의 마음을 먼저 알아주고, 회복의 현실적인 그림을 나눈 뒤, 함께 목표를 정하고, 어떤 결정도 지지한다고 말해요.
    lines:
    - ["We understand how hard it is to see him on the machine this long.", faceWorried, "이렇게 오래 그가 기계에 있는 걸 보는 게 얼마나 힘든지 이해해요", "공감"]
    - ["That's why the team can share what recovery might realistically look like.", compass, "그래서 팀이 회복이 현실적으로 어떤 모습일지 알려드릴 수 있어요", "전망"]
    - ["With that in mind, let's talk about what he would want and set goals together.", handshake2, "그걸 바탕으로 그가 무엇을 원할지 이야기하고 함께 목표를 정합시다", "목표"]
    - ["Whatever you decide after that, we'll support you and him.", shield, "그 뒤 무엇을 결정하시든 저희가 두 분을 지지할게요", "지지"]
