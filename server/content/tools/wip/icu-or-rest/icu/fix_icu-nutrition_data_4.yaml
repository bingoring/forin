# order 수정(A가 문장을 바꾼 곳 + why). 줄 번호 1~4. B vals의 ORDER는 별도로 먼저 적용된다.
lines:
  - {sit: 13, line: 3, en: "Interventional radiology will place the tube under fluoroscopy.", ko: "영상의학과가 투시 영상을 보며 그 관을 넣어줄 거예요"}
  - {sit: 16, line: 2, en: "I'm worried this could be dead bowel, and surgery needs to see her now.", ko: "장이 괴사된 것일까 봐 걱정돼서 수술팀이 지금 바로 봐야 해요"}
  - {sit: 16, line: 3, ko: "그래서 급식을 모두 중단하고 지금 바로 소생 처치를 시작해요"}
  - {sit: 16, line: 4, ko: "그 소생 처치를 하는 동안 응급 평가를 위해 수술팀을 불러요"}
  - {sit: 9, line: 1, ko: "지금 방광압 측정 장치를 설치하고 잴게요"}
why:
  2: "규칙을 먼저 말하고, 확인 수단인 엑스레이를 밝힌 뒤, 확인될 때까지 급식이 보류된다고 알리고, 그 보류를 풀기 전에 위치를 기록한다고 마무리해요."
  7: "오래 못 먹은 사정을 먼저 말하고, 그래서 천천히 늘린다고 계획을 말한 뒤, 전해질 감시를 알리고, 그 수치가 떨어지면 리듬이 바뀔 수 있다며 심장 감시를 설명해요."
  9: "측정을 먼저 알리고, 그 값을 이전 값과 비교한 뒤, 비교 결과를 의사에게 보고하고, 그 보고 뒤에 값과 시간을 기록해요."
  13: "계속 흡인되는 문제를 먼저 말하고, 해결책인 유문후 관을 소개한 뒤, 영상의학과가 투시 영상을 보며 관을 넣고, 엑스레이로 위치를 확인하는 순서예요."
  15: "위험한 압력 수치를 먼저 보고하고, 장기 영향과 함께 수술팀을 부르고, 수술팀이 10분 거리에 있다고 알린 뒤, 그 10분 동안 진정과 수액 상태를 살피는 것으로 마무리해요."
  16: "위독한 소견을 먼저 말하고, 장 괴사가 걱정된다고 전한 뒤, 그에 따라 급식을 멈추고 소생 처치를 시작하고, 그 처치를 하는 동안 수술팀을 부르는 순서예요."
  18: "높은 혈당을 먼저 말하고, 인슐린으로 대응하고, 그 인슐린이 이미 벗어난 칼륨·인산염을 더 떨어뜨릴 수 있다고 짚은 뒤, 모두를 다시 확인하고 의사에게 연락해요."
  19: "수치가 바닥을 쳤다는 소견을 먼저 말하고, 진단을 전한 뒤, 그에 따라 급식 속도를 줄이고, 속도를 줄인 동안 전해질을 보충해요."
sentence_why:
  "1.3": "every four hours로 간격을 말하고 per protocol로 그 간격이 개인 판단이 아니라 병원 규정이라는 근거를 붙여요. 간격은 병원마다 달라서, 요즘은 위잔여량을 일상적으로 재지 않는 곳도 있어요."
