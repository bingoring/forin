    why_append: " 요즘 미국 ICU는 위잔여량을 일상적으로 재지 않는 곳도 있어, 잴지와 간격은 병원 프로토콜을 따라요."
"14.context":
  set:
    why_replace: ["몸이 산소를 잘 받는지 보는 검사 수치가 높아서 배를 자세히 본다고", "혈액검사 수치 하나가 원하는 것보다 높아서 배를 자세히 본다고"]
