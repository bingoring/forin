  nuance:
  - kind: slider
    words:
    - w-duration
    - w-last
    cue: 'Colleague: "The shaking has gone on for over five minutes and he still isn''t responding."'
    scale:
    - wait a while to see if it stops by itself
    - call for help and ready the ordered drug
    - give any drug you can find on the cart
    answerAt: 1
    why: 5분 넘게 이어지는 발작은 저절로 멈추길 기다리지 않고 지속 상태로 봐요. 바로 도움을 부르고 처방·프로토콜대로 1차 약(벤조디아제핀)을 준비해요. 처방 없이 아무 약이나 주지는 않아요.
    example: It has lasted over five minutes, so I'm calling for help and getting the ordered drug ready.
    exKo: 5분 넘게 이어져서, 도움을 부르고 처방된 약을 준비하고 있어요.
  - kind: context
    words:
    - w-note
    word: note
    ko: 기록하다
    scenes:
    - who: 차트 기록
      icon: board
      en: 'Noted: seizure onset 14:32, generalized shaking, no response.'
      ok: true
    - who: 동료 간호사
      icon: monitor
      en: Can you note the start time while I watch his breathing?
      ok: true
    - who: 가족에게
      icon: me
      en: Seizure onset noted at 14:32 with generalized tonic-clonic activity.
      ok: false
      fix: I'm noting when it started so the team knows how long it lasts.
    why: 의료진끼리는 시각과 양상을 짧고 정확한 기록 용어로 주고받아요. 가족에게는 tonic-clonic 같은 말이 낯설어서, 무엇을 왜 적는지를 쉬운 말로 알려 줘요.
