  - ["경보 이해", bell, "'Most … not'은 대부분의 경우를 알려 줘서 과하게 놀라지 않게 해요. 'an emergency'는 경보 소리가 곧 응급은 아니라는 뜻이에요.", "an accident", "알람 대부분은 압력 문제이지 오류가 아니에요.", "알람 대부분은 온도 문제이지 응급이 아니에요.", "pressure", "power", "battery", "volume"]
