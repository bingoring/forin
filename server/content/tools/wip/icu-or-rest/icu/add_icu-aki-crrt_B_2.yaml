  - ["위험 강조", faceWorried, "'Even a small'은 작은 변화도 위험하다는 점을 강조해요. 'right now'는 이 환자의 현재 상태가 특히 불안정하다는 뜻이에요.", "a few days", "지금은 적은 용량 변화도 맥박을 떨어뜨릴 수 있어요.", "지금은 적은 용량 변화도 체온을 떨어뜨릴 수 있어요.", "shift", "bag", "sample", "label"]
  - ["진행 방식", compass, "'go slowly'와 'reassess'를 이어 말하면 한 걸음 가고 다시 본다는 방식이 들려요. 'every small change'는 재평가 기준이 작은 변화까지라는 뜻이에요.", "after a big change", "조용히 진행하면서 작은 변화마다 재평가할 거예요.", "천천히 진행하면서 작은 변화 전에 재평가할 거예요.", "slowly", "quietly", "calmly", "gently"]
  - ["재개 기준", chartup, "'If he stays stable'은 재개의 조건이 안정 유지라는 점을 분명히 해요. 'can'은 허락이 아니라 가능성을 말해요.", "tomorrow", "안정을 유지하면 아침에 순 제거를 재개할 수 있어요.", "안정을 유지하면 이번 주에 순 제거를 재개할 수 있어요.", "resume", "review", "report", "record"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저혈압 CRRT 관리 4문장 순서
    why: 제거를 줄이는 이유를 말하고, 작은 변화마다 재평가하며 진행하고, 더 떨어지면 멈추고, 안정이 유지되면 재개해요.
    lines:
    - ["His pressure is fragile, so we'll minimize fluid removal for now.", chartup, "혈압이 위태로워서 지금은 체액 제거를 최소화할 거예요", "방침"]
    - ["We'll go slowly and reassess after every small change.", compass, "천천히 진행하면서 작은 변화마다 재평가할 거예요", "진행"]
    - ["If it still drops further after any of those changes, we may pause net removal.", pager, "그 변화 뒤에도 더 떨어지면 순 제거를 멈출 수도 있어요", "중단"]
    - ["If he stays stable through all of that, we can resume net removal later.", chartup, "그 모두를 거쳐 안정을 유지하면 나중에 순 제거를 재개할 수 있어요", "재개"]
- title: 간헐 투석과 방식 비교 판단
  s:
  - ["지속 투석", gear, "'when'절로 어떤 상황에서 유리한지 조건을 달아 줘요. 'gentler'는 혈압에 덜 부담된다는 뜻이에요.", "than a transfusion", "열이 심할 때는 지속 투석이 더 부드러워요.", "맥박이 불안정할 때는 지속 투석이 더 부드러워요.", "gentler", "cheaper", "louder", "shorter"]
  - ["일반 투석", gear, "'faster but harder'처럼 장점과 단점을 'but'으로 이으면 공정하게 들려요. 'critically ill'은 위중한 상태를 뜻하는 임상 표현이에요.", "than the clock", "일반 투석은 더 싸지만 위중한 환자에게는 더 힘들어요.", "일반 투석은 더 빠르지만 어린 환자에게는 더 힘들어요.", "faster", "cheaper", "quieter", "older"]
  - ["선택 이유", handshake2, "'chose'는 팀이 판단해서 정했다는 뜻이라 가족이 이유를 물을 수 있게 해요. 'right now'는 지금 상태에 맞춘 선택이라는 단서예요.", "for the family", "팀은 지금 그를 더 편안하게 지지하려고 CRRT를 선택했어요.", "팀은 어제 그를 더 안전하게 지지하려고 CRRT를 선택했어요.", "safely", "quickly", "cheaply", "quietly"]
  - ["공통점", gear, "'Both … the same'은 두 방식의 차이만 강조하다 생기는 오해를 막아요. 'clean the blood'와 'remove fluid'가 기본 역할 둘이에요.", "different", "둘 다 혈액을 깨끗이 하고 체액을 공급하는 같은 기본 역할을 해요.", "둘 다 혈액을 데우고 체액을 제거하는 같은 기본 역할을 해요.", "basic", "special", "secret", "extra"]
  - ["심장 부담", shield, "'easier on'은 어느 장기에 덜 부담인지 말하는 표현이에요. 'unstable'은 심장이 급한 변화를 견디기 어려운 상태예요.", "than the pump", "지속 치료가 불안정한 폐에는 더 쉬워요.", "지속 치료가 불안정한 신장에는 더 쉬워요.", "easier", "costlier", "noisier", "longer"]
  - ["전환 가능성", compass, "'Once'는 조건이 갖춰지면이라는 뜻이라 지금 약속하는 것이 아니라는 단서예요. 'talk about'은 결정이 아니라 논의라는 뜻이에요.", "right away", "더 안정되면 나중에 퇴원을 이야기할 수 있어요.", "더 깨어나면 나중에 방식 전환을 이야기할 수 있어요.", "switching", "leaving", "visiting", "fasting"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 투석 방식 비교 설명 4문장 순서
    why: 공통점으로 시작해 일반 투석의 장단점을 말하고, 그래서 지금 CRRT를 택했다고 한 뒤, 나중의 전환 가능성을 열어 둬요.
    lines:
    - ["Both treatments do the same basic job: clean the blood and remove fluid.", gear, "두 치료는 혈액을 깨끗이 하고 체액을 제거하는 같은 기본 역할을 해요", "공통점"]
    - ["Regular dialysis is faster but harder on a critically ill patient.", gear, "일반 투석은 더 빠르지만 위중한 환자에게는 더 힘들어요", "비교"]
    - ["That's why the team chose CRRT for him right now.", handshake2, "그래서 팀이 지금 그에게 CRRT를 선택했어요", "선택"]
    - ["Once he's more stable, we can talk about switching later.", compass, "더 안정되면 나중에 전환을 이야기할 수 있어요", "전환"]
- title: 약물 투석 청소 고려
  s:
  - ["약물 제거", pill, "'can'은 모든 경우가 아니라 가능성을 말해요. 'including'으로 예를 들면 항생제가 특히 중요하다는 점이 전해져요.", "from the filter", "CRRT는 특정 항생제를 포함한 일부 약물을 전달할 수 있어요.", "CRRT는 특정 항생제를 포함한 일부 약물을 알아낼 수 있어요.", "remove", "deliver", "create", "store"]
  - ["용량 확인", check, "'for a patient on'은 환자의 치료 상태가 용량 기준이라는 뜻이에요. 'renal dosing'은 신장 기능에 맞춘 약 용량이에요.", "for a visitor", "지속 투석 중인 환자의 영양 용량을 확인합시다.", "회복 중인 환자의 신장 용량을 확인합시다.", "renal", "dental", "vision", "hair"]
  - ["시점 조정", calendar, "'so'가 조정의 목적을 이어 줘요. 'effective'는 약이 필요한 농도를 유지한다는 뜻이에요.", "so levels stay safe", "수치가 오래 유지되도록 시점을 조정할 거예요.", "수치가 효과적으로 유지되도록 순서를 조정할 거예요.", "timing", "labels", "colors", "names"]
  - ["항생제 용량", pill, "'wash out'은 약이 필터로 씻겨 나간다는 쉬운 표현이에요. 'differently'는 더 주거나 시점을 바꾼다는 뜻을 열어 둬요.", "in the sink", "일부 비타민은 CRRT에서 빨리 빠져나가서 다르게 용량을 줘요.", "일부 진통제는 CRRT에서 빨리 빠져나가서 다르게 용량을 줘요.", "antibiotics", "vitamins", "vaccines", "painkillers"]
  - ["약국 확인", handshake2, "'before the next dose'로 시점을 못 박아 투약 전에 확인한다는 약속이 돼요. 'with pharmacy'는 확인할 상대를 분명히 해요.", "after the dose", "첫 용량 전에 약국과 확인할게요.", "마지막 용량 전에 약국과 확인할게요.", "next", "last", "first", "only"]
  - ["시점 기준", calendar, "'not … alone'은 시계 시간만으로는 부족하다는 대비를 만들어요. CRRT가 약을 빼내는 속도에 시점을 맞춘다는 뜻이에요.", "by the meal", "시계만이 아니라 식사 일정에 맞춰 용량 시점을 정해요.", "시계만이 아니라 CRRT 알람에 맞춰 용량 시점을 정해요.", "clock", "calendar", "menu", "weather"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 약물 투석 청소 4문장 순서
    why: 약이 제거될 수 있다고 알리고, 빨리 빠지는 약의 용량 원칙을 말하고, 시점 기준을 정한 뒤, 약국 확인으로 마무리해요.
    lines:
    - ["CRRT can remove some drugs, including certain antibiotics.", pill, "CRRT는 특정 항생제를 포함한 일부 약물을 제거할 수 있어요", "제거"]
    - ["The ones that wash out fast need a different dose.", pill, "빨리 빠져나가는 약은 용량이 달라요", "용량"]
    - ["That means we time the doses around the CRRT schedule, not the clock alone.", calendar, "그래서 시계만이 아니라 CRRT 일정에 맞춰 시점을 정해요", "시점"]
    - ["Even so, I'll check with pharmacy before the next dose.", handshake2, "그래도 다음 용량 전에 약국과 확인할게요", "확인"]
