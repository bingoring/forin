  - ["위험 설명", faceWorried, "'can cause'는 가능성이라 반드시 생긴다는 뜻은 아니에요. 'dangerous'는 칼륨이 낮을 때 심장이 가장 먼저 영향을 받는다는 점을 강조해요.", "a quiet", "낮은 칼륨은 위험한 호흡 리듬을 일으킬 수 있어요.", "낮은 칼륨은 위험한 수면 리듬을 일으킬 수 있어요.", "potassium", "chloride", "iron", "copper"]
