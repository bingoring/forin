  - ["이상 표시", pencil, "'still off'는 이미 한 번 고쳤는데도 벗어난 값을 가리켜요. 'flag'는 눈에 띄게 표시해 팀이 놓치지 않게 한다는 뜻이에요.", "before we replace", "보충하기 전에 벗어난 수치가 있으면 표시할게요.", "보충하는 동안 벗어난 수치가 있으면 표시할게요.", "flag", "fix", "weigh", "bill"]
