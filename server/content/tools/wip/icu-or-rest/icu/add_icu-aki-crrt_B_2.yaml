  - ["다음 단계", gear, "'If … doesn't help'는 앞 단계가 실패했을 때의 다음 단계를 미리 정해 둬요. 'prepare'는 지금 쓰려는 게 아니라 미리 갖춰 둔다는 뜻이에요.", "a new bag", "압력이 계속 오르면 새 회로를 준비해요.", "세척해도 소용없으면 새 카테터를 준비해요.", "circuit", "chart", "bed", "room"]
