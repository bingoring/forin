situations:
- title: NIHSS 신경 사정
  sentences:
  - en: I'm going to check your strength, so please squeeze both of my hands.
    ko: 힘을 확인할 테니 제 두 손을 꽉 쥐어 보세요.
    chunks:
    - I'm going to check
    - your strength
    - ', so please squeeze'
    - both of my hands
    - .
    words:
    - w-check
    - w-strength
    - w-squeeze
    goal: 1
    tag: 근력 사정
    icon: stetho
    why: '''so please''로 이유를 먼저 말하고 요청을 이으면 왜 쥐라는지 알고 따라 해요. ''both''는 양쪽 힘을 견줘 본다는 신호예요.'
    decoy: both of my feet
    distractorsKo:
    - 힘을 확인할 테니 제 두 손가락을 꽉 쥐어 보세요.
    - 힘을 확인할 테니 제 한 손을 꽉 쥐어 보세요.
    blank:
      answer: strength
      options:
      - en: strength
      - en: balance
      - en: vision
      - en: hearing
  - en: Can you tell me where you are and what month it is?
    ko: 여기가 어디인지, 지금 몇 월인지 말씀해 주시겠어요?
    chunks:
    - Can you tell me
    - where you are
    - and what month
    - it is
    - '?'
    words:
    - w-tell
    - w-month
    goal: 1
    tag: 지남력 확인
    icon: calendar
    why: '''where''와 ''what month''를 한 문장에 묶으면 장소와 시기를 한 번에 물어요. ''Can you''는 명령이 아니라 부탁이라 환자가 덜 위축돼요.'
    decoy: and what year
    distractorsKo:
    - 여기가 어디인지, 지금 몇 시인지 말씀해 주시겠어요?
    - 여기가 어디인지, 지금 몇 요일인지 말씀해 주시겠어요?
    blank:
      answer: month
      options:
      - en: month
      - en: minute
      - en: second
      - en: decade
  - en: Follow my finger with just your eyes, please.
    ko: 눈으로만 제 손가락을 따라와 주세요.
    chunks:
    - Follow my finger
    - with just your eyes
    - ', please'
    - .
    words:
    - w-follow
    - w-finger
    - w-eye
    goal: 1
    tag: 눈 따라가기
    icon: magnify
    why: '''just your eyes''로 범위를 정하면 고개를 돌리지 않고 눈만 움직이면 된다는 걸 알아요. ''please''를 끝에 붙이면 지시가 부드러워져요.'
    decoy: my badge
    distractorsKo:
    - 눈으로만 제 손바닥을 따라와 주세요.
    - 고개로만 제 손가락을 따라와 주세요.
    blank:
      answer: eyes
      options:
      - en: eyes
      - en: ears
      - en: lips
      - en: chin
  - en: Take your time, there's no rush to answer.
    ko: 천천히 하셔도 돼요, 서두르지 않으셔도 됩니다.
    chunks:
    - Take your time
    - ', there''s no rush'
    - to answer
    - .
    words:
    - w-rush
    - w-answer
    goal: 1
    tag: 안심시키기
    icon: shield
    why: '''no rush''는 대답이 느려도 괜찮다는 안심을 줘요. 재촉하지 않으면 말이 막힌 환자가 덜 긴장해요.'
    decoy: to explain
    distractorsKo:
    - 천천히 하셔도 돼요, 긴장하지 않으셔도 됩니다.
    - 다시 하셔도 돼요, 서두르지 않으셔도 됩니다.
    blank:
      answer: time
      options:
      - en: time
      - en: seat
      - en: turn
      - en: pill
  - en: It's okay if the word won't come — you can point instead.
    ko: 말이 안 나와도 괜찮아요, 대신 손으로 가리키셔도 돼요.
    chunks:
    - It's okay
    - if the word won't come
    - — you can point
    - instead
    - .
    words:
    - w-word
    - w-point
    goal: 1
    tag: 대체 표현
    icon: speech
    why: '''you can point instead''는 말이 막혀도 다른 방법으로 답할 길을 열어 줘요. ''won''t come''은 환자 잘못이 아니라 단어가 떠오르지 않는 상태라는 뜻이에요.'
    decoy: if you feel tired
    distractorsKo:
    - 말이 안 나와도 괜찮아요, 대신 손으로 쓰셔도 돼요.
    - 이름이 안 나와도 괜찮아요, 대신 손으로 가리키셔도 돼요.
    blank:
      answer: okay
      options:
      - en: okay
      - en: rude
      - en: wrong
      - en: silly
  - en: I'll stand on your right side so you can see me.
    ko: 제가 보이시도록 오른쪽에 서 있을게요.
    chunks:
    - I'll stand
    - on your right side
    - so you can
    - see me
    - .
    words:
    - w-stand
    - w-side
    goal: 1
    tag: 위치 안내
    icon: me
    why: '''so you can see me''는 서는 위치의 목적을 말해요. 시야 한쪽이 비는 환자는 보이는 쪽에 서야 해서 어느 쪽인지 함께 알려요.'
    decoy: at the foot of the bed
    distractorsKo:
    - 제가 보이시도록 왼쪽에 서 있을게요.
    - 제가 보이시도록 문 쪽에 서 있을게요.
    blank:
      answer: side
      options:
      - en: side
      - en: arm
      - en: foot
      - en: shoulder
  nuance:
  - kind: slider
    words:
    - w-strength
    cue: His left arm lifts off the bed, but he can't push back against the nurse's hand.
    scale:
    - normal strength
    - reduced strength
    - no strength
    answerAt: 1
    why: 들어 올릴 수는 있어도 저항을 이기지 못하면 힘이 줄어든 상태예요. NIHSS 운동 항목은 중력을 이기는지, 저항에 버티는지를 보므로 본 대로 구체적으로 기록하고, 전보다 약해졌다면 바로 팀에 알려요.
    example: His strength is reduced on the left.
    exKo: 왼쪽 힘이 떨어져 있어요.
  - kind: context
    words:
    - w-point
    word: point
    ko: 가리키다
    scenes:
    - who: 침상 옆에서
      icon: me
      en: It's okay if the word won't come — you can point instead.
      ok: true
    - who: 차트 기록
      icon: board
      en: Unable to name objects, but able to point to each one correctly.
      ok: true
    - who: 환자에게
      icon: me
      en: Please point to the object so we can document your expressive aphasia.
      ok: false
      fix: If the word won't come, just point to what you mean.
    why: 의료진끼리는 aphasia 같은 용어가 정확하고 빨라요. 말이 막혀 불안한 환자에게는 같은 point를 용어 없이, 부담 주지 않는 말로 건네세요.
  - kind: swap
    words:
    - w-rush
    who: 환자에게 · 사정 안내
    icon: me
    before:
    - 'Take your time, '
    - answer as fast as you can
    - .
    options:
    - there's no rush to answer
    - answer as fast as you can
    - please respond at your earliest convenience
    answer: there's no rush to answer
    notes:
      there's no rush to answer: 서두르지 않아도 된다고 분명히 알려 줘서 긴장을 풀어 줘요.
      answer as fast as you can: 앞의 'Take your time'과 부딪히고, 말이 막힌 환자를 더 조급하게 해요.
      please respond at your earliest convenience: 격식 차린 업무 문구라 침상에서는 어색하게 들려요.
    why: 말이 잘 안 나오는 환자는 조급해지기 쉬워서, 답할 시간이 충분하다고 직접 말해 주는 것이 사정에도 도움이 돼요.
    ko: 천천히 하셔도 돼요, 서두르지 않으셔도 돼요
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신경 사정 안내 4문장 순서
    why: 근력 요청으로 시작해 앞 답을 받아 장소·시기 질문으로 넘어가고, 그 답을 받아 눈 추적을 요청한 뒤, 세 가지를 모두 마친 환자에게 감사해요.
    lines:
    - en: I'm going to check your strength, so please squeeze both of my hands.
      icon: stetho
      ko: 힘을 확인할 테니 제 두 손을 꽉 쥐어 보세요
      note: 근력
    - en: Nice and firm. Now tell me what month it is.
      icon: calendar
      ko: 좋아요 단단하네요 이제 지금 몇 월인지 말해 주세요
      note: 지남력
    - en: Good, that's right. Now follow my finger with just your eyes.
      icon: magnify
      ko: 좋아요 맞아요 이제 눈으로만 제 손가락을 따라와 주세요
      note: 눈 추적
    - en: Thank you for doing all three of those with me.
      icon: star
      ko: 세 가지를 모두 함께 해 주셔서 감사해요
      note: 감사
