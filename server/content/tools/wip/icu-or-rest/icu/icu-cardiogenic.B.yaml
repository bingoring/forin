situations:
- title: 심인성 쇼크 초기 사정
  sentences:
  - en: I'm checking your breathing, blood pressure, and circulation.
    ko: 숨쉬는 것, 혈압, 순환을 확인하고 있어요.
    chunks:
    - I'm checking
    - your breathing
    - ', blood pressure'
    - ', and circulation'
    - .
    words:
    - w-check
    - w-breathing
    - w-blood
    - w-pressure
    - w-circulation
    goal: 1
    tag: 사정 안내
    icon: stetho
    why: 지금 하는 일을 소리 내어 말하면 불안한 환자가 상황을 따라올 수 있어요. 호흡·혈압·순환은 쇼크 사정의 기본 세 축이에요.
    decoy: your temperature
    distractorsKo:
    - 숨쉬는 것, 혈압, 의식을 확인하고 있어요.
    - 숨쉬는 것, 피부, 순환을 확인하고 있어요.
    blank:
      answer: circulation
      options:
      - en: circulation
      - en: hearing
      - en: vision
      - en: swallowing
  - en: Your blood pressure is a little low right now.
    ko: 지금 혈압이 조금 낮아요.
    chunks:
    - Your blood pressure
    - is a little low
    - right
    - now
    - .
    words:
    - w-blood
    - w-pressure
    - w-low
    - w-now
    goal: 1
    tag: 상태 설명
    icon: chartup
    why: 수치를 숨기지 않고 'a little low'로 정도를 함께 전하면 사실을 알리면서도 환자가 놀라지 않게 해요.
    decoy: this morning
    distractorsKo:
    - 지금 심박이 조금 빨라요.
    - 지금 산소가 조금 낮아요.
    blank:
      answer: pressure
      options:
      - en: pressure
      - en: sugar
      - en: count
      - en: flow
  - en: I can hear some fluid in your lungs, so we'll help with that.
    ko: 폐에 물이 조금 찬 소리가 들려서, 저희가 도와드릴게요.
    chunks:
    - I can hear
    - some fluid in your lungs
    - ', so we''ll help'
    - with that
    - .
    words:
    - w-hear
    - w-fluid
    - w-lung
    - w-help
    goal: 1
    tag: 소견 설명
    icon: stetho
    why: '''hear''로 직접 들은 소견임을 밝히고 ''we''ll help''를 바로 붙여, 나쁜 소견을 알리면서 곧 도움이 간다는 점을 전해요.'
    decoy: some noise in your chest
    distractorsKo:
    - 배에 물이 조금 찬 소리가 들려서, 저희가 도와드릴게요.
    - 폐에 물이 조금 찬 소리가 들려서, 저희가 알려드릴게요.
    blank:
      answer: fluid
      options:
      - en: fluid
      - en: air
      - en: dust
      - en: smoke
  - en: I'm listening to your heart and lungs closely.
    ko: 심장과 폐 소리를 자세히 들어볼게요.
    chunks:
    - I'm listening
    - to your heart
    - and lungs
    - closely
    - .
    words:
    - w-listen
    - w-heart
    - w-lung
    - w-closely
    goal: 1
    tag: 청진 안내
    icon: stetho
    why: '''closely''를 문장 끝에 붙여 서두르지 않고 꼼꼼히 듣는다는 인상을 줘요. 청진 전에 하는 말은 환자의 긴장을 풀어 줘요.'
    decoy: to your back
    distractorsKo:
    - 배와 폐 소리를 자세히 들어볼게요.
    - 심장과 등 소리를 자세히 들어볼게요.
    blank:
      answer: closely
      options:
      - en: closely
      - en: quickly
      - en: casually
      - en: lightly
  - en: Squeeze my hand if you can hear me.
    ko: 제 목소리 들리시면 제 손을 꽉 쥐어보세요.
    chunks:
    - Squeeze my hand
    - if you can
    - hear me
    - .
    words:
    - w-squeeze
    - w-hand
    - w-hear
    goal: 1
    tag: 의식 확인
    icon: me
    why: 말 대신 손을 쥐게 하면 말을 못 하는 환자도 반응할 수 있어요. 'if you can hear me'는 그 반응을 의식 확인으로 연결해요.
    decoy: Lift your hand
    distractorsKo:
    - 제 목소리 들리시면 제 눈을 보세요.
    - 제 목소리 들리시면 제 발을 꽉 쥐어보세요.
    blank:
      answer: Squeeze
      options:
      - en: Squeeze
      - en: Release
      - en: Shake
      - en: Pat
  - en: I'm right here and I'll keep the team updated.
    ko: 제가 바로 여기 있고, 팀에 계속 알릴게요.
    chunks:
    - I'm right here
    - and I'll keep
    - the team
    - updated
    - .
    words:
    - w-right
    - w-here
    - w-keep
    - w-team
    - w-update
    goal: 2
    tag: 곁에서 안심
    icon: shield
    why: '''I''m right here''는 곁에 있겠다는 약속이고, 팀 소식을 계속 전하겠다는 말이 더해져 혼자가 아니라는 안심을 줘요.'
    decoy: your family
    distractorsKo:
    - 제가 바로 문 앞에 있고, 팀에 계속 알릴게요.
    - 제가 바로 여기 있고, 팀과 계속 의논할게요.
    blank:
      answer: updated
      options:
      - en: updated
      - en: busy
      - en: quiet
      - en: away
  - en: I'm reporting these changes to the doctor now.
    ko: 이 변화들을 지금 의사에게 보고할게요.
    chunks:
    - I'm reporting
    - these changes
    - to the doctor
    - now
    - .
    words:
    - w-report
    - w-change
    - w-doctor
    - w-now
    goal: 2
    tag: 보고
    icon: speech
    why: '''now''를 붙여 미루지 않고 바로 보고한다는 뜻을 전해요. 변화(changes)를 구체적으로 짚으면 무엇을 알리는지 분명해져요.'
    decoy: to the supervisor
    distractorsKo:
    - 이 서류들을 지금 의사에게 보고할게요.
    - 이 소리들을 지금 의사에게 보고할게요.
    blank:
      answer: changes
      options:
      - en: changes
      - en: sheets
      - en: curtains
      - en: lights
  order:
    tag: 대화 흐름
    icon: compass
    ko: 초기 사정과 보고 4문장 순서
    why: 확인한 일을 먼저 말하고, 나온 소견을 알린 뒤, 의사에게 보고한다고 전해요. 마지막에 의사가 정할 다음 단계를 말해 환자의 불안을 덜어요.
    lines:
    - en: I'm checking your breathing, blood pressure, and circulation.
      icon: stetho
      ko: 호흡, 혈압, 순환을 확인하고 있어요
      note: 확인
    - en: Your blood pressure is a little low right now.
      icon: chartup
      ko: 지금 혈압이 조금 낮아요
      note: 소견
    - en: I'm reporting that low pressure to the doctor now.
      icon: speech
      ko: 그 낮은 혈압을 지금 의사에게 보고할게요
      note: 보고
    - en: He'll tell us what to do next, and I'll keep you updated.
      icon: shield
      ko: 다음 할 일은 의사가 알려 줄 거고 계속 알려드릴게요
      note: 안심
- title: 강심제 주입 준비
  sentences:
  - en: I'll confirm the dobutamine concentration against the order.
    ko: 도부타민 농도를 처방과 대조해서 확인할게요.
    chunks:
    - I'll confirm
    - the dobutamine concentration
    - against the order
    - .
    words:
    - w-confirm
    - w-dobutamine
    - w-concentration
    - w-order
    goal: 1
    tag: 농도 확인
    icon: pill
    why: '''against the order''로 기준이 처방임을 밝혀요. 고위험 약은 처방 기준으로 농도를 맞춰 보는 것이 안전 절차예요.'
    decoy: against the chart
    distractorsKo:
    - 도부타민 속도를 처방과 대조해서 확인할게요.
    - 도부타민 이름을 처방과 대조해서 확인할게요.
    blank:
      answer: concentration
      options:
      - en: concentration
      - en: expiration
      - en: packaging
      - en: supplier
  - en: The bag is labeled and double-checked with another nurse.
    ko: 수액백에 라벨을 붙이고 다른 간호사와 함께 재확인했어요.
    chunks:
    - The bag
    - is labeled
    - and double-checked
    - with another nurse
    - .
    words:
    - w-bag
    - w-label
    - w-doublecheck
    - w-nurse
    goal: 1
    tag: 이중 확인
    icon: check
    why: 수동태로 쓰면 누가 했는지보다 '라벨 부착과 이중 확인이 끝났다'는 결과가 앞에 와요. 고위험 약은 다른 간호사와 독립적으로 재확인하는 것이 기본이에요.
    decoy: by the pharmacy
    distractorsKo:
    - 수액 라인에 라벨을 붙이고 다른 간호사와 함께 재확인했어요.
    - 수액백에 날짜를 적고 다른 간호사와 함께 재확인했어요.
    blank:
      answer: labeled
      options:
      - en: labeled
      - en: weighed
      - en: shaken
      - en: cooled
  - en: He needs continuous cardiac and blood pressure monitoring.
    ko: 지속적인 심장·혈압 모니터링이 필요해요.
    chunks:
    - He needs
    - continuous cardiac
    - and blood pressure
    - monitoring
    - .
    words:
    - w-need
    - w-continuous
    - w-cardiac
    - w-blood
    - w-pressure
    goal: 2
    tag: 모니터 필요
    icon: monitor
    why: '''continuous''로 간격을 두고 재는 것이 아니라 계속 본다는 점을 분명히 해요. 강심제는 심박과 혈압에 바로 영향을 주기 때문이에요.'
    decoy: respiratory
    distractorsKo:
    - 지속적인 심장·산소 모니터링이 필요해요.
    - 지속적인 심장·체온 모니터링이 필요해요.
    blank:
      answer: needs
      options:
      - en: needs
      - en: wants
      - en: likes
      - en: fears
  - en: I'm putting him on the monitor before we start the drip.
    ko: 주입을 시작하기 전에 모니터부터 연결할게요.
    chunks:
    - I'm putting him
    - on the monitor
    - before we start
    - the drip
    - .
    words:
    - w-put
    - w-monitor
    - w-start
    - w-drip
    goal: 2
    tag: 순서 안내
    icon: monitor
    why: '''before we start''로 모니터 연결이 주입보다 먼저임을 못 박아요. 반응을 바로 볼 수 있어야 안전하게 시작할 수 있어요.'
    decoy: on oxygen
    distractorsKo:
    - 검사를 시작하기 전에 모니터부터 연결할게요.
    - 채혈을 시작하기 전에 모니터부터 연결할게요.
    blank:
      answer: monitor
      options:
      - en: monitor
      - en: scale
      - en: stretcher
      - en: commode
  - en: I'll start low and titrate to his response.
    ko: 낮은 용량부터 시작해서 반응을 보며 조절할게요.
    chunks:
    - I'll start low
    - and titrate
    - to his response
    - .
    words:
    - w-start
    - w-low
    - w-titrate
    - w-response
    goal: 2
    tag: 용량 원칙
    icon: gear
    why: '''start low and titrate''는 낮게 시작해 반응에 따라 올린다는 표준 표현이에요. 강심제는 반응을 보며 용량을 맞추는 약이에요.'
    decoy: to his weight
    distractorsKo:
    - 낮은 용량부터 시작해서 체중을 보며 조절할게요.
    - 낮은 용량부터 시작해서 식사를 보며 조절할게요.
    blank:
      answer: response
      options:
      - en: response
      - en: schedule
      - en: weekend
      - en: appetite
  - en: I'll watch his heart rate closely once it's running.
    ko: 주입이 시작되면 심박수를 자세히 지켜볼게요.
    chunks:
    - I'll watch
    - his heart rate
    - closely
    - once it's running
    - .
    words:
    - w-watch
    - w-heart
    - w-rate
    - w-closely
    - w-run
    goal: 2
    tag: 주입 중 관찰
    icon: magnify
    why: '''once it''s running''으로 관찰이 주입이 돌아가는 때부터 이어진다고 알려요. 강심제는 심박수를 올릴 수 있어 시작 직후 변화를 놓치면 안 돼요.'
    decoy: his temperature
    distractorsKo:
    - 주입이 시작되면 체온을 자세히 지켜볼게요.
    - 주입이 시작되면 소변량을 자세히 지켜볼게요.
    blank:
      answer: running
      options:
      - en: running
      - en: empty
      - en: labeled
      - en: unplugged
  order:
    tag: 대화 흐름
    icon: pill
    ko: 강심제 주입 준비 4문장 순서
    why: 처방과 농도를 먼저 맞추고, 라벨과 이중 확인을 마친 뒤, 모니터를 연결하고 나서 낮은 용량으로 시작해요. 확인이 끝나기 전에는 주입하지 않아요.
    lines:
    - en: I'll confirm the dobutamine concentration against the order.
      icon: pill
      ko: 도부타민 농도를 처방과 대조해서 확인할게요
      note: 농도 확인
    - en: The bag with that concentration is labeled and double-checked with another nurse.
      icon: check
      ko: 그 농도의 수액백은 라벨을 붙이고 다른 간호사와 재확인해요
      note: 이중 확인
    - en: With that done, I'm putting him on the monitor before we start the drip.
      icon: monitor
      ko: 그게 끝나면 주입 전에 모니터부터 연결할게요
      note: 모니터
    - en: I'll start low and titrate to his response.
      icon: gear
      ko: 낮게 시작해서 반응을 보며 조절할게요
      note: 시작
- title: 12유도 심전도 신속 확보
  sentences:
  - en: I'll get a 12-lead ECG right now.
