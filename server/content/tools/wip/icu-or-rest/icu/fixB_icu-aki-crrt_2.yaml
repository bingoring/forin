"0.5": {d: ["결과가 나오는 대로 추세를 팀에 보고할게요.", "변화가 보이는 대로 검사 일정을 팀에 보고할게요."]}
"2.2": {d: ["손상을 더 아프게 만들 수 있는 약은 피할 거예요.", "손상을 더 나쁘게 만들 수 있는 약은 설명할 거예요."]}
"6.4": {d: ["지금은 소변 배출량이 시간당 100밀리리터예요.", "어제 순 제거량이 시간당 100밀리리터였어요."]}
"7.5": {d: ["산소가 더 떨어지면 제거를 잠시 멈출 거예요.", "땀이 더 줄면 제거를 잠시 멈출 거예요."]}
"9.1": {d: ["시간을 아끼기 위해 프로토콜대로 보충합시다.", "돈을 아끼기 위해 프로토콜대로 보충합시다."]}
"9.4": {d: ["정맥을 소량씩 씻고 자주 재확인해요.", "정맥으로 소량씩 주고 꼼꼼히 재확인해요."]}
"14.3": {d: ["혈액이 기계를 지나며 식어서 그가 졸릴 수 있어요.", "혈액이 기계를 지나며 식어서 그가 배고프게 느낄 수 있어요."]}
"17.2": {d: ["지금 프로토콜대로 속도를 확인하고 칼슘을 줍시다.", "지금 프로토콜대로 시트르산을 줄이고 칼슘 수치를 확인합시다."]}
"18.4": {d: ["이동 중 그를 세워 앉히고 산소를 늘릴게요.", "검사하는 동안 그를 세워 앉히고 산소를 늘릴게요."]}
