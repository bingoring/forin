- title: 기흉·기압손상 동반 위기
  s:
  - [의심 소견, stetho, '''suggest''는 단정하지 않고 의심한다는 뜻이에요. 압력이 높고 호흡음이 한쪽만 다르면 기흉을 먼저 생각해요.', in the lungs, 압력이 높고 양쪽 동공이 다르면 기흉이 의심돼요., 압력이 높고 양쪽 팔 혈압이 다르면 기흉이 의심돼요., unequal, loud, rapid, wet]
  - [처치 준비, siren, '''and''로 두 행동을 이어 말하면 환기 설정을 조정하면서 다음 처치를 준비한다는 뜻이 전해져요. 흉관은 의사가 넣고 간호사는 준비를 맡아요.', with the monitor, 소음을 낮추고 흉관 삽입을 준비할게요., 조명을 낮추고 흉관 삽입을 준비할게요., chest, feeding, nasal, ear]
  - [의사 호출, speech, '''call''과 ''set up''을 and로 이어 연락과 준비를 함께 한다고 말해요. 감압은 의사가 시행하는 처치예요.', to the room, 의사한테 연락하고 조명을 준비할게요., 의사한테 연락하고 장갑을 준비할게요., decompression, documentation, discussion, demonstration]
  - [소견 보고, stetho, '''isn''t moving the same''은 한쪽이 덜 움직인다는 관찰을 짧게 말해요. ''on both sides''로 비교한 범위를 밝혀요.', at the head, 양쪽 눈이 똑같이 움직이지 않아요., 양쪽 다리가 똑같이 움직이지 않아요., chest, arms, legs, eyes]
  - [물품 준비, gear, '''ready''는 바로 쓸 수 있게 준비해 둔다는 뜻이에요. ''at the bedside''로 장소를 밝혀 의사가 오면 바로 시행해요.', for the doctor, 침상 곁에 흡인 트레이를 준비해 둘게요., 침상 곁에 드레싱 트레이를 준비해 둘게요., bedside, doorway, window, corner]
