- title: 난치성 저산소증 ECMO 의뢰
  s:
  - [상태 요약, chartup, '''despite''로 앞선 치료가 효과가 없었다는 점을 한 단어에 담아요. 의뢰 사유를 짧고 분명하게 말해요.', in the unit, 복와위와 최대 환기에도 계속 빈혈이에요., 복와위와 최대 환기에도 계속 열이 나요., hypoxic, anemic, feverish, dizzy]
  - [의뢰 기준, check, '''meets criteria''는 기준을 충족했다는 사실을 짧게 전하고 ''now''로 시점을 알려요.', to the unit, 지금 ECMO 팀에 자문을 구할 기준을 설명해 드려요., 지금 ECMO 팀에 자문을 구할 기준을 적어 둘게요., ECMO, burn, renal, psych]
  - [자료 준비, board, '''for the referral''로 모으는 이유를 밝혀요. 의뢰할 때는 가스 결과, P/F 비율, 환기 설정이 판단 자료예요.', for the doctor, '의뢰를 위해 혈액가스, P/F 비율, 가족 연락처를 모을게요.', '의뢰를 위해 혈액가스, P/F 비율, 보험 정보를 모을게요.', settings, photos, stickers, receipts]
  - [한계 설명, chartup, '''Even at''은 최대 조건에서도라는 뜻이라 더 올릴 여지가 없다는 점을 보여요. ''come up''은 수치가 오른다는 구어 표현이에요.', since morning, FiO2를 100퍼센트로 해도 열이 오르지 않아요., FiO2를 100퍼센트로 해도 혈압이 오르지 않아요., numbers, fevers, moods, weights]
  - [연락 약속, speech, '''and''로 두 행동을 이어 연락과 요약을 함께 하겠다고 말해요. 요약은 의뢰받는 쪽이 경과를 빨리 파악하게 해요.', on the phone, ECMO 코디네이터에게 연락해서 가족 상황을 요약할게요., ECMO 코디네이터에게 연락해서 약 목록을 요약할게요., course, diet, hobbies, birthday]
