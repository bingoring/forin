    why: 소견으로 기흉을 의심하고, 흉부 움직임으로 뒷받침한 뒤, 의사를 부르고 감압을 준비하며, 그에 맞춰 흉관 트레이를 침상 곁에 준비해요.
    lines:
    - [High pressures with unequal breath sounds suggest a pneumothorax., stetho, 압력이 높고 양쪽 호흡음이 다르면 기흉이 의심돼요, 의심]
    - ['That fits, because his chest isn''t moving the same on both sides.', stetho, '맞아요, 양쪽 흉부가 똑같이 움직이지 않으니까요', 근거]
    - [So I'll call the physician and set up for decompression., speech, 그러니 의사한테 연락하고 감압을 준비할게요, 호출]
    - ['For that, I''ll get the chest tube tray ready at the bedside.', gear, 그걸 위해 침상 곁에 흉관 트레이를 준비해 둘게요, 준비]
- title: 복와위 중 안면 압박괴사 위기
  s:
  - [즉시 조치, siren, '''needs…right away''는 필요한 일과 시점을 한 문장에 담아요. 깊어진 압박 손상은 같은 곳이 계속 눌리지 않게 하는 것이 먼저예요.', at the foot, 깊은 베개 자국이라 머리 위치를 바로 바꿔야 해요., 깊은 멍이라 머리 위치를 바로 바꿔야 해요., head, hands, feet, knees]
  - [압박 해소, bandage, '''offload''는 눌리는 힘을 그 부위에서 없앤다는 의료 표현이에요. 패딩을 더하는 것만으로는 부족하고 눌림 자체를 줄여야 해요.', by the door, 바로 담요를 더하고 그 부위 압박을 없애 줄게요., 바로 수건을 더하고 그 부위 압박을 없애 줄게요., padding, soap, gauze, lotion]
  - [자문·기록, pencil, '''and''로 자문과 기록을 이어 말하면 두 일을 함께 한다는 뜻이에요. 단계를 적어 두면 이후 변화를 같은 기준으로 비교할 수 있어요.', for the unit, 상처 관리팀에 자문을 구하고 손상 날짜를 기록할게요., 상처 관리팀에 자문을 구하고 손상 크기를 기록할게요., stage, price, name, owner]
  - [변화 보고, magnify, '''than it looked yesterday''로 비교 기준을 말하면 변화를 객관적으로 전할 수 있어요. ''deeper''는 나빠졌다는 뜻이에요.', at the corner, 이 자국이 어제 봤을 때보다 더 붉어졌어요., 이 자국이 어제 봤을 때보다 더 따뜻해졌어요., deeper, wider, darker, warmer]
  - [체위 일정, calendar, '''from now on''은 지금부터 계속한다는 뜻이에요. 정해진 간격으로 체위를 바꾸면 같은 곳이 오래 눌리지 않아요.', for the night, 이제부터는 한 시간마다 침대를 조정할게요., 이제부터는 한 시간마다 조명을 조정할게요., position, lights, gown, blanket]
