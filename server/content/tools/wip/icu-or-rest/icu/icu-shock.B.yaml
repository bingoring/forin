      - en: vision
  - en: I'll keep a close eye on these signs and update the team.
    ko: 이 징후들을 계속 지켜보고 팀에 알릴게요.
    chunks:
    - I'll keep a close eye
    - on these signs
    - and update
    - the team
    - .
