    - 피부, 의식 수준, 소변량을 확인해서 체중이 어떤지 보고 있어요
    blank:
      answer: alertness
      options:
      - en: alertness
      - en: posture
      - en: hearing
      - en: height
  - en: Your hands feel cool, so I'm looking at your circulation.
    ko: 손이 차가워서 순환 상태를 보고 있어요.
    chunks:
    - Your hands
