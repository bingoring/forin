situations:
- title: 쇼크 초기 관류 사정
  sentences:
  - en: I'm checking your skin, alertness, and urine output to see how your body is doing.
    ko: 피부, 의식 수준, 소변량을 확인해서 몸 상태가 어떤지 보고 있어요.
    chunks:
