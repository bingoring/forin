    - w-keep
    - w-eye
    - w-sign
    - w-update
    - w-team
    goal: 2
    tag: 경과 관찰
    icon: monitor
    why: keep a close eye on은 한 번 보고 끝이 아니라 계속 지켜본다는 관용구예요. update the team을 붙이면 혼자 보는 것이 아니라 변화를 공유한다는 뜻이 돼요.
    decoy: at the window
    distractorsKo:
    - 이 징후들을 계속 지켜보고 가족에게 알릴게요
