situations:
- title: VTE 위험 평가·예방
  sentences:
  - en: Let's assess his VTE risk before we start prevention.
    ko: 예방을 시작하기 전에 그의 VTE 위험을 사정해요.
    chunks:
    - Let's assess
    - his VTE risk
    - before we start
    - prevention
    - .
    words:
    - w-assess
    - w-vte
    - w-risk
    - w-before
    - w-start
    - w-prevention
    goal: 1
    tag: 위험 사정
    icon: magnify
    why: '''before we start''로 시점을 앞에 못 박아, 예방은 위험을 본 뒤에 시작한다는 순서를 알려 줘요. ''Let''s''는 팀이 함께 한다는 신호예요.'
    decoy: his lab results
    distractorsKo:
    - 예방을 시작하기 전에 그녀의 VTE 위험을 사정해요.
    - 운동을 시작하기 전에 그의 VTE 위험을 사정해요.
    blank:
      answer: prevention
      options:
      - en: prevention
      - en: treatment
      - en: diagnosis
      - en: discharge
  - en: He's high risk, so we'll combine mechanical and chemical prophylaxis.
    ko: 고위험군이라 기계적 예방과 약물 예방을 함께 적용할게요.
    chunks:
    - He's high risk
    - ', so we''ll combine'
    - mechanical and chemical
    - prophylaxis
    - .
    words:
    - w-high
    - w-risk
    - w-combine
    - w-mechanical
    - w-chemical
    - w-prophylaxis
    goal: 2
    tag: 병행 예방
    icon: shield
    why: '''so''로 이유와 결정을 잇고 ''combine''으로 두 방법을 함께 쓴다고 밝혀요. 고위험 환자는 한 가지 방법만 쓰지 않는 경우가 많아요.'
    decoy: physical and dietary
    distractorsKo:
    - 수술 직후라 기계적 예방과 약물 예방을 함께 적용할게요.
    - 고령이라 기계적 예방과 약물 예방을 함께 적용할게요.
    blank:
      answer: prophylaxis
      options:
      - en: prophylaxis
      - en: analgesia
      - en: sedation
      - en: hydration
  - en: Sequential compression devices are on and cycling.
    ko: 순차 압박기기가 켜져서 순환 작동 중이에요.
    chunks:
    - Sequential compression devices
    - are on
    - and cycling
    - .
    words:
    - w-sequential
    - w-compression
    - w-device
    - w-on
    - w-cycling
    goal: 2
    tag: 기기 상태
    icon: gear
    why: '''on and cycling''은 켜짐과 실제 작동을 함께 보고해요. 전원만 켜진 것과 돌아가는 것은 달라서 둘 다 말해요.'
    decoy: and charging
    distractorsKo:
    - 순차 압박기기가 켜져서 충전 중이에요.
    - 순차 압박기기가 켜져서 점검 중이에요.
    blank:
      answer: cycling
      options:
      - en: cycling
      - en: charging
      - en: warming
      - en: leaking
  - en: I'll confirm the chemical prophylaxis order and any contraindications.
    ko: 약물 예방 처방과 금기 사항을 확인할게요.
    chunks:
    - I'll confirm
    - the chemical prophylaxis order
    - and any
    - contraindications
    - .
    words:
    - w-confirm
    - w-chemical
    - w-prophylaxis
    - w-order
    - w-contraindication
    goal: 2
    tag: 처방 확인
    icon: pencil
    why: '''and any''로 처방과 금기를 한 문장에 묶으면 둘 다 확인하겠다는 약속이 돼요. 금기는 처방과 함께 봐야 안전해요.'
    decoy: the pharmacy order
    distractorsKo:
    - 기계적 예방 처방과 금기 사항을 확인할게요.
    - 약물 치료 처방과 금기 사항을 확인할게요.
    blank:
      answer: contraindications
      options:
      - en: contraindications
      - en: recommendations
      - en: complications
      - en: interventions
  - en: I don't see any contraindications on his chart.
    ko: 차트에는 금기 사항이 안 보여요.
    chunks:
    - I don't see
    - any contraindications
    - on his chart
    - .
    words:
    - w-see
    - w-contraindication
    - w-chart
    goal: 2
    tag: 금기 보고
    icon: check
    why: '''I don''t see any''는 찾아봤지만 없다는 부정 보고예요. ''on his chart''로 어디서 확인했는지 근거를 말해요.'
    decoy: on his wristband
    distractorsKo:
    - 손목 밴드에는 금기 사항이 안 보여요.
    - 모니터에는 금기 사항이 안 보여요.
    blank:
      answer: contraindications
      options:
      - en: contraindications
      - en: complications
      - en: recommendations
      - en: explanations
  - en: Both compression devices are cycling correctly.
    ko: 압박기기 두 개 다 제대로 순환 작동하고 있어요.
    chunks:
    - Both compression devices
    - are cycling
    - correctly
    - .
    words:
    - w-compression
    - w-device
    - w-cycling
    - w-correctly
    goal: 2
    tag: 기기 확인
    icon: monitor
    why: '''Both''는 한쪽 다리만이 아니라 양쪽 모두 봤다는 말이에요. ''correctly''는 압박이 제 순서대로 돈다는 확인이에요.'
    decoy: Both leg wraps
    distractorsKo:
    - 압박기기 세 개 다 제대로 순환 작동하고 있어요.
    - 압박기기 두 개 다 조용히 순환 작동하고 있어요.
    blank:
      answer: correctly
      options:
      - en: correctly
      - en: quietly
      - en: slowly
      - en: briefly
  order:
    tag: 대화 흐름
    icon: compass
    ko: VTE 예방 시작 4문장 순서
    why: 위험을 먼저 사정하고, 그 결과로 예방 방법을 정한 뒤, 처방과 금기를 확인하고, 마지막으로 기기가 작동하는지 확인해요.
    lines:
    - en: Let's assess his VTE risk before we start anything.
      icon: magnify
      ko: 시작하기 전에 그의 VTE 위험을 사정해요
      note: 사정
    - en: With that result, we'll combine mechanical and chemical prophylaxis.
      icon: shield
      ko: 그 결과로 기계적 예방과 약물 예방을 함께 적용할게요
      note: 계획
    - en: I'll confirm the order for it and check for contraindications.
      icon: pencil
      ko: 그 처방을 확인하고 금기 사항도 볼게요
      note: 확인
