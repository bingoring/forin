- title: 이송 중 심정지 대응
  s:
  - ["정지·압박", siren, "대시 뒤에 이유를 짧게 붙이고 쉼표 뒤에 지금 하는 행동을 이어요. starting은 지금 막 시작한다는 진행형이라 now와 함께 즉시성을 보여 줘요.", ", labeling", "침대를 멈춰요 — 알람이 울려요, 지금 흉부압박을 시작해요.", "침대를 멈춰요 — 안색이 창백해요, 지금 흉부압박을 시작해요.", "pulse", "alarm", "noise", "light"]
  - ["코드 호출", bell, "Call a code는 병원 방송으로 소생팀을 부르는 말이에요. and get으로 호출과 카트 가져오기를 연달아 지시해서 두 가지가 동시에 일어나게 해요.", "linen cart", "코드를 부르고 가장 큰 응급 카트를 가져와요.", "코드를 부르고 가장 새 응급 카트를 가져와요.", "crash", "laundry", "lunch", "linen"]
  - ["역할 지시", handshake2, "while you push처럼 while로 두 사람의 동시 동작을 나란히 말해요. 한 사람은 백을 짜고 한 사람은 약물을 투여하니 서로 겹치지 않게 역할을 소리 내서 알려요.", "while you pull", "제가 백을 짜는 동안 당신이 코드 약물을 준비해요.", "제가 백을 짜는 동안 당신이 코드 약물을 섞어요.", "bagging", "lifting", "turning", "rolling"]
  - ["백보드 요청", run, "Someone grab …은 특정인을 지목하지 않고 아무나 하라고 부탁하는 말이에요. from under the mattress로 백보드가 어디 있는지까지 알려 줘서 찾는 시간을 줄여요.", "from the wall", "누가 침대 발치에서 백보드를 꺼내 주세요.", "누가 카트 밑에서 백보드를 꺼내 주세요.", "backboard", "blanket", "pillow", "sheet"]
  - ["인력 요청", siren, "more hands는 사람 손이 더 필요하다는 뜻이라 사람을 더 달라는 요청이에요. right away로 지금 당장 필요하다는 긴박함을 알려요.", "up the hall", "지금 당장 복도 쪽에 손이 더 필요해요.", "지금 당장 여기 장갑이 더 필요해요.", "hands", "pumps", "chairs", "lights"]
  - ["압박 교대", pushpin, "round는 2분 단위 압박 한 묶음을 말해요. the first two-minute round로 내가 먼저 맡는다고 하면 누가 언제 교대할지 정해져요.", "of laundry", "제가 먼저 3분간 흉부압박 라운드를 맡을게요.", "제가 먼저 1분간 흉부압박 라운드를 맡을게요.", "round", "rest", "pause", "break"]
  - ["리듬 확인", monitor, "Rhythm check은 압박을 잠깐 멈추고 리듬을 보는 순간이에요. everyone clear로 아무도 환자를 만지지 않게 안전을 확보해요.", "Rhythm break", "라인 확인 — 모두 물러나세요.", "시간 확인 — 모두 물러나세요.", "clear", "calm", "quiet", "still"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이송 중 심정지 4문장 순서
    why: 침대를 멈추고 압박을 시작한 뒤, 코드를 부르고 카트를 가져오고, 카트가 오면 각자 역할로 나뉘고, 2분 뒤에 리듬을 확인해요.
    lines:
    - ["Stop the bed — no pulse, starting compressions now.", siren, "침대를 멈춰요 — 맥박이 없어요, 지금 흉부압박을 시작해요", "압박"]
    - ["While I compress, call a code and get the nearest crash cart.", bell, "제가 압박하는 동안 코드를 부르고 응급 카트를 가져와요", "호출"]
    - ["With the cart here, I'm bagging him while you push the code meds.", handshake2, "카트가 왔으니 제가 백을 짜는 동안 약물을 투여해요", "역할"]
    - ["After two minutes, rhythm check — everyone clear.", monitor, "2분 뒤 리듬 확인 — 모두 물러나세요", "리듬"]
- title: 이송 중 발관·라인 이탈 위기
  s:
  - ["발관 대응", siren, "대시 앞은 무슨 일이 났는지, 대시 뒤는 지금 하는 행동이에요. with the mask now로 도구와 시점을 한꺼번에 알려 팀이 같은 장면을 떠올려요.", "with the tube", "기관튜브가 막혔어요 — 지금 마스크로 백을 짜고 있어요.", "기관튜브가 밀려 들어갔어요 — 지금 마스크로 백을 짜고 있어요.", "out", "bent", "dry", "loose"]
  - ["키트 호출", bell, "Call for …는 가져와 달라고 불러 달라는 말이에요. and get us back으로 호출과 복귀를 한 문장에 묶어 두 가지를 같이 하게 해요.", "to the lab", "흡인 키트를 부르고 병동으로 돌아가게 해 주세요.", "응급 키트를 부르고 병동으로 돌아가게 해 주세요.", "back", "up", "out", "off"]
  - ["압박 지시", bandage, "Hold pressure는 손으로 눌러 유지하라는 짧은 명령이에요. dislodged는 제자리에서 빠졌다는 뜻이라 출혈 위험을 같이 떠올리게 해요.", "on the tangled", "막힌 라인에 압박을 유지해요.", "꺾인 라인에 압박을 유지해요.", "dislodged", "clamped", "tangled", "labeled"]
  - ["상태 보고", stetho, "holding for now는 지금까지는 유지된다는 한정 표현이에요. 안색과 산소포화도를 함께 보고하면 호흡이 효과가 있는지 팀이 같이 확인해요.", "and mood", "안색과 혈당은 지금은 유지되고 있어요.", "안색과 체온은 지금은 유지되고 있어요.", "holding", "rising", "jumping", "growing"]
  - ["호흡 주기", lab, "every five seconds는 일정한 간격으로 반복한다는 뜻이에요. breaths 앞에 giving을 쓰면 환자에게 불어넣어 준다는 동작이 분명해져요.", "blankets", "5초마다 마스크를 밀착하고 있어요.", "5초마다 고개를 젖히고 있어요.", "breaths", "sips", "pills", "drinks"]
  - ["재삽관 계획", plane, "as soon as는 그 조건이 되는 즉시라는 뜻이에요. we're back in the unit으로 어디서 재삽관할지 장소까지 말해 줘요.", "as long as", "병동으로 돌아가는 대로 기도를 재평가할게요.", "병동으로 돌아가는 대로 삽관 기구를 소독할게요.", "unit", "lobby", "garage", "cafeteria"]
  - ["가슴 확인", magnify, "Watch는 눈으로 계속 지켜보라는 명령이에요. with each breath I give로 내가 숨을 줄 때마다 확인해서 숨이 들어가는지 확인해요.", "I count", "제가 숨을 주기 전에 마스크가 밀착됐는지 지켜보세요.", "제가 숨을 줄 때마다 마스크가 밀착되는지 지켜보세요.", "breath", "beat", "step", "word"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이송 중 발관 4문장 순서
    why: 발관을 알리고 바로 백을 짜며, 가슴이 오르는지 지켜보게 하고, 숨이 들어가면 키트를 부르며 돌아가고, 도착하면 재삽관해요.
    lines:
    - ["The ETT is out — I'm bagging him with the mask now.", siren, "기관튜브가 빠졌어요 — 지금 마스크로 백을 짜고 있어요", "발관"]
    - ["So watch his chest rise with each breath I give.", magnify, "그러니 제가 숨을 줄 때마다 가슴이 오르는지 보세요", "관찰"]
    - ["With his chest rising, call for the airway kit and get us back.", bell, "가슴이 오르니 기도 키트를 부르고 돌아가게 해 주세요", "호출"]
    - ["Once we get back, we'll re-intubate in the unit.", plane, "돌아가면 병동에서 재삽관할게요", "재삽관"]
- title: 시술 진정 중 호흡정지 위기
  s:
  - ["무호흡 보고", siren, "She's apneic처럼 상태를 먼저 한마디로 말하고 대시 뒤에 지금 하는 일을 붙여요. with a good seal은 마스크가 얼굴에 새지 않게 밀착됐다는 뜻이에요.", "with a good pillow", "의식이 없어요 — 잘 밀착시켜서 백을 짜고 있어요.", "청색증이 보여요 — 잘 밀착시켜서 백을 짜고 있어요.", "bagging", "masking", "tilting", "bracing"]
  - ["역전·중단", pill, "Give와 stop을 and로 이으면 두 지시를 한 번에 내려요. all sedatives로 하나도 남기지 말고 진정제를 전부 끊으라는 뜻이에요.", "and sort", "역전제를 뽑고 모든 진정제를 중단해요.", "역전제를 확인하고 모든 진정제를 중단해요.", "reversal", "contrast", "vaccine", "laxative"]
  - ["삽관 대비", stetho, "Prepare to …는 미리 준비하라는 지시예요. if she doesn't recover로 아직 하지는 않고 조건이 되면 한다는 걸 분명히 해요.", "if she doesn't sleep", "회복하지 않으면 전원 이송을 준비해요.", "경련하면 삽관을 준비해요.", "intubate", "reposition", "transfer", "isolate"]
  - ["가슴 관찰", faceWorried, "isn't rising on its own anymore는 전에는 올랐는데 지금은 안 오른다는 뜻이에요. anymore가 변화가 생겼다는 신호예요.", "at night", "가슴이 더는 고르게 오르지 않아요.", "가슴이 더는 크게 오르지 않아요.", "rising", "falling", "bleeding", "swelling"]
  - ["환기 효과", check, "good chest rise는 가슴이 잘 올라온다는 뜻이에요. with each squeeze로 짤 때마다 확인하면 환기가 효과적이라는 근거가 돼요.", "with each blink", "짤 때마다 마스크가 잘 밀착돼요.", "짤 때마다 백이 잘 차오르고 있어요.", "squeeze", "blink", "cough", "sigh"]
  - ["카트 요청", bell, "just in case는 쓰지 않기를 바라지만 미리 부른다는 뜻이에요. Call for 뒤에 카트를 붙이면 필요한 물건을 가져와 달라는 요청이에요.", "just in time", "회복이 느려서 기도 카트를 불러 주세요.", "삽관이 필요해서 기도 카트를 불러 주세요.", "airway", "linen", "laundry", "dietary"]
  - ["호흡 회복", check, "starting to breathe again은 막 다시 시작한다는 뜻이에요. on her own으로 백 도움 없이 혼자라고 알려요.", "with a smile", "이제 다시 깨어나기 시작하고 있어요.", "이제 다시 말하기 시작하고 있어요.", "again", "slowly", "deeply", "quietly"]
  order:
