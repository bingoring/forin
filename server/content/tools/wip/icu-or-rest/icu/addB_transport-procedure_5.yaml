    - ["After that, she's starting to breathe again on her own.", check, "그 뒤로 이제 다시 스스로 숨쉬기 시작해요", "회복"]
- title: 시술 중 대량출혈 급변
  s:
  - ["출혈 대응", siren, "대시 앞에서 상황을 한마디로 말하고 뒤에서 두 가지 행동을 and로 이어요. apply와 open은 동시에 일어나야 해서 한 문장에 담아요.", "— apply ointment", "출혈이 멈추지 않아요 — 압박하고 수액을 활짝 열어요.", "상처가 깊어요 — 압박하고 수액을 활짝 열어요.", "fluids", "drains", "valves", "curtains"]
  - ["대량수혈 발동", bell, "Activate …는 정해 둔 절차를 가동한다는 뜻이에요. and call surgery로 수혈 준비와 외과 호출을 한꺼번에 시작해요.", "and call housekeeping", "응급 수혈 프로토콜을 발동하고 외과에 연락해요.", "심정지 프로토콜을 발동하고 외과에 연락해요.", "massive", "minor", "tiny", "small"]
  - ["응급 전환", siren, "converting A to B는 A를 B로 바꾼다는 뜻이에요. 예정된 시술이 응급으로 바뀌면 팀 전체의 준비와 순서가 달라져요.", "to a teaching", "이걸 응급 수술로 전환하고 있어요.", "이걸 외래 시술로 전환하고 있어요.", "emergency", "outpatient", "elective", "pediatric"]
  - ["직접 압박", bandage, "holding direct pressure는 거즈 위를 손으로 눌러 출혈을 막는다는 뜻이에요. now가 지금 이 순간 하고 있다는 진행형이에요.", "on the pump now", "지금 부위에 멸균 거즈를 열어 대고 있어요.", "지금 부위에 멸균 가운을 덧입고 있어요.", "direct", "gentle", "light", "slow"]
  - ["혈액 요청", pill, "Get me …는 나에게 가져다 달라는 직접 요청이에요. stat은 지금 당장이라는 의료 용어라 시간을 두지 말라는 뜻이에요.", "of ice", "혈액 2유닛을 즉시 수술실로 가져다주세요.", "혈액 2유닛을 즉시 간호사실로 가져다주세요.", "units", "liters", "ounces", "pints"]
  - ["라인 요청", faceWorried, "is dropping fast는 빠르게 떨어지고 있다는 진행형이에요. 대시 뒤에 필요한 걸 바로 말하면 이유와 요청이 연결돼요.", "another gown", "의식이 흐려지고 있어요 — 라인이 하나 더 필요해요.", "출혈량이 빠르게 늘고 있어요 — 라인이 하나 더 필요해요.", "line", "chair", "gown", "pillow"]
  - ["외과 도착", plane, "on their way down은 지금 내려오는 중이라는 관용구예요. right now로 곧 도착한다는 걸 알려요.", "on their way home", "마취과가 지금 내려오고 있어요.", "외과가 지금 회진 중이에요.", "down", "up", "out", "back"]
  order:
