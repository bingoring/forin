- title: RASS 목표 맞춤 적정
  s:
  - t: 목표 비교
    i: chartup
    w: deeper than our target처럼 than 뒤에 기준을 두어 현재 수준을 목표와 견줘요. 쉼표로 이어 붙인 that절이 앞 숫자를 한 번 더 풀어 말해요.
    d: in the room
    k: ['지금 마이너스 4인데, 어제보다 더 깊어요.', '아까 마이너스 4였는데, 목표보다 더 깊었어요.']
    a: deeper
    o: [lighter, longer, louder]
  - t: 속도 조정
    i: gear
    w: decrease는 줄인다는 동사고 reassess는 다시 평가한다는 동사예요. 속도를 바꾼 뒤 시간을 정해 다시 보면 조정이 한 번으로 끝나지 않아요.
    d: on the pump
    k: [속도를 줄이고 5분 뒤에 다시 평가해봐요., 속도를 줄이고 10분 뒤에 다시 평가해봐요.]
    a: rate
    o: [room, alarm, chart]
  - t: 목표 범위
    i: board
    w: not fully unresponsive는 완전한 무반응까지 가지는 않는다는 한정이에요. aim for는 어떤 범위를 겨냥해 맞춘다는 구동사예요.
    d: in the unit
    k: ['마이너스 1에서 0을 목표로 하지, 완전히 흥분은 아니에요.', '마이너스 1에서 0을 목표로 하지, 완전히 불안정은 아니에요.']
    a: unresponsive
    o: [unstable, uncomfortable, unprepared]
  - t: 위험 설명
    i: shield
    w: Too deep risks …, too awake risks …처럼 같은 틀을 두 번 놓아 양쪽 위험을 대비시켜요. risks 뒤에 명사나 동명사가 와서 무엇이 위험해지는지 말해요.
    d: at night
    k: ['너무 깊으면 기도 반사가 위험하고, 너무 깨어있으면 라인이 막힐 위험이 있어요.', '너무 깊으면 기도 반사가 위험하고, 너무 깨어있으면 환자가 떨어질 위험이 있어요.']
    a: airway
    o: [bladder, knee, skin]
  - t: 단계적 조정
    i: gear
    w: in small steps instead of one big jump는 방식을 대비해서 말하는 모양이에요. titrate는 반응을 보며 조금씩 조절한다는 뜻이라 한 번에 크게 바꾸지 않아요.
    d: for the team
    k: ['한 번에 크게 바꾸지 말고 조금씩 titrate 할까요?', 한 번에 크게 바꾸지 말고 조금씩 titrate 할게요.]
    a: titrate
    o: [tolerate, transfer, tighten]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 진정 깊이 조정 4문장 순서
    why: 너무 깊다는 사정이 먼저이고, So로 속도를 줄이겠다고 하고, 3줄의 that change는 그 속도 변경을 가리키며, 4줄의 That way는 단계적으로 바꾸는 방법을 가리켜요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    lines:
    - {en: 'He''s at minus four now, that''s deeper than our target.', icon: chartup, ko: '지금 마이너스 4인데, 목표보다 더 깊어요', note: 사정}
    - {en: So let's decrease the rate and reassess in fifteen minutes., icon: gear, ko: 그러니 속도를 줄이고 15분 뒤에 다시 평가해봐요, note: 조정}
    - {en: We'll make that change in small steps instead of one big jump., icon: pill, ko: 그 변화는 한 번에 크게 말고 조금씩 할게요, note: 방법}
    - {en: 'That way he stays near minus one to zero, not fully unresponsive.', icon: board, ko: '그러면 마이너스 1에서 0 근처로, 완전히 무반응은 아니게 돼요', note: 목표}
- title: 덱스메데토미딘 적용
  s:
  - t: 약 특성
    i: pill
    w: without much …는 많지 않다는 정도를 말하는 완충이에요. 단정해서 없다고 하지 않고 호흡억제가 적다고 해서 사실에 가깝게 전해요.
    d: in the morning
    k: [덱스메데토미딘은 호흡억제 없이 깊은 진정을 줘요., 덱스메데토미딘은 구토 없이 협조적인 진정을 줘요.]
    a: cooperative
    o: [unconscious, aggressive, painful]
  - t: 부작용 감시
    i: monitor
    w: Watch for …는 어떤 변화가 나타나는지 살피라는 지시 모양이에요. bradycardia와 hypotension은 이 약의 대표적인 순환계 영향이에요.
    d: on the chart
    k: ['titrate 하면서 서맥과 저혈압을 지켜볼까요?', titrate 하면서 서맥과 저혈압을 지켜볼게요.]
    a: bradycardia
    o: [dermatitis, gastritis, tonsillitis]
  - t: 각성 반응
    i: stetho
    w: should still …의 still은 이 약을 써도 여전히 라는 뜻이에요. rouse는 자극에 깨어난다는 동사라서 진정 중에도 깨울 수 있어야 한다는 기준을 말해요.
    d: at night
    k: [이 약으로도 깨워보면 반응하고 질문에 답해야 해요., 이 약으로도 만져보면 반응하고 지시를 따라야 해요.]
    a: follow
    o: [fold, fetch, fix]
  - t: 심박 감시
    i: monitor
    w: keep a close eye on은 눈을 떼지 않고 지켜본다는 관용구예요. for the first hour로 감시를 특히 세게 해야 할 기간을 정해 줘요.
    d: from the cart
    k: [첫 한 시간 동안 심박수를 가까이서 지켜보는 중이에요., 첫 한 시간 동안 심박수를 가까이서 지켜봤어요.]
    a: close
    o: [clean, cold, loud]
  - t: 각성 가능
    i: handshake2
    w: can still wake up and squeeze는 두 동작을 and로 이어 말해요. 손을 잡을 수 있다는 것은 지시를 따를 만큼 깨어난다는 구체적인 예예요.
    d: to the nurse
    k: [덱스메데토미딘을 써도 깰 수 있고 발을 움직일 수 있어요., 덱스메데토미딘을 써도 깰 수 있고 손을 흔들 수 있어요.]
    a: squeeze
    o: [bite, kick, scratch]
  - t: 중단 기준
    i: bell
    w: If절에 too far로 한계를 붙여 얼마나 떨어질 때인지 기준을 말해요. we'll pause는 약속하는 모양이라 기준과 조치가 한 문장에 있어요.
    d: near the bed
    k: ['심박수가 너무 떨어지면 주입을 멈출까요?', '심박수가 너무 떨어지면 주입을 멈추겠어요?']
    a: pause
    o: [pack, paint, pour]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 덱스메데토미딘 사용 4문장 순서
    why: 약의 장점을 먼저 말하고, That means로 그 장점이 보이는 모습을 풀고, The catch로 단점 쪽으로 넘어가요. 마지막 줄의 it은 3줄의 심박수를 가리켜서 순서가 하나예요.
    lines:
    - {en: Dexmedetomidine gives cooperative sedation without much respiratory depression., icon: pill, ko: 덱스메데토미딘은 호흡억제가 크지 않으면서 협조적인 진정을 줘요, note: 장점}
    - {en: That means he can still wake up and squeeze your hand., icon: handshake2, ko: 그래서 깨어서 손을 잡을 수 있어요, note: 모습}
    - {en: 'The catch is bradycardia and hypotension, so let''s keep a close eye on his heart rate.', icon: monitor, ko: 대신 서맥과 저혈압이 있으니 심박수를 가까이서 지켜봐요, note: 주의}
    - {en: 'If it drops too far, we''ll pause the infusion.', icon: bell, ko: 너무 떨어지면 주입을 멈출게요, note: 기준}
- title: 아편유사제 진통 적정
  s:
  - t: 통증 사정
    i: faceWorried
    w: still은 이미 한 번 조치했는데도 계속이라는 뜻이에요. grimaces with turning은 움직일 때 얼굴로 아픔을 보인다는 관찰이라 so로 결론을 이어요.
    d: on the right
    k: [목욕할 때 여전히 찡그리니 통증이 조절되지 않고 있어요., 식사할 때 여전히 찡그리니 통증이 조절되지 않고 있어요.]
    a: still
    o: [never, rarely, hardly]
  - t: 소량 추가
    i: pill
    w: but으로 추가하는 일과 함께 해야 할 감시를 한 문장에 묶었어요. small bolus의 small이 한 번에 많이 주지 않는다는 조심을 보여 줘요.
    d: by the sink
    k: [소량 볼루스를 추가하되 호흡수를 지켜볼게요., 소량 볼루스를 추가하되 호흡수를 지켜봐도 돼요.]
    a: small
    o: [cold, clear, warm]
  - t: 균형 설명
    i: board
    w: balance A against B는 두 가지를 저울질한다는 모양이에요. 편안함만 좇으면 과진정이 오고 너무 아끼면 아프다는 양쪽 위험을 말해요.
    d: on the floor
    k: [편안함과 과진정·느린 맥박 사이에서 균형을 맞춰요., 청결함과 과진정·느린 호흡 사이에서 균형을 맞춰요.]
    a: comfort
    o: [privacy, hygiene, fashion]
  - t: 재평가
    i: chartup
    w: after this next dose로 다음 평가 시점을 용량 투여와 묶어요. reassess가 다시 평가한다는 동사라서 약을 준 뒤 효과를 확인하는 순서가 돼요.
    d: at the desk
    k: [이번 검사 다음에 통증 점수를 다시 평가해봐요., 이번 용량 다음에 통증 기록을 다시 평가해봐요.]
    a: reassess
    o: [reorder, rewrite, relabel]
  - t: 사전 안내
    i: speech
    w: before I turn him으로 몸을 움직이기 전에 알린다는 순서를 말해요. so he's not surprised는 목적을 밝혀 안내하는 이유를 전해요.
    d: in his room
    k: ['체위를 바꾸기 전에 미리 보여줄게요, 놀라지 않게요.', '목욕시키기 전에 미리 말해줄게요, 놀라지 않게요.']
    a: surprised
    o: [bored, jealous, hungry]
  - t: 위험 설명
    i: shield
    w: ease A but can B는 좋은 효과와 위험을 but으로 대비해요. if we go too fast는 위험이 생기는 조건이라서 속도를 조절하는 이유가 돼요.
    d: on the unit
    k: [아편유사제는 통증을 줄이지만 너무 빨리 올리면 호흡이 거칠어질 수 있어요., 아편유사제는 통증을 줄이지만 너무 빨리 빼면 호흡이 느려질 수 있어요.]
    a: breathing
    o: [blinking, burping, bowing]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 아편유사제 진통 조절 4문장 순서
    why: 통증이 조절되지 않는다는 사정이 먼저이고, 2줄의 that은 그 통증을 가리켜요. So로 소량 추가와 감시를 말하고, 마지막 줄의 that dose는 3줄의 볼루스를 가리켜서 순서가 하나예요.
    lines:
    - {en: 'He still grimaces with turning, so his pain isn''t controlled.', icon: faceWorried, ko: 체위를 바꿀 때 여전히 찡그려서 통증이 조절되지 않아요, note: 사정}
    - {en: 'We use opioids for that, but they can slow his breathing if we go too fast.', icon: shield, ko: 그래서 아편유사제를 쓰지만 너무 빠르면 호흡이 느려질 수 있어요, note: 위험}
    - {en: So let's add a small bolus but watch his respiratory rate., icon: pill, ko: 그러니 소량 볼루스를 추가하되 호흡수를 지켜봐요, note: 투여}
    - {en: Let's reassess his pain score after that dose., icon: chartup, ko: 그 용량 다음에 통증 점수를 다시 평가해봐요, note: 재평가}
- title: 프로포폴 장기 사용 감시
  s:
  - t: 검사 소견
    i: lab
    w: on prolonged propofol의 on은 약을 쓰는 중이라는 뜻이에요. prolonged는 오래 이어졌다는 형용사라 중성지방이 오르는 이유를 기간과 연결해요.
    d: in the morning
    k: [장기간 프로포폴을 쓰면서 혈당이 올라가고 있어요., 단기간 프로포폴을 쓰면서 중성지방이 올라가고 있어요.]
    a: triglycerides
    o: [phosphorus, platelets, sodium]
  - t: 검사 계획
    i: lab
    w: check a lactate는 젖산 한 번을 재 본다는 뜻이고 watch for는 나타나는지 살핀다는 뜻이에요. 두 일을 and로 이어 검사와 감시를 같이 말해요.
    d: on the shelf
    k: ['젖산을 확인하고 대사성 산증을 지켜볼까요?', 젖산을 확인하고 대사성 산증을 지켜볼게요.]
    a: acidosis
    o: [alkalosis, anemia, edema]
  - t: 조기 인지
    i: magnify
    w: can look subtle은 겉으로는 눈에 잘 안 띌 수 있다는 가능성 표현이에요. so로 그래서 더 꼼꼼히 감시한다는 이유를 이어요.
    d: to the bed
    k: [초기 PRIS는 흔할 수 있어서 자세히 감시해요., 후기 PRIS는 미묘할 수 있어서 자세히 감시해요.]
    a: subtle
    o: [obvious, loud, itchy]
  - t: 추적 계획
    i: chartup
    w: trend는 명사가 아니라 여기서는 수치를 시간순으로 따라간다는 동사예요. every day로 빈도를, while he's on this로 기간을 함께 정해요.
    d: in the lab
    k: [이 약을 쓰는 동안 매시간 중성지방 수치를 추적해봐요., 이 약을 쓴 뒤로 매일 중성지방 수치를 추적해봐요.]
    a: trend
    o: [trade, trim, train]
  - t: 소견 해석
    i: monitor
    w: that supports는 앞의 소견이 어떤 진단 쪽 근거가 된다는 뜻이에요. 확정이라고 하지 않고 supports라고 해서 증거의 정도를 조심스럽게 말해요.
    d: on the sheet
    k: [크레아틴 키나아제도 같이 오르면 후기 PRIS를 뒷받침해요., 크레아틴 키나아제도 같이 오르면 초기 감염을 뒷받침해요.]
    a: climbs
    o: [falls, slips, sinks]
  - t: 약 변경
    i: bulb
    w: Four days on propofol is long처럼 기간 자체를 주어로 삼아 평가해요. think about …ing는 결정이 아니라 고려해 보자는 부드러운 제안이에요.
    d: for review
    k: [프로포폴을 4일이나 썼으니 다른 약으로 바꾸는 것도 설명해봐요., 프로포폴을 4일이나 썼으니 다른 방으로 옮기는 것도 생각해봐요.]
    a: switching
    o: [sharing, selling, sorting]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 프로포폴 장기 사용 4문장 순서
    why: 소견을 먼저 말하고, So로 검사를 계획하고, 3줄의 too는 앞서 본 오름에 더해 키나아제도 오른다는 뜻이에요. 마지막 줄의 With all that이 앞의 소견들을 모아서 순서가 하나예요.
    lines:
    - {en: His triglycerides are rising on prolonged propofol., icon: lab, ko: 장기간 프로포폴을 쓰면서 중성지방이 올라가고 있어요, note: 소견}
    - {en: So let's check a lactate and watch for metabolic acidosis., icon: lab, ko: 그러니 젖산을 확인하고 대사성 산증을 지켜봐요, note: 검사}
    - {en: 'If his creatine kinase climbs too, that supports early PRIS.', icon: monitor, ko: 크레아틴 키나아제도 같이 오르면 초기 PRIS를 뒷받침해요, note: 해석}
    - {en: 'With all that, let''s think about switching agents after four days on propofol.', icon: bulb, ko: 그걸 모아 보면 프로포폴 4일 뒤엔 약을 바꾸는 걸 생각해봐요, note: 결론}
- title: 진정 중단 이탈 연계
  s:
  - t: 시험 안내
    i: monitor
    w: pause A for B는 B를 위해 A를 잠시 멈춘다는 모양이에요. spontaneous awakening trial은 진정을 끊고 스스로 깨는지 보는 시험의 이름이에요.
    d: in the room
    k: ['자발각성시험을 위해 진정을 잠시 멈출까요?', 자발호흡시험을 위해 진정을 잠시 멈출게요.]
    a: spontaneous
    o: [special, spicy, spectacular]
  - t: 병행 시험
    i: stetho
    w: pair A with B는 둘을 짝지어 함께 한다는 구동사예요. If절에 조건을 달아 차분할 때만 호흡 시험으로 넘어간다는 기준을 말해요.
    d: on the day
    k: [차분한 상태를 유지하면 걷기 시험과 함께 진행할 수 있어요., 차분한 상태를 유지하면 호흡 시험과 따로 진행할 수 있어요.]
    a: pair
    o: [pay, pour, pack]
  - t: 관찰 요청
    i: monitor
    w: so he doesn't …는 하지 않도록 이라는 목적절이에요. agitated와 self-extubate는 시험 중 생길 수 있는 두 가지 위험이라 or로 이어 말해요.
    d: in the bed
    k: ['초조해하거나 자가발관하지 않도록 자세히 지켜볼까요?', 초조해하거나 자가발관하지 않도록 자세히 지켜볼게요.]
    a: agitated
    o: [tired, thirsty, hungry]
  - t: 목적 설명
    i: magnify
    w: to see if …는 어떤 것을 알아보려는 목적을 말하는 모양이에요. every morning은 시험을 정해진 때마다 반복한다는 점을 알려 줘요.
    d: for the team
    k: [스스로 호흡할 준비가 됐는지 보려고 매일 밤 이걸 해요., 스스로 걸을 준비가 됐는지 보려고 매일 아침 이걸 해요.]
    a: ready
    o: [eager, afraid, happy]
  - t: 설정 복귀
    i: pill
    w: Once …는 앞 일이 끝난 바로 다음이라는 시점이고 right away가 지체 없이를 뜻해요. 시험이 끝나면 편안한 상태로 곧 돌아간다는 약속이에요.
    d: by the wall
    k: [시험이 끝나면 바로 편안한 침대로 옮겨드릴게요., 시험이 끝나면 바로 편안한 자세로 되돌려드릴게요.]
    a: restart
    o: [retire, reject, retype]
  - t: 환자 안내
    i: speech
    w: just checking은 큰 일이 아니라 확인만 한다는 가벼운 말투예요. for a bit로 잠깐뿐이라고 해서 환자의 걱정을 줄여요.
    d: to the room
    k: [잠깐 스스로 깰 수 있는지 확인하는 거라고 가족에게 말해줄게요., 잠깐 스스로 걸을 수 있는지 확인하는 거라고 그에게 말해줄게요.]
    a: checking
    o: [cheering, charging, chasing]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 진정 중단 시험 4문장 순서
    why: 시험을 하겠다는 안내가 먼저이고, 2줄의 this는 그 시험을 가리켜요. 3줄의 it은 시험을, 4줄의 the trial도 그 시험을 가리키는데, 끝난 뒤의 일이라 마지막에 와서 순서가 하나예요.
    lines:
    - {en: We'll pause sedation for a spontaneous awakening trial., icon: monitor, ko: 자발각성시험을 위해 진정을 잠시 멈출게요, note: 안내}
    - {en: We do this every morning to see if he's ready to breathe on his own., icon: magnify, ko: 스스로 호흡할 준비가 됐는지 보려고 매일 아침 해요, note: 목적}
    - {en: 'If he stays calm, we can pair it with a breathing trial.', icon: stetho, ko: 차분하면 호흡 시험과 함께 진행할 수 있어요, note: 병행}
    - {en: 'Once we finish the trial, we''ll restart his comfort settings right away.', icon: pill, ko: 시험이 끝나면 바로 편안한 설정으로 되돌려드릴게요, note: 복귀}
- title: analgosedation 전략 적용
  s:
  - t: 전략 설명
    i: pill
    w: only if needed는 필요한 경우에만이라는 한정이에요. prioritize는 무엇을 먼저 둔다는 동사라서 진통을 앞에 세우고 진정은 뒤에 둔다는 순서를 말해요.
    d: on the ward
    k: [진통을 우선하고 필요할 때만 수액을 추가해요., 진통을 우선하고 요청할 때만 진정을 추가해요.]
    a: only
    o: [often, always, never]
  - t: 근거 설명
    i: board
    w: often은 항상은 아니지만 흔히라는 빈도 완충이에요. lowers는 줄인다는 동사고 requirement는 필요한 양이라서 통증 조절이 약의 양에 미치는 영향을 말해요.
    d: for adults
    k: [통증 조절이 잘 되면 흔히 진정제 비용이 줄어요., 통증 평가가 잘 되면 흔히 진정제 필요량이 줄어요.]
    a: Good
    o: [Poor, Bad, Weak]
  - t: 재평가
    i: monitor
    w: before increasing anything은 어떤 것이든 늘리기 전이라는 시점이에요. reassess his comfort는 편안한지 다시 본다는 뜻이라 늘리는 결정 앞에 확인을 둬요.
    d: for the evening
    k: [뭔가를 옮기기 전에 편안함을 다시 평가해봐요., 뭔가를 늘리기 전에 가족 편안함을 다시 평가해봐요.]
    a: comfort
    o: [hair, height, shoes]
  - t: 최소 사용
    i: shield
    w: keep A to a minimum은 A를 가장 적게 쓴다는 숙어예요. lean on은 어느 쪽에 기댄다는 구동사라서 진통을 먼저 쓴다는 방침을 말해요.
    d: on the tray
    k: [진정제는 최소로 유지하고 운동을 먼저 활용해요., 진정제는 최소로 보관하고 진통을 먼저 활용해요.]
    a: keep
    o: [send, sell, show]
  - t: 효과 후 확인
    i: chartup
    w: wears off는 약효가 사라진다는 구동사예요. 효과가 끝난 뒤에 점수를 다시 확인하면 약이 실제로 얼마나 유지됐는지 보여요.
    d: in the files
    k: [이번 볼루스 효과가 시작되면 편안함 점수를 다시 확인해봐요., 이번 볼루스 효과가 사라지면 불안 점수를 다시 확인해봐요.]
    a: comfort
    o: [pulse, fever, weight]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 진통 우선 진정 전략 4문장 순서
    why: 방침을 먼저 말하고, That's because로 이유를 대고, Since로 그 이유를 받아 재평가를 말하며, That way가 3줄의 재평가를 가리켜서 결과를 말해요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    lines:
    - {en: We prioritize analgesia and add sedation only if needed., icon: pill, ko: 진통을 우선하고 필요할 때만 진정을 추가해요, note: 방침}
    - {en: That's because good pain control often lowers the sedative requirement., icon: board, ko: 통증 조절이 잘 되면 흔히 진정제 필요량이 줄기 때문이에요, note: 이유}
    - {en: 'Since pain control matters, let''s reassess his comfort before increasing anything.', icon: monitor, ko: 통증 조절이 중요하니 뭔가 늘리기 전에 편안함을 다시 평가해봐요, note: 재평가}
    - {en: That way we keep sedatives to a minimum and lean on analgesia first., icon: shield, ko: 그래야 진정제는 최소로 유지하고 진통을 먼저 활용해요, note: 결과}
