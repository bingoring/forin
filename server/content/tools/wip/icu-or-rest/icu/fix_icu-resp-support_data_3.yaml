# 뉘앙스·order 수정 (fix-icu-resp-support-A N-1~N-6, S-2 / B 17·18·66·67)
nuance:
  - si: 9
    ki: 0
    kind: pair
    set:
      pairs:
        - [push, fluid out of the air sacs]
        - [reduce, the strain on your heart]
      decoys: [the lab results]
      words: [w-push, w-strain]
      why: "CPAP의 압력이 폐포의 체액을 밀어내고(push), 심장의 부담을 줄여줘요(reduce)."
  - si: 14
    ki: 1
    kind: context
    set:
      ko: 목표치
  - si: 12
    ki: 1
    kind: swap
    set:
      ko: 이 씨 건으로 전화드렸어요. BiPAP 한 시간 뒤 ABG가 더 나빠졌어요
  - si: 5
    ki: 1
    kind: swap
    set:
      ko: 혈액가스 검사에서 지금 이산화탄소가 너무 많게 나와요
  - si: 18
    ki: 0
    kind: slider
    set:
      example: "This is getting dangerous, so let's prepare for intubation."
      exKo: "점점 위험해지고 있으니 삽관을 준비해요."
  - si: 16
    ki: 0
    kind: slider
    set:
      why: "숨이 있지만 겨우 있는 정도(분당 6회·얕음)면 barely breathing이에요. 바로 백밸브마스크로 환기를 도와요. not breathing이면 맥박부터 확인해 맥이 있으면 환기를, 맥이 없으면 CPR을 시작해요."
  - si: 20
    ki: 1
    kind: context
    scene2_fix: "We're focusing on keeping him comfortable, and we'll keep treating any symptom that bothers him."
order:
  - si: 2
    why: "콧등을 지킬 패드를 먼저 붙이고, 그 위에 마스크를 씌워 끈을 맞춘 뒤, 새거나 눌리면 말해 달라고 하고, 그러면 밀착을 확인해 끈을 조금 풀어요."
    lines:
      - {en: "First, I'll add padding to protect the bridge of your nose.", icon: bandage, ko: "먼저 콧등을 보호하도록 패드를 붙일게요", note: 보호}
      - {en: "With the padding on, I'll put the mask on and adjust the straps.", icon: gear, ko: "패드를 붙인 채로 마스크를 씌우고 끈을 조정할게요", note: 착용}
      - {en: "Once it's on, tell me if air leaks or it presses too hard.", icon: bell, ko: "씌우고 나면 바람이 새거나 너무 세게 눌리면 말해 주세요", note: 요청}
      - {en: "If it does, I'll check the seal and loosen the strap a little.", icon: check, ko: "그러면 밀착을 확인하고 끈을 조금 느슨하게 할게요", note: 조정}
  - si: 8
    line: 3
    ko: "폐가 쉬고 수치가 좋아지면 압력을 조금씩 낮출게요"
  - si: 13
    line: 3
    en: "If he starts to fail, we still have a window for escalation."
    ko: "그가 나빠지기 시작해도 단계를 올릴 시간창은 있어요"
    why: "위험 요인을 먼저 말하고, 그래서 조기 NIV를 택한 이유를 설명한 뒤, 수치를 비교해 반응을 보고, 그가 나빠지기 시작해도 단계 상승 여지가 있다고 이어요."
  - si: 16
    line: 1
    en: "While I start bagging, call the code and get the intubation cart."
    ko: "제가 환기를 시작하는 동안 코드를 부르고 삽관 카트를 가져와요"
    why: "환기를 바로 시작하고, 시작하는 동안 코드를 부르고 카트를 요청하고, 카트를 기다리며 환기를 이어 가고, 카트가 오면 기도를 확보해요."
  - si: 19
    line: 0
    ko: "좋은 쪽 폐를 보호하도록 출혈하는 쪽 폐가 아래로 가게 눕혀요"
  - si: 19
    line: 2
    en: "While we suction, I'm notifying the physician of this emergent airway."
    ko: "흡인하는 동안 이 응급 기도 상황을 의사에게 알리고 있어요"
    why: "체위로 좋은 폐를 보호하고, 그 상태에서 흡인과 산소를 하고, 흡인하는 동안 응급 기도 상황임을 의사에게 알리고, 그 호출에서 응급 기도 확보를 요청해요."
  - si: 20
    line: 3
    en: "That way he stays comfortable and breathes as easily as possible, without a breathing tube."
    ko: "그러면 호흡관 없이도 편안하고 최대한 수월하게 숨 쉴 수 있어요"
    note: 효과
    why: "환자의 바람을 존중한다고 먼저 말하고, 그래서 목표가 편안함임을 밝힌 뒤, 목표를 이루는 방법(산소와 약)을 말하고, 호흡관 없이 편안하고 최대한 수월하게 숨 쉬도록 돕는다고 마무리해요."
