situations:
- title: SBAR 구조 인계 기초
  sentences:
  - en: 'Situation: he''s a sixty-year-old with sepsis, day two.'
    ko: '상황: 그는 60세, 패혈증 2일째입니다.'
    chunks:
    - 'Situation:'
    - he's a sixty-year-old
    - with sepsis
    - ', day two'
    - .
    words:
    - w-situation
    - w-sepsis
    goal: 1
  - en: Background, assessment, and then my recommendation.
    ko: 배경, 평가, 그리고 제 권고 순서로 드릴게요.
    chunks:
    - Background
    - ', assessment'
    - ', and then'
    - my recommendation
    - .
    words:
    - w-background
    - w-assessment
    - w-recommendation
    goal: 1
  - en: Let's go through his SBAR from the top.
    ko: 처음부터 SBAR 순서로 짚어 볼게요.
    chunks:
    - Let's go through
    - his SBAR
    - from the top
    - .
    words:
    - w-sbar
    - w-gothrough
    goal: 1
  - en: I'll walk you through the background first, then the assessment.
    ko: 먼저 배경부터, 그다음 평가로 안내해 드릴게요.
    chunks:
    - I'll walk you
    - through the background
    - first
    - ', then the assessment'
    - .
    words:
    - w-background
    - w-assessment
    goal: 1
  - en: Let me know if you want me to repeat anything.
    ko: 다시 말씀드릴 부분이 있으면 알려 주세요.
    chunks:
    - Let me know
    - if you want me
    - to repeat
    - anything
    - .
    words:
    - w-repeat
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-sepsis
    cue: 'Doctor: "His MAP won''t come up even after fluids, so we''re starting a pressor."'
    scale:
    - infection
    - sepsis
    - septic shock
    answerAt: 2
    why: sepsis는 감염 때문에 장기 기능까지 흔들리는 상태예요. 수액을 넣어도 혈압이 안 올라 승압제가 필요해지면 septic shock이라고 불러요. 인계에서는 지금이 어느 단계인지 정확히 말해야 받는 사람이 대비해요.
    example: He has septic shock and needs a pressor.
    exKo: 패혈성 쇼크라서 승압제가 필요해요.
  - kind: pair
    words:
    - w-situation
    - w-background
    - w-assessment
    - w-recommendation
    pairs:
    - - situation
      - what is happening right now
    - - background
      - how he got here
    - - assessment
      - what I think is going on
    - - recommendation
      - what I would like done
    decoys:
    - who is on the unit
    why: SBAR의 S는 지금 일어나는 일, B는 오기까지의 경과, A는 내가 보는 판단, R은 내가 바라는 조치예요. 이 순서로 말하면 듣는 사람이 따라가기 쉬워요.
  - kind: context
    words:
    - w-sbar
    word: SBAR
    ko: SBAR(인계 형식)
    scenes:
    - who: 야간 동료
      icon: handshake2
      en: Let's go through his SBAR from the top.
      ok: true
    - who: 의사에게 전화
      icon: stetho
      en: 'I''ll give you his SBAR: sepsis, day two, MAP stable.'
      ok: true
    - who: 가족에게
      icon: home
      en: 'Let me go through his SBAR with you: situation, background, assessment, recommendation.'
