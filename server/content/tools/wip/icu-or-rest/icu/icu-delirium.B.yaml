    - 대부분 환자는 시간이 지나면 병실로 돌아와요.
    blank:
      answer: themselves
      options:
      - en: themselves
      - en: yesterday
      - en: upstairs
      - en: outside
  order:
    tag: 대화 흐름
    icon: compass
    ko: 가족에게 섬망 설명 4문장 순서
    why: 먼저 섬망이라는 이름과 일시적 경향을 알려요. 원인을 설명하고, 두려운 마음을 공감한 뒤, 가족이 도울 수 있는 일로 닫아요.
    lines:
    - en: This confusion is delirium, and it's usually temporary.
