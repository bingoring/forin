situations:
- title: CAM-ICU 선별 시행
  sentences:
  - en: Let's start CAM-ICU with his baseline mental status.
    ko: 기저 정신 상태부터 CAM-ICU를 시작할게요.
    chunks:
    - Let's start
    - CAM-ICU
    - with his baseline
    - mental status
    - .
    words:
    - w-start
    - w-camicu
    - w-baseline
    - w-mental
    - w-status
    goal: 1
    tag: 선별 시작
    icon: board
    why: Let's …는 함께 시작하자는 제안 모양이에요. with his baseline으로 기준 상태를 먼저 잡아야 이후 변화를 견줄 수 있다는 순서가 보여요.
    decoy: with his family
    distractorsKo:
    - 어제 정신 상태부터 CAM-ICU를 시작할게요.
    - 기저 활력 상태부터 CAM-ICU를 시작할게요.
    blank:
      answer: mental
      options:
      - en: mental
      - en: physical
      - en: nutritional
      - en: social
  - en: First we check for an acute change or a fluctuating course.
    ko: 먼저 급성 변화나 변동하는 경과가 있는지 확인해요.
    chunks:
    - First
    - we check
    - for an acute change
    - or a fluctuating course
    - .
    words:
    - w-check
    - w-acute
    - w-change
    - w-fluctuating
    - w-course
    goal: 1
    tag: 첫 항목
    icon: magnify
    why: First로 순서를 먼저 밝혀 첫 확인 항목임을 알려요. for A or B 한 구조에 두 증상을 묶어 말할 수 있어요.
    decoy: for a sudden fever
    distractorsKo:
    - 다음으로 급성 변화나 변동하는 경과가 있는지 확인해요.
    - 마지막으로 급성 변화나 변동하는 경과가 있는지 확인해요.
    blank:
      answer: fluctuating
      options:
      - en: fluctuating
      - en: stable
      - en: prolonged
      - en: painful
  - en: We check inattention and disorganized thinking next.
    ko: 다음으로 부주의와 사고 와해를 확인해요.
    chunks:
    - We check
    - inattention and disorganized thinking
    - next
    - .
    words:
    - w-check
    - w-inattention
    - w-disorganized
    - w-thinking
    goal: 1
    tag: 다음 항목
    icon: magnify
    why: next를 문장 끝에 두면 앞 항목에 이어 확인한다는 흐름만 알려요. 부주의와 사고 와해는 CAM-ICU의 두 번째·세 번째 특징이에요.
    decoy: later today
    distractorsKo:
    - 먼저 부주의와 사고 와해를 확인해요.
    - 마지막으로 부주의와 사고 와해를 확인해요.
    blank:
      answer: next
      options:
      - en: next
      - en: later
      - en: soon
      - en: daily
  - en: He can't squeeze my hand twice when I ask him to.
    ko: 환자가 제 손을 두 번 쥐라는 요청에 응하지 못해요.
    chunks:
    - He can't squeeze
    - my hand twice
    - when I ask
    - him to
    - .
    words:
    - w-squeeze
    - w-hand
    - w-ask
    goal: 2
    tag: 관찰 결과
    icon: stetho
    why: can't squeeze … twice when I ask처럼 구체적 행동과 횟수를 말하면 '주의력이 없다'는 평가가 관찰로 뒷받침돼요.
    decoy: my arm
    distractorsKo:
    - 환자가 제 손을 세 번 쥐라는 요청에 응하지 못해요.
    - 환자가 제 손을 두 번 놓으라는 요청에 응하지 못해요.
    blank:
      answer: twice
      options:
      - en: twice
      - en: once
      - en: firmly
      - en: slowly
  - en: That means his attention feature is positive.
    ko: 그건 주의력 항목이 양성이라는 뜻이에요.
    chunks:
    - That means
    - his attention feature
    - is positive
    - .
    words:
    - w-attention
    - w-feature
    - w-positive
    goal: 2
    tag: 결과 해석
    icon: chartup
    why: That means …는 앞 관찰의 결론을 이끄는 말이에요. positive는 '좋다'가 아니라 그 특징이 '있다'는 검사 용어예요.
    decoy: on the monitor
    distractorsKo:
    - 그건 호흡 항목이 양성이라는 뜻이에요.
    - 그건 주의력 항목이 두 번째라는 뜻이에요.
    blank:
      answer: attention
      options:
      - en: attention
      - en: memory
      - en: pain
      - en: vision
  - en: If two features are positive, he screens delirious.
    ko: 두 항목이 양성이면 섬망으로 판정돼요.
    chunks:
    - If two features
    - are positive
    - ', he screens delirious'
    - .
    words:
    - w-feature
    - w-positive
    - w-screen
    - w-delirious
    goal: 2
    tag: 판정 기준
    icon: board
    why: If …, …는 조건과 결과를 한 문장에 묶어요. 실제 판정은 특징 1·2가 모두 양성이고 3 또는 4가 양성일 때예요.
    decoy: at night
    distractorsKo:
    - 두 항목이 양성이면 감염으로 판정돼요.
    - 두 환자가 양성이면 섬망으로 판정돼요.
    blank:
      answer: features
      options:
      - en: features
      - en: patients
      - en: nurses
      - en: alarms
  - en: I'll document the result and update the team.
    ko: 결과를 기록하고 팀에 알릴게요.
    chunks:
    - I'll document
    - the result
    - and update
    - the team
    - .
