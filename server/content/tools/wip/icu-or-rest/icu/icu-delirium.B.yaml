    - w-quickly
    - w-dementia
    - w-build
    - w-slowly
    goal: 1
    tag: 섬망 vs 치매
    icon: compass
    why: while은 두 대상을 대비시켜 '갑자기 vs 천천히'를 한 문장에 놓아요. 발병 속도는 섬망과 치매를 구별하는 핵심 단서예요.
