# 뉘앙스·order 수정. nuance: 상황 -> {번호: {replace|patch|scene_patch}}
nuance:
  1:
    1:
      replace:
        kind: context
        words: [w-microgram]
        word: microgram
        ko: 마이크로그램
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "The pump says twenty-five micrograms — does that match the bag?", ok: true}
          - {who: 차트 기록, icon: board, en: "Propofol 25 micrograms/kg/min per pump; bag concentration verified.", ok: true}
          - {who: 보호자에게, icon: me, en: "The pump is infusing propofol at twenty-five micrograms per kilo per minute.", ok: false, fix: "That machine gives him the sleep medicine slowly and steadily."}
        why: 의료진끼리는 microgram 단위까지 읽어야 두 사람이 같은 값을 맞대어 볼 수 있어요. 가족에게는 마이크로그램이 뜻 없이 들리니, 기계가 무슨 일을 하는지를 쉬운 말로 알려 줘요.
  2:
    1:
      replace:
        kind: context
        words: [w-analgesia]
        word: analgesia
        ko: 진통
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "Let's get analgesia on board before we touch the sedation.", ok: true}
          - {who: 차트 기록, icon: board, en: "Pain with suctioning, CPOT 4; analgesia given per order.", ok: true}
          - {who: 보호자에게, icon: me, en: "He needs more analgesia for nociceptive pain.", ok: false, fix: "He hurts when we move him, so we're giving him medicine to keep him comfortable."}
        why: 의료진끼리는 analgesia 한 단어로 진통 계획을 말해요. 가족에게는 analgesia와 nociceptive 같은 말이 낯설고 겁을 주니, 아프지 않게 도와 주고 있다는 점부터 말해요.
  3:
    1:
      replace:
        kind: context
        words: [w-rass]
        word: RASS
        ko: RASS 진정 척도
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "Let's keep his RASS at zero to minus one.", ok: true}
          - {who: 차트 기록, icon: board, en: "RASS goal 0 to -1; current -3, rate decreased.", ok: true}
          - {who: 보호자에게, icon: me, en: "His RASS is minus three, so we're lightening him.", ok: false, fix: "We want him calm and able to wake up when we talk to him."}
        why: 의료진끼리는 RASS 숫자로 목표를 말해야 정확해요. 가족에게는 RASS와 마이너스 3이 뜻 없이 들리니, 어떤 모습이길 바라는지를 쉬운 말로 풀어 줘요.
  4:
    1:
      replace:
        kind: context
        words: [w-saturation]
        word: saturation
        ko: 포화도
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "His saturation is eighty-eight on the monitor — grab the bag-mask.", ok: true}
          - {who: 차트 기록, icon: board, en: "Saturation 94% on 2 L; EtCO2 52.", ok: true}
          - {who: 보호자에게, icon: me, en: "His oxygen saturation is eighty-eight, consistent with hypoventilation.", ok: false, fix: "He isn't breathing deeply enough right now, so we're helping him breathe."}
        why: 의료진끼리는 saturation 수치를 숫자로 말해야 바로 움직일 수 있어요. 가족에게는 saturation과 hypoventilation 같은 말이 낯서니, 지금 몸에서 무슨 일이 생겼고 우리가 무엇을 하는지를 쉬운 말로 알려 줘요.
  5:
    1:
      replace:
        kind: context
        words: [w-lumen]
        word: lumen
        ko: 루멘(관 내경)
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "This lumen already has three drips — let's check each pair.", ok: true}
          - {who: 차트 기록, icon: board, en: "Sedative infusing via dedicated lumen; compatibility chart checked.", ok: true}
          - {who: 보호자에게, icon: me, en: "The sedative runs through its own lumen of the central line.", ok: false, fix: "The sleep medicine goes through its own small channel in the IV in his neck."}
        why: 의료진끼리는 lumen 한 단어로 어느 통로인지 통해요. 가족에게는 lumen과 central line이 낯서니, 약이 어떤 통로로 들어가는지를 쉬운 말로 풀어 줘요.
  7:
    1:
      replace:
        kind: context
        words: [w-bradycardia]
        word: bradycardia
        ko: 서맥
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "No bradycardia so far — dex is at 0.6 and his heart rate is 62.", ok: true}
          - {who: 차트 기록, icon: board, en: "Dexmedetomidine 0.6 mcg/kg/h; no bradycardia, MAP 70.", ok: true}
          - {who: 보호자에게, icon: me, en: "Dexmedetomidine can cause bradycardia and hypotension in some patients.", ok: false, fix: "This medicine keeps him calm without making him too sleepy, but it can slow his heart a bit, so we watch it."}
        why: 의료진끼리는 bradycardia 한 단어와 수치로 바로 말해요. 가족에게는 bradycardia와 hypotension이 겁만 주고 뜻이 안 전해지니, 약이 하는 일과 우리가 살피는 점을 쉬운 말로 알려 줘요.
  8:
    1:
      replace:
        kind: context
        words: [w-opioid]
        word: opioid
        ko: 아편유사제
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "Let's reassess his pain after this opioid dose.", ok: true}
          - {who: 차트 기록, icon: board, en: "Opioid given per order; pain reassessed after the dose.", ok: true}
          - {who: 보호자에게, icon: me, en: "He received a fifty-microgram IV opioid dose.", ok: false, fix: "We gave him pain medicine through his IV, and we'll check how he feels."}
        why: 의료진끼리는 opioid와 용량을 정확히 말해야 서로 중복 투약을 막아요. 가족에게는 opioid와 마이크로그램이 뜻 없이 들리니, 무엇을 했고 그다음 무엇을 보는지를 쉬운 말로 말해요.
    2:
      patch: {words: [w-turn, w-surprise]}
  13:
    1:
      scene_patch:
        1: {en: "Hx alcohol use; withdrawal signs: tremor, diaphoresis; sedation adjusted."}
  15:
    0:
      patch: {words: [w-lactate, w-rise]}
    1:
      replace:
        kind: context
        words: [w-pris]
        word: PRIS
        ko: 프로포폴 주입 증후군
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "Stop the propofol now — this could be PRIS.", ok: true}
          - {who: 차트 기록, icon: board, en: "Propofol stopped at 0310 for suspected PRIS; MD notified.", ok: true}
          - {who: 보호자에게, icon: me, en: "Propofol is causing PRIS with lactic acidosis.", ok: false, fix: "The sleep medicine may be hurting his body, so we're stopping it and giving him a different one."}
        why: 의료진끼리는 PRIS 한 단어로 의심을 짧게 전해요. 가족에게는 PRIS와 lactic acidosis를 원인으로 단정해 던지면 겁만 주니, 약이 몸에 부담이 될 수 있어 바꾼다고 말해요.
  16:
    0:
      replace:
        kind: pair
        words: [w-bagvent, w-call, w-open, w-airway]
        pairs: [[bag-mask, ventilation], [call a, rapid response], [open the, airway]]
        decoys: [the Foley]
        why: 숨이 멈췄으면 bag-mask ventilation, 혼자 하기 어려우면 call a rapid response(병원의 신속대응팀을 부르는 말), 마스크 호흡이 들어가려면 먼저 open the airway예요. 급한 순간일수록 동사와 대상이 짧게 딱 맞는 말을 써요.
    1:
      replace:
        kind: context
        words: [w-crash]
        word: crash
        ko: 급락하다
        scenes:
          - {who: 동료 간호사에게, icon: speech, en: "Pressure's crashing — start the fluids and call for help.", ok: true}
          - {who: 신속대응팀 호출, icon: siren, en: "He's crashing — pressure 68 over 40.", ok: true}
          - {who: 보호자에게, icon: me, en: "His pressure is crashing.", ok: false, fix: "His blood pressure dropped very low, so we're giving him fluid and getting more help."}
        why: 의료진끼리는 crashing으로 상태가 급하게 무너진다는 것을 한 단어로 나눠요. 가족에게는 crashing이 겁만 주니, 무슨 일이 생겼고 지금 무엇을 하는지를 쉬운 말로 말해요.

order:
  4:
    why: 호흡수가 떨어진 보고가 먼저이고, That으로 그 보고를 과진정 가능성으로 연결하고, So로 다음 용량을 보류하고 감시를 요청하며, 마지막 줄의 them은 감시하는 수치를 가리켜요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    line_patch:
      2: {en: "So let's hold the next dose and watch his SpO2 and end-tidal CO2.", ko: "그러니 다음 용량을 보류하고 산소포화도와 호기말 이산화탄소를 지켜봐요", note: 보류}
  9:
    why: 소견을 먼저 말하고, So로 검사를 계획하고, 3줄의 that lactate가 2줄의 검사를 받아 키나아제까지 오르면 초기 PRIS를 뒷받침한다고 해요. 마지막 줄의 With all that이 앞의 소견들을 모아서 순서가 하나예요.
    line_patch:
      2: {en: "On top of that lactate, if his creatine kinase climbs too, that supports early PRIS.", ko: "그 젖산에 더해 크레아틴 키나아제도 같이 오르면 초기 PRIS를 뒷받침해요"}
  10:
    why: 시험을 하겠다는 안내가 먼저이고, 2줄의 this는 그 시험을 가리켜요. 3줄의 During that trial이 1줄의 시험을 받아 차분할 때의 병행을 말하고, 마지막 줄은 시험이 끝난 뒤의 일이라 마지막에 와서 순서가 하나예요.
    line_patch:
      2: {en: "During that trial, if he stays calm, we can pair it with a breathing trial.", ko: "그 시험 동안 차분하면 호흡 시험과 함께 진행할 수 있어요"}
      3: {en: "Once we finish the trial, we'll restart his medicine if he needs it.", ko: "시험이 끝나면 필요할 때 약을 다시 시작해 드릴게요", note: 재시작}
  11:
    why: 방침을 먼저 말하고, That's because로 이유를 대고, Since로 그 이유를 받아 재평가를 말하며, 마지막 줄의 Reassessing first가 3줄의 재평가를 가리켜서 결과를 말해요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    line_patch:
      3: {en: "Reassessing first keeps sedatives to a minimum.", ko: "먼저 다시 평가하면 진정제를 최소로 유지할 수 있어요"}
  13:
    why: 정보를 준 데 먼저 감사하고, That으로 그 정보가 어떤 도움인지 설명해요. 3줄에서 진정 조정 계획을 말하고, 4줄의 As we adjust it이 3줄의 조정을 받아 깨어날 수 있다고 안심시켜서 순서가 하나예요.
    line_patch:
      3: {en: "As we adjust it, he can wake up — sedation isn't a coma.", ko: "조정해 가면 깨어나실 수 있어요, 진정은 혼수가 아니에요"}
  14:
    why: 깊은 진정이 섬망 위험을 키운다는 말이 먼저이고, And로 섬망이 다시 진정을 부르는 반대 방향을 덧붙여 서로 키운다고 말해요. So로 진정을 줄이자고 하고, 4줄의 With him lighter는 3줄에서 가볍게 한 뒤 움직이게 한다는 순서를 가리켜요.
    line_patch:
      1: {en: "And delirium makes us reach for more sedation, so they feed each other.", ko: "그리고 섬망 때문에 진정을 더 쓰게 되니 서로 악순환이 돼요"}
  15:
    why: 의심 근거가 먼저이고, That's why가 그 의심을 이유로 약을 멈추고 바꾸자고 해요. 3줄이 대체 약을 시작하고, 4줄의 While it starts가 3줄의 시작을 받아 그동안의 검사를 말해요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    line_patch:
      3: {en: "While it starts, let's check a CK, potassium, and cardiac rhythm immediately.", ko: "그게 시작되는 동안 CK, 칼륨, 심장 리듬을 즉시 확인해봐요"}
  16:
    ko: 과진정 위기 대응 4문장 순서
    why: 무호흡을 알리며 진정제 중단과 백마스크 환기를 먼저 말하고, While you bag him으로 그 환기를 하는 동안 도움을 요청해요. Next가 혈압 문제로 넘어가고, 마지막 줄의 all of that이 앞의 처치들을 가리켜서 순서가 하나예요.
    line_patch:
      0: {ko: "무호흡이에요 — 진정제를 멈추고 지금 백마스크로 환기해 주세요"}
      1: {en: "While you bag him, I'll call for help.", ko: "백마스크로 환기하는 동안 제가 도움을 요청할게요", icon: siren, note: 호출}
      2: {en: "Next, his pressure — it's crashing, so let's start fluids.", ko: "다음은 혈압인데, 급락하니 수액을 시작해요"}
  17:
    why: 원칙을 먼저 말하고, That's because가 그 원칙의 이유를 대요. So가 그 이유로 투여 전 확인을 말하고, 4줄의 For that이 3줄의 확인을 가리켜서 순서가 하나예요.
    line_patch:
      3: {en: "For that, RASS won't show much, so let's add BIS monitoring.", ko: "그걸 위해 RASS로는 잘 안 드러나니 BIS 감시를 더해요", note: 감시}
  18:
    why: 튜브를 잡으려는 상황을 먼저 알리고, 2줄의 that tube가 그 튜브를 가리켜요. 3줄의 that은 2줄에서 막으려는 상황을 가리켜요. 4줄의 that bolus는 3줄의 볼루스를 가리켜서 순서가 하나예요.
    line_patch:
      3: {en: "Needing that bolus tells us his sedation was too light.", ko: "그 볼루스가 필요했다는 건 진정이 너무 얕았다는 뜻이에요"}
  19:
    why: 서맥 수치를 말하며 주입을 멈추는 것이 먼저이고, 그 주입을 제가 잡고 있는 동안 의사를 불러요. 3줄의 they가 2줄의 의사를 가리켜 의사가 오면 처방대로 주고, After that이 3줄을 받아 혈압 재확인을 말해서 순서가 하나예요.
    line_patch:
      1: {en: "Call the physician while I hold the infusion.", ko: "제가 주입을 멈추는 동안 의사를 불러주세요", note: 호출}
      2: {en: "When they're here, let's give atropine and fluids as ordered.", ko: "의사가 오면 처방대로 아트로핀과 수액을 줘봐요", note: 처치}
      3: {en: "After that, recheck his pressure every few minutes.", ko: "그다음에는 몇 분마다 혈압을 다시 확인해요", note: 감시}
