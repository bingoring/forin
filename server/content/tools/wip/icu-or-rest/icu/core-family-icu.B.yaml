situations:
- title: 면회 안내·환경 설명
  sentences:
  - en: Let me walk you through what you'll see at her bedside.
    ko: 그녀의 침상에서 무엇을 보게 될지 안내해 드릴게요.
    chunks:
    - Let me walk you through
    - what you'll see
    - at her
    - bedside
    - .
    words:
    - w-walk
    - w-bedside
    goal: 1
    tag: 면회 안내
    icon: hospital
    why: Let me walk you through로 시작하면 처음 온 가족에게 모든 것을 하나씩 같이 걷듯 설명하겠다는 뜻이 돼요. what you'll see로 앞으로 눈에 들어올 것을 미리 알려 줘요.
    decoy: what you'll need
    distractorsKo:
    - 그녀의 침상에서 무엇을 듣게 될지 안내해 드릴게요.
    - 그녀의 병실 문 앞에서 무엇을 보게 될지 안내해 드릴게요.
    blank:
      answer: bedside
      options:
      - en: bedside
      - en: bedroom
      - en: bedrail
      - en: bedframe
  - en: There will be monitors and tubes, and that's normal here.
    ko: 모니터와 튜브들이 있을 텐데, 여기서는 정상적인 거예요.
    chunks:
    - There will be
    - monitors and tubes
    - ', and that''s normal'
    - here
    - .
    words:
    - w-monitor
    - w-tube
    - w-normal
    goal: 1
    tag: 환경 설명
    icon: monitor
    why: There will be 뒤에 장비를 나열하고 and that's normal here를 붙이면 낯선 장비가 이상 신호가 아니라 이곳의 평범한 모습이라는 안내가 돼요.
    decoy: in the waiting room
    distractorsKo:
    - 모니터와 펌프들이 있을 텐데, 여기서는 정상적인 거예요.
    - 카메라와 튜브들이 있을 텐데, 여기서는 정상적인 거예요.
    blank:
      answer: normal
      options:
      - en: normal
      - en: unusual
      - en: harmful
      - en: painful
  - en: You can talk to her and hold her hand.
    ko: 말을 걸어도 되고 손을 잡아도 돼요.
    chunks:
    - You can
    - talk to her
    - and hold
    - her hand
    - .
    words:
    - w-talk
    - w-hold
    - w-hand
    goal: 1
    tag: 참여 안내
    icon: handshake2
    why: You can …은 허락과 권유를 함께 담는 틀이에요. 가족이 할 수 있는 일을 구체적인 행동으로 말하면 무엇을 해도 되는지 망설이지 않아요.
    decoy: her blanket
    distractorsKo:
    - 말을 걸어도 되고 발을 만져도 돼요.
    - 노래를 불러도 되고 손을 잡아도 돼요.
    blank:
      answer: talk
      options:
      - en: talk
      - en: shout
      - en: whistle
      - en: complain
  - en: It can feel overwhelming at first, but you'll get used to it.
    ko: 처음엔 압도적으로 느껴질 수 있지만, 곧 익숙해지실 거예요.
