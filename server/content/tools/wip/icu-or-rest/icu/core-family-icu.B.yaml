    why: 처음 온 가족에게는 무엇을 보게 될지부터 안내하고, 그 모습이 정상임을 말한 뒤, 가족이 할 수 있는 일을 알려 주고, 들어가기 전에 시간을 주며 마무리해요.
    lines:
    - en: Let me walk you through what you'll see at her bedside.
      icon: hospital
      ko: 침상에서 보게 될 것을 안내해 드릴게요
