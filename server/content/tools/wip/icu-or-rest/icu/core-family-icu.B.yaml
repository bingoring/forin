      options:
      - en: sounds
      - en: smells
      - en: tastes
      - en: textures
  - en: Take your time before you go in.
    ko: 들어가시기 전에 천천히 시간을 가지세요.
    chunks:
    - Take your time
    - before you
    - go in
    - .
    words:
    - w-time
    goal: 2
    tag: 배려
    icon: coffee
    why: Take your time은 서두르지 않아도 된다는 배려의 표현이에요. before you go in으로 그 시간이 입실 전이라는 것을 정해 줘요.
    decoy: go home
    distractorsKo:
    - 들어가시기 전에 천천히 물을 마시세요.
