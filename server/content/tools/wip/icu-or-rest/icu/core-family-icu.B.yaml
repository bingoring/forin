    icon: faceWorried
    why: overwhelming을 먼저 말해 주면 가족의 느낌을 인정하는 것이 되고, but 뒤에 익숙해질 거라는 말을 붙이면 부담이 줄어요.
    decoy: in the evening
    distractorsKo:
    - 밤에는 압도적으로 느껴질 수 있지만, 곧 익숙해지실 거예요.
