      - en: noon
  - en: The sounds and lights are just part of how we watch over her.
    ko: 소리와 불빛은 저희가 그녀를 지켜보는 방식의 일부예요.
    chunks:
    - The sounds and lights
    - are just part
    - of how we watch
    - over her
    - .
    words:
    - w-sound
    - w-light
    - w-watch
    goal: 1
    tag: 환경 설명
    icon: speaker
    why: just part of …는 소리와 불빛이 위험 신호가 아니라 돌봄의 일부라는 뜻을 가볍게 전해요. how we watch over her로 누가 무엇을 하는지 분명히 해요.
    decoy: for her family
    distractorsKo:
    - 소리와 냄새는 저희가 그녀를 지켜보는 방식의 일부예요.
    - 소리와 불빛은 저희가 그녀를 지켜보는 방식의 전부예요.
