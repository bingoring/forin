# 11. 새 단어 (word-add)
new_words:
  - id: w-clearly
    en: clearly
    ipa: "/ˈklɪrli/"
    ko: 또렷하게
    icon: speaker
    example: Seeing and hearing clearly helps you stay oriented.
    exKo: 잘 보고 잘 들리면 지남력을 유지하는 데 도움이 돼요.
    cue: 안경·보청기를 끼운 뒤 잘 보이고 들리는지 물을 때
    tag: 소통·안심
    distractorsEn: [cleverly, closely]
    distractorsKo: [희미하게, 크게]
    chips: [[clear, ly]]
    decoyChips: [clean]
    insert_after: w-clear

# 20. 삭제할 단어(고아가 됨)
remove_words: [w-reinsert, w-short, w-acting, w-attention, w-assume, w-room, w-week]

