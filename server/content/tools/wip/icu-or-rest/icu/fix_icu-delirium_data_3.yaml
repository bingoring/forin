  w-bowel:       {ko: "장(창자)"}
  w-escalate:    {ko: "(단계적으로) 올리다", distractorsKo: ["(단계적으로) 줄이다", "(단계적으로) 끊다"]}
  w-tell:        {ko: "알려 주다"}
  w-fully:       {ko: "온전히"}
