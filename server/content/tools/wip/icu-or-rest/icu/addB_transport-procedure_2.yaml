- title: 이송 중 모니터·라인 관리
  s:
  - ["지속 감시", monitor, "continuously는 가끔이 아니라 쉬지 않고라는 뜻이에요. during transport로 감시가 이송이 끝날 때까지 이어진다고 범위를 말해요.", "for the doctor", "이송하는 동안 산소 튜빙을 계속 지켜보고 있어요.", "이송하는 동안 폴대를 계속 지켜보고 있어요.", "monitor", "wheels", "door", "hallway"]
  - ["라인 보고", shield, "secured는 누군가 고정해서 안전해졌다는 수동태예요. and free of tension으로 당김까지 없다고 덧붙이면 빠질 위험이 낮다는 보고가 돼요.", "and kinked", "모든 라인이 고정됐고 꼬임도 없어요.", "모든 라인이 고정됐고 누출도 없어요.", "tension", "bubbles", "dust", "fluid"]
  - ["튜빙 위치", gear, "clear of는 닿지 않고 떨어져 있다는 뜻이에요. 산소 튜빙이 바퀴에 말리면 공급이 끊겨서 위치를 구체적으로 말해요.", "of the sheet", "산소 튜빙이 난간에서 벗어나 있어요.", "산소 튜빙이 폴대에서 벗어나 있어요.", "wheels", "walls", "floors", "doors"]
  - ["수치 보고", chartup, "looks steady는 눈으로 본 수치가 일정하다는 뜻이에요. so far를 붙여 지금까지는 그렇다고 한정해서 과장하지 않아요.", "since lunch", "지금까지 체온 수치는 안정적이에요.", "지금까지 혈당 수치는 안정적이에요.", "steady", "low", "erratic", "high"]
  - ["폴대 위치", board, "close to는 가까이 붙여 둔다는 뜻이에요. 폴대가 멀리 떨어지면 라인이 당겨져서 침대와 함께 움직이게 둬요.", "the monitor cable", "수액 폴대는 침대 발치 가까이 둘게요.", "산소통은 침대 난간 가까이 둘게요.", "pole", "tank", "stool", "cart"]
  - ["꼬임 요청", speech, "Let me know는 알려 달라는 부탁을 부드럽게 하는 말이에요. 같이 가는 사람 눈이 나보다 먼저 꼬임을 볼 수 있어서 요청해요.", "any dust", "튜빙에 물방울이 보이면 알려 주세요.", "튜빙에 얼룩이 보이면 알려 주세요.", "kinks", "stains", "splashes", "labels"]
  - ["진행 보고", plane, "We're halfway는 남은 거리를 함께 가늠하게 해 주는 말이에요. now를 붙여 지금 이 순간의 위치라고 알려요.", "to the lobby", "지금 영상의학과까지 거의 다 왔어요.", "지금 약국까지 절반쯤 왔어요.", "radiology", "pharmacy", "dialysis", "endoscopy"]
