- situation: "혈소판 수혈 적응 판단"
  items:
    - kind: slider
      words: [w-platelet, w-hold, w-recheck]
      cue: "Colleague: \"His platelets are forty thousand, he isn't bleeding, and no procedure is planned.\""
      scale: ["recheck the count later", "ask the provider about transfusing", "transfuse right away"]
      answerAt: 0
      why: "활동성 출혈이 없고 시술 계획도 없으면 보통 예방적 수혈 역치(흔히 1만) 위의 수치에서는 수혈하지 않고 수치를 다시 확인해요. 기준은 병원과 환자에 따라 달라서 처방을 따르고, 출혈이 시작되거나 시술이 잡히면 기준이 달라져요."
      example: "So we can hold off and just recheck his count later."
      exKo: "그러니 보류하고 나중에 수치만 다시 확인하면 돼요."
    - kind: context
      words: [w-threshold]
      word: threshold
      ko: 역치
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll ask which threshold applies for him today.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "The threshold is higher if he's going for a procedure.", ok: true}
        - {who: 가족에게, icon: me, en: "His platelets are below the prophylactic transfusion threshold of ten thousand.", ok: false, fix: "His platelet number is low, so we're asking the doctor whether he needs a transfusion."}
      why: "의료진끼리는 threshold를 숫자와 함께 말하면 정확해요. 가족에게는 prophylactic·threshold와 숫자가 한꺼번에 나오면 어려워요. 수치가 낮다는 사실과 지금 하는 일만 쉬운 말로 알려 줘요."
- situation: "알레르기·발열 반응 관리"
  items:
    - kind: slider
      words: [w-wheeze, w-escalate, w-stop]
      cue: "Patient mid-transfusion: \"I'm itchy all over and my throat feels tight.\""
      scale: ["pause the blood and watch him closely", "pause and give an antihistamine", "stop the blood and call for help"]
      answerAt: 2
      why: "가려움에 목이 조이는 느낌이 더해지면 기도·호흡 증상이라 가벼운 알레르기로 보지 않아요. 수혈을 멈추고 새 튜빙으로 생리식염수 라인을 열어 둔 채 즉시 의료진과 팀을 불러요. 항히스타민제 투여는 처방대로예요."
      example: "If she develops wheezing, I'll stop and escalate."
      exKo: "쌕쌕거림이 생기면 멈추고 상급 보고할게요."
    - kind: context
      words: [w-mild]
      word: mild
      ko: 경미한
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "She has mild hives, so I paused the unit.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "It's mild, just a little redness on her arm.", ok: true}
        - {who: 환자에게, icon: me, en: "You're presenting with a mild urticarial reaction.", ok: false, fix: "You have a few itchy bumps, so I've paused the blood and I'm staying right here with you."}
      why: "의료진끼리는 mild 같은 중증도 표현으로 상태를 정확하게 전해요. 환자에게는 presenting·urticarial 같은 말이 낯설고 딱딱해요. 지금 보이는 것과 하고 있는 일을 쉬운 말로 알려 줘요."
    - kind: swap
      words: [w-hives]
      who: "환자에게 · 증상 설명"
      icon: me
      before: ["You have ", "urticaria", " from the blood, but it looks mild."]
      options: [a few itchy bumps, urticaria, a blood clot]
      answer: a few itchy bumps
      notes: {a few itchy bumps: "환자가 알아듣는 쉬운 말로 보이는 모습을 그대로 말한다.", urticaria: "두드러기의 의학 용어라 의료진끼리는 맞지만 환자는 알아듣기 어렵다.", a blood clot: "문장은 이어지지만 사실과 다른 무서운 말이라 환자를 불안하게 한다."}
      ko: 피 때문에 가려운 두드러기가 조금 올라왔는데 가벼워 보여요
      why: "환자에게는 hives나 urticaria 같은 용어보다 눈에 보이는 모습을 쉬운 말로 알려 줘요."
- situation: "수혈 거부 환자 관리"
  items:
    - kind: slider
      words: [w-respect, w-decision, w-document]
      cue: "Patient: \"I'm a Jehovah's Witness. I don't want any blood, no matter what.\""
      scale: ["try to change his mind about it", "ask the family to decide for him", "document it and tell the team"]
      answerAt: 2
      why: "판단 능력이 있는 환자가 수혈을 거부하면 그 결정을 존중해요. 다시 설득하거나 가족이 대신 정하게 하지 않고, 뜻을 기록해 팀 전체가 알게 해요. 받아들이는 성분은 사람마다 달라서 어디까지인지 구체적으로 물어봐요."
      example: "I respect your decision and I'll document your wishes."
      exKo: "결정을 존중하고 뜻을 기록해 둘게요."
    - kind: context
      words: [w-respect]
      word: respect
      ko: 존중하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I respect his decision, and I've documented his wishes.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Please respect her wishes — she has said no blood.", ok: true}
        - {who: 환자에게, icon: me, en: "Your refusal of allogeneic blood products will be respected per hospital policy.", ok: false, fix: "I hear you, and we will honor your decision about blood."}
      why: "의료진끼리는 respect와 기록했다는 말로 짧게 전달해요. 환자에게는 allogeneic·per hospital policy 같은 말이 규정을 읽어 주는 것처럼 차갑게 들려요. 환자의 결정을 들었다고 쉬운 말로 말해 줘요."
- situation: "대량수혈 프로토콜 발동·조율"
  items:
    - kind: slider
      words: [w-assign, w-role]
      cue: "Colleague: \"The cooler is here, but nobody has a job yet.\""
      scale: ["wait for someone to start on their own", "ask one person to help out", "give everyone a clear role"]
      answerAt: 2
      why: "대량수혈에서는 추적, 주입, 기록처럼 역할을 한 사람씩 정해 줘야 빠뜨리는 게 없어요. 누가 시작하길 기다리거나 한 사람에게만 맡기면 제제 번호와 시간을 놓쳐요."
      example: "Everyone, take your assigned role and let's move."
      exKo: "모두 배정된 역할을 맡고 움직입시다."
    - kind: context
      words: [w-track]
      word: track
      ko: 추적하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'm tracking every unit and logging the numbers.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "You track products, I'll run the infuser.", ok: true}
        - {who: 가족에게, icon: me, en: "We're tracking cumulative product utilization against the ratio protocol.", ok: false, fix: "We're keeping careful count of every bag of blood he's getting."}
      why: "의료진끼리는 track과 product 같은 말로 역할과 일을 빠르게 나눠요. 가족에게는 cumulative product utilization 같은 말이 딱딱하고 이해하기 어려워요. 무엇을 세고 있는지 쉬운 말로 알려 줘요."
- situation: "급성 용혈 아나필락시스 위기"
  items:
    - kind: slider
      words: [w-stridor, w-stop, w-hypotensive]
      cue: "Colleague: \"Her voice is hoarse and her pressure is falling right after the unit started.\""
      scale: ["slow the blood and watch her closely", "pause it and recheck vitals", "stop it and call for help now"]
      answerAt: 2
      why: "수혈 직후의 쉰 목소리와 저혈압은 아나필락시스 신호일 수 있어요. 수혈을 멈추고 새 튜빙으로 라인을 유지한 채 즉시 도움과 에피네프린을 요청해요. 근육주사는 처방이나 병원의 아나필락시스 프로토콜대로 해요. 속도를 줄이거나 지켜보는 동안에도 혈액이 계속 들어가요."
      example: "Stop the transfusion — I'm giving IM epinephrine now."
      exKo: "수혈을 멈추고 근육주사로 에피네프린을 지금 줄게요."
    - kind: context
      words: [w-airway]
      word: airway
      ko: 기도
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Her airway is compromised, so I'm preparing to intubate.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Keep her airway open while I get the epi.", ok: true}
        - {who: 가족에게, icon: me, en: "Her airway is compromised and she may require emergent intubation.", ok: false, fix: "She's having trouble breathing, so we're getting ready to put in a breathing tube."}
      why: "의료진끼리는 airway와 intubation을 그대로 말해야 빠르고 정확해요. 가족에게는 compromised·emergent intubation이 겁을 주고 이해하기 어려워요. 무슨 일이 있고 무엇을 준비하는지 쉬운 말로 알려 줘요."
- situation: "DIC 출혈·혈전 동반 위기"
  items:
    - kind: slider
      words: [w-replace, w-underlying, w-treat]
      cue: "Colleague: \"His labs say DIC and he's oozing everywhere. Do we just give more plasma?\""
      scale: ["just watch the oozing and wait", "replace only what the labs show is low", "replace it and treat the cause too"]
      answerAt: 2
      why: "DIC에서는 성분 보충(섬유소원·혈소판·혈장)만으로는 부족하고 원인(패혈증 등)을 함께 치료해야 해요. 보충은 검사 결과에 따라 처방대로 하고, 스며 나오는 것만 지켜보며 기다리면 출혈이 계속돼요."
      example: "The key is treating the underlying trigger."
      exKo: "핵심은 근본 유발 요인을 치료하는 거예요."
    - kind: context
      words: [w-site]
      word: site
      ko: 부위
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "He's bleeding from every puncture site.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Check every site and line for new oozing.", ok: true}
        - {who: 가족에게, icon: me, en: "There is hemorrhage from each venipuncture site secondary to consumptive coagulopathy.", ok: false, fix: "He's bleeding from every spot where we put in a needle, because his blood isn't clotting right now."}
      why: "의료진끼리는 puncture site 같은 말로 어디에서 출혈이 나는지 정확히 말해요. 가족에게는 hemorrhage·venipuncture·consumptive coagulopathy가 어렵고 겁을 줘요. 어디에서 왜 피가 나는지 쉬운 말로 알려 줘요."
- situation: "TRALI 급성 호흡부전 위기"
  items:
    - kind: slider
      words: [w-stop, w-bloodbank, w-report]
      cue: "Colleague: \"Her filling pressures are normal and she's gasping right after the plasma.\""
      scale: ["slow the plasma down and keep watching her", "pause it and recheck in a minute or two", "stop it and report to the blood bank"]
      answerAt: 2
      why: "수혈 직후의 급성 호흡부전에 충만압이 정상이면 TRALI를 의심해요. 수혈을 멈추고 호흡을 지지하며 혈액은행에 바로 알려요. 공여자 조사가 필요하기 때문이에요. 천천히 줄이거나 잠깐 멈췄다 다시 보면 같은 혈장이 계속 들어갈 수 있어요."
      example: "Report the reaction to the blood bank."
      exKo: "이 반응을 혈액은행에 보고하세요."
    - kind: context
      words: [w-report]
      word: report
      ko: 보고하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll report the reaction and send back the bag.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Report the reaction to the blood bank right away.", ok: true}
        - {who: 가족에게, icon: me, en: "We are required to report this as a suspected TRALI case to hemovigilance.", ok: false, fix: "We're telling the blood bank about this so they can check the blood and keep other patients safe."}
      why: "의료진끼리는 report로 짧게 지시하고 보고해요. 가족에게는 hemovigilance 같은 제도 용어가 낯설고 걱정만 키워요. 왜 알리는지 쉬운 말로 알려 줘요."
- situation: "대량수혈 저칼슘 심정지 위기"
  items:
    - kind: slider
      words: [w-compression, w-qt, w-call]
      cue: "Colleague: \"His QT is stretching, but he still has a pulse and a pressure.\""
      scale: ["keep watching the monitor for a while", "push calcium and call the provider", "start chest compressions"]
      answerAt: 1
      why: "맥박과 혈압이 있으면 가슴압박은 하지 않아요. QT가 늘어난 저칼슘 위기에서는 처방이나 프로토콜대로 칼슘을 주고 의료진을 불러요. 지켜보기만 하면 심정지로 갈 수 있어요. 맥박이 없어지면 그때 압박을 시작하고 코드를 불러요."
      example: "Start compressions and call the code."
      exKo: "흉부압박을 시작하고 코드를 부르세요."
    - kind: context
      words: [w-code]
      word: code
      ko: 코드 (응급 소집)
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "If he loses his pulse, we'll have to call a code.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Push the calcium now, before he codes.", ok: true}
        - {who: 가족에게, icon: me, en: "He's about to code, so we need you to step out.", ok: false, fix: "His heart may stop, so we need to ask you to step outside so the team can work."}
      why: "의료진끼리는 code가 심정지 응급 호출을 뜻하는 짧은 말이에요. 가족에게는 code라는 은어가 무슨 뜻인지 모르고, 곧 죽는다는 말로 들려 충격이 커요. 무슨 일이 생길 수 있고 왜 자리를 비켜야 하는지 쉬운 말로 알려 줘요."
- situation: "수혈 불응 지속출혈 목표 소통"
  items:
    - kind: slider
      words: [w-honest, w-realistic]
      cue: "Daughter: \"Is he going to be okay?\""
      scale: ["tell her not to worry, it will be fine", "say you can't talk about it", "be honest and bring the provider"]
      answerAt: 2
      why: "거짓 안심은 가족의 판단을 흐려요. 지금 보고 있는 사실을 솔직하게 말하고, 예후는 의료진이 함께 설명하도록 연결해요. 말을 피하는 것도 가족에게는 정보를 숨기는 것으로 느껴져요."
      example: "I want to be honest with you about what we're seeing."
      exKo: "지금 보고 있는 상황을 솔직하게 말씀드리고 싶어요."
    - kind: context
      words: [w-honest]
      word: honest
      ko: 솔직한
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll be honest, I'm worried he isn't responding to the products.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Let's be honest with each other about how he's doing.", ok: true}
        - {who: 가족에게, icon: me, en: "To be honest, his prognosis is poor and further transfusion is likely futile.", ok: false, fix: "I'm worried. Even with all this blood, the bleeding hasn't stopped, and I'd like us to sit down together with the doctor."}
      why: "솔직함은 의료진끼리는 걱정을 바로 나누는 말이에요. 가족에게는 prognosis·futile 같은 판정을 숫자 없이 던지면 차갑고 충격적이에요. 걱정스러운 사실을 부드럽게 말하고 의료진과 함께 이야기하자고 해요."
