      decoys: ["resuscitation"]
      why: "DOPE는 갑자기 산소가 떨어질 때 원인을 순서대로 떠올리는 약자예요. D는 튜브 위치 이탈, O는 폐색, P는 기흉, E는 장비 문제를 가리켜요."
    - kind: context
      words: [w-displacement]
      word: displacement
      ko: 위치 이탈
      scenes:
        - {who: 동료 간호사에게, icon: monitor, en: "Check for tube displacement first, then obstruction.", ok: true}
        - {who: 차트 기록, icon: board, en: "No tube displacement, ETT 22 at the lip.", ok: true}
        - {who: 가족에게, icon: me, en: "There's no displacement of his endotracheal tube.", ok: false, fix: "His breathing tube hasn't slipped out of place."}
      why: "tube displacement는 의료진끼리 정확하고 짧은 말이에요. 가족에게는 endotracheal tube와 displacement가 어려우니, 숨관이 제자리에 있다고 풀어 말해요."
- sit: 16
  items:
    - kind: slider
      words: [w-diminished, w-sound, w-pneumothorax]
      cue: "Nurse: \"On the left side I hear no breath sounds at all, the pressures keep climbing, and the trachea is shifting.\""
      scale: ["equal", "diminished", "absent"]
      answerAt: 2
      why: "소리가 아예 들리지 않으면 absent예요. 줄었지만 들리면 diminished이고, 한쪽이 안 들리면서 압력이 오르고 기관이 밀리면 긴장성 기흉을 의심해 바로 도움을 불러요."
      example: "Diminished breath sounds and high pressures point to a pneumothorax."
      exKo: "호흡음 감소와 높은 압력은 기흉을 가리켜요."
    - kind: swap
      words: [w-pneumothorax, w-emergency]
      who: 가족에게 · 기흉 설명
      icon: me
      before: ["He has a ", "pneumothorax", ", and we're acting on it right now."]
      options: ["pneumothorax", "pocket of air squeezing his lung", "tension PTX"]
      answer: "pocket of air squeezing his lung"
      notes: {"pneumothorax": "의료진끼리 쓰는 정확한 말이에요. 가족에게는 낯설고 무겁게 들려요.", "pocket of air squeezing his lung": "무슨 일이 일어났는지 쉬운 말로 알려 줘요. 이어지는 '지금 조치한다'와도 자연스러워요.", "tension PTX": "약어라 가족에게는 의미가 없어요."}
      why: "기흉은 폐 바깥으로 공기가 새어 폐를 누르는 상태예요. 가족에게는 이름보다 무슨 일이 생겼고 지금 무엇을 하는지를 쉬운 말로 전해요."
      ko: 폐를 누르는 공기 주머니가 생겨서, 지금 바로 조치하고 있어요
