      why: "PaCO2가 오르고 pH가 내려간 것은 이산화탄소가 쌓여 피가 더 산성이 됐다는 뜻이에요. 가족에게는 결과의 의미를 이렇게 풀어 전해요."
      ko: 이번 검사에서 이산화탄소가 쌓이고 피가 조금 더 산성이라, 의사에게 전화할게요
- sit: 15
  items:
    - kind: pair
      words: [w-displacement, w-obstruction, w-pneumothorax, w-equipment]
