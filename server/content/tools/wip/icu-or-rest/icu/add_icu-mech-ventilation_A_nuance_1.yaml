      example: "Breath sounds are diminished on the left side."
      exKo: "왼쪽 호흡음이 감소돼 있어요."
    - kind: swap
      words: [w-diminished, w-depth]
      who: 가족에게 · 사정 결과 설명
      icon: me
      before: ["I hear ", "diminished breath sounds", ", so I'll check the tube depth."]
      options: ["diminished breath sounds", "less air going in on one side", "BS decreased on the left"]
      answer: "less air going in on one side"
      notes: {"diminished breath sounds": "의료진끼리 쓰는 정확한 말이에요. 가족에게는 뜻이 바로 와닿지 않아요.", "less air going in on one side": "무슨 일이 일어났는지 쉬운 말로 알려 줘요. 이어지는 '튜브 깊이 확인'과도 자연스럽게 이어져요.", "BS decreased on the left": "차트용 약어라 말로 하면 알아듣기 어려워요."}
      why: "같은 소견도 의료진에게는 diminished breath sounds, 가족에게는 쉬운 말로 풀어 전해요."
      ko: 한쪽으로 공기가 덜 들어가는 소리가 나서 튜브 깊이를 확인할게요
