# 상황 번호(0부터) → nuance 문항
- sit: 0
  items:
    - kind: slider
      words: [w-verify]
      cue: "Nurse: \"I'll read each number off the vent, and you compare every one against the flowsheet, line by line.\""
      scale: ["glance at", "check", "verify"]
      answerAt: 2
      why: "숫자를 하나하나 맞대어 틀린 데가 없는지 따져 보는 일은 verify예요. check는 이상이 없는지 훑어보는 정도이고, glance at은 슬쩍 보는 것이라 설정 기록 확인에는 약해요."
      example: "Please verify the settings on the flowsheet before we chart them."
      exKo: "기록하기 전에 기록지에서 설정을 재확인해 주세요."
    - kind: context
      words: [w-chart]
      word: chart
      ko: 기록하다
      scenes:
        - {who: 동료 간호사에게, icon: monitor, en: "Let's chart these settings after we both confirm them.", ok: true}
        - {who: 기록 지시, icon: board, en: "Chart the FiO2 and PEEP exactly as set on the vent.", ok: true}
        - {who: 가족에게, icon: me, en: "I'll chart his Vt, FiO2, and PEEP per protocol.", ok: false, fix: "I'll write down his settings so everyone on the team can see them."}
      why: "의료진끼리는 chart를 동사로 짧게 쓰고 Vt·FiO2 같은 약어도 통해요. 가족에게는 약어와 protocol이 낯설고 사무적으로 들리니, 무엇을 하는지 풀어서 말해요."
- sit: 1
  items:
    - kind: slider
      words: [w-cuff, w-seal, w-hurt]
      cue: "Nurse: \"The cuff pressure is just right — no air gets past it, and it isn't pressing hard on his airway wall.\""
      scale: ["leaks", "seals", "injures"]
      answerAt: 1
      why: "커프 압력이 너무 낮으면 공기가 새고(leaks), 너무 높으면 기관 벽을 다치게 해요(injures). 새지도 해치지도 않는 적정 압력이 seals예요."
      example: "The cuff seals the airway so the breaths go into his lungs."
      exKo: "커프가 기도를 막아 줘서 숨이 폐로 들어가요."
    - kind: swap
      words: [w-tube, w-lip]
      who: 가족에게 · 튜브 위치 설명
      icon: me
      before: ["Your husband's breathing tube is ", "ETT 22 at the lip", "."]
      options: ["ETT 22 at the lip", "in the right place", "positioned per protocol"]
      answer: "in the right place"
      notes: {"ETT 22 at the lip": "차트에 적는 말이에요. 가족은 약어도 숫자의 뜻도 알아듣기 어려워요.", "in the right place": "가족이 바로 이해하는 쉬운 말이에요. 확인한 사실을 그대로 전해요.", "positioned per protocol": "사무적으로 들려서, 정작 위치가 맞는지는 알려 주지 못해요."}
      why: "튜브 깊이를 숫자로 확인했더라도 가족에게는 결과를 쉬운 말로 전해요. 숫자는 차트와 의료진끼리의 말이에요."
      ko: 남편분의 숨관은 제 위치에 있어요
- sit: 2
  items:
