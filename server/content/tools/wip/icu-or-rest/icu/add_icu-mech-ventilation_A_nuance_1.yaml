- sit: 13
  items:
    - kind: slider
      words: [w-dip, w-brief]
      cue: "Nurse: \"His oxygen fell for a few seconds after the suction and came back up on its own. That's ___.\""
      scale: ["a brief dip", "a lasting drop", "a crash"]
      answerAt: 0
      why: "흡인 후 산소가 몇 초 떨어졌다 스스로 돌아오는 것은 brief dip이에요. 오래 이어지거나 회복되지 않으면 lasting drop이라 보고가 필요해요."
      example: "A brief dip after suctioning is common."
      exKo: "흡인 후에 잠깐 떨어지는 건 흔해요."
    - kind: context
      words: [w-dip]
      word: dip
      ko: 잠깐 떨어짐
      scenes:
        - {who: 동료 간호사에게, icon: monitor, en: "He had a brief dip after suction, but it's coming back up.", ok: true}
        - {who: 차트 기록, icon: board, en: "Brief SpO2 dip after suctioning, recovered with extra breaths.", ok: true}
        - {who: 가족에게, icon: me, en: "He had a transient dip in saturation post-suction.", ok: false, fix: "His oxygen dropped for a moment after the suction, and it's already coming back."}
      why: "의료진끼리는 transient dip, saturation, post-suction 같은 말이 빠르고 정확해요. 가족에게는 어려워서 무엇이 얼마나 일어났는지 풀어 말해요."
