situations:
- title: 락툴로오스 투여·배변 관리
  s:
  - ["약 설명", pill, "'helps clear'는 약이 혼자 해결한다는 뜻이 아니라 몸이 내보내는 일을 돕는다는 표현이에요. 환자에게 약의 역할을 정직하게 알려 줘요.", "from the blood", "네, 이 약은 소변을 통해 독소를 맑게 배출하도록 도와줘요.", "네, 이 약은 장을 통해 수분을 맑게 배출하도록 도와줘요.", "bowels", "kidneys", "lungs", "skin"]
  - ["배변 목표", calendar, "'aim for'는 정해진 횟수가 아니라 목표라고 말해서 환자가 숫자에 부담을 갖지 않게 해요. 'a few'는 몇 번이라는 대략의 횟수예요.", "no more than", "하루에 몇 번 소변을 보는 걸 목표로 해요.", "하룻밤에 몇 번 무른 변을 보는 걸 목표로 해요.", "soft", "hard", "dry", "small"]
  - ["치료 의미", shield, "'an important part of'는 이 약이 전체 치료의 한 축이라는 점을 말해 환자가 불편해도 계속하게 도와요.", "one piece of", "그건 가려움을 줄이는 데 중요한 부분이에요.", "그건 피를 맑게 하는 데 중요한 부분이에요.", "confusion", "bleeding", "itching", "swelling"]
  - ["작용 원리", lab, "'by pulling … out'은 약이 일하는 방식을 눈에 보이듯 알려 줘요. 장에서 암모니아가 빠져나가면 혈액 속 양이 줄어요.", "that is pulling", "락툴로오스는 소변을 통해 암모니아를 빼내는 방식으로 작용해요.", "락툴로오스는 장을 통해 염분을 빼내는 방식으로 작용해요.", "ammonia", "oxygen", "insulin", "calcium"]
  - ["횟수 세기", pencil, "'Let's'로 말하면 간호사가 혼자 세는 게 아니라 환자와 함께 센다는 느낌이 돼요. 횟수는 약 용량이 맞는지 보는 단서예요.", "how long", "오늘 몇 번 화장실에 가시는지 기록해 둘게요.", "오늘 몇 번 화장실에 가시는지 보고할게요.", "go", "eat", "sleep", "cough"]
  - ["용량 조정", gear, "'If … too watery'는 조정이 필요한 조건을 분명히 말해 줘요. 'can'은 필요하면 조정할 수 있다는 가능성을 알려 환자를 안심시켜요.", "even though", "변이 너무 묽어지면 피부를 보호할 수 있어요.", "변이 너무 묽어지면 시트를 교체할 수 있어요.", "dose", "bed", "light", "tray"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 락툴로오스 설명 4문장 순서
    why: 약이 하는 일을 먼저 알리고, 목표를 정한 뒤, 목표를 위해 횟수를 세고, 그 횟수가 넘치면 용량을 조정한다고 말해요.
    lines:
    - ["Yes, the medicine helps clear the toxins through your bowels.", pill, "네, 이 약은 장을 통해 독소를 맑게 배출하도록 도와줘요", "설명"]
    - ["We aim for a few soft stools a day.", calendar, "하루에 몇 번 무른 변을 보는 걸 목표로 해요", "목표"]
    - ["To track that, let's count how many times you go today.", pencil, "그걸 확인하려고 오늘 몇 번 가시는지 세어 볼게요", "세기"]
    - ["If the count runs high and the stools get watery, we can adjust the dose.", gear, "횟수가 많고 변이 묽어지면 용량을 조정할 수 있어요", "조정"]
- title: 출혈 경향 감시
  s:
  - ["원인 설명", stetho, "'and it's struggling now'로 현재 상태를 덧붙이면 왜 지금 멍이 쉽게 생기는지 이유가 이어져요. 응고인자는 간에서 만들어요.", "that it has", "신장은 응고인자를 만드는데, 지금 그 일을 힘겨워하고 있어요.", "간은 응고인자를 없애는데, 지금 그 일을 힘겨워하고 있어요.", "struggling", "thriving", "healing", "sleeping"]
  - ["출혈 감시", magnify, "'closely'는 건너뛰지 않고 자주 살핀다는 약속이에요. 멍과 출혈은 응고장애의 가장 눈에 띄는 징후예요.", "to look at", "멍이나 출혈이 있는지 자세히 정리해요.", "멍이나 출혈이 있는지 자세히 전달해요.", "bruising", "itching", "coughing", "sweating"]
  - ["즉시 알림", bell, "'right away'는 기다리지 말고 바로 알리라는 신호예요. 새 출혈은 응고장애에서 빠른 평가가 필요한 변화예요.", "at the front", "새로운 통증이 있으면 바로 저에게 알려 주세요.", "새로운 가려움이 있으면 바로 저에게 알려 주세요.", "itching", "cough", "sneezing", "hiccups"]
  - ["멍 예고", bandage, "'You may notice'로 미리 말해 두면 멍이 생겨도 환자가 놀라지 않아요. 간부전에서는 가벼운 압박에도 멍이 잘 생겨요.", "to notice", "팔과 다리에 붓기가 더 생긴 걸 알아차리실 수도 있어요.", "팔과 가슴에 멍이 더 생긴 걸 알아차리실 수도 있어요.", "bruises", "blisters", "freckles", "wrinkles"]
  - ["칫솔 안내", lock, "'so'로 이유를 붙이면 부드러운 칫솔을 쓰는 까닭이 바로 이해돼요. 잇몸은 응고가 약할 때 가장 먼저 피가 나는 곳이에요.", "an electric", "입술에서 피가 나지 않게 부드러운 연고를 써 주세요.", "코에서 피가 나지 않게 부드러운 휴지를 써 주세요.", "gums", "lips", "nose", "ears"]
  - ["주사 부위", check, "'extra'는 평소보다 더 많은 배어 나옴을 뜻해요. 응고가 약하면 주사 부위가 오래 새서 부위를 따로 살펴요.", "for any", "주사 부위에서 더 배어 나오는 게 있는지 알려 드릴게요.", "주사 부위에서 더 배어 나오는 게 있는지 사진 찍을게요.", "injection", "dental", "nasal", "ankle"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 출혈 경향 안내 4문장 순서
    why: 간이 응고인자를 못 만든다는 원인을 말하고, 그래서 생길 멍을 예고한 뒤, 칫솔 같은 예방을 안내하고 새 출혈은 바로 알리라고 마무리해요.
    lines:
    - ["Your liver makes clotting factors, and it's struggling now.", stetho, "간은 응고인자를 만드는데, 지금 힘겨워하고 있어요", "원인"]
    - ["That's why you may notice more bruises on your arms and legs.", bandage, "그래서 팔과 다리에 멍이 더 생길 수 있어요", "예고"]
    - ["Please use a soft toothbrush so your gums don't bleed.", lock, "잇몸에서 피가 나지 않게 부드러운 칫솔을 써 주세요", "예방"]
    - ["Please tell me right away about any new bleeding, gums included.", bell, "잇몸을 포함해 새로운 출혈이 있으면 바로 알려 주세요", "알림"]
