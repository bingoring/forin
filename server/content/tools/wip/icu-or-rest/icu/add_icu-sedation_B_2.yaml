- title: 통증 우선 평가
  s:
  - t: 통증 우선
    i: pill
    w: treat his pain before we touch …는 before로 먼저 할 일과 나중 일을 가르는 모양이에요. touch는 여기서 약을 조정한다는 뜻으로 쓴 완곡한 동사예요.
    d: in the hallway
    k: [침상을 건드리기 전에 통증부터 다뤄봐요., 산소를 건드리기 전에 통증부터 다뤄봐요.]
    a: before
    o: [after, until, while]
  - t: 원인 추정
    i: faceWorried
    w: with suctioning은 어떤 자극에 반응하는지 말해요. could be는 확정하지 않고 가능성으로 말하는 완충이라 추정을 안전하게 전해요.
    d: in the next bed
    k: [체위를 바꿀 때마다 얼굴을 찡그리니 통증이 원인일 수 있어요., 기침할 때마다 얼굴을 찡그리니 통증이 원인일 수 있어요.]
    a: suctioning
    o: [bathing, feeding, walking]
  - t: 순서 안내
    i: board
    w: first … then …은 두 단계를 말하는 순서로 못 박는 모양이에요. 동사 없이 명사만 놓아 지시가 짧고 분명하게 들려요.
    d: on the tray
    k: ['진통을 먼저 하고, 그다음 진정 일정을 다시 평가해요.', '진통을 먼저 하고, 그다음 운동 필요성을 다시 평가해요.']
    a: first
    o: [last, alone, twice]
  - t: 진통제 투여
    i: pill
    w: before we touch anything else는 다른 모든 조정보다 앞선다는 뜻이에요. pain medicine을 객체로 두어 무엇을 먼저 주는지 분명히 해요.
    d: to the pharmacy
    k: [다른 건 정리하기 전에 진통제부터 줘봐요., 침대는 올리기 전에 진통제부터 줘봐요.]
    a: pain
    o: [cough, cold, stomach]
  - t: 재평가 시점
    i: monitor
    w: Once …는 앞 조건이 이루어진 다음에라는 시점을 알려 줘요. 통증이 조절된 뒤에야 진정 수준을 다시 본다는 순서가 담겨요.
    d: on the board
    k: [통증이 기록되면 그때 다시 진정 수준을 살펴봐요., 통증이 조절되면 그때 다시 체온을 살펴봐요.]
    a: Once
    o: [Until, Unless, Although]
  - t: 팀 전달
    i: speech
    w: pass … along to는 받은 정보를 다음 사람에게 넘겨 준다는 구동사예요. the rest of the team이라고 해서 이 지시가 한 사람에게서 끝나지 않는다는 점을 알려 줘요.
    d: from the desk
    k: [이 analgesia-first 지시를 나머지 팀에게도 설명할게요., 이 analgesia-first 지시를 다음 근무조에게도 전달할게요.]
    a: team
    o: [family, patients, visitors]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 통증 먼저 4문장 순서
    why: 얼굴을 찡그리는 관찰이 먼저이고, That's why로 그 관찰이 이유가 되어 통증 먼저라는 방침을 말해요. So로 진통제를 주자고 하고, 마지막 줄의 it은 진통제를 가리켜서 순서가 하나예요.
    lines:
    - {en: 'He grimaces with suctioning, so pain could be the driver.', icon: faceWorried, ko: 흡인할 때 찡그리니 통증이 원인일 수 있어요, note: 관찰}
    - {en: That's why we treat his pain before we touch the sedation., icon: board, ko: 그래서 진정제를 건드리기 전에 통증부터 다뤄요, note: 방침}
    - {en: So let's give pain medicine now., icon: pill, ko: 그러니 지금 진통제를 줘봐요, note: 투여}
    - {en: 'Once it''s in, we''ll reassess the need for sedation.', icon: monitor, ko: 들어가면 진정 필요성을 다시 평가할게요, note: 재평가}
- title: 진정 목표 설정 이해
  s:
  - t: 목표 설명
    i: board
    w: Our goal today is …는 오늘의 목표를 한 문장으로 못 박는 모양이에요. around가 붙어 척도 범위를 어림으로 말하는 완충이 돼요.
    d: in the lobby
    k: ['어제 목표는 light sedation, 대략 0에서 마이너스 1이었어요.', '이틀 뒤 목표는 light sedation, 대략 0에서 마이너스 1이에요.']
    a: today
    o: [yesterday, tomorrow, already]
  - t: 상태 설명
    i: stetho
    w: calm but able to …는 두 가지를 but으로 묶어 균형 잡힌 상태를 그려요. 간단한 지시를 따를 수 있다는 점이 얕은 진정의 기준이에요.
    d: from the nurse
    k: [차분하지만 간단한 질문은 대답할 수 있는 상태를 원해요., 차분하지만 복잡한 지시는 따를 수 있는 상태를 원해요.]
    a: calm
    o: [asleep, angry, paralyzed]
  - t: 안전 설명
    i: shield
    w: Deeper isn't safer는 비교급 두 개를 나란히 놓아 대비를 만들어요. here를 붙여서 모든 환자가 아니라 이 환자의 경우라는 범위를 한정해요.
    d: on the wall
    k: [여기서는 더 깊다고 더 편안한 게 아니니 그 목표를 지켜요., 여기서는 더 길다고 더 안전한 게 아니니 그 목표를 지켜요.]
    a: safer
    o: [easier, faster, cleaner]
  - t: 팀 합의
    i: handshake2
    w: agree on은 어떤 것에 의견을 모은다는 구동사예요. before we start the shift로 합의가 근무 시작 전에 끝나야 한다는 시점을 정해요.
    d: at the door
    k: [근무를 마치기 전에 이 RASS 목표에 팀이 합의해요., 근무를 시작하기 전에 이 RASS 점수에 팀이 합의해요.]
    a: start
    o: [finish, end, leave]
  - t: 과진정 단서
    i: faceWorried
    w: too … to respond는 정도가 지나쳐 반응하지 못한다는 모양이에요. probably로 확정하지 않고 가능성을 말해서 추정이라는 점이 드러나요.
    d: in the corner
    k: [너무 졸려서 반응이 없다면 아마 근무 전보다 더 깊은 거예요., 너무 졸려서 반응이 없다면 아마 어제보다 더 깊은 거예요.]
    a: drowsy
    o: [thirsty, hungry, dizzy]
  - t: 가족 설명
    i: home
    w: isn't the same as …는 두 가지가 다르다고 안심시키는 모양이에요. still을 넣어 가볍게 재워도 깨어날 수 있는 가능성이 남아 있다고 전해요.
    d: in the dark
    k: ['가볍게 재우는 건 수술과 달라요, 그래도 우리 쪽으로 깰 수 있어요.', '가볍게 재우는 건 혼수와 달라요, 그래도 가족 쪽으로 깰 수 있어요.']
    a: wake
    o: [walk, run, jump]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 진정 목표 설명 4문장 순서
    why: 오늘 목표를 먼저 말하고, That means로 그 목표가 어떤 상태인지 풀고, With that in mind로 더 깊은 것이 안전이 아니라고 하며, So로 근무 전 합의를 요청해요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    lines:
    - {en: 'Our goal today is light sedation, around zero to minus one.', icon: board, ko: '오늘 목표는 가벼운 진정, 대략 0에서 마이너스 1이에요', note: 목표}
    - {en: That means we want him calm but able to follow simple commands., icon: stetho, ko: 차분하지만 간단한 지시는 따르는 상태를 원한다는 뜻이에요, note: 상태}
    - {en: 'With that in mind, deeper isn''t safer here.', icon: shield, ko: 그걸 생각하면 여기서는 더 깊다고 더 안전하지 않아요, note: 이유}
    - {en: So let's agree on this target before we start the shift., icon: handshake2, ko: 그러니 근무 시작 전에 이 목표에 합의해요, note: 합의}
- title: 진정 중 활력·기도 감시
  s:
  - t: 상태 보고
    i: monitor
    w: dropped to …는 to 뒤에 도달한 값을 말해서 변화의 끝점을 알려 줘요. after the last bolus로 변화가 일어난 시점을 함께 보고해요.
    d: in the ward
    k: [마지막 체위 변경 이후 호흡수가 8회로 떨어졌어요., 마지막 볼루스 이후 호흡수가 6회로 떨어졌어요.]
    a: dropped
    o: [rose, jumped, climbed]
  - t: 감시 요청
    i: monitor
    w: Let's watch …는 함께 지켜보자는 제안 모양이에요. 산소포화도와 호기말 이산화탄소를 같이 보면 환기가 충분한지 두 방향에서 확인돼요.
    d: on the cart
    k: ['산소포화도랑 이산화탄소 분압을 지켜볼까요?', 산소포화도랑 이산화탄소 분압을 지켜볼게요.]
    a: saturation
    o: [temperature, rhythm, position]
  - t: 장비 대기
    i: siren
    w: Have … ready는 상태를 미리 갖춰 두라는 지시 모양이에요. just in case를 붙여 지금 필요하지는 않지만 필요해질 때를 대비한다는 뜻을 전해요.
    d: for the visitors
    k: ['혹시 모르니 기도 확보 장비를 준비해둘까요?', 혹시 모르니 기도 확보 장비를 준비해둘게요.]
    a: equipment
    o: [bedding, paperwork, seating]
  - t: 원인 추정
    i: stetho
    w: looks는 눈으로 본 인상을 말하는 동사예요. could be를 써서 단정하지 않고 가능성으로 말하니 사정을 이어 가는 말이 돼요.
    d: to the side
    k: [호흡이 거칠어 보이니 과진정일 수 있어요., 맥박이 약해 보이니 과진정일 수 있어요.]
    a: shallow
    o: [noisy, rapid, wet]
  - t: 장비 위치
    i: shield
    w: right at은 가까운 곳을 강조하는 표현이에요. bag-mask를 침상에 두는 것은 호흡이 나빠질 때 곧바로 쓰기 위해서예요.
    d: for tonight
    k: [백마스크는 침상 바로 옆에 둬도 돼요., 백마스크는 침상 바로 옆에 둘게요.]
    a: keep
    o: [label, wrap, paint]
  - t: 환자 안내
    i: speech
    w: before I touch로 접촉하기 전에 알리겠다는 순서를 말해요. 진정된 환자라도 듣고 있을 수 있어서 listening을 말해 주면 놀람이 줄어요.
    d: from the hall
    k: [마스크를 만지기 전에 호흡을 보고 있다고 말해줄게요., 마스크를 닦기 전에 호흡을 듣고 있다고 말해줄게요.]
    a: listening
    o: [tasting, smelling, painting]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 진정 중 호흡 감시 4문장 순서
    why: 호흡수가 떨어진 보고가 먼저이고, That으로 그 보고를 과진정 가능성으로 연결하고, So로 감시를 요청하며, 마지막 줄의 them은 감시하는 수치를 가리켜요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    lines:
    - {en: His respiratory rate dropped to eight after the last bolus., icon: monitor, ko: 마지막 볼루스 후 호흡수가 8회로 떨어졌어요, note: 보고}
    - {en: 'That, with his shallow breathing, could be oversedation.', icon: stetho, ko: 그게 얕은 호흡과 함께라면 과진정일 수 있어요, note: 추정}
    - {en: So let's watch his oxygen saturation and end-tidal CO2., icon: monitor, ko: 그러니 산소포화도와 이산화탄소 분압을 지켜봐요, note: 감시}
    - {en: Have the airway equipment ready for any change in them., icon: siren, ko: 그 수치가 변하면 쓸 기도 장비를 준비해두세요, note: 대비}
- title: 진정제 라인·호환성 확인
  s:
  - t: 호환 질문
    i: pill
    w: Is this … compatible with …?는 두 가지가 함께 쓰여도 되는지 묻는 모양이에요. what's already running은 지금 들어가는 약을 가리키는 관계절이에요.
    d: at the sink
    k: ['이 진정제가 지금 들어가고 있는 약이랑 같은 건가요?', '이 진정제가 지금 준비하고 있는 약이랑 호환되나요?']
    a: compatible
    o: [comfortable, capable, available]
  - t: 전용 루멘
    i: gear
    w: dedicated는 하나의 용도만을 위한 전용이라는 형용사예요. to be safe를 붙여 이 선택의 이유가 안전이라는 점을 짧게 밝혀요.
    d: for the day
    k: [안전하게 전용 라벨을 하나 줘요., 안전하게 전용 펌프를 하나 줘요.]
    a: lumen
    o: [label, lock, lid]
  - t: 표 확인
    i: board
    w: before we start로 확인이 시작 전에 끝난다는 순서를 말해요. compatibility chart는 약끼리의 호환 여부를 모아 둔 표예요.
    d: in the folder
    k: [교대하기 전에 호환성 표를 확인할게요., 시작하기 전에 알레르기 표를 확인할게요.]
    a: start
    o: [finish, leave, pause]
  - t: 짝 확인
    i: lab
    w: already는 예상보다 이미 많다는 뜻으로 신중해야 할 이유를 알려 줘요. each pair는 약 둘씩 짝지어 본다는 뜻이라 세 가지면 확인할 조합이 여럿이에요.
    d: in the cabinet
    k: [이 라인에는 이미 네 가지가 들어가고 있으니 짝마다 확인해봐요., 이 라인에는 이미 세 가지가 들어가고 있으니 약마다 확인해봐요.]
    a: already
    o: [rarely, hardly, never]
  - t: 별도 경로
    i: gear
    w: If절에 조건을 먼저 밝히고 we'll run으로 대안을 말해요. separate access는 다른 정맥 통로라는 뜻이라 섞이면 안 되는 약을 나눠 줄 수 있어요.
    d: to the bedside
    k: ['호환이 안 되면 별도 경로로 주입할까요?', 호환이 안 되면 별도 경로로 주입할게요.]
    a: access
    o: [entrance, exit, hallway]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 진정제 호환성 확인 4문장 순서
    why: 호환되는지 묻는 질문이 먼저이고, To answer that으로 표를 확인하겠다고 답해요. 3줄의 that chart는 2줄의 표를, 4줄의 any pair는 3줄에서 확인하는 짝을 가리켜서 순서가 하나예요.
    lines:
    - {en: 'Is this sedative compatible with what''s already running?', icon: pill, ko: '이 진정제가 지금 들어가는 약이랑 호환되나요?', note: 질문}
    - {en: 'To answer that, I''ll check the compatibility chart before we start.', icon: board, ko: 답하려고 시작 전에 호환성 표를 확인할게요, note: 확인}
    - {en: 'Let''s confirm each pair on that chart, since this line already has three drips.', icon: lab, ko: 라인에 세 가지가 있으니 그 표에서 짝마다 확인해봐요, note: 짝 확인}
    - {en: 'If any pair isn''t compatible, we''ll run it through a separate access.', icon: gear, ko: 호환이 안 되는 짝은 별도 경로로 주입해요, note: 대안}
