- situation: "이송 중 승압·주입 유지"
  items:
    - kind: slider
      words: [w-bump]
      cue: "Order: titrate the pressor to keep MAP at goal. His MAP is just under goal."
      scale: [hold the rate, bump it slightly, jump the rate way up]
      answerAt: 1
      why: "처방된 범위 안에서 목표 MAP에 맞춰 조금씩 올리는 것이 bump it slightly예요. 한 번에 크게 올리거나 처방 범위를 벗어나는 변경은 먼저 의사에게 확인해요."
      example: "I bumped the rate up slightly, within the ordered range."
      exKo: "처방 범위 안에서 속도를 살짝 올렸어요."
    - kind: context
      words: [w-pump]
      word: pump
      ko: 펌프
      scenes:
        - {who: 동료 간호사, icon: monitor, en: "Check that the pump is on battery before we unplug it.", ok: true}
        - {who: 의사에게 보고, icon: stetho, en: "The pressor pump is running on battery and his MAP is at goal.", ok: true}
        - {who: 보호자에게, icon: me, en: "The infusion pump's lithium battery guarantees uninterrupted delivery.", ok: false, fix: "The medicine pump has its own battery, so it keeps working while we move him."}
      why: "의료진끼리는 pump, battery처럼 짧게 말해도 통해요. 가족에게 lithium, uninterrupted delivery는 어렵고, guarantees는 지킬 수 없는 장담이에요. 배터리가 있어서 이동 중에도 작동한다고 쉬운 말로 알려요."
- situation: "시술 진정 깊이 적정"
  items:
    - kind: slider
      words: [w-deep, w-moderate]
      cue: "She only reacts to repeated, firm stimulation."
      scale: [light, moderate, deep]
      answerAt: 2
      why: "목소리에 바로 반응하면 moderate, 반복하거나 강한 자극에야 반응하면 deep이에요. 깊어질수록 기도를 스스로 지키기 어려워서 감시를 더 철저히 하고, 약은 처방된 범위에서 천천히 조절해요."
      example: "She's getting deep, so I'll hold the drug and support the airway."
      exKo: "깊어지고 있어서 약을 멈추고 기도를 도울게요."
    - kind: context
      words: [w-sedation]
      word: sedation
      ko: 진정
      scenes:
        - {who: 시술 의사에게, icon: stetho, en: "Sedation is at moderate, and she opens her eyes to voice.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "How's the sedation? Is she still responding to her name?", ok: true}
        - {who: 환자에게, icon: me, en: "You'll be under moderate sedation with titrated midazolam and fentanyl.", ok: false, fix: "You'll feel relaxed and sleepy, but we can still wake you by talking to you."}
      why: "의료진끼리는 sedation, moderate처럼 단계를 짧게 말해도 통해요. 환자에게 titrated, midazolam, fentanyl 같은 말은 낯설고 불안해요. 편안하고 졸리지만 말을 걸면 깰 수 있다고 쉬운 말로 알려요."
- situation: "진정 역전제 준비"
  items:
    - kind: pair
      words: [w-naloxone, w-flumazenil, w-opioid, w-benzodiazepine]
      pairs: [["naloxone", "reverses opioids"], ["flumazenil", "reverses benzodiazepines"]]
      decoys: ["lowers a fever"]
      why: "naloxone은 오피오이드, flumazenil은 벤조디아제핀의 작용을 되돌려요. 서로 대신 쓸 수 없어요. 둘 다 약효가 역전제보다 오래 갈 수 있어서 쓴 뒤에도 재진정을 지켜봐요."
    - kind: context
      words: [w-reversal]
      word: reversal
      ko: 역전제
      scenes:
        - {who: 시술 의사에게, icon: stetho, en: "I'll titrate the reversal to effect and watch for resedation.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Where's the reversal? Is it drawn up and labeled?", ok: true}
        - {who: 보호자에게, icon: me, en: "We gave a pharmacologic reversal to antagonize the oversedation.", ok: false, fix: "We gave her a medicine that wakes her up more, and we're watching her closely."}
      why: "의료진끼리는 reversal, resedation처럼 짧게 말해도 통해요. 가족에게 pharmacologic, antagonize, oversedation은 어렵고 겁나요. 더 깨게 하는 약을 쓰고 계속 지켜본다고 쉬운 말로 알려요."
- situation: "이송 중 악화 대비 계획"
  items:
    - kind: slider
      words: [w-code, w-call]
      cue: "He suddenly has no pulse in the hallway."
      scale: [mention it, ask for backup, call a code]
      answerAt: 2
      why: "맥박이 없으면 알려 두는 정도가 아니라 code를 불러요. 복도에서도 병원 정책에 정해진 비상 호출 번호로 바로 연락하고, 가장 가까운 코드 카트를 가져와요."
      example: "He's pulseless, so I'm calling a code right now."
      exKo: "맥박이 없어서 지금 바로 코드를 부르고 있어요."
    - kind: context
      words: [w-code]
      word: code
      ko: 코드(응급소생)
      scenes:
        - {who: 동료 간호사, icon: monitor, en: "Do you know where the nearest code cart is on this route?", ok: true}
        - {who: 의사 콜, icon: stetho, en: "We had a code in the hallway, and compressions started right away.", ok: true}
        - {who: 보호자에게, icon: me, en: "He may code on the way, so we've planned who calls it.", ok: false, fix: "If his heart were to stop, we know exactly what to do and who does what."}
      why: "의료진끼리는 code가 심정지 소생 호출이라는 걸 바로 알아요. 가족에게 He may code는 은어라 차갑고 무섭게 들려요. 심장이 멈추는 경우에도 대비가 돼 있다고 쉬운 말로 알려요."
- situation: "베드사이드 시술 보조"
  items:
    - kind: slider
      words: [w-sterile, w-clean]
      cue: "The sterile tray just touched the bed rail."
      scale: [sterile, clean, dirty]
      answerAt: 2
      why: "무균 물품이 무균이 아닌 침대 난간에 닿으면 더는 sterile이 아니에요. 그냥 쓰지 말고 바꾸거나 시술자에게 알려요. clean은 눈에 보이는 오염이 없다는 정도라서 무균과는 달라요."
      example: "The tray touched the rail, so it's not sterile anymore."
      exKo: "트레이가 난간에 닿아서 더는 무균이 아니에요."
    - kind: context
      words: [w-timeout]
      word: time-out
      ko: 타임아웃
      scenes:
        - {who: 동료 간호사, icon: monitor, en: "Is everyone ready for the time-out?", ok: true}
        - {who: 시술 의사에게, icon: stetho, en: "Time-out is done, with the right patient and the right site.", ok: true}
        - {who: 환자에게, icon: me, en: "We are initiating the universal protocol time-out for site verification.", ok: false, fix: "Before we start, we'll all pause and double-check your name and where we're working."}
      why: "의료진끼리는 time-out이 시술 직전 모두 멈추고 환자·시술·부위를 확인하는 절차라는 걸 알아요. 환자에게 universal protocol, site verification은 딱딱하게 들려요. 이름과 시술 부위를 같이 확인한다고 쉬운 말로 알려요."
- situation: "병원간 이송 인계·문서"
  items:
    - kind: slider
      words: [w-rise]
      cue: "Troponin: 0.04, then 0.05 — a hair higher."
      scale: [creeping up, rising, spiking]
      answerAt: 0
      why: "아주 조금씩 오르면 creeping up이에요. 뚜렷하게 계속 오르면 rising, 갑자기 치솟으면 spiking이에요. 인계에서는 값과 시간 흐름을 같이 말해요."
      example: "His troponin is creeping up, so I'll give you the times."
      exKo: "트로포닌이 조금씩 오르고 있어서 시간대를 같이 알려 드릴게요."
    - kind: context
      words: [w-handoff]
      word: handoff
      ko: 인계
      scenes:
        - {who: 동료 간호사, icon: speech, en: "I'll give the transport team an SBAR handoff.", ok: true}
        - {who: 의사 콜, icon: stetho, en: "Handoff is done, and the receiving team has the chart.", ok: true}
        - {who: 보호자에게, icon: me, en: "Handoff to the receiving facility will follow SBAR format.", ok: false, fix: "I'll tell the nurses there everything about how he's doing, so nothing gets missed."}
      why: "의료진끼리는 handoff, SBAR가 바로 통해요. 가족에게 receiving facility, SBAR format은 서류 용어처럼 들려요. 받는 병원 간호사에게 상태를 빠짐없이 전한다고 쉬운 말로 알려요."
- situation: "검사실 안전"
  items:
    - kind: slider
      words: [w-mri, w-pump]
      cue: "The pump's label reads: 'safe only under the specified conditions in the MRI scanner.'"
      scale: [MR safe, MR conditional, MR unsafe]
      answerAt: 1
      why: "MR safe는 어느 MRI 환경에서도 안전하다는 뜻이고, MR conditional은 표시된 조건 안에서만 안전하다는 뜻이에요. MR unsafe는 들어가면 안 돼요. 라벨의 조건을 확인하고 확신이 없으면 MRI 안전 담당에게 물어요."
      example: "It's MR conditional, so let's check the label's conditions first."
      exKo: "조건부 안전이라서, 라벨의 조건부터 확인해요."
    - kind: context
      words: [w-screen]
      word: screen
      ko: 선별하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I've screened the patient and the equipment, and there are no ferrous items.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Who's screening the monitor for the MRI suite?", ok: true}
        - {who: 환자에게, icon: me, en: "You need to undergo ferromagnetic screening to prevent projectile hazards.", ok: false, fix: "Before we go in, we'll check you for anything metal, because the magnet is very strong."}
      why: "의료진끼리는 screen이 MRI에 들어가도 되는지 미리 거르는 일이라는 걸 알아요. 환자에게 ferromagnetic, projectile hazards는 어렵고 겁나요. 자석이 강해서 금속이 있는지 먼저 확인한다고 쉬운 말로 알려요."
