    why: will meet us back in the unit으로 재삽관은 기도 팀이 중환자실에서 이어받는다는 계획을 말해요. 재삽관은 간호사가 약속하는 일이 아니라 팀이 맡는 일이에요.
    decoy: for his family
    distractorsKo:
      - 기도 팀이 중환자실에서 우리를 맞아 기도를 재평가할 거예요.
