    en: I'll call for help if her breathing doesn't improve with stimulation.
    ko: 자극해도 호흡이 나아지지 않으면 도움을 부를게요.
    chunks: [I'll call for help, if her breathing, doesn't improve, with stimulation, .]
    words: [w-call, w-help, w-improve, w-stimulation]
    tag: 호출 기준
    icon: siren
    why: if her breathing doesn't improve with stimulation으로 도움을 부르는 기준을 정해 둬요. 자극을 줘도 숨이 나아지지 않으면 늦기 전에 부르는 순서가 말에 들어 있어요.
    decoy: with the alarm
    distractorsKo:
      - 자극해도 호흡이 나아지지 않으면 역전제 쓸지를 정해요.
      - 자극해도 호흡이 나아지지 않으면 너무 깊은 거예요.
    blank: {answer: breathing, options: [breathing, vision, hearing, appetite]}
