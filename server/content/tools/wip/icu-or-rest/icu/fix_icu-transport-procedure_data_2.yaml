  "16.1":
    ko: 기도 키트를 불러 주고 중환자실로 돌아가게 해 주세요.
  "16.4":   # AHA 2020: 6초마다
    en: I'm giving breaths every six seconds.
    ko: 6초마다 숨을 불어넣고 있어요.
    chunks: [I'm giving, breaths, every six seconds, .]
    why: every six seconds는 일정한 간격으로 반복한다는 뜻이에요. 맥박이 있는 성인의 구조 호흡은 6초에 한 번이고, breaths 앞에 giving을 쓰면 환자에게 불어넣어 준다는 동작이 분명해져요.
  "6.0":    # KP — why만
    why: matched A to B는 A를 B와 똑같이 맞췄다는 뜻이에요. 이송 호흡기 설정은 보통 호흡치료사와 함께 맞추고, 병상 기계와 다르면 환기가 달라져서 현재 설정을 그대로 옮겨요.
