  "13.6":   # S5 cleared ko
    ko: 몸에 지닌 것은 모두 스캐너에 들여도 된다고 확인을 마쳤어요.
    distractorsKo:
      - 몸에 지닌 것은 모두 스캐너에 들여도 되면 스캔해요.
      - 몸에 붙은 작은 금속도 하나하나 꼼꼼히 봐야 해요.
    why: has been cleared는 확인을 마치고 스캐너에 들여도 된다고 통과시켰다는 현재완료 수동태예요. Everything on him으로 몸에 붙은 것 전부를 한꺼번에 말해요.
