# A 검토 — 단어(ko·헤드워드·cue·오답·decoyChips)·뉘앙스
words:
  w-transport: {ko: 수송}                                            # W1
  w-vital:                                                           # W2
    en: vitals
    ipa: "/ˈvaɪtəlz/"
    chips: [[vi, tals]]
    decoyChips: [via, tails]
    distractorsEn: [vials, virals]
  w-clear:                                                           # W3 — 예문을 6.5로
    example: "Once we treat the trigger, his mind usually clears again."
    exKo: "유발요인을 치료하면 보통 그의 정신이 다시 맑아져요."
  # W6 cue
  w-gut: {cue: "락툴로오스가 암모니아를 끌어내는 배 속 소화관을 가볍게 부를 때", dEn_replace: {cut: gust}}
  w-physician: {cue: "처방과 진단을 맡은 사람을 인계에서 격식 있게 부를 때"}
  w-still: {cue: "뇌압이 오르지 않게 환자가 몸부림치지 않도록 할 때"}
  w-news: {cue: "이식이 어렵다는 결과를 가족에게 처음 전할 때"}
  w-trip: {cue: "이식센터로 가는 길에 쓸 혈액과 약을 챙길 때"}
  w-test: {cue: "간이 어떻게 일하는지 알아보려고 피를 뽑아 하는 것 하나하나"}
  w-dextrose: {cue: "저혈당일 때 정맥으로 넣는 당 성분 수액"}
  # 정답으로도 맞는 오답·틀린 오답
  w-hard: {dEn_replace: {harsh: handy}}
  w-nutrition: {dEn_replace: {nutrient: intuition}}
  w-nac: {dEn_replace: {ACE: ASA}, dKo_replace: {"ACE (혈압약)": "ASA (아스피린)"}}
  w-grade: {dKo_replace: {"분류하다": "보고하다"}}
  w-tailor: {dEn_replace: {alter: taper}}
  # 품사가 다른 오답 (★ 둘)
  w-check: {dEn_replace: {chick: chuck, cheek: choke}}
  w-left: {dEn_replace: {lift: loft, lent: cleft}}
  # 품사가 다른 오답 (하나)
  w-work: {dEn_replace: {word: worry}}
  w-monitor: {dEn_replace: {minor: muster}}
  w-fever: {dEn_replace: {fewer: fiber}}
  w-mean: {dEn_replace: {meal: meet}}
  w-fluid: {dEn_replace: {fluent: flood}}
  w-stage: {dEn_replace: {stare: stake}}
  w-degree: {dEn_replace: {degrade: debris}}
  w-pressure: {dEn_replace: {preserve: measure}}
  w-interview: {dEn_replace: {intercept: interface}}
  w-early: {dEn_replace: {nearly: earthly}, decoy_replace: {lye: lay}}
  w-soon: {dEn_replace: {since: once}}
  w-position: {dEn_replace: {portion: petition}}
  w-procedure: {dEn_replace: {produce: prescription}}
  w-safe: {dEn_replace: {save: sage}}
  w-tell: {dEn_replace: {tall: teach}}
  w-blood: {dEn_replace: {blond: brood}}
  w-cell: {dEn_replace: {sell: gel}}
  # decoyChips
  w-helpful: {decoy_replace: {fool: fill}}
  w-carefully: {decoy_replace: {fool: fill}}
  w-medicine: {decoy_replace: {mad: mod}}
  w-medication: {decoy_replace: {mad: mod}}
  w-med: {decoy_replace: {mad: mod}}
  w-syndrome: {decoy_replace: {sin: sim}}
  w-number: {decoy_replace: {bar: bur}}
  w-oxygenation: {decoy_replace: {ax: ex}}

nuance:
  - {i: 1, kind: slider, w: w-level, set: {cue: "Ammonia came back 80, then 95, then 110 on three checks."}}   # N1
  - i: 2                                                              # N2
    kind: context
    w: w-dose
    set:
      words: [w-lactulose]
      word: lactulose
      ko: 락툴로오스
      why: "의료진끼리는 nonabsorbable disaccharide 같은 약리 용어가 정확해요. 환자에게는 같은 lactulose를 무슨 일을 하는 약인지 쉬운 말로 풀어 주세요."
    scene_en: {2: "Lactulose is a nonabsorbable disaccharide that acidifies the colon."}
    scene_fix: {2: "Lactulose is a medicine that helps your bowels get rid of the toxins that cloud your thinking."}
  - i: 2                                                              # N3
    kind: swap
    w: w-bowel
    set:
      before: ["Please tell us each time you ", "defecate", "."]
      options: ["have a bowel movement", "pass stool", "defecate"]
      answer: "have a bowel movement"
      notes:
        "have a bowel movement": "환자와 가족이 편하게 알아듣는 표준적인 말이에요."
        "pass stool": "차트와 의료진 사이에서 쓰는 말이라 환자 대화에는 딱딱해요."
        "defecate": "격식을 갖춘 의학 용어라 환자에게는 어색해요."
  - {i: 3, kind: context, w: w-bleed, scene_en: {0: "Any new bleed in liver failure needs a call, even a small one."}}   # N4
  - i: 4                                                              # N5
    kind: slider
    w: w-low
    set:
      scale: ["low-normal", "low", "critically low"]
      answerAt: 1
      why: "66은 70 미만이라 저혈당(ADA 1단계)이고 low예요. 54 미만이면 2단계로 critically low 쪽이에요. 간부전에서는 혈당이 빨리 더 떨어질 수 있어 증상이 없어도 병원 저혈당 프로토콜대로 바로 처치하고 다시 재요."
      example: "Her glucose is low at 66."
      exKo: "혈당이 66으로 낮아요."
  - i: 4                                                              # N6
    kind: swap
    w: w-potassium
    option_replace: {"hypokalemic status": "serum potassium concentration"}
    note_replace: {"hypokalemic status": ["serum potassium concentration", "정확하지만 긴 검사 용어라 환자에게는 딱딱해요."]}
  - i: 6                                                              # N7
    kind: context
    w: w-trigger
    set:
      word: precipitant
      ko: 유발요인
      why: "의료진끼리는 precipitant가 짧고 정확한 말이에요. 보호자에게는 같은 precipitant를 무엇이 이걸 일으켰는지 찾고 있다는 쉬운 말로 풀어 주세요."
    scene_en:
      0: "Look for the precipitant: infection, a GI bleed, or electrolytes."
      1: "The precipitant is likely infection; cultures were sent and antibiotics ordered."
      2: "No precipitant has been identified yet."
  - i: 7                                                              # N8
    kind: slider
    w: w-high
    why_append: " 다만 간 질환에서는 INR만으로 출혈 위험을 알 수 없어서, 수치만 보고 혈장을 주지는 않아요."
  - i: 7                                                              # N9
    kind: context
    w: w-plasma
    scene_en: {0: "Give plasma if he's actively bleeding, not just for the INR.", 2: "This plasma, specifically FFP, supplies exogenous coagulation factors."}
  - i: 7                                                              # N10
    kind: swap
    w: w-hold
    option_replace: {"tamponade the site": "achieve hemostatic tamponade"}
    note_replace: {"tamponade the site": ["achieve hemostatic tamponade", "의료진끼리 쓰는 말이라 환자는 못 알아들어요."]}
  - i: 9                                                              # N11
    kind: swap
    w: w-albumin
    set:
      why: "환자에게는 먼저 쉬운 설명을 하고 필요하면 이름을 덧붙여요. 알부민은 헌혈 혈장에서 만든 제제라, 종교적 이유로 혈액 제제를 거부하는 환자는 미리 확인해요."
  - i: 13                                                             # N12
    kind: slider
    w: w-little
    set:
      scale: ["none", "a little", "plenty"]
      answerAt: 1
      why: "두 숟가락 정도면 a little이에요. none은 전혀 안 먹은 경우, plenty는 충분히 먹은 경우예요. 섭취량은 영양팀에 알려 단백질을 어떻게 보충할지 정해요."
  - i: 13                                                             # N13
    kind: swap
    w: w-meal
    option_replace: {"small frequent meals": "frequent low-volume portions"}
    note_replace: {"small frequent meals": ["frequent low-volume portions", "영양 기록에서 쓰는 말이라 환자에게는 딱딱해요."]}
  - i: 14                                                             # N14
    kind: slider
    w: w-response
    set:
      cue: "His eyes are open on their own, and he answers my questions right away."
      scale: ["unresponsive", "drowsy", "alert"]
      answerAt: 2
      why: "스스로 눈을 뜨고 있고 바로 대답하면 alert예요. 불러야 깨면 drowsy, 자극해도 반응이 없으면 unresponsive예요. 간 기능이 나쁘면 진정제가 오래 남을 수 있어, 깨우는 데 필요한 자극이 커지면 바로 알려요."
      example: "He's alert and answering questions."
      exKo: "또렷하게 깨어 있고 질문에 대답해요."
  - i: 15                                                             # N15
    kind: slider
    w: w-immediately
    set:
      why: "동공이 갑자기 커지고 반응이 없어지면 뇌탈출 징후일 수 있어서 기다리지 않고 immediately 연락해요. 중환자실 담당 의사에게 바로 연락하고 처방된 치료를 준비해요."
  - i: 18                                                             # N16
    kind: context
    w: w-support
    scene_en: {2: "He's on maximal multiorgan support right now."}
  - i: 19                                                             # N17
    kind: context
    w: w-transfer
    scene_en: {2: "We're initiating an interfacility transfer to a tertiary transplant center."}
    set:
      why: "의료진끼리는 interfacility transfer 같은 용어가 정확해요. 보호자에게는 같은 transfer를 어디로 왜 옮기는지 쉬운 말로 풀어 주세요."
  - i: 10                                                             # N18
    kind: slider
    w: w-urgency
    set:
      example: "His case is emergent."
      exKo: "응급으로 다뤄야 하는 경우예요."
