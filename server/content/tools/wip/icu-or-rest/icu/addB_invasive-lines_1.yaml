  s:
  - ["영점 조정", gear, "level과 zero를 and로 이으면 수평 잡기에서 영점으로 가는 순서가 그대로 들려요. 높이가 틀리면 수치가 어긋나서 두 동작을 한 문장에 묶어요.", "the flush bag", "트랜스듀서를 정맥정수압축에 맞춰 수평 잡고 케이블도 정리할게요.", "트랜스듀서를 정맥정수압축에 맞춰 수평 잡고 폴대도 고정할게요.", "level", "tilt", "swap", "clean"]
  - ["파형 확인", monitor, "looks + 형용사는 눈으로 본 상태를 말해요. 중복파(dicrotic notch)를 짚어 파형이 제대로 나오는지 구체적으로 보고해요.", "mean pressure", "동맥 파형이 규칙적이고 중복파도 잘 보여요.", "동맥 파형이 또렷하고 수축기 정점도 잘 보여요.", "arterial", "venous", "pulmonary", "cardiac"]
  - ["수치 비교", chartup, "두 측정값을 and로 나란히 놓고 correlate라고 하면 \"똑같다\"가 아니라 \"임상적으로 맞는다\"는 뜻이 돼요. 영점과 수평을 맞춘 뒤에 하는 확인이에요.", "and the monitor", "커프 압력이랑 맥박 수치가 범위 안에서 잘 맞아요.", "커프 크기랑 동맥관 수치가 범위 안에서 잘 맞아요.", "correlate", "differ", "expire", "rotate"]
  - ["라인 세척", gear, "to clear로 목적을 문장 안에 붙이면 왜 지금 flush하는지 바로 이해돼요. clear A of B는 A에서 B를 없앤다는 틀이에요.", "the room of visitors", "튜빙 안 혈액 없애려고 라인을 세척하고 있어요.", "수액 주머니 안 공기 없애려고 라인을 세척하고 있어요.", "air", "blood", "dust", "saline"]
  - ["기록", pencil, "document와 note를 나눠 쓰면 \"공식 기록\"과 \"덧붙여 적어 두기\"가 구분돼요. 영점과 높이를 남겨야 다음 근무자가 같은 기준으로 봐요.", "the alarm limits", "경보 한계 기록하고 트랜스듀서 높이도 적어둘게요.", "영점 조정 기록하고 압력백 수치도 적어둘게요.", "height", "color", "brand", "weight"]
