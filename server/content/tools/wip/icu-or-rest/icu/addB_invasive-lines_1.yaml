  - ["타임아웃", pushpin, "Let's는 시술자와 내가 함께 한다는 느낌을 줘서 멈춤 확인이 지시가 아니라 합의로 들려요. before you start가 시점을 못 박아요.", "the sign-in", "시작하기 전에 손 위생부터 할게요.", "시작하기 전에 물품 점검부터 할게요.", "start", "scrub", "leave", "drape"]
