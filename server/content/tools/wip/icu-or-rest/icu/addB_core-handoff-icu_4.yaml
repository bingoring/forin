situations:
- title: 검사·시술 후 인계
  s:
  - ["시술 완료", check, "is done과 are sent로 이미 끝난 일을 두 개 이어서 보고해요. 검체가 이미 갔다는 말이 있어야 받는 사람이 결과를 기다릴 수 있어요.", "are labeled", "기관지경검사는 끝났고 검체는 받았습니다.", "기관지경검사는 끝났고 결과는 보냈습니다.", "done", "ordered", "scheduled", "cancelled"]
  - ["산소 보고", monitor, "has been + 형용사 + since …는 어느 시점부터 지금까지 이어진 상태를 말해요. since she got back이 시술 전후를 가르는 기준점이 돼요.", "been titrated", "깨어난 뒤로 산소는 안정적이었습니다.", "먹은 뒤로 산소는 안정적이었습니다.", "stable", "low", "high", "weaned"]
  - ["관찰 요청", magnify, "Watch her oxygen and for any …는 watch 뒤에 대상을 두 가지 구조로 이어 줘요. any가 작은 출혈도 놓치지 말라는 뜻을 더해요.", "post-procedure fever", "산소와 시술 후 출혈을 기억해 주세요.", "산소와 시술 후 출혈을 걱정해 주세요.", "bleeding", "fever", "nausea", "itching"]
  - ["영상 오더", lab, "was ordered for + 목적은 오더가 난 이유까지 붙이는 수동태예요. for placement는 튜브나 관의 위치를 확인하려는 목적을 뜻해요.", "for infection", "감염 확인을 위해 흉부 엑스레이 재촬영이 오더났습니다.", "크기 확인을 위해 흉부 엑스레이 재촬영이 오더났습니다.", "X-ray", "CT", "MRI", "echo"]
  - ["보고 기준", pager, "Let me know if you see …로 알릴 기준을 먼저 정해 주면 무엇이 보여야 연락할지 분명해요. any new는 처음 생긴 변화만 해당된다는 뜻이에요.", "at the bedside", "침상에서 새로운 출혈이 보이면 알려 주세요.", "주사 부위에서 새로운 출혈이 보이면 알려 주세요.", "bleeding", "swelling", "drainage", "redness"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 검사·시술 후 인계 4문장 순서
    why: 시술이 끝났다는 사실로 시작하고, 후속 영상 오더를 알리고, 그 사이 산소 상태를 보고한 뒤, 앞으로 볼 것으로 끝내요.
    lines:
    - ["The bronchoscopy is done and samples are sent.", check, "기관지경검사는 끝났고 검체는 보냈어요", "완료"]
    - ["As a follow-up, a repeat chest X-ray was ordered for placement.", lab, "후속으로 위치 확인용 흉부 엑스레이 재촬영이 오더났어요", "후속"]
    - ["Through all of that, her oxygen has been stable since she got back.", monitor, "그 모든 과정에서 돌아온 뒤로 산소는 안정적이었어요", "산소"]
    - ["Given that, watch her oxygen and let me know if you see any new bleeding at the site.", pager, "그러니 산소를 보다가 부위에 새 출혈이 보이면 알려 주세요", "관찰"]
- title: 불안정 환자 인계 강조점
  s:
  - ["호출 기준", siren, "If … drops below + 수치는 부르는 기준을 숫자로 못 박아요. 기준을 넘으면 start와 call 두 동작을 and로 묶어 바로 이어서 하라고 알려요.", ", draw labs", "MAP이 70 아래로 떨어지면 승압제를 시작하고 저를 불러 주세요.", "MAP이 75 아래로 떨어지면 승압제를 시작하고 저를 불러 주세요.", "below", "above", "near", "around"]
  - ["리듬 경고", monitor, "irritable은 심장이 잘 놀라 불규칙한 박동이 나오는 상태를 뜻하는 현장 표현이에요. 대시 뒤에 watch for를 붙여 무엇이 올지 미리 알려요.", "bouts of nausea", "리듬이 불안정했습니다, 심실빈맥 연속을 기억해 주세요.", "리듬이 불안정했습니다, 심실빈맥 연속을 걱정해 주세요.", "irritable", "regular", "slow", "silent"]
  - ["즉시 호출", pager, "the moment 뒤에 절을 붙이면 조건이 맞는 바로 그 순간에 행동하라는 뜻이에요. stays under는 한 번 스치는 값이 아니라 유지되는 상태를 기준으로 삼아요.", "his rate", "MAP이 70 아래로 유지되는 순간 바로 저를 불러 주세요.", "MAP이 75 아래로 유지되는 순간 바로 저를 불러 주세요.", "under", "over", "near", "above"]
  - ["상급 보고", pager, "Escalate early는 판단이 늦기 전에 윗선에 알리라는 뜻이에요. rather than waiting on this one으로 이 환자만큼은 기다리지 말라고 못 박아요.", "rather than repeating", "이 병동은 기다리기보다 일찍 상급 보고하세요.", "이 검사는 기다리기보다 일찍 상급 보고하세요.", "early", "quietly", "alone", "twice"]
  - ["상급 보고", siren, "Don't wait for … before …는 어떤 상태가 다 갖춰지기를 기다리지 말라는 부정 명령이에요. full run을 기준으로 삼지 않고 조짐만 보여도 먼저 올리라는 뜻이에요.", "of PVCs", "발작성 심방빈맥이 완전히 지속되길 기다리지 말고 먼저 상급 보고하세요.", "심방세동이 완전히 지속되길 기다리지 말고 먼저 상급 보고하세요.", "escalate", "discharge", "transfer", "extubate"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 불안정 환자 인계 4문장 순서
    why: 리듬이 불안정하다는 경고로 시작하고, 이어 상급 보고를 미루지 말라고 하고, 혈압 기준의 호출을 말한 뒤, 이후에도 일찍 올리라고 닫아요.
    lines:
    - ["His rhythm's been irritable — watch for runs of VT.", monitor, "리듬이 불안정했어요, 심실빈맥 연속을 지켜봐 주세요", "경고"]
    - ["Because of that, don't wait for a full run of VT before you escalate.", siren, "그러니 심실빈맥이 완전히 지속되길 기다리지 말고 먼저 상급 보고하세요", "상급"]
    - ["Once you've escalated, if his MAP drops below sixty-five, start pressors and call me.", pager, "상급 보고 뒤 MAP이 65 아래로 떨어지면 승압제를 시작하고 저를 불러 주세요", "기준"]
    - ["From then on, escalate early rather than waiting on this one.", pager, "그 뒤로는 이 환자는 기다리기보다 일찍 상급 보고하세요", "지속"]
- title: 급변 중 긴급 인계
  s:
  - ["쇼크 보고", siren, "급변 때는 쉼표로 핵심 낱말만 이어 말해 시간을 아껴요. adding … now로 지금 하는 일을 짧게 붙여 상황이 어떻게 바뀌는지 알려요.", ", adding bicarb now", "패혈성 쇼크, MAP 30, 노르에피 최대, 지금 바소프레신을 추가합니다.", "패혈성 쇼크, MAP 50, 노르에피 최대, 지금 바소프레신을 추가합니다.", "forty", "thirty", "fifty", "sixty"]
  - ["기도·가스", stetho, "Airway's secure는 기도가 안전하게 확보됐다는 뜻으로 위기 보고의 첫 확인이에요. last gas showed …로 가장 최근 혈액가스 결과를 한마디로 전해요.", "Access is secure", "기도는 확보되어 있고, 첫 혈액가스는 산증을 보였습니다.", "기도는 확보되어 있고, 마지막 혈액가스는 저산소증을 보였습니다.", "secure", "obstructed", "difficult", "swollen"]
  - ["도움 요청", pager, "crashing은 수치가 급격히 무너진다는 구어 표현이에요. 위기 보고 뒤에 I need …를 붙여 필요한 도움을 구체적으로 요청해요.", "of eyes", "혈압이 급격히 떨어지고 있습니다, 지금 손이 세 사람 더 필요합니다.", "혈압이 급격히 떨어지고 있습니다, 지금 손이 다섯 사람 더 필요합니다.", "crashing", "rising", "steady", "normal"]
  - ["역할 분담", handshake2, "I need you to …로 상대가 할 일을 명확히 지시해요. while I call …로 내가 동시에 할 일을 알려 줘서 둘이 같은 시간에 움직여요.", "the lab", "제가 의사를 만나는 동안 수액을 급속 주입해 주세요.", "제가 의사에게 설명하는 동안 수액을 급속 주입해 주세요.", "while", "until", "after", "before"]
  - ["역할 분담", pager, "You grab …, I'll …처럼 두 문장을 쉼표로 이어 각자 할 일을 동시에 정해요. 위기 때는 you와 I로 사람마다 한 가지 일만 맡겨요.", "the code sheet", "코드 카트를 챙겨 주세요, 저는 마취과를 만날게요.", "코드 카트를 챙겨 주세요, 저는 마취과에 설명할게요.", "code", "supply", "linen", "lunch"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 급변 중 긴급 인계 4문장 순서
    why: 쇼크 상황부터 짧게 알리고, 혈압이 무너지니 도움을 요청하고, 도착한 사람에게 역할을 나눈 뒤, 의사가 오고 있다는 전제로 기도와 가스를 보고해요.
    lines:
    - ["Septic shock, MAP forty, max norepi, adding vaso now.", siren, "패혈성 쇼크, MAP 40, 노르에피 최대, 지금 바소 추가해요", "쇼크"]
    - ["Since that's not holding, I need a second pair of hands now.", pager, "그게 버티지 못하니 지금 손이 하나 더 필요해요", "도움"]
    - ["Now that you're here, I need you to push fluids while I call the doctor.", handshake2, "와 주셨으니 제가 의사를 부르는 동안 수액을 급속 주입해 주세요", "역할"]
    - ["Once the doctor's coming, airway's secure and last gas showed acidosis.", stetho, "의사가 오는 중이니 기도는 확보됐고 마지막 가스는 산증이에요", "보고"]
- title: 코드 상황 인계·역할
  s:
  - ["코드 상황", siren, "We're on round three는 지금 몇 번째 주기인지 알려 줘요. last rhythm was PEA로 마지막 리듬을 말해야 다음 처치가 이어져요.", ", last pulse", "두 번째 라운드이고, 마지막 리듬은 PEA였습니다.", "다섯 번째 라운드이고, 마지막 리듬은 PEA였습니다.", "three", "two", "four", "five"]
  - ["투여 보고", pill, "Epi's been given은 이미 들어갔다는 뜻이에요. next dose in + 시간으로 다음 투여 시점을 카운트다운처럼 알려요.", ", next shock", "에피네프린은 투여했고, 다음 용량은 3분 후입니다.", "에피네프린은 투여했고, 다음 용량은 5분 후입니다.", "given", "drawn", "ordered", "checked"]
  - ["역할 분담", handshake2, "You take A, I'll manage B로 사람마다 하나씩 맡겨 겹치지 않게 해요. take는 어떤 일을 넘겨받는다는 뜻의 동사예요.", "the monitor", "당신이 흉부압박을 맡고, 저는 약물을 관리할게요.", "당신이 흉부압박을 맡고, 저는 기록을 관리할게요.", "compressions", "documentation", "communications", "transportation"]
  - ["압박 유지", gear, "Continue로 지금 하는 일을 멈추지 말라고 먼저 지시하고 대시 뒤에 교대 시점을 알려요. we're switching은 압박 피로를 줄이려고 사람을 바꾼다는 뜻이에요.", "we're charging", "흉부압박을 계속하세요, 20초 후 교대합니다.", "흉부압박을 계속하세요, 40초 후 교대합니다.", "switching", "charging", "analyzing", "shocking"]
  - ["기록 분담", pencil, "I'll call … and you document …는 소리 내어 알리는 사람과 적는 사람을 나눠요. times를 기록하면 에피 간격과 주기 시점을 나중에 확인할 수 있어요.", "the dose", "제가 리듬을 부를 테니 당신은 시각을 확인해 주세요.", "제가 리듬을 부를 테니 당신은 시각을 전달해 주세요.", "document", "delay", "shorten", "reverse"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 코드 상황 인계 4문장 순서
    why: 지금 주기와 리듬을 알리고, 그 리듬을 바탕으로 역할을 나누고, 역할이 정해진 뒤 투여 시점을 알리고, 그 사이 압박을 계속하며 교대 시점으로 닫아요.
    lines:
    - ["We're on round three, last rhythm was PEA.", siren, "세 번째 라운드이고 마지막 리듬은 PEA였어요", "상황"]
    - ["Given that rhythm, you take compressions, I'll manage the airway.", handshake2, "그 리듬이니 당신이 압박을 맡고 저는 기도를 관리해요", "역할"]
    - ["With roles set, epi's been given and the next dose is in two minutes.", pill, "역할이 정해졌고 에피는 투여했고 다음 용량은 2분 후예요", "투여"]
    - ["Through all of that, continue compressions — we're switching in thirty seconds.", gear, "그 모든 동안 압박을 계속하세요, 30초 후 교대해요", "압박"]
- title: 병원간 전원 인계
  s:
  - ["전원 준비", plane, "give a full SBAR로 말로 하는 인계의 범위를 먼저 알리고 and fax …로 문서도 따로 보낸다고 이어요. ahead는 받는 쪽보다 먼저 보낸다는 뜻이에요.", "a short SBAR", "전체 SBAR을 드리고 기록은 미리 팩스로 받을게요.", "전체 SBAR을 요청하고 기록은 미리 팩스로 보낼게요.", "full", "brief", "partial", "rough"]
  - ["서류 요청", pencil, "so they arrive …로 팩스를 보내는 목적을 말하면 지금 바로 해야 하는 이유가 분명해져요. before the ambulance does는 구급차 도착 전에 끝내라는 마감이에요.", "the lab slips", "가족보다 먼저 도착하도록 지금 기록을 팩스로 보내 주세요.", "의사보다 먼저 도착하도록 지금 기록을 팩스로 보내 주세요.", "before", "after", "with", "without"]
  - ["이송 안정성", plane, "stable for + 목적으로 어떤 이동을 견딜 수 있다는 판단을 말해요. on these drips at these rates로 약과 속도가 그대로라는 조건을 못 박아요.", "for imaging", "이 약물들과 속도 그대로 검사에 안정적입니다.", "이 약물들과 속도 그대로 수혈에 안정적입니다.", "transport", "imaging", "dialysis", "surgery"]
  - ["자료 확인", check, "Please confirm you have …는 상대가 이미 받았는지 되묻는 확인 요청이에요. imaging and blood results로 빠지기 쉬운 두 자료를 이름 붙여 짚어요.", "the insurance cards", "영상 자료와 소변검사 결과를 갖고 계신지 확인해 주세요.", "서류와 혈액검사 결과를 갖고 계신지 확인해 주세요.", "imaging", "consent", "insurance", "medication"]
  - ["연락 안내", pager, "will call if 절로 연락이 오는 조건을 미리 알려 주면 먼저 전화할 필요가 줄어요. anything else는 지금까지 말하지 않은 모든 요청을 뜻해요.", "will visit", "수용팀이 다른 서류가 더 필요하면 연락할 것입니다.", "수용팀이 다른 병상이 더 필요하면 연락할 것입니다.", "receiving", "sending", "transport", "billing"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 병원간 전원 인계 4문장 순서
    why: SBAR과 기록 전달을 먼저 알리고, 상대가 자료를 받았는지 확인하고, 그 자료를 바탕으로 이송 안정성을 말한 뒤, 전달이 끝난 후 연락 방법을 안내해요.
    lines:
    - ["I'll give a full SBAR and fax the records ahead.", plane, "전체 SBAR을 드리고 기록은 미리 팩스로 보낼게요", "전달"]
    - ["After the SBAR, please confirm you have the imaging and blood results.", check, "SBAR 뒤에 영상과 혈액검사 결과를 갖고 계신지 확인해 주세요", "확인"]
    - ["Based on those, he's stable for transport on these drips at these rates.", plane, "그걸 근거로 이 약물과 속도 그대로 이송에 안정적이에요", "판단"]
    - ["Now that he's cleared to go, the receiving team will call if they need anything else.", pager, "이송 가능하니 수용팀이 더 필요하면 연락할 거예요", "연락"]
- title: 정보 누락·오류 정정 인계
  s:
  - ["정정 보고", redo, "I need to correct …로 먼저 정정한다고 밝히고 actually 뒤에 바른 값을 말해요. 이전 인계를 그대로 두면 다음 근무자가 틀린 값을 믿어요.", "the last order", "지난 인계를 정정해야 합니다, 칼륨 수치는 실제로 5.2입니다.", "지난 인계를 정정해야 합니다, 칼륨 수치는 실제로 7.2입니다.", "potassium", "sodium", "glucose", "lactate"]
  - ["용량 정정", pill, "The correct dose was actually …로 바른 값을 먼저 말하고 not fifty로 틀렸던 값까지 같이 말해요. 5와 50은 자릿수 하나 차이라 둘을 함께 짚어야 혼동이 없어요.", ", not fifteen", "정확한 용량은 실제로 15였고, 50이 아니었습니다.", "정확한 용량은 실제로 25였고, 50이 아니었습니다.", "five", "fifteen", "fifty", "twenty"]
  - ["오류 인정", cross, "was wrong처럼 틀렸다고 분명히 말한 뒤 here's로 바로 바른 값을 이어요. 세미콜론은 오류 인정과 정정을 한 호흡으로 묶어요.", "was missing", "차트에 있던 용량은 틀렸습니다, 정확한 것은 이겁니다.", "인계 메모에 있던 용량은 틀렸습니다, 정확한 것은 이겁니다.", "wrong", "doubled", "repeated", "capped"]
  - ["기록 제안", pencil, "Let's document로 함께 하자고 제안하면 정정이 한 사람의 실수 지적으로 끝나지 않아요. so it doesn't get missed는 놓칠까 봐 하는 이유를 붙인 목적 표현이에요.", "the delay", "놓치지 않도록 정정 내용을 출력해요.", "놓치지 않도록 정정 내용을 복사해요.", "document", "repeat", "forward", "translate"]
  - ["표시 보고", pushpin, "already flagged는 이미 끝낸 일이라는 현재완료 느낌이에요. for the next shift로 누구를 위한 표시인지 밝혀 다음 근무자가 찾을 수 있게 해요.", "for the audit", "다음 근무를 위해 인계 노트에 이미 오류를 표시해 두었습니다.", "다음 근무를 위해 게시판에 이미 오류를 표시해 두었습니다.", "flagged", "deleted", "signed", "printed"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 오류 정정 인계 4문장 순서
    why: 정정한다고 밝히고, 틀린 값과 바른 값을 말하고, 그 오류에 표시를 했다고 알린 뒤, 표시에 이어 정정을 기록하자고 닫아요.
    lines:
    - ["I need to correct the last handoff.", redo, "지난 인계를 정정해야 해요", "정정"]
    - ["For that, his potassium was wrong in the report; it's actually 6.2.", cross, "그래서 보고서의 칼륨이 틀렸어요, 실제로는 6.2예요", "값"]
    - ["I already flagged that error in the chart for the next shift.", pushpin, "그 오류는 다음 근무를 위해 차트에 이미 표시했어요", "표시"]
    - ["After flagging it, let's document the correction so it doesn't get missed.", pencil, "표시한 뒤 놓치지 않도록 정정 내용을 기록해요", "기록"]
- title: 임종·목표변경 인계
  s:
  - ["코드 상태", board, "code status changed to …로 상태 변화를 한 줄에 알려요. and we're now …로 목표가 바뀌었다는 점까지 같이 전해야 돌봄 계획이 이어져요.", "family-focused", "코드 상태가 DNR로 확인되었고, 지금은 완화 중심입니다.", "코드 상태가 DNR로 서명되었고, 지금은 완화 중심입니다.", "changed", "confirmed", "signed", "reviewed"]
  - ["치료 목표", shield, "stop A and focus on B로 그만두는 일과 새로 집중할 일을 한 문장에 대비해요. now가 목표 전환이 이미 이루어졌다는 점을 알려요.", "the blood draws", "신경학적 확인은 멈추고 내일부터 완화에 집중합니다.", "신경학적 확인은 멈추고 오늘 밤은 완화에 집중합니다.", "comfort", "recovery", "rehab", "discharge"]
  - ["가족 상태", faceWorried, "at bedside는 관사 없이 쓰는 굳은 표현으로 침상 바로 곁에 있다는 뜻이에요. needs gentle support로 가족에게 필요한 돌봄을 구체적으로 알려요.", "on the phone", "가족이 대기실에 있고 부드러운 지지가 필요합니다.", "가족이 도착 중이고 부드러운 지지가 필요합니다.", "gentle", "formal", "quick", "loud"]
  - ["약물 계획", pill, "are ordered는 의사가 처방을 이미 냈다는 수동태예요. 대시 뒤에 here's …를 붙여 처방 다음 단계인 조절 계획까지 건네요.", "visiting plan", "완화 약물은 준비되었습니다, 용량 조절 계획은 이렇습니다.", "완화 약물은 처방되었습니다, 투여 시간표는 이렇습니다.", "ordered", "stopped", "delayed", "refused"]
  - ["연락 안내", handshake2, "introduce you to로 먼저 사람을 이어 주면 가족이 밤에 누구를 부를지 알게 돼요. so they know who to call로 소개하는 목적을 붙여요.", "to the chaplain", "오늘 낮 누구를 불러야 할지 알도록 가족에게 당신을 소개할게요.", "오늘 밤 누구를 불러야 할지 알도록 환자에게 당신을 소개할게요.", "introduce", "describe", "return", "explain"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 임종·목표변경 인계 4문장 순서
    why: 코드 상태 변경을 먼저 알리고, 그 변경에 따른 약물 계획을 말하고, 약과 함께 가족의 상태를 짚은 뒤, 가족에게 연락처를 소개하며 닫아요.
    lines:
    - ["His code status changed to DNR and we're now comfort-focused.", board, "코드 상태가 DNR로 변경되었고 지금은 완화 중심이에요", "상태"]
    - ["With that change, comfort meds are ordered — here's the titration plan.", pill, "그 변경에 따라 완화 약물이 처방됐고 조절 계획은 이래요", "약물"]
    - ["Alongside those meds, the family is at bedside and needs gentle support.", faceWorried, "그 약과 함께 가족이 곁에 있고 부드러운 지지가 필요해요", "가족"]
    - ["To help them tonight, I'll introduce you to the family so they know who to call.", handshake2, "오늘 밤 돕도록 가족에게 소개해서 누구를 부를지 알게 할게요", "소개"]
- title: 다수 중환자 동시 인계 우선화
  s:
  - ["우선순위", siren, "the sickest처럼 최상급으로 가장 위중한 환자를 콕 집어요. needs the closest eye는 눈을 떼지 말라는 관용 표현이에요.", "the newest", "2번 병상이 가장 위중해서 가장 자세히 살펴야 합니다.", "7번 병상이 가장 위중해서 가장 자세히 살펴야 합니다.", "sickest", "newest", "quietest", "oldest"]
  - ["안정 환자", calendar, "stable but 뒤에 예정된 일을 붙이면 안정적이어도 놓치면 안 되는 일정이 있다는 뜻이 돼요. due at midnight이 확인 시각을 알려요.", "has meds due", "4번 병상은 안정적이지만 자정에 검사가 예정되어 있습니다.", "5번 병상은 안정적이지만 새벽 2시에 검사가 예정되어 있습니다.", "midnight", "noon", "dawn", "dinner"]
  - ["저위험 환자", check, "just는 이 환자는 그것만 하면 된다고 범위를 좁혀요. routine checks와 morning labs로 일정만 챙기면 되는 환자임을 분명히 해요.", "routine feeds", "9번 병상은 정규 확인과 아침 검사만 필요합니다.", "8번 병상은 정규 확인과 저녁 검사만 필요합니다.", "routine", "hourly", "urgent", "frequent"]
  - ["도움 요청", pager, "If two go off at once처럼 가정을 구체적으로 정해 두면 그 순간 주저 없이 도움을 부를 수 있어요. early는 혼자 버티다 늦지 말라는 뜻이에요.", "at night", "세 명이 동시에 급변하면 일찍 도움을 요청하세요.", "네 명이 동시에 급변하면 일찍 도움을 요청하세요.", "early", "quietly", "alone", "twice"]
  - ["사전 합의", handshake2, "Let's agree now로 일이 터지기 전에 먼저 정하자고 제안해요. who covers …로 구체적인 역할 분담 질문을 문장 안에 넣어요.", "if I go on break", "제가 휴식이 필요할 때 다른 병상은 누가 맡을지 지금 정해요.", "제가 퇴근할 때 다른 병상은 누가 맡을지 지금 정해요.", "covers", "charts", "feeds", "cleans"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 다수 중환자 인계 우선화 4문장 순서
    why: 가장 위중한 환자를 먼저 짚고, 그 환자를 위해 다른 병상을 누가 맡을지 정하고, 남은 병상의 일정을 알린 뒤, 동시 급변 때 도움을 요청하라고 닫아요.
    lines:
    - ["Bed 3 is the sickest and needs the closest eye.", siren, "3번 병상이 가장 위중해서 가장 자세히 살펴야 해요", "우선"]
    - ["Because of that, let's agree now who covers the other beds if I need a hand.", handshake2, "그러니 제가 손이 필요할 때 다른 병상을 누가 맡을지 지금 정해요", "합의"]
    - ["Among those other beds, bed 5 is stable but has labs due at midnight.", calendar, "그 다른 병상 중 5번은 안정적이지만 자정에 검사가 있어요", "일정"]
    - ["If two of them go off at once, call for help early.", pager, "그중 둘이 동시에 급변하면 일찍 도움을 요청하세요", "도움"]
