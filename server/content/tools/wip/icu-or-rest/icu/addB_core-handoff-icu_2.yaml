situations:
- title: 간호 문제·계획 인계
  s:
  - ["우선순위", siren, "Top priority로 시작하면 가장 먼저 볼 것이 한 번에 정해져요. 대시 뒤에 지켜볼 행동을 붙이면 우선순위가 행동으로 이어져요.", "sedation level", "가장 우선은 호흡 상태입니다, 이탈 시도를 기억해 주세요.", "가장 우선은 호흡 상태입니다, 이탈 시도를 도와 주세요.", "respiratory", "cardiac", "renal", "neurologic"]
  - ["문제 보고", faceWorried, "biggest issue tonight처럼 시간과 크기를 함께 말하면 이번 근무에서 가장 신경 쓸 문제가 한 가지로 좁혀져요. around 뒤에는 불안이 생기는 상황을 붙여요.", "is nausea", "오늘 새벽 가장 큰 문제는 이탈 시도에 대한 불안입니다.", "오늘 낮 가장 큰 문제는 이탈 시도에 대한 불안입니다.", "anxiety", "nausea", "fever", "itching"]
  - ["검사 예정", lab, "be due for로 때가 된 검사를 말하고 at 시각을 붙이면 다음 근무자가 정확히 언제 확인할지 알아요. repeat는 이미 한 검사를 다시 한다는 뜻이에요.", "for a repeat culture", "6시에 젖산 재검이 예정되어 있습니다.", "10시에 젖산 재검이 예정되어 있습니다.", "lactate", "culture", "troponin", "glucose"]
  - ["가족 요청", speech, "wants an update는 가족이 원하는 것을 한 줄로 넘기는 표현이에요. when 절로 시점을 붙이면 누가 언제 말할지까지 정해져요.", "when the chaplain", "가족은 약사 회진 때 소식을 듣고 싶어 합니다.", "가족은 의사 회진 때 면회를 하고 싶어 합니다.", "update", "chair", "blanket", "snack"]
  - ["오늘 계획", calendar, "The plan for today is to …는 계획을 한 줄로 정리하는 틀이에요. if 절에 올리는 조건을 붙이면 조건이 맞을 때만 진행한다는 뜻이 분명해요.", "her activity", "내일 계획은 견디면 식이를 올리는 것입니다.", "오늘 계획은 견디면 활동을 올리는 것입니다.", "tolerates", "refuses", "vomits", "declines"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 간호 문제와 계획 4문장 순서
    why: 가장 급한 호흡 문제를 먼저 말하고, 그 안에서 불안을 짚고, 불안 때문에 가족이 원하는 것을 이어 말한 뒤, 회진 이후의 계획으로 끝내요.
    lines:
    - ["Top priority is her respiratory status.", siren, "가장 우선은 호흡 상태예요", "우선순위"]
    - ["Within that, her biggest issue tonight is anxiety around the weaning trial.", faceWorried, "그 안에서 오늘 밤 가장 큰 문제는 이탈 시도에 대한 불안이에요", "문제"]
    - ["Because of that anxiety, family wants an update when the doctor rounds.", speech, "그 불안 때문에 가족은 회진 때 소식을 듣고 싶어 해요", "가족"]
    - ["After the round, the plan is to advance her diet if she tolerates it.", calendar, "회진 뒤 계획은 견디면 식이를 올리는 거예요", "계획"]
- title: 알레르기·주의사항 전달
  s:
  - ["알레르기", siren, "알레르기는 약 이름과 반응을 함께 전해야 해요. 대시 뒤에 it causes를 붙이면 단순 표시가 아니라 어떤 반응이 생기는지 분명해져요.", "to sulfa", "페니실린에 알레르기가 있고, 호흡곤란을 일으킵니다.", "페니실린에 알레르기가 있고, 후두부종을 일으킵니다.", "allergic", "resistant", "addicted", "immune"]
  - ["차트 표시", pushpin, "There's … flag on her chart는 차트에 이미 표시가 붙어 있다는 뜻이에요. too가 앞서 말한 알레르기에 이어 하나 더 있다고 알려 줘서 한쪽만 기억하지 않게 해요.", "a food allergy", "손목 밴드에 라텍스 알레르기 표시도 있습니다.", "병실 문에 라텍스 알레르기 표시도 있습니다.", "latex", "sulfa", "dye", "nut"]
  - ["투여 전 확인", shield, "Please check로 정중하게 요청하고 before you give anything으로 시점을 못 박아요. 알레르기 밴드는 어떤 약이든 주기 전에 볼 수 있는 가장 빠른 안전장치예요.", "the label", "무엇을 보여 주기 전에 알레르기 밴드를 확인해 주세요.", "무엇을 적기 전에 알레르기 밴드를 확인해 주세요.", "before", "after", "while", "until"]
  - ["주의 사항", shield, "She's a fall risk and on …처럼 위험 두 가지를 and로 이으면 한 문장에 낙상과 격리를 함께 전해요. on precautions는 지금 격리 조치가 걸려 있다는 상태 표현이에요.", "an aspiration risk", "낙상 위험이 있고 VRE로 접촉주의 중입니다.", "낙상 위험이 있고 ESBL로 접촉주의 중입니다.", "contact", "droplet", "airborne", "enteric"]
  - ["격리 유지", lock, "Keep her on은 이미 걸린 조치를 이어 가라는 뜻이에요. until 뒤에 끝낼 기준(검체 음성)을 붙여야 언제까지 하는지 흐려지지 않아요.", "fall precautions", "혈액 배양이 음성으로 나올 때까지 격리주의를 유지해 주세요.", "소변 배양이 음성으로 나올 때까지 격리주의를 유지해 주세요.", "negative", "positive", "late", "wrong"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 알레르기와 주의사항 4문장 순서
    why: 가장 위험한 약물 알레르기를 먼저 말하고, 그 뒤에 다른 알레르기 표시를 보태고, 둘을 근거로 투여 전 확인을 요청한 뒤, 낙상과 격리 주의로 끝내요.
    lines:
    - ["She's allergic to penicillin — it causes anaphylaxis.", siren, "페니실린 알레르기가 있고 아나필락시스를 일으켜요", "알레르기"]
    - ["Besides that allergy, there's a latex flag on her chart.", pushpin, "그 알레르기 말고도 차트에 라텍스 표시가 있어요", "표시"]
    - ["With both of those, please check the allergy band before you give anything.", shield, "그 둘이 있으니 투여 전에 알레르기 밴드를 확인해 주세요", "확인"]
    - ["Last, she's a fall risk and on contact precautions for MRSA.", lock, "마지막으로 낙상 위험이 있고 MRSA로 접촉주의 중이에요", "주의"]
- title: 인계 중 확인질문 응대
  s:
  - ["확인 응답", check, "Yes로 먼저 답하고 that's correct로 확인해 주면 받는 사람이 다시 묻지 않아요. 용량은 단위까지 끝까지 말해야 해요.", "per bag", "네, 맞습니다, 시간당 킬로그램당 15단위입니다.", "네, 맞습니다, 시간당 킬로그램당 20단위입니다.", "correct", "wrong", "incorrect", "unclear"]
  - ["되읽기 요청", speaker, "Read it back은 들은 값을 그대로 되읽어 달라는 안전 확인 표현이에요. so we're both sure로 이유를 붙이면 의심이 아니라 서로를 위한 절차로 들려요.", "ready", "둘 다 빠르도록 저에게 되읽어 주세요.", "둘 다 만족하도록 저에게 되읽어 주세요.", "sure", "tired", "calm", "quiet"]
  - ["되묻기", speech, "Sorry로 먼저 사과하고 could you로 부탁하면 되묻는 일이 무례하게 들리지 않아요. 무엇을 못 들었는지(the rate)까지 말해야 상대가 필요한 부분만 다시 말해요.", "the drug name", "죄송한데 다시 말씀해 주시겠어요? 시간을 못 들었어요.", "죄송한데 다시 말씀해 주시겠어요? 단위를 못 들었어요.", "rate", "name", "time", "date"]
  - ["오류 인정", bulb, "Good catch는 상대가 짚은 점이 맞았다고 먼저 인정하는 말이에요. 바로 이어 let me clarify로 정정 의지를 보이면 방어적으로 들리지 않아요.", "that order", "잘 들으셨어요, 그 용량을 명확히 해 드릴게요.", "잘 외우셨어요, 그 용량을 명확히 해 드릴게요.", "clarify", "change", "cancel", "delay"]
  - ["값 재확인", check, "So, just to make sure로 시작해 틀렸다는 지적이 아니라 확인이라는 틀을 만들어요. not fifty처럼 헷갈리는 값을 같이 말하면 15와 50의 혼동을 막아요.", "fifteen minutes", "그러니까 확실히 하자면, 50이 아니라 25밀리그램이라고 하신 거죠?", "그러니까 확실히 하자면, 50이 아니라 10밀리그램이라고 하신 거죠?", "fifteen", "fifty", "five", "twenty"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 값 되묻기와 확인 4문장 순서
    why: 못 들은 부분을 먼저 되묻고, 답을 들은 뒤, 헷갈리는 값을 짚어 재확인하고, 맞다는 답과 함께 되읽어 달라고 닫아요.
    lines:
    - ["Sorry, could you say that again? I didn't catch the rate.", speech, "죄송한데 다시 말씀해 주시겠어요? 속도를 못 들었어요", "되묻기"]
    - ["It's twelve units per kilo per hour.", pill, "시간당 킬로그램당 12단위예요", "답변"]
    - ["So, just to make sure — you said twelve units, not twenty?", check, "확실히 하자면 20이 아니라 12단위라고 하신 거죠?", "재확인"]
    - ["Yes, that's correct — now read it back to me.", speaker, "네 맞아요, 이제 저에게 되읽어 주세요", "되읽기"]
- title: ROSC 후 환자 인계
  s:
  - ["정지 경과", siren, "Down time은 맥박이 없던 시간을 부르는 현장 표현이에요. about으로 어림값임을 밝히고 epi 횟수를 with로 붙여 소생 과정을 한 문장에 담아요.", "of fluid", "정지 시간은 약 15분이었고, 에피네프린은 두 차례 투여했습니다.", "정지 시간은 약 10분이었고, 에피네프린은 세 차례 투여했습니다.", "minutes", "hours", "days", "seconds"]
  - ["소생 성공", check, "We got은 결과를 얻었다는 보고의 틀이에요. ROSC 앞뒤에 시점을 after로 붙이면 몇 번째 압박 뒤에 돌아왔는지 흐름이 남아요.", "of shocks", "두 번째 흉부압박 차례 후 자발순환이 회복되었습니다.", "다섯 번째 흉부압박 차례 후 자발순환이 회복되었습니다.", "ROSC", "PEA", "VF", "asystole"]
  - ["상태 요약", hospital, "post-arrest, intubated처럼 상태를 짧은 낱말로 쌓으면 현재 상황을 한 번에 요약해요. and we're starting으로 곧 시작하는 처치까지 붙여요.", ", and we're starting CT", "심정지 후 상태이고, 진정되어 있고, TTM을 시작합니다.", "심정지 후 상태이고, 삽관되어 있고, TTM을 이어 갑니다.", "intubated", "extubated", "discharged", "transferred"]
  - ["다음 단계", compass, "Next steps are 뒤에 항목을 쉼표로 나열하면 해야 할 일의 목록이 한 번에 들려요. labs처럼 짧은 약어는 현장에서 검사 묶음을 뜻해요.", ", imaging", "마지막 단계는 12유도 심전도, 검사, 신경학적 확인입니다.", "첫 단계는 12유도 심전도, 검사, 신경학적 확인입니다.", "twelve-lead", "chest X-ray", "head CT", "bedside echo"]
  - ["확인 간격", monitor, "due every …는 일정한 간격으로 해야 할 일이 예정되어 있다는 뜻이에요. for the first hour로 기간을 한정하면 언제 간격을 다시 정할지 알 수 있어요.", "Vital signs", "신경학적 확인은 첫 두 시간 동안 15분마다 예정되어 있습니다.", "신경학적 확인은 첫 세 시간 동안 15분마다 예정되어 있습니다.", "first", "last", "next", "second"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: ROSC 후 인계 4문장 순서
    why: 자발순환이 돌아온 경과를 먼저 말하고, 그 뒤 현재 상태와 치료를 요약하고, 이어질 단계를 나열한 뒤, 그중 신경학적 확인의 간격으로 끝내요.
    lines:
    - ["We got ROSC after the third round of compressions.", check, "세 번째 흉부압박 후 자발순환이 회복됐어요", "경과"]
    - ["Since then, he's intubated and we're starting TTM.", hospital, "그 뒤로 삽관되어 있고 TTM을 시작해요", "상태"]
    - ["Next steps are a twelve-lead, labs, and neuro checks.", compass, "다음 단계는 12유도 심전도, 검사, 신경학적 확인이에요", "다음"]
    - ["For those neuro checks, they're due every fifteen minutes for the first hour.", monitor, "그 신경학적 확인은 첫 한 시간 동안 15분마다예요", "간격"]
