    why: 상황을 알리고, 전문의를 불렀다고 말한 뒤, 의견이 나올 때마다 알리겠다고 약속하고, 나쁜 소식도 솔직하게 전하겠다고 해요.
    lines:
    - en: Several of his organs are under stress, and the whole team is involved.
      icon: hospital
      ko: 여러 장기가 스트레스를 받아 전체 팀이 함께해요
      note: 상황
    - en: His kidneys and lungs are both under strain, so we've called in extra specialists.
      icon: hospital
      ko: 콩팥과 폐가 둘 다 무리라 전문의를 추가로 불렀어요
      note: 호출
    - en: I'll give you a clear update as each specialist weighs in.
      icon: speech
      ko: 전문의 의견이 나올 때마다 명확히 알려드릴게요
      note: 약속
    - en: Even when what they say is hard, I'll keep you updated honestly.
      icon: faceWorried
      ko: 그들 말이 힘들어도 솔직하게 계속 알려드릴게요
      note: 정직
