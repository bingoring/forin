situations:
- title: 동의 능력·언어 혼재 판단
  s:
  - ["통역 사용", mic, "to assess him fairly처럼 목적을 먼저 밝히면 통역이 평가를 돕는 도구라는 점이 분명해져요. fairly가 언어 때문에 불리해지지 않게 하겠다는 약속이에요.", "in his room", "빠르게 사정하기 위해 통역사를 쓸게요.", "공정하게 설명하기 위해 통역사를 쓸게요.", "fairly", "quickly", "secretly", "roughly"]
  - ["능력 원칙", shield, "depends on understanding은 의사결정 능력의 기준이 이해라는 뜻이에요. not just language가 언어만으로 판단하지 않는다는 점을 짚어요.", "in the end", "의사결정 능력은 언어가 아니라 나이에 달려 있어요.", "의사결정 능력은 언어가 아니라 기분에 달려 있어요.", "understanding", "age", "mood", "accent"]
  - ["되설명 확인", check, "explain the choice back는 선택을 자기 말로 다시 설명하게 해서 이해를 확인해요. Let's see if로 평가를 판정이 아니라 함께 살펴보는 일로 말해요.", "in his words", "그가 그 선택을 저희에게 다시 적을 수 있는지 봐요.", "그가 그 선택을 저희에게 다시 고를 수 있는지 봐요.", "explain", "sign", "guess", "change"]
  - ["혼합 언어 이해", faceWorried, "Mixing languages doesn't mean처럼 doesn't mean으로 흔한 오해를 바로잡아요. 언어를 섞는 것은 이해 부족의 증거가 아니라는 뜻이에요.", "at times", "언어를 섞는다고 기억을 못 하는 건 아니에요.", "말을 더듬는다고 이해를 못 하는 건 아니에요.", "Mixing", "Learning", "Losing", "Teaching"]
  - ["반복 평가", redo, "not just once는 한 번의 결과로 판단하지 않겠다는 뜻이에요. carefully가 평가가 신중하다는 약속이에요.", "with him", "한 번만이 아니라 따로 확인할게요.", "한 번만이 아니라 매일 확인할게요.", "once", "twice", "early", "alone"]
  - ["결과 이해 확인", bulb, "what happens if he agrees는 동의의 결과를 이해하는지 묻는 질문이에요. Can he tell us로 환자의 능력을 가족에게 묻는 틀이에요.", "to the plan", "거절하면 어떻게 되는지 그가 저희에게 말할 수 있나요?", "동의하면 언제 되는지 그가 저희에게 말할 수 있나요?", "agrees", "refuses", "waits", "leaves"]
  - ["공정 약속", handshake2, "either way는 동의하든 거절하든 결과와 상관없이라는 뜻이에요. fair to him이 환자에게 공정하겠다는 약속이에요.", "in the end", "어느 쪽이든 그에게 솔직하고 싶어요.", "어느 쪽이든 그에게 정중하고 싶어요.", "fair", "loyal", "rude", "strict"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 동의 능력 판단 4문장 순서
    why: 통역을 쓰겠다고 알리고, 선택을 설명해 보게 하고, 결과를 이해하는지 묻고, 그 모든 확인을 한 번에 끝내지 않겠다고 맺어요.
    lines:
    - ["We'll use an interpreter to assess him fairly.", mic, "공정하게 사정하기 위해 통역사를 쓸게요", "통역 사용"]
    - ["Let's see if he can explain the choice back to us.", check, "그가 선택을 다시 설명할 수 있는지 봐요", "되설명"]
    - ["Next, can he tell us what happens if he agrees?", bulb, "다음으로 동의하면 어떻게 되는지 말할 수 있나요", "결과 이해"]
    - ["After all of that, we'll check this carefully, not just once.", redo, "그 모든 후에 한 번만이 아니라 신중하게 확인할게요", "반복 확인"]
- title: 통역 부재 응급 대응
  s:
  - ["전화 통역", mic, "using ... right now는 지금 이 순간 쓰고 있다는 진행형이라 가족이 기다리지 않아도 된다는 뜻이에요. phone interpreter line이 영상이 아니라 전화라는 점을 알려요.", "to help us talk", "지금 바로 영상 통역 라인을 쓰고 있어요.", "지금 바로 문자 통역 라인을 쓰고 있어요.", "phone", "video", "text", "radio"]
  - ["그림판 사용", board, "Point to ... to tell me는 말 대신 그림을 가리켜 답하라는 뜻이에요. what you feel이 증상과 느낌을 폭넓게 묻는 질문이에요.", "at the top", "필요한 걸 이 그림판을 가리켜서 말해주세요.", "느끼시는 걸 이 그림판에 적어서 말해주세요.", "feel", "need", "see", "hear"]
  - ["곁 약속", shield, "You're safe로 먼저 안전을 말하고, I'm staying right here with you로 곁에 남겠다고 약속해요. 두 마디가 짧아서 번역이 안 돼도 억양과 동작으로 전해져요.", "so you know", "편안해요, 제가 바로 여기 함께 있을게요.", "안전해요, 제가 바로 여기 앉아 있을게요.", "staying", "sitting", "working", "charting"]
  - ["손 신호", pushpin, "if you understand me로 환자가 내 말을 알아들었는지 손 신호로 확인해요. 말이 통하지 않을 때 가장 단순한 확인법이에요.", "with both hands", "이해되시면 제 팔을 꼭 쥐어주세요.", "들리시면 제 손을 꼭 쥐어주세요.", "understand", "hear", "see", "trust"]
  - ["질문 방식", speech, "simple yes or no questions는 환자가 한마디나 신호로 답할 수 있는 질문이에요. for now가 통역이 올 때까지 임시 방식이라는 뜻이에요.", "to help", "지금은 색으로 답할 간단한 질문만 드릴게요.", "지금은 그림으로 답할 간단한 질문만 드릴게요.", "simple", "long", "hard", "legal"]
  - ["도움 알림", bell, "Help is on the way는 도움이 이미 오고 있다는 뜻이에요. hold on은 조금만 버티라는 짧은 격려예요.", "to the room", "통역이 오고 있어요, 조금만 견뎌주세요.", "가족이 오고 있어요, 조금만 견뎌주세요.", "Help", "Family", "Food", "Water"]
  - ["곁 약속", home, "won't처럼 짧은 부정 약속은 번역이 서툴러도 의미가 전달돼요. your side가 환자 곁에 남는다는 뜻이에요.", "no matter what", "당신 이야기를 놓치지 않을게요.", "당신 말을 끊지 않을게요.", "leave", "lose", "miss", "cover"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 통역 부재 4문장 순서
    why: 전화 통역을 쓰고 있다고 알리고, 연결되면 들을 거라고 알리고, 이해했는지 손으로 확인하게 하고, 확인 뒤에 쉬운 질문을 시작해요.
    lines:
    - ["I'm using the phone interpreter line right now.", mic, "지금 바로 전화 통역 라인을 쓰고 있어요", "통역 알림"]
    - ["You'll hear the interpreter speak through it in a moment.", speaker, "곧 그걸 통해 통역사의 말이 들릴 거예요", "연결 안내"]
    - ["Squeeze my hand if you understand what they say.", pushpin, "그 말이 이해되시면 제 손을 쥐어주세요", "손 신호"]
    - ["After you squeeze, I'll ask simple yes or no questions.", speech, "쥐신 뒤에 간단한 예·아니오 질문을 드릴게요", "질문 시작"]
- title: 문화 갈등·치료 거부 소통
  s:
  - ["존중 표현", handshake2, "respect와 want to understand를 이어 말하면 동의하지 않아도 존중한다는 태도가 먼저 전해져요. 갈등을 풀기 전 가장 중요한 첫 말이에요.", "in full", "당신의 신념을 기억하고 이해하고 싶어요.", "당신의 습관을 존중하고 이해하고 싶어요.", "respect", "doubt", "judge", "test"]
  - ["가치와 안전", shield, "honors your values and his safety는 가족의 가치와 환자의 안전을 둘 다 지키겠다는 뜻이에요. 둘 중 하나를 포기하지 않는 방법을 함께 찾자는 제안이에요.", "and his comfort", "당신의 가치와 그의 편의를 모두 존중하는 방법을 찾아봐요.", "당신의 가치와 그의 안전을 모두 설명하는 방법을 찾아봐요.", "honors", "changes", "hides", "tests"]
  - ["공통점 찾기", compass, "find common ground는 서로 다른 입장 사이에서 겹치는 부분을 찾는다는 관용구예요. 통역과 윤리팀이 함께 돕는다고 말해 혼자 해결하지 않아도 된다고 안심시켜요.", "from the unit", "통역사와 윤리팀이 함께 빈 방을 찾도록 도와줄 거예요.", "통역사와 윤리팀이 함께 공통점을 기록하도록 도와줄 거예요.", "ethics", "billing", "security", "dietary"]
  - ["걱정 묻기", bulb, "Tell me more는 이미 한 말을 더 해 달라는 열린 요청이에요. what concerns you가 거부의 이유를 판단하지 않고 묻는 질문이에요.", "about this", "무엇이 궁금하신지 더 말씀해 주세요.", "무엇이 필요하신지 더 말씀해 주세요.", "concerns", "helps", "pleases", "bores"]
  - ["중요성 인정", faceWorried, "I hear는 '들었다'를 넘어 '이해했다'는 뜻으로 쓰여요. how important this is가 가족에게 얼마나 큰 일인지 알아본다는 표현이에요.", "to him", "이것이 당신 가족에게 얼마나 어려운지 알겠어요.", "이것이 당신 가족에게 얼마나 새로운지 알겠어요.", "important", "hard", "new", "costly"]
  - ["합의점 대화", handshake2, "what we can agree on은 동의할 수 있는 것부터 말하자는 뜻이에요. 의견이 다른 부분은 뒤로 미루고 겹치는 부분에서 시작해요.", "right now", "우리가 확인할 수 있는 부분을 이야기해봐요.", "우리가 시작할 수 있는 부분을 이야기해봐요.", "agree", "decide", "build", "count"]
  - ["신념 존중", shield, "We're not asking you to는 강요가 아니라는 선언이에요. change your beliefs가 요구하지 않는 것을 분명히 해서 방어적 태도를 풀어요.", "today", "당신의 방식을 바꾸라는 게 아니에요.", "당신의 신념을 설명하라는 게 아니에요.", "change", "share", "prove", "hide"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 문화 갈등 4문장 순서
    why: 신념을 존중한다는 말로 시작하고, 걱정을 묻고, 들은 걱정을 바탕으로 방법을 제안하고, 신념을 바꾸라는 게 아님을 확인해요.
    lines:
    - ["I respect your beliefs and want to understand them.", handshake2, "당신의 신념을 존중하고 이해하고 싶어요", "존중"]
    - ["Tell me more about what concerns you.", bulb, "무엇이 걱정되시는지 더 말씀해 주세요", "걱정 묻기"]
    - ["Based on that, let's find an approach that honors your values and his safety.", shield, "그걸 바탕으로 가치와 안전을 모두 존중하는 방법을 찾아봐요", "방법 제안"]
    - ["Either way, we're not asking you to change your beliefs.", shield, "어느 쪽이든 신념을 바꾸라는 게 아니에요", "신념 존중"]
