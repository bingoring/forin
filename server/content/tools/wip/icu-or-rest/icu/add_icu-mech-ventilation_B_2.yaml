- title: 기관 흡인 협조
  s:
  - {t: "흡인 준비", i: gear, w: "pre-oxygenate는 흡인으로 산소가 잠깐 떨어질 것에 대비해 미리 산소를 높여 둔다는 뜻이에요. before를 쓰면 그 순서가 카테터를 넣기 전이라는 점이 분명해져요.", d: "on the cart", k: ["문을 열기 전에 먼저 전산소화를 할게요", "보호자가 나가기 전에 먼저 전산소화를 할게요"], a: "catheter", o: ["needle", "wire", "probe"]}
  - {t: "무균 유지", i: shield, w: "Let's keep ...은 같이 하자는 권유 모양이라 상대를 나무라지 않고 팀의 규칙으로 말해요. 기관 흡인은 기도에 관을 넣는 처치라서 균이 들어가면 폐렴으로 이어질 수 있다는 이유가 so 뒤에 담겨 있어요.", d: "in the sink", k: ["감염이 생기지 않게 건조한 상태를 유지해요", "냄새가 생기지 않게 무균 상태를 유지해요"], a: "infection", o: ["air", "pressure", "dust"]}
  - {t: "감시 요청", i: monitor, w: "Watch ... while ..., and stop if ...는 명령문 세 마디로 할 일을 순서대로 말해 급한 처치 중에도 빨리 알아들어요. stop if he desaturates는 중단 조건을 미리 정해 두어서 수치가 떨어질 때 따로 묻지 않고 바로 멈출 수 있어요.", d: "in the room", k: ["제가 환자를 돌리는 동안 산소를 봐주시고, 포화도가 떨어지면 멈춰 주세요", "제가 장갑을 갈아 끼우는 동안 산소를 봐주시고, 포화도가 떨어지면 멈춰 주세요"], a: "suction", o: ["turn", "pause", "wait"]}
  - {t: "처치 예고", i: speech, w: "I'm going to ...는 곧 할 일을 미리 알리는 모양이에요. might cough를 함께 말하면 환자가 기침을 이상 증상으로 오해하지 않아요.", d: "in the chair", k: ["지금 흡인할 건데, 잠깐 눈물이 날 수 있어요", "지금 흡인할 건데, 잠깐 어지러울 수 있어요"], a: "cough", o: ["sneeze", "cry", "yawn"]}
  - {t: "공감 설명", i: faceWorried, w: "uncomfortable for a few seconds는 불편함의 정도와 기간을 구체적으로 말해 환자가 앞일을 예측하게 해요. but으로 불편함을 먼저 인정한 뒤 곧 끝난다고 이어서 거짓 안심 없이 달래요.", d: "at night", k: ["몇 분 동안 답답하시겠지만, 빨리 끝낼 테니 금방 지나갈 거예요", "몇 초 동안 간지러우시겠지만, 빨리 끝낼 테니 금방 지나갈 거예요"], a: "quick", o: ["slow", "late", "rough"]}
  - {t: "무균 약속", i: shield, w: "always ... for every pass는 예외가 없다는 뜻을 두 번 말해 강조해요. 같은 카테터를 다시 쓰면 기도에서 묻은 균이 다음 흡인 때 되돌아갈 수 있어서 매번 새것을 써요.", d: "in the drawer", k: ["기도를 편하게 해드리려고 매번 새 무균 카테터를 써요", "기도를 안전하게 지키려고 매번 새 무균 카테터를 보여드려요"], a: "pass", o: ["shift", "visit", "day"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "기관 흡인 협조 4문장 순서"
    why: "먼저 산소를 올리고, 산소가 충분해지면 카테터를 넣고, 흡인하는 동안 산소를 지켜보다가, 끝나면 결과를 알려요. Once he's well oxygenated와 Once I'm done이 앞 줄의 일이 끝난 시점을 가리켜서 순서가 하나예요."
    lines:
    - {en: "I'll give him extra oxygen first.", icon: gear, ko: "먼저 산소를 더 드릴게요", note: "준비"}
    - {en: "Once he's well oxygenated, I'll pass a new sterile catheter.", icon: shield, ko: "산소가 충분해지면 새 무균 카테터를 넣을게요", note: "삽입"}
    - {en: "Watch his oxygen while I suction, and stop if he desaturates.", icon: monitor, ko: "흡인하는 동안 산소를 봐주시고 떨어지면 멈춰 주세요", note: "감시"}
    - {en: "Once I'm done, I'll let you know how his oxygen looked.", icon: check, ko: "끝나면 산소가 어땠는지 알려드릴게요", note: "보고"}
- title: 모드 전환 이해
  s:
  - {t: "모드 설명", i: gear, w: "lets him take는 환자가 할 수 있게 허락한다는 뜻이라 기계가 전부 하는 것이 아니라 환자의 호흡이 섞인다는 점이 전해져요. some을 쓰면 전부가 아니라 일부라는 정확한 범위를 알려요.", d: "from the nurse", k: ["이 새 모드는 스스로 기침을 일부 하게 해줘요", "이 새 모니터는 스스로 호흡을 일부 하게 해줘요"], a: "mode", o: ["bed", "cuff", "tape"]}
  - {t: "단계 설명", i: chartup, w: "gradually는 한 번에 바꾸지 않고 조금씩 늘린다는 속도를 말해요. do more of the work는 환자가 맡는 몫이 커진다는 뜻이라 보호자가 기계 도움이 줄어드는 이유를 이해해요.", d: "by hand", k: ["먹는 일을 점차 스스로 더 하게 하고 있어요", "걷는 일을 점차 스스로 더 하게 하고 있어요"], a: "breathing", o: ["walking", "eating", "dressing"]}
  - {t: "경과 관찰", i: magnify, w: "how he tolerates는 변화를 얼마나 감당하는지를 보겠다는 의문사절이에요. over the next hour처럼 관찰 기간을 정해서 말하면 보호자가 언제까지 지켜보는지 알 수 있어요.", d: "from the bed", k: ["앞으로 한 시간 동안 이 변화를 좋아하는지 볼게요", "앞으로 하루 동안 이 변화를 잘 견디는지 볼게요"], a: "tolerates", o: ["dislikes", "finishes", "requests"]}
  - {t: "모드 비교", i: board, w: "A ..., but B ...는 두 모드를 대비해 차이를 한 문장에 담는 모양이에요. fully와 part가 짝을 이뤄서 기계가 맡는 몫이 얼마나 다른지 들려요.", d: "for her", k: ["AC는 천천히 대신 숨을 쉬어주고, SIMV는 일부를 스스로 하게 해요", "AC는 완전히 대신 숨을 쉬어주고, SIMV는 일부를 간호사가 하게 해요"], a: "fully", o: ["partly", "slowly", "quietly"]}
  - {t: "안심 설명", i: shield, w: "If he seems ...는 환자의 모습을 근거로 한 조건문이에요. we can always adjust it은 모드가 한 번 정하면 끝이 아니라 바꿀 수 있다는 뜻이라 보호자의 불안이 줄어요.", d: "from here", k: ["이 새 모드가 졸려 보이거나 불편해 보이면 언제든 조정할 수 있어요", "이 새 모드가 힘들어 보이거나 불편해 보이면 언제든 설명할 수 있어요"], a: "tired", o: ["calm", "relaxed", "stable"]}
  - {t: "모드 설명", i: gear, w: "only when은 조건이 맞을 때만 일어난다는 한정 표현이에요. 환자가 숨을 시작해야 기계가 보조하므로 스스로 시작하는 호흡이 있어야 쓸 수 있는 모드라는 점이 전해져요.", d: "from the vent", k: ["PSV는 스스로 호흡을 시작할 때만 알려 줘요", "PSV는 스스로 기침을 시작할 때만 보조해 줘요"], a: "support", o: ["sedation", "medicine", "fluid"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "새 호흡기 모드 설명 4문장 순서"
    why: "모드가 바뀌었다고 알리고, 그 모드가 하는 일을 It으로 설명하고, 한 시간 동안 견디는지 본다고 말한 뒤, 견디기 힘들어 보이면 조정한다고 맺어요. 뒤 줄의 it과 tolerates it이 앞 줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "The team changed him to a new ventilator mode.", icon: gear, ko: "팀에서 새 인공호흡기 모드로 바꿨어요", note: "안내"}
    - {en: "It lets him take some of his own breaths.", icon: speech, ko: "그 모드는 스스로 호흡을 일부 하게 해줘요", note: "설명"}
    - {en: "I'll watch how he tolerates it over the next hour.", icon: magnify, ko: "앞으로 한 시간 동안 잘 견디는지 볼게요", note: "관찰"}
    - {en: "If he tolerates it poorly, we can always adjust it.", icon: shield, ko: "잘 못 견디면 언제든 조정할 수 있어요", note: "안심"}
- title: PEEP 적정 산소화 개선
  s:
  - {t: "압력 조정", i: gear, w: "fine-tuning은 크게 바꾸는 것이 아니라 조금씩 맞추는 조정이라는 뜻이에요. to keep ... open이 목적을 말해 줘서 보호자가 압력을 만지는 이유를 이해해요.", d: "by hand", k: ["폐가 열려 있게 온도를 미세하게 조정하고 있어요", "폐가 열려 있게 압력을 천천히 확인하고 있어요"], a: "pressure", o: ["angle", "sound", "color"]}
  - {t: "결과 설명", i: chartup, w: "After raising ...는 한 일을 먼저 말하고 그 결과를 뒤에 붙이는 시간 순서 모양이에요. improved to a safer level로 좋아진 정도를 말해서 압력을 올린 이유가 결과로 설명돼요.", d: "at noon", k: ["PEEP를 올린 뒤 소변량이 더 안전한 수준으로 좋아졌어요", "PEEP를 올린 뒤 호흡수가 더 안전한 수준으로 좋아졌어요"], a: "improved", o: ["dropped", "stopped", "reversed"]}
  - {t: "단계 조정", i: chartup, w: "in small steps는 한 번에 크게 바꾸지 않고 작은 단위로 나눠 바꾼다는 뜻이에요. watch how he responds까지 붙여서 바꾼 뒤 환자 반응을 확인하는 흐름이 한 문장에 들어 있어요.", d: "by phone", k: ["조금씩 단계별로 닦으면서 반응을 지켜봐요", "조금씩 단계별로 바꾸면서 가족 반응을 지켜봐요"], a: "steps", o: ["orders", "shifts", "rooms"]}
  - {t: "원리 설명", i: bulb, w: "holds ... open so they don't ...는 기능을 먼저 말하고 그 결과를 so로 잇는 모양이에요. between breaths를 넣으면 숨을 내쉴 때도 압력이 남아 폐포가 닫히지 않는다는 PEEP의 핵심이 전해져요.", d: "from the vent", k: ["PEEP가 폐포를 열어둬서 호흡 사이에 말라붙지 않게 해요", "PEEP가 혈관을 열어둬서 호흡 사이에 쭈그러들지 않게 해요"], a: "collapse", o: ["dry", "swell", "bleed"]}
  - {t: "경과 비교", i: chartup, w: "better than it was는 지금과 과거를 비교하는 형태예요. an hour ago처럼 비교할 시점을 정해야 좋아졌다는 말이 막연한 느낌이 아니라 확인 가능한 변화로 들려요.", d: "this week", k: ["한 시간 전보다 통증 수준이 좋아졌어요", "두 시간 전보다 산소 수준이 좋아졌어요"], a: "oxygen", o: ["sugar", "fever", "hunger"]}
  - {t: "과정 보고", i: chartup, w: "by small steps와 each time은 한 번에 바꾸지 않고 바꿀 때마다 확인했다는 뜻이에요. 과거형이라 이미 끝난 조정 과정을 보고하는 말이라서 결과를 말한 앞 문장과 이어져요.", d: "in the afternoon", k: ["PEEP를 조금씩 올리면서 그때마다 알람이 어떻게 반응하는지 지켜봤어요", "PEEP를 조금씩 올리면서 그때마다 수치가 어떻게 반응하는지 기록했어요"], a: "numbers", o: ["visitors", "doctors", "parents"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "PEEP 조정 경과 설명 4문장 순서"
    why: "산소가 낮아 PEEP를 올렸다고 말하고, 조금씩 올리며 반응을 봤다고 설명하고, 그 뒤 산소가 좋아졌다고 알리고, 마지막에 That's why로 PEEP의 원리를 설명해요. After that과 That's why가 앞 줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "His oxygen was low, so the team raised the PEEP.", icon: gear, ko: "산소가 낮아서 팀에서 PEEP를 올렸어요", note: "이유"}
    - {en: "We raised it by small steps and watched how he responded.", icon: chartup, ko: "조금씩 올리며 반응을 지켜봤어요", note: "과정"}
    - {en: "After that, his oxygen improved to a safer level.", icon: monitor, ko: "그 뒤 산소가 더 안전한 수준으로 좋아졌어요", note: "결과"}
    - {en: "That's why PEEP holds his air sacs open between breaths.", icon: bulb, ko: "그래서 PEEP가 호흡 사이에도 폐포를 열어둬요", note: "원리"}
- title: 기도내압 상승 경보 감별
  s:
  - {t: "경보 설명", i: bell, w: "tells me ... so ...는 경보가 알려 주는 것과 내가 하는 일을 so로 잇는 모양이에요. 경보 이름이 아니라 의미를 말해 주면 보호자가 소리에 놀라지 않고 상황을 이해해요.", d: "on the wall", k: ["저 경보는 전원이 약하다는 뜻이라, 원인을 찾고 있어요", "저 경보는 호흡수가 높다는 뜻이라, 원인을 찾고 있어요"], a: "why", o: ["who", "where", "when"]}
  - {t: "원인 감별", i: magnify, w: "check if A or if B는 원인 후보 둘을 이름으로 말해 무엇을 볼지 알려요. 높은 기도압은 튜브 꺾임이나 분비물 같은 막힘에서 흔히 생겨서 가장 먼저 보는 두 가지예요.", d: "in the bag", k: ["튜브가 젖었는지, 아니면 흡인이 먼저 필요한지 확인할게요", "튜브가 꺾였는지, 아니면 식사가 먼저 필요한지 확인할게요"], a: "kinked", o: ["blue", "short", "new"]}
  - {t: "안심 설명", i: shield, w: "still은 경보가 울리는 동안에도 중단 없이 계속된다는 뜻을 더해요. 원인을 찾는 동안 산소 공급이 이어진다고 알리면 보호자가 가장 걱정하는 점부터 풀려요.", d: "from the tank", k: ["원인을 찾는 동안에도 가습은 계속 되고 있어요", "원인을 찾는 동안에도 수액은 계속 들어가고 있어요"], a: "oxygen", o: ["fluids", "medicine", "food"]}
  - {t: "경보 안심", i: shield, w: "isn't ..., it just means ...는 먼저 오해를 부정하고 실제 뜻을 설명하는 모양이에요. 소리만 들으면 가족이 최악을 떠올리기 쉬워서 이 경보가 무엇을 뜻하는지 바로 말해 줘요.", d: "for the family", k: ["이 경보는 응급상황이 아니라, 제가 좀 더 자세히 적어야 한다는 뜻이에요", "이 경보는 응급상황이 아니라, 제가 좀 더 자세히 알려드려야 한다는 뜻이에요"], a: "emergency", o: ["error", "accident", "injury"]}
  - {t: "원인 설명", i: bulb, w: "can mean A, or it can mean B는 가능한 의미를 둘 이상 열어 두는 모양이에요. 한 가지로 단정하지 않는 이유는 높은 압력이 흡인 같은 처치로 풀리는 경우도 있고 폐 상태 자체일 때도 있기 때문이에요.", d: "on the chart", k: ["압력이 높은 건 소독이 필요하다는 뜻일 수도, 오늘 폐가 뻣뻣하다는 뜻일 수도 있어요", "압력이 높은 건 흡인이 필요하다는 뜻일 수도, 오늘 폐가 뜨겁다는 뜻일 수도 있어요"], a: "stiff", o: ["dry", "blue", "small"]}
  - {t: "보고 약속", i: speech, w: "I'll report ... and adjust ...는 두 가지 할 일을 and로 이어 약속하는 모양이에요. 팀에 보고한다는 말은 간호사 혼자 판단을 끝내지 않고 치료 계획을 함께 조정한다는 뜻이에요.", d: "by phone", k: ["찾은 내용을 팀에 보고하고 일정을 조정할게요", "찾은 내용을 팀에 보고하고 계획을 기록할게요"], a: "plan", o: ["tube", "menu", "room"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "높은 압력 경보 대응 4문장 순서"
