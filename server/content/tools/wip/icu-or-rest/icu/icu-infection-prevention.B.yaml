situations:
- title: 손위생·PPE 착탈
  sentences:
  - en: Please clean your hands with the gel before and after visiting.
    ko: 방문 전후로 젤로 손을 소독해 주세요.
    chunks:
    - Please clean your hands
    - with the gel
    - before and after
    - visiting
    - .
    words:
    - w-clean
    - w-hand
    - w-gel
    - w-visit
    goal: 1
    tag: 손위생 안내
    icon: shield
    why: Please로 지시를 부드럽게 하고 'before and after'로 시점을 두 번 짚어, 방문하는 가족이 언제 해야 하는지 한 번에 알려요.
    decoy: in the hallway
    distractorsKo:
    - 식사 전후로 젤로 손을 소독해 주세요.
    - 검사 전후로 젤로 손을 소독해 주세요.
    blank:
      answer: gel
      options:
      - en: gel
      - en: lotion
      - en: cream
      - en: powder
  - en: Put the gown on first, then the gloves, before you go in.
    ko: 들어가시기 전에 가운을 먼저 입고, 그다음 장갑을 끼세요.
    chunks:
    - Put the gown on first
    - ', then the gloves'
    - ', before you'
    - go in
    - .
    words:
    - w-put
    - w-gown
    - w-first
    - w-glove
    - w-go
    goal: 2
    tag: 착용 순서
    icon: board
    why: '''first … then''으로 순서를 말에 담으면 가운이 먼저, 장갑이 나중이라는 걸 따로 설명하지 않아도 돼요. 보호구는 입는 순서가 정해져 있어요.'
    decoy: at the desk
    distractorsKo:
    - 들어가시기 전에 가운 상자를 먼저 열고, 그다음 장갑 상자를 여세요.
    - 들어가시기 전에 가운 위치를 먼저 보고, 그다음 장갑 크기를 고르세요.
    blank:
      answer: gown
      options:
      - en: gown
      - en: jacket
      - en: blanket
      - en: towel
  - en: When you leave, remove the gloves first, then the gown.
    ko: 나가실 때는 장갑을 먼저 벗고, 그다음 가운을 벗으세요.
    chunks:
    - When you leave
    - ', remove the gloves'
    - first
    - ', then the gown'
    - .
    words:
    - w-leave
    - w-remove
    - w-glove
    - w-first
    - w-gown
    goal: 2
    tag: 벗는 순서
    icon: board
    why: 벗을 때는 가장 더러워진 장갑을 먼저 벗어요. 'when you leave'로 그 시점을 먼저 밝히면 순서가 따라와요.
    decoy: by the door
