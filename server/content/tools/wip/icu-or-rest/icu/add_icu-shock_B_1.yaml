- title: 쇼크 초기 관류 사정
  s:
  - {t: "관류 사정", i: stetho, w: "to see how …는 여러 가지를 살피는 목적을 밝히는 모양이에요. 이유를 함께 말해 주면 환자가 낯선 확인을 덜 불안해해요.", d: "for the visitors", k: ["피부, 의식 수준, 소변량을 확인해서 몸 상태가 어떤지 적고 있어요", "피부, 의식 수준, 소변량을 확인해서 체중이 어떤지 보고 있어요"], a: "alertness", o: ["posture", "hearing", "height"]}
  - {t: "단서 설명", i: magnify, w: "so가 앞의 증상을 지금 보는 이유로 이어 줘요. 차가운 손이라는 관찰을 먼저 말해서, 사정이 갑작스러운 일이 아니라 근거가 있는 일로 들려요.", d: "in the hallway", k: ["발이 차가워서 순환 상태를 보고 있어요", "손이 아파서 순환 상태를 보고 있어요"], a: "circulation", o: ["digestion", "vision", "balance"]}
  - {t: "경과 관찰", i: monitor, w: "keep a close eye on은 한 번 보고 끝이 아니라 계속 지켜본다는 관용구예요. update the team을 붙이면 혼자 보는 것이 아니라 변화를 공유한다는 뜻이 돼요.", d: "at the window", k: ["이 징후들을 계속 지켜보고 가족에게 알릴게요", "이 징후들을 계속 기록하고 팀에 알릴게요"], a: "update", o: ["thank", "greet", "join"]}
  - {t: "의식 확인", i: speech, w: "Can you tell me …?는 시험처럼 묻지 않고 부탁하는 모양이에요. 이름과 장소를 함께 물으면 의식과 지남력을 한 번에 살필 수 있어요.", d: "with a pencil", k: ["성함과 지금 누구와 계신지 말씀해 주시겠어요?", "성함과 지금 몇 시인지 말씀해 주시겠어요?"], a: "where", o: ["who", "when", "why"]}
  - {t: "소변량 확인", i: lab, w: "how much는 양을 묻는 의문사 모양이고, you're making이라고 해서 환자 몸이 만들어 내는 양이라는 뜻이 돼요. 소변량은 신장으로 가는 혈류를 보여 주는 지표예요.", d: "from the closet", k: ["소변이 언제 나왔는지 확인해 볼게요", "소변이 얼마나 나오는지 물어볼게요"], a: "urine", o: ["sweat", "saliva", "phlegm"]}
  - {t: "피부 관찰", i: faceWorried, w: "Your skin looks pale 뒤에 so로 지켜보는 이유를 이었어요. closely는 대충이 아니라 자세히 본다는 부사라서 지켜보는 강도를 알려 줘요.", d: "near the sink", k: ["피부가 노랗게 보여서 자세히 지켜볼게요", "피부가 창백해 보여서 사진을 찍어 둘게요"], a: "pale", o: ["dry", "itchy", "rough"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "쇼크 초기 관류 사정 4문장 순서"
    why: "무엇을 하는지 먼저 알리고, 이름과 장소를 묻고, 대답에 감사하며 의식 상태를 확인하고, 마지막에 그 징후들을 팀에 알린다고 해요. 3줄의 that은 2줄의 대답을, 4줄의 these signs는 앞의 확인들을 가리켜서 순서가 하나예요."
    lines:
    - {en: "I'm going to check how your body is doing.", icon: stetho, ko: "몸 상태가 어떤지 확인할게요", note: "안내"}
    - {en: "Can you tell me your name and where you are?", icon: speech, ko: "성함과 지금 어디 계신지 말씀해 주시겠어요?", note: "질문"}
    - {en: "Thank you, that helps me see how alert you are.", icon: check, ko: "감사해요, 그걸로 의식이 어떤지 알 수 있어요", note: "확인"}
    - {en: "I'll keep watching these signs and update the team.", icon: monitor, ko: "이 징후들을 계속 보고 팀에 알릴게요", note: "공유"}
- title: 젖산 채혈·경향 추적
  s:
  - {t: "재검 설명", i: lab, w: "repeat는 한 번 더 재는 것이고 trend는 점 하나가 아니라 변화의 방향이에요. 젖산은 한 번의 수치보다 오르내림으로 읽어요.", d: "of the room", k: ["젖산을 재검해서 경향을 정리할게요", "젖산을 재검해서 경향을 그려 볼게요"], a: "trend", o: ["limit", "label", "color"]}
  - {t: "의미 설명", i: chartup, w: "usually는 늘 그렇지는 않다는 완곡한 부사예요. 젖산 하락은 관류가 좋아진다는 신호지만 다른 이유도 있을 수 있어서 단정하지 않고 말해요.", d: "in the morning", k: ["젖산이 떨어지고 있다는 건 대개 통증이 줄고 있다는 뜻이에요", "젖산이 떨어지고 있다는 건 대개 열이 내리고 있다는 뜻이에요"], a: "improving", o: ["worsening", "stalling", "fading"]}
  - {t: "결과 보고", i: speech, w: "as soon as는 결과가 나오는 순간 바로 라는 시점 표현이에요. it results처럼 result를 동사로 쓰는 것은 병원에서 검사 결과가 나올 때 쓰는 말이에요.", d: "to the nurse", k: ["새 수치가 나오는 대로 바로 출력할게요", "새 수치가 나오는 대로 환자분께 보고할게요"], a: "report", o: ["repeat", "refuse", "remove"]}
  - {t: "수치 전달", i: board, w: "수치는 four point two처럼 소수점을 point로 읽어요. last는 가장 최근이라는 뜻이어서 지금 수치와 비교할 기준이 돼요.", d: "of the week", k: ["지난번 젖산 수치는 4.8이었어요", "지난번 젖산 수치는 2.4였어요"], a: "last", o: ["next", "same", "only"]}
  - {t: "긴급 의뢰", i: siren, w: "stat은 의료 현장에서 지금 즉시라는 뜻으로 쓰는 약어예요. 젖산 결과를 기다리는 동안 처치가 이어져서 검체를 서둘러 보내요.", d: "to the kitchen", k: ["지금 바로 검사실에 전화할게요", "지금 바로 검사실로 가져갈게요"], a: "stat", o: ["safe", "soft", "sealed"]}
  - {t: "수치 비교", i: chartup, w: "Let's는 함께 하자는 제안 모양이에요. 처음 채혈 수치와 견주어야 젖산이 내려가는지 올라가는지를 알 수 있어요.", d: "to your lunch", k: ["처음 수치와 합쳐 볼게요", "지난 수치와 비교해 볼게요"], a: "first", o: ["second", "third", "final"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "젖산 재검 4문장 순서"
    why: "재검을 하겠다고 먼저 말하고, 그 검체를 보냈다고 알리고, 결과가 나오면 처음 수치와 비교하며, 마지막에 낮아지는 의미를 설명해요. 3줄의 it은 새 검체의 결과를, 4줄의 that은 비교 결과를 가리켜서 순서가 하나예요."
    lines:
    - {en: "I'll draw a repeat lactate now.", icon: lab, ko: "지금 젖산을 재검할게요", note: "채혈"}
    - {en: "I've sent it to the lab stat.", icon: siren, ko: "바로 검사실에 보냈어요", note: "전달"}
    - {en: "When it results, I'll compare it to the first one.", icon: chartup, ko: "결과가 나오면 처음 수치와 비교할게요", note: "비교"}
    - {en: "If that number is lower, perfusion is usually improving.", icon: monitor, ko: "그 수치가 더 낮으면 대개 관류가 좋아지고 있다는 뜻이에요", note: "해석"}
- title: 대량 수액 볼루스 투여 협조
  s:
  - {t: "볼루스 투여", i: pill, w: "wide open은 클램프를 완전히 열어 가장 빠르게 들어가게 한다는 뜻의 현장 표현이에요. 볼루스는 짧은 시간에 많은 양을 넣는 수액이라 속도를 분명히 말해요.", d: "on the pole", k: ["수액 볼루스를 최대 속도로 투여하라고 할게요", "수액 볼루스를 최대 속도로 투여할 수 있어요"], a: "wide", o: ["half", "slow", "narrow"]}
  - {t: "반응 관찰", i: monitor, w: "as it goes in은 수액이 들어가는 바로 그 동안이라는 뜻이에요. 볼루스는 넣는 중에도 혈압과 맥박이 반응하므로 끝난 뒤가 아니라 들어가는 동안 봐요.", d: "in his room", k: ["들어가는 동안 혈압과 호흡수를 지켜봐요", "들어가는 동안 혈압과 맥박을 적어 둬요"], a: "pressure", o: ["weight", "height", "diet"]}
  - {t: "과부하 방지", i: stetho, w: "so we don't …는 하지 않으려고 라는 목적을 나타내요. overload는 수액이 너무 많이 들어가 폐에 물이 차는 상태를 뜻하니, 폐음을 듣는 이유를 함께 알려 줘요.", d: "for the supply room", k: ["과부하 되지 않도록 폐음을 들어 달라고 부탁해요", "과부하 되지 않도록 폐음을 직접 들어 보실래요?"], a: "overload", o: ["overheat", "overturn", "overrun"]}
  - {t: "수액 걸기", i: pill, w: "hang은 수액 백을 걸어 연결한다는 간호 동사예요. a liter of normal saline처럼 단위와 종류를 같이 말하면 무엇을 얼마나 거는지 분명해요.", d: "on the wall", k: ["지금 생리식염수 1리터를 데워 둘게요", "지금 생리식염수 1리터를 꺼낼게요"], a: "liter", o: ["gallon", "bottle", "cup"]}
  - {t: "혈압 상승", i: chartup, w: "already는 예상보다 일찍이라는 뜻이고 a little은 변화가 작다는 완충이에요. 볼루스에 혈압이 반응하는 것은 좋은 신호지만 아직 충분하다는 뜻은 아니에요.", d: "from the unit", k: ["산소포화도가 벌써 조금씩 오르고 있어요", "맥박이 벌써 조금씩 오르고 있어요"], a: "already", o: ["rarely", "barely", "hardly"]}
  - {t: "중단 기준", i: stetho, w: "if절에 조건을 분명히 달았어요. 폐에서 젖은 소리가 들리는 것은 수액이 너무 많이 들어갔다는 신호라서 그때를 멈추는 기준으로 미리 말해 둬요.", d: "beside the cart", k: ["폐에서 천명음이 들리면 바로 멈출게요", "목에서 습성 음이 들리면 바로 멈출게요"], a: "wet", o: ["tight", "loud", "dry"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "대량 수액 볼루스 4문장 순서"
    why: "수액을 연결해 열었다고 알리고, 들어가는 동안 반응을 보며, 폐음 변화가 있으면 멈추고, 마지막으로 결과를 팀에 알려요. 3줄의 it은 수액을, 4줄의 how he did는 앞의 관찰을 가리켜서 순서가 하나예요."
    lines:
    - {en: "I'm hanging a liter of normal saline now.", icon: pill, ko: "지금 생리식염수 1리터를 걸게요", note: "연결"}
    - {en: "I'll run it wide open and watch his pressure.", icon: monitor, ko: "최대 속도로 넣으면서 혈압을 지켜볼게요", note: "투여"}
    - {en: "If his lungs sound wet while it runs, I'll stop it.", icon: stetho, ko: "들어가는 동안 폐에서 습성 음이 들리면 멈출게요", note: "중단"}
    - {en: "Then I'll tell the team how he did.", icon: speech, ko: "그다음 팀에 어땠는지 알릴게요", note: "공유"}
- title: 쇼크 유형 병력 청취
  s:
  - {t: "발병 시점", i: calendar, w: "first started는 처음 시작된 때를 묻는 말이에요. 쇼크의 원인을 가르려면 언제부터 어떤 순서로 나빠졌는지가 중요해서 시작 시점부터 물어요.", d: "at the clinic", k: ["증상이 어디서 처음 시작됐는지 말씀해 주시겠어요?", "증상이 언제 마지막으로 있었는지 말씀해 주시겠어요?"], a: "first", o: ["last", "next", "only"]}
  - {t: "증상 질문", i: stetho, w: "Have you had …?는 지금이 아니라 그동안 있었는지 묻는 현재완료 모양이에요. 열, 출혈, 흉통은 서로 다른 쇼크 원인을 가리켜서 한 문장에 묶어 물어요.", d: "at night", k: ["열이나 기침, 흉통이 있었나요?", "열이나 출혈, 두통이 있었나요?"], a: "bleeding", o: ["sneezing", "snoring", "itching"]}
  - {t: "이유 설명", i: bulb, w: "This helps us …는 질문의 이유를 먼저 밝히는 모양이에요. 환자가 쇼크처럼 낯선 말을 들어도 왜 묻는지 알면 더 잘 답해요.", d: "for the report", k: ["이게 쇼크의 이름을 찾는 데 도움이 돼요", "이게 쇼크의 원인을 알리는 데 도움이 돼요"], a: "causing", o: ["curing", "hiding", "feeding"]}
  - {t: "소화기 증상", i: faceWorried, w: "vomiting과 diarrhea는 둘 다 몸에서 물이 빠지는 증상이라 저혈량의 단서가 돼요. or로 둘 중 하나라도 있었는지 물으면 답하기 쉬워요.", d: "in the car", k: ["구토나 변비는 있었나요?", "기침이나 설사는 있었나요?"], a: "diarrhea", o: ["weakness", "numbness", "itching"]}
  - {t: "전달 약속", i: handshake2, w: "pass along은 들은 내용을 다른 사람에게 전한다는 구동사예요. all of this라고 하면 하나도 빼지 않고 전달하겠다는 약속이 돼요.", d: "to the lab", k: ["이 내용을 전부 약사 선생님께 전달할게요", "이 내용을 전부 의사 선생님께 맡길게요"], a: "all", o: ["some", "most", "half"]}
  - {t: "감사 인사", i: star, w: "Thank you for …ing는 고마운 행동을 전치사 뒤에 -ing로 말하는 모양이에요. 답하기 힘든 순간에도 말해 준 환자에게 감사하면 다음 질문에도 협조하기 쉬워져요.", d: "on time", k: ["이렇게 다 기다려 주셔서 감사해요", "이렇게 다 기억해 주셔서 고마워요"], a: "telling", o: ["asking", "hearing", "teaching"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "쇼크 병력 청취 4문장 순서"
    why: "시작 시점을 먼저 묻고, 그와 관련된 증상을 묻고, 모아 둔 내용이 쇼크의 원인을 찾는 데 쓰인다고 설명한 뒤 전달을 약속해요. 3줄의 This는 앞의 질문과 대답을, 4줄의 all of it은 지금까지의 답변 전부를 가리켜서 순서가 하나예요."
    lines:
    - {en: "Can you tell me when your symptoms first started?", icon: calendar, ko: "증상이 언제 처음 시작됐는지 말씀해 주시겠어요?", note: "시점"}
    - {en: "Have you had any fever or bleeding since then?", icon: stetho, ko: "그 뒤로 열이나 출혈이 있었나요?", note: "증상"}
    - {en: "This helps us figure out what's causing your shock.", icon: bulb, ko: "이게 쇼크의 원인을 찾는 데 도움이 돼요", note: "이유"}
    - {en: "I'll pass all of it along to the doctor.", icon: handshake2, ko: "그걸 전부 의사 선생님께 전달할게요", note: "전달"}
- title: 시간당 소변량 모니터
  s:
  - {t: "소변량 보고", i: lab, w: "about은 정확한 값이 아니라 대략이라는 뜻이고 which is low로 해석을 덧붙였어요. 수치와 평가를 한 문장에 함께 말하면 듣는 사람이 바로 상황을 알아요.", d: "of the day", k: ["이번 시간에 배액량이 약 20mL로 적은 편이에요", "지난 시간에 소변량이 약 20mL로 적은 편이에요"], a: "low", o: ["high", "steady", "normal"]}
  - {t: "지표 설명", i: monitor, w: "hourly는 한 시간마다라는 부사예요. as a marker of …로 이 수치가 무엇의 지표인지 밝히면 신장으로 가는 혈류를 보는 이유가 전해져요.", d: "at the entrance", k: ["매시간 추적해서 심장 관류 지표로 보고 있어요", "매시간 추적해서 간 기능 지표로 보고 있어요"], a: "hourly", o: ["nightly", "weekly", "monthly"]}
  - {t: "보고 기준", i: bell, w: "flag it은 눈에 띄게 알린다는 뜻의 현장 표현이에요. if절에 목표 아래라는 기준을 분명히 두어서 언제 알릴지 모호하지 않게 해요.", d: "by the window", k: ["목표보다 낮게 유지되면 의사에게 알릴게요", "목표보다 낮게 유지되면 약사에게 알릴게요"], a: "target", o: ["limit", "range", "goal"]}
  - {t: "측정 방법", i: lab, w: "Foley bag은 도뇨관에 연결된 소변 주머니예요. measure는 눈으로 대충 보는 것이 아니라 눈금으로 양을 재는 동사예요.", d: "with a ruler", k: ["폴리 백으로 비우고 있어요", "소변 컵으로 측정하고 있어요"], a: "measuring", o: ["washing", "moving", "lifting"]}
  - {t: "목표치", i: board, w: "at least는 그보다 적으면 안 된다는 하한을 나타내요. 시간당 30mL는 성인에서 소변량이 충분한지 볼 때 쓰는 기준으로 널리 알려져 있어요.", d: "at any time", k: ["그의 목표는 시간당 최소 30mL예요", "목표는 하루에 최소 30mL예요"], a: "least", o: ["most", "best", "worst"]}
  - {t: "기록 약속", i: pencil, w: "flow sheet는 활력징후와 수액, 소변량을 시간대별로 적는 기록지예요. every hour로 기록 주기를 말하면 팀이 같은 표에서 변화를 볼 수 있어요.", d: "on the whiteboard", k: ["매시간 흐름표를 확인할게요", "매시간 화이트보드에 기록할게요"], a: "document", o: ["discuss", "discard", "display"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "시간당 소변량 4문장 순서"
    why: "측정 방법을 먼저 말하고, 이번 시간의 수치를 보고하고, 목표와 견줘 평가한 뒤 기록과 알림을 약속해요. 3줄의 that은 앞 줄의 수치를, 4줄의 it은 앞의 평가를 가리켜서 순서가 하나예요."
    lines:
    - {en: "I'm measuring her urine with the Foley bag.", icon: lab, ko: "폴리 백으로 소변량을 재고 있어요", note: "측정"}
    - {en: "She made about 20 mls this hour.", icon: board, ko: "이번 시간에 약 20mL가 나왔어요", note: "수치"}
    - {en: "That is below her target of 30 an hour.", icon: chartup, ko: "그건 시간당 30 목표보다 낮아요", note: "평가"}
