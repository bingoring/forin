11:
  - kind: slider
    words: [w-reaction]
    cue: "Ten minutes into the NAC infusion, he has hives all over, wheezing, and low blood pressure."
    scale: [no reaction, mild reaction, severe reaction]
    answerAt: 2
    why: "온몸 두드러기와 쌕쌕거림, 저혈압이 함께 오면 severe reaction이에요. 병원 프로토콜대로 주입을 멈추고 바로 도움을 요청해요. 홍조나 가벼운 두드러기만 있으면 mild로 보지만 그것도 처방자에게 알려요."
    example: "He's having a severe reaction to the infusion."
    exKo: "그가 주입에 심한 반응을 보이고 있어요."
  - kind: context
    words: [w-treatment]
    word: treatment
    ko: 치료
    scenes:
      - {who: 의사 라운드, icon: monitor, en: "Early treatment with NAC gives the liver the best chance.", ok: true}
      - {who: 야간 인계, icon: board, en: "Treatment started at 0200 per protocol, and there's been no reaction so far.", ok: true}
      - {who: 환자에게, icon: me, en: "Your hepatotoxicity requires treatment with an N-acetylcysteine regimen.", ok: false, fix: "The treatment is a medicine called NAC, and it works best when we start it early."}
    why: "의료진끼리는 hepatotoxicity, N-acetylcysteine regimen 같은 용어가 정확해요. 환자에게는 같은 treatment를 어떤 약이고 왜 빨리 시작하는지 쉬운 말로 풀어 주세요."
  - kind: swap
    words: [w-acetaminophen]
    who: "환자에게 · 원인 설명"
    icon: me
    before: ["The amount of ", "APAP", " in your blood confirms the cause."]
    options: [Tylenol, APAP, paracetamol]
    answer: Tylenol
    notes: {Tylenol: "미국 환자가 바로 아는 이름이에요.", APAP: "의료진 약어라 환자는 모를 수 있어요.", paracetamol: "영국 등에서 쓰는 이름이라 미국 병원에서는 낯설어요."}
    why: "성분명은 acetaminophen이고 의료진은 APAP로 줄여 써요. 환자에게는 약 이름을 아는 말(Tylenol)로 알려야 원인을 이해하고 다른 감기약에도 같은 성분이 있는지 묻기 쉬워요."
    ko: "혈액 속 타이레놀 양이 원인을 확인해 줘요"
12:
  - kind: slider
    words: [w-redness]
    cue: "There's a faint pink spot at the line site, the same size as yesterday."
    scale: [slight redness, spreading redness, redness with pus]
    answerAt: 0
    why: "어제와 크기가 같은 옅은 발적은 slight redness예요. 그래도 매 근무 부위를 보고, 커지거나 따뜻해지거나 고름이 나오면 바로 알려야 해요."
    example: "There's slight redness at the site."
    exKo: "부위에 약간의 발적이 있어요."
  - kind: context
    words: [w-sign]
    word: sign
    ko: 징후
    scenes:
      - {who: 의사 라운드, icon: monitor, en: "Early signs of sepsis are a higher temperature, a faster heart rate, and new confusion.", ok: true}
      - {who: 야간 인계, icon: board, en: "No new signs of infection at the line site overnight.", ok: true}
      - {who: 환자에게, icon: me, en: "You meet two SIRS criteria, which is a sign of possible sepsis.", ok: false, fix: "Your fast heartbeat and fever are a sign that you may have an infection, and we're checking."}
    why: "의료진끼리는 SIRS criteria 같은 용어가 정확하고 빨라요. 환자에게는 같은 sign을 어떤 증상이 무엇을 뜻하는지 쉬운 말로 풀어 주세요."
  - kind: swap
    words: [w-dressing, w-line]
    who: "환자에게 · 드레싱 교체"
    icon: me
    before: ["I'm going to change ", "your CVC occlusive dressing", " now."]
    options: [the covering over your line, your central line dressing, your CVC occlusive dressing]
    answer: the covering over your line
    notes: {the covering over your line: "환자가 바로 알아듣고 무엇을 바꾸는지 분명해요.", your central line dressing: "정확하지만 환자에게는 약간 의료 용어 같아요.", your CVC occlusive dressing: "약어와 전문 용어가 겹쳐 환자는 못 알아들어요."}
    why: "드레싱 교체는 무균 술기라 환자 협조가 필요해요. 무엇을 하는지 쉬운 말로 알려 주면 몸을 움직이지 않고 기다려 줘요."
    ko: "라인을 덮은 드레싱을 지금 교체할게요"
13:
  - kind: slider
    words: [w-little]
    cue: "He ate about two spoonfuls of the protein shake."
    scale: [plenty, a little, none]
    answerAt: 1
    why: "두 숟가락 정도면 a little이에요. plenty는 충분히 먹은 경우, none은 전혀 안 먹은 경우예요. 섭취량은 영양팀에 알려 단백질을 어떻게 보충할지 정해요."
    example: "He ate only a little protein today."
    exKo: "그는 오늘 단백질을 조금만 먹었어요."
  - kind: context
    words: [w-protein]
    word: protein
    ko: 단백질
    scenes:
      - {who: 의사 라운드, icon: monitor, en: "Don't restrict protein, because malnutrition makes encephalopathy worse.", ok: true}
      - {who: 야간 인계, icon: board, en: "He drank half of the protein shake at 2100.", ok: true}
      - {who: 환자에게, icon: me, en: "Your daily protein requirement is 1.2 to 1.5 grams per kilogram of dry weight.", ok: false, fix: "Eating enough protein, like eggs, chicken, or a shake, protects your muscles."}
    why: "의료진끼리는 g/kg 같은 수치 기준이 정확하고 빨라요. 환자에게는 같은 protein을 어떤 음식으로 먹으면 되는지, 왜 필요한지 쉬운 말로 알려 주세요."
  - kind: swap
    words: [w-meal]
    who: "환자에게 · 식사 안내"
    icon: me
    before: ["Try to eat ", "multiple small feedings", " with some protein."]
    options: [smaller meals more often, small frequent meals, multiple small feedings]
    answer: smaller meals more often
    notes: {smaller meals more often: "환자가 바로 알아듣는 쉬운 말이에요.", small frequent meals: "무난하지만 약간 딱딱해요.", multiple small feedings: "영양 처방에서 쓰는 말이라 환자에게는 어색해요."}
    why: "간경변 환자는 조금씩 자주 먹고 밤 간식을 하는 것이 도움이 되는 경우가 많아서, 쉬운 말로 알려 주면 실천하기 쉬워요."
    ko: "조금씩 자주, 단백질을 곁들여 드셔 보세요"
14:
  - kind: slider
    words: [w-response]
    cue: "He opens his eyes and answers me when I say his name."
    scale: [alert, drowsy, unresponsive]
    answerAt: 0
    why: "이름만 불러도 눈을 뜨고 대답하면 alert로 기록해요. 진정제를 쓴 뒤에는 깨우는 데 필요한 자극이 점점 커지는지(drowsy, unresponsive) 같은 기준으로 보고, 간 기능이 나쁘면 약이 오래 남을 수 있어 변화를 바로 알려요."
    example: "His response to my voice is alert."
    exKo: "내 목소리에 그가 또렷하게 반응해요."
  - kind: context
    words: [w-dose]
    word: dose
    ko: 용량
    scenes:
      - {who: 의사 라운드, icon: monitor, en: "Let's lower the dose, because his liver won't clear it well.", ok: true}
      - {who: 야간 인계, icon: board, en: "Tonight's dose was held pending the physician's call because he was too sleepy.", ok: true}
      - {who: 환자에게, icon: me, en: "Your dose has been hepatically adjusted to a q12h interval.", ok: false, fix: "We're giving you a smaller dose because your liver clears medicines slowly."}
    why: "의료진끼리는 hepatically adjusted, q12h 같은 표기가 정확하고 빨라요. 환자에게는 같은 dose를 왜 줄였는지 쉬운 말로 풀어 주세요."
  - kind: swap
    words: [w-sedative]
    who: "보호자에게 · 진정제 설명"
    icon: me
    before: ["We're being careful with ", "CNS depressants", " because they can cloud his thinking."]
    options: [medicines that make him sleepy, sedatives, CNS depressants]
    answer: medicines that make him sleepy
    notes: {medicines that make him sleepy: "보호자가 바로 알아듣고 이유도 이해돼요.", sedatives: "알아듣는 가족도 있지만 먼저 쉬운 설명이 안전해요.", CNS depressants: "약리 분류 용어라 가족에게는 어렵고 차갑게 들려요."}
    why: "간이 약을 천천히 처리하면 진정제가 오래 남아 의식이 더 흐려질 수 있어요. 가족에게는 이 이유를 쉬운 말로 알려야 약을 줄이는 계획을 이해해요."
    ko: "그를 졸리게 하는 약은 생각을 흐리게 할 수 있어서 조심하고 있어요"
