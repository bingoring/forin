situations:
- title: "CAUTI 예방·조기 제거"
  s:
  - ["매일 평가", "calendar", "'whether she still needs'로 소변줄을 둘 이유가 아직 있는지 묻는 평가라는 걸 알려요. 소변줄은 필요한 동안만 두는 것이 원칙이에요.", "for her comfort", "두 시간마다 소변줄이 아직 필요한지 확인해요.", "매일 소변 색이 어떤지 확인해요.", "needs", "wants", "likes", "fears"]
  - ["감염 이유", "bandage", "'lowers the risk'는 확률을 낮춘다는 표현이라, 감염이 절대 안 생긴다고 약속하지 않으면서 이유를 설명해요.", "for good", "일찍 제거하면 피부 감염 위험이 낮아져요.", "일찍 제거하면 방광 결석 위험이 낮아져요.", "bladder", "stomach", "lung", "throat"]
  - ["회진 논의", "speech", "'bring it up'은 결정을 혼자 내리지 않고 팀 논의에 올리겠다는 말이에요. 소변줄 제거는 처방이 필요한 일이에요.", "after dinner", "오늘 회진 때 약사에게 이 얘기를 꺼낼게요.", "오늘 점심 때 팀에 이 얘기를 꺼낼게요.", "rounds", "meals", "naps", "lunches"]
  - ["제거 기준", "check", "'no medical reason'은 불편해서가 아니라 의학적 필요가 기준이라는 뜻이에요. 'If'를 앞에 두면 이유가 없을 때는 빼는 것이 기본이라는 방향이 보여요.", "on the chart", "산소줄을 유지할 의학적 이유가 없으면 제거해요.", "위관을 유지할 의학적 이유가 없으면 제거해요.", "medical", "dental", "legal", "financial"]
  - ["의사 문의", "speech", "'ask'로 제거 여부는 의사가 정한다는 선을 지켜요. 'about removing it'은 무엇을 묻는지 분명히 해요.", "about the schedule", "회진 때 제거 여부를 약사에게 물어볼게요.", "회진 때 제거 방법을 의사에게 물어볼게요.", "removing", "washing", "weighing", "folding"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "소변줄 제거 흐름 4문장 순서"
    why: "먼저 필요성을 확인하고, 이유가 없으면 의사에게 제거를 묻고, 의사가 동의하면 제거한 뒤, 스스로 소변을 보는지 지켜봐요."
    lines:
    - ["Every day we check whether she still needs the catheter.", "calendar", "매일 소변줄이 아직 필요한지 확인해요", "확인"]
    - ["If she doesn't, I'll ask the doctor about taking it out during rounds.", "speech", "필요 없으면 회진 때 의사에게 빼도 되는지 물어볼게요", "문의"]
    - ["Once the doctor agrees, we remove it.", "check", "의사가 동의하면 제거해요", "제거"]
    - ["After it's out, we watch to see that she can pass urine on her own.", "magnify", "뺀 뒤에는 스스로 소변을 보는지 지켜봐요", "관찰"]
- title: "VAP 번들 수행"
  s:
  - ["체위 이유", "stetho", "'to protect his lungs'로 이유를 밝혀요. 머리를 올려 두면 위 내용물이 폐로 넘어가는 것을 줄여요.", "for visitors", "폐를 보호하기 위해 침대 난간을 올려 두고 있어요.", "허리를 보호하기 위해 침대 머리를 올려 두고 있어요.", "lungs", "eyes", "hair", "ears"]
  - ["구강간호 이유", "bandage", "'helps prevent'는 확실히 막는다는 약속이 아니라 도움이 된다는 정직한 표현이에요. 입안 세균이 기도로 내려가는 걸 줄여요.", "for a day", "규칙적인 구강간호가 인공호흡기 관련 욕창을 막는 데 도움이 돼요.", "규칙적인 구강간호가 인공호흡기 관련 낙상을 막는 데 도움이 돼요.", "pneumonia", "bleeding", "bruising", "swelling"]
  - ["번들 효과", "shield", "'small steps'는 하나하나는 작아도 모이면 효과가 있다는 뜻이에요. VAP 번들은 여러 조치를 함께 하는 방식이에요.", "for a week", "이 작은 조치들이 인공호흡기를 달고 있는 동안 출혈 위험을 낮춰 줘요.", "이 작은 조치들이 인공호흡기를 달고 있는 동안 경련 위험을 낮춰 줘요.", "risk", "cost", "speed", "price"]
  - ["체위 효과", "home", "'Keeping … up'처럼 동명사로 주어를 만들면 한 가지 습관이 곧 효과라는 뜻이 돼요.", "all night", "침대 머리를 올려 두면 변비 예방에 도움이 돼요.", "침대 다리를 올려 두면 폐렴 예방에 도움이 돼요.", "head", "rail", "wheel", "light"]
  - ["구강 관리", "check", "'every few hours'는 정해진 간격이 있다는 느낌만 주고 정확한 시각은 약속하지 않아요. 구강 세균을 줄이는 반복 관리예요.", "twice a month", "몇 시간마다 이를 닦고 얼굴을 깨끗이 해 드려요.", "몇 시간마다 머리를 빗고 입안을 깨끗이 해 드려요.", "teeth", "hair", "nails", "shoes"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "VAP 예방 조치 설명 4문장 순서"
    why: "먼저 왜 작은 조치들이 필요한지 말하고, 침대 머리 올리기에 이어 구강 관리를 설명한 뒤, 그 조치들이 감염 위험을 낮춘다고 마무리해요."
    lines:
    - ["He's on a breathing machine, so we take a few small steps to protect his lungs.", "stetho", "인공호흡기를 달고 있어서 폐를 보호하려고 몇 가지 작은 조치를 해요", "소개"]
    - ["First, we keep the head of the bed raised.", "home", "먼저 침대 머리를 올려 둬요", "체위"]
    - ["Along with that, we brush his teeth and clean his mouth every few hours.", "check", "그와 함께 몇 시간마다 이를 닦고 입안을 닦아 드려요", "구강"]
    - ["With those steps, his risk of infection stays lower.", "shield", "그 조치들로 감염 위험이 낮게 유지돼요", "효과"]
- title: "격리 유형 이해·표지"
  s:
  - ["표지 의미", "pushpin", "'That sign means'로 표지의 뜻을 먼저 풀어 주면 문 앞에서 멈춘 가족이 이유를 알아요. 접촉격리는 가운과 장갑을 써요.", "for the visitors", "저 번호는 접촉격리를 위해 가운과 장갑을 사용한다는 뜻이에요.", "저 표지는 병실 청소를 위해 가운과 장갑을 사용한다는 뜻이에요.", "contact", "droplet", "airborne", "visitor"]
  - ["색 구분", "board", "'what protection each germ needs'로 균마다 필요한 보호가 다르다고 말해요. 격리 표지는 접촉·비말·공기를 구분해요.", "in this unit", "색깔마다 어떤 층에 어떤 보호가 필요한지 알려 줘요.", "색깔마다 어떤 균에 어떤 음식이 필요한지 알려 줘요.", "colors", "sizes", "floors", "doors"]
  - ["모두를 위해", "shield", "'keeps you, him, and other patients safe'로 보호받는 사람을 셋으로 나눠 말하면 지킬 이유가 가족 자신에게도 있어요.", "from the hallway", "표지를 따르면 보호자분, 환자분, 다른 환자들 모두 편안해요.", "표지를 따르면 보호자분, 환자분, 다른 환자들 모두 건강해요.", "safe", "sleepy", "hungry", "bored"]
  - ["착용 요청", "shield", "'so'로 이유를 먼저 대고 요청하면 명령처럼 들리지 않아요. 접촉격리 병실에 들어갈 때는 가운과 장갑을 착용해요.", "at the entrance", "이건 방문제한이라서 가운과 장갑을 착용해 주세요.", "이건 면회시간이라서 가운과 장갑을 착용해 주세요.", "wear", "buy", "sell", "wash"]
  - ["비난 아님", "faceWorried", "'not about blame'으로 비난받는다고 느낄 수 있는 걸 먼저 지워 줘요. 격리 안내에서 가족이 죄책감을 느끼지 않게 해요.", "for the staff", "탓하려는 게 아니라 모두를 편안하게 해 드리려는 거예요.", "서두르려는 게 아니라 모두를 안전하게 지키려는 거예요.", "safe", "tired", "busy", "late"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "접촉격리 표지 안내 4문장 순서"
    why: "표지의 뜻을 먼저 알리고, 따르는 방법을 말한 뒤, 그렇게 하면 누가 보호받는지 설명하고, 비난이 아니라는 점으로 마무리해요."
    lines:
    - ["That sign on the door means this is contact isolation.", "pushpin", "문의 표지는 접촉격리라는 뜻이에요", "표지"]
    - ["To follow it, wear a gown and gloves before you go in.", "shield", "따르려면 들어가기 전에 가운과 장갑을 착용하세요", "착용"]
    - ["Doing so keeps you, him, and other patients safe.", "check", "그렇게 하면 모두가 안전해요", "효과"]
    - ["Thank you for doing that — it's never about blame.", "faceWorried", "해 주셔서 감사해요, 탓하는 게 아니에요", "감사"]
- title: "환경·기구 소독"
  s:
  - ["소독 확인", "check", "'Yes'로 시작해 질문에 먼저 확답하고, 'between each use'로 소독 시점을 분명히 해요. 환자 사이 소독은 교차 오염을 줄여요.", "in the hallway", "네, 사용할 때마다 장난감과 표면을 소독해요.", "네, 사용할 때마다 장비와 시트를 소독해요.", "disinfect", "decorate", "photograph", "sell"]
  - ["이유 설명", "shield", "'prevents germs from spreading'은 소독의 목적을 한 줄로 알려요. 환자 사이에 균이 옮는 걸 막는 게 핵심이에요.", "among visitors", "이렇게 하면 환자들 사이에 소문이 퍼지는 걸 막아요.", "이렇게 하면 환자들 사이에 냄새가 퍼지는 걸 막아요.", "patients", "meals", "naps", "lessons"]
  - ["기기 관리", "gear", "'get wiped'는 수동태라 누가 닦는지보다 닦인 상태가 중요하다고 말해요. 'before they come'으로 시점을 정해요.", "by the window", "공용 기기는 침상에 오기 전에 충전해 둬요.", "공용 기기는 주방에 오기 전에 닦아 둬요.", "bedside", "elevator", "cafeteria", "lobby"]
  - ["기기 세척", "monitor", "'between every patient'는 환자가 바뀔 때마다라는 뜻이에요. 한 번 닦고 끝이 아니라 반복해요.", "for the nurses", "환자마다 이 모니터와 의자를 닦아요.", "환자마다 이 모니터와 펌프를 켜요.", "monitor", "mirror", "window", "radio"]
  - ["효과 설명", "shield", "'from one room to the next'는 병실을 건너 퍼지는 경로를 그려 줘요. 소독은 그 경로를 끊어요.", "at night", "소독은 소음이 병실에서 병실로 옮겨가는 걸 막아요.", "소독은 연기가 병실에서 병실로 옮겨가는 걸 막아요.", "germs", "noise", "smoke", "voices"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "기구 소독 설명 4문장 순서"
    why: "질문에 먼저 확답하고, 기기를 침상에 오기 전에 닦는다고 말한 뒤, 환자가 바뀔 때 다시 닦는다고 알리고, 효과로 마무리해요."
    lines:
    - ["Yes, we disinfect the equipment and surfaces between each use.", "check", "네, 사용할 때마다 장비와 표면을 소독해요", "확답"]
    - ["Shared devices get wiped down before they come to your dad's bedside.", "gear", "공용 기기는 아버님 침상에 오기 전에 닦아 둬요", "기기"]
    - ["Once one patient is done, we clean the monitor and pump again.", "monitor", "한 환자가 끝나면 모니터와 펌프를 다시 닦아요", "반복"]
    - ["Doing all that stops germs from moving from one room to the next.", "shield", "그렇게 하면 세균이 병실에서 병실로 옮겨가는 걸 막아요", "효과"]
- title: "중심라인 드레싱·관리 최적화"
  s:
  - ["감사·이유", "star", "먼저 'Thanks for noticing'으로 알려 준 가족을 고맙게 받아 주면 다음에도 말하기 쉬워요. 이유는 뒤에 붙여요.", "for asking", "알아차려 주셔서 감사해요 — 헐거운 드레싱은 물이 들어올 수 있거든요.", "도와주셔서 감사해요 — 헐거운 드레싱은 세균이 들어올 수 있거든요.", "loose", "heavy", "bright", "dark"]
  - ["즉시 교체", "bandage", "'right away'로 지체하지 않겠다고 약속하고, 'using a sterile technique'로 어떻게 하는지도 알려요.", "by myself", "바로 무균 기법으로 시트를 교체할게요.", "바로 무균 기법으로 팔찌를 교체할게요.", "sterile", "quick", "casual", "personal"]
  - ["핵심 설명", "shield", "'is key to'는 가장 중요한 한 가지를 짚는 표현이에요. 밀봉이 깨지면 피부의 균이 라인을 따라 들어갈 수 있어요.", "for the day", "밀봉되고 건조한 상태를 유지하는 게 라인 막힘을 막는 핵심이에요.", "투명하고 건조한 상태를 유지하는 게 라인 감염을 막는 핵심이에요.", "dry", "loud", "cold", "soft"]
  - ["위험 설명", "magnify", "'lets germs reach'는 드레싱이 문 역할을 한다는 그림을 줘요. 헐거운 틈이 균이 들어오는 길이 돼요.", "into the room", "헐거운 드레싱은 빛이 라인까지 닿게 해요.", "헐거운 드레싱은 세균이 팔까지 닿게 해요.", "reach", "leave", "avoid", "miss"]
  - ["일정 확인", "calendar", "'on schedule'은 정해진 날짜에 맞춰 바꾼다는 뜻이에요. 날짜를 확인하는 것은 교체 시기를 놓치지 않기 위해서예요.", "at random", "드레싱 크기를 확인하고 일정대로 교체해요.", "드레싱 날짜를 확인하고 일정대로 주문해요.", "date", "color", "brand", "shape"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "헐거운 드레싱 대응 4문장 순서"
    why: "알려 준 것에 감사하며 위험을 말하고, 준비를 확인한 뒤, 무균 기법으로 교체하고, 밀봉과 건조 유지가 핵심이라고 마무리해요."
    lines:
    - ["Thanks for noticing — a loose dressing can let germs reach the line.", "star", "알아차려 주셔서 감사해요, 헐거운 드레싱은 세균이 라인까지 닿게 해요", "감사"]
    - ["To fix that, I'll check the dressing date and gather what I need.", "calendar", "고치려고 드레싱 날짜를 확인하고 필요한 걸 챙길게요", "준비"]
    - ["With everything ready, I'll change it using a sterile technique.", "bandage", "준비가 되면 무균 기법으로 교체할게요", "교체"]
    - ["Once it's changed, keeping it sealed and dry is key to preventing infection.", "shield", "교체한 뒤에는 밀봉과 건조 유지가 감염 예방의 핵심이에요", "유지"]
