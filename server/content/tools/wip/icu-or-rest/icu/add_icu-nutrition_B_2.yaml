situations:
- title: 영양관 위치 확인
  s:
  - ["안전 규칙", shield, "Let's로 환자와 함께 하는 확인처럼 말하고, before anything goes로 무엇이든 위치 확인 뒤에만 들어간다는 순서를 못 박아요.", "before the doctor comes", "관을 통해 영양제를 넣기 전에 위치부터 확인해요.", "입을 통해 무엇이든 넣기 전에 위치부터 확인해요.", "placement", "weight", "color", "brand"]
  - ["보류 기준", lock, "until로 급식을 다시 열 시점을 엑스레이 확인으로 정해요. hold는 하던 일을 멈추고 기다린다는 뜻이에요.", "I'll hold hands", "엑스레이로 확인될 때까지 투약은 보류할게요.", "엑스레이로 확인될 때까지 세척은 보류할게요.", "x-ray", "chart", "label", "bag"]
  - ["기록 알림", pencil, "Documenting처럼 주어 없이 동명사로 시작하면 차트 메모 같은 짧은 보고 어투가 돼요. now는 확인한 직후 바로 남긴다는 뜻이에요.", "the visitor list", "지금 관 두께를 기록할게요.", "지금 관 위치를 설명할게요.", "position", "color", "size", "brand"]
  - ["설명 보고", speech, "I told him…은 이미 한 설명을 전하는 보고 어투예요. might sting은 확정하지 않고 일어날 수 있는 일로 말해 불안을 덜어요.", "if he sleeps", "넣을 때 따끔할 수 있는데 눈을 감으면 더 수월하다고 말씀드렸어요.", "넣을 때 가려울 수 있는데 삼키면 더 수월하다고 말씀드렸어요.", "sting", "itch", "tickle", "ache"]
  - ["경과 보고", faceWorried, "but으로 불편한 반응을 숨기지 않고 말한 뒤 결과를 붙여요. tolerated는 불편했지만 견뎌 냈다는 뜻이에요.", "A few coughs", "땀이 좀 났지만 잘 견디셨어요.", "눈물이 좀 났지만 빨리 끝났어요.", "tears", "laughs", "hiccups", "sneezes"]
  - ["규칙 안내", lock, "won't…until로 확인 전에는 급식을 시작하지 않는다는 규칙을 부정문으로 분명히 말해요. on x-ray는 확인하는 수단을 밝혀요.", "on the label", "엑스레이로 위치를 확인할 때까지 투약은 시작하지 않아요.", "엑스레이로 위치를 확인할 때까지 세척은 시작하지 않아요.", "placement", "weight", "lunch", "orders"]
  - ["원칙 강조", lock, "That's our rule로 개인 취향이 아니라 병원의 규칙이라고 못 박아요. nothing은 예외가 없다는 뜻이에요.", "the drain", "그게 저희 약속이라, 확인되기 전에는 관으로 아무것도 안 넣어요.", "그게 저희 습관이라, 확인되기 전에는 관으로 아무것도 안 넣어요.", "rule", "habit", "wish", "trick"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 영양관 위치 확인 설명 4문장 순서
    why: 규칙을 먼저 말하고, 확인 수단인 엑스레이를 밝힌 뒤, 확인될 때까지 급식이 보류된다고 알리고, 끝나면 위치를 기록한다고 마무리해요.
    lines:
    - ["Before anything goes through the tube, we confirm its position.", lock, "관으로 뭐든 넣기 전에 위치를 확인해요", "규칙"]
    - ["To check it, we get an x-ray first.", lab, "확인하려고 먼저 엑스레이를 찍어요", "수단"]
    - ["Until that x-ray confirms it, feeding stays on hold.", bell, "그 엑스레이가 확인해 줄 때까지 급식은 보류돼요", "보류"]
    - ["Once that's done, I'll document the position.", pencil, "그게 끝나면 위치를 기록할게요", "기록"]
- title: 흡인 예방 체위
  s:
  - ["체위 이유", shield, "Keeping you upright처럼 행동을 주어로 삼아 세워 두는 것이 왜 도움이 되는지 먼저 말해요. stay down은 위로 내려간 채 머문다는 뜻이에요.", "stay warm", "환자분을 세워 두면 급식이 천천히 내려가는 데 도움이 돼요.", "환자분을 세워 두면 급식이 따뜻하게 내려가는 데 도움이 돼요.", "upright", "quiet", "awake", "calm"]
  - ["위험 설명", shield, "lowers the risk of …ing 틀로 효과를 위험 감소로 말해요. 확률을 말하는 표현이라 절대 생기지 않는다는 잘못된 안심을 주지 않아요.", "going into your stomach", "약이 폐로 넘어갈 위험을 줄여줘요.", "냄새가 폐로 넘어갈 위험을 줄여줘요.", "lungs", "heart", "ribs", "hands"]
  - ["편안함 돕기", me, "I'll help you…로 환자가 혼자 애쓰지 않도록 도울 거라고 먼저 약속해요. get comfortable은 편안한 상태가 되어 가는 과정을 뜻해요.", "in this room", "이 침대에서 편안하게 계실 수 있도록 도와드릴게요.", "이 방에서 편안하게 계실 수 있도록 도와드릴게요.", "comfortable", "sleepy", "quiet", "busy"]
  - ["위험 설명", shield, "If절로 조건을 먼저 말하고 could로 일어날 수 있는 위험을 단정하지 않고 알려요. slide back은 한 번 내려간 것이 다시 되돌아간다는 뜻이에요.", "onto your gown", "눕히면 음식이 다시 입으로 올라올 수 있어요.", "눕히면 약이 다시 기도로 넘어갈 수 있어요.", "airway", "bed", "chair", "sleeve"]
  - ["체위 조정", chevronUp, "Let's로 함께 하는 일처럼 말하고, before로 체위를 먼저 갖춘 뒤 급식을 시작한다는 순서를 알려요.", "the arm of your chair", "급식을 시작하기 전에 침대 난간을 올려드릴게요.", "급식을 시작하기 전에 침대 이불을 올려드릴게요.", "raise", "clean", "cover", "label"]
  - ["공감", faceWorried, "I know로 불편함을 먼저 인정하고 but으로 참아야 하는 이유를 붙여요. not the most comfortable로 아주 편하진 않다고 솔직하게 말해요.", "to lie", "이렇게 앉아 있는 게 지루하다는 거 알지만, 안전을 위한 거예요.", "이렇게 앉아 있는 게 편하지 않다는 거 알지만, 건강을 위한 거예요.", "sit", "stand", "sleep", "read"]
  - ["알림 요청", speech, "Let me know if…는 부담 없이 알려 달라는 부탁이에요. feel like는 확실하지 않은 느낌만으로도 말해도 된다는 뜻이에요.", "like you're freezing", "옆으로 미끄러지는 느낌이 들면 알려주세요.", "아래가 차가운 느낌이 들면 알려주세요.", "sliding", "shaking", "burning", "spinning"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 앉은 자세 유지 설명 4문장 순서
    why: 세워 두는 이유를 먼저 말하고, 불편함을 인정한 뒤, 그 때문에 편안하게 돕겠다고 약속하고, 미끄러지면 알려 달라고 부탁해요.
    lines:
    - ["Keeping you upright helps the feed stay down safely.", shield, "세워 두면 급식이 안전하게 내려가요", "이유"]
    - ["I know it's not the most comfortable way to sit.", faceWorried, "가장 편한 자세가 아니라는 거 알아요", "공감"]
    - ["For that reason, I'll help you get as comfortable as I can.", me, "그래서 최대한 편하시게 도와드릴게요", "돕기"]
    - ["Please tell me if you feel yourself sliding down in it.", speech, "그 자세에서 미끄러지는 느낌이 들면 말씀해 주세요", "요청"]
- title: 배변·복부 팽만 관찰
  s:
  - ["사정 예고", stetho, "Let me…로 먼저 알려서 환자가 놀라지 않게 해요. 두 동작을 and로 이어 한 번에 하는 사정이라고 말해요.", "your pulse", "배를 확인하고 심음을 들어볼게요.", "등을 확인하고 장음을 들어볼게요.", "bowel", "heart", "lung", "breath"]
  - ["알림 요청", speech, "Tell me if…로 환자에게 알려 달라고 직접 부탁해요. painful과 harder를 or로 묶어 둘 중 하나만 있어도 말하면 된다고 알려요.", "or warmer", "가렵거나 더 단단해지면 말씀해 주세요.", "아프거나 더 뜨거워지면 말씀해 주세요.", "painful", "itchy", "noisy", "sleepy"]
  - ["조절 기준", gear, "if절로 조절하는 기준을 환자가 느끼는 포만감에 둬요. adjust는 멈추는 것과 달리 양이나 속도를 맞춘다는 뜻이에요.", "is too cold", "배가 조금 부르면 급식을 조절할게요.", "배가 너무 부르면 급식 줄을 조절할게요.", "stomach", "back", "arm", "throat"]
  - ["소견 전달", stetho, "does feel에서 does로 소견을 강조해 환자가 호소한 느낌을 확인해 줘요. a bit은 정도를 부드럽게 말하는 완화 표현이에요.", "and warm today", "오늘 배가 좀 따뜻하고 팽만해 보이네요.", "오늘 손이 좀 팽팽하고 부어 보이네요.", "tight", "loose", "soft", "empty"]
  - ["안심 설명", shield, "common으로 흔한 일이라고 알려 불안을 덜고, and로 해결책을 바로 붙여요. slow it down은 속도를 늦춘다는 구동사예요.", "with tight clothes", "수술 뒤에는 흔한 일이라, 속도를 늦출 수 있어요.", "관 급식에서는 흔한 일이라, 걱정을 덜 수 있어요.", "common", "rare", "strange", "new"]
  - ["배변 질문", speech, "Have you had…? 현재완료로 어제부터 지금까지의 경험을 물어요. any를 쓰면 있었는지 없었는지 열어 두고 묻는 셈이라 부담이 덜해요.", "any extra blanket", "오늘 아침부터 배변이 있으셨어요?", "그제 이후로 배변이 있으셨어요?", "yesterday", "Monday", "breakfast", "midnight"]
  - ["알림 요청", bell, "right away는 기다리지 말고 즉시 알려 달라는 뜻이에요. gets worse는 이미 있는 통증이 더 나빠지는 변화를 말해요.", "if the noise gets", "구토가 심해지면 바로 알려주세요.", "어지러움이 심해지면 바로 알려주세요.", "worse", "better", "louder", "calmer"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 복부 팽만 사정과 안심 4문장 순서
    why: 사정을 먼저 하고, 그 소견을 전하고, 흔한 일이라고 안심시킨 뒤, 더 심해지면 알려 달라고 부탁해요.
    lines:
    - ["Let me check your belly and listen for bowel sounds.", stetho, "배를 확인하고 장음을 들어볼게요", "사정"]
    - ["Your belly does feel a bit tight today.", stetho, "오늘 배가 좀 팽팽하네요", "소견"]
    - ["That's common with tube feeding, and we can slow it down.", shield, "그건 관 급식에서 흔해서 속도를 늦출 수 있어요", "안심"]
    - ["Tell me right away if it gets any worse than that.", bell, "그보다 더 심해지면 바로 말씀해 주세요", "요청"]
- title: 혈당·전해질 연계 감시
  s:
  - ["확인 일정", calendar, "on the ordered schedule은 간호사가 마음대로 정하지 않고 지시받은 간격을 따른다는 뜻이에요. Let's는 함께 챙기자는 어투예요.", "her breakfast", "지시된 순서대로 혈당을 확인해요.", "정해진 장소에서 혈당을 확인해요.", "glucose", "weight", "hearing", "vision"]
  - ["감시 계획", monitor, "as는 급식이 늘어나는 것과 같은 시간에 이뤄지는 감시를 말해요. watch는 수치가 변하는지 계속 본다는 뜻이에요.", "as the family arrives", "급식이 줄어드는 동안 전해질을 지켜볼게요.", "수액이 늘어나는 동안 전해질을 지켜볼게요.", "electrolytes", "lungs", "weights", "moods"]
  - ["용량 조절", pill, "as needed는 정해진 시각이 아니라 필요할 때마다라는 뜻이에요. coverage는 높아진 혈당을 덮어 주는 인슐린 보충을 가리켜요.", "insurance coverage", "필요에 따라 식사 보충을 조절할게요.", "필요에 따라 수분 보충을 조절할게요.", "adjust", "explain", "label", "count"]
  - ["경과 보고", chartup, "was a little high로 약간 높았다고 말해 정도를 과장하지 않아요. after로 속도를 늘린 일과 수치 변화를 시간 순서로 이어요.", "a little sleepy", "속도를 늘린 뒤 체온이 좀 높았어요.", "속도를 늘린 뒤 혈압이 좀 높았어요.", "increased", "reduced", "cleaned", "labeled"]
  - ["위험 설명", chartup, "can drop은 반드시가 아니라 가능성을 말해요. once는 급식이 시작되는 시점에 맞춰 일어난다는 뜻이에요.", "once visitors arrive", "급식이 시작되면 인산염과 철분이 떨어질 수 있어요.", "수액이 시작되면 인산염과 칼륨이 떨어질 수 있어요.", "starts", "ends", "stops", "pauses"]
  - ["재확인 예고", lab, "recheck는 한 번 본 것을 다시 확인한다는 뜻이에요. in a few hours로 정확한 시각 대신 대략의 간격을 알려 줘요.", "her lunch", "몇 시간 뒤에 기록을 재확인할게요.", "몇 시간 뒤에 처방을 재확인할게요.", "labs", "chart", "tray", "gown"]
  - ["호출 기준", bell, "Call me if…는 기준을 넘으면 부르라는 호출 요청이에요. goes above는 목표 범위의 위쪽으로 벗어난다는 뜻이에요.", "the front desk", "혈압이 목표 범위를 넘으면 불러 주세요.", "체중이 목표 범위를 넘으면 불러 주세요.", "glucose", "weight", "mood", "hunger"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 급식 중 혈당 감시 4문장 순서
    why: 혈당 확인을 알리고, 전해질도 함께 본다고 말한 뒤, 높으면 조절한다고 설명하고, 효과를 몇 시간 뒤 재확인한다고 마무리해요.
    lines:
    - ["Let's check her glucose on the ordered schedule.", calendar, "지시된 일정대로 혈당을 확인해요", "확인"]
    - ["I'll watch her electrolytes along with it.", monitor, "그와 함께 전해질도 지켜볼게요", "감시"]
    - ["If the glucose runs high, we'll adjust insulin coverage as needed.", pill, "혈당이 높게 나오면 필요에 따라 인슐린 보충을 조절해요", "조절"]
    - ["I'll recheck her labs in a few hours to see how that worked.", lab, "그게 어땠는지 몇 시간 뒤 검사를 재확인할게요", "재확인"]
