situations:
- title: 삽관·환기 불가 CICO 위기
  s:
  - ["상황 선언", siren, "'can't-intubate, can't-oxygenate'는 두 실패를 짝으로 묶은 고정 표현이라 팀 모두가 같은 위기를 떠올려요. 이름을 먼저 선언해야 외과적 기도로 넘어갈 신호가 돼요.", "in the waiting room", "삽관도 안 되고 청진도 안 되는 응급 상황이에요.", "소생도 안 되고 산소화도 안 되는 응급 상황이에요.", "emergency", "question", "schedule", "meeting"]
  - ["즉시 지시", siren, "'Get … open'은 목적어와 상태를 한 구에 넣은 짧은 명령이에요. 'stat'은 지금 바로라는 병원 용어라 외과를 부르는 일을 미루지 않게 해요.", "to the family", "윤상갑상막절개술 키트를 열고 포장지를 즉시 치워 주세요.", "윤상갑상막절개술 키트의 위치를 보고 팀에 즉시 알려 주세요.", "kit", "cart", "door", "chart"]
  - ["병행 처치", compass, "'keep attempting … while'은 두 일을 동시에 한다는 뜻이에요. 외과적 기도를 만드는 동안에도 산소화 시도를 멈추지 않아야 시간을 벌어요.", "for the whole shift", "추가 모니터를 준비하는 동안 계속 산소화를 시도할게요.", "수액을 준비하는 동안 계속 산소화를 시도할게요.", "surgical", "dental", "cosmetic", "nasal"]
  - ["지원 요청", bell, "'Someone'을 주어로 두고 명령하면 모두가 서로 부를 거라 미루는 일이 줄어요. 'right now'는 기다릴 여유가 없다는 시한이에요.", "to the lounge", "지금 당장 누군가 기록을 시작하세요.", "지금 당장 누군가 문 앞을 비워 주세요.", "now", "here", "there", "then"]
  - ["위치 표시", magnify, "진행형 'I'm marking'은 지금 하고 있는 중이라는 보고예요. 표시를 해 두면 메스를 대는 사람이 위치를 다시 더듬지 않아도 돼요.", "on the monitor", "지금 기도 카트의 위치를 표시하고 있어요.", "지금 윤상갑상막 위치를 기록지에 적고 있어요.", "marking", "naming", "timing", "testing"]
  - ["시간 호명", calendar, "'out loud'는 혼잣말이 아니라 모두에게 들리게 하라는 뜻이에요. 위기에서는 시간 감각이 늘어져서 매 분 알려 주면 모두가 얼마나 지났는지 같이 알아요.", "on the monitor", "꼼짝 못하는 동안 매 분마다 순서를 큰 소리로 말해 주세요.", "꼼짝 못하는 동안 매 분마다 이름을 큰 소리로 말해 주세요.", "time", "date", "name", "number"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: CICO 위기 대응 4문장 순서
    why: 위기 이름을 먼저 선언하고, 지원을 요청한 뒤, 산소화를 이어 가며 외과적 기도를 준비하고, 그 준비 중에 위치를 표시해요.
    lines:
    - ["This is a can't-intubate, can't-oxygenate emergency.", siren, "삽관도 안 되고 산소화도 안 되는 응급 상황이에요", "선언"]
    - ["For that, someone call for backup right now.", bell, "그래서 지금 당장 누군가 지원을 요청하세요", "요청"]
    - ["I'll keep attempting to oxygenate while we prepare the surgical airway.", compass, "외과적 기도를 준비하는 동안 계속 산소화를 시도할게요", "병행"]
    - ["I'm marking the membrane for it now.", magnify, "지금 그걸 위해 막 위치를 표시하고 있어요", "표시"]
- title: 삽관 중 저산소·서맥 급변
  s:
  - ["즉시 환기", siren, "'Stop'과 'bag-mask ventilate'를 'and'로 이어 멈춤과 다음 행동을 한 번에 지시해요. 저산소에서는 시도를 이어 갈수록 나빠져서 산소화가 먼저예요.", "with a bigger blade", "시도를 멈추고 모니터 알람을 100퍼센트 켜 두세요.", "시도를 멈추고 기록 시간을 100퍼센트 정확히 적어 두세요.", "oxygen", "humidity", "water", "saline"]
  - ["원인 판단", magnify, "'so'로 원인과 우선순위를 이어요. 삽관 중 서맥은 대개 저산소증에서 오므로 약보다 산소화를 먼저 바로잡아요.", "from the sedative", "빈맥은 저산소증 때문이라 산소화가 먼저예요.", "서맥은 저체온 때문이라 산소화가 먼저예요.", "hypoxia", "anxiety", "fever", "pain"]
  - ["다음 단계", compass, "'If … stays low'로 지켜보는 조건을 붙여, 산소화로 안 오르는 경우에만 다음 단계로 넘어가요. 'start'는 지켜보다 말고 알고리즘으로 옮겨 간다는 뜻이에요.", "the sepsis algorithm", "혈압이 계속 낮으면 심정지 알고리즘을 시작해요.", "체온이 계속 낮으면 심정지 알고리즘을 시작해요.", "low", "high", "normal", "steady"]
  - ["감시 역할", monitor, "'Someone'으로 한 사람을 지정해 감시 책임을 분명히 해요. 'call out'은 소리로 알려 시술하는 사람이 화면을 보지 않아도 되게 해요.", "on the cart", "누군가 모니터를 보고 혈압을 소리 내어 알려 주세요.", "누군가 모니터를 보고 심박수를 기록지에 적어 주세요.", "monitor", "chart", "clock", "door"]
  - ["약물 단계", pill, "'Push'는 정맥으로 직접 주입하는 동작이에요. 'if … doesn't improve with oxygen'으로 산소가 먼저이고 약은 그다음이라는 순서를 밝혀요.", "if the patient is awake", "산소를 줘도 서맥이 호전되지 않으면 아트로핀을 준비해 둬요.", "산소를 줘도 서맥이 호전되지 않으면 아트로핀 병을 가져와요.", "oxygen", "music", "rest", "time"]
  - ["재시도 조건", check, "'once'는 조건이 갖춰진 뒤에 한다는 시간 접속사예요. 포화도와 심박수를 둘 다 말해 둘이 모두 회복된 뒤에야 다시 시도한다는 기준이 돼요.", "if the family agrees", "산소포화도와 체온이 회복되면 다시 시도할게요.", "산소포화도와 혈압이 회복되면 다시 시도할게요.", "sats", "sugar", "weight", "pain"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 삽관 중 서맥 대응 4문장 순서
    why: 시도를 멈추고 산소화부터 하고, 그동안 심박수를 소리 내어 알리고, 산소로 안 오르면 아트로핀을 쓰고, 회복되면 다시 시도해요.
    lines:
    - ["Stop the attempt and bag-mask ventilate him with 100 percent oxygen.", siren, "시도를 멈추고 100퍼센트 산소로 백마스크 환기하세요", "환기"]
    - ["Someone watch the monitor and call out the heart rate while we do that.", monitor, "그동안 누군가 모니터를 보고 심박수를 소리 내어 알려 주세요", "감시"]
    - ["If he still isn't improving after that, push atropine for the bradycardia.", pill, "그래도 호전되지 않으면 서맥에 아트로핀을 주입해요", "약물"]
    - ["We'll try again once his sats and heart rate recover.", check, "산소포화도와 심박수가 회복되면 다시 시도할게요", "재시도"]
- title: 기관절개관 우발적 탈관
  s:
  - ["응급 대응", siren, "'cover the stoma'는 구멍을 막아 입과 코로 준 산소가 새지 않게 해요. 관이 빠진 순간에는 위쪽 기도로도 산소를 줄 수 있어요.", "on the nightstand", "기관절개관 거즈가 빠졌어요 — 스토마를 덮고 입과 코 위로 산소를 주세요.", "기관절개관 끈이 풀렸어요 — 스토마를 덮고 입과 코 위로 산소를 주세요.", "oxygen", "water", "lotion", "heat"]
  - ["재삽입 준비", gear, "'same-size and a smaller'는 같은 크기가 안 들어갈 때 바로 쓸 더 작은 것을 함께 말해요. 새로 생긴 스토마는 좁아져 있을 수 있어요.", "for the transfer", "재삽입을 위해 동일 크기와 더 작은 흡인 카테터를 준비하세요.", "재삽입을 위해 동일 크기와 더 작은 기관절개관 끈을 준비하세요.", "smaller", "newer", "older", "cleaner"]
  - ["호출 이유", bell, "세미콜론 뒤 문장은 호출의 이유를 밝혀 줘요. 새로 생긴 스토마는 길이 아직 굳지 않아 관이 빠지면 금방 좁아져요.", "for a while", "기도팀을 부르세요. 새로 생긴 스토마는 다시 세척하기 어려울 수 있어요.", "기도팀을 부르세요. 새로 생긴 스토마는 다시 막히기 쉬울 수 있어요.", "fresh", "healed", "old", "dry"]
  - ["침착 유지", faceWorried, "'this isn't his fault'로 탓하지 않는다고 말해 팀의 긴장을 낮춰요. 침착해야 다음 지시가 정확히 들려요.", "and angry", "차분히 있어요 — 이건 환자 잘못이 아니라 그냥 겁먹고 배고픈 거예요.", "차분히 있어요 — 이건 환자 잘못이 아니라 그냥 피곤하고 혼란스러운 거예요.", "calm", "still", "quiet", "kind"]
  - ["산소 유지", monitor, "'holding … at his mouth'는 마스크를 씌우지 않고 가져다 대는 동작이에요. 'while'로 준비하는 동안에도 산소를 끊지 않는다는 뜻이에요.", "for the doctor", "소독하는 동안 입 쪽에 산소를 대고 있을게요.", "기록하는 동안 입 쪽에 산소를 대고 있을게요.", "while", "until", "before", "after"]
  - ["삽입 요령", compass, "'once'는 조건이 맞춰진 뒤라는 뜻이에요. 방향이 어긋난 채 밀면 관이 엉뚱한 길로 들어가 조직을 다칠 수 있어서 정렬이 먼저예요.", "from the side", "높이가 제대로 맞춰지면 새 기관절개관이 쉽게 들어가요.", "방향이 제대로 맞춰지면 새 흡인 카테터가 쉽게 들어가요.", "easily", "loudly", "painfully", "heavily"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기관절개관 탈관 4문장 순서
    why: 관이 빠진 즉시 산소를 주고, 기도팀을 부르고, 재삽입 장비를 준비하는 동안에도 산소를 대고 있어요.
    lines:
    - ["The trach is out; cover the stoma and give oxygen over the mouth and nose.", siren, "기관절개관이 빠졌어요, 스토마를 덮고 입과 코 위로 산소를 주세요", "산소"]
    - ["Call the airway team now; a fresh stoma can be hard to recannulate.", bell, "지금 기도팀을 부르세요. 새로 생긴 스토마는 다시 삽입하기 어려울 수 있어요", "호출"]
    - ["Get the same-size and a smaller trach ready for it.", gear, "그걸 위해 동일 크기와 더 작은 기관절개관을 준비하세요", "준비"]
    - ["I'm holding oxygen at his mouth while we get that set up.", monitor, "그걸 준비하는 동안 입 쪽에 산소를 대고 있을게요", "유지"]
- title: 기관절개 부위 대량 출혈
  s:
  - ["즉시 지혈", siren, "두 동작을 'and'로 이어 압박과 커프 팽창을 동시에 하라고 해요. 커프를 부풀리면 관이 출혈 부위를 눌러 막는 효과가 있어요.", "to dry the skin", "부위에 단단히 압박을 가하고 커프 압력계를 연결해 두세요.", "부위에 단단히 압박을 가하고 환자의 목 아래에 수건을 받쳐 두세요.", "tamponade", "irrigate", "dilate", "soften"]
  - ["원인 의심", magnify, "'could be'로 단정하지 않으면서 'emergently'로 긴급도를 분명히 해요. 기관 수술 부위에서 갑자기 많은 피가 나면 큰 동맥이 상했을 수 있어요.", "tracheo-esophageal", "기관식도 누공일 수 있어요 — 외과에 긴급히 연락하세요.", "기관지 흉막 누공일 수 있어요 — 외과에 긴급히 연락하세요.", "fistula", "tumor", "bruise", "rash"]
  - ["기도 유지", shield, "'Keep … secured'는 이미 확보한 상태를 유지하라는 지시예요. 출혈 조절에 집중하다 기도가 풀리면 피가 기도로 들어가 숨쉬기 어려워져요.", "for his comfort", "통증을 조절하는 동안 기도는 계속 확보해 두세요.", "출혈을 조절하는 동안 정맥로는 계속 확보해 두세요.", "bleeding", "pain", "fever", "swelling"]
  - ["인력 요청", bell, "'get more hands in here'는 사람을 손으로 세는 관용 표현이에요. 한 사람은 압박하고 한 사람은 기도를 지켜야 해서 손이 더 필요해요.", "for the paperwork", "누군가 외과에 연락하고 의자를 더 가져와 주세요.", "누군가 외과에 연락하고 불을 더 켜 주세요.", "hands", "chairs", "boxes", "bags"]
  - ["압박 유지", handshake2, "'while'로 두 사람이 동시에 다른 일을 한다는 걸 보여요. 압박은 끊으면 출혈이 다시 시작되니 한 사람이 계속 맡아요.", "from the doorway", "당신이 기록지를 준비하는 동안 저는 단단히 압박을 유지할게요.", "당신이 약물 카트를 준비하는 동안 저는 단단히 압박을 유지할게요.", "airway", "supply", "linen", "lunch"]
  - ["감시 보고", monitor, "'tell me the numbers'는 상태를 말이 아닌 수치로 보고하게 해요. 매 분 보고는 출혈이 빨라지는 속도를 팀이 같이 알아채게 해요.", "to your charge nurse", "출혈이 더 늘어나는지 보고 매 분마다 시간을 알려 주세요.", "통증이 더 늘어나는지 보고 매 분마다 숫자를 알려 주세요.", "numbers", "names", "colors", "rooms"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기관절개 대량 출혈 4문장 순서
    why: 먼저 압박과 커프로 지혈하고, 외과 연락과 인력을 요청한 뒤, 압박을 유지하며 카트를 준비하고, 출혈량을 계속 보고해요.
    lines:
    - ["Apply firm pressure at the site and overinflate the cuff to tamponade.", siren, "부위에 단단히 압박을 가하고 커프를 과팽창시켜 지혈하세요", "지혈"]
    - ["Someone call for surgery and get more hands in here.", bell, "누군가 외과에 연락하고 사람을 더 불러 주세요", "요청"]
    - ["I'll keep firm pressure on while you set up the airway cart.", handshake2, "당신이 기도 카트를 준비하는 동안 저는 단단히 압박을 유지할게요", "분담"]
    - ["Watch for more blood loss and tell me the numbers every minute.", monitor, "출혈이 더 늘어나는지 보고 매 분마다 숫자를 알려 주세요", "보고"]
- title: 식도 삽관 인지·즉시 교정
  s:
  - ["위치 판단", magnify, "'sustained'는 한 번이 아니라 숨마다 이어지는 파형을 말해요. 이산화탄소 파형이 없으면 가스가 폐에서 오지 않는다는 뜻이라 튜브가 기관 밖일 가능성이 높아요.", "on the cart", "산소포화도가 지속되지 않는다는 건 튜브가 기관 안에 없다는 뜻이에요.", "호흡음이 지속되지 않는다는 건 튜브가 기관 안에 없다는 뜻이에요.", "sustained", "slight", "early", "normal"]
  - ["즉시 교정", siren, "명령형 세 동사를 쉼표로 이어 순서대로 하라는 지시예요. 'before the next attempt'는 산소화가 다음 시도보다 먼저라는 뜻이에요.", "in the hallway", "튜브를 빼고 백으로 환기하며 다음 시도 전에 새 튜브를 준비해요.", "튜브를 빼고 백으로 환기하며 다음 시도 전에 후두경 날을 바꿔요.", "next", "last", "first", "final"]
  - ["장비 준비", gear, "'for the recheck'는 다시 확인하는 일을 위해서라는 목적이에요. 같은 화면을 함께 보면 관이 성대를 지나는지 팀이 같이 확인할 수 있어요.", "after the break", "재확인을 위해 흡인 카테터를 준비해 둘게요.", "시연을 위해 비디오 후두경을 준비해 둘게요.", "recheck", "transfer", "handoff", "meeting"]
  - ["신체 소견", stetho, "'not his chest'를 덧붙여 어디가 움직이는지 대비시켜요. 배가 부풀면 공기가 식도를 거쳐 위로 가고 있다는 신호예요.", "with each step", "숨을 쉴 때마다 가슴이 아니라 배가 가라앉아요.", "숨을 쉴 때마다 가슴이 아니라 어깨가 부풀어 올라요.", "belly", "neck", "back", "side"]
  - ["신속 교정", siren, "'not waste time'은 망설임을 막는 말투예요. 잘못 놓인 관은 확인하려고 더 두기보다 빼고 산소를 먼저 주는 편이 안전해요.", "for a while", "말을 낭비하지 말고 바로 빼서 재산소화해요.", "힘을 낭비하지 말고 바로 빼서 재산소화해요.", "time", "money", "space", "effort"]
  - ["크게 말하기", speech, "'say out loud'는 모두가 같은 정보를 듣게 하는 의사소통 방식이에요. 튜브가 빠졌다고 말해야 팀이 같은 그림을 갖고 다시 시도해요.", "to the family", "다시 시도하기 전에 튜브가 막혔다고 크게 말할게요.", "다시 시도하기 전에 시간이 됐다고 크게 말할게요.", "again", "twice", "slowly", "alone"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 식도 삽관 교정 4문장 순서
    why: 파형이 없다는 사실로 위치 이상을 알아채고, 배가 부푸는 소견으로 뒷받침한 뒤, 튜브를 빼고 산소화하고, 다시 시도하기 전에 말로 알려요.
    lines:
    - ["No sustained capnography means the tube is not in the trachea.", magnify, "이산화탄소가 지속되지 않는다는 건 튜브가 기관 안에 없다는 뜻이에요", "인지"]
    - ["His belly is rising with each breath, not his chest, which fits that.", stetho, "숨을 쉴 때마다 가슴이 아니라 배가 부풀어, 그와 맞아요", "소견"]
    - ["Remove the tube, bag him, and reoxygenate before the next attempt.", siren, "튜브를 빼고 백으로 환기하며 다음 시도 전에 재산소화해요", "교정"]
    - ["I'll say out loud that it's out before we try again.", speech, "다시 시도하기 전에 빠졌다고 크게 말할게요", "공유"]
- title: 기도부종 급성 폐색 위기
  s:
  - ["위기 선언", siren, "'is obstructing'은 막히는 중이라는 진행형이에요. 'immediate'로 기다릴 수 없다는 점을 분명히 해요. 부종은 시간이 갈수록 좁아져 갑자기 완전히 막힐 수 있어요.", "and needs a quiet room", "기도가 출혈로 막혀서 즉각적인 처치가 필요해요.", "기도가 이물로 막혀서 즉각적인 처치가 필요해요.", "swelling", "bleeding", "mucus", "vomit"]
  - ["응급 투약", siren, "'while'로 약을 주는 동안 호출도 함께 하라고 해요. 분무 에피네프린은 부은 점막을 빠르게 줄여 시간을 벌어 줘요.", "in the hallway", "분무 에피네프린을 주면서 어려운 기도 카트를 가져오세요.", "분무 에피네프린을 주면서 환자의 상체를 높이세요.", "team", "cart", "room", "bed"]
  - ["이중 준비", shield, "'both … and'는 두 가지를 모두 하라는 말이에요. 삽관이 안 될 때를 위해 외과적 기도를 같이 준비해야 시간을 잃지 않아요.", "for the next day", "삽관과 기관지 내시경 둘 다 준비하세요.", "산소와 외과적 기도 확보 둘 다 준비하세요.", "surgical", "manual", "portable", "simple"]
  - ["상태 악화", siren, "'less … with every breath'는 숨마다 나빠지는 흐름을 보여 줘요. 공기 소리가 줄어든다는 건 좁은 기도로 공기가 덜 지나간다는 뜻이라 조용해진다고 좋아진 게 아니에요.", "since last week", "숨을 쉴 때마다 공기 흐름이 지금 더 줄어드는 게 보여요.", "기침할 때마다 공기 흐름이 지금 더 줄어드는 게 들려요.", "hear", "see", "smell", "touch"]
  - ["역할 분담", handshake2, "'Someone … while I …'로 두 사람이 동시에 일하게 나눠요. 호출과 약 준비를 한 사람이 차례로 하면 한쪽이 늦어져요.", "after I leave", "제가 흡인기를 준비하는 동안 누군가 어려운 기도팀을 불러 주세요.", "제가 환자를 안심시키는 동안 누군가 어려운 기도팀을 불러 주세요.", "set up", "label", "count", "store"]
  - ["단계 상승", compass, "'escalating'은 대응 수준을 한 단계 올린다는 뜻이에요. 'before'로 완전히 막히기 전이라는 시한을 말해 기다리지 않고 움직이는 이유가 돼요.", "for the night", "완전 폐색이 되기 전에 지금 침대를 높이고 있어요.", "완전 폐색이 되기 전에 지금 조명을 높이고 있어요.", "full", "partial", "mild", "brief"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기도부종 폐색 위기 4문장 순서
    why: 숨소리가 줄어드는 소견을 알아채고, 부종 폐색이라고 판단해 단계를 올리며 호출·약 준비를 나눈 뒤, 삽관과 외과적 기도를 함께 준비해요.
    lines:
    - ["I hear less air movement with every breath now.", siren, "숨을 쉴 때마다 공기 흐름이 지금 더 줄어드는 게 들려요", "소견"]
    - ["That means his airway is obstructing from swelling and needs immediate intervention.", siren, "그건 기도가 부종으로 막혀 즉각적인 처치가 필요하다는 뜻이에요", "판단"]
    - ["Someone call the difficult airway team while I set up the epinephrine.", handshake2, "제가 에피네프린을 준비하는 동안 누군가 어려운 기도팀을 불러 주세요", "분담"]
    - ["Prepare for both intubation and a surgical airway backup with them.", shield, "그들과 함께 삽관과 외과적 기도 확보 둘 다 준비하세요", "준비"]
