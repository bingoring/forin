situations:
- title: 인공호흡기 설정 확인·기록
  sentences:
  - en: Let's confirm the mode, tidal volume, FiO2, and PEEP together.
    ko: 모드, 일회호흡량, FiO2, PEEP를 같이 확인해요.
    chunks:
    - Let's confirm
    - the mode, tidal volume, FiO2,
    - and PEEP
    - together
    - .
    words:
    - w-confirm
    - w-mode
    - w-tidalvolume
    - w-fio2
    - w-peep
    - w-together
    goal: 1
    tag: 설정 점검
    icon: gear
    why: Let's는 상대에게 시키지 않고 같이 하자는 모양이고, together가 한 사람이 혼자 보지 않는다는 점을 분명히 해요. 네 가지 설정을 둘이 맞춰 보면 한 사람의 착오가 기록으로 넘어가지 않아요.
    decoy: for the nurse
    distractorsKo:
    - 모드, 호흡수, FiO2, PEEP를 같이 확인해요
    - 모드, 일회호흡량, FiO2, 침대 높이를 같이 확인해요
    blank:
      answer: tidal volume
      options:
      - en: tidal volume
      - en: humidifier
      - en: bed height
      - en: tube size
  - en: I'll read the numbers off and you verify them on the flowsheet.
    ko: 제가 숫자를 불러줄 테니 흐름기록지에서 확인해 주세요.
    chunks:
    - I'll read
    - the numbers off
    - and you verify
    - them on the flowsheet
    - .
    words:
    - w-read
    - w-number
    - w-verify
    - w-flowsheet
    goal: 2
    tag: 역할 분담
    icon: handshake2
    why: I'll ... and you ...는 두 사람의 역할을 나눠 말하는 모양이에요. 읽는 사람과 확인하는 사람이 다르면 같은 착각을 둘이 함께 하기 어려워요.
    decoy: from memory
    distractorsKo:
    - 제가 숫자를 적어줄 테니 흐름기록지에서 확인해 주세요
    - 제가 이름을 불러줄 테니 흐름기록지에서 확인해 주세요
    blank:
      answer: flowsheet
      options:
      - en: pharmacy list
      - en: flowsheet
      - en: whiteboard
      - en: visitor log
  - en: The FiO2 is set at 40 percent with a PEEP of 5.
    ko: FiO2는 40퍼센트, PEEP는 5로 설정돼 있어요.
    chunks:
    - The FiO2 is set
    - at 40 percent
    - with a PEEP
    - of 5
    - .
    words:
    - w-fio2
    - w-peep
    - w-percent
    goal: 1
    tag: 설정값 보고
    icon: monitor
    why: set은 팀이 정해 둔 설정값이라는 뜻이고 환자에게서 잰 측정값과는 달라요. 설정값과 측정값을 구분해서 말해야 기록할 때 서로 섞이지 않아요.
