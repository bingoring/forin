  - en: Rising potassium, phosphate, and uric acid suggest tumor lysis.
    ko: 칼륨, 인산, 요산 상승은 종양용해를 시사합니다.
    chunks:
    - Rising potassium, phosphate,
    - and uric acid
    - suggest
    - tumor lysis
    - .
    words:
    - w-rise
    - w-potassium
    - w-phosphate
    - w-uric
    - w-acid
    - w-suggest
    - w-tumor
    - w-lysis
    goal: 1
    tag: TLS 인지
    icon: stetho
    why: '''suggest''는 수치 패턴만으로 확진하지 않고 가능성을 말하는 표현이에요. 세 가지가 함께 오르면 종양이 한꺼번에 깨질 때의 전형적인 모양이에요.'
    decoy: on the chart
    distractorsKo:
    - 칼륨, 인산, 혈당 상승은 종양용해를 시사합니다.
    - 칼륨, 인산, 요산 상승은 패혈증을 시사합니다.
    blank:
      answer: uric
      options:
      - en: uric
      - en: lactic
      - en: folic
      - en: citric
  - en: Let's ensure aggressive fluids and check for low calcium.
    ko: 적극적인 수액 확보하고 저칼슘 확인하겠습니다.
    chunks:
    - Let's ensure
    - aggressive fluids
    - and check
    - for low calcium
    - .
    words:
    - w-ensure
    - w-aggressive
    - w-fluid
    - w-check
    - w-low
    - w-calcium
    goal: 2
    tag: 수액·칼슘
    icon: pill
    why: '''aggressive fluids''는 소변을 많이 만들어 노폐물을 씻어 내려는 치료예요. ''check for low calcium''은 인산이 오르면 칼슘이 떨어질 수 있어서예요.'
    decoy: in the unit
    distractorsKo:
    - 적극적인 수액 확보하고 저칼슘 공유하겠습니다.
    - 적극적인 수액 확보하고 저칼슘 메모하겠습니다.
    blank:
      answer: calcium
      options:
      - en: calcium
      - en: vision
      - en: hearing
      - en: weight
  - en: We'll monitor labs closely and involve the team early.
    ko: 검사 유심히 모니터하고 팀을 일찍 참여시키겠습니다.
    chunks:
    - We'll monitor labs
    - closely
    - and involve the team
    - early
    - .
    words:
    - w-monitor
    - w-lab
    - w-close
    - w-involve
    - w-team
    - w-early
    goal: 2
    tag: 감시·참여
    icon: monitor
    why: '''involve the team early''는 문제가 커지기 전에 팀을 부른다는 뜻이에요. ''closely''와 ''early''로 감시와 협력을 함께 말해요.'
    decoy: at the desk
    distractorsKo:
    - 검사 유심히 기록하고 팀을 일찍 참여시키겠습니다.
    - 검사 유심히 모니터하고 팀을 일찍 소개하겠습니다.
    blank:
      answer: labs
      options:
      - en: labs
      - en: tubes
      - en: beds
      - en: doors
  - en: He started chemo yesterday for a high tumor burden.
    ko: 종양 부담이 커서 어제 항암 시작했습니다.
    chunks:
    - He started chemo
    - yesterday
    - for a high tumor
    - burden
    - .
    words:
    - w-start
    - w-chemo
    - w-yesterday
    - w-high
    - w-tumor
    - w-burden
    goal: 1
    tag: 병력 보고
    icon: stetho
    why: '''for''로 치료의 이유를 붙이면 위험 배경이 분명해져요. ''started … yesterday''는 시작 시점을 말해 시간 흐름이 보여요.'
    decoy: in the chart
    distractorsKo:
    - 종양 부담이 커서 오늘 항암 시작했습니다.
    - 종양 부담이 커서 어제 방사선 시작했습니다.
    blank:
      answer: chemo
      options:
      - en: chemo
      - en: dialysis
      - en: surgery
      - en: steroids
  - en: Rasburicase is ordered to bring down the uric acid fast.
    ko: 요산을 빨리 낮추려고 라스부리케이스 오더 났습니다.
    chunks:
    - Rasburicase is ordered
    - to bring down
    - the uric acid
    - fast
    - .
    words:
    - w-order
    - w-bring
    - w-uric
    - w-acid
    - w-fast
    goal: 2
    tag: 약물 보고
    icon: pill
    why: '''is ordered''는 오더가 이미 났다는 보고예요. ''to bring down''으로 목적을 붙이고 ''fast''로 속도를 말해요.'
    decoy: on the pump
    distractorsKo:
    - 칼륨을 빨리 낮추려고 라스부리케이스 오더 났습니다.
    - 요산을 빨리 낮추려고 라스부리케이스 오더 확인했습니다.
    blank:
      answer: ordered
      options:
      - en: ordered
      - en: stored
      - en: printed
      - en: labeled
  - en: I'll recheck labs every four hours until things stabilize.
    ko: 안정될 때까지 4시간마다 검사 재검하겠습니다.
    chunks:
    - I'll recheck labs
    - every four hours
    - until things
    - stabilize
    - .
    words:
    - w-recheck
    - w-lab
    - w-hour
    - w-stabilize
    goal: 2
    tag: 재검 계획
    icon: lab
    why: '''every four hours until''은 간격과 끝나는 조건을 함께 말해요. ''things''는 수치들을 가볍게 가리키는 말이에요.'
    decoy: on the unit
    distractorsKo:
    - 안정될 때까지 4시간마다 검사 기록하겠습니다.
    - 안정될 때까지 4시간마다 검사 보고하겠습니다.
    blank:
      answer: stabilize
      options:
      - en: stabilize
      - en: melt
      - en: spill
      - en: break
  order:
    tag: 대화 흐름
    icon: compass
    ko: 종양용해증후군 4문장 순서
    why: 항암 시작이라는 배경을 먼저 말하고, 수치 패턴이 종양용해를 시사한다고 알린 뒤, 수액과 칼슘 확인으로 대응하고, 수액이 들어가는 동안 4시간마다 재검한다고 해요.
    lines:
    - en: He started chemo yesterday for a high tumor burden.
      icon: stetho
      ko: 종양 부담이 커서 어제 항암을 시작했습니다
      note: 배경
    - en: Now rising potassium, phosphate, and uric acid suggest tumor lysis.
      icon: stetho
      ko: 이제 칼륨, 인산, 요산 상승이 종양용해를 시사합니다
      note: 소견
    - en: To manage that, let's ensure aggressive fluids and check for low calcium.
      icon: pill
      ko: 그걸 관리하려고 적극적인 수액을 확보하고 저칼슘을 확인하겠습니다
      note: 대응
    - en: With fluids running, I'll recheck labs every four hours until things stabilize.
      icon: lab
      ko: 수액이 들어가는 동안 안정될 때까지 4시간마다 재검하겠습니다
      note: 재검
- title: 생명위협 고칼륨혈증 위기
  sentences:
  - en: His ECG is showing a sine wave — this is life-threatening.
    ko: 심전도에 사인파 보입니다 — 생명 위협 상황입니다.
    chunks:
    - His ECG is showing
    - a sine wave
    - — this is
    - life-threatening
    - .
    words:
    - w-ECG
    - w-show
    - w-sine
    - w-wave
    - w-lifethreat
    goal: 1
    tag: 위기 인지
    icon: siren
    why: '''sine wave''는 고칼륨이 심해졌을 때 나오는 위험한 심전도 모양이에요. ''life-threatening''은 지금 바로 움직여야 한다는 신호예요.'
    decoy: on the monitor
    distractorsKo:
    - 심전도에 ST 상승 보입니다 — 생명 위협 상황입니다.
    - 심전도에 심방세동 보입니다 — 생명 위협 상황입니다.
    blank:
      answer: sine
      options:
      - en: sine
      - en: square
      - en: flat
      - en: round
  - en: Give calcium now to stabilize the heart, then insulin and glucose.
    ko: 지금 칼슘 줘서 심장 안정시키고, 이어서 인슐린과 포도당입니다.
    chunks:
    - Give calcium now
    - to stabilize the heart,
    - then insulin
    - and glucose
    - .
    words:
    - w-give
    - w-calcium
    - w-now
    - w-stabilize
    - w-heart
    - w-then
    - w-insulin
    - w-glucose
    goal: 2
    tag: 칼슘 먼저
    icon: siren
    why: '''now''로 시점을 못 박고 ''then''으로 다음 약을 이어 순서가 분명해요. 칼슘이 심장을 먼저 보호하고, 인슐린과 포도당이 칼륨을 세포 안으로 옮겨요.'
    decoy: at the bedside
    distractorsKo:
    - 지금 칼슘 줘서 신장 안정시키고, 이어서 인슐린과 포도당입니다.
    - 지금 칼슘 줘서 뇌 안정시키고, 이어서 인슐린과 포도당입니다.
    blank:
      answer: stabilize
      options:
      - en: stabilize
      - en: cover
      - en: paint
      - en: wrap
  - en: Let's activate emergent dialysis to remove the potassium.
    ko: 칼륨 제거하려고 응급 투석 가동하겠습니다.
    chunks:
    - Let's activate
    - emergent dialysis
    - to remove
    - the potassium
    - .
    words:
    - w-activate
    - w-emergent
    - w-dialysis
    - w-remove
    - w-potassium
    goal: 2
    tag: 투석 가동
    icon: siren
    why: '''emergent''는 지금 바로 해야 하는 응급이라는 뜻이에요. 약으로는 부족할 때 투석이 칼륨을 몸 밖으로 빼 줘요.'
    decoy: in the unit
    distractorsKo:
    - 수분 제거하려고 응급 투석 가동하겠습니다.
    - 요산 제거하려고 응급 투석 가동하겠습니다.
    blank:
      answer: activate
      options:
      - en: activate
      - en: document
      - en: bill
      - en: scan
  - en: Push calcium gluconate now — don't wait for the pump.
    ko: 지금 글루콘산칼슘 미세요 — 펌프 기다리지 마세요.
    chunks:
    - Push calcium gluconate
    - now
    - — don't wait
    - for the pump
    - .
    words:
    - w-push
    - w-calcium
    - w-now
    - w-wait
    - w-pump
    goal: 2
    tag: 즉시 투여
    icon: siren
    why: '''don''t wait for''는 기다리면 안 된다는 직접 지시예요. 위기에서는 펌프가 준비되길 기다리지 않고 직접 천천히 밀어 줘요.'
    decoy: at the desk
    distractorsKo:
    - 지금 글루콘산칼슘 미세요 — 알람 기다리지 마세요.
    - 지금 글루콘산칼슘 미세요 — 결과 기다리지 마세요.
    blank:
      answer: pump
      options:
      - en: pump
      - en: printer
      - en: porter
      - en: elevator
  - en: I've got the code cart at the bedside just in case.
    ko: 혹시 몰라 코드 카트 침상 곁에 가져다 놨습니다.
    chunks:
    - I've got
    - the code cart
    - at the bedside
    - just in case
    - .
    words:
    - w-code
    - w-cart
    - w-bedside
    - w-case
    goal: 2
    tag: 선제 준비
    icon: siren
    why: '''just in case''는 필요 없길 바라지만 대비한다는 뜻이에요. ''I''ve got''은 이미 준비를 마쳤다는 완료 보고예요.'
    decoy: in the hall
    distractorsKo:
    - 혹시 몰라 휠체어 침상 곁에 가져다 놨습니다.
    - 혹시 몰라 약 카트 침상 곁에 가져다 놨습니다.
    blank:
      answer: cart
      options:
      - en: cart
      - en: chart
      - en: badge
      - en: board
  - en: Call the nephrologist and get the dialysis catheter ready.
    ko: 신장내과 호출하고 투석 카테터 준비해 주세요.
    chunks:
    - Call the nephrologist
    - and get
    - the dialysis catheter
    - ready
    - .
    words:
    - w-call
    - w-nephrologist
    - w-dialysis
    - w-catheter
    - w-ready
    goal: 2
    tag: 호출·준비
    icon: siren
    why: '''Call''과 ''get … ready''를 이은 두 가지 지시를 한 문장에 담아 역할이 분명해요. ''ready''는 바로 쓸 수 있는 상태예요.'
    decoy: on the unit
    distractorsKo:
    - 신장내과 호출하고 투석 카테터 점검해 주세요.
    - 신장내과 호출하고 투석 기록 준비해 주세요.
    blank:
      answer: ready
      options:
      - en: ready
      - en: cold
      - en: wet
      - en: empty
  order:
    tag: 대화 흐름
    icon: compass
    ko: 고칼륨 위기 대응 4문장 순서
    why: 위기 소견을 먼저 알리고, 칼슘을 바로 주라고 지시한 뒤, 그동안 신장내과를 부르고 투석을 준비하게 하고, 모든 것이 진행되는 가운데 코드 카트를 대비한다고 알려요.
    lines:
    - en: His ECG is showing a sine wave — this is life-threatening.
      icon: siren
      ko: 심전도에 사인파가 보입니다 — 생명 위협 상황입니다
      note: 인지
    - en: Give calcium now to stabilize the heart, then insulin and glucose.
      icon: siren
      ko: 지금 칼슘을 줘서 심장을 안정시키고, 이어서 인슐린과 포도당입니다
      note: 투여
    - en: While that goes in, call the nephrologist and get the dialysis catheter ready.
      icon: siren
      ko: 그게 들어가는 동안 신장내과를 호출하고 투석 카테터를 준비해 주세요
      note: 호출
    - en: With all of that underway, I've got the code cart at the bedside just in case.
      icon: siren
      ko: 그 모든 게 진행되는 가운데 혹시 몰라 코드 카트를 침상 곁에 놨습니다
      note: 대비
- title: 급격 저나트륨 경련 위기
  sentences:
  - en: He's seizing from acute severe hyponatremia.
    ko: 급성 심한 저나트륨혈증으로 경련하고 있습니다.
    chunks:
    - He's seizing
    - from acute
    - severe hyponatremia
    - .
    words:
    - w-seize
    - w-acute
    - w-severe
    - w-hyponatremia
    goal: 1
    tag: 위기 인지
    icon: siren
    why: '''acute severe''는 갑자기 심해졌다는 뜻이라 위기임을 한 번에 전해요. ''from''으로 경련의 원인을 바로 이어 말해요.'
    decoy: on the monitor
    distractorsKo:
    - 급성 심한 저혈당으로 경련하고 있습니다.
    - 급성 심한 저칼슘혈증으로 경련하고 있습니다.
    blank:
      answer: seizing
      options:
      - en: seizing
      - en: sleeping
      - en: sweating
      - en: coughing
  - en: Let's give hypertonic saline per protocol to stop the seizures.
    ko: 프로토콜대로 고장성식염수 줘서 경련 멈추겠습니다.
    chunks:
    - Let's give
    - hypertonic saline
    - per protocol
    - to stop the seizures
    - .
    words:
    - w-give
    - w-hypertonic
    - w-saline
    - w-protocol
    - w-stop
    - w-seizure
    goal: 2
    tag: 고장성 식염수
    icon: pill
    why: '''per protocol''은 기관의 지침에 따라 정해진 방식으로 준다는 뜻이에요. ''to stop the seizures''로 목적을 밝혀요.'
    decoy: at the bedside
    distractorsKo:
    - 프로토콜대로 고장성식염수 줘서 혈압 올리겠습니다.
    - 프로토콜대로 고장성식염수 줘서 열 내리겠습니다.
    blank:
      answer: seizures
      options:
      - en: seizures
      - en: bleeding
      - en: headaches
      - en: nausea
  - en: We must limit the total correction to avoid brain injury.
    ko: 뇌 손상 피하려면 전체 교정 폭을 제한해야 합니다.
    chunks:
    - We must limit
    - the total correction
    - to avoid
    - brain injury
    - .
    words:
    - w-limit
    - w-total
    - w-correction
    - w-avoid
    - w-brain
    - w-injury
    goal: 2
    tag: 교정 제한
    icon: shield
    why: '''must''는 선택이 아니라 반드시라는 뜻이에요. 경련을 멈춘 뒤에도 너무 많이 올리면 뇌가 상할 수 있어서 총량을 제한해요.'
    decoy: in the unit
    distractorsKo:
    - 폐 손상 피하려면 전체 교정 폭을 제한해야 합니다.
    - 신장 손상 피하려면 전체 교정 폭을 제한해야 합니다.
    blank:
      answer: brain
      options:
      - en: brain
      - en: lung
      - en: liver
      - en: skin
  - en: His sodium is one-oh-eight, and he's actively convulsing.
    ko: 나트륨 108, 현재 경련 중입니다.
    chunks:
    - His sodium is
    - one-oh-eight,
    - and he's actively
    - convulsing
    - .
    words:
    - w-sodium
    - w-convulse
    goal: 1
    tag: 상태 보고
    icon: siren
    why: 수치와 현재 상태를 'and'로 이어 보고하면 얼마나 급한지 한 번에 전해져요. 'actively'는 지금 진행 중이라는 뜻이에요.
    decoy: on the chart
    distractorsKo:
    - 나트륨 108, 현재 구토 중입니다.
    - 나트륨 108, 현재 출혈 중입니다.
    blank:
      answer: convulsing
      options:
      - en: convulsing
      - en: vomiting
      - en: laughing
      - en: sneezing
  - en: Push one hundred mLs of three percent saline now.
    ko: 지금 3% 식염수 100mL 미세요.
    chunks:
    - Push one hundred mLs
    - of three percent
    - saline
    - now
    - .
    words:
    - w-push
    - w-percent
    - w-saline
    - w-now
    goal: 2
    tag: 즉시 투여
