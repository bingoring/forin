theme: icu-gi-bleed
changes:
- kind: word
  id: w-bleed
  fields:
  - ko
  why: 문장 대부분이 명사·동명사(bleeding, variceal bleed)라 '피가 나다'보다 '출혈'이 맞는다
- kind: word
