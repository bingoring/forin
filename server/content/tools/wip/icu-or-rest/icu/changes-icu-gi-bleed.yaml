  fields:
  - ko
  why: ko '확인하다'가 w-confirm과 같아 듣고 뜻 고르기에서 정답이 둘이 된다 — check는 '점검하다'로 가름
- kind: word
  id: w-fast
  fields:
  - ko
  why: 두 문장 모두 부사(run fluids faster, dropped fast)라 형용사 ko를 부사로
- kind: word
  id: w-lab
  fields:
  - ko
  why: 문장 대부분이 labs=검사 수치·검사라 '검사실'보다 '검사'가 맞는다 — 'the lab'(검사실) 문장은 태그를 뺌
- kind: word
  id: w-bank
  fields:
  - ko
  why: bank는 blood bank로만 쓰인다 — '은행'은 오해를 부른다
- kind: word
  id: w-get
  fields:
  - ko
  why: ko '가져오다'가 w-bring과 같아 정답이 둘이 된다 — get은 '마련하다'로 가름
- kind: word
  id: w-gather
  fields:
  - ko
  why: ko '챙기다'가 w-grab('급히 챙기다')과 거의 같아 가름
- kind: word
  id: w-cell
  fields:
  - ko
  why: packed cells는 '농축 혈구' — '세포'는 부정확
- kind: word
  id: w-count
  fields:
  - ko
  why: ko '수치'가 w-number·w-value와 같아 정답이 셋이 된다 — blood count는 '혈구 수'
- kind: word
  id: w-value
  fields:
  - ko
  why: ko '수치'가 w-number·w-count와 같아 가름
- kind: word
  id: w-lightheaded
  fields:
  - ko
