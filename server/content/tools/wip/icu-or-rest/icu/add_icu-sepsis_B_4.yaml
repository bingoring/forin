- title: 스테로이드 보조 판단
  s:
  - {t: "상태 설명", i: monitor, w: "still은 이미 치료했는데도 상태가 이어진다는 부사예요. despite fluids는 수액이라는 일반적인 첫 치료가 충분하지 않았다는 맥락을 한마디로 덧붙여요.", d: "for the report", k: ["수액을 줬는데도 혈당이 여전히 고용량 승압제 지지가 필요해요", "산소를 줬는데도 혈압이 여전히 고용량 승압제 지지가 필요해요"], a: "despite", o: ["beside", "behind", "beyond"]}
  - {t: "약 검토", i: pill, w: "considering은 아직 결정하지 않았다는 뜻이라 지금 투여한다는 말과 달라요. to help stabilize him은 목적을 밝혀서, 스테로이드가 혈압을 지지하려는 보조 치료라는 점을 알려 줘요.", d: "for the committee", k: ["안정시키는 데 도움이 되도록 저용량 스테로이드를 설명하고 있어요", "부담을 줄이는 데 도움이 되도록 저용량 스테로이드를 고려하고 있어요"], a: "stabilize", o: ["summarize", "socialize", "memorize"]}
  - {t: "처방 확인", i: board, w: "Let's …는 같이 하자고 제안하는 모양이라 팀 안에서 부드럽게 일을 나눠요. confirm the order를 먼저 말해 약을 시작하기 전에 처방을 확인하는 순서를 지켜요.", d: "for the kitchen", k: ["처방을 확인하고 소변을 세심하게 감시합시다", "처방을 확인하고 반응을 세심하게 감시하래요"], a: "order", o: ["orbit", "ornament", "orchard"]}
  - {t: "확인 순서", i: board, w: "only start after …는 only가 조건을 하나로 좁혀, 처방 확인 없이는 시작하지 않는다는 안전 순서를 강조해요. before you round의 round는 회진을 돈다는 동사로 쓰였어요.", d: "at the staff meeting", k: ["교대 전에 승압제 용량을 확인하세요, 스테로이드는 처방이 확인된 뒤에만 시작해요", "회진 전에 승압제 라벨을 확인하세요, 스테로이드는 처방이 확인된 뒤에만 시작해요"], a: "confirmed", o: ["confused", "concerned", "crowded"]}
  - {t: "단계 올리기", i: chartup, w: "in an hour는 한 시간 안에라는 기한을 정해 줘요. escalate는 한 단계 더 센 치료로 올린다는 뜻이라서, 반응이 없으면 기다리지 않고 다음 단계로 간다는 계획이에요.", d: "in the conference room", k: ["한 시간 안에 맥박이 반응하지 않으면 다음 약제로 올릴게요", "한 시간 안에 체온이 반응하지 않으면 다음 약제로 올릴게요"], a: "agent", o: ["apron", "album", "attic"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "스테로이드 검토 4문장 순서"
    why: "수액에도 승압제가 많이 필요한 상황에서 시작해 스테로이드를 고려한다고 이어요. 3줄의 them은 2줄의 스테로이드를, 4줄의 they're running은 3줄에서 처방을 확인한 뒤 시작된 상태를 가리켜서 순서가 하나예요."
    lines:
    - {en: "His pressure still needs high vasopressor support despite fluids.", icon: monitor, ko: "수액을 줬는데도 혈압이 여전히 고용량 승압제 지지가 필요해요", note: "상황"}
    - {en: "So we're considering low-dose steroids to help stabilize him.", icon: pill, ko: "그래서 안정시키도록 저용량 스테로이드를 고려하고 있어요", note: "고려"}
    - {en: "Let's confirm the order before anyone starts them.", icon: board, ko: "누가 시작하기 전에 처방을 확인합시다", note: "확인"}
    - {en: "Once they're running, we'll monitor his response closely.", icon: stetho, ko: "들어가기 시작하면 반응을 세심하게 감시할게요", note: "감시"}
- title: 장기부전 진행 모니터
  s:
  - {t: "수치 해석", i: chartup, w: "trending up은 한 번의 값이 아니라 시간에 따른 방향을 말해요. SOFA는 여러 장기의 기능을 점수로 합친 것이라, 점수가 오르면 장기 기능이 나빠진다는 뜻이에요.", d: "on the board", k: ["혈압이 오르는 추세라 장기 기능이 악화되고 있어요", "SOFA 점수가 오르는 추세라 가족 걱정이 커지고 있어요"], a: "trending", o: ["trimming", "trembling", "trusting"]}
  - {t: "보고 제안", i: pushpin, w: "flag는 눈에 띄게 표시해서 놓치지 않게 알린다는 뜻의 동사예요. 신장과 간 수치를 나란히 불러 장기 두 곳의 변화를 함께 알려요.", d: "on the door", k: ["오르는 크레아티닌과 칼륨을 팀에 표시해 둡시다", "오르는 크레아티닌과 빌리루빈을 팀에 표시해 두었어요"], a: "rising", o: ["rinsing", "roaring", "rolling"]}
  - {t: "중요성", i: bulb, w: "in time은 늦지 않게라는 뜻이고 on time과 달라요. Early recognition처럼 명사형 주어를 쓰면 일찍 알아차리는 행동 자체가 이점이라는 설명이 돼요.", d: "at the nurses' desk", k: ["일찍 설명해야 제때 지지 치료를 올릴 수 있어요", "일찍 인지해야 제때 병상을 옮길 수 있어요"], a: "recognition", o: ["reputation", "recreation", "repetition"]}
  - {t: "호출 기준", i: siren, w: "means 뒤에는 앞 상황이 뜻하는 결론이 이어져요. now, not at rounds는 지금과 나중을 대비해서, 회진을 기다리지 않는다는 점을 분명히 해요.", d: "on the roster", k: ["세 장기가 동시에 멈추면 회진 때가 아니라 지금 중환자전담의를 불러야 해요", "두 장기가 동시에 멈추면 교대 때가 아니라 지금 중환자전담의를 불러야 해요"], a: "organs", o: ["offices", "oceans", "opinions"]}
  - {t: "기록 약속", i: pencil, w: "so 뒤에 목적을 이어 기록하는 이유를 밝혀요. immediately는 지체 없이라는 부사라서, 교대 시점에 정보가 끊기지 않게 한다는 뜻이에요.", d: "in the folder", k: ["다음 교대 근무자가 바로 볼 수 있게 지금 식단을 기록해 둘게요", "의사 선생님이 바로 볼 수 있게 지금 추세를 기록해 둘게요"], a: "trend", o: ["trench", "trunk", "trick"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "장기부전 악화 대응 4문장 순서"
    why: "수치가 오른다는 소견에서 시작해, 장기 둘이 동시에 나빠지면 지금 부른다고 이어요. 3줄의 When I call은 2줄의 호출을, 4줄의 what I reported는 3줄에서 보고한 내용을 가리켜서 순서가 하나예요."
    lines:
    - {en: "His SOFA score is trending up, so organ function is worsening.", icon: chartup, ko: "SOFA 점수가 오르는 추세라 장기 기능이 악화되고 있어요", note: "소견"}
    - {en: "With two organs failing at once, we call the intensivist now, not at rounds.", icon: siren, ko: "두 장기가 동시에 멈추니 회진 때가 아니라 지금 중환자전담의를 불러요", note: "호출"}
    - {en: "When I call, I'll flag the rising creatinine and bilirubin.", icon: pushpin, ko: "전화할 때 오르는 크레아티닌과 빌리루빈을 알릴게요", note: "보고"}
    - {en: "I'll chart what I reported so the next shift sees it immediately.", icon: pencil, ko: "보고한 내용을 기록해서 다음 교대자가 바로 보게 할게요", note: "기록"}
- title: 수액 과부하 균형
  s:
  - {t: "수액 제거", i: monitor, w: "Now that …은 상태가 달라진 지금이 이유가 된다는 접속 표현이에요. carefully removing처럼 부사를 앞에 두면 안정됐더라도 서두르지 않는다는 태도가 전해져요.", d: "in the closet", k: ["이제 더 편안해졌으니 여분의 수액을 신중하게 빼고 있어요", "이제 더 안정됐으니 여분의 침구를 신중하게 빼고 있어요"], a: "extra", o: ["empty", "early", "equal"]}
  - {t: "부종 설명", i: faceWorried, w: "The swelling means …에서 means 뒤의 절이 부종의 뜻을 풀어 줘요. holding은 몸이 물을 밖으로 못 내보내고 쥐고 있다는 쉬운 동사라서 가족이 부종을 이해하기 쉬워요.", d: "by the nurses' station", k: ["부종은 몸이 열을 너무 많이 붙들고 있다는 뜻이에요", "통증은 몸이 물을 너무 많이 붙들고 있다는 뜻이에요"], a: "swelling", o: ["spelling", "smelling", "selling"]}
  - {t: "균형 설명", i: bulb, w: "giving and removing처럼 반대 동작 둘을 and로 묶으면 둘을 함께 조절한다는 뜻이 돼요. to protect는 목적을 말해서 수액을 빼는 일도 폐와 장기를 위한 것임을 보여 줘요.", d: "for the caregivers", k: ["폐와 뼈를 보호하려고 수액을 주고 빼는 걸 균형 있게 조절해요", "폐와 장기를 보호하려고 영양을 주고 빼는 걸 균형 있게 조절해요"], a: "balance", o: ["bounce", "borrow", "bake"]}
  - {t: "호전 설명", i: chartup, w: "less swollen than yesterday는 less와 than으로 어제와 오늘을 견줘 변화를 말해요. which tells us는 앞 관찰이 균형 조절의 효과를 보여 준다고 연결해요.", d: "in the garden", k: ["팔이 어제보다 덜 부었는데, 이건 균형이 잘 맞고 있다는 뜻이에요", "다리가 이틀 전보다 덜 부었는데, 이건 균형이 잘 맞고 있다는 뜻이에요"], a: "legs", o: ["lamps", "logs", "laps"]}
  - {t: "감량 속도", i: monitor, w: "so 뒤의 stays steady는 혈압이 계속 안정된 상태로 머문다는 목적이에요. slowly는 한꺼번에 빼면 혈압이 떨어질 수 있다는 이유를 담은 부사예요.", d: "to the waiting area", k: ["체온이 안정적으로 유지되도록 천천히 수액을 계속 뺄게요", "호흡이 안정적으로 유지되도록 천천히 수액을 계속 뺄게요"], a: "slowly", o: ["sweetly", "sadly", "shyly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수액 과부하 설명 4문장 순서"
    why: "수액을 빼고 있다는 사실에서 시작해, 그 이유인 부종을 설명하고, 균형 조절로 이어요. 2줄의 That's because는 1줄을, 3줄의 that은 2줄의 문제를, 4줄의 the balance는 3줄에서 처음 나온 균형을 가리켜서 순서가 하나예요."
    lines:
    - {en: "Now that he's more stable, we're carefully removing extra fluid.", icon: monitor, ko: "이제 더 안정됐으니 여분의 수액을 신중하게 빼고 있어요", note: "상황"}
    - {en: "That's because the swelling means his body is holding too much water.", icon: faceWorried, ko: "부종은 몸이 물을 너무 많이 붙들고 있다는 뜻이기 때문이에요", note: "이유"}
    - {en: "To fix that, we balance giving and removing fluid to protect his lungs and organs.", icon: bulb, ko: "그걸 바로잡으려고 폐와 장기를 보호하도록 수액을 주고 빼는 걸 조절해요", note: "조절"}
    - {en: "His legs are less swollen than yesterday, so the balance is working.", icon: chartup, ko: "다리가 어제보다 덜 부었으니 균형이 잘 맞고 있어요", note: "효과"}
- title: 면역저하 패혈증 특수 관리
  s:
  - {t: "이유 설명", i: shield, w: "Because 절이 이유를 먼저 말하고 뒤에 결과를 이어요. aggressively는 사납다는 뜻이 아니라 서두르고 충분히 센 치료를 한다는 부사라서, 면역이 약한 환자의 감염에 쓰는 말이에요.", d: "near the fountain", k: ["면역 체계가 낮아서, 어떤 열이든 아주 적극적으로 치료해요", "혈압이 낮아서, 어떤 감염이든 아주 적극적으로 치료해요"], a: "immune", o: ["immense", "immodest", "imperial"]}
  - {t: "예방 설명", i: shield, w: "protect him from …에서 from은 막아 주는 대상을 이어요. extra precautions는 평소보다 더한 예방 조치라서 면역이 낮은 환자에게 감염 경로를 줄여 주는 수단이에요.", d: "at the gate", k: ["소음으로부터 보호하려고 여분의 예방 조치를 써요", "새로운 세균으로부터 보호하려고 여분의 병실을 써요"], a: "germs", o: ["gifts", "games", "grapes"]}
  - {t: "계획 설명", i: pill, w: "may start는 확정이 아닌 가능성을 말해서, 팀이 상태를 보고 정한다는 뜻이에요. blood counts는 혈액 속 세포 수치라서, 면역이 낮을 때 수치를 함께 챙긴다는 설명이 돼요.", d: "from the supply closet", k: ["팀이 특수 항생제를 시작하고 영양을 지지해 줄 수 있어요", "팀이 특수 식단을 시작하고 혈구 수치를 지지해 줄 수 있어요"], a: "special", o: ["spicy", "sloppy", "silent"]}
  - {t: "위험 설명", i: faceWorried, w: "even a small infection의 even은 작은 경우에도 해당된다는 강조예요. white count는 감염과 싸우는 백혈구의 수라서, 낮으면 작은 감염도 막지 못하고 커질 수 있어요.", d: "in the sunroom", k: ["적혈구 수치가 아주 낮아서, 작은 감염도 빠르게 심각해질 수 있어요", "백혈구 수치가 아주 낮아서, 작은 상처도 빠르게 심각해질 수 있어요"], a: "small", o: ["smart", "tasty", "tidy"]}
  - {t: "방문 안내", i: shield, w: "Please …로 시작하는 요청문이라 방문객에게 정중하게 지시해요. before entering처럼 before 뒤에 -ing를 쓰면 들어가기 전에라는 시점을 말해요.", d: "on the way", k: ["들어오시기 전에 방문 기록부에 이름을 적으시고, 손을 잘 씻어 주세요", "들어오시기 전에 가운과 장갑을 착용하시고, 손을 두 번 씻어 주세요"], a: "gloves", o: ["perfume", "jewelry", "sandals"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "면역저하 환자 설명 4문장 순서"
    why: "백혈구가 낮아 작은 감염도 위험하다는 이유를 먼저 말하고, 그래서 적극 치료하며, 거기에 예방 조치를 더하고, 그중 방문객이 할 일로 마무리해요. 2줄의 That's why는 1줄을, 3줄의 that treatment는 2줄을, 4줄의 those precautions는 3줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "His immune system is low and his white count is very low, so even a small infection can become serious fast.", icon: faceWorried, ko: "면역 체계와 백혈구 수치가 아주 낮아서 작은 감염도 빠르게 심각해질 수 있어요", note: "이유"}
    - {en: "That's why we treat any infection very aggressively.", icon: pill, ko: "그래서 어떤 감염이든 아주 적극적으로 치료해요", note: "치료"}
    - {en: "On top of that treatment, we use extra precautions to protect him from new germs.", icon: shield, ko: "그 치료에 더해 새로운 세균으로부터 보호하는 예방 조치를 써요", note: "예방"}
    - {en: "As part of those precautions, please wash your hands well and wear a gown and gloves before entering.", icon: handshake2, ko: "그 조치로 들어오시기 전에 손을 잘 씻고 가운과 장갑을 착용해 주세요", note: "안내"}
- title: 다제내성 의심 경험적 확대
  s:
  - {t: "이유 설명", i: pill, w: "Because of 뒤에는 절이 아니라 명사구가 와요. broadening은 넓힌다는 뜻의 동사라서, 균을 정확히 알기 전에 가능한 균을 더 넓게 덮는다는 계획이에요.", d: "for the neighbors", k: ["가족 요청이 있어서 항생제 포괄 범위를 넓히고 있어요", "검사 결과가 있어서 항생제 포괄 범위를 넓히고 있어요"], a: "coverage", o: ["courage", "cabbage", "carriage"]}
  - {t: "효과 설명", i: shield, w: "make sure …는 놓치지 않고 확실히 한다는 표현이에요. any resistant bacteria처럼 any를 쓰면 하나도 빼놓지 않고 포괄한다는 뜻이 돼요.", d: "from the window seat", k: ["이렇게 하면 알레르기까지 확실히 치료할 수 있어요", "이렇게 하면 내성균까지 확실히 예방할 수 있어요"], a: "bacteria", o: ["batteries", "bakeries", "barrels"]}
  - {t: "계획 설명", i: redo, w: "once는 어떤 일이 일어나는 순간부터라는 접속사예요. guide us는 결과가 길잡이처럼 방향을 알려 준다는 표현이라, 정확한 균이 나온 뒤 약을 좁힌다는 순서가 보여요.", d: "at the airport", k: ["가족이 동의해 주면 그때 좁힐게요", "혈압이 충분히 안정되면 그때 좁힐게요"], a: "guide", o: ["greet", "grab", "groan"]}
  - {t: "위험 설명", i: faceWorried, w: "put him at higher risk에서 put A at B는 A를 B의 상태에 놓는다는 모양이에요. 최근 입원과 과거 내성균 감염은 내성균을 보유했을 가능성을 높이는 대표적인 위험 요인이에요.", d: "at the car", k: ["최근 여행 기간과 과거 내성균 감염이 더 높은 위험에 놓이게 해요", "최근 입원 기간과 과거 낙상 경험이 더 높은 위험에 놓이게 해요"], a: "recent", o: ["rented", "ragged", "rapid"]}
  - {t: "전환 설명", i: lab, w: "Once we know …는 알게 되는 순간 다음 행동이 가능해진다는 뜻이에요. focused는 한 곳에 모은다는 뜻이라서 narrow와 같은 방향을 다른 쉬운 말로 풀어 줘요.", d: "on the stage", k: ["정확한 균을 알게 되면 더 비싼 항생제로 바꿀 수 있어요", "정확한 위치를 알게 되면 더 집중된 항생제로 바꿀 수 있어요"], a: "switch", o: ["swim", "swallow", "sweep"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항생제 범위 넓힘 4문장 순서"
    why: "범위를 넓힌다는 결정과 이유로 시작해, 그 효과를 말하고, 그동안 균을 찾는다고 이은 뒤, 알게 되면 좁힌다고 마무리해요. 4줄의 it은 3줄의 the exact bacteria를 가리키고, 2줄의 Broader coverage는 1줄에서 처음 나온 말이라 순서가 하나예요."
    lines:
    - {en: "Because of his risk factors, we're broadening the antibiotic coverage.", icon: pill, ko: "위험 요인이 있어서 항생제 포괄 범위를 넓히고 있어요", note: "결정"}
    - {en: "Broader coverage helps make sure we treat any resistant bacteria.", icon: shield, ko: "범위가 넓으면 내성균까지 확실히 치료할 수 있어요", note: "효과"}
    - {en: "Meanwhile, the lab is growing his cultures to find the exact bacteria.", icon: lab, ko: "그동안 검사실은 정확한 균을 찾으려고 배양하고 있어요", note: "배양"}
