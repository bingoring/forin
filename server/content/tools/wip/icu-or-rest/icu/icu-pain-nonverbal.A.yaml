situations:
- title: CPOT 통증 사정
  sentences:
  - en: CPOT looks at facial expression, muscle tension, and vent tolerance.
    ko: CPOT는 표정과 근긴장, 인공호흡기 순응을 봐요.
    chunks:
    - CPOT looks
    - at facial expression
    - ', muscle tension'
    - ', and vent tolerance'
    - .
    words:
    - w-cpot
    - w-look
    - w-muscle
    - w-tension
    - w-vent
    - w-tolerance
    goal: 1
  - en: Let's watch his face and note any rigid muscles.
    ko: 얼굴을 지켜보고 뻣뻣한 근육이 있는지 봐요.
    chunks:
    - Let's watch
    - his face
    - and note
    - any rigid muscles
    - .
    words:
    - w-watch
    - w-rigid
    - w-muscle
    goal: 1
  - en: His brow is furrowed and he's tensing — that scores points.
    ko: 이마를 찌푸리고 뻣뻣해지면 그것도 점수에 들어가요.
    chunks:
    - His brow
    - is furrowed
    - and he's tensing
    - — that scores points
    - .
    words:
    - w-brow
    - w-furrow
    - w-tense
    - w-score
    - w-point
    goal: 2
  - en: He's fighting the vent a little, so that scores too.
    ko: 인공호흡기와 조금 씨름해도 그것도 점수예요.
    chunks:
    - He's fighting
    - the vent
    - a little
    - ', so that scores too'
    - .
    words:
    - w-fight
    - w-vent
    - w-score
    goal: 2
  - en: Let's total the score and document it.
    ko: 점수를 합산해서 기록해요.
    chunks:
    - Let's total
    - the score
    - and document it
    - .
    words:
    - w-total
    - w-score
    - w-document
    goal: 2
  - en: A CPOT of four means his pain isn't controlled yet.
    ko: CPOT가 4점이면 통증이 아직 조절되지 않은 거예요.
    chunks:
    - A CPOT of four
    - means his pain
    - isn't controlled
    - yet
    - .
    words:
    - w-cpot
    - w-mean
    - w-pain
    - w-control
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-tension
    - w-rigid
    - w-muscle
    cue: 'Nurse: "When I bend his arm, he pushes back hard and I can''t finish the movement."'
    scale:
    - relaxed
    - tense
    - rigid
    answerAt: 2
    why: CPOT 근긴장 항목은 팔을 수동으로 굽혀 볼 때의 저항을 봐요. 저항이 없으면 relaxed, 저항이 있어도 움직여지면 tense, 강하게 버텨서 끝까지 움직일 수 없으면 rigid예요.
    example: His arm is rigid when I try to bend it.
    exKo: 팔을 굽히려고 하면 뻣뻣하게 굳어 있어요.
  - kind: context
    words:
    - w-score
    word: score
    ko: 점수
    scenes:
    - who: 동료 간호사에게
      icon: speech
      en: His CPOT score is four — treat that as pain until proven otherwise.
      ok: true
    - who: 차트 기록
      icon: board
      en: 'CPOT score 4 at rest: grimacing, tense, fighting the vent.'
      ok: true
    - who: 보호자에게
      icon: me
      en: His CPOT score on the vent is a four out of eight.
      ok: false
      fix: He's showing signs of pain, like grimacing and tensing, so we're giving him pain medicine.
    why: 의료진끼리는 CPOT 점수를 숫자로 말하면 정확하고 빨라요. 가족에게는 척도 이름과 숫자가 낯서니, 환자가 어떤 모습이고 무엇을 해 주는지를 쉬운 말로 풀어 줘요.
- title: BPS 등 행동척도 이해
  sentences:
  - en: BPS scores facial expression, arm movement, and vent compliance.
    ko: BPS는 표정과 팔 움직임, 인공호흡기 순응도를 봐요.
    chunks:
    - BPS scores
    - facial expression
    - ', arm movement'
    - ', and vent compliance'
    - .
    words:
    - w-bps
    - w-score
    - w-movement
    - w-vent
    - w-compliance
    goal: 1
  - en: Some units use CPOT, others use BPS — either works if we're consistent.
    ko: 어떤 병동은 CPOT를, 어떤 병동은 BPS를 써요 — 일관되면 둘 다 괜찮아요.
    chunks:
    - Some units use CPOT
    - ', others use BPS'
    - — either works
    - if we're consistent
    - .
    words:
    - w-cpot
    - w-bps
    - w-consistent
