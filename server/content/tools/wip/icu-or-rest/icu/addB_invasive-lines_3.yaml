- title: 라인 감염 조기 인지
  s:
  - ["감염 우려", siren, "with the line in place로 조건을 붙이면 열만이 아니라 라인이 있다는 점이 감염 의심의 이유가 돼요. raises concern for는 확정하지 않고 걱정을 올린다는 완곡한 표현이에요.", "New dizziness", "라인이 있는 상태에서 새로 두통이 나면 중심라인 감염이 우려돼요.", "라인이 있는 상태에서 새로 열이 나면 소변줄 감염이 우려돼요.", "CLABSI", "CAUTI", "VAP", "DVT"]
