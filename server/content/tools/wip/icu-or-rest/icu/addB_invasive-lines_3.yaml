  - ["필요성 설명", speech, "why he needs …처럼 이유를 간접의문문으로 말해 설명한 내용을 요약해요. instead of just …는 더 간단한 대안과 비교해 필요성을 보여 줘요.", "a feeding tube", "왜 그냥 정맥주사가 아니라 동맥관이 필요한지 설명했어요.", "왜 그냥 경구약이 아니라 중심라인이 필요한지 설명했어요.", "explained", "asked", "wrote", "wondered"]
  - ["약물 배치", board, "map out은 한눈에 보이게 짜 둔다는 뜻이에요. which … in which …로 짝을 말하면 어떤 약이 어느 관강인지 정확히 전달돼요.", "which room", "어떤 약물이 어느 펌프로 가는지 정리해뒀어요.", "어떤 간호사가 어느 관강을 맡는지 정리해뒀어요.", "drug", "pump", "tube", "bolus"]
