  - ["흡인물 소견", lab, "are consistent with는 그럴 가능성이 높다는 뜻이지 확정이 아니라서 의학 보고에 자주 써요. pH와 색깔 두 가지가 함께 맞아야 위 내 위치를 더 믿을 수 있어요.", "and smell", "흡인물의 산도랑 양이 위 내 위치와 일치해요.", "흡인물의 산도랑 색깔이 지난번 기록과 일치해요.", "gastric", "intestinal", "esophageal", "pleural"]
  - ["위치 유지", check, "since로 기준 시점부터 지금까지 이어진 상태를 말하는 현재완료예요. 삽입 뒤 이동이 없었다는 확인은 위치가 처음 확인한 그대로라는 근거가 돼요.", "last week", "어제 삽입한 뒤로 관이 막히지 않았어요.", "그제 삽입한 뒤로 관이 이동하지 않았어요.", "migrated", "clogged", "leaked", "kinked"]
  - ["급식 보류", lock, "until은 어떤 일이 확인될 때까지 이어지는 행동을 말해요. 위치를 확인하기 전에는 급식을 멈춰 두는 것이 흡인 예방의 기본이에요.", "is clearly marked", "끝이 위 안에 있는 거 확인할 때까지 약은 보류할게요.", "끝이 위 안에 있는 거 확인할 때까지 흡인은 보류할게요.", "hold", "mix", "warm", "order"]
