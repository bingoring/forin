  - ["징후 보고", siren, "now를 넣으면 방금 전과 달라졌다는 변화가 들려요. rigoring은 오한으로 몸을 떠는 모습을 한 단어로 보고하는 현장 표현이에요.", "looks tidy", "부위가 부었고 환자가 오한으로 떨고 있어요.", "부위가 붉어졌고 환자가 통증으로 찡그리고 있어요.", "red", "pale", "dry", "flat"]
  - ["완곡 보고", speech, "not … yet, but … either로 아직 결론이 아니라는 점과 가능성이 남아 있다는 점을 함께 말해요. 감염 의심을 확정하지도 무시하지도 않는 균형이에요.", "the lab yet,", "아직 소변줄 탓이라고 단정하는 건 아니지만, 배제할 수도 없어요.", "아직 약 탓이라고 단정하는 건 아니지만, 배제할 수도 없어요.", "blaming", "removing", "changing", "flushing"]
