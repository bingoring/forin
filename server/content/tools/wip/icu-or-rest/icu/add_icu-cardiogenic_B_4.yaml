situations:
- title: "심실빈맥·세동 동반 급변"
  s:
  - ["코드 인지", "siren", "상태('VT·무맥')와 지시('start compressions')를 대시로 이어 인지에서 행동까지 한 호흡에 말해요. 맥박 없는 VT는 심정지로 보고 바로 압박해요.", "and cold", "심방세동에 맥박이 없어요, 흉부압박을 시작하세요.", "심실빈맥에 호흡이 없어요, 흉부압박을 시작하세요.", "pulseless", "sweaty", "thirsty", "sleepy"]
  - ["도움 요청", "siren", "'Someone'으로 특정인을 지목하지 않고 누구든 움직이게 해요. 코드 호출과 카트 가져오기를 동시에 요청해 시간을 아껴요.", "a wheelchair", "모두 코드를 부르고 카트를 가져와 주세요.", "제가 코드를 부르고 카트를 가져올게요.", "crash", "linen", "lunch", "food"]
  - ["제세동 준비", "siren", "'Charge to 200'으로 에너지 값을 먼저 말하고 'clear the bed'로 감전 위험을 막는 지시를 이어요. 충격 직전에는 모두 침대에서 떨어져야 해요.", "the hallway", "200으로 충전하고 방에서 물러나세요.", "200으로 충전하고 복도에서 물러나세요.", "clear", "clean", "cover", "wipe"]
  - ["충격 후 재개", "siren", "'right after'로 충격과 압박 재개 사이를 비우지 않는다는 시간 지시를 담아요. 충격 후에는 바로 압박을 이어야 해서 맥박 확인은 그 다음이에요.", "the call", "교대 직후 바로 심폐소생술을 재개하세요.", "충격을 준 직후 바로 심폐소생술을 교대하세요.", "shock", "lunch", "photo", "page"]
  - ["재충전 전 확인", "siren", "'before we charge again'으로 확인이 충전보다 먼저임을 못 박아요. 충격을 반복하기 전에 리듬과 맥박을 확인해 다음 단계를 정해요.", "twice", "처음 충전하기 전에 맥박을 확인하세요.", "다시 충전하기 전에 모두 맥박을 확인하세요.", "pulse", "leak", "rash", "smell"]
  order:
    tag: "대화 흐름"
    icon: "siren"
    ko: "VT 무맥 대응 4문장 순서"
    why: "맥박 없는 VT를 알아보고 바로 압박을 시작해요. 압박을 이어가며 코드 호출과 카트를 요청하고, 카트가 오면 충전과 물러나기, 충격 직후 압박 재개로 이어져요."
    lines:
    - ["He's in VT and pulseless — start compressions.", "siren", "심실빈맥에 맥박이 없어요, 흉부압박을 시작하세요", "인지"]
    - ["Someone call a code and grab the crash cart while we keep compressing.", "siren", "압박을 계속하는 동안 누가 코드를 부르고 카트를 가져와 주세요", "요청"]
    - ["Once it's here, charge to 200 and clear the bed.", "siren", "카트가 오면 200으로 충전하고 침대에서 물러나세요", "충전"]
    - ["Right after the shock, resume CPR.", "siren", "충격을 준 직후 바로 심폐소생술을 재개하세요", "재개"]
- title: "기계보조 중 급성 출혈"
  s:
  - ["출혈 보고", "siren", "'while anticoagulated'로 항응고 중이라는 위험 요인을 함께 보고해요. 같은 출혈도 항응고 중이면 더 빨리 번질 수 있어요.", "at the heel", "항응고 중인 상태에서 캐뉼라 부위에서 열이 있어요.", "항응고 중인 상태에서 캐뉼라 부위에서 가려움이 있어요.", "bleeding", "itching", "drifting", "sweating"]
  - ["출혈량 묘사", "faceWorried", "'soaked'와 'saturated'로 양을 숫자 대신 눈에 보이는 상태로 전해요. 시트와 드레싱이 젖은 정도는 출혈량을 가늠하는 단서가 돼요.", "is loose", "시트가 흠뻑 젖었고 드레싱도 헐거워졌어요.", "베개가 흠뻑 젖었고 드레싱도 흠뻑 젖었어요.", "soaked", "folded", "warmed", "ripped"]
  - ["지시 전달", "siren", "명령문 두 개를 'and'로 이어 담당자가 순서대로 행동하게 해요. 출혈 중에는 항응고제를 멈추고 수혈 준비를 서둘러요.", "the room", "제가 헤파린을 보류하고 수혈을 준비할게요.", "헤파린을 보류하고 수혈 동의서를 준비해 주세요.", "blood", "ice", "food", "water"]
  - ["지혈·호출", "siren", "'holding pressure'로 손으로 눌러 지혈하는 동작을 말해요. 압박을 유지하면서 의사를 부르는 두 가지를 동시에 한다는 뜻이에요.", "her husband", "그분이 압박하면서 의사를 부르고 있어요.", "가족이 압박하면서 의사를 부르고 있어요.", "pressure", "hands", "breath", "still"]
  - ["혈액 준비", "lab", "'type and cross'는 혈액형 검사와 교차적합시험을 묶어 부르는 약칭이에요. 수혈이 필요할 수 있을 때 미리 보내 두면 혈액 준비가 빨라져요.", "a urine sample", "혈액형과 교차검사 용지를 바로 보내야 해요.", "혈액형과 교차검사 결과를 바로 받아야 해요.", "sent", "framed", "painted", "folded"]
  order:
    tag: "대화 흐름"
    icon: "siren"
    ko: "항응고 중 출혈 대응 4문장 순서"
    why: "출혈 소견을 먼저 보고하고, 지혈하며 의사를 부르는 동안 헤파린 보류와 수혈 준비를 요청한 뒤, 그에 필요한 검체를 바로 보내요."
    lines:
    - ["She's bleeding at the cannula site while anticoagulated.", "siren", "항응고 중인 상태에서 캐뉼라 부위에서 출혈이 있어요", "보고"]
    - ["I'm holding pressure and calling the physician.", "siren", "압박하면서 의사를 부르고 있어요", "지혈"]
    - ["Meanwhile, hold the heparin and get blood ready.", "siren", "그동안 헤파린을 보류하고 수혈을 준비해 주세요", "지시"]
    - ["For that, we need type and cross sent right away.", "lab", "그러려면 혈액형과 교차검사를 바로 보내야 해요", "검사"]
- title: "기계보조 환자 이송 관리"
  s:
  - ["이송 전 점검", "check", "'Let's'로 팀이 함께 점검하자고 제안해요. 'before we move'로 점검이 이동보다 먼저임을 분명히 해요.", "oxygen tank", "이동 전에 펌프, 산소통, 휴대용 모니터를 확인해봐요.", "이동 전에 펌프, 정맥주입, 휴대용 흡인기를 확인해봐요.", "monitor", "speaker", "printer", "camera"]
  - ["라인 고정", "lock", "'All the lines'로 하나도 빼지 않는다는 점을 앞에 둬요. 이송 중에 라인이 당겨지면 빠지거나 꼬일 수 있어서 먼저 고정해요.", "the bags", "이송 전에 모든 침대를 고정해야 해요.", "이송 전에 모든 케이블을 고정해야 해요.", "secured", "painted", "folded", "weighed"]
  - ["역할 확인", "handshake2", "'Everyone knows'로 모두가 이해하고 있음을 확인하는 보고예요. 이송에는 여러 명이 움직여서 각자 맡은 일을 미리 알아야 해요.", "their names", "모두가 이송에서 자기 이름을 알고 있어요.", "모두가 이송에서 자기 짐을 알고 있어요.", "role", "locker", "coffee", "shoes"]
  - ["미리 연락", "speech", "'call ahead'는 도착 전에 미리 알린다는 관용 표현이에요. 'so'로 목적을 이어 붙이면 왜 미리 전화하는지 바로 전달돼요.", "the elevator", "엘리베이터가 준비되도록 미리 전화할게요.", "복도가 준비되도록 미리 전화할게요.", "cath", "dental", "sleep", "hair"]
  - ["이동 신호", "play", "'on my count'로 한 사람이 신호를 주고 다 함께 움직이게 해요. 신호가 하나여야 환자와 장비가 흔들리지 않아요.", "at the door", "제 신호에 맞춰 둘이서 옮길게요.", "제 신호에 맞춰 한 명씩 옮길게요.", "count", "lunch", "shift", "break"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "이송 준비 4문장 순서"
    why: "장비를 점검하고 라인을 고정한 뒤, 도착지에 미리 연락하고, 준비됐다는 답을 받으면 하나의 신호로 함께 옮겨요."
    lines:
    - ["Let's confirm the pump, drips, and portable monitor before we move.", "check", "이동 전에 펌프, 정맥주입, 휴대용 모니터를 확인해봐요", "점검"]
    - ["With those checked, all the lines need to be secured.", "lock", "그게 확인되면 모든 라인을 고정해야 해요", "고정"]
    - ["Meanwhile, I'll call ahead so the cath lab is ready for him.", "speech", "그동안 카테터실이 준비되도록 미리 전화할게요", "연락"]
    - ["When they say they're ready, we'll move on my count, everyone together.", "play", "그쪽이 준비됐다고 하면 제 신호에 맞춰 모두 함께 옮길게요", "이동"]
- title: "회복 불가 심부전 목표 전환"
  s:
  - ["상태 알림", "faceWorried", "'the way we hoped'로 실패라고 단정하지 않고 기대와 다르다는 표현을 써 부드럽게 전해요. 나쁜 소식은 사실을 분명히 하되 단어를 고르는 게 중요해요.", "the week", "폐가 저희가 바랐던 만큼 회복되고 있지 않아요.", "신장이 저희가 바랐던 만큼 회복되고 있지 않아요.", "recovering", "resting", "sleeping", "moving"]
  - ["현재 상황", "compass", "'everything we can'로 최선을 다하고 있음을 먼저 말하고, 'the next day or two'로 예상 시간을 알려 막연한 불안을 줄여요. 확답 대신 'will tell us a lot'이라고 해 정직하게 전해요.", "this weekend", "저희가 할 수 있는 모든 걸 하고 있고, 이삼 일이면 많은 걸 알 수 있을 거예요.", "저희가 할 수 있는 모든 걸 하고 있고, 일주일이면 많은 걸 알 수 있을 거예요.", "tell", "cost", "cure", "pay"]
  - ["선택지 제시", "speech", "'We can talk about'으로 결정을 강요하지 않고 이야기할 수 있는 선택지로 열어 줘요. 이식 평가와 편안함 중심 돌봄을 나란히 놓아 어느 쪽도 포기가 아닌 선택임을 보여요.", "a second opinion", "이식 평가나 재활 중심 돌봄에 대해 이야기해볼 수 있어요.", "수술 평가나 완화 중심 돌봄에 대해 이야기해볼 수 있어요.", "evaluation", "celebration", "graduation", "invitation"]
  - ["가치 존중", "compass", "'Let's'로 의료진이 정하는 게 아니라 함께 찾는다는 태도를 보여요. 'what matters most to him'은 환자의 가치를 기준으로 삼는다는 말이에요.", "that leads", "이 분에게 가장 편안한 것에 맞는 길을 함께 찾아봐요.", "가족에게 가장 중요한 것에 맞는 길을 함께 찾아봐요.", "path", "pillow", "shirt", "chair"]
  - ["선택 존중", "handshake2", "'no wrong choice'로 죄책감 없이 고를 수 있게 부담을 덜어 줘요. 'let's decide together'로 책임을 혼자 지지 않게 해요.", "tonight", "잘못된 질문은 없어요, 함께 결정해요.", "잘못된 선택은 없어요, 천천히 결정해요.", "decide", "guess", "vote", "draw"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "목표 전환 대화 4문장 순서"
    why: "나쁜 소식을 부드럽게 전하고, 최선을 다하고 있다는 말로 이어요. 그 뒤에 선택지를 열어 놓고, 어느 쪽도 잘못이 아니라며 함께 결정하자고 마무리해요."
    lines:
    - ["His heart isn't recovering the way we hoped.", "faceWorried", "심장이 저희가 바랐던 만큼 회복되고 있지 않아요", "알림"]
    - ["Even so, we're doing everything we can, and the next day or two will tell us a lot.", "compass", "그래도 저희는 할 수 있는 모든 걸 하고 있고, 하루 이틀이면 많은 걸 알 수 있어요", "상황"]
    - ["With that in mind, we can talk about a transplant evaluation or comfort-focused care.", "speech", "그걸 염두에 두고 이식 평가나 완화 중심 돌봄에 대해 이야기해볼 수 있어요", "선택지"]
    - ["Whichever you pick, there's no wrong choice here — let's decide together.", "handshake2", "어느 쪽을 고르시든 잘못된 선택은 없어요, 함께 결정해요", "존중"]
