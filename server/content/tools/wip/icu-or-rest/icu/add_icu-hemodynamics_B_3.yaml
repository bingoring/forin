# 상황 13~20
- s: 13
  sents:
    - {tag: "평가 방법", icon: me, why: "passive는 환자가 힘을 쓰지 않고 다리를 올려 준다는 뜻이에요. 다리를 올리면 정맥혈이 심장으로 돌아와 수액을 주기 전에 반응을 미리 볼 수 있어요.", decoy: "in bed", dk: ["수동 팔 거상을 하면서 압력 반응을 지켜봐요", "수동 다리 거상을 하면서 맥박 반응을 지켜봐요"], ans: "leg", wr: ["arm", "head", "hip"]}
    - {tag: "판단 기준", icon: chartup, why: "likely는 확률을 뜻하는 말이라 반응한다가 아니라 반응할 가능성이 높다로 단정을 피해요. fluid responsive는 수액을 주면 심박출량이 느는 상태예요.", decoy: "in time", dk: ["맥박수가 줄어들면 수액에 반응할 가능성이 높아요", "맥압변이가 줄어들면 약에 반응할 가능성이 높아요"], ans: "likely", wr: ["about", "bound", "ready"]}
    - {tag: "판단 이유", icon: bulb, why: "decide if …는 ~할지 말지를 정한다는 뜻이에요. actually를 넣으면 실제로 효과가 있는지가 핵심이라 불필요한 수액을 줄여 과부하를 피해요.", decoy: "for sure", dk: ["이걸 보면 수액을 두 번 더 줄지 결정하는 데 도움이 돼요", "이걸 보면 약을 한 번 더 줄지 결정하는 데 도움이 돼요"], ans: "bolus", wr: ["blanket", "bandage", "bottle"]}
    - {tag: "시행 설명", icon: me, why: "for about a minute로 시행 시간을 짧게 알려 주면 환자가 불편을 참기 쉬워요. what her pressure does처럼 의문사절이 압력이 어떻게 되는지를 한 덩어리로 묶어요.", decoy: "on the bed", dk: ["약 10분 동안 다리를 올리고 압력이 어떻게 되는지 지켜봐요", "약 1분 동안 팔을 올리고 압력이 어떻게 되는지 지켜봐요"], ans: "raise", wr: ["bend", "cross", "shake"]}
    - {tag: "해석", icon: chartup, why: "usually는 예외가 있다는 뜻이라 반응이 크더라도 수액이 반드시 필요하다는 단정을 피해요.", decoy: "in a row", dk: ["팔 거상에 반응이 크면 대개 수액이 도움이 될 거예요", "다리 거상에 반응이 크면 대개 약이 도움이 될 거예요"], ans: "usually", wr: ["rarely", "barely", "luckily"]}
    - {tag: "해석", icon: chartup, why: "may not help much처럼 may not과 much를 함께 써서 도움이 전혀 없다가 아니라 크지 않을 수 있다고 말해요. 반응 없는 환자에게 수액을 더하면 과부하 위험만 커질 수 있어요.", decoy: "right now", dk: ["맥박 반응이 거의 없으면 수액을 더 줘도 큰 도움이 안 될 수 있어요", "반응이 거의 없으면 약을 더 줘도 큰 도움이 안 될 수 있어요"], ans: "little", wr: ["fast", "early", "odd"]}
    - {tag: "기록 계획", icon: pencil, why: "before and after를 함께 적어야 변화를 비교할 수 있어요. 올리기 전 기준값이 없으면 반응이 있었는지 판단할 수 없어요.", decoy: "in the bag", dk: ["다리를 올리기 전후 체온을 기록할게요", "팔을 올리기 전후 압력을 기록할게요"], ans: "after", wr: ["above", "against", "around"]}
  order:
    tag: "평가 흐름"
    icon: compass
    ko: "수액 반응성을 평가하는 4문장 순서"
    why: "기준값을 먼저 적고, 다리를 올려 반응을 본 뒤, 반응이 크면 수액이 도움이 되고 작으면 아닐 수 있다고 해석해요."
    lines:
      - {en: "I'll chart her pressure before we raise her legs.", icon: pencil, ko: "다리를 올리기 전에 압력을 기록할게요", note: 기준}
      - {en: "With that recorded, we'll raise her legs for about a minute and watch her pressure.", icon: me, ko: "기록 뒤 약 1분 다리를 올리며 압력을 봐요", note: 시행}
      - {en: "A big response to the leg raise usually means fluid will help.", icon: chartup, ko: "반응이 크면 대개 수액이 도움이 돼요", note: 해석}
      - {en: "But if there's little response, another bolus may not help much.", icon: bulb, ko: "반응이 거의 없으면 수액이 도움이 안 될 수 있어요", note: 대비}
- s: 14
  sents:
    - {tag: "전환 순서", icon: gear, why: "before stopping처럼 before 뒤 동명사로 멈추기 전에를 말해서 순서가 분명해요. 새 펌프를 먼저 돌려야 승압제가 끊기는 순간이 없어요.", decoy: "with the nurse", dk: ["왼쪽 펌프를 멈추기 전에 새 펌프를 먼저 시작할게요", "이전 펌프를 멈추기 전에 두 번째 펌프를 먼저 시작할게요"], ans: "start", wr: ["clean", "carry", "paint"]}
    - {tag: "이유 설명", icon: gear, why: "no gap in the drip의 gap은 약이 끊기는 틈이에요. 반감기가 짧은 승압제는 몇 분만 끊겨도 혈압이 떨어질 수 있어서 겹쳐 돌려요.", decoy: "by hand", dk: ["겹치게 해서 약물 주입에 소음이 없게 해요", "겹치게 해서 펌프 알람에 끊김이 없게 해요"], ans: "gap", wr: ["noise", "smell", "color"]}
    - {tag: "감시 요청", icon: monitor, why: "Watch the pressure처럼 동사로 시작하는 명령문은 짧아서 바쁜 순간에 동료에게 바로 전달돼요. while은 그동안이라는 범위를 정해요.", decoy: "for the door", dk: ["전환하는 동안 맥박을 지켜봐 주세요", "청소하는 동안 압력을 지켜봐 주세요"], ans: "switch", wr: ["visit", "meal", "call"]}
    - {tag: "이중 확인", icon: check, why: "double-check는 이미 확인한 것을 한 번 더 본다는 뜻이고, first로 새 약을 연결하기 전이라는 시점을 정해요.", decoy: "with the doctor", dk: ["이전 백의 라벨과 농도를 먼저 다시 확인할게요", "새 백의 라벨과 유효기간을 먼저 다시 확인할게요"], ans: "label", wr: ["price", "weight", "color"]}
    - {tag: "응급 대응", icon: bell, why: "If 절에 압력 저하를, 주절에 새 펌프 속도를 올린다는 행동을 붙였어요. speed up은 속도를 높인다는 구동사로, 끊김 없이 승압제를 보충하는 즉각적인 조치예요.", decoy: "by the window", dk: ["식사하는 동안 압력이 떨어지면 새 펌프 속도를 올릴게요", "교대하는 동안 압력이 떨어지면 새 펌프 속도를 올릴게요"], ans: "drops", wr: ["stays", "sleeps", "melts"]}
    - {tag: "순서 설명", icon: check, why: "Once …, I'll …는 앞 조건이 끝나야 다음 행동을 한다는 순서예요. steady를 확인한 뒤에야 이전 펌프를 멈춰서 혈압이 흔들리지 않아요.", decoy: "like before", dk: ["새 백이 안정되면 이전 것을 멈출게요", "새 펌프가 안정되면 이전 라인을 멈출게요"], ans: "steady", wr: ["empty", "loud", "slow"]}
    - {tag: "결과 설명", icon: check, why: "keeps her pressure steady처럼 keep + 목적어 + 형용사는 ~를 ~한 상태로 유지한다는 틀이에요. the whole time은 과정 처음부터 끝까지라는 뜻이에요.", decoy: "like magic", dk: ["이 교체 과정 내내 맥박이 안정적으로 유지돼요", "이 교체 과정 처음에만 압력이 안정적으로 유지돼요"], ans: "swap", wr: ["order", "tour", "wash"]}
  order:
    tag: "전환 순서"
    icon: compass
    ko: "승압제 펌프를 끊김 없이 바꾸는 4문장 순서"
    why: "새 백을 먼저 확인하고, 새 펌프를 먼저 돌리고, 겹치는 동안 혈압을 보고, 안정된 뒤에야 이전 것을 멈춰야 끊김이 없어요."
    lines:
      - {en: "I'll double-check the new bag's label and concentration first.", icon: check, ko: "새 백의 라벨과 농도를 먼저 다시 확인할게요", note: 확인}
      - {en: "With that confirmed, I'll start the new pump before stopping the old one.", icon: gear, ko: "확인 뒤 이전 걸 멈추기 전에 새 펌프를 시작해요", note: 시작}
      - {en: "Watch the pressure while the two pumps overlap.", icon: monitor, ko: "두 펌프가 겹치는 동안 압력을 지켜봐 주세요", note: 감시}
      - {en: "Once the new pump is steady, I'll stop the old one.", icon: check, ko: "새 펌프가 안정되면 이전 것을 멈출게요", note: 마무리}
- s: 15
  sents:
    - {tag: "상황 보고", icon: siren, why: "on max A plus B는 지금 쓰는 약을 최대량 + 병용으로 압축해 말하는 보고 방식이에요. still low로 반응이 없다는 점을 마지막에 남겨 에스컬레이션의 근거로 써요.", decoy: "since noon", dk: ["노르에피네프린 최대량에 바소프레신까지 쓰는데도 맥박이 여전히 낮아요", "노르에피네프린 최대량에 바소프레신까지 쓰는데도 소변이 여전히 적어요"], ans: "still", wr: ["finally", "barely", "hardly"]}
    - {tag: "원인 탐색", icon: magnify, why: "reassess는 이미 한 평가를 다시 한다는 뜻의 re-예요. reversible cause는 출혈·감염처럼 고치면 쇼크가 풀리는 원인이라, 약만 올리지 않고 원인을 찾는다는 방향을 보여요.", decoy: "of the pump", dk: ["흔한 원인이 있는지 다시 평가해야 해요", "되돌릴 수 있는 원인이 있는지 먼저 평가해야 해요"], ans: "reversible", wr: ["reasonable", "regular", "recent"]}
    - {tag: "에스컬레이션", icon: siren, why: "escalate는 더 높은 단계에 알린다는 뜻이고 using SBAR는 보고 틀을 밝혀 줘요. SBAR는 상황·배경·평가·권고 순서라 짧은 시간에 빠짐없이 전달해요.", decoy: "by the door", dk: ["지금 문자로 상황을 보고해서 에스컬레이션할게요", "지금 I-PASS로 상황을 보고해서 에스컬레이션할게요"], ans: "escalating", wr: ["filing", "labeling", "copying"]}
    - {tag: "상황 보고", icon: chartup, why: "even at …은 ~까지 해도라는 양보로, 최대치로도 효과가 없다는 점을 눌러 말해요. 반응하지 않았다는 사실을 현재완료로 써서 지금까지의 결과를 보고해요.", decoy: "last night", dk: ["승압제 두 가지를 최대량까지 써도 맥박이 반응하지 않았어요", "승압제 세 가지를 최대량까지 써도 압력이 반응하지 않았어요"], ans: "max", wr: ["half", "low", "new"]}
    - {tag: "원인 확인", icon: magnify, why: "A, B, or anything else reversible처럼 구체적인 예 뒤에 그 밖의 것을 붙이면 목록이 닫히지 않아요. 출혈·감염은 쇼크가 풀리지 않을 때 먼저 찾는 흔한 원인이에요.", decoy: "this evening", dk: ["골절이나 감염, 그 밖에 되돌릴 수 있는 원인이 있는지 확인하고 있어요", "출혈이나 탈수, 그 밖에 되돌릴 수 있는 원인이 있는지 확인하고 있어요"], ans: "bleeding", wr: ["bruising", "burning", "itching"]}
    - {tag: "보고 약속", icon: speech, why: "give the full picture는 일부가 아니라 전체 그림을 준다는 관용 표현이에요. physician은 doctor보다 격식 있는 말이라 보고 상황에 어울려요.", decoy: "in person", dk: ["전화로 의사에게 전체 상황을 전달할게요", "SBAR로 의사에게 전체 사진을 전달할게요"], ans: "full", wr: ["half", "small", "quick"]}
    - {tag: "위험 설명", icon: bell, why: "staying this low for long에서 for long은 오래 지속된다는 뜻이라, 수치의 크기뿐 아니라 지속 시간이 장기 손상의 위험을 정해요.", decoy: "in the log", dk: ["MAP이 이렇게 오래 낮으면 피부가 손상될 수 있어요", "MAP이 이렇게 자주 낮으면 장기가 손상될 수 있어요"], ans: "hurt", wr: ["warm", "clean", "feed"]}
  order:
    tag: "보고 흐름"
    icon: compass
    ko: "승압제 최대량에도 반응이 없을 때 말하는 4문장 순서"
    why: "상황을 먼저 보고하고, 되돌릴 원인을 다시 보겠다고 방향을 잡고, 구체적으로 무엇을 보는지 말한 뒤, 에스컬레이션으로 이어요."
    lines:
      - {en: "She's on max norepinephrine plus vasopressin and her MAP is still low.", icon: siren, ko: "최대량 노르에피네프린에 바소프레신도 MAP이 낮아요", note: 상황}
      - {en: "We should reassess for a reversible cause.", icon: magnify, ko: "되돌릴 수 있는 원인을 다시 평가해야 해요", note: 방향}
      - {en: "That means checking for bleeding, infection, or anything else reversible.", icon: bulb, ko: "출혈, 감염 등 되돌릴 원인을 확인한다는 뜻이에요", note: 확인}
      - {en: "On top of that, I'm escalating this now using SBAR.", icon: speech, ko: "그와 함께 지금 SBAR로 에스컬레이션할게요", note: 보고}
- s: 16
  sents:
    - {tag: "중단 지시", icon: siren, why: "Stop the…처럼 동사로 시작하는 명령은 응급 상황에서 가장 짧고 분명해요. infiltration은 약물이 정맥 밖 조직으로 새는 것이라 계속 들어가면 손상이 커져요.", decoy: "at the wrist", dk: ["주입을 멈추세요. 알레르기처럼 보여요", "주입을 멈추세요. 감염처럼 보여요"], ans: "infiltration", wr: ["infection", "allergy", "fracture"]}
    - {tag: "해독제", icon: pill, why: "need A to treat B는 B를 치료하려면 A가 필요하다는 틀이에요. phentolamine은 혈관을 넓혀 새어 나온 승압제로 인한 조직 허혈을 줄이는 약으로, 의사 처방에 따라 써요.", decoy: "from pharmacy", dk: ["감염을 치료하려면 phentolamine이 필요해요", "멍을 치료하려면 phentolamine이 필요해요"], ans: "treat", wr: ["chart", "report", "name"]}
    - {tag: "동시 조치", icon: siren, why: "I'm calling … and elevating …처럼 현재진행형 둘을 and로 이으면 지금 동시에 하고 있다는 뜻이에요. 팔을 올리면 부종이 줄어 조직 압박을 덜어 줘요.", decoy: "on the phone", dk: ["의사에게 연락하고 사진을 찍고 있어요", "의사에게 연락하고 약을 가져오고 있어요"], ans: "elevating", wr: ["measuring", "labeling", "photographing"]}
    - {tag: "조치 보고", icon: siren, why: "I stopped … right away when I saw …는 무엇을 봤고 곧바로 무엇을 했는지를 시간 순서로 보고해요. 색 변화는 혈관 수축·허혈의 초기 신호라 즉시 중단이 맞아요.", decoy: "last night", dk: ["손 온도가 변하는 걸 보고 바로 노르에피네프린을 멈췄어요", "팔 색깔이 변하는 걸 보고 바로 노르에피네프린을 멈췄어요"], ans: "color", wr: ["smell", "name", "weight"]}
    - {tag: "위험 설명", icon: bell, why: "if we don't act fast는 대응이 늦으면 생기는 결과를 조건으로 건 말이에요. lead to는 ~로 이어지다라는 구동사예요.", decoy: "in the unit", dk: ["빨리 대응하지 않으면 피부 손상으로 이어질 수 있는 손상이에요", "빨리 대응하지 않으면 조직 손상으로 이어질 수 있는 감염이에요"], ans: "tissue", wr: ["brain", "paper", "hair"]}
    - {tag: "기록 항목", icon: pencil, why: "document the site, the time, and … 목록으로 세 가지를 짚어 두면 나중에 다른 사람이 같은 장면을 그릴 수 있어요. 침윤은 시각과 모양이 처치 평가의 근거가 돼요.", decoy: "in a note", dk: ["약과 시각, 어떻게 보였는지를 기록할게요", "자리와 시각, 어떻게 말했는지를 기록할게요"], ans: "document", wr: ["decorate", "dictate", "display"]}
