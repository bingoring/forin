"20.2": {tag: "지원 안내", icon: handshake2, why: "can bring in은 가능한 도움을 알려 주는 말이라, 강요 없이 선택지를 열어 줘요.", decoy: "the billing team", dk: ["윤리팀과 사회복지팀을 불러 도움을 받을 수 있어요.", "윤리팀과 완화의료팀을 불러 설명을 들을 수 있어요."], ans: ethics, o: [legal, billing, security]}
"20.3": {tag: "공감", icon: handshake2, why: "'I hear that ~'은 상대의 마음을 받아 적듯 되짚는 말이라, 의견이 갈려도 사랑이라는 공통점을 먼저 짚어요.", decoy: "and trust him", dk: ["두 분 다 그분을 존경하고 최선을 원하신다는 걸 알아요.", "두 분 다 그분을 사랑하고 안전을 원하신다는 걸 알아요."], ans: love, o: [admire, trust, miss]}
"20.4": {tag: "결정 존중", icon: handshake2, why: "'belongs to'로 결정권이 가족에게 있음을 분명히 하고 whatever로 어떤 결론이든 곁에 있겠다고 약속해요.", decoy: "to the weekend", dk: ["이 일정은 가족분들의 몫이고, 어떤 선택이든 저희가 지지할게요.", "이 결정은 가족분들의 몫이고, 어떤 선택이든 저희가 기록할게요."], ans: decision, o: [schedule, room, meal]}
"20.5": {tag: "회의 제안", icon: calendar, why: "'the whole family together'로 모두를 한 자리에 모으자고 제안해, 한 사람에게만 전달되는 오해를 줄여요.", decoy: "with the billing team", dk: ["오늘 온 가족과 윤리팀을 함께 모읍시다.", "내일 온 가족과 완화의료팀을 함께 모읍시다."], ans: tomorrow, o: [Monday, Friday, tonight]}
