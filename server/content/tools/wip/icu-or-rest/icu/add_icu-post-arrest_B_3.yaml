"20.0": {tag: "공감", icon: faceWorried, why: "'I can see'로 상대의 감정을 알아보고 있음을 먼저 말하고 incredibly로 어려움의 크기를 인정해요.", decoy: "a sudden decision", dk: ["가족분들께 몹시 갑작스러운 결정이라는 걸 알겠어요.", "의료진께 몹시 힘든 결정이라는 걸 알겠어요."], ans: hard, o: [sudden, urgent, private]}
