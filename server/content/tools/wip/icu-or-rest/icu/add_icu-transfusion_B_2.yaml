- title: "급성 용혈반응 초기 대응"
  s:
  - ["증상 보고", "bell", "허리 통증·오한·검은 소변은 급성 용혈의 전형적인 소견이에요. 증상을 나열해 보고하면 의료진이 바로 반응을 의심해요.", ", and dry skin", "허리 통증과 오한, 맑은 소변이 있어요.", "다리 통증과 오한, 검은 소변이 있어요.", "back", "knee", "foot", "ankle"]
  - ["중단·튜빙 분리", "siren", "용혈 반응이 의심되면 즉시 중단하고 혈액이 든 튜빙을 분리해요. 생리식염수는 새 튜빙으로 연결해 라인을 열어 둬요.", "the monitor", "수혈을 멈추고 침대 시트를 분리할게요.", "수혈을 멈추고 포장 박스를 분리할게요.", "tubing", "monitor", "bracelet", "chart"]
  - ["반응 의심", "bell", "'looks like'로 확진이 아니라 강한 의심임을 밝혀요. 급성 용혈은 ABO 불일치 같은 면역 반응으로 적혈구가 빠르게 깨지는 거예요.", "a rare", "급성 감염 반응처럼 보여요.", "만성 용혈반응처럼 보여요.", "reaction", "injury", "infection", "surgery"]
  - ["라인 유지", "gear", "새 튜빙으로 생리식염수를 연결해 정맥 라인을 열어 두면 약을 바로 줄 수 있어요. 'normal saline'은 0.9% 식염수예요.", "with a bandage", "생리식염수로 창문을 열어 둘게요.", "생리식염수로 커튼을 열어 둘게요.", "line", "filter", "bag", "chamber"]
  - ["제제·검체 반납", "lab", "남은 혈액 백과 환자 혈액 검체를 혈액은행으로 보내야 원인을 확인하는 검사를 할 수 있어요.", "for a price check", "반응 정밀검사를 위해 서류와 혈액 검체를 반납하세요.", "반응 정밀검사를 위해 제제와 혈액 상자를 반납하세요.", "workup", "refund", "invoice", "tour"]
  - ["즉시 보고", "bell", "의료진과 혈액은행 두 곳에 모두 알려야 해요. 혈액은행이 같은 시기에 나간 제제를 점검할 수 있어요.", "and the pharmacy", "의료진과 약국에 바로 알릴게요.", "원무과와 혈액은행에 바로 알릴게요.", "provider", "pharmacist", "dietitian", "therapist"]
  - ["소변량 감시", "monitor", "용혈로 신장이 손상될 수 있어 소변량을 계속 봐요. 'for the next few hours'는 감시 기간을 정해 줘요.", "his food intake", "앞으로 몇 시간은 식사량을 세심하게 지켜볼게요.", "앞으로 며칠은 소변량을 세심하게 지켜볼게요.", "urine", "diet", "visitor", "sleep"]
