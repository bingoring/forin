situations:
- title: 복와위 중 급성 desaturation
  s:
  - [원인 점검, magnify, '''first''로 순서를 못 박고 ''displacement or obstruction''으로 무엇을 보는지 짚어요. 복와위 중 갑자기 떨어지면 튜브 위치와 막힘이 가장 먼저 의심돼요.', with the vent, '먼저 튜브가 빠졌는지, 새는지 복와위 상태에서 확인할게요.', '먼저 튜브가 빠졌는지, 막혔는지 침상 옆에서 확인할게요.', prone, upright, standing, sitting]
  - [산소 올리기, siren, '''and''로 두 행동을 한 문장에 묶으면 산소를 올리는 동시에 도움을 부른다는 뜻이 전해져요. 100퍼센트 산소는 원인을 찾는 동안 시간을 벌어 줘요.', in the ICU, 산소포화도를 100퍼센트로 올리고 도움을 요청할게요., 혈압을 100으로 올리고 도움을 요청할게요., FiO2, humidity, volume, speed]
  - [전환 준비, redo, '''If we can''t fix it''은 해결이 안 될 때만 다음 단계로 간다는 조건이에요. ''emergently''는 지체 없이라는 뜻이에요.', at the vent, 소리가 안 들리면 응급으로 앙와위 전환을 준비해요., 손이 안 닿으면 응급으로 앙와위 전환을 준비해요., fix, find, feel, hear]
  - [백 환기, stetho, '''while''로 두 사람이 동시에 일한다는 뜻을 전해요. 한 명은 환기를 이어 가고 다른 한 명은 기기를 살펴요.', from the wall, 모니터를 확인하는 동안 백으로 환기할게요., 카트를 확인하는 동안 백으로 환기할게요., vent, chart, cart, bed]
  - [원인 추정, magnify, '''so''가 빠른 하락에서 갑작스러운 변화라는 추론으로 이어 줘요. 갑자기 떨어진 수치는 튜브나 기기에 생긴 문제를 먼저 의심하게 해요.', in the room, 체온이 빠르게 떨어졌으니 갑자기 뭔가 바뀐 거예요., 혈압이 빠르게 떨어졌으니 갑자기 뭔가 바뀐 거예요., suddenly, slowly, quietly, gently]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 급성 산소포화도 저하 대응 4문장 순서
    why: 갑자기 떨어졌다는 사실로 시작해 산소를 올리고 도움을 부른 뒤, 튜브를 확인하고, 그래도 해결이 안 되면 전환을 준비해요.
    lines:
    - ['His sats dropped fast, so something changed suddenly.', magnify, 산소포화도가 빠르게 떨어졌으니 갑자기 뭔가 바뀐 거예요, 상황]
    - [I'll increase his FiO2 to 100 percent and call for help., siren, FiO2를 100퍼센트로 올리고 도움을 요청할게요, 조치]
    - ['Right after that, check the tube for displacement or obstruction while he''s prone.', magnify, '그 직후 복와위 상태에서 튜브가 빠졌는지, 막혔는지 확인해요', 점검]
    - ['If we can''t fix it, we prepare to turn him supine emergently.', redo, 해결이 안 되면 응급으로 앙와위 전환을 준비해요, 전환]
- title: 복와위 중 심정지 긴급 앙와위 전환
  s:
  - [코드 호출, siren, '명령형 두 동사를 and로 이어 한 번에 두 지시를 주고, ''so we can''으로 이유를 바로 붙여요. 심정지에서는 앙와위여야 가슴 압박이 효과가 있어요.', at the head, 코드를 부르고 앙와위로 뒤집어서 흉부 압박 시간을 잴게요., 코드를 부르고 앙와위로 뒤집어서 흉부 압박 기록을 시작할게요., compressions, injections, transfusions, measurements]
  - [보호 지시, shield, '''as we turn him fast''로 빠른 전환 중에도 보호할 것을 함께 말해요. 서두르다 기도와 라인이 빠지면 안 돼요.', on the bed, 빠르게 돌리는 동안 기도와 모니터를 보호할게요., 빠르게 돌리는 동안 기도와 베개를 보호할게요., airway, pillow, blanket, chart]
  - [즉시 시행, siren, '''the instant''는 눕는 바로 그 순간이라는 뜻이에요. 미루는 시간이 없다는 점을 명령형으로 강하게 전해요.', by the bed, 등을 대고 눕는 순간 바로 심폐소생술 시간을 잴게요., 등을 대고 눕는 순간 바로 심폐소생술 기록을 시작할게요., CPR, ECG, EEG, MRI]
  - [물품 요청, speech, '''Someone''은 지목하지 않고 아무나 하라는 급한 요청이에요. ''now''가 즉시라는 뜻이에요.', for the team, 누가 지금 기도 카트를 가져와 주세요., 누가 지금 백보드를 가져와 주세요., cart, chart, card, book]
  - [지연 금지, siren, '''We don''t wait''로 시작해 지체하지 않겠다는 뜻을 먼저 말하고 대시 뒤에 시작 시점을 알려요. ''the second''는 즉시라는 뜻이에요.', on the floor, '기다리지 않고, 평평하게 눕는 순간 압박 시간을 재요.', '기다리지 않고, 평평하게 눕는 순간 압박 기록을 시작해요.', wait, talk, sit, text]
  order:
    tag: 대화 흐름
