- title: 복와위 중 우발적 발관
  s:
  - [발관 인지, siren, 대시 앞에서 상황을 짧게 말하고 뒤에 바로 행동을 이어요. 'immediately'는 기도를 확보하러 지체 없이 돌린다는 뜻이에요., in the bed, 튜브가 막혔어요 — 바로 앙와위로 돌려서 기도를 관리할게요., 튜브가 꼬였어요 — 바로 앙와위로 돌려서 기도를 관리할게요., out, blocked, kinked, loose]
  - [환기 시작, stetho, '''with 100 percent oxygen''은 산소 농도를 함께 말해 팀이 같은 지시를 따르게 해요. 튜브가 빠진 환자는 먼저 마스크로 환기를 이어 가요.', for the team, 100퍼센트 산소로 백마스크 환기 시간을 잴게요., 100퍼센트 산소로 백마스크 환기 기록을 시작할게요., ventilation, suction, irrigation, dialysis]
  - [호출 지시, speech, '''and''로 호출과 물품 준비를 한 문장에 묶고 ''now''로 급함을 전해요. 다시 삽관하려면 기도팀과 장비가 필요해요.', for him, 기도팀을 부르고 지금 흡인 카트를 가져오세요., 기도팀을 부르고 지금 응급 카트를 가져오세요., cart, stool, table, shelf]
  - [윤상연골 압박, me, '''while I set up''은 내가 준비하는 사이 다른 사람이 맡아 달라는 역할 분담이에요. ''Someone''은 지목하지 않는 급한 요청이에요.', on the monitor, 제가 준비하는 동안 누가 흡인기를 잡아 주세요., 제가 준비하는 동안 누가 환자 손을 잡아 주세요., cricoid, wrist, ankle, foot]
  - [위치 확인, check, '''Once he''s reintubated''로 확인이 삽관 뒤에 온다는 시점을 말하고 ''with''로 방법을 밝혀요. 호기말이산화탄소는 튜브가 기도에 있는지 보여 줘요.', on the screen, 재삽관하면 호기말이산화탄소 감시로 고정 상태를 확인할게요., 재삽관하면 마노미터로 커프 압력을 확인할게요., placement, allergies, height, age]
