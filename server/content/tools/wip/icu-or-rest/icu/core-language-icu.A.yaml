    why: acknowledge는 그런 믿음이 있다는 걸 인정하는 정도, respect는 그 믿음을 가볍게 보지 않고 이해하려는 태도, honor는 실제로 반영해 지켜 준다는 무게가 있어요. 간호사 혼자 지킬 수 없는 약속은 하지 않고, respect로 이해하려는 마음을 먼저 보여요.
