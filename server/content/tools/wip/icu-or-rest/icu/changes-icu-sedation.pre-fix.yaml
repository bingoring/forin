theme: icu-sedation
changes:
- kind: word
  id: w-light
  fields:
  - ko
  why: ko '가벼운/얕은'의 '얕은'이 w-shallow '얕은'과 겹쳐 듣고 뜻 고르기에서 정답이 둘이 된다 — light는 '가벼운'으로 가름
- kind: word
  id: w-sustain
  fields:
  - ko
  why: ko '유지하다'가 w-hold·w-keep과 같아 정답이 셋이 된다 — sustain은 '지속하다'로 가름
- kind: word
  id: w-hold
  fields:
  - ko
  why: ko '유지하다'가 w-sustain·w-keep과 같다 — hold(속도·목표를 지키다)는 '고수하다'로 가름
- kind: word
  id: w-target
  fields:
  - ko
  why: ko '목표'가 w-goal과 같아 정답이 둘이 된다 — target은 '목표치'로 가름
- kind: word
  id: w-check
  fields:
  - ko
  why: ko '확인하다'가 w-confirm과 같아 정답이 둘이 된다 — check는 '점검하다'로 가름
- kind: word
  id: w-pause
  fields:
  - ko
  why: ko '멈추다'가 w-stop과 같아 정답이 둘이 된다 — pause는 '잠시 멈추다'로 가름
- kind: word
  id: w-stop
  fields:
  - ko
  why: ko '멈추다'가 w-pause와 같아 정답이 둘이 된다 — stop은 '중단하다'로 가름
- kind: word
  id: w-rise
  fields:
  - ko
  why: ko '오르다'가 w-climb과 같아 정답이 둘이 된다 — rise는 '올라가다'로 가름
- kind: word
  id: w-adequate
  fields:
  - ko
  why: ko '충분한'이 w-enough와 같아 정답이 둘이 된다 — adequate는 '적절한'으로 가름
- kind: word
  id: w-drip
  fields:
  - ko
  why: ko '(정맥) 주입'이 w-infusion '주입'과 거의 같다 — drip은 '점적 주입'으로 가름
- kind: word
  id: w-settle
  fields:
  - ko
  why: ko '안정되다'가 w-stable '안정적인'과 겹친다 — settle(들뜬 것이 가라앉다)은 '가라앉다'로 가름
- kind: word
  id: w-put
  fields:
  - ko
  why: ko '놓다/두다'는 'puts him at minus two'(점수에 해당시키다) 뜻을 못 담는다
- kind: word
  id: w-open
  fields:
  - ko
  why: ko '뜨다'는 'Open the airway'(기도를 열다) 문장을 못 담는다
- kind: word
  id: w-multimodal
  fields:
  - ko
  why: ko '다약제의/다중양식의'가 어색하고 뜻이 흐리다 — '다중 방식의'
- kind: word
  id: w-awareness
  fields:
  - ko
  why: ko '의식/각성 인지'가 w-awakening '각성'과 겹친다 — awareness는 '의식 인지'로 가름
- kind: word
  id: w-stay
  fields:
  - ko
  why: ko '머무르다/유지되다'의 '유지되다'가 w-keep·w-hold와 겹친다 — '머무르다'로
- kind: word
  id: w-need
  fields:
  - ko
  why: 문장 대부분(We need to…, if needed)이 동사 쓰임이라 ko '필요'를 '필요하다'로
- kind: word
  id: w-climb
  fields:
  - ko
  why: ko '오르다'가 w-rise와 같아 정답이 둘이 된다 — climb은 '서서히 오르다'로 가름
