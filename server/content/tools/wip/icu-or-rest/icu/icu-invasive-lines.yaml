    exKo: 계속 기포가 나서 연결부를 전부 확인할게요.
  - kind: context
    words:
    - w-leak
    word: leak
    ko: 새는 곳
    scenes:
    - who: 의사에게 보고
      icon: stetho
      en: There's a continuous air leak in the water seal chamber.
      ok: true
    - who: 동료 간호사
      icon: handshake2
      en: Can you hold the tubing while I check the connections for a leak?
      ok: true
    - who: 환자에게
      icon: me
      en: You have a continuous air leak with a possible fistula.
      ok: false
      fix: There's a spot where air is escaping, so I'm checking the connections and I'll tell the doctor.
    why: 의료진끼리는 air leak이 짧고 정확해요. 환자에게 fistula 같은 가능성까지 던지면 확인되지 않은 말이 겁만 줘요. 지금 하는 점검과 의사에게 알릴 것을 말해요.
  order:
    tag: 대화 흐름
    icon: compass
    ko: 흉관 기포 감시 4문장 순서
    why: 기포가 호흡 때문이 아니라는 판단이 먼저, 이어 연결부를 확인하고, 튜빙을 따라가며 찾고, 그래도 계속되면 선생님께 알려요.
    lines:
    - en: This much bubbling isn't from him breathing — it's a leak.
      icon: speech
      ko: 이 정도 기포는 호흡 때문이 아니에요, 새는 거예요
      note: 판단
    - en: To find it, I'll check all connections before assuming it's the patient.
      icon: magnify
      ko: 찾으려고 환자 쪽이라 단정하기 전에 연결부를 다 볼게요
      note: 점검
    - en: Once the connections are tight, I'll trace the tubing from the chest wall to the canister.
      icon: magnify
      ko: 연결부가 조여지면 흉벽부터 배액통까지 튜빙을 따라갈게요
      note: 추적
    - en: If it still bubbles after that, I'll call the physician.
      icon: bell
      ko: 그래도 기포가 나면 의사를 부를게요
      note: 보고
- title: 흉관 파동·개통 확인
  sentences:
