    decoy: "fall precautions"
    dk: ["격리주의 병실에서는 청진기와 혈압계를 환자 전용으로 써요", "배양 검체는 콧속을 면봉으로 문질러서 떼어 검사실로 보내요"]
    blank: {answer: isolation, options: [isolation, fall, aspiration, seizure]}
