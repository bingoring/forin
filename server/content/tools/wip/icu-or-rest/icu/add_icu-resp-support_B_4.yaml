  order:
    tag: 대화 흐름
    icon: compass
    ko: 대량 각혈 환자에게 대응하는 4문장 순서
    why: 체위로 좋은 폐를 보호하고, 그 상태에서 흡인과 산소를 하고, 그래도 응급 기도 상황임을 알려 의사를 부르고, 그 호출에서 응급 기도 확보를 요청해요.
    lines:
    - {en: "Position him with the bleeding lung down to protect the good lung.", icon: shield, ko: "좋은 쪽 폐를 보호하도록 출혈하는 폐를 아래로 체위를 잡아요", note: 체위}
    - {en: "With him positioned like that, suction aggressively and give high-flow oxygen.", icon: gear, ko: "그 체위에서 적극적으로 흡인하고 고유량 산소를 줘요", note: 처치}
    - {en: "Even with that suction and oxygen, this is an emergent airway situation, so I'm notifying the physician now.", icon: bell, ko: "그 흡인과 산소에도 응급 기도 상황이라 지금 의사에게 알리고 있어요", note: 알림}
    - {en: "On that call, ask for emergent airway control.", icon: bell, ko: "그 호출에서 응급 기도 확보를 요청해요", note: 요청}
