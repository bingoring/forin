situations:
- title: 뇌부종 위험 감시
  s:
  - ["신경 감시", magnify, "'closely'는 한 번 보고 끝내지 않고 계속 살핀다는 뜻이에요. 신경학적 검진과 동공은 뇌압 변화를 가장 먼저 보여 줘요.", "to watch", "신경학적 검진과 동공을 자세히 기록합시다.", "신경학적 검진과 동공을 자세히 공유합시다.", "neuro", "skin", "dental", "foot"]
  - ["두부 거상", baby, "'Keep'은 계속 유지하라는 지시고 'avoid'는 하지 말 것을 말해 한 문장에 두 가지가 담겨요. 머리를 높이면 뇌압이 낮게 유지돼요.", "be sure", "머리를 높이고 시트를 매끈하게 펴세요.", "머리를 높이고 베개 커버를 교체하세요.", "elevated", "covered", "wrapped", "dry"]
  - ["악화 시 알림", bell, "'if'로 알릴 기준을 정해 두면 팀이 어떤 변화에 반응해야 하는지 같은 그림을 가져요. 'alert'는 즉시 알린다는 뜻이에요.", "so that", "정신 상태가 악화되면 팀에 설명할게요.", "정신 상태가 악화되면 팀에 메모할게요.", "alert", "thank", "join", "praise"]
  - ["동공 보고", magnify, "'compared to the left'로 비교 대상을 말하면 좌우 차이가 분명히 전달돼요. 'a little'로 정도를 줄여 말해도 변화는 변화예요.", "than the", "오른쪽 동공이 왼쪽에 비해 조금 커 보여요.", "오른쪽 귀가 왼쪽에 비해 조금 둔해 보여요.", "pupil", "eyelid", "eyebrow", "cheek"]
  - ["자세 유지", baby, "각도를 숫자로 말하면 팀이 같은 높이로 맞춰요. 'tight neck lines'는 목 정맥 흐름을 막을 수 있어서 피해요.", "at the", "머리를 30도로 유지하고 침상 옆 조명을 낮출게요.", "머리를 30도로 유지하고 라인 삽입 날짜를 적을게요.", "neck", "wrist", "ankle", "hip"]
  - ["즉시 보고", siren, "'before this becomes'는 커지기 전에 움직이겠다는 선제 보고예요. 'now'는 지금 바로라는 뜻이에요.", "as soon", "더 큰 문제가 되기 전에 지금 상황을 기록할게요.", "더 큰 문제가 되기 전에 지금 상황을 설명할게요.", "bigger", "longer", "newer", "older"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 뇌부종 감시 4문장 순서
    why: 동공 변화를 먼저 알리고 바로 보고한 뒤, 머리 높이 같은 보호 조치를 이어 가고, 그 모든 과정에서 신경 감시를 계속해요.
    lines:
    - ["His right pupil looks a little sluggish compared to the left.", magnify, "오른쪽 동공이 왼쪽에 비해 조금 둔해 보여요", "관찰"]
    - ["I'm escalating now before this becomes a bigger problem.", siren, "더 큰 문제가 되기 전에 지금 에스컬레이션할게요", "보고"]
    - ["Alongside that, let's keep his head elevated and avoid spikes in pressure.", baby, "그와 함께 머리를 높이고 압력이 치솟는 걸 피합시다", "보호"]
    - ["Through all of it, let's watch his neuro exam and pupils closely.", monitor, "그 모든 과정에서 신경학적 검진과 동공을 자세히 지켜봅시다", "감시"]
- title: 간신증후군 감시
  s:
  - ["추세 추적", chartup, "'trend'는 한 번의 수치가 아니라 변화의 방향을 본다는 뜻이에요. 소변량과 크레아티닌은 신장 기능을 함께 보여 줘요.", "to track", "소변량과 크레아티닌 추세를 기록합시다.", "소변량과 크레아티닌 추세를 공유합시다.", "creatinine", "cholesterol", "calcium", "copper"]
  - ["치료 예고", pill, "'may'로 필요할 수도 있다고 말해서 미리 알리되 확정처럼 들리지 않게 해요.", "might have", "알부민과 특정 검사가 필요할 수도 있어요.", "수혈과 특정 약물이 필요할 수도 있어요.", "albumin", "plasma", "saline", "platelets"]
  - ["의사 보고", pager, "'about the falling output'은 보고 내용을 한 구로 요약해요. 배출량 감소는 신장 상태가 변했다는 대표 신호예요.", "of the", "배출량이 떨어지는 것에 대해 의사에게 설명할게요.", "배출량이 떨어지는 것에 대해 의사에게 메모할게요.", "falling", "rising", "normal", "daily"]
  - ["상태 설명", stetho, "'despite'는 수액으로 나아지지 않았다는 점을 한 단어로 보여 줘요. 수액에 반응하지 않는다는 것이 간신증후군 의심의 단서예요.", "even with", "수액을 줬는데도 간이 멈춰 가고 있어요.", "약을 줬는데도 신장이 멈춰 가고 있어요.", "despite", "because of", "thanks to", "instead of"]
  - ["진단 설명", lab, "'if other causes are ruled out'은 먼저 다른 원인을 찾아 배제해야 한다는 뜻이에요. 간신증후군은 그렇게 남는 진단이에요.", "when other", "다른 증상이 배제되면 간신증후군일 수 있어요.", "다른 원인이 배제되면 간성뇌증일 수 있어요.", "hepatorenal", "nephrotic", "serotonin", "metabolic"]
  - ["알부민 투여", pill, "'challenge'는 반응을 보려고 시험적으로 주는 투여를 뜻해요. 반응을 보는 것까지 한 문장에 묶어 두 단계를 함께 말해요.", "to give", "알부민 시험적 투여를 하고 남은 병은 폐기합시다.", "알부민 시험적 투여를 하고 사용 기록지를 모읍시다.", "albumin", "plasma", "vitamin", "protein"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 간신증후군 대응 4문장 순서
    why: 신장이 반응하지 않는 상황을 알리고 진단 가능성을 설명한 뒤, 시험적 투여로 반응을 보며, 그 모든 내용을 의사에게 알려요.
    lines:
    - ["His kidneys are shutting down despite the fluids we've given.", stetho, "수액을 줬는데도 신장이 멈춰 가고 있어요", "상황"]
    - ["This can be hepatorenal syndrome if other causes are ruled out.", lab, "다른 원인이 배제되면 간신증후군일 수 있어요", "진단"]
    - ["To test that, let's give the albumin challenge and see if his output responds.", pill, "그걸 확인하려고 알부민 시험적 투여를 하고 배출량이 반응하는지 봅시다", "시험"]
    - ["I'll notify the physician about all of that now.", pager, "그 모든 것에 대해 지금 의사에게 알릴게요", "보고"]
- title: 이식 평가 연계
  s:
  - ["평가 안내", hospital, "'whether he's a candidate'는 아직 결정이 아니라 평가 중이라는 점을 정직하게 말해요. 이식팀이 대상 여부를 판단해요.", "if he is", "투석팀이 그가 대상자인지 평가할 거예요.", "영양팀이 그가 대상자인지 평가할 거예요.", "candidate", "donor", "visitor", "volunteer"]
  - ["점수 설명", chartup, "'helps decide'는 점수 하나가 결정하는 게 아니라 판단에 도움을 준다는 뜻이에요. 점수가 높을수록 더 급해요.", "to decide", "중증도 점수가 비용을 결정하는 데 도움이 돼요.", "통증 점수가 시급성을 결정하는 데 도움이 돼요.", "urgency", "cost", "color", "weight"]
  - ["연결 제안", handshake2, "'I'll help connect you with'는 간호사가 길을 열어 주겠다는 말이라 가족이 혼자가 아니라고 느껴요.", "to meet", "사회복지사와 연결되도록 도와드릴게요.", "영양사와 연결되도록 도와드릴게요.", "coordinator", "pharmacist", "janitor", "driver"]
  - ["기대 조절", shield, "'doesn't mean'으로 흔한 오해를 먼저 바로잡아요. 등록 후에도 맞는 장기가 나와야 이식이 가능해요.", "does not", "등록됐다고 해서 바로 퇴원하는 건 아니에요.", "등록됐다고 해서 바로 이식팀을 만나는 건 아니에요.", "organ", "visit", "bill", "rest"]
  - ["평가 항목", board, "항목을 쉼표로 나열하면 평가가 어떤 부분으로 이뤄지는지 한눈에 들려요. 'psychosocial'은 마음과 사회적 지지를 함께 보는 면담이에요.", "as well", "평가에는 검사, 영상 검사, 외과 수술이 포함돼요.", "평가에는 검사, 투약, 심리사회적 면담이 포함돼요.", "imaging", "surgery", "dialysis", "discharge"]
  - ["질문 환영", speech, "'as the process moves forward'는 한 번이 아니라 과정 내내라는 약속이에요. 가족이 질문해도 된다는 신호예요.", "after the", "과정이 진행되는 동안 질문을 기록해 드릴게요.", "과정이 진행되는 동안 질문을 모아 드릴게요.", "process", "line", "meeting", "trip"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이식 평가 안내 4문장 순서
    why: 이식팀이 평가한다고 알리고 평가 내용을 설명한 뒤, 등록이 곧 이식은 아니라는 점을 바로잡고 질문을 환영하며 마무리해요.
    lines:
    - ["The transplant team will evaluate whether he's a candidate.", hospital, "이식팀이 그가 대상자인지 평가할 거예요", "평가"]
    - ["That evaluation includes tests, imaging, and a psychosocial interview.", board, "그 평가에는 검사, 영상 검사, 심리사회적 면담이 포함돼요", "항목"]
    - ["After that evaluation, being listed doesn't mean he'll get an organ right away.", shield, "그 평가 뒤에도 등록됐다고 바로 장기를 받는 건 아니에요", "안내"]
    - ["Through every step of that, we'll answer your questions.", speech, "그 모든 단계에서 질문에 답해 드릴게요", "약속"]
