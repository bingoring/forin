word_fields:
  w-call:
    set:
      example: "I'm calling the provider now because this infection can't wait."
      exKo: "이 감염은 못 기다리니 지금 주치의를 부를게요."
    change: [example]
    why: "4.4의 'call this a stage-one injury'는 판정하다라 헤드워드 ko(부르다)와 안 맞아 15.4 문장으로 예문을 바꿈"
  w-bleed:
    set: {distractorsEn: [breeding, blending], decoyChips: [breed]}
  w-ease:
