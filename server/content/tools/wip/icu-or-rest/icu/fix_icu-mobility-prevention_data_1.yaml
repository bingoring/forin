why:
  "8.2": "'that keeps'로 드레싱을 고르는 기준을 한 줄에 말해요. 촉촉한 환경은 상처가 아무는 데 도움이 돼요. 드레싱 종류는 병원 상처 간호 프로토콜·처방 안에서 골라요."
  "10.1": "'With his bleeding risk'로 판단의 근거를 문장 앞에 놓아요. 출혈 위험이 있으면 항응고 계열 약물은 보류하는 것이 일반적이에요. 금기 판단은 처방자가 해요."
  "10.2": "'instead'는 앞서 막힌 방법 대신 쓸 방법을 말할 때 붙여요. 약물을 못 쓰면 기계적 예방이 남아요. 기계적 예방도 처방자와 정한 계획 안에서 해요."
  "10.5": "'Once'는 조건이 풀리는 순간부터라는 뜻이고 'back'은 이전 상태로 돌린다는 뜻이에요. 위험이 줄면 약물 예방을 다시 쓸 수 있어요. 재개는 처방자가 정해요."
  "16.2": "명령형 'Get'과 'increase'로 두 지시를 짧게 이어요. 위급할 때는 지시가 짧을수록 팀이 바로 움직여요. 산소는 처방·프로토콜 범위 안에서 올려요."
  "18.2": "'giving'과 'calling'을 'and'로 이으면 두 가지를 동시에 한다는 말이에요. 신속대응팀은 ICU 밖 병동의 체계이고, ICU 안에서는 보통 담당의를 불러요."
  "19.1": "대시 앞뒤로 상황과 행동을 나눠요. 'holding firm pressure'로 빠진 자리를 단단히 눌러 출혈을 막고 있다고 알려요. 이어서 빠진 자리에 공기가 들어가지 않게 밀폐 드레싱을 대요."
  "20.3": "'together'로 함께 간다는 동행의 뜻을 전해요. 목표가 치유에서 편안함과 존엄으로 옮겨 갈 때 쓰는 말이에요. 목표 전환은 담당의·가족과 함께 정해요."
nuance:
  "0.0":
    why: "VTE 고위험이고 금기가 없으면 약물 예방은 처방대로 쓰고, 병원 지침에 따라 압박기기 같은 기계적 예방을 함께 쓰는 경우가 많아요. 시작 전에 금기를 먼저 확인해요."
  "18.0":
    why: "저산소가 심할 때는 낮은 유량의 코삽입관만으로 부족해서 비재호흡마스크처럼 고농도 산소를 처방과 프로토콜에 따라 줘요. 동시에 주치의에게 알려요. 삽관은 의사가 판단해요."
  "2.1":
    scene_en: {2: "We offload your son's sacral pressure point every two hours to redistribute pressure and reduce shear."}
  "3.0":
    cue: "Colleague: \"She passed the mobility screen today, but she hasn't been out of bed yet. What's her first step out of bed?\""
    scale: ["sit at the bed edge", "stand at the bedside", "walk down the hall"]
    answerAt: 0
  "3.1":
    before: {2: " and blood pressure look steady enough for you to sit up."}
  "6.1":
    notes: {ambulate: "걷게 한다는 임상어라 가족에게 낯설고, 지금 하는 일보다 좁은 뜻이에요."}
  "9.0":
    scale: ["leave it alone", "pad and move it", "call the wound team"]
    answerAt: 1
    why: "분홍빛만 돈다면 쿠션을 대고 위치를 옮기면 충분해요. 그냥 두면 손상으로 진행할 수 있고, 상처팀은 피부가 상했을 때 불러요."
  "10.1":
    word: contraindicated
  "16.0":
    why: "일어서자마자 산소포화도가 떨어지면 활동을 멈추고 앉히거나 눕히고, 처방·프로토콜 범위 안에서 산소를 올려요. 계속 지켜보기만 하면 늦고, 맥박이 있는 환자에게 CPR을 시작하는 건 맞지 않아요."
  "19.0":
    why: "중심정맥관이 빠져 출혈이 있으면 거즈를 대고 세게 직접 압박해요. 가벼운 거즈만으로는 부족하고, 목이나 가슴 쪽 관에 지혈대를 쓰는 건 맞지 않아요. 빠진 자리에는 공기가 들어가지 않게 밀폐 드레싱을 대요. 이어서 주치의에게 알려요."
  "20.0":
    words: [w-comfort, w-honest, w-wound]
    why: "honest conversation은 상태를 솔직하게 나누는 대화예요. comfort measures는 편안함을 돕는 처치를 가리키고, 치료 방향을 정하는 말이라 담당의·가족이 함께 정한 뒤에 써요. wound dressing은 상처에 덮는 드레싱이에요."
