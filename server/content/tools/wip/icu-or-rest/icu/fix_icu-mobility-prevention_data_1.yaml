sentences:
  "6.6":
    fields: [en, ko, chunks, words]
    why: "I told him … 문장이 알람을 '응급 아님'으로 단정해 잘못된 안심이라 알람이 울리면 바로 확인하겠다는 말로 바꿈(A 검토)"
    set:
      en: "I told him that if the vent alarms during this move, we'll check it right away."
      ko: "이동 중에 인공호흡기 알람이 울리면 바로 확인하겠다고 말했어요."
      chunks: ["I told him", "that if the vent alarms", "during this move", ", we'll check it", "right away", "."]
      words: [w-tell, w-vent]
      why: "'if … we'll check it right away'로 알람이 울리면 원인을 바로 본다고 미리 알려요. '괜찮다'고 단정하지 않고 확인하겠다고 해야 안심도 되고 안전도 지켜요."
      dk: ["식사 중에 인공호흡기 알람이 울리면 바로 확인하겠다고 말했어요", "이동 중에 침대 알람이 울리면 바로 확인하겠다고 말했어요"]
      blank: ["move", ["move", "meal", "bath", "nap"]]
      decoy: "during this meal"
  "18.5":
    fields: [en, ko, chunks, words]
    why: "ICU 안에서는 신속대응팀이 아니라 상주 담당의를 침상으로 부름(A 검토 사실 오류)"
    set:
      en: "I called the provider to the bedside the moment his sats crashed."
      ko: "산소포화도가 급락하는 순간 주치의를 침상으로 불렀어요."
      chunks: ["I called the provider", "to the bedside", "the moment", "his sats crashed", "."]
      words: [w-call, w-provider, w-sat]
      why: "'the moment'는 알아챈 즉시라는 뜻이에요. ICU에는 담당의가 상주해서 신속대응팀이 아니라 담당의를 침상으로 바로 불러요."
      dk: ["혈압이 급락하는 순간 주치의를 침상으로 불렀어요", "맥박이 급락하는 순간 주치의를 침상으로 불렀어요"]
      decoy: "his mood shifted"
  "20.4":
    fields: [en, ko, chunks, words]
    why: "'I know this is realistic, but'은 영어가 틀려 'I know this is hard to hear, but'으로 고침(A 검토)"
    set:
      en: "I know this is hard to hear, but I want you to know we're not giving up on his comfort."
      ko: "듣기 힘든 이야기라는 걸 알지만, 편안함을 포기하지 않는다는 것도 알아주셨으면 해요."
      chunks: ["I know this is hard to hear", ", but I want you to know", "we're not giving up", "on his comfort", "."]
      words: [w-comfort]
      why: "'I know this is hard to hear'로 듣기 힘든 소식임을 먼저 인정하고 'but'으로 지지를 덧붙여요. 'not giving up on his comfort'는 돌봄을 멈추지 않는다는 말이에요."
      dk: ["듣기 힘든 이야기라는 걸 알지만, 수면을 포기하지 않는다는 것도 알아주셨으면 해요", "듣기 힘든 이야기라는 걸 알지만, 식사를 포기하지 않는다는 것도 알아주셨으면 해요"]
      blank: ["comfort", ["comfort", "hearing", "diet", "mood"]]
      decoy: "on his hygiene"
  "11.3":
    fields: [ko]
    why: "tolerance를 '내성'(약물 내성으로 읽힘)이 아니라 활동을 견디는 정도로"
    set:
      ko: "매일 그가 활동을 얼마나 견디는지 알려줄게요."
      why: "'each day'로 알려 주는 주기를 못 박아요. tolerance는 그날 환자가 활동을 견딘 정도라 매일 달라져요."
      dk: ["매일 그가 식사를 얼마나 하는지 알려줄게요", "매일 그가 잠을 얼마나 자는지 알려줄게요"]
  "13.1":
    fields: [ko]
    why: "tolerance를 '내성'이 아니라 '잘 견디는지'로"
    set:
      ko: "먼저 침대 끝에 앉히고 잘 견디는지 확인할게요."
      dk: ["먼저 침대 머리를 올리고 잘 견디는지 확인할게요", "먼저 침대 난간을 내리고 잘 견디는지 확인할게요"]
word_remove:
  w-emergency: "6.6 문장을 바꿔 어느 문장도 태그하지 않게 됨(상황 6은 단어가 충분)"
