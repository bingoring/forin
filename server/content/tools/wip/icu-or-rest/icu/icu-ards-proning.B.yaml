situations:
- title: ARDS 산소화 지표 이해
  sentences:
  - en: That ratio tells us how well his lungs are moving oxygen into his blood.
    ko: 그 비율은 폐가 혈액으로 산소를 얼마나 잘 보내는지 알려줘요.
    chunks:
    - That ratio
    - tells us
    - how well his lungs
    - are moving oxygen
    - into his blood
    - .
    words:
    - w-ratio
    - w-tell
    - w-lung
    - w-move
    - w-oxygen
    - w-blood
    goal: 1
    tag: 수치 설명
    icon: chartup
    why: '''how well''로 정도를 묻는 간접 의문문을 쓰면 숫자 하나가 폐의 산소 전달 능력을 말해 준다는 점이 가족에게도 쉽게 들려요.'
    decoy: from his kidneys
    distractorsKo:
    - 그 비율은 폐가 혈액으로 이산화탄소를 얼마나 잘 보내는지 알려줘요.
    - 그 비율은 심장이 혈액으로 산소를 얼마나 잘 보내는지 알려줘요.
    blank:
      answer: oxygen
      options:
      - en: oxygen
      - en: fluid
      - en: medicine
      - en: sugar
  - en: A lower number means his lung injury is more severe right now.
    ko: 숫자가 낮을수록 지금 폐 손상이 더 심하다는 뜻이에요.
    chunks:
    - A lower number
    - means
    - his lung injury
    - is more severe
    - right now
    - .
    words:
    - w-lower
    - w-number
    - w-mean
    - w-lung
    - w-injury
    - w-severe
    - w-now
    goal: 1
    tag: 수치 해석
    icon: monitor
    why: '''A lower number means…''는 숫자의 방향과 의미를 한 문장에 묶어요. ''right now''를 붙이면 지금 상태라는 점이 분명해 가족이 영구적 판정으로 오해하지 않아요.'
    decoy: in his kidneys
    distractorsKo:
    - 숫자가 낮을수록 지금 신장 손상이 더 심하다는 뜻이에요.
    - 숫자가 낮을수록 어제 폐 손상이 더 심했다는 뜻이에요.
    blank:
      answer: severe
      options:
      - en: severe
      - en: mild
      - en: recent
      - en: common
  - en: We track it to see whether his lungs are improving.
    ko: 폐가 좋아지고 있는지 보려고 이 수치를 계속 지켜봐요.
    chunks:
    - We track it
    - to see
    - whether his lungs
    - are improving
    - .
    words:
    - w-track
    - w-see
    - w-lung
    - w-improve
    goal: 2
    tag: 추적 이유
    icon: magnify
    why: '''to see whether…''로 목적을 먼저 밝히면 수치를 계속 보는 이유가 불안이 아니라 회복 확인이라는 인상을 줘요.'
    decoy: twice a day
    distractorsKo:
    - 폐가 좋아지고 있는지 보려고 이 수치를 계속 알려드려요.
    - 간이 좋아지고 있는지 보려고 이 수치를 계속 지켜봐요.
    blank:
      answer: lungs
      options:
      - en: lungs
      - en: kidneys
      - en: veins
      - en: bones
  - en: It compares the oxygen in his blood to the oxygen he's breathing in.
    ko: 혈액 속 산소와 들이마시는 산소를 비교하는 거예요.
    chunks:
    - It compares
    - the oxygen in his blood
    - to the oxygen
    - he's breathing in
    - .
    words:
    - w-compare
    - w-oxygen
    - w-blood
    - w-breathe
    goal: 1
    tag: 비교 설명
    icon: compass
    why: '''compares A to B''로 두 값을 나란히 놓으면 비율이 무엇을 비교하는지 쉽게 그려져요.'
    decoy: in the room air
    distractorsKo:
    - 혈액 속 당과 들이마시는 산소를 비교하는 거예요.
    - 소변 속 산소와 들이마시는 산소를 비교하는 거예요.
    blank:
      answer: blood
      options:
      - en: blood
      - en: urine
      - en: saliva
      - en: skin
  - en: I'll explain what each new number means as we go.
    ko: 새 수치가 나올 때마다 무슨 뜻인지 설명해 드릴게요.
    chunks:
    - I'll explain
    - what each new number
    - means
    - as we go
    - .
    words:
    - w-explain
    - w-each
    - w-new
    - w-number
    - w-mean
    - w-go
    goal: 2
    tag: 소통 약속
    icon: speech
    why: '''as we go''는 수치가 나올 때마다 곧바로 설명하겠다는 약속이에요. 가족이 숫자 앞에서 혼자 남지 않게 해요.'
    decoy: to your family
    distractorsKo:
    - 새 수치가 나올 때마다 무슨 뜻인지 메모해 드릴게요.
    - 새 사진이 나올 때마다 무슨 뜻인지 설명해 드릴게요.
    blank:
      answer: means
      options:
      - en: means
      - en: costs
      - en: weighs
      - en: hides
  order:
    tag: 대화 흐름
    icon: compass
    ko: 산소화 지표 설명 4문장 순서
    why: 숫자가 무엇인지 먼저 소개하고, 무엇을 비교하는지 풀어 준 뒤, 낮을 때의 의미를 알려요. 마지막에 그래서 계속 지켜본다고 이어요.
    lines:
    - en: That number shows how well his lungs move oxygen.
      icon: chartup
      ko: 그 숫자는 폐가 산소를 얼마나 잘 보내는지 보여줘요
      note: 소개
    - en: It compares the oxygen in his blood to what he breathes in.
      icon: compass
      ko: 혈액 속 산소와 들이마시는 산소를 비교해요
      note: 비교
    - en: When that comparison comes out lower, the injury is more severe.
      icon: monitor
      ko: 그 비교 결과가 낮으면 손상이 더 심해요
      note: 의미
    - en: That is why we keep watching it as new results come in.
      icon: magnify
      ko: 그래서 새 결과가 나올 때마다 계속 지켜봐요
      note: 추적
- title: 저 TV 폐보호 환기 유지
  sentences:
  - en: His tidal volume is set to 6 milliliters per kilo of ideal body weight.
    ko: 일회 호흡량은 표준 체중 킬로그램당 6밀리리터로 맞춰져 있어요.
    chunks:
    - His tidal volume
    - is set to
    - 6 milliliters per kilo
    - of ideal body weight
    - .
    words:
    - w-tidal-volume
    - w-set
    - w-milliliter
    - w-kilo
    - w-ideal-body-weight
    goal: 1
    tag: 설정 안내
    icon: gear
    why: '''is set to''로 지금 맞춰진 값임을 알리면 의료진끼리 설정을 말로 대조할 때 헷갈리지 않아요. ''ideal body weight''는 키와 성별로 계산한 기준 체중이에요.'
    decoy: with the bed
    distractorsKo:
    - 일회 호흡량은 어제 표준 체중 킬로그램당 6밀리리터로 맞춰졌어요.
    - 일회 호흡량은 아침에 표준 체중 킬로그램당 6밀리리터로 맞춰졌어요.
    blank:
      answer: ideal
      options:
      - en: ideal
      - en: actual
      - en: total
      - en: average
  - en: Keeping the driving pressure low protects his injured lungs.
    ko: 구동압을 낮게 유지하면 손상된 폐를 보호할 수 있어요.
    chunks:
    - Keeping
    - the driving pressure low
    - protects
    - his injured lungs
    - .
    words:
    - w-keep
    - w-driving-pressure
    - w-low
    - w-protect
    - w-injured
    - w-lung
    goal: 2
    tag: 보호 원리
    icon: shield
    why: '''protects''는 동사 하나로 이유를 알려 줘요. 낮은 구동압이 손상된 폐를 지킨다는 인과가 한 문장에 들어 있어요.'
    decoy: by hand
    distractorsKo:
    - 구동압을 낮게 유지하면 손상된 신장을 보호할 수 있어요.
    - 구동압을 낮게 유지하면 손상된 간을 보호할 수 있어요.
    blank:
      answer: lungs
      options:
      - en: lungs
      - en: liver
      - en: heart
      - en: brain
  - en: Let's confirm the plateau pressure stays under 30.
    ko: 고평부압이 30 밑으로 유지되는지 확인할게요.
    chunks:
    - Let's confirm
    - the plateau pressure
    - stays under 30
    - .
    words:
    - w-confirm
    - w-plateau-pressure
    - w-stay
    - w-under
    goal: 1
    tag: 수치 확인
    icon: check
    why: '''Let''s confirm''은 혼자가 아니라 함께 확인하자는 말투여서 동료와 값을 맞출 때 부담이 적어요. 고평부압은 흡기 말 정지 상태에서 재는 압력이에요.'
    decoy: at night
    distractorsKo:
    - 가습기 물이 30 밑으로 떨어지지 않는지 확인할게요.
    - 수액 속도가 30 밑으로 유지되는지 확인할게요.
    blank:
      answer: plateau
      options:
      - en: plateau
      - en: venous
      - en: abdominal
      - en: ocular
  - en: I'll check the ventilator settings again before rounds.
    ko: 회진 전에 인공호흡기 설정을 다시 확인할게요.
    chunks:
    - I'll check
    - the ventilator settings
    - again
    - before rounds
    - .
    words:
    - w-check
    - w-ventilator
    - w-setting
    - w-again
    - w-before
    - w-round
    goal: 1
    tag: 설정 재확인
    icon: check
    why: '''before rounds''로 시점을 밝히면 회진 전에 설정이 맞는지 마쳐 둔다는 계획이 분명해져요.'
    decoy: with the doctor
    distractorsKo:
    - 교대 전에 인공호흡기 설정을 다시 확인할게요.
    - 회진 전에 수액 펌프 설정을 다시 확인할게요.
    blank:
      answer: rounds
      options:
      - en: rounds
      - en: lunch
      - en: dinner
      - en: visiting
  - en: Anything below 15 for driving pressure is our target.
    ko: 구동압은 15 이하가 목표예요.
    chunks:
    - Anything below 15
    - for driving pressure
    - is our
    - target
    - .
    words:
    - w-below
    - w-driving-pressure
    - w-target
    goal: 2
    tag: 목표 제시
    icon: star
    why: '''is our target''으로 끝내면 숫자가 개인 의견이 아니라 팀의 공통 목표라는 느낌을 줘요. ''below''로 상한을 알려요.'
    decoy: for the shift
    distractorsKo:
    - 병실 소음은 15 이하가 목표예요.
    - 대기 인원은 15 이하가 목표예요.
    blank:
      answer: driving
      options:
      - en: driving
      - en: plateau
      - en: mean
      - en: venous
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저 TV 환기 확인 4문장 순서
    why: 설정을 먼저 알리고, 그 설정이 폐를 지키는 이유를 말한 뒤, 확인할 압력과 목표를 정해요. 마지막에 점검 시점을 약속해요.
    lines:
    - en: His tidal volume is set to 6 milliliters per kilo of ideal body weight.
      icon: gear
      ko: 일회 호흡량은 표준 체중 킬로그램당 6밀리리터로 맞춰져 있어요
      note: 설정
    - en: Keeping the pressure low with that setting protects his injured lungs.
      icon: shield
      ko: 그 설정으로 압력을 낮게 유지하면 손상된 폐를 보호해요
      note: 이유
    - en: So let's confirm the plateau pressure stays under 30.
      icon: check
