- situation: "RASS 척도 사정"
  items:
    - kind: slider
      words: [w-sedate, w-sustain, w-light]
      cue: "Nurse: \"He opens his eyes to my voice and looks at me, but only for a few seconds.\""
      scale: [calm and alert, lightly sedated, deeply sedated]
      answerAt: 1
      why: "목소리에 눈을 뜨고 눈을 맞추지만 10초 안에 감기면 RASS -2, 가볍게 진정된 상태예요. 10초 넘게 눈을 맞추면 -1, 눈은 뜨지만 눈 맞춤이 없으면 -3, 목소리에 반응이 없고 몸을 건드려야 움직이면 -4예요."
      example: "That puts him at about a minus two, lightly sedated."
      exKo: "그럼 대략 마이너스 2, 가볍게 진정된 상태예요."
    - kind: context
      words: [w-target]
      word: target
      ko: 목표치
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "His target today is zero to minus one, so let's lighten him.", ok: true}
        - {who: 차트 기록, icon: board, en: "RASS target 0 to -1; current -3, propofol rate decreased.", ok: true}
        - {who: 보호자에게, icon: me, en: "His RASS target is zero to minus one on the Richmond scale.", ok: false, fix: "We want him sleepy but able to wake up when we talk to him."}
      why: "의료진끼리는 RASS 목표치를 숫자로 말해야 정확해요. 가족에게는 척도 이름과 숫자가 낯서니, 환자가 어떤 상태이길 바라는지를 쉬운 말로 풀어 줘요."
- situation: "프로포폴 주입 관리"
  items:
    - kind: slider
      words: [w-stable, w-drop]
      cue: "Nurse: \"His pressure is 118 over 70, the same as an hour ago.\""
      scale: [stable, dropping, crashing]
      answerAt: 0
      why: "한 시간 전과 같은 수치가 이어지면 stable이에요. 프로포폴은 혈관을 넓혀 혈압을 떨어뜨릴 수 있어서 수치 하나가 아니라 추세를 같이 봐요. 내려가는 중이면 dropping, 급하게 떨어지면 crashing이라 바로 도움을 불러요."
      example: "His blood pressure looks stable, so we can keep this rate for now."
      exKo: "혈압이 안정적이니 지금 속도를 유지해도 되겠어요."
    - kind: context
      words: [w-pump]
      word: pump
      ko: 펌프
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "The pump says twenty-five — does that match the bag?", ok: true}
        - {who: 차트 기록, icon: board, en: "Propofol 25 mcg/kg/min per pump; bag concentration verified.", ok: true}
        - {who: 보호자에게, icon: me, en: "The pump is infusing propofol at twenty-five micrograms per kilo per minute.", ok: false, fix: "That machine gives him the sleep medicine slowly and steadily."}
      why: "의료진끼리는 pump 화면의 숫자와 백의 농도를 대조해야 해서 단위까지 말해요. 가족에게는 마이크로그램 단위가 뜻 없이 들리니, 기계가 무슨 일을 하는지를 쉬운 말로 알려 줘요."
- situation: "통증 우선 평가"
  items:
    - kind: slider
      words: [w-grimace, w-pain, w-suction]
      cue: "Nurse: \"He only grimaces when I suction him, then he settles right away.\""
      scale: [at ease, hurting, in agony]
      answerAt: 1
      why: "흡인할 때만 찡그리고 곧 가라앉으면 hurting 정도예요. 말을 못 하는 환자는 표정, 움찔거림, 인공호흡기 저항 같은 행동으로 통증을 평가하고, CPOT 같은 도구를 써요. 쉬는 중에도 신음하고 심박이 오르면 in agony 쪽이에요."
      example: "He grimaces with suctioning, so pain could be the driver."
      exKo: "흡인할 때마다 얼굴을 찡그리니 통증이 원인일 수 있어요."
    - kind: context
      words: [w-pain]
      word: pain
      ko: 통증
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "I think his pain is the driver, so let's treat it first.", ok: true}
        - {who: 차트 기록, icon: board, en: "Pain with suctioning, CPOT 4; fentanyl given per order.", ok: true}
        - {who: 보호자에게, icon: me, en: "He has nociceptive pain, so we're titrating an opioid infusion.", ok: false, fix: "He hurts when we move him, so we're giving him medicine to keep him comfortable."}
      why: "의료진끼리는 통증의 종류와 약을 정확히 말해요. 가족에게는 nociceptive, titrating 같은 말이 낯설고 겁을 주니, 아프지 않게 도와 주고 있다는 점부터 말해요."
    - kind: swap
      words: [w-medicine, w-pain]
      who: "보호자에게 · 진통제 설명"
      icon: me
      before: ["We're giving him ", "an opioid", " so he isn't hurting."]
      options: [pain medicine, an opioid, a sedative]
      answer: pain medicine
      notes: {pain medicine: "가족이 알아듣기 쉽고, 약이 무엇을 위한 것인지 정확히 알려 준다.", an opioid: "정확한 약 계열 이름이지만 가족은 중독부터 떠올려 불안해할 수 있다.", a sedative: "진정제는 아픔을 없애 주지 않는다. 통증은 따로 진통제로 다룬다."}
      why: "가족에게는 약 계열 이름보다 무엇을 위한 약인지를 말해요. 진정제와 진통제는 목적이 달라서 섞어 말하면 오해가 생겨요."
      ko: 아프지 않도록 진통제를 드리고 있어요
- situation: "진정 목표 설정 이해"
  items:
    - kind: slider
      words: [w-goal, w-deep, w-target]
      cue: "Nurse: \"His goal is zero to minus one, and he's at minus four.\""
      scale: [lighter than the goal, right at the goal, deeper than the goal]
      answerAt: 2
      why: "목표가 0에서 -1인데 -4라면 목표보다 깊은 상태예요. 중환자실에서는 필요 이상으로 깊이 재우지 않는 쪽이 인공호흡 기간과 섬망 위험을 줄이는 방향이라서, 더 깊다고 더 안전한 것이 아니에요."
      example: "Deeper isn't safer here, so let's hold that target."
      exKo: "여기서는 더 깊다고 더 안전한 게 아니니 그 목표를 지켜요."
    - kind: context
      words: [w-sedation]
      word: sedation
      ko: 진정
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Let's keep his sedation light, zero to minus one.", ok: true}
        - {who: 차트 기록, icon: board, en: "Sedation goal RASS 0 to -1; current -3, rate decreased.", ok: true}
        - {who: 보호자에게, icon: me, en: "We titrate his sedation to a RASS of minus one.", ok: false, fix: "We want him calm and able to wake up when we talk to him."}
      why: "의료진끼리는 진정 목표를 RASS 숫자로 말해야 정확해요. 가족에게는 titrate나 RASS 같은 말이 뜻 없이 들리니, 어떤 모습이길 바라는지를 쉬운 말로 풀어 줘요."
- situation: "진정 중 활력·기도 감시"
  items:
    - kind: slider
      words: [w-breathe, w-saturation, w-respiratory]
      cue: "Colleague: \"His rate is sixteen, he's pinking up, and the saturation is ninety-eight.\""
      scale: [breathing well, breathing poorly, not breathing]
      answerAt: 0
      why: "호흡수 16회에 포화도 98%면 숨을 잘 쉬는 상태예요. 진정제를 쓴 환자는 호흡수가 8회 근처로 떨어지거나 얕아지면 breathing poorly로 보고 자극하며 도움을 부르고, 숨이 멈추면 백마스크로 호흡을 보조해요."
      example: "His breathing looks shallow, so this could be oversedation."
      exKo: "호흡이 얕아 보이니 과진정일 수 있어요."
    - kind: context
      words: [w-oxygen]
      word: oxygen
      ko: 산소
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "His oxygen is eighty-eight on the monitor — grab the bag-mask.", ok: true}
        - {who: 차트 기록, icon: board, en: "Oxygen saturation 94% on 2 L; EtCO2 52.", ok: true}
        - {who: 보호자에게, icon: me, en: "His oxygen saturation is eighty-eight, consistent with hypoventilation.", ok: false, fix: "He isn't breathing deeply enough right now, so we're helping him breathe."}
      why: "의료진끼리는 oxygen 수치를 숫자로 말해야 바로 움직일 수 있어요. 가족에게는 hypoventilation 같은 말이 낯서니, 지금 몸에서 무슨 일이 생겼고 우리가 무엇을 하는지를 쉬운 말로 알려 줘요."
- situation: "진정제 라인·호환성 확인"
  items:
    - kind: slider
      words: [w-compatible, w-lumen, w-separate]
      cue: "Pharmacy: \"These two will precipitate if they share a lumen.\""
      scale: [mixes fine, not sure, "won't mix"]
      answerAt: 2
      why: "한 루멘에서 침전이 생길 수 있다는 말은 함께 넣으면 안 된다는 뜻이에요. 호환성 표나 약사에게 확인하고, 호환이 안 되면 별도 루멘이나 별도 경로로 주입해요."
      example: "If it's not compatible, we'll run it through a separate access."
      exKo: "호환이 안 되면 별도 경로로 주입해요."
    - kind: context
      words: [w-line]
      word: line
      ko: 라인
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "This line already has three drips — let's check each pair.", ok: true}
        - {who: 차트 기록, icon: board, en: "Sedative infusing via dedicated line; compatibility chart checked.", ok: true}
        - {who: 보호자에게, icon: me, en: "The line is a triple-lumen CVC placed in the right internal jugular.", ok: false, fix: "It's a thin tube in his neck that lets us give several medicines at once."}
      why: "의료진끼리는 line이라는 한 단어로 어느 관인지 통해요. 가족에게는 CVC, internal jugular 같은 말이 낯서니, 그 관이 무엇이고 무엇에 쓰는지를 쉬운 말로 풀어 줘요."
- situation: "RASS 목표 맞춤 적정"
  items:
    - kind: slider
      words: [w-awake, w-unresponsive, w-deep]
      cue: "Nurse: \"He's wide awake and tugging at his IV.\""
      scale: [awake, drowsy, unresponsive]
      answerAt: 0
      why: "너무 깨어 있으면 라인을 잡아당길 위험이 있고, 너무 깊으면 기도 반사가 약해질 위험이 있어요. 목표는 그 사이라서, 어느 쪽으로 치우쳤는지 먼저 판단하고 조금씩 맞춰요."
      example: "Too deep risks his airway reflexes, too awake risks him pulling lines."
      exKo: "너무 깊으면 기도 반사가 위험하고, 너무 깨어있으면 라인을 뽑을 위험이 있어요."
    - kind: context
      words: [w-titrate]
      word: titrate
      ko: 용량을 적정하다
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Let's titrate the propofol down in small steps.", ok: true}
        - {who: 차트 기록, icon: board, en: "Propofol titrated from 30 to 20 mcg/kg/min; RASS now -1.", ok: true}
        - {who: 보호자에게, icon: me, en: "We'll titrate his sedation to a lighter RASS.", ok: false, fix: "We're slowly turning the medicine down so he can wake up a little."}
      why: "의료진끼리는 titrate가 용량을 조금씩 맞춘다는 정확한 말이에요. 가족에게는 titrate와 RASS가 낯서니, 약을 서서히 줄여 조금 깨게 한다고 풀어 말해요."
