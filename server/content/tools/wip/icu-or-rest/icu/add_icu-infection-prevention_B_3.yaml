situations:
- title: "VAP 예방 통합 번들 준수"
  s:
  - ["번들 점검", "check", "'confirm'은 했다고 믿는 게 아니라 확인한다는 말이에요. 세 가지를 나열해 점검 범위를 분명히 해요.", "by the bedside", "머리 거상, 구강간호, 진정 중단이 전부 필요한지 확인하죠.", "머리 거상, 구강간호, 진정 중단이 전부 누가 했는지 확인하죠.", "sedation", "nutrition", "vaccination", "hydration"]
  - ["번들 기준", "board", "'every element'와 'needs to be met'로 일부만 해서는 안 된다는 기준을 분명히 해요. 번들은 요소를 모두 해야 인정돼요.", "for the audit", "번들의 모든 요소가 충족돼야 공개돼요.", "번들의 모든 요소가 충족돼야 보관돼요.", "met", "paid", "sold", "won"]
  - ["기록 계획", "pencil", "'for the infection team'으로 기록의 대상을 밝혀요. 기록은 감염관리팀이 번들 준수율을 추적하는 자료가 돼요.", "on the whiteboard", "영양팀을 위해 준수 여부를 기록할게요.", "감염관리팀을 위해 준수 여부를 발표할게요.", "document", "announce", "predict", "rename"]
  - ["근무 보고", "chartup", "'both confirmed'로 두 항목을 모두 확인했다고 한 번에 보고해요. 'for this shift'로 어느 시간대의 기록인지 한정해요.", "last week", "이번 근무는 머리 거상과 구강간호 둘 다 필요해요.", "이번 근무는 머리 거상과 구강간호 둘 다 예정됐어요.", "elevation", "pressure", "alarm", "injury"]
  - ["즉시 기록", "pencil", "'now'로 나중으로 미루지 않고 바로 남긴다고 말해요. 'in the chart'처럼 정해진 곳에 남겨야 다른 사람이 볼 수 있어요.", "for the unit", "지금 차트에 번들 교육 기록을 남길게요.", "지금 보드에 번들 준수 기록을 남길게요.", "compliance", "budget", "menu", "weather"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "번들 준수 점검 4문장 순서"
    why: "먼저 항목을 확인하자고 제안하고, 확인된 것을 보고한 뒤, 모든 요소가 충족돼야 인정된다는 기준 아래 마지막을 마치고, 충족되면 차트에 기록해요."
    lines:
    - ["Let's confirm head elevation, oral care, and sedation breaks are all done.", "check", "머리 거상, 구강간호, 진정 중단이 전부 됐는지 확인하죠", "제안"]
    - ["Head elevation and oral care are both confirmed for this shift.", "chartup", "머리 거상과 구강간호는 이번 근무에 둘 다 확인됐어요", "보고"]
    - ["Every element has to be met for it to count, so we'll finish the last one.", "board", "모든 요소가 충족돼야 인정되니 마지막 하나를 마쳐요", "기준"]
    - ["Once it's met, I'll log the bundle compliance in the chart now.", "pencil", "충족되면 지금 차트에 번들 준수를 기록할게요", "기록"]
- title: "도뇨관 필요성 매일 평가"
  s:
  - ["적응증 확인", "check", "'indication'은 처치를 해야 하는 의학적 이유를 뜻하는 임상 용어예요. 'each patient's'로 환자마다 따로 본다고 말해요.", "for the shift", "오늘 환자마다 카테터 크기를 확인하죠.", "오늘 환자마다 카테터 소재를 확인하죠.", "indication", "invoice", "hobby", "diet"]
  - ["제거 원칙", "check", "'If there's no clear reason'으로 근거가 없으면 두지 않는다는 기본 원칙을 조건문으로 말해요. 'should'는 동료에게 권고로 부드럽게 말해요.", "for a while", "분명한 이유가 없으면 양말을 제거해야죠.", "분명한 이유가 없으면 전극을 제거해야죠.", "clear", "small", "loud", "yellow"]
  - ["매일 검토", "calendar", "'helps us'는 검토가 감염을 없앤다는 단정 대신 줄이는 데 기여한다고 말해요. CAUTI는 카테터와 관련된 요로감염이에요.", "this year", "매일 검토하면 낙상을 줄이는 데 도움이 돼요.", "매일 검토하면 욕창을 줄이는 데 도움이 돼요.", "CAUTIs", "falls", "burns", "rashes"]
  - ["회진 점검", "bell", "'every morning on rounds'는 점검이 하루 일과 안에 고정돼 있다는 뜻이에요. 정해진 때에 보면 빠뜨리기 어려워요.", "after lunch", "매일 아침 식사 때 적응증을 확인해요.", "매일 아침 회진 때 청구서를 확인해요.", "rounds", "games", "parties", "trips"]
  - ["요약", "chartup", "'Fewer … mean fewer …'로 대칭 구조를 써서 원인과 결과를 한 줄에 기억하게 해요.", "more often", "카테터 유지 기간이 짧을수록 소변량도 줄어요.", "카테터 유지 기간이 짧을수록 체중도 줄어요.", "infections", "injuries", "accidents", "visitors"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "카테터 매일 평가 4문장 순서"
    why: "먼저 매일 아침 적응증을 확인한다고 말하고, 이유가 없으면 제거하자고 한 뒤, 제거되면 카테터 일수가 줄어 감염이 줄고, 이것이 매일 검토의 효과라고 마무리해요."
    lines:
    - ["We check the indication every morning on rounds.", "bell", "매일 아침 회진 때 적응증을 확인해요", "확인"]
    - ["If we find no clear reason, we should remove it.", "check", "분명한 이유가 없으면 제거해야죠", "제거"]
    - ["Once it's out, fewer catheter days mean fewer infections.", "chartup", "빼고 나면 카테터 일수가 줄어 감염도 줄어요", "결과"]
    - ["That's how daily review helps us cut down on CAUTIs.", "calendar", "그렇게 매일 검토가 요로감염을 줄여 줘요", "효과"]
- title: "격리 환자 이송 감염관리"
  s:
  - ["이송 준비", "bandage", "'cover any lines'는 라인이 바닥이나 난간에 닿아 오염되지 않게 덮는다는 뜻이에요. 격리 환자는 이송 중 닿는 표면을 줄여요.", "on the stretcher", "환자 위에 깨끗한 시트를 덮고 침대도 닦아 두죠.", "환자 위에 깨끗한 시트를 덮고 가방도 챙겨 두죠.", "clean", "heavy", "folded", "yellow"]
  - ["사전 연락", "bell", "'ahead'로 도착하기 전에 연락한다고 말해요. 검사실이 격리 환자를 받을 준비를 미리 해야 해요.", "by phone", "MRI팀에 미리 알려서 방을 준비할 수 있게 할게요.", "CT팀에 미리 알려서 침대를 준비할 수 있게 할게요.", "prepare", "paint", "rent", "decorate"]
  - ["이송 직원", "shield", "'afterward'로 소독이 이송 뒤의 일임을 말해요. 격리 환자가 쓴 장비는 다음 환자를 위해 소독해요.", "before lunch", "직원들은 개인보호구를 착용하고 이후 스캐너를 점검해야 해요.", "직원들은 개인보호구를 착용하고 이후 스캐너를 예약해야 해요.", "disinfect", "unplug", "repair", "photocopy"]
  - ["사전 전화", "speech", "'so'로 전화하는 목적을 붙여 왜 미리 알리는지 밝혀요. 'knows about the isolation'은 상대가 알아야 할 정보를 분명히 해요.", "in person", "격리 사실을 원무과가 알도록 미리 전화할게요.", "격리 사실을 CT팀이 알도록 미리 방송할게요.", "isolation", "weather", "menu", "payroll"]
  - ["착용 대상", "shield", "'Everyone'은 한 사람도 예외가 없다는 뜻이에요. 이송 중에는 환자와 닿는 모든 사람이 격리 지침을 따라야 해요.", "in the elevator", "이송을 지켜보는 사람은 모두 가운과 장갑을 착용해야 해요.", "이송을 요청한 사람은 모두 가운과 장갑을 착용해야 해요.", "gown", "helmet", "scarf", "badge"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "격리 환자 CT 이송 4문장 순서"
    why: "격리 상태를 알리며 먼저 CT에 연락하고, 이송 전에 환자와 라인을 덮고, 이동하는 동안 모두 보호구를 착용하고, 끝난 뒤 스캐너를 소독해요."
    lines:
    - ["He's on contact isolation, so I'll call ahead and let the CT team know.", "speech", "접촉격리 중이라 미리 전화해서 CT팀에 알릴게요", "연락"]
    - ["Before we move him, we put a clean sheet over him and cover any lines.", "bandage", "옮기기 전에 깨끗한 시트를 덮고 라인도 덮어요", "준비"]
    - ["During the move, everyone on transport should wear a gown and gloves.", "shield", "이동하는 동안 이송 인원은 모두 가운과 장갑을 착용해요", "착용"]
    - ["Afterward, staff should disinfect the scanner.", "check", "끝난 뒤에 직원들이 스캐너를 소독해야 해요", "소독"]
- title: "MDRO 보균 관리·코호팅"
  s:
  - ["코호트 판단", "hospital", "'so'로 이유와 결론을 한 문장에 이어요. 같은 균을 가진 환자끼리만 묶으면 다른 균이 옮겨 가는 걸 막을 수 있어요.", "in the hallway", "세 환자 모두 같은 내성균을 지니고 있으니 코호트로 묶을 수 있어요.", "네 환자 모두 같은 내성균을 지니고 있으니 코호트로 묶을 수 있어요.", "cohort", "discharge", "weigh", "rename"]
  - ["전담 이유", "shield", "'Dedicated'는 한 환자군 전용이라는 뜻이에요. 사람과 장비를 나누면 균이 사람과 물건을 타고 번지는 길이 줄어요.", "in rotation", "전담 직원과 장비가 소음을 제한하는 데 도움이 돼요.", "전담 직원과 가구가 확산을 제한하는 데 도움이 돼요.", "Dedicated", "Spare", "Rented", "Colorful"]
  - ["표시·강화", "pushpin", "'flag'는 눈에 띄게 표시해 모두가 알게 한다는 뜻이에요. 'reinforce'는 이미 있는 주의조치를 더 철저히 한다는 말이에요.", "in the lounge", "이들을 분명하게 표시하고 접촉주의를 교육하죠.", "이들을 분명하게 소개하고 접촉주의를 강화하죠.", "clearly", "quietly", "slowly", "loosely"]
  - ["코호트 결정", "check", "'Same organism, same room'은 동사 없이 기준 둘을 대구로 말해 결정 이유가 한눈에 보여요. 'let's'로 동료에게 함께 하자고 제안해요.", "on the unit", "같은 균, 같은 병실이니 — 이 셋을 코호트로 묶죠.", "같은 균, 같은 병실이니 — 이 넷을 코호트로 묶죠.", "organism", "insurance", "doctor", "schedule"]
  - ["장비 분리", "gear", "'separate from the rest'는 나머지와 섞이지 않게 둔다는 뜻이에요. 장비가 섞이면 균이 환자 사이를 옮겨 다녀요.", "by the desk", "이 사람들 식사는 병동 나머지와 분리해서 관리하죠.", "이 사람들 서류는 병동 나머지와 분리해서 관리하죠.", "equipment", "lunches", "mail", "jackets"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "내성균 환자 코호트 4문장 순서"
    why: "같은 균임을 먼저 말하고, 그래서 한 방에 묶을 수 있다고 한 뒤, 그 방에서 장비를 분리하고, 마지막으로 표시와 접촉주의 강화를 해요."
    lines:
    - ["Both patients carry the same resistant organism.", "hospital", "두 환자는 같은 내성균을 지니고 있어요", "근거"]
    - ["So we can cohort them in the same room.", "check", "그래서 같은 병실에 코호트로 묶을 수 있어요", "결정"]
    - ["In that room, let's keep their equipment separate from the rest of the unit.", "gear", "그 병실 장비는 병동 나머지와 분리해서 관리하죠", "분리"]
    - ["Once they're set up that way, let's flag them clearly and reinforce contact precautions.", "pushpin", "그렇게 배치되면 분명히 표시하고 접촉주의를 강화하죠", "표시"]
- title: "C. difficile 예방·관리"
  s:
  - ["검체 의뢰", "lab", "'could be'는 진단을 단정하지 않고 가능성으로 말해요. 확인은 대변 검체 검사로 해요.", "to the pharmacy", "구토가 C. diff일 수 있으니 대변 검체를 보내죠.", "열이 C. diff일 수 있으니 대변 검체를 보내죠.", "diarrhea", "headache", "rash", "cough"]
  - ["손위생 방법", "shield", "'not just gel'은 젤도 쓰지만 그것만으로는 부족하다는 뜻이에요. C. diff의 아포는 알코올 젤로 잘 없어지지 않아 비누와 물이 필요해요.", "in the lobby", "다른 병동에서는 젤만이 아니라 비누와 물로 손위생을 해야 해요.", "수술방에서는 젤만이 아니라 비누와 물로 손위생을 해야 해요.", "soap", "towels", "tissues", "napkins"]
  - ["소독제 선택", "lab", "'is required'로 선택 사항이 아니라 필수라고 말해요. 아포는 알코올에 잘 죽지 않아 염소계 표백제가 필요해요.", "for the carpet", "곰팡이를 없애려면 표백제 기반 세척이 필요해요.", "냄새를 없애려면 표백제 기반 세척이 필요해요.", "kill", "count", "name", "draw"]
  - ["격리 시작", "siren", "'right away'로 검사 결과를 기다리지 않고 바로 시작한다고 말해요. 의심 단계에서 먼저 시작하는 것이 전파를 막아요.", "in the morning", "이분에게 바로 낙상주의를 시작하죠.", "이분에게 바로 흡인주의를 시작하죠.", "contact", "droplet", "airborne", "fire"]
  - ["물티슈 종류", "lab", "'not the alcohol ones'로 흔한 오해를 직접 바로잡아요. C. diff 병실에서는 알코올 물티슈가 아포를 없애지 못해요.", "on the shelf", "다른 병동에서는 알코올 물티슈가 아니라 표백제 물티슈를 써요.", "여기서는 알코올 물티슈가 아니라 표백제 물티슈를 채워요.", "wipes", "gloves", "gowns", "masks"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "C. diff 의심 대응 4문장 순서"
    why: "의심되면 검체를 보내고 바로 접촉주의를 시작해요. 그 아래서 알코올 젤이 아포에 듣지 않으니 비누와 물을 쓰고, 표면도 같은 이유로 표백제 물티슈를 써요."
    lines:
    - ["His diarrhea could be C. diff, so let's send a stool sample.", "lab", "설사가 C. diff일 수 있으니 대변 검체를 보내죠", "검체"]
    - ["With that possibility, let's start contact precautions for him right away.", "siren", "그 가능성이 있으니 바로 접촉주의를 시작하죠", "격리"]
    - ["Under those precautions, alcohol gel doesn't kill the spores, so we need soap and water for hand hygiene.", "shield", "그 주의 아래서는 알코올 젤이 아포를 못 없애니 비누와 물로 손위생을 해요", "손위생"]
    - ["Surfaces follow the same rule — we use bleach wipes here, not alcohol ones.", "lab", "표면도 같은 규칙으로 알코올이 아니라 표백제 물티슈를 써요", "표면"]
- title: "항생제 관련 이차감염 감시"
  s:
  - ["이차감염", "pill", "'can lead to'는 항상 생기는 것이 아니라 가능성이 있다는 표현이에요. 항생제는 정상 균까지 줄여 다른 균이 자랄 틈을 만들어요.", "within a day", "긴 진통제 요법은 C. diff나 진균 같은 이차감염으로 이어질 수 있어요.", "긴 항생제 요법은 C. diff나 결핵 같은 이차감염으로 이어질 수 있어요.", "yeast", "pollen", "dust", "smoke"]
  - ["관찰 항목", "magnify", "'new'로 이미 있던 증상이 아니라 새로 생긴 변화를 본다고 한정해요. 열·설사·아구창은 항생제 뒤 이차감염의 흔한 신호예요.", "for a rash", "새로운 열, 설사, 구강 건조를 지켜보죠.", "새로운 열, 설사, 구강 궤양을 지켜보죠.", "diarrhea", "constipation", "bruising", "hiccups"]
  - ["조기 보고", "bell", "'early'를 끝에 붙여 서두르겠다는 뜻을 강조해요. 이차감염은 빨리 알수록 치료와 격리가 빨라져요.", "to the family", "새로운 징후는 조기에 약사에게 표시해 알릴게요.", "새로운 약은 조기에 팀에 표시해 알릴게요.", "signs", "rooms", "bags", "forms"]
  - ["투여 기간", "calendar", "'for over a week'로 기간을 구체적으로 말해 왜 이차감염을 의심하는지 근거를 줘요. 'now'는 지금까지 이어졌다는 뜻이에요.", "since yesterday", "이분은 이틀 넘게 항생제를 맞고 있어요.", "이분은 일주일 넘게 입원해 있어요.", "antibiotics", "vitamins", "minerals", "snacks"]
  - ["즉시 보고", "bell", "수동태 'gets reported'는 누가 보든 반드시 보고된다는 규칙으로 들려요. 'right away'는 미루지 않는다는 뜻이에요.", "to the manager", "새로운 열이나 설사는 바로 약사에게 보고돼요.", "새로운 열이나 설사는 바로 청소팀에 보고돼요.", "team", "cook", "driver", "guard"]
