  s:
  - ["징후 설명", "magnify", "'could be'와 'early sign'으로 확정 대신 가능성과 조기 단계를 말해요. 라인 주변 발적은 감염의 첫 신호일 수 있어요.", "from the sun", "라인 주변 발적은 조기 탈수 징후일 수 있어요.", "라인 주변 발적은 조기 출혈 징후일 수 있어요.", "redness", "freckles", "hair", "shadow"]
  - ["추가 확인", "check", "'too'로 이미 본 발적 말고 더 볼 것이 있다는 신호예요. 열·압통·배액은 국소 감염을 알리는 흔한 소견이에요.", "for pain relief", "열, 압통, 체중도 함께 확인하죠.", "열, 식욕, 배액도 함께 확인하죠.", "tenderness", "hunger", "laughter", "boredom"]
  - ["팀 알림", "speech", "'so we can decide'로 알리는 목적을 밝혀요. 'we'를 써서 제거는 혼자 정하는 게 아니라 팀이 같이 정한다는 걸 보여요.", "to the pharmacist", "제거할지 결정할 수 있게 원무과에 알릴게요.", "제거할지 결정할 수 있게 가족에게 알릴게요.", "decide", "guess", "bet", "joke"]
  - ["소견 보고", "stetho", "'looks'로 보이는 소견을 그대로 전해요. 'red and warm'은 염증의 대표 소견이고 'today'로 지금 상태임을 밝혀요.", "at the window", "오늘 라인 주변 피부가 붉고 건조해 보여요.", "어제 라인 주변 피부가 붉고 따뜻해 보였어요.", "warm", "pale", "blue", "wet"]
  - ["보고·결정", "speech", "'let the team decide'로 라인을 빼는 결정은 팀 몫이라는 선을 지켜요. 간호사는 발적을 보고하는 역할을 해요.", "on the chart", "발적을 보고하고 라인은 가족이 결정하도록 할게요.", "발적을 보고하고 식사는 팀이 결정하도록 할게요.", "line", "meal", "music", "movie"]
