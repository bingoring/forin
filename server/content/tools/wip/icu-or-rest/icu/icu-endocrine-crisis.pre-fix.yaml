situations:
- title: DKA 초기 사정
  sentences:
  - en: I'm going to check your hydration, your breathing, and how alert you feel.
    ko: 수분 상태랑 호흡, 의식이 얼마나 또렷한지 확인해 볼게요.
    chunks:
    - I'm going to check
    - your hydration,
    - your breathing,
    - and how alert you feel
    - .
    words:
    - w-check
    - w-hydration
    - w-breathing
    - w-alert
    - w-feel
    goal: 1
    tag: 사정 안내
    icon: check
    why: '''how alert you feel''은 의식 상태를 환자가 느끼는 정도로 묻는 간접 의문절이라 검사처럼 들리지 않고 부드러워요.'
    decoy: your slippers
    distractorsKo:
    - 동료가 수분 상태랑 호흡, 의식이 얼마나 또렷한지 확인해요.
    - 선배가 수분 상태랑 호흡, 의식이 얼마나 또렷한지 확인해요.
    blank:
      answer: breathing
      options:
      - en: breathing
      - en: walking
      - en: bathing
      - en: dressing
  - en: Have you been able to keep any fluids down today?
    ko: 오늘 물이나 음료를 좀 삼킬 수 있었어요?
    chunks:
    - Have you been able
    - to keep
    - any fluids down
    - today
    - '?'
    words:
    - w-keep
    - w-fluid
    goal: 1
    tag: 병력 질문
    icon: speech
    why: '''keep down''은 삼킨 것을 토하지 않고 유지한다는 숙어라 구토가 있는 환자에게 딱 맞아요. ''been able to''가 못 했을 때도 부담 없이 답하게 해요.'
    decoy: for your visitors
    distractorsKo:
    - 어젯밤 물이나 음료를 좀 삼킬 수 있었어요?
    - 이틀 동안 물이나 음료를 좀 삼킬 수 있었어요?
    blank:
      answer: keep
      options:
      - en: keep
      - en: pour
      - en: spill
      - en: wash
  - en: Your fast breathing can be your body reacting to acid, so I'm watching it closely.
    ko: 숨이 빠른 건 몸이 산에 반응하는 걸 수도 있어서, 제가 잘 지켜보고 있어요.
    chunks:
    - Your fast breathing
    - can be your body
    - reacting to acid,
    - so I'm watching it closely
    - .
    words:
    - w-fast
    - w-breathing
    - w-react
    - w-acid
    - w-watch
    - w-closely
    goal: 1
    tag: 원인 설명
    icon: lab
    why: '''can be''는 확정이 아니라 가능성이라 환자를 겁주지 않고 설명해요. ''reacting to''로 몸이 하는 반응이라는 틀을 줘요.'
    decoy: your morning meal
    distractorsKo:
    - 숨이 빠른 건 몸이 열에 반응하는 걸 수도 있어서, 제가 잘 지켜보고 있어요.
    - 숨이 빠른 건 몸이 약에 반응하는 걸 수도 있어서, 제가 잘 지켜보고 있어요.
    blank:
      answer: acid
      options:
      - en: acid
      - en: noise
      - en: sunlight
      - en: pollen
  - en: I'll ask you a few questions to check how alert you are.
    ko: 의식이 얼마나 또렷한지 확인하려고 몇 가지 여쭤볼게요.
    chunks:
    - I'll ask you
    - a few questions
    - to check how alert
    - you are
    - .
    words:
    - w-ask
    - w-question
    - w-check
    - w-alert
    goal: 1
    tag: 의식 확인
    icon: bulb
    why: '''a few questions''는 부담 없는 분량처럼 들려 환자가 협조하기 쉬워요. ''to check''로 질문하는 목적을 먼저 밝혀요.'
    decoy: about your diet
    distractorsKo:
    - 의식이 얼마나 또렷한지 확인하려고 후배가 몇 가지 여쭤봐요.
    - 의식이 얼마나 또렷한지 확인하려고 의사가 몇 가지 여쭤봐요.
    blank:
      answer: ask
      options:
      - en: ask
      - en: show
      - en: tell
      - en: teach
  - en: I'm seeing early signs of DKA, so I'll report this to the team right away.
    ko: 당뇨병성 케토산증 초기 소견이 보여서, 바로 팀에 보고할게요.
    chunks:
    - I'm seeing early signs
    - of DKA,
    - so I'll report this
    - to the team right away
    - .
    words:
    - w-sign
    - w-report
    - w-team
    goal: 2
    tag: 보고
    icon: siren
    why: '''early signs''는 확정 진단이 아니라 초기 단서라는 뜻이에요. ''this''가 방금 본 소견을 가리켜 무엇을 보고하는지 분명해요.'
    decoy: to his sister
    distractorsKo:
    - 당뇨병성 케토산증 뚜렷한 소견이 보여서, 바로 팀에 보고할게요.
    - 당뇨병성 케토산증 애매한 소견이 보여서, 바로 팀에 보고할게요.
    blank:
      answer: signs
      options:
      - en: signs
      - en: causes
      - en: doses
      - en: scars
  - en: I'm right here with you, so try to stay calm.
    ko: 제가 바로 옆에 있으니까 최대한 편하게 있으세요.
    chunks:
    - I'm right here
    - with you,
    - so try
    - to stay calm
    - .
    words:
    - w-stay
    - w-calm
    goal: 1
    tag: 곁에 있기
    icon: me
    why: '''right here with you''는 물리적으로 곁에 있다는 말이라 불안한 환자에게 안심을 줘요. ''try to''는 명령이 아니라 권유로 들려요.'
    decoy: in the hallway
    distractorsKo:
    - 친구가 바로 옆에 있으니까 최대한 편하게 있으세요.
    - 제가 바로 옆에 있으니까 최대한 조용히 있으세요.
    blank:
      answer: calm
      options:
      - en: calm
      - en: angry
      - en: lonely
      - en: hungry
  nuance:
  - kind: slider
    words:
    - w-fast
    cue: Her breathing rate is 34 breaths a minute, and each breath is deep.
    scale:
    - a little fast
    - fast
    - very fast
    answerAt: 2
    why: 성인의 정상 호흡수는 보통 분당 12~20회예요. 34회에 깊은 호흡이 이어지면 very fast이고, DKA에서는 산을 내보내려는 몸의 반응일 수 있어서 바로 팀에 보고해요.
    example: Her breathing is very fast and deep.
    exKo: 그녀의 호흡이 아주 빠르고 깊어요.
  - kind: context
    words:
    - w-sign
    word: sign
    ko: 징후
    scenes:
    - who: 의사 라운드
      icon: monitor
      en: He has early signs of DKA — deep, fast breathing and a dry mouth.
      ok: true
    - who: 야간 인계
      icon: board
      en: No new signs of fluid overload overnight.
      ok: true
    - who: 환자에게
      icon: me
      en: Your Kussmaul respirations are a sign of severe metabolic acidosis.
      ok: false
      fix: Your fast, deep breathing is a sign that your blood has too much acid, and we're treating it.
    why: 의료진끼리는 Kussmaul·metabolic acidosis 같은 용어가 정확하고 빨라요. 환자에게는 같은 sign을 쉬운 말로 풀어 무엇이 일어나고 있고 무엇을 하는지 알려 주세요.
  - kind: swap
    words:
    - w-hydration
    who: 환자에게 · 첫 사정 설명
    icon: me
    before:
    - 'I''m checking '
    - your volume status
    - ' first.'
    options:
    - how dry you are
    - your volume status
    - your hypovolemia
    answer: how dry you are
    notes:
      how dry you are: 환자가 바로 알아듣고, 무엇을 보는지 분명해요.
      your volume status: 의료진끼리 쓰는 말이라 환자는 무슨 뜻인지 모를 수 있어요.
      your hypovolemia: 어려운 진단명을 환자에게 그대로 던지는 말이라 불안만 키워요.
    why: 탈수 사정은 환자 몸 상태를 묻는 일이라, 진단명 대신 '얼마나 말라 있는지' 같은 쉬운 말로 시작해요.
    ko: 먼저 몸에 수분이 얼마나 모자란지 확인할게요
  order:
    tag: 대화 흐름
    icon: compass
    ko: DKA 초기 사정 4문장 순서
    why: 무엇을 확인할지 알리고, 수분 상태를 병력으로 묻고, 어느 쪽이든 빠른 숨의 이유를 설명한 뒤, 소견을 보고한다고 알려요.
    lines:
    - en: I'm going to check your hydration, your breathing, and how alert you feel.
      icon: check
      ko: 수분 상태랑 호흡, 의식을 확인해 볼게요
      note: 사정
    - en: For your hydration, have you been able to keep any fluids down today?
      icon: speech
      ko: 수분 상태 때문에, 오늘 물이나 음료를 삼킬 수 있었어요?
      note: 질문
    - en: Either way, that fast breathing can be your body reacting to acid.
      icon: lab
      ko: 어느 쪽이든 그 빠른 숨은 몸이 산에 반응하는 걸 수도 있어요
      note: 설명
    - en: Because of all that, I'll report these early signs to the team.
      icon: siren
      ko: 그 모든 걸 바탕으로 이 초기 소견을 팀에 보고할게요
      note: 보고
