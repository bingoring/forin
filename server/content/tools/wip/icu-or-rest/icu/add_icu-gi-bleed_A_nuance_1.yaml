- situation: "GI 출혈 징후 사정"
  items:
    - kind: slider
      words: [w-bleed, w-blood]
      cue: "Patient (pointing at the basin): \"The whole basin is full of blood.\""
      scale: [specks of blood, active bleeding, a massive bleed]
      answerAt: 2
      why: "대야가 가득 찰 만큼 토했다면 흔적이 아니라 대량 출혈로 봐야 해요. 같은 bleeding이라도 양에 따라 대응이 달라지니, 곁을 지키면서 기도와 활력징후를 살피고 바로 의사에게 알려요."
      example: "He vomited a basin of bright red blood, so I'm calling the physician now."
      exKo: "선홍색 피를 대야 가득 토해서, 지금 의사에게 연락할게요."
    - kind: context
      words: [w-vitals]
      word: vitals
      ko: 활력징후
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His vitals are holding, but he vomited once more.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you take his vitals again while I call GI?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "His vitals show tachycardia and borderline hypotension from an ongoing GI hemorrhage.", ok: false, fix: "His heart is beating fast and his blood pressure is a little low, and we're watching him closely."}
      why: "의료진끼리는 vitals라고 짧게 말해도 통해요. 가족에게 tachycardia, hypotension 같은 말을 쓰면 낯설고 겁만 줘요. 심박과 혈압을 쉬운 말로 풀어 전해요."
- situation: "대구경 정맥로 확보 협조"
  items:
    - kind: pair
      words: [w-large, w-catheter, w-draw, w-tourniquet]
      pairs: [["large-bore", "catheter"], ["draw", "blood"], ["apply", "a tourniquet"]]
      decoys: ["the pump"]
      why: "large-bore catheter는 굵은 정맥 카테터라 수액과 혈액을 빠르게 넣을 수 있어요. draw blood는 채혈하다, apply a tourniquet은 지혈대를 묶어 정맥이 잘 보이게 하는 동작이에요."
    - kind: context
      words: [w-line]
      word: line
      ko: 라인
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Two large-bore lines are in, both flushing well.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you check the line in his left arm before we hang the fluids?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "We've placed bilateral peripheral large-bore lines for rapid volume resuscitation.", ok: false, fix: "We put in two big IVs so we can give fluids and blood quickly."}
      why: "의료진끼리는 line, large-bore 같은 말로 정맥로 상태를 짧게 주고받아요. 가족에게 bilateral, volume resuscitation 같은 말은 어렵고 무섭게 들려요. 굵은 정맥 주사를 두 개 놓았다고 쉬운 말로 알려 줘요."
- situation: "수혈 준비·교차시험"
  items:
    - kind: slider
      words: [w-armband, w-tube]
      cue: "Nurse: \"Before we spike the blood, a second nurse and I read his name and birth date off the armband and the bag, one by one.\""
      scale: [glance at it, check it, double-check it]
      answerAt: 2
      why: "수혈 전에는 간호사 두 명이 환자 팔찌와 혈액 팩의 이름·생년월일 등을 하나씩 소리 내어 맞춰 보는 것이 일반적이에요. 한 번 슥 보는 정도(glance)나 혼자 확인(check)이 아니라 다시 한 번 확인하는 double-check예요. 세부 절차는 병원 지침대로 해요."
      example: "We double-check the armband against the bag before we start."
      exKo: "시작하기 전에 팔찌와 혈액 팩을 다시 한 번 맞춰 봐요."
    - kind: context
      words: [w-confirm]
      word: confirm
      ko: 확인하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll confirm the type and cross with the blood bank before we hang it.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you confirm the unit number with me before I spike it?", ok: true}
        - {who: 환자에게, icon: me, en: "We must confirm your identifiers against the product label per protocol before administration.", ok: false, fix: "We check your name and wristband twice so you get exactly the right blood."}
      why: "의료진끼리는 type and cross, unit number처럼 확인할 대상을 짧게 말해요. 환자에게 identifiers, administration 같은 말은 낯설고 딱딱해요. 이름과 팔찌를 두 번 확인한다고 쉬운 말로 알려 줘요."
- situation: "혈역학·Hb 추세 감시"
  items:
    - kind: slider
      words: [w-lightheaded]
      cue: "Patient: \"Everything is going gray, I think I'm going to pass out.\""
      scale: [a little lightheaded, very dizzy, about to faint]
      answerAt: 2
      why: "어지러움에도 강도가 있어요. lightheaded는 머리가 핑 도는 정도, dizzy는 더 심한 어지러움, faint는 곧 쓰러질 것 같은 단계예요. 눈앞이 어두워지고 쓰러질 것 같다고 하면 눕히고 바로 의사에게 알려요."
      example: "He feels faint when he sits up, so I laid him back down."
      exKo: "일어나 앉으면 쓰러질 것 같다고 해서 다시 눕혔어요."
    - kind: context
      words: [w-trend]
      word: trend
      ko: 추세
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His hemoglobin trend is down since admission, so I'm watching it closely.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you pull the lab trend for the last twelve hours?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "His hemoglobin trend shows a downward trajectory with a concerning velocity.", ok: false, fix: "His blood count has dipped a little since this morning, and we're rechecking it."}
      why: "의료진끼리는 trend 한 단어로 수치가 시간에 따라 어느 쪽으로 가는지 말해요. 가족에게 trajectory, velocity 같은 말은 차갑고 불안하게 들려요. 얼마나 달라졌는지와 다시 확인하겠다는 계획을 쉬운 말로 전해요."
- situation: "NPO·위관 관리"
  items:
    - kind: slider
      words: [w-uncomfortable]
      cue: "Patient: \"The tube is annoying, but I can handle it.\""
      scale: [a bit uncomfortable, really uncomfortable, unbearable]
      answerAt: 0
      why: "참을 만하다면 약간 불편한(a bit uncomfortable) 정도예요. 불편해도 위를 비우고 출혈을 확인하는 데 필요하다고 설명하고, 참기 힘들 만큼 아프면 바로 알려 달라고 안내해요."
      example: "It's uncomfortable, but it's protecting your stomach right now."
      exKo: "불편하신 거 알아요, 그래도 지금은 위를 보호하고 있어요."
    - kind: context
      words: [w-stomach]
      word: stomach
      ko: 위
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "The stomach is decompressed, but the drainage is still blood-tinged.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you check the stomach drainage before you chart it?", ok: true}
        - {who: 환자에게, icon: me, en: "The tube decompresses your stomach contents so we can assess for mucosal hemorrhage.", ok: false, fix: "The tube empties your stomach so we can see whether it's still bleeding."}
      why: "의료진끼리는 decompress, blood-tinged 같은 말로 상태를 짧게 보고해요. 환자에게 mucosal hemorrhage 같은 말은 어렵고 무서워요. 관이 위를 비워서 출혈이 계속되는지 보려는 것이라고 쉬운 말로 알려 줘요."
- situation: "출혈 병력·항응고 검토"
  items:
    - kind: pair
      words: [w-medication, w-thinner, w-ulcer]
      pairs: [["medication", "list"], ["blood", "thinner"], ["stomach", "ulcer"]]
      decoys: ["bed alarm"]
      why: "medication list는 복용 중인 약을 빠짐없이 파악하는 목록이에요. blood thinner는 항응고제·항혈소판제를 흔히 부르는 말이고, stomach ulcer는 위궤양이에요."
    - kind: context
      words: [w-dose]
      word: dose
      ko: 용량
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His last dose of warfarin was two days ago, per his wife.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you verify the last dose time against his home medication list?", ok: true}
        - {who: 환자에게, icon: me, en: "What was the timing of your last anticoagulant dose relative to symptom onset?", ok: false, fix: "When did you last take your blood thinner?"}
      why: "의료진끼리는 anticoagulant, timing, onset 같은 임상어로 마지막 복용 시각을 짧고 정확하게 주고받아요. 환자에게 같은 질문을 그렇게 하면 무슨 말인지 몰라 대답하기 어려워요. 언제 마지막으로 혈액희석제를 먹었는지 쉬운 말로 물어요."
- situation: "정맥류 출혈 초기 관리"
  items:
    - kind: pair
      words: [w-prophylactic, w-antibiotic, w-variceal, w-bleed]
      pairs: [["prophylactic", "antibiotic"], ["variceal", "bleed"]]
      decoys: ["a pump"]
      why: "prophylactic antibiotic은 감염을 미리 막으려고 쓰는 예방적 항생제예요. variceal bleed는 식도·위 정맥류에서 나는 출혈이고, 둘 다 처방대로 투여하고 지켜봐요."
    - kind: context
      words: [w-airway]
      word: airway
      ko: 기도
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Her airway is protected for now, but I'd like anesthesia nearby for the scope.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you watch her airway while I draw the labs?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "Her airway is compromised, with a high aspiration risk.", ok: false, fix: "We're watching her breathing very closely so she stays safe."}
      why: "의료진끼리는 airway가 지켜지고 있는지 한 단어로 묻고 답해요. 가족에게 compromised, aspiration risk 같은 말을 그대로 쓰면 지금 당장 위험한 줄 알고 놀라요. 숨 쉬는 것을 가까이서 지켜보고 있다고 쉬운 말로 알려 줘요."
- situation: "내시경 준비·조율"
  items:
    - kind: pair
      words: [w-standby, w-checklist, w-blood]
      pairs: [["blood", "on standby"], ["pre-procedure", "checklist"]]
      decoys: ["the cuff"]
      why: "on standby는 필요할 때 바로 쓸 수 있게 준비해 두고 기다리는 상태예요. pre-procedure checklist는 시술 전에 동의서, 알레르기, 금식 시간 같은 항목을 빠짐없이 확인하는 목록이에요."
    - kind: context
      words: [w-scope]
      word: scope
      ko: 내시경
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "He's ready for the scope as soon as his pressure is a bit more stable.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you grab suction and the scope cart?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "He's going for an EGD under monitored anesthesia care, and the scope may need therapeutic intervention.", ok: false, fix: "A doctor will look inside his stomach with a thin camera to find the bleeding."}
      why: "의료진끼리는 scope 한 단어로 내시경을 가리켜요. 가족에게 EGD, monitored anesthesia care 같은 말은 어렵고 겁나요. 가는 카메라로 위 안을 보고 출혈 위치를 찾는다고 쉬운 말로 알려 줘요."
