"15.6": {d: ["누군가 팩마다 투여하기 전에 번호를 맞춰 봐야 해요.", "누군가 팩마다 다 들어가면 빈 팩을 모아야 해요."]}
"16.1": {d: ["흡인기를 켜기 전에 팀이 도우러 오고 있어요.", "흡인한 뒤에 팀이 카트를 밀고 오고 있어요."]}
"16.6": {d: ["많이 무서우시죠, 그래도 상황이 끝나면 바로 설명해 드릴게요.", "많이 무서우시죠, 그래도 숨을 천천히 쉬어 보세요."]}
"17.3": {d: ["TIPS는 영상으로 보면서 목 쪽 혈관으로 넣어요.", "TIPS를 한 뒤에는 간 기능과 의식을 지켜봐요."]}
