"18.0": {d: ["수액을 최대로 연 뒤에 피가 오면 바로 걸어요.", "피를 요청한 뒤에 오는 길을 비워 둬요."]}
"18.1": {d: ["GI팀이랑 담당의가 오면 즉시 인계하고 있어요.", "알린 뒤에 즉시 침대 주변을 비우고 있어요."]}
"18.3": {d: ["수액을 밀어 넣은 뒤에 피를 요청하고 있어요.", "혈압이 빠르게 떨어져서 수액 라인을 더 잡고 있어요."]}
"18.6": {d: ["저랑 계속 누워 계세요, 지금 혈압을 다시 올리고 있어요.", "저랑 계속 계세요, 곧 혈액이 도착해요."]}
"19.0": {d: ["혈장이랑 혈소판, 동결침전을 투여하기 전에 해동하죠.", "혈장이랑 혈소판, 동결침전을 투여한 뒤에 빈 팩을 버리죠."]}
"19.2": {d: ["응고를 돕기 위해 이불을 한 장 더 가져와요.", "체온을 따뜻하게 유지한 뒤에 수치를 다시 봐요."]}
"19.3": {d: ["여기저기서 스며 나오면 응고 인자를 채워 줘야 해요.", "여기저기서 스며 나오면 압박할 수 있는 곳은 눌러 줘요."]}
"20.0": {d: ["간질환 때문에 응고 인자를 만들기가 굉장히 어려워요.", "간질환 때문에 정맥류가 생기기가 굉장히 쉬워요."]}
"20.2": {d: ["이야기하기 전에 가족분이 앉으실 자리를 마련하죠.", "이야기한 뒤에 필요한 서류는 따로 설명드리죠."]}
"20.3": {d: ["다음에는 어떤 방법이 남았는지 함께 살펴볼게요.", "IR 시술은 몸 안에서 혈관을 막는 방법이에요."]}
