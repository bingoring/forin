"15.0": {d: ["MTP를 발동한 뒤에 쿨러가 오면 팩 번호를 맞춰요.", "MTP를 발동하기 전에 라인 두 개를 확인해요."]}
"15.1": {d: ["수혈하기 전에 팩을 순서대로 놓아요.", "수혈한 뒤에 빈 팩을 바로 치워요."]}
