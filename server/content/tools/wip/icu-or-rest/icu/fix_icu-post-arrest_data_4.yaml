# icu-post-arrest 검토 반영 — 단어·뉘앙스·order
words:
  w-seizure: {cue: "뇌의 전기 활동이 갑자기 폭주해 몸이 떨리거나 의식이 흐려지는 일"}
  w-maintenance: {cue: "목표에 도달한 뒤 그 값을 그대로 지켜 가는 단계"}
  w-organ: {cue: "심장·간·신장처럼 몸 안에서 맡은 일이 따로 있는 부분 — 기증 대상이 되기도 함", tag: "가족"}
  w-procurement: {tag: "가족"}
  w-exam: {cue: "환자를 직접 보고 만지며 의식·반사 같은 이상을 찾는 일"}
  w-test: {cue: "피를 뽑거나 사진을 찍어 몸 상태를 알아보는 일 하나"}
  w-pressure: {cue: "혈관 벽을 누르는 힘, 커프로 재는 그 값"}
  w-abcs: {distractorsKo: ["의식수준 척도(AVPU)", "맥박-혈압-체온(바이탈)"]}
  w-ecg: {decoyChips: [ECT]}
  w-bradycardia: {chips: [[brady, car, dia]], decoyChips: [broad, card]}
  w-sinus: {decoyChips: [sea, bus]}
  w-slow: {decoyChips: [blow]}
  w-subtle: {decoyChips: [sun, tile]}
  w-meaningful: {decoyChips: [men, fill]}
  w-carefully: {decoyChips: [cure, fill]}
  w-focus: {decoyChips: [for, case]}
  w-control: {ko: "조절하다(제어)", distractorsKo: ["악화시키다(진행)", "중단하다(멈춤)"], decoyChips: [can, trawl]}
  w-stable: {decoyChips: [stay, bill]}
  w-electrolyte: {decoyChips: [a, lack]}
  w-answer: {decoyChips: [and, sweet]}
  w-ttm: {decoyChips: [TMT]}
  w-quickly: {decoyChips: [quark, lie]}
  w-uncomfortable: {tag: "진정"}
  w-pain: {tag: "진정"}
  w-comfort: {tag: "진정"}
  w-tight: {ko: "엄격하게(빈틈없이)"}
  w-outcome: {ko: "최종 결과"}
  w-meds: {ko: "약(구어)"}
  w-crash: {ko: "무너뜨리다(크래시)"}
  w-rearrest: {ko: "재정지되다", distractorsKo: ["재가온되다", "재삽관되다"]}
# 품사 표를 먼저 적용한 뒤 아래로 덮어쓴다
dEn_set:
  w-defibrillator: [fibrillation, cardiac monitor]
  w-target: [tarot, gadget]
  w-reading: [heading, leading]
  w-honor: [hover, harbor]
  w-decision: [division, revision]
  w-meaningful: [measurable, meandering]
  w-choose: [chase, lose]
word_remove: [w-tomorrow, w-belong]

nuance:
# --- 상황 2 TTM 목표체온 준비
- {s: 2, kind: context, scene: {0: {en: "Per protocol, we'll cool to thirty-six degrees Celsius and hold."}}}
# --- 상황 3 pair
- s: 3
  kind: pair
  set:
    pairs: [[core, temperature], [serum, potassium], ["a full", "metabolic panel"]]
    decoys: ["the trend line"]
    why: "core temperature는 피부가 아니라 몸 깊은 곳의 체온이에요. serum potassium은 혈청(혈액의 맑은 부분)에서 잰 칼륨 수치이고, a full metabolic panel은 여러 수치를 한 번에 보는 종합 대사 검사예요."
# --- 상황 4
- s: 4
  kind: slider
  set:
    example: "His pain score looks controlled on the current dose."
    exKo: "지금 용량에서 통증 점수가 잘 조절되는 것 같아요."
- {s: 4, kind: context, scene: {2: {en: "His comfort target is minus two on the RASS sedation scale."}}}
# --- 상황 5
- s: 5
  kind: slider
  set:
    example: "Watch for any rhythm change or dropping pressure."
    exKo: "리듬 변화나 혈압 하강을 살피세요."
# --- 상황 6
- s: 6
  kind: slider
  set:
    scale: ["keep cooling a bit more to be safe", "check the device and tell the doctor", "speed up the cooling to catch up"]
    why: "목표보다 더 내려가면 안 되는 치료라, 이미 목표 아래면 탐침 위치와 기계 설정을 확인하고 의사에게 알려 조절해요. 더 식히거나 빨리 식히는 건 과냉각(overshoot)을 키워요."
- s: 6
  kind: context
  scene: {2: {en: "His core temperature remains steady within the target band of thirty-six Celsius."}}
  set:
    why: "의료진끼리는 목표 범위와 섭씨 수치로 간단히 보고해요. 가족에게는 체온이 원하는 곳에서 안정적이라는 것과 뇌를 지키는 데 도움이 된다는 점을 쉬운 말로 전해요."
# --- 상황 8
- s: 8
  kind: slider
  set:
    scale: ["roll now and label it in the lab", "verify it, then label it", "tell the lab it is probably saline"]
    why: "라벨 없는 드립은 무슨 약인지 몰라 이송 중 위험해요. 출발 전에 줄을 따라가 펌프 설정과 처방을 대조해 무슨 약인지 확인하고 라벨을 붙여요. 확인이 안 되면 쓰지 말고 처방대로 새로 걸어요. '식염수일 것'이라고 짐작하거나 나중에 붙이는 건 안 돼요."
- s: 8
  kind: context
  scene:
    1: {en: "Bring the bag valve; RT will manage the airway during transport."}
    2: {fix: "We're taking him to the heart lab now so the team can check for a blocked artery and open it if they find one."}
# --- 상황 9
- s: 9
  kind: slider
  set:
    example: "His MAP dipped below sixty-five, so I'm titrating up now."
    exKo: "MAP가 65 밑으로 떨어져서 지금 올리고 있어요."
# --- 상황 11
- s: 11
  kind: pair
  set:
    pairs: [[rewarm, slowly], ["cause rebound", hyperkalemia], ["half a degree", "per hour"]]
    decoys: ["the cooling"]
    why: "재가온은 천천히(slowly) 해야 해요. 재가온하면 세포 안에 들어갔던 칼륨이 다시 나와 rebound hyperkalemia를 일으킬 수 있어요(cause rebound). 병원 프로토콜은 대개 시간당 0.25~0.5도, 곧 half a degree per hour 정도로 천천히 데워요."
- s: 11
  kind: context
  scene:
    1: {en: "Don't rewarm him any faster until his pressure is back up."}
    2: {en: "We will rewarm him at zero point two five degrees Celsius per hour per protocol."}
# --- 상황 14
- {s: 14, kind: context, scene: {1: {en: "Can you pull up the result from radiology?"}}}
# --- 상황 17
- s: 17
  kind: slider
  set:
    cue: 'Colleague: "His heart rate is thirty-eight at thirty-two degrees Celsius, and his MAP is down to fifty-five."'
    why: "목표체온 냉각(32~36도) 중에는 서맥이 흔하고, 혈압이 유지되면 보통 지켜봐요. 혈압이 떨어지면 의사와 목표체온을 약간 올려 가온할지 상의해요. 계획대로만 계속하거나 진정만 늘리는 건 원인을 다루지 않아요."
- s: 17
  kind: context
  scene: {2: {fix: "His heartbeat became dangerously fast, so we're treating it right away."}}
  set:
    why: "의료진끼리는 VT나 혈역학 같은 말로 상황을 바로 공유해요. 가족에게는 용어 대신 심장 박동이 위험하게 빨라져 지금 처치 중이라는 사실을 쉬운 말로 알려요."
# --- 상황 18
- s: 18
  kind: slider
  set:
    scale: ["He will be fine, I promise.", "The tests show it's very unlikely.", "There is absolutely no chance."]
    answerAt: 1
    why: "검사가 이미 나쁜 쪽을 가리킬 때 '아직 모른다'는 헛된 희망을 줘요. 가능성이 매우 낮다고 정직하게 말하되, 약속도 절대적인 단정도 하지 않아요."
    example: "The tests point to a poor chance of meaningful recovery."
    exKo: "검사 결과는 의미 있는 회복 가능성이 낮음을 가리켜요."
- s: 18
  kind: swap
  set:
    options: [poor, zero, strong]
    notes:
      poor: "검사가 나쁜 쪽을 가리키지만 아직 단정은 아니에요. 정직하면서 희망을 막지 않아요."
      zero: "전혀 없다는 단정이라 사실보다 무겁고, 아직 판정이 끝나지 않았다면 틀린 말이 돼요."
      strong: "검사 결과와 반대로 헛된 희망을 줘요."
# --- 상황 19
- s: 19
  kind: context
  scene:
    0: {en: "Per our policy, two physicians must confirm brain death independently."}
    2: {fix: "Two doctors have examined him separately and confirmed that his brain has completely stopped working. This means he has died. I'm so sorry."}
  addwhy: " 뇌사는 법적 사망이라 가족에게 'has died'를 한 번은 분명히 말해요."
# --- 상황 20
- s: 20
  kind: context
  scene: {2: {fix: "We'll help your family make the decision he would have wanted."}}
  set:
    why: "의료진끼리는 대리 결정이나 대리 판단 같은 법·윤리 용어로 말해요. 가족에게는 용어 대신, 그분이 원했을 결정을 함께 찾도록 돕겠다고 따뜻하게 전해요."

order:
- {s: 4, lines: {3: {en: "Once he's turned, I'll recheck his pain score.", ko: "체위를 바꾼 뒤 통증 점수를 다시 볼게요"}}}
- s: 6
  why: "냉각을 시작하고, 목표에 닿으면 유지 모드로 바꾸고, 그 상태를 빈틈없이 지키고, 범위 아래로 지나치지 않게 해요."
  lines:
    2: {en: "From there, we keep the temperature tightly controlled.", ko: "그때부터 체온을 빈틈없이 조절해 유지해요"}
    3: {en: "Holding it that tightly keeps us from overshooting below the range.", ko: "그렇게 빈틈없이 유지해야 범위 아래로 지나치지 않아요"}
- {s: 7, lines: {2: {en: "Its first steps are acetaminophen, buspirone, and counterwarming.", ko: "첫 단계는 아세트아미노펜, 부스피론, 대응가온이에요"}}}
- s: 8
  why: "도착 준비를 확인하고, 라인과 기도를 고정하고, 장비를 챙긴 뒤, 이송 중에는 호흡치료사가 기도를 맡고 저는 모니터와 드립을 봐요."
  lines:
    3: {en: "During transport, RT manages the airway while I watch the monitor and drips.", ko: "이송 중에는 호흡치료사가 기도를 맡고 저는 모니터와 드립을 지켜볼게요"}
- s: 9
  lines:
    0: {en: "His MAP dipped below sixty-five.", ko: "MAP가 65 밑으로 떨어졌어요"}
    3: {en: "Holding it there protects his brain after arrest.", ko: "그 수치를 지켜야 뇌를 보호해요"}
- s: 16
  why: "상황을 보고하고, 속도를 늦추며 수액을 주입하고, 그 위에 승압제를 시작한 뒤 혈압을 지켜봐요."
  lines:
    3: {en: "Once the pressor is running, I'll watch his pressure closely.", ko: "승압제가 들어가면 혈압을 지켜볼게요", note: "관찰"}
- {s: 20, lines: {3: {en: "With their help, the decision is still your family's.", ko: "그 도움을 받아도 결정은 가족 몫이에요"}}}
