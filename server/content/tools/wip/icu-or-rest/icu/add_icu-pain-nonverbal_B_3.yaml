- title: 신경병증성 통증 인지
  s:
  - {t: 신경병증성, i: bulb, w: "may be는 확정이 아니라 가능성을 말해요. 아편유사제에 반응이 약하다는 단서만으로 단정하지 않고 다른 원인을 의심하라는 완충이에요.", d: from the clinic, k: ["아편유사제에 잘 안 듣는 열은 신경병증성일 수 있어요.", "아편유사제에 잘 안 듣는 통증은 근육성일 수 있어요."], a: neuropathic, o: [muscular, cardiac, vascular]}
  - {t: 반응 부족, i: chartup, w: "even at은 극단적인 경우에도라는 강조예요. 높은 용량에도 좋아지지 않는다는 사실이 통증의 원인을 다시 따져 보게 하는 단서예요.", d: at the window, k: ["아편유사제를 높은 용량으로 줘도 구역이 나아지지 않아요.", "아편유사제를 받아도 통증이 나아지지 않아요."], a: high, o: [low, daily, usual]}
  - {t: 보조제 고려, i: pill, w: "Let's consider는 결정이 아니라 검토를 제안하는 말이에요. like gabapentin으로 보조진통제의 예를 들되, 시작은 처방자의 판단이에요.", d: from the shelf, k: ["가바펜틴 같은 보조진통제를 설명해봐요.", "가바펜틴 같은 보조진통제를 약국에 확인해봐요."], a: adjuvant, o: [antibiotic, diuretic, vaccine]}
  - {t: 다른 접근, i: bulb, w: "often이 늘 그런 건 아니라는 완충이에요. than opioids alone은 아편유사제 하나만 쓰는 것과 비교해 무엇이 더 필요한지를 말해요.", d: on the clipboard, k: ["근육성 통증은 아편유사제만으로는 안 되고 다른 접근이 필요할 때가 많아요.", "신경성 통증은 아편유사제만으로는 안 되고 같은 접근이 필요할 때가 많아요."], a: different, o: [cheaper, shorter, quieter]}
  - {t: 유형별 약, i: pill, w: "Different … need different …로 같은 말을 반복해 짝이 맞는다는 대응을 강조해요. 통증의 기전에 맞는 약을 고른다는 원칙이에요.", d: from the weekend crew, k: ["통증 유형이 다르면 다른 침대가 필요해요.", "통증 유형이 다르면 다른 간호사가 필요해요."], a: types, o: [rooms, hours, nurses]}
  - {t: 처방자 문의, i: speech, w: "ask … about …은 처방자에게 묻는다는 절차예요. 새 약은 간호사가 정하지 않고 의사에게 확인해서 시작해요.", d: in the stairwell, k: ["오늘 보조진통제 시작을 영양사에게 물어봐요.", "오늘 보조 체위 시작을 의사에게 물어봐요."], a: physician, o: [chaplain, volunteer, dietitian]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신경병증성 통증 4문장 순서
    why: 용량을 올려도 안 좋아지는 관찰이 먼저고, That이 그 관찰을 받아 신경병증성을 의심해요. That kind of pain이 그 통증을 가리켜 다른 접근이 필요하다고 하고, So로 의사에게 문의해요.
    lines:
    - {en: "His pain isn't improving even at high opioid doses.", icon: chartup, ko: "높은 용량에도 통증이 좋아지지 않아요", note: 관찰}
    - {en: "That makes us wonder if it's neuropathic.", icon: bulb, ko: "그래서 신경병증성인지 의심돼요", note: 의심}
    - {en: "That kind of pain often needs a different approach than opioids alone.", icon: pill, ko: "그런 통증은 다른 접근이 필요한 때가 많아요", note: 접근}
    - {en: "So let's ask the physician about starting an adjuvant today.", icon: speech, ko: "그러니 오늘 보조진통제를 의사에게 물어봐요", note: 문의}
- title: 만성통증·내성 환자 관리
  s:
  - {t: 기저 요구량, i: calendar, w: "raises는 원인이 결과를 끌어올린다는 동사예요. 입원 전부터 쓰던 약이 오늘 필요한 기본량을 높인다는 사실을 말해요.", d: at the nurses' door, k: ["집에서 쓰던 아편유사제 때문에 기저 체온이 높아졌어요.", "집에서 쓰던 아편유사제 때문에 기저 요구량을 설명했어요."], a: home, o: [work, office, school]}
  - {t: 병력 확인, i: calendar, w: "was taking은 과거 한동안 계속된 행동을 말하는 과거진행형이에요. long before가 기간의 길이를 강조해 내성 가능성을 짐작하게 해요.", d: from the lobby, k: ["입원하기 직전부터 집에서 아편유사제를 쓰고 있었어요.", "입원하기 오래전부터 집에서 비타민을 쓰고 있었어요."], a: opioids, o: [vitamins, antibiotics, steroids]}
  - {t: 과소치료 위험, i: shield, w: "Undertreating을 주어로 써서 덜 치료하는 것 자체가 위험을 부른다는 뜻을 짧게 말해요. 내성 환자에게 부족한 투여가 금단까지 이어진다는 경고예요.", d: in the stairwell hall, k: ["충분히 안 주면 낙상과 부족한 조절의 위험이 있어요.", "충분히 안 주면 금단과 부족한 기록의 위험이 있어요."], a: withdrawal, o: [infection, aspiration, bleeding]}
  - {t: 결과 예측, i: fire, w: "If … don't …, … will …은 조건과 결과를 잇는 기본 문형이에요. cravings는 약을 향한 강한 욕구로, 금단과 함께 나타날 수 있어요.", d: on the counter, k: ["충분히 안 주면 통증과 구역이 급증할 거예요.", "충분히 기록 안 하면 통증과 갈망이 급증할 거예요."], a: cravings, o: [coughing, bruising, dizziness]}
  - {t: 내성 반영, i: gear, w: "account for는 고려에 넣는다는 표현이에요. when we set은 용량을 정하는 시점에 반영한다는 뜻이고, 용량은 처방자와 함께 정해요.", d: on the rail, k: ["병상을 정할 때 내성을 반영해요.", "용량을 정할 때 내성을 설명해요."], a: doses, o: [beds, rooms, shifts]}
  - {t: 내성의 의미, i: chartup, w: "means 뒤에 결과를 이어 내성이 왜 높은 용량으로 이어지는지 설명해요. than most patients로 비교 기준을 보통 환자에 둬요.", d: from the lab, k: ["알레르기 때문에 대부분의 환자보다 더 높은 기저 용량이 필요해요.", "보험 때문에 대부분의 환자보다 더 높은 기저 용량이 필요해요."], a: tolerance, o: [allergy, insurance, diet]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 내성 환자 관리 4문장 순서
    why: 집에서 오래 써 온 병력이 먼저고, That history가 그 병력을 받아 기본 요구량이 오른다고 말해요. 둘째 That's가 그 오른 요구량을 내성이라 이름 붙이고, 마지막에 that이 내성을 가리켜 용량 결정에 반영해요.
    lines:
    - {en: "He was taking opioids at home long before he came in.", icon: calendar, ko: "입원 오래전부터 집에서 아편유사제를 썼어요", note: 병력}
    - {en: "That history raises his baseline requirement.", icon: chartup, ko: "그 병력이 기저 요구량을 높여요", note: 요구량}
    - {en: "That's tolerance — it means he may need a higher dose than most patients.", icon: gear, ko: "그게 내성이고 보통보다 높은 용량이 필요할 수 있어요", note: 내성}
    - {en: "We account for that when we set his doses.", icon: pill, ko: "용량을 정할 때 그걸 반영해요", note: 반영}
- title: 아편 유발 호흡억제 예방
  s:
  - {t: 지속 감시, i: monitor, w: "help + 동사원형은 ~하는 걸 돕는다는 틀이에요. early가 문장 끝에서 조기 발견의 가치를 강조해요.", d: from the cart, k: ["지속적인 산소포화도와 이산화탄소 감시가 억제를 일찍 기록하게 도와줘요.", "지속적인 산소포화도와 이산화탄소 감시가 감염을 일찍 발견하게 도와줘요."], a: capnography, o: [radiography, audiometry, endoscopy]}
  - {t: 천천히 적정, i: calendar, w: "Let's …는 함께 하자는 제안이고 and가 적정과 재평가를 한 세트로 묶어요. 호흡억제를 막으려면 올린 뒤 반응을 꼭 확인해야 해요.", d: on the whiteboard, k: ["천천히 정리하고 투여 사이 재평가해요.", "천천히 적정하고 환자 사이 재평가해요."], a: titrate, o: [rinse, stack, rename]}
  - {t: 즉시 인지, i: bell, w: "right away가 바로라는 뜻으로, 지속 감시가 있어야 가능한 약속이에요. we'll know는 감시 장치가 알려 주리라는 전제예요.", d: from the hall, k: ["혈압이 떨어지면 바로 알 수 있어요.", "호흡수가 떨어지면 바로 기록할 수 있어요."], a: know, o: [guess, hope, wonder]}
  - {t: 역전제 준비, i: shield, w: "just in case는 쓸 일이 없기를 바라면서 대비한다는 관용 표현이에요. available은 필요한 순간에 바로 쓸 수 있는 곳에 있다는 뜻이에요.", d: behind the door, k: ["혹시 몰라 베개를 준비해둬요.", "혹시 몰라 날록손 재고를 세어둬요."], a: naloxone, o: [bandages, pillows, linens]}
  - {t: 신중한 적정, i: shield, w: "so he doesn't …는 so + 부정문으로 피하려는 결과를 목적으로 말해요. carefully는 올리는 속도와 확인을 모두 신중히 한다는 뜻이에요.", d: on the sheet, k: ["너무 흥분되지 않도록 신중하게 적정해요.", "너무 진정되지 않도록 신중하게 확인해요."], a: sedated, o: [hungry, thirsty, bored]}
  - {t: 역전, i: siren, w: "the moment …는 그 즉시라는 접속어구예요. depression은 우울이 아니라 호흡 억제를 가리켜요. 날록손은 병원 프로토콜과 처방에 따라 써요.", d: on the wall, k: ["억제가 보이는 순간 날록손으로 역전시킨 걸 기록할게요.", "억제가 보이는 순간 날록손으로 역전시키는 법을 설명할게요."], a: reverse, o: [rinse, wrap, label]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 호흡억제 예방 4문장 순서
    why: 지속 감시 상태가 먼저고, 호흡수가 떨어지면 바로 안다는 점으로 이어요. That's why가 그 감시를 받아 신중하게 적정하고, 마지막 줄의 all of that이 앞의 모두를 받아 날록손을 최후의 대비로 둬요.
    lines:
    - {en: "He's on continuous SpO2 and capnography.", icon: monitor, ko: "지속적인 산소포화도와 이산화탄소 감시 중이에요", note: 감시}
    - {en: "If his respiratory rate drops, we'll know right away.", icon: bell, ko: "호흡수가 떨어지면 바로 알아요", note: 인지}
    - {en: "That's why we titrate carefully and reassess between doses.", icon: calendar, ko: "그래서 신중히 적정하고 투여 사이 재평가해요", note: 적정}
    - {en: "As a last backup to all of that, naloxone stays available.", icon: shield, ko: "그 모두의 마지막 대비로 날록손을 준비해둬요", note: 대비}
- title: 가족의 대리 통증 관찰 활용
  s:
  - {t: 가족 인정, i: handshake2, w: "You know him best로 가족의 지식을 먼저 인정하면 정보를 나누기 쉬워져요. helpful to know는 그 정보가 간호사에게 쓸모 있다는 감사의 표현이에요.", d: at the window, k: ["가족이 가장 잘 아세요 — 굳은 손을 알아보시는 게 도움이 돼요.", "가족이 가장 잘 아세요 — 찌푸린 이마를 적어두시는 게 도움이 돼요."], a: furrowed, o: [clenched, swollen, pale]}
  - {t: 관찰의 가치, i: star, w: "so + 절로 곁에 있는 시간이 관찰의 가치를 만든다는 이유를 말해요. matter는 중요하다는 뜻의 짧은 동사예요.", d: from the visitors, k: ["누구보다 곁에 계시니 식사하시는 게 중요해요.", "누구보다 곁에 계시니 보시는 게 어려워요."], a: observations, o: [wishes, questions, calls]}
  - {t: 알림 요청, i: speech, w: "Tell us if …로 가족에게 할 일을 명령 대신 조건으로 부탁해요. notice signs는 판단하라는 게 아니라 눈에 띈 것을 알려 달라는 부담 낮은 요청이에요.", d: on the board, k: ["불편한 징후를 알아차리시면 의사에게 말씀해주세요.", "불편한 소음을 알아차리시면 저희에게 말씀해주세요."], a: signs, o: [rooms, meals, visits]}
  - {t: 단서로 인정, i: bulb, w: "a real clue는 진짜 단서라는 뜻으로, 가족의 말이 근거로 쓰인다는 신뢰를 전해요. When you say로 가족의 말을 먼저 짚어 인정해요.", d: at the sink, k: ["괴로워 보인다고 말씀하시면 그게 저희에게 진짜 걱정이에요.", "피곤해 보인다고 말씀하시면 그게 저희에게 진짜 단서예요."], a: clue, o: [rule, plan, bill]}
  - {t: 사정에 반영, i: chartup, w: "add to는 기존 것 위에 보탠다는 구동사예요. 가족의 관찰이 대체가 아니라 CPOT 같은 도구 점수를 보완한다는 위치를 말해요.", d: in the room, k: ["가족의 관찰이 저희 영양 사정에 더해져요.", "가족의 질문이 저희 통증 사정에 더해져요."], a: assessment, o: [schedule, budget, menu]}
  - {t: 계속 소통, i: speech, w: "keep + -ing는 같은 행동을 계속한다는 틀이에요. throughout the shift로 한 번이 아니라 근무 내내라는 약속의 범위를 정해요.", d: on the floor, k: ["근무조 내내 계속 의사와 확인할게요.", "점심시간 내내 계속 가족과 확인할게요."], a: shift, o: [lunch, visit, weekend]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 가족 관찰 활용 4문장 순서
    why: 곁에 있는 가족의 관찰이 중요하다고 먼저 인정하고, 불편한 징후를 알려 달라고 부탁해요. 가족이 알려 준 것이 통증 사정에 들어간다고 whatever you tell us로 받고, 근무 내내 계속 확인하겠다고 닫아요.
    lines:
    - {en: "You know him best, so your observations matter.", icon: star, ko: "가장 잘 아시니 관찰이 중요해요", note: 인정}
    - {en: "Tell us if you notice signs he's uncomfortable.", icon: speech, ko: "불편한 징후를 보시면 말씀해주세요", note: 요청}
    - {en: "Whatever you tell us goes into our pain assessment.", icon: chartup, ko: "알려주신 건 통증 사정에 들어가요", note: 반영}
    - {en: "We'll keep checking in with you throughout the shift.", icon: handshake2, ko: "근무조 내내 계속 확인할게요", note: 약속}
- title: 급성 심한 통증 위기
  s:
  - {t: 급성 변화, i: siren, w: "just maxed out은 방금 최대치에 닿았다는 구어예요. something acute는 정확한 원인을 모르지만 급하다는 신호를 짧게 말해요.", d: at the nurses' desk, k: ["체온이 최고점을 찍었어요 — 급성으로 뭔가 일어나고 있어요.", "CPOT가 최고점을 찍었어요 — 가족이 뭔가 알아채고 있어요."], a: acute, o: [odd, rare, quiet]}
  - {t: 원인·진통, i: pill, w: "rule out은 의심되는 원인을 하나씩 지워 간다는 구동사예요. and로 원인 찾기와 진통을 동시에 진행한다는 뜻을 묶어요. 진통제는 처방에 따라 투여해요.", d: from the cart, k: ["허혈을 배제하고 긴급 상황을 알려드려요.", "허혈을 배제하고 긴급 약국에 확인해요."], a: ischemia, o: [arthritis, dermatitis, bruising]}
