  - [기록 약속, pencil, '''so the team can see…''로 기록하는 이유를 밝히면 기록이 개인 메모가 아니라 팀이 같이 쓰는 정보라는 점이 분명해져요.', for tonight, 가족이 추세를 볼 수 있게 반응을 기록해 둘게요., 팀이 일정을 볼 수 있게 반응을 기록해 둘게요., trend, schedule, color, budget]
  - [상태 설명, check, '''than they did an hour ago''로 비교 기준을 말하면 막연한 ''좋아 보여요''보다 믿을 만하게 들려요.', since lunch, 하루 전보다 수치가 더 좋아 보여요., 한 시간 전보다 기분이 더 좋아 보여요., hour, day, week, month]
  - [차트 표시, pushpin, '''flag''는 눈에 띄게 표시한다는 뜻이라 다음 근무자가 바로 알아봐요. ''as a responder''로 무엇으로 표시하는지 밝혀요.', about the bed, 화이트보드에 반응자로 표시해 둘게요., 차트에 연구 참여자로 표시해 둘게요., responder, volunteer, visitor, donor]
