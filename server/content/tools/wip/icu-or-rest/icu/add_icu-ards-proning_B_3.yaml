- title: 복와위 안전 전환 팀 협조
  s:
  - [역할 안내, me, '''hold''와 ''call''을 한 문장에 이어 말하면 내 역할이 둘이라는 점이 분명해요. 전환 중 기도를 맡은 사람이 구령을 맡으면 팀이 누구 말을 들을지 헷갈리지 않아요.', from the head, 제가 기도를 잡고 돌리는 횟수를 셀게요., 제가 기도를 잡고 돌리는 순서를 적을게요., airway, bedrail, mattress, pillow]
  - [역할 분담, shield, '''Each person''은 한 명도 빠지지 않는다는 뜻이고 ''their''가 담당을 나눠 놓았다는 뜻이에요. 돌리는 동안 라인이 당기면 빠질 수 있어요.', on the bed, 함께 씻기는 동안 각자 자기 담당 라인을 지켜요., 함께 기록하는 동안 각자 자기 담당 라인을 지켜요., guards, counts, labels, wipes]
  - [구령 안내, speaker, '''On three''는 셋을 센 순간 시작한다는 약속된 구령이라 모두가 같은 순간에 움직여요. ''smoothly''는 급하지 않게 한다는 뜻이에요.', to the left, 셋에 맞춰 부드럽게 그를 옆으로 눕힐게요., 셋에 맞춰 부드럽게 그를 머리 쪽으로 옮길게요., stomach, shoulder, knee, elbow]
  - [튜브 담당, gear, '''Whoever has the tube''는 이름이 아니라 맡은 일로 사람을 가리켜서 누구든 그 일을 하는 사람이 책임져요. ''the whole time''은 중간에 놓지 않는다는 뜻이에요.', by the door, 튜브를 맡은 사람이 내내 이름표를 달고 있어요., 튜브를 맡은 사람이 내내 장갑을 끼고 있어요., steady, dry, clean, quiet]
  - [대기 지시, bell, '''before we move''로 시점을 말하면 신호가 오기 전에는 아무도 움직이지 않아요. 짧은 명령형은 급할 때도 알아듣기 쉬워요.', at the foot, 움직이기 전에 제 질문을 기다려 주세요., 움직이기 전에 제 전화를 기다려 주세요., signal, answer, text, page]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 복와위 전환 협조 4문장 순서
    why: 기도를 맡은 사람이 먼저 역할을 말하고, 각자 담당을 지키며, 신호를 기다린 뒤 구령에 맞춰 돌려요.
    lines:
    - [I'll hold the airway and call the count for the roll., me, 제가 기도를 잡고 돌리는 구령을 외칠게요, 역할]
    - ['While I hold it, each person guards their own lines.', shield, 제가 잡고 있는 동안 각자 자기 라인을 지켜요, 분담]
    - ['Once everyone is set, wait for my signal before we move.', bell, 다 준비되면 움직이기 전에 제 신호를 기다려요, 대기]
    - ['On three, we roll him smoothly onto his stomach.', speaker, 셋에 맞춰 부드럽게 엎드려 눕혀요, 구령]
- title: 복와위 중 튜브·라인 관리
  s:
  - [라인 배치, compass, '''to avoid tension''으로 목적을 밝히면 라인을 어깨 위로 올리는 이유가 분명해져요. 라인이 당기면 빠지거나 아플 수 있어요.', to the side, 소음을 피하도록 라인을 어깨 위로 배치할게요., 불빛을 피하도록 라인을 어깨 위로 배치할게요., tension, noise, light, smell]
  - [정기 확인, check, '''every hour''는 시간 간격을 정해서 빠뜨리지 않겠다는 약속이에요. 깊이와 고정 두 가지를 함께 말해 무엇을 보는지 분명히 해요.', with the nurse, 매시간 튜브 깊이와 소독 상태를 확인할게요., 매시간 튜브 크기와 고정 상태를 확인할게요., depth, price, brand, size]
  - [배액 라인, gear, '''so nothing gets pinched''로 눌림이 위험이라는 이유를 말해요. 몸 아래 눌린 배액 라인은 흐름이 막힐 수 있어요.', from the wall, 몸 아래 눌리지 않게 수액 라인을 걸리지 않게 둬요., 몸 아래 눌리지 않게 배액 주머니를 걸리지 않게 둬요., pinched, wet, cold, lost]
  - [표시 확인, pencil, '''so I can spot''은 표시하는 이유를 알려 줘요. 입술 위치에 표시해 두면 튜브가 움직였을 때 한눈에 보여요.', on the chart, 입술 위치에 튜브를 표시해서 새는 곳을 바로 알아챌게요., 입술 위치에 튜브를 표시해서 막힘을 바로 알아챌게요., slipping, leaking, clogging, kinking]
  - [여유 확보, redo, '''enough slack''은 돌릴 때 라인이 당기지 않을 만큼 느슨하다는 뜻이에요. 돌리기 전에 미리 여유를 줘야 해요.', at the bedside, 씻기기 전에 모든 라인에 여유를 충분히 주세요., 돌리기 전에 모든 라인에 라벨을 충분히 붙여 주세요., slack, wire, ink, glue]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 튜브·라인 관리 4문장 순서
    why: 돌리기 전에 여유를 주고, 돌린 뒤 라인을 어깨 위로 배치하고, 눌림을 막은 다음, 이후 매시간 확인해요.
    lines:
    - ['Before we turn him, give every line enough slack.', redo, 돌리기 전에 모든 라인에 여유를 충분히 주세요, 여유]
    - ['Once he''s turned, let''s route the lines up over his shoulders.', compass, 돌린 뒤에는 라인을 어깨 위로 배치해요, 배치]
    - ['With the lines routed, keep the drainage lines free so nothing gets pinched.', gear, 배치가 끝나면 아무것도 눌리지 않게 배액 라인을 걸리지 않게 둬요, 눌림]
    - ['From then on, I''ll check the tube depth and securement every hour.', check, 그 뒤로는 매시간 튜브 깊이와 고정 상태를 확인할게요, 정기]
- title: 복와위 중 장관영양 관리
  s:
  - [영양 계획, coffee, '''but''으로 계속하되 조건을 붙인다는 뜻을 전해요. ''conservative''는 무리하지 않는다는 뜻이에요.', at night, 영양 공급은 계속하되 조명은 어둡게 유지할게요., 영양 공급은 계속하되 소음은 낮게 유지할게요., rate, lights, noise, temperature]
  - [자세 이유, stetho, '''helps reduce''는 위험을 없애는 것이 아니라 줄이는 것이라는 뜻이라 과장 없이 말해요. 머리를 높이면 위 내용물이 올라오기 어려워요.', on the left side, 역트렌델렌부르크 자세는 복와위 중 욕창 위험을 줄여줘요., 역트렌델렌부르크 자세는 복와위 중 감염 위험을 줄여줘요., aspiration, infection, bleeding, clotting]
  - [잔여량 감시, monitor, '''more closely''는 평소보다 더 자주, 더 꼼꼼히 본다는 뜻이에요. 엎드린 자세에서는 평소와 달라 더 주의해요.', from the tube, 이 체위에서는 소변 잔여물을 더 자세히 살펴볼게요., 이 체위에서는 얼굴 부종을 더 자세히 살펴볼게요., gastric, bile, sweat, tear]
  - [속도 조절, gear, '''a bit slower''로 크게 바꾸지 않고 조금만 늦춘다고 말해요. 엎드려 있으면 위가 눌려서 천천히 주는 쪽이 안전해요.', at noon, 엎드려 있는 동안은 영양 공급을 조금 더 늦게 줄게요., 엎드려 있는 동안은 물을 조금 더 느리게 줄게요., slower, later, warmer, colder]
  - [중단 기준, siren, '''If…, I''ll…''는 조건과 행동을 짝지어 말해서 언제 멈추는지 분명히 해요. 멈추는 일과 의사에게 알리는 일을 함께 말해요.', about the bed, 얼굴이 붉어 보이면 영양 공급을 멈추고 의사한테 연락할게요., 손이 차가워 보이면 영양 공급을 멈추고 의사한테 연락할게요., distended, irritated, bruised, wrinkled]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 엎드린 환자 영양 관리 4문장 순서
    why: 속도를 보수적으로 하겠다고 먼저 말하고, 머리를 높여 흡인 위험을 더 줄인 뒤, 잔여량을 살피고, 이상이 있으면 멈추고 알려요.
    lines:
    - ['We can continue feeds, but let''s keep the rate conservative.', coffee, 영양 공급은 계속하되 속도는 보수적으로 유지해요, 속도]
    - ['To lower his aspiration risk further, we raise his head with reverse Trendelenburg.', stetho, 흡인 위험을 더 줄이려고 역트렌델렌부르크로 머리를 높여요, 자세]
    - ['With the head raised like that, I''ll monitor his gastric residuals more closely.', monitor, 그렇게 머리를 높인 채 위 잔여물을 더 자세히 살펴볼게요, 감시]
    - ['If those residuals are high or his belly looks distended, I''ll hold the feeds and call the doctor.', siren, 잔여물이 많거나 배가 팽창돼 보이면 영양 공급을 멈추고 의사한테 연락할게요, 중단]
- title: 신경근차단제 병용 감시
  s:
  - [진정 원칙, shield, '''Because he''s paralyzed''로 이유를 먼저 말하면 뒤에 오는 ''must''가 규칙이 아니라 필요라는 점이 전해져요. 마비 환자는 아파도 움직여 알릴 수 없어요.', during rounds, 열이 높으니 항상 깊이 진정돼 있어야 해요., 통증이 심하니 항상 깊이 진정돼 있어야 해요., sedated, fed, rested, cooled]
  - [TOF 확인, magnify, '''to confirm''은 눈으로 대충 보지 않고 수치로 확인한다는 뜻이에요. train-of-four는 근육 반응으로 차단 정도를 보는 검사예요.', with the monitor, TOF를 확인해서 신경근차단제 수준을 가족께 설명해 드릴게요., TOF를 확인해서 신경근차단제 수준을 차트에 옮길게요., paralytic, oxygen, glucose, sodium]
  - [금지 원칙, lock, '''never let''은 예외 없이 막겠다는 강한 말이고 ''under-sedated or aware'' 두 위험을 짝지어 말해요. 마비된 채 깨어 있으면 환자가 고통을 느끼면서도 알릴 수 없어요.', for long, 마비된 환자가 열이 나거나 의식이 있게 두지 않아요., 마비된 환자가 진정이 부족하거나 배고프게 두지 않아요., aware, hungry, cold, wet]
  - [기록 약속, pencil, '''after every check''는 매번 빠짐없이 적는다는 뜻이에요. 수치를 기록해 두면 교대한 사람이 변화를 이어서 볼 수 있어요.', for the unit, 확인할 때마다 TOF 수치를 소리 내어 읽을게요., 확인할 때마다 맥박 수치를 기록할게요., count, owner, price, size]
  - [용량 조정, pill, '''If…come back too soon''으로 조건을 먼저 말하면 용량을 올리는 일이 기준이 있는 판단이라는 점이 분명해요.', at that time, 열이 너무 빨리 돌아오면 용량을 늘릴게요., 땀이 너무 빨리 돌아오면 용량을 늘릴게요., twitches, fevers, sweats, tears]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신경근차단제 감시 4문장 순서
    why: 마비 환자는 항상 깊이 진정해야 한다는 원칙을 먼저 말하고, 검사로 확인하고, 기록하고, 그 기록으로 용량을 조정해요.
    lines:
    - ['Because he''s paralyzed, he must be deeply sedated at all times.', shield, 마비돼 있으니 항상 깊이 진정돼 있어야 해요, 원칙]
    - ['To make sure that stays true, I''ll check the train-of-four.', magnify, 그게 지켜지는지 TOF를 확인할게요, 확인]
    - ['Whatever the count is, I''ll document it after every check.', pencil, 수치가 얼마든 확인할 때마다 기록할게요, 기록]
    - ['If the documented counts show his twitches coming back too soon, I''ll increase the dose.', pill, 기록된 수치에서 씰룩임이 너무 빨리 돌아오면 용량을 늘릴게요, 조정]
