      - en: minute
      - en: second
      - en: decade
  - en: Follow my finger with just your eyes, please.
    ko: 눈으로만 제 손가락을 따라와 주세요.
    chunks:
    - Follow my finger
    - with just your eyes
    - ', please'
    - .
    words:
    - w-follow
    - w-finger
    - w-eye
    goal: 1
    tag: 눈 따라가기
    icon: magnify
    why: '''just your eyes''로 범위를 정하면 고개를 돌리지 않고 눈만 움직이면 된다는 걸 알아요. ''please''를 끝에 붙이면 지시가 부드러워져요.'
    decoy: my badge
    distractorsKo:
    - 눈으로만 제 손바닥을 따라와 주세요.
    - 고개로만 제 손가락을 따라와 주세요.
    blank:
      answer: eyes
      options:
      - en: eyes
      - en: ears
      - en: lips
      - en: chin
  - en: Take your time, there's no rush to answer.
