    lines:
    - en: I'm going to check your strength, so please squeeze both of my hands.
      icon: stetho
      ko: 힘을 확인할 테니 제 두 손을 꽉 쥐어 보세요
      note: 근력
    - en: Nice and firm. Now tell me what month it is.
      icon: calendar
      ko: 좋아요 단단하네요 이제 지금 몇 월인지 말해 주세요
