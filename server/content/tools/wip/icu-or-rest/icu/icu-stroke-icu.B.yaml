    - w-strength
    - w-squeeze
    - w-hand
    goal: 1
    tag: 근력 사정
    icon: stetho
    why: '''so please''로 이유를 먼저 말하고 요청을 이으면 왜 쥐라는지 알고 따라 해요. ''both''는 양쪽 힘을 견줘 본다는 신호예요.'
    decoy: both of my feet
    distractorsKo:
    - 힘을 확인할 테니 제 두 손가락을 꽉 쥐어 보세요.
    - 힘을 확인할 테니 제 한 손을 꽉 쥐어 보세요.
    blank:
      answer: strength
