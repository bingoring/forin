  - ["상태 보고", siren, "keeps …ing는 같은 일이 되풀이되고 있다는 뜻이에요. on his current feeds로 지금 쓰는 급식 방식에서 일어난다는 점을 밝혀요.", "on his current meds", "지금 급식으로 계속 구토를 하고 있어요.", "지금 약으로 계속 흡인이 되고 있어요.", "aspirating", "sleeping", "smiling", "waving"]
