# 태그 빼기: "상황.문장": [뺄 단어 id]
untag:
  "6.4": [w-hold]
  "16.2": [w-hold]
  "16.3": [w-hold]
  "18.3": [w-hold]
  "11.2": [w-supply]
  "20.1": [w-bag]
nuance:
  "1.1":
    kind: context
    words: [w-reserve]
    word: reserve
    ko: 예비분
    scenes:
      - {who: 동료 간호사, icon: monitor, en: "Can you double-check the oxygen reserve before we leave?", ok: true}
      - {who: 의사에게 보고, icon: stetho, en: "He's on 4 liters, and I've calculated the oxygen for the trip plus reserve.", ok: true}
      - who: 보호자에게
        icon: me
        en: "The portable cylinder has a calculated reserve of 1,200 PSI for the full trip."
        ok: false
        fix: "He'll have plenty of oxygen with him the whole way, plus some extra."
    why: 의료진끼리는 reserve(예비분)를 숫자와 함께 말해도 통해요. 가족에게 calculated reserve, PSI는 어렵게 들려요. 충분히 챙겼고 여분도 있다고 쉬운 말로 알려요.
  "7.1":
    kind: context
    words: [w-pressor]
    word: pressor
    ko: 승압제
    scenes:
      - {who: 동료 간호사, icon: monitor, en: "Check that the pressor is on battery before we unplug it.", ok: true}
      - {who: 의사에게 보고, icon: stetho, en: "The pressor is running on battery and his MAP is at goal.", ok: true}
      - who: 보호자에게
        icon: me
        en: "His pressor is on a lithium battery that guarantees uninterrupted delivery."
        ok: false
        fix: "The medicine that supports his blood pressure has its own battery, so it keeps going while we move him."
    why: 의료진끼리는 pressor처럼 짧게 말해도 통해요. 가족에게 pressor, lithium은 낯설고, guarantees는 지킬 수 없는 장담이에요. 혈압을 받치는 약이 배터리로 계속 들어간다고 쉬운 말로 알려요.
  "18.1":
    kind: context
    words: [w-brisk]
    word: brisk
    ko: 급격한
    scenes:
      - {who: 시술 의사에게, icon: stetho, en: "The bleeding is brisk, and I'm holding direct pressure.", ok: true}
      - {who: 동료 간호사, icon: monitor, en: "It's brisk — where's it coming from? Hand me gauze.", ok: true}
      - who: 보호자에게
        icon: me
        en: "Her bleeding is brisk with hemodynamic compromise."
        ok: false
        fix: "She's bleeding more than we expected, so we're pressing on it and getting more help right now."
    why: 의료진끼리는 brisk 한 단어로 출혈 속도를 바로 알아요. 가족에게 brisk, hemodynamic compromise는 낯설고 무섭게 들려요. 출혈이 예상보다 많아서 누르고 있고 도움을 더 부르고 있다고 쉬운 말로 알려요.
  "19.1":
    kind: context
    words: [w-zone]
    word: zone
    ko: 구역
    scenes:
      - {who: 의사에게 보고, icon: stetho, en: "She's out of Zone IV, and the area is safe for the code cart.", ok: true}
      - {who: 동료 간호사, icon: monitor, en: "Is the safe zone past those double doors?", ok: true}
      - who: 보호자에게
        icon: me
        en: "We moved her out of Zone IV because of the ferromagnetic hazard."
        ok: false
        fix: "We're taking her out of the scanner room so we can help her safely."
    why: 의료진끼리는 Zone IV·safe zone처럼 구역 이름으로 바로 통해요. 가족에게 Zone IV, ferromagnetic hazard는 낯설고 무섭게 들려요. 안전하게 도우려고 검사실 밖으로 옮긴다고 쉬운 말로 알려요.
slider:
  "0.0":
    cue: "Resident: 'His MAP is 66 on the same pressor dose, sat is 94, and his heart rate keeps creeping up.'"
  "4.0":
    scale: [dipping, dropping, plummeting]
    why_prefix: "잠깐 내려갔다 돌아오면 dipping이고, "
  "5.0":
    cue: "Her eyes are open, she's answering clearly, and she's asking what time it is."
  "11.0":
    scale: [sterile, clean, contaminated]
    answerAt: 2
    why: 무균 물품이 무균이 아닌 침대 난간에 닿으면 contaminated예요. 그대로 쓰지 말고 새것으로 바꾸고 시술자에게 알려요. clean은 눈에 보이는 오염이 없다는 정도라서 무균과는 달라요.
    example: "The tray touched the rail, so it's contaminated now."
    exKo: 트레이가 난간에 닿아서 이제 오염됐어요.
  "20.0":
    why_replace: ["20퍼센트쯤 줄어든 running low", "20퍼센트쯤 남은 running low"]
pair:
  "9.0":
    why_replace: ["둘 다 약효가 역전제보다 오래 갈 수 있어서", "오피오이드·벤조디아제핀의 효과가 역전제보다 오래 갈 수 있어서"]
