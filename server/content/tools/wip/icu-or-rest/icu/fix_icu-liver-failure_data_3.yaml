why:
  "7.1": "'I'll have blood available'은 필요할 때 바로 쓰도록 미리 챙겨 둔다는 뜻이에요. 'carefully'는 서두르지 않고 빈틈없이 누른다는 뜻이에요. 응고가 약하면 부위가 오래 새서 압박을 끝까지 유지해요."
  "8.0": "'closely'는 한 번 보고 끝내지 않고 계속 살핀다는 뜻이에요. 신경학적 검진의 의식 변화가 먼저 오고, 동공 변화는 더 늦은 신호라 둘을 함께 봐요."
  "10.0": "'whether he's a candidate'는 아직 결정이 아니라 평가 중이라는 점을 정직하게 말해요. 'whether'는 결과를 미리 말하지 않아서 가족이 섣부르게 기대하거나 실망하지 않게 해요."
  "13.1": "'carefully'는 서두르지 않고 조금씩 맞춘다는 뜻이에요. 'based on'은 조정의 근거를 밝히는 말이에요."
  "13.2": "'tailor'는 옷을 맞추듯 개인에게 맞춘다는 뜻이에요. 영양사가 간 상태와 근육량을 함께 보고 정한다는 점을 한 단어로 전해요."
