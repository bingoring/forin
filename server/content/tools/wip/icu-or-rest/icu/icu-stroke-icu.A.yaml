situations:
- title: NIHSS 신경 사정
  sentences:
  - en: I'm going to check your strength, so please squeeze both of my hands.
    ko: 힘을 확인할 테니 제 두 손을 꽉 쥐어 보세요.
    chunks:
    - I'm going to check
    - your strength
    - ', so please squeeze'
    - both of my hands
    - .
    words:
    - w-check
    - w-strength
    - w-squeeze
    goal: 1
  - en: Can you tell me where you are and what month it is?
    ko: 여기가 어디인지, 지금 몇 월인지 말씀해 주시겠어요?
    chunks:
    - Can you tell me
    - where you are
    - and what month
    - it is
    - '?'
    words:
    - w-tell
    - w-month
    goal: 1
  - en: Follow my finger with just your eyes, please.
    ko: 눈으로만 제 손가락을 따라와 주세요.
    chunks:
    - Follow my finger
    - with just your eyes
    - ', please'
    - .
    words:
    - w-follow
    - w-finger
    - w-eye
    goal: 1
  - en: Take your time, there's no rush to answer.
    ko: 천천히 하셔도 돼요, 서두르지 않으셔도 됩니다.
    chunks:
    - Take your time
    - ', there''s no rush'
    - to answer
    - .
    words:
    - w-rush
    - w-answer
    goal: 1
  - en: It's okay if the word won't come — you can point instead.
    ko: 말이 안 나와도 괜찮아요, 대신 손으로 가리키셔도 돼요.
    chunks:
    - It's okay
    - if the word won't come
    - — you can point
    - instead
    - .
    words:
    - w-word
    - w-point
    goal: 1
  - en: I'll stand on your right side so you can see me.
    ko: 제가 보이시도록 오른쪽에 서 있을게요.
    chunks:
    - I'll stand
    - on your right side
    - so you can
    - see me
    - .
    words:
    - w-stand
    - w-side
    goal: 1
  nuance:
  - kind: slider
    words:
    - w-strength
    cue: His left arm lifts off the bed, but he can't push back against the nurse's hand.
    scale:
    - normal strength
    - reduced strength
    - no strength
    answerAt: 1
    why: 들어 올릴 수는 있어도 저항을 이기지 못하면 힘이 줄어든 상태예요. NIHSS 운동 항목은 중력을 이기는지, 저항에 버티는지를 보므로 본 대로 구체적으로 기록하고, 전보다 약해졌다면 바로 팀에 알려요.
    example: His strength is reduced on the left.
    exKo: 왼쪽 힘이 떨어져 있어요.
  - kind: context
    words:
    - w-point
    word: point
    ko: 가리키다
    scenes:
    - who: 침상 옆에서
      icon: me
      en: It's okay if the word won't come — you can point instead.
      ok: true
    - who: 차트 기록
      icon: board
      en: Unable to name objects, but able to point to each one correctly.
      ok: true
    - who: 환자에게
      icon: me
      en: Please point to the object so we can document your expressive aphasia.
      ok: false
      fix: If the word won't come, just point to what you mean.
    why: 의료진끼리는 aphasia 같은 용어가 정확하고 빨라요. 말이 막혀 불안한 환자에게는 같은 point를 용어 없이, 부담 주지 않는 말로 건네세요.
  - kind: swap
    words:
    - w-rush
    who: 환자에게 · 사정 안내
    icon: me
    before:
    - 'Take your time, '
    - answer as fast as you can
    - .
    options:
    - there's no rush to answer
    - answer as fast as you can
    - please respond at your earliest convenience
    answer: there's no rush to answer
    notes:
      there's no rush to answer: 서두르지 않아도 된다고 분명히 알려 줘서 긴장을 풀어 줘요.
      answer as fast as you can: 앞의 'Take your time'과 부딪히고, 말이 막힌 환자를 더 조급하게 해요.
      please respond at your earliest convenience: 격식 차린 업무 문구라 침상에서는 어색하게 들려요.
    why: 말이 잘 안 나오는 환자는 조급해지기 쉬워서, 답할 시간이 충분하다고 직접 말해 주는 것이 사정에도 도움이 돼요.
    ko: 천천히 하셔도 돼요, 서두르지 않으셔도 돼요
