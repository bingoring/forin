  - [인원 안내, me, '''at least''로 하한을 말하면 사람이 모자라 위험해지는 일이 없도록 분명히 해요. ''safely''가 인원이 필요한 이유예요.', with the bed, 침대를 안전하게 옮기려면 최소 다섯 명이 필요해요., 그를 안전하게 씻기려면 최소 다섯 명이 필요해요., safely, quickly, quietly, early]
  - [패딩 요청, bandage, '''before we roll''은 돌리기 전에 끝내라는 시점 표시예요. 눌리기 쉬운 부위를 하나씩 짚어 말하면 빠뜨리지 않아요.', for his arms, '돌리기 전에 흉부, 골반, 얼굴에 댈 패딩이 마른지 봐 주세요.', '돌리기 전에 흉부, 골반, 얼굴에 댈 패딩 개수를 세어 주세요.', padding, tape, lotion, gauze]
  - [고정 안내, check, '''Let''s secure''는 함께 하자는 제안형이고, ''all''이 하나도 빠뜨리지 않겠다는 뜻이에요. 돌리는 동안 라인이 당기면 빠질 수 있어요.', by hand, 시작하기 전에 모든 라인과 튜브에 라벨을 붙일게요., 시작하기 전에 모든 라인과 튜브를 닦아 둘게요., secure, label, wipe, weigh]
  - [물품 부탁, speech, '''Can you…?''는 정중한 부탁이고 ''extra''가 이미 있는 것에 더 필요하다는 뜻이에요.', from supply, '돌릴 때 쓸 담요를 좀 더 가져다줄래요?', '돌릴 때 쓸 수건을 좀 더 가져다줄래요?', pillows, towels, gowns, masks]
  - [기도 확인, stetho, '''before anyone moves him''은 확인이 모든 움직임보다 앞선다는 뜻이에요. 돌리기 전에 기도가 안전한지 아는 것이 먼저예요.', with the nurse, 누구든 움직이기 전에 문부터 닫을게요., 누구든 움직이기 전에 커튼부터 칠게요., airway, door, curtain, window]
