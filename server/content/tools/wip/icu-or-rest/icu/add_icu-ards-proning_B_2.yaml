- title: 복와위 중 압박점 관찰
  s:
  - [피부 확인, magnify, '''for pressure areas''로 무엇을 찾는지 목적을 밝히면 확인 항목이 분명해져요. 엎드린 자세에서는 이마·뺨·흉부가 눌려요.', at the bedside, '이마, 뺨, 흉부에 붙은 테이프가 있는지 확인할게요.', '이마, 뺨, 흉부에 물기가 있는지 확인할게요.', forehead, shin, heel, elbow]
  - [체위 변경, redo, '''every couple of hours''는 대략의 주기를 편하게 말하는 표현이에요. 같은 곳이 오래 눌리지 않게 하는 것이 목적이라 ''to relieve pressure''를 붙여요.', for his arms, 압박을 완화하려고 두어 시간마다 머리 수건을 바꿔줘요., 압박을 완화하려고 두어 시간마다 침대 시트를 바꿔줘요., head, hips, arms, legs]
  - [즉시 조치, bandage, '''right away''는 발적이 보이면 미루지 않고 조정한다는 뜻이에요. ''needs padding adjusted''는 수동 구조로 무엇이 필요한지를 앞에 둬요.', on the pillow, 얼굴에 멍이 있으면 바로 패딩을 조정해야 해요., 얼굴에 땀이 있으면 바로 패딩을 조정해야 해요., redness, sweat, hair, stubble]
  - [숨은 부위, magnify, '''too''로 눈에 잘 띄는 곳에 더해 가려진 곳도 본다는 뜻을 덧붙여요. 장비 밑 피부는 눌려도 늦게 발견돼요.', for leaks, 튜브와 마스크 밑도 같이 닦고 있어요., 튜브와 마스크 끈도 같이 확인하고 있어요., mask, strap, tape, cap]
  - [분산 방법, redo, '''spread out''은 한곳에 모인 힘을 나눈다는 그림이 떠올라요. 머리를 좌우로 돌려 눌리는 곳을 번갈아 바꿔요.', up and down, 압박을 분산시키려고 팔을 좌우로 돌려줘요., 압박을 분산시키려고 베개를 좌우로 돌려줘요., rotate, tilt, lift, hold]
