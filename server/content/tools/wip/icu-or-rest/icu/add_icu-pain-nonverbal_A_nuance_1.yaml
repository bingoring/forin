- situation: "CPOT 통증 사정"
  items:
    - kind: slider
      words: [w-tension, w-rigid, w-muscle]
      cue: "Nurse: \"When I bend his arm, he pushes back hard and I can't finish the movement.\""
      scale: [relaxed, tense, rigid]
      answerAt: 2
      why: "CPOT 근긴장 항목은 팔을 수동으로 굽혀 볼 때의 저항을 봐요. 저항이 없으면 relaxed, 저항이 있어도 움직여지면 tense, 강하게 버텨서 끝까지 움직일 수 없으면 rigid예요."
      example: "His arm is rigid when I try to bend it."
      exKo: "팔을 굽히려고 하면 뻣뻣하게 굳어 있어요."
    - kind: context
      words: [w-score]
      word: score
      ko: 점수
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "His CPOT score is four — treat that as pain until proven otherwise.", ok: true}
        - {who: 차트 기록, icon: board, en: "CPOT score 4 at rest: grimacing, tense, fighting the vent.", ok: true}
        - {who: 보호자에게, icon: me, en: "His CPOT score on the vent is a four out of eight.", ok: false, fix: "He's showing signs of pain, like grimacing and tensing, so we're giving him pain medicine."}
      why: "의료진끼리는 CPOT 점수를 숫자로 말하면 정확하고 빨라요. 가족에게는 척도 이름과 숫자가 낯서니, 환자가 어떤 모습이고 무엇을 해 주는지를 쉬운 말로 풀어 줘요."
- situation: "BPS 등 행동척도 이해"
  items:
    - kind: pair
      words: [w-behavioral, w-scale, w-vent, w-compliance]
      pairs: [[behavioral, scale], [vent, compliance], [facial, expression]]
      decoys: [speaking]
      why: "behavioral scale은 말 대신 행동으로 재는 척도이고, vent compliance는 인공호흡기 숨에 환자가 맞춰 오는 정도예요. facial expression(표정)은 BPS와 CPOT가 공통으로 보는 항목이에요."
    - kind: context
      words: [w-scale]
      word: scale
      ko: 척도
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Our unit uses the BPS scale, so let's chart that one.", ok: true}
        - {who: 차트 기록, icon: board, en: "Pain assessed with the BPS scale: facial 3, limbs 2, vent compliance 2.", ok: true}
        - {who: 보호자에게, icon: me, en: "We scored his pain on the BPS scale, and his upper limb score was a two.", ok: false, fix: "We watch his face and how his arms move to tell how much pain he's in."}
      why: "BPS는 표정·팔 움직임·인공호흡기 순응 세 항목을 각각 1~4점으로 매겨요. 의료진끼리는 항목별 점수를 말해야 정확하지만, 가족에게는 무엇을 보는지부터 쉬운 말로 알려 줘요."
- situation: "진통제 정규 투여·기록"
  items:
    - kind: slider
      words: [w-schedule, w-prn, w-atc]
      cue: "Order: \"Acetaminophen every six hours, whether or not he seems to hurt.\""
      scale: [PRN, scheduled, continuous infusion]
      answerAt: 1
      why: "시간을 정해 놓고 주면 scheduled예요. 환자에게 필요할 때만 주도록 처방하면 PRN, 펌프로 쉬지 않고 계속 들어가면 continuous infusion이에요. 통증이 예상되면 정해진 시간에 주는 편이 뚫고 올라오는 통증을 줄여요."
      example: "He's on scheduled acetaminophen every six hours."
      exKo: "아세트아미노펜을 여섯 시간마다 정해 놓고 투여 중이에요."
    - kind: context
      words: [w-dose]
      word: dose
      ko: 투여(량)
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "I gave his morning dose at eight and he's resting.", ok: true}
        - {who: 차트 기록, icon: board, en: "Hydromorphone dose given per order at 0800; CPOT 1 at 0830.", ok: true}
        - {who: 보호자에게, icon: me, en: "His next dose is q4h IV hydromorphone.", ok: false, fix: "He'll get his next pain medicine in a little while, so he stays comfortable."}
      why: "의료진끼리는 약 이름과 투여 간격을 줄여 말해도 통해요. 가족에게는 q4h 같은 약어가 낯서니, 언제쯤 무엇을 받는지만 쉬운 말로 알려 줘요."
- situation: "처치 전 예방 진통"
  items:
    - kind: pair
      words: [w-premedicate, w-procedural, w-turn]
      pairs: [[pre-medicate, before the procedure], [procedural, pain], [turn, onto his side]]
      decoys: [at the clock]
      why: "pre-medicate는 처치 전에 미리 약을 준다는 뜻이라 before the procedure와 함께 써요. procedural pain은 처치 때 생기는 통증이고, turn은 몸을 옆으로 돌려 눕힐 때 쓰는 동사예요."
    - kind: swap
      words: [w-premedicate]
      who: "환자에게 · 처치 전 안내"
      icon: me
      before: ["I'm going to ", "pre-medicate you", " before the dressing change."]
      options: [give you pain medicine, pre-medicate you, sedate you heavily]
      answer: give you pain medicine
      notes: {give you pain medicine: "환자에게 쉬운 말. 무엇을 왜 주는지 바로 알아들어요.", pre-medicate you: "의료진끼리 쓰는 말. 환자는 무슨 뜻인지 몰라 불안할 수 있어요.", sedate you heavily: "목적은 통증을 줄이는 것인데 '재우겠다'로 들려 겁을 줘요. 사실과도 달라요."}
      why: "처치 전에 약을 준다는 사실은 같아도, 환자에게는 '무엇을 주는지'를 쉬운 말로 말하는 편이 안심시켜요."
      ko: 처치 전에 통증약을 드릴게요
- situation: "편안한 체위·환경"
  items:
    - kind: slider
      words: [w-tension, w-calm]
      cue: "Nurse: \"His shoulders are tight and his brow is furrowed, but he settles when we reposition him.\""
      scale: [relaxed, tense, rigid]
      answerAt: 1
      why: "어깨가 굳고 이마를 찌푸리다가 체위를 바꾸면 풀리는 정도면 tense예요. 힘이 완전히 빠져 있으면 relaxed, 팔다리가 막대처럼 굳어 움직이지 않으면 rigid예요. 체위 변경이나 베개 같은 비약물 방법도 통증을 줄이는 중재예요."
      example: "His shoulders look tense until we reposition him."
      exKo: "체위를 바꿔 주기 전까지 어깨가 긴장돼 보여요."
    - kind: context
      words: [w-comfortable]
      word: comfortable
      ko: 편안한
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Is he comfortable now, or still grimacing?", ok: true}
        - {who: 차트 기록, icon: board, en: "Repositioned with pillows; appears comfortable, CPOT 1.", ok: true}
        - {who: 보호자에게, icon: me, en: "He's comfortable by CPOT criteria, with no nociceptive behaviors observed.", ok: false, fix: "He looks peaceful now, and we'll keep checking that he stays that way."}
      why: "의료진끼리는 CPOT 같은 기준에 맞춰 '편안하다'고 기록하고 말해요. 가족에게는 기준 이름과 전문 용어보다 환자의 모습과 앞으로 할 일을 쉬운 말로 알려 줘요."
