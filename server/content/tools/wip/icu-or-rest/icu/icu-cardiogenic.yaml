situations:
- title: 심인성 쇼크 초기 사정
  sentences:
  - en: I'm checking your breathing, blood pressure, and circulation.
    ko: 숨쉬는 것, 혈압, 순환을 확인하고 있어요.
    chunks:
    - I'm checking
    - your breathing
    - ', blood pressure'
    - ', and circulation'
    - .
    words:
    - w-check
    - w-breathing
    - w-blood
    - w-pressure
    - w-circulation
    goal: 1
    tag: 사정 안내
    icon: stetho
    why: 지금 하는 일을 소리 내어 말하면 불안한 환자가 상황을 따라올 수 있어요. 호흡·혈압·순환은 쇼크 사정의 기본 세 축이에요.
    decoy: your temperature
    distractorsKo:
    - 숨쉬는 것, 혈압, 의식을 확인하고 있어요.
    - 숨쉬는 것, 피부, 순환을 확인하고 있어요.
    blank:
      answer: circulation
      options:
      - en: circulation
      - en: hearing
      - en: vision
      - en: swallowing
  - en: Your blood pressure is a little low right now.
    ko: 지금 혈압이 조금 낮아요.
    chunks:
    - Your blood pressure
    - is
    - a little low
    - right now
    - .
    words:
    - w-blood
    - w-pressure
    - w-low
    goal: 1
    tag: 상태 설명
    icon: chartup
    why: 수치를 숨기지 않고 'a little low'로 정도를 함께 전하면 사실을 알리면서도 환자가 놀라지 않게 해요.
    decoy: this morning
    distractorsKo:
    - 지금 심박이 조금 빨라요.
    - 지금 산소가 조금 낮아요.
    blank:
      answer: pressure
      options:
      - en: pressure
      - en: sugar
      - en: count
      - en: flow
  - en: I can hear some fluid in your lungs, so we'll help with that.
    ko: 폐에 물이 조금 찬 소리가 들려서, 저희가 도와드릴게요.
    chunks:
    - I can hear
    - some fluid in your lungs
    - ', so we''ll help'
    - with that
    - .
    words:
    - w-hear
    - w-fluid
    - w-lung
    - w-help
    goal: 1
    tag: 소견 설명
    icon: stetho
    why: '''hear''로 직접 들은 소견임을 밝히고 ''we''ll help''를 바로 붙여, 나쁜 소견을 알리면서 곧 도움이 간다는 점을 전해요.'
    decoy: some noise in your chest
    distractorsKo:
    - 배에 물이 조금 찬 소리가 들려서, 저희가 도와드릴게요.
    - 폐에 물이 조금 찬 소리가 들려서, 저희가 알려드릴게요.
    blank:
      answer: fluid
      options:
      - en: fluid
      - en: air
      - en: dust
      - en: smoke
  - en: I'm listening to your heart and lungs closely.
    ko: 심장과 폐 소리를 자세히 들어볼게요.
    chunks:
    - I'm listening
    - to your heart
    - and lungs
    - closely
    - .
    words:
    - w-listen
    - w-heart
    - w-lung
    - w-closely
    goal: 1
    tag: 청진 안내
    icon: stetho
    why: '''closely''를 문장 끝에 붙여 서두르지 않고 꼼꼼히 듣는다는 인상을 줘요. 청진 전에 하는 말은 환자의 긴장을 풀어 줘요.'
    decoy: to your back
    distractorsKo:
    - 배와 폐 소리를 자세히 들어볼게요.
    - 심장과 등 소리를 자세히 들어볼게요.
    blank:
      answer: closely
      options:
      - en: closely
      - en: quickly
      - en: casually
      - en: lightly
  - en: Squeeze my hand if you can hear me.
    ko: 제 목소리 들리시면 제 손을 꽉 쥐어보세요.
    chunks:
    - Squeeze my hand
    - if you can
    - hear me
    - .
    words:
    - w-squeeze
    - w-hear
    goal: 1
    tag: 의식 확인
    icon: me
    why: 말 대신 손을 쥐게 하면 말을 못 하는 환자도 반응할 수 있어요. 'if you can hear me'는 그 반응을 의식 확인으로 연결해요.
    decoy: Lift your hand
    distractorsKo:
    - 제 목소리 들리시면 제 눈을 보세요.
    - 제 목소리 들리시면 제 발을 꽉 쥐어보세요.
    blank:
      answer: Squeeze
      options:
      - en: Squeeze
      - en: Release
      - en: Shake
      - en: Pat
  - en: I'm right here and I'll keep the team updated.
    ko: 제가 바로 여기 있고, 팀에 계속 알릴게요.
    chunks:
    - I'm right here
    - and I'll keep
    - the team
    - updated
    - .
    words:
    - w-right
    - w-keep
    - w-team
    - w-update
    goal: 2
    tag: 곁에서 안심
    icon: shield
    why: '''I''m right here''는 곁에 있겠다는 약속이고, 팀에 계속 알리겠다는 말이 더해져 혼자가 아니라 팀이 함께 보고 있다는 안심을 줘요.'
    decoy: your family
    distractorsKo:
    - 제가 바로 밖에 있고, 팀에 계속 알릴게요.
    - 제가 바로 여기 있고, 팀과 계속 의논할게요.
    blank:
      answer: updated
      options:
      - en: updated
      - en: busy
      - en: quiet
      - en: away
  - en: I'm reporting these changes to the doctor now.
    ko: 이 변화들을 지금 의사에게 보고할게요.
    chunks:
    - I'm reporting
    - these changes
    - to the doctor
    - now
    - .
    words:
    - w-report
    - w-change
    goal: 2
    tag: 보고
    icon: speech
    why: '''now''를 붙여 미루지 않고 바로 보고한다는 뜻을 전해요. 변화(changes)를 구체적으로 짚으면 무엇을 알리는지 분명해져요.'
    decoy: to the printer
    distractorsKo:
    - 이 서류들을 지금 의사에게 보고할게요.
    - 이 소리들을 지금 의사에게 보고할게요.
    blank:
      answer: changes
      options:
      - en: changes
      - en: orders
      - en: supplies
      - en: visitors
  nuance:
  - kind: slider
    words:
    - w-low
    cue: 'Chart: BP 98/62 — a hair under his usual 104/64, and he has no symptoms.'
    scale:
    - a little low
    - quite low
    - dangerously low
    answerAt: 0
    why: 평소보다 살짝만 낮고 증상도 없으면 a little low. quite low·dangerously low는 수치가 크게 떨어졌을 때 쓰는 말이라 같은 '낮다'여도 무게가 달라요.
    example: Your blood pressure is a little low right now.
    exKo: 지금 혈압이 조금 낮아요.
  - kind: context
    words:
    - w-report
    word: report
    ko: 보고하다
    scenes:
    - who: 의사 호출
      icon: monitor
      en: I'm reporting a drop in his blood pressure.
      ok: true
    - who: 팀 인계
      icon: board
      en: Please report any change in rhythm right away.
      ok: true
    - who: 환자에게
      icon: me
      en: I'm reporting your hemodynamic instability to the physician.
      ok: false
      fix: I'm telling the doctor about your blood pressure right now so we can help.
    why: 의료진끼리는 report가 자연스럽지만, 환자에게는 hemodynamic instability 같은 임상어가 겁을 주고 알아듣기 어려워요. 쉬운 말로 무엇을 하는지 전하세요.
  order:
    tag: 대화 흐름
    icon: compass
    ko: 초기 사정과 보고 4문장 순서
    why: 확인한 일을 먼저 말하고, 나온 소견을 알린 뒤, 의사에게 보고한다고 전해요. 마지막에 의사가 정할 다음 단계를 말해 환자의 불안을 덜어요.
    lines:
    - en: I'm checking your breathing, blood pressure, and circulation.
      icon: stetho
      ko: 호흡, 혈압, 순환을 확인하고 있어요
      note: 확인
    - en: Your blood pressure is a little low right now.
      icon: chartup
      ko: 지금 혈압이 조금 낮아요
      note: 소견
    - en: I'm reporting that low pressure to the doctor now.
      icon: speech
      ko: 그 낮은 혈압을 지금 의사에게 보고할게요
      note: 보고
    - en: He'll tell us what to do next, and I'll keep you updated.
      icon: shield
      ko: 다음 할 일은 의사가 알려 줄 거고 계속 알려드릴게요
      note: 안심
