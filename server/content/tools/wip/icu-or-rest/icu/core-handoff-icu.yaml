situations:
- title: SBAR 구조 인계 기초
  sentences:
  - en: 'Situation: he''s a sixty-year-old with sepsis, day two.'
    ko: '상황: 60세 남자 환자, 패혈증 2일째입니다.'
    chunks:
    - 'Situation:'
    - he's a sixty-year-old
    - with sepsis
    - ', day two'
    - .
    words:
    - w-situation
    - w-sepsis
    goal: 1
    tag: 상황 보고
    icon: board
    why: S에 나이·진단·병일을 한 문장으로 압축하면 듣는 사람이 누구 이야기인지 먼저 잡아요. 앞 라벨 Situation:이 지금 어느 칸을 말하는지 알려 줘요.
    decoy: ', day four'
    distractorsKo:
    - '상황: 70세 남자 환자, 패혈증 2일째입니다.'
    - '상황: 60세 남자 환자, 패혈증 4일째입니다.'
    blank:
      answer: sepsis
      options:
      - en: sepsis
      - en: pneumonia
      - en: cellulitis
      - en: pancreatitis
  - en: Background, assessment, and then my recommendation.
    ko: 배경, 평가, 그리고 제 권고 순서로 드릴게요.
    chunks:
    - Background
    - ', assessment'
    - ', and then'
    - my recommendation
    - .
    words:
    - w-background
    - w-assessment
    - w-recommendation
    goal: 1
    tag: SBAR 순서
    icon: board
    why: 쉼표로 앞의 항목을 나열하다 마지막만 and then으로 끊으면 앞의 사실들 뒤에 내 권고가 온다는 흐름이 들려요.
    decoy: my diagnosis
    distractorsKo:
    - 배경, 평가, 그리고 팀 권고 순서로 드릴게요.
    - 배경, 평가, 그리고 의사 권고 순서로 드릴게요.
    blank:
      answer: recommendation
      options:
      - en: recommendation
      - en: prescription
      - en: documentation
      - en: consideration
  - en: Let's go through his SBAR from the top.
    ko: 처음부터 SBAR 순서로 짚어 볼게요.
    chunks:
    - Let's go through
    - his SBAR
    - from the top
    - .
    words:
    - w-sbar
    - w-gothrough
    goal: 1
    tag: 시작 알림
    icon: play
    why: Let's는 인계가 한쪽의 보고가 아니라 둘이 함께 확인하는 일임을 보여 줘요. from the top은 첫 줄부터 빠뜨리지 않고 가겠다는 약속이에요.
    decoy: his labs
    distractorsKo:
    - SBAR 순서로 짚으면 빠뜨림이 줄어요.
    - SBAR 순서는 상황이 맨 앞이에요.
    blank:
      answer: top
      options:
      - en: top
      - en: bottom
      - en: middle
      - en: end
  - en: I'll walk you through the background first, then the assessment.
    ko: 먼저 배경부터, 그다음 평가로 안내해 드릴게요.
    chunks:
    - I'll walk you through
    - the background
    - first
    - ', then the assessment'
    - .
    words:
    - w-background
    - w-assessment
    goal: 1
    tag: 순서 안내
    icon: compass
    why: walk you through는 상대를 따라오게 하며 안내한다는 뜻이고, first와 then이 말할 순서를 미리 알려 줘서 받는 사람이 길을 잃지 않아요.
    decoy: ', then the orders'
    distractorsKo:
    - 먼저 배경부터, 그다음 평가로 가면 길을 잃지 않아요.
    - 배경에는 병력과 입원 경과가 들어가요.
    blank:
      answer: background
      options:
      - en: background
      - en: labs
      - en: orders
      - en: schedule
  - en: Let me know if you want me to repeat anything.
    ko: 다시 말씀드릴 부분이 있으면 알려 주세요.
    chunks:
    - Let me know
    - if you want me
    - to repeat
    - anything
    - .
    words:
    - w-repeat
    goal: 2
    tag: 되묻기 열기
    icon: speech
    why: Let me know는 지시가 아니라 상대에게 문을 열어 주는 말이에요. 인계에서 놓친 부분을 바로 되묻게 하는 장치예요.
    decoy: to write
    distractorsKo:
