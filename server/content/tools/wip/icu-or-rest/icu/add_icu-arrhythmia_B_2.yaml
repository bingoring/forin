7:
  s:
  - {tag: 첫 시도, icon: me, why: "First로 시작하면 \"이걸 먼저, 안 되면 다음\"이라는 단계가 있다는 걸 환자에게 알려 줘요.", decoy: "after dinner", dk: ["먼저, 문을 밀 때처럼 힘을 줘 보세요", "먼저, 숟가락을 들 때처럼 힘을 줘 보세요"], ans: bearing, opts: [pulling, jumping, bending]}
  - {tag: 다음 단계, icon: pill, why: "called adenosine처럼 \"~라는\"을 붙여 환자에게 낯선 약 이름을 부드럽게 소개해요.", decoy: "a long one", dk: ["그래도 안 되면, 아데노신이라는 하얀 약을 드릴게요", "그래도 안 되면, 아데노신이라는 쓴 약을 드릴게요"], ans: quick, opts: [heavy, loud, sweet]}
  - {tag: 느낌 예고, icon: faceWorried, why: "may feel strange로 미리 예고하면 환자가 놀라지 않고 \"그럴 수 있구나\" 하고 받아들여요.", decoy: "for a while", dk: ["몇 분간 이상한 느낌이 들 수 있지만 빠르게 효과가 나요", "몇 초간 가려운 느낌이 들 수 있지만 빠르게 효과가 나요"], ans: strange, opts: [hungry, sleepy, thirsty]}
  - {tag: 증상 예고, icon: stetho, why: "might는 may보다 약한 가능성이라 \"그럴 수도 있다\" 정도로 겁을 덜어 줘요.", decoy: "every day", dk: ["잠깐 심장이 건너뛰거나 가려운 느낌이 들 수 있어요", "잠깐 심장이 건너뛰거나 시린 느낌이 들 수 있어요"], ans: flutter, opts: [melt, shine, sing]}
  - {tag: 진행 안내, icon: me, why: "while you push로 환자가 힘주는 시간과 내가 세는 시간이 겹친다는 걸 알려 줘요.", decoy: "on the bed", dk: ["손목을 잡고 힘주시는 동안 박자를 셀게요", "발목을 잡고 힘주시는 동안 숫자를 셀게요"], ans: wrist, opts: [knee, chin, hip]}
  - {tag: 안심 말, icon: check, why: "passes in just a few seconds의 just가 \"겨우 몇 초\"라는 짧음을 강조해 안심시켜요.", decoy: "all night", dk: ["그 이상한 느낌은 몇 분 만에 지나가요", "그 어지러운 느낌은 몇 초 만에 지나가요"], ans: passes, opts: [begins, repeats, sleeps]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 안정 상태 빈맥 환자에게 단계를 설명하는 4문장 순서
    why: 먼저 환자 스스로 하는 방법을 시도하고, 안 되면 약을 쓴다고 알린 뒤, 약을 맞을 때 느낌과 그 짧음을 미리 말해 줘요.
    lines:
    - {en: "First, try bearing down like you're having a bowel movement.", icon: me, ko: "먼저 배변할 때처럼 힘을 줘 보세요", note: 시도}
    - {en: "If that doesn't work, we'll give a quick medication called adenosine.", icon: pill, ko: "그래도 안 되면 아데노신이라는 약을 드릴게요", note: 약}
    - {en: "You might feel your heart skip or flutter for a moment.", icon: stetho, ko: "잠깐 심장이 건너뛰는 느낌이 들 수 있어요", note: 예고}
    - {en: "That strange feeling passes in just a few seconds.", icon: check, ko: "그 이상한 느낌은 몇 초 만에 지나가요", note: 안심}
8:
  s:
  - {tag: 상태 보고, icon: monitor, why: "into the 40s의 into는 \"40대 안으로 떨어졌다\"는 진행의 느낌을 줘요.", decoy: "in the 90s", dk: ["심장 전도차단과 함께 60대까지 서맥이에요", "심장 전도차단과 함께 20대까지 서맥이에요"], ans: bradycardic, opts: [tachycardic, feverish, anxious]}
  - {tag: 준비 선언, icon: pill, why: "draw up은 약을 주사기에 \"뽑아 올린다\"는 숙어이고, and로 패드 부착까지 한 번에 말해요.", decoy: "a flush", dk: ["아트로핀을 뽑고 페이서 패드를 셀게요", "아트로핀을 뽑고 페이서 패드를 설명할게요"], ans: pacer, opts: [paper, knee, heating]}
  - {tag: 다음 단계, icon: siren, why: "If…fails, we start…로 약이 듣지 않을 때의 다음 처치를 미리 짚어 줘요.", decoy: "if it works", dk: ["아트로핀이 안 들으면 경피 페이싱을 설명해요", "아트로핀이 안 들으면 경피 페이싱을 기록해요"], ans: fails, opts: [leaks, melts, sleeps]}
  - {tag: 상태 보고, icon: chartup, why: "getting slower처럼 -ing로 말하면 지금도 계속 느려지는 추세임을 전해요.", decoy: "in the 80s", dk: ["심박수가 30대로 낮고 점점 더 느려지고 있어요", "심박수가 40대로 낮고 점점 더 불규칙해지고 있어요"], ans: slower, opts: [louder, taller, brighter]}
  - {tag: 대기 요청, icon: shield, why: "in case we need to pace는 \"필요할지도 모르니 미리\"라는 대비의 이유를 밝혀요.", decoy: "to the wall", dk: ["차트가 필요할 경우를 대비해 패드를 가슴에 두세요", "청소가 필요할 경우를 대비해 패드를 가슴에 두세요"], ans: pads, opts: [socks, gloves, towels]}
  - {tag: 호출 요청, icon: bell, why: "Tell me right away if…로 \"이럴 땐 기다리지 말고 바로\"라는 호출 기준을 두 가지로 분명히 말해요.", decoy: "after rounds", dk: ["반응이 없어지거나 땀이 나면 바로 알려 주세요", "배가 고프거나 혈압이 떨어지면 바로 알려 주세요"], ans: unresponsive, opts: [thirsty, tall, cheerful]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 전도차단 서맥 환자에게 대응하는 4문장 순서
    why: 상태를 말하고, 약과 패드를 준비한 뒤, 패드를 붙여 둔 채 약이 안 들으면 페이싱으로 넘어가요.
    lines:
    - {en: "He's bradycardic with a heart block into the 40s.", icon: monitor, ko: "전도차단과 함께 40대까지 서맥이에요", note: 상태}
    - {en: "I'll draw up atropine and place the pacer pads.", icon: pill, ko: "아트로핀을 뽑고 페이서 패드를 붙일게요", note: 준비}
    - {en: "Keep the pads on his chest in case atropine fails.", icon: shield, ko: "아트로핀이 안 들을 경우를 대비해 패드를 가슴에 두세요", note: 대기}
    - {en: "If it does, we start transcutaneous pacing.", icon: siren, ko: "그러면 경피 페이싱을 시작해요", note: 페이싱}
9:
  s:
  - {tag: 이상 보고, icon: monitor, why: "is prolonging on the monitor는 지금 화면에서 진행 중인 변화를 -ing로 보고해요.", decoy: "on the strip", dk: ["모니터에서 PR간격이 길어지고 있어요", "모니터에서 QT간격이 불규칙해지고 있어요"], ans: prolonging, opts: [printing, freezing, painting]}
  - {tag: 위험 설명, icon: siren, why: "raises his risk for…는 \"확률이 올라간다\"는 말이지 이미 생겼다는 뜻이 아니에요.", decoy: "from sleep", dk: ["이건 감염 위험을 높여요", "이건 낙상 위험을 높여요"], ans: raises, opts: [hides, signs, pays]}
  - {tag: 점검 제안, icon: pill, why: "Let's로 시작해 \"함께 점검하자\"는 제안이면서 약물과 전해질, 두 가지 원인을 나란히 짚어요.", decoy: "this chart", dk: ["약물을 검토하고 전해질을 계산해 봐요", "약물을 검토하고 전해질을 정리해 봐요"], ans: review, opts: [sell, fold, paint]}
  - {tag: 원인 설명, icon: pill, why: "with several medications처럼 with로 \"그 약들과 함께일 때\"의 조건을 붙여요.", decoy: "this week", dk: ["복용 중인 약물 몇 가지 때문에 PR이 길어져요", "복용 중인 약물 몇 가지 때문에 QT가 불규칙해져요"], ans: longer, opts: [louder, thinner, darker]}
  - {tag: 응급 기준, icon: siren, why: "If it turns into…, we treat it as…로 어느 시점부터 응급인지 조건을 분명히 해요.", decoy: "a slow one", dk: ["감기로 바뀌면 응급 상황으로 치료해요", "소음으로 바뀌면 응급 상황으로 치료해요"], ans: emergency, opts: [exercise, option, example]}
  - {tag: 팀 공유, icon: pushpin, why: "so the team keeps monitoring으로 표시하는 이유(팀이 계속 보게 하려고)를 목적절로 붙여요.", decoy: "on the door", dk: ["이걸 표시해서 팀이 계속 호흡을 감시하게 할게요", "이걸 표시해서 가족이 계속 리듬을 감시하게 할게요"], ans: flag, opts: [cover, name, block]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: QT 연장을 발견하고 대응하는 4문장 순서
    why: 변화를 보고하고, 그 위험을 말하고, 위험을 줄이려는 점검을 제안한 뒤, 팀에 표시해 감시를 이어요.
    lines:
    - {en: "His QT interval is prolonging on the monitor.", icon: monitor, ko: "모니터에서 QT간격이 길어지고 있어요", note: 보고}
    - {en: "This raises his risk for torsades de pointes.", icon: siren, ko: "이건 토르사드 위험을 높여요", note: 위험}
    - {en: "To lower that risk, let's review his medications and check his electrolytes.", icon: pill, ko: "그 위험을 줄이려면 약물을 검토하고 전해질을 확인해 봐요", note: 점검}
    - {en: "I'll flag all of this so the team keeps monitoring his rhythm.", icon: pushpin, ko: "이 모두를 표시해서 팀이 계속 리듬을 감시하게 할게요", note: 공유}
10:
  s:
  - {tag: 보충 시작, icon: pill, why: "per protocol은 \"병원 절차대로\"라는 뜻이라 임의로 하는 게 아니라는 근거를 밝혀요.", decoy: "after lunch", dk: ["순번에 따라 칼륨과 마그네슘을 보충할게요", "침상 번호에 따라 칼륨과 마그네슘을 보충할게요"], ans: replace, opts: [wash, weigh, sort]}
  - {tag: 효과 설명, icon: chartup, why: "often은 \"대개\"라 항상은 아님을 말해서 환자에게 과한 기대를 주지 않아요.", decoy: "for a day", dk: ["이걸 교정하면 대개 두통이 진정돼요", "이걸 교정하면 대개 발진이 진정돼요"], ans: arrhythmia, opts: [fever, rash, cough]}
  - {tag: 재확인, icon: lab, why: "after replacement로 \"보충이 끝난 뒤\"라는 시점을 한 구절로 정해 줘요.", decoy: "before noon", dk: ["보충 후에 체중을 재확인할게요", "보충 후에 소변을 재확인할게요"], ans: recheck, opts: [repaint, rename, repack]}
  - {tag: 천천히 투여, icon: pill, why: "slowly to avoid…로 천천히 주는 이유(정맥 자극)를 목적으로 붙여요.", decoy: "by mouth", dk: ["피부를 자극하지 않게 칼륨을 천천히 줘요", "위를 자극하지 않게 칼륨을 천천히 줘요"], ans: slowly, opts: [daily, twice, rarely]}
  - {tag: 경과 설명, icon: monitor, why: "Once we correct it, …처럼 Once로 \"그 일이 끝나면\"이라는 순서와 조건을 함께 말해요.", decoy: "at night", dk: ["교정하고 나면 혈압이 대개 가라앉아요", "교정하고 나면 체온이 대개 가라앉아요"], ans: correct, opts: [copy, sort, wash]}
  - {tag: 시간 약속, icon: calendar, why: "in four hours처럼 in으로 \"지금부터 네 시간 뒤\"라는 시점을 말해요.", decoy: "this evening", dk: ["두 시간 뒤에 마그네슘을 재확인할게요", "여섯 시간 뒤에 마그네슘을 재확인할게요"], ans: four, opts: [nine, eleven, twenty]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 전해질을 보충하고 재확인하는 4문장 순서
    why: 프로토콜대로 보충을 시작하고, 천천히 주는 이유를 말하고, 리듬이 가라앉는 경과를 설명한 뒤, 재확인으로 마무리해요.
    lines:
    - {en: "I'll replace his potassium and magnesium per protocol.", icon: pill, ko: "프로토콜에 따라 칼륨과 마그네슘을 보충할게요", note: 보충}
    - {en: "I'll run the potassium slowly to avoid irritating his veins.", icon: pill, ko: "정맥을 자극하지 않게 칼륨을 천천히 넣을게요", note: 방법}
    - {en: "Once that's in, his rhythm often settles down.", icon: monitor, ko: "그게 들어가면 리듬이 대개 가라앉아요", note: 경과}
    - {en: "To be sure it worked, I'll recheck his levels in four hours.", icon: lab, ko: "잘 됐는지 확인하려고 네 시간 뒤에 수치를 재확인할게요", note: 재확인}
11:
  s:
  - {tag: 캡처 확인, icon: monitor, why: "each는 스파이크 \"하나하나\"를 뜻해서 일부만이 아니라 전부 본다는 말이 돼요.", decoy: "on the wall", dk: ["페이서 스파이크마다 캡처되는지 기록할게요", "페이서 스파이크마다 캡처되는지 설명할게요"], ans: capturing, opts: [crossing, leaking, resting]}
  - {tag: 출력 설정, icon: gear, why: "a bit above는 역치를 겨우 넘는 정도라는 뜻 — 안전한 여유를 두되 과하지 않게 설정해요.", decoy: "a day", dk: ["출력을 캡처 역치보다 조금 위로 적어 둘게요", "출력을 캡처 역치보다 조금 위로 설명할게요"], ans: capture, opts: [pain, sleep, fever]}
  - {tag: 선 고정, icon: shield, why: "any loss of…의 any는 \"조금이라도\"라는 뜻이라 작은 소실도 놓치지 않겠다는 말이에요.", decoy: "the ward", dk: ["전선을 고정하고 소음이 있는지 지켜볼게요", "전선을 고정하고 통증이 있는지 지켜볼게요"], ans: secure, opts: [count, name, paint]}
  - {tag: 정상 기준, icon: chartup, why: "should produce a beat는 \"그래야 정상\"이라는 기대를 말해 기준을 알려 줘요.", decoy: "a blank line", dk: ["스파이크마다 곧바로 알람이 나와야 해요", "스파이크마다 곧바로 소리가 나와야 해요"], ans: beat, opts: [sound, word, drop]}
  - {tag: 장치 구분, icon: monitor, why: "not his permanent one으로 임시와 영구를 대비시켜 어느 장치인지 혼동을 막아요.", decoy: "for a week", dk: ["이건 임시 모니터고 영구적인 게 아니에요", "이건 임시 페이서고 새 것이 아니에요"], ans: temporary, opts: [heavy, broken, private]}
  - {tag: 대응 계획, icon: siren, why: "If capture is lost, I'll…로 조건과 대응을 한 문장에 묶어 즉시 행동 기준을 말해요.", decoy: "when it beeps", dk: ["페이서가 울리면 즉시 출력을 늘릴게요", "전선이 풀리면 즉시 출력을 늘릴게요"], ans: increase, opts: [print, sign, fold]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 임시 페이서를 관리하는 4문장 순서
    why: 출력을 역치 위로 맞추고, 그때의 정상 반응을 설명하고, 선을 고정해 감시하다가 소실되면 출력을 올려요.
    lines:
    - {en: "Let me set the output a bit above the capture threshold.", icon: gear, ko: "출력을 캡처 역치보다 조금 위로 설정할게요", note: 설정}
    - {en: "At that setting, every spike should produce a beat right after it.", icon: chartup, ko: "그 설정에서는 스파이크마다 곧바로 박동이 나와야 해요", note: 기준}
    - {en: "I'll secure the wires and watch for any spike that doesn't get one.", icon: shield, ko: "전선을 고정하고 박동이 없는 스파이크가 있는지 볼게요", note: 감시}
    - {en: "If capture is lost, I'll increase the output immediately.", icon: siren, ko: "캡처가 소실되면 즉시 출력을 늘릴게요", note: 대응}
12:
  s:
  - {tag: 사전 확인, icon: lab, why: "has been at the right level로 \"그동안 계속 적절했는지\"라는 지속을 현재완료로 말해요.", decoy: "at home", dk: ["혈액희석제 수치가 적절했는지 기록할게요", "혈액희석제 수치가 적절했는지 복사할게요"], ans: right, opts: [low, high, old]}
  - {tag: 진정 설명, icon: faceWorried, why: "so you won't feel…로 진정제의 효과를 말해 환자가 가장 걱정하는 아픔을 덜어 줘요.", decoy: "a long nap", dk: ["진정제를 드릴 테니 주사는 느껴지지 않을 거예요", "진정제를 드릴 테니 전기충격은 보이지 않을 거예요"], ans: sedation, opts: [coffee, tea, soup]}
  - {tag: 동의서, icon: pencil, why: "go over는 \"하나하나 같이 훑어본다\"는 숙어라 동의서를 건네기만 하지 않는다는 뜻이에요.", decoy: "a short form", dk: ["식단표를 함께 보고 궁금한 점에 답해 드릴게요", "동의서를 함께 보고 궁금한 점을 메모해 드릴게요"], ans: consent, opts: [menu, bill, map]}
  - {tag: 시간 안내, icon: calendar, why: "just a few minutes의 just가 \"겨우 몇 분\"이라는 짧음을 강조해 불안을 줄여요.", decoy: "all day", dk: ["시술 동안 몇 시간 잠들어 계실 거예요", "시술 전에 몇 분만 잠들어 계실 거예요"], ans: asleep, opts: [angry, outside, upset]}
  - {tag: 시술 설명, icon: gear, why: "carefully timed는 심장 박동에 맞춰 \"정확한 순간\"에 준다는 뜻이라 안전하다는 인상을 줘요.", decoy: "a gentle one", dk: ["이 기계가 정교하게 맞춘 전기충격 세 번으로 리듬을 재설정해요", "이 기계가 정교하게 맞춘 전기충격 한 번으로 혈압을 재설정해요"], ans: carefully, opts: [randomly, loosely, badly]}
  - {tag: 금식 안내, icon: calendar, why: "after midnight처럼 구체적인 시각을 주면 \"언제부터\"가 헷갈리지 않아요.", decoy: "before lunch", dk: ["이것 전에는 저녁 식사 이후로 먹거나 마시지 마세요", "이것 전에는 어제 오후부터 먹거나 마시지 마세요"], ans: midnight, opts: [Monday, winter, school]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 예정 심율동전환을 환자에게 설명하는 4문장 순서
    why: 안전 확인을 먼저 하고, 동의서를 살피고, 기계가 하는 일을 설명한 뒤, 진정 덕분에 느끼지 않는다는 말로 안심시켜요.
    lines:
    - {en: "We'll confirm your blood thinner has been at the right level.", icon: lab, ko: "혈액희석제 수치가 적절했는지 확인할게요", note: 확인}
    - {en: "Once that's confirmed, I'll go over the consent.", icon: pencil, ko: "그게 확인되면 동의서를 함께 볼게요", note: 동의}
    - {en: "This machine delivers one carefully timed shock to reset your rhythm.", icon: gear, ko: "이 기계가 정교하게 맞춘 전기충격 한 번으로 리듬을 재설정해요", note: 설명}
    - {en: "You'll get sedation, so you won't feel it.", icon: faceWorried, ko: "진정제를 드릴 테니 느껴지지 않을 거예요", note: 안심}
13:
  s:
  - {tag: 감시 안내, icon: monitor, why: "how your device is working with your rhythm은 장치와 리듬의 호흡을 본다는 말이에요.", decoy: "for a week", dk: ["장치가 혈압과 잘 맞물려 작동하는지 지켜보고 있어요", "휴대폰이 리듬과 잘 맞물려 작동하는지 지켜보고 있어요"], ans: device, opts: [phone, watch, chair]}
  - {tag: 안심 말, icon: shield, why: "doing its job은 \"제 일을 하는 중\"이라는 표현이라 작동이 고장이 아니라는 안심을 줘요.", decoy: "to warn you", dk: ["작동하더라도 그건 알려 주려는 제 역할을 하는 거예요", "작동하더라도 그건 깨우려는 제 역할을 하는 거예요"], ans: protect, opts: [warm, pay, teach]}
  - {tag: 증상 요청, icon: bell, why: "right away는 \"기다리지 말고 바로\"라는 시급함을 한마디로 전해요.", decoy: "in the hall", dk: ["전기충격이나 가려움이 느껴지면 바로 말씀해 주세요", "두통이나 찌릿함이 느껴지면 바로 말씀해 주세요"], ans: jolt, opts: [smile, snack, nap]}
  - {tag: 원리 설명, icon: stetho, why: "only fires if…의 only가 \"필요할 때만\"이라는 한정을 줘서 아무 때나 작동하지 않음을 알려 줘요.", decoy: "by itself", dk: ["제세동기는 환자가 원할 때만 작동해요", "제세동기는 의사가 누를 때만 작동해요"], ans: fires, opts: [sleeps, talks, sings]}
  - {tag: 지속 감시, icon: monitor, why: "the whole time으로 \"잠깐이 아니라 내내\" 지켜본다는 지속을 강조해요.", decoy: "at night", dk: ["이 모니터로 체중을 계속 추적하고 있어요", "이 모니터로 리듬을 가끔 추적하고 있어요"], ans: monitor, opts: [radio, window, pillow]}
  - {tag: 후속 약속, icon: pencil, why: "check on you and record로 환자 상태 확인과 기록, 두 가지 후속 조치를 약속해요.", decoy: "in the chart", dk: ["만약 작동하면, 확인하고 누가 있었는지 기록할게요", "만약 작동하면, 확인하고 날씨가 어땠는지 기록할게요"], ans: record, opts: [paint, sell, mail]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 제세동기 삽입 환자를 안심시키는 4문장 순서
    why: 계속 지켜본다고 알리고, 장치가 언제 작동하는지 설명하고, 작동의 의미를 말한 뒤, 이후 확인·기록을 약속해요.
    lines:
    - {en: "I'm watching your device and rhythm on this monitor.", icon: monitor, ko: "이 모니터로 장치와 리듬을 지켜보고 있어요", note: 감시}
    - {en: "It only fires if your heart needs it.", icon: stetho, ko: "심장이 필요로 할 때만 작동해요", note: 원리}
    - {en: "When it does, it's just doing its job to protect you.", icon: shield, ko: "작동해도 보호하려는 제 역할을 하는 거예요", note: 안심}
    - {en: "Afterward, we'll check on you and record what happened.", icon: pencil, ko: "그 뒤에 확인하고 무슨 일이 있었는지 기록할게요", note: 후속}
