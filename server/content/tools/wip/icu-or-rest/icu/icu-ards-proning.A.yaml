situations:
- title: ARDS 산소화 지표 이해
  sentences:
  - en: That ratio tells us how well his lungs are moving oxygen into his blood.
    ko: 그 비율은 폐가 혈액으로 산소를 얼마나 잘 보내는지 알려줘요.
    chunks:
    - That ratio
    - tells us
    - how well his lungs
    - are moving oxygen
    - into his blood
    - .
    words:
    - w-ratio
    - w-lung
    - w-move
    - w-oxygen
    - w-blood
    goal: 1
  - en: A lower number means his lung injury is more severe right now.
    ko: 숫자가 낮을수록 지금 폐 손상이 더 심하다는 뜻이에요.
    chunks:
    - A lower number
    - means
    - his lung injury
    - is more severe
    - right now
    - .
    words:
    - w-lower
    - w-number
    - w-mean
    - w-lung
    - w-injury
    - w-severe
    goal: 1
  - en: We track it to see whether his lungs are improving.
    ko: 폐가 좋아지고 있는지 보려고 이 수치를 계속 지켜봐요.
    chunks:
    - We track it
    - to see
    - whether his lungs
    - are improving
    - .
    words:
    - w-track
    - w-lung
    - w-improve
    goal: 2
  - en: It compares the oxygen in his blood to the oxygen he's breathing in.
    ko: 혈액 속 산소와 들이마시는 산소를 비교하는 거예요.
    chunks:
    - It compares
    - the oxygen in his blood
    - to the oxygen
    - he's breathing in
    - .
    words:
    - w-compare
    - w-oxygen
    - w-blood
    - w-breathe
    goal: 1
  - en: I'll explain what each new number means as we go.
    ko: 새 수치가 나올 때마다 무슨 뜻인지 설명해 드릴게요.
    chunks:
    - I'll explain
    - what each new number
    - means
    - as we go
    - .
    words:
    - w-explain
    - w-number
    - w-mean
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-severe
    cue: 'Doctor to the family: "His P/F ratio is 80 right now."'
    scale:
    - mild
    - moderate
    - severe
    answerAt: 2
    why: P/F 비율이 100 이하면 중증(severe) ARDS로 분류해요. mild는 200~300, moderate는 100~200 사이로, 같은 '폐가 안 좋다'여도 단계가 달라요.
    example: His lung injury is severe right now.
    exKo: 지금 폐 손상이 심한 상태예요.
  - kind: context
    words:
    - w-improve
    word: improve
    ko: 호전되다
    scenes:
    - who: 의사 회진
      icon: monitor
      en: His P/F ratio has improved since we proned him.
      ok: true
    - who: 차트 기록
      icon: board
      en: Oxygenation improved overnight; P/F 90 to 140.
      ok: true
    - who: 가족에게
      icon: me
      en: Your son's PaO2 to FiO2 index has improved by fifty points.
      ok: false
      fix: He's improving a little. The oxygen in his blood is better than it was yesterday.
    why: 의료진끼리와 차트에서는 수치를 그대로 말해도 되지만, 가족에게는 PaO2·FiO2 같은 지표를 풀어서 '산소가 좋아지고 있다'로 말해요.
- title: 저 TV 폐보호 환기 유지
  sentences:
  - en: His tidal volume is set to 6 milliliters per kilo of ideal body weight.
    ko: 일회 호흡량은 표준 체중 킬로그램당 6밀리리터로 맞춰져 있어요.
