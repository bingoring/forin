- title: 불안정 환자 인계 강조점
  nuance:
  - kind: slider
    words:
    - w-vt
    - w-rhythm
    - w-irritable
    cue: 'Monitor: five wide beats in a row, back to sinus, three times this hour.'
    scale:
    - occasional PVCs
    - short runs of VT
    - sustained VT
    answerAt: 1
    why: 3박 이상 이어지지만 30초 안에 끝나면 짧은 VT(non-sustained VT)이고, 흔히 runs of VT라고 불러요. 30초를 넘기거나 혈압이 떨어지면 sustained VT라서 바로 호출해요.
    example: He has short runs of VT, so watch his rhythm.
    exKo: 짧은 심실빈맥이 있으니 리듬을 지켜봐 주세요.
  - kind: pair
    words:
    - w-escalate
    - w-vt
    - w-map
    pairs:
    - - escalate
      - early to the resident
    - - VT
      - a fast ventricular rhythm
    - - MAP
      - the pressure goal
    decoys:
    - on the lab report
    why: escalate는 문제가 커지기 전에 더 높은 단계의 사람에게 알리는 일, VT는 심실에서 시작되는 빠른 위험 리듬, MAP은 승압제 목표가 되는 평균 동맥압이에요.
  - kind: context
    words:
    - w-escalate
    word: escalate
    ko: 상급 보고하다
    scenes:
    - who: 동료 간호사
      icon: handshake2
      en: Don't wait; escalate early on this one.
      ok: true
    - who: 책임간호사
      icon: board
      en: I'm going to escalate this to the resident now.
      ok: true
    - who: 가족에게
      icon: home
      en: I'm escalating his case to the attending because his MAP stays under sixty-five.
      ok: false
      fix: I've asked the doctor to come and look at him right away.
    why: 동료와 책임간호사 사이에서는 escalate가 위로 올려 보고한다는 정확한 말이에요. 가족에게 attending·MAP까지 섞으면 상황이 얼마나 나쁜지 가늠이 안 되어 겁이 나서, 의사를 바로 불렀다고 쉽게 말해요.
- title: 급변 중 긴급 인계
  nuance:
  - kind: slider
    words:
    - w-crash
    - w-pressure
    - w-shock
    cue: MAP thirty-eight and falling, mottled skin, and no response to the pressor increase.
    scale:
    - dipping
    - dropping
    - crashing
    answerAt: 2
    why: 몇 분 안에 크게 떨어지고 약을 올려도 반응이 없으면 crashing이에요. dipping과 dropping은 같은 방향이지만 급한 정도가 달라요. 정도를 정확히 말해야 도움이 제때 와요.
    example: His pressure is crashing, so I need help now.
    exKo: 혈압이 급격히 떨어지고 있어서 지금 도움이 필요해요.
  - kind: pair
    words:
    - w-push
    - w-page
    - w-secure
    pairs:
    - - push
      - a bolus
    - - page
      - the on-call team
    - - secure
      - the airway
    decoys:
    - a cold coffee
    why: push는 처방이나 프로토콜에 따라 수액이나 약을 빠르게 넣는 일, page는 호출기로 당직 팀을 부르는 일, secure는 기도를 안정되게 확보하는 일이에요.
  - kind: context
    words:
    - w-crash
    word: crash
    ko: 급격히 나빠지다
    scenes:
    - who: 동료 간호사
      icon: handshake2
      en: His pressure is crashing, and I need hands now.
      ok: true
    - who: 의사에게 전화
      icon: stetho
      en: 'He''s crashing: MAP forty on max norepi.'
      ok: true
    - who: 가족에게
      icon: home
      en: He's crashing right now, and we're doing everything we can.
      ok: false
      fix: His blood pressure has dropped suddenly, and we're giving him medicine to bring it back up.
    why: 의료진끼리는 crashing이 상황이 급하다는 신호로 통해요. 가족에게는 crashing이 곧 돌아가실 것처럼 들려 겁을 주니, 혈압이 갑자기 떨어졌고 올리는 약을 쓰고 있다고 사실 그대로 차분히 말해요.
- title: 코드 상황 인계·역할
  nuance:
  - kind: pair
    words:
    - w-epi
    - w-switch
    - w-pea
    pairs:
    - - epi
      - given every three to five minutes
    - - switch
      - compressors every two minutes
    - - PEA
      - a rhythm without a pulse
    decoys:
    - once an hour
    why: AHA 지침에서 에피네프린은 3~5분마다 쓰고, 압박자는 2분마다 교대해 피로를 줄여요. PEA는 리듬은 있는데 맥박이 만져지지 않는 정지 리듬이에요.
  - kind: context
    words:
    - w-pea
    word: PEA
    ko: 무맥성 전기활동
    scenes:
    - who: 동료 간호사
      icon: handshake2
      en: Last rhythm was PEA, so keep the compressions going.
      ok: true
    - who: 팀 리더
      icon: stetho
      en: We're in PEA again, so the next epi is due.
      ok: true
    - who: 가족에게
      icon: home
      en: He's in PEA, which means electrical activity without a pulse.
      ok: false
      fix: His heart still has some electrical activity, but it isn't pumping enough to make a pulse.
    why: 코드 중 의료진끼리는 PEA가 어떤 정지 리듬인지 바로 통하는 약어예요. 가족에게는 PEA 같은 약어와 electrical activity 설명이 낯설어서, 심장이 맥박을 만들 만큼 뛰지 못한다고 쉽게 풀어 줘요.
- title: 병원간 전원 인계
  nuance:
  - kind: slider
    words:
    - w-stable
    - w-transport
    cue: 'Receiving nurse: "Can he travel?" You: MAP forty-five on max pressors, and the doses keep climbing.'
    scale:
    - stable
    - borderline
    - unstable
    answerAt: 2
    why: 최대 용량 승압제로도 혈압이 못 오르는 환자는 stable이 아니에요. 이송이 꼭 필요하더라도 stable이라고 하지 않고 있는 그대로 말해야 받는 쪽이 필요한 지원을 준비해요.
    example: He's unstable for transport, so we need critical care support.
    exKo: 이송에 불안정해서 중환자 이송 지원이 필요해요.
  - kind: swap
    words:
    - w-stable
    - w-transport
    - w-drip
    who: 수용 병원 간호사에게 · 이송 상태
    icon: handshake2
    before:
    - 'He''s '
    - okay
    - ' for transport on these drips at these rates.'
    options:
    - okay
    - stable
    - doing great
    answer: stable
    notes:
      okay: 너무 모호해요. 받는 쪽은 무엇이 어느 수준인지 알 수 없어요.
      stable: 인계에서 쓰는 임상어예요. 현재 약물과 속도에서 수치가 유지된다는 뜻이라 받는 쪽이 판단할 수 있어요.
      doing great: 기대를 부풀려요. 위험한 환자를 낙관적으로만 전하면 받는 쪽이 대비하지 못해요.
    ko: 이 약물들과 속도 그대로 이송에 안정적입니다
    why: 이송 인계에서는 '괜찮다' 같은 모호한 말 대신 stable이라는 임상어를 쓰고, 어떤 약물과 속도에서 그런지 함께 말해요.
- title: 정보 누락·오류 정정 인계
  nuance:
  - kind: slider
    words:
    - w-error
    - w-dose
    cue: You said "five" in the handoff, but it was "fifty," and she hasn't hung the bag yet.
    scale:
    - typo
    - near miss
    - medication error
    answerAt: 1
    why: 환자에게 닿기 전에 잡은 실수는 near miss예요. 이미 투여됐다면 medication error라서 환자 평가와 의사 보고가 필요하고, 병원 보고 체계에 맞춰 기록해요.
    example: I caught the wrong dose, so this was a near miss.
    exKo: 틀린 용량을 미리 잡아서 near miss였어요.
  - kind: swap
    words:
    - w-correction
    - w-handoff
    - w-potassium
    who: 인수받은 동료에게 · 인계 정정
    icon: handshake2
    before:
    - ''
    - Oops, my bad
    - ': his potassium is actually 6.2.'
    options:
    - Oops, my bad
    - Correction to my handoff
    - Small change
    answer: Correction to my handoff
    notes:
      Oops, my bad: 가볍게 사과하는 말투라 중요한 정정이라는 신호가 약해요. 칼륨 6.2는 높은 값이라 바로 확인해야 해요.
      Correction to my handoff: 정정이라는 말을 분명히 하고 바로 바뀐 수치를 이어 말해요. 받는 사람이 앞서 들은 숫자를 고치도록 신호를 줘요.
      Small change: '''작은 변화''로 들려 위험한 정정을 축소해요. 수치가 크게 달라졌는데 사소하게 들리면 놓치기 쉬워요.'
    ko: 제 인계를 정정해야 해요. 칼륨 수치는 실제로 6.2예요
    why: 정정은 correct라고 분명히 말하고, 어떤 수치가 어떻게 바뀌었는지 바로 이어서 말해요. 말투를 가볍게 하면 받는 사람이 중요한 정정이라는 것을 놓쳐요.
- title: 임종·목표변경 인계
  nuance:
  - kind: slider
    words:
    - w-comfort
    cue: He's picking at the sheets and shifting around, but his face looks relaxed.
    scale:
    - comfortable
    - restless
    - in distress
    answerAt: 1
    why: 얼굴은 편안한데 몸을 뒤척이면 restless예요. 찡그리고 신음하는 등 고통이 분명하면 in distress라서, 처방된 증상 조절 약을 지침대로 쓰고 의사에게 알려요. 임종 인계에서는 편안함의 정도를 구체적으로 말해요.
    example: He's restless, but he doesn't look in pain.
    exKo: 뒤척이지만 아파 보이지는 않아요.
  - kind: swap
    words:
    - w-dnr
    - w-code
    - w-comfort
    who: 가족에게 · DNR 뜻 설명
    icon: home
    before:
    - 'We''ve changed his code status to DNR, which means we '
    - will stop all care
    - ' if his heart stops.'
    options:
    - will stop all care
    - won't do CPR
    - will try everything
    answer: won't do CPR
    notes:
      will stop all care: 틀려요. DNR은 치료를 모두 멈추는 게 아니에요. 심정지 때 소생술만 하지 않고, 편안하게 하는 치료는 계속해요.
      won't do CPR: 맞아요. DNR이 무엇을 하지 않는다는 뜻인지 쉬운 말로 이어서 알려 줘요.
      will try everything: 틀려요. DNR은 심정지 때 소생술을 하지 않기로 한 지시라서 모든 것을 시도한다는 뜻과 반대예요.
    ko: 코드 상태를 DNR로 바꿨어요, 심장이 멎어도 심폐소생술은 하지 않는다는 뜻이에요
    why: 가족에게 DNR을 말했다면 그 뜻을 바로 쉬운 말로 이어 줘야 해요. 심정지 때 소생술(CPR)만 하지 않을 뿐 편안하게 하는 치료는 계속된다는 점을 분명히 하면 오해가 줄어요.
- title: 다수 중환자 동시 인계 우선화
  nuance:
  - kind: slider
    words:
    - w-routine
    - w-stable
    cue: 'Bed eight: vitals unchanged all night, labs at six, no new orders.'
    scale:
    - routine
    - needs a close eye
    - critical
    answerAt: 0
    why: 변화가 없고 정해진 확인만 필요한 환자는 routine이에요. 인계에서 환자마다 위험도를 이렇게 구분해야 한정된 시간과 사람을 위중한 병상에 먼저 쓸 수 있어요.
    example: Bed eight is routine, just checks and labs.
    exKo: 8번 병상은 정규 확인과 검사만 필요해요.
  - kind: swap
    words:
    - w-call
    who: 동료 간호사에게 · 도움 요청 기준
    icon: handshake2
    before:
    - 'If two of them get worse at once, '
    - tell somebody when you can
    - .
    options:
    - tell somebody when you can
    - call for help early
    - handle it yourself
    answer: call for help early
    notes:
      tell somebody when you can: 너무 느슨해요. 두 명이 동시에 나빠지면 한 사람 손으로는 모자라니 기다리지 말고 바로 불러야 해요.
      call for help early: 맞아요. 동시에 급변하면 일찍 도움을 요청해야 두 환자 모두 제때 처치받아요.
      handle it yourself: 위험해요. 혼자 둘을 감당하면 둘 다 처치가 늦어져요.
    ko: 두 명이 동시에 나빠지면 일찍 도움을 요청하세요
    why: 환자 둘이 동시에 나빠지는 상황은 혼자 감당할 수 없어요. 인계에서 미리 이럴 때는 일찍 도움을 부르기로 정해 두면 밤에 망설이지 않아요.
