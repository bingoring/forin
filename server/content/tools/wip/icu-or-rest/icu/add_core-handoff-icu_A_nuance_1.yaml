- title: SBAR 구조 인계 기초
  nuance:
  - kind: slider
    words:
    - w-sepsis
    cue: 'Doctor: "His MAP won''t come up even after fluids, so we''re starting a pressor."'
    scale:
    - infection
    - sepsis
    - septic shock
    answerAt: 2
    why: sepsis는 감염 때문에 장기 기능까지 흔들리는 상태예요. 수액을 넣어도 혈압이 안 올라 승압제가 필요해지면 septic shock이라고 불러요. 인계에서는 지금이 어느 단계인지 정확히 말해야 받는 사람이 대비해요.
    example: He has septic shock and needs a pressor.
    exKo: 패혈성 쇼크라서 승압제가 필요해요.
  - kind: pair
    words:
    - w-situation
    - w-background
    - w-assessment
    - w-recommendation
    pairs:
    - - situation
      - what is happening right now
    - - background
      - how he got here
    - - assessment
      - what I think is going on
    - - recommendation
      - what I would like done
    decoys:
    - who is on the unit
    why: SBAR의 S는 지금 일어나는 일, B는 오기까지의 경과, A는 내가 보는 판단, R은 내가 바라는 조치예요. 이 순서로 말하면 듣는 사람이 따라가기 쉬워요.
  - kind: context
    words:
    - w-sbar
    word: SBAR
    ko: SBAR(인계 형식)
    scenes:
    - who: 야간 동료
      icon: handshake2
      en: Let's go through his SBAR from the top.
      ok: true
    - who: 의사에게 전화
      icon: stetho
      en: 'I''ll give you his SBAR: sepsis, day two, MAP stable.'
      ok: true
    - who: 가족에게
      icon: home
      en: 'Let me go through his SBAR with you: situation, background, assessment, recommendation.'
      ok: false
      fix: Let me explain how he is doing right now and what we plan to do next.
    why: 동료와 의사에게는 SBAR이 서로 아는 짧은 틀이에요. 가족에게 알파벳 약어를 읊으면 낯설고 사무적으로 들려서, 지금 상태와 앞으로 계획을 쉬운 말로 풀어 줘요.
- title: 활력·주입약 인계
  nuance:
  - kind: slider
    words:
    - w-pressure
    - w-stable
    cue: 'Colleague: "Her MAP has slid from seventy-two to sixty-six over three hours — goal is sixty-five."'
    scale:
    - stable
    - drifting down
    - crashing
    answerAt: 1
    why: 목표 위에서 천천히 내려오는 건 drifting down이에요. 그냥 stable이라고 하면 방향이 사라지니 추세를 같이 말해요. crashing은 몇 분 안에 크게 떨어지는 급한 상황에만 써요.
    example: Her pressure is drifting down but still above goal.
    exKo: 혈압이 서서히 내려가고 있지만 아직 목표 위예요.
  - kind: pair
    words:
    - w-norepinephrine
    - w-propofol
    - w-titrate
    pairs:
    - - norepinephrine
      - raises her pressure
    - - propofol
      - keeps her sedated
    - - titrate
      - the drip to the goal
    decoys:
    - lowers her sugar
    why: norepinephrine은 혈압을 올리는 승압제, propofol은 재우는 진정제예요. titrate는 효과를 보며 약 속도를 목표에 맞게 올리고 내리는 일이에요.
  - kind: context
    words:
    - w-titrate
    word: titrate
    ko: 용량을 조절하다
    scenes:
    - who: 동료 간호사
      icon: handshake2
      en: I'm titrating the norepinephrine down as her MAP climbs.
      ok: true
    - who: 의사에게 전화
      icon: stetho
      en: I titrated up to ten per the order to hold a MAP of sixty-five.
      ok: true
    - who: 가족에게
      icon: home
      en: We're titrating her norepinephrine against a MAP target, so the pump numbers keep changing.
      ok: false
      fix: We're slowly adjusting her blood pressure medicine to keep her pressure safe.
    why: 의료진끼리는 titrate가 짧고 정확해요. 가족에게는 MAP 목표나 펌프 숫자까지 말하면 알아듣기 어려워서, 혈압약을 천천히 맞추고 있다고 쉽게 풀어 줘요.
- title: 라인·장치 목록 인계
  nuance:
  - kind: slider
    words:
    - w-dressing
    - w-change
    cue: 'Colleague: "The dressing is soaked through, and the edges are lifting."'
    scale:
    - clean and dry
    - a little damp
    - soaked and loose
    answerAt: 2
    why: 젖었거나 들뜨거나 더러워진 드레싱은 교체 예정일과 상관없이 바로 갈아요. 인계에서도 날짜가 아니라 지금 상태를 그대로 말해서 받는 사람이 바로 처치하게 해요.
    example: The dressing is soaked and loose, so I'll change it now.
    exKo: 드레싱이 젖고 들떠서 지금 교체할게요.
  - kind: pair
    words:
    - w-foley
    - w-ng
    - w-dressing
    pairs:
    - - Foley
      - drains urine
    - - NG
      - goes to suction
    - - dressing
      - gets changed on schedule
    decoys:
    - measures blood sugar
    why: Foley는 소변을 받아 내는 도뇨관, NG는 코로 위까지 넣은 관이라 흡인에 연결할 수 있고, 드레싱은 일정에 맞춰 교체해요.
  - kind: context
    words:
    - w-ng
    word: NG
    ko: 비위관
    scenes:
    - who: 동료 간호사
      icon: handshake2
      en: The NG is to low suction, and the output is clear.
      ok: true
    - who: 의사에게 보고
      icon: stetho
      en: NG output is down to fifty over the last four hours.
      ok: true
    - who: 가족에게
      icon: home
      en: His NG is on low intermittent suction, and it's draining bilious output.
      ok: false
      fix: The thin tube from his nose to his stomach is keeping his belly comfortable.
    why: 의료진끼리는 NG가 코에서 위로 들어간 관을 가리키는 짧은 말이에요. 가족에게 NG와 bilious output(담즙 섞인 배액) 같은 말을 쓰면 알아듣기 어려워서, 코에서 위까지 가는 관이라고 쉽게 풀어 줘요.
- title: 간호 문제·계획 인계
  nuance:
  - kind: slider
    words:
    - w-anxiety
    - w-trial
    cue: 'Patient: "I''m a little nervous about the trial, but I''m okay."'
    scale:
    - uneasy
    - anxious
    - panicking
    answerAt: 0
    why: 조금 긴장되지만 괜찮다는 말은 uneasy예요. 불안의 정도를 구분해 인계하면 밤 간호사가 얼마나 달래야 할지 준비해요. panicking은 숨이 가쁘고 통제가 안 될 때라 바로 곁에서 도와야 해요.
    example: She's uneasy about the trial but calm.
    exKo: 시도를 앞두고 조금 긴장했지만 차분해요.
  - kind: pair
    words:
    - w-wean
    - w-repeat
    - w-round
    pairs:
    - - wean
      - off the ventilator
    - - repeat
      - the lactate
    - - round
      - the unit with the team
    decoys:
    - by the window
    why: wean은 인공호흡기 도움을 서서히 줄여 떼는 일, repeat는 같은 검사를 한 번 더 하는 일, round는 의사팀이 환자를 차례로 도는 회진이에요.
  - kind: context
    words:
    - w-respiratory
    word: respiratory
    ko: 호흡기의
    scenes:
    - who: 동료 간호사
      icon: handshake2
      en: Respiratory status is her top priority tonight.
      ok: true
    - who: 의사에게 보고
      icon: stetho
      en: Her respiratory rate climbs whenever we lower the support.
      ok: true
    - who: 환자에게
      icon: me
      en: Your respiratory status is borderline, so we may not wean you today.
      ok: false
      fix: Your breathing still tires you out, so we'll go slowly with the breathing machine today.
    why: 의료진끼리는 respiratory가 정확하고 짧은 말이에요. 환자에게 borderline이나 wean 같은 말을 섞으면 무슨 뜻인지 몰라 불안해해서, 숨쉬기가 아직 힘들어 천천히 간다고 쉽게 말해요.
- title: 알레르기·주의사항 전달
  nuance:
  - kind: slider
    words:
    - w-anaphylaxis
    - w-allergy
    cue: 'Right after the first dose: her lips are swelling, she''s wheezing, and her pressure is dropping.'
    scale:
    - mild rash
    - hives
    - anaphylaxis
    answerAt: 2
    why: 입술이 붓고 쌕쌕거리며 혈압이 떨어지면 피부 반응이 아니라 anaphylaxis예요. 바로 약을 멈추고 도움을 불러, 병원 프로토콜대로 치료해요. 인계에서도 과거 반응이 어느 정도였는지 정확히 말해야 같은 약을 다시 쓰지 않아요.
    example: She had anaphylaxis after the first dose.
    exKo: 첫 투여 직후 아나필락시스가 왔어요.
  - kind: pair
    words:
    - w-contact
    - w-precaution
    - w-band
    - w-swab
    pairs:
    - - contact precautions
      - gown and gloves
    - - the allergy band
      - checked before every drug
    - - the swab
      - sent to the lab
    decoys:
    - fed through a tube
    why: 접촉주의에는 가운과 장갑을 쓰고, 알레르기 밴드는 약을 주기 전에 확인하고, 배양 검체(swab)는 검사실로 보내 결과를 기다려요.
  - kind: context
    words:
    - w-anaphylaxis
    word: anaphylaxis
    ko: 아나필락시스
    scenes:
    - who: 동료 간호사
      icon: handshake2
      en: She had anaphylaxis to penicillin, so check the band before you give anything.
      ok: true
    - who: 의사에게 보고
      icon: stetho
      en: Penicillin caused anaphylaxis last time, so please choose another antibiotic.
      ok: true
    - who: 환자에게
      icon: me
      en: You had anaphylaxis to penicillin, so it is contraindicated for you.
      ok: false
      fix: Your body had a severe allergic reaction to penicillin, so we won't give it to you.
    why: 의료진끼리는 anaphylaxis가 가장 심한 알레르기 반응을 가리키는 정확한 말이에요. 환자에게 anaphylaxis와 contraindicated를 그대로 말하면 알아듣기 어려워서, 몸이 심하게 알레르기 반응을 했다고 쉽게 풀어 줘요.
- title: 인계 중 확인질문 응대
  nuance:
  - kind: slider
    words:
    - w-read
    - w-catch
    cue: Over the alarm, you think you heard "fifteen," but it could have been "fifty."
    scale:
    - say nothing
    - ask once more
    - read it back
    answerAt: 2
    why: fifteen과 fifty는 소리가 비슷해서 한 번 더 묻는 것만으로는 부족해요. 들은 숫자를 되읽고, 자릿수를 풀어(one-five, five-zero) 확인하면 오해가 줄어요.
    example: 'I''ll read it back: fifteen, one-five.'
    exKo: 되읽을게요. 열다섯, 일-오.
  - kind: pair
    words:
    - w-milligram
    - w-unit
    - w-rate
    pairs:
    - - milligram
      - a weight
    - - unit
      - a measure for insulin or heparin
    - - rate
      - how fast it runs
    decoys:
    - how loud it is
    why: milligram은 무게 단위, unit은 인슐린이나 헤파린처럼 활성도로 재는 약에 쓰는 단위, rate는 주입 속도예요. 단위가 틀리면 용량이 크게 달라져서 숫자와 단위를 함께 말해요.
  - kind: swap
    words:
    - w-catch
    - w-rate
    who: 동료에게 · 못 들었을 때
    icon: handshake2
    before:
    - ''
    - Huh?
    - ' I didn''t catch the rate.'
    options:
    - Huh?
    - Sorry, could you say that again?
    - Okay, got it.
    answer: Sorry, could you say that again?
    notes:
      Huh?: 짧고 퉁명스럽게 들려서 상대가 서두르거나 불쾌해해요. 못 들은 건 정중하게 다시 말해 달라고 해야 해요.
      Sorry, could you say that again?: 정중하게 다시 말해 달라고 하는 표준 표현이에요. 못 들은 걸 숨기지 않고 바로 묻는 게 안전해요.
      Okay, got it.: 틀려요. 못 들었는데 알아들은 척하면 틀린 속도로 약을 줄 수 있어요.
    ko: 죄송한데 다시 말씀해 주시겠어요? 속도를 못 들었어요
    why: 인계에서 못 들은 것은 그냥 넘기지 않고 정중하게 다시 말해 달라고 해요. 알아들은 척하면 숫자가 틀린 채로 약이 나갈 수 있어요.
- title: ROSC 후 환자 인계
  nuance:
  - kind: slider
    words:
    - w-neuro
    cue: He opens his eyes when you say his name, then drifts back to sleep.
    scale:
    - alert
    - drowsy
    - comatose
    answerAt: 1
    why: 이름을 부르면 눈을 뜨고 곧 다시 잠드는 것은 drowsy(졸린 상태)예요. 심정지 후 인계에서는 의식 수준을 구체적으로 적어야 TTM 중 변화가 보여요. comatose는 자극에도 거의 반응이 없는 상태예요.
    example: He is drowsy but opens his eyes to voice.
    exKo: 졸려하지만 목소리에는 눈을 떠요.
  - kind: pair
    words:
    - w-rosc
    - w-ttm
    - w-lead
    pairs:
    - - ROSC
      - a pulse is back
    - - TTM
      - temperature control
    - - twelve-lead
      - a heart tracing
    decoys:
    - a lung volume
    why: ROSC는 심정지 뒤 스스로 맥박이 돌아온 것, TTM은 체온을 정해 둔 범위로 관리하는 치료, 12-lead는 심장을 여러 각도에서 기록한 심전도예요.
  - kind: context
    words:
    - w-rosc
    word: ROSC
    ko: 자발순환회복
    scenes:
    - who: 구급대원 → 간호사
      icon: siren
      en: We got ROSC at the scene after two rounds of epi.
      ok: true
    - who: 의사에게 보고
      icon: stetho
      en: He's post-ROSC with a MAP of seventy, and we're starting TTM.
      ok: true
    - who: 가족에게
      icon: home
      en: He's post-ROSC and we're starting TTM to prevent anoxic brain injury.
      ok: false
      fix: His heart is beating on its own again, and we're keeping his temperature carefully controlled to protect his brain.
    why: 의료진끼리는 ROSC·TTM이 정확하고 짧아요. 가족에게는 anoxic brain injury까지 약어로 말하면 겁만 주니, 심장이 다시 스스로 뛰고 뇌를 보호하는 중이라고 풀어 말해요.
