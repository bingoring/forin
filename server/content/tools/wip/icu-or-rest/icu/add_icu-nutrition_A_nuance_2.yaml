- situation: "혈당·전해질 연계 감시"
  items:
    - kind: slider
      words: [w-high]
      cue: "Nurse: \"One check after the rate increase was a little above target; the recheck is pending.\""
      scale: [slightly high, clearly high, dangerously high]
      answerAt: 0
      why: "목표를 조금 넘었고 재확인이 남았다면 slightly high예요. 급식 속도를 올린 뒤 혈당이 오를 수 있어서 같은 일정으로 다시 재고, 목표 범위를 넘으면 인슐린 조정을 의료진과 상의해요."
      example: "Her glucose is slightly high, so I'll recheck it on schedule."
      exKo: "혈당이 조금 높아서 일정대로 다시 확인할게요."
    - kind: context
      words: [w-glucose]
      word: glucose
      ko: 혈당
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Her glucose ran high after we increased the rate, so I'm asking about insulin coverage.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you check her glucose before the next rate change?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "Her glucose is elevated secondary to the enteral carbohydrate load.", ok: false, fix: "Her blood sugar went up a little since the feeding went up, and we're working on it with the team."}
      why: "의료진끼리는 glucose, insulin coverage처럼 수치와 조치를 짧게 말해요. 가족에게 secondary to, carbohydrate load 같은 말은 낯설고 차갑게 들려요. 혈당이 조금 올랐고 팀과 함께 조정하고 있다고 쉬운 말로 알려 줘요."
- situation: "장관영양 불내성 관리"
  items:
    - kind: slider
      words: [w-improve, w-residual]
      cue: "Nurse: \"Her residuals are only a touch lower than yesterday.\""
      scale: [slightly better, much better, back to normal]
      answerAt: 0
      why: "어제보다 아주 조금 줄었다면 slightly better예요. 좋아졌다고 서두르지 않고 속도를 올리기 전에 더 지켜보며, 위잔여량과 증상을 기록해 팀에 알려요."
      example: "Her residuals are slightly better, but I'll keep watching."
      exKo: "위잔여량이 조금 나아졌지만 계속 지켜볼게요."
    - kind: context
      words: [w-prokinetic]
      word: prokinetic
      ko: 촉진제
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Her residuals are still high, so would you like to order a prokinetic?", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Did pharmacy send up the prokinetic for her next dose?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "We're giving a prokinetic agent to augment her gastric motility.", ok: false, fix: "We're giving her a medicine that helps her stomach and gut move the feeding along."}
      why: "의료진끼리는 prokinetic 한 단어로 장운동을 돕는 약을 말해요. 가족에게 augment, gastric motility 같은 말은 어렵게 들려요. 위와 장이 급식을 밀어 내도록 돕는 약이라고 쉬운 말로 알려 줘요."
- situation: "재영양증후군 예방"
  items:
    - kind: slider
      words: [w-fast]
      cue: "Nurse: \"He's been malnourished for weeks. Reaching full feeds on day one could crash his phosphate.\""
      scale: [a little fast, too fast, far too fast]
      answerAt: 2
      why: "오래 굶은 환자에게 첫날부터 목표량까지 올리면 인과 칼륨 같은 수치가 급격히 떨어질 수 있어서 far too fast예요. 재영양증후군을 막으려면 낮게 시작해 천천히 늘리고, 영양 계획은 영양사와 의료진이 정해요."
      example: "Feeding him too fast right now could be dangerous."
      exKo: "지금 너무 빠르게 먹이면 위험할 수 있어요."
    - kind: context
      words: [w-monitor]
      word: monitor
      ko: 감시하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll monitor his phosphate, potassium, and magnesium closely as we advance.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you monitor his heart rhythm while the feeds go up?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "We're monitoring for hypophosphatemia, hypokalemia, and arrhythmia secondary to refeeding.", ok: false, fix: "We're checking his blood tests and his heart often while he starts getting food again."}
      why: "의료진끼리는 monitor와 전해질 이름으로 짧게 말해요. 가족에게 hypophosphatemia, arrhythmia 같은 말은 어렵고 겁을 줘요. 다시 영양이 들어가는 동안 혈액검사와 심장을 자주 본다고 쉬운 말로 알려 줘요."
- situation: "TPN 적응·관리"
  items:
    - kind: slider
      words: [w-strict]
      cue: "Policy: \"Scrub the hub, wear gloves, and never skip a step when you touch the TPN line.\""
      scale: [careful, strict, rigid]
      answerAt: 1
      why: "단계를 하나도 빼먹지 않는 라인 관리는 strict예요. TPN은 중심정맥으로 들어가서 감염 위험이 있어, 손 위생과 소독 같은 병원 절차를 엄격하게 지켜요."
      example: "We keep strict line care to prevent infection."
      exKo: "감염을 예방하려고 라인 관리를 엄격하게 해요."
    - kind: context
      words: [w-infection]
      word: infection
      ko: 감염
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll watch for any sign of line infection while he's on TPN.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you check the dressing for any sign of infection?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "TPN through central access carries a significant risk of bloodstream infection.", ok: false, fix: "The IV goes into a big vein, so we keep it very clean to keep germs out."}
      why: "의료진끼리는 line infection, sign처럼 짧게 말해요. 가족에게 bloodstream, central access, significant risk 같은 말은 겁을 줘요. 큰 혈관에 들어가는 줄이라 균이 못 들어가게 깨끗이 관리한다고 쉬운 말로 알려 줘요."
- situation: "복강내압 측정"
  items:
    - kind: slider
      words: [w-rising]
      cue: "Nurse: \"Readings an hour apart have barely changed.\""
      scale: [holding steady, creeping up, shooting up]
      answerAt: 0
      why: "거의 변하지 않았다면 holding steady예요. 한 번의 수치보다 시간에 따른 흐름이 중요해서 같은 방법과 자세로 재고 시각과 함께 기록해요. 오르는 추세가 보이면 의사에게 알려요."
      example: "The number is holding steady, but I'll keep trending it."
      exKo: "수치는 그대로지만 계속 추세를 볼게요."
    - kind: context
      words: [w-reading]
      word: reading
      ko: 측정값
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His last bladder pressure reading is higher than this morning's.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you chart the reading and the time?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "The intravesical pressure reading is a surrogate for intra-abdominal pressure.", ok: false, fix: "We measure the pressure inside his belly through his bladder tube, and we're watching the number."}
      why: "의료진끼리는 reading 한 단어로 측정값을 말해요. 가족에게 intravesical, surrogate 같은 말은 어렵게 들려요. 방광으로 배 안 압력을 재고 그 수치를 지켜본다고 쉬운 말로 알려 줘요."
- situation: "복부구획증후군 조기 인지"
  items:
    - kind: pair
      words: [w-urine, w-compartment, w-organ]
      pairs: [["urine", "output"], ["compartment", "syndrome"], ["organ", "function"]]
      decoys: ["pillow case"]
      why: "urine output은 단위 시간당 소변량이라 콩팥 기능과 관류를 가늠하는 지표예요. compartment syndrome은 막힌 공간 안의 압력이 올라 장기로 가는 피가 줄어드는 상태이고, organ function은 장기가 제 기능을 하는 정도예요."
    - kind: context
      words: [w-trend]
      word: trend
      ko: 추세
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His bladder pressure trend is up over the last four hours, and his urine output is down.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you pull up the pressure trend on the flowsheet?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "The trend shows progressive intra-abdominal hypertension with oliguric renal dysfunction.", ok: false, fix: "His pressure keeps creeping up and he's making less urine, so we're watching him very closely."}
      why: "의료진끼리는 trend 한 단어로 시간에 따른 방향을 말해요. 가족에게 intra-abdominal hypertension, oliguric 같은 말은 겁을 줘요. 압력이 계속 오르고 소변이 줄어 가까이 지켜보고 있다고 쉬운 말로 알려 줘요."
- situation: "영양 목표 열량·단백 조정"
  items:
    - kind: slider
      words: [w-critical, w-illness]
      cue: "ICU note: \"On the ventilator and a vasopressor, and still getting sicker.\""
      scale: [mildly ill, quite ill, critically ill]
      answerAt: 2
      why: "인공호흡기와 승압제가 필요할 만큼 상태가 나쁘면 critically ill이에요. 위중한 병중에는 단백질 요구량이 달라질 수 있어서, 열량과 단백 목표는 영양사와 의료진이 다시 계산해요."
      example: "Protein needs are higher during critical illness."
      exKo: "위중한 병중에는 단백질 요구량이 더 높아요."
    - kind: context
      words: [w-dietitian]
      word: dietitian
      ko: 영양사
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll ask the dietitian to recalculate his protein goal today.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Did the dietitian see him yet, or should I page her?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "The dietitian will perform a comprehensive assessment of his macronutrient requirements.", ok: false, fix: "Our dietitian will look at what his body needs and adjust his feeding plan."}
      why: "의료진끼리는 dietitian, goal처럼 계획을 짧게 말해요. 가족에게 macronutrient, comprehensive assessment 같은 말은 어렵게 들려요. 영양사가 몸에 필요한 것을 살펴 급식 계획을 조정한다고 쉬운 말로 알려 줘요."
- situation: "위잔여량·촉진제 사용"
  items:
    - kind: slider
      words: [w-great, w-sign]
      cue: "Nurse: \"Her residuals are down, and she took a spoonful by mouth after the swallow evaluation.\""
      scale: [an okay sign, a good sign, a great sign]
      answerAt: 2
      why: "위잔여량이 줄고 입으로 먹기까지 시작했다면 great sign이에요. 다만 좋아졌다고 속도를 바로 올리지 않고, 더 지켜본 뒤 의료진 지시에 따라 조정해요."
      example: "I told her family, and that's a great sign."
      exKo: "가족분께 알려드렸는데, 아주 좋은 징후예요."
    - kind: context
      words: [w-spoonful]
      word: spoonful
      ko: 한 숟가락
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "She took her first spoonful by mouth after speech therapy cleared her.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you stay with her for the first spoonful, since it's her first try by mouth?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "She tolerated an initial spoonful of puree consistency per os.", ok: false, fix: "She ate her first spoonful of pudding today, and she did well."}
      why: "의료진끼리는 first spoonful, cleared처럼 진행 상황을 짧게 말해요. 가족에게 puree consistency, per os 같은 말은 어렵게 들려요. 첫 숟가락을 잘 먹었다고 쉬운 말로 알려 줘요."
