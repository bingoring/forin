situations:
- title: 저·고칼슘 증상 관리
  s:
  - ["증상 해석", stetho, "'can mean'은 증상 하나로 단정하지 않고 가능성만 말하는 표현이에요. 경련과 저림은 칼슘이 모자랄 때 흔한 짝이에요.", "on the chart", "근육 경련과 발열은 저칼슘을 의미할 수 있습니다.", "근육 경련과 저림은 저칼륨을 의미할 수 있습니다.", "mean", "cure", "cost", "hide"]
  - ["검사 선택", lab, "'not just the total'은 총칼슘만 보지 않고 활성 형태까지 본다는 뜻이에요. 이온화칼슘은 몸에서 실제로 일하는 칼슘이에요.", "in the unit", "총칼슘 말고 이온화칼슘도 공유하겠습니다.", "총칼슘 말고 이온화칼슘도 메모하겠습니다.", "ionized", "dietary", "oral", "bone"]
  - ["보충·관찰", pill, "'carefully'와 'watch for'를 이으면 보충하고 반응을 본다는 두 단계가 한 문장에 들어가요. 'relief'는 증상이 나아지는 것을 말해요.", "at the bedside", "신중하게 확인하고 증상 호전 지켜보겠습니다.", "신중하게 보충하고 식사 호전 지켜보겠습니다.", "symptom", "price", "weight", "color"]
  - ["징후 보고", stetho, "'so'로 소견과 판단을 이으면 근거가 분명해져요. 'suspecting'은 확진 전 의심 단계라는 뜻이에요.", "in the room", "크보스텍 징후 양성이라 저칼슘혈증 보고하고 있습니다.", "크보스텍 징후 양성이라 저칼슘혈증 정리하고 있습니다.", "positive", "loud", "heavy", "early"]
  - ["고칼슘 증상", stetho, "'on the other hand'로 반대 상황을 대비시켜 말하면 두 증상군이 구별돼요. 'usually shows up as'는 보통 이렇게 나타난다는 뜻이에요.", "at home", "반대로 고칼슘은 보통 혼돈과 설사로 나타납니다.", "반대로 고칼륨은 보통 혼돈과 변비로 나타납니다.", "constipation", "diarrhea", "sneezing", "itching"]
  - ["주입 이유", pill, "'since'로 이유를 말하면 왜 천천히 주는지 팀이 이해해요. 빠른 칼슘은 정맥을 자극할 수 있어서 속도를 지켜야 해요.", "from the pharmacy", "빠르게 주면 약이 식어서 천천히 주입하겠습니다.", "빠르게 주면 정맥이 따가워서 천천히 준비하겠습니다.", "burn", "freeze", "shrink", "stain"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저칼슘 의심 4문장 순서
    why: 징후를 보고하고 의심을 밝힌 뒤, 그것을 확인할 검사를 정하고, 확인되면 천천히 보충한다고 말하고, 들어간 뒤 증상을 지켜본다고 마무리해요.
    lines:
    - ["His Chvostek sign is positive, so I'm suspecting hypocalcemia.", stetho, "크보스텍 징후 양성이라 저칼슘혈증 의심하고 있습니다", "보고"]
    - ["Let's check the ionized calcium, not just the total, to confirm that.", lab, "그걸 확인하려고 총칼슘 말고 이온화칼슘도 확인하겠습니다", "검사"]
    - ["If that confirms it, we'll replace calcium slowly, since fast calcium can burn the vein.", pill, "그게 확인되면 빠르면 정맥이 따가우니 칼슘을 천천히 보충하겠습니다", "보충"]
    - ["Once it's in, we'll watch for symptom relief.", monitor, "들어가고 나면 증상 호전을 지켜보겠습니다", "관찰"]
- title: 저인산혈증 관리
  s:
  - ["위험 설명", stetho, "'can weaken'은 가능성을 말하는 표현이에요. 인산은 근육이 힘을 내는 데 쓰여서 모자라면 호흡근도 약해져요.", "in the unit", "저인산은 다리근을 약하게 만들 수 있습니다.", "저철분은 호흡근을 약하게 만들 수 있습니다.", "weaken", "wrap", "fold", "clean"]
  - ["감시 이유", monitor, "'often'과 'during refeeding'을 함께 쓰면 언제 위험한지 알려 줘요. 'so'로 이유와 행동을 이어요.", "on the chart", "재영양 중에 자주 떨어져서 유심히 정리합니다.", "재영양 중에 자주 떨어져서 유심히 안내합니다.", "refeeding", "bathing", "visiting", "resting"]
  - ["이탈 지원", pill, "'to support'로 목적을 붙이면 보충과 재검이 이탈을 위한 것이라는 점이 분명해요. 'weaning'은 인공호흡기를 줄여 가는 과정이에요.", "at the desk", "보충하고 재검해서 퇴원을 도와주겠습니다.", "보충하고 재검해서 이송을 도와주겠습니다.", "weaning", "walking", "bathing", "dressing"]
  - ["상태 보고", monitor, "수치와 호흡 소견을 'and'로 이어 보고하면 인산과 호흡의 연결이 보여요. 'look small'은 눈으로 본 인상을 말하는 표현이에요.", "in the chart", "인산 1.1, 호흡수가 작아 보입니다.", "인산 1.1, 일회 심박출량이 작아 보입니다.", "tidal", "stroke", "urine", "plasma"]
  - ["보충 경로", pill, "'through the feeding tube and IV both'는 두 경로를 함께 쓴다는 뜻이에요. 'We're replacing'은 지금 진행 중이라는 보고예요.", "at the bedside", "경관영양 튜브와 정맥 둘 다로 기록하고 있습니다.", "경관영양 튜브와 정맥 둘 다로 확인하고 있습니다.", "feeding", "drainage", "breathing", "chest"]
  - ["재검 계획", lab, "'before we try'는 검사 결과를 보고 다음 시도를 정한다는 순서예요. 'in six hours'는 다음 재검 시점을 정해 줘요.", "on the unit", "다시 이탈 시도 전에 6시간 뒤 기록하겠습니다.", "다시 이탈 시도 전에 6시간 뒤 보고하겠습니다.", "recheck", "refill", "relabel", "rewrite"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저인산혈증 4문장 순서
    why: 수치와 호흡 소견을 먼저 보고하고, 인산이 호흡근에 미치는 영향을 말한 뒤, 그 문제를 고치려고 보충하고, 이탈을 다시 시도하기 전에 재검한다고 마무리해요.
    lines:
    - ["His phosphate is one point one, and his tidal volumes look small.", monitor, "인산 1.1, 일회호흡량이 작아 보입니다", "보고"]
    - ["Low phosphate can weaken the breathing muscles, which fits.", stetho, "저인산은 호흡근을 약하게 만들 수 있어서 맞아떨어집니다", "설명"]
    - ["To fix that, we're replacing phosphate through the feeding tube and IV both.", pill, "그걸 고치려고 경관영양 튜브와 정맥 둘 다로 인산을 보충하고 있습니다", "보충"]
    - ["I'll recheck in six hours before we try weaning again.", lab, "다시 이탈을 시도하기 전에 6시간 뒤 재검하겠습니다", "재검"]
- title: 재영양증후군 예방 감시
  s:
  - ["위험 설명", shield, "'too fast'가 위험의 원인이라는 점을 짚어 줘요. 굶던 환자에게 영양을 빨리 주면 세포가 전해질을 한꺼번에 끌어들여 혈중 수치가 떨어져요.", "in the unit", "수액을 너무 빨리 시작하면 인산, 칼륨, 마그네슘이 급격히 떨어질 수 있습니다.", "영양을 너무 빨리 시작하면 인산, 칼륨, 철분이 급격히 떨어질 수 있습니다.", "phosphate", "iron", "zinc", "copper"]
  - ["예방 원칙", shield, "'first'로 우선순위를 못 박아 전해질 보충이 영양보다 앞선다는 점을 알려요. 'slowly'와 함께 두 가지 안전 원칙이 한 문장에 들어가요.", "at noon", "영양은 천천히 늘리고 전해질부터 확인합니다.", "수액은 천천히 늘리고 전해질부터 보충합니다.", "advance", "order", "label", "weigh"]
  - ["감시 계획", monitor, "'as we start'는 영양을 시작하는 시점부터 본다는 뜻이에요. 'closely'를 붙여 수치 변화를 놓치지 않겠다는 계획을 알려요.", "on the chart", "영양 시작하면서 검사 수치 유심히 계산하겠습니다.", "영양 시작하면서 검사 수치 유심히 안내하겠습니다.", "feeding", "bathing", "walking", "resting"]
  - ["위험 평가", stetho, "기간과 결과를 'so'로 이으면 위험이 높다는 판단의 근거가 분명해져요. 'malnourished'는 영양이 오래 부족했다는 뜻이에요.", "in the chart", "몇 년간 영양실조 상태라 위험이 높습니다.", "몇 주간 탈수 상태라 위험이 높습니다.", "malnourished", "anemic", "jaundiced", "febrile"]
  - ["확인 계획", lab, "'before we advance'는 속도를 올리기 전에 확인한다는 순서예요. 세 전해질을 나열하면 확인할 목록이 정리돼요.", "at the desk", "속도 올리기 전에 인산, 칼륨, 마그네슘 정리하고 있습니다.", "속도 올리기 전에 인산, 칼륨, 마그네슘 안내하고 있습니다.", "advance", "label", "print", "weigh"]
  - ["목표 설정", chartup, "'for the first couple of days'로 기간을 정해 낮은 목표가 임시라는 점을 알려요. 'Keep'은 계속 유지하라는 지시예요.", "on the unit", "첫 며칠은 칼로리 목표를 낮게 기록하겠습니다.", "첫 몇 주는 칼로리 목표를 낮게 유지하겠습니다.", "calorie", "noise", "light", "visitor"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 재영양 위험 관리 4문장 순서
    why: 빠른 영양 시작의 위험을 먼저 말하고, 천천히 늘리며 전해질을 먼저 채운다는 원칙을 밝힌 뒤, 그에 맞게 칼로리 목표를 낮추고, 그 기간에 세 수치를 확인한 뒤 속도를 올린다고 해요.
    lines:
    - ["Starting feeds too fast can crash his phosphate, potassium, and magnesium.", shield, "영양을 너무 빨리 시작하면 인산, 칼륨, 마그네슘이 급격히 떨어질 수 있습니다", "위험"]
    - ["We advance nutrition slowly and replace electrolytes first.", shield, "영양은 천천히 늘리고 전해질부터 보충합니다", "원칙"]
    - ["That means keeping the calorie goal low for the first couple of days.", chartup, "그래서 첫 며칠은 칼로리 목표를 낮게 유지합니다", "목표"]
    - ["During those days, we check those three levels before we advance the rate.", lab, "그 기간에 속도를 올리기 전에 그 세 수치를 확인합니다", "확인"]
- title: 종양용해증후군 대사 관리
  s:
  - ["TLS 인지", stetho, "'suggest'는 수치 패턴만으로 확진하지 않고 가능성을 말하는 표현이에요. 세 가지가 함께 오르면 종양이 한꺼번에 깨질 때의 전형적인 모양이에요.", "on the chart", "칼륨, 인산, 혈당 상승은 종양용해를 시사합니다.", "칼륨, 인산, 요산 상승은 패혈증을 시사합니다.", "uric", "lactic", "folic", "citric"]
  - ["수액·칼슘", pill, "'aggressive fluids'는 소변을 많이 만들어 노폐물을 씻어 내려는 치료예요. 'check for low calcium'은 인산이 오르면 칼슘이 떨어질 수 있어서예요.", "in the unit", "적극적인 수액 확보하고 저칼슘 공유하겠습니다.", "적극적인 수액 확보하고 저칼슘 메모하겠습니다.", "calcium", "vision", "hearing", "weight"]
  - ["감시·참여", monitor, "'involve the team early'는 문제가 커지기 전에 팀을 부른다는 뜻이에요. 'closely'와 'early'로 감시와 협력을 함께 말해요.", "at the desk", "검사 유심히 기록하고 팀을 일찍 참여시키겠습니다.", "검사 유심히 모니터하고 팀을 일찍 소개하겠습니다.", "labs", "tubes", "beds", "doors"]
  - ["병력 보고", stetho, "'for'로 치료의 이유를 붙이면 위험 배경이 분명해져요. 'started … yesterday'는 시작 시점을 말해 시간 흐름이 보여요.", "in the chart", "종양 부담이 커서 오늘 항암 시작했습니다.", "종양 부담이 커서 어제 방사선 시작했습니다.", "chemo", "dialysis", "surgery", "steroids"]
  - ["약물 보고", pill, "'is ordered'는 오더가 이미 났다는 보고예요. 'to bring down'으로 목적을 붙이고 'fast'로 속도를 말해요.", "on the pump", "칼륨을 빨리 낮추려고 라스부리케이스 오더 났습니다.", "요산을 빨리 낮추려고 라스부리케이스 오더 확인했습니다.", "ordered", "stored", "printed", "labeled"]
  - ["재검 계획", lab, "'every four hours until'은 간격과 끝나는 조건을 함께 말해요. 'things'는 수치들을 가볍게 가리키는 말이에요.", "on the unit", "안정될 때까지 4시간마다 검사 기록하겠습니다.", "안정될 때까지 4시간마다 검사 보고하겠습니다.", "stabilize", "melt", "spill", "break"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 종양용해증후군 4문장 순서
    why: 항암 시작이라는 배경을 먼저 말하고, 수치 패턴이 종양용해를 시사한다고 알린 뒤, 수액과 칼슘 확인으로 대응하고, 수액이 들어가는 동안 4시간마다 재검한다고 해요.
    lines:
    - ["He started chemo yesterday for a high tumor burden.", stetho, "종양 부담이 커서 어제 항암을 시작했습니다", "배경"]
    - ["Now rising potassium, phosphate, and uric acid suggest tumor lysis.", stetho, "이제 칼륨, 인산, 요산 상승이 종양용해를 시사합니다", "소견"]
    - ["To manage that, let's ensure aggressive fluids and check for low calcium.", pill, "그걸 관리하려고 적극적인 수액을 확보하고 저칼슘을 확인하겠습니다", "대응"]
    - ["With fluids running, I'll recheck labs every four hours until things stabilize.", lab, "수액이 들어가는 동안 안정될 때까지 4시간마다 재검하겠습니다", "재검"]
- title: 생명위협 고칼륨혈증 위기
  s:
  - ["위기 인지", siren, "'sine wave'는 고칼륨이 심해졌을 때 나오는 위험한 심전도 모양이에요. 'life-threatening'은 지금 바로 움직여야 한다는 신호예요.", "on the monitor", "심전도에 ST 상승 보입니다 — 생명 위협 상황입니다.", "심전도에 심방세동 보입니다 — 생명 위협 상황입니다.", "sine", "square", "flat", "round"]
  - ["칼슘 먼저", siren, "'now'로 시점을 못 박고 'then'으로 다음 약을 이어 순서가 분명해요. 칼슘이 심장을 먼저 보호하고, 인슐린과 포도당이 칼륨을 세포 안으로 옮겨요.", "at the bedside", "지금 칼슘 줘서 신장 안정시키고, 이어서 인슐린과 포도당입니다.", "지금 칼슘 줘서 뇌 안정시키고, 이어서 인슐린과 포도당입니다.", "stabilize", "cover", "paint", "wrap"]
  - ["투석 가동", siren, "'emergent'는 지금 바로 해야 하는 응급이라는 뜻이에요. 약으로는 부족할 때 투석이 칼륨을 몸 밖으로 빼 줘요.", "in the unit", "수분 제거하려고 응급 투석 가동하겠습니다.", "요산 제거하려고 응급 투석 가동하겠습니다.", "activate", "document", "bill", "scan"]
  - ["즉시 투여", siren, "'don't wait for'는 기다리면 안 된다는 직접 지시예요. 위기에서는 펌프가 준비되길 기다리지 않고 직접 천천히 밀어 줘요.", "at the desk", "지금 글루콘산칼슘 미세요 — 알람 기다리지 마세요.", "지금 글루콘산칼슘 미세요 — 결과 기다리지 마세요.", "pump", "printer", "porter", "elevator"]
