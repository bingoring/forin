- title: 패혈증 조기 인지
  s:
  - {t: "활력 확인", i: stetho, w: "how alert he is는 간접 의문이라 어순이 평서문 그대로예요. 수치와 의식 상태를 한 문장에 나열하면 무엇을 살피는지 한 번에 전해져요.", d: "on the schedule", k: ["지금 호흡수, 체온, 그리고 얼마나 각성됐는지 확인하고 있어요", "지금 맥박수, 혈압, 그리고 얼마나 각성됐는지 확인하고 있어요"], a: "alert", o: ["tall", "heavy", "old"]}
  - {t: "이유 설명", i: magnify, w: "so는 앞의 이유에서 지금의 행동으로 이어 주는 접속사예요. 징후가 하는 일을 먼저 말하면 지켜보는 것이 근거 있는 일로 들려요.", d: "in the hallway", k: ["이 징후들이 출혈을 일찍 포착하게 도와줘서 세심하게 지켜보고 있어요", "이 검사들이 감염을 일찍 포착하게 도와줘서 세심하게 지켜보고 있어요"], a: "closely", o: ["loudly", "bravely", "happily"]}
  - {t: "변화 보고", i: speech, w: "if anything changes는 조건을 먼저 정해 두는 모양이에요. let 뒤에는 동사원형이 오고, right away로 알리는 시점을 분명히 해요.", d: "for the visitors", k: ["무엇이든 변화가 있다고 바로 의사에게 알렸어요", "무엇이든 변화가 있는지 바로 의사에게 여쭤볼게요"], a: "changes", o: ["spills", "expires", "closes"]}
  - {t: "징후 설명", i: bulb, w: "exactly는 범위를 좁히는 강조 부사라서 이 둘이 우연이 아니라 일부러 찾는 신호임을 보여 줘요. screening for는 증상이 있는지 훑어 가며 찾는다는 뜻이에요.", d: "with a pencil", k: ["갑작스러운 혼돈과 빠른 맥박이 바로 제가 살피고 있는 징후예요", "갑작스러운 고열과 빠른 호흡이 바로 제가 살피고 있는 징후예요"], a: "fast", o: ["slow", "quiet", "steady"]}
  - {t: "설명 약속", i: handshake2, w: "even though는 반대되는 상황을 인정하면서도 행동은 그대로라는 뜻이에요. 혼란스러운 환자와 가족에게도 하는 일을 말로 알려 주면 낯선 처치가 덜 무서워져요.", d: "by the window", k: ["지금 불안해 보이셔도 제가 뭘 하는지 계속 설명해 드릴게요", "지금 혼란스러워 보이셔도 제가 뭘 했는지 계속 설명해 드릴게요"], a: "doing", o: ["wearing", "eating", "reading"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "패혈증 의심 환자 확인 4문장 순서"
    why: "먼저 무엇을 확인하는지 말하고, 그 수치가 곧 감염을 일찍 잡는 징후라고 이어요. 3줄의 those signs는 2줄이 이름 붙인 징후를 가리키고, 4줄의 the doctor는 3줄에서 처음 나온 의사를 가리켜서 순서가 하나예요."
    lines:
    - {en: "I'm checking his breathing rate, blood pressure, and alertness.", icon: stetho, ko: "호흡수, 혈압, 각성 상태를 확인하고 있어요", note: "확인"}
    - {en: "Together, they are the signs that help us catch infection early.", icon: bulb, ko: "이것들이 함께 감염을 일찍 잡게 돕는 징후예요", note: "이유"}
    - {en: "If any of those signs change, I'll let the doctor know right away.", icon: speech, ko: "그 징후가 하나라도 변하면 바로 의사에게 알릴게요", note: "보고"}
    - {en: "I'll share whatever the doctor decides with you.", icon: handshake2, ko: "의사가 정하는 건 뭐든 알려 드릴게요", note: "공유"}
- title: 젖산·혈액배양 채취
  s:
  - {t: "검사 순서", i: lab, w: "before antibiotics는 전치사 before로 시간 순서를 말해요. 항생제가 균 검출을 어렵게 만들 수 있어서 채취 순서가 중요하다는 점이 이 한마디에 담겨 있어요.", d: "in the cabinet", k: ["정확한 용량을 찾으려고 항생제 전에 이 배양검사를 채취해요", "정확한 위치를 찾으려고 항생제 전에 이 배양검사를 채취해요"], a: "exact", o: ["extra", "easy", "empty"]}
  - {t: "검사 설명", i: lab, w: "tells us 뒤에 how 절을 붙이면 수치가 알려 주는 내용을 설명하는 모양이에요. 낯선 검사 이름을 환자 몸의 반응이라는 말로 풀어 줘요.", d: "on the clipboard", k: ["이 젖산 수치가 몸이 열에 어떻게 대응하고 있는지 알려줘요", "이 혈당 수치가 몸이 감염에 어떻게 대응하고 있는지 알려줘요"], a: "handling", o: ["hiding", "carrying", "repairing"]}
  - {t: "안심 설명", i: shield, w: "It only takes a moment의 only는 짧다는 점을 부각해 부담을 줄여 줘요. 시간이 짧다는 말에 이유를 이어 붙이면 환자가 협조하기 쉬워져요.", d: "with the menu", k: ["잠깐이면 되고, 올바른 방법으로 진찰하는 데 도움이 돼요", "한 시간 걸리고, 올바른 방법으로 치료하는 데 도움이 돼요"], a: "treat", o: ["greet", "visit", "dress"]}
  - {t: "지연 없음", i: shield, w: "right after는 앞의 일이 끝나자마자 이어진다는 뜻이고, won't delay가 기다림이 없다고 못 박아요. 배양 채취가 치료를 늦추지 않는다는 점을 분명히 말해 주는 문장이에요.", d: "at the entrance", k: ["지금 배양검사를 채취하고 바로 항생제를 시작할 거라, 퇴원이 지연되지 않아요", "지금 배양검사를 채취하고 바로 항생제를 시작할 거라, 면회가 지연되지 않아요"], a: "antibiotic", o: ["bandage", "blanket", "brochure"]}
  - {t: "검사 목적", i: magnify, w: "causing this는 현재분사가 뒤에서 bacteria를 꾸며 주는 모양이에요. 원인이 되는 균을 알아야 치료 대상이 분명해진다는 논리를 so로 이어요.", d: "from the pharmacy", k: ["검사실에서 정확한 알레르기를 확인해서, 무엇을 치료해야 할지 정확히 알게 돼요", "검사실에서 정확한 원인균을 확인해서, 누구를 치료해야 할지 정확히 알게 돼요"], a: "lab", o: ["kitchen", "laundry", "garage"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "배양검사 채취 설명 4문장 순서"
    why: "채취하는 중이라고 먼저 말하고, 그 채취가 짧다고 안심시킨 뒤, 끝나는 즉시 항생제가 이어진다고 약속해요. 마지막 줄은 Later로 항생제 시작 뒤의 일임을 못 박아서 순서가 하나예요."
    lines:
    - {en: "Now I'm drawing your blood cultures and a lactate.", icon: lab, ko: "지금 혈액배양과 젖산 검사를 채취하고 있어요", note: "채취"}
    - {en: "Drawing them only takes a moment.", icon: shield, ko: "채취는 잠깐이면 돼요", note: "안심"}
    - {en: "As soon as that's done, the antibiotic starts.", icon: pill, ko: "그게 끝나자마자 항생제를 시작해요", note: "약속"}
    - {en: "Later, the lab will use those cultures to find the exact bacteria.", icon: magnify, ko: "나중에 검사실이 그 배양으로 정확한 균을 찾아요", note: "결과"}
