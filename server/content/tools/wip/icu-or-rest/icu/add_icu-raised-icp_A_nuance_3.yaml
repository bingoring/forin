"진정 중단과 신경검사 균형":
  - kind: slider
    words: [w-briefly]
    cue: "Sedation is turned down for a short window just to examine him."
    scale: [forever, always, briefly]
    answerAt: 2
    why: "신경 검사를 위해 진정을 잠깐만 줄이는 것이므로 briefly(잠깐)가 맞아요. 이때 ICP를 자세히 보고 오르면 다시 진정시켜요."
    example: "We'll briefly lighten his sedation to examine him."
    exKo: "검사를 위해 진정을 잠깐 얕게 할게요."
  - kind: context
    words: [w-sedative]
    word: sedative
    ko: 진정제
    scenes:
      - {who: 의사에게 보고, icon: monitor, en: "Sedative held for the neuro exam, ICP stable at twelve.", ok: true}
      - {who: 가족에게, icon: me, en: "The sedative is being held per order for a neuro wake-up.", ok: false, fix: "We're lightening his sleep medicine for a short time so we can check how he's doing."}
      - {who: 차트 기록, icon: board, en: "Sedative held at 0730, resumed at 0800 after exam.", ok: true}
    why: "의료진끼리는 sedative held, neuro wake-up이 간결하고 정확해요. 가족에게는 무슨 뜻인지 알기 어려워요. 왜 잠깐 줄이는지를 쉬운 말로 설명해 주세요."
"뇌탈출 임박 위기":
  - kind: slider
    words: [w-immediately]
    cue: "Blown pupil: call neurosurgery this very moment, not after the next set of vitals."
    scale: [shortly, quickly, immediately]
    answerAt: 2
    why: "뇌탈출이 의심되면 한 시간도 기다릴 수 없어요. immediately는 지체 없이 바로, quickly는 서두르지만 약간의 여유가 있고, shortly는 곧이에요. 동공이 산대되면 즉시 보고해요."
    example: "Tell the doctor immediately if a pupil changes."
    exKo: "동공이 달라지면 즉시 의사에게 말하세요."
  - kind: swap
    words: [w-herniation]
    who: "가족에게 · 응급 설명"
    icon: me
    before: ["The pressure may be causing a ", "herniation", ", and we're acting now."]
    options: [dangerous shift of the brain, herniation, uncal herniation]
    answer: dangerous shift of the brain
    notes: {dangerous shift of the brain: "무슨 일이 생기는지 쉬운 말로 알려 주면서 지금 조치하고 있다는 점도 전한다.", herniation: "의료 용어라 가족은 이해하기 어렵다.", uncal herniation: "더 세부적인 용어라 가족에게는 오히려 혼란스럽다."}
    why: "가족에게는 용어보다 무슨 일이 생기고 있고 지금 무엇을 하는지를 쉬운 말로 알려 주세요."
    ko: "압력 때문에 뇌가 위험하게 밀릴 수 있어서 지금 조치하고 있어요"
"EVD 막힘·과배액 위기":
  - kind: slider
    words: [w-usually]
    cue: "No fluctuation and a rising ICP most of the time mean a blockage, but not every time."
    scale: [rarely, always, usually]
    answerAt: 2
    why: "파동이 없고 ICP가 오르면 보통은 막힘을 뜻하지만 항상은 아니에요. usually는 대부분, always는 예외 없이, rarely는 드물게예요. 그래서 확정하기 전에 재위치와 재평가를 하고 신경외과에 알려요."
    example: "No fluctuation usually means the drain is blocked."
    exKo: "파동이 없으면 보통 배액관이 막혔다는 뜻이에요."
  - kind: context
    words: [w-block]
    word: blocked
    ko: 막히다
    scenes:
      - {who: 의사에게 보고, icon: monitor, en: "EVD appears blocked: no fluctuation and ICP is climbing.", ok: true}
      - {who: 가족에게, icon: me, en: "The EVD is blocked, so the ventriculostomy has failed and may need revision.", ok: false, fix: "The small tube is blocked for now, and the surgeon is coming to look at it."}
      - {who: 차트 기록, icon: board, en: "EVD blocked at 0215, neurosurgery notified.", ok: true}
    why: "의료진끼리는 EVD, ventriculostomy 같은 용어와 간결한 보고가 정확해요. 가족에게 실패나 수정 같은 말을 쓰면 불필요하게 겁을 줘요. 지금 막혀 있고 의사가 보러 온다는 사실만 쉬운 말로 전하세요."
"ICP 급상승 불응 위기":
  - kind: slider
    words: [w-possibility]
    cue: "We haven't decided on surgery, but it is on the table as an option."
    scale: [possibility, certainty, impossibility]
    answerAt: 0
    why: "아직 결정은 아니지만 선택지로 올라와 있으므로 possibility(가능성)가 맞아요. certainty는 확정, impossibility는 불가능이라 맞지 않아요. 가족에게는 결정이 아니라 가능성이라고 정직하게 알려요."
    example: "Surgery is a real possibility if medicine isn't enough."
    exKo: "약으로 충분하지 않으면 수술이 실제 가능성이에요."
  - kind: swap
    words: [w-decompressive]
    who: "가족에게 · 수술 가능성 설명"
    icon: me
    before: ["We may need ", "decompressive surgery", " if medicines aren't enough."]
    options: [an operation to relieve the pressure, decompressive surgery, a craniectomy]
    answer: an operation to relieve the pressure
    notes: {an operation to relieve the pressure: "수술이 무엇을 위한 것인지 쉬운 말로 설명한다.", decompressive surgery: "의료 용어라 가족은 의미를 알기 어렵다.", a craniectomy: "더 세부적인 수술 이름이라 가족에게는 어렵다."}
    why: "가족에게는 수술 이름보다 목적을 쉬운 말로 먼저 알려 주세요."
    ko: "약으로 충분하지 않으면 압력을 덜어 주는 수술이 필요할 수 있어요"
"급성 뇌출혈 확대 악화":
  - kind: slider
    words: [w-rapid]
    cue: "Over twenty minutes his GCS fell from 14 to 9."
    scale: [rapid, steady, slow]
    answerAt: 0
    why: "스무 분 만에 크게 떨어졌다면 rapid(급격한)예요. steady는 일정하게, slow는 천천히를 뜻해요. 급격한 악화는 출혈이 커질 수 있다는 신호라 즉시 보고해요."
    example: "He had a rapid decline in the last hour."
    exKo: "지난 한 시간 동안 급격히 악화됐어요."
  - kind: swap
    words: [w-anticoagulation]
    who: "가족에게 · 치료 설명"
    icon: me
    before: ["We're reversing his ", "anticoagulation", " right now."]
    options: [blood thinner, anticoagulation, heparin effect]
    answer: blood thinner
    notes: {blood thinner: "가족이 흔히 아는 말이라 바로 이해한다.", anticoagulation: "의료 용어라 가족에게는 어렵다.", heparin effect: "특정 약 이름이라 맞는 약인지 확신할 수 없고 가족에게는 낯설다."}
    why: "가족에게는 익숙한 말인 혈액을 묽게 하는 약(blood thinner)으로 설명해 주세요."
    ko: "지금 혈액을 묽게 하는 약의 작용을 되돌리고 있어요"
"요붕증·SIADH 급변 관리":
  - kind: pair
    words: [w-di, w-siadh]
    pairs: [[DI, large dilute urine with rising sodium], [SIADH, low sodium with concentrated urine]]
    decoys: [a normal sodium level]
    why: "요붕증(DI)은 항이뇨호르몬이 부족해 묽은 소변이 많이 나오고 나트륨이 오르며, SIADH는 항이뇨호르몬이 과해 소변이 농축되고 나트륨이 떨어져요. 그래서 DI는 손실을 보충하고 SIADH는 수분을 제한해요."
  - kind: swap
    words: [w-siadh]
    who: "가족에게 · 상태 설명"
    icon: me
    before: ["He may have ", "SIADH", ", which keeps too much water in his body."]
    options: [a hormone problem, SIADH, ADH excess]
    answer: a hormone problem
    notes: {a hormone problem: "가족이 이해하기 쉬운 말로 원인을 알려 준다.", SIADH: "약어라 가족은 알아듣지 못한다.", ADH excess: "원인은 맞지만 약어가 섞여 가족에게는 어렵다."}
    why: "가족에게는 약어 대신 무엇이 문제인지 쉬운 말로 알려 주세요."
    ko: "수분을 너무 많이 붙잡아 두는 호르몬 문제가 있을 수 있어요"
"뇌사 진행 인지·검사 연계":
  - kind: slider
    words: [w-final]
    cue: "Not yet confirmed; two separate exams are still pending."
    scale: [final, tentative, certain]
    answerAt: 1
    why: "검사가 끝나기 전에는 결과가 아직 확정이 아니라는 뜻으로 tentative(잠정적)가 맞아요. final은 최종, certain은 확실함이에요. 가족에게는 아직 최종이 아니라고 정직하게 알려요."
    example: "This isn't a final diagnosis yet, so we're waiting."
    exKo: "아직 최종 진단이 아니라서 기다리고 있어요."
  - kind: context
    words: [w-concerning]
    word: concerning
    ko: 우려되는
    scenes:
      - {who: 의사에게 보고, icon: monitor, en: "The exam is concerning: no motor response and sluggish pupils.", ok: true}
      - {who: 가족에게, icon: me, en: "Your husband's exam is concerning, so there's nothing more we can do.", ok: false, fix: "The exam is concerning, and we're doing more testing before we can say more."}
      - {who: 차트 기록, icon: board, en: "Exam concerning for worsening neuro status, team notified.", ok: true}
    why: "의료진끼리는 concerning이 상태가 안 좋다는 간결한 보고예요. 하지만 가족에게 더 해 줄 게 없다고 단정하면 근거 없는 절망을 줘요. 지금 무엇을 하고 있는지와 아직 모른다는 점을 정직하게 말해야 해요."
