situations:
- title: 간성뇌증 단계별 관리
  s:
  - ["악화 요인", fire, "'Things like'로 예를 들어 말하면 가족이 원인을 구체적으로 떠올릴 수 있어요. 감염과 출혈은 간성뇌증을 흔히 악화시키는 요인이에요.", "such as the", "감염이나 출혈 같은 것들이 통증을 악화시킬 수 있어요.", "감염이나 알레르기 같은 것들이 혼란을 악화시킬 수 있어요.", "worsen", "relieve", "explain", "measure"]
  - ["원인 치료", magnify, "'looking for … and treating it'을 진행형으로 말하면 지금 두 가지가 함께 진행 중이라는 뜻이 돼요.", "for the cause", "유발요인을 찾아서 기록하고 있어요.", "유발요인을 찾아서 정리하고 있어요.", "looking", "waiting", "hoping", "asking"]
  - ["치료 기대", pill, "'should help'는 보장이 아니라 기대를 말해서 정직하고 부드러워요. 'clear'는 정신이 맑아진다는 뜻으로 써요.", "to help", "락툴로오스와 다른 조치들이 그의 통증을 줄이는 데 도움이 될 거예요.", "락툴로오스와 다른 검사들이 그의 정신을 맑게 하는 데 도움이 될 거예요.", "clear", "sleep", "relax", "eat"]
  - ["경과 안내", chartup, "'comes in stages'로 단계가 있다고 말하면 가족이 오르내림을 이해하기 쉬워요. 'it can improve'로 희망도 함께 줘요.", "in the", "이런 종류의 열은 단계적으로 오고, 좋아질 수 있어요.", "이런 종류의 혼란은 밤마다 오고, 좋아질 수 있어요.", "confusion", "pain", "itching", "fever"]
  - ["유발 요인", fire, "'can all trigger this'는 세 가지가 모두 원인이 될 수 있다는 뜻이에요. 약을 놓치는 것도 포함돼 복용 일정을 지키는 이유가 돼요.", "might be", "감염, 출혈, 혹은 약 용량을 늘린 것이 이걸 유발할 수 있어요.", "감염, 출혈, 혹은 약속을 놓친 것이 이걸 유발할 수 있어요.", "trigger", "treat", "cure", "prevent"]
  - ["회복 안내", star, "'Once'로 조건을 앞에 두면 원인을 고치는 것이 회복의 출발점이라는 순서가 보여요. 'usually'는 항상은 아니라는 뜻이에요.", "as soon", "유발요인을 치료하면 보통 그의 식욕이 다시 돌아와요.", "유발요인을 치료하면 보통 그의 호흡이 다시 편해져요.", "mind", "skin", "voice", "vision"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 간성뇌증 설명 4문장 순서
    why: 악화 요인을 알리고 원인을 찾아 치료 중이라 말한 뒤, 함께 하는 조치를 덧붙이고 회복에 대한 기대로 마무리해요.
    lines:
    - ["Things like infection or bleeding can worsen the confusion.", fire, "감염이나 출혈 같은 것들이 혼란을 악화시킬 수 있어요", "원인"]
    - ["So we're looking for the trigger and treating it.", magnify, "그래서 유발요인을 찾아서 치료하고 있어요", "조치"]
    - ["Alongside that, the lactulose and other steps should help him clear.", pill, "그와 함께 락툴로오스와 다른 조치들이 정신을 맑게 하는 데 도움이 될 거예요", "병행"]
    - ["With all of that, his mind usually clears again.", star, "그 모든 걸 하면 보통 정신이 다시 맑아져요", "기대"]
- title: 응고장애·출혈 위험 관리
  s:
  - ["교정 시점", pill, "'just before'로 시점을 말하면 교정 효과가 있을 때 시술이 이뤄진다는 계획이 팀에 공유돼요.", "in the", "시술 직전에 장갑을 교체합시다.", "시술 직전에 부위를 소독합시다.", "procedure", "shift", "lunch", "meeting"]
  - ["출혈 대비", bandage, "'I'll have blood available'은 필요할 때 바로 쓰도록 미리 챙겨 둔다는 뜻이에요. 'carefully'는 압박을 조심스럽게도 단단히 유지한다는 뜻이에요.", "ready for", "혈액을 준비해 두고 손 위생을 조심스럽게 할게요.", "혈액을 준비해 두고 쓴 거즈를 조심스럽게 버릴게요.", "blood", "forms", "charts", "keys"]
  - ["응고 재검", lab, "'recheck'는 이미 한 검사를 다시 한다는 말이에요. 교정 후 수치가 따라 올랐는지 봐야 해서 검사와 관찰을 함께 말해요.", "to watch", "응고 수치를 재확인하고 출혈 결과를 기록할게요.", "응고 수치를 재확인하고 출혈 결과를 설명할게요.", "bleeding", "itching", "hiccups", "sneezing"]
  - ["혈장 투여", pill, "'so'로 이유와 행동을 이어서 왜 혈장을 주는지 팀이 한 번에 알아들어요. 'before the line'은 시점을 못 박아요.", "after we", "INR이 높아서 라인을 넣기 전에 가운을 입을게요.", "INR이 높아서 라인을 넣기 전에 키트를 펼게요.", "plasma", "saline", "water", "oxygen"]
  - ["압박 유지", bandage, "'firm'은 압박 강도를, 'after the line goes in'은 시점을 말해 줘요. 응고가 약하면 부위가 오래 새서 압박이 중요해요.", "in the", "라인을 넣은 뒤 부위에 날짜 스티커를 붙일게요.", "라인을 넣은 뒤 쓴 바늘을 용기에 버릴게요.", "site", "limb", "scar", "joint"]
  - ["혈소판 수혈", pill, "'also'는 INR에 더해 혈소판도 낮다는 뜻이에요. 응고인자와 혈소판이 모두 모자라면 출혈 위험이 더 커요.", "even if", "혈소판도 낮아서 시술 전에 동의서 받을게요.", "혈소판도 낮아서 시술 전에 손 씻을게요.", "Platelets", "Neutrophils", "Lymphocytes", "Monocytes"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 시술 전 출혈 대비 4문장 순서
    why: INR을 교정하고 혈소판까지 채운 뒤, 라인을 넣은 후 압박을 유지하고, 마지막으로 응고 수치를 다시 확인하며 출혈을 지켜봐요.
    lines:
    - ["His INR is high, so we'll give plasma before the line.", pill, "INR이 높아서 라인을 넣기 전에 혈장을 줄게요", "교정"]
    - ["Platelets are also low, so we'll transfuse before the procedure.", pill, "혈소판도 낮아서 시술 전에 수혈할게요", "수혈"]
    - ["We'll hold firm pressure at the site after the line goes in.", bandage, "라인을 넣은 뒤 부위에 단단히 압박을 유지할게요", "압박"]
    - ["With all of that done, we'll recheck the coags and watch for bleeding.", lab, "그 모든 걸 마치면 응고 수치를 재확인하고 출혈을 지켜볼게요", "재검"]
