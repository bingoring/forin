situations:
- title: ROSC 직후 안정화 사정
  sentences:
  - en: Let's confirm the airway is secure and he's oxygenating.
    ko: 기도가 확보됐는지, 산소화가 되는지 먼저 확인합시다.
    chunks:
    - Let's confirm
    - the airway
    - is secure
    - and he's oxygenating
    - .
    words:
    - w-airway
    - w-secure
    - w-oxygenate
    goal: 1
    tag: 안정화 확인
    icon: stetho
    why: Let's로 시작하면 지시가 아니라 팀이 같은 항목을 함께 보자는 말로 들려요.
    decoy: the oxygen tank
    distractorsKo:
    - 기도가 확보됐는지, 환기가 되는지 먼저 확인합시다.
    - 기도가 확보됐는지, 체온이 유지되는지 먼저 확인합시다.
    blank:
      answer: oxygenating
      options:
      - en: waking
      - en: bleeding
      - en: oxygenating
