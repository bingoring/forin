  w-ready: {distractorsEn: [heavy, rusty], chips: [[ready]]}
  w-shift: {distractorsEn: [sift, shirk]}
  w-bedside: {distractorsEn: [roadside, bedrock], cue: "고장 난 인공호흡기 앞으로 도움을 불러올 때 '여기로' 오라고 말하는 자리"}
  w-cart: {distractorsEn: [card, chart]}
  w-weak: {distractorsEn: [meek, bleak], cue: "자가발관 뒤 공기가 거의 안 움직일 때 환자 스스로의 호흡 노력을 말하는 말"}
  w-calm: {distractorsEn: [clammy, numb]}
  w-despite: {distractorsEn: [beyond, except]}
  w-gather: {distractorsEn: [lather, gauge], cue: "ECMO팀에 전화하기 전에 최근 ABG와 P/F 비율을 한곳에 챙겨 둘 때"}
  w-sedated: {distractorsEn: [seated, sated]}
  w-dry: {distractorsEn: [drip, dye]}
