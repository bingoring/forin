  w-alarm: {distractorsEn: [charm, aroma]}
  w-avoid: {distractorsEn: [await, avow]}
  w-overstretch: {distractorsEn: [overstate, overshoot]}
  w-reintubate: {distractorsEn: [reinstate, reiterate], distractorsKo: [재발관하다, 재흡인하다]}
  w-emergency: {distractorsEn: [agency, efficiency]}
  # W-3 distractorsKo
  w-tubing: {distractorsKo: [파이프, 필터]}
  w-paco2: {distractorsKo: [동맥혈산소분압, 호기말이산화탄소], cue: "ABG에서 환기가 충분한지 보는 항목으로, 오르면 호흡수를 늘려요", chips: [[Pa, CO2]], decoyChips: [Pe, O2]}
  w-extubate: {distractorsKo: [삽관하다, 절개하다]}
  w-team: {distractorsKo: [개인, 환자]}
  w-injure: {distractorsKo: [회복되게 하다, 감염되게 하다]}
  # W-4 ko를 되풀이하는 cue (w-call은 D11-1로 삭제)
  w-side: {cue: "청진할 때 왼편과 오른편을 나눠 말하며 서로 견줄 때"}
  w-moment: {cue: "흡인할 때 기침이 오래가지 않는다고 환자를 안심시키며 쓰는 말"}
  w-dip: {cue: "흡인 직후 SpO2가 85까지 내려갔다 곧 돌아왔을 때 동료에게 하는 말"}
  w-fall: {cue: "부조화가 심해지면서 SpO2 숫자가 계속 낮아지는 것을 보고할 때"}
  w-page: {cue: "급할 때 무선 장치나 방송으로 중환자전담의와 호흡치료팀을 불러낼 때"}
  w-intensivist: {cue: "부조화가 심해 진정 심화를 상의할 ICU 담당 의사"}
  w-maximal: {cue: "FiO2 100퍼센트와 높은 PEEP로도 산소가 안 오를 때 설정값에 붙이는 말"}
  w-escalate: {cue: "복와위나 ECMO처럼 다음 치료로 넘어가자고 제안할 때"}
  w-prone: {cue: "난치성 저산소증에서 등 쪽 폐를 열려고 배를 아래로 향해 눕히는 자세"}
  w-carefully: {cue: "기흉이 의심되는 환자를 백으로 환기하며 압력을 살필 때"}
  # W-5 chips
  w-hypoxic: {chips: [[hyp, ox, ic]], decoyChips: [hyper, ax]}
  w-recommendation: {chips: [[re, com, mend, ation]]}
  # D11-3
  w-rsbi: {ko: 빠르고 얕은 호흡 지수}
# D11-1 은행에서 삭제(상황마다 서로 다른 단어 8개 이상은 검사기가 확인한다)
remove: [w-read, w-number, w-tell, w-ask, w-touch, w-move, w-water, w-need, w-call, w-question, w-problem, w-blood]
