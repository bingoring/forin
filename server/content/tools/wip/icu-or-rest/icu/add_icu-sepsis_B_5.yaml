- title: 불응성 패혈성 쇼크 다중승압
  s:
  - {t: "상태 보고", i: monitor, w: "still not은 이미 많은 치료를 하고 있는데도 결과가 안 따라온다는 뜻이에요. pressors는 vasopressors의 줄임말로, 의료진끼리 빠르게 말할 때 쓰는 말이에요.", d: "in the lounge", k: ["여러 승압제를 쓰고 있는데도 혈당이 유지되지 않아요", "여러 항생제를 쓰고 있는데도 혈압이 유지되지 않아요"], a: "multiple", o: ["mutual", "mighty", "minor"]}
  - {t: "단계 상향", i: siren, w: "so we need to …는 앞 상황이 지금의 행동을 요구한다는 연결이에요. escalate는 더 높은 단계의 도움과 치료로 올린다는 뜻이고 now가 기다릴 여유가 없음을 알려 줘요.", d: "at the entrance hall", k: ["혈압 저하가 보여서 지금 에스컬레이션이 필요해요", "단일 장기 기능장애가 보여서 지금 에스컬레이션이 필요해요"], a: "dysfunction", o: ["destination", "decoration", "donation"]}
  - {t: "호출 제안", i: speech, w: "Let's …는 팀이 같이 움직이자는 제안이에요. the next line of support에서 line은 순서가 있는 단계를 뜻해서, 현재 치료 다음에 올 치료를 미리 준비한다는 말이에요.", d: "on the other side", k: ["중환자전담의를 부르고 다음 면담 자리를 준비합시다", "중환자전담의를 부르고 다음 지지 단계를 준비했어요"], a: "prepare", o: ["praise", "preach", "prefer"]}
  - {t: "호출 보고", i: pager, w: "I'll page …는 말하는 순간 결정한 행동을 알리는 I'll이에요. even on three pressors의 even은 이미 최대한 썼는데도라는 강조라서, 호출 이유가 숫자와 함께 분명해져요.", d: "by the stairs", k: ["지금 중환자전담의를 호출할게요, 승압제 둘을 써도 혈압이 유지가 안 돼요", "지금 중환자전담의를 호출할게요, 승압제 셋을 써도 산소가 유지가 안 돼요"], a: "page", o: ["pave", "peel", "pour"]}
  - {t: "기록 지시", i: pencil, w: "Document …처럼 동사로 시작하는 명령문은 팀 안에서 짧고 분명하게 일을 맡길 때 써요. before we add the next one은 기록해 두는 시점을 정해서, 추가 이후에 용량이 헷갈리지 않게 해요.", d: "for the archive", k: ["다음 승압제를 추가하기 전에 지금 알람을 기록해 두세요", "다음 승압제를 추가하기 전에 지금 수액량을 기록해 두세요"], a: "doses", o: ["dishes", "dollars", "doors"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "불응성 쇼크 에스컬레이션 4문장 순서"
    why: "상태를 먼저 알리고, 그것을 에스컬레이션이 필요한 이유로 해석한 뒤, 호출하고, 호출을 기다리는 동안 기록하는 순서예요. 2줄의 This는 1줄을, 3줄의 To do that은 2줄의 escalate를, 4줄의 the intensivist는 3줄에서 부른 사람을 가리켜서 순서가 하나예요."
    lines:
    - {en: "He's on multiple pressors and still not maintaining his pressure.", icon: monitor, ko: "여러 승압제를 쓰는데도 혈압이 유지되지 않아요", note: "상태"}
    - {en: "This means we need to escalate now.", icon: siren, ko: "이건 지금 에스컬레이션이 필요하다는 뜻이에요", note: "판단"}
    - {en: "To do that, I'll page the intensivist now.", icon: pager, ko: "그러려고 지금 중환자전담의를 호출할게요", note: "호출"}
    - {en: "While we wait for the intensivist, please document the pressor doses before we add the next one.", icon: pencil, ko: "중환자전담의를 기다리는 동안 다음 승압제를 추가하기 전에 용량을 기록해 주세요", note: "기록"}
- title: 패혈증 유발 DIC·출혈 위기
  s:
  - {t: "소견 보고", i: lab, w: "bleeding from multiple sites에서 from은 피가 나오는 곳을 말해요. clotting labs는 피가 굳는 능력을 보는 검사라서 출혈과 함께 말하면 응고 문제를 의심하게 돼요.", d: "in the foyer", k: ["여러 부위에서 통증이 있고 응고 수치도 비정상적이에요", "여러 부위에서 출혈이 있고 간 수치도 비정상적이에요"], a: "sites", o: ["sizes", "sights", "sounds"]}
  - {t: "판단 설명", i: lab, w: "looks like …는 확정이 아니라 보이는 소견으로 말하는 표현이에요. DIC는 응고가 전신에서 무너지는 상태라서 혈액제제가 필요한 이유가 so로 이어져요.", d: "on the counter", k: ["DIC처럼 보여서 혈액제제가 많이 필요해요", "빈혈처럼 보여서 혈액제제가 빨리 필요해요"], a: "products", o: ["projects", "programs", "profits"]}
  - {t: "검사·준비", i: lab, w: "get … ready는 get 뒤에 목적어와 형용사를 둬서 준비된 상태로 만든다는 모양이에요. massive transfusion protocol은 대량 출혈 때 혈액제제를 정해진 순서로 빠르게 주는 절차예요.", d: "for the printer", k: ["전해질 검사 패널을 보내고 대량수혈 프로토콜을 준비합시다", "DIC 검사 패널을 보내고 대량수혈 프로토콜을 준비했어요"], a: "send", o: ["spend", "shave", "sweep"]}
  - {t: "호출 요청", i: pager, w: "Please call …에 now를 붙이면 지금 바로 해 달라는 요청이 돼요. we're going to need는 곧 필요할 것이 확실할 때 쓰는 be going to 모양이라서, 미리 연락하는 이유를 알려 줘요.", d: "at the information desk", k: ["제가 지금 혈액은행에 연락할게요, 여러 단위가 빨리 필요할 거예요", "지금 혈액은행에 연락하라고 하셨어요, 여러 단위가 빨리 필요할 거예요"], a: "units", o: ["uniforms", "umbrellas", "unions"]}
  - {t: "관찰 지시", i: monitor, w: "while 절은 기다리는 동안 그 시간을 어떻게 쓰는지 알려 줘요. every line site처럼 every를 쓰면 하나도 빼놓지 말라는 뜻이에요.", d: "in the archive", k: ["혈액을 기다리는 동안 모든 라인 부위의 출혈을 지켜보세요", "혈소판을 기다리는 동안 모든 라인 부위의 출혈을 지켜보라고 하셨어요"], a: "platelets", o: ["platters", "plates", "planets"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "DIC 출혈 위기 4문장 순서"
    why: "소견을 알리고, 그것이 DIC 같다고 판단하고, 혈액제제를 위해 혈액은행을 부르고, 기다리는 동안 출혈을 보는 순서예요. 3줄의 For that은 2줄의 혈액제제를, 4줄의 them은 3줄에서 요청한 혈액을 가리켜서 순서가 하나예요."
    lines:
    - {en: "He's bleeding from multiple sites and his clotting labs are abnormal.", icon: lab, ko: "여러 부위에서 출혈이 있고 응고 수치도 비정상적이에요", note: "소견"}
    - {en: "This looks like DIC, so we need blood products fast.", icon: magnify, ko: "DIC처럼 보여서 혈액제제가 빨리 필요해요", note: "판단"}
    - {en: "For that, please call the blood bank now.", icon: pager, ko: "그러려면 지금 혈액은행에 연락해 주세요", note: "요청"}
    - {en: "While we wait for them, watch for bleeding at every line site.", icon: monitor, ko: "그것들을 기다리는 동안 모든 라인 부위의 출혈을 지켜보세요", note: "관찰"}
- title: 급성 호흡부전 ARDS 진행
  s:
  - {t: "상태 보고", i: monitor, w: "dropping fast처럼 fast는 형용사가 아니라 부사로 쓰여 속도를 말해요. despite high support는 이미 많은 지지를 해도 소용없다는 경과를 한마디로 알려 줘요.", d: "at the corner", k: ["높은 지지에도 체중이 빠르게 떨어지고 있어요", "높은 지지에도 체온이 빠르게 떨어지고 있어요"], a: "dropping", o: ["dressing", "drinking", "dancing"]}
  - {t: "단계 상향", i: gear, w: "progressing to …는 한 상태에서 다른 상태로 나빠져 가는 과정을 말해요. ARDS는 폐 전체에 염증과 물이 차서 산소가 잘 안 들어가는 상태라서, 환기를 더 지원해야 해요.", d: "in the store room", k: ["폐렴으로 진행되고 있어서 환기를 올려야 해요", "ARDS로 진행되고 있어서 환기를 올리라고 하셨어요"], a: "progressing", o: ["practicing", "promising", "protesting"]}
  - {t: "호출 제안", i: speech, w: "Let's prepare …and call …은 함께 할 두 일을 and로 이어 제안해요. respiratory therapy는 인공호흡기와 기도 관리를 맡는 팀이라, 삽관 때 곁에서 도울 사람을 부르는 말이에요.", d: "at the café", k: ["삽관 동의서를 확인하고 호흡치료팀을 부릅시다", "삽관 기록을 준비하고 호흡치료팀을 부릅시다"], a: "intubation", o: ["invitation", "imitation", "irritation"]}
  - {t: "변화 보고", i: faceWorried, w: "much more labored than …은 more와 than으로 이전과 지금을 견주는 비교급이에요. labored breathing은 숨 쉬는 데 힘을 많이 들이는 호흡이라 호흡 악화를 알리는 의료 용어예요.", d: "at the lobby desk", k: ["한 시간 전보다 걸음이 훨씬 더 힘겨워 보여요", "세 시간 전보다 호흡이 훨씬 더 힘겨워 보여요"], a: "labored", o: ["labeled", "lasered", "loaded"]}
  - {t: "준비·호출", i: pager, w: "Get … ready와 page …를 and로 이어 두 가지 즉시 행동을 명령해요. anesthesia는 마취과를 줄여 부르는 말이라, 기도 확보를 도울 전문가를 지금 부른다는 뜻이에요.", d: "from the storage room", k: ["삽관 카트를 준비하고 지금 마취과를 호출하라고 하셨어요", "삽관 카트를 제가 준비하고 지금 마취과를 호출할게요"], a: "cart", o: ["cake", "cup", "cap"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "ARDS 진행 대응 4문장 순서"
    why: "산소가 떨어진다는 상태에서 시작해 ARDS로 진행된다고 판단하고, 삽관을 준비하고, 그 삽관을 위한 카트와 마취과 호출로 이어요. 2줄의 This는 1줄을, 4줄의 that은 3줄의 intubation을 가리켜서 순서가 하나예요."
    lines:
    - {en: "His oxygen is dropping fast despite high support.", icon: monitor, ko: "높은 지지에도 산소포화도가 빠르게 떨어지고 있어요", note: "상태"}
    - {en: "This is progressing to ARDS, so we need to escalate ventilation.", icon: gear, ko: "ARDS로 진행되고 있어서 환기를 올려야 해요", note: "판단"}
    - {en: "Let's prepare for intubation and call respiratory therapy.", icon: speech, ko: "삽관을 준비하고 호흡치료팀을 부릅시다", note: "준비"}
    - {en: "For that, get the intubation cart ready and page anesthesia now.", icon: pager, ko: "그러려면 삽관 카트를 준비하고 지금 마취과를 호출하세요", note: "호출"}
- title: 급성 신손상 CRRT 필요
  s:
  - {t: "소견 보고", i: lab, w: "almost no urine은 완전히 없다는 뜻이 아니라 거의 없다는 정도 표현이에요. potassium is climbing처럼 climb를 진행형으로 쓰면 수치가 계속 오르는 중이라는 변화를 보여 줘요.", d: "at the end of the hall", k: ["소변이 거의 안 나오고 나트륨 수치가 오르고 있어요", "땀이 거의 안 나오고 칼륨 수치가 오르고 있어요"], a: "climbing", o: ["cleaning", "clapping", "cooking"]}
  - {t: "치료 설명", i: gear, w: "continuous는 멈추지 않고 이어진다는 뜻이라 하루 종일 천천히 돌려요. to control은 목적을 to부정사로 밝혀서 수액과 전해질 조절이 투석의 이유라고 알려 줘요.", d: "at the pharmacy counter", k: ["소변과 전해질을 조절하려면 지속적 투석이 필요해요", "수액과 전해질을 조절하려면 지속적 투석이 필요하대요"], a: "electrolytes", o: ["electricians", "elevators", "engines"]}
  - {t: "협조 제안", i: handshake2, w: "coordinate with …는 일정과 역할을 맞춘다는 동사예요. to start CRRT는 조율하는 목적을 밝혀서, 투석팀과 함께 지속적 신대체요법을 시작한다는 뜻이에요.", d: "from the clinic", k: ["투석팀과 조율해서 CRRT를 시작하래요", "투석팀과 조율해서 CRRT를 시작하길 바라요"], a: "dialysis", o: ["dialogue", "diploma", "diamond"]}
  - {t: "경과 설명", i: chartup, w: "has doubled처럼 현재완료는 지금까지 이어진 변화의 결과를 말해요. in the last day는 지난 하루 동안이라는 기간이라서 수치가 빠르게 변했음을 숫자와 함께 보여 줘요.", d: "at the cashier", k: ["하루 만에 크레아티닌이 세 배가 돼서 신장 기능이 빠르게 멈추고 있어요", "하루 만에 크레아티닌이 두 배가 돼서 간 기능이 빠르게 멈추고 있어요"], a: "doubled", o: ["doubted", "dotted", "doodled"]}
  - {t: "호출 요청", i: pager, w: "before …는 그 전에 해야 하는 이유를 시간으로 알려 줘요. gets any higher의 any는 조금이라도 더라는 뜻이라서, 칼륨이 더 오르면 위험하다는 급함이 느껴져요.", d: "from the north wing", k: ["칼륨이 더 오르기 전에 제가 지금 신장내과팀을 부를게요", "칼륨이 더 오르기 전에 지금 신장내과팀을 부르라고 하셨어요"], a: "renal", o: ["rental", "regal", "rural"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "급성 신손상 CRRT 4문장 순서"
    why: "소견을 알리고, 그 이유인 신장 악화를 설명하고, 투석이 필요하다고 이은 뒤, 투석을 시작하려고 신장내과팀을 부르는 순서예요. 2줄의 That's because는 1줄을, 4줄의 it은 3줄의 dialysis를 가리켜서 순서가 하나예요."
    lines:
    - {en: "He's making almost no urine and his potassium is climbing.", icon: lab, ko: "소변이 거의 안 나오고 칼륨 수치가 오르고 있어요", note: "소견"}
    - {en: "That's because his kidneys are failing fast — his creatinine has doubled in the last day.", icon: chartup, ko: "신장이 빠르게 멈추고 있기 때문이에요, 하루 만에 크레아티닌이 두 배가 됐어요", note: "이유"}
    - {en: "He needs continuous dialysis to control fluid and electrolytes.", icon: gear, ko: "수액과 전해질을 조절하려면 지속적 투석이 필요해요", note: "필요"}
    - {en: "To start it, please call the renal team now, before his potassium gets any higher.", icon: pager, ko: "시작하려면 칼륨이 더 오르기 전에 지금 신장내과팀을 불러 주세요", note: "호출"}
- title: 괴사성 감염 응급 수술 조율
  s:
  - {t: "상태 보고", i: faceWorried, w: "spreading fast와 is dying 두 진행형을 and로 이어 지금 진행 중인 두 변화를 함께 알려요. tissue는 몸을 이루는 조직이라서 괴사가 번지고 있다는 위급함을 쉬운 말로 전해요.", d: "in the car park", k: ["감염이 빠르게 퍼지고 열이 오르고 있어요", "통증이 빠르게 퍼지고 조직이 죽어가고 있어요"], a: "tissue", o: ["ticket", "tablet", "tunnel"]}
  - {t: "수술 필요", i: scalpel, w: "to remove the source는 목적을 밝혀서 수술이 필요한 이유를 알려 줘요. right away는 기다릴 여유가 없다는 부사구이고, source는 감염의 원인이 되는 곳을 가리켜요.", d: "for the maintenance staff", k: ["부담을 줄이려면 지금 바로 응급 수술이 필요해요", "감염원을 제거하려면 지금 바로 응급 수술이 필요하대요"], a: "source", o: ["sauce", "soccer", "sofa"]}
  - {t: "협조 제안", i: handshake2, w: "alert는 동사로 쓰면 미리 알려 준비시킨다는 뜻이에요. prep him은 수술 전 준비를 줄인 구어체이고 immediately는 지체 없이라는 뜻이에요.", d: "at the lunch counter", k: ["제가 수술실 팀에 알리고 바로 준비시킬게요", "수술실 팀에 알리고 바로 준비시키래요"], a: "immediately", o: ["immensely", "importantly", "impatiently"]}
  - {t: "위험 설명", i: siren, w: "turn septic의 turn은 어떤 상태로 변한다는 동사예요. within hours는 몇 시간 안이라는 짧은 기한이고, if 절이 수술실로 보내지 않을 때의 결과를 경고해요.", d: "at the staff exit", k: ["지금 수술실로 보내지 않으면 몇 분 안에 패혈성으로 변할 수 있어요", "지금 수술실로 보내지 않으면 몇 시간 안에 회복이 늦어질 수 있어요"], a: "septic", o: ["scenic", "seismic", "silent"]}
  - {t: "감시 약속", i: monitor, w: "keep monitoring은 같은 행동을 멈추지 않고 이어 간다는 모양이에요. until 절은 감시를 이어 가는 기한을 알려 줘서, 도착 전까지 환자를 혼자 두지 않겠다는 약속이 돼요.", d: "at the dock", k: ["수술팀이 도착할 때까지 혈압과 맥박을 계속 감시할게요", "마취팀이 도착할 때까지 혈압과 젖산을 계속 감시할게요"], a: "lactate", o: ["lettuce", "latte", "ladder"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "괴사성 감염 응급 수술 4문장 순서"
    why: "상태를 알리고, 그것이 응급 수술이 필요하다는 뜻이라고 이은 뒤, 수술실에 알리고, 그동안 계속 감시한다고 마무리해요. 2줄의 That means는 1줄을 받고, 4줄의 the whole time은 3줄에서 수술실에 알린 뒤의 시간 전체를 가리켜서 순서가 하나예요."
    lines:
    - {en: "The infection is spreading fast and the tissue is dying.", icon: faceWorried, ko: "감염이 빠르게 퍼지고 조직이 죽어가고 있어요", note: "상태"}
    - {en: "That means he needs emergency surgery to remove the source right away.", icon: scalpel, ko: "그건 감염원을 제거하려고 지금 바로 응급 수술이 필요하다는 뜻이에요", note: "판단"}
    - {en: "Let's alert the OR team and prep him immediately.", icon: handshake2, ko: "수술실 팀에 알리고 바로 준비시킵시다", note: "준비"}
    - {en: "I'll keep monitoring his pressure and lactate the whole time.", icon: monitor, ko: "그 내내 혈압과 젖산을 계속 감시할게요", note: "감시"}
- title: 다장기부전 목표 재설정
  s:
  - {t: "상태 공유", i: faceWorried, w: "despite everything we're doing은 치료를 소홀히 한 것이 아니라 최선을 다하는 중이라는 점을 먼저 밝혀요. struggling은 장기가 버티느라 애쓰는 상태를 부드럽게 말하는 동사예요.", d: "in the quiet room", k: ["저희가 다 하고 있는데도 가족들이 힘겨워하고 있어요", "저희가 다 알고 있는데도 장기들이 힘겨워하고 있어요"], a: "struggling", o: ["studying", "stretching", "smiling"]}
  - {t: "가치 확인", i: handshake2, w: "I want to make sure …는 일방적으로 정하지 않고 확인하겠다는 부드러운 시작이에요. what matters most to him은 환자 개인의 가치를 묻는 말이라서 목표 설정의 기준이 돼요.", d: "at the reception", k: ["그분께 가장 불편한 게 무엇인지 확실히 이해하고 싶어요", "그분께 가장 중요한 게 무엇인지 확실히 설명하고 싶어요"], a: "matters", o: ["matches", "mends", "melts"]}
  - {t: "지원 안내", i: handshake2, w: "help you weigh처럼 help 뒤에 동사원형이 와서 도와주는 일을 말해요. weigh는 저울에 달듯 장단점을 견준다는 뜻이라서, 결정을 대신하지 않고 함께 생각한다는 느낌을 줘요.", d: "at the family lounge", k: ["팀이 정성과 정직함으로 선택지를 함께 설명하는 걸 도와드릴 수 있어요", "팀이 정성과 유머로 선택지를 함께 저울질하는 걸 도와드릴 수 있어요"], a: "weigh", o: ["wear", "wave", "whip"]}
  - {t: "공감 표현", i: faceWorried, w: "I know this is …로 시작하면 설명이 아니라 공감으로 들려요. one of the hardest처럼 one of 뒤에 최상급을 쓰면 가장 힘든 것 중 하나라는 뜻이라 단정하지 않고 마음을 알아주는 말이 돼요.", d: "at the hospital shop", k: ["이게 가족이 겪는 가장 긴 대화 중 하나라는 걸 알아요", "이게 간호사가 겪는 가장 힘든 대화 중 하나라는 걸 알아요"], a: "hardest", o: ["longest", "loudest", "latest"]}
  - {t: "대화 유도", i: speech, w: "There's no wrong answer here는 정답을 가리는 자리가 아니라는 안심을 줘요. would have wanted처럼 would have + 과거분사로 그분의 뜻을 가정해 말해서, 가족이 자기 선택이 아닌 환자의 뜻을 떠올리게 이끌어요.", d: "at the reception desk", k: ["여기엔 틀린 답이 없어요, 가족이 무엇을 원하실지 함께 이야기해 봐요", "여기엔 틀린 답이 없어요, 그분이 무엇을 걱정하셨을지 함께 이야기해 봐요"], a: "wrong", o: ["weak", "warm", "wide"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "목표 재설정 대화 4문장 순서"
    why: "상태를 솔직히 알리고, 그 소식이 얼마나 힘든지 공감하고, 그래서 환자에게 중요한 것을 이해하겠다고 한 뒤, 팀이 선택지를 함께 보게 도울 수 있다고 마무리해요. 2줄의 this는 1줄의 소식을, 3줄의 That's why는 2줄의 공감을, 4줄의 that은 3줄의 알아보려는 일을 가리켜서 순서가 하나예요."
    lines:
    - {en: "His organs are struggling despite everything we're doing.", icon: faceWorried, ko: "저희가 다 하고 있는데도 장기들이 힘겨워하고 있어요", note: "상태"}
    - {en: "I know hearing this is one of the hardest conversations a family can have.", icon: handshake2, ko: "이걸 듣는 게 가족이 겪는 가장 힘든 대화 중 하나라는 걸 알아요", note: "공감"}
    - {en: "That's why I want to make sure we understand what matters most to him.", icon: bulb, ko: "그래서 그분께 가장 중요한 게 무엇인지 확실히 이해하고 싶어요", note: "확인"}
    - {en: "Once we know that, the team can help you weigh the options with care and honesty.", icon: speech, ko: "그걸 알면 팀이 정성과 정직함으로 선택지를 저울질하도록 도울 수 있어요", note: "지원"}
