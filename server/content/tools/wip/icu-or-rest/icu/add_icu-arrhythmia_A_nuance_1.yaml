0:
  - kind: slider
    words: [w-clean, w-tracing]
    cue: 'Nurse: "I can see every wave clearly — no wobble at all."'
    scale: [clean, fuzzy, unreadable]
    answerAt: 0
    why: "clean tracing은 파가 또렷해서 해석하기 쉬운 상태예요. fuzzy는 잡음이 끼어 흐릿한 상태, unreadable은 아예 읽을 수 없는 상태예요."
    example: "We got a clean tracing once the lead was fixed."
    exKo: "리드를 고치자 깨끗한 파형이 나왔어요."
  - kind: context
    words: [w-tracing]
    word: tracing
    ko: 파형
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "I fixed the lead, so the tracing looks clean now.", ok: true}
      - {who: 차트 기록, icon: board, en: "Continuous tracing reviewed: sinus rhythm, no ectopy.", ok: true}
      - {who: 환자에게, icon: me, en: "Your tracing has baseline wander from respiratory artifact.", ok: false, fix: "The line on the screen is a bit jumpy because of your breathing, so I'm adjusting the lead to get a clean tracing."}
    why: "의료진끼리나 차트에서는 tracing, baseline wander 같은 말이 정확하고 짧아요. 환자에게는 화면의 선이 왜 흔들리는지 쉬운 말로 풀어 줘요."
1:
  - kind: pair
    words: [w-notify, w-print]
    pairs: [[notify, the physician], [print, a rhythm strip]]
    decoys: [it in the chart]
    why: "notify는 사람에게 알리는 동사라 the physician과, print는 출력물을 뽑는 동사라 a rhythm strip과 짝이에요. 'it in the chart'는 document와 쓰는 말이에요."
  - kind: context
    words: [w-baseline]
    word: baseline
    ko: 기준치
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "Let me compare it to his baseline before we call anyone.", ok: true}
      - {who: 차트 기록, icon: board, en: "Rhythm now irregular; baseline was sinus at 78.", ok: true}
      - {who: 환자에게, icon: me, en: "Your rhythm has deviated from baseline, so I need to notify the provider.", ok: false, fix: "Your heartbeat looks different from how it usually does, so I'm letting the doctor know."}
    why: "baseline은 의료진끼리 '평소 상태'를 가리키는 짧고 정확한 말이에요. 환자에게는 '평소와 다르다'처럼 풀어 말하면 불안이 줄어요."
2:
  - kind: pair
    words: [w-loading, w-central, w-infuse]
    pairs: [[loading, dose], [central, line], [infuse, over ten minutes]]
    decoys: [a pressure]
    why: "loading은 처음에 많이 주는 용량이라 dose와, central은 심장 가까운 큰 정맥을 뜻해 line과, infuse는 시간에 걸쳐 흘려 넣으니 over ten minutes와 이어요."
  - kind: context
    words: [w-rate]
    word: rate
    ko: 속도
    scenes:
      - {who: 의료진끼리, icon: pill, en: "Confirm the infusion rate on the pump before you start.", ok: true}
      - {who: 차트 기록, icon: board, en: "Heart rate 118; amiodarone infusing at the ordered rate.", ok: true}
      - {who: 가족에게, icon: me, en: "The infusion rate is set at one milligram per minute per protocol.", ok: false, fix: "The medicine goes in slowly through his IV, and we watch him closely the whole time."}
    why: "의료진끼리는 mg/min 같은 정확한 rate를 말해야 안전해요. 가족에게는 수치보다 '천천히 들어가고 계속 지켜본다'가 알아듣기 쉬워요."
3:
  - kind: slider
    words: [w-beat, w-heart]
    cue: 'Patient: "Every now and then, my heart seems to miss a beat."'
    scale: [skipping, fluttering, racing]
    answerAt: 0
    why: "skipping은 가끔 한 박자 건너뛰는 느낌, fluttering은 가볍고 빠르게 떠는 느낌, racing은 계속 아주 빠르게 뛰는 느낌이에요."
    example: "My heart feels like it's skipping a beat."
    exKo: "심장이 한 박자 건너뛰는 것 같아요."
  - kind: swap
    words: [w-normal, w-heart]
    who: "환자에게 · 심박 설명"
    icon: me
    before: ["Your heart rate is ", "tachycardic", " right now."]
    options: [tachycardic, faster than usual, dangerously high]
    answer: faster than usual
    notes: {tachycardic: "의료진끼리 쓰는 말이라 환자는 뜻을 몰라요.", faster than usual: "환자가 알아듣는 쉬운 말이고 사실만 담아요.", dangerously high: "수치를 확인하기 전에 위험하다고 말하면 불안만 키워요."}
    why: "같은 수치라도 환자에게는 '평소보다 빠르다'처럼 쉬운 말로, 의료진끼리는 tachycardic으로 말해요."
    ko: "지금 심박수가 평소보다 빨라요"
4:
  - kind: slider
    words: [w-stat]
    cue: 'Order: "Potassium and magnesium — draw now and call me with the results the minute they post."'
    scale: [routine, ASAP, STAT]
    answerAt: 2
    why: "routine은 정해진 시간에, ASAP은 가능한 한 빨리, STAT은 지금 바로 시행하고 결과도 가장 먼저 알리는 오더예요."
    example: "I'll send this to the lab as a stat draw."
    exKo: "이건 응급 채혈로 검사실에 보낼게요."
  - kind: context
    words: [w-level]
    word: level
    ko: 수치
    scenes:
      - {who: 의료진끼리, icon: lab, en: "Her potassium level came back at 3.1.", ok: true}
      - {who: 차트 기록, icon: board, en: "Mg level 1.6; replacement ordered per protocol.", ok: true}
      - {who: 가족에게, icon: me, en: "Her potassium level is 3.1 milliequivalents per liter, below the reference range.", ok: false, fix: "Her potassium is a little low, so we're giving some back through her IV."}
    why: "의료진끼리는 level과 숫자만 말해도 충분해요. 가족에게는 단위와 기준 범위보다 '조금 낮아서 보충한다'가 더 도움이 돼요."
5:
  - kind: slider
    words: [w-most, w-harmless]
    cue: 'Nurse: "Nearly all of them are harmless, but not every single one."'
    scale: [few, most, all]
    answerAt: 1
    why: "most는 '대부분'이지만 전부는 아니에요. all이라고 하면 알람을 무시해도 된다는 말처럼 들려서 위험해요."
    example: "Most alarms are harmless, but we still check each one."
    exKo: "대부분의 알람은 무해하지만 하나하나 확인해요."
  - kind: context
    words: [w-alarm]
    word: alarm
    ko: 알람
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "I'll check the patient first and then silence the alarm.", ok: true}
      - {who: 야간 인계, icon: board, en: "The alarm at 0300 was artifact from a loose lead.", ok: true}
      - {who: 보호자에게, icon: me, en: "The alarm indicates a transient loss of telemetry signal, probably motion artifact.", ok: false, fix: "The alarm went off because a wire shifted, and we checked on him right away."}
    why: "의료진끼리는 telemetry signal, motion artifact 같은 말이 정확해요. 보호자에게는 왜 울렸는지와 이미 확인했다는 말이 먼저예요."
6:
  - kind: slider
    words: [w-unstable]
    cue: 'Nurse: "Her BP is 70/40, she is confused, and she has chest pain."'
    scale: [stable, borderline, unstable]
    answerAt: 2
    why: "저혈압, 의식 변화, 흉통처럼 바로 위험한 징후가 있으면 unstable이에요. 이럴 때는 약보다 응급 심율동전환을 먼저 고려해요."
    example: "If she becomes unstable, we'll move straight to cardioversion."
    exKo: "불안정해지면 바로 심율동전환으로 갈 거예요."
  - kind: swap
    words: [w-betablocker, w-give]
    who: "환자에게 · 약 설명"
    icon: pill
    before: ["We're giving you a ", "beta-blocker", " through your IV."]
    options: [beta-blocker, heart-slowing medicine, ventricular rate agent]
    answer: heart-slowing medicine
    notes: {beta-blocker: "정확한 약 이름이지만 환자는 무슨 일을 하는 약인지 몰라요.", heart-slowing medicine: "약이 하는 일을 쉬운 말로 알려 줘요.", ventricular rate agent: "의료진끼리 쓰는 말이라 환자는 알아듣지 못해요."}
    why: "환자에게는 약 이름보다 그 약이 하는 일을 먼저 말해 주면 안심이 돼요."
    ko: "정맥으로 심장을 천천히 뛰게 하는 약을 드리고 있어요"
7:
  - kind: slider
    words: [w-flutter, w-skip]
    cue: 'Patient after the medicine: "My chest felt strange, like my heart stopped for a second and then restarted."'
    scale: [flutter, skip, pause]
    answerAt: 2
    why: "flutter는 빠르게 파닥거리는 느낌, skip은 박동 하나가 빠지는 느낌, pause는 잠깐 멈춘 듯한 느낌이에요. 아데노신 뒤에는 이렇게 잠깐 멈춘 듯한 느낌이 들 수 있어요."
    example: "You might feel your heart skip or flutter for a moment."
    exKo: "잠깐 심장이 건너뛰거나 파닥거리는 느낌이 들 수 있어요."
  - kind: context
    words: [w-strange]
    word: strange
    ko: 이상한
    scenes:
      - {who: 환자에게, icon: me, en: "It may feel strange for a few seconds, but it works fast.", ok: true}
      - {who: 가족에게, icon: me, en: "He may feel something strange in his chest, and it passes quickly.", ok: true}
      - {who: 환자에게 · 어려운 말, icon: me, en: "You may experience a strange transient sensation consistent with a brief asystolic pause.", ok: false, fix: "You may feel a strange flutter or pause in your chest for a few seconds."}
    why: "환자나 가족에게는 어떤 느낌이 들고 곧 지나간다는 말이면 충분해요. asystolic pause 같은 임상어는 오히려 겁을 줘요."
8:
  - kind: pair
    words: [w-draw, w-place, w-tell]
    pairs: [[draw up, the atropine], [place, the pads on his chest], [tell, me right away]]
    decoys: [his bed]
    why: "draw up은 주사기에 약을 채우는 동작이라 the atropine과, place는 패드를 붙이니 the pads on his chest와, tell은 사람에게 알리니 me right away와 이어요."
  - kind: context
    words: [w-pace]
    word: pace
    ko: 페이싱하다
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "Keep the pads on in case we need to pace him.", ok: true}
      - {who: 차트 기록, icon: board, en: "Pacer pads on; ready to pace if the rate drops below 40.", ok: true}
      - {who: 환자에게, icon: me, en: "We may pace you transcutaneously and titrate the output until we get capture.", ok: false, fix: "If your heart slows too much, the pads on your chest can send small pulses to help it keep beating."}
    why: "의료진끼리는 pace, output, capture가 짧고 정확해요. 환자에게는 패드가 심장이 뛰도록 돕는다는 말이면 충분해요."
