- title: 중환자 혈당 목표 이해
  sentences:
  - en: In the ICU we aim for a sugar between 140 and 180 for your safety.
    ko: 중환자실에서는 안전을 위해 혈당을 140에서 180 사이로 유지하는 것을 목표로 해요.
    chunks:
    - In the ICU
    - we aim for a sugar
    - between 140 and 180
    - for your safety
    - .
    words:
    - w-aim
    - w-sugar
    - w-between
    - w-safety
    goal: 1
    tag: 목표 안내
    icon: compass
    why: '''aim for''는 정확히 맞춘다는 약속이 아니라 목표 범위를 말해요. 범위를 숫자로 먼저 말하고 이유를 ''for your safety''로 붙이면 환자가 받아들이기 쉬워요.'
    decoy: at the sink
    distractorsKo:
    - 중환자실에서는 편안함을 위해 혈당을 140에서 180 사이로 유지하는 것을 목표로 해요.
    - 응급실에서는 안전을 위해 혈당을 140에서 180 사이로 유지하는 것을 목표로 해요.
    blank:
      answer: safety
      options:
      - en: safety
      - en: comfort
      - en: privacy
      - en: convenience
