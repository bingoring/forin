- title: 진정 환자 의사표현 확인
  s:
  - ["손 신호 요청", pushpin, "Can you로 시작하면 명령이 아니라 부탁으로 들려요. if you hear me로 조건을 달아 손 쥐기가 '들렸다'는 신호임을 분명히 해요.", "right now", "제 말이 들리면 제 팔을 꼭 쥐어보실래요?", "제 말이 보이면 제 손을 꼭 쥐어보실래요?", "hear", "smell", "taste", "feel"]
  - ["편안함 확인", faceWorried, "I'm checking처럼 진행형을 쓰면 지금 이 순간 살피고 있다는 느낌이 전해져요. right now가 그 시점을 못 박아요.", "in this bed", "하루 종일 편안하신지 확인하고 있어요.", "밤새 편안하신지 확인하고 있어요.", "right now", "last night", "next year", "tomorrow morning"]
  - ["눈 뜨기 요청", magnify, "for me를 붙이면 검사가 아니라 나를 위해 해 달라는 부탁처럼 들려요. if you can은 못 해도 괜찮다는 여지를 줘요.", "wide", "가능하시면 손을 펴 보세요.", "가능하시면 발가락을 움직여 보세요.", "can", "must", "dare", "have to"]
  - ["기다림 안내", calendar, "wait a moment는 서두르지 않고 응답을 기다린다는 뜻이에요. 진정 중인 환자는 반응이 느려서 이 말이 압박을 덜어 줘요.", "at the door", "반응을 보이실 때까지 오래 기다릴게요.", "반응을 보이실 때까지 잠깐 손잡고 있을게요.", "moment", "week", "month", "year"]
  - ["안심 전달", shield, "You're safe로 먼저 안전을 말하고 just rest로 해야 할 일을 하나만 줘요. 짧은 문장이라 약에 취한 환자도 따라가기 쉬워요.", "in the morning", "안전하니 지금은 그냥 들으세요.", "여기 있으니 지금은 그냥 쉬세요.", "safe", "alone", "sick", "lost"]
  - ["통증 알림 요청", bell, "Let me know는 환자에게 알릴 권리를 주는 표현이에요. any를 쓰면 작은 통증도 말해도 된다는 뜻으로 들려요.", "right away", "음악을 원하시면 알려주세요.", "불을 줄이길 원하시면 알려주세요.", "feel", "hear", "smell", "taste"]
  - ["재방문 약속", calendar, "again이 있어야 한 번 보고 끝이 아니라 다시 온다는 약속이 돼요. in a few minutes가 돌아올 시점을 구체적으로 알려 줘요.", "from the desk", "1분 뒤에 다시 살펴보러 올게요.", "10분 뒤에 다시 살펴보러 올게요.", "minutes", "days", "weeks", "months"]
