- title: 언어장벽 통증 사정
  s:
  - ["얼굴 척도", faceWorried, "that shows는 얼굴 그림이 통증 정도를 '보여 준다'는 관계절이에요. 말이 통하지 않아도 그림으로 정도를 전할 수 있게 해요.", "on this card", "얼마나 아픈지 보여주는 숫자를 가리켜 보세요.", "얼마나 아픈지 보여주는 얼굴을 그려 보세요.", "much", "often", "long", "far"]
  - ["숫자 척도", chartup, "Zero is no pain, ten is the worst pain은 양 끝을 먼저 정의하는 틀이에요. 끝점이 정해져야 중간 숫자가 같은 기준으로 해석돼요.", "in between", "0은 안 아픈 거고, 5는 가장 심한 통증이에요.", "0은 안 아픈 거고, 10은 가장 오래된 통증이에요.", "Zero", "One", "Five", "Nine"]
  - ["위치 확인", magnify, "Show me는 말 대신 몸짓으로 답해도 된다는 허락이에요. where it hurts를 쓰면 통증의 위치를 묻는 질문이라는 점이 분명해져요.", "with one finger", "몸이 언제 아픈지 보여주세요.", "몸이 얼마나 아픈지 보여주세요.", "where", "when", "why", "who"]
  - ["그림 척도", board, "matches는 그림과 내 통증이 서로 같은지 맞춰 보라는 뜻이에요. picture를 쓰면 글을 못 읽는 사람도 따라올 수 있어요.", "on the sheet", "당신의 통증과 맞는 숫자를 가리켜 보세요.", "당신의 통증과 맞는 색을 가리켜 보세요.", "pain", "name", "age", "size"]
  - ["자료 준비", board, "in your language는 환자가 익숙한 언어로 된 자료라는 뜻이에요. I'll bring은 환자가 직접 찾지 않아도 내가 가져온다는 약속이에요.", "from the desk", "당신 언어로 된 약물 목록을 가져올게요.", "당신 언어로 된 통증 차트를 읽어 드릴게요.", "your", "my", "his", "their"]
  - ["통증 양상", pill, "Is the pain sharp, or dull?처럼 두 선택지를 주면 말이 서툴러도 한 단어로 답할 수 있어요.", "in your side", "통증이 날카로운가요, 아니면 일정한가요?", "통증이 날카로운가요, 아니면 쓰린가요?", "sharp", "heavy", "tight", "burning"]
  - ["고개 신호", check, "Nod는 말 없이 답하는 가장 간단한 신호예요. if this is where it hurts로 위치를 짚어 주면 예·아니오 질문이 돼요.", "at this spot", "여기가 아프면 눈을 깜빡이세요.", "여기가 아프면 손을 들어 보세요.", "Nod", "Blink", "Squeeze", "Wave"]
