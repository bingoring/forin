situations:
- title: "우심부전 동반 관리"
  s:
  - ["상태 보고", "stetho", "원인과 결과를 'so'로 이어 임상 동료에게 짧게 전해요. 우심실이 약하면 수액이 너무 많아도 적어도 문제가 돼서 균형이 중요해요.", "His left ventricle", "좌심실 기능이 저하돼서 전부하 균형이 예민해요.", "우심실 기능이 저하돼서 영양 균형이 예민해요.", "delicate", "easy", "simple", "ordinary"]
  - ["피할 것", "shield", "'anything that'으로 구체적 목록 대신 기준을 한 문장에 담아요. 폐혈관 압력이 오르면 약해진 우심실이 더 힘들어져요.", "his blood sugar", "맥박을 올리는 건 뭐든 피해요.", "혈당을 올리는 건 뭐든 피해요.", "avoid", "allow", "order", "share"]
  - ["위험 설명", "bulb", "'could'로 가능성의 크기를 낮춰 겁주지 않으면서 위험을 전해요. 'further behind'는 이미 뒤처진 심장이 더 힘들어진다는 쉬운 비유예요.", "his left lung", "수분이 너무 많으면 좌심장이 더 뒤처질 수 있어요.", "소금이 너무 많으면 우심장이 더 뒤처질 수 있어요.", "fluid", "noise", "light", "travel"]
  - ["감시 항목", "monitor", "약어(CVP)를 그대로 말해도 동료는 바로 알아들어요. 우심부전에서는 중심정맥압과 산소화를 함께 봐서 수분과 호흡 상태를 가늠해요.", "and his appetite", "중심정맥압과 식욕을 자세히 지켜볼게요.", "혈당과 산소화를 자세히 지켜볼게요.", "oxygenation", "vaccination", "registration", "education"]
  - ["함께 보는 이유", "magnify", "'keep a close eye on'은 눈을 떼지 않는다는 관용 표현이에요. 'together'로 두 수치를 따로가 아니라 함께 본다는 점을 알려요.", "his diet", "소변과 압력을 함께 주의 깊게 지켜보고 있어요.", "산소와 혈당을 함께 주의 깊게 지켜보고 있어요.", "close", "distant", "wide", "lazy"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "우심부전 관리 설명 4문장 순서"
    why: "상태를 먼저 보고하고, 그래서 수분이 위험한 이유와 피할 것을 차례로 말한 뒤, 그 모두를 염두에 두고 무엇을 지켜볼지 알려요."
    lines:
    - ["His right ventricle is failing, so preload balance is delicate.", "stetho", "우심실 기능이 저하돼서 전부하 균형이 예민해요", "상태"]
    - ["That's why too much fluid could push his right heart further behind.", "bulb", "그래서 수분이 너무 많으면 우심장이 더 뒤처질 수 있어요", "위험"]
    - ["For that reason, we avoid anything that raises his pulmonary pressures.", "shield", "그래서 폐혈관 압력을 올리는 건 뭐든 피해요", "회피"]
    - ["With all of that in mind, I'll watch his CVP and oxygenation closely.", "monitor", "그 모든 걸 염두에 두고 중심정맥압과 산소화를 자세히 지켜볼게요", "감시"]
- title: "강심제 이탈 시도"
  s:
  - ["천천히 줄임", "pill", "'slowly'와 'as his heart holds steady'가 함께 있어 심장이 버티는 만큼만 줄인다는 조건이 분명해져요. 강심제는 갑자기 끊지 않고 반응을 보며 줄여요.", "as his visitors", "열이 안정적으로 유지되는 만큼 약물을 천천히 줄이고 있어요.", "심장이 안정적으로 유지되는 만큼 식사를 천천히 줄이고 있어요.", "slowly", "nightly", "weekly", "gently"]
  - ["호전 설명", "star", "'on its own'으로 심장이 스스로 한다는 뜻을 전해요. 'now'를 붙여 최근 달라진 점이라는 걸 분명히 해요.", "with the pump", "이제 폐가 스스로 더 많은 일을 하고 있어요.", "이제 심장이 스스로 더 많이 쉬고 있어요.", "more", "less", "most", "all"]
  - ["악화 감시", "magnify", "'slipping'은 서서히 나빠진다는 말이라 급변이 아니라 추이를 본다는 느낌을 줘요. 약을 줄이는 동안에는 순환이 나빠지는 첫 징후를 놓치지 않아야 해요.", "his appetite", "식욕이 나빠지는 징후가 있는지 지켜볼게요.", "호흡이 나빠지는 징후가 있는지 지켜볼게요.", "slipping", "improving", "resting", "aging"]
  - ["이유 설명", "shield", "'gradually'와 'to keep him safe'가 속도와 이유를 한 문장에서 같이 알려요. 강심제를 갑자기 줄이면 혈압이 떨어질 수 있어요.", "to save time", "편안하게 유지하려고 점차 줄이는 거예요.", "깨끗하게 유지하려고 점차 줄이는 거예요.", "gradually", "secretly", "publicly", "yearly"]
  - ["되돌림 안심", "shield", "'right back up'으로 필요하면 바로 되돌릴 수 있다는 안전장치를 말해요. 줄이는 중에 상태가 나빠지면 용량을 다시 올릴 수 있어요.", "the bed", "무엇이든 변화가 생기면 침대를 다시 올릴 수 있어요.", "알람이 울리면 용량을 다시 올릴 수 있어요.", "dose", "bed", "bag", "cart"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "강심제 줄이기 설명 4문장 순서"
    why: "심장이 좋아졌다는 말로 시작해 약을 줄이는 이유를 설명하고, 줄이는 동안 지켜볼 것, 나빠지면 되돌릴 수 있다는 안심으로 마무리해요."
    lines:
    - ["His heart is doing more of the work on its own now.", "star", "이제 심장이 스스로 더 많은 일을 하고 있어요", "호전"]
    - ["So we're slowly lowering the medication as his heart holds steady.", "pill", "그래서 심장이 안정적인 만큼 약물을 천천히 줄이고 있어요", "감량"]
    - ["While we do that, I'll watch for any signs his circulation is slipping.", "magnify", "그동안 순환이 나빠지는 징후가 있는지 지켜볼게요", "감시"]
    - ["If we see any, we can raise the dose right back up.", "shield", "보이면 용량을 바로 다시 올릴 수 있어요", "되돌림"]
- title: "기계보조 중 항응고 모니터"
  s:
  - ["검사·조정", "lab", "'per protocol'로 조정 기준이 개인 판단이 아니라 병원 프로토콜임을 밝혀요. 헤파린은 ACT 수치를 보고 정해진 규칙대로 조정해요.", "per request", "요청에 따라 ACT를 채혈하고 헤파린을 조정할게요.", "차트에 따라 ACT를 채혈하고 헤파린을 조정할게요.", "ACT", "MRI", "UTI", "EEG"]
  - ["수치 보고", "chartup", "'a little below target'으로 수치를 해석까지 붙여 보고하면 듣는 사람이 바로 판단해요. 목표 범위보다 낮으면 혈전 위험이 커질 수 있어요.", "Her first ACT", "첫 ACT 수치가 목표보다 조금 낮았어요.", "어제 ACT 수치가 목표보다 조금 낮았어요.", "below", "above", "near", "past"]
  - ["목표 이유", "shield", "'to prevent'로 목적을 먼저 말하고 두 위험을 함께 짚어요. 항응고는 너무 낮으면 혈전이, 너무 높으면 출혈이 생기기 쉬워서 범위를 지켜요.", "pain and fever", "감염과 출혈을 막기 위해 목표 범위 안에 유지해요.", "혈전과 출혈을 막기 위해 목표 시간 안에 유지해요.", "clots", "rashes", "fevers", "falls"]
  - ["출혈 감시", "magnify", "'the circuit and her'처럼 기계와 사람을 함께 말하면 둘 다 본다는 뜻이 분명해요. 회로 연결부와 환자 부위 모두에서 출혈이 생길 수 있어요.", "the screen", "회로와 환자분 모두 소음이 있는지 지켜보고 있어요.", "회로와 환자분 모두 열이 있는지 지켜보고 있어요.", "bleeding", "noise", "glare", "dust"]
  - ["재확인 예고", "calendar", "'in an hour'로 다음 확인 시점을 구체적으로 정해 두면 환자와 동료가 기다리는 시간을 알 수 있어요. 항응고 조정 후에는 정해진 시간에 다시 재요.", "at the desk", "한 시간 후에 체중을 다시 확인할게요.", "한 시간 후에 맥박을 다시 확인할게요.", "levels", "sheets", "pillows", "gowns"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "항응고 관리 4문장 순서"
    why: "수치가 목표보다 낮았다고 보고하고, 프로토콜대로 헤파린을 조정한 뒤, 다시 재 보며 목표 범위를 지켜서 혈전과 출혈을 막아요."
    lines:
    - ["Her last ACT was a little below target.", "chartup", "지난 ACT 수치가 목표보다 조금 낮았어요", "수치"]
    - ["So I'll adjust the heparin per protocol.", "lab", "그래서 프로토콜에 따라 헤파린을 조정할게요", "조정"]
    - ["After that, I'll recheck her levels in an hour.", "calendar", "그 뒤 한 시간 후에 수치를 다시 확인할게요", "재확인"]
    - ["Staying in the target range this way prevents clots and bleeding.", "shield", "이렇게 목표 범위를 지키면 혈전과 출혈을 막아요", "목적"]
- title: "IABP 콘솔 경보·풍선 파열 위기"
  s:
  - ["위급 소견", "siren", "소견('피가 보임')을 먼저, 해석('파열됐을 수 있음')을 뒤에 붙여 사실과 추정을 구분해요. 풍선이 터지면 가스 라인에 혈액이 역류해 보일 수 있어요.", "in the bag", "튜브에 물이 보여요, 풍선이 파열됐을 수 있어요.", "튜브에 피가 보여요, 풍선이 막혔을 수 있어요.", "ruptured", "cooled", "expired", "vanished"]
  - ["경보 보고", "bell", "'is alarming'은 지금 경보가 울리고 있다는 뜻이에요. 소견 둘을 'and'로 나란히 붙여 빠르게 보고해요.", "and the screen", "콘솔에 경보가 울리고 전원도 이상해 보여요.", "모니터에 경보가 울리고 트리거도 이상해 보여요.", "alarming", "cooling", "sleeping", "printing"]
  - ["즉시 대응", "siren", "행동 둘을 'and'로 이어 지금 하는 일을 순서대로 알려요. 풍선이 파열됐을 수 있을 때는 가스가 혈액으로 들어갈 수 있어서 펌프를 멈추고 의사를 바로 불러요.", "the visitors", "펌프가 멈췄고 지금 의사가 오고 있어요.", "펌프를 멈추고 지금 의사가 올 거예요.", "stopping", "cleaning", "filling", "moving"]
  - ["다음 단계 준비", "gear", "'prepare to'로 아직 하지는 않았고 준비하는 단계임을 알려요. 'remove or replace'는 의사가 정할 두 갈래를 모두 말해요.", "the console", "튜브를 제거하거나 교체할 준비를 해야 해요.", "풍선을 제거하거나 보관할 준비를 해야 해요.", "balloon", "blanket", "curtain", "chair"]
  - ["곁 지킴", "shield", "'staying right here'로 곁을 떠나지 않겠다는 약속을 해요. 위급한 상황에서 간호사가 곁에 있다는 말은 환자와 가족을 안정시켜요.", "until the shift", "가족이 올 때까지 바로 여기 있을게요.", "교대자가 올 때까지 바로 여기 있을게요.", "arrives", "sleeps", "eats", "resigns"]
  order:
    tag: "대화 흐름"
    icon: "siren"
    ko: "풍선 파열 대응 4문장 순서"
    why: "본 것을 먼저 보고하고, 펌프를 멈추며 의사를 부른 뒤, 의사의 결정에 대비하고, 의사가 올 때까지 곁을 지켜요."
    lines:
    - ["There's blood in the tubing — the balloon may have ruptured.", "siren", "튜브에 피가 보여요, 풍선이 파열됐을 수 있어요", "소견"]
    - ["I'm stopping the pump and calling the physician now.", "siren", "펌프를 멈추고 지금 의사를 부르고 있어요", "대응"]
    - ["He'll decide next steps, so we need to prepare to remove or replace the balloon.", "gear", "그가 다음 단계를 정할 테니 풍선 제거나 교체를 준비해야 해요", "준비"]
    - ["I'm staying right here until he arrives.", "shield", "그가 올 때까지 바로 여기 있을게요", "곁 지킴"]
- title: "불응성 심인성 쇼크 ECMO 고려"
  s:
  - ["상황 요약", "chartup", "'despite'로 지금까지 한 처치를 먼저 짚으면 받는 사람이 이미 썼다는 걸 바로 알아요. 'failing'은 환자가 나빠지고 있다는 짧은 보고 표현이에요.", "after the IABP", "수액과 강심제에도 불구하고 상태가 나빠지고 있어요.", "풍선펌프와 항생제에도 불구하고 상태가 나빠지고 있어요.", "failing", "resting", "eating", "moving"]
  - ["실패 보고", "chartup", "'Nothing … has held'로 지금까지의 시도가 모두 효과 없었음을 한 문장으로 전해요. 다음 단계로 넘어갈 근거를 분명히 하는 보고예요.", "his color", "여러 방법을 시도했지만 맥박을 유지하지 못했어요.", "여러 방법을 시도했지만 소변량을 유지하지 못했어요.", "tried", "eaten", "drawn", "labeled"]
  - ["활성화 제안", "siren", "'should'로 팀 판단을 제안하는 말투예요. 'activate'는 대기 중인 전문팀을 부르는 병원 용어고, 'now'로 시급성을 분명히 해요.", "the transport team", "지금 VA-ECMO 팀에 줄 자료를 모아야 해요.", "지금 VA-ECMO 카트를 병실로 옮겨야 해요.", "team", "menu", "floor", "lobby"]
  - ["준비·안내", "shield", "행동 둘을 'and'로 묶어 준비와 가족 안내를 함께 맡겠다고 말해요. 'brief'는 짧게 핵심만 알린다는 동사예요.", "the hallway", "침상 곁을 준비하고 간호사에게 간단히 알릴게요.", "복도를 준비하고 가족에게 간단히 알릴게요.", "brief", "thank", "greet", "feed"]
  - ["호출·준비", "siren", "'call'과 'get … ready'를 이어 부르는 동시에 준비한다는 흐름을 보여요. ECMO는 전문가가 오기 전에 카트와 물품을 갖춰 둬야 시작이 빨라요.", "the room", "ECMO 전문가를 부르고 차트를 준비해 둘게요.", "ECMO 전문가를 부르고 침대를 준비해 둘게요.", "cart", "room", "bed", "lobby"]
  order:
    tag: "대화 흐름"
    icon: "siren"
    ko: "ECMO 활성화 흐름 4문장 순서"
    why: "상태를 먼저 보고하고, 팀 활성화를 제안한 뒤, 전문가를 부르며 카트를 준비하고, 그들이 오는 동안 침상과 가족을 준비해요."
    lines:
    - ["He's failing despite the IABP and inotropes.", "chartup", "풍선펌프와 강심제에도 불구하고 상태가 나빠지고 있어요", "상황"]
    - ["That's why we should activate the VA-ECMO team now.", "siren", "그래서 지금 VA-ECMO 팀을 활성화해야 해요", "제안"]
    - ["To do that, I'll call the ECMO specialist and get the cart ready.", "siren", "그러려고 ECMO 전문가를 부르고 카트를 준비해 둘게요", "호출"]
    - ["While they come, I'll prepare the bedside and brief the family.", "shield", "그들이 오는 동안 침상 곁을 준비하고 가족에게 알릴게요", "준비"]
