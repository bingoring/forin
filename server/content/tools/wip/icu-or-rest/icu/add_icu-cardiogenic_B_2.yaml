- title: "정맥 이뇨제 적정"
  s:
  - ["투약·관찰", "pill", "투여와 관찰을 한 문장에 묶어 말하면 약만 주고 끝이 아니라는 것이 전해져요. 이뇨제 후에는 소변량으로 효과를 확인해요.", "her weight", "정맥 이뇨제를 투여하고 식사량을 자세히 추적할게요.", "정맥 이뇨제를 투여하고 혈당을 자세히 추적할게요.", "urine", "stool", "sweat", "saliva"]
  - ["치료 목표", "bulb", "'aiming to'로 지금 이루려는 목표를 알려요. 'offload'는 몸에 쌓인 수분을 덜어낸다는 임상 표현이에요.", "from her legs", "다리에 찬 여분의 수분을 덜어내는 게 목표예요.", "폐에 찬 여분의 공기를 덜어내는 게 목표예요.", "extra", "clean", "warm", "sterile"]
  - ["기대 효과", "chartup", "'should'로 예상되는 변화를 말해 확답은 피해요. 'within the hour'는 효과를 확인하는 시간대를 환자와 맞춰 줘요.", "by dinner", "한 시간 안에 결과가 나올 거예요.", "두 시간 안에 소변량이 늘어날 거예요.", "within", "near", "around", "along"]
  - ["부작용 감시", "lab", "'as she diureses'로 이뇨 중에 같이 본다는 시점을 알려요. 이뇨제는 칼륨을 떨어뜨리고 혈압도 낮출 수 있어서 둘을 함께 봐요.", "her appetite", "이뇨가 진행되는 동안 체중과 혈압을 지켜볼게요.", "이뇨가 진행되는 동안 칼륨과 의식을 지켜볼게요.", "potassium", "iron", "zinc", "copper"]
  - ["천천히 하는 이유", "gear", "'slowly'를 문장 가운데 두고 'so'로 이유를 이어 붙이면 속도와 이유가 한 흐름으로 들려요. 수분을 빨리 빼면 혈압이 떨어질 수 있어요.", "daily", "혈압이 안정적이도록 천천히 열을 덜어내고 있어요.", "의식이 안정적이도록 천천히 수분을 덜어내고 있어요.", "slowly", "daily", "hourly", "lightly"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "이뇨제 투여와 관찰 4문장 순서"
    why: "목표를 먼저 말하고, 약을 주며 소변량을 보고, 늘어난 소변량을 확인한 뒤, 그에 맞춰 칼륨과 혈압을 살펴요."
    lines:
    - ["We're aiming to offload the extra fluid from her lungs.", "bulb", "폐에 찬 여분의 수분을 덜어내는 게 목표예요", "목표"]
    - ["To do that, I'll give the IV diuretic and track her urine output closely.", "pill", "그러려고 정맥 이뇨제를 투여하고 소변량을 자세히 추적할게요", "투약"]
    - ["Her urine output should pick up within the hour.", "chartup", "한 시간 안에 소변량이 늘어날 거예요", "효과"]
    - ["Throughout all of that, I'll watch her potassium and blood pressure.", "lab", "그 모든 동안 칼륨과 혈압을 지켜볼게요", "감시"]
- title: "심근경색 후 저혈압 관리"
  s:
  - ["상태·대응", "chartup", "원인(MI 이후)과 대응(support carefully)을 'so'로 이어 한 번에 전해요. 손상된 심장에는 혈압을 올리는 방법도 조심스럽게 써야 해요.", "after the scan", "수술 이후 혈압이 낮아서 신중하게 지지하고 있어요.", "심근경색 이후 혈당이 낮아서 신중하게 지지하고 있어요.", "support", "record", "cover", "repeat"]
  - ["치료 균형", "shield", "'without overworking'으로 두 목표를 동시에 말해요. 'perfusion'은 장기로 가는 혈류를 뜻하는 말이에요.", "his kidneys", "손상된 심장에 무리를 주지 않으면서 의식을 지키고 싶어요.", "손상된 신장에 무리를 주지 않으면서 관류를 지키고 싶어요.", "perfusion", "privacy", "comfort", "weight"]
  - ["균형 설명", "compass", "'balancing A with B'로 두 가지를 저울질하는 중임을 보여요. 혈류를 늘리려다 약해진 심근에 부담이 되지 않게 맞추는 일이에요.", "his healthy", "손상된 심장 근육을 고려해 수분의 균형을 맞추고 있어요.", "손상된 다리 근육을 고려해 혈류의 균형을 맞추고 있어요.", "balancing", "draining", "stretching", "labeling"]
  - ["감시 약속", "monitor", "'continuously'를 끝에 붙여 중간에 비는 시간이 없다는 약속을 해요. 심근경색 후에는 리듬이 갑자기 바뀔 수 있어요.", "his weight and diet", "리듬과 호흡을 지속적으로 모니터할게요.", "리듬과 소변량을 지속적으로 모니터할게요.", "rhythm", "weight", "diet", "mood"]
  - ["보고 체계", "speech", "수동태(gets reported)로 쓰면 누가 하든 팀이 반드시 보고한다는 체계를 말하는 문장이 돼요. 'Any'로 작은 변화도 포함해요.", "by the team", "소변에 변화가 있으면 바로 보고돼요.", "수면에 변화가 있으면 바로 보고돼요.", "reported", "erased", "weighed", "labeled"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "저혈압 대응 설명 4문장 순서"
    why: "상태와 대응을 먼저 말하고, 대응의 이유를 설명한 뒤, 어떻게 지켜보고 어떻게 보고하는지 이어서 말해요."
    lines:
    - ["His pressure is low after the MI, so we support it carefully.", "chartup", "심근경색 이후 혈압이 낮아서 신중하게 지지하고 있어요", "상태"]
    - ["That's because we want perfusion without overworking the injured heart.", "shield", "관류는 지키되 손상된 심장에 무리를 주지 않으려는 거예요", "이유"]
    - ["To do that, I'll monitor his rhythm and pressure continuously.", "monitor", "그러려고 리듬과 혈압을 지속적으로 모니터할게요", "감시"]
    - ["Any change in either gets reported right away.", "speech", "둘 중 어느 쪽이든 변화가 있으면 바로 보고돼요", "보고"]
- title: "IABP 삽입 전 준비·설명"
  s:
  - ["원리 설명", "bulb", "'helps'로 심장을 대신하는 게 아니라 돕는 기계라는 점을 알려요. 'balloon pump'는 풍선과 펌프라는 쉬운 말로 장치를 소개해요.", "his lungs", "풍선 펌프가 폐가 피를 더 쉽게 내보내도록 도와줘요.", "풍선 펌프가 심장이 피를 더 빨리 내보내도록 도와줘요.", "easily", "carefully", "rarely", "secretly"]
  - ["위치·작동", "gear", "'sits'와 'works with'처럼 쉬운 동사로 위치와 작동을 나눠 말하면 낯선 장치가 덜 무서워요. 박동에 맞춰 풍선이 부풀고 꺼져요.", "in a small vein", "큰 정맥 안에 자리 잡고 심장박동마다 함께 작동해요.", "큰 동맥 안에 자리 잡고 숨 쉴 때마다 함께 작동해요.", "artery", "vein", "muscle", "valve"]
  - ["비유 설명", "star", "'It's like'로 시작하는 비유는 장치를 일상의 감각으로 옮겨 줘요. 'a little extra push'는 대신 뛰는 것이 아니라 보태는 것임을 느끼게 해요.", "with every breath", "숨마다 심장에 작은 힘을 더 보태주는 것과 같아요.", "박동마다 다리에 작은 힘을 더 보태주는 것과 같아요.", "push", "rest", "gift", "break"]
  - ["삽입 부위", "scalpel", "'a small opening'이라고 말하면 크게 여는 것이 아니라는 점이 전해져요. 'groin'은 환자가 아는 쉬운 말로 삽입 부위를 알려요.", "his neck", "서혜부의 큰 구멍을 통해 삽입할 거예요.", "서혜부의 작은 구멍을 통해 삽입할 수도 있어요.", "small", "large", "wide", "long"]
  - ["삽입 후 관찰", "magnify", "'afterward'로 삽입 뒤에도 돌봄이 이어진다고 알려요. 삽입한 다리는 혈류와 출혈을 계속 봐야 해서 부위와 다리를 함께 말해요.", "and his arm", "삽입 부위와 다리를 이후에 자주 지켜볼 거예요.", "삽입 부위와 다리를 이후에 따로 지켜볼 거예요.", "closely", "briefly", "lightly", "rarely"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "IABP 설명 4문장 순서"
    why: "장치가 하는 일을 먼저 소개하고, 어디로 넣는지 말한 뒤, 들어간 장치가 어떻게 작동하는지, 이후 어떻게 지켜보는지 이어서 말해요."
    lines:
    - ["The balloon pump helps his heart push blood more easily.", "bulb", "풍선 펌프가 심장이 피를 더 쉽게 내보내도록 도와줘요", "소개"]
    - ["We'll place it through a small opening in his groin.", "scalpel", "서혜부의 작은 구멍을 통해 삽입할 거예요", "삽입"]
    - ["Once there, it sits in a large artery and works with each heartbeat.", "gear", "그 자리에서는 큰 동맥 안에 자리 잡고 박동마다 작동해요", "작동"]
    - ["We'll watch the insertion site and his leg closely afterward.", "magnify", "삽입 부위와 다리를 이후에 자세히 지켜볼 거예요", "관찰"]
- title: "IABP 타이밍·증강 파형 확인"
  s:
  - ["정상 타이밍", "monitor", "'should'로 기준을 말하는 문장이에요. 증강(augmentation)은 대동맥판이 닫히는 순간인 절흔 직후에 시작돼야 이완기에 혈류가 늘어요.", "the systolic peak", "경보는 절흔 직후에 나타나야 해요.", "증강은 절흔 직후에 사라져야 해요.", "after", "before", "during", "near"]
  - ["타이밍 이상", "magnify", "'a little early'로 정도를 함께 보고하면 조정 폭을 가늠할 수 있어요. 'on this cycle'로 지금 이 주기의 소견임을 밝혀요.", "a bit fuzzy", "이번 주기에서 소리가 조금 이르게 나타나요.", "이번 주기에서 파형이 조금 크게 나타나요.", "early", "late", "flat", "noisy"]
  - ["이유 설명", "bulb", "'If … , …' 조건문으로 원인과 결과를 한 문장에 담아요. 타이밍이 맞지 않으면 풍선이 심장을 도와야 할 때 돕지 못해요.", "will be noisy", "경보가 울리면 보조 효과가 떨어져요.", "타이밍이 어긋나면 보조 소리가 커져요.", "effective", "audible", "visible", "durable"]
  - ["조정 후 재확인", "gear", "조정(adjust)과 재확인(recheck)을 한 문장에 묶으면 조정하고 끝이 아님을 보여 줘요. 트리거는 풍선이 부풀 타이밍을 정하는 신호예요.", "the printer", "트리거를 조정하고 압력을 다시 확인할게요.", "트리거를 조정하고 튜브를 다시 확인할게요.", "waveform", "schedule", "bracelet", "curtain"]
  - ["조정 후 확인", "check", "'Let's'로 같이 확인하자는 말투를 써서 동료에게 부담 없이 청해요. 'after this change'로 조정 직후에 본다는 점을 분명히 해요.", "on this screen", "이번 조정 후 경보가 제대로 나오는지 확인해봐요.", "이번 점검 후 증강이 제대로 나오는지 확인해봐요.", "right", "wrong", "flat", "loud"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "IABP 타이밍 점검 4문장 순서"
    why: "이상 소견을 먼저 보고하고, 왜 중요한지 설명한 뒤, 트리거를 조정하고, 조정 결과를 같이 확인해요."
    lines:
    - ["The waveform looks a little early on this cycle.", "magnify", "이번 주기에서 파형이 조금 이르게 나타나요", "이상"]
    - ["That matters, because if the timing is off, the support won't be effective.", "bulb", "타이밍이 어긋나면 보조 효과가 떨어지니 중요해요", "이유"]
    - ["So I'll adjust the trigger and recheck the waveform.", "gear", "그래서 트리거를 조정하고 파형을 다시 확인할게요", "조정"]
    - ["Let's confirm the augmentation looks right after that change.", "check", "그 조정 후 증강이 제대로 나오는지 확인해봐요", "확인"]
- title: "IABP 다리 허혈·출혈 감시"
  s:
