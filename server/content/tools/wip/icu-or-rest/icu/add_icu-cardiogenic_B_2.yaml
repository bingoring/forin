situations:
- title: "밀리논과 도부타민 선택 상황"
  s:
  - ["약 특성", "pill", "'can drop … more'로 가능성을 말하고 'so we watch that'으로 대응까지 붙여, 부작용을 알리면서 불안을 줄여요. 밀리논은 혈관을 넓혀 혈압을 떨어뜨릴 수 있어요.", "his breathing", "밀리논은 체온을 더 떨어뜨릴 수 있어서 그 부분을 지켜봐요.", "밀리논은 식욕을 더 떨어뜨릴 수 있어서 그 부분을 지켜봐요.", "pressure", "appetite", "taste", "hearing"]
  - ["부작용 안내", "pill", "'may'로 가능성의 정도를 조절해요. 도부타민은 심박수를 올리고 부정맥을 일으킬 수 있어서 리듬 감시가 따라와요.", "his fever", "도부타민은 산소포화도를 올려서 부정맥을 유발할 수 있어요.", "도부타민은 심박수를 올려서 알레르기를 유발할 수 있어요.", "arrhythmias", "allergies", "infections", "fractures"]
  - ["리듬 보고", "monitor", "'borderline'은 정상과 이상 사이임을 한 단어로 보고해요. 'for the last hour'로 기간을 붙이면 받는 사람이 추이를 판단할 수 있어요.", "since this morning", "지난 두 시간 동안 리듬이 경계선에 있었어요.", "지난 한 시간 동안 혈압이 경계선에 있었어요.", "rhythm", "appetite", "mood", "balance"]
  - ["선택 기준", "compass", "'Let's'로 결정을 같이 책임진다는 태도를 보여요. 'based on'으로 고르는 기준을 짚어 주면 근거 있는 선택이 돼요.", "his age and weight", "지금 나이와 리듬을 기준으로 골라봐요.", "지금 혈압과 수면을 기준으로 골라봐요.", "pressure", "weight", "age", "height"]
  - ["의견 전달", "speech", "'which way we lean'은 간호팀의 판단 방향을 부드럽게 전하는 관용 표현이에요. 선택은 의사가 하되 팀 의견을 함께 전해요.", "how far", "얼마나 기우는지 의사에게 알릴게요.", "언제 기우는지 의사에게 알릴게요.", "know", "guess", "vote", "draw"]
  order:
