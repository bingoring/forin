- title: 혈당·전해질 확인
  s:
  - ["검사 제안", lab, "'stat'은 지금 바로 해 달라는 응급 검사 용어예요. 'right away'가 한 번 더 긴급함을 강조해요.", "for the family", "지금 바로 혈당과 전해질을 긴급으로 확인하죠.", "지금 바로 혈당과 전해질을 정확히 확인하죠.", "stat", "late", "slow", "mild"]
  - ["원인 설명", bulb, "'can trigger'는 가능성을 말해 단정하지 않아요. 'low sugar or sodium'은 원인 후보를 두 개 나란히 보여 줘요.", "his weight", "낮은 혈당이나 나트륨이 발작을 유발할 수 있어요.", "낮은 혈당이나 칼륨이 발작을 유발할 수 있어요.", "trigger", "cure", "heal", "calm"]
  - ["교정 계획", lab, "'If we find'는 아직 모르는 상태를 전제로 해서 결과에 따라 움직인다는 계획을 말해요. 'immediately'는 시간을 끌지 않겠다는 뜻이에요.", "a family member", "원인을 찾으면 바로 교정할게요.", "원인을 찾으면 바로 설명할게요.", "correct", "record", "predict", "repeat"]
  - ["결과 보고", lab, "'came back'은 검사 결과가 돌아왔다는 현장 표현이에요. 'so we're treating it now'로 결과와 행동을 이어서 말해요.", "from the lab", "혈당 결과가 낮게 나와서 지금 치료하고 있어요.", "혈당 결과가 높게 나와서 지금 확인하고 있어요.", "low", "late", "lost", "loud"]
  - ["교정 설명", lab, "'to stop'은 교정하는 목적이 발작을 막는 것임을 보여 줘요. 'further'는 이미 일어난 발작 말고 더 이어질 발작을 가리켜요.", "after lunch", "추가 발작을 막기 위해 나트륨 수치를 교정하고 있어요.", "추가 발작을 막기 위해 나트륨 수치를 설명하고 있어요.", "sodium", "weight", "height", "pulse"]
  order:
