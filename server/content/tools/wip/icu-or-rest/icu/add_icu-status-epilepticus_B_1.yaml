    icon: compass
    ko: 발작 관찰과 기록 4문장 순서
    why: 가족의 알림에 먼저 감사하고, 지금 하는 일을 말한 뒤, 기록하는 이유를 설명하고, 적을 내용을 약속해요.
    lines:
    - ["Thank you for calling us right away.", handshake2, "바로 알려 주셔서 감사해요", "감사"]
