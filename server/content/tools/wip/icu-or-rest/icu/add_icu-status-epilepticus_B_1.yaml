- title: 발작 중 기도·안전 확보
  s:
  - ["자세 안전", shield, "'turning him on his side'가 먼저, 'and protecting'이 이어 두 동작을 한 문장에 묶어요. 진행형이라 지금 곁에서 하고 있다는 말이에요.", "on the stretcher", "옆으로 돌려서 침구를 정리하고 있어요.", "옆으로 돌려서 호흡을 지켜보고 있어요.", "head", "chart", "name", "schedule"]
  - ["금기 설명", shield, "'never put anything'은 금기를 단호하게 말하는 틀이에요. 하는 일과 하지 않는 일을 한 문장에 함께 알려요.", "the bed low", "주변을 조용히 하고, 입 안에는 절대 아무것도 넣지 않아요.", "주변을 살피고, 입 안에는 절대 아무것도 넣지 않아요.", "area", "ceiling", "mattress", "window"]
  - ["기도 확인", stetho, "'making sure'는 한 번 하고 끝이 아니라 계속 살핀다는 뜻이에요. 'stays open'은 상태가 유지되는지에 초점을 둬요.", "stays warm", "기도가 계속 열려 있도록 몸을 받치고 있어요.", "기도가 계속 열려 있도록 침대를 낮추고 있어요.", "open", "cold", "loud", "short"]
  - ["부상 예방", shield, "'so he doesn't'는 목적을 부정형으로 말해 무엇을 막는지 바로 보여 줘요. 'anything hard'는 딱딱한 물건을 쉽게 가리켜요.", "with a blanket", "단단한 것에 부딪히지 않도록 쿠션으로 머리를 보호하고 있어요.", "날카로운 것에 부딪히지 않도록 베개로 머리를 보호하고 있어요.", "pillow", "pencil", "basin", "folder"]
  - ["금기 약속", handshake2, "'never force'는 힘으로 무언가를 하지 않겠다는 약속이에요. 입을 벌리려 하지 않는다는 점을 가족에게 알려 줘요.", "a pillow", "기도를 열어두고, 이 사이에 절대 억지로 아무것도 넣지 않을게요.", "기도를 살펴보고, 이 사이에 절대 억지로 아무것도 넣지 않을게요.", "teeth", "knees", "elbows", "shoulders"]
  order:
