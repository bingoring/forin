- title: 활력·산소 감시
  s:
  - ["산소 지지", monitor, "'applying'은 지금 하고 있는 처치를, 'watching'은 동시에 하는 감시를 말해요. 두 동작을 'and'로 묶어 같이 한다는 뜻이에요.", "his temperature", "산소를 적용하고 포화도를 가까이서 지켜보고 있어요.", "산소를 적용하고 포화도를 조용히 지켜보고 있어요.", "saturation", "invoice", "schedule", "weekend"]
  - ["이유 설명", bulb, "'so'로 이유와 결과를 이어서 왜 호흡을 돕는지 알려 줘요. 'demand'는 몸이 필요로 하는 양이라는 뜻이에요.", "for his family", "발작은 산소 요구량을 높이니까 호흡을 도와줘요.", "발작은 산소 포화도를 높이니까 호흡을 지켜봐요.", "demand", "supply", "source", "cost"]
  - ["장비 준비", pager, "'keep … ready'는 쓰기 전에 손 닿는 곳에 두라는 뜻이에요. 'Let's'로 팀 전체에 제안해요.", "the wall light", "석션과 기도 장비를 준비해 둡시다.", "석션과 기도 장비를 확인해 둡시다.", "suction", "pillow", "blanket", "curtain"]
  - ["수치 보고", monitor, "숫자를 말할 때 'is ninety-two percent'처럼 단위까지 풀어서 말해요. 'holding steady'는 수치가 변하지 않는다는 쉬운 표현이에요.", "right now", "산소포화도는 92퍼센트이고 안정적으로 유지되고 있어요.", "산소포화도는 91퍼센트이고 계속 떨어지고 있어요.", "steady", "loose", "empty", "wide"]
  - ["대비 설명", pager, "'in case'는 아직 필요하지 않지만 필요해질 때를 대비한다는 표현이에요. 'he needs it'은 지시어 it으로 앞의 석션을 가리켜요.", "to his bed", "혹시 필요할 경우를 대비해 석션을 침대 옆에 준비해 두고 있어요.", "혹시 필요할 경우를 대비해 석션을 미리 점검해 두고 있어요.", "ready", "wet", "full", "dry"]
