- title: 발작 관찰·시간 기록
  s:
  - ["발작 관찰", monitor, "'I'm timing'과 'right now'가 만나 지금 곁에서 하는 일임이 분명해져요. 'exactly what's happening'은 있는 그대로 본다는 약속이에요.", "for the doctor", "지금 발작 시간을 재면서 무슨 일이 일어나는지 가까이서 지켜보고 있어요.", "지금 발작 시간을 재면서 무슨 일이 일어나는지 조용히 지켜보고 있어요.", "exactly", "roughly", "loosely", "briefly"]
  - ["이유 설명", bulb, "'help the team'은 기록이 팀의 일을 돕는다는 틀이라, 재고 적는 이유가 부담 없이 전해져요.", "for the chart", "지속시간과 양상을 알아야 팀이 빠르게 치료할 수 있어요.", "지속시간과 횟수를 알아야 팀이 정확히 치료할 수 있어요.", "duration", "insurance", "diet", "visitor"]
  - ["감사", handshake2, "'Thank you for…' 뒤에 동명사를 붙여 상대가 한 행동을 구체적으로 인정해요. 세미콜론 뒤에서 곧바로 지금 하는 일을 말해요.", "for waiting", "도와주셔서 감사해요. 언제 시작됐는지 기록하고 있어요.", "기다려 주셔서 감사해요. 언제 시작됐는지 기록하고 있어요.", "noting", "guessing", "wondering", "hoping"]
  - ["시작 확인", calendar, "'exactly when'을 한 덩어리로 앞에 놓아 시각이 핵심임을 강조해요. 'I need to know'는 도움을 청하는 직접적인 표현이에요.", "from the family", "이 발작이 정확히 어디서 시작됐는지 알아야 해요.", "이 발작이 정확히 어떻게 시작됐는지 알아야 해요.", "seizure", "infection", "allergy", "rash"]
  - ["기록 약속", pencil, "'write down'은 지금 보이는 것을 바로 적는다는 약속이에요. 'how long'과 'how'로 적을 두 가지를 나란히 말해요.", "in the room", "얼마나 오래 지속되는지, 눈이 어떻게 움직이는지 적어둘게요.", "얼마나 오래 지속되는지, 소리가 어떻게 나는지 적어둘게요.", "lasts", "starts", "ends", "stops"]
  order:
