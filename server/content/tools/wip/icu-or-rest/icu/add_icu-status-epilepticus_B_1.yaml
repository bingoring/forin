    - ["Because of that, nothing goes in his mouth.", shield, "그래서 입에는 아무것도 넣지 않아요", "금기"]
- title: 벤조디아제핀 초기 투여 보조
  s:
  - ["약 설명", pill, "'first-line'은 가장 먼저 쓰는 약이라는 의료 표현이에요. 'Yes,'로 시작해 가족의 질문에 바로 답해요.", "for the family", "네, 이 벤조디아제핀이 발작을 멈추는 1차 약물이에요.", "네, 이 벤조디아제핀이 발작을 멈추는 2차 약물이에요.", "first-line", "last-minute", "over-the-counter", "second-hand"]
  - ["투약 확인", pill, "'Let's'로 함께 확인하자고 제안해 팀이 같이 움직이게 해요. 'confirm … and give it'은 확인과 투여를 이어서 말해요.", "and wait", "용량을 확인하고 지금 투여하죠.", "용량을 확인하고 지금 준비하죠.", "dose", "label", "color", "price"]
  - ["호흡 감시", stetho, "'closely'는 눈을 떼지 않는다는 뜻의 부사예요. 'after we give it'으로 투여 뒤에 살필 시점을 정해요.", "his skin color", "투약 후에 호흡을 자세히 지켜볼게요.", "투약 후에 혈압을 자세히 지켜볼게요.", "closely", "rarely", "slowly", "twice"]
  - ["확인 진행", pill, "'before we push it'은 주입 직전이 확인의 마지막 기회라는 뜻이에요. 'Confirming'은 주어를 줄인 진행형이라 현장 말투예요.", "the vial", "주입하기 전에 체중과 용량을 확인 중이에요.", "주입하기 전에 체중과 나이를 확인 중이에요.", "weight", "height", "color", "gender"]
  - ["상태 보고", monitor, "'so far'는 지금까지는 그렇다는 한정이라 앞으로도 계속 지켜본다는 여지를 남겨요. 'no … depression'은 부작용이 없다는 보고예요.", "after we give it", "활력징후는 안정적이고, 아직 호흡억제는 없어요.", "활력징후는 안정적이고, 아직 혈압저하는 없어요.", "depression", "infection", "allergy", "bleeding"]
