situations:
- title: 통역 통한 동의·설명
  s:
  - ["통역 설명", mic, "The interpreter will은 설명 주체를 통역사로 분명히 해요. fully를 붙이면 일부만이 아니라 시술 전체를 설명한다는 약속이 돼요.", "to you", "통역사가 시술을 천천히 설명해 드릴 거예요.", "통역사가 비용을 완전히 설명해 드릴 거예요.", "fully", "briefly", "quickly", "slowly"]
  - ["질문 권유", speech, "any questions는 질문의 범위를 막지 않는다는 뜻이에요. before you decide로 결정하기 전에 묻는 것이 맞다는 시점을 알려요.", "out loud", "결정하기 전에 궁금한 것은 뭐든 모아 두세요.", "결정하기 전에 궁금한 것은 하나만 물어보세요.", "before", "after", "since", "unless"]
  - ["되말하기 요청", check, "in your words는 들은 문장을 따라 하는 게 아니라 자기 말로 바꿔 보라는 뜻이에요. 이해했는지 가장 믿을 수 있게 확인해요.", "step by step", "이해하신 내용을 당신 말로 크게 말해주시겠어요?", "느끼신 내용을 당신 말로 다시 말해주시겠어요?", "understood", "wanted", "needed", "signed"]
  - ["시간 허락", calendar, "all the time you need는 정해진 시간이 없다는 말이에요. 동의는 서두르면 안 되는 결정이라 이 여유가 중요해요.", "in the hall", "의논하는 데 필요한 만큼 시간을 가지세요.", "쉬는 데 필요한 만큼 시간을 가지세요.", "think", "rest", "talk", "pray"]
  - ["이해 확인 목표", shield, "make sure는 내가 책임지고 확인하겠다는 뜻이에요. every part로 일부만 이해하고 넘어가지 않게 해요.", "today", "이 내용의 모든 부분을 기억하셨는지 확실히 하고 싶어요.", "이 내용의 모든 부분을 읽으셨는지 확실히 하고 싶어요.", "every", "some", "one", "half"]
  - ["질문 장려", bulb, "no wrong question은 질문 자체를 평가하지 않는다는 선언이에요. 묻기 부끄러워하는 환자의 부담을 덜어 줘요.", "at this table", "여기서는 틀린 대답이 없어요.", "여기서는 늦은 질문이 없어요.", "wrong", "late", "small", "silly"]
  - ["재검토 제안", redo, "Let's는 함께 하자는 제안이에요. once more together가 설명을 한 번 더, 같이 하겠다는 뜻이에요.", "with the form", "두 번 더 함께 살펴볼게요.", "다시 한번 천천히 살펴볼게요.", "together", "alone", "quickly", "later"]
