- title: 문화적 표현·금기 고려
  s:
  - ["존중 약속", handshake2, "Thank you for telling me는 알려 준 행동을 먼저 인정해요. I'll be respectful of that이 들은 내용을 실제로 지키겠다는 약속이에요.", "in my notes", "도와주셔서 감사해요, 존중해 드릴게요.", "말씀해 주셔서 감사해요, 기억해 둘게요.", "respectful", "careful", "aware", "afraid"]
  - ["표현 방식 질문", speech, "How would you like me to처럼 상대의 선호를 묻는 틀은 내가 정하지 않고 맡긴다는 느낌을 줘요.", "in the hall", "그분의 상태를 누구에게 말씀드리길 원하세요?", "그분의 상태를 언제 말씀드리길 원하세요?", "talk", "joke", "write", "guess"]
  - ["안내 요청", compass, "guide me는 가르쳐 달라는 겸손한 부탁이에요. what's appropriate가 정답을 내가 알지 못한다는 점을 드러내요.", "on the visit", "당신 가족에게 필요한 물건을 알려주세요.", "당신 가족에게 편한 시간을 알려주세요.", "appropriate", "popular", "expensive", "available"]
  - ["소통 맞춤", faceWorried, "in a way that's comfortable for you는 내용이 아니라 말하는 방식을 상대에게 맞추겠다는 뜻이에요.", "with your family", "당신에게 빠른 방식으로 말씀드리고 싶어요.", "당신에게 편안한 방식으로 글로 적고 싶어요.", "comfortable", "quick", "short", "formal"]
  - ["금기 어휘 질문", bell, "I not use처럼 would rather 뒤에 주어와 동사 원형이 오는 형태는 '~하지 않았으면 해요'라는 완곡한 선호예요.", "in front of him", "제가 쓰지 않았으면 하는 색이 있나요?", "제가 쓰지 않았으면 하는 이름이 있나요?", "words", "gestures", "colors", "gifts"]
  - ["주도권 존중", check, "follow your lead는 상대가 이끌고 내가 따르겠다는 관용 표현이에요. on this로 범위를 이 문제로 좁혀요.", "from now on", "이 부분은 말씀하시는 대로 적을게요.", "이 부분은 말씀하시는 대로 설명할게요.", "lead", "word", "rule", "path"]
  - ["정정 요청", redo, "Please correct me는 틀려도 괜찮고 고쳐 달라는 열린 부탁이에요. if I say something wrong이 실수 가능성을 솔직히 인정해요.", "on the spot", "제가 잘못 쓰면 바로잡아 주세요.", "제가 잘못 들으면 바로잡아 주세요.", "wrong", "rude", "loud", "late"]
  order:
    tag: 대화 흐름
