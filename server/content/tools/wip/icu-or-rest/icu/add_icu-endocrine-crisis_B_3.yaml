- title: 유발원인 동반 치료
  s:
  - [원인 탐색, magnify, '''like an infection''은 유발 원인의 예를 쉬운 말로 들어 줘요. ''alongside''는 원인 치료를 케토산증 치료와 나란히 한다는 뜻이에요.', your breakfast, '과식 같은 유발 원인을 찾고 있고, 케토산증과 함께 그것도 치료하고 있어요.', '수면 부족 같은 유발 원인을 찾고 있고, 케토산증과 함께 그것도 치료하고 있어요.', trigger, symptom, outcome, result]
  - [재발 방지, shield, '''helps prevent''는 확실히 막는다가 아니라 도움이 된다는 정확한 표현이에요. ''coming back''은 재발을 쉬운 말로 풀어요.', by the elevator, 원인을 해결하면 퇴원을 준비하는 데 도움이 돼요., 원인을 해결하면 회복을 앞당기는 데 도움이 돼요., cause, name, price, shape]
  - [배양 안내, lab, '''based on the results''는 결과가 나오면 그에 맞춰 바꾼다는 뜻이라 지금 약이 끝이 아니라는 설명이 돼요. ''cultures''는 균을 키워 보는 검사예요.', in the supply room, '배양 검사를 시작했고, 결과에 따라 면회를 조절할 거예요.', '배양 검사를 시작했고, 결과에 따라 병실을 조절할 거예요.', started, ended, closed, lost]
  - [검사 목적, lab, '''to find where''로 검사의 목적을 먼저 밝혀요. 혈액과 소변은 감염 위치를 찾는 기본 검체예요.', at the station, 열이 왜 나는지 찾으려고 혈액이랑 소변을 확인하고 있어요., 염증이 얼마나 심한지 찾으려고 혈액이랑 소변을 확인하고 있어요., infection, bleeding, fracture, rash]
  - [치료 전망, chartup, '''Once''가 원인을 아는 것이 치료의 전제라는 순서를 줘요. ''lower the risk''는 위험이 없어진다가 아니라 줄어든다는 정직한 표현이에요.', by tomorrow, 원인을 알면 치료도 하고 회복 기간도 줄일 수 있어요., 원인을 알면 치료도 하고 입원 기간도 줄일 수 있어요., risk, cost, noise, size]
