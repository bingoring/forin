  - [회복 전망, chartup, '''should''는 보장이 아니라 기대라는 정직한 표현이에요. ''slowly''가 급격한 호전을 기대하지 않게 해요.', in a week, 호르몬이 효과를 내면서 식욕이랑 체온이 서서히 좋아질 거예요., 호르몬이 효과를 내면서 기운이랑 목소리가 서서히 좋아질 거예요., energy, hunger, humor, hair]
  order:
    tag: 대화 흐름
    icon: compass
