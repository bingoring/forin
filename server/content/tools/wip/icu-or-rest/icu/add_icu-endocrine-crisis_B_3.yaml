- title: 부신위기 스테로이드 투여
  s:
  - [이유 설명, pill, '''so''로 원인(호르몬 부족)과 처치(투여)를 이어 환자·가족이 이유를 바로 알아요. ''can''t make enough''는 아예 없는 게 아니라 부족하다는 정확한 표현이에요.', in the pharmacy, '스트레스 호르몬이 더 필요해져서, 지금 대신 주고 있어요.', '몸이 스트레스 호르몬을 제대로 쓰지 못해서, 지금 대신 주고 있어요.', body, liver, skin, lungs]
  - [효과 설명, chartup, '''can''은 보장이 아니라 가능성이라 과장하지 않아요. ''quickly stabilize''는 급한 혈압 문제라는 점을 짧게 알려요.', his heart rate, 이 스테로이드가 통증을 빠르게 가라앉혀 줄 수 있어요., 이 스테로이드가 열을 빠르게 내려 줄 수 있어요., stabilize, interrupt, replace, borrow]
  - [추가 투여, monitor, '''if''로 추가 투여의 조건을 걸어 필요한 만큼만 준다는 설명이 돼요. ''demands it''은 몸의 필요가 기준이라는 뜻이에요.', to the family, 계속 지켜보다가 스트레스 수준이 필요로 하면 책임자가 더 줘요., 계속 지켜보다가 스트레스 수준이 필요로 하면 야간조가 더 줘요., give, lend, sell, hide]
  - [투여 안내, siren, '''a stress dose''는 평소보다 많은 위기용 용량을 가리키는 임상어예요. ''right away''가 시점을 즉시로 못 박아요.', on the cart, 혈압을 지지하려고 스트레스 용량 스테로이드를 지금 바로 드리고 있어요., 염증을 가라앉히려고 스트레스 용량 스테로이드를 지금 바로 드리고 있어요., support, blame, doubt, tire]
  - [반응 확인, chartup, '''already''는 예상보다 빠르다는 뜻의 부사예요. ''responding well''은 효과가 보인다는 쉬운 표현이에요.', to the visitors, 혈압이 벌써 수액에 잘 반응하고 있어요., 혈압이 벌써 산소에 잘 반응하고 있어요., responding, belonging, listening, relating]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 부신위기 스테로이드 설명 4문장 순서
    why: 왜 주는지 설명하고, 약의 효과를 알린 뒤, 추가 투여의 기준을 말하고, 반응이 보이면 알려요.
    lines:
    - ['His body can''t make enough stress hormone, so we''re giving it now.', pill, 스트레스 호르몬이 부족해서 지금 대신 주고 있어요, 이유]
    - [That's why this steroid can quickly stabilize his blood pressure., chartup, 그래서 이 스테로이드가 혈압을 빠르게 안정시켜 줄 수 있어요, 효과]
    - [We'll keep monitoring and give more if his stress level demands it., monitor, 계속 지켜보다가 필요하면 더 드릴 거예요, 추가]
    - ['So far, his blood pressure is already responding well to the medicine.', chartup, 지금까지 혈압이 약에 벌써 잘 반응하고 있어요, 반응]
- title: 갑상선기능저하 점액수종 관리
