- title: 광범위 항생제 신속 투여
  s:
  - {t: "즉시 투여", i: pill, w: "to cover …는 목적을 to부정사로 말하는 모양이에요. broad antibiotics는 원인균을 아직 모를 때 여러 균을 한꺼번에 겨냥하는 약이라, 지금 바로 주는 이유와 이어져요.", d: "for the volunteers", k: ["환자 부담을 줄이려고 지금 광범위 항생제를 드리고 있어요", "가능성 있는 출혈을 포괄하려고 지금 광범위 항생제를 드리고 있어요"], a: "likely", o: ["lovely", "lonely", "tidy"]}
  - {t: "시간 중요", i: calendar, w: "gives the best chance는 최상급으로 가장 유리한 조건을 말해요. 시작 시점을 first hour라고 구체적으로 정해 주면 막연한 빨리보다 행동 기준이 분명해져요.", d: "on the left side", k: ["첫 한 시간 이내에 시작하는 게 비용이 가장 적게 들어요", "첫 한 시간 이내에 시작하는 게 퇴원 가능성이 가장 커요"], a: "recovery", o: ["delivery", "discovery", "bakery"]}
  - {t: "투여 관리", i: monitor, w: "is running은 약물이 정맥으로 들어가는 중이라는 진행형이에요. timing it carefully를 덧붙이면 주입을 맡겨 두지 않고 직접 확인한다는 인상을 줘요.", d: "by the door", k: ["약물이 주입되고 있고, 양을 신중하게 재고 있어요", "약물이 주입되고 있고, 시간을 조용히 재고 있어요"], a: "carefully", o: ["loudly", "politely", "playfully"]}
  - {t: "지연 없음", i: shield, w: "so 앞에 이미 끝난 일(already sent)을 두면 뒤의 won't delay가 근거를 얻어요. already는 완료된 일을 강조하는 부사예요.", d: "about the weather", k: ["혈액배양은 이미 보냈으니, 지금 항생제를 시작해도 아무도 놀라지 않아요", "혈액배양은 이미 보냈으니, 지금 항생제를 시작해도 아무것도 변하지 않아요"], a: "cultures", o: ["gloves", "trays", "forms"]}
  - {t: "속도 설명", i: run, w: "as quickly as I safely can은 as … as 비교로 속도의 상한을 말하는 모양이에요. safely를 붙여 서두르되 안전을 해치지 않는다는 균형이 드러나요.", d: "from the cafeteria", k: ["이 첫 하루는 분 단위가 중요해서, 안전한 한도 안에서 최대한 빠르게 움직이고 있어요", "이 첫 한 시간은 분 단위가 중요해서, 환자분 곁에서 최대한 빠르게 움직이고 있어요"], a: "counts", o: ["sings", "jumps", "melts"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항생제 신속 투여 4문장 순서"
    why: "투여한다는 사실을 먼저 알리고, 그것을 첫 한 시간 안에 시작하는 이유를 말해요. 3줄의 That's why는 2줄의 이유를, 4줄의 it은 3줄의 약물을 가리켜서 순서가 하나예요."
    lines:
    - {en: "We're giving broad antibiotics right now.", icon: pill, ko: "지금 광범위 항생제를 드리고 있어요", note: "투여"}
    - {en: "Starting them within the first hour gives the best chance of recovery.", icon: calendar, ko: "첫 한 시간 이내에 시작하는 게 회복 가능성이 가장 커요", note: "이유"}
    - {en: "That's why I'm timing the medication carefully.", icon: monitor, ko: "그래서 약물 시간을 신중하게 재고 있어요", note: "관리"}
    - {en: "I'll tell you as soon as it has finished running.", icon: handshake2, ko: "다 들어가면 바로 알려 드릴게요", note: "약속"}
- title: 초기 수액 소생 협조
  s:
  - {t: "수액 목적", i: pill, w: "to raise … and improve …는 to 뒤에 동사 둘을 and로 이어 목적을 둘 말해요. 수액을 주는 이유가 혈압과 순환이라고 밝히면 환자와 가족이 많은 양에 놀라지 않아요.", d: "with a pencil", k: ["열을 내리고 순환을 개선하려고 수액을 드리고 있어요", "혈압을 올리고 호흡을 개선하려고 수액을 드리고 있어요"], a: "fluids", o: ["flowers", "forms", "fruit"]}
  - {t: "반응 관찰", i: monitor, w: "to see how he responds는 목적을 to see로 밝히고, how 절이 보려는 내용을 담아요. 소변량은 신장이 수액에 어떻게 반응하는지 보여 주는 지표라 혈압과 묶어 말해요.", d: "near the sink", k: ["어떻게 반응하는지 보려고 혈압과 체중을 지켜보고 있어요", "어떻게 반응하는지 보려고 맥박과 소변량을 지켜보고 있어요"], a: "watching", o: ["sharing", "painting", "driving"]}
  - {t: "조건 대응", i: stetho, w: "If …, we'll …은 조건과 대응을 한 문장에 묶어 미리 계획을 알려 줘요. sound wet처럼 sound 뒤에 형용사가 오면 어떻게 들리는지를 말해요.", d: "in the lobby", k: ["폐에서 쉰 소리가 나면 바로 속도를 조정할게요", "목에서 젖은 소리가 나면 바로 속도를 조정할게요"], a: "wet", o: ["sweet", "silly", "tidy"]}
  - {t: "이유 설명", i: chartup, w: "because 절이 앞의 결정에 대한 근거를 말해요. 혈압이 낮았다는 과거 사실을 밝히면 많은 양으로 시작한 것이 이유 있는 선택이라는 점이 분명해져요.", d: "for the parking", k: ["열이 너무 높아서 처음엔 많은 양의 수액으로 시작했어요", "혈압이 너무 낮아서 처음엔 적은 양의 수액으로 시작했어요"], a: "large", o: ["tiny", "cheap", "noisy"]}
  - {t: "효과 확인", i: chartup, w: "which는 앞 절 전체를 받아 덧붙이는 관계사예요. 소변이 늘었다는 관찰을 근거로 수액이 듣고 있다고 말하면 가족이 변화를 이해해요.", d: "to the lobby", k: ["지금 땀이 더 나오고 있어서, 수액이 효과가 있다는 걸 알려줘요", "지금 소변이 더 나오고 있어서, 약이 효과가 있다는 걸 알려줘요"], a: "working", o: ["sleeping", "dancing", "shopping"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수액 소생 협조 4문장 순서"
    why: "수액을 주는 목적을 먼저 말하고, 반응을 지켜본다고 이어요. 3줄의 that은 2줄의 지켜보기를, 4줄의 they는 3줄의 폐를 가리켜서 순서가 하나예요."
    lines:
    - {en: "We're giving fluids to raise his blood pressure.", icon: pill, ko: "혈압을 올리려고 수액을 드리고 있어요", note: "목적"}
    - {en: "To see how he responds, I'm watching his pressure and urine output.", icon: monitor, ko: "반응을 보려고 혈압과 소변량을 지켜보고 있어요", note: "관찰"}
    - {en: "Listening to his lungs is part of that.", icon: stetho, ko: "폐 소리를 듣는 것도 그 일의 일부예요", note: "청진"}
    - {en: "If they sound wet, we'll adjust the rate right away.", icon: bell, ko: "젖은 소리가 나면 바로 속도를 조정할게요", note: "대응"}
- title: 감염원 병력·부위 사정
  s:
  - {t: "증상 질문", i: speech, w: "Can you tell me …?는 시험하듯 묻지 않고 부탁하는 모양이에요. where 절을 목적어로 넣으면 한 번에 증상의 위치를 묻는 간접 의문이 돼요.", d: "at the front desk", k: ["어디에 통증, 가려움, 또는 열이 있었는지 말씀해 주시겠어요?", "어디에 통증, 발적, 또는 기침이 있었는지 말씀해 주시겠어요?"], a: "redness", o: ["laughter", "hunger", "music"]}
  - {t: "단서 설명", i: bulb, w: "can point us to …의 point는 가리켜 안내한다는 뜻이고 can은 가능성을 말해요. 수술·카테터·상처처럼 몸에 들어간 흔적을 나열하면 병력을 묻는 이유가 분명해져요.", d: "for the tour", k: ["최근 수술, 카테터, 혹은 수면이 감염원을 가리킬 수 있어요", "최근 수술, 카테터, 혹은 상처가 감염원을 막아줄 수 있어요"], a: "catheters", o: ["haircuts", "birthdays", "holidays"]}
  - {t: "질문 이유", i: bulb, w: "Knowing …은 동명사가 주어가 돼서 아는 것 자체가 도움이 된다는 모양이에요. precisely는 치료를 막연히 하지 않고 대상에 맞춘다는 부사예요.", d: "by the elevator", k: ["감염이 어디서 끝났는지 알면 정확하게 치료하는 데 도움이 돼요", "감염이 어디서 시작됐는지 알면 안전하게 퇴원하는 데 도움이 돼요"], a: "precisely", o: ["privately", "playfully", "proudly"]}
  - {t: "증상 단서", i: faceWorried, w: "when you urinate처럼 when 절은 어떤 상황에서 아픈지를 짚어 줘요. 소변볼 때와 배의 통증은 요로나 복부에서 시작된 감염을 의심하게 하는 단서예요.", d: "in the pantry", k: ["웃을 때 통증이나 배의 통증이 있으면, 어디서 시작됐는지 가리킬 수 있어요", "소변볼 때 통증이나 머리의 통증이 있으면, 어디서 시작됐는지 가리킬 수 있어요"], a: "urinate", o: ["whisper", "whistle", "sneeze"]}
  - {t: "확인 약속", i: magnify, w: "one by one은 하나도 건너뛰지 않고 차례로 한다는 부사구예요. 확인 대상을 피부·라인·상처로 나열하면 어디를 보는지 환자가 미리 알 수 있어요.", d: "for lunch", k: ["피부, 입안, 그리고 최근 상처를 하나씩 확인해 볼게요", "피부, 라인, 그리고 최근 상처를 두 번씩 확인해 볼게요"], a: "wounds", o: ["trays", "shirts", "visits"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "감염원 찾기 4문장 순서"
    why: "먼저 증상을 묻고, 병력이 같은 단서가 된다고 이어요. 3줄의 they는 2줄의 답과 병력을, 4줄의 So는 3줄의 목적을 받아서 직접 확인하겠다고 마무리해 순서가 하나예요."
    lines:
    - {en: "Can you tell me where you've had pain, redness, or a fever?", icon: speech, ko: "어디에 통증, 발적, 열이 있었는지 말씀해 주시겠어요?", note: "질문"}
    - {en: "Those answers help, and so do any recent surgeries, catheters, or wounds.", icon: bulb, ko: "그 답이 도움이 되고, 최근 수술, 카테터, 상처도 마찬가지예요", note: "병력"}
    - {en: "Together, they show us where the infection started, which helps us treat it precisely.", icon: magnify, ko: "그것들이 감염이 어디서 시작됐는지 보여 줘서 정확히 치료하게 돼요", note: "이유"}
    - {en: "So I'll check your skin, your lines, and any recent wounds one by one.", icon: stetho, ko: "그래서 피부, 라인, 최근 상처를 하나씩 확인할게요", note: "확인"}
