- title: 말초·중심 체온차 관찰
  s:
  - {t: "체온 비교", i: magnify, w: "while은 두 상태를 나란히 대비하는 접속사예요. 발은 차갑고 가슴은 따뜻하다고 말하면 온도 차이가 왜 문제인지 한 문장에 보여요.", d: "in the lobby", k: ["손은 차갑고 가슴은 따뜻해서 순환을 확인하고 있어요", "발은 차갑고 배는 따뜻해서 순환을 확인하고 있어요"], a: "chest", o: ["back", "neck", "knee"]}
  - {t: "단서 설명", i: bulb, w: "can be a clue는 확정이 아니라 단서가 될 수 있다는 가능성 표현이에요. 환자에게 체온차를 설명할 때 진단을 단정하지 않고 사정의 이유만 알려 줘요.", d: "at the bedside", k: ["이 체온차는 호흡 상태를 알려주는 단서가 될 수 있어요", "이 체온차는 혈당 상태를 알려주는 단서가 될 수 있어요"], a: "gap", o: ["test", "scale", "chart"]}
  - {t: "경과 보고", i: speech, w: "let the team know는 let 뒤에 동사원형을 써서 팀이 알게 해 준다는 뜻이에요. 혼자 지켜보는 데서 끝내지 않고 변화를 공유한다는 말이에요.", d: "from the corner", k: ["계속 살펴보면서 가족에게도 알릴게요", "계속 살펴보면서 팀과 상의할게요"], a: "monitor", o: ["resolve", "reverse", "replace"]}
  - {t: "환자 증상", i: faceWorried, w: "to me는 내가 느끼기에라는 뜻이라서 만져 본 사람의 관찰임을 밝혀요. very로 정도를 말하면 차가움이 가볍지 않다는 점도 함께 전해요.", d: "on the floor", k: ["손이 지금 저에게는 많이 차게 느껴지네요", "발이 지금 저에게는 많이 아프게 느껴지네요"], a: "cold", o: ["sore", "numb", "swollen"]}
  - {t: "원인 설명", i: bulb, w: "This can happen when …은 어떤 조건에서 이런 일이 생길 수 있는지 설명하는 모양이에요. decreases처럼 줄어드는 변화를 말하면 혈류와 차가운 발이 연결돼요.", d: "after dinner", k: ["팔로 가는 혈류가 줄어들면 이런 일이 생길 수 있어요", "다리로 가는 산소가 줄어들면 이런 일이 생길 수 있어요"], a: "decreases", o: ["increases", "doubles", "returns"]}
  - {t: "재확인 약속", i: monitor, w: "keep …ing는 같은 일을 계속한다는 모양이에요. every hour로 주기를 정하면 환자가 언제 또 확인받는지 알 수 있어요.", d: "at the door", k: ["매시간 계속 순환을 그려 볼게요", "매시간 계속 순환을 안내할게요"], a: "checking", o: ["improving", "protecting", "warming"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "체온차 관찰 4문장 순서"
    why: "환자가 말한 증상에서 시작해 원인을 설명하고, 그래서 순환을 확인한다고 이은 뒤 계속 확인하겠다고 약속해요. 2줄의 This는 1줄의 증상을, 3줄의 So는 2줄의 설명을, 4줄의 that은 3줄의 확인을 가리켜서 순서가 하나예요."
    lines:
    - {en: "Your feet feel very cold to me right now.", icon: faceWorried, ko: "발이 지금 저에게는 많이 차게 느껴지네요", note: "관찰"}
    - {en: "This can happen when blood flow to your legs decreases.", icon: bulb, ko: "다리로 가는 혈류가 줄어들면 이런 일이 생길 수 있어요", note: "설명"}
    - {en: "So I'm checking your circulation to see how bad it is.", icon: magnify, ko: "그래서 얼마나 심한지 순환을 확인하고 있어요", note: "확인"}
    - {en: "I'll keep doing that every hour and let the team know.", icon: monitor, ko: "그걸 매시간 계속하면서 팀에 알릴게요", note: "약속"}
- title: 저혈량 쇼크 출혈원 감별
  s:
  - {t: "소견 보고", i: board, w: "and로 두 소견을 나란히 이으면 헤모글로빈 하락과 복부 팽창이 같은 문제를 가리킨다는 느낌이 전해져요. distending은 안쪽 압력으로 부풀어 오르는 진행형이에요.", d: "on the chart", k: ["헤모글로빈이 떨어지고 다리가 팽창하고 있어요", "혈당이 떨어지고 배가 팽창하고 있어요"], a: "abdomen", o: ["pelvis", "throat", "spine"]}
  - {t: "원인 판단", i: magnify, w: "not just는 이것만은 아니라는 뜻이에요. 탈수는 흔한 설명이라 먼저 꺼내 놓고, 활동성 출혈을 의심하는 이유를 대비로 보여 줘요.", d: "for the family", k: ["단순 탈수가 아니라 활동성 감염처럼 보여요", "단순 통증이 아니라 활동성 출혈처럼 보여요"], a: "active", o: ["old", "mild", "slow"]}
  - {t: "수혈 준비", i: lab, w: "Let's로 함께 준비하자고 제안하는 모양이고, type and cross는 환자의 혈액형을 확인하고 맞는 혈액을 찾는 검사예요. get blood ready는 수혈이 필요하면 바로 쓸 수 있게 해 둔다는 뜻이에요.", d: "for the visitors", k: ["타입 앤 크로스 검사를 하고 수혈 서류를 챙겨요", "타입 앤 크로스 검사를 하고 수혈 동의를 받아요"], a: "ready", o: ["quiet", "empty", "cold"]}
  - {t: "경과 비교", i: chartup, w: "firmer than an hour ago는 비교급과 than으로 한 시간 전과 지금을 견주는 모양이에요. getting을 붙여 진행 중인 변화를 말하면 배가 점점 단단해진다는 것이 분명해져요.", d: "in the morning", k: ["한 시간 전보다 등이 더 단단해지고 있어요", "세 시간 전보다 배가 더 단단해지고 있어요"], a: "firmer", o: ["softer", "flatter", "smaller"]}
  - {t: "감별 의견", i: bulb, w: "I don't think …는 확신이 없을 때 의견을 부드럽게 말하는 모양이에요. just를 넣어 체액 손실이 전부는 아니라는 뜻으로 다른 원인을 열어 둬요.", d: "from the unit", k: ["단순한 약물 부작용만은 아닌 것 같아요", "단순한 체액 과다만은 아닌 것 같아요"], a: "loss", o: ["gain", "change", "intake"]}
  - {t: "의사 호출", i: speech, w: "for a transfusion order는 전화하는 목적을 전치사구로 밝혀요. 수혈은 처방이 있어야 하므로 연락하는 이유를 분명히 말하면 의사가 바로 필요한 것을 알아요.", d: "of the hospital", k: ["수혈 처방을 받으러 의사에게 직접 가 볼게요", "수혈 처방을 전하러 의사에게 연락할게요"], a: "order", o: ["receipt", "label", "tray"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "출혈 쇼크 의심 4문장 순서"
    why: "소견을 먼저 말하고, 그것이 출혈로 보인다고 해석하고, 혈액을 준비한 뒤, 그 혈액을 위한 처방을 요청해요. 2줄의 That은 1줄의 소견을, 4줄의 that blood는 3줄에서 준비한 혈액을 가리켜서 순서가 하나예요."
    lines:
    - {en: "His hemoglobin is dropping and his abdomen is distending.", icon: board, ko: "헤모글로빈이 떨어지고 배가 팽창하고 있어요", note: "소견"}
    - {en: "That looks like active bleeding, not just dehydration.", icon: magnify, ko: "그건 단순 탈수가 아니라 활동성 출혈처럼 보여요", note: "판단"}
    - {en: "I'll type and cross him and get blood ready.", icon: lab, ko: "타입 앤 크로스 검사를 하고 혈액을 준비할게요", note: "준비"}
    - {en: "For that blood, I'll call the physician for a transfusion order.", icon: speech, ko: "그 혈액을 위해 수혈 처방을 받으러 의사에게 연락할게요", note: "요청"}
- title: 분포성 쇼크 초기 소생
  s:
  - {t: "치료 순서", i: pill, w: "first … and … if …는 순서와 조건을 한 문장에 묶는 모양이에요. 수액이 먼저이고 승압제는 저혈압이 계속될 때라는 계획을 팀이 같은 순서로 이해하게 돼요.", d: "on her left side", k: ["먼저 수액을 주고 저혈압이 유지되면 승압제를 시작하자고 말씀드려요", "먼저 수액을 주고 저혈압이 유지되면 승압제를 시작하라고 하셨어요"], a: "hypotensive", o: ["febrile", "anemic", "jaundiced"]}
  - {t: "원인 설명", i: stetho, w: "which fits …는 앞에서 말한 소견이 뒤의 진단에 맞는다는 관계절이에요. 따뜻한 피부와 확장된 혈관은 분포성 쇼크의 특징적인 소견이라 서로 연결해서 말해요.", d: "at the window", k: ["따뜻하고 피부가 건조해서 분포성 쇼크에 맞아요", "따뜻하고 맥박이 느려서 분포성 쇼크에 맞아요"], a: "vasodilated", o: ["dehydrated", "anxious", "sedated"]}
  - {t: "목표 설정", i: chartup, w: "titrate to는 반응을 보면서 목표에 맞춰 조금씩 조절한다는 말이에요. MAP target을 밝히면 무엇을 기준으로 조절하는지 팀이 같은 숫자를 보게 돼요.", d: "by the bed", k: ["진행하면서 호흡수 목표에 맞춰 적정할게요", "진행하면서 평균동맥압 목표를 같이 정할게요"], a: "titrate", o: ["translate", "terminate", "tolerate"]}
  - {t: "반응 보고", i: monitor, w: "still은 이미 어떤 일이 있었는데도 상태가 그대로라는 뜻이에요. after two liters로 이미 준 양을 함께 말해야 수액에 반응하지 않았다는 근거가 돼요.", d: "in the ward", k: ["3리터를 주고도 혈압이 아직 낮아요", "2리터를 주고도 열이 아직 높아요"], a: "liters", o: ["bags", "hours", "doses"]}
  - {t: "승압제 계획", i: pill, w: "if fluids aren't enough는 수액으로 충분하지 못한 경우라는 조건이에요. 승압제를 시작하는 기준을 미리 말해 두면 팀이 같은 판단 순서로 움직여요.", d: "from the pump", k: ["수액만으로 충분하지 않으면 노르에피네프린을 시작하자고 건의할게요", "수액만으로 충분하지 않으면 노르에피네프린 시작을 의논할게요"], a: "enough", o: ["ready", "cold", "fast"]}
  - {t: "재사정 약속", i: monitor, w: "reassess는 다시 평가한다는 동사이고 every fifteen minutes는 주기를 분명히 해요. 승압 후에는 혈압이 빠르게 변할 수 있어서 짧은 간격으로 반복해 봐요.", d: "at noon", k: ["15분마다 그녀의 혈압을 재사정할게요", "15분마다 혈압을 확인해 달라고 할 거예요"], a: "reassess", o: ["resume", "retire", "reject"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "분포성 쇼크 소생 4문장 순서"
    why: "진단에 맞는 소견을 말하고, 수액을 먼저 주고, 그 수액에도 혈압이 낮으면 승압제를 요청하며 목표를 정해요. 3줄의 of that은 2줄의 수액을, 4줄의 So는 3줄의 반응을 이어받아서 순서가 하나예요."
    lines:
    - {en: "She's warm and vasodilated, so this fits distributive shock.", icon: stetho, ko: "따뜻하고 혈관이 확장돼 있어서 분포성 쇼크에 맞아요", note: "진단"}
    - {en: "Let's give fluids first.", icon: pill, ko: "먼저 수액을 줘요", note: "수액"}
    - {en: "She's still hypotensive after two liters of that.", icon: monitor, ko: "그걸 2리터 주고도 아직 저혈압이에요", note: "반응"}
    - {en: "So I'll call for norepinephrine and titrate to a MAP target.", icon: chartup, ko: "그러니 노르에피네프린을 요청하고 평균동맥압 목표에 맞춰 적정할게요", note: "승압"}
- title: 심인성 쇼크 감별
  s:
  - {t: "원인 추정", i: stetho, w: "so this may be …는 소견을 근거로 가능성을 말하는 모양이에요. may로 단정을 피하면 확진 전 팀과 가능성을 나눌 수 있어요.", d: "in the hall", k: ["천명음과 낮은 혈압이 있어서 심인성일 수 있어요", "수포음과 낮은 체온이 있어서 심인성일 수 있어요"], a: "low", o: ["high", "normal", "stable"]}
  - {t: "위험 설명", i: bulb, w: "could worsen은 그럴 수 있다는 가능성을 말하는 조동사 모양이에요. 심인성 쇼크는 심장이 수액을 감당하지 못해서 수액을 더 넣으면 폐에 물이 찰 수 있어요.", d: "for her", k: ["수액을 더 밀어넣으면 폐렴이 악화될 수 있어요", "수액을 더 밀어넣으면 신부전이 악화될 수 있어요"], a: "pulmonary", o: ["hepatic", "renal", "ocular"]}
  - {t: "대안 제안", i: pill, w: "instead of는 앞의 것을 하는 대신 뒤의 것을 한다는 전치사구예요. 심인성 쇼크는 수액이 아니라 심장의 수축을 도와주는 쪽으로 방향을 바꿔요.", d: "on the cart", k: ["볼루스 대신 강심제를 구해요", "볼루스 대신 강심제를 설명해요"], a: "inotropes", o: ["antibiotics", "laxatives", "vitamins"]}
  - {t: "경과 설명", i: chartup, w: "has been dropping은 현재완료 진행형으로 어떤 때부터 지금까지 이어지는 변화를 말해요. since this morning으로 시작 시점을 넣어 얼마나 오래 진행됐는지 알려 줘요.", d: "in the car", k: ["어젯밤부터 산소포화도가 떨어지고 있어요", "오늘 아침부터 체온이 떨어지고 있어요"], a: "morning", o: ["noon", "dawn", "night"]}
  - {t: "폐음 청진", i: stetho, w: "listen for는 어떤 소리가 있는지 찾아 듣는다는 말이에요. 수포음은 폐 아래쪽에서 먼저 들려서 양쪽 기저부를 모두 확인해요.", d: "on the stool", k: ["양쪽 폐 기저부에서 수포음을 세고 있어요", "양쪽 폐 기저부에서 수포음을 녹음하고 있어요"], a: "crackles", o: ["wheezes", "murmurs", "rubs"]}
  - {t: "수액 보류", i: shield, w: "for now는 지금은 그렇다는 뜻이라 영구적인 결정이 아님을 알려 줘요. 폐음이 나빠진 상태에서는 다음 볼루스를 넣기 전에 재평가가 먼저예요.", d: "from the pharmacy", k: ["지금은 이전 수액 볼루스를 보류할게요", "지금은 다음 수액 볼루스를 보류하자고 해요"], a: "next", o: ["last", "first", "same"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "심인성 쇼크 감별 4문장 순서"
    why: "산소 변화를 먼저 말하고, 양쪽 기저부를 듣고, 소견을 합쳐 심인성 가능성을 말한 뒤 볼루스를 보류하자고 해요. 3줄의 With low pressure는 2줄의 소견에, 4줄의 So는 3줄의 판단에 이어져서 순서가 하나예요."
    lines:
    - {en: "His oxygen has been dropping since this morning.", icon: chartup, ko: "오늘 아침부터 산소포화도가 떨어지고 있어요", note: "경과"}
    - {en: "I'm listening to both bases and hearing crackles.", icon: stetho, ko: "양쪽 기저부에서 수포음이 들려요", note: "청진"}
    - {en: "With low pressure, this may be cardiogenic.", icon: bulb, ko: "혈압이 낮아서 심인성일 수 있어요", note: "판단"}
    - {en: "So I'll hold the next fluid bolus and we can consider inotropes.", icon: shield, ko: "그러니 다음 수액 볼루스는 보류하고 강심제를 고려해요", note: "계획"}
- title: 폐색성 쇼크 인지
  s:
  - {t: "소견 보고", i: stetho, w: "and로 두 소견을 이어 말하면 기관 편위와 호흡음 소실이 함께 나타난다는 점이 한 번에 전해져요. on one side는 어느 쪽인지 따로 말해야 하는 내용이라는 신호예요.", d: "in the corner", k: ["기관이 편위되고 한쪽 맥박이 없어요", "기관이 부어오르고 한쪽 호흡음이 없어요"], a: "deviated", o: ["swollen", "narrowed", "blocked"]}
  - {t: "긴급 판단", i: siren, w: "needs … now는 필요성과 시급함을 한 문장에 말해요. 긴장성 기흉은 흉강 안에 공기가 계속 쌓여 심장으로 돌아오는 혈류를 막아서 기다릴 수 없는 상황이에요.", d: "by the sink", k: ["작은 기흉처럼 보이고 지금 바로 감압이 필요해요", "긴장성 기흉처럼 들리고 지금 바로 감압이 필요해요"], a: "tension", o: ["small", "simple", "mild"]}
  - {t: "의사 호출", i: speech, w: "for an emergent …는 연락하는 목적을 응급 시술로 밝히는 전치사구예요. emergent는 지금 바로 해야 할 만큼 급하다는 뜻이라 의사가 우선순위를 바로 알아요.", d: "at the entrance", k: ["응급 바늘 감압을 위해 의사에게 연락해 달라고 하고 있어요", "응급 바늘 감압을 위해 의사에게 전달하고 있어요"], a: "calling", o: ["carrying", "cleaning", "counting"]}
  - {t: "청진 소견", i: stetho, w: "can't hear any는 전혀 들리지 않는다는 강한 부정이에요. 이런 소견은 한쪽 폐가 공기로 눌려 있다는 단서라서 어느 쪽인지 정확히 말해야 해요.", d: "on his back", k: ["오른쪽에서 심음이 전혀 안 들려요", "오른쪽에서 기침 소리가 전혀 안 들려요"], a: "breath", o: ["heart", "bowel", "voice"]}
  - {t: "활력 변화", i: monitor, w: "and로 맥박과 혈압을 함께 말하면 두 수치가 반대로 움직이는 것이 한 번에 보여요. climbing과 dropping 같은 진행형은 지금도 계속 변하는 중이라는 뜻이에요.", d: "in the lobby", k: ["맥박은 빠르게 오르고 체온은 빠르게 떨어지고 있어요", "호흡은 빠르게 오르고 혈압은 빠르게 떨어지고 있어요"], a: "climbing", o: ["settling", "steadying", "easing"]}
  - {t: "물품 요청", i: scalpel, w: "I need …는 필요한 것을 직접 말하는 모양이고 right now가 시급함을 더해요. at the bedside로 어디에 필요한지까지 말하면 가져오는 사람이 헤매지 않아요.", d: "in his room", k: ["지금 바로 병실 앞에 큰 바늘이 필요해요", "지금 바로 침상 옆에 큰 바늘이 필요하대요"], a: "bedside", o: ["desk", "door", "closet"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "폐색성 쇼크 인지 4문장 순서"
    why: "소견을 먼저 말하고, 그것이 긴장성 기흉으로 보인다고 판단하고, 의사를 부르며, 그 시술을 위해 바늘을 요청해요. 2줄의 That은 1줄의 소견을, 4줄의 it은 3줄의 감압을 가리켜서 순서가 하나예요."
    lines:
    - {en: "His trachea is deviated and he has no breath sounds on one side.", icon: stetho, ko: "기관이 편위되고 한쪽 호흡음이 없어요", note: "소견"}
    - {en: "That looks like a tension pneumothorax.", icon: siren, ko: "그건 긴장성 기흉처럼 보여요", note: "판단"}
    - {en: "I'm calling the physician for an emergent needle decompression.", icon: speech, ko: "응급 바늘 감압을 위해 의사에게 연락하고 있어요", note: "호출"}
    - {en: "I need a large needle at the bedside for it right now.", icon: scalpel, ko: "그걸 위해 지금 바로 침상 옆에 큰 바늘이 필요해요", note: "요청"}
