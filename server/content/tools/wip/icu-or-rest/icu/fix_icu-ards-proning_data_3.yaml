# order·nuance 수정 데이터
order:
- s: 0
  lines:
    3: {en: "Because a lower result means a worse injury, we keep watching it as new results come in.", ko: "낮은 결과는 더 심한 손상이라서 새 결과가 나올 때마다 계속 지켜봐요"}
- s: 1
  lines:
    2: {en: "So let's confirm the plateau pressure stays under 30.", ko: "그러니 플래토압이 30 미만인지 확인해요"}
  why: "설정을 먼저 알리고, 그 설정이 폐를 지키는 이유를 말한 뒤, 확인할 압력(플래토압)과 그 기준(30 미만)을 정해요. 마지막에 점검 시점을 약속해요."
- s: 3
  lines:
    1: {en: "With the team ready, let's secure all his lines and the tube.", ko: "팀이 준비되면 모든 라인과 튜브를 고정해요"}
  why: "필요한 인원을 먼저 알리고, 그 인원이 모이면 라인과 튜브를 고정한 뒤, 기도를 확인하고 패딩을 댄 다음에 돌려요."
- s: 4
  lines:
    2: {en: "Any redness there or under the tube needs padding adjusted right away.", ko: "그 부위나 튜브 밑에 발적이 있으면 바로 패딩을 조정해야 해요"}
- s: 9
  lines:
    1: {en: "For the paralytic itself, I'll check the train-of-four to keep it at the right level.", ko: "근이완제 자체는 TOF를 확인해서 알맞은 수준으로 맞출게요"}
    3: {en: "If the documented counts show more twitches coming back, I'll increase the dose per protocol.", ko: "기록된 수치에서 씰룩임이 더 많이 돌아오면 프로토콜에 따라 용량을 늘릴게요"}
  why: "마비 환자는 항상 깊이 진정해야 한다는 원칙을 먼저 말하고, 근이완제의 차단 정도를 TOF로 확인하고(TOF는 진정 깊이가 아니라 근육 차단 정도를 봐요), 기록한 뒤, 그 기록으로 프로토콜에 따라 용량을 조정해요."
- s: 10
  lines:
    3: {en: "While we compare, I'll watch for overdistension so we don't harm the good lung.", ko: "비교하는 동안 덜 손상된 폐 부위를 다치지 않게 과팽창을 지켜볼게요"}
- s: 11
  lines:
    0: {en: "His P/F ratio rose a lot after the turn.", ko: "돌린 뒤 P/F 비율이 크게 올랐어요"}
  why: "돌린 뒤 P/F 비율이 크게 올랐다는 사실로 시작해 응답자라고 판단하고, 그 반응을 보고해 팀이 일정을 정한 뒤 다음 회차를 계획해요."
- s: 12
  lines:
    2: {en: "If it stays low after those checks, I'll titrate fluids or pressors per protocol.", ko: "그 확인 뒤에도 낮으면 프로토콜대로 수액이나 승압제를 적정할게요"}
    3: {en: "Either way, his pressure usually bounces back within a few minutes of the turn.", ko: "어느 쪽이든 보통 돌리고 몇 분 안에 혈압이 회복돼요"}
  why: "혈압이 떨어질 수 있다고 먼저 알리고, 라인과 환류부터 확인한 뒤, 그 확인 뒤에도 낮으면 지침대로 적정해요. 마지막으로 보통 돌리고 몇 분 안에 회복된다고 전해요."
- s: 13
  lines:
    1: {en: "It looks scary, but it usually goes down after we turn him back.", ko: "무서워 보여도 다시 눕히면 대개 가라앉아요"}
    2: {en: "Until then, we position his head to avoid pressure on his eyes.", ko: "그때까지 눈에 압박이 가지 않게 머리 위치를 신경 써요"}
    3: {en: "To protect them further, I'll put ointment in his eyes every few hours.", ko: "눈을 더 보호하려고 몇 시간마다 눈에 연고를 넣을게요"}
  why: "흔한 일이라고 먼저 알리고, 무서워 보여도 대개 가라앉는다고 안심시킨 뒤, 가라앉을 때까지 눈에 압박이 가지 않게 머리 위치를 살피고 연고로 눈을 더 보호한다고 말해요."
- s: 14
  lines:
    2: {en: "Once that's set, let's plan the turn as a team and watch his sats closely afterward.", ko: "그게 정해지면 팀으로 돌리는 걸 계획하고 그 후 산소포화도를 자세히 지켜봐요"}
- s: 16
  lines:
    3: {en: "While I start CPR, someone grab the code cart.", ko: "제가 심폐소생술을 시작하는 동안 누가 코드 카트를 가져와요"}
  why: "맥박이 없을 때 코드를 부르고 뒤집은 다음, 돌리는 동안 기도와 라인을 보호하고, 눕는 순간 압박을 시작해요. 압박이 시작되면 다른 사람이 코드 카트를 가져와요."
- s: 18
  lines:
    2: {en: "For that consult, I'll gather his gases, P/F ratio, and vent settings.", ko: "그 자문을 위해 혈액가스, P/F 비율, 인공호흡기 설정을 모을게요"}
- s: 20
  lines:
    1: {en: "That makes it a deep pressure injury, so the head needs repositioning right away.", ko: "그러면 깊은 압박 손상이라 머리 위치를 바로 바꿔야 해요"}
nuance:
- {s: 1, kind: slider, set: {exKo: "인공호흡기 설정을 바꿀 때마다 플래토압을 확인해 둘게요."}}
- s: 1
  kind: context
  scene: {2: {en: "His ventilator settings are unchanged: TV 420, RR 22, PEEP 10, FiO2 60.", fix: "The breathing machine settings haven't changed. It's still giving him small, gentle breaths to protect his lungs."}}
- s: 2
  kind: context
  scene:
    0: {en: "His unstable T12 fracture is a contraindication to proning."}
    1: {en: "Contraindication to proning: unstable T12 fracture."}
- s: 3
  kind: context
  scene: {2: {en: "We will secure the endotracheal tube and central venous catheters prior to prone positioning."}}
- s: 15
  kind: context
  set: {ko: "포화도 수치(약칭)"}
- s: 16
  kind: context
  scene: {0: {en: "Start compressions right away, even while he's still prone."}}
- s: 17
  kind: slider
  set:
    cue: "The tube mark is 4 cm farther out at the lip than at the last check."
    why: "표시가 4cm나 밖으로 나왔으면 튜브가 일부 빠진 것(partly out)이에요. loose는 고정만 느슨한 정도, out은 완전히 빠진 상태예요. 일부만 빠져도 기도가 위험하니 혼자 밀어 넣지 말고 바로 도움을 부르세요."
- s: 19
  kind: context
  scene: {2: {en: "We're concerned he may have a pneumothorax and may need emergent needle decompression.", fix: "We think some air may have leaked outside his lung. The doctor may need to let it out right away."}}
  set: {why: "동료와 차트에서는 pneumothorax가 정확하고 짧아요. 가족에게는 needle decompression 같은 말보다 '폐 밖으로 공기가 샌 것 같아 빼내야 할 수 있다'로 풀어 말해요."}
