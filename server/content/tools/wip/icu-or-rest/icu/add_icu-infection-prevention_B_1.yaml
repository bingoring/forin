situations:
- title: "손위생·PPE 착탈"
  s:
  - ["손위생 안내", "shield", "Please로 지시를 부드럽게 하고 'before and after'로 시점을 두 번 짚어, 방문하는 가족이 언제 해야 하는지 한 번에 알려요.", "in the hallway", "식사 전후로 젤로 손을 소독해 주세요.", "검사 전후로 젤로 손을 소독해 주세요.", "gel", "lotion", "cream", "powder"]
  - ["착용 순서", "board", "'first … then'으로 순서를 말에 담으면 가운이 먼저, 장갑이 나중이라는 걸 따로 설명하지 않아도 돼요. 보호구는 입는 순서가 정해져 있어요.", "at the desk", "들어가시기 전에 가운 상자를 먼저 열고, 그다음 장갑 상자를 여세요.", "들어가시기 전에 가운 위치를 먼저 보고, 그다음 장갑 크기를 고르세요.", "gown", "jacket", "blanket", "towel"]
  - ["벗는 순서", "board", "벗을 때는 가장 더러워진 장갑을 먼저 벗어요. 'when you leave'로 그 시점을 먼저 밝히면 순서가 따라와요.", "by the door", "나가실 때는 간호사에게 먼저 알리고, 그다음 문을 닫으세요.", "나가실 때는 방문 기록을 먼저 쓰고, 그다음 간호사에게 알리세요.", "remove", "carry", "borrow", "return"]
  - ["손위생 시점", "bell", "'every time'으로 횟수에 예외가 없음을 알리고, enter or leave로 드나드는 두 시점을 모두 짚어요.", "once a day", "병실에 들어오거나 나갈 때마다 방문 기록을 하세요.", "병실에 들어오거나 나갈 때마다 인터폰을 누르세요.", "hand gel", "hand lotion", "hand dryer", "hand towel"]
  - ["착용 도움", "bandage", "'Let me help you'로 시작하면 처음 입어 보는 가족도 부담 없이 도움을 받아요. 가운은 뒤쪽 끈을 혼자 묶기 어려워요.", "on the shelf", "가운 사이즈 고르는 걸 도와드릴게요.", "가운 상자 여는 걸 도와드릴게요.", "tie", "fold", "hang", "wash"]
  - ["젤 설명", "lab", "'can't always'로 비누가 나쁘다는 게 아니라 닿지 못하는 곳이 있다고 말해요. 젤이 왜 쓰이는지 근거를 짧게 전해요.", "for a while", "이 젤은 수건이 늘 닿지는 못하는 세균까지 없애 줘요.", "이 젤은 비누가 늘 닿지는 못하는 냄새까지 없애 줘요.", "germs", "stains", "dust", "smells"]
