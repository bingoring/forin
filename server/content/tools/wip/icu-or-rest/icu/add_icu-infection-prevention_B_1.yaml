- title: "CLABSI 번들 유지"
  s:
  - ["라인 설명", "pill", "'lets us give'로 라인이 무엇을 가능하게 하는지부터 말하면 낯선 장치가 덜 무섭게 들려요. 중심정맥관은 약을 큰 정맥으로 보내요.", "from the pharmacy", "이 중심라인으로 팔 정맥에 안전하게 약을 줄 수 있어요.", "이 중심라인으로 큰 정맥에 안전하게 산소를 줄 수 있어요.", "vein", "artery", "muscle", "organ"]
  - ["이유 설명", "shield", "'to prevent infection'으로 드레싱 관리의 목적을 밝혀요. 드레싱이 젖거나 더러우면 균이 라인 주위로 들어갈 수 있어요.", "to stay comfortable", "통증을 줄이기 위해 드레싱을 깨끗하고 건조하게 유지해요.", "냄새를 막기 위해 드레싱을 깨끗하고 건조하게 유지해요.", "dry", "bright", "quiet", "soft"]
  - ["매일 평가", "calendar", "'as soon as'로 필요 없어지는 순간 바로 뺀다고 약속해요. 라인은 오래 둘수록 감염 위험이 커져요.", "during the day", "한 시간마다 확인하고, 더 이상 필요 없으면 바로 제거해요.", "세 시간마다 확인하고, 더 이상 필요 없으면 바로 제거해요.", "every day", "every hour", "every minute", "every time"]
  - ["확인 주기", "magnify", "'every shift'로 확인 간격을 구체적으로 말하면 가족이 안심해요. 'for signs of'는 무엇을 찾는지 알려 줘요.", "for any leaks", "한 시간마다 감염 징후가 있는지 드레싱을 확인할게요.", "매 근무마다 통증 정도가 어떤지 드레싱을 확인할게요.", "shift", "meal", "nap", "snack"]
  - ["무균 안내", "bandage", "'a sterile technique'은 멸균 상태를 지키는 방법을 가리켜요. 라인 드레싱 교체는 멸균 상태에서 해요.", "at the bedside", "침대 시트를 교체할 때는 무균 기법을 사용해요.", "환자복을 교체할 때는 무균 기법을 사용해요.", "sterile", "gentle", "simple", "basic"]
