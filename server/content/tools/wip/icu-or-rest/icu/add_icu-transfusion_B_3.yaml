situations:
- title: "TACO와 TRALI 감별"
  s:
  - ["산소 저하 보고", "bell", "수혈 중 산소포화도가 떨어지면 TACO나 TRALI 같은 호흡 관련 반응을 먼저 의심해요. 'into the unit'은 수혈을 시작하고 얼마나 지났는지를 나타내요.", "a day", "제제를 시작한 지 한 시간 만에 혈압이 떨어지고 있어요.", "제제를 끝낸 지 한 시간 만에 산소포화도가 떨어지고 있어요.", "desaturating", "hydrating", "sedating", "stretching"]
  - ["TACO 특징", "lab", "TACO는 수혈 속도나 양 때문에 순환이 넘치는 상태라 혈압이 오르고 폐에 물이 차요.", "with hypotension", "TRALI는 고혈압을 동반한 용적과부하를 가리켜요.", "TACO는 고혈압을 동반한 폐 손상을 가리켜요.", "volume", "protein", "calcium", "glucose"]
  - ["TRALI 특징", "lab", "TRALI는 심장이 아니라 폐 모세혈관이 다쳐서 생겨 충만압은 정상이에요.", "with raised", "TACO는 정상 충만압을 보이는 비심인성이에요.", "TRALI는 정상 체온을 보이는 비심인성이에요.", "non-cardiogenic", "hypovolemic", "septic", "anaphylactic"]
  - ["TACO 단서", "stetho", "폐의 수포음과 경정맥 팽창은 체액 과부하 소견이라 TACO 쪽을 가리켜요.", "toward sepsis", "수포음과 경정맥 팽창은 TRALI 쪽을 가리켜요.", "수포음과 복부 팽창은 TACO 쪽을 가리켜요.", "jugular", "radial", "carotid", "femoral"]
  - ["중단·산소 지지", "siren", "TACO든 TRALI든 수혈을 멈추고 산소화를 지지하는 것이 공통 첫 대응이에요.", "to protect his lungs", "어느 쪽이든 수혈을 멈추고 산소 장비를 챙길게요.", "어느 쪽이든 수혈을 멈추고 흡인 장비를 옮길게요.", "oxygenation", "hydration", "sedation", "nutrition"]
  - ["체위·산소", "gear", "상체를 세우면 폐 울혈이 덜해져 숨쉬기 쉬워지고, 추가 산소로 저산소를 막아요.", "extra tubing", "환자를 똑바로 앉히고 산소 마스크를 찾을게요.", "환자를 똑바로 앉히고 산소통을 가져올게요.", "oxygen", "blankets", "pillows", "lotion"]
  - ["영상 요청", "lab", "흉부 X선에서 폐부종 양상과 심장 크기를 보면 TACO와 TRALI를 가르는 데 도움이 돼요. 단독으로 확진하지는 못해요.", "calm him down", "가슴 엑스레이를 요청해서 둘을 설명하는 데 도움을 받을게요.", "복부 엑스레이를 요청해서 둘을 구별하는 데 도움을 받을게요.", "chest", "knee", "wrist", "ankle"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "호흡곤란 수혈 반응 대응 4문장 순서"
    why: "산소 저하를 보고하고 단서를 짚은 뒤, 어느 쪽이든 수혈을 멈추며 산소를 지지하고, 구별을 위해 영상을 요청해요."
    lines:
    - ["She's desaturating an hour into the unit.", "bell", "제제를 시작한 지 한 시간 만에 산소포화도가 떨어지고 있어요", "보고"]
    - ["Crackles and a raised jugular vein point us toward TACO.", "stetho", "수포음과 경정맥 팽창은 TACO 쪽을 가리켜요", "단서"]
    - ["Whichever it is, I'm stopping the transfusion and supporting oxygenation.", "siren", "어느 쪽이든 수혈을 멈추고 산소화를 지지할게요", "중단"]
    - ["I'll ask for a chest X-ray to help us tell them apart.", "lab", "가슴 엑스레이를 요청해서 둘을 구별하는 데 도움을 받을게요", "영상"]
- title: "대량수혈 비율 관리"
  s:
  - ["프로토콜 가동", "siren", "대량 출혈일 때 정해진 비율로 혈액제제를 빠르게 주는 절차예요. 'We're running'은 이미 진행 중임을 알려요.", "the discharge", "대량수혈 프로토콜을 검토하고 있어요.", "대량수혈 프로토콜을 연습하고 있어요.", "massive", "pediatric", "outpatient", "neonatal"]
  - ["1:1:1 비율", "lab", "대량수혈에서는 혈장·혈소판·적혈구를 비슷한 비율로 줘서 희석성 응고장애를 막아요.", ", and saline", "혈장과 혈소판, 적혈구를 일대일대일 순서로 드리고 있어요.", "혈장과 혈소판, 적혈구를 일대일대일 간격으로 드리고 있어요.", "ratio", "sequence", "pattern", "schedule"]
  - ["비율 유지", "gear", "제제 수가 늘어도 비율을 흔들지 않아야 해요. 'no matter how many'는 상황이 바뀌어도 변하지 않는다는 뜻이에요.", "we put away", "제제를 몇 개 더 올려도 속도는 일정하게 유지하세요.", "제제를 몇 개 더 올려도 온도는 일정하게 유지하세요.", "steady", "uneven", "random", "rushed"]
  - ["추적·가온", "gear", "대량수혈은 저체온이 응고를 더 망가뜨려서 제제를 데우고, 각 제제를 추적해야 기록이 맞아요.", "and weigh", "제제마다 추적하고 성분을 섞을게요.", "제제마다 추적하고 성분을 나눌게요.", "warm", "shake", "stir", "dilute"]
  - ["다음 운반함", "bell", "다음 제제가 오는 중임을 알리면 팀이 끊김 없이 다음 단계를 준비해요. 'on the way'는 이미 출발했다는 뜻이에요.", "from the pharmacy", "다음 냉장 운반함이 약국에서 오는 중이에요.", "다음 냉장 운반함이 혈액은행으로 가는 중이에요.", "cooler", "stretcher", "pump", "scanner"]
  - ["성분 호명", "speech", "올라가는 성분을 소리 내어 부르면 팀원이 무엇이 들어가는지 함께 듣고 기록이 빠지지 않아요.", "as it cools", "성분을 올릴 때마다 조용히 알릴게요.", "성분을 내릴 때마다 큰 소리로 알릴게요.", "product", "patient", "pill", "pump"]
  - ["번호 기록", "pencil", "제제 번호를 모두 차트에 남겨야 나중에 어느 제제가 들어갔는지 추적할 수 있어요. 'Someone'은 역할 배정이 필요하다는 신호예요.", "for the visitors", "누군가 차트에 넣을 모든 제제 색깔을 기록해야 해요.", "누군가 차트에 넣을 모든 침상 번호를 기록해야 해요.", "number", "color", "size", "shape"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "대량수혈 진행 4문장 순서"
    why: "프로토콜 가동을 알리고 비율을 말한 뒤, 그 비율을 지키려고 추적하고 데우며, 모든 제제 번호를 기록해요."
    lines:
    - ["We're running the massive transfusion protocol.", "siren", "대량수혈 프로토콜을 진행하고 있어요", "가동"]
    - ["I'm giving plasma, platelets, and red cells at a one-to-one-to-one ratio.", "lab", "혈장과 혈소판, 적혈구를 일대일대일 비율로 드리고 있어요", "비율"]
    - ["To keep that ratio steady, I'll track each unit and warm the products.", "gear", "그 비율을 지키려고 제제마다 추적하고 성분을 데울게요", "유지"]
    - ["For all of that, someone needs to log every unit number for the chart.", "pencil", "그 모든 것을 위해 누군가 차트에 넣을 모든 제제 번호를 기록해야 해요", "기록"]
- title: "응고검사 해석·성분 선택"
  s:
  - ["검사 결과", "lab", "INR 상승은 응고인자 부족을, 낮은 섬유소원은 피브린을 만들 재료가 부족함을 뜻해요.", "and sodium", "INR은 올랐고 칼륨은 낮아요.", "체온은 올랐고 섬유소원은 낮아요.", "fibrinogen", "hemoglobin", "platelets", "potassium"]
  - ["성분 선택", "lab", "INR이 높으면 응고인자를 보충하는 혈장이나 PCC를 써요.", "platelets or iron", "상승한 INR은 적혈구나 PCC를 필요로 해요.", "상승한 INR은 혈장이나 철분을 필요로 해요.", "elevated", "normal", "falling", "stable"]
  - ["동결침전제 선택", "lab", "섬유소원이 낮을 때는 섬유소원이 풍부한 동결침전제를 줘요.", "red cells", "섬유소원이 낮으면 적혈구를 줘야 해요.", "혈소판이 낮으면 동결침전제를 줘야 해요.", "cryoprecipitate", "immunoglobulin", "albumin", "glucose"]
  - ["우선순위 질문", "speech", "'which products'로 선택지를 열어 두고 'first'로 순서를 물으면 처방자가 우선순위를 정해 줄 수 있어요.", "should we bill him", "어떤 성분을 먼저 반납해야 할까요?", "어떤 환자에게 먼저 드려야 할까요?", "first", "never", "twice", "daily"]
  - ["교정 후 재검", "lab", "교정한 뒤 응고검사를 다시 봐야 치료가 효과 있었는지 알 수 있어요. 'coags'는 응고검사를 줄여 부르는 말이에요.", "for the audit", "교정 후에 혈당검사를 재확인할게요.", "교정 후에 칼륨검사를 재확인할게요.", "coags", "A1C", "cultures", "urine"]
  - ["재채혈", "lab", "교정 효과를 보려면 시간을 두고 다시 채혈해요. 'in about an hour'는 대략적인 시점을 말해요.", "a spare tube", "한 시간쯤 뒤에 검사패널을 다시 인쇄할게요.", "한 시간쯤 뒤에 소변패널을 다시 채취할게요.", "repeat", "random", "partial", "private"]
  - ["재보고", "bell", "교정 후에도 수치가 그대로면 처방을 바꿔야 하니 의료진에게 다시 알려요. 'back'은 이미 알렸던 사람에게 다시 연락한다는 뜻이에요.", "the pharmacy back", "수치가 호전되지 않으면 영양팀에 다시 연락할게요.", "수치가 호전되지 않으면 검사실에 다시 연락할게요.", "improve", "expire", "arrive", "leave"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "응고검사 해석과 후속 4문장 순서"
    why: "결과를 말하고 그에 맞는 성분을 정한 뒤, 교정 후 재검하고, 그래도 좋아지지 않으면 의료진에게 다시 알려요."
    lines:
    - ["His INR is up and fibrinogen is low.", "lab", "INR은 올랐고 섬유소원은 낮아요", "결과"]
    - ["So the plan is plasma or PCC for the INR and cryoprecipitate for the fibrinogen.", "lab", "그러니 INR에는 혈장이나 PCC, 섬유소원에는 동결침전제를 쓰는 계획이에요", "계획"]
    - ["After correction, I'll recheck coags.", "lab", "교정 후에 응고검사를 재확인할게요", "재검"]
    - ["If those numbers don't improve, I'll call the provider back.", "bell", "그 수치가 호전되지 않으면 의료진에게 다시 연락할게요", "재보고"]
- title: "저칼슘·시트르산 독성 감시"
  s:
  - ["저칼슘 위험", "bell", "혈액 보존제인 시트르산염이 칼슘과 결합해서, 제제를 많이 줄수록 칼슘이 떨어질 수 있어요.", "his appetite", "이렇게 많은 제제를 준 뒤라 나트륨이 빠르게 떨어질 수 있어요.", "이렇게 많은 제제를 준 뒤라 혈당이 빠르게 떨어질 수 있어요.", "calcium", "sodium", "chloride", "phosphate"]
  - ["이온화 칼슘", "lab", "시트르산염이 칼슘에 붙으면 활성 칼슘(이온화 칼슘)이 줄 수 있어서 총칼슘이 아니라 이온화 칼슘을 봐요.", "so I'll warm", "시트르산염이 칼슘과 결합해서 이온화 칼슘을 설명할게요.", "시트르산염이 칼륨과 결합해서 이온화 칼슘을 감시할게요.", "binds", "boosts", "raises", "feeds"]
  - ["확인 주기", "lab", "제제를 몇 개 줄 때마다 이온화 칼슘을 보면 떨어지기 전에 알아챌 수 있어요(병원 프로토콜에 따라 달라요).", "for every few", "제제를 몇 개 줄 때마다 총단백을 확인하고 있어요.", "수액을 몇 개 줄 때마다 이온화 칼슘을 확인하고 있어요.", "units", "shifts", "visits", "meals"]
  - ["증상 감시", "stetho", "입 주위 저림은 저칼슘의 초기 증상이고, QT 연장은 심전도에서 보이는 위험 신호예요.", "and a shortened QT", "입 주위 가려움과 연장된 QT를 지켜보세요.", "발 주위 저림과 연장된 QT를 지켜보세요.", "tingling", "swelling", "redness", "itching"]
  - ["보충 준비", "pill", "칼슘은 프로토콜에 따라 보충해요. 미리 준비해 두면 수치가 떨어질 때 바로 줄 수 있어요.", "per his request", "가족 요청에 따라 칼슘을 보충할 준비를 해둘게요.", "프로토콜에 따라 칼슘 표지를 붙일 준비를 해둘게요.", "replace", "remove", "dilute", "count"]
  - ["환자 안내", "speech", "저칼슘 증상은 환자가 먼저 느끼는 경우가 많아요. 입술과 손가락을 짚어 말하면 어디를 느껴야 하는지 알려 줘요.", "or ears", "입술이나 손가락이 가렵기 시작하면 말해 주세요.", "입술이나 무릎이 저리기 시작하면 말해 주세요.", "lips", "eyes", "ears", "hair"]
  - ["즉시 보충", "siren", "칼슘이 이미 떨어졌다면 더 떨어지기 전에 바로 주어 부정맥을 막아요(처방·프로토콜에 따라). 'any further'는 이미 떨어졌음을 전제해요.", "before it clots", "더 떨어지기 전에 지금 칼슘 팩을 챙길게요.", "더 떨어지기 전에 지금 칼슘 처방을 살필게요.", "give", "hold", "count", "weigh"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "저칼슘 감시와 보충 4문장 순서"
    why: "칼슘이 떨어질 수 있다고 알리고 이온화 칼슘을 확인하며, 보충을 준비한 뒤 바로 줘요."
    lines:
    - ["After all these units, his calcium could drop fast.", "bell", "이렇게 많은 제제를 준 뒤라 칼슘이 빠르게 떨어질 수 있어요", "위험"]
    - ["That's because citrate binds calcium, so I'm checking his ionized calcium after every few units.", "lab", "시트르산염이 칼슘과 결합하기 때문이라 제제를 몇 개 줄 때마다 이온화 칼슘을 확인하고 있어요", "감시"]
    - ["With that monitoring, I'll have calcium ready to replace per protocol.", "pill", "그 감시와 함께 프로토콜에 따라 칼슘을 보충할 준비를 해둘게요", "준비"]
    - ["With it ready, I'll give calcium now before it drops any further.", "siren", "준비해 뒀으니 더 떨어지기 전에 지금 칼슘을 줄게요", "투여"]
- title: "항응고 역전 관리"
  s:
  - ["역전 필요", "bell", "와파린 복용 중 출혈은 항응고 효과를 되돌려야 하는 상황이에요. 'so'가 출혈과 역전의 인과를 이어요.", "to feed him", "와파린 복용 중 두통이 있어서 역전이 필요해요.", "아스피린 복용 중 출혈이 있어서 역전이 필요해요.", "warfarin", "insulin", "digoxin", "lisinopril"]
