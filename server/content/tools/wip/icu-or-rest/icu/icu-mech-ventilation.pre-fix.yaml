    - w-confirm
    - w-mode
    - w-tidalvolume
    - w-fio2
    - w-peep
    goal: 1
    tag: 설정 점검
    icon: gear
    why: Let's는 상대에게 시키지 않고 같이 하자는 모양이고, together가 한 사람이 혼자 보지 않는다는 점을 분명히 해요. 네 가지 설정을 둘이 맞춰 보면 한 사람의 착오가 기록으로 넘어가지 않아요.
