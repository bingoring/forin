      carbon dioxide is building up and his blood is a little more acidic: 결과의 뜻을 쉬운 말로 풀었어요. 이어지는 '의사에게 전화한다'와도 자연스러워요.
      hypercapnic with respiratory acidosis: 진단명에 가까운 말이라 가족에게는 어렵고 무겁게 들려요.
    why: PaCO2가 오르고 pH가 내려간 것은 이산화탄소가 쌓여 피가 더 산성이 됐다는 뜻이에요. 가족에게는 결과의 의미를 이렇게 풀어 전해요.
