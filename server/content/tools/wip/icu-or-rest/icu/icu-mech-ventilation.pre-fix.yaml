situations:
- title: 인공호흡기 설정 확인·기록
  sentences:
  - en: Let's confirm the mode, tidal volume, FiO2, and PEEP together.
    ko: 모드, 일회호흡량, FiO2, PEEP를 같이 확인해요.
    chunks:
    - Let's confirm
    - the mode, tidal volume, FiO2,
    - and PEEP
    - together
    - .
