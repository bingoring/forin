    - w-escalate
    - w-prone
    - w-consult
    - w-team
    - w-gather
    - w-gas
    - w-ratio
    pairs:
    - - escalate
      - to proning
    - - consult
      - the ECMO team
    - - gather
      - the latest gases and P/F ratio
    decoys:
    - the visitor list
    why: 산소가 계속 오르지 않을 때는 조치 단계를 높이고(escalate), 전문팀에 자문을 구하고(consult), 그에 필요한 최신 결과를 모아 둬요(gather).
  - kind: swap
    words:
    - w-prone
    - w-oxygenation
    who: 가족에게 · 복와위 설명
    icon: me
    before:
    - 'We''re '
    - proning him
    - ' to help his oxygen.'
    options:
    - proning him
    - gently turning him onto his stomach
    - positioning him prone per protocol
    answer: gently turning him onto his stomach
    notes:
      proning him: 의료진끼리 쓰는 짧은 말이에요. 가족에게는 낯설어요.
      gently turning him onto his stomach: 무엇을 하는지 쉬운 말로 알려 줘요. 이어지는 '산소를 돕기 위해'와도 자연스러워요.
      positioning him prone per protocol: 사무적이고 어려운 말이라 가족이 놀랄 수 있어요.
    why: 복와위는 엎드린 자세로 돌려 눕혀 폐 뒤쪽이 열리게 하는 방법이에요. 가족에게는 무엇을 하는지 쉬운 말로 알려요.
    ko: 산소가 좋아지도록 조심스럽게 엎드린 자세로 돌려 눕힐 거예요
  order:
    tag: 대화 흐름
    icon: compass
    ko: 구조요법 전환 설명 4문장 순서
    why: 반응이 없다고 알리고, So로 복와위를 제안하고, That으로 복와위의 원리를 설명하고, 그것으로도 부족하면 ECMO팀에 연락한다고 순서를 이어요. So, That, If that isn't enough가 앞 줄을 가리켜서 순서가 하나예요.
    lines:
    - en: His oxygenation isn't responding despite maximal ventilator support.
      icon: monitor
      ko: 최대 인공호흡기 지원에도 산소화가 반응하지 않아요
      note: 상태
    - en: So we should escalate to proning.
      icon: speech
      ko: 그래서 복와위로 단계를 높여야 해요
      note: 제안
    - en: That can improve his oxygenation by opening up the back of his lungs.
      icon: bulb
      ko: 그건 폐 뒤쪽을 열어줘서 산소화를 좋아지게 할 수 있어요
      note: 원리
    - en: If that isn't enough, the next step is calling the ECMO team.
      icon: compass
      ko: 그래도 부족하면 다음 단계는 ECMO팀에 전화하는 거예요
      note: 다음
