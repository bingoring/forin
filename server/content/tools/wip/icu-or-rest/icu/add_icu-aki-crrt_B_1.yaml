- title: 항응고 기초 감시
  s:
  - ["약 설명", pill, "'keep … from clotting'은 약을 쓰는 목적을 먼저 막는 일로 말해 줘요. 'small amount'는 위험을 줄이려 최소한만 쓴다는 뜻이에요.", "of antibiotic", "필터가 굳지 않게 소량의 진통제를 써요.", "필터가 새지 않게 소량의 항응고제를 써요.", "clotting", "leaking", "freezing", "cracking"]
  - ["출혈 감시", magnify, "'any signs of'는 확실한 출혈만이 아니라 작은 징후까지 본다는 뜻이에요. 'while it runs'는 치료 내내라는 범위를 알려요.", "of infection", "돌아가는 동안 출혈 징후가 있는지 조용히 지켜봐요.", "돌아가는 동안 응고 징후가 있는지 자세히 지켜봐요.", "bleeding", "fever", "rash", "cough"]
  - ["균형 설명", compass, "'balance A with B'는 두 목표가 서로 당긴다는 점을 인정해 솔직하게 들려요. 항응고는 응고와 출혈 두 위험을 함께 저울질해요.", "against his comfort", "응고를 막는 것과 그를 편안하게 지키는 것 사이에서 균형을 맞춰요.", "감염을 막는 것과 그를 안전하게 지키는 것 사이에서 균형을 맞춰요.", "safe", "warm", "busy", "quiet"]
  - ["약 범위", shield, "'only inside … not through'는 범위를 안과 밖으로 대비해 말해요. 가족이 가장 걱정하는 온몸 영향이 아니라는 점을 먼저 짚어요.", "all over", "이 약은 회로 안에서만 작용하고, 팔 전체를 돌지는 않아요.", "이 약은 폐 안에서만 작용하고, 몸 전체를 돌지는 않아요.", "inside", "outside", "behind", "above"]
  - ["출혈 확인", magnify, "'gums, urine, stool'을 하나씩 짚으면 어디를 보는지 가족이 따라 할 수 있어요. 'any blood'는 소량도 놓치지 않겠다는 뜻이에요.", "his hair", "잇몸, 소변, 구토물에 피가 섞였는지 확인해요.", "잇몸, 침, 대변에 피가 섞였는지 확인해요.", "gums", "hair", "nails", "knees"]
  - ["이상 보고", speech, "'more … than usual'은 정상 범위를 기준으로 삼아 무엇이 이상인지 정해 줘요. 'right away'는 기다리지 않고 바로 알린다는 약속이에요.", "the nurse manager", "평소보다 부기가 더 보이면 바로 의사에게 알려요.", "어제보다 출혈이 더 보이면 바로 의사에게 알려요.", "see", "hear", "smell", "taste"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 항응고 감시 설명 4문장 순서
    why: 약을 쓰는 이유를 말하고, 작용 범위로 걱정을 덜어 준 뒤, 그래도 확인하는 곳을 말하고, 이상이 보이면 알린다고 해요.
    lines:
    - ["We use a small amount of blood thinner to keep the filter from clotting.", pill, "필터가 굳지 않게 소량의 항응고제를 써요", "목적"]
    - ["That medicine works only inside the circuit, not through his whole body.", shield, "그 약은 회로 안에서만 작용하고 몸 전체를 돌지는 않아요", "범위"]
    - ["Even so, I check his gums, his urine, and his stool for any blood.", magnify, "그래도 잇몸, 소변, 대변에 피가 섞였는지 확인해요", "확인"]
    - ["If I see more bleeding than usual in any of those, I tell the doctor right away.", speech, "그중 어디서든 평소보다 출혈이 더 보이면 바로 의사에게 알려요", "보고"]
- title: CRRT 처방 파라미터 이해
  s:
  - ["설정 검토", gear, "'Let's'는 지시가 아니라 함께 보자는 제안이라 동료에게 부담이 적어요. 'blood flow rate and dialysate settings'는 먼저 볼 항목을 묶어 말해요.", "the visiting rules", "혈류 속도와 투석액 온도를 검토해봅시다.", "호흡 속도와 투석액 설정값을 검토해봅시다.", "rate", "color", "label", "brand"]
  - ["목표 확인", chartup, "'is set'은 처방으로 정해 둔 값이라는 뜻을 수동태로 짧게 말해요. 'per hour'는 목표의 단위를 알려 줘요.", "per bag", "시간당 순 제거 목표량이 가족에게 설명돼 있어요.", "시간당 순 제거 알람이 설정돼 있어요.", "goal", "alarm", "bag", "valve"]
  - ["처방 확인", check, "'confirm … matches'는 확인할 대상과 기준을 한 문장에 담아요. 'current'는 가장 최근 오더와 비교한다는 뜻이에요.", "the old chart", "차트가 현재 오더와 일치하는지 확인할게요.", "처방이 현재 간호 계획과 일치하는지 확인할게요.", "matches", "replaces", "exceeds", "outlasts"]
  - ["값 보고", chartup, "'is running at'은 지금 돌고 있는 실제 값을 말하는 표현이에요. 수치 뒤에 단위를 붙여야 같은 숫자를 서로 다르게 알아듣지 않아요.", "at the bedside", "혈압은 150이고, 투석액은 시간당 2리터로 돌고 있어요.", "혈류는 150이고, 투석액은 시간당 2리터로 준비돼 있어요.", "running", "expiring", "freezing", "cooling"]
  - ["제거량 보고", chartup, "'for now'는 지금 값이 바뀔 수 있다는 단서예요. 'Net'은 빼낸 양에서 넣은 양을 뺀 값이에요.", "since lunch", "지금은 소변 배출량이 시간당 100밀리리터예요.", "어제는 순 제거량이 시간당 100밀리리터였어요.", "now", "tonight", "soon", "later"]
  - ["호출 약속", pager, "'if'로 조건을 걸어 필요할 때만 부른다는 기준이 돼요. 'page'는 전화보다 급하게 호출한다는 뜻의 병원 표현이에요.", "the pharmacy", "알람이 울리면 팀을 호출할게요.", "오더를 바꿔야 하면 팀을 호출할게요.", "page", "thank", "greet", "teach"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: CRRT 처방 확인 4문장 순서
    why: 볼 항목을 먼저 정하고, 현재 값을 읽은 뒤, 처방과 맞는지 확인하고, 바꿀 일이 생기면 호출하겠다고 해요.
    lines:
    - ["First, let's review the blood flow rate and dialysate settings.", gear, "먼저 혈류 속도와 투석액 설정값을 검토해봅시다", "검토"]
    - ["Those are 150 for blood flow and 2 liters an hour for dialysate.", chartup, "혈류는 150, 투석액은 시간당 2리터예요", "값"]
    - ["I'll confirm that matches the current orders.", check, "그게 현재 오더와 일치하는지 확인할게요", "확인"]
    - ["If any of it needs to change, I'll page the team.", pager, "그중 바꿔야 할 게 있으면 팀을 호출할게요", "호출"]
