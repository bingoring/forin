- title: 수분·전해질 균형 기록
  s:
  - ["체중 설명", chartup, "'show us if'는 결과가 정해지지 않았다는 틀이라 확인의 이유가 자연스러워요. 'holding on to'는 체액이 몸에 남는 상태를 쉬운 말로 바꿔요.", "his blood pressure", "매일 체중을 재면 그녀가 여분의 약을 붙들고 있는지 알 수 있어요.", "매일 체온을 재면 그녀가 여분의 체액을 붙들고 있는지 알 수 있어요.", "weights", "heights", "visits", "meals"]
  - ["I/O 설명", pencil, "'in and out'은 들어오는 것과 나가는 것을 한 번에 가리켜 I/O의 뜻을 쉽게 풀어요. 'balance'는 균형을 맞춘다는 목표를 알려요.", "her breathing", "들어오고 나가는 모든 것을 재서 약물 균형을 맞춰요.", "들어오고 나가는 모든 것을 재서 체액 기록을 맞춰요.", "balance", "weigh", "change", "count"]
  - ["보호 목적", shield, "'protect'는 하는 일의 목적을 가족이 바로 이해하게 해요. 신장과 심장을 함께 말하면 체액이 두 곳에 부담을 준다는 점이 전해져요.", "her lungs", "이렇게 하면 그녀의 신장과 폐를 보호할 수 있어요.", "이렇게 하면 그녀의 피부와 심장을 보호할 수 있어요.", "protect", "check", "scan", "rest"]
  - ["기록 범위", pencil, "'every'를 세 번 되풀이하면 빠뜨리는 것 없이 전부 적는다는 느낌이 돼요. 'IV bag'은 눈에 안 보이는 입력도 센다는 뜻이에요.", "each hour", "마신 것, 정맥주사 백, 배출량까지 전부 정리해요.", "먹은 것, 정맥주사 백, 배출량까지 전부 기록해요.", "write down", "look up", "throw out", "hand over"]
  - ["양 누적", chartup, "'add up'은 작은 양이 모여 큰 양이 된다는 뜻의 숙어예요. 'a full day'는 합산 기간을 하루로 고정해요.", "in a week", "적은 양도 하루 종일 쌓이면 달라져요.", "적은 양도 일주일 쌓이면 커져요.", "amounts", "colors", "sizes", "names"]
  - ["체중 가치", chartup, "'more than … alone'은 한 가지 자료만으로는 부족하다는 비교 틀이에요. 체중은 몸에 남은 체액을 숫자로 보여 줘요.", "the monitor", "체중 변화는 차트 기록만으로는 알 수 없는 것을 알려줘요.", "소변 변화는 차트 숫자만으로는 알 수 없는 것을 알려줘요.", "alone", "twice", "daily", "early"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 수분 기록 설명 4문장 순서
    why: 무엇을 재는지 알리고, 그 기록의 목적을 말한 뒤, 체중이 더하는 정보를 설명하고, 마지막으로 보호하는 장기를 말해요.
    lines:
    - ["We write down every drink, every IV bag, and every output.", pencil, "마신 것, 정맥주사 백, 배출량까지 전부 적어요", "기록"]
    - ["Even small amounts add up over a full day.", chartup, "적은 양도 하루 종일 쌓이면 커져요", "누적"]
    - ["Daily weights show us if she's holding on to extra fluid after all of that.", monitor, "그러고 나서 매일 체중이 여분의 체액이 남았는지 알려줘요", "체중"]
    - ["That keeps her kidneys and her heart protected.", shield, "그렇게 하면 그녀의 신장과 심장이 보호돼요", "보호"]
- title: 신독성 약물 검토
  s:
  - ["약물 설명", pill, "'like'로 예를 들면 약 이름을 모르는 가족도 어떤 약인지 떠올려요. 'can'은 모든 경우가 아니라 가능성이라는 정확한 표현이에요.", "like some vitamins", "특정 항생제 같은 일부 약물은 신장에 부담을 줄 수 있어요.", "특정 진통제 같은 일부 약물은 간에 부담을 줄 수 있어요.", "pain relievers", "vitamins", "sleep aids", "cough drops"]
  - ["용량 조정", pill, "'adjusting'은 약을 끊는 게 아니라 양을 맞춘다는 뜻이에요. 'for his kidney function'이 조정의 기준을 알려요.", "for his weight", "목록을 검토하고 신장 기능에 맞춰 시간을 조정하고 있어요.", "처방을 검토하고 신장 기능에 맞춰 용량을 조정하고 있어요.", "doses", "labels", "orders", "bags"]
  - ["위험 회피", shield, "'make … worse'는 이미 있는 손상이 악화된다는 뜻이에요. 'we'll avoid'는 팀이 앞서서 막는다는 계획을 알려요.", "that help his heart", "손상을 더 나쁘게 만들 수 있는 음식은 피할 거예요.", "손상을 더 나쁘게 만들 수 있는 약은 줄일 거예요.", "worse", "faster", "longer", "deeper"]
  - ["가정 약물", home, "'at home'은 병원 밖에서 먹는 약도 중요하다는 점을 알려요. 'over time'은 한 번이 아니라 오래 쌓인 영향이라는 뜻이에요.", "in the hospital", "집에서 먹는 이부프로펜도 쌓이면 시간이 지나며 간을 해칠 수 있어요.", "집에서 먹는 비타민도 쌓이면 시간이 지나며 신장을 해칠 수 있어요.", "kidneys", "bones", "teeth", "nerves"]
  - ["투약 전 확인", check, "'before we give it'으로 시점을 못 박아 투약 전에 확인한다는 약속이 돼요. 'against'는 약 이름과 수치를 맞대어 본다는 뜻이에요.", "after he sleeps", "약을 주기 전에 모든 약물을 체중 수치와 대조해서 확인해요.", "약을 주기 전에 모든 약물을 알레르기 목록과 대조해서 확인해요.", "against", "beside", "under", "beyond"]
  - ["대안 설명", handshake2, "'If … isn't safe'는 위험이 있을 때만 바꾼다는 조건을 달아 불안을 줄여요. 'something else'는 구체적인 약 이름 없이도 대안이 있다는 뜻이에요.", "the nurse", "지금 그 약이 안전하지 않으면 약사가 다른 것을 선택할 거예요.", "지금 그 약이 충분하지 않으면 의사가 다른 것을 선택할 거예요.", "doctor", "pharmacist", "manager", "chaplain"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신독성 약물 검토 4문장 순서
    why: 신장에 부담이 되는 약이 있다고 알리고, 목록과 용량을 검토하고, 약을 주기 전 확인을 약속한 뒤, 안전하지 않을 때의 대안을 말해요.
    lines:
    - ["Some medications can stress the kidneys.", pill, "일부 약물은 신장에 부담을 줄 수 있어요", "위험"]
    - ["So we're reviewing his list and adjusting doses for them.", pencil, "그래서 그 약들 목록을 검토하고 용량을 조정하고 있어요", "검토"]
    - ["We check each one against his kidney numbers before we give it.", check, "하나하나 주기 전에 신장 수치와 대조해서 확인해요", "확인"]
    - ["If one isn't safe right now, the doctor will choose another.", handshake2, "하나라도 지금 안전하지 않으면 의사가 다른 걸 선택할 거예요", "대안"]
- title: CRRT 개념·목적 이해
  s:
  - ["개념 정의", gear, "'a way to'로 정의하면 낯선 약어가 쉬운 설명에 바로 이어져요. 'slow, continuous'는 일반 투석과의 차이를 미리 알려요.", "a quick, brief", "CRRT는 심장이 하던 일을 천천히, 지속적으로 대신하는 방식이에요.", "CRRT는 간이 하던 일을 천천히, 지속적으로 대신하는 방식이에요.", "continuous", "occasional", "painful", "costly"]
  - ["장점 설명", shield, "'gentler … than'은 비교로 장점을 전하면서 일반 투석을 나쁘게 말하지 않아요. 'on the blood pressure'는 어디에 부드러운지를 정해요.", "than a transfusion", "일반 투석보다 호흡에 훨씬 부드러워요.", "일반 투석보다 체온에 훨씬 부드러워요.", "gentler", "harder", "faster", "cheaper"]
  - ["기능 설명", gear, "'around the clock'은 24시간 쉬지 않는다는 관용구예요. 'while he heals'는 평생이 아니라 회복까지의 기간이라는 틀을 줘요.", "every other day", "회복하는 동안 하루 종일 여분의 체액과 지방을 제거해줘요.", "회복하는 동안 하루 종일 여분의 혈액과 노폐물을 제거해줘요.", "waste", "heat", "gas", "oil"]
  - ["오해 풀기", shield, "'isn't the same as'는 흔한 오해를 부드럽게 바로잡는 틀이에요. 'for life'는 기간으로 두 치료를 가르는 말이에요.", "that patients fear", "며칠 하는 투석과는 같지 않아요.", "평생 하는 수술과는 같지 않아요.", "life", "comfort", "surgery", "safety"]
  - ["희망 전달", star, "'right now'는 지금 상태가 영구적이지 않다는 뜻을 담아요. 'many patients'는 모두가 아니라 많은 사람이라는 정직한 희망이에요.", "most doctors", "지금은 신장이 상했지만 많은 환자들이 퇴원해요.", "지금은 심장이 상했지만 많은 환자들이 회복해요.", "recover", "relapse", "transfer", "decline"]
  - ["정직한 설명", handshake2, "'can't promise'로 확답을 피하고 'but'으로 지금 할 수 있는 일을 붙여요. 거짓 안심 없이 희망의 근거를 줘요.", "will go away", "심장이 꼭 돌아온다고 약속할 수는 없지만, 이건 시간을 벌어줘요.", "신장이 꼭 돌아온다고 약속할 수는 없지만, 이건 비용을 줄여줘요.", "time", "oxygen", "room", "water"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: CRRT 설명 4문장 순서
    why: 정의로 시작해 하는 일을 말하고, 그 속도가 혈압에 주는 이점을 설명한 뒤, 정직하게 한계를 말하며 마무리해요.
    lines:
    - ["CRRT is a slow, continuous way to do the kidneys' job.", gear, "CRRT는 신장이 하던 일을 천천히, 지속적으로 대신하는 방식이에요", "정의"]
    - ["It removes extra fluid and waste around the clock while he heals.", gear, "회복하는 동안 하루 종일 여분의 체액과 노폐물을 제거해줘요", "기능"]
    - ["Taking it off at that pace is gentler on the blood pressure than regular dialysis.", shield, "그 속도로 빼내면 일반 투석보다 혈압에 부드러워요", "장점"]
    - ["We can't promise his kidneys will come back, but all of that gives them time.", handshake2, "신장이 돌아온다고 약속할 수는 없지만 그 모두가 시간을 벌어줘요", "한계"]
- title: CRRT 회로·접근 관찰
  s:
  - ["장비 소개", gear, "'to and from'은 오가는 두 방향을 한 번에 말해 순환 구조를 쉽게 그려 줘요. 'large'는 굵은 관이라는 뜻이라 가족이 크기에 놀라지 않아요.", "his medicine", "이 큰 카테터가 약물을 기계로 나르고 다시 데려와요.", "이 큰 카테터가 혈액을 침대로 나르고 다시 데려와요.", "carries", "stores", "labels", "cools"]
  - ["원리 설명", gear, "'run through'는 흐르게 통과시킨다는 동사라 필터를 지나는 장면이 그려져요. 'that cleans it'은 필터의 역할을 관계절로 붙여요.", "through a bag", "라인들이 혈액을 필터로 흘려보내서 따뜻하게 만들어요.", "라인들이 약물을 필터로 흘려보내서 깨끗하게 만들어요.", "filter", "pump", "bag", "valve"]
  - ["감시 약속", magnify, "'to keep … working'은 지켜보는 이유를 목적절로 붙여 가족을 안심시켜요. 'closely'는 흘끗 보는 게 아니라 꼼꼼히 본다는 뜻이에요.", "for his visitors", "알람이 안전하게 작동하도록 이걸 자세히 지켜봐요.", "회로가 오래 작동하도록 이걸 자세히 지켜봐요.", "closely", "quietly", "gently", "slowly"]
  - ["구조 설명", compass, "'one … and one'으로 나누면 나가는 관과 돌아오는 관이 구분돼요. 'taking out'과 'bringing back'이 방향을 짝지어 줘요.", "in the bag", "한 라인은 혈액을 빼내고 다른 라인은 약물을 데려와요.", "한 라인은 산소를 빼내고 다른 라인은 다시 데려와요.", "out", "up", "over", "down"]
  - ["부위 관리", bandage, "'clean, dry'처럼 형용사를 나열하면 확인할 항목이 또렷해져요. 'free of'는 붉은기가 없는 것이 정상이라는 기준을 말해요.", "wrapped, tight", "카테터 부위는 깨끗하고 건조하며 악취 없이 유지돼야 해요.", "카테터 부위는 깨끗하고 따뜻하며 발적 없이 유지돼야 해요.", "dry", "wet", "warm", "sticky"]
  - ["즉시 대응", run, "'comes loose or kinks'처럼 or로 묶으면 두 가지 상황이 모두 기준이 돼요. 'right away'는 미루지 않고 그 자리에서 한다는 약속이에요.", "for the filter", "라인이 헐거워지거나 꼬이면 바로 확인해요.", "라인이 헐거워지거나 젖으면 바로 고쳐요.", "kinks", "melts", "freezes", "expires"]
