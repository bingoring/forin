- title: 소변량·크레아티닌 추세 사정
  s:
  - ["모니터링", monitor, "'every hour'를 끝에 붙여 확인 간격이 분명해져요. 'to watch'는 추적하는 목적을 한 문장에 붙여 가족이 이유까지 이해해요.", "his blood sugar", "매시간 소변량을 추적해서 심장 상태를 지켜봐요.", "매시간 체중을 추적해서 신장 상태를 지켜봐요.", "kidneys", "lungs", "liver", "bones"]
  - ["수치 해석", chartup, "'tells us'는 숫자가 신호를 전해 준다는 틀이라 해석이 쉬워요. 'under stress'는 망가졌다고 단정하지 않는 완곡한 표현이에요.", "the lungs", "크레아티닌이 오르는 것은 간이 부담을 받고 있다는 신호예요.", "혈당이 오르는 것은 신장이 부담을 받고 있다는 신호예요.", "creatinine", "sodium", "glucose", "albumin"]
  - ["단계 판단", compass, "'help us'는 추세가 팀을 돕는 도구라는 틀이라 단정 없이 설명해요. 'stage'는 손상 정도를 단계로 나눠 말하는 임상 표현이에요.", "his heart rate", "이 추세를 보고 심장 손상 단계를 매기고 일찍 대응할 수 있어요.", "이 추세를 보고 신장 손상 원인을 찾고 일찍 대응할 수 있어요.", "injury", "stone", "cyst", "donor"]
  - ["안심 설명", shield, "'but'으로 걱정스러운 사실 뒤에 균형을 붙여요. 'doesn't always'는 가능성을 닫지 않으면서 단정을 피해요.", "his blood pressure", "체중이 줄었지만 그게 늘 신장이 망가졌다는 뜻은 아니에요.", "소변량이 줄었지만 그게 늘 심장이 약해졌다는 뜻은 아니에요.", "dropped", "doubled", "risen", "steadied"]
  - ["추세 강조", chartup, "'not just'는 한 번의 수치에 매이지 않는다는 대비를 만들어요. 'over several hours'가 추세라는 말에 구체적인 기간을 줘요.", "a single test", "숫자 하나가 아니라 며칠에 걸친 추세를 봐요.", "숫자 하나가 아니라 몇 시간에 걸친 증상을 봐요.", "trend", "alarm", "drip", "shift"]
  - ["보고 약속", speech, "'as soon as'는 정해 둔 시각이 아니라 변화가 생긴 순간이 보고 시점이라는 약속이에요. 'to the team'으로 받는 사람을 분명히 말해요.", "to his family", "새 결과가 나오는 대로 추세를 팀에 보고할게요.", "변화가 보이는 대로 투약 기록을 팀에 보고할게요.", "report", "explain", "describe", "present"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 소변량·크레아티닌 추세 설명 4문장 순서
    why: 무엇을 재는지 먼저 말하고, 그 수치가 뜻하는 바를 풀어 준 뒤, 단계를 매기는 쓰임을 알리고, 이후의 보고를 약속해요.
    lines:
