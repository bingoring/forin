    - ["If both keep going the wrong way, the kidneys are under stress.", chartup, "둘 다 나쁜 쪽으로 가면 신장이 부담을 받는 거예요", "해석"]
    - ["With that picture, the team can stage the injury.", compass, "그 그림으로 팀이 손상 단계를 매길 수 있어요", "단계"]
