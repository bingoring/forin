"알람 피로 관리·맞춤화":
  - kind: slider
    words: [w-silence, w-mute]
    cue: "Nurse: \"I paused it for a minute while I fixed the lead, and it comes back on by itself.\""
    scale: [silence, mute, turn off]
    answerAt: 0
    why: "silence는 정해진 시간 동안만 소리를 멈추고 대개 다시 울려요(기기마다 다름). mute나 turn off는 알림 자체를 끊으니 원인을 해결하지 않은 채 쓰면 안 돼요."
    example: "I silenced it while I fixed the lead."
    exKo: "전극을 고치는 동안만 소리를 멈췄어요."
  - kind: swap
    words: [w-limit, w-mute, w-alarm]
    who: "동료에게 · 알람 한계 조정"
    icon: monitor
    before: ["Can we ", "turn off", " this alarm? It keeps going off for nothing."]
    options: [adjust the limits on, turn off, ignore]
    answer: adjust the limits on
    notes: {adjust the limits on: "환자 기저치에 맞게 한계를 조정하는 올바른 방법이에요. 병원 규정과 처방 범위 안에서 해요.", turn off: "알람을 끄면 정말 중요한 변화도 놓쳐요.", ignore: "알람 피로로 이어지는 가장 위험한 대응이에요."}
    why: "성가신 알람은 끄는 게 아니라 환자에게 맞게 한계를 조정해서 해결해요."
    ko: "이 알람의 한계를 조정할 수 있을까요? 아무 이유 없이 계속 울려요"
"억제대 사용 모니터·문서":
  - kind: slider
    words: [w-schedule, w-release]
    cue: "Nurse: \"Policy says we release him and check at set times, not whenever we remember.\""
    scale: [as needed, on a schedule, nonstop]
    answerAt: 1
    why: "억제대는 정해진 간격으로 풀어 주고 순환과 피부를 확인해요(간격은 병원 정책과 처방에 따라). 필요할 때만 하기로 하면 놓치기 쉬워요."
    example: "We release the restraints on a schedule."
    exKo: "일정에 따라 억제대를 풀어 줘요."
  - kind: context
    words: [w-reposition]
    word: reposition
    ko: 자세를 바꾸다
    scenes:
      - {who: 동료에게, icon: monitor, en: "Help me reposition him so I can check his skin.", ok: true}
      - {who: 차트 기록, icon: board, en: "Pt repositioned and skin checked; no redness noted.", ok: true}
      - {who: 환자에게, icon: me, en: "I will reposition your extremities to relieve pressure over the bony prominences.", ok: false, fix: "I'm going to turn you onto your side so your skin gets a break from the pressure."}
    why: "환자에게는 무엇을 하는지 쉬운 말로 설명해요. extremities나 bony prominences는 환자가 알아듣기 어려워요."
"라인 오연결 예방":
  - kind: slider
    words: [w-alike, w-connector]
    cue: "Nurse: \"You can only tell these two connectors apart by a tiny colored band.\""
    scale: [somewhat similar, nearly identical, identical]
    answerAt: 1
    why: "생김새가 비슷한 연결부일수록 꽂기 전에 라벨과 색, 경로를 따라가 확인해요. 작은 차이만 있다면 nearly identical이고, 이럴수록 오연결이 쉽게 생겨요."
    example: "These two connectors look nearly alike."
    exKo: "이 두 연결부는 거의 똑같이 생겼어요."
  - kind: context
    words: [w-connect]
    word: connect
    ko: 연결하다
    scenes:
      - {who: 동료에게, icon: monitor, en: "Trace the line to its source before you connect anything.", ok: true}
      - {who: 차트 기록, icon: board, en: "Tubing traced to the IV port before connecting; label checked.", ok: true}
      - {who: 환자에게, icon: me, en: "I'm connecting the proximal Luer-lock hub to your extension set now.", ok: false, fix: "I'm hooking your IV up to the bag now, so you may feel a little tug."}
    why: "환자에게는 지금 무엇을 하는지 쉬운 말로 설명해요. hub나 extension set 같은 부품 이름은 환자에게 의미가 없어요."
"고농도 전해질·마약 관리":
  - kind: slider
    words: [w-concentrated, w-potassium]
    cue: "Nurse: \"This vial is far stronger than what we hang — it must never sit at a bedside.\""
    scale: [diluted, premixed, concentrated]
    answerAt: 2
    why: "고농도 칼륨 같은 약은 희석 없이 주입하면 치명적일 수 있어서 병동 재고와 침상 옆에 두지 않고, 약국에서 희석된 것만 쓰는 병원이 많아요. concentrated는 용액이 진하다는 뜻이에요."
    example: "Concentrated potassium stays in the pharmacy."
    exKo: "고농도 칼륨은 약국에 둬요."
  - kind: context
    words: [w-locked]
    word: locked
    ko: 잠긴
    scenes:
      - {who: 동료에게, icon: monitor, en: "Keep the narcotics locked unless you're taking out a dose.", ok: true}
      - {who: 차트 기록, icon: board, en: "Narcotics locked; two-nurse count completed and matched.", ok: true}
      - {who: 보호자에게, icon: me, en: "The narcotics are locked in an automated dispensing cabinet with biometric access control.", ok: false, fix: "The strong pain medicine is kept locked up, and two nurses count it every time."}
    why: "가족에게는 왜 잠가 두는지 쉬운 말로 설명해요. biometric access control 같은 시스템 용어는 안심시키기보다 어렵게만 들려요."
"섬망 환자 안전 환경":
  - kind: slider
    words: [w-oriented]
    cue: "Chart: \"Knows his name and that he is in the hospital, but not the date.\""
    scale: [person only, person and place, person, place and time]
    answerAt: 1
    why: "지남력은 사람·장소·시간(그리고 상황)을 아는지로 평가해요. 이름과 장소는 알지만 날짜를 모르면 person and place예요."
    example: "He is oriented to person and place."
    exKo: "사람과 장소는 알아봐요."
  - kind: context
    words: [w-reorient]
    word: reorient
    ko: 지남력을 되찾게 돕다
    scenes:
      - {who: 동료에게, icon: monitor, en: "Reorient him each time he wakes up, and keep the room quiet.", ok: true}
      - {who: 차트 기록, icon: board, en: "Reoriented to place and date; calmer afterward.", ok: true}
      - {who: 환자에게, icon: me, en: "I'm going to reorient you to person, place, and time now.", ok: false, fix: "You're in the hospital, it's morning, and I'm your nurse. You're safe here."}
    why: "환자에게는 시험하듯 말하지 않고, 지금 있는 곳과 시간을 자연스럽게 알려 줘요."
"투약 오류 예방 시스템":
  - kind: slider
    words: [w-hard, w-soft, w-limit]
    cue: "Nurse: \"The pump will not let me go past this number, no matter what I press.\""
    scale: [no limit, soft limit, hard limit]
    answerAt: 2
    why: "hard limit는 넘길 수 없는 상한이에요. soft limit는 경고 뒤 확인하고 진행할 수 있고(병원 설정마다 다름), 한계 없이 쓰는 모드는 안전망이 없어요."
    example: "That is a hard limit, so we can't override it."
    exKo: "그건 하드 리밋이라 넘길 수 없어요."
  - kind: swap
    words: [w-flag, w-verify, w-order]
    who: "동료에게 · 펌프 경고"
    icon: monitor
    before: ["The pump flagged this dose, so I'm going to ", "click past it", "."]
    options: [verify the order first, click past it, wait for it to stop beeping]
    answer: verify the order first
    notes: {verify the order first: "경고가 뜬 용량은 처방과 대조해 확인한 뒤에 진행해요.", click past it: "경고를 확인 없이 넘기면 시스템이 잡은 오류를 놓쳐요.", wait for it to stop beeping: "소리가 멈춘다고 문제가 해결되지는 않아요."}
    why: "펌프 경고는 오류를 잡으려는 안전망이에요. 넘기기 전에 처방과 용량부터 확인하세요."
    ko: "펌프가 이 용량을 표시했으니 먼저 처방을 확인할게요"
"이중확인·독립확인 프로토콜":
  - kind: slider
    words: [w-independent, w-check]
    cue: "Nurse: \"Each of us checks the pump alone, and then we compare.\""
    scale: [a quick look, checking together, independent check]
    answerAt: 2
    why: "독립확인은 두 사람이 각자 따로 확인한 뒤 서로 맞춰 보는 거예요. 한 사람이 읽어 주고 따라 확인하면 서로에게 영향을 줘서 독립이 아니에요."
    example: "This needs an independent check."
    exKo: "이건 독립확인이 필요해요."
  - kind: context
    words: [w-independent]
    word: independent
    ko: 독립적인
    scenes:
      - {who: 동료에게, icon: monitor, en: "I need an independent check on this heparin drip.", ok: true}
      - {who: 차트 기록, icon: board, en: "Independent double-check completed with a second RN; rate and dose verified.", ok: true}
      - {who: 환자에게, icon: me, en: "A second nurse will do an independent verification of your heparin rate against the order set.", ok: false, fix: "A second nurse will check your medicine on her own too, as an extra safety step."}
    why: "환자에게는 왜 한 번 더 확인하는지 쉬운 말로 설명해요. verification이나 order set 같은 용어는 환자에게는 어려워요."
