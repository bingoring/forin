- situation: "영양 요구·경로 사정"
  items:
    - kind: slider
      words: [w-safe, w-yet]
      cue: "Family member: \"Can't I just give him a few sips of water?\" (His swallow hasn't been checked yet.)"
      scale: [not safe yet, quite risky, very dangerous]
      answerAt: 0
      why: "삼킴이 아직 확인되지 않았다면 물을 입으로 먹이는 건 지금은 안전하지 않다는 뜻이에요. 영원히 안 된다는 말이 아니라 '아직'이라서, 확인 뒤 의료진 지시에 따라 입으로 먹기를 시작해요. 그동안은 입술과 입안을 적셔 드려요."
      example: "It isn't safe yet, but I can moisten his lips for you."
      exKo: "아직은 안전하지 않지만, 입술은 적셔 드릴 수 있어요."
    - kind: context
      words: [w-nutrition]
      word: nutrition
      ko: 영양
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "He's NPO, so he's getting nutrition through the tube as ordered.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you check his nutrition rate before you chart it?", ok: true}
        - {who: 환자 가족에게, icon: me, en: "His enteral nutrition is delivered via nasogastric tube at the goal rate to meet his caloric requirements.", ok: false, fix: "He's getting his nutrition through a small tube, so his body still gets what it needs."}
      why: "의료진끼리는 NPO, tube, rate처럼 짧은 임상어로 말해도 통해요. 가족에게 enteral, nasogastric, caloric requirements 같은 말은 어렵고 차갑게 들려요. 관으로 영양이 들어가고 있다고 쉬운 말로 전해요."
- situation: "장관영양 시작·내성 관찰"
  items:
    - kind: slider
      words: [w-uncomfortable]
      cue: "Patient: \"My belly feels a little full, but it doesn't hurt.\""
      scale: [mildly uncomfortable, quite uncomfortable, extremely uncomfortable]
      answerAt: 0
      why: "아프지 않고 조금 그득한 정도라면 mildly uncomfortable이에요. 그래도 급식 중 배가 불편하다는 말은 놓치지 말고 팽만 여부를 같이 보고, 심해지면 병원 프로토콜과 지시에 따라 의료진에게 알려요."
      example: "He says he's a little uncomfortable, so I'm watching his belly."
      exKo: "조금 불편하다고 하셔서 배를 지켜보고 있어요."
    - kind: context
      words: [w-residual]
      word: residual
      ko: 위잔여량
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Her last residual was low, so I'm continuing the feeds as ordered.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you check the residual with me before the next feed?", ok: true}
        - {who: 환자에게, icon: me, en: "We'll assess your gastric residual volume per the enteral feeding protocol.", ok: false, fix: "I'll check how much of your feeding is still in your stomach."}
      why: "의료진끼리는 residual 한 단어로 위에 남은 급식량을 말해요. 환자에게 gastric residual volume, enteral protocol 같은 말은 낯설어요. 위에 아직 남아 있는 양을 확인한다고 쉬운 말로 알려 줘요."
- situation: "영양관 위치 확인"
  items:
    - kind: slider
      words: [w-sting]
      cue: "Patient: \"It stung as it went in, but it passed quickly.\""
      scale: [a slight sting, a sharp sting, unbearable pain]
      answerAt: 1
      why: "삽입할 때 따끔했다가 곧 지나갔다면 쓰라린 정도(sting)예요. 견디기 힘든 통증이 아니라 순간적인 따끔함이라서, 삼키면 더 수월하다고 설명하며 천천히 넣어요. 참기 힘들어하면 멈추고 알려요."
      example: "You may feel a quick sting as the tube goes in."
      exKo: "관이 들어갈 때 잠깐 따끔할 수 있어요."
    - kind: context
      words: [w-xray]
      word: x-ray
      ko: 엑스레이
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'm sending him for an x-ray to confirm the tube tip before we feed.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you call radiology to read his x-ray before we start the feed?", ok: true}
        - {who: 환자에게, icon: me, en: "We'll obtain an x-ray to confirm the distal tip position of your enteric tube.", ok: false, fix: "We'll take a picture of your chest to make sure the tube is in the right place."}
      why: "의료진끼리는 x-ray, tube tip처럼 짧게 말해도 통해요. 환자에게 distal tip position, enteric tube 같은 말은 어렵게 들려요. 관이 제자리에 있는지 사진으로 확인한다고 쉬운 말로 알려 줘요."
- situation: "흡인 예방 체위"
  items:
    - kind: pair
      words: [w-raise, w-lay, w-slide]
      pairs: [["raise", "the head of the bed"], ["lay", "you flat"], ["slide", "down the bed"]]
      decoys: ["a good cough"]
      why: "raise the head of the bed는 침대 머리 쪽을 올리는 말이에요. 급식 중에는 흡인을 막으려고 머리를 높여 두는 것이 일반적이고, 각도는 병원 프로토콜을 따라요. lay you flat은 눕히다, slide down the bed는 침대 아래쪽으로 미끄러진다는 뜻이에요."
    - kind: context
      words: [w-airway]
      word: airway
      ko: 기도
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His head is up during feeds to protect his airway.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you suction his airway if he coughs during the feed?", ok: true}
        - {who: 환자에게, icon: me, en: "Head-of-bed elevation mitigates the risk of reflux compromising your airway.", ok: false, fix: "Sitting up keeps your food from coming back up into your throat and lungs."}
      why: "의료진끼리는 airway 한 단어로 기도 보호를 말해요. 환자에게 elevation, mitigates, reflux compromising 같은 말은 딱딱하고 어려워요. 앉아 있으면 음식이 목과 폐로 올라오지 않는다고 쉬운 말로 설명해요."
- situation: "배변·복부 팽만 관찰"
  items:
    - kind: slider
      words: [w-painful, w-tight, w-hard]
      cue: "Patient: \"My belly is hard as a rock and it really hurts now.\""
      scale: [a bit tight, very tight, painful]
      answerAt: 2
      why: "단단하고 아프다고 하면 단순히 팽팽한 정도(tight)가 아니라 통증(painful)이에요. 통증이 있거나 배가 더 단단해지면 급식은 지시와 프로토콜에 따라 보류하고 의료진에게 바로 알려요."
      example: "Her belly is hard and painful, so I'm calling the physician."
      exKo: "배가 단단하고 아프다고 하셔서 의사에게 연락할게요."
    - kind: context
      words: [w-belly]
      word: belly
      ko: 배
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Her belly is soft but mildly distended, and bowel sounds are present.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you listen to his belly before I start the next feed?", ok: true}
        - {who: 환자에게, icon: me, en: "Your belly is distended and tympanic with hypoactive bowel sounds.", ok: false, fix: "Your belly feels a little swollen, and I'm listening to see how your gut is working."}
      why: "의료진끼리는 distended, bowel sounds처럼 소견을 짧고 정확하게 말해요. 환자에게 tympanic, hypoactive 같은 말은 겁을 줘요. 배가 조금 부풀었고 장이 어떤지 듣고 있다고 쉬운 말로 알려 줘요."
