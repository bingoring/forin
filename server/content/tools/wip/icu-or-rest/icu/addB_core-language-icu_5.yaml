- title: 통역 통한 목표설정 대화
  s:
  - ["통역 약속", mic, "will convey는 통역사가 바꾸지 않고 건넨다는 뜻이에요. carefully가 중요한 내용이라 조심스럽게 옮긴다는 약속이에요.", "from the start", "통역사가 모든 것을 또렷하게 전달할 거예요.", "통역사가 모든 것을 기록해 줄 거예요.", "carefully", "quickly", "loosely", "roughly"]
  - ["가치 질문", bulb, "what matters most to him은 의학 정보가 아니라 환자의 삶에서 중요한 것을 묻는 틀이에요. 목표설정 대화의 출발점이에요.", "about the plan", "그분에게 가장 두려운 것에 대해 이야기해봐요.", "그분이 가장 좋아하는 것에 대해 이야기해봐요.", "matters", "scares", "hurts", "changes"]
  - ["여유 주기", calendar, "Please take your time은 대답을 재촉하지 않는 부탁이에요. there's no rush가 같은 뜻을 한 번 더 말해 압박을 줄여요.", "with this", "앉으세요, 서두를 필요 없어요.", "좀 쉬세요, 서두를 필요 없어요.", "your", "my", "our", "his"]
  - ["가족 가치 이해", faceWorried, "I want to understand는 판단이 아니라 이해하려는 의도를 먼저 밝혀요. what's important to your family가 질문의 범위를 가족 전체로 넓혀요.", "today", "당신 가족에게 무엇이 필요한지 이해하고 싶어요.", "당신 가족에게 무엇이 걱정인지 이해하고 싶어요.", "understand", "judge", "decide", "change"]
  - ["정답 없음", check, "no right or wrong answers는 가족이 틀릴까 봐 말을 아끼지 않게 해요. 목표설정 대화는 의견을 묻는 자리라는 걸 알려요.", "about this", "여기서는 맞고 틀린 질문이 없어요.", "여기서는 크고 작은 답이 없어요.", "answers", "rules", "doors", "chairs"]
  - ["통역사 신뢰", mic, "is trained for는 통역사가 이런 대화를 위해 준비된 사람이라는 근거예요. 어려운 대화를 통역에 맡겨도 된다는 신뢰를 줘요.", "in two languages", "통역사는 이런 대화를 위해 선택됐어요.", "통역사는 이런 대화를 위해 대기하고 있어요.", "trained", "paid", "chosen", "late"]
  - ["단계 안내", compass, "one step at a time은 한꺼번에 결정하지 않고 쪼개서 간다는 관용구예요. 무거운 대화의 부담을 줄여 줘요.", "together", "한 사람씩 함께 나아갈게요.", "한 주씩 함께 나아갈게요.", "step", "day", "word", "question"]
