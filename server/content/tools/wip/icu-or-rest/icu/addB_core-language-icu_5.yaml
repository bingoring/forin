- title: 청각·시각 장애 병행 소통
  s:
  - ["보조기 활용", board, "We can use로 가능한 도구를 나열하면 지금 쓸 수 있는 방법이 한눈에 보여요. 청각과 시각 보조를 함께 말해서 두 장애를 다 고려한다는 걸 보여 줘요.", "and a pen", "안경과 큰 글씨 소통판을 함께 쓸 수 있어요.", "보청기와 그림 소통판을 함께 쓸 수 있어요.", "hearing", "walking", "dental", "feeding"]
  - ["말하는 위치", speech, "face him은 마주 봐서 입 모양과 표정을 볼 수 있게 한다는 뜻이에요. on his better side는 더 잘 들리는 쪽에서 말해 소리가 닿게 해요.", "at eye level", "잘 들리는 쪽에서 그를 보고 크게 말할게요.", "잘 보이는 쪽에서 그를 보고 또렷하게 말할게요.", "clearly", "softly", "quickly", "rudely"]
  - ["촉각 신호", handshake2, "Touch and simple signals는 소리와 글자를 못 쓰는 환자를 위한 대체 신호예요. feel oriented는 지금 어디서 무슨 일인지 안다는 뜻이에요.", "every hour", "손길과 간단한 신호가 그가 편안함을 느끼도록 도와줘요.", "빛과 간단한 신호가 그가 상황을 인지하도록 도와줘요.", "oriented", "tired", "hungry", "dizzy"]
  - ["입술 읽기 질문", magnify, "Does he read lips처럼 환자 대신 가족에게 능력을 물으면 어떤 방법이 통할지 빨리 알 수 있어요. at all은 조금이라도 되는지 묻는 부드러운 표현이에요.", "in his chart", "그가 점자를 읽을 수 있나요?", "그가 손짓을 읽을 수 있나요?", "lips", "braille", "maps", "menus"]
  - ["큰 글씨", pencil, "so he can see는 큰 글씨로 쓰는 목적을 말해요. 시력이 약해도 읽을 수 있게 하려는 배려예요.", "with a marker", "그가 볼 수 있게 큰 글씨로 그릴게요.", "그가 만질 수 있게 큰 글씨로 적을게요.", "letters", "numbers", "pictures", "colors"]
  - ["손길 신호", handshake2, "will let him know I'm here는 만지는 이유를 알려 줘요. gentle이 있어야 갑자기 닿는 놀람을 줄여요.", "each time", "어깨를 부드럽게 만지면 제가 여기 있다는 걸 알 거예요.", "손을 부드럽게 만지면 제가 여기 있다는 걸 알 거예요.", "arm", "foot", "face", "hair"]
  - ["예측 가능성", shield, "simple and predictable은 환경이 갑자기 바뀌지 않게 한다는 약속이에요. 소리와 빛으로 알 수 없는 환자에게 안정감을 줘요.", "for tonight", "그를 위해 조용하고 예측 가능하게 유지할게요.", "그를 위해 간단하고 빠르게 유지할게요.", "predictable", "noisy", "crowded", "busy"]
