situations:
- title: PEEP·recruitment 반응 평가
  s:
  - [수기 효과, chartup, '''after the recruitment maneuver''로 변화의 기준 시점을 밝혀 수기와 개선을 연결해요. compliance는 폐가 얼마나 잘 부푸는지를 뜻해요.', in the unit, 폐포 동원 수기 후에 식욕이 좋아졌어요., 가슴 물리치료 후에 순응도가 좋아졌어요., compliance, appetite, mood, energy]
  - [결과 해석, magnify, '''suggests''는 단정하지 않고 추정이라는 뜻이라 근거가 하나일 때 쓰기 알맞아요. ''at the same PEEP''은 조건을 맞췄다는 뜻이에요.', on the monitor, 같은 PEEP에서 산소화가 더 좋아진 건 약이 들었다는 뜻이에요., 같은 PEEP에서 산소화가 더 좋아진 건 모니터가 바뀌었다는 뜻이에요., lung, vein, door, valve]
  - [과팽창 감시, shield, '''so we don''t harm''은 지켜보는 이유를 밝혀요. 폐포를 여는 수기는 건강한 쪽 폐를 과하게 부풀릴 수 있어요.', in the bed, 좋은 쪽 폐를 다치지 않게 감염을 지켜볼게요., 좋은 쪽 폐를 다치지 않게 출혈을 지켜볼게요., lung, liver, heart, brain]
  - [조건 고정, lock, '''the same''은 설정을 그대로 두어야 전후 수치를 공평하게 비교할 수 있다는 뜻이에요.', for an hour, PEEP는 그대로 두고 소리를 비교해 볼게요., PEEP는 그대로 두고 사진을 비교해 볼게요., PEEP, FiO2, rate, volume]
  - [중단 기준, siren, '''If…, we stop''은 기준이 되는 조건과 행동을 짝으로 말해요. ''right away''는 망설이지 않고 멈춘다는 뜻이에요.', for the doctor, 열이 급등하면 바로 수기를 멈춰요., 맥박이 급등하면 바로 수기를 멈춰요., spike, settle, ease, fade]
  order:
    tag: 대화 흐름
    icon: compass
    ko: PEEP 반응 평가 4문장 순서
    why: 수기 후 변화를 먼저 알리고, 그 의미를 해석한 뒤, 조건을 고정해 확인하고, 그동안 과팽창을 지켜봐요.
    lines:
    - [His compliance improved after the recruitment maneuver., chartup, 폐포 동원 수기 후에 순응도가 좋아졌어요, 변화]
    - ['He''s also oxygenating better at the same PEEP, which suggests the lung opened up.', magnify, 같은 PEEP에서 산소화도 더 좋아서 폐가 열렸다는 뜻이에요, 해석]
    - ['To be sure of that, we keep the PEEP the same and compare his numbers.', lock, 그걸 확인하려고 PEEP는 그대로 두고 수치를 비교해요, 확인]
    - ['While we compare, I''ll watch for overdistension so we don''t harm the good lung.', shield, 비교하는 동안 좋은 쪽 폐를 다치지 않게 과팽창을 지켜볼게요, 감시]
- title: 복와위 응답자 여부 판단
  s:
  - [응답 판단, check, '''so''가 이유와 결론을 이어 줘요. 산소화가 크게 좋아졌다는 근거가 앞에 있어서 ''responder''라는 판단이 따라와요.', on the ward, 소변량이 상당히 좋아져서 복와위 응답자예요., 식욕이 상당히 좋아져서 복와위 응답자예요., responder, volunteer, visitor, donor]
  - [계획 판단, calendar, '''as planned''는 계획을 바꾸지 않아도 된다는 뜻이에요. ''supports''는 결정이 아니라 근거가 된다는 말이에요.', for the week, 그러면 계획대로 영양 공급을 계속하는 게 맞겠어요., 그러면 계획대로 면회를 계속하는 게 맞겠어요., sessions, visits, meals, meetings]
  - [보고 약속, speech, '''so the team can set…''으로 보고하는 목적을 밝혀요. 반응을 알려야 팀이 다음 일정을 정할 수 있어요.', to the manager, 가족이 일정을 정할 수 있게 반응을 보고할게요., 팀이 식단을 정할 수 있게 반응을 보고할게요., schedule, menu, budget, route]
  - [상태 설명, monitor, '''through the whole session''은 한 시점이 아니라 처음부터 끝까지라는 뜻이라 안정이 이어졌음을 알려 줘요.', since the turn, 하루 내내 수치가 계속 좋았어요., 회차 내내 기분이 계속 좋았어요., session, day, night, week]
  - [다음 계획, calendar, '''another''는 이미 한 번 했고 한 번 더 한다는 뜻이에요. ''for tonight''로 시점을 알려요.', at the unit, 오늘 밤에 복와위 회차를 한 번 더 설명할게요., 오늘 밤에 검사를 한 번 더 계획할게요., prone, training, visiting, music]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 복와위 응답자 판단 4문장 순서
    why: 회차 내내 좋았다는 사실로 시작해 응답자라고 판단하고, 그 반응을 보고해 팀이 일정을 정한 뒤 다음 회차를 계획해요.
    lines:
    - [His numbers stayed strong through the whole session., monitor, 회차 내내 수치가 계속 좋았어요, 사실]
    - ['That means his oxygenation improved substantially, so he''s a proning responder.', check, 산소화가 상당히 좋아졌다는 뜻이라 복와위 응답자예요, 판단]
    - [I'll report that response so the team can set the schedule., speech, 팀이 일정을 정할 수 있게 그 반응을 보고할게요, 보고]
    - ['Once they do, let''s plan another prone session for tonight.', calendar, 정해지면 오늘 밤에 복와위 회차를 한 번 더 계획해요, 계획]
- title: 복와위 중 혈역학 변화 관리
  s:
  - [변화 설명, chartup, '''can drop''의 can은 늘 그렇다는 뜻이 아니라 그럴 수 있다는 뜻이에요. ''temporarily''로 일시적임을 알려 안심시켜요.', in the room, 체위 변화로 체온이 일시적으로 떨어질 수 있어요., 체위 변화로 혈당이 일시적으로 떨어질 수 있어요., pressure, pulse, count, volume]
  - [원인 확인, magnify, '''first''가 순서를 정해요. 라인이 꼬였거나 정맥 환류가 줄었는지는 약을 쓰기 전에 먼저 살피는 원인이에요.', at the pump, '먼저 라인이 꼬였는지, 소변량이 줄었는지 확인할게요.', '먼저 라인이 꼬였는지, 체온이 올랐는지 확인할게요.', kinking, leaking, clogging, staining]
  - [적정 계획, gear, '''per protocol''은 개인 판단이 아니라 병원 지침을 따른다는 뜻이에요. ''titrate''는 반응을 보며 조금씩 맞춘다는 뜻이에요.', for the night, 메모하면서 프로토콜대로 수액이나 승압제를 적정할게요., 설명하면서 프로토콜대로 수액이나 승압제를 적정할게요., fluids, oxygen, feeds, sedation]
  - [수액 처치, pill, '''small''은 한 번에 많이 주지 않고 조금씩 준다는 뜻이고 ''recheck''는 준 뒤의 반응을 본다는 뜻이에요.', with the monitor, 의사에게 조금 알리고 혈압을 다시 확인할게요., 침대를 조금 낮추고 혈압을 다시 확인할게요., pressure, pupils, glucose, lactate]
  - [회복 설명, shield, '''usually''는 대부분 그렇다는 뜻이라 보장은 하지 않으면서도 안심시켜요. ''bounces back''은 원래대로 돌아온다는 구어 표현이에요.', at the head, 다시 눕히면 보통 맥박이 회복돼요., 다시 눕히면 보통 호흡이 회복돼요., flat, upright, sideways, backwards]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 혈압 변화 관리 4문장 순서
    why: 혈압이 떨어질 수 있다고 먼저 알리고, 라인과 환류부터 확인한 뒤, 그래도 낮으면 지침대로 적정하고, 눕히면 회복된다고 전해요.
    lines:
    - [The position change can drop his blood pressure temporarily., chartup, 체위 변화로 혈압이 일시적으로 떨어질 수 있어요, 설명]
    - [So let's check for line kinking and reduced venous return first., magnify, '그러니 먼저 라인이 꼬였는지, 정맥 환류가 줄었는지 확인해요', 확인]
    - ['If it stays low after that, I''ll titrate fluids or pressors per protocol.', gear, 그 뒤에도 낮으면 프로토콜대로 수액이나 승압제를 적정할게요, 적정]
    - ['Once we turn him flat again, his pressure usually bounces back.', shield, 다시 눕히면 보통 혈압이 회복돼요, 회복]
- title: 안면 부종·안압 관리
  s:
  - [부종 설명, faceWorried, '''common''으로 흔한 일이라고 먼저 알리면 가족이 놀라지 않아요. 뒤에 ''it eases''를 붙여 나아진다는 점도 함께 전해요.', at night, '엎드려 있으면 다리 부종이 흔하고, 다시 눕히면 가라앉아요.', '엎드려 있으면 얼굴 부종이 흔하고, 약을 쓰면 가라앉아요.', face-down, standing, sitting, sleeping]
  - [눈 보호, shield, '''to prevent injury''로 목적을 밝혀요. 엎드린 환자는 눈이 닫히지 않거나 눌릴 수 있어서 촉촉함과 보호를 함께 챙겨요.', from the nurse, 입이 다치지 않게 촉촉하게 유지하고 보호해줘요., 피부가 다치지 않게 촉촉하게 유지하고 보호해줘요., eyes, lips, hands, feet]
  - [머리 위치, compass, '''also''는 앞서 말한 눈 보호에 더해 하나 더 한다는 뜻이에요. 머리 위치로 눈이 눌리는 것을 피해요.', on the left, 눈에 햇빛이 가지 않게 머리 위치도 신경 써줘요., 눈에 먼지가 가지 않게 머리 위치도 신경 써줘요., pressure, dust, light, water]
  - [가족 안심, faceWorried, '''looks scary, but''은 가족의 놀람을 먼저 인정하고 안심시키는 말투예요.', in the room, 부종이 무서워 보여도 곧 설명해 드릴게요., 부종이 무서워 보여도 곧 회진이 있을 거예요., scary, small, soft, dull]
  - [연고 약속, pill, '''to keep them moist''로 연고를 넣는 이유를 밝혀요. ''every few hours''는 정해진 간격으로 계속한다는 뜻이에요.', with a swab, 몇 시간마다 입술에 연고를 발라서 촉촉하게 유지할게요., 몇 시간마다 손에 로션을 발라서 촉촉하게 유지할게요., moist, fresh, cool, tidy]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 안면 부종 설명 4문장 순서
    why: 흔한 일이라고 먼저 알리고, 무서워 보여도 가라앉는다고 안심시킨 뒤, 눈을 보호하는 방법과 연고 계획을 말해요.
    lines:
    - [Facial swelling is common when he's face-down., faceWorried, 엎드려 있으면 얼굴 부종이 흔해요, 설명]
    - ['It looks scary, but it will go down soon.', faceWorried, 무서워 보여도 곧 가라앉을 거예요, 안심]
    - ['Even though it will go down soon, we position his head to avoid pressure on his eyes.', compass, 곧 가라앉더라도 눈에 압박이 가지 않게 머리 위치를 신경 써요, 위치]
    - ['In the same way, I''ll put ointment in his eyes every few hours to keep them moist.', pill, 같은 이유로 몇 시간마다 눈에 연고를 넣어 촉촉하게 유지할게요, 연고]
- title: 앙와위 복귀 시점 판단
  s:
  - [경과 요약, chartup, '''through the prone session''은 회차 전체를 한 번에 요약하는 표현이에요. ''maintained''는 떨어지지 않고 이어졌다는 뜻이에요.', since morning, 복와위 회차 내내 맥박이 잘 유지됐어요., 복와위 회차 내내 체온이 잘 유지됐어요., prone, second, short, night]
  - [조건 설명, check, '''If''로 조건을 먼저 걸고 ''can''으로 가능성을 말해요. 돌린 뒤 산소가 유지되는지가 앙와위로 둘 수 있는 기준이에요.', in the bed, 식사 뒤에도 산소가 유지되면 그대로 눕혀 둘 수 있어요., 면회 뒤에도 산소가 유지되면 그대로 눕혀 둘 수 있어요., oxygen, pressure, pulse, pain]
  - [전환 계획, compass, '''as a team''은 한 사람이 아니라 함께 돌린다는 뜻이고 ''afterward''는 돌린 뒤에도 계속 본다는 뜻이에요.', at the unit, 팀으로 돌리는 걸 연습하고 그 후 산소포화도를 자세히 지켜볼게요., 팀으로 돌리는 걸 소개하고 그 후 산소포화도를 자세히 지켜볼게요., sats, pain, hunger, thirst]
  - [상태 설명, monitor, '''for the last hour''는 최근 한 시간 동안이라는 뜻으로, 안정이 잠깐이 아니라 이어졌다는 근거예요.', for the shift, 지난 한 시간 동안 기분이 안정적이었어요., 지난 한 시간 동안 수면이 안정적이었어요., steady, clear, tidy, small]
  - [복귀 계획, calendar, '''If everything looks stable''은 모든 지표가 안정적일 때만 한다는 조건이에요. ''this afternoon''으로 시점을 밝혀요.', on the unit, 전부 안정적이면 오늘 오후에 면회를 허용할게요., 전부 안정적이면 오늘 오후에 다시 연락할게요., afternoon, morning, evening, night]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 앙와위 복귀 판단 4문장 순서
    why: 회차 동안 산소화가 좋았다는 사실로 시작해, 안정적이면 돌리기로 하고, 팀으로 계획해 돌린 뒤 산소가 유지되는지 봐요.
    lines:
    - [He's maintained good oxygenation through the prone session., chartup, 복와위 회차 내내 산소화가 잘 유지됐어요, 사실]
    - ['Given that, if everything looks stable, we''ll turn him back this afternoon.', calendar, 그러니 전부 안정적이면 오늘 오후에 다시 눕힐게요, 결정]
    - [Let's plan the turn as a team and watch his sats closely afterward., compass, 팀으로 돌리는 걸 계획하고 그 후 산소포화도를 자세히 지켜봐요, 계획]
    - ['If his oxygen holds after supination, we can keep him on his back.', check, 앙와위로 돌린 뒤에도 산소가 유지되면 그대로 눕혀 둘 수 있어요, 유지]
