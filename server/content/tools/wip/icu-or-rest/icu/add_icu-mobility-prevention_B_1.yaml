    - ["Her oxygenation meets the criteria and her lines are secure.", check, "산소화가 기준을 충족하고 라인도 고정돼 있어요", "확인"]
    - ["Given that, let's start with sitting at the edge of the bed.", run, "그렇다면 침대 끝에 걸터앉는 것부터 시작해요", "시작"]
