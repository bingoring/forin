- title: 욕창 위험 사정
  s:
  - ["점수 매기기", pencil, "'so we know'로 목적을 붙이면 왜 점수를 매기는지 환자나 동료도 바로 알아요. 브레이든 척도는 욕창 위험을 점수로 보는 도구예요.", "so we chart", "체중을 알기 위해 브레이든 점수를 매겨요.", "회복을 알기 위해 브레이든 점수를 매겨요.", "Braden", "Glasgow", "Richmond", "Apgar"]
  - ["고위험 판정", chartup, "'puts her at'은 점수가 위험 단계를 정했다는 말이에요. 숫자가 아니라 단계로 말하면 팀이 바로 알아들어요.", "puts her in", "모스 점수를 보면 고위험군이에요.", "글래스고 점수를 보면 고위험군이에요.", "high", "low", "mild", "minimal"]
  - ["요인 설명", bulb, "'biggest'로 요인의 순서를 매기면 어디에 먼저 손쓸지가 분명해져요. 이동 능력과 습기는 브레이든 하위 항목이에요.", "lowest", "낮은 의식과 습기가 가장 큰 요인이에요.", "낮은 이동 능력과 마찰이 가장 큰 요인이에요.", "moisture", "height", "hunger", "vision"]
  - ["예방 시작", shield, "'based on the score'는 시작 결정의 근거를 말해요. 점수에 따라 예방 강도를 정하는 것이 보통이에요.", "based on the chart", "점수를 바탕으로 감염 묶음 중재를 시작할게요.", "점수를 바탕으로 낙상 묶음 중재를 시작할게요.", "prevention", "treatment", "positioning", "sedation"]
  - ["오늘 시작", calendar, "'today'로 시점을 못 박으면 미루지 않겠다는 약속이 돼요. 'his'로 누구의 계획인지도 분명해요.", "his heart rate", "오늘 그녀의 예방 묶음 중재를 시작할게요.", "오늘 그의 호흡기 묶음 중재를 시작할게요.", "prevention", "hydration", "isolation", "nutrition"]
  - ["재사정", redo, "'every shift'는 근무마다 반복한다는 말이에요. 환자 상태가 바뀌면 위험 점수도 변해서 되풀이해 봐요.", "every week", "매 근무마다 통증 점수를 재사정할게요.", "매 근무마다 의식 점수를 재사정할게요.", "Braden", "Morse", "Ramsay", "Wells"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 욕창 위험 사정 4문장 순서
    why: 점수를 먼저 매기고, 단계를 말한 뒤, 가장 큰 요인을 짚고, 그 요인에 맞춰 예방 중재를 시작하는 순서예요.
    lines:
    - ["Let's score her Braden so we know her risk.", pencil, "위험을 알기 위해 브레이든 점수를 매겨요", "점수"]
    - ["That score puts her at high risk.", chartup, "그 점수면 고위험군이에요", "단계"]
