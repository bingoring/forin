- title: 피부·압박점 사정
  s:
  - ["피부 점검", magnify, "'every'로 하나도 빠뜨리지 않고 본다는 말이에요. 'early'는 눈에 띄기 전 작은 변화를 찾는다는 뜻이에요.", "every bony area", "모든 압박점을 살펴보기 전에 장갑부터 껴요.", "모든 압박점을 살펴보기 전에 조명부터 켜요.", "skin", "bone", "nail", "hair"]
  - ["부위 확인", check, "천골·발뒤꿈치·팔꿈치처럼 부위를 구체적으로 말하면 어디를 봤는지 동료가 알아요. 이곳이 압박이 잘 몰리는 곳이에요.", "the spine", "천골, 어깨, 팔꿈치의 발적을 확인하고 있어요.", "천골, 발뒤꿈치, 팔꿈치의 온기를 확인하고 있어요.", "redness", "swelling", "dryness", "odor"]
  - ["비창백 홍반", bandage, "'doesn't blanch'는 눌러도 붉은색이 안 사라진다는 뜻이에요. 1단계 욕창의 대표 소견이에요.", "it may be a rash", "눌러도 하얗게 안 변해요 — 2단계 손상일 수 있어요.", "이 부위는 눌러도 하얗게 안 변해요 — 멍일 수 있어요.", "stage-one", "stage-four", "second-degree", "surface-level"]
  - ["기록과 분산", pencil, "'document and offload'는 기록과 압력 분산을 함께 하겠다는 말이에요. 'right away'는 미루지 않는다는 뜻이에요.", "and wait", "바로 보고하고 압력을 분산시킬게요.", "바로 사진 찍고 압력을 분산시킬게요.", "offload", "moisturize", "measure", "mention"]
  - ["단계 판정", chartup, "'so'가 앞 소견에서 판정으로 이어요. 비창백 홍반이면 1단계라고 부르는 것이 기준이에요.", "this a second-degree", "눌러도 안 변하니 2단계 손상으로 볼게요.", "눌러도 안 변하니 발진으로 볼게요.", "stage-one", "stage-two", "healed", "minor"]
  - ["팔꿈치 보호", shield, "'every time I turn him'은 체위를 바꿀 때마다 반복한다는 조건이에요. 팔꿈치는 옆으로 눕힐 때 눌려요.", "every time I move him", "체위를 바꿀 때마다 무릎 압력을 분산시킬게요.", "체위를 바꿀 때마다 손목 압력을 분산시킬게요.", "elbows", "knees", "wrists", "hips"]
  order:
