- title: 체위변경·압력 재분산
  s:
  - ["체위 안내", baby, "'even though'로 진정 중이어도 말을 건다는 점을 밝혀요. 진정 환자도 들을 수 있어서 하는 일을 미리 알려요.", "even if you're asleep", "불편하시겠지만 지금 체위를 바꿔 드릴게요.", "아프시겠지만 지금 체위를 바꿔 드릴게요.", "turning", "weighing", "bathing", "shaving"]
  - ["압력 분산", shield, "'turn'과 'offload'를 'and'로 이으면 돌리는 것과 압력 덜기를 한 번에 한다는 말이 돼요. 압박점은 뼈가 튀어나온 곳이에요.", "and wash", "체위를 바꾸고 침대 시트를 새로 갈아요.", "체위를 바꾸고 환자복을 새로 갈아요.", "offload", "wash", "trim", "weigh"]
  - ["발뒤꿈치 보호", shield, "'off the bed'는 닿지 않게 띄운다는 결과를 말해요. 베개로 종아리를 받치면 발뒤꿈치가 떠요.", "on the bed", "베개를 써서 발뒤꿈치가 난간에 안 닿게 할게요.", "베개를 써서 발뒤꿈치가 의자에 안 닿게 할게요.", "heels", "knees", "elbows", "shoulders"]
  - ["다음 일정", calendar, "'due in'은 시한이 정해진 일정이에요. 체위변경 간격을 말하고 기록해 두면 다음 사람도 놓치지 않아요.", "in two days", "다음 체위변경은 두 시간 뒤예요 — 베개를 갈아 둘게요.", "다음 체위변경은 두 시간 뒤예요 — 시트를 펴 둘게요.", "turn", "bath", "dose", "scan"]
  - ["가족 설명", speech, "'why'로 이유를 설명하면 가족이 낯선 일을 받아들이기 쉬워져요. 'every two hours'는 체위변경의 표준 간격이에요.", "to the doctor", "왜 두 시간마다 체위를 바꾸는지 환자에게 설명했어요.", "왜 두 시간마다 체위를 바꾸는지 간병인에게 설명했어요.", "family", "surgeon", "porter", "dietitian"]
  - ["다시 분산", redo, "'again'은 한 번 한 일을 되풀이한다는 뜻이에요. 체위를 바꿀 때마다 눌린 곳이 새로 생겨서 다시 해요.", "once before", "이번 목욕 뒤에도 압박점의 압력을 다시 분산시킬게요.", "이번 검사 뒤에도 압박점의 압력을 다시 분산시킬게요.", "offload", "wrap", "rinse", "stack"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 체위변경 4문장 순서
    why: 하는 일을 먼저 알리고, 돌린 뒤 압박점과 발뒤꿈치를 보호하고, 다음 일정을 정해 기록해요.
    lines:
    - ["I'm turning you now, even though you're sedated.", baby, "진정 중이시지만 지금 체위를 바꿔 드릴게요", "안내"]
    - ["Now that you're turned, I'll offload the pressure points.", shield, "돌려 눕혔으니 압박점의 압력을 분산시킬게요", "분산"]
    - ["I'll use pillows to keep his heels off the bed.", shield, "베개로 발뒤꿈치가 침대에 안 닿게 할게요", "보호"]
    - ["The next turn is due in two hours, and I'll log it.", calendar, "다음 체위변경은 두 시간 뒤이고 기록해 둘게요", "일정"]
- title: 조기 이동 스크리닝
  s:
  - ["이동 선별", magnify, "'whether she's ready'로 준비 여부를 묻는 형태라 결정을 미리 정해 두지 않아요. 이동 전에 안전 선별을 먼저 해요.", "whether she's hungry", "오늘 퇴원할 준비가 됐는지 스크리닝해요.", "오늘 이송할 준비가 됐는지 스크리닝해요.", "mobilize", "discharge", "transfer", "extubate"]
  - ["기준 충족", check, "산소화와 혈역학을 한 주어로 묶어 말하면 안전 기준 두 가지를 한 번에 보고해요. 'meet'은 기준을 넘었다는 뜻이에요.", "and her appetite", "산소화와 혈역학이 퇴원 기준을 충족해요.", "산소화와 혈역학이 영양 기준을 충족해요.", "criteria", "schedule", "rounds", "budget"]
  - ["지시 따름", handshake2, "지시를 따르는지와 라인이 고정됐는지는 이동 전 안전 확인이에요. 'secure'는 풀릴 위험이 없다는 뜻이에요.", "and her family", "숨을 편히 쉬고 라인도 고정돼 있어요.", "열이 없고 라인도 고정돼 있어요.", "secure", "kinked", "leaking", "tangled"]
  - ["시작 단계", run, "'start with'는 가장 낮은 단계부터 시작한다는 말이에요. 침대 끝에 걸터앉기는 이동 사다리의 첫 단계예요.", "with a stretch", "침대 위에서 스트레칭하는 것부터 시작해요.", "침대 위에서 호흡 연습부터 시작해요.", "sitting", "stretching", "resting", "breathing"]
  - ["중단 안내", speech, "'anytime she feels'로 환자가 멈출 권한을 가진다는 점을 알려요. 불안하면 멈춰도 된다는 말이 협력을 높여요.", "anytime she feels tired", "피곤하면 언제든 멈추라고 말했어요.", "목마르면 언제든 멈추라고 말했어요.", "unsafe", "thirsty", "bored", "hungry"]
  - ["중단 기준", siren, "중단 기준을 미리 정해 두면 상황이 나빠졌을 때 망설이지 않아요. 심박수와 산소는 이동 중 가장 먼저 보는 값이에요.", "if her pain rises", "심박수나 산소가 안정되면 한 단계 올리기로 했어요.", "심박수나 산소가 안정되면 걷는 거리를 늘리기로 계획했어요.", "drops", "rises", "improves", "settles"]
  order:
