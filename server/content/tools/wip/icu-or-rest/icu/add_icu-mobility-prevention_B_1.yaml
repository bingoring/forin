- title: VTE 위험 평가·예방
  s:
  - ["위험 사정", magnify, "'before we start'로 시점을 앞에 못 박아, 예방은 위험을 본 뒤에 시작한다는 순서를 알려 줘요. 'Let's'는 팀이 함께 한다는 신호예요.", "his lab results", "예방을 시작하기 전에 그녀의 VTE 위험을 사정해요.", "운동을 시작하기 전에 그의 VTE 위험을 사정해요.", "prevention", "treatment", "diagnosis", "discharge"]
  - ["병행 예방", shield, "'so'로 이유와 결정을 잇고 'combine'으로 두 방법을 함께 쓴다고 밝혀요. 고위험 환자는 한 가지 방법만 쓰지 않는 경우가 많아요.", "physical and dietary", "수술 직후라 기계적 예방과 약물 예방을 함께 적용할게요.", "고령이라 기계적 예방과 약물 예방을 함께 적용할게요.", "prophylaxis", "analgesia", "sedation", "hydration"]
  - ["기기 상태", gear, "'on and cycling'은 켜짐과 실제 작동을 함께 보고해요. 전원만 켜진 것과 돌아가는 것은 달라서 둘 다 말해요.", "and charging", "순차 압박기기가 켜져서 충전 중이에요.", "순차 압박기기가 켜져서 점검 중이에요.", "cycling", "charging", "warming", "leaking"]
  - ["처방 확인", pencil, "'and any'로 처방과 금기를 한 문장에 묶으면 둘 다 확인하겠다는 약속이 돼요. 금기는 처방과 함께 봐야 안전해요.", "the pharmacy order", "기계적 예방 처방과 금기 사항을 확인할게요.", "약물 치료 처방과 금기 사항을 확인할게요.", "contraindications", "recommendations", "complications", "interventions"]
  - ["금기 보고", check, "'I don't see any'는 찾아봤지만 없다는 부정 보고예요. 'on his chart'로 어디서 확인했는지 근거를 말해요.", "on his wristband", "손목 밴드에는 금기 사항이 안 보여요.", "모니터에는 금기 사항이 안 보여요.", "contraindications", "complications", "recommendations", "explanations"]
  - ["기기 확인", monitor, "'Both'는 한쪽 다리만이 아니라 양쪽 모두 봤다는 말이에요. 'correctly'는 압박이 제 순서대로 돈다는 확인이에요.", "Both leg wraps", "압박기기 세 개 다 제대로 순환 작동하고 있어요.", "압박기기 두 개 다 조용히 순환 작동하고 있어요.", "correctly", "quietly", "slowly", "briefly"]
  order:
