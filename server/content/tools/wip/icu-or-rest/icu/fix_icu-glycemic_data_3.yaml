dko:
  3.2.0: 혈당이 낮은지 빨리 재 볼게요
  3.2.1: 조치 후 혈당을 또 잴게요
  3.4.0: 찌르기 전에 손끝을 알코올로 한 번 닦을게요
  3.4.1: 찌르고 나서 거즈로 손끝을 잠깐 눌러 드릴게요
  6.0.0: 속도를 조정하기 전에 표에서 맞는 칸을 찾아요
  6.0.1: 조정하고 나서 바꾼 속도를 동료와 같이 봐요
  6.3.0: 속도를 줄인 뒤에는 15분 후 혈당을 다시 재요
  6.3.1: 빨리 떨어지는지 지난 수치와 비교해요
  6.4.0: 오르고 있으면 표에 따라 올리기 전에 펌프를 봐요
  6.4.1: 올린 다음 한 시간 후에 다시 재요
  8.2.1: 그다음엔 왜 떨어졌는지 봐서 담당의와 상의할게요
  8.4.1: 재확인 값이 정상이면 간식을 권해 또 오지 않게 해요
  9.0.0: 인슐린을 조정하고 나면 급식 재개 시각을 물어봐요
  9.0.1: 급식을 멈추기 전에 인슐린 처방부터 살펴봐요
  16.3.0: 투여한 다음엔 항상 투여 시각을 적어 둬요
  16.3.1: 투여하고 나서 항상 혈당을 또 재요
  5.4.0: 표시한 다음 주치의에게도 알려 둘게요
  10.0.0: 지속형 주사를 놓은 시각을 기록지에 꼭 적어 둬요
  15.2.0: 5분 후 재확인하고 오르면 담당의에게 알려요
  18.1.0: 포도당을 시작한 뒤 급식 펌프를 점검해요
  8.0.0: 빠르게 흡수되는 당을 드리기 전에 손끝 혈당을 먼저 재 볼게요
  16.4.0: 탓하는 게 아니라 원인만 정확히 보고할게요
  18.2.0: 다시 이런 일이 없도록 담당자를 정해요
  19.4.0: 오늘 오후 가족 면담에 이걸 가져갈게요
  20.0.1: 먼저 혈당을 확인할게요, 저혈당이나 고혈당 모두 발작을 일으킬 수 있으니까요
  15.4.0: 도착하면 바로 보고해 주세요
  14.1.1: 정맥혈 검체는 관 색대로 나눠 보내요
  5.0.1: 혈당이 오르는 추세라 담당의에게 물을게요
  6.2.0: 한 시간 뒤 다시 보고 필요하면 따로 적정할게요
  9.1.0: 포도당을 시작하면 혈당이 안정되는지 자주 볼 수도 있어요
  17.2.0: DKA 치료를 시작하면 수액 상태를 자주 살필게요
  17.3.0: 속이 메스껍고 목이 쉰 것도 경고 신호일 수 있어요
  19.1.0: 급식과 신장 기능, 기록지를 같이 살펴봐요
  20.4.1: 알리고 나서 바로 기록을 봐요
  2.0.1: 이 주입은 혈당 수치에 따라 속도를 정하는 표를 매일 봐요
