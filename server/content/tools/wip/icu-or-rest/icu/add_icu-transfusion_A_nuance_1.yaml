- situation: "수혈 전 확인·동의"
  items:
    - kind: slider
      words: [w-match, w-stop]
      cue: "Colleague: \"The name on the bag is one letter off from his wristband.\""
      scale: ["go ahead and fix it later", "have another nurse glance at it", "stop and call the blood bank"]
      answerAt: 2
      why: "이름이나 ID가 한 글자라도 다르면 그 제제는 걸지 않아요. 나중에 고치거나 다른 사람에게 슬쩍 보여 주는 걸로는 안 되고, 걸지 않은 채 혈액은행에 알려 병원 절차대로 해결해요."
      example: "If anything doesn't match, we stop right here."
      exKo: "하나라도 어긋나면 바로 여기서 멈춰요."
    - kind: context
      words: [w-confirm]
      word: confirm
      ko: 확인하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll confirm consent with him before we hang this unit.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you confirm the unit number against the bag with me?", ok: true}
        - {who: 환자에게, icon: me, en: "I'm here to confirm that your informed consent documentation is complete per policy.", ok: false, fix: "I want to make sure you're comfortable with getting this blood before we start."}
      why: "의료진끼리는 confirm으로 확인할 것을 짧게 주고받아요. 환자에게는 informed consent documentation 같은 서류 말투가 차갑고 어렵게 들려요. 무엇을 왜 묻는지 쉬운 말로 물어요."
- situation: "수혈 시작·초기 감시"
  items:
    - kind: slider
      words: [w-run, w-slow]
      cue: "Colleague: \"He's stable and not bleeding. How should I start the first fifteen minutes?\""
      scale: ["slowly, as ordered", "at the usual rate", "wide open to catch up"]
      answerAt: 0
      why: "활동성 출혈이 없는 환자는 처음 15분 동안 처방된 느린 속도로 시작해 곁에서 반응을 살펴요. 속도는 처방과 병원 정책을 따라요. 평소 속도나 최대 속도로 시작하면 반응이 생겼을 때 이미 많은 양이 들어가 있어요."
      example: "I'll run it slow for the first fifteen minutes."
      exKo: "처음 십오 분은 천천히 흐르게 할게요."
    - kind: context
      words: [w-watch, w-closely]
      word: watch
      ko: 지켜보다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'm watching his heart rate and blood pressure closely, no change so far.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Watch him for chills while I check the pump.", ok: true}
        - {who: 환자에게, icon: me, en: "We will be watching you for tachycardia, hypotension, and a febrile response.", ok: false, fix: "I'll stay right here and keep an eye on your pulse, your pressure, and your temperature."}
      why: "의료진끼리는 증상 이름을 그대로 말해도 되지만, 환자에게는 tachycardia·febrile 같은 말이 겁을 줘요. 무엇을 보는지 쉬운 말로 알려 줘요."
- situation: "수혈 반응 징후 인지"
  items:
    - kind: pair
      words: [w-notify, w-line, w-open, w-vital]
      pairs: [["notify", "the provider"], ["keep", "the line open"], ["take", "a full set of vitals"]]
      decoys: ["the expiration"]
      why: "수혈 반응이 의심되면 멈춘 뒤 라인은 생리식염수로 열어 두고, 활력징후를 전부 재고, 의료진에게 알려요. notify는 사람에게, keep은 라인을 열어 두는 데, take는 활력징후를 재는 데 짝이 맞아요."
    - kind: context
      words: [w-notify]
      word: notify
      ko: 통보하다
      scenes:
        - {who: 동료 간호사, icon: monitor, en: "Did you notify the blood bank yet?", ok: true}
        - {who: 의사 콜, icon: stetho, en: "I'm calling to notify you of a suspected transfusion reaction.", ok: true}
        - {who: 환자에게, icon: me, en: "I will notify the provider of your dyspnea and pruritus.", ok: false, fix: "I'm letting the doctor know right now that you're short of breath and itchy."}
      why: "의료진끼리는 notify로 짧게 보고해요. 환자에게는 dyspnea·pruritus 같은 말이 낯설어요. 누구에게 무엇을 알리는지 쉬운 말로 말해 줘요."
- situation: "혈액 성분 종류 이해"
  items:
    - kind: pair
      words: [w-packed, w-platelet, w-replace, w-treat]
      pairs: [["Packed red cells", "raise oxygen-carrying capacity"], ["Platelets", "treat thrombocytopenia"], ["Plasma", "replace clotting factors"]]
      decoys: ["sign the consent"]
      why: "농축 적혈구는 산소 운반 능력을 높이고, 혈소판은 혈소판감소증에 쓰고, 혈장은 응고인자를 보충해요. 어떤 성분을 쓸지는 검사 결과를 보고 처방으로 정해요."
    - kind: context
      words: [w-low]
      word: low
      ko: 낮은
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His fibrinogen is low, so I'm asking about cryo.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "His platelet count is low, so watch his gums and IV sites.", ok: true}
        - {who: 가족에게, icon: me, en: "His hemoglobin is low, his fibrinogen is low, and his INR is up — all consistent with coagulopathy.", ok: false, fix: "His blood count is low, so we're giving him red cells to help carry oxygen."}
      why: "의료진끼리는 수치 이름을 그대로 나열하는 게 빠르고 정확해요. 가족에게는 hemoglobin·INR·coagulopathy가 한꺼번에 나오면 알아듣기 어려워요. 왜 이 성분을 주는지 한 가지로 쉽게 설명해요."
- situation: "혈액 취급·보관"
  items:
    - kind: slider
      words: [w-hang, w-fridge]
      cue: "Colleague: \"This unit has been out of the fridge for twenty minutes. Can I hang it?\""
      scale: ["hang it now", "hang it and run it faster", "send it back for a new one"]
      answerAt: 0
      why: "대부분의 병원 정책은 냉장고를 나온 지 30분 안에 시작하라고 해요. 20분이면 아직 시작할 수 있어요. 시간을 만회하려고 빨리 흘려 보내면 안 되고, 처방된 시작 속도를 지켜요. 정확한 기준은 병원 정책을 따라요."
      example: "Blood must be started within thirty minutes of leaving the fridge."
      exKo: "혈액은 냉장고를 나온 지 삼십 분 안에 시작해야 해요."
    - kind: context
      words: [w-check]
      word: check
      ko: 점검하다
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "I'll check the time on the unit before I hang it.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you check the expiration with me?", ok: true}
        - {who: 환자에게, icon: me, en: "I'm checking the chain of custody and thermal exposure time on this unit.", ok: false, fix: "I'm just checking that this blood is fresh and safe before I start it."}
      why: "의료진끼리는 시간과 유효기간을 확인한다는 말을 짧게 해도 돼요. 환자에게는 chain of custody·thermal exposure 같은 말이 낯설고 불안해요. 무엇을 왜 확인하는지 쉬운 말로 알려 줘요."
- situation: "수혈 중 활력 주기 기록"
  items:
    - kind: slider
      words: [w-monitor, w-stable]
      cue: "Colleague: \"His temperature and pressure match baseline, and he says he feels fine.\""
      scale: ["keep monitoring on schedule", "recheck sooner and call the provider", "stop the blood and call the provider"]
      answerAt: 0
      why: "기저와 같고 이상이 없으면 정해진 일정대로 감시를 이어가요. 변화가 없는데 멈추거나 호출하면 불필요한 중단이 돼요. 변화가 생기면 그때 더 자주 재거나 멈추고 보고해요."
      example: "Keep the monitor on him and log vitals on the transfusion schedule."
      exKo: "모니터를 계속 달아 두고 수혈 일정표에 활력징후를 기록하세요."
    - kind: context
      words: [w-stable]
      word: stable
      ko: 안정적인
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Vitals are stable — temp 98.4, heart rate 78.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "He's been stable since we started.", ok: true}
        - {who: 가족에게, icon: me, en: "He is hemodynamically stable with no febrile response so far.", ok: false, fix: "He's doing well so far — his pulse, pressure, and temperature all look steady."}
      why: "의료진끼리는 수치와 함께 stable이라고 말하는 게 정확하고 빨라요. 가족에게는 hemodynamically·febrile 같은 말이 어려워요. 무엇이 괜찮은지 쉬운 말로 풀어 줘요."
