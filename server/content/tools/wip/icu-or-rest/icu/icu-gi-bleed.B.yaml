situations:
- title: GI 출혈 징후 사정
  sentences:
  - en: That can be a sign of bleeding, so I'm checking you closely.
    ko: 그건 출혈의 징후일 수 있어서, 자세히 살펴보고 있어요.
    chunks:
    - That can be
    - a sign of bleeding
    - ', so I''m checking you'
    - closely
    - .
    words:
    - w-sign
    - w-bleed
    - w-check
    - w-closely
    goal: 1
    tag: 징후 설명
    icon: magnify
    why: '''can be''는 확정하지 않고 가능성으로 말해 환자를 겁주지 않아요. ''so''로 살피는 이유를 붙여요.'
    decoy: this morning
    distractorsKo:
    - 그건 출혈의 원인일 수 있어서, 자세히 살펴보고 있어요.
    - 그건 쇼크의 징후일 수 있어서, 자세히 살펴보고 있어요.
    blank:
      answer: sign
      options:
      - en: sign
      - en: cause
      - en: result
      - en: treatment
  - en: Coffee-ground vomit means the blood has been in your stomach a while.
    ko: 커피 찌꺼기 같은 구토물은 피가 위 속에 한동안 있었다는 뜻이에요.
    chunks:
    - Coffee-ground vomit
    - means
    - the blood
    - has been in your stomach
    - a while
    - .
    words:
    - w-vomit
    - w-blood
    - w-stomach
    - w-mean
    - w-while
    goal: 1
    tag: 의미 설명
    icon: magnify
    why: '''means''로 증상과 몸속 상태를 한 줄로 이어 줘요. ''a while''은 정확한 시간을 모를 때 쓰는 흐린 표현이에요.'
    decoy: since lunch
    distractorsKo:
    - 커피 찌꺼기 같은 구토물은 피가 위 속에 방금 생겼다는 뜻이에요.
    - 커피 찌꺼기 같은 구토물은 피가 장 속에 한동안 있었다는 뜻이에요.
    blank:
      answer: stomach
      options:
      - en: stomach
      - en: throat
      - en: lungs
      - en: bladder
  - en: I'm going to take your vitals and look at your color.
    ko: 활력징후를 재고 안색도 살펴볼게요.
    chunks:
    - I'm going to take
    - your vitals
    - and look at
    - your color
    - .
    words:
    - w-take
    - w-vitals
    - w-look
    - w-color
    goal: 2
    tag: 사정 예고
    icon: stetho
    why: '''I''m going to''로 곧 할 일을 먼저 알리면 환자가 놀라지 않아요. ''and''로 두 가지를 한 번에 묶어요.'
    decoy: your gown
    distractorsKo:
    - 활력징후를 재고 이불도 덮을게요.
    - 활력징후를 재고 침대 높이도 낮춰 드릴게요.
    blank:
      answer: color
      options:
      - en: color
      - en: weight
      - en: teeth
      - en: hearing
  - en: I'm also checking your stool for any black or bloody color.
    ko: 대변도 검게 변했는지 피가 섞였는지 확인하고 있어요.
    chunks:
    - I'm also checking
    - your stool
    - for any black or bloody
    - color
    - .
    words:
    - w-check
    - w-stool
    - w-black
    - w-bloody
    - w-color
    goal: 1
    tag: 배변 사정
    icon: magnify
    why: '''any''를 쓰면 있는지 없는지 열어 둔 채 말하는 셈이라 부담이 덜해요. ''black or bloody''는 찾는 모양을 구체적으로 알려 줘요.'
    decoy: this week
    distractorsKo:
    - 시트도 검게 변했는지 피가 섞였는지 확인하고 있어요.
    - 구토물도 검게 변했는지 피가 섞였는지 확인하고 있어요.
