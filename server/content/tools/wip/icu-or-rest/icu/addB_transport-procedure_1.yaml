- title: 원내 이송 전 안정성 평가
  s:
  - ["상태 평가", stetho, "stable enough for …는 완벽하다는 뜻이 아니라 이송이라는 목적에 충분하다는 기준을 말해요. right now가 지금 시점의 판단임을 못 박아요.", "for a walk", "오전에 활력징후는 이송하기에 충분히 안정적이었어요.", "지금 활력징후는 퇴원하기에 충분히 안정적이에요.", "transport", "discharge", "dialysis", "surgery"]
  - ["출발 전 확인", lock, "first를 문장 끝에 두면 다른 어떤 일보다 앞선다는 순서가 또렷해져요. 기도와 라인은 이동 중에 빠지면 곧바로 위기라 출발 전에 먼저 봐요.", "are labeled", "오늘 아침에 기도와 라인이 고정됐는지 확인했어요.", "출발 직전에 기도와 라인이 고정됐는지 확인할게요.", "airway", "mattress", "blanket", "pillow"]
  - ["악화 계획", siren, "If로 조건을 먼저 깔고 we hold and reassess로 행동을 짧게 합의해요. 이송 전에 미리 말해 둬야 악화될 때 망설이지 않아요.", ", we sign", "열이 나면 멈추고 다시 평가해요.", "졸려 하면 멈추고 다시 평가해요.", "reassess", "refill", "rename", "rewrite"]
  - ["수치 보고", chartup, "look good은 눈으로 본 수치를 가볍게 요약하는 말이에요. 혈압과 산소를 and로 묶어 이동 전에 꼭 봐야 할 두 가지를 같이 짚어요.", "and bed height", "혈압과 산소 수치가 휴식하기 좋아 보여요.", "어제는 혈압과 산소 수치가 이동하기 좋아 보였어요.", "oxygen", "sugar", "sodium", "pain"]
  - ["펌프 점검", gear, "double-check는 이미 한 확인을 한 번 더 한다는 뜻이에요. before we go로 시점을 못 박아 출발 전에 끝낸다는 걸 알려요.", "the call light", "가기 전에 진정제와 승압제 펌프를 다시 비워 둘게요.", "가기 전에 진정제와 승압제 주사기를 다시 확인할게요.", "pumps", "poles", "carts", "wheels"]
  - ["CT 준비", board, "Let's는 상대와 함께 확인하자는 말이라 지시보다 부드러워요. 영상실이 준비되기 전에 환자를 옮기면 복도에서 기다리게 되니 순서가 중요해요.", "the elevator", "옮기기 전에 CT 예약이 됐는지 확인해요.", "옮기기 전에 CT가 청소됐는지 확인해요.", "ready", "empty", "open", "clean"]
