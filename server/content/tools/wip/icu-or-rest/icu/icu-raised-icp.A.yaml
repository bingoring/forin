situations:
- title: 신경학적 사정
  sentences:
  - en: Can you squeeze my hand for me?
    ko: 제 손을 좀 꽉 쥐어 보시겠어요?
    chunks:
    - Can you squeeze
    - my hand
    - for me
    - '?'
    words:
    - w-squeeze
    goal: 1
  - en: I'm checking how alert he is, his pupils, and his hand strength.
    ko: 각성 정도와 동공, 손 힘을 확인하고 있어요.
    chunks:
    - I'm checking
    - how alert he is
    - ', his pupils'
    - ', and his hand strength'
    - .
    words:
    - w-check
    - w-alert
    - w-pupil
    - w-strength
    goal: 1
  - en: His pupils are equal and reactive to light right now.
    ko: 지금 동공은 양쪽이 같고 빛에 반응해요.
    chunks:
    - His pupils are
    - equal and reactive
    - to light
    - right now
    - .
    words:
    - w-pupil
    - w-equal
    - w-reactive
    - w-light
    goal: 1
  - en: Any change from an hour ago is important, so thank you for noticing.
    ko: 한 시간 전과 다른 변화는 중요하니 알아차려 주셔서 감사해요.
    chunks:
    - Any change
    - from an hour ago
    - is important
    - ', so thank you'
    - for noticing
    - .
    words:
    - w-change
    - w-important
    - w-notice
    goal: 2
  - en: I'll compare this with his earlier exam and update the team.
    ko: 이전 사정과 비교해서 팀에 알릴게요.
    chunks:
    - I'll compare this
    - with his earlier exam
    - and update
    - the team
    - .
    words:
    - w-compare
    - w-earlier
    - w-exam
    - w-update
    - w-team
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-alert
    cue: 'Chart: "He opens his eyes only when I call his name loudly."'
    scale:
    - alert
    - to voice
    - to pain
    - none
    answerAt: 1
    why: 신경 ICU에서는 의식 수준을 흔히 AVPU로 적어요. alert는 스스로 깨어 있는 상태, to voice는 부르면 눈을 뜨는 상태, to pain은 통증 자극에만 반응하는 상태, 마지막은 반응이 없는 상태예요. 소리쳐 불러야 눈을 뜬다면 to voice예요.
    example: He's alert at baseline, but now he only opens his eyes to voice.
    exKo: 원래는 또렷했는데 지금은 부를 때만 눈을 떠요.
  - kind: context
    words:
    - w-reactive
    word: reactive
    ko: 반응하는
    scenes:
    - who: 의사에게 보고
      icon: monitor
      en: Left pupil is no longer reactive to light, and he's more drowsy.
      ok: true
    - who: 가족에게
      icon: me
      en: Pupils reactive bilaterally, PERRL, GCS 14, no acute change.
      ok: false
      fix: His eyes still react to light, which is a good sign, and we're checking them often.
    - who: 차트 기록
      icon: board
      en: Pupils equal, round, and reactive to light at 0800.
      ok: true
    why: 의료진끼리는 PERRL, GCS 같은 약어가 빠르고 정확해요. 하지만 가족에게는 무슨 뜻인지 알 수 없고 오히려 불안하게 들려요. 같은 사실을 눈이 빛에 반응한다는 쉬운 말로 풀어 주세요.
  - kind: swap
    words:
    - w-change
    who: 가족에게 · 변화 안내
    icon: me
    before:
    - 'We''ll tell you right away if there is any '
    - neuro change
    - ' in him.'
    options:
    - difference you can see
    - neuro change
    - GCS drop
    answer: difference you can see
    notes:
      difference you can see: 가족도 바로 알아볼 수 있는 쉬운 말이라 무엇을 알려 주겠다는 건지 분명하다.
      neuro change: 의료진끼리 쓰는 말이라 가족은 무엇이 바뀌는지 감이 오지 않는다.
      GCS drop: 점수 용어라 가족에게는 낯설고 놀라게 할 수 있다.
    why: 가족에게는 눈에 보이는 변화를 쉬운 말로 설명하고, 점수나 약어는 의료진끼리 쓰는 말로 남겨 두세요.
    ko: 그분에게 눈에 띄는 변화가 있으면 바로 알려 드릴게요
