    - ['To avoid that, I''ll recheck your glucose and set the new rate per protocol.', monitor, 그걸 피하려고 혈당을 다시 확인하고 새 속도를 맞춰요, 재확인]
    - ['So far, your sugar''s dropping steadily, which is exactly what we want.', chartup, '지금까지 혈당이 꾸준히 내려가고 있고, 바로 원하는 거예요', 결과]
- title: K 보정·인슐린 균형
  s:
  - [동시 관리, monitor, '''keep monitoring''은 한 번이 아니라 계속 본다는 뜻이에요. ''with the insulin running''은 인슐린이 들어가는 동안이라는 위험한 시간대를 가리켜요.', in the lobby, 칼륨을 보충하면서 인슐린이 들어가는 동안 주치의가 계속 자세히 모니터링해요., 칼륨을 보충하면서 인슐린이 들어가는 동안 전문의가 계속 자세히 모니터링해요., monitoring, labeling, decorating, announcing]
  - [조절 가능성, gear, '''may need to''는 확정이 아니라 필요할 수도 있다는 완곡한 표현이에요. ''keeps falling''은 계속 떨어지는 추세를 말해요.', with your family, 칼륨이 계속 떨어지면 레지던트가 인슐린을 늦춰야 할 수도 있어요., 칼륨이 계속 떨어지면 당직의가 인슐린을 늦춰야 할 수도 있어요., need, hope, wish, dare]
  - [재검 안내, lab, '''repeat level''은 같은 검사를 한 번 더 한다는 뜻이에요. ''to confirm''이 재검의 목적을 밝혀요.', at noon, 보충한 뒤에 확인차 칼륨 수치를 담당의가 다시 채혈해요., 보충한 뒤에 확인차 칼륨 수치를 책임자가 다시 채혈해요., replacement, removal, delivery, dressing]
  - [진행 허락, check, '''clear to''는 계속해도 된다는 허락의 뜻이에요. ''back to normal''이 그 근거를 쉬운 말로 줘요.', for the weekend, '칼륨이 정상으로 돌아와서, 면회를 계속 진행해도 괜찮아요.', '칼륨이 정상으로 돌아와서, 검사를 계속 진행해도 괜찮아요.', drip, diet, tour, visit]
  - [조건부 중단, siren, '''If it drops again''이 중단의 조건을 분명히 해요. ''pause''는 영구 중단이 아니라 잠시 멈춘다는 뜻이에요.', for dinner, 다시 떨어지면 야간조가 인슐린을 잠시 멈추고 다시 확인해요., 다시 떨어지면 주간조가 인슐린을 잠시 멈추고 다시 확인해요., recheck, refill, relabel, rewrite]
