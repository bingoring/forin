situations:
- title: DKA 인슐린 주입 적정
  s:
  - [조절 이유, gear, '''so''로 인슐린을 조절하는 목적을 이어 말해 환자가 이유를 바로 알아요. ''a safe pace''는 속도 자체가 안전의 기준이라는 말이에요.', at the bedside, 혈당이 안전한 속도로 내려가도록 인턴이 인슐린을 조절해요., 혈당이 안전한 속도로 내려가도록 사수가 인슐린을 조절해요., pace, route, brand, color]
  - [위험 설명, shield, '''can be''는 가능성을 말해 겁주지 않으면서 조심할 이유를 줘요. ''titrate''는 반응을 보며 조금씩 맞춘다는 임상 동사예요.', to your family, '너무 빨리 내리면 위험할 수 있어서, 선임이 조심스럽게 적정해요.', '너무 빨리 내리면 위험할 수 있어서, 수간호사가 조심스럽게 적정해요.', risky, costly, noisy, lucky]
  - [재확인, monitor, '''per protocol''은 임의가 아니라 병원 지침대로 속도를 맞춘다는 안심을 줘요. ''recheck''의 ''re-''가 앞서 한 측정을 다시 한다는 뜻을 만들어요.', the call light, 동료가 혈당을 다시 확인하고 프로토콜대로 새 속도를 맞춰요., 선배가 혈당을 다시 확인하고 프로토콜대로 새 속도를 맞춰요., rate, bed, size, name]
  - [처방 준수, pencil, '''exactly as ordered''는 처방에서 벗어나지 않는다는 뜻이라 환자·가족이 안심해요. ''sliding scale''은 혈당에 따라 용량이 달라지는 방식을 가리켜요.', on the whiteboard, 처방된 대로 후배가 슬라이딩 스케일을 정확히 따르고 있어요., 처방된 대로 의사가 슬라이딩 스케일을 정확히 따라요., sliding, rolling, jumping, falling]
  - [호전 설명, chartup, '''exactly what we want''는 수치가 계획대로 움직인다는 짧은 확인이라 환자 불안을 줄여요. ''steadily''는 급락이 아니라 꾸준하다는 점이 핵심이에요.', for your lunch, '혈당이 꾸준히 내려가고 있는데, 이게 바로 오늘 계획이에요.', '혈당이 꾸준히 내려가고 있는데, 이게 바로 의사 선생님이 원하는 거예요.', dropping, jumping, spilling, freezing]
