    tag: 대화 흐름
    icon: compass
    ko: 케토산증 종결과 전환 4문장 순서
    why: 해결을 알리고, 전환 계획을 말하고, 겹쳐 투여하는 방법을 설명한 뒤, 식사 조건을 걸어 평소 인슐린 복귀를 알려요.
    lines:
    - ['His acid levels are back to normal, so the DKA has resolved.', chartup, 산 수치가 정상으로 돌아와서 케토산증이 해결됐어요, 해결]
    - ['On that basis, we can plan the switch to subcutaneous insulin.', gear, 그 근거로 피하 인슐린 전환을 계획할 수 있어요, 계획]
    - ['Before stopping the drip, we overlap it with the first long-acting dose.', pill, 주입을 멈추기 전에 첫 지속형 용량과 겹쳐요, 겹침]
    - ['After that overlap, once he''s tolerating food, we''ll switch him to his home insulin.', home, 그 뒤 식사를 견디면 평소 인슐린으로 바꿀게요, 복귀]
- title: HHS 고삼투 관리
  s:
  - [교정 설명, lab, '''so''로 상태(농축)와 대응(천천히)을 이었어요. ''slowly and safely''는 속도와 안전을 함께 말해 환자를 안심시켜요.', in the lab, '혈당이랑 혈액이 아주 농축돼 있어서, 수간호사가 천천히 안전하게 교정하고 있어요.', '혈당이랑 혈액이 아주 농축돼 있어서, 동료가 천천히 안전하게 교정하고 있어요.', concentrated, diluted, separated, contaminated]
  - [위험 설명, shield, '''could''는 가능성을 말해 겁을 덜어요. ''take our time''은 일부러 서두르지 않는다는 쉬운 관용구예요.', at home, '너무 빠르게 하면 신장에 영향을 줄 수 있어서, 시간을 두고 하고 있어요.', '너무 빠르게 하면 심장에 영향을 줄 수 있어서, 시간을 두고 하고 있어요.', brain, hair, nails, voice]
  - [의식 관찰, bulb, '''as she improves''는 좋아지는 과정 전체를 관찰한다는 뜻이에요. ''mental status''는 의식·판단 상태를 가리키는 임상어예요.', on the monitor, 나아지는 동안 선배가 의식 상태를 자세히 지켜봐요., 나아지는 동안 후배가 의식 상태를 자세히 지켜봐요., improves, sleeps, eats, walks]
  - [부종 위험, shield, '''could cause''는 위험을 가능성으로 말해요. ''so we go slowly''가 위험 때문에 속도를 줄인다는 인과를 밝혀요.', in her room, '나트륨을 너무 빨리 교정하면 폐부종이 생길 수 있어서, 천천히 하고 있어요.', '나트륨을 너무 빨리 교정하면 탈수가 생길 수 있어서, 천천히 하고 있어요.', swelling, pain, itching, bruising]
  - [호전 해석, chartup, '''starting to''는 막 시작했다는 진행의 표현이에요. ''tells us''는 증상이 신호라는 틀이라 해석이 쉬워요.', for her visit, '혼란스러워하시던 게 나아지기 시작했는데, 이건 약이 잘 맞는다는 뜻이에요.', '혼란스러워하시던 게 나아지기 시작했는데, 이건 가족을 알아본다는 뜻이에요.', responding, complaining, resting, waiting]
  order:
    tag: 대화 흐름
    icon: compass
    ko: HHS 교정 설명 4문장 순서
    why: 상태와 교정 방침을 알리고, 서두르지 않는 이유를 설명한 뒤, 관찰을 약속하고, 호전을 해석해요.
    lines:
    - ['Her sugar and blood are very concentrated, so we''re correcting it slowly and safely.', lab, 혈당과 혈액이 아주 농축돼서 천천히 안전하게 교정해요, 상태]
    - ['Going too fast could affect her brain, so we take our time.', shield, 너무 빠르면 뇌에 영향을 줄 수 있어서 시간을 둬요, 이유]
    - [We'll watch her mental status closely the whole time., bulb, 그동안 의식 상태를 계속 자세히 지켜볼게요, 관찰]
    - ['Her confusion is starting to clear, which tells us she''s responding well.', chartup, 혼란이 나아지고 있어 잘 반응한다는 뜻이에요, 호전]
- title: 저혈당 예방·포도당 병용
  s:
  - [병용 이유, pill, '''Once''가 포도당을 더하는 시점을 기준치 도달로 정해요. ''while continuing''은 인슐린을 멈추지 않는다는 점을 한 문장에 담아요.', to the kitchen, '혈당이 기준치에 도달하면, 인슐린은 유지하면서 원장님이 포도당을 추가해요.', '혈당이 기준치에 도달하면, 인슐린은 유지하면서 주치의가 포도당을 추가해요.', threshold, ceiling, doorway, border]
  - [목적 설명, chartup, '''without dropping''은 부작용을 피한다는 조건을 짧게 담아요. ''keep clearing''은 처치가 이어진다는 진행의 뜻이에요.', at the desk, 이렇게 하면 혈당이 너무 낮아지지 않으면서 케톤을 빨리 없앨 수 있어요., 이렇게 하면 혈당이 너무 낮아지지 않으면서 케톤을 충분히 없앨 수 있어요., dropping, jumping, spilling, climbing]
  - [동시 조절, gear, '''both … together''는 두 주입을 한 쌍으로 보고 함께 맞춘다는 뜻이에요. ''re-''는 이미 한 확인을 되풀이한다는 접두사예요.', in the morning, 혈당을 다시 확인하고 두 주입 속도를 전문의가 같이 조절해요., 혈당을 다시 확인하고 두 주입 속도를 레지던트가 같이 조절해요., recheck, recount, rename, retune]
  - [감시 목적, monitor, '''so''로 지켜보는 이유(저혈당 예방)를 이었어요. ''too low too fast''는 수치와 속도 두 가지 위험을 함께 짚어요.', in the room, 혈당이 너무 빨리 너무 낮아지지 않도록 당직의가 자세히 지켜봐요., 혈당이 너무 빨리 너무 낮아지지 않도록 담당의가 자세히 지켜봐요., low, wide, tall, thick]
  - [지속 강조, siren, '''still''이 아직 치료 중이라는 현재 상태를 말해요. ''yet''은 지금은 멈추지 말라는 뜻을 더해요.', for tonight, '아직 혈당이 높은 편이라서, 인슐린을 아직 멈추면 안 돼요.', '아직 산도가 낮은 편이라서, 인슐린을 아직 멈추면 안 돼요.', clearing, counting, filing, moving]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 포도당 병용 설명 4문장 순서
    why: 병용 시점을 말하고, 그 목적을 설명한 뒤, 저혈당을 막는 조절을 알리고, 인슐린을 멈추지 말라고 당부해요.
    lines:
    - ['Once his sugar reaches the threshold, we add dextrose while continuing insulin.', pill, 기준치에 도달하면 인슐린은 유지하며 포도당을 추가해요, 병용]
    - [This lets us keep clearing the ketones without dropping too low., chartup, 이러면 너무 낮아지지 않으며 케톤을 계속 없애요, 목적]
    - ['To stay ahead of a drop, I''ll recheck the glucose and adjust both drips together.', gear, 떨어지기 전에 대응하려고 혈당을 확인하고 두 주입을 조절해요, 조절]
    - ['Even then, we''re still clearing the ketones, so don''t stop the insulin yet.', siren, 그때도 케톤을 없애는 중이라 인슐린을 멈추지 마세요, 당부]
