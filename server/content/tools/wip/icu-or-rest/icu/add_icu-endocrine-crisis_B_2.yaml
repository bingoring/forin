    why: 보충과 감시를 시작하고, 보충 뒤 재검을 하고, 정상이면 계속 진행하고, 다시 떨어질 때의 계획을 알려요.
    lines:
    - [Let's replace potassium and keep monitoring it closely with the insulin running., monitor, 칼륨을 보충하고 인슐린이 들어가는 동안 계속 자세히 모니터링해요, 보충]
    - ['After the replacement, I''ll draw a repeat level to confirm.', lab, 보충한 뒤에 확인차 다시 채혈할게요, 재검]
    - ['Once it''s back to normal, we''re clear to keep the drip going.', check, 정상으로 돌아오면 주입을 계속해도 돼요, 진행]
    - ['If it drops again after that, we''ll pause the insulin and recheck.', siren, 그 뒤에 다시 떨어지면 인슐린을 멈추고 다시 확인해요, 대비]
- title: anion gap 종결 판단
  s:
  - [전환 계획, gear, '''so''로 근거(간극이 닫힘)와 결론(전환 계획)을 이었어요. ''plan the switch''는 당장 바꾸는 게 아니라 계획한다는 뜻이에요.', to the pharmacy, '간극이 닫혀서, 이제 피하 인슐린으로 전환할 계획을 교대자가 세울 수 있어요.', '간극이 닫혀서, 이제 피하 인슐린으로 전환할 계획을 전담자가 세울 수 있어요.', switch, pump, trip, vote]
  - [겹쳐 투여, pill, '''overlap''은 두 가지를 잠시 함께 쓴다는 뜻이에요. ''before stopping''으로 주입을 끊는 시점이 겹친 다음임을 밝혀요.', after dinner, 중단하기 전에 팀장이 첫 지속형 용량이랑 주입을 겹쳐서 줘요., 중단하기 전에 과장이 첫 지속형 용량이랑 주입을 겹쳐서 줘요., stopping, labeling, moving, weighing]
  - [전환 전 확인, check, '''Let me''는 허락을 구하며 내가 하겠다고 알리는 부드러운 표현이에요. ''first''가 전환보다 앞서 확인한다는 순서를 줘요.', on the chart, 먼저 식사가 되는지랑 검사 수치가 안정적인지부터 교수가 확인해요., 먼저 식사가 되는지랑 검사 수치가 안정적인지부터 인턴이 확인해요., eating, sleeping, walking, talking]
  - [해결 선언, chartup, '''so''로 수치가 정상이라는 근거에서 해결됐다는 결론으로 넘어가요. ''resolved''는 병이 해결됐다는 임상 표현이에요.', by the window, '산 수치가 정상으로 돌아와서, 케토산증이 많이 좋아졌어요.', '산 수치가 정상으로 돌아와서, 환자분 컨디션이 좋아졌어요.', resolved, worsened, spread, moved]
  - [평소 약 복귀, home, '''Once''가 조건(식사를 견딤)을 앞에 세워 전환 시점을 분명히 해요. ''home insulin''은 평소 쓰던 약을 쉬운 말로 가리켜요.', to the nurse, '식사를 잘 견디시면, 평소 쓰시던 인슐린으로 사수가 바꿔 드려요.', '식사를 잘 견디시면, 평소 쓰시던 인슐린으로 선임이 바꿔 드려요.', switch, walk, carry, mail]
