    why: 조절 목적을 말하고, 위험을 설명한 뒤, 그 위험을 피하려는 재확인을 알리고, 결과를 확인해 줘요.
    lines:
    - [We adjust the insulin so your sugar comes down at a safe pace., gear, 혈당이 안전한 속도로 내려가도록 인슐린을 조절해요, 목적]
