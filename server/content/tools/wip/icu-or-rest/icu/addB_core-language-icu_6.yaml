situations:
- title: 다국어 약물·안전 교육
  s:
  - ["약물 목록", pill, "in your language는 환자가 읽을 수 있는 언어로 된 자료라는 뜻이에요. Here's로 건네면서 말하면 자료를 눈앞에 보여 주는 말이 돼요.", "for tonight", "여기 당신 언어로 된 식단 목록이 있어요.", "여기 당신 언어로 된 약물 영상이 있어요.", "medication", "diet", "exercise", "visitor"]
  - ["투여 시연 요청", pill, "Show me는 말로 답하는 대신 직접 해 보라는 요청이에요. how you'd give는 가정형이라 아직 틀려도 괜찮은 연습이라는 느낌을 줘요.", "with a spoon", "이 약을 어떻게 보관할지 보여주세요.", "이 용량을 언제 줄지 보여주세요.", "give", "store", "stop", "refill"]
  - ["되말하기 요청", speech, "Tell me back의 back이 들은 내용을 되돌려 말하라는 뜻이에요. when you'd call the doctor가 말하게 할 구체적인 내용을 정해요.", "in your words", "언제 의사에게 전화할지 다시 적어보세요.", "어떻게 의사에게 전화할지 다시 말해보세요.", "back", "later", "first", "twice"]
  - ["그림 안내", board, "pictures for each medicine은 글을 못 읽어도 약을 구별할 수 있게 해 줘요. each를 붙여서 약마다 하나씩 있다는 점을 알려요.", "in each row", "이 안내지에는 약마다 이름이 있어요.", "이 안내지에는 약마다 색이 있어요.", "pictures", "prices", "colors", "stamps"]
  - ["투여 연습", play, "Let's practice는 함께 연습하자는 제안이라 틀려도 되는 분위기를 만들어요. measuring이 정확히 재는 동작을 연습한다는 뜻이에요.", "with water", "용량 재는 것을 함께 읽어봐요.", "약 먹는 것을 함께 연습해봐요.", "measuring", "ordering", "storing", "pricing"]
  - ["누락 대처 질문", bulb, "What would you do는 지시가 아니라 가정 질문이에요. 환자가 어떻게 생각하는지 알아보고 필요한 부분만 바로잡을 수 있어요.", "last night", "용량이 남았다면 어떻게 하시겠어요?", "용량을 잃어버렸다면 어떻게 하시겠어요?", "missed", "doubled", "dropped", "spilled"]
  - ["연락 안내", bell, "Call this number는 짧은 명령형이라 언어가 서툴러도 이해하기 쉬워요. if anything feels wrong이 모호하지만 넓은 조건이라 작은 이상도 연락해도 된다는 뜻이에요.", "any time", "약이 떨어지면 이 번호로 전화하세요.", "비용이 걱정되면 이 번호로 전화하세요.", "wrong", "empty", "cold", "heavy"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 약물 교육 4문장 순서
    why: 약물 목록을 건네고, 함께 용량 재기를 연습하고, 연습한 뒤 직접 투여를 보여 달라고 한 다음, 마지막에 의사에게 전화할 때를 되말하게 해요.
    lines:
    - ["Here's the medication list in your language.", pill, "여기 당신 언어로 된 약물 목록이 있어요", "자료 건넴"]
    - ["Let's practice measuring the dose together, using that list.", play, "그 목록으로 용량 재는 것을 함께 연습해봐요", "함께 연습"]
