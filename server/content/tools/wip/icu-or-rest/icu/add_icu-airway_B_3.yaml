situations:
- title: 예상 어려운 기도 준비
  s:
  - ["장비 준비", gear, "'Let's have … ready'는 함께 준비해 두자는 제안이라 명령처럼 들리지 않아요. 어려운 기도가 예상되면 첫 시도부터 보조 장비를 곁에 둬요.", "in the hallway", "비디오 후두경과 흡인기를 준비해 둬요.", "일반 후두경과 부지를 준비해 둬요.", "laryngoscope", "stethoscope", "bronchoscope", "otoscope"]
  - ["대비책 준비", shield, "'as a rescue option'은 주된 계획이 안 될 때 쓰는 대안이라는 뜻을 밝혀요. 성문상 기도기는 삽관이 막힐 때 넣는 백업이에요.", "as a first choice", "구조 옵션으로 흡인 카테터를 준비해 둘게요.", "구조 옵션으로 비강 캐뉼라를 준비해 둘게요.", "supraglottic", "subglottic", "nasopharyngeal", "tracheal"]
  - ["계획 합의", compass, "'agree on'은 한 사람이 정하는 게 아니라 팀이 같이 정한다는 뜻이에요. 실패 때 무엇으로 넘어갈지 미리 정해야 위기에 망설이지 않아요.", "with the family", "시작하기 전에 계획 A, B, C를 기록해요.", "시작하기 전에 계획 A, B, C를 외워요.", "agree", "vote", "report", "comment"]
  - ["상황 판단", magnify, "'looks'는 단정하지 않고 보이는 대로 판단을 말하는 표현이에요. 'so'로 이유와 행동을 이어 팀이 장비를 더 가져오는 까닭을 이해해요.", "because he is awake", "기도가 까다로워 보여서 예비 약물을 가져오고 있어요.", "목이 까다로워 보여서 예비 장비를 가져오고 있어요.", "tricky", "dry", "quiet", "clean"]
  - ["역할 분담", speech, "'talk through'는 한 단계씩 짚어 말한다는 뜻이에요. 'who does what'은 역할을 하나씩 정해 위기에서 서로 겹치거나 비지 않게 해요.", "if he wakes up", "첫 시도가 실패하면 누가 무엇을 쓸지 미리 이야기해요.", "두 번째 시도가 실패하면 누가 무엇을 할지 미리 이야기해요.", "fails", "stops", "ends", "starts"]
  - ["카트 위치", pushpin, "'within reach'는 팔을 뻗으면 닿는 거리를 말해요. 카트가 멀면 실패한 순간 장비를 가지러 가느라 시간을 잃어요.", "outside the door", "응급 약물 카트를 손 닿는 곳에 둘게요.", "어려운 기도 카트 뚜껑을 손 닿는 곳에 둘게요.", "reach", "sight", "hearing", "limit"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 어려운 기도 준비 4문장 순서
    why: 기도가 까다롭다는 판단을 먼저 알리고, 그에 맞춰 예비 장비를 챙기고, 실패 때의 역할을 정한 뒤 카트 위치까지 정해요.
    lines:
    - ["His airway looks tricky, so we're bringing backup gear.", magnify, "기도가 까다로워 보여서 예비 장비를 가져오고 있어요", "판단"]
    - ["I'll set up a supraglottic airway with that gear as a rescue option.", shield, "그 장비와 함께 구조 옵션으로 성문상 기도기를 준비해 둘게요", "준비"]
    - ["Let's talk through who does what if the first attempt fails.", speech, "첫 시도가 실패하면 누가 무엇을 할지 이야기해요", "역할"]
    - ["I'll keep all of it within reach of the bed.", pushpin, "그 모두를 침대에서 손 닿는 곳에 둘게요", "배치"]
- title: 삽관 전 전산소화·apneic 산소
  s:
  - ["전산소화", stetho, "'to build a reserve'로 목적을 붙여요. 폐에 산소를 채워 두면 숨이 멈춘 동안 더 오래 버텨요.", "with a warm blanket", "몇 번 전산소화해서 예비량을 쌓아 둘게요.", "몇 분간 전산소화해서 예비량을 알려 둘게요.", "reserve", "plan", "routine", "history"]
  - ["apneic 산소", monitor, "'leave … on'은 삽관하는 동안에도 떼지 않는다는 지시예요. 숨이 멈춘 동안에도 코로 산소가 들어가 포화도가 천천히 떨어져요.", "in the drawer", "apneic 산소화를 위해 안면 마스크는 계속 씌워 둘게요.", "apneic 산소화를 위해 비강 캐뉼라는 계속 닦아 둘게요.", "cannula", "catheter", "bracelet", "clamp"]
  - ["안전 시간", calendar, "'buys us'는 시간을 번다는 비유예요. 'safe time'은 포화도가 위험하게 떨어지기 전까지 쓸 수 있는 시간을 뜻해요.", "less safe time", "이게 삽관 시도 중 더 안전한 장비를 벌어줘요.", "이게 진정 시도 중 더 안전한 시간을 벌어줘요.", "buys", "sells", "takes", "loses"]
  - ["마스크 순서", compass, "'before we push any medication'은 약물보다 마스크가 먼저라는 순서예요. 약을 주면 숨이 멎을 수 있어서 그 전에 산소를 먼저 줘요.", "after we push", "약물을 주입하기 전에 캐뉼라를 씌워 드릴게요.", "약물을 확인하기 전에 마스크를 씌워 드릴게요.", "mask", "gown", "hat", "tape"]
  - ["환자 설명", speech, "'this will help him breathe easier'는 환자가 이해하기 쉬운 이점으로 설명해요. 시작 전에 알리면 마스크가 답답해도 덜 놀라요.", "in a hurry", "시작하기 전에 이게 숨쉬기를 더 힘들게 해 줄 거라고 말해 드려요.", "시작하기 전에 이게 잠들기를 더 편하게 해 줄 거라고 말해 드려요.", "easier", "harder", "louder", "slower"]
  - ["포화도 효과", chartup, "'keeps his sats higher'는 결과를 비교급으로 말해요. 시도하는 동안에도 산소가 들어가니 포화도가 덜 내려가요.", "for the whole day", "캐뉼라로 주는 추가 산소가 시도 중 심박수를 더 높게 유지해 줘요.", "마스크로 주는 추가 산소가 시도 중 산소포화도를 더 높게 유지해 줘요.", "higher", "lower", "faster", "steadier"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 전산소화 4문장 순서
    why: 환자에게 먼저 알린 뒤 마스크로 전산소화하고, 약을 주고 나면 캐뉼라로 산소를 이어 가고, 그 효과를 설명해요.
    lines:
    - ["I tell him this will help him breathe easier before we start.", speech, "시작하기 전에 이게 숨쉬기를 더 편하게 해 줄 거라고 말해 드려요", "설명"]
    - ["I'll put the mask on him to preoxygenate for a few minutes.", stetho, "몇 분간 전산소화하려고 마스크를 씌워 드릴게요", "마스크"]
    - ["Let's leave a nasal cannula on for apneic oxygenation after that.", monitor, "그 뒤에도 apneic 산소화를 위해 비강 캐뉼라는 계속 씌워 둬요", "캐뉼라"]
    - ["The extra oxygen through it keeps his sats higher during the attempt.", chartup, "그걸 통한 추가 산소가 시도 중 포화도를 더 높게 유지해요", "효과"]
- title: 삽관 전후 혈역학 붕괴 대비
  s:
  - ["사전 대비", pill, "'before we start'는 시작 전에 끝낼 일이라는 신호예요. 승압제를 미리 준비하면 혈압이 떨어졌을 때 바로 쓸 수 있어요.", "after we finish", "용적을 최적화하고 승압제를 준비해 둔 다음 마쳐요.", "산소를 최적화하고 승압제를 준비해 둔 다음 시작해요.", "optimize", "estimate", "expand", "explain"]
  - ["위험 설명", shield, "'is common'은 흔한 일이라 놀랄 일이 아니라 미리 준비할 일이라는 뜻이에요. 'so we prepare'로 이유와 행동이 이어져요.", "is rare", "삽관 전후 서맥은 흔해서 즉시 주입식 승압제를 준비해요.", "삽관 전후 저혈압은 흔해서 즉시 주입식 진정제를 준비해요.", "hypotension", "bradycardia", "swelling", "fever"]
  - ["혈압 감시", monitor, "'closely'는 자주, 가까이 본다는 부사예요. 'through the whole process'로 처음부터 끝까지 이어서 본다는 범위를 밝혀요.", "once a day", "전 과정 동안 호흡을 면밀히 지켜볼게요.", "시작 직전에 혈압을 면밀히 지켜볼게요.", "closely", "rarely", "loosely", "briefly"]
  - ["수액 조건", compass, "'if his volume looks low'로 조건을 달면 상태를 보고 판단한다는 뜻이에요. 볼루스는 단시간에 빠르게 넣는 수액이에요.", "if his chart looks full", "용적이 낮아 보이면 수액 볼루스를 확인할게요.", "소변이 적어 보이면 수액 볼루스를 줄게요.", "bolus", "sample", "dressing", "filter"]
  - ["위험 재설명", chartup, "'right after'는 삽관 바로 뒤라는 시점이에요. 마취와 양압 환기가 혈압을 떨어뜨릴 수 있어 끝난 뒤에도 방심하지 않아요.", "long before", "삽관 직후 갑작스러운 서맥은 흔해서 계속 대비해요.", "삽관 직후 갑작스러운 저혈압은 드물어서 계속 대비해요.", "sudden", "gradual", "mild", "late"]
  - ["수치 호출", speech, "'call out'은 크게 소리 내어 알린다는 뜻이에요. 숫자를 말하면 팀원이 모니터를 보지 않아도 변화를 알아요.", "write down", "혈압이 계속 떨어지면 숫자를 큰 소리로 적어 둘게요.", "혈압이 계속 떨어지면 시간을 소리 내어 알릴게요.", "numbers", "names", "orders", "rooms"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 삽관 전후 혈압 대비 4문장 순서
    why: 시작 전에 승압제를 준비하고, 위험이 흔하다고 알린 뒤, 혈압을 계속 지켜보다가, 떨어지면 숫자를 불러요.
    lines:
    - ["Let's have a pressor ready before we start.", pill, "시작하기 전에 승압제를 준비해 둬요", "준비"]
    - ["Sudden hypotension right after intubation is common, so we stay ready.", chartup, "삽관 직후 갑작스러운 저혈압은 흔해서 계속 대비해요", "위험"]
    - ["I'll watch his pressure closely through all of that.", monitor, "그동안 내내 혈압을 면밀히 지켜볼게요", "감시"]
    - ["I'll call out the numbers if it keeps dropping.", speech, "계속 떨어지면 숫자를 소리 내어 알릴게요", "호출"]
- title: 화상·부종 기도 조기 확보 판단
  s:
  - ["조기 삽관", fire, "'so'로 이유(빠른 부종)와 판단(조기 삽관)을 이어요. 화상 기도는 부종이 퍼지면 나중에는 관을 넣기 어려워져요.", "so we wait and see", "기도 화상은 빠르게 식을 수 있어서 조기 삽관이 더 안전해요.", "기도 화상은 빠르게 부을 수 있어서 조기 흡인이 더 안전해요.", "rapidly", "slowly", "rarely", "quietly"]
  - ["경고 징후", siren, "'warning signs'는 지금 행동하라는 신호라는 뜻이에요. 쉰 목소리와 협착음은 기도가 좁아지고 있다는 단서예요.", "to wait and see", "쉰 목소리와 기침은 지금 행동해야 한다는 경고 징후예요.", "쉰 목소리와 협착음은 곧 행동해야 한다는 경고 징후예요.", "stridor", "wheezing", "snoring", "coughing"]
  - ["팀 알림", bell, "'before it closes'는 막히기 전이라는 시한을 말해요. 팀에 먼저 알려야 장비와 인력이 같이 준비돼요.", "after it closes", "기도가 막히기 전에 확보해야 한다고 가족에게 알릴게요.", "기도가 막히기 전에 모니터해야 한다고 팀에 알릴게요.", "secure", "clean", "weigh", "open"]
  - ["예후 설명", magnify, "'could be'는 확정이 아니라 가능성을 말해요. 'once the swelling worsens'는 그때가 되면 달라진다는 조건이에요.", "has been easy", "부종이 심해지면 어려운 기도가 될 수 있어요.", "부종이 가라앉으면 어려운 기도가 될 수 있어요.", "worsens", "settles", "returns", "stops"]
  - ["호출", pager, "'before this gets worse'는 지금 부르는 이유를 시간으로 밝혀요. 기도 문제는 악화되면 선택지가 급격히 줄어요.", "after this gets worse", "더 나빠지기 전에 지금 외과를 호출하고 있어요.", "더 나빠지기 전에 지금 마취과에 기록하고 있어요.", "anesthesia", "radiology", "pharmacy", "security"]
  - ["지체 위험", bell, "'even a little longer'는 조금만 지체해도라는 강조예요. 부종이 진행 중이면 몇 분 차이로 기도가 닫혀요.", "for a long time", "조금만 더 기다려도 호흡이 막힐 수 있어요.", "조금만 더 일해도 기도가 막힐 수 있어요.", "waiting", "working", "resting", "talking"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기도 조기 확보 4문장 순서
    why: 위험한 징후를 먼저 알아채고, 기도 확보가 안전하다는 판단을 말하고, 그에 맞춰 팀을 부른 뒤, 기다리면 위험하다는 이유로 마무리해요.
    lines:
    - ["His hoarse voice and stridor are warning signs to act now.", siren, "쉰 목소리와 협착음은 지금 행동해야 한다는 경고 징후예요", "징후"]
    - ["Airway burns can swell rapidly, so early intubation is safer.", fire, "기도 화상은 빠르게 부을 수 있어서 조기 삽관이 더 안전해요", "판단"]
    - ["I'm calling anesthesia now to help us do that.", pager, "그걸 하도록 돕게 지금 마취과를 호출하고 있어요", "호출"]
    - ["Waiting even a little longer could close off his airway.", bell, "조금만 더 기다려도 기도가 막힐 수 있어요", "이유"]
