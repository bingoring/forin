theme: icu-ards-proning
changes:
- kind: word
  id: w-prone
  fields:
  - ko
  why: ko가 동사구('엎드리다')인데 문장은 prone session·proning·prone responder라 형용사·명사로 쓴다 — 복와위(의)로
- kind: word
  id: w-call
  fields:
  - ko
  why: ko '외치다'는 call the count 한 곳뿐이고 나머지는 부르다·연락하다(call the code, call for help, call the doctor)
- kind: word
  id: w-count
  fields:
  - ko
  why: ko '구령'은 call the count 한 곳뿐 — TOF count(세어진 수)까지 덮도록 '카운트(셈)'로
- kind: word
  id: w-move
  fields:
  - ko
  why: ko '이동시키다'는 타동사 한 가지인데 문장은 moves him·isn't moving·before we move 등 '움직이다'가 대부분
- kind: word
