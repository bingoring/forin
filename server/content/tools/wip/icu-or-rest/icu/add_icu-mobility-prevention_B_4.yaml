situations:
- title: 심부 욕창·감염 위기
  s:
  - ["감염 의심", siren, "'I think'로 확진이 아니라 판단이라고 밝혀요. 깊어진 상처에 악취와 열감이 겹치면 감염을 먼저 의심해요.", "and now it's dry", "이 창상이 넓어졌고 이제 악취와 열감이 있어요 — 감염된 것 같아요.", "이 창상이 깊어졌고 이제 악취와 부종이 있어요 — 감염된 것 같아요.", "foul", "dry", "clean", "pale"]
  - ["소견 보고", monitor, "'with'로 깊이와 악취를 이어 소견을 한 줄에 보고해요. '— this looks'는 눈으로 본 판단을 덧붙여요.", "with fresh blood", "창상이 깊고 붕대에서 악취가 나요 — 감염돼 보여요.", "창상이 깊고 배액에서 피가 나요 — 감염돼 보여요.", "drainage", "bedding", "tubing", "bleeding"]
  - ["상급 보고", pager, "'escalate'는 더 높은 판단권자에게 올린다는 임상 용어예요. 'now'가 붙어 기다리지 않고 바로 한다는 뜻이에요.", "to the wound care", "주치의와 상처팀에게 알리려고 장갑을 껴요.", "주치의와 상처팀에게 알리려고 사진 찍어요.", "team", "bed", "chart", "kit"]
  - ["예상 처치", lab, "'may need'는 아직 결정 전의 가능성을 말해요. 변연절제술은 죽은 조직을 걷어내고 배양은 균을 찾아요.", "and imaging", "변연절제술과 영상검사가 필요할 수도 있어요.", "변연절제술과 수혈이 필요할 수도 있어요.", "cultures", "transfusion", "dialysis", "imaging"]
  - ["즉시 호출", siren, "'because'로 지금 부르는 이유를 말해요. 감염은 시간이 갈수록 퍼져서 기다릴 수 없어요.", "because this pain hurts", "이 가려움은 못 기다리니 지금 주치의를 부를게요.", "이 냄새는 못 기다리니 지금 주치의를 부를게요.", "wait", "heal", "hide", "shrink"]
  - ["결정 주체", handshake2, "'will decide'는 결정권이 상처팀에 있다는 말이에요. 간호사는 소견을 보고하고 처치 범위는 팀이 정해요.", "if he needs imaging", "배양검사가 필요한지는 상처팀이 결정할 거예요.", "영상검사가 필요한지는 상처팀이 결정할 거예요.", "debridement", "imaging", "dialysis", "transfusion"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 심부 욕창 감염 4문장 순서
    why: 소견을 말하고, 감염 의심과 함께 바로 주치의를 부르고, 필요할 처치를 미리 말한 뒤, 결정은 상처팀이 한다고 마무리해요.
    lines:
    - ["This wound has gone deep, and now it's foul and warm.", siren, "이 창상이 깊어졌고 이제 악취와 열감이 있어요", "소견"]
    - ["I think it's infected, so I'm calling the provider now.", pager, "감염된 것 같아서 지금 주치의를 부르고 있어요", "호출"]
    - ["We may need cultures and debridement.", lab, "배양검사와 변연절제술이 필요할 수도 있어요", "예상"]
    - ["The wound team will decide on the debridement.", handshake2, "변연절제술은 상처팀이 결정할 거예요", "결정"]
- title: 조기 이동 중 급성 악화
  s:
  - ["악화 대응", siren, "'just'로 방금 일어난 일임을 알려요. 일어서면 혈압과 산소가 떨어질 수 있어서 앉히는 것이 첫 대응이에요.", "as she walked", "걷자마자 산소포화도가 떨어져서 지금 다시 앉힐게요.", "돌아서자마자 산소포화도가 떨어져서 지금 다시 앉힐게요.", "stood", "coughed", "sneezed", "yawned"]
  - ["중단과 앉히기", siren, "'we're stopping and sitting'으로 두 행동을 한 번에 말해 팀이 바로 따라요. 앞의 대시가 이유와 행동을 갈라 줘요.", "Her pulse is rising", "혈압이 떨어지고 있어요 — 멈추고 앉힐게요.", "맥박이 올라가고 있어요 — 멈추고 앉힐게요.", "dropping", "rising", "climbing", "holding"]
  - ["눕히고 산소", stetho, "명령형 'Get'과 'increase'로 두 지시를 짧게 이어요. 위급할 때는 지시가 짧을수록 팀이 바로 움직여요.", "back to the chair", "침대로 다시 눕히려고 난간을 내려 주세요.", "침대로 다시 눕히려고 베개를 옮겨 주세요.", "bed", "stretcher", "lobby", "cafeteria"]
  - ["재확인", monitor, "'full set of vitals'는 일부가 아니라 전부를 본다는 말이에요. 한 가지가 떨어지면 다른 수치도 같이 봐요.", "her last set", "활력징후를 다시 확인하려고 장갑을 껴요.", "활력징후를 다시 확인하려고 팔을 걷어요.", "full", "half", "small", "brief"]
  - ["중단 보고", pencil, "'the moment'는 알아챈 즉시라는 뜻이에요. 과거형 보고는 이미 멈췄다는 사실을 팀에 전해요.", "the moment she sat", "산소포화도가 떨어지는 순간 식사를 멈췄어요.", "산소포화도가 떨어지는 순간 면회를 멈췄어요.", "mobility", "bathing", "feeding", "visiting"]
  - ["안정 확인", check, "'now that'은 원인이 해소된 결과를 말해요. 침대로 돌아와 눕자 수치가 회복됐다는 인과예요.", "now that she's up", "다시 침대로 돌아오니 통증이 가라앉았어요.", "다시 침대로 돌아오니 졸음이 가라앉았어요.", "stable", "low", "high", "irregular"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이동 중 악화 4문장 순서
    why: 산소포화도가 떨어져 멈추고 앉히고, 침대로 눕혀 산소를 늘리고, 활력징후를 다시 확인한 뒤, 안정됐음을 보고해요.
    lines:
    - ["Her sats are dropping — we're stopping and sitting her down.", siren, "산소포화도가 떨어지고 있어요 — 멈추고 앉힐게요", "중단"]
    - ["With her sitting, get her back to bed and increase her oxygen.", stetho, "앉았으니 침대로 눕히고 산소를 늘려주세요", "조치"]
    - ["I'm rechecking her full set of vitals now.", monitor, "지금 전체 활력징후를 다시 확인하고 있어요", "재확인"]
    - ["Her vitals are stable now that she's back in bed.", check, "다시 침대로 돌아오니 활력징후가 안정적이에요", "결과"]
- title: 이동 중 낙상·손상 위기
  s:
  - ["부드럽게 눕히기", siren, "'ease'는 충격 없이 천천히 내린다는 뜻이에요. 쓰러지는 사람을 붙잡아 세우면 둘 다 다쳐서 바닥으로 안내해요.", "so let's lift her", "쓰러지고 있으니 침대로 부드럽게 눕혀요.", "쓰러지고 있으니 의자로 부드럽게 눕혀요.", "floor", "bed", "chair", "stretcher"]
  - ["머리 보호", siren, "명령형 문장 둘을 'and'로 이어 지시를 짧게 해요. 낙상에서는 머리 손상이 가장 위험해서 머리를 먼저 지켜요.", "and protect her back", "머리를 보호하려고 담요를 접으세요.", "머리를 보호하려고 수건을 가져오세요.", "head", "knees", "ankles", "wrists"]
  - ["움직임 금지", lock, "'until I check'으로 금지 기간을 확인이 끝날 때까지로 한정해요. 손상을 모른 채 움직이면 척추나 뼈를 더 다칠 수 있어요.", "until she's calm", "차트를 확인할 때까지 움직이지 마세요.", "혈압을 확인할 때까지 움직이지 마세요.", "injury", "allergy", "fever", "rash"]
  - ["도움과 사정", pager, "'call for help'를 먼저 말하면 혼자 감당하지 않겠다는 뜻이에요. 'head to toe'는 머리부터 발끝까지 빠짐없이 본다는 말이에요.", "and assess her heart", "도움을 요청하고 머리부터 어깨까지 사정할게요.", "도움을 요청하고 허리부터 발끝까지 사정할게요.", "head", "waist", "knee", "chin"]
  - ["이동 전 확인", magnify, "'before we move her'로 확인이 이동보다 먼저라는 순서를 말해요. 머리 손상은 겉으로 안 보일 수 있어서 낌새를 찾아요.", "after we move her", "머리의 손상을 확인하려고 장갑을 끼고 있어요.", "머리의 손상을 확인하려고 조명을 켜고 있어요.", "injury", "allergy", "infection", "illness"]
  - ["신속 대응 보고", check, "'right away'로 지체 없이 했다고 보고해요. 'stayed with her'는 환자를 혼자 두지 않았다는 말이에요.", "right after", "바로 베개를 요청하고 곁을 지켰어요.", "바로 담요를 요청하고 곁을 지켰어요.", "help", "pillow", "blanket", "water"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이동 중 낙상 대응 4문장 순서
    why: 바닥으로 부드럽게 눕히고, 머리를 보호한 뒤, 도움을 요청하고 머리부터 발끝까지 사정하고, 그 확인이 끝날 때까지 움직이지 말라고 해요.
    lines:
    - ["She's going down, so let's ease her to the floor.", siren, "쓰러지고 있으니 바닥으로 부드럽게 눕혀요", "눕히기"]
    - ["With her down, keep her head protected.", siren, "눕혔으니 머리를 보호해 주세요", "보호"]
    - ["I'll call for help and assess her from head to toe.", pager, "도움을 요청하고 머리부터 발끝까지 사정할게요", "사정"]
    - ["Until I finish that, don't move her.", lock, "그게 끝날 때까지 움직이지 마세요", "금지"]
- title: 급성 폐색전 발생 위기
  s:
  - ["급성 증상", siren, "'suddenly'로 갑작스러움을 강조하고 세 증상을 'with'와 'and'로 이어 한 번에 보고해요. 갑자기 숨이 차고 가슴이 아프면 폐색전을 의심해요.", "and his pulse crashed", "갑자기 숨을 헐떡이며 등 결림이 있고 산소포화도가 급락했어요.", "갑자기 숨을 헐떡이며 두통이 있고 산소포화도가 급락했어요.", "gasping", "snoring", "sneezing", "sleeping"]
  - ["폐색전 의심", stetho, "증상 셋을 쉼표로 나열하고 대시 뒤에 걱정을 말해요. 'I'm worried about'은 확진 전의 우려를 정중하게 전해요.", "I'm worried about a DVT", "갑작스러운 호흡곤란, 가슴 통증, 저산소증 — 폐렴이 걱정돼요.", "갑작스러운 호흡곤란, 가슴 통증, 저산소증 — 패혈증이 걱정돼요.", "PE", "UTI", "ulcer", "rash"]
  - ["즉시 대응", siren, "'giving'과 'calling'을 'and'로 이으면 두 가지를 동시에 한다는 말이에요. 신속대응팀은 악화가 의심될 때 부르는 팀이에요.", "and calling the code team", "고유량 산소를 주려고 마스크를 꺼내고 있어요.", "신속대응팀을 부르려고 번호를 찾고 있어요.", "rapid", "slow", "quiet", "routine"]
  - ["요청", pager, "'We need'으로 필요한 것을 팀 전체의 일로 말해요. 'now'가 붙어 기다릴 수 없다는 뜻이에요.", "and the provider in the hall", "지금 영상검사와 주치의가 복도에 필요해요.", "지금 영상검사와 주치의가 간호사실에 필요해요.", "bedside", "hallway", "station", "entrance"]
  - ["걱정 표현", faceWorried, "'I'm worried'는 확정 전의 우려를 공손하게 말해요. 'means'는 앞의 증상이 어떤 뜻일지 짚어요.", "I'm worried this sudden fever", "이 갑작스러운 저산소증이 폐렴을 뜻할까 봐 걱정돼요.", "이 갑작스러운 통증이 폐색전을 뜻할까 봐 걱정돼요.", "hypoxia", "hives", "itching", "fatigue"]
  - ["호출 보고", check, "'the moment'는 알아챈 즉시라는 뜻이에요. 과거형 보고는 이미 불렀다는 사실을 전해요.", "the moment his pulse crashed", "혈압이 급락하는 순간 신속대응팀을 불렀어요.", "맥박이 급락하는 순간 신속대응팀을 불렀어요.", "crashed", "rose", "settled", "steadied"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 급성 폐색전 의심 4문장 순서
    why: 증상을 보고하고, 폐색전 우려를 말하고, 그 우려에 따라 산소와 신속대응을 시작한 뒤, 영상검사와 주치의를 요청해요.
    lines:
    - ["He's suddenly gasping with chest pain and his sats crashed.", siren, "갑자기 숨을 헐떡이며 가슴 통증이 있고 산소포화도가 급락했어요", "증상"]
    - ["I'm worried this sudden hypoxia means a PE.", faceWorried, "이 갑작스러운 저산소증이 폐색전을 뜻할까 봐 걱정돼요", "우려"]
    - ["Because of that worry, I'm giving high-flow oxygen and calling the rapid response.", pager, "그 우려 때문에 고유량 산소를 주고 신속대응팀을 부르고 있어요", "대응"]
    - ["On top of that, we need imaging and the provider at the bedside now.", lab, "그에 더해 지금 영상검사와 주치의가 침상에 필요해요", "요청"]
- title: 이동 중 라인·튜브 이탈 위기
  s:
  - ["이탈 확인", siren, "'got yanked'는 의도치 않게 확 당겨졌다는 구어체예요. 'what came out'은 어떤 라인이 빠졌는지 모르는 상태라는 뜻이에요.", "in the shower", "옮기는 중에 라인이 당겨졌으니 뭐가 꼬였는지 확인해요.", "옮기는 중에 라인이 당겨졌으니 뭐가 새는지 확인해요.", "transfer", "shower", "meal", "visit"]
  - ["압박 지혈", siren, "대시 앞뒤로 상황과 행동을 나눠요. 'holding firm pressure'로 빠진 자리를 단단히 눌러 출혈을 막고 있다고 알려요.", "I'm holding firm tape", "동맥관이 빠졌어요 — 지금 세게 압박하고 있어요.", "투석관이 빠졌어요 — 지금 세게 압박하고 있어요.", "pulled", "clotted", "capped", "flushed"]
  - ["다른 관 확인", magnify, "'Check whether'는 결과를 모르는 상태에서 확인하라는 지시 틀이에요. 한 줄이 당겨졌으면 다른 관도 같이 빠졌을 수 있어요.", "or the chest tube", "배액관이나 급식관이 막혔는지 확인하세요.", "배액관이나 급식관이 샜는지 확인하세요.", "dislodged", "clogged", "leaked", "kinked"]
  - ["주치의 호출", pager, "'so we can'으로 부르는 목적을 붙여요. 중심정맥관 같은 접근로는 다시 확보하려면 처방과 시술이 필요해요.", "so we can chart it", "처방을 받을 수 있게 주치의를 불러주세요.", "설명을 들을 수 있게 주치의를 불러주세요.", "access", "tubing", "dressing", "tape"]
  - ["추가 확인", magnify, "'too'는 이미 확인한 것에 더해 또 본다는 뜻이에요. 같은 이동 중에 여러 관이 함께 빠질 수 있어요.", "came out first", "배액관이나 급식관도 같이 막혔는지 확인하고 있어요.", "배액관이나 급식관도 같이 샜는지 확인하고 있어요.", "too", "first", "twice", "alone"]
  - ["침상 요청", pager, "'to re-secure the line'으로 의사가 와야 하는 이유를 붙여요. 라인 재확보는 간호사가 혼자 하지 않는 처치예요.", "at the nurses' desk", "라인을 재확보하려면 복도에 주치의가 필요해요.", "라인을 재확보하려면 간호사실에 주치의가 필요해요.", "bedside", "elevator", "entrance", "lobby"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이동 중 라인 이탈 4문장 순서
