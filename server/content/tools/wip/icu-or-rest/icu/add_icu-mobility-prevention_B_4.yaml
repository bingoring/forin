  - ["솔직한 대화", speech, "'honestly'는 완곡하게 돌리지 않고 터놓고 말하겠다는 신호예요. 'I want to talk'로 대화 제안을 부드럽게 해요.", "openly about", "그의 전반적인 체중에 대해 솔직히 이야기하고 싶어요.", "그의 전반적인 일정에 대해 솔직히 이야기하고 싶어요.", "honestly", "quickly", "briefly", "loudly"]
  - ["편안함 중심", star, "'together'로 함께 간다는 동행의 뜻을 전해요. 목표가 치유에서 편안함과 존엄으로 옮겨 갈 때 쓰는 말이에요.", "on his schedule", "그의 체중과 존엄성에 함께 집중해요.", "그의 편안함과 일정에 함께 집중해요.", "comfort", "recovery", "progress", "cure"]
  - ["현실과 지지", faceWorried, "'I know … but'으로 현실을 인정한 뒤 지지를 말해요. 'we're not giving up on his comfort'는 포기가 아니라 방향을 바꾼다는 말이에요.", "we're not giving up on his heart", "현실적인 이야기라는 걸 알지만, 수면을 포기하지 않는다는 것도 알아주셨으면 해요.", "현실적인 이야기라는 걸 알지만, 방문을 포기하지 않는다는 것도 알아주셨으면 해요.", "realistic", "casual", "random", "brief"]
