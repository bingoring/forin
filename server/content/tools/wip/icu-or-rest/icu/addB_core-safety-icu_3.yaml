  - ["라인 위장", pushpin, "Secure and camouflage처럼 동사 둘이 같은 목적어를 나눠 써요. out of easy reach는 손이 쉽게 닿지 않는 곳이라는 숙어예요.", "his snacks", "가방을 고정하고 손 닿기 어렵게 위장해요.", "식판을 고정하고 손 닿기 어렵게 위장해요.", "camouflage", "label", "measure", "replace"]
  - ["수면·소음", bulb, "Reduce와 keep 두 명령을 and로 이어 환경과 리듬을 함께 다뤄요. regular는 매일 비슷한 시간에 자고 깨는 일정함을 뜻해요.", "his snack time regular", "소음을 줄이고 면회 시간을 규칙적으로 유지해요.", "먼지를 줄이고 수면 주기를 규칙적으로 유지해요.", "noise", "dust", "waste", "smoke"]
  - ["행동 이유", faceWorried, "because 절로 행동의 이유를 환자 입장에서 풀어 줘요. 문제 행동이 아니라 혼란의 결과라고 보는 설명이에요.", "He's whispering", "그게 뭔지 몰라서 라인을 노려보고 있는 거예요.", "그게 아파서 라인을 움켜쥐고 있는 거예요.", "grabbing", "staring", "pointing", "waving"]
  - ["시계·달력", calendar, "can help him은 확실한 보장이 아니라 도움이 될 수 있다는 정도의 표현이에요. stay oriented가 한 번 알려 주는 게 아니라 계속 유지하는 것임을 말해요.", "stay warm", "낮 동안 시계와 달력이 식욕을 유지하는 데 도움이 돼요.", "낮 동안 라디오와 달력이 지남력을 유지하는 데 도움이 돼요.", "oriented", "hydrated", "warm", "quiet"]
  - ["위장 효과", pushpin, "If 절의 조건 뒤에 less likely to로 확률이 낮아진다고 말해 보장하지 않는 어조를 지켜요. under his gown이 위장 위치예요.", "beside his tray", "담요 아래로 라인을 위장하면 잡아당길 가능성이 줄어요.", "가운 아래로 라인을 위장하면 넘어질 가능성이 줄어요.", "pull", "count", "wash", "tape"]
  - ["야간 환경", star, "at night로 시간대를 못 박고 so … can reset로 목적을 붙여요. reset은 흐트러진 리듬이 다시 맞춰진다는 뜻이에요.", "at lunch", "밤에는 방을 따뜻하게 해서 수면 주기가 재설정되도록 해요.", "밤에는 방을 조용히 해서 회의 주기가 재설정되도록 해요.", "reset", "expire", "shrink", "fail"]
