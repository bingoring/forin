- title: 투약 오류 예방 시스템
  s:
  - ["오버라이드 주의", siren, "Don't override로 막고 without verifying으로 예외 조건을 붙여, 검증이 먼저라는 순서를 만들어요. order and dose가 검증 대상 둘이에요.", "the paper and pen", "용량과 처방을 검증하지 않고는 제출하고 진행하지 마세요.", "용량과 처방을 검증하지 않고는 접수하고 진행하지 마세요.", "verifying", "printing", "copying", "filing"]
  - ["약물 라이브러리", gear, "is there to + 동사는 존재 이유를 목적으로 말하는 틀이에요. catch errors는 사람이 놓친 것을 시스템이 한 번 더 잡는다는 뜻이에요.", "save paper", "펌프의 약물 라이브러리는 종이를 아끼려고 있는 거예요.", "펌프의 전원 코드는 오류를 잡아내려고 있는 거예요.", "catch", "create", "repeat", "spread"]
  - ["농도 확인", lab, "Let's는 함께 하자는 제안이고 before we proceed가 진행 전이 기한임을 알려요. 같은 약도 농도가 다를 수 있어서 따로 확인해요.", "the parking", "진행하기 전에 날씨를 확인해요.", "진행하기 전에 요금을 확인해요.", "proceed", "eat", "leave", "rest"]
  - ["하드 리밋", siren, "Stop을 먼저 외쳐 행동을 멈추게 하고, a hard limit, not a soft one으로 종류를 대비해 이유를 대요. so we don't override it은 그 이유에서 나온 규칙이에요.", "that's a hard floor,", "앉아요, 그건 하드 리밋이지 소프트 리밋이 아니라서 무시하고 넘어가지 않아요.", "멈춰요, 그건 하드 리밋이지 소프트 리밋이 아니라서 복사하지 않아요.", "hard", "high", "low", "new"]
  - ["경고 확인", siren, "flagged A as B는 시스템이 A를 B라고 표시했다는 말이에요. let's not just click past it은 비난 대신 우리가 함께 멈추자는 형태예요.", "this battery", "펌프가 이 배터리를 비정상적으로 낮다고 표시했어요, 그냥 넘기지 말아요.", "모니터가 이 용량을 비정상적으로 높다고 표시했어요, 그냥 넘기지 말아요.", "flagged", "ordered", "labeled", "doubled"]
  - ["검증 생략 위험", shield, "Every + 명사 + we skip verifying에서 skip verifying이 문제의 행동이에요. a chance for the system to miss는 안전망이 뚫릴 가능성을 말해요.", "to save a minute", "검증을 건너뛰고 무시할 때마다 시스템이 오류를 기록할 기회가 돼요.", "검증을 건너뛰고 출력할 때마다 시스템이 오류를 놓칠 기회가 돼요.", "miss", "fix", "name", "hide"]
  - ["믿되 확인", check, "Trust A, but still B는 시스템을 믿으면서도 사람의 확인을 놓지 않는 균형 문장이에요. yourself가 확인을 남에게 맡기지 않는다는 뜻을 강조해요.", "the menu", "라이브러리를 닫되, 그래도 직접 농도를 확인하세요.", "라이브러리를 믿되, 그래도 직접 요금을 확인하세요.", "yourself", "quickly", "twice", "silently"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 투약 오류 예방 4문장 순서
    why: 라이브러리가 오류를 잡는 안전망이라는 사실로 시작하고, 그래도 직접 농도를 확인하라고 잇고, 경고가 뜨면 멈추고 검증하고, 검증 없이는 넘어가지 않는다고 닫아요.
    lines:
    - ["The pump's drug library is there to catch errors.", gear, "펌프의 약물 라이브러리는 오류를 잡으려고 있어요", "안전망"]
    - ["Still, it can't replace us, so confirm the concentration yourself.", lab, "그래도 우리를 대신하진 못하니 직접 농도를 확인하세요", "확인"]
    - ["On top of that check, if it flags a dose as unusually high, stop and verify the order and dose.", siren, "그 확인에 더해 용량이 비정상적으로 높다고 표시되면 멈추고 처방과 용량을 검증해요", "경고"]
    - ["Without that verification, we never override it.", shield, "그 검증 없이는 절대 무시하고 넘어가지 않아요", "금지"]
- title: 이중확인·독립확인 프로토콜
  s:
  - ["독립확인 정의", check, "means 뒤에 정의를 놓아 독립확인이 무엇인지 풀어 줘요. separately가 핵심이라 두 사람이 각자 따로 확인한다는 뜻이에요.", "A fire drill", "독립확인은 우리가 따로따로 출근한다는 뜻이에요.", "독립확인은 우리가 따로따로 퇴근한다는 뜻이에요.", "separately", "quickly", "loudly", "slowly"]
  - ["각자 확인", pill, "We each로 한 명씩 따로 한다는 주어를 만들고, without prompting으로 상대의 힌트 없이를 못 박아요. 상대 답을 미리 들으면 독립이 깨져요.", "with a pen", "마스크 없이 각자 약물, 용량, 펌프를 확인해요.", "장갑 없이 각자 약물, 용량, 펌프를 확인해요.", "drug", "tray", "floor", "wall"]
  - ["필수 절차", shield, "is required for all로 예외 없는 규칙임을 말해요. high-alert medications는 실수하면 해가 큰 약을 묶어 부르는 병원 용어예요.", "hospital visitors", "이건 모든 신입 간호사 교육에 요구되는 절차예요.", "이건 모든 high-alert 환자에게 요구되는 절차예요.", "medications", "departments", "volunteers", "appointments"]
  - ["의미 풀기", speech, "I mean은 방금 한 말을 더 쉬운 말로 풀어 주는 연결어예요. each of us checks it alone이 앞의 independent check를 설명해요.", "a new pen", "이건 허락이 필요해요, 그러니까 각자 따로 확인한다는 뜻이에요.", "이건 독립확인이 필요해요, 그러니까 각자 따로 퇴근한다는 뜻이에요.", "alone", "early", "slowly", "daily"]
  - ["구분하기", magnify, "Not A — B 구조로 틀린 방식을 먼저 부정하고 맞는 방식을 대시 뒤에 둬요. peek at은 몰래 본다는 뜻이라 독립성이 깨지는 행동을 가리켜요.", "share one pen", "서로 도시락을 훔쳐보는 이중확인이 아니라, 독립확인이에요.", "서로 숫자를 훔쳐보는 이중확인이 아니라, 자동확인이에요.", "numbers", "shoes", "hands", "lunches"]
  - ["순서 안내", speech, "first와 then이 말하는 순서를 못 박아요. your own way는 상대가 자기 방식대로 확인한다는 뜻이에요.", "in the hallway", "제가 먼저 메뉴를 소리 내어 말하고, 그다음 당신 방식대로 확인하세요.", "제가 먼저 용량을 소리 내어 말하고, 그다음 당신 방식대로 외우세요.", "dose", "menu", "news", "joke"]
  - ["대상 약물", pill, "like 뒤에 예를 들어 high-alert의 범위를 구체화해요. always가 예외를 두지 않는다는 뜻이에요.", "like towels and gloves", "인슐린이나 비타민 같은 high-alert 약물은 항상 이 추가 단계를 거쳐요.", "인슐린이나 헤파린 같은 high-alert 약물은 항상 이 추가 서류를 거쳐요.", "insulin", "saline", "aspirin", "vitamin"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 독립확인 4문장 순서
    why: 독립확인이 무엇인지 먼저 정의하고, 그래서 서로의 숫자를 미리 보지 않고, 끝나면 각자 결과를 처방과 맞춰 보고, 일치 여부에 따라 서명하거나 멈춰요.
    lines:
    - ["An independent double-check means we each verify separately.", check, "독립확인은 우리가 각자 따로 확인한다는 뜻이에요", "정의"]
    - ["So neither of us hears or sees the other's numbers first.", magnify, "그래서 서로의 숫자를 먼저 듣거나 보지 않아요", "규칙"]
    - ["Once we've each finished, we compare our two results against the order.", board, "각자 끝나면 두 결과를 처방과 맞춰 봐요", "대조"]
    - ["If they match, we sign; if not, we stop and recheck.", pencil, "일치하면 서명하고, 아니면 멈추고 다시 확인해요", "서명"]
