theme: icu-pain-nonverbal
changes:
- kind: word
  id: w-tolerance
  fields:
  - ko
  why: ko '순응(견딤)'은 태그된 문장 3개 중 2개(오피오이드 내성)와 안 맞는다 — 인공호흡기를 견디는 뜻도 담도록 '내성(견딤)'으로
- kind: word
  id: w-score
  fields:
  - ko
  why: 문장 대부분(his score dropped, compare this score)이 명사 쓰임이라 ko를 '점수(를 매기다)'로
- kind: word
  id: w-level
  fields:
  - ko
  why: 문장(his level should be near peak)이 약 농도를 뜻해 ko '수준'을 '농도'로
- kind: word
  id: w-rate
  fields:
  - ko
  why: respiratory rate·heart rate의 rate는 '수치'가 아니라 분당 횟수라 ko를 '분당 횟수'로
- kind: word
  id: w-drug
  fields:
  - ko
  why: ko '약물'이 w-medication '약물'과 같아 듣고 뜻 고르기에서 정답이 둘이 된다 — drug는 '약품'으로 가름
- kind: word
  id: w-little
  fields:
  - ko
  why: ko '적은'이 w-few '적은'과 같아 정답이 둘이 된다 — little(양)은 '적은 양의'로 가름
- kind: word
  id: w-few
  fields:
  - ko
  why: ko '적은'이 w-little '적은'과 같아 정답이 둘이 된다 — few(수)는 '적은 수의'로 가름
- kind: word
  id: w-schedule
  fields:
  - ko
  why: ko '정규 일정'은 on schedule·scheduled dosing(정해진 시간에 맞춘)을 못 담는다 — '정해진 일정'으로
- kind: word
  id: w-tense
  fields:
  - en
  - ipa
  why: 활용형 헤드워드(tensing)를 원형 tense로
- kind: word
  id: w-premedicate
  fields:
  - en
  - ipa
  why: 활용형 헤드워드(pre-medicating)를 원형 pre-medicate로
