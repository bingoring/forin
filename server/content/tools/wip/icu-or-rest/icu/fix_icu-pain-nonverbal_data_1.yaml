# 단어 수정 (A: C·D절). dEn=distractorsEn, dKo=distractorsKo
remove: [w-level, w-oversedated]
add_before:
  w-respond:
    id: w-time
    en: time
    ipa: "/taɪm/"
    ko: "시간을 맞추다"
    icon: calendar
    example: "We'll time the dose to peak during the procedure."
    exKo: "처치 중에 효과가 최고조에 이르도록 투여 시간을 맞출게요."
    cue: "약 효과가 가장 셀 때 처치가 겹치도록 투여 시점을 미리 계산해 두는 동사"
    tag: "투여·기록"
    distractorsEn: [tame, tune]
    distractorsKo: ["양을 맞추다", "순서를 바꾸다"]
    chips: [[time]]
    decoyChips: [tine]
words:
  # ---- distractorsEn 품사 맞춤 (A C절 22번 표)
  w-furrow: {dEn: [furl, burrow]}
