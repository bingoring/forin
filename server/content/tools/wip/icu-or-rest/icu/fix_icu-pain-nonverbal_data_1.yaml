  w-rule:
    en: "rule out"
    ipa: "/ruːl aʊt/"
    chips: [[rule], [out]]
    dEn: ["roll out", "rule in"]
    decoyChips: [mule, our]
    cue: "검사로 가능성을 하나씩 지워 없애는 일"
