# 뉘앙스·order 수정. 상황 번호 -> nuance(index -> 통째 교체 또는 필드 패치), order(필드 패치)
nuance:
  0:
    1:
      replace:
        kind: context
        words: [w-squiggle]
        word: squiggle
        ko: 삐뚤빼뚤한 선
        scenes:
          - {who: 간호사끼리, icon: monitor, en: "That squiggle in lead II is just him moving his arm.", ok: true}
          - {who: 환자에게, icon: me, en: "Some of that squiggle is just movement, not your heart.", ok: true}
          - {who: 차트 기록, icon: board, en: "Squiggle noted in lead II; rhythm unclear.", ok: false, fix: "Motion artifact in lead II; underlying rhythm sinus."}
        why: squiggle은 환자·동료와 말할 때 쉬운 말이지만, 차트에는 motion artifact처럼 정확한 용어로 남겨요.
  2:
    1:
      scene_patch:
        1: {en: "Amiodarone infusing at the ordered rate; HR 118."}
  5:
    1:
      replace:
        kind: context
        words: [w-artifact]
        word: artifact
        ko: 아티팩트
        scenes:
          - {who: 간호사끼리, icon: monitor, en: "This one's real, not artifact.", ok: true}
          - {who: 야간 인계, icon: board, en: "The 0300 alarm was artifact from a loose lead.", ok: true}
          - {who: 보호자에게, icon: me, en: "That alarm was just artifact.", ok: false, fix: "That alarm went off because a wire came loose, and we checked on him right away."}
        why: artifact는 의료진끼리 '가짜 신호'를 짧게 말하는 용어라 보호자는 알아듣지 못해요. 왜 울렸는지와 이미 확인했다는 말로 풀어요.
  7:
    1:
      replace:
        kind: context
        words: [w-strange]
        word: strange
        ko: 이상한
        scenes:
          - {who: 환자에게, icon: me, en: "It may feel strange for a few seconds, but it works fast.", ok: true}
          - {who: 가족에게, icon: me, en: "He may feel something strange in his chest, and it passes quickly.", ok: true}
          - {who: 차트 기록, icon: board, en: "Pt felt strange after adenosine.", ok: false, fix: "Adenosine 6 mg IV: 4-second pause, then sinus rhythm at 88; pt reported brief chest pressure."}
        why: 환자·가족에게는 '이상한 느낌'이 쉬운 말이지만, 차트에는 무엇이 몇 초 있었는지 구체적으로 남겨요.
  9:
    0:
      patch:
        why: QTc가 대략 남성 450ms·여성 460ms를 넘으면 prolonged, 500ms를 넘거나 60ms 넘게 늘면 토르사드 위험이 크게 올라 바로 보고해요. borderline은 그 경계 근처예요.
  12:
    0:
      patch:
        pairs: [[answer, any questions], [deliver, a shock], [reset, your rhythm]]
        decoys: [asleep]
        why: answer는 대답하는 동사라 any questions와, deliver는 에너지를 전달하니 a shock과, reset은 되돌려 놓으니 your rhythm과 이어요.
  13:
    0:
      patch:
        cue: 'Patient: "It made me jump for a split second, but it didn''t really hurt."'
        why: tingle은 약하게 찌릿한 느낌, jolt는 순간적으로 몸이 움찔하는 충격, blow는 세게 맞은 느낌이에요. ICD 쇼크는 '가슴을 세게 걷어차인 것 같다'(blow 쪽)고 말하는 환자가 많아요. 그래서 jolt 정도라도 바로 알려 달라고 해요.
    1:
      replace:
        kind: context
        words: [w-jolt]
        word: jolt
        ko: 찌릿함
        scenes:
          - {who: 환자에게, icon: me, en: "Tell me right away if you feel a shock or a jolt.", ok: true}
          - {who: 간호사 → 의사, icon: monitor, en: "He says he felt a jolt around 0200 — I pulled the strip.", ok: true}
          - {who: 차트 기록, icon: board, en: "Device jolt x1 at 0200 per pt.", ok: false, fix: "ICD shock delivered x1 at 0200; strip saved, physician notified."}
        why: jolt는 환자가 느낌을 말하는 구어라 환자와 대화에는 좋지만, 차트에는 'ICD shock delivered'처럼 사건으로 적어요.
  14:
    1:
      replace:
        kind: context
        words: [w-ischemia]
        word: ischemia
        ko: 허혈
        scenes:
          - {who: 의료진끼리, icon: stetho, en: "We need to rule out ischemia as the trigger.", ok: true}
          - {who: 차트 기록, icon: board, en: "Ischemia workup in progress; troponin pending.", ok: true}
          - {who: 환자에게, icon: me, en: "We're checking you for ischemia.", ok: false, fix: "We're checking whether your heart muscle is getting enough blood flow."}
        why: ischemia는 의료진끼리와 차트에서는 짧고 정확한 말이지만, 환자에게는 '심장 근육에 피가 충분히 가는지'처럼 풀어 줘요.
  15:
    1:
      scene_patch:
        1: {en: "She's getting confused, which can happen when her blood pressure is low."}
order:
  5:
    ko: 텔레메트리 알람에 대응하는 4문장 순서
    why: 알람이 울리면 먼저 환자를 보고, 환자가 멀쩡한 것을 확인한 뒤에야 리드 문제로 판단해요. 그다음에야 리드를 고치고 진짜 알람을 계속 지켜봐요. 확인 전에는 가짜로 단정하지 않아요.
    lines:
      - {en: "I'll go check the patient before silencing the alarm.", icon: stetho, ko: 알람을 끄기 전에 환자부터 확인할게요, note: 확인}
      - {en: "At the bedside, he's awake and talking, and his pulse is strong.", icon: check, ko: 침상에 가 보니 깨어서 말을 하고 맥박도 강해요, note: 상태}
      - {en: "So that alarm was just a loose lead.", icon: monitor, ko: 그러니 그 알람은 그냥 느슨해진 리드 때문이었어요, note: 판단}
      - {en: "I'll fix the lead, then keep watching the real ones.", icon: bell, ko: 리드를 고치고 진짜 알람은 계속 지켜볼게요, note: 정리}
  6:
    why: 상태를 말하고, 약으로 심박수를 늦추고, 혈압 변화를 지켜보다가 불안정해지면 전기적 치료로 넘어가요.
    line_patch:
      1: {ko: 심실 박동수를 늦추려고 베타차단제를 주고 있어요}
      2: {ko: 내려가면서 혈압이 떨어지는지 지켜보세요}
  12:
    line_patch:
      2: {en: "This machine delivers a carefully timed shock to reset your rhythm.", ko: 이 기계가 정교하게 맞춘 전기충격으로 리듬을 재설정해요}
  13:
    line_patch:
      1: {en: "It's designed to fire only when your heart needs it.", ko: 심장이 필요로 할 때만 작동하도록 만들어져 있어요}
