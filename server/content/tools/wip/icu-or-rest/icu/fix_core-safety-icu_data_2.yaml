# KP 문장 why 보강 (en·chunks 그대로)
why_kp:
  "2.0": "verify 뒤에 항목을 나열해 확인 범위를 한 번에 열거해요. together는 같은 자리에서 한다는 뜻이고, 확인 자체는 각자 따로 한 뒤 맞춰 봐요(독립확인)."
  "16.1": "Prepare와 notify를 and로 이어 약 준비와 보고를 한꺼번에 시작하라고 해요. protamine은 헤파린 효과를 되돌리는 약이지만 투여는 의사 처방이 있어야 해서, 지금은 처방이 나는 즉시 쓸 수 있게 꺼내 두는 준비예요."
  "20.2": "acknowledge 뒤에 what happened와 our plan 두 내용을 and로 이어 사실 인정과 앞으로의 계획을 같이 말해요. 간호사가 임의로 약속하는 게 아니라 병원 공개 절차와 담당 의사가 정한 계획을 전하는 말이에요."
  "6.1": "without 뒤에 동명사를 쓰면 한 가지를 하면서 다른 것은 지킨다는 틀이에요. non-critical로 넓혀도 되는 범위를 위중하지 않은 것으로 한정하고, 병원 규정과 처방(또는 승인된 범위) 안에서만 조정해요."
  "7.0": "We check로 시작해 정기적으로 하는 일을 습관처럼 말해요. every two hours가 주기를 숫자로 못 박지만, 실제 간격은 억제대 종류와 병원 정책을 따라요."
