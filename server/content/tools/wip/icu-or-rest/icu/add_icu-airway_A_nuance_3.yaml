- situation: "삽관·환기 불가 CICO 위기"
  items:
    - kind: slider
      words: [w-stuck, w-cricothyrotomy]
      cue: "Doctor: \"Two attempts failed, the bag-mask isn't working, and his sat is 70.\""
      scale: [try one more laryngoscopy, keep bagging and wait, open the cric kit now]
      answerAt: 2
      why: "삽관도 안 되고 산소화도 안 되는데 포화도가 계속 떨어지면 계속 시도하거나 기다릴 수 없어요. 이때는 CICO를 선언하고 윤상갑상막절개술 키트를 열어 외과적 기도를 바로 확보해요."
      example: "We're stuck, so open the cric kit now."
      exKo: "꼼짝 못하는 상황이니 지금 키트를 열어요."
    - kind: context
      words: [w-emergency]
      word: emergency
      ko: 응급 상황
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "This is an airway emergency, so open the cric kit.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Call for backup, this is an emergency.", ok: true}
        - {who: 가족에게, icon: me, en: "He is in a can't-intubate, can't-oxygenate emergency requiring a surgical airway.", ok: false, fix: "His airway is blocked right now, and the team is doing an emergency procedure to open it."}
      why: "의료진끼리는 can't-intubate, can't-oxygenate처럼 위기 이름을 그대로 외쳐 팀을 빠르게 움직여요. 가족에게는 같은 말이 무슨 뜻인지 알 수 없고 겁만 줘요. 지금 어떤 상황이고 무엇을 하는지만 쉬운 말로 알려 줘요."
- situation: "삽관 중 저산소·서맥 급변"
  items:
    - kind: slider
      words: [w-bradycardia, w-oxygenation]
      cue: "Colleague: \"His heart rate is 38 and his sat is 70 during laryngoscopy.\""
      scale: [stop and oxygenate first, push atropine, start compressions]
      answerAt: 0
      why: "삽관 중 서맥은 저산소증 때문인 경우가 많아서 시도를 멈추고 먼저 산소화해요. 산소를 줘도 호전이 없으면 아트로핀을, 맥박이 없으면 심정지 알고리즘으로 넘어가요."
      example: "His bradycardia is from hypoxia, so oxygenation comes first."
      exKo: "서맥은 저산소증 때문이라 산소화가 먼저예요."
    - kind: context
      words: [w-bradycardia]
      word: bradycardia
      ko: 서맥
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His bradycardia is from hypoxia, so oxygenate first.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Call out the heart rate, he's in bradycardia again.", ok: true}
        - {who: 가족에게, icon: me, en: "He developed sinus bradycardia with desaturation to seventy percent.", ok: false, fix: "His heartbeat slowed because he wasn't getting enough oxygen, and we're fixing that now."}
      why: "의료진끼리는 sinus bradycardia와 desaturation처럼 짧고 정확하게 말해요. 가족에게는 같은 말이 낯설고 무슨 일인지 알 수 없어요. 심장이 느려졌고 산소를 채우고 있다고 쉬운 말로 알려 줘요."
- situation: "기관절개관 우발적 탈관"
  items:
    - kind: slider
      words: [w-trach, w-fresh, w-oxygen]
      cue: "Nurse: \"The trach came out on day three, and he's turning blue.\""
      scale: [wait for the doctor to round, give oxygen and call for help, push the tube back in blindly]
      answerAt: 1
      why: "삽입한 지 얼마 안 된 새 스토마는 길이 굳지 않아 맹목적으로 다시 넣으면 엉뚱한 곳으로 들어갈 수 있어요. 먼저 입과 코, 스토마로 산소를 주고 기도팀을 부르며 재삽입을 준비해요. 기다리기만 하면 안 돼요."
      example: "A fresh stoma is hard to recannulate, so we call for help."
      exKo: "새 스토마는 다시 삽입하기 어려워서 도움을 요청해요."
    - kind: context
      words: [w-scared]
      word: scared
      ko: 겁먹은
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "He's scared and confused, so talk him through it.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Please talk to him calmly, he's scared.", ok: true}
        - {who: 가족에게, icon: me, en: "He is scared and agitated due to hypoxic delirium.", ok: false, fix: "He's scared right now, but we're here and we're taking care of his breathing."}
      why: "의료진끼리는 hypoxic delirium처럼 원인까지 정확히 말해도 돼요. 가족에게는 의학 용어와 진단명이 겁을 키우고 낯설게 들려요. 지금 겁먹은 상태라는 것과 호흡을 챙기고 있다는 것만 쉬운 말로 알려 줘요."
- situation: "기관절개 부위 대량 출혈"
  items:
    - kind: slider
      words: [w-bleeding, w-firm, w-pressure]
      cue: "Nurse: \"Bright red blood is pulsing out of the trach site.\""
      scale: [just wipe it and watch, press hard and call for help, flush the trach tube]
      answerAt: 1
      why: "맥박 따라 선홍색 피가 뿜어 나오면 대량 출혈 위험이에요. 닦아 내고 지켜보거나 관을 씻어 낼 때가 아니라, 단단히 눌러 지혈하면서 외과에 바로 연락해요. 커프를 과팽창시켜 지혈을 돕기도 해요."
      example: "I'm holding firm pressure while we call surgery."
      exKo: "단단히 압박하면서 외과에 연락해요."
    - kind: context
      words: [w-bleeding]
      word: bleeding
      ko: 출혈
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "Control the bleeding and keep the airway secured.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you watch the bleeding while I call surgery?", ok: true}
        - {who: 가족에게, icon: me, en: "He is bleeding from a tracheo-innominate fistula and may exsanguinate.", ok: false, fix: "He's bleeding from the opening in his neck, and the surgeons are being called right now."}
      why: "의료진끼리는 tracheo-innominate fistula 같은 진단명과 위험을 그대로 말해도 돼요. 가족에게는 같은 말이 갑작스럽고 차갑고, 최악의 결과만 남겨요. 피가 나는 곳과 지금 외과를 부르고 있다는 사실만 쉬운 말로 알려 줘요."
- situation: "식도 삽관 인지·즉시 교정"
  items:
    - kind: slider
      words: [w-capnography, w-belly, w-reoxygenate]
      cue: "Colleague: \"The waveform is flat and his belly rises with each bag squeeze.\""
      scale: [bag him a few more times, pull the tube and reoxygenate, tape it down and move him]
      answerAt: 1
      why: "파형이 평평하고 숨 쉴 때마다 배가 올라오면 튜브가 기관이 아니라 식도에 있다는 뜻이에요. 더 불어 넣거나 고정하지 말고 튜브를 빼서 먼저 산소를 다시 채운 뒤 재시도해요."
      example: "His belly is rising, so we pull the tube and reoxygenate."
      exKo: "배가 올라오니 튜브를 빼고 재산소화해요."
    - kind: context
      words: [w-tube]
      word: tube
      ko: 튜브
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "The tube is not in the trachea, so pull it now.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Say out loud that the tube is out before we try again.", ok: true}
        - {who: 가족에게, icon: me, en: "The endotracheal tube was malpositioned in the esophagus, so we removed it.", ok: false, fix: "The breathing tube went into the wrong passage, so we took it out and are helping him breathe."}
      why: "의료진끼리는 malpositioned와 esophagus처럼 위치 오류를 정확하게 말해요. 가족에게는 같은 말이 딱딱하고 무슨 일이었는지 와닿지 않아요. 무엇이 있었고 지금 무엇을 하는지를 쉬운 말로 알려 줘요."
- situation: "기도부종 급성 폐색 위기"
  items:
    - kind: slider
      words: [w-escalate, w-airway, w-immediate]
      cue: "Colleague: \"I barely hear any air moving, and his stridor is getting quieter.\""
      scale: [recheck in half an hour, escalate to the airway team now, give a sedative to relax him]
      answerAt: 1
      why: "협착음이 작아지는데 공기 흐름도 줄면 좋아진 게 아니라 기도가 거의 막혀 간다는 신호예요. 기다리지 말고 어려운 기도팀으로 바로 단계를 높여요. 진정제는 호흡을 더 막을 수 있어요."
      example: "Quieter stridor with less air movement means we escalate now."
      exKo: "협착음은 작아지는데 공기 흐름도 줄었으면 지금 단계를 높여요."
    - kind: context
      words: [w-airway]
      word: airway
      ko: 기도
      scenes:
        - {who: 의사에게 보고, icon: stetho, en: "His airway is obstructing, so get the difficult airway team.", ok: true}
        - {who: 동료 간호사, icon: monitor, en: "Can you set up the airway cart while I call?", ok: true}
        - {who: 환자에게, icon: me, en: "Your airway is compromised by edema with impending obstruction.", ok: false, fix: "Your throat is swelling and making it hard to breathe, so we're getting extra help right now."}
      why: "의료진끼리는 compromised나 impending obstruction처럼 짧고 정확하게 위험을 말해요. 환자에게는 같은 말이 무슨 뜻인지 알 수 없어 공포만 키워요. 목이 붓고 있고 도움을 부르고 있다는 것만 쉬운 말로 알려 줘요."
