situations:
- title: 이송 중 악화 대비 계획
  s:
  - ["심정지 계획", siren, "If로 조건을 먼저 말하고 동사를 쉼표로 이어 세 가지 행동을 순서대로 말해요. 멈추고, 압박하고, 도움을 부르는 순서를 이송 전에 합의해 둬야 실제 순간에 헷갈리지 않아요.", ", start a drip", "구토하면 멈추고 흉부압박을 시작하고 도움을 불러요.", "알람이 울리면 멈추고 흉부압박을 시작하고 도움을 불러요.", "arrests", "faints", "coughs", "vomits"]
  - ["위치 파악", compass, "where the nearest …는 간접 의문문이라 where 뒤가 평서문 어순이에요. 코드 카트와 전화기 위치를 경로에서 미리 알아 둬야 악화 때 찾으러 돌지 않아요.", "where the newest", "병동에서 가장 가까운 코드 카트와 전화기가 어디 있는지 알아요.", "엘리베이터 앞에서 가장 가까운 코드 카트와 전화기가 어디 있는지 알아요.", "nearest", "newest", "oldest", "biggest"]
  - ["역할 분담", handshake2, "You manage …, I'll run …처럼 쉼표로 두 사람의 몫을 나란히 말하면 누가 무엇을 하는지 한눈에 들려요. 기도는 기도를 맡은 사람이 맡고 약물은 약물을 맡은 사람이 맡아요.", ", I'll run the labs", "당신이 기도를 맡고, 저는 침대를 몰게요.", "당신이 기도를 맡고, 저는 문을 잡을게요.", "meds", "labs", "fluids", "calls"]
  - ["역할 합의", handshake2, "Let's agree on …은 함께 정하자는 제안이에요. before we leave로 이송 전에 마친다는 시점을 말해요.", "on our lunch", "병동을 나서기 전에 경로를 합의해요.", "병동을 나서기 전에 속도를 합의해요.", "roles", "routes", "rules", "rooms"]
  - ["엘리베이터 정지", bell, "If the elevator stalls처럼 일어날 수 있는 문제를 조건으로 미리 말하고 쉼표 뒤에 할 행동을 붙여요. hit은 버튼을 세게 눌러 바로 호출한다는 구어예요.", ", we cover", "엘리베이터 문이 안 열리면 비상 호출 버튼을 눌러요.", "엘리베이터 불이 꺼지면 비상 호출 버튼을 눌러요.", "stalls", "arrives", "opens", "descends"]
  - ["백 담당", gear, "keep a hand on …은 손을 계속 얹어 둔다는 뜻이에요. the whole way로 이송 처음부터 끝까지라는 범위를 말해요.", "on the door", "내내 폴대 위에 손을 얹고 있을게요.", "내내 베개 위에 손을 얹고 있을게요.", "bag", "pole", "door", "wall"]
  - ["예비 경로", compass, "if the main one is blocked에서 one은 앞에 나온 route를 대신해요. 예비 경로를 둘 다 알고 있다는 말에서 We both가 책임이 한 사람에게만 있지 않다는 걸 보여요.", "if the old one", "주된 경로가 막히면 쓸 예비 엘리베이터도 둘 다 알고 있어요.", "주된 경로가 막히면 쓸 예비 출입구도 둘 다 알고 있어요.", "backup", "longest", "slowest", "quietest"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 이송 중 악화 대비 4문장 순서
    why: 나서기 전에 역할부터 합의하고, 그 역할대로 분담하고, 가까운 코드 카트를 알아 둔 뒤, 그걸 알고 있으니 심정지 때 바로 행동하겠다고 말해요.
    lines:
    - ["Let's agree on our roles before we leave the unit.", handshake2, "병동을 나서기 전에 역할을 합의해요", "합의"]
    - ["So you manage the airway, I'll run the meds.", handshake2, "그러니 당신이 기도를 맡고 저는 약물을 운용할게요", "분담"]
    - ["With roles set, I know where the nearest code cart is.", compass, "역할이 정해졌으니 가장 가까운 코드 카트가 어디 있는지 알아요", "위치"]
    - ["Knowing that, if he arrests, we stop and start compressions.", siren, "그걸 아니까 심정지가 오면 멈추고 흉부압박을 시작해요", "행동"]
- title: 베드사이드 시술 보조
  s:
  - ["타임아웃", pushpin, "Let's do …는 함께 하자는 제안이에요. 대시 뒤에 확인한 세 가지를 나열하면 어떤 항목을 맞췄는지 팀 전체가 같이 들어요.", "the sign-in", "손 위생을 해요 — 환자, 시술, 부위를 확인했어요.", "타임아웃을 해요 — 환자, 시술, 동의를 확인했어요.", "site", "weight", "address", "insurance"]
  - ["무균 준비", shield, "set up and ready는 설치도 되어 있고 바로 쓸 수도 있다는 두 가지를 말해요. 무균 트레이와 흡인은 시술이 시작되면 바로 필요해서 먼저 갖춰요.", "and a chair", "무균 트레이와 조명이 준비돼 있어요.", "무균 트레이와 장갑이 준비돼 있어요.", "suction", "chair", "lamp", "gloves"]
  - ["역할 안내", handshake2, "as needed는 필요할 때만이라는 뜻이에요. monitor와 hand you을 and로 이으면 두 가지를 함께 하겠다는 약속이 돼요.", "and tell you", "활력징후를 살피면서 필요할 때 의자를 건네드릴게요.", "활력징후를 살피면서 필요할 때 차트를 건네드릴게요.", "supplies", "charts", "orders", "reports"]
  - ["계획 합의", handshake2, "agrees on the plan은 같은 계획을 알고 동의했다는 뜻이에요. in the room으로 시술 장소에 있는 모두를 가리켜 아무도 빠지지 않았다고 알려요.", "in the hall", "복도에 있는 모두가 계획에 동의해요.", "방에 있는 모두가 순서에 동의해요.", "agrees", "argues", "jokes", "worries"]
  - ["개수 세기", pencil, "keep count of는 하나하나 세어 둔다는 뜻이에요. 시술이 끝날 때 개수가 맞는지 보려면 시작할 때 센 숫자가 필요해요.", "and scissors", "거즈와 장갑 개수를 세어 둘게요.", "거즈와 주사기 개수를 세어 둘게요.", "sponges", "towels", "gowns", "gloves"]
  - ["마취제 요청", pill, "Let me know if …는 필요하면 말해 달라는 부드러운 요청이에요. 시술자는 손이 바쁘니 필요한 걸 먼저 챙겨 달라고 하기 어려워요.", "bandages", "거즈가 더 필요하면 말씀해 주세요.", "소독액이 더 필요하면 말씀해 주세요.", "local", "general", "spinal", "epidural"]
  - ["드레싱 확인", bandage, "is on과 looks clean은 각각 한 일과 본 상태를 말해요. and로 이으면 붙인 것과 부위 상태를 한 번에 보고해요.", "and the floor", "드레싱을 붙였고 부위는 건조해 보여요.", "드레싱을 떼었고 부위는 깨끗해 보여요.", "clean", "red", "swollen", "wet"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 베드사이드 시술 보조 4문장 순서
    why: 시작 전에 타임아웃으로 확인하고, 그다음 무균 준비를 알리고, 준비가 끝나면 맡을 일을 말하고, 시술이 끝난 뒤 드레싱 상태를 보고해요.
    lines:
    - ["Let's do the time-out — patient, procedure, and site confirmed.", pushpin, "타임아웃을 해요 — 환자, 시술, 부위를 확인했어요", "타임아웃"]
    - ["With that done, the sterile tray and suction are ready.", shield, "그게 끝났으니 무균 트레이와 흡인 장비가 준비됐어요", "준비"]
    - ["With the tray ready, I'll monitor her vitals and hand you supplies.", handshake2, "트레이가 준비됐으니 활력징후를 살피고 물품을 건네드릴게요", "역할"]
    - ["After the procedure, the dressing is on and the site looks clean.", bandage, "시술이 끝난 뒤 드레싱을 붙였고 부위는 깨끗해 보여요", "마무리"]
- title: 병원간 이송 인계·문서
  s:
  - ["인계 시작", speech, "give an SBAR handoff는 정해진 틀로 전달한다는 뜻이에요. to the transport team으로 누가 받는지 말해야 인계 책임이 분명해요.", "to the billing", "이송팀에 I-PASS 형식으로 인계할게요.", "이송팀에 서면 형식으로 인계할게요.", "SBAR", "SOAP", "MAR", "ECG"]
  - ["서류 모음", board, "all together는 흩어지지 않고 한곳에 모았다는 뜻이에요. 차트와 영상, 약물 목록은 병원이 달라도 새 팀이 바로 읽어야 해서 같이 보내요.", ", insurance", "차트와 영상자료, 동의서를 다 함께 챙겼어요.", "차트와 검사 결과, 약물 목록을 다 함께 챙겼어요.", "imaging", "labs", "notes", "orders"]
  - ["주입 약물", pill, "Here are …는 물건을 건네며 보여 줄 때 쓰는 말이에요. drips와 rates를 같이 줘야 어떤 속도로 가고 있는지 받는 쪽이 이어서 해요.", "and their colors", "현재 주입 중인 약물과 용량이에요.", "현재 주입 중인 약물과 알레르기예요.", "drips", "pills", "labs", "orders"]
  - ["입원 경과", stetho, "came in with는 어떤 문제로 왔는지 말할 때 쓰는 틀이에요. 증상과 수치를 and로 이으면 왜 입원했는지가 한 줄로 전달돼요.", "and a daily", "가슴 통증과 오르는 칼륨으로 왔어요.", "가슴 통증과 오르는 젖산으로 왔어요.", "troponin", "potassium", "lactate", "glucose"]
  - ["현재 상태", stetho, "he's on two liters는 지금 산소를 어떤 양으로 쓰는지 말해요. and stable로 숫자 뒤에 상태를 붙이면 인계받는 사람이 지금 위험한지 바로 알아요.", "of water and sleepy", "지금은 산소 2리터를 쓰고 있고 졸려 해요.", "지금은 산소 2리터를 쓰고 있고 열이 있어요.", "stable", "sleepy", "feverish", "anxious"]
  - ["호출 요청", bell, "Please call은 정중하게 연락해 달라는 말이에요. en route는 이동 경로 위라는 뜻이라 도착을 기다리지 말고 지금 연락해 달라는 거예요.", "if anything spills", "이동 중에 뭔가 막히면 전화 주세요.", "이동 중에 뭔가 필요하면 전화 주세요.", "changes", "breaks", "spills", "fails"]
  - ["서류 완료", pencil, "are done과 is complete는 각각 서명과 서류가 끝났다는 보고예요. 이송 전에 빠진 서명이 없는지 마지막으로 닫는 문장이에요.", "and the elevator", "서명은 끝났고 서류도 보관됐어요.", "서명은 끝났고 서류도 복사됐어요.", "complete", "missing", "late", "lost"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 병원간 이송 인계 4문장 순서
    why: 입원 이유를 먼저 말하고, 그 뒤 지금 상태를 알리고, 지금 쓰는 약물을 넘기고, 이동 중 변화가 있으면 연락해 달라고 마무리해요.
    lines:
    - ["He came in with chest pain and a rising troponin.", stetho, "가슴 통증과 오르는 트로포닌으로 왔어요", "경과"]
    - ["Since then, he's on two liters of oxygen and stable.", stetho, "그 뒤로 산소 2리터를 쓰고 있고 안정적이에요", "상태"]
    - ["On top of that oxygen, here are his current drips and their rates.", pill, "그 산소에 더해 현재 주입 중인 약물과 속도예요", "약물"]
    - ["With all that handed over, please call if anything changes en route.", bell, "다 넘겼으니 이동 중에 뭔가 바뀌면 전화 주세요", "요청"]
- title: 검사실 안전
  s:
  - ["장비 선별", shield, "screened는 하나씩 살펴서 가려냈다는 뜻이에요. for MRI compatibility로 자석에 안전한지가 기준이라고 말해요.", "all paperwork", "MRI 호환성을 위해 모든 보호자를 선별했어요.", "소독을 위해 모든 장비를 선별했어요.", "compatibility", "availability", "capacity", "cleanliness"]
  - ["구역 규칙", lock, "No … go past는 하나도 넘지 못한다는 강한 금지예요. ferrous는 철을 포함해 자석에 끌리는 물질이라 구역선 밖에 둬야 해요.", "No visitors", "플라스틱 물품은 구역선을 넘지 못해요.", "젖은 물품은 구역선을 넘지 못해요.", "ferrous", "plastic", "wooden", "paper"]
  - ["안전 장비", gear, "MRI-safe는 자석 안에서도 안전하다고 확인된 장비라는 뜻이에요. 모니터와 주입 펌프는 환자와 함께 들어가서 둘 다 확인해야 해요.", "and a clipboard", "MRI 안전 모니터와 인공호흡기를 쓸 거예요.", "MRI 안전 모니터와 시트를 쓸 거예요.", "infusion", "dialysis", "feeding", "suction"]
  - ["금속 제거", lock, "any metal은 크든 작든 금속은 전부라는 뜻이에요. before we enter로 들어가기 전에 해야 한다는 시점을 말해요.", "any food", "검사실에 들어가기 전에 신발을 벗어 주세요.", "검사실에 들어가기 전에 가운으로 갈아입어 주세요.", "metal", "plastic", "paper", "cotton"]
  - ["이식물 대조", magnify, "against the screening list는 목록과 비교했다는 뜻이에요. 이식물은 안에 있어서 눈으로 안 보이니 목록과 대조해야 해요.", "his wristband", "선별 목록과 알레르기를 대조해서 확인했어요.", "선별 목록과 신분증을 대조해서 확인했어요.", "implants", "allergies", "wounds", "medications"]
  - ["탱크 확인", lab, "non-ferrous는 철이 아니라서 자석에 끌리지 않는다는 뜻이에요. we're using을 붙여 지금 쓰는 바로 그 탱크를 가리켜요.", "is non-slip", "쓰고 있는 산소 탱크는 가득 차 있어요.", "쓰고 있는 산소 탱크는 새것이에요.", "tank", "cart", "pump", "tube"]
  - ["전체 확인", check, "has been cleared는 확인을 마치고 통과시켰다는 현재완료 수동태예요. Everything on him으로 몸에 붙은 것 전부를 한꺼번에 말해요.", "for the pharmacy", "그의 가방에 있는 모든 건 스캐너용으로 확인됐어요.", "그에게 있는 모든 건 복도용으로 확인됐어요.", "cleared", "erased", "stored", "charged"]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 검사실 안전 확인 4문장 순서
    why: 장비부터 선별하고, 그다음 그 장비로 이식물 목록을 대조하고, 모든 게 확인되면 들어가기 전에 금속을 빼 달라고 해요.
    lines:
    - ["I've screened all equipment for MRI compatibility.", shield, "MRI 호환성을 위해 모든 장비를 선별했어요", "장비"]
    - ["With that screened, we'll use an MRI-safe monitor and infusion pump.", gear, "선별했으니 MRI 안전 모니터와 주입 펌프를 쓸 거예요", "사용"]
    - ["Once the equipment's set, I checked his implants against the screening list.", magnify, "장비가 정해졌으니 선별 목록과 이식물을 대조했어요", "대조"]
    - ["With everything checked, please remove any metal before we enter the suite.", lock, "다 확인했으니 들어가기 전에 금속을 빼 주세요", "요청"]
- title: 이송 위험-이익 판단 소통
  s:
