situations:
- title: 원내 이송 전 안정성 평가
  sentences:
  - en: His vitals are stable enough for transport right now.
    ko: 지금 활력징후는 이송하기에 충분히 안정적이에요.
    chunks:
    - His vitals are
    - stable enough
    - for transport
    - right now
    - .
    words:
    - w-vitals
    - w-stable
    - w-transport
    goal: 1
    tag: 상태 평가
    icon: stetho
    why: stable enough for …는 완벽하다는 뜻이 아니라 이송이라는 목적에 충분하다는 기준을 말해요. right now가 지금 시점의 판단임을 못 박아요.
    decoy: for a shower
    distractorsKo:
    - 지금 활력징후는 퇴원하기에 충분히 안정적이에요.
    - 지금 활력징후는 산책하기에 충분히 안정적이에요.
    blank:
      answer: transport
      options:
      - en: transport
      - en: discharge
      - en: dialysis
      - en: surgery
  - en: I'll confirm the airway and lines are secure first.
    ko: 먼저 기도와 라인이 고정됐는지 확인할게요.
    chunks:
    - I'll confirm
    - the airway and lines
    - are secure
    - first
    - .
    words:
    - w-confirm
    - w-airway
    - w-line
    - w-secure
    goal: 1
    tag: 출발 전 확인
    icon: lock
    why: first를 문장 끝에 두면 다른 어떤 일보다 앞선다는 순서가 또렷해져요. 기도와 라인은 이동 중에 빠지면 곧바로 위기라 출발 전에 먼저 봐요.
    decoy: are labeled
    distractorsKo:
    - 먼저 침대 난간이 올라갔는지 확인할게요.
    - 먼저 이송 가방과 시트가 준비됐는지 확인할게요.
    blank:
      answer: secure
      options:
      - en: secure
      - en: visible
      - en: clean
      - en: dry
  - en: If he deteriorates, we hold and reassess.
    ko: 악화되면 멈추고 다시 평가해요.
    chunks:
    - If he deteriorates
    - ', we hold'
    - and reassess
    - .
    words:
    - w-deteriorate
    - w-hold
    - w-reassess
    goal: 2
    tag: 악화 계획
    icon: siren
    why: If로 조건을 먼저 깔고 we hold and reassess로 행동을 짧게 합의해요. 이송 전에 미리 말해 둬야 악화될 때 망설이지 않아요.
    decoy: ', we sign'
    distractorsKo:
    - 열이 나면 멈추고 다시 평가해요.
    - 졸려 하면 멈추고 다시 평가해요.
    blank:
      answer: reassess
      options:
      - en: reassess
      - en: restart
      - en: reorder
      - en: relocate
  - en: His blood pressure and oxygen level look good for the trip.
    ko: 혈압과 산소 수치가 이동하기 좋아 보여요.
    chunks:
    - His blood pressure
    - and oxygen level
    - look good
    - for the trip
    - .
    words:
    - w-pressure
    - w-oxygen
    - w-level
    - w-trip
    goal: 1
    tag: 수치 보고
    icon: chartup
    why: look good은 눈으로 본 수치를 가볍게 요약하는 말이에요. 혈압과 산소를 and로 묶어 이동 전에 꼭 봐야 할 두 가지를 같이 짚어요.
    decoy: and bed height
    distractorsKo:
    - 혈압과 산소 수치가 휴식하기 좋아 보여요.
    - 혈압과 산소 수치가 샤워하기 좋아 보여요.
    blank:
      answer: oxygen
      options:
      - en: oxygen
      - en: sugar
      - en: sodium
      - en: pain
  - en: I'll double-check the sedation and pressor pumps before we go.
    ko: 가기 전에 진정제와 승압제 펌프를 다시 확인할게요.
    chunks:
    - I'll double-check
    - the sedation
    - and pressor pumps
    - before we go
    - .
    words:
    - w-sedation
    - w-pressor
    - w-pump
    goal: 1
    tag: 펌프 점검
    icon: gear
    why: double-check는 이미 한 확인을 한 번 더 한다는 뜻이에요. before we go로 시점을 못 박아 출발 전에 끝낸다는 걸 알려요.
    decoy: the call light
    distractorsKo:
    - 가기 전에 산소통과 이송 모니터를 다시 확인할게요.
    - 가기 전에 폴대와 모니터 케이블을 다시 확인할게요.
    blank:
      answer: pumps
      options:
      - en: pumps
      - en: poles
      - en: carts
      - en: wheels
  - en: Let's confirm CT is ready before we move him.
    ko: 옮기기 전에 CT가 준비됐는지 확인해요.
    chunks:
    - Let's confirm
    - CT is ready
    - before we
    - move him
    - .
    words:
    - w-confirm
    - w-ready
    - w-move
    goal: 2
    tag: CT 준비
    icon: board
    why: Let's는 상대와 함께 확인하자는 말이라 지시보다 부드러워요. 영상실이 준비되기 전에 환자를 옮기면 복도에서 기다리게 되니 순서가 중요해요.
    decoy: CT is closed
    distractorsKo:
    - 옮기기 전에 엘리베이터가 준비됐는지 확인해요.
    - 옮기기 전에 이송팀이 준비됐는지 확인해요.
    blank:
      answer: ready
      options:
      - en: ready
      - en: broken
      - en: crowded
      - en: closed
  - en: If anything changes, we stay in the unit.
    ko: 뭔가 바뀌면 우리는 병동에 머물러요.
    chunks:
    - If anything changes
    - ', we stay'
    - in the unit
    - .
    words:
    - w-change
    - w-stay
    - w-unit
    goal: 2
    tag: 이송 중단
    icon: lock
    why: If anything changes로 어떤 변화든 포함하고 we stay로 이송을 안 한다는 결정을 말해요. 조건과 결정을 짧게 짝지어 팀이 같은 기준을 갖게 해요.
    decoy: ', we text'
    distractorsKo:
    - 뭔가 늦어지면 우리는 병동에 머물러요.
    - 뭔가 막히면 우리는 병동에 머물러요.
    blank:
      answer: unit
      options:
      - en: unit
      - en: hallway
      - en: lobby
      - en: elevator
  nuance:
  - kind: slider
    words:
    - w-stable
    cue: 'Resident: ''His MAP is 62 on the same pressor dose, sat is 94, and his heart rate keeps creeping up.'''
    scale:
