- title: 인공호흡기 설정 확인·기록
  sentences:
  - en: Let's confirm the mode, tidal volume, FiO2, and PEEP together.
    ko: 모드, 일회호흡량, FiO2, PEEP를 같이 확인해요.
    chunks:
    - Let's confirm
    - the mode, tidal volume, FiO2,
    - and PEEP
    - together
    - .
    words:
    - w-confirm
    - w-mode
    - w-tidalvolume
    - w-fio2
    - w-peep
    goal: 1
  - en: I'll read the numbers off and you verify them on the flowsheet.
    ko: 제가 숫자를 불러줄 테니 흐름기록지에서 확인해 주세요.
    chunks:
    - I'll read
    - the numbers off
    - and you verify
    - them on the flowsheet
    - .
    words:
    - w-read
    - w-number
    - w-verify
    - w-flowsheet
    goal: 2
  - en: The FiO2 is set at 40 percent with a PEEP of 5.
    ko: FiO2는 40퍼센트, PEEP는 5로 설정돼 있어요.
    chunks:
    - The FiO2 is set
    - at 40 percent
    - with a PEEP
    - of 5
    - .
    words:
    - w-fio2
    - w-peep
    - w-percent
    goal: 1
  - en: I'm charting the settings exactly as we confirmed them.
    ko: 확인한 그대로 설정값을 기록할게요.
    chunks:
    - I'm charting
    - the settings
    - exactly as
    - we confirmed them
    - .
    words:
    - w-chart
    - w-confirm
    goal: 2
  - en: The rate is set at 14 breaths a minute, and the tidal volume looks good.
    ko: 호흡수는 분당 14회로 설정돼 있고, 일회호흡량도 적절해요.
    chunks:
    - The rate is set
    - at 14 breaths
    - a minute,
    - and the tidal volume looks good
    - .
    words:
    - w-rate
    - w-breath
    - w-tidalvolume
    goal: 1
  - en: Let's make sure the flowsheet numbers match the vent display.
    ko: 흐름기록지 숫자가 인공호흡기 화면과 일치하는지 확인해요.
    chunks:
    - Let's make sure
    - the flowsheet numbers
    - match
    - the vent display
    - .
    words:
    - w-flowsheet
    - w-number
    - w-match
    - w-display
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-verify
    cue: 'Nurse: "I''ll read each number off the vent, and you compare every one against the flowsheet, line by line."'
    scale:
    - glance at
    - check
    - verify
    answerAt: 2
    why: 숫자를 하나하나 맞대어 틀린 데가 없는지 따져 보는 일은 verify예요. check는 이상이 없는지 훑어보는 정도이고, glance at은 슬쩍 보는 것이라 설정 기록 확인에는 약해요.
    example: Please verify the settings on the flowsheet before we chart them.
    exKo: 기록하기 전에 기록지에서 설정을 재확인해 주세요.
  - kind: context
    words:
    - w-chart
    word: chart
    ko: 기록하다
    scenes:
    - who: 동료 간호사에게
      icon: monitor
      en: Let's chart these settings after we both confirm them.
      ok: true
    - who: 기록 지시
      icon: board
      en: Chart the FiO2 and PEEP exactly as set on the vent.
      ok: true
    - who: 가족에게
      icon: me
      en: I'll chart his Vt, FiO2, and PEEP per protocol.
      ok: false
      fix: I'll write down his settings so everyone on the team can see them.
    why: 의료진끼리는 chart를 동사로 짧게 쓰고 Vt·FiO2 같은 약어도 통해요. 가족에게는 약어와 protocol이 낯설고 사무적으로 들리니, 무엇을 하는지 풀어서 말해요.
