    goal: 1
    tag: 알람 우선순위
    icon: siren
    why: life-threatening and need로 두 성질을 and로 묶어, 빨간 알람이 왜 기다릴 수 없는지 한 문장에 담아요.
    decoy: a second monitor
    distractorsKo:
    - 파란 알람은 생명을 위협하는 상황이라 즉각 조치가 필요해요.
