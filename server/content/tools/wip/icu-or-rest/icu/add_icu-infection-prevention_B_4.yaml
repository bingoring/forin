  - ["면역 설명", "shield", "'so we must'로 이유와 의무를 한 문장에 이어요. 면역이 낮으면 평소엔 무해한 균도 감염을 일으켜요.", "for the night", "이분은 면역이 심하게 저하돼서 모든 소음으로부터 보호해야 해요.", "이분은 체력이 심하게 저하돼서 모든 균으로부터 보호해야 해요.", "severely", "slightly", "happily", "rarely"]
