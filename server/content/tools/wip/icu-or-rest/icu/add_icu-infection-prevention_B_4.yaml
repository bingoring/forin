situations:
- title: "감염관리 팀 보고·소통"
  s:
  - ["결과 보고", "lab", "'the new positive culture'처럼 새 결과를 수식어로 짚으면 무엇이 달라졌는지 바로 전해져요. 격리 상태는 감염관리팀이 대응을 정하는 기본 정보예요.", "by the end", "새로운 양성 배양 결과와 식이 상태를 보고할게요.", "새로운 양성 혈액 결과와 격리 상태를 보고할게요.", "culture", "calendar", "recipe", "diary"]
  - ["정보 전달", "speech", "'Let me'로 직접 전달하겠다고 부드럽게 제안해요. 발병 시점과 시행 중인 주의조치는 감염관리팀이 범위를 가늠하는 핵심이에요.", "at lunch", "발병 시점과 현재 시행 중인 식단을 전달할게요.", "퇴원 시점과 현재 시행 중인 주의조치를 전달할게요.", "onset", "holiday", "wedding", "concert"]
  - ["지침 준수", "board", "'follow their guidance'는 감염관리팀이 정한 것을 따르겠다는 뜻이에요. 'any additional measures'는 아직 정해지지 않은 조치까지 포함해요.", "at once", "추가 비용은 그쪽 지침을 따를게요.", "추가 조치는 그쪽 일정을 따를게요.", "follow", "print", "translate", "file"]
  - ["결과 전달", "lab", "'came back'은 검사실에서 결과가 돌아왔다는 뜻이에요. 'positive for'는 무엇이 검출됐는지 뒤에 붙여요.", "in the lab", "혈액 결과가 내성균 양성으로 나왔어요.", "배양 결과가 바이러스 양성으로 나왔어요.", "culture", "signature", "contract", "ticket"]
  - ["담당자 전달", "bell", "'the surveillance nurse'로 정보를 받을 사람을 구체적으로 짚어요. 'today'는 미루지 않고 오늘 전달한다는 뜻이에요.", "by e-mail", "오늘 감시 담당 약사에게 발병 시점을 알려줄게요.", "오늘 감시 담당 간호사에게 입실 시점을 알려줄게요.", "today", "weekly", "monthly", "yearly"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "감염관리팀 보고 4문장 순서"
    why: "결과가 나왔다는 사실에서 시작해, 감염관리팀에 보고하고, 발병 시점과 주의조치를 전달한 뒤, 팀이 답하면 그 지침을 따라요."
    lines:
    - ["The culture came back positive for a resistant organism.", "lab", "배양 결과가 내성균 양성으로 나왔어요", "결과"]
    - ["I'll report that result and the isolation status to infection control.", "speech", "그 결과와 격리 상태를 감염관리팀에 보고할게요", "보고"]
    - ["Let me give them the onset date and precautions in place.", "pencil", "발병 시점과 현재 주의조치를 전달할게요", "전달"]
    - ["Once they respond, we'll follow their guidance on any additional measures.", "board", "답이 오면 추가 조치는 그쪽 지침을 따를게요", "준수"]
- title: "원내감염 클러스터 대응"
  s:
  - ["집단발병", "siren", "'suggest'는 단정하지 않고 가능성을 가리키는 동사예요. 같은 균 세 건은 우연이라고 보기 어려운 묶음이에요.", "on the third floor", "같은 균으로 한 사례가 나온 걸 보니 집단발병 가능성이 있어요.", "다른 균으로 세 사례가 나온 걸 보니 집단발병 가능성이 있어요.", "outbreak", "holiday", "vacation", "wedding"]
  - ["즉시 알림", "bell", "'alert'는 급하게 알린다는 뜻이고 'now'로 시점을 못 박아요. 알리는 동시에 이미 하던 주의조치를 더 철저히 해요.", "for a while", "지금 약제팀에 알리고 주의조치를 강화하죠.", "지금 시설팀에 알리고 주의조치를 강화하죠.", "alert", "thank", "greet", "invite"]
  - ["필요 조치", "check", "'may need'로 아직 확정은 아니라는 조심스러운 태도를 보여요. 세 가지를 나열해 앞으로 검토할 조치를 한눈에 알려요.", "in the lounge", "코호팅, 선별검사, 예산 점검이 필요할 수도 있어요.", "코호팅, 선별검사, 인사 점검이 필요할 수도 있어요.", "screening", "catering", "parking", "decorating"]
  - ["위험 신호", "siren", "'red flag'는 즉시 주의해야 할 경고 신호를 가리키는 관용 표현이에요. 숫자와 기간을 함께 말해야 근거가 분명해요.", "last year", "일주일 안에 같은 균으로 한 환자가 나오면 위험 신호예요.", "한 달 안에 같은 균으로 세 환자가 나오면 위험 신호예요.", "week", "year", "hour", "decade"]
  - ["선별검사", "magnify", "'the other patients'로 이미 확인된 환자 말고 같은 병동의 나머지를 가리켜요. 'right away'는 확산 전에 잡겠다는 뜻이에요.", "by the door", "병동의 다른 보호자들도 바로 선별검사를 하죠.", "병동의 다른 환자들도 바로 선별검사를 예약하죠.", "screen", "paint", "weigh", "quiz"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "원내감염 클러스터 대응 4문장 순서"
    why: "위험 신호를 먼저 말하고, 집단발병 가능성으로 해석한 뒤, 감염관리팀에 알리고 주의조치를 강화하고, 팀이 찾은 것에 따라 추가 조치를 검토해요."
    lines:
    - ["Three patients with the same organism in one week is a red flag.", "siren", "일주일 안에 같은 균으로 세 환자가 나오면 위험 신호예요", "신호"]
    - ["That suggests a possible outbreak.", "magnify", "집단발병 가능성이 있다는 뜻이에요", "해석"]
    - ["Let's alert infection control and reinforce precautions now.", "bell", "지금 감염관리팀에 알리고 주의조치를 강화하죠", "알림"]
    - ["Depending on what they find, we may need cohorting, screening, and an environmental review.", "check", "그쪽이 찾은 것에 따라 코호팅, 선별검사, 환경 점검이 필요할 수 있어요", "조치"]
- title: "공기매개 병원체 노출 위기"
  s:
  - ["음압 병실", "hospital", "'right away'로 지체할 수 없는 긴급함을 알려요. 공기매개 병원체는 공기로 퍼져 음압 병실이 필요해요.", "on the third floor", "이 환자는 바로 휠체어가 필요해요.", "이 보호자는 바로 음압 병실이 필요해요.", "room", "chair", "shower", "closet"]
  - ["마스크 착용", "shield", "'Everyone'과 'must'로 예외도 선택도 없다는 규칙을 분명히 해요. 'fit-tested'는 얼굴에 맞는지 미리 검사한 것을 뜻해요.", "at the entrance", "밖에서 지켜보는 사람은 모두 밀착검사된 N95를 착용해야 해요.", "들어가는 환자는 모두 밀착검사된 N95를 착용해야 해요.", "fit-tested", "colorful", "decorated", "expensive"]
  - ["노출자 파악", "magnify", "'identify … and report'는 찾는 일과 알리는 일을 한 문장에 묶어 두 단계 모두 해야 한다고 알려요.", "after the shift", "보호구 없이 노출된 장비를 파악해서 보고하죠.", "보호구 없이 노출된 사람을 파악해서 배치하죠.", "protection", "permission", "payment", "warning"]
  - ["마스크 제공", "shield", "'Let me grab you'로 직접 가져다주는 도움을 먼저 제안하고, 뒤에 이유를 붙여요. 'fitted'는 밀착검사로 얼굴에 맞는 크기를 뜻해요.", "from the cabinet", "들어가시기 전에 맞는 N95를 가져다드릴게요 — 여기는 접촉격리실이에요.", "들어가시기 전에 맞는 N95를 가져다드릴게요 — 여기는 공기매개 대기실이에요.", "fitted", "colorful", "cheap", "famous"]
  - ["노출 보고", "bell", "'without an N95'로 어떤 보호구가 없었는지 정확히 짚어요. 'today'는 노출 보고를 미루지 않는다는 뜻이에요.", "on the form", "N95 없이 들어간 사람은 오늘 교육해야 해요.", "가운 없이 들어간 사람은 오늘 보고해야 해요.", "reported", "praised", "hired", "paid"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "공기매개 격리 대응 4문장 순서"
    why: "음압 병실부터 정하고, 들어가는 모두가 N95를 써야 한다는 규칙을 말하고, 맞는 마스크를 나눠 주며, 쓰지 않고 들어간 사람이 있으면 그날 보고해요."
    lines:
    - ["This patient needs a negative-pressure room right away.", "hospital", "이 환자는 바로 음압 병실이 필요해요", "병실"]
    - ["Everyone entering must wear a fit-tested N95.", "shield", "들어가는 사람은 모두 밀착검사된 N95를 착용해야 해요", "규칙"]
    - ["For that, let me grab you a fitted one before you go in.", "shield", "그러려면 들어가시기 전에 맞는 걸 가져다드릴게요", "제공"]
    - ["If anyone got past me without it, they need to be reported today.", "bell", "저를 지나쳐 쓰지 않고 들어간 사람은 오늘 보고해야 해요", "보고"]
- title: "다제내성균 패혈증 확산 위기"
  s:
  - ["격리 강화", "siren", "'so we must'로 이유와 결론을 이어 격리 강화가 위험에서 나온 결론임을 보여요. 'tighten'은 이미 있는 격리를 더 엄격하게 한다는 뜻이에요.", "on the ward", "이 내성균은 빠르게 퍼질 수 있어서 일정을 조정해야 해요.", "이 내성균은 빠르게 퍼질 수 있어서 보고서를 작성해야 해요.", "isolation", "uniform", "music", "lighting"]
  - ["필수 조치", "shield", "'are essential'로 선택이 아니라 반드시 필요하다고 말해요. 'now'는 확산 위험이 커진 지금이 기준이라는 뜻이에요.", "for guests", "전담 침대와 엄격한 손위생이 지금 꼭 필요해요.", "전담 병실과 엄격한 손위생이 지금 꼭 필요해요.", "equipment", "furniture", "uniforms", "menus"]
  - ["접촉자 검사", "magnify", "'every'로 일부가 아니라 모든 주의조치를 강화하자고 해요. 접촉자 선별검사는 증상 없는 보균자를 찾아요.", "on the unit", "접촉자를 선별검사하고 모든 주의조치를 교육하죠.", "접촉자를 선별검사하고 모든 주의조치를 평가하죠.", "screen", "invite", "pay", "thank"]
  - ["장비·주의", "gear", "'right now'를 문장 끝에 붙여 긴급함을 강조해요. 'tighter'는 비교급으로 지금보다 더 엄격하다는 뜻이에요.", "for the visitors", "지금 전담 장비와 더 넓은 병실이 필요해요.", "지금 전담 장비와 더 많은 인력이 필요해요.", "tighter", "cheaper", "lighter", "brighter"]
  - ["전파 속도", "siren", "'bug'는 균을 가리키는 구어체라 가족에게 쉽게 들려요. 'just a day'는 짧은 시간에 퍼질 수 있다는 점을 강조해요.", "for a week", "이 균은 한 시간 만에 환자에서 환자로 퍼질 수 있어요.", "이 균은 이틀 만에 환자에서 환자로 퍼질 수 있어요.", "day", "month", "decade", "second"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "내성균 확산 대응 4문장 순서"
    why: "얼마나 빨리 퍼지는지 먼저 말하고, 그래서 격리를 강화해야 한다고 한 뒤, 필요한 장비와 손위생을 말하고, 접촉자 검사와 주의조치 강화로 이어가요."
    lines:
    - ["This bug can spread from patient to patient in just a day.", "siren", "이 균은 하루 만에 환자에서 환자로 퍼질 수 있어요", "위험"]
    - ["So we must tighten isolation right now.", "shield", "그래서 지금 바로 격리를 강화해야 해요", "격리"]
    - ["That means dedicated equipment and strict hand hygiene.", "gear", "그건 전담 장비와 엄격한 손위생을 뜻해요", "장비"]
    - ["With those in place, let's screen contacts and reinforce every precaution.", "magnify", "그게 갖춰지면 접촉자를 선별검사하고 모든 주의조치를 강화하죠", "검사"]
- title: "주삿바늘 노출사고 대응"
  s:
  - ["즉시 세척", "shield", "'First'로 가장 먼저 할 일임을 못 박아요. 비누와 물로 충분히 씻으면 오염 물질을 줄이고 노출 부위를 빨리 처치할 수 있어요.", "by hand", "먼저 주사기와 바늘을 안전통에 넣으세요.", "먼저 오염된 장갑과 가운을 벗으세요.", "soap", "sugar", "juice", "oil"]
  - ["보고·평가", "siren", "'right away'로 노출 후 시간이 중요하다는 점을 전해요. PEP는 노출 후 가능한 한 빨리 시작해야 효과가 커요.", "for the chart", "이걸 바로 보고하고 PEP 교육을 받으셔야 해요.", "이걸 바로 보고하고 PEP 설명을 받으셔야 해요.", "PEP", "MRI", "BMI", "EEG"]
  - ["원환자 확인", "check", "'source patient'는 바늘에 노출시킨 원 환자를 가리키는 용어예요. 상태를 확인해야 어떤 프로토콜이 필요한지 정해져요.", "by the phone", "원환자 상태를 확인하고 프로토콜을 설명하죠.", "원환자 이름을 확인하고 프로토콜을 시작하죠.", "source", "sleeping", "elderly", "nearby"]
  - ["세척 시간", "shield", "'a full minute'의 full이 '꼬박'이라는 뜻을 더해 서두르지 않겠다는 다짐을 줘요. 충분한 시간 동안 씻는 것이 중요해요.", "by the sink", "비누와 물로 꼬박 3분간 씻을게요.", "비누와 물로 꼬박 10분간 씻을게요.", "minute", "hour", "day", "week"]
  - ["보고·시작", "siren", "'report … and start'로 보고와 시작을 한 문장에 묶어 둘 다 오늘 한다고 말해요. 'today'는 미루지 않는다는 뜻이에요.", "with a note", "오늘 노출을 보고하고 PEP 프로토콜을 설명할게요.", "오늘 사고를 보고하고 PEP 프로토콜을 시작할게요.", "PEP", "CPR", "ECG", "ICU"]
  order:
    tag: "대화 흐름"
    icon: "compass"
    ko: "바늘 노출 대응 4문장 순서"
    why: "먼저 비누와 물로 씻고, 원환자 상태를 확인한 뒤, 노출을 보고하고, 보고가 끝나면 PEP 프로토콜을 시작해 평가를 받아요."
    lines:
    - ["First, wash the site well with soap and water for a full minute.", "shield", "먼저 비누와 물로 부위를 꼬박 1분간 씻으세요", "세척"]
    - ["Once it's washed, let's check the source patient's status.", "check", "씻고 나면 원환자 상태를 확인하죠", "확인"]
    - ["With the source patient's status in hand, I'll report the exposure right away.", "siren", "원환자 상태를 알았으면 바로 노출을 보고할게요", "보고"]
    - ["With that report in, we'll start the PEP protocol and get you evaluated today.", "pill", "보고가 들어가면 오늘 PEP를 시작하고 평가를 받으세요", "시작"]
- title: "면역저하 보호격리 붕괴 위기"
