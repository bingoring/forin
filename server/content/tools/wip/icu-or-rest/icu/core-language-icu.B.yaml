situations:
- title: 통역 서비스 요청·활용
  sentences:
  - en: I'll get a professional interpreter for us right away.
    ko: 제가 바로 공식 통역사를 불러드릴게요.
    chunks:
    - I'll get
    - a professional interpreter
    - for us
    - right away
    - .
    words:
    - w-professional
    - w-interpreter
    - w-right
    - w-away
    goal: 1
    tag: 통역 요청
    icon: mic
    why: I'll get으로 간호사가 먼저 나서 부르면 가족이 직접 요청해야 하는 부담이 줄어요. right away는 기다리게 하지 않겠다는 신호예요.
    decoy: right here
    distractorsKo:
    - 제가 바로 공식 통역사 두 분을 불러드릴게요.
    - 제가 바로 그분께 통역사를 불러드릴게요.
    blank:
      answer: right away
      options:
      - en: right away
      - en: next week
      - en: last month
      - en: every day
  - en: Please speak naturally and I'll speak to your mother directly.
    ko: 편하게 말씀하시면 제가 어머님께 직접 전할게요.
    chunks:
    - Please speak naturally
    - and I'll speak
    - to your mother
    - directly
    - .
    words:
    - w-speak
    - w-naturally
    - w-mother
    - w-directly
    goal: 2
    tag: 소통 안내
    icon: speech
    why: Please로 시작하면 부탁으로 들려요. 통역사를 거쳐도 말은 환자에게 직접 건넨다는 점을 directly가 알려 줘요.
    decoy: politely
    distractorsKo:
    - 천천히 말씀하시면 제가 어머님께 직접 전할게요.
    - 편하게 말씀하시면 제가 어머님께 또박또박 전할게요.
    blank:
      answer: naturally
      options:
      - en: naturally
      - en: angrily
      - en: secretly
      - en: rudely
  - en: The interpreter will make sure nothing gets lost.
    ko: 통역사가 놓치는 것 없이 다 전달해 줄 거예요.
    chunks:
    - The interpreter
    - will make sure
    - nothing gets lost
    - .
    words:
    - w-interpreter
    - w-make-sure
    - w-nothing
    - w-lost
    goal: 2
    tag: 정확성 약속
    icon: shield
    why: make sure는 결과를 책임지겠다는 표현이고, nothing gets lost는 수동형이라 누가 빠뜨리는지가 아니라 빠짐이 없다는 결과에 초점을 둬요.
    decoy: everything gets repeated
    distractorsKo:
    - 통역사가 보태는 것 없이 다 전달해 줄 거예요.
    - 통역사가 놓치는 것 없이 다 기록해 줄 거예요.
    blank:
      answer: nothing
      options:
      - en: nothing
      - en: something
      - en: everything
      - en: someone
  - en: We don't use family members as interpreters for medical care.
    ko: 저희는 가족을 의료 통역으로 쓰지 않아요.
    chunks:
    - We don't use
    - family members
    - as interpreters
    - for medical care
    - .
    words:
    - w-family
    - w-member
    - w-interpreter
    - w-medical
    - w-care
    goal: 1
    tag: 원칙 설명
    icon: lock
    why: We don't use는 개인이 아니라 병원 방침을 말하는 형태라 가족을 탓하는 느낌 없이 이유를 전할 수 있어요.
    decoy: visiting friends
    distractorsKo:
    - 저희는 친구를 의료 통역으로 쓰지 않아요.
    - 저희는 이웃을 의료 통역으로 쓰지 않아요.
    blank:
      answer: interpreters
      options:
      - en: interpreters
      - en: doctors
      - en: nurses
      - en: pharmacists
  - en: Once the interpreter is on the line, I'll explain everything step by step.
    ko: 통역사가 연결되면 제가 하나하나 설명해 드릴게요.
    chunks:
    - Once the interpreter
    - is on the line
    - ', I''ll explain everything'
    - step by step
    - .
    words:
    - w-interpreter
    - w-line
    - w-explain
    - w-everything
    - w-step
    goal: 2
    tag: 진행 안내
    icon: compass
    why: Once로 시작하면 어떤 일이 끝난 뒤에 이어질 일을 약속하는 말이 돼요. step by step은 한꺼번에 쏟아내지 않겠다는 배려예요.
    decoy: in a few words
    distractorsKo:
    - 통역사가 연결되면 제가 하나하나 질문해 드릴게요.
    - 통역사가 연결되면 제가 하나하나 확인해 드릴게요.
    blank:
      answer: step by step
      options:
      - en: step by step
      - en: all at once
      - en: in a rush
      - en: at the end
  - en: Ask again if anything isn't clear.
    ko: 이해 안 되는 부분 있으면 다시 물어보세요.
    chunks:
    - Ask again
    - if anything
    - isn't clear
    - .
    words:
    - w-ask
    - w-again
    - w-anything
    - w-clear
    goal: 2
    tag: 되묻기 허용
    icon: bell
    why: Ask again은 되묻는 것이 정상이라는 허락이에요. if anything isn't clear로 조건을 달아 부담을 줄여요.
    decoy: is too fast
    distractorsKo:
    - 이해 안 되는 부분 있으면 다시 읽어보세요.
    - 이해 안 되는 부분 있으면 다시 들어보세요.
    blank:
      answer: again
      options:
      - en: again
      - en: tomorrow
      - en: yesterday
      - en: next year
  order:
