# 단어·뉘앙스·order 수정
remove_words: [w-remove, w-line, w-rapid, w-response, w-trust]
words:
  w-quick:
    en: quickly
    ipa: /ˈkwɪkli/
    ko: 신속하게
    example: "I'll treat it quickly if your sugar is low."
    exKo: "@sync"
    cue: "오래 끌지 않고 서둘러 처리하겠다고 말할 때"
    distractorsEn: [quietly, thickly]
    distractorsKo: [느긋하게, 얌전하게]
    chips: [[quick, ly]]
  w-away:
    en: right away
    ipa: /raɪt əˈweɪ/
    ko: 바로
    chips: [[right], [a, way]]
    distractorsEn: [far away, right behind]
    distractorsKo: [나중에, 천천히]
    decoyChips: [rite]
    cue: "지체 없이 그 자리에서 알려 달라고 할 때"
  w-double:
    en: double-check
    ipa: /ˌdʌbəl ˈtʃɛk/
    ko: 이중 확인하다
    cue: "투여 전에 두 사람이 따로 용량을 맞춰 볼 때"
    distractorsEn: [double-book, double-park]
    distractorsKo: [한 번 훑다, 나중에 보다]
    chips: [[dou, ble-, check]]
  w-stick:
    ko: 찌르기(손끝 채혈)
    distractorsKo: [누르기(지혈), 닦기(소독)]
  w-clear:
    ko: 배출하다/분명한
    cue: "몸이 약을 걸러 내보내거나, 패턴이 흐릿함 없이 드러날 때"
    distractorsKo: [흡수하다/흐릿한, 저장하다/모호한]
  w-flag:
    ko: 짚어 알리다
    cue: "수치가 심상치 않다고 담당자에게 먼저 꺼내 말할 때"
    distractorsKo: [덮어 두다, 미뤄 두다]
    exKo: "@sync"
  w-regimen:
    ko: 투여 계획
  w-number: {distractorsEn: [member, lumber]}
  w-forever: {distractorsEn: [forward, never]}
  w-add: {distractorsEn: [pad, aid]}
  w-skip: {distractorsEn: [skim, slip]}
  w-often:
    distractorsEn: [offhand, seldom]
    cue: "평소보다 확인 간격을 좁혀 여러 번 재야 할 때"
  w-kidney: {distractorsEn: [liver, spleen]}
  w-stat: {distractorsEn: [stale, static]}
  w-progress: {distractorsEn: [process, regress]}
  w-count: {distractorsEn: [mount, account]}
  w-give: {distractorsEn: [glide, live]}
  w-bring: {distractorsEn: [braid, brag]}
  w-diabetes: {decoyChips: [dee, bat]}
  w-insulin: {decoyChips: ['on', sun]}
  w-fresh: {decoyChips: [flash]}
  w-immediately: {decoyChips: ['in', mid]}
  w-smooth: {decoyChips: [smock]}
  w-gently: {decoyChips: [gene, lee]}
why_words:
  w-quick: "부사 quickly 쪽이 문장 6개 중 4개라 헤드워드를 부사로 바꾼다(형용사로 쓴 1.4·3.4는 태그를 뺀다)"
  w-away: "구 right away를 가르친다(away만으로는 뜻이 안 선다)"
  w-double: "double-check 전체를 가르친다(double만 떼면 '두 번의'가 된다)"
  w-stick: "두 문장 모두 명사 finger stick인데 ko가 동사였다"
  w-clear: "11.0 배출 뜻을 덮도록 ko를 가른다"
  w-flag: "문제로 짚어 팀에 알린다는 뜻으로 ko를 바로잡는다"
  w-regimen: "처방이 아니라 투여 계획(요법)"
nuance:
  - {s: 1, n: 0, set: {why: "손끝 검사는 짧고 약해서 quick pinch가 사실에 가까워요. sharp pain이라고 하면 겁을 주고, 하나도 안 아프다고 말하지도 마세요."}}
  - s: 4
    n: 0
    set:
      cue: "Tube feeding is held for a scan, the insulin drip is still running, and no dextrose is ordered."
      why: "영양이 끊기면 혈당이 떨어질 위험이 커서 병원 프로토콜에 따라 인슐린을 줄이거나 멈추고, 포도당 수액을 시작하기도 해요. 그대로 두면 저혈당 위험이 크고, 수액을 다 끊는 건 지나쳐요."
      example: "If your feeding is held, we lower the rate per protocol."
      exKo: "영양이 멈추면 프로토콜에 따라 속도를 낮춰요."
  - s: 6
    n: 0
    set:
      cue: "His sugar fell from 250 to 120 in one hour."
      why: "한 시간에 크게 떨어졌으면 dropping fast예요. 프로토콜은 변화 속도가 빠르면 인슐린 속도를 줄이고 더 일찍 재확인하라고 안내해요."
  - s: 7
    n: 0
    set:
      scale: [stays flat, drifts up, peaks]
      answerAt: 2
      why: "아침에 맞는 스테로이드(예: 프레드니손)는 오후에 혈당이 가장 높아졌다가 밤에 내려오니 peaks예요. drifts up은 조금씩 오르기만 할 때예요."
  - {s: 7, n: 1, scene: {2: {en: "Your steroid-induced hyperglycemia reflects peripheral insulin resistance."}}}
  - {s: 9, n: 1, scene: {0: {who: 의사 지시}}}
  - {s: 13, n: 0, set: {cue: "His son asks if the sugars will calm down. The team expects them to improve as the infection clears, but nobody can promise it."}}
  - s: 15
    n: 0
    set:
      words: [w-call]
      scale: [bring it up at rounds, page the team later, call the provider now]
      why: "반응이 없고 혈당이 매우 낮으면 프로토콜대로 바로 처치하면서 담당의를 병상으로 불러요. 중환자실은 신속대응팀이 아니라 담당 의사를 바로 부르는 곳이에요. 라운드까지 기다리거나 나중에 호출하면 늦어요."
      example: "Call the provider to the bedside now."
      exKo: "지금 담당의를 병상으로 불러 주세요."
  - s: 16
    n: 1
    set:
      ko: 문서로 남기다
      why: "MAR·POC는 의료진끼리의 말이에요. 환자에게는 무엇을 적는지 쉬운 말로 알려 주세요."
    scene:
      2: {who: 환자에게, icon: me, en: "I'm documenting your POC glucose and the D50 administration in the MAR.", ok: false, fix: "I'm writing down your sugar results and the medicine I gave you."}
  - s: 17
    n: 0
    set:
      scale: [recheck later, mention it at rounds, escalate now]
      why: "DKA가 의심되면 바로 담당의에게 알려 치료를 올리게 해야 해서 escalate now예요. 나중에 재확인하거나 라운드까지 기다리면 진행되는 동안 시간을 잃어요."
      example: "I'm escalating this to the provider now."
      exKo: "지금 담당의에게 바로 보고할게요."
  - {s: 18, n: 0, set: {cue: "The feeding stopped an hour ago while the insulin kept running, and his sugar is 48 and still falling."}}
  - {s: 18, n: 1, scene: {1: {en: "Can we request an alert on the flow sheet whenever feeding is held?"}}}
  - s: 20
    n: 0
    set:
      cue: "He knows his name and where he is, but keeps asking the same question."
      why: "이름과 장소는 알지만 같은 질문을 반복하는 정도는 mild confusion이에요. 반응이 없을 때만 unresponsive라 하고, 정도와 상관없이 혈당부터 확인해야 해요."
  - {s: 20, n: 1, scene: {0: {who: 의사 지시}}}
order:
  "2":
    why: "주입이 표를 따른다고 먼저 알리고, 혈당이 변할 때 조정되는 방식을 설명하고, 그 덕에 안전하다고 말한 뒤, 호전되면 주사로 바꾸거나 멈춘다고 안심시켜요."
    lines:
      2: {en: "Those small changes keep the dose safe and consistent.", ko: "그 작은 조정들이 용량을 안전하고 일정하게 지켜줘요"}
      3: {en: "Once you improve, we'll switch or stop the drip.", ko: "호전되면 주사로 바꾸거나 주입을 중단할 거예요"}
  "4":
    why: "영양 방식이 모두 혈당에 영향을 준다고 말하고, 영양이 바뀌면 혈당도 달라진다고 이어서, 인슐린을 맞추겠다고 약속한 뒤, 식사를 거르는 경우에도 프로토콜대로 조정한다고 예를 들어요."
    lines:
      3: {en: "Doing that for a skipped meal means adjusting the rate per protocol.", ko: "거른 식사에 맞출 때는 프로토콜에 따라 속도를 조정해요"}
  "5":
    why: "오르는 측정값을 먼저 말하고, 그것이 단일 수치가 아닌 추세라고 설명한 뒤, 더 오르기 전에 짚어 알리고, 그 추세를 담당의에게 알려요."
    lines:
      2: {ko: "그래서 더 오르기 전에 지금 짚어서 알릴게요", note: 짚기}
  "7":
    why: "스테로이드가 혈당을 올린다고 먼저 알리고, 오후에 오르는 패턴을 설명한 뒤, 그 오후 최고치를 덮을 인슐린을 말하고, 용량이 바뀌면 그 인슐린도 바꾼다고 이어요."
    lines:
      2: {en: "So we may add extra insulin to cover that afternoon peak.", ko: "그래서 그 오후 최고치를 막으려고 인슐린을 추가할 수도 있어요"}
  "9":
    lines:
      3: {en: "While we do that, I'll check your sugar more often until feeding restarts.", ko: "그동안 급식이 다시 시작될 때까지 혈당을 더 자주 확인할게요"}
  "10":
    why: "주입을 멈추기 전에 지속형 주사를 먼저 놓고, 그 겹침이 혈당을 지켜 준다고 설명하고, 이후 몇 시간 지켜보며, 주사로 안정되면 혈당 확인을 줄여요."
    lines:
      3: {en: "Once those hours look stable on shots, we'll check your sugar less often.", ko: "그 몇 시간이 주사로 안정돼 보이면 혈당 확인 횟수를 줄일게요", icon: magnify, note: 간격}
  "13":
    lines:
      1: {en: "That high sugar is more than his baseline diabetes; the illness is driving it up.", ko: "그 높은 혈당은 원래 당뇨만으로 생긴 게 아니라 병이 끌어올리고 있어요"}
      3: {en: "With that close titration, his sugars should settle as the infection improves.", ko: "그렇게 세심히 적정하면 감염이 호전되면서 혈당도 안정될 거예요"}
  "14":
    why: "두 값이 다를 수 있다고 먼저 말하고, 그 원인을 설명하고, 그 원인 때문에 정맥혈로 확인한 뒤, 대개 더 정확한 검사실 수치를 따르고 이유를 기록해요."
    lines:
      2: {en: "Because of those, we confirm with a venous sample.", ko: "그래서 정맥혈 검체로 확인해요"}
      3: {en: "Usually the lab value is more accurate, and I note the reason on the chart.", ko: "대개 검사실 수치가 더 정확해서 이유를 차트에 적어요"}
  "15":
    why: "반응이 없는 환자를 보면 담당의를 병상으로 부르고, 인슐린을 멈추고 D50을 주며, 5분 뒤 재확인하고, 그때도 낮으면 반복해요."
    lines:
      0: {en: "He's unresponsive and clammy, so call the provider to the bedside now.", ko: "반응이 없고 축축하니 지금 담당의를 병상으로 불러 주세요"}
  "17":
    lines:
      1: {en: "That's why I'm drawing labs for ketones and blood acid right away.", ko: "그래서 케톤과 혈중 산도를 보려고 바로 채혈할게요"}
      2: {ko: "그 검사가 DKA를 보이면 치료 단계를 빨리 올릴게요"}
  "20":
    lines:
      3: {en: "Whatever those checks show, I'm escalating this change to the team.", ko: "그 검사 결과가 어떻든 이 변화를 팀에 보고할게요"}
