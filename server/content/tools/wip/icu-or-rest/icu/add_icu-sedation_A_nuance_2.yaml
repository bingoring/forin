- situation: "덱스메데토미딘 적용"
  items:
    - kind: slider
      words: [w-bradycardia, w-heart, w-dexmedetomidine]
      cue: "Nurse: \"His heart rate just dropped to thirty-eight on the dex.\""
      scale: [bradycardic, normal rate, tachycardic]
      answerAt: 0
      why: "분당 60회보다 느리면 bradycardic이에요. 덱스메데토미딘은 서맥과 저혈압이 잘 알려진 부작용이라, 심박이 많이 느려지면 주입을 멈추고 의사에게 알려요. tachycardic은 빠른 쪽이에요."
      example: "Watch for bradycardia and hypotension as we titrate."
      exKo: "titrate 하면서 서맥과 저혈압을 지켜봐요."
    - kind: context
      words: [w-dexmedetomidine]
      word: dexmedetomidine
      ko: 덱스메데토미딘
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Dexmedetomidine is at 0.6, and his heart rate is 62.", ok: true}
        - {who: 차트 기록, icon: board, en: "Dexmedetomidine 0.6 mcg/kg/h; HR 62, MAP 70.", ok: true}
        - {who: 보호자에게, icon: me, en: "Dexmedetomidine can cause bradycardia and hypotension in some patients.", ok: false, fix: "This medicine keeps him calm without making him too sleepy, but it can slow his heart a bit, so we watch it."}
      why: "의료진끼리는 약 이름과 용량, 심박·혈압을 바로 말해야 해요. 가족에게는 bradycardia, hypotension이 겁만 주고 뜻이 안 전해지니, 약이 하는 일과 우리가 살피는 점을 쉬운 말로 알려 줘요."
- situation: "아편유사제 진통 적정"
  items:
    - kind: slider
      words: [w-comfort, w-grimace, w-pain]
      cue: "Nurse: \"After the dose he's resting with a relaxed face and an easy breathing rate.\""
      scale: [comfortable, grimacing, moaning]
      answerAt: 0
      why: "투약 뒤 얼굴이 풀리고 호흡이 편하면 통증이 조절된 상태예요. 다시 찡그리거나 신음하면 통증이 남았다는 신호라 재평가하고, 아편유사제는 통증이 풀린 뒤에도 호흡수를 계속 지켜봐요."
      example: "Let's reassess his pain score after this next dose."
      exKo: "이번 용량 다음에 통증 점수를 다시 평가해봐요."
    - kind: context
      words: [w-dose]
      word: dose
      ko: 용량
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Let's reassess his pain after this dose.", ok: true}
        - {who: 차트 기록, icon: board, en: "Fentanyl given per order; pain reassessed after the dose.", ok: true}
        - {who: 보호자에게, icon: me, en: "He received a fifty-microgram IV opioid dose.", ok: false, fix: "We gave him pain medicine through his IV, and we'll check how he feels."}
      why: "의료진끼리는 약 이름과 용량을 정확히 말해야 서로 중복 투약을 막아요. 가족에게는 마이크로그램과 opioid가 뜻 없이 들리니, 무엇을 했고 그다음 무엇을 보는지를 쉬운 말로 말해요."
    - kind: swap
      words: [w-turn, w-surprise, w-tell]
      who: "환자에게 · 체위를 바꾸기 전"
      icon: me
      before: ["I'll tell you before I ", "flip you over", ", so you're not surprised."]
      options: [turn you, flip you over, tip you over]
      answer: turn you
      notes: {turn you: "환자를 존중하는 보통의 말이다. 놀라지 않게 미리 알리는 문장과도 자연스럽게 이어진다.", flip you over: "일상 회화에서는 쓰지만 환자를 물건처럼 다루는 인상을 줄 수 있다.", tip you over: "넘어뜨린다는 뜻이라 환자에게 겁을 준다."}
      why: "체위를 바꾸기 전에 미리 말하면 환자가 놀라지 않고 통증도 덜 느껴요. 쓰는 동사도 환자를 존중하는 말이어야 해요."
      ko: 놀라지 않게 체위를 바꾸기 전에 말씀드릴게요
- situation: "프로포폴 장기 사용 감시"
  items:
    - kind: slider
      words: [w-triglyceride, w-trend, w-climb]
      cue: "Lab: \"Triglycerides were 180, 185 and 182 over three days on propofol.\""
      scale: [flat, creeping up, climbing fast]
      answerAt: 0
      why: "수치가 같은 선에 머물면 flat이에요. 프로포폴은 지방 유제라 며칠 쓰면 중성지방이 오를 수 있어서 매일 추세를 보고, 계속 오르면 젖산·CK 같은 PRIS 검사와 약 교체를 의사와 의논해요."
      example: "Let's trend his triglyceride level every day while he's on this."
      exKo: "이 약을 쓰는 동안 매일 중성지방 수치를 추적해봐요."
    - kind: context
      words: [w-lactate]
      word: lactate
      ko: 젖산
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "His lactate is up to 4.1 on propofol — can you recheck it?", ok: true}
        - {who: 차트 기록, icon: board, en: "Lactate 4.1 (prior 1.8); propofol rate unchanged pending MD review.", ok: true}
        - {who: 보호자에게, icon: me, en: "His lactate is elevated, suggesting a possible metabolic acidosis from PRIS.", ok: false, fix: "A blood test shows acid building up in his body, so we're watching him closely."}
      why: "의료진끼리는 lactate 한 단어와 수치로 충분해요. 가족에게는 acidosis, PRIS 같은 말이 겁을 주고 뜻이 안 전해지니, 검사가 무엇을 보여 주고 우리가 무엇을 하는지를 쉬운 말로 풀어 줘요."
- situation: "진정 중단 이탈 연계"
  items:
    - kind: slider
      words: [w-agitated, w-calm]
      cue: "Nurse: \"He's fidgeting, but he isn't pulling at the tube or fighting the vent.\""
      scale: [calm, restless, combative]
      answerAt: 1
      why: "가만히 있지 못하지만 튜브를 잡거나 인공호흡기와 싸우지 않으면 restless예요. 움직임이 잦고 튜브와 싸우면 agitated, 사람에게 공격적이면 combative예요. 각성 시험 중에는 이 단계를 보면서 자가발관을 막아요."
      example: "Watch closely so he doesn't get agitated or self-extubate."
      exKo: "초조해하거나 자가발관하지 않도록 자세히 지켜봐요."
    - kind: context
      words: [w-trial]
      word: trial
      ko: 시험
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Let's start the awakening trial and watch his breathing.", ok: true}
        - {who: 차트 기록, icon: board, en: "Spontaneous awakening trial passed; no agitation, RASS 0.", ok: true}
        - {who: 보호자에게, icon: me, en: "He's on a spontaneous awakening trial to assess readiness for a spontaneous breathing trial.", ok: false, fix: "We're letting him wake up a little to see if he can start breathing on his own."}
      why: "의료진끼리는 awakening trial, breathing trial이라는 정해진 이름으로 말해요. 가족에게는 같은 말을 이어 붙이면 뜻이 안 전해지니, 무엇을 해 보려는 것인지를 쉬운 말로 풀어 줘요."
- situation: "analgosedation 전략 적용"
  items:
    - kind: slider
      words: [w-minimum, w-sedative, w-lower]
      cue: "Doctor: \"Keep the sedative at the least amount that keeps him comfortable.\""
      scale: [maximum, moderate, minimum]
      answerAt: 2
      why: "analgosedation은 통증을 먼저 다스리고 진정제는 필요한 최소량만 쓰는 전략이에요. 진정제를 줄이면 깨워서 평가하기 쉽고 섬망 위험도 줄어요."
      example: "We keep sedatives to a minimum and lean on analgesia first."
      exKo: "진정제는 최소로 유지하고 진통을 먼저 활용해요."
    - kind: context
      words: [w-analgesia]
      word: analgesia
      ko: 진통
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "Let's make sure analgesia is on board before we add sedation.", ok: true}
        - {who: 차트 기록, icon: board, en: "Analgesia: fentanyl 25 mcg/h; sedation held, RASS 0.", ok: true}
        - {who: 보호자에게, icon: me, en: "His analgesia is multimodal with an opioid-sparing regimen.", ok: false, fix: "He's getting medicine for pain first, so he needs less medicine to stay calm."}
      why: "의료진끼리는 analgesia 한 단어로 진통 계획을 말해요. 가족에게는 multimodal, opioid-sparing이 낯서니, 통증약을 먼저 쓰면 재우는 약이 덜 필요하다는 점을 쉬운 말로 알려 줘요."
- situation: "진정제 내성 용량 증가 관리"
  items:
    - kind: slider
      words: [w-double, w-dose, w-tolerance]
      cue: "Nurse: \"He needed twenty yesterday, and today he needs forty to stay settled.\""
      scale: [steady, creeping up, doubling]
      answerAt: 2
      why: "같은 안정을 위해 용량이 두 배로 필요하면 내성이 생긴 신호예요. 한 약만 계속 올리기보다 약제를 더하거나 바꾸는 방법을 의사와 의논해요."
      example: "His dose has doubled since yesterday and he's still not settled."
      exKo: "어제부터 용량이 두 배가 됐는데도 여전히 안정되지 않아요."
    - kind: context
      words: [w-tolerance]
      word: tolerance
      ko: 내성
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "He's developed tolerance, so the same dose isn't holding him.", ok: true}
        - {who: 차트 기록, icon: board, en: "Tolerance to propofol suspected; second agent added per MD.", ok: true}
        - {who: 보호자에게, icon: me, en: "He has developed pharmacologic tolerance to propofol.", ok: false, fix: "His body has gotten used to this medicine, so it takes more to keep him comfortable."}
      why: "의료진끼리는 tolerance 한 단어로 상황이 전해져요. 가족에게는 pharmacologic 같은 말이 어렵고 차가우니, 몸이 약에 익숙해져서 더 필요하다고 풀어서 말해요."
- situation: "금단·알코올 병력 진정 조정"
  items:
    - kind: slider
      words: [w-withdrawal, w-sign, w-history]
      cue: "Nurse: \"He has a fine tremor and he's sweaty, but he knows where he is and he's calm.\""
      scale: [no withdrawal, mild withdrawal, severe withdrawal]
      answerAt: 1
      why: "떨림과 땀이 있어도 방향 감각이 있고 안정적이면 가벼운 금단이에요. 알코올 금단은 진행하면 환각과 섬망으로 이어질 수 있어서, 음주력을 들으면 미리 징후를 살피고 진정을 조정해요."
      example: "We'll watch closely for withdrawal signs and adjust."
      exKo: "금단 징후가 있는지 자세히 지켜보고 조정할게요."
    - kind: context
      words: [w-withdrawal]
      word: withdrawal
      ko: 금단
      scenes:
        - {who: 동료 간호사에게, icon: speech, en: "He drank heavily, so watch for withdrawal overnight.", ok: true}
        - {who: 차트 기록, icon: board, en: "Hx alcohol use; CIWA 12, withdrawal signs, sedation adjusted.", ok: true}
        - {who: 보호자에게, icon: me, en: "He is exhibiting autonomic hyperactivity consistent with alcohol withdrawal.", ok: false, fix: "He's shaky and sweaty because his body is used to alcohol, and we're treating it."}
      why: "의료진끼리는 withdrawal과 점수(CIWA)로 상태를 짧게 전해요. 가족에게는 autonomic hyperactivity가 어렵고 무섭게 들리니, 몸이 알코올에 익숙해서 생긴 증상이라고 풀어서 말해요."
