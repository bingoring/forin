9:
  - kind: slider
    words: [w-qt, w-prolong]
    cue: 'Pharmacist: "His QTc was 430 yesterday, and today it is 520."'
    scale: [normal, borderline, prolonged]
    answerAt: 2
    why: "QTc가 500ms를 넘으면 토르사드 위험이 크게 올라가서 따로 prolonged라고 알려요. borderline은 정상과 위험 사이 애매한 구간이에요."
    example: "His QT is prolonged at 520 milliseconds."
    exKo: "QT가 520밀리초로 길어졌어요."
  - kind: context
    words: [w-monitor]
    word: monitor
    ko: 감시하다
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "I'll monitor his QT on every ECG.", ok: true}
      - {who: 차트 기록, icon: board, en: "Continue to monitor QTc daily; hold QT-prolonging drugs.", ok: true}
      - {who: 보호자에게, icon: me, en: "We'll monitor his QTc and hold agents that prolong repolarization.", ok: false, fix: "We're watching his heart tracing closely, and we'll stop any medicine that could cause trouble."}
    why: "의료진끼리는 QTc, repolarization 같은 정확한 말이 좋아요. 보호자에게는 무엇을 지켜보고 무엇을 멈추는지 쉬운 말로 알려 줘요."
10:
  - kind: pair
    words: [w-give, w-avoid, w-recheck]
    pairs: [[give, potassium slowly], [avoid, irritating the vein], [recheck, the levels]]
    decoys: [the arrhythmia off]
    why: "give는 약을 주는 동사라 potassium slowly와, avoid는 피하는 동작이라 irritating the vein과, recheck는 수치를 다시 보니 the levels와 이어요."
  - kind: swap
    words: [w-calm, w-replacement]
    who: "환자에게 · 전해질 보충 설명"
    icon: me
    before: ["Replacing these often ", "cures", " the extra beats."]
    options: [calms, cures, triggers]
    answer: calms
    notes: {calms: "'대개 가라앉힌다'는 현실적인 표현이에요.", cures: "완전히 낫는다는 약속처럼 들려서 과장이에요.", triggers: "오히려 여분의 박동을 일으킨다는 반대 뜻이에요."}
    why: "전해질 보충은 부정맥을 잘 가라앉히지만 항상 해결한다고 약속할 수는 없어요. calm이 사실에 맞는 말이에요."
    ko: "이걸 보충하면 대개 여분의 박동이 가라앉아요"
11:
  - kind: slider
    words: [w-immediately, w-lose]
    cue: 'Nurse: "Capture is lost and his heart rate is dropping — turn the output up now."'
    scale: [eventually, promptly, immediately]
    answerAt: 2
    why: "eventually는 나중에 언젠가, promptly는 곧바로 서두르는 것, immediately는 지체 없이 당장이에요. 캡처가 사라졌을 때는 immediately가 맞아요."
    example: "If capture is lost, I'll increase the output immediately."
    exKo: "캡처가 소실되면 즉시 출력을 늘릴게요."
  - kind: context
    words: [w-temporary]
    word: temporary
    ko: 임시의
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "This is the temporary pacer, not his permanent one.", ok: true}
      - {who: 차트 기록, icon: board, en: "Pacer is temporary; capture threshold checked daily.", ok: true}
      - {who: 가족에게, icon: me, en: "The temporary pacing wire sits in the right ventricle, and we test its threshold daily.", ok: false, fix: "This pacer is only for now — it helps his heart keep a steady beat until it can do that on its own."}
    why: "의료진끼리는 right ventricle, threshold 같은 위치와 수치를 말해도 돼요. 가족에게는 '지금만 쓰는 것'이라는 뜻이 먼저 전해져야 해요."
12:
  - kind: pair
    words: [w-answer, w-deliver, w-reset]
    pairs: [[answer, any questions], [deliver, one shock], [reset, your rhythm]]
    decoys: [a midnight meal]
    why: "answer는 대답하는 동사라 any questions와, deliver는 에너지를 전달하니 one shock과, reset은 되돌려 놓으니 your rhythm과 이어요."
  - kind: swap
    words: [w-asleep, w-shock]
    who: "환자에게 · 시술 설명"
    icon: me
    before: ["You'll be ", "unconscious", " during the shock."]
    options: [asleep, unconscious, out cold]
    answer: asleep
    notes: {asleep: "환자가 알아듣기 쉽고 안심이 되는 말이에요.", unconscious: "응급 상황처럼 들려서 환자가 겁을 먹어요.", out cold: "거친 구어체라 시술 설명에는 어울리지 않아요."}
    why: "예정된 시술을 설명할 때는 겁을 주는 말보다 편안한 말을 골라요."
    ko: "충격을 받는 동안 잠들어 계실 거예요"
13:
  - kind: slider
    words: [w-jolt, w-shock]
    cue: 'Patient: "It was a quick kick in the chest, over in a second."'
    scale: [tingle, jolt, blow]
    answerAt: 1
    why: "tingle은 약하게 찌릿한 느낌, jolt는 순간적으로 몸이 움찔하는 충격, blow는 세게 맞은 느낌이에요. 제세동기가 작동하면 '가슴을 걷어차인 것 같다'고 말하는 환자가 많아요."
    example: "Tell me right away if you feel a shock or a jolt."
    exKo: "전기충격이나 찌릿함이 느껴지면 바로 말씀해 주세요."
  - kind: context
    words: [w-fire]
    word: fire
    ko: 작동하다
    scenes:
      - {who: 간호사 → 의사, icon: monitor, en: "The ICD may fire again; I attached the rhythm strip from the first one.", ok: true}
      - {who: 환자에게, icon: me, en: "If it fires, you may feel a quick jolt, and we'll check on you right away.", ok: true}
      - {who: 환자에게 · 어려운 말, icon: me, en: "The ICD will fire when it detects VT or VF above its programmed rate.", ok: false, fix: "If your heart goes dangerously fast, the device will send a shock to correct it."}
    why: "환자에게는 언제 작동하고 어떤 느낌이 드는지가 중요해요. VT, VF, programmed rate 같은 말은 의료진끼리 해요."
14:
  - kind: slider
    words: [w-rule, w-ischemia]
    cue: 'Nurse: "Serial troponins stayed normal and the 12-lead never changed — it isn''t ischemia."'
    scale: [rule out, suspect, confirm]
    answerAt: 0
    why: "rule out은 검사로 가능성을 걸러 내 '아니다'로 정리하는 것이고, suspect는 의심하는 단계, confirm은 맞다고 확정하는 단계예요."
    example: "We need to rule out ischemia as the trigger."
    exKo: "허혈이 원인인지 배제해야 해요."
  - kind: context
    words: [w-trigger]
    word: trigger
    ko: 유발하다
    scenes:
      - {who: 의료진끼리, icon: stetho, en: "We need to rule out ischemia as the trigger.", ok: true}
      - {who: 차트 기록, icon: board, en: "New AF; trigger unclear, ischemia workup in progress.", ok: true}
      - {who: 환자에게, icon: me, en: "We're evaluating for an ischemic trigger of your arrhythmia.", ok: false, fix: "We're checking whether a blood-flow problem in your heart set off this rhythm."}
    why: "trigger는 의료진끼리 '원인 요소'를 짧게 말할 때 좋아요. 환자에게는 ischemic 같은 말 대신 '혈류 문제'처럼 풀어 줘요."
15:
  - kind: pair
    words: [w-charge, w-confirm, w-deliver]
    pairs: [[charge, to 100 joules], [confirm, the sync light], [deliver, the shock]]
    decoys: [to the bed]
    why: "charge는 에너지를 모으니 to 100 joules와, confirm은 켜졌는지 확인하니 the sync light와, deliver는 충격을 주니 the shock과 이어요."
  - kind: context
    words: [w-confused]
    word: confused
    ko: 혼란스러운
    scenes:
      - {who: 의료진끼리, icon: monitor, en: "Her pressure is dropping and she's getting confused.", ok: true}
      - {who: 가족에게, icon: me, en: "He's getting confused, which can happen when his blood pressure is low.", ok: true}
      - {who: 환자에게, icon: me, en: "You're confused because your brain isn't getting enough blood flow.", ok: false, fix: "You may feel foggy right now, and we're treating it right away."}
    why: "의료진끼리는 상태를 그대로 말해도 돼요. 환자에게 '당신은 혼란스러워요'라고 하면 불안하고 무례하게 들리니 '멍하게 느낄 수 있어요'처럼 말해요."
16:
  - kind: slider
    words: [w-pulse, w-pulseless]
    cue: 'Nurse: "I can barely feel it — it''s faint and fast."'
    scale: [absent, thready, bounding]
    answerAt: 1
    why: "absent는 맥이 없는 것이라 pulseless로 보고 CPR을 시작해요. thready는 가늘고 약하지만 있는 맥, bounding은 강하게 튀는 맥이에요."
    example: "There's no pulse, so we start chest compressions."
    exKo: "맥박이 없으니 흉부압박을 시작할게요."
  - kind: swap
    words: [w-shock]
    who: "보호자에게 · 코드 중 설명"
    icon: me
    before: ["We are giving his heart a ", "defibrillation", " to try to restart a normal rhythm."]
    options: [shock, defibrillation, countershock]
    answer: shock
    notes: {shock: "보호자도 알아듣는 쉬운 말이에요.", defibrillation: "정확한 용어지만 급한 상황의 보호자에게는 낯설어요.", countershock: "의료진끼리 쓰는 전문 용어예요."}
    why: "코드 중 보호자에게는 무엇을 하는지가 바로 전해지는 쉬운 말을 써요."
    ko: "정상 리듬을 되살리려고 심장에 전기충격을 주고 있어요"
17:
  - kind: slider
    words: [w-barely, w-perfuse]
    cue: 'Nurse: "Pulse is thready, cap refill is five seconds, and urine output has dropped."'
    scale: [perfusing well, barely perfusing, not perfusing]
    answerAt: 1
    why: "barely는 '겨우'라서 아직 일부는 관류되지만 곧 무너질 수 있는 상태예요. not perfusing은 관류가 안 되는 상태예요."
    example: "He's barely perfusing and could arrest any minute."
    exKo: "겨우 관류되고 있고 언제든 심정지가 올 수 있어요."
  - kind: context
    words: [w-backup]
    word: backup
    ko: 백업
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "I'm calling cardiology for transvenous backup.", ok: true}
      - {who: 차트 기록, icon: board, en: "Transcutaneous pacing started; transvenous backup requested.", ok: true}
      - {who: 가족에게, icon: me, en: "We've requested a transvenous pacing backup with a temporary wire.", ok: false, fix: "We're getting a second way to support his heartbeat ready, just in case."}
    why: "의료진끼리는 transvenous 같은 정확한 말이 필요해요. 가족에게는 '만약을 위한 두 번째 방법'이라고 풀어 줘요."
18:
  - kind: slider
    words: [w-deteriorate, w-arrest]
    cue: 'Nurse: "Her torsades keeps coming back and her blood pressure is falling."'
    scale: [stable, deteriorating, arrested]
    answerAt: 1
    why: "deteriorating은 점점 나빠지는 중이고 arrested는 이미 심정지가 온 상태예요. 나빠지는 중일 때 제세동기를 미리 준비해 둬요."
    example: "Get the defibrillator ready in case she deteriorates."
    exKo: "악화될 경우를 대비해 제세동기를 준비해 주세요."
  - kind: context
    words: [w-ready]
    word: ready
    ko: 준비된
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "Is the defibrillator ready?", ok: true}
      - {who: 의사 → 간호사, icon: stetho, en: "Keep the pads on and stay ready to shock.", ok: true}
      - {who: 환자에게, icon: me, en: "The defibrillator is ready in case your rhythm degenerates into pulseless VT.", ok: false, fix: "We have the equipment right here in case your heart rhythm gets worse."}
    why: "의료진끼리는 ready라고만 해도 뜻이 통해요. 환자에게는 pulseless VT 같은 말 대신 '리듬이 나빠지면 바로 쓸 장비가 있다'고 말해요."
19:
  - kind: slider
    words: [w-repeated, w-shock]
    cue: 'Chart: "VF at 0100, 0130, 0155, and 0215; shocked each time."'
    scale: [single, occasional, repeated]
    answerAt: 2
    why: "repeated는 같은 일이 연달아 되풀이될 때 써요. 전기폭풍은 짧은 시간에 위험한 리듬이 반복되는 상태예요."
    example: "He's had repeated shocks — this is an electrical storm."
    exKo: "충격을 반복해서 받았어요, 이건 전기폭풍이에요."
  - kind: context
    words: [w-sedation]
    word: sedation
    ko: 진정
    scenes:
      - {who: 간호사끼리, icon: pill, en: "I'll increase his sedation before the next episode.", ok: true}
      - {who: 차트 기록, icon: board, en: "Sedation increased; amiodarone infusing; cardiology aware.", ok: true}
      - {who: 환자에게, icon: me, en: "We're escalating your sedation to blunt sympathetic tone.", ok: false, fix: "We're giving you more medicine to keep you comfortable and sleepy so your heart can settle."}
    why: "의료진끼리는 sympathetic tone 같은 생리 용어를 써도 돼요. 환자에게는 편안하고 졸리게 해 주는 약이라고 쉬운 말로 알려 줘요."
20:
  - kind: slider
    words: [w-capture, w-spike]
    cue: 'Monitor: "Only every other pacer spike is followed by a QRS."'
    scale: [no capture, intermittent capture, full capture]
    answerAt: 1
    why: "capture는 페이서 자극이 실제로 심장을 뛰게 한 것이에요. 스파이크 중 일부에만 박동이 따르면 intermittent capture예요."
    example: "The pacer spikes aren't capturing."
    exKo: "페이서 스파이크가 캡처되지 않아요."
  - kind: context
    words: [w-secure]
    word: secure
    ko: 고정하다
    scenes:
      - {who: 간호사끼리, icon: monitor, en: "Check the wires and make sure they're secure.", ok: true}
      - {who: 차트 기록, icon: board, en: "Pacer wires are secure; connections checked.", ok: true}
      - {who: 가족에게, icon: me, en: "We verified the leads are secure at the generator interface and the impedance is stable.", ok: false, fix: "The wires are held firmly in place, so the pacer keeps working."}
    why: "의료진끼리는 generator, impedance 같은 정확한 말이 필요해요. 가족에게는 선이 단단히 고정돼 있어 페이서가 계속 작동한다고만 말해요."
