- title: 활력·의식 재평가
  s:
  - [안심과 재확인, faceWorried, '''I''m glad''로 환자의 호전에 먼저 공감한 뒤 확인을 알려요. ''to confirm''이 재측정의 목적을 밝혀요.', for your family, '정신이 맑아지셨다니 다행이에요, 확인 차 활력징후를 과장이 다시 재요.', '정신이 맑아지셨다니 다행이에요, 확인 차 활력징후를 교수가 다시 재요.', glad, sorry, afraid, upset]
  - [지남력 확인, bulb, 이름과 장소를 묻는 건 의식 상태와 지남력을 보는 표준 질문이에요. 'for me'가 환자를 시험하는 느낌을 덜어요., your phone number, '성함이랑 누구와 오셨는지 말씀해 주실 수 있어요?', '성함이랑 어디서 오셨는지 말씀해 주실 수 있어요?', tell, ask, show, give]
  - [호전 설명, chartup, '''heading the right direction''은 수치의 방향을 쉬운 말로 풀어요. ''a good sign''으로 수치의 의미를 짧게 정리해요.', a bad dream, '수치들이 좋은 방향으로 가고 있는데, 이건 모두 약 덕분이에요.', '수치들이 좋은 방향으로 가고 있는데, 이건 이틀째 계속돼요.', direction, corner, lane, side]
  - [활력 비교, monitor, '''steadier than before''는 전보다 안정적이라는 비교 표현이에요. 혈압과 심박수는 활력징후 중 가장 먼저 보는 두 가지예요.', than your sister, 혈압이랑 심박수가 어제보다 더 안정적으로 보여요., 혈압이랑 심박수가 아침보다 더 안정적으로 보여요., steadier, louder, brighter, cleaner]
  - [기록과 공유, pencil, '''letting the team know''는 한 일을 팀과 공유한다는 뜻이에요. 호전된 부분도 기록해야 흐름이 이어져요.', to the pharmacist, 이렇게 나아진 부분을 기록하고 교수님께도 알릴게요., 이렇게 나아진 부분을 기록하고 약사에게도 알릴게요., charting, painting, filming, framing]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 활력·의식 재평가 4문장 순서
    why: 호전에 공감하고 재측정을 알린 뒤, 확인하려고 의식을 묻고, 측정 결과를 설명하고, 그 호전을 기록·공유한다고 말해요.
    lines:
    - ['I''m glad you feel clearer, and I''ll recheck your vitals to confirm.', faceWorried, '맑아지셔서 다행이에요, 확인 차 활력징후를 다시 잴게요', 공감]
    - ['To confirm, can you tell me your name and where you are?', bulb, '확인하려고 성함과 계신 곳을 말해 주실래요?', 질문]
    - ['After checking, your blood pressure and heart rate look steadier than before.', monitor, 재보니 혈압과 심박수가 전보다 안정적으로 보여요, 결과]
    - [I'm charting these improvements and letting the team know., pencil, 나아진 부분을 기록하고 팀에도 알려요, 공유]
