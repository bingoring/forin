- title: 진정제 내성 용량 증가 관리
  s:
  - t: 내성 보고
    i: chartup
    w: tolerant는 같은 약에 몸이 익숙해져 효과가 줄었다는 형용사예요. keeps escalating은 용량이 한 번이 아니라 계속 오른다는 진행을 말해요.
    d: by the door
    k: [알레르기가 생겨서 용량이 계속 올라가고 있어요., 내성이 생겨서 통증이 계속 올라가고 있어요.]
    a: tolerant
    o: [allergic, anemic, anxious]
  - t: 병합 제안
    i: pill
    w: instead of …ing는 하려던 일 대신 다른 일을 한다는 대비 모양이에요. second agent는 같은 약을 더 올리지 않고 다른 약을 더한다는 뜻이에요.
    d: for the night
    k: ['프로포폴을 더 올리는 대신 두 번째 약제를 추가할까요?', 프로포폴을 더 올리는 대신 두 번째 약제를 추가할게요.]
    a: pushing
    o: [pulling, picking, painting]
  - t: 병용 이점
    i: board
    w: can improve는 항상은 아니지만 나아질 수 있다는 가능성 표현이에요. at lower doses는 각 약의 양을 줄여도 된다는 이점을 말해요.
    d: by the nurse
    k: [약제를 조합하면 더 짧은 시간에도 조절이 나아질 수 있어요., 약제를 분리하면 더 낮은 용량으로도 조절이 나아질 수 있어요.]
    a: control
    o: [weight, voice, vision]
  - t: 경과 설명
    i: monitor
    w: since yesterday는 어제부터 지금까지 이어진 기간을 말해요. still not settled의 still이 용량을 올렸는데도 여전히라는 뜻을 더해요.
    d: in the notes
    k: [그제부터 용량이 두 배가 됐는데도 여전히 안정되지 않아요., 어제부터 간격이 두 배가 됐는데도 여전히 안정되지 않아요.]
    a: yesterday
    o: [tomorrow, soon, later]
  - t: 내성 설명
    i: stetho
    w: like this는 지금 보는 이 경우와 같은 것이라는 지시 표현이에요. common after several days는 며칠 쓴 뒤에 흔히 생긴다는 시기를 말해요.
    d: for him
    k: [한 약제를 여러 날 쓰면 이런 부작용은 흔해요., 한 약제를 여러 시간 쓰면 이런 내성은 흔해요.]
    a: common
    o: [rare, strange, unusual]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 진정제 내성 관리 4문장 순서
    why: 내성 보고가 먼저이고, 2줄의 this는 그 내성을 가리켜요. Because of that이 그 설명을 받아 병용의 이점을 말하고, So가 그 이점을 근거로 결정을 말해요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    lines:
    - {en: He's tolerant and the dose keeps escalating., icon: chartup, ko: 내성이 생겨서 용량이 계속 올라가고 있어요, note: 보고}
    - {en: Tolerance like this is common after several days on one agent., icon: stetho, ko: 한 약제를 여러 날 쓰면 이런 내성은 흔해요, note: 설명}
    - {en: 'Because of that, combining agents can improve control at lower doses.', icon: board, ko: 그래서 약제를 조합하면 더 낮은 용량으로도 조절이 나아질 수 있어요, note: 이점}
    - {en: So let's add a second agent instead of pushing propofol higher., icon: pill, ko: 그러니 프로포폴을 더 올리는 대신 두 번째 약제를 추가해봐요, note: 결정}
- title: 금단·알코올 병력 진정 조정
  s:
  - t: 감사 표현
    i: handshake2
    w: Thank you for …ing는 상대가 해 준 일을 구체적으로 짚어 고맙다고 하는 모양이에요. drinking history는 음주 이력이라는 뜻이라 가족이 말하기 어려운 정보에도 고마움을 표해요.
    d: at the visit
    k: [남편분이 술을 드셨던 것을 알려주셔서 놀랐어요., 남편분이 약을 드셨던 것을 알려주셔서 감사해요.]
    a: drinking
    o: [driving, dancing, diving]
  - t: 정보 의미
    i: bulb
    w: That helps us …는 앞에서 들은 정보가 어떤 도움이 되는지 풀어 주는 모양이에요. anticipate는 일이 생기기 전에 미리 예상한다는 동사예요.
    d: in his file
    k: [그 정보 덕분에 더 높은 진정 필요량을 기록할 수 있어요., 그 정보 덕분에 더 높은 진정 비용을 예상할 수 있어요.]
    a: anticipate
    o: [annoy, accelerate, assign]
  - t: 감시 계획
    i: monitor
    w: watch closely for …는 어떤 징후가 나타나는지 자세히 본다는 모양이에요. and adjust로 징후가 보이면 조정으로 이어진다는 흐름도 말해요.
    d: near the wall
    k: ['금단 징후가 있는지 자세히 지켜보고 조정할까요?', 금단 징후가 있는지 자세히 지켜보고 조정한다고 했어요.]
    a: withdrawal
    o: [weather, wedding, winter]
  - t: 혼수 구분
    i: shield
    w: isn't the same as …는 비슷해 보이는 두 상태를 구분해 걱정을 덜어 줘요. as we lighten it은 약을 줄여 가는 동안 함께 깨어난다는 진행을 나타내요.
    d: to his wife
    k: ['진정 상태는 수술과 달라요, 약을 줄이면 깨어나실 거예요.', '진정 상태는 혼수와 달라요, 몸을 돌리면 깨어나실 거예요.']
    a: lighten
    o: [lengthen, brighten, darken]
  - t: 역할 구분
    i: pill
    w: but으로 진정의 역할과 통증 치료의 역할을 나눠 말해요. its own medicine이라고 해서 진정제가 아니라 통증용 약이 따로 있다는 점을 알려 줘요.
    d: on the table
    k: ['진정은 그를 차분하게 해주지만, 통증은 따로 그 자체의 의사가 다뤄요.', '진정은 그를 깨어있게 해주지만, 통증은 따로 그 자체의 약으로 다뤄요.']
    a: medicine
    o: [pillow, blanket, bath]
  - t: 일과 설명
    i: calendar
    w: Every morning은 매일 같은 때라는 일과를 말해요. briefly는 잠깐뿐이라는 부사라서 진정을 끊는 것이 오래가지 않는다고 안심시켜요.
    d: at dawn
    k: ['매일 저녁 잠깐 진정을 멈췄다가, 다시 편안하게 해드려요.', '매일 아침 잠깐 진정을 멈췄다가, 다시 침대에 눕혀드려요.']
    a: briefly
    o: [badly, barely, busily]
  - t: 알람 설명
    i: bell
    w: often just는 대부분은 별일이 아니라는 완충이에요. not an emergency로 가족이 알람 소리에 놀라지 않게 하되 often이라 항상 그렇지는 않다고 선을 그어요.
    d: in the lobby
    k: [모니터 알람이 울려도 대부분 배터리가 살짝 나간 거지 응급 상황은 아니에요., 모니터 알람이 울려도 대부분 센서가 살짝 빠진 거지 보호자 잘못은 아니에요.]
    a: sensor
    o: [pillow, blanket, curtain]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 음주력 확인 후 진정 조정 4문장 순서
    why: 정보를 준 데 먼저 감사하고, That으로 그 정보가 어떤 도움인지 설명해요. 3줄에서 진정 조정 계획을 말하고, 4줄의 it은 3줄의 sedation을 가리켜서 순서가 하나예요.
    lines:
    - {en: Thank you for telling me about his drinking history., icon: handshake2, ko: 남편분의 음주력을 알려주셔서 감사해요, note: 감사}
    - {en: That helps us anticipate a higher sedation requirement., icon: bulb, ko: 그 덕분에 더 높은 진정 필요량을 예상할 수 있어요, note: 의미}
    - {en: We'll watch closely for withdrawal signs and adjust the sedation., icon: monitor, ko: 금단 징후를 자세히 지켜보고 진정을 조정할게요, note: 계획}
    - {en: 'Being sedated isn''t the same as a coma, and he''ll wake up as we lighten it.', icon: shield, ko: '진정은 혼수와 달라요, 약을 줄이면 깨어나실 거예요', note: 안심}
- title: 진정 깊이와 섬망 연계 관리
  s:
  - t: 위험 설명
    i: shield
    w: can worsen은 악화시킬 수도 있다는 가능성 표현이에요. delirium risk는 섬망이 생길 위험이라서 깊은 진정과 섬망의 연결을 말해요.
    d: from his chart
    k: [깊은 진정은 낙상 위험을 악화시킬 수 있어요., 깊은 흡인은 섬망 위험을 악화시킬 수 있어요.]
    a: worsen
    o: [improve, lower, hide]
  - t: 진정 줄이기
    i: gear
    w: toward our target은 목표 쪽으로 향한다는 방향 표현이에요. lighten은 약을 줄여 얕게 한다는 동사이고 reassess로 한 번에 끝내지 않아요.
    d: in the draft
    k: ['목표를 향해 가볍게 하고 다시 평가할까요?', 목표를 향해 가볍게 하고 다시 평가할게요.]
    a: toward
    o: [against, behind, between]
  - t: 조기 활동
    i: chartup
    w: plus는 두 가지를 함께 더한다는 뜻이에요. early mobility는 일찍 몸을 움직이게 한다는 뜻이라 진정 줄이기와 짝으로 뇌 회복을 돕는다고 말해요.
    d: by the bed
    k: [더 가벼운 진정과 조기 활동이 눈에 도움이 돼요., 더 가벼운 진정과 조기 휴식이 뇌에 도움이 돼요.]
    a: Lighter
    o: [Heavier, Deeper, Stronger]
  - t: 악순환 설명
    i: handshake2
    w: feed each other는 서로 키워 준다는 표현이라 악순환을 한 문장에 담아요. break the cycle together는 팀이 함께 끊자는 뜻이에요.
    d: at the bedside
    k: [섬망과 깊은 진정은 서로를 악화시키니 따로 그 고리를 끊어봐요., 섬망과 깊은 통증은 서로를 악화시키니 함께 그 고리를 끊어봐요.]
    a: break
    o: [bake, bend, bury]
  - t: 활동 시작
    i: calendar
    w: as soon as it's safe는 안전해지는 즉시라는 조건이에요. sitting up and moving은 앉히고 움직이게 한다는 두 동작을 and로 이어요.
    d: for the staff
    k: [안전해지는 대로 앉히고 걷게 해봐요., 안전해지는 대로 앉히고 씻기게 해봐요.]
    a: safe
    o: [quiet, dark, late]
  - t: 듣는 이 구분
    i: speech
    w: With the team … but with his wife …는 듣는 사람에 따라 말을 바꾼다는 대비 모양이에요. 팀에게는 전문 용어를, 가족에게는 쉬운 말을 써요.
    d: on his arm
    k: ['팀에게는 섬망 위험이라 하고, 아드님께는 그냥 깊은 잠이 회복에 도움이 안 된다고 말해요.', '팀에게는 감염 위험이라 하고, 아내분께는 그냥 깊은 잠이 회복에 도움이 안 된다고 말해요.']
    a: wife
    o: [neighbor, landlord, boss]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 섬망 위험 설명 4문장 순서
    why: 깊은 진정이 섬망 위험을 키운다는 말이 먼저이고, That's why가 그 말을 이유로 삼아 진정을 줄이자고 해요. 4줄의 With him lighter는 3줄에서 가볍게 한 뒤 움직이게 한다는 순서를 가리켜요.
    lines:
    - {en: Deep sedation can worsen his delirium risk., icon: shield, ko: 깊은 진정은 섬망 위험을 악화시킬 수 있어요, note: 위험}
    - {en: That's why delirium and deep sedation feed each other., icon: handshake2, ko: 그래서 섬망과 깊은 진정은 서로를 악화시켜요, note: 이유}
    - {en: So let's lighten him toward our target and reassess., icon: gear, ko: 그러니 목표를 향해 가볍게 하고 다시 평가해봐요, note: 조정}
    - {en: 'With him lighter, let''s get him sitting up and moving as soon as it''s safe.', icon: chartup, ko: 가벼워지면 안전해지는 대로 앉히고 움직이게 해봐요, note: 활동}
- title: 프로포폴 주입 증후군 인지
  s:
  - t: 의심 근거
    i: lab
    w: suggest는 확정이 아니라 어떤 쪽을 가리킨다는 동사예요. high-dose propofol 중 젖산과 산증이 오르는 조합이 PRIS를 의심하게 한다는 근거를 말해요.
    d: in room four
    k: [고용량 프로포폴 중 젖산과 체온이 오르면 PRIS가 의심돼요., 소량 프로포폴 중 젖산과 산증이 오르면 PRIS가 의심돼요.]
    a: acidosis
    o: [alkalosis, asthma, arthritis]
  - t: 약 중단
    i: siren
    w: need to …는 해야만 한다는 필요를 분명히 말하는 모양이에요. stop A and switch B는 원인 약을 멈추고 다른 약으로 바꾼다는 두 동작을 and로 이어요.
    d: for the unit
    k: [지금 프로포폴을 멈추고 다른 약제로 바꾸자고 해요., 지금 프로포폴을 멈추고 다른 약제로 바꾸고 있어요.]
    a: switch
    o: [swallow, sweep, sew]
  - t: 즉시 검사
    i: lab
    w: immediately는 지체 없이라는 부사예요. CK와 칼륨, 심장 리듬을 한꺼번에 말해서 이 증후군에서 함께 확인하는 항목을 묶어 줘요.
    d: near the sink
    k: ['CK, 칼륨, 심장 리듬을 즉시 확인할까요?', 'CK, 칼륨, 심장 리듬을 즉시 확인할게요.']
    a: CK
    o: [TV, PC, GPS]
  - t: 추세 설명
    i: chartup
    w: since the last draw는 지난 채혈 이후라는 기준 시점이에요. trending the wrong way는 수치가 나쁜 방향으로 움직인다는 뜻의 숙어예요.
    d: in the bay
    k: [지난번 투여 이후 젖산이 또 올라서 나쁜 방향으로 가고 있어요., 어제 채혈 이후 젖산이 또 올라서 나쁜 방향으로 가고 있어요.]
    a: draw
    o: [drawer, dress, drink]
  - t: 대체 시작
    i: pill
    w: while we're …ing은 두 일을 동시에 한다는 모양이에요. replacement agent를 바로 시작해서 진정이 끊기지 않게 한다는 이유를 담고 있어요.
    d: in the box
    k: ['프로포폴을 멈추는 동안 대체 약제를 시작할까요?', 프로포폴을 멈추는 동안 대체 약제를 시작할게요.]
    a: replacement
    o: [repeated, relaxed, rejected]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 프로포폴 주입 증후군 4문장 순서
    why: 의심 근거가 먼저이고, That's why가 그 의심을 이유로 약을 멈추고 바꾸자고 해요. 3줄이 대체 약을 시작하고, Alongside that이 3줄을 받아 검사를 더해요. 각 줄이 앞 줄을 받아서 순서가 하나예요.
    lines:
    - {en: Rising lactate and acidosis on high-dose propofol suggest PRIS., icon: lab, ko: 고용량 프로포폴 중 젖산과 산증이 오르면 PRIS가 의심돼요, note: 근거}
    - {en: That's why we need to stop the propofol now and switch agents., icon: siren, ko: 그래서 지금 프로포폴을 멈추고 약제를 바꿔야 해요, note: 중단}
    - {en: Let's start the replacement agent while we're stopping the propofol., icon: pill, ko: 프로포폴을 멈추는 동안 대체 약제를 시작해요, note: 대체}
    - {en: 'On top of that, let''s check a CK, potassium, and cardiac rhythm immediately.', icon: lab, ko: '그와 함께 CK, 칼륨, 심장 리듬을 즉시 확인해봐요', note: 검사}
- title: 과진정 호흡정지·저혈압 위기
  s:
  - t: 호흡 정지
    i: siren
