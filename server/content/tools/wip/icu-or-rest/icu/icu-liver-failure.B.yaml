situations:
- title: 간부전 사정·의식 관찰
  sentences:
  - en: Confusion can come from the liver affecting the brain.
    ko: 혼란은 간이 뇌에 영향을 주면서 생길 수 있어요.
    chunks:
    - Confusion can come
    - from the liver
    - affecting
    - the brain
    - .
    words:
    - w-confusion
    - w-liver
    - w-brain
    goal: 1
    tag: 원인 설명
    icon: stetho
    why: '''can''은 가능성만 말해서 가족에게 확정처럼 들리지 않아요. 간 기능이 떨어지면 독소가 뇌에 영향을 줄 수 있다는 설명이에요.'
    decoy: from the stomach
    distractorsKo:
    - 혼란은 췌장이 뇌에 영향을 주면서 생길 수 있어요.
    - 혼란은 간이 눈에 영향을 주면서 생길 수 있어요.
    blank:
      answer: brain
      options:
      - en: brain
      - en: bone
      - en: throat
      - en: ankle
  - en: I'll check how alert and oriented he is now.
    ko: 지금 얼마나 각성돼 있고 지남력이 있는지 확인할게요.
    chunks:
    - I'll check
    - how alert
    - and oriented
    - he is now
    - .
    words:
    - w-check
    - w-alert
    - w-oriented
    - w-now
    goal: 1
    tag: 의식 사정
    icon: magnify
    why: '''alert and oriented''는 의식 사정의 두 축을 한 번에 말해요. 깨어 있는지와 자기 상태를 아는지를 함께 봐요.'
    decoy: to the family
    distractorsKo:
    - 지금 침대 높이를 편하게 맞추고 커튼을 칠게요.
    - 지금 손 소독제를 바르고 장갑을 낄게요.
    blank:
      answer: oriented
      options:
      - en: oriented
      - en: jaundiced
      - en: swollen
      - en: feverish
  - en: Please tell me if he becomes more sleepy or agitated.
    ko: 더 졸려하거나 초조해하면 저에게 알려 주세요.
    chunks:
    - Please tell me
    - if he becomes
    - more sleepy
    - or agitated
    - .
    words:
    - w-tell
    - w-become
    - w-sleepy
    - w-agitated
    goal: 2
    tag: 변화 알림
    icon: speech
    why: '''Please tell me if''로 시작하면 가족에게 부담 없이 변화를 알려 달라는 요청이 돼요. 졸림과 초조함은 의식이 변하는 대표 신호예요.'
    decoy: so that he
    distractorsKo:
    - 더 배고파하거나 초조해하면 저에게 알려 주세요.
    - 더 졸려하거나 목말라하면 저에게 알려 주세요.
    blank:
      answer: agitated
      options:
      - en: agitated
      - en: thirsty
      - en: hungry
      - en: chilly
  - en: I'm grading his mental status against yesterday's baseline.
    ko: 어제 기저치와 비교해서 정신 상태 등급을 매기고 있어요.
