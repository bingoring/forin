    - I'm grading
    - his mental status
    - against yesterday's baseline
    - .
    words:
    - w-grade
    - w-mental
    - w-status
    - w-baseline
    goal: 1
    tag: 기저치 비교
    icon: chartup
    why: '''against yesterday''s baseline''은 비교 기준을 분명히 말해 줘요. 같은 사람의 이전 상태와 견줘야 변화가 보여요.'
    decoy: than before
    distractorsKo:
    - 어제처럼 펜라이트 렌즈를 알코올 솜으로 닦고 있어요.
