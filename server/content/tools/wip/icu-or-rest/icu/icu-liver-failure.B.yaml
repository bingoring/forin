      options:
      - en: baseline
      - en: labs
      - en: scan
      - en: schedule
  - en: Has he opened his eyes on his own this morning?
    ko: 오늘 아침에 스스로 눈을 뜬 적이 있나요?
    chunks:
    - Has he opened
    - his eyes
