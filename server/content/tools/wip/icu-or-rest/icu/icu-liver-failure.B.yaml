    - w-open
    - w-eye
    - w-own
    - w-morning
    goal: 2
    tag: 가족 질문
    icon: speech
    why: '''on his own''은 누가 깨우지 않았는데도 눈을 떴는지를 묻는 말이에요. 자발적 눈 뜨기는 의식 정도를 가르는 단서예요.'
    decoy: by the window
    distractorsKo:
    - 어젯밤에 스스로 눈을 뜬 적이 있나요?
    - 오늘 아침에 스스로 눈을 비빈 적이 있나요?
    blank:
      answer: eyes
      options:
      - en: eyes
      - en: gown
      - en: curtain
      - en: blanket
  - en: It's very helpful when you tell me he didn't recognize you.
    ko: 그가 당신을 못 알아봤다고 말씀해 주시는 게 큰 도움이 돼요.
    chunks:
    - It's very helpful
    - when you tell me
    - he didn't recognize
    - you
    - .
    words:
    - w-helpful
    - w-tell
    - w-recognize
    goal: 2
    tag: 가족 협력
    icon: handshake2
    why: '''It''s very helpful when''으로 가족의 관찰이 도움이 된다고 말하면 계속 알려 달라는 뜻이 따뜻하게 전해져요.'
    decoy: that you saw
    distractorsKo:
    - 그가 간호사를 못 알아봤다고 말씀해 주시는 게 큰 도움이 돼요.
    - 그가 의사를 못 알아봤다고 말씀해 주시는 게 큰 도움이 돼요.
    blank:
      answer: helpful
      options:
      - en: helpful
      - en: harmful
      - en: rude
      - en: costly
  order:
    tag: 대화 흐름
    icon: compass
    ko: 의식 관찰 4문장 순서
    why: 혼란의 원인을 설명해 가족을 안심시킨 뒤 의식을 확인하고, 변화가 있으면 알려 달라 부탁한 다음 그 도움에 고마움을 전해요.
    lines:
    - en: Confusion can come from the liver affecting the brain.
      icon: stetho
      ko: 혼란은 간이 뇌에 영향을 주면서 생길 수 있어요
      note: 설명
    - en: That's why I'll check how alert and oriented he is now.
      icon: magnify
      ko: 그래서 지금 그가 얼마나 각성돼 있고 지남력이 있는지 확인할게요
