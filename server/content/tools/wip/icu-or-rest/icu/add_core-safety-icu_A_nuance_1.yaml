"알람 설정·우선순위 이해":
  - kind: slider
    words: [w-attention, w-immediate, w-lifethreatening]
    cue: "Nurse: \"This one needs a look soon, but nothing is failing right now.\""
    scale: [needs attention, needs immediate action, life-threatening]
    answerAt: 0
    why: "attention은 곧 살펴봐야 한다는 정도예요. immediate action은 바로 움직여야 한다는 뜻이고, life-threatening은 생명이 위험한 수준이라 가장 급해요. 알람 색과 우선순위는 병원·기기 설정에 따라 정해져 있으니 우리 병동의 기준을 먼저 익혀 두세요."
    example: "This alarm needs attention soon."
    exKo: "이 알람은 곧 살펴봐야 해요."
  - kind: context
    words: [w-alarm]
    word: alarm
    ko: 알람
    scenes:
      - {who: 환자에게, icon: me, en: "That alarm just means the clip slipped off your finger.", ok: true}
      - {who: 인계, icon: monitor, en: "The SpO2 alarm sounded at 0200; I repositioned the probe and his sats came back up.", ok: true}
      - {who: 보호자에게, icon: me, en: "The alarm flagged sustained VT with ST changes on lead two.", ok: false, fix: "That alarm means his heart rhythm changed for a few seconds, and I'm checking on him right now."}
    why: "환자와 가족에게는 알람이 왜 울렸는지 쉬운 말로, 동료에게는 어떤 알람이었고 무엇을 했는지 정확하게 전해요. 가족에게 심전도 용어를 그대로 쓰면 겁만 주고 설명은 되지 않아요."
"억제대 적응·대안 확인":
  - kind: slider
    words: [w-sitter, w-restraint, w-restrictive]
    cue: "Nurse: \"He needs someone right beside him, but nothing physical on his arms yet.\""
    scale: [verbal reminder, bedside sitter, restraints]
    answerAt: 1
    why: "말로 다시 알려 주는 것이 가장 덜 제한적이고, 곁에서 지켜보는 sitter는 몸을 묶지 않고 안전을 지켜요. restraints는 몸의 움직임을 제한하는 마지막 수단이라 병원 정책에 따른 처방과 정기적인 재평가가 필요해요."
    example: "A sitter can stay with him instead of restraints."
    exKo: "억제대 대신 관찰 인력이 곁에 있을 수 있어요."
  - kind: context
    words: [w-restraint]
    word: restraint
    ko: 억제대
    scenes:
      - {who: 의사에게, icon: monitor, en: "He keeps pulling at his lines; I'd like an order for restraints if the sitter isn't enough.", ok: true}
      - {who: 차트 기록, icon: board, en: "Restraints applied per order after less restrictive options failed; reassess on schedule.", ok: true}
      - {who: 보호자에게, icon: me, en: "We put him in restraints because he's noncompliant and won't follow instructions.", ok: false, fix: "We're using soft wrist restraints for now so he doesn't pull out his lines, and we'll check on them often."}
    why: "가족에게는 왜 필요한지, 임시라는 것, 자주 확인한다는 것을 설명해요. 'noncompliant'처럼 환자를 탓하는 말은 사정이 어떻든 가족에게 상처가 돼요."
"고위험약 이중확인":
  - kind: slider
    words: [w-wrong, w-stop]
    cue: "Nurse: \"I'm not comfortable giving this until we look at it again.\""
    scale: [I'm concerned, I'm uncomfortable, this is a safety issue]
    answerAt: 1
    why: "우려를 올리는 CUS 순서예요. concerned(걱정돼요) → uncomfortable(불편해요) → safety issue(안전 문제예요)로 갈수록 강해지고, 마지막 말을 들으면 대부분의 병원에서 진행을 멈추고 함께 확인해야 해요."
    example: "I'm uncomfortable with this dose."
    exKo: "이 용량이 불편해요."
  - kind: swap
    words: [w-order, w-check]
    who: "동료에게 · 투약 전 확인"
    icon: monitor
    before: ["I think you ", "made a mistake", " — can we check the order together?"]
    options: [read the number differently, made a mistake, are careless]
    answer: read the number differently
    notes: {read the number differently: "사람을 탓하지 않고 숫자를 같이 보자는 말이에요. 상대도 방어하지 않고 다시 볼 수 있어요.", made a mistake: "맞더라도 처음부터 잘못을 단정해 상대가 방어적으로 돼요.", are careless: "사람을 평가하는 말이라 협력이 깨져요."}
    why: "이중확인은 사람을 시험하는 게 아니라 숫자를 함께 보는 절차예요. 틀렸다고 단정하기보다 같이 보자고 하세요."
    ko: "제 생각엔 숫자를 다르게 읽으신 것 같아요, 처방을 같이 확인할까요"
"라인·튜브 라벨·경로 확인":
  - kind: slider
    words: [w-wrong]
    cue: "Nurse: \"I might be wrong, but I want to check before we push anything.\""
    scale: [quick question, I might be wrong, this is the wrong line]
    answerAt: 1
    why: "'I might be wrong, but…'은 우려를 부드럽게 꺼내는 말이지만 확인하자는 요청은 분명해요. 틀렸다고 확신하면 'This is the wrong line'처럼 분명히 말해 멈추게 하세요."
    example: "I might be wrong, but let's trace it."
    exKo: "제가 틀릴 수도 있지만, 따라가 봐요."
  - kind: context
    words: [w-line]
    word: line
    ko: 라인
    scenes:
      - {who: 동료에게, icon: monitor, en: "Trace this line from the bag to the patient with me.", ok: true}
      - {who: 차트 기록, icon: board, en: "Line traced from bag to patient and labeled at both ends.", ok: true}
      - {who: 환자에게, icon: me, en: "I'm tracing each lumen of your central line to rule out a cross-connection.", ok: false, fix: "I'm just following your IV tubing from the bag to your arm to make sure everything is hooked up right."}
    why: "동료에게는 정확한 말로, 환자에게는 무엇을 하는지 쉬운 말로 설명해요. 환자는 lumen이나 cross-connection이 무슨 뜻인지 몰라 오히려 불안해해요."
"낙상·손상 예방 기초":
  - kind: slider
    words: [w-risk, w-high]
    cue: "Nurse: \"He's confused, restless, and he's tried to climb out twice tonight.\""
    scale: [low risk, some risk, high risk]
    answerAt: 2
    why: "낙상 위험은 지남력·움직임·약 같은 요인을 합쳐 평가해요. 혼란스럽고 안절부절못하며 이미 일어나려 했다면 high risk로 보고 예방 조치를 늘려요. 위험도는 근무마다 다시 확인해요."
    example: "He's a high fall risk tonight."
    exKo: "이분은 오늘 밤 낙상 위험이 높아요."
  - kind: swap
    words: [w-fall, w-risk, w-alarm]
    who: "환자에게 · 침대 알람 설명"
    icon: me
    before: ["The bed alarm is here because you're ", "a fall risk", "."]
    options: [a bit unsteady, a fall risk, likely to fall]
    answer: a bit unsteady
    notes: {a bit unsteady: "환자에게 쉬운 말이에요. 사실 그대로이고 겁을 주지 않아요.", a fall risk: "의료진이 차트에 쓰는 말이라 환자는 낙인처럼 들을 수 있어요.", likely to fall: "곧 넘어질 사람처럼 들려 불안과 위축을 키워요."}
    why: "같은 안전 조치라도 환자에게는 이유를 쉬운 말로, 의료진끼리는 차트 용어로 말해요."
    ko: "침대 알람은 몸이 조금 불안정하셔서 켜 둔 거예요"
"투약 5R 확인":
  - kind: slider
    words: [w-allergy, w-chart]
    cue: "Nurse: \"I read the chart, and I asked him myself — both say no allergies.\""
    scale: [chart says none, he told me none, chart and patient agree]
    answerAt: 2
    why: "차트와 환자 본인 확인이 함께 있을 때 가장 믿을 만해요. 차트에만 의존하면 기록이 틀리거나 빠졌을 수 있고, 환자가 말할 수 없으면 가족이나 약국 기록으로 확인해요."
    example: "The chart and the patient agree on no allergies."
    exKo: "차트와 환자 모두 알레르기가 없다고 해요."
  - kind: context
    words: [w-check]
    word: check
    ko: 확인하다
    scenes:
      - {who: 동료에게, icon: monitor, en: "Check the wristband against the order before you push anything.", ok: true}
      - {who: 차트 기록, icon: board, en: "Patient ID checked with wristband scan and two identifiers; allergies checked.", ok: true}
      - {who: 환자에게, icon: me, en: "I need to check your two identifiers against the MAR, so state your DOB.", ok: false, fix: "Before I give this, I need to check who you are — can you tell me your full name and date of birth?"}
    why: "환자에게는 무엇을 왜 묻는지 쉬운 말로 해요. 이름과 생년월일을 직접 말하게 해야 확인이 돼요. 침상 번호는 식별자로 쓰지 않아요."
