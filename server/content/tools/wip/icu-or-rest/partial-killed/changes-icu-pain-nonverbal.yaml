theme: icu-pain-nonverbal
changes:
- kind: word
  id: w-tense
  fields:
  - en
  - ipa
  why: 활용형(tensing)을 원형으로
- kind: word
  id: w-premedicate
  fields:
  - en
  - ipa
  why: 활용형(pre-medicating)을 원형으로
- kind: word
  id: w-low
  fields:
  - en
  - ipa
  - ko
  why: 문장 세 개가 모두 lower(동사·비교급)로 쓰는데 헤드워드가 low였다 — 문장의 모습으로 / 헤드워드를 lower로 바꾸면서 ko도 맞춤 (can lower his pain / lowers his dose / much lower)
- kind: word
  id: w-tolerance
  fields:
  - ko
  why: ko '순응(견딤)'은 w-compliance '순응도'와 거의 같고, 12번 상황의 tolerance(약물 내성)를 담지 못한다 — 두 문장 모두 담게
- kind: word
  id: w-medication
  fields:
  - ko
  why: ko '약물'이 w-drug와 같아 듣고 뜻 고르기에서 정답이 둘이 된다 — medication은 '약제'로 가름
- kind: word
  id: w-control
  fields:
  - ko
  why: ko '조절되다'는 'pain control'·'poor control'(명사)을 못 담는다 — 동사·명사 모두 담게
- kind: word
  id: w-break
  fields:
  - ko
  why: '''break through''(통증이 뚫고 나오다)로 쓰이는데 ko가 ''뚫다''였다'
- kind: word
  id: w-rate
  fields:
  - ko
  why: ko '수치'는 respiratory rate·heart rate의 '수'를 못 짚는다
- kind: word
  id: w-monitor
  fields:
  - ko
  why: 명사(on the monitor)와 동사(monitor closely) 두 문장에 쓰여 둘 다 담음
- kind: word
  id: w-level
  fields:
  - ko
  why: '''his level should be near peak''은 약물 농도 — ko를 ''수준''만 두면 흐리다'
