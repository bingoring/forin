situations:
- title: CAM-ICU 선별 시행
  sentences:
  - en: Let's start CAM-ICU with his baseline mental status.
    ko: 기저 정신 상태부터 CAM-ICU를 시작할게요.
    chunks:
    - Let's start
    - CAM-ICU
    - with his baseline
    - mental status
    - .
    words:
    - w-start
    - w-camicu
    - w-baseline
    - w-mental
    - w-status
    goal: 1
    tag: 선별 시작
    icon: magnify
    why: Let's로 열면 혼자가 아니라 같이 하는 일이 되고, baseline부터 보면 이후 변화를 견줄 기준이 생겨요.
    decoy: for the lab
    distractorsKo:
    - 어제 정신 상태부터 CAM-ICU를 시작할게요
    - 기저 통증 점수부터 CAM-ICU를 시작할게요
    blank:
      answer: baseline
      options:
      - en: baseline
      - en: target
      - en: worst
      - en: discharge
  - en: First we check for an acute change or a fluctuating course.
    ko: 먼저 급성 변화나 변동하는 경과가 있는지 확인해요.
    chunks:
    - First
    - we check
    - for an acute change
    - or a fluctuating course
    - .
    words:
    - w-check
    - w-acute
    - w-change
    - w-fluctuating
    - w-course
    goal: 1
    tag: 1단계 확인
    icon: check
    why: First로 순서를 알리고, acute change와 fluctuating course는 CAM-ICU 첫 항목을 가리키는 표현이에요.
    decoy: in his labs
    distractorsKo:
    - 먼저 급성 변화나 변동하는 혈압이 있는지 확인해요
    - 먼저 급성 통증이나 변동하는 경과가 있는지 확인해요
    blank:
      answer: fluctuating
      options:
      - en: predictable
      - en: fluctuating
      - en: constant
      - en: gradual
  - en: We check inattention and disorganized thinking next.
    ko: 다음으로 부주의와 사고 와해를 확인해요.
    chunks:
    - We check
    - inattention and disorganized thinking
    - next
    - .
    words:
    - w-check
    - w-inattention
    - w-disorganized
    - w-thinking
    goal: 1
    tag: 다음 단계
    icon: board
    why: next를 끝에 붙이면 지금 단계가 끝나고 이어질 단계가 있다는 신호예요. inattention과 disorganized thinking은 CAM-ICU 항목 이름이에요.
    decoy: every hour
    distractorsKo:
    - 다음으로 졸림과 사고 와해를 확인해요
    - 다음으로 부주의와 기억 상실을 확인해요
    blank:
      answer: inattention
      options:
      - en: infection
      - en: incontinence
      - en: inattention
      - en: intubation
  - en: He can't squeeze my hand twice when I ask him to.
    ko: 환자가 제 손을 두 번 쥐라는 요청에 응하지 못해요.
    chunks:
    - He can't squeeze
    - my hand twice
    - when I ask
    - him to
    - .
    words:
    - w-squeeze
    - w-hand
    - w-ask
    goal: 2
    tag: 주의력 시험
    icon: monitor
    why: can't 뒤에 동사 원형으로 못 하는 동작을 구체적으로 보고하면, 판정 근거가 그대로 전해져요.
    decoy: his arm
    distractorsKo:
    - 환자가 제 팔을 두 번 쥐라는 요청에 응하지 못해요
    - 환자가 제 손을 세 번 쥐라는 요청에 응하지 못해요
    blank:
      answer: twice
      options:
      - en: once
      - en: rarely
      - en: daily
      - en: twice
  - en: That means his attention feature is positive.
    ko: 그건 주의력 항목이 양성이라는 뜻이에요.
    chunks:
    - That means
    - his attention feature
    - is positive
    - .
    words:
    - w-attention
    - w-feature
    - w-positive
    goal: 2
    tag: 결과 해석
    icon: chartup
    why: That means로 앞의 관찰을 결론으로 이어요. feature는 CAM-ICU의 평가 항목을 부르는 말이에요.
    decoy: a lot
    distractorsKo:
    - 그건 수면 항목이 양성이라는 뜻이에요
    - 그건 주의력 항목이 기록됐다는 뜻이에요
    blank:
      answer: attention
      options:
      - en: attention
      - en: memory
      - en: vision
      - en: hearing
  - en: If two features are positive, he screens delirious.
    ko: 두 항목이 양성이면 섬망으로 판정돼요.
    chunks:
    - If two features
    - are positive
    - ', he screens delirious'
    - .
    words:
    - w-feature
    - w-positive
    - w-screen
    - w-delirious
    goal: 2
    tag: 판정 규칙
    icon: shield
    why: If절 뒤에 현재형으로 말하면 '그 조건이면 늘 그렇게 판정한다'는 규칙이 돼요. screen은 선별검사로 걸러 낸다는 동사예요.
    decoy: by the nurse
    distractorsKo:
    - 세 항목이 양성이면 섬망으로 판정돼요
    - 두 항목이 양성이면 치매로 판정돼요
    blank:
      answer: delirious
      options:
      - en: agitated
      - en: delirious
      - en: anxious
      - en: drowsy
  - en: I'll document the result and update the team.
    ko: 결과를 기록하고 팀에 알릴게요.
    chunks:
    - I'll document
    - the result
    - and update
    - the team
    - .
    words:
    - w-document
    - w-result
    - w-update
    - w-team
    goal: 2
    tag: 기록·공유
    icon: pencil
    why: I'll은 지금 맡겠다는 말이고, document와 update를 한 문장에 묶으면 결과가 팀에 끊김 없이 전해져요.
    decoy: the pharmacy
    distractorsKo:
    - 결과를 기록하고 약사에게 알릴게요
    - 결과를 확인하고 팀에 알릴게요
    blank:
      answer: result
      options:
      - en: rumor
      - en: recipe
      - en: result
      - en: receipt
  order:
    tag: 선별 흐름
    icon: compass
    ko: CAM-ICU 선별 4단계 순서
    why: 기준이 되는 상태를 먼저 보고, 시험을 한 뒤, 결과를 해석하고, 마지막에 기록과 공유로 닫아요. 뒤 줄은 앞 줄을 가리켜 순서가 정해져요.
    lines:
    - en: Let's start with his baseline mental status.
      icon: magnify
      ko: 기저 정신 상태부터 시작해요
      note: 기준
