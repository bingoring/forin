- n: 5
  s:
  - {tag: "원인 점검", icon: magnify, why: "screen for A, B, and C로 점검할 항목을 나열해요. first로 섬망으로 보기 전에 원인부터 본다는 우선순위를 밝혀요.", decoy: "on arrival", dko: ["먼저 통증, 요저류, 저산소증부터 팀에 알려요", "먼저 통증, 요저류, 저산소증부터 적어 둬요"], ans: first, wrong: [last, twice, daily]}
  - {tag: "요저류 확인", icon: magnify, why: "Check A and B처럼 명령문으로 할 일을 이어요. bladder scan은 방광에 소변이 얼마나 찼는지 보는 검사예요.", decoy: "the chart", dko: ["방광 스캔과 마지막 식사 시간을 확인해요", "방광 스캔과 마지막 배변 여부를 기록해요"], ans: last, wrong: [first, next, daily]}
  - {tag: "추가 확인", icon: lab, why: "I'll also로 앞서 말한 확인에 더 얹는다는 뜻을 보여요. oxygen level과 labs는 저산소와 대사 원인을 가려내는 자료예요.", decoy: "this hour", dko: ["산소포화도와 검사 수치도 같이 설명할게요", "산소포화도와 검사 수치도 팀과 공유할게요"], ans: review, wrong: [record, report, restart]}
  - {tag: "원인 치료", icon: pill, why: "Treating the trigger가 통째로 주어예요(유발요인을 치료하는 일). often으로 항상은 아니라는 단서를 달아요.", decoy: "for hours", dko: ["유발요인을 치료하면 졸음이 대개 가라앉아요", "유발요인을 알리면 혼란이 대개 가라앉아요"], ans: clears, wrong: [causes, hides, repeats]}
  - {tag: "순서 원칙", icon: shield, why: "before we assume ...으로 결론보다 먼저 할 일을 못 박아요. reversible causes는 바로잡으면 좋아질 수 있는 원인이에요.", decoy: "while we wait", dko: ["치매로 단정하기 전에 교정 가능한 원인부터 바로잡아요", "불안으로 단정하기 전에 교정 가능한 원인부터 바로잡아요"], ans: reversible, wrong: [rare, hidden, chronic]}
  - {tag: "흔한 원인", icon: faceWorried, why: "alone으로 이것 하나만으로도라고 강조해 흔히 놓치는 원인임을 알려요. can은 가능성이라 모든 환자가 그렇다는 뜻은 아니에요.", decoy: "for hours", dko: ["방광이 가득 차 있는 것만으로도 환자가 심하게 졸릴 수 있어요", "위가 가득 차 있는 것만으로도 환자가 심하게 초조해질 수 있어요"], ans: agitate, wrong: [injure, transfer, educate]}
  order:
    tag: "원인 찾기"
    icon: compass
    ko: "섬망 전에 원인을 찾는 4문장 순서"
    why: "먼저 점검할 것을 말하고, 그중 요저류 확인법을 짚고, 찾은 것은 바로잡는다는 원칙을 밝힌 뒤, 치료의 효과로 닫아요. 줄마다 앞 줄을 가리켜 순서가 정해져요."
    lines:
    - {en: "Let's screen for pain, retention, and hypoxia first.", icon: magnify, ko: "먼저 통증, 요저류, 저산소증부터 살펴봐요", note: 점검}
    - {en: "For retention, check his bladder scan and last bowel movement.", icon: lab, ko: "요저류는 방광 스캔과 마지막 배변을 확인해요", note: 확인}
    - {en: "Whatever we find, we correct before we assume delirium.", icon: shield, ko: "뭐가 나오든 섬망으로 단정하기 전에 바로잡아요", note: 원칙}
    - {en: "Treating that often clears the confusion.", icon: pill, ko: "그걸 치료하면 혼란이 대개 가라앉아요", note: 효과}
- n: 6
  s:
  - {tag: "오해 바로잡기", icon: faceWorried, why: "A doesn't mean B로 흔한 오해를 먼저 부정하고, could be로 가능성을 열어요. 조용한 환자는 괜찮다는 잘못된 안심을 막는 말이에요.", decoy: "for now", dko: ["조용하다고 괜찮은 게 아니라, 과활동형 섬망일 수 있어요", "조용하다고 괜찮은 게 아니라, 저활동형 치매일 수 있어요"], ans: hypoactive, wrong: [hyperactive, proactive, interactive]}
  - {tag: "관찰 보고", icon: monitor, why: "hasn't + 과거분사는 근무 시작부터 지금까지 이어진 상태를 말해요. 말수와 눈맞춤처럼 구체적인 행동을 대면 보고에 근거가 생겨요.", decoy: "since noon", dko: ["이번 근무 내내 말도 별로 안 하고 손도 잘 안 움직여요", "이번 근무 내내 먹지도 별로 않고 눈도 잘 안 마주쳐요"], ans: eye, wrong: [hand, ear, skin]}
  - {tag: "놓치기 쉬움", icon: magnify, why: "easy to miss처럼 easy to + 동사는 ~하기 쉽다는 뜻이에요. 조용한 환자일수록 눈에 덜 띄어 지나치기 쉽다는 경고예요.", decoy: "for the team", dko: ["위축되고 부주의한 환자는 설득하기 쉬워요", "활발하고 부주의한 환자는 놓치기 쉬워요"], ans: miss, wrong: [treat, lift, teach]}
  - {tag: "선별 권유", icon: check, why: "even though 뒤에 반전되는 사실(차분하다)을 붙이면 그래도 해야 한다는 뜻이 선명해져요. 얌전해 보이는 환자에게도 선별이 필요해요.", decoy: "on the unit", dko: ["환자가 졸려 보여도 CAM-ICU를 시행해봐요", "환자가 슬퍼 보여도 CAM-ICU를 시행해봐요"], ans: CAM-ICU, wrong: [labs, drills, errands]}
  - {tag: "양성 가능성", icon: chartup, why: "can still의 still이 그런데도를 더해 얌전해 보여도 양성일 수 있다는 점을 강조해요. screen positive는 선별검사에서 양성이 나온다는 표현이에요.", decoy: "at times", dko: ["초조한 환자도 선별검사에서 양성이 나올 수 있어요", "차분한 환자도 혈액검사에서 양성이 나올 수 있어요"], ans: positive, wrong: [early, twice, alone]}
  - {tag: "정기 선별", icon: calendar, why: "not just when ...으로 조건이 있을 때만이 아니라 정기로 한다고 못 박아요. every shift는 근무조마다 한 번씩이라는 뜻이에요.", decoy: "at noon", dko: ["졸려 보일 때만이 아니라 매 근무마다 확인해요", "초조해 보일 때만이 아니라 매 시간마다 확인해요"], ans: shift, wrong: [meal, visit, sleep]}
  order:
    tag: "조용한 섬망"
    icon: compass
    ko: "저활동형 섬망을 놓치지 않는 4문장 순서"
    why: "먼저 오해를 바로잡고, 놓치기 쉬운 이유를 대고, 그래서 선별하자고 제안한 뒤, 반복하자고 닫아요. that's why·so·it이 앞 줄을 이어 순서가 정해져요."
    lines:
    - {en: "Quiet doesn't mean fine — this could be hypoactive delirium.", icon: faceWorried, ko: "조용하다고 괜찮은 게 아니에요, 저활동형 섬망일 수 있어요", note: 오해}
    - {en: "That's why withdrawn, inattentive patients are easy to miss.", icon: magnify, ko: "그래서 위축되고 부주의한 환자는 놓치기 쉬워요", note: 이유}
    - {en: "So let's run CAM-ICU even though he's calm.", icon: check, ko: "그러니 차분해 보여도 CAM-ICU를 시행해요", note: 제안}
    - {en: "We'll repeat it every shift, not just when he seems agitated.", icon: calendar, ko: "초조해 보일 때만이 아니라 매 근무마다 반복해요", note: 반복}
- n: 7
  s:
  - {tag: "안심", icon: shield, why: "I hear you는 말을 듣고 있다는 공감 표현이에요. you're safe를 바로 이어 불안한 환자에게 가장 필요한 말을 먼저 줘요.", decoy: "to wait", dko: ["모습이 보여요 — 안전하고, 제가 도와드리려고 여기 있어요", "목소리 들려요 — 안전하고, 제가 도와드리려고 다시 왔어요"], ans: safe, wrong: [sorry, ready, late]}
  - {tag: "호흡 유도", icon: play, why: "Let's ... together로 지시가 아니라 함께 하는 일로 만들어 환자가 덜 압박받아요. our를 쓰면 의료진도 함께 목소리를 낮춘다는 뜻이에요.", decoy: "for a minute", dko: ["천천히 같이 숨을 쉬고 불빛도 낮춰봐요", "천천히 같이 눈을 감고 목소리도 낮춰봐요"], ans: voices, wrong: [hands, eyes, heads]}
  - {tag: "불안 달래기", icon: shield, why: "No one is going to ~로 환자가 두려워하는 위협을 정면으로 부정해요. right now가 지금 이 순간은 안전하다고 범위를 정직하게 줄여요.", decoy: "from here", dko: ["지금은 아무도 깨우지 않을 거예요", "지금은 아무도 부르지 않을 거예요"], ans: hurt, wrong: [wake, call, visit]}
  - {tag: "상황 알림", icon: hospital, why: "장소를 먼저 알려 주고 곧바로 곁에 있겠다고 약속해요. beside you는 바로 옆에, stay는 자리를 지킨다는 뜻이에요.", decoy: "outside the door", dko: ["여기는 병원이고, 제가 문 앞에 있을게요", "여기는 병원이고, 제가 곧 돌아올게요"], ans: beside, wrong: [behind, outside, below]}
  - {tag: "약 전 시도", icon: speech, why: "try + ~ing는 시도해 본다는 뜻이라 결과를 장담하지 않아요. before any medication은 약보다 대화를 먼저 쓴다는 순서예요.", decoy: "after lunch", dko: ["약을 쓰기 전에 먼저 음악으로 풀어볼게요", "검사를 하기 전에 먼저 말로 풀어볼게요"], ans: talking, wrong: [walking, texting, rushing]}
  - {tag: "함께 쉬기", icon: coffee, why: "for a minute로 짧은 시간만 제안하면 환자가 부담 없이 따라올 수 있어요. 의료진이 서 있지 않고 같이 앉으면 덜 위협적으로 보여요.", decoy: "for hours", dko: ["잠깐 같이 누워 있어요", "몇 시간 같이 앉아있어요"], ans: together, wrong: [alone, early, firmly]}
  order:
    tag: "초조 달래기"
    icon: compass
    ko: "초조한 환자를 말로 달래는 4문장 순서"
    why: "먼저 안심시키고, 장소와 곁에 있음을 알리고, 호흡을 같이 하자고 한 뒤, 약보다 대화를 먼저 쓰겠다고 닫아요. now that·keep이 앞 줄을 이어요."
    lines:
    - {en: "I hear you — you're safe and I'm here to help.", icon: shield, ko: "목소리 들려요, 안전해요, 도우러 왔어요", note: 안심}
    - {en: "You're in the hospital, and I'll stay right beside you.", icon: hospital, ko: "여기는 병원이고 제가 바로 옆에 있을게요", note: 알림}
    - {en: "Now that I'm beside you, let's take a slow breath together.", icon: play, ko: "옆에 있으니 천천히 같이 숨을 쉬어봐요", note: 호흡}
    - {en: "We'll keep talking this through before any medication.", icon: speech, ko: "약을 쓰기 전에 계속 말로 풀어볼게요", note: 대화}
- n: 8
  s:
  - {tag: "유발 약물", icon: pill, why: "can worsen은 항상이 아니라 악화시킬 수 있다는 가능성의 표현이에요. 약물군 둘을 and로 묶어 함께 점검할 대상으로 보여 줘요.", decoy: "during sleep", dko: ["벤조디아제핀과 항콜린성 약물은 발열을 악화시킬 수 있어요", "벤조디아제핀과 비타민제는 섬망을 악화시킬 수 있어요"], ans: worsen, wrong: [explain, measure, rename]}
  - {tag: "약 목록 검토", icon: board, why: "review A for B는 무엇이 있는지 찾으며 훑어본다는 구조예요. deliriogenic은 섬망을 일으킬 수 있는 약을 뜻해요.", decoy: "with the chart", dko: ["알레르기 유발약물이 있는지 투약 목록을 검토해볼게요", "섬망 유발약물이 있는지 간호 기록을 검토해볼게요"], ans: deliriogenic, wrong: [delirious, deliberate, delivery]}
  - {tag: "용량 우려", icon: pill, why: "looks high for his age처럼 나이에 비해라는 기준을 붙이면 단정이 아니라 관찰로 들려요. 간호사는 처방을 바꾸지 않고 우려를 말하는 데서 시작해요.", decoy: "for his chart", dko: ["로라제팜 용량이 체중에 비해 높아 보여요", "로라제팜 용량이 신장에 비해 높아 보여요"], ans: lorazepam, wrong: [labetalol, lactulose, lisinopril]}
  - {tag: "대안 제안", icon: handshake2, why: "We can ...은 간호사가 처방하지 않고 팀에 제안할 수 있다는 정직한 범위를 말해요. propose A to B는 B에게 A를 제안한다는 뜻이에요.", decoy: "to the family", dko: ["약사에게 더 안전한 대체 약물을 제안해볼 수 있어요", "팀에 더 저렴한 대체 약물을 제안해볼 수 있어요"], ans: alternatives, wrong: [alarms, answers, apologies]}
  - {tag: "대안 근거", icon: bulb, why: "might는 그럴 수도 있다는 조심스러운 추측이에요. just as well은 똑같이 잘이라서 대체해도 효과가 줄지 않을 수 있다는 말이에요.", decoy: "much longer", dko: ["벤조 계열이 아닌 약도 통증을 비슷하게 조절할 수 있어요", "벤조 계열이 아닌 약도 초조를 훨씬 더 잘 조절할 수 있어요"], ans: agitation, wrong: [appetite, vision, hearing]}
  - {tag: "의사 보고", icon: bell, why: "flag this는 눈여겨봐 달라고 표시해 알린다는 뜻이에요. during rounds는 의사가 환자를 보는 때에 맞춰 전하는 시점이에요.", decoy: "after lunch", dko: ["회진 때 비용 부분을 의사에게 알릴게요", "회진 전에 이 부분을 의사에게 알릴게요"], ans: flag, wrong: [fix, sign, file]}
  order:
    tag: "약물 점검"
    icon: compass
    ko: "유발 약물을 점검하고 알리는 4문장 순서"
    why: "먼저 약물의 위험을 말하고, 목록 검토를 제안하고, 찾은 우려를 구체적으로 말한 뒤, 의사에게 알린다고 닫아요. so·in it·that이 앞 줄을 이어 순서가 정해져요."
    lines:
    - {en: "Benzodiazepines and anticholinergics can worsen delirium.", icon: pill, ko: "벤조와 항콜린성 약물은 섬망을 악화시킬 수 있어요", note: 위험}
    - {en: "So let's review his med list for deliriogenic drugs.", icon: board, ko: "그러니 유발약물이 있는지 투약 목록을 검토해요", note: 검토}
    - {en: "In it, his lorazepam dose looks high for his age.", icon: pill, ko: "거기서 로라제팜 용량이 나이에 비해 높아 보여요", note: 우려}
    - {en: "I'll flag that for the physician during rounds.", icon: bell, ko: "그걸 회진 때 의사에게 알릴게요", note: 보고}
- n: 9
  s:
  - {tag: "낮밤 원칙", icon: bulb, why: "짝을 이루는 말(daytime ↔ nighttime)을 쉼표로 맞세워 규칙을 한눈에 보여 줘요. 동사 없이 명사만 이어 구호처럼 외우기 쉬워요.", decoy: "all week", dko: ["낮에는 빛과 소음을, 밤에는 조용함과 어둠을 줘요", "낮에는 빛과 활동을, 밤에는 조용함과 음악을 줘요"], ans: activity, wrong: [silence, isolation, traffic]}
  - {tag: "규칙적 습관", icon: calendar, why: "every morning at the same time으로 매일 같은 시각이라는 규칙성을 강조해요. 일정한 신호가 몸의 낮밤 리듬을 다시 맞춰 줘요.", decoy: "at noon", dko: ["매일 아침 같은 시간에 병실 문을 열어요", "매일 저녁 같은 시간에 블라인드를 열어요"], ans: morning, wrong: [evening, night, noon]}
  - {tag: "저녁 규칙", icon: compass, why: "as soon as는 조건이 되는 즉시를 뜻해요. 해 질 무렵 닫는 것까지 짝으로 지켜야 낮밤 신호가 뚜렷해져요.", decoy: "after the shift", dko: ["해가 지면 곧바로 불을 꺼요", "비가 오면 곧바로 다시 닫아요"], ans: sets, wrong: [rises, shines, burns]}
  - {tag: "케어 번들", icon: board, why: "bundle은 근거가 있는 조치 여럿을 한 묶음으로 함께 시행하는 방식이에요. ties ... together로 따로 놀기 쉬운 세 가지를 한 흐름으로 이어요.", decoy: "in order", dko: ["ABCDEF 번들은 진정, 이동, 청소를 함께 묶어요", "ABCDEF 번들은 진정, 이동, 수면을 함께 설명해요"], ans: ties, wrong: [buys, tests, teaches]}
  - {tag: "수면 보호", icon: shield, why: "protect는 방해로부터 지킨다는 동사라 수면을 건드리지 않을 시간을 의식적으로 계획한다는 뜻이에요. a block of는 한 덩어리의 시간이에요.", decoy: "for his visitors", dko: ["오늘 밤은 끊기지 않는 회의 시간을 지켜줘요", "내일 아침은 끊기지 않는 수면 시간을 지켜줘요"], ans: uninterrupted, wrong: [unimportant, unexpected, uncomfortable]}
  - {tag: "리듬 회복", icon: chartup, why: "get A back on schedule은 어긋난 것을 제 일정으로 돌려놓는다는 관용 표현이에요. steady는 흔들리지 않고 일정하다는 뜻이에요.", decoy: "ahead of time", dko: ["안정된 리듬이 몸을 다시 제 궤도로 돌려놔요", "안정된 약물이 뇌를 다시 제 궤도로 돌려놔요"], ans: steady, wrong: [sudden, strange, loud]}
  order:
    tag: "리듬 회복"
    icon: compass
    ko: "수면-각성 리듬을 되찾는 4문장 순서"
    why: "먼저 낮밤 원칙을 말하고, 아침 습관을 정한 뒤, 저녁 짝 습관을 더하고, 효과로 닫아요. so·them·like that이 앞 줄을 이어 순서가 정해져요."
    lines:
    - {en: "Daytime light and activity, nighttime quiet and dark.", icon: bulb, ko: "낮에는 빛과 활동, 밤에는 조용함과 어둠", note: 원칙}
    - {en: "So we open the blinds every morning at the same time.", icon: calendar, ko: "그래서 매일 아침 같은 시간에 블라인드를 열어요", note: 아침}
    - {en: "We close them again as soon as the sun sets.", icon: compass, ko: "해가 지면 곧바로 다시 닫아요", note: 저녁}
    - {en: "A steady rhythm like that gets his brain back on schedule.", icon: chartup, ko: "그런 안정된 리듬이 뇌를 제 궤도로 돌려놔요", note: 효과}
