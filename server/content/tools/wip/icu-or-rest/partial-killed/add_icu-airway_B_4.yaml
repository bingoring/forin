15:
  s:
  - {tag: 위기 선언, icon: siren, why: "\"can't-intubate, can't-oxygenate\"처럼 두 불가능을 쉼표로 나란히 말하면 CICO의 정의가 한 호흡에 전달돼요.", decoy: "for the first time", dk: ["삽관도 안 되고 흡인도 안 되는 응급 상황이에요", "삽관도 안 되고 고정도 안 되는 응급 상황이에요"], ans: emergency, opts: [routine, practice, question]}
  - {tag: 즉시 지시, icon: siren, why: "\"stat\"은 지금 당장이라는 의료 약어라서 천천히가 아니라 최우선으로 처리하라는 뜻이에요.", decoy: "from the closet", dk: ["흡인 카테터 키트를 열고 외과에 즉시 연락하세요", "정맥 주사 키트를 열고 외과에 즉시 연락하세요"], ans: stat, opts: [quietly, politely, gently]}
  - {tag: 병행 진행, icon: siren, why: "\"while …\"로 두 일을 동시에 진행한다고 말해서 산소화 시도를 멈추지 않는다는 것을 분명히 해요.", decoy: "with the bag", dk: ["수액을 준비하는 동안 계속 산소화를 시도할게요", "약물을 준비하는 동안 계속 산소화를 시도할게요"], ans: surgical, opts: [dental, cosmetic, emotional]}
  - {tag: 지원 요청, icon: bell, why: "\"Someone call …\"처럼 주어를 someone으로 두면 특정인이 아니라 가장 가까운 사람이 바로 움직이라는 뜻이에요.", decoy: "to the lab", dk: ["지금 당장 누군가 산소를 요청하세요", "지금 당장 누군가 흡인기를 요청하세요"], ans: backup, opts: [dinner, coffee, music]}
  - {tag: 위치 표시, icon: pushpin, why: "\"I'm -ing\"는 지금 하고 있는 동작을 실시간으로 중계해서 팀이 다음 준비를 맞추게 해요.", decoy: "on the screen", dk: ["지금 윤상갑상막 위치를 촉진하고 있어요", "지금 윤상갑상막 위치를 소독하고 있어요"], ans: marking, opts: [washing, painting, wrapping]}
  - {tag: 시간 알림, icon: speaker, why: "\"out loud\"는 속으로가 아니라 팀 모두가 듣게 소리 내라는 뜻이라 경과 시간을 함께 의식하게 해요.", decoy: "on the phone", dk: ["꼼짝 못하는 동안 매 분마다 산소포화도를 큰 소리로 말해 주세요", "꼼짝 못하는 동안 매 분마다 맥박을 큰 소리로 말해 주세요"], ans: minute, opts: [hour, week, day]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 삽관·산소화 불가 위기에 대응하는 4문장 순서
    why: 위기를 선언하고, 키트를 열며 외과를 부르고, 키트가 열리면 위치를 표시하고, 그 모든 동안 산소화를 시도해요.
    lines:
    - {en: "This is a can't-intubate, can't-oxygenate emergency.", icon: siren, ko: "삽관도 산소화도 안 되는 응급 상황이에요", note: 선언}
    - {en: "Get the cricothyrotomy kit open and call surgery stat.", icon: bell, ko: "윤상갑상막절개술 키트를 열고 외과에 즉시 연락하세요", note: 호출}
    - {en: "With the kit open, I'm marking the cricothyroid membrane now.", icon: pushpin, ko: "키트가 열렸으니 지금 윤상갑상막 위치를 표시해요", note: 표시}
    - {en: "Through all of that, I'll keep attempting to oxygenate.", icon: bulb, ko: "그 모든 동안 계속 산소화를 시도할게요", note: 산소화}
16:
  s:
  - {tag: 즉시 중단, icon: siren, why: "\"Stop\"과 \"bag-mask ventilate\"를 and로 이으면 먼저 멈추고 바로 산소를 주라는 두 동작이 이어져요.", decoy: "from the head", dk: ["알람을 멈추고 100퍼센트 산소로 백마스크 환기하세요", "타이머를 멈추고 100퍼센트 산소로 백마스크 환기하세요"], ans: attempt, opts: [alarm, count, music]}
  - {tag: 원인과 순서, icon: chartup, why: "\"A is from B, so C comes first\"는 원인을 짚고 그에 맞는 우선순위를 결론으로 내리는 틀이에요.", decoy: "in this case", dk: ["서맥은 통증 때문이라 산소화가 먼저예요", "서맥은 약물 때문이라 산소화가 먼저예요"], ans: hypoxia, opts: [fever, pain, hunger]}
  - {tag: 조건 대응, icon: siren, why: "\"If …, we start …\"는 조건과 행동을 한 문장에 묶어 어떤 상태가 되면 무엇을 하는지 미리 약속해 둬요.", decoy: "on the wall", dk: ["심박수가 계속 서맥 알고리즘을 시작해요", "산소포화도가 계속 낮으면 심정지 알고리즘을 시작해요"], ans: algorithm, opts: [schedule, menu, poster]}
  - {tag: 모니터 담당, icon: monitor, why: "\"Someone\"을 주어로 두면 지시받는 사람이 정해지지 않아 가까운 사람이 바로 맡는다는 뜻이에요.", decoy: "over there", dk: ["누군가 모니터를 보고 혈압을 소리 내어 알려 주세요", "누군가 모니터를 보고 시간을 소리 내어 알려 주세요"], ans: monitor, opts: [window, door, floor]}
  - {tag: 약물 시점, icon: pill, why: "\"if\" 절에 oxygen을 넣어 산소가 먼저이고 그래도 호전이 없을 때 약을 쓴다는 순서를 알려 줘요.", decoy: "from the cart", dk: ["환기를 해도 서맥이 호전되지 않으면 아트로핀을 주입해요", "산소를 줘도 서맥이 더 느려지면 아트로핀을 주입해요"], ans: oxygen, opts: [water, music, sleep]}
  - {tag: 재시도 조건, icon: check, why: "\"once\"는 그 조건이 갖춰지는 순간이라는 뜻이라 수치가 회복된 뒤에만 다시 시도한다는 선을 그어 줘요.", decoy: "with the team", dk: ["산소포화도와 심박수가 회복되면 다시 설명할게요", "산소포화도와 심박수가 회복되면 다시 확인할게요"], ans: sats, opts: [labs, tests, seats]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 삽관 중 저산소·서맥에 대응하는 4문장 순서
    why: 시도를 멈추고 산소부터 주고, 원인을 짚은 뒤, 산소로 호전이 없으면 아트로핀을 쓰고, 회복되면 다시 시도해요.
    lines:
    - {en: "Stop the attempt and bag-mask ventilate him with 100 percent oxygen.", icon: siren, ko: "시도를 멈추고 100퍼센트 산소로 백마스크 환기하세요", note: 환기}
    - {en: "His bradycardia is from hypoxia, so oxygenation comes first.", icon: chartup, ko: "서맥은 저산소증 때문이라 산소화가 먼저예요", note: 원인}
    - {en: "If that bradycardia doesn't improve with oxygen, push atropine.", icon: pill, ko: "그 서맥이 산소로 호전되지 않으면 아트로핀을 주입해요", note: 약물}
    - {en: "After that, once his sats and heart rate recover, we'll try again.", icon: check, ko: "그 뒤에 산소포화도와 심박수가 회복되면 다시 시도해요", note: 재시도}
17:
  s:
  - {tag: 응급 대응, icon: siren, why: "두 동작을 and로 이어 한 번에 말하면 스토마를 덮는 일과 산소를 주는 일을 함께 해야 한다는 걸 알려요.", decoy: "on the chest", dk: ["기관절개관이 새고 있어요 — 스토마를 덮고 입과 코 위로 산소를 주세요", "기관절개관이 막혔어요 — 스토마를 덮고 입과 코 위로 산소를 주세요"], ans: stoma, opts: [window, bed, tray]}
  - {tag: 크기 준비, icon: gear, why: "\"same-size\"와 \"smaller\"를 함께 말하는 건 같은 크기가 안 들어갈 때 더 작은 것으로 바로 바꾸려는 대비예요.", decoy: "from the box", dk: ["점검을 위해 동일 크기와 더 작은 기관절개관을 준비하세요", "고정을 위해 동일 크기와 더 작은 기관절개관을 준비하세요"], ans: smaller, opts: [cheaper, newer, lighter]}
  - {tag: 지원 요청, icon: bell, why: "세미콜론 뒤에 이유를 붙이면 팀을 부르는 지시와 그 근거를 한 문장에 담을 수 있어요.", decoy: "for the stoma", dk: ["기도팀을 부르세요. 새로 생긴 스토마는 쉽게 붓고 좁아질 수 있어요", "기도팀을 부르세요. 새로 생긴 스토마는 다시 삽입하면 아플 수 있어요"], ans: recannulate, opts: [relocate, reschedule, replenish]}
  - {tag: 진정시키기, icon: faceWorried, why: "\"this isn't his fault\"는 환자 탓이 아님을 먼저 말해 주변의 비난이나 짜증을 막고 긴장을 풀어 줘요.", decoy: "in his sleep", dk: ["차분히 있어요 — 이건 환자 잘못이 아니라 그냥 피곤하고 혼란스러운 거예요", "차분히 있어요 — 이건 환자 잘못이 아니라 그냥 겁먹고 아파하는 거예요"], ans: fault, opts: [uniform, phone, wallet]}
  - {tag: 산소 유지, icon: bulb, why: "\"I'm holding\"처럼 현재진행형으로 말하면 지금 이 순간 산소를 대고 있다는 안심을 동료와 환자에게 줘요.", decoy: "by the wall", dk: ["옮기는 동안 입 쪽에 산소를 대고 있을게요", "설명하는 동안 입 쪽에 산소를 대고 있을게요"], ans: mouth, opts: [foot, ear, knee]}
  - {tag: 요령 설명, icon: check, why: "\"once we're lined up right\"는 조건이 갖춰진 순간을 가리켜 방향만 맞으면 힘을 주지 않아도 된다는 요령을 전해요.", decoy: "this time", dk: ["크기가 제대로 맞으면 새 기관절개관이 쉽게 들어가요", "순서가 제대로 맞으면 새 기관절개관이 쉽게 들어가요"], ans: easily, opts: [loudly, rarely, yearly]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기관절개관이 빠졌을 때 대응하는 4문장 순서
    why: 스토마를 덮고 산소를 주고, 기도팀을 부른 뒤, 기다리는 동안 산소와 크기별 관을 준비하고, 팀이 오면 방향을 맞춰 넣어요.
    lines:
    - {en: "The trach is out — cover the stoma and give oxygen over the mouth and nose.", icon: siren, ko: "기관절개관이 빠졌어요 — 스토마를 덮고 입과 코 위로 산소를 주세요", note: 응급}
    - {en: "With oxygen on, call the airway team; a fresh stoma can be hard to recannulate.", icon: bell, ko: "산소를 주면서 기도팀을 부르세요. 새 스토마는 다시 삽입하기 어려울 수 있어요", note: 호출}
    - {en: "While they come, I'm holding oxygen and getting two trach sizes ready.", icon: gear, ko: "그들이 오는 동안 산소를 대고 관 두 크기를 준비할게요", note: 준비}
    - {en: "Once they arrive, the new trach goes in easily if we're lined up right.", icon: check, ko: "그들이 도착하면 방향이 맞을 때 새 관이 쉽게 들어가요", note: 재삽입}
18:
  s:
  - {tag: 지혈 지시, icon: siren, why: "\"to tamponade\"는 커프를 부풀리는 목적이 눌러서 출혈을 막는 것임을 밝혀 어려운 의학 동사의 이유를 알려 줘요.", decoy: "through the tube", dk: ["부위에 단단히 압박을 가하고 커프를 과팽창시켜 고정하세요", "부위에 단단히 압박을 가하고 커프를 과팽창시켜 확인하세요"], ans: firm, opts: [warm, cold, wet]}
  - {tag: 위험 진단, icon: siren, why: "\"could be\"는 확정 진단이 아니라 가능성을 말하는 표현이라 확진 전에도 바로 움직이게 만드는 말투예요.", decoy: "at the bed", dk: ["기관식도 누공일 수 있어요 — 외과에 긴급히 연락하세요", "기관 육아종일 수 있어요 — 외과에 긴급히 연락하세요"], ans: emergently, opts: [politely, casually, cheerfully]}
  - {tag: 병행 지시, icon: shield, why: "\"while we …\"로 기도 확보와 출혈 조절을 동시에 한다고 말해 어느 쪽도 멈추지 않는다는 뜻이에요.", decoy: "by the door", dk: ["통증을 조절하는 동안 기도는 계속 확보해 두세요", "흥분을 조절하는 동안 기도는 계속 확보해 두세요"], ans: bleeding, opts: [crying, laughing, shouting]}
  - {tag: 호출 지시, icon: bell, why: "\"Someone call …\"로 시작하면 가장 가까운 사람이 바로 움직이라는 뜻이고, \"more hands\"는 일손이라는 관용 표현이에요.", decoy: "from upstairs", dk: ["누군가 외과에 연락하고 장비를 더 가져와 주세요", "누군가 외과에 연락하고 물품을 더 가져와 주세요"], ans: hands, opts: [chairs, boxes, lamps]}
  - {tag: 역할 분담, icon: handshake2, why: "\"keep … on\"으로 계속 누르고 있겠다고 말하고 \"while\"로 상대의 일을 이어 말해 둘이 나눠 하는 일을 분명히 해요.", decoy: "next to me", dk: ["당신이 흡인기를 준비하는 동안 저는 단단히 압박을 유지할게요", "당신이 수액을 준비하는 동안 저는 단단히 압박을 유지할게요"], ans: airway, opts: [laundry, lunch, mail]}
  - {tag: 감시 요청, icon: monitor, why: "\"tell me the numbers\"로 수치를 말로 전달하라고 해야 지혈하는 사람이 손을 떼지 않고도 변화를 알 수 있어요.", decoy: "on paper", dk: ["출혈이 더 늘어나는지 보고 매 분마다 시간을 알려 주세요", "출혈이 더 늘어나는지 보고 매 분마다 위치를 알려 주세요"], ans: numbers, opts: [stories, secrets, rumors]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기관절개 부위 대량 출혈에 대응하는 4문장 순서
    why: 위험한 진단을 먼저 말하며 외과를 부르고, 기다리는 동안 압박과 커프로 지혈하고, 압박을 이어 가며, 출혈량을 계속 알려요.
    lines:
    - {en: "This could be a tracheo-innominate fistula — call surgery emergently.", icon: siren, ko: "기관무명동맥 누공일 수 있어요 — 외과에 긴급히 연락하세요", note: 진단}
    - {en: "While they're coming, apply firm pressure at the site and overinflate the cuff to tamponade.", icon: shield, ko: "그들이 오는 동안 부위를 단단히 누르고 커프를 과팽창시켜 지혈하세요", note: 지혈}
    - {en: "I'll keep firm pressure on while you set up the airway cart.", icon: handshake2, ko: "당신이 기도 카트를 준비하는 동안 저는 압박을 유지할게요", note: 유지}
    - {en: "Through all of it, watch for more blood loss and tell me the numbers every minute.", icon: monitor, ko: "그 모든 동안 출혈이 늘어나는지 보고 매 분 숫자를 알려 주세요", note: 감시}
19:
  s:
  - {tag: 의미 해석, icon: lab, why: "\"A means B\" 구문은 관찰된 신호가 무엇을 뜻하는지 한 문장으로 해석해 줘서 잘못된 위치를 놓치지 않게 해요.", decoy: "for sure", dk: ["위에서 공기 소리가 난다는 건 튜브가 기관 안에 없다는 뜻이에요", "배가 계속 부풀어 오른다는 건 튜브가 기관 안에 없다는 뜻이에요"], ans: sustained, opts: [loud, bright, sudden]}
  - {tag: 즉시 교정, icon: siren, why: "세 동작을 쉼표로 이어 순서대로 말하면 빼고, 환기하고, 다시 산소를 채운다는 절차가 한눈에 들어와요.", decoy: "with care", dk: ["튜브를 빼고 백으로 환기하며 다음 호흡 전에 재산소화해요", "튜브를 빼고 백으로 환기하며 다음 확인 전에 재산소화해요"], ans: bag, opts: [hug, wash, dress]}
  - {tag: 재시도 준비, icon: gear, why: "\"for the recheck\"로 용도를 말하면 장비를 준비하는 이유가 다음 확인이라는 걸 알려 줘요.", decoy: "on the cart", dk: ["소독을 위해 비디오 후두경을 준비해 둘게요", "설명을 위해 비디오 후두경을 준비해 둘게요"], ans: video, opts: [audio, radio, solar]}
  - {tag: 관찰 보고, icon: magnify, why: "\"A, not B\" 구조는 실제로 일어나는 것과 정상에서 기대하는 것을 대비시켜 이상 소견을 또렷하게 알려 줘요.", decoy: "on the left side", dk: ["숨을 쉴 때마다 가슴이 아니라 어깨가 올라가요", "숨을 쉴 때마다 가슴이 아니라 목이 부풀어 올라요"], ans: belly, opts: [hand, elbow, chin]}
  - {tag: 즉시 교정, icon: siren, why: "\"Let's not …\"은 금지가 아니라 같이 하지 말자는 부드러운 부정이라 팀이 함께 서두르게 해요.", decoy: "for now", dk: ["산소를 낭비하지 말고 바로 빼서 재산소화해요", "장비를 낭비하지 말고 바로 빼서 재산소화해요"], ans: time, opts: [money, paper, space]}
  - {tag: 소리 내어 확인, icon: speaker, why: "\"say out loud\"는 혼자 아는 데서 그치지 않고 팀 모두가 같은 상황을 인식하게 만드는 공유 행동이에요.", decoy: "by the door", dk: ["다시 시도하기 전에 튜브가 막혔다고 크게 말할게요", "다시 시도하기 전에 튜브가 꺾였다고 크게 말할게요"], ans: tube, opts: [card, bed, door]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 식도 삽관을 알아채고 바로잡는 4문장 순서
    why: 배가 오르는 것을 보고, 이산화탄소가 안 나오는 의미를 짚고, 튜브를 빼 환기·재산소화한 뒤, 재확인 장비를 준비해요.
    lines:
    - {en: "His belly is rising with each breath, not his chest.", icon: magnify, ko: "숨 쉴 때마다 가슴이 아니라 배가 올라와요", note: 관찰}
    - {en: "On top of that, no sustained capnography means the tube is not in the trachea.", icon: lab, ko: "게다가 이산화탄소가 지속되지 않으면 튜브가 기관 안에 없다는 뜻이에요", note: 해석}
    - {en: "Because of that, remove the tube, bag him, and reoxygenate before the next attempt.", icon: siren, ko: "그래서 튜브를 빼고 백으로 환기하며 다음 시도 전에 재산소화해요", note: 교정}
    - {en: "While you do that, I'll get the video laryngoscope ready for the recheck.", icon: gear, ko: "그동안 재확인을 위해 비디오 후두경을 준비해 둘게요", note: 준비}
20:
  s:
  - {tag: 위기 보고, icon: siren, why: "\"needs immediate intervention\"처럼 필요한 조치를 같은 문장에 붙이면 상태 보고가 곧 행동 요청이 돼요.", decoy: "for this patient", dk: ["기도가 분비물로 막혀서 즉각적인 처치가 필요해요", "기도가 이물로 막혀서 즉각적인 처치가 필요해요"], ans: immediate, opts: [gradual, routine, scheduled]}
  - {tag: 동시 지시, icon: siren, why: "\"while\"로 약을 주는 일과 팀을 부르는 일을 동시에 하라고 말해 한쪽이 끝나길 기다리지 않게 해요.", decoy: "in the doorway", dk: ["가습 산소를 주면서 어려운 기도팀을 부르세요", "산소 마스크를 씌우면서 어려운 기도팀을 부르세요"], ans: difficult, opts: [simple, tiny, loud]}
  - {tag: 이중 대비, icon: shield, why: "\"both A and B\"는 둘 중 하나만이 아니라 둘 다 준비하라는 뜻이라 첫 시도가 실패해도 곧바로 다음 수가 있어요.", decoy: "for the case", dk: ["삽관과 흡인 장비 둘 다 준비하세요", "삽관과 산소 공급 둘 다 준비하세요"], ans: backup, opts: [budget, badge, bonus]}
  - {tag: 청진 소견, icon: stetho, why: "\"less air movement\"는 소리가 점점 줄어든다는 말이라 막힘이 심해질수록 공기가 덜 지나간다는 위험 신호예요.", decoy: "through the wall", dk: ["기침할 때마다 공기 흐름이 지금 더 줄어드는 게 들려요", "움직일 때마다 공기 흐름이 지금 더 줄어드는 게 들려요"], ans: hear, opts: [smell, taste, write]}
  - {tag: 역할 분담, icon: handshake2, why: "\"while I …\"로 내가 하는 일과 누군가에게 시키는 일을 동시에 말해 지시를 받는 사람이 기다리지 않게 해요.", decoy: "at the sink", dk: ["제가 산소를 준비하는 동안 누군가 어려운 기도팀을 불러 주세요", "제가 흡인기를 준비하는 동안 누군가 어려운 기도팀을 불러 주세요"], ans: "set up", opts: ["clean up", "pick up", "give up"]}
  - {tag: 단계 상향, icon: siren, why: "\"escalate\"는 대응 수준을 한 단계 올린다는 뜻이고, \"before\" 절이 지금 올리는 이유를 시간 압박으로 보여 줘요.", decoy: "in the ward", dk: ["심한 부종이 되기 전에 지금 단계를 높이고 있어요", "더 큰 소란이 되기 전에 지금 단계를 높이고 있어요"], ans: obstruction, opts: [celebration, vacation, reception]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 급성 기도 폐색 위기에 대응하는 4문장 순서
    why: 들리는 소견을 먼저 말하고, 의미를 짚고, 약을 주며 팀을 부르고, 그동안 둘 다 준비해요.
    lines:
    - {en: "I hear less air movement with every breath now.", icon: stetho, ko: "숨 쉴 때마다 공기 흐름이 줄어드는 게 지금 들려요", note: 소견}
    - {en: "That means his airway is obstructing from swelling and needs immediate intervention.", icon: siren, ko: "그건 기도가 부종으로 막혀 즉각 처치가 필요하다는 뜻이에요", note: 의미}
    - {en: "So give nebulized epinephrine while we call the difficult airway team.", icon: bell, ko: "그러니 분무 에피네프린을 주며 어려운 기도팀을 부르세요", note: 처치}
    - {en: "While that's going on, prepare for both intubation and a surgical airway backup.", icon: shield, ko: "그동안 삽관과 외과적 기도 확보 둘 다 준비하세요", note: 대비}
