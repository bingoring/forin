0:
  s:
  - {tag: 안정화 확인, icon: check, why: "\"Let's\"로 시작하면 지시보다 함께 하자는 제안이라 팀이 같이 움직여요. 확인할 항목 둘을 and로 묶어 한 번에 말해요.", decoy: "on the monitor", dk: ["기도가 확보됐는지, 의식이 있는지 먼저 확인합시다.", "기도가 확보됐는지, 순환이 되는지 먼저 확인합시다."], ans: airway, opts: [line, bed, cart]}
  - {tag: 활력 확인, icon: monitor, why: "항목 셋을 쉼표로 나열하면 말한 순서가 곧 확인 순서가 돼요. 끝의 \"now\"가 지체하지 말라는 신호예요.", decoy: "for the family", dk: ["지금 맥박, 혈압, 호흡을 확인하세요.", "지금 맥박, 체온, 리듬을 확인하세요."], ans: rhythm, opts: [height, hearing, vision]}
  - {tag: 우선순위, icon: shield, why: "\"before anything else\"는 다른 모든 일에 앞선다는 말이라 우선순위가 분명해져요. ABCs는 기도·호흡·순환의 약칭이에요.", decoy: "for the team", dk: ["입원 이후엔 무엇보다 ABC부터 안정화합니다.", "ECMO 이후엔 무엇보다 ABC부터 안정화합니다."], ans: ABCs, opts: [rhythms, labs, wounds]}
  - {tag: 호흡 평가, icon: stetho, why: "\"but\"으로 앞뒤를 대비시키면 지금은 괜찮아 보여도 다음 단계가 필요하다는 판단이 한 문장에 담겨요.", decoy: "in the room", dk: ["산소 마스크로는 호흡이 충분해 보이지만, 곧 인공호흡기에 연결합시다.", "백 마스크로는 호흡이 일정해 보이지만, 곧 인공호흡기에 연결합시다."], ans: adequate, opts: [shallow, noisy, rapid]}
  - {tag: 순환 소견, icon: stetho, why: "\"bilaterally\"를 끝에 붙이면 양쪽을 모두 만져 봤다는 사실이 한 단어로 전해져요.", decoy: "on the left", dk: ["순환은 온전하고, 양쪽 대퇴 맥박도 빠르고 동일해요.", "순환은 온전하고, 양쪽 대퇴 맥박도 강하고 규칙적이에요."], ans: femoral, opts: [radial, brachial, temporal]}
  - {tag: 기록, icon: pencil, why: "\"our ROSC time\"처럼 \"our\"를 쓰면 기록이 한 사람의 일이 아니라 팀이 공유하는 정보가 돼요.", decoy: "to the family", dk: ["ROSC 시각과 이번 초기 사정을 지금 설명할게요.", "ROSC 시각과 이번 초기 사정을 지금 발표할게요."], ans: initial, opts: [final, second, verbal]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: ROSC 직후 안정화 4문장 순서
    why: 기도부터 확인하고, 그 확인을 바탕으로 맥박과 혈압을 보고, 그 수치로 호흡기 연결을 결정한 뒤, 마지막에 시각과 사정을 기록하는 순서예요.
    lines:
    - {en: "We just got ROSC, so let's confirm his airway is secure.", icon: bell, ko: "ROSC가 돌아왔으니 기도부터 확인해요", note: 기도}
    - {en: "Once that's confirmed, check his pulse and blood pressure.", icon: monitor, ko: "그게 확인되면 맥박과 혈압을 보세요", note: 순환}
    - {en: "With those numbers in hand, we get him on the ventilator soon.", icon: stetho, ko: "그 수치를 보고 곧 인공호흡기에 연결해요", note: 호흡기}
    - {en: "I'll document the ROSC time and this assessment once he's on it.", icon: pencil, ko: "연결되면 ROSC 시각과 사정을 기록할게요", note: 기록}
1:
  s:
  - {tag: 검사 목적, icon: monitor, why: "\"to look for\"로 목적을 붙이면 왜 심전도를 찍는지가 동료에게 바로 전해져요. STEMI는 ST분절 상승 심근경색이에요.", decoy: "on the left arm", dk: ["부정맥을 확인하기 위해 12유도 심전도를 찍으세요.", "심막염을 확인하기 위해 12유도 심전도를 찍으세요."], ans: STEMI, opts: [pneumonia, anemia, sepsis]}
  - {tag: 검사 요청, icon: lab, why: "\"Send\"는 검체나 검사 요청을 검사실로 보낸다는 현장 표준 동사예요. \"full\"로 일부가 아닌 전체 패널임을 밝혀요.", decoy: "to the pharmacy", dk: ["트로포닌과 기본 대사 패널을 보내세요.", "트로포닌과 간 기능 패널을 전부 보내세요."], ans: troponin, opts: [lactate, amylase, ferritin]}
  - {tag: 조건 대응, icon: siren, why: "\"If it's a STEMI, we…\"처럼 조건을 앞에 두면 결과에 따라 달라지는 계획을 미리 공유해요. cath lab은 심도자실이에요.", decoy: "with the doctor", dk: ["부정맥이라면 카테터실을 가동합니다.", "뇌졸중이라면 카테터실을 가동합니다."], ans: STEMI, opts: [stroke, seizure, fracture]}
  - {tag: 모니터 연결, icon: monitor, why: "\"too\"를 끝에 붙이면 앞의 행동에 하나를 더한다는 뜻이라 두 가지를 한 문장에 말할 수 있어요.", decoy: "on his wrist", dk: ["모니터에 연결하고 혈압 기록지도 뽑을게요.", "모니터에 연결하고 투약 기록지도 뽑을게요."], ans: monitor, opts: [scale, stretcher, pump]}
  - {tag: 재검 계획, icon: redo, why: "\"No … yet, but we'll …\"는 지금 결과와 다음 계획을 한 문장에 묶어 안심과 경계를 함께 전해요.", decoy: "for the family", dk: ["아직 QT 변화는 없지만 한 시간 뒤 심전도를 다시 찍을게요.", "아직 ST 변화는 없지만 한 시간 뒤 심초음파를 다시 찍을게요."], ans: ECG, opts: [troponin, lactate, culture]}
  - {tag: 보고 상황, icon: bell, why: "\"so\"로 이유와 결과를 이으면 왜 이미 알렸는지가 한 문장에 담겨요. \"already\"는 같은 보고를 되풀이하지 않아도 된다는 뜻이에요.", decoy: "this morning", dk: ["트로포닌이 오르는 추세라 순환기내과에 방금 알렸어요.", "칼륨이 오르는 추세라 순환기내과에 이미 알렸어요."], ans: cardiology, opts: [radiology, pharmacy, neurology]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 심전도와 원인 검사 4문장 순서
    why: 심전도부터 찍고, 결과에 따른 계획을 말하고, 그 계획에 맞춰 혈액검사를 보낸 뒤, 마지막에 순환기내과에 알렸다고 보고하는 순서예요.
    lines:
    - {en: "Get a twelve-lead ECG to look for STEMI.", icon: monitor, ko: "STEMI를 보려면 12유도 심전도를 찍으세요", note: 심전도}
    - {en: "If it shows one, we activate the cath lab.", icon: siren, ko: "STEMI가 보이면 카테터실을 가동합니다", note: 계획}
    - {en: "Either way, send troponin and a full metabolic panel.", icon: lab, ko: "어느 쪽이든 트로포닌과 대사 패널을 보내세요", note: 검사}
    - {en: "Cardiology is already aware of all of that.", icon: bell, ko: "순환기내과는 그 모든 걸 이미 알고 있어요", note: 보고}
