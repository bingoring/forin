    - 환자의 말 그대로
    why: ICD shock은 이식된 기계가 심장에 전기 충격을 주는 것이고, 환자에게는 공포스러운 경험이에요. 의료진끼리는 횟수와 전기폭풍 가능성을 보고하고, 환자에게는 자석으로 충격을 잠시 멈출 수 있다는 것처럼 지금 할 일을 말해 안심시켜요.
    scenes:
    - who: 환자 → 간호사
      en: It keeps shocking me — make it stop!
      ko: 자꾸 충격이 와요 — 멈춰 주세요!
      tone: 공포
    - who: 차트 기록
      en: Pt reports four ICD shocks in the past hour.
      ko: 지난 1시간 동안 ICD 쇼크 4회 보고.
      tone: 건조
    - who: 심장내과 콜
      en: He's had repeated shocks — possible electrical storm.
      ko: 반복 쇼크 — 전기폭풍 의심입니다.
      tone: 급함
    - who: 환자에게는…
      en: The magnet will pause the shocks while we figure this out.
      ko: 원인을 찾는 동안 자석이 충격을 멈춰 줄 거예요.
      tone: 안심
