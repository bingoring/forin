    - - put the phone on
      - speaker
    - - wait
      - a minute
    decoys:
    - the dialect
    why: 통역 전화는 병원의 통역 전용 번호(interpreter line)로 걸고, 환자와 간호사가 함께 듣도록 스피커로 켜요. 수화기가 두 개 달린 통역용 전화를 쓰는 병원도 있어요.
  - kind: context
    words:
    - w-interpreter
    - w-call
    scenes:
    - who: 환자에게
      icon: me
      en: I'm going to call an interpreter to help us talk.
      ok: true
    - who: 동료에게
      icon: speech
      en: Can you get the Spanish interpreter on the line for bed 4?
      ok: true
    - who: 환자에게
      icon: me
      en: I will now initiate a language access services request.
      ok: false
      fix: I'm getting an interpreter on the phone for us.
    why: language access services는 병원 행정 부서 이름이에요. 환자에게는 딱딱하고 낯설어서, '통역사를 불러 드릴게요'처럼 무엇을 해 주는지 쉬운 말로 해요.
    word: call
    ko: 부르다·호출하다
  order:
    tag: 대화 흐름
    icon: compass
    ko: 통역 연결 안내 순서
