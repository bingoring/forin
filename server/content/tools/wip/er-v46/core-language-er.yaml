    tag: 통증 확인
    icon: stetho
    why: 단어만 던지는 짧은 질문은 영어가 서툰 환자에게 더 잘 전달돼요. 손가락으로 가리키게 하면 말 대신 몸으로 답할 수 있어요.
    decoy: Tell me how
    distractorsKo:
