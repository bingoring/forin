    why: 0~10 척도에서 흔히 1~3은 mild, 4~6은 moderate, 7~10은 severe로 나눠요. 손가락 아홉 개면 severe예요.
    example: Nine out of ten — that's severe pain.
    exKo: 10점 중 9점이면 심한 통증이에요.
  - kind: swap
    words:
    - w-allergy
    - w-medicine
