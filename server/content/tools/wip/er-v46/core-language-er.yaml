    - en: Go ahead and tell them what's bothering you.
      icon: speech
      ko: 불편한 점을 그분께 말씀해 보세요
      note: 요청
- title: 기본 의사 확인
  sentences:
  - en: Pain? Point to where.
    ko: 통증? 어디인지 가리켜 주세요.
