      answer: Pain
      options:
      - en: Chills
        icon: trophy
      - en: Pain
        icon: me
      - en: Fever
        icon: lock
      - en: Cough
        icon: bulb
  - en: Any allergy to medicine? Yes or no?
    ko: 약물 알레르기 있나요? 예 아니오?
    chunks:
