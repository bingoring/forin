    decoy: if you want
    distractorsKo:
    - 통역사는 내일 부를게요
    - 걱정되시면 가족에게 부탁하세요
    blank:
      answer: right now
      options:
      - en: right now
        icon: bell
      - en: tomorrow morning
        icon: compass
      - en: next week
        icon: gear
      - en: after lunch
        icon: calendar
  nuance:
  - kind: pair
    words:
