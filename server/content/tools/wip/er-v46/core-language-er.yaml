    - adverse drug reactions
    - drug sensitivity problems
    answer: allergy to medicine
    notes:
      allergy to medicine: 짧고 흔한 단어라 영어가 서툰 환자도 알아듣는다.
      adverse drug reactions: 의료진·차트의 말이고 뜻도 넓다(부작용까지 포함). 환자에게는 어렵다.
