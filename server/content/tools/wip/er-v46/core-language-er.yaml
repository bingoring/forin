    why: 영어가 서툰 환자에게는 문장보다 흔한 낱말 몇 개로 묻는 게 잘 통해요. 'Yes or no?'로 답을 쉽게 만들어 주고요.
    ko: 약물 알레르기 있나요? 예 아니오?
  order:
    tag: 대화 흐름
    icon: compass
    ko: 기본 의사 확인 질문 순서
    why: 통증 위치를 먼저 묻고, 그 통증이 얼마나 심한지 묻고, 약을 줄 수 있을 만큼 심하면 알레르기를 묻고, 마지막에 전달을 약속해요. there, that bad, all of that이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Pain? Point to where.
      icon: stetho
      ko: 통증? 어디인지 가리켜 주세요
      note: 위치
    - en: How bad is it there? Show me with your fingers.
      icon: chartup
      ko: 거기가 얼마나 아파요? 손가락으로 보여 주세요
      note: 정도
    - en: If it's that bad, I may give you medicine. Any allergy?
      icon: pill
      ko: 그만큼 심하면 약을 드릴 수 있어요. 알레르기 있나요?
      note: 알레르기
    - en: Thank you. I'll tell the doctor all of that.
      icon: star
      ko: 고마워요. 의사에게 다 전할게요
      note: 전달
