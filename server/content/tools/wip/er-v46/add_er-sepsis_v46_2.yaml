- title: 정맥로·수액 시작 설명
  s:
  - {t: "수액 목적", i: monitor, w: "help support는 수액이 치료의 전부가 아니라 돕는 역할이라고 겸손하게 말해요. 패혈증에서는 혈관이 늘어지고 새서 혈압이 떨어지는데, 수액이 혈액량을 채워 혈압과 혈류를 받쳐요.", d: "for pain", k: ["이 약은 열을 내려 줘요", "팔을 움직이지 마세요"], a: "pressure", o: ["type", "test", "count"]}
  - {t: "불편 안심", i: faceWorried, w: "normal과 will pass 두 말로 지금 느낌이 위험하지 않고 곧 지난다고 짧게 안심시켜요. 수액이 체온보다 차서 팔에 찬 느낌이 날 수 있어요. 다만 따갑거나 부으면 새는 신호일 수 있어서 따로 알려 달라고 해요.", d: "at night", k: ["팔에 힘을 빼고 계세요", "수액 속도는 의사가 정했어요"], a: "normal", o: ["rare", "unusual", "special"]}
  - {t: "속도 이유", i: bell, w: "because로 빨리 주는 이유를 바로 붙여 환자가 왜 서두르는지 알게 해요. 패혈증에서 저관류가 있으면 초기 몇 시간 안에 충분한 양을 빨리 주는 것이 권고돼요.", d: "by hand", k: ["수액 주머니를 새로 바꿀게요", "팔에 찬 느낌이 있을 수 있어요"], a: "because", o: ["although", "unless", "until"]}
  - {t: "정맥로 설명", i: pill, w: "lets us…는 장치가 무엇을 가능하게 하는지로 설명하는 말이라 낯선 도구의 부담이 줄어요. straight into your blood로 수액과 약이 정맥으로 바로 들어가 빠르게 작용한다는 점을 짚어요.", d: "by mouth", k: ["알레르기 밴드를 채울게요", "소변 줄은 나중에 설명할게요"], a: "IV", o: ["ECG", "oxygen", "suction"]}
  - {t: "호흡곤란 보고", i: siren, w: "right away로 기다리지 말고 곧바로 말해 달라고 분명히 해요. 수액을 빨리 많이 주면 폐에 물이 찰 수 있어서, 숨이 차다는 말은 수액 속도를 다시 따지게 하는 중요한 신호예요.", d: "for you", k: ["팔이 붓거나 따가우면 알려 주세요", "어지러우면 일어나지 마세요"], a: "short", o: ["full", "free", "empty"]}
  - {t: "안심 전달", i: shield, w: "You're safe here로 먼저 안전을 말하고, we'll watch you closely로 곁에서 지켜본다는 행동을 약속해요. 말뿐인 안심이 아니라 계속 살핀다는 사실을 덧붙여 신뢰를 줘요.", d: "by yourself", k: ["곧 의사가 설명해 줄 거예요", "가족에게 연락해 둘게요"], a: "safe", o: ["tired", "new", "early"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수액 시작 설명 4문장 순서"
    why: "정맥로로 수액을 준다고 알리고, 'These fluids'가 그 수액을 가리켜 목적과 속도를 말하고, 'As they run'이 수액을 가리켜 찬 느낌을 안심시키고, 'Other than that'이 그 느낌을 가리켜 따로 알려야 할 증상을 말해요. 'These fluids'·'they'·'that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm putting an IV line in your arm so we can give you fluids.", icon: pill, ko: "수액을 드리려고 팔에 정맥로를 넣을게요", note: "정맥로"}
    - {en: "These fluids support your blood pressure, which is why we're giving them quickly.", icon: monitor, ko: "이 수액은 혈압을 받쳐 줘서 빠르게 드리는 거예요", note: "이유"}
    - {en: "As they run, your arm may feel cold — that's normal and will pass.", icon: faceWorried, ko: "들어가는 동안 팔이 차게 느껴질 수 있는데 정상이고 곧 지나가요", note: "안심"}
    - {en: "Other than that, tell me right away if you feel short of breath.", icon: bell, ko: "그것 말고 숨이 차면 바로 말씀해 주세요", note: "보고"}
  sw: {ko: "몸이 도움이 필요해서 수액을 빠르게 드리고 있어요"}
- title: 소변량 모니터링 설명
  s:
  - {t: "소변량 의미", i: lab, w: "tells us로 수치가 알려 주는 내용을 말해 지켜보는 이유를 환자 눈높이로 풀어요. 장기에 혈액이 충분히 가야 신장이 소변을 만들어서, 소변량이 장기로 가는 혈류의 지표가 돼요.", d: "last night", k: ["소변 색이 진해지면 알려 주세요", "수분은 정맥으로 드리고 있어요"], a: "organs", o: ["teeth", "nails", "ears"]}
  - {t: "측정 이유", i: monitor, w: "helps us know로 측정이 우리를 돕는 도구라는 틀을 만들어 번거로운 측정에도 협조하게 해요. 수액 뒤 소변량이 늘면 장기로 가는 혈류가 나아지고 있다는 뜻이에요.", d: "by itself", k: ["소변 색도 같이 볼게요", "주머니는 침대 아래에 걸어 둘게요"], a: "working", o: ["leaking", "empty", "cold"]}
  - {t: "중요성 설명", i: bell, w: "important와 closely가 함께 환자에게 이 수치가 가볍지 않다고 알려 줘요. in cases like yours는 환자 개인의 문제가 아니라 같은 상태에서 흔한 확인이라 불안을 덜어요.", d: "for you only", k: ["소변을 보고 싶으면 호출 버튼을 눌러 주세요", "의사에게 수치를 알려 둘게요"], a: "important", o: ["unusual", "optional", "unimportant"]}
  - {t: "카테터 설명", i: gear, w: "This catheter가 주어라 도구가 일을 대신한다는 구조여서, 환자가 불편한 줄을 이유와 함께 받아들이게 해요. 방광에 넣는 도뇨관은 시간당 소변량을 정확히 재는 데 써요.", d: "by hand", k: ["줄이 당기면 바로 말씀해 주세요", "소변 검사는 따로 보낼게요"], a: "catheter", o: ["bandage", "mask", "tablet"]}
  - {t: "매시간 확인", i: calendar, w: "every hour로 확인 간격을 정확히 말해 간호사가 자주 오는 이유를 알게 해요. 패혈증에서는 시간당 소변량이 신장으로 가는 혈류를 가장 빨리 보여 줘서 자주 확인해요.", d: "by the window", k: ["소변 주머니는 제가 비울게요", "양이 적으면 의사에게 알릴게요"], a: "kidneys", o: ["lungs", "heart", "liver"]}
  - {t: "호전 신호", i: check, w: "a sign으로 소변량이 좋아지는 것을 호전의 증거로 이어 환자에게 기대를 줘요. 다만 수치 하나만 보지 않고 혈압·젖산과 함께 판단해요.", d: "for now", k: ["수액은 계속 들어갈 거예요", "소변 색도 계속 볼게요"], a: "good", o: ["bad", "tiny", "weak"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "소변량 모니터링 4문장 순서"
    why: "측정하겠다고 하고, 'that'이 그 측정을 가리키며 카테터와 간격을 말하고, 'That hourly number'가 그 간격을 가리켜 의미를 말하고, 'those organs'가 그 의미 속 장기를 가리켜 호전 기준을 말해요. 'that'·'That hourly number'·'those organs'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'd like to measure exactly how much urine you make.", icon: lab, ko: "소변이 얼마나 나오는지 정확히 재고 싶어요", note: "측정"}
    - {en: "A small catheter will do that for us, and we'll check the amount every hour.", icon: gear, ko: "작은 카테터가 그걸 해 주고 매시간 양을 확인할 거예요", note: "방법"}
    - {en: "That hourly number tells us how well your organs are getting blood.", icon: monitor, ko: "그 시간당 수치로 장기에 혈액이 얼마나 가는지 알 수 있어요", note: "의미"}
    - {en: "A good number means those organs are doing well and the treatment is helping.", icon: check, ko: "수치가 좋으면 그 장기들이 잘 버티고 치료가 도움이 되고 있다는 뜻이에요", note: "호전"}
  ctx:
    word: "urine output"
    ko: "소변량"
    sc:
      0: {en: "Urine output 20 mL/hr x 2 hrs, below 0.5 mL/kg/hr goal."}
      2: {en: "Your urine output is below 0.5 mL/kg/hr.", fix: "You're making less urine than we'd like, so we're watching your kidneys closely."}
    why: "mL/kg/hr 같은 수치는 차트와 의료진끼리의 말이에요(흔한 목표는 시간당 체중 1 kg마다 0.5 mL 이상). 환자에게는 '소변이 바라는 만큼 나오지 않는다'고 풀어요."
- title: 패혈증 1시간 번들
  s:
  - {t: "번들 안내", i: siren, w: "대시 뒤에 네 가지를 나열해 환자가 한 번에 전체 그림을 보게 해요. 패혈증 번들은 젖산 측정, 혈액배양, 항생제, 수액이 핵심이에요.", d: "in the hall", k: ["가족에게 연락해 드릴까요?", "팔을 가만히 두세요"], a: "lactate", o: ["pregnancy", "hearing", "vision"]}
  - {t: "젖산 설명", i: lab, w: "level이 수치임을 알리고 tells us로 그 수치가 알려 주는 것(몸이 받는 스트레스)을 환자 말로 풀어요. 젖산은 조직에 산소가 모자랄 때 올라가는 대표 지표예요.", d: "this morning", k: ["혈액은 한 번에 채취했어요", "수치가 나오면 알려 드릴게요"], a: "stressed", o: ["tired", "hungry", "thirsty"]}
  - {t: "수액 시작", i: monitor, w: "now로 지금 시작한다는 점을 분명히 하고 to support로 목적을 붙여요. 패혈증으로 혈압이 낮을 때는 진단 직후 수액을 빠르게 시작하는 것이 번들의 일부예요.", d: "at home", k: ["혈압도 계속 확인할게요", "팔에 따끔할 수 있어요"], a: "support", o: ["check", "measure", "record"]}
  - {t: "시간 안내", i: calendar, w: "one hour로 제한 시간을 숫자로 말해 왜 서두르는지 설명해요. 패혈증 번들은 패혈증을 알아본 시점부터 한 시간 안에 시작하는 것을 목표로 해요.", d: "for you", k: ["이 중 한 가지는 이미 끝났어요", "가족분도 곧 오실 거예요"], a: "four", o: ["two", "three", "five"]}
  - {t: "경과 안내", i: chartup, w: "Each step으로 큰 일이 작은 단계들로 나뉜다고 말해 압도감을 줄여요. moves you closer는 지금 몸이 어느 방향으로 가는지 보여 줘서 기다림에 의미를 줘요.", d: "from here", k: ["단계마다 결과를 알려 드릴게요", "가족분께도 상황을 전할게요"], a: "stable", o: ["asleep", "hungry", "thirsty"]}
  - {t: "설명 약속", i: speech, w: "as we go로 한 번에 몰아서가 아니라 진행하는 동안 그때그때 설명하겠다고 해요. 처치가 빠르게 이어질 때 환자는 영문을 모르는 불안이 커서, 짧게라도 이유를 말해 주면 신뢰가 지켜져요.", d: "on the phone", k: ["서명은 나중에 받을게요", "지금 질문 있으세요?"], a: "I'll", o: ["You'll", "It'll", "That'll"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "1시간 번들 설명 4문장 순서"
    why: "심각하다는 것을 알리고, 'four things'로 할 일을 말하고, 'Each one'이 그 네 가지를 가리켜 의미를 말하고, 'That's why'가 앞의 부담을 받아 설명을 약속해요. 'Each one'·'That's why'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your infection is serious, so we need to move fast.", icon: siren, ko: "감염이 심각해서 빠르게 움직여야 해요", note: "상황"}
    - {en: "Within the hour, we'll get four things done: cultures, antibiotics, fluids, and a lactate test.", icon: calendar, ko: "한 시간 안에 배양, 항생제, 수액, 젖산 검사 네 가지를 끝낼 거예요", note: "계획"}
    - {en: "Each one moves you closer to being stable, even if it feels like a lot.", icon: chartup, ko: "하나하나가 안정에 가까워지게 해요, 많게 느껴지더라도요", note: "의미"}
    - {en: "That's why I'll explain each part as we go.", icon: speech, ko: "그래서 진행하면서 각 부분을 설명해 드릴게요", note: "약속"}
  ctx:
    word: "bundle"
    ko: "처치 묶음"
- title: 젖산 상승 해석
  s:
  - {t: "젖산 의미", i: lab, w: "means로 수치를 곧바로 뜻으로 풀고 tissues·oxygen으로 환자가 그릴 수 있는 말을 써요. 조직에 산소가 모자라면 산소 없이 에너지를 만들면서 젖산이 쌓여요.", d: "last night", k: ["숨을 천천히 쉬어 보세요", "수액을 맞은 뒤에 다시 잴 거예요"], a: "oxygen", o: ["sugar", "protein", "salt"]}
  - {t: "재측정 예고", i: calendar, w: "After fluids로 기준 시점을 먼저 말하고 we'll recheck로 앞으로 일어날 일을 약속해요. 소생 처치 뒤 젖산을 다시 재서 내려가는지 확인하는 것이 표준이에요.", d: "next door", k: ["두 번째 채혈은 아프지 않게 할게요", "결과는 의사가 먼저 보고 알려 줄 거예요"], a: "After", o: ["Without", "Instead of", "Except for"]}
  - {t: "추적 이유", i: chartup, w: "one of the main things라고 해서 이 수치가 유일한 기준이 아니라 여러 지표 중 핵심이라는 균형을 지켜요. 젖산은 혈압·소변량과 함께 치료 방향을 고르는 데 쓰여요.", d: "in bed", k: ["다른 수치도 같이 볼게요", "이 검사는 아프지 않아요"], a: "main", o: ["smallest", "oldest", "newest"]}
  - {t: "수치 해석", i: chartup, w: "The higher…, the more… 구조는 수치와 정도가 함께 움직인다는 관계를 한 번에 보여 줘요. 젖산이 높을수록 조직에 산소가 더 모자라서 더 적극적으로 치료해요.", d: "than usual", k: ["수치는 계속 달라질 수 있어요", "의사가 곧 설명해 줄 거예요"], a: "number", o: ["weight", "height", "age"]}
  - {t: "재채혈 예고", i: calendar, w: "in a couple hours로 시간을 대략으로 말해 정확한 약속보다 부담이 덜해요. again으로 같은 검사를 한 번 더 한다고 알려 반복 채혈에 놀라지 않게 해요. 간격은 병원 프로토콜을 따라요.", d: "this morning", k: ["수치가 변하면 바로 알려 드릴게요", "결과는 의사가 확인해요"], a: "progress", o: ["weight", "mood", "balance"]}
  - {t: "호전 신호", i: check, w: "A dropping lactate가 주어로 변화의 방향을 먼저 말하고 good sign으로 평가를 붙여요. 소생 뒤 젖산이 내려가는 것은 조직의 산소 공급이 나아진다는 신호지만, 다른 활력징후와 함께 판단해요.", d: "by the bed", k: ["내려가면 의사에게 알릴게요", "아직 치료는 계속돼요"], a: "good", o: ["rare", "small", "strange"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "젖산 수치 설명 4문장 순서"
    why: "수치가 높다고 알리고, 'It'이 그 수치를 가리켜 의미를 말하고, 'That's why'가 그 의미를 이유로 받아 수액과 재채혈을 말하고, 'that test'가 그 재검을 가리켜 호전 기준을 말해요. 'It'·'That's why'·'that test'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your lactate level came back high, and I want to explain what that means.", icon: lab, ko: "젖산 수치가 높게 나와서 그 뜻을 설명하고 싶어요", note: "결과"}
    - {en: "It means some of your tissues aren't getting enough oxygen.", icon: stetho, ko: "일부 조직에 산소가 충분히 가지 않는다는 뜻이에요", note: "의미"}
    - {en: "That's why we're giving fluids and will draw the test again.", icon: monitor, ko: "그래서 수액을 드리고 검사를 다시 채혈할 거예요", note: "이유"}
    - {en: "A dropping number on that test is a good sign you're responding to treatment.", icon: check, ko: "그 검사에서 수치가 내려가면 치료에 반응한다는 좋은 신호예요", note: "호전"}
