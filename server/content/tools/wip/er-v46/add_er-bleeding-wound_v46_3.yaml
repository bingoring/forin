- title: 정맥성 다량출혈 지혈
  s:
  - {t: "출혈 판단", i: bandage, w: "This is …, so we'll …로 판단 뒤에 곧바로 할 일을 이어 말해요. 정맥성 출혈은 보통 꾸준히 흐르고 직접 압박과 거상으로 잡히는 경우가 많아요.", d: "and wait", k: ["피검사를 바로 보낼게요", "혈압을 한 번 더 잴게요"], a: "press", o: ["pour", "drain", "shave"]}
  - {t: "압박 드레싱", i: bandage, w: "now로 지금 하는 중임을 알려 환자가 곧 압박이 자리 잡는다는 걸 알아요. 압박 드레싱은 상처 위를 단단히 눌러 고정해 지혈을 이어 가요.", d: "later", k: ["상처를 소독약으로 닦을게요", "드레싱은 내일 갈아 드릴게요"], a: "applying", o: ["removing", "opening", "soaking"]}
  - {t: "거상 지도", i: me, w: "to slow the flow로 거상의 목적을 알려 줘요. 팔다리를 심장보다 높이 두면 상처로 가는 혈압이 낮아져 출혈이 줄어요.", d: "to ease the ache", k: ["팔을 움직이지 말고 가만히 계세요", "붕대는 풀지 마세요"], a: "slow", o: ["speed", "double", "start"]}
  - {t: "환자 호소", i: speech, w: "flowing steadily로 흐르는 모양을 말해 줘 동맥 출혈과 구별할 단서가 돼요. it's a lot처럼 양을 어림해 말하는 것은 환자의 느낌이라 실제 양은 눈으로 따로 가늠해요.", d: "dripping slowly", k: ["피가 점점 어두워지고 있어요", "붕대가 벌써 다 젖었어요"], a: "flowing", o: ["dripping", "clotting", "drying"]}
  - {t: "특징 설명", i: bulb, w: "usually로 예외가 있을 수 있음을 열어 둬요. 정맥혈은 보통 어둡고 꾸준히 흐르며, 동맥혈은 밝고 박동에 맞춰 뿜어요.", d: "looks bright", k: ["피 색이 변하면 바로 알려 주세요", "압박을 풀지 않고 계속 눌러 주세요"], a: "dark", o: ["bright", "clear", "pale"]}
  - {t: "압박 붕대", i: bandage, w: "to keep steady pressure로 붕대의 목적을 알려 줘요. 압박 붕대는 손으로 누르던 힘을 이어 가며 지혈을 유지해요.", d: "to lose", k: ["상처를 소독약으로 닦을게요", "거즈는 지금 갈지 않을게요"], a: "wrap", o: ["cut", "throw", "spray"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "정맥성 출혈 지혈 4문장 순서"
    why: "먼저 곧바로 압박하고, 그 압박 위에서 팔다리를 들게 하고, 그 둘이 어두운 정맥 출혈을 늦춘다고 알린 뒤, 그 상태를 이어 가려고 압박 붕대를 감아요. 'that pressure'·'Both together'·'that going'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm applying firm pressure to the wound right now.", icon: bandage, ko: "지금 상처에 단단히 압박을 가하고 있어요", note: "압박"}
    - {en: "With that pressure on, keep the limb raised above your heart.", icon: me, ko: "그렇게 누른 채 팔다리를 심장보다 높이 들고 계세요", note: "거상"}
    - {en: "Both together should slow it — this is a dark, steady venous bleed, not spurting.", icon: bulb, ko: "둘을 함께 하면 늦춰질 거예요, 어둡고 꾸준한 정맥성 출혈이지 뿜어내지 않아요", note: "판단"}
    - {en: "To keep that going, we'll wrap a compression bandage.", icon: bandage, ko: "그걸 이어 가려고 압박 붕대를 감을게요", note: "붕대"}
  sw: {ko: "정맥에서 나는 출혈 같아서 눌러서 높이 들어 올릴게요"}
- title: 두피 열상 다량출혈
  s:
  - {t: "원인 설명", i: bulb, w: "because of로 이유를 명사구로 붙여 짧게 설명해요. 두피는 혈관이 많아 상처가 작아도 출혈이 많아 보이는 곳이에요.", d: "heal fast", k: ["머리를 부딪히셨는지도 확인할게요", "거즈로 단단히 눌러 드릴게요"], a: "lot", o: ["little", "bit", "trickle"]}
  - {t: "압박 지혈", i: bandage, w: "on the wound edges로 눌러야 할 곳을 짚어 줘요. 두피 상처는 가장자리를 눌러 혈관을 막아 주면 출혈이 줄어요.", d: "in the middle", k: ["상처를 소독약으로 닦을게요", "머리를 높이 들어 드릴게요"], a: "pressing", o: ["rubbing", "tapping", "wiping"]}
  - {t: "안심 설명", i: shield, w: "looks worse than…으로 '보이는 것이 실제보다 심하다'고 안심시켜요. 두피 출혈은 보기보다 덜한 경우가 많지만 실제 출혈량은 따로 가늠해요.", d: "looks better", k: ["어지럽거나 메스꺼우면 말씀해 주세요", "머리에 얼음을 대 드릴게요"], a: "worse", o: ["calmer", "cleaner", "smaller"]}
  - {t: "환자 호소", i: speech, w: "so much로 양이 많아 놀란 감정을 그대로 말해요. 겁먹은 환자일수록 짧고 침착하게 '지금 누르고 있어요'라고 답해 주는 것이 도움이 돼요.", d: "my arm", k: ["머리를 부딪히고 잠깐 어지러웠어요", "머리카락 속에서 피가 계속 흘러요"], a: "head", o: ["leg", "arm", "hand"]}
  - {t: "깊이 확인", i: magnify, w: "Let's…는 '우리 함께 하자'는 말투라 검사를 같이 하는 느낌을 줘요. 두피 열상은 뼈나 두개골 골절까지 닿았는지 보는 것이 중요해요.", d: "across to", k: ["상처에 거즈를 덮어 드릴게요", "상처 주변 머리카락을 잘라 낼게요"], a: "bone", o: ["hair", "nail", "tooth"]}
  - {t: "머리 외상", i: magnify, w: "also로 앞의 출혈 처치에 하나를 더 얹어요. 머리를 세게 부딪혔다면 출혈 말고도 뇌진탕과 두개 안 손상을 살펴봐야 해요.", d: "to cover", k: ["어지럽거나 토하셨나요?", "눈이 침침하지는 않으세요?"], a: "hard", o: ["lightly", "softly", "slightly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "두피 열상 출혈 4문장 순서"
    why: "먼저 가장자리를 눌러 지혈하고, 두피 출혈이 많아 보이는 이유를 설명하고, 그 점을 알고 뼈까지 닿았는지 보고, 그와 함께 머리 부딪힘을 확인해요. 'Knowing that'·'Along with that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm pressing firmly on the wound edges right now.", icon: bandage, ko: "지금 상처 가장자리를 단단히 누르고 있어요", note: "압박"}
    - {en: "Scalp wounds bleed a lot, so it looks worse than it usually is.", icon: bulb, ko: "두피 상처는 피가 많이 나서 보통 실제보다 심해 보여요", note: "설명"}
    - {en: "Knowing that, let's check if the cut goes down to the bone.", icon: magnify, ko: "그걸 알고 상처가 뼈까지 닿았는지 확인해 볼게요", note: "깊이"}
    - {en: "Along with that, I need to check if you hit your head hard.", icon: stetho, ko: "그와 함께 머리를 세게 부딪혔는지도 확인해야 해요", note: "머리"}
  ctx:
    word: "consciousness"
    ko: "의식"
    scenes:
      0: "Did you hit your head hard? Did you black out or lose consciousness at all?"
      1: "Head strike on the counter, no loss of consciousness per patient."
      2: "Any documented loss of consciousness secondary to the head strike?"
    why: "loss of consciousness와 head strike, secondary to 같은 말은 의료진의 말이에요. 환자에게는 'pass out·black out'처럼 쉬운 말로 물어요."
  sw: {ko: "두피 상처는 피가 많이 나서 실제보다 심해 보여요"}
- title: 만성 상처(당뇨족) 감염
  s:
  - {t: "상처 사정", i: magnify, w: "for로 확인하려는 대상을 나열해 무엇을 보는지 알려 줘요. 괴사 조직은 감염의 온상이 되어 당뇨 상처에서는 먼저 봐요.", d: "for size", k: ["상처 사진을 찍어 둘게요", "발에 다른 상처도 있는지 볼게요"], a: "checking", o: ["wrapping", "washing", "hiding"]}
  - {t: "전신 증상 문진", i: stetho, w: "Do you have A or feel B?로 증상 두 가지를 한 번에 묻고, generally로 '전체적으로'를 더해요. 열과 전신 증상은 감염이 몸 전체로 퍼졌다는 신호일 수 있어요.", d: "feel very dizzy", k: ["상처에서 진물이 나오나요?", "최근에 혈당을 재 보셨나요?"], a: "fever", o: ["cough", "rash", "headache"]}
  - {t: "혈당 문진", i: chartup, w: "lately로 최근 상태를 물어 짧은 기간의 조절 정도를 알아봐요. 혈당 조절이 나쁘면 상처가 잘 낫지 않고 감염이 쉬워요.", d: "last year", k: ["오늘 아침에 인슐린을 맞으셨어요?", "발에 감각이 있으세요?"], a: "sugar", o: ["pressure", "oxygen", "cholesterol"]}
  - {t: "환자 호소", i: speech, w: "won't heal로 낫지 않는다는 지속을 말해요. 냄새가 나고 낫지 않는 발 상처는 감염이나 괴사를 의심할 신호예요.", d: "feels warm", k: ["발에 감각이 없어요", "상처가 점점 커지고 있어요"], a: "foot", o: ["hand", "knee", "back"]}
  - {t: "상처 사정", i: magnify, w: "looking for로 찾는 것을 목록으로 말해 환자가 무엇을 보는지 알아요. 괴사한 피부·발적·냄새는 감염과 조직 괴사를 가늠하는 기본 소견이에요.", d: "coldness", k: ["상처 크기를 재 볼게요", "피를 뽑아 검사할게요"], a: "odor", o: ["noise", "taste", "sound"]}
  - {t: "관리 교육", i: bulb, w: "Keeping…helps…로 '유지하는 것'을 주어로 삼아 꾸준함이 도움이 된다고 말해요. 혈당이 높으면 상처가 느리게 낫고 감염이 쉬워 조절이 치료의 일부예요.", d: "Skipping", k: ["오늘 인슐린은 평소대로 맞으세요", "발을 매일 확인해 보세요"], a: "heal", o: ["bleed", "swell", "itch"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "당뇨족 상처 4문장 순서"
    why: "상처 상태를 보고, 그걸 근거로 열과 전신 증상을 묻고, 어떤 대답이든 혈당 조절을 묻고, 그 혈당을 관리하면 낫는 데 도움이 된다고 닫아요. 'Based on what I see'·'Whatever you tell me'·'it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm checking the wound for dead tissue, redness, and any bad odor.", icon: magnify, ko: "괴사 조직, 발적, 나쁜 냄새가 있는지 상처를 확인하고 있어요", note: "사정"}
    - {en: "Based on what I see, do you have a fever or feel generally unwell?", icon: stetho, ko: "제가 본 걸 바탕으로, 열이 있거나 전반적으로 몸이 안 좋으신가요?", note: "전신"}
    - {en: "Whatever you tell me, I'll also ask how your blood sugar has been controlled lately.", icon: chartup, ko: "어떻게 답하시든 최근 혈당이 어떻게 조절됐는지도 여쭤볼게요", note: "혈당"}
    - {en: "Keeping it controlled helps this heal, so please keep it up.", icon: bulb, ko: "그걸 잘 조절하면 낫는 데 도움이 되니 계속 유지해 주세요", note: "교육"}
  ctx:
    word: "fever"
    ko: "열"
    scenes:
      0: "Fever to 38.6 and feels generally unwell."
      1: "Have you had a fever, or do you feel sick all over like you're coming down with the flu?"
      2: "Are you having a fever or any other systemic symptoms?"
    fix: "Have you felt hot or shivery, or just unwell all over?"
    why: "systemic symptoms(전신 증상)는 의료진의 말이에요. 환자에게는 열이 나는지, 몸 전체가 안 좋은지로 풀어서 물어요."
  sw: {ko: "상처에서 나쁜 냄새가 나는 걸 느끼셨나요?"}
- title: 언어장벽 창상
  s:
  - {t: "통역 연결", i: mic, w: "I'm getting…으로 지금 하는 중임을 알려요. 말이 통하지 않으면 중요한 병력과 동의를 놓칠 수 있어 통역을 먼저 연결해요.", d: "a doctor", k: ["통역 전화를 연결하는 데 잠깐 걸려요", "차트에 통역이 필요하다고 적어 둘게요"], a: "interpreter", o: ["advocate", "assistant", "officer"]}
  - {t: "경위 문진", i: magnify, w: "How…, and with what…?으로 경위와 도구를 함께 물어요. 도구에 따라 오염과 이물 가능성이 달라져요.", d: "at what time", k: ["통증은 몇 점이에요?", "어디서 다치셨나요?"], a: "happen", o: ["heal", "stop", "spread"]}
  - {t: "알레르기·접종", i: pill, w: "두 가지 질문을 and로 묶어 한 번에 확인해요. 약 알레르기와 파상풍 접종 상태는 처치에 쓸 약을 고르는 데 꼭 필요한 정보예요.", d: "any foods", k: ["지금 복용 중인 약이 있으세요?", "마지막 식사는 언제였나요?"], a: "medicines", o: ["foods", "pets", "plants"]}
  - {t: "즉시 연결", i: bell, w: "Let me…로 허락을 구하듯 말해 환자를 존중해요. right away를 붙여 통역 연결을 미루지 않는다고 알려요.", d: "next week", k: ["의사를 먼저 불러올게요", "환자분 언어를 한 번 더 확인할게요"], a: "call", o: ["fire", "hire", "pay"]}
  - {t: "통역 역할", i: mic, w: "will help us…로 통역이 도와 주는 역할을 알려 환자가 안심해요. 통역사가 환자와 의료진 사이에서 정확히 옮겨 줘서 오해를 줄여요.", d: "talk privately", k: ["통역은 전화로 연결될 거예요", "통역 비용은 병원이 부담해요"], a: "communicate", o: ["argue", "compete", "disagree"]}
  - {t: "정보 전달", i: speech, w: "tell the interpreter if…로 통역사를 거쳐 말하면 된다고 알려요. 통역사를 거치면 환자가 중요한 정보를 직접 말할 수 있어 알레르기를 놓치지 않아요.", d: "the receptionist", k: ["알레르기 팔찌를 채워 드릴게요", "통역사에게 천천히 말씀해 주세요"], a: "tell", o: ["thank", "ignore", "pay"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "언어장벽 창상 4문장 순서"
    why: "먼저 통역을 연결하고, 그 통역을 통해 경위를 묻고, 그 경위를 바탕으로 알레르기·접종을 묻고, 그 모두에 답이 나오면 통역이 계획을 전한다고 닫아요. 'the interpreter'·'From that'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm getting an interpreter so we can understand each other.", icon: mic, ko: "서로 이해할 수 있도록 통역을 부를게요", note: "연결"}
    - {en: "Through the interpreter, how did the wound happen, and with what object?", icon: magnify, ko: "통역을 통해, 상처가 어떻게 어떤 물건으로 생겼나요?", note: "경위"}
    - {en: "From that, are you allergic to any medicines, and is your tetanus current?", icon: pill, ko: "그 경위를 듣고, 약 알레르기가 있으신가요, 파상풍 접종은 최신인가요?", note: "확인"}
    - {en: "With all of that answered, the interpreter will help us talk through the plan clearly.", icon: speech, ko: "그 모두에 답이 나오면 통역이 계획을 분명히 전하도록 도울 거예요", note: "계획"}
  ctx:
    word: "interpreter"
    ko: "통역사"
    scenes:
      0: "Interpreter, before we start: I'll ask how the wound happened and what cut her."
      1: "The interpreter will repeat what I say. How did the wound happen?"
      2: "Interpreter, ask her how the wound happened."
    fix: "Tell me how you got this wound."
  sw: {ko: "의료 통역사를 불러 서로 말이 통하게 도울게요"}
- title: 항혈소판제 병용 출혈
  s:
  - {t: "위험 설명", i: bulb, w: "Taking…makes…로 '복용하는 것'이 원인이라고 말해요. 항혈소판제 둘을 함께 쓰면 혈소판이 엉기는 힘이 약해져 지혈이 더 오래 걸려요.", d: "Skipping two", k: ["드시는 약을 모두 적어 둘게요", "피가 계속 나는지 계속 볼게요"], a: "harder", o: ["easier", "faster", "safer"]}
  - {t: "복용약 문진", i: pill, w: "Which…로 선택지 중에서 고르게 묻고 and when으로 시점을 이어요. 아스피린과 클로피도그렐처럼 이름을 모르면 약병이나 처방전을 보여 달라고 해요.", d: "and why", k: ["혈압약은 드시고 계세요?", "언제부터 계속 피가 났어요?"], a: "antiplatelet", o: ["antibiotic", "antacid", "antiviral"]}
  - {t: "처치 설명", i: bandage, w: "longer로 평소보다 오래 누른다고 미리 알려 둬요. 혈소판 억제제를 복용 중이면 피가 멎는 데 오래 걸려 압박을 더 길게 유지해요.", d: "light pressure", k: ["압박한 채로 손을 높이 들어 주세요", "아프면 말씀해 주세요"], a: "apply", o: ["remove", "reduce", "release"]}
  - {t: "환자 호소", i: speech, w: "keeps bleeding through는 붕대 밖으로 계속 배어 나온다는 구동사 표현이에요. 두 약을 함께 복용 중이라는 말은 지혈이 더 어렵다는 중요한 단서예요.", d: "it just stopped", k: ["저는 와파린을 먹고 있어요", "약은 오늘 아침에 먹었어요"], a: "aspirin", o: ["insulin", "metformin", "omeprazole"]}
  - {t: "이유 설명", i: bulb, w: "together가 '따로가 아니라 합쳐서'라는 뜻이라 두 약의 효과가 겹친다는 걸 알려요. 혈소판 억제제를 겹쳐 쓰면 피를 멎게 하는 힘이 약해져 오래 걸려요.", d: "separately", k: ["약을 끊을지는 의사가 정할 거예요", "출혈이 멎을 때까지 계속 누를게요"], a: "together", o: ["separately", "rarely", "never"]}
  - {t: "즉시 보고", i: bell, w: "I'll…로 약속하고 right away로 지금 바로임을 알려요. 항혈소판제 두 가지를 복용 중인 지속 출혈은 의사가 평가해야 해서 간호사가 기다리지 않고 알려요.", d: "after lunch", k: ["약 이름은 차트에 적어 둘게요", "의사가 올 때까지 계속 눌러 드릴게요"], a: "report", o: ["hide", "sell", "lend"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항혈소판제 출혈 4문장 순서"
    why: "복용약과 시점을 묻고, 그 약들이 함께 지혈을 어렵게 한다고 알리고, 그래서 더 오래 누르며 관찰한다고 밝힌 뒤, 그 모두를 근거로 바로 의사에게 보고해요. 'those'·'Because of that'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Which blood thinners do you take, and when did you last take them?", icon: pill, ko: "어떤 혈액 응고 억제제를 드시고 마지막으로 언제 드셨나요?", note: "문진"}
    - {en: "Taking those together makes it harder for the bleeding to stop.", icon: bulb, ko: "그 약들을 함께 먹으면 지혈이 더 어려워져요", note: "이유"}
    - {en: "Because of that, we'll hold firm pressure longer and monitor closely.", icon: bandage, ko: "그래서 압박을 더 오래 유지하면서 자세히 관찰할게요", note: "처치"}
    - {en: "Given all of that, I'm reporting this to the doctor right away.", icon: bell, ko: "그 모두를 고려해 이건 바로 의사에게 보고할게요", note: "보고"}
  ctx:
    word: "report"
    ko: "보고하다"
    scenes:
      0: "Reporting on bed 6: aspirin and clopidogrel, still oozing after 20 minutes of pressure."
      1: "I'm going to report this to the doctor right now."
      2: "I'll report this to the attending for escalation."
    fix: "I'll let the doctor know right away."
  sw: {ko: "아스피린 같은 피를 묽게 하는 약을 드시고 계세요?"}
- title: 동맥성 분출 지혈대
  s:
  - {t: "지혈대 적용", i: bandage, w: "This is…, so we're…로 판단과 행동을 한 문장에 이어 지체 없이 한다는 느낌을 줘요. 압박만으로 잡기 어려운 사지의 동맥 출혈은 지혈대를 바로 써요.", d: "and wait", k: ["동맥 쪽 맥박을 확인할게요", "혈압을 계속 재고 있어요"], a: "arterial", o: ["minor", "slow", "mild"]}
  - {t: "시각 기록", i: calendar, w: "the exact time으로 '정확한 시각'을 강조해요. 지혈대를 적용한 시각은 얼마나 오래 조였는지 가늠하는 핵심 정보라 수술팀에 정확히 전달해요.", d: "the rough size", k: ["지혈대가 너무 조이는지 볼게요", "팔다리 색깔을 확인할게요"], a: "noting", o: ["hiding", "selling", "losing"]}
  - {t: "통증 예고", i: faceWorried, w: "tight and painful을 먼저 솔직히 말하고 but으로 이유를 잇는 순서예요. 지혈대는 아프지만 팔다리를 살리려는 처치라 목적을 함께 알려요.", d: "scary", k: ["지금 진통제를 먼저 놓을게요", "움직이지 말고 가만히 계세요"], a: "save", o: ["lose", "harm", "remove"]}
  - {t: "환자 호소", i: siren, w: "with every heartbeat처럼 박동과 맞춘 표현이 출혈의 박동성을 그대로 알려 줘요. 맥박에 맞춰 뿜는 피는 동맥 손상의 신호라 환자의 외침을 바로 행동으로 받아요.", d: "dripping down", k: ["다리에 힘이 안 들어가요", "눈앞이 어두워지고 있어요"], a: "spurting", o: ["dripping", "oozing", "trickling"]}
  - {t: "이유 설명", i: bulb, w: "alone은 '그것만으로는'이라는 뜻이에요. 지혈대는 눌러서 멎지 않는 사지의 큰 출혈을 막는 도구예요.", d: "starts", k: ["지혈대는 오래 두면 위험할 수 있어요", "지혈대를 풀면 다시 피가 날 수 있어요"], a: "fails", o: ["works", "helps", "stops"]}
  - {t: "시각 기록", i: pencil, w: "write down은 '적어 두다'라는 구동사예요. 정확한 시각을 차트에 적어 두면 인계와 수술 때 조인 시간을 확인할 수 있어요.", d: "forget about", k: ["지혈대가 느슨해지면 바로 알려 드릴게요", "팔다리 색깔을 계속 볼게요"], a: "write", o: ["tear", "burn", "throw"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "지혈대 적용 4문장 순서"
    why: "먼저 지혈대를 바로 적용하고, 그 지혈대가 아프지만 팔다리를 살린다고 알리고, 아파도 그대로 있어야 해서 시각을 적고, 그 시각을 수술팀에 전한다고 닫아요. 'It'·'the pain'·'that time'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm applying a tourniquet right now to stop the bleeding.", icon: bandage, ko: "출혈을 멈추려고 지금 지혈대를 적용하고 있어요", note: "적용"}
    - {en: "It will be tight and painful, but it will save your limb.", icon: faceWorried, ko: "꽉 조이고 아프겠지만 팔다리를 살릴 수 있어요", note: "통증"}
    - {en: "Despite the pain, it must stay on, so I'm noting when it went on.", icon: pencil, ko: "아파도 그대로 있어야 해서 언제 적용했는지 적고 있어요", note: "시각"}
    - {en: "I'll tell the surgical team that time so they know how long it's been on.", icon: speech, ko: "그 시각을 수술팀에 알려 얼마나 오래 있었는지 알게 할게요", note: "전달"}
  ctx:
    word: "tourniquet time"
    ko: "지혈대 시각"
    scenes:
      0: "Tourniquet time: 14:20 (L thigh)."
      1: "Tourniquet time is 14:20 — it's been on about twenty minutes."
      2: "Tourniquet time 1420, documented."
  sw: {ko: "많이 아플 텐데, 팔다리를 살릴 수 있어요"}
