- title: 임신 초기 출혈 문진
  s:
  - {t: "주수·출혈량", i: calendar, w: "두 가지를 한 문장에 묻되 weeks along으로 주수를 쉬운 말로 물어요. 주수와 출혈량은 임신 초기 출혈의 위험도를 가늠하는 첫 정보예요.", d: "were you given", k: ["마지막으로 소변을 본 게 언제인가요?", "임신 검사는 해 보셨나요?"], a: "bleeding", o: ["discharge", "nausea", "swelling"]}
  - {t: "동반 증상", i: stetho, w: "pain과 cramping을 or로 묶으면 환자가 아프다와 쥐어짠다 중 편한 말로 답할 수 있어요. 출혈과 함께 오는 통증은 원인을 가르는 단서예요.", d: "in your back", k: ["출혈이 언제 시작됐는지 알려 주세요", "마지막 생리가 언제였나요?"], a: "cramping", o: ["fever", "dizziness", "burning"]}
  - {t: "안심", i: baby, w: "you and the baby로 산모와 아기를 함께 챙긴다고 말하면 아기 걱정이 큰 환자가 안심해요. right away는 곧바로 움직이겠다는 신호예요.", d: "of the baby", k: ["지금 초음파실로 이동할게요", "혈액 검사를 위해 피를 뽑을게요"], a: "the baby", o: ["your partner", "your family", "your doctor"]}
  - {t: "발생 시점", i: calendar, w: "when 절로 시작 시점을 물으면 환자가 시각이나 요일로 쉽게 답해요. 출혈이 시작된 때부터의 경과는 출혈량의 추이를 가늠하는 기준이 돼요.", d: "where the bleeding", k: ["아랫배 통증이 어느 정도인지 말씀해 주세요", "지금 패드를 갈아 드릴게요"], a: "started", o: ["stopped", "slowed", "worsened"]}
  - {t: "출혈량", i: monitor, w: "spotting과 heavier than your period를 맞세워 보여 주면 환자가 자기 출혈을 생리와 비교해 말할 수 있어요. 양을 숫자 대신 비교로 묻는 방식이에요.", d: ", or lighter", k: ["지금 어지럽지는 않으세요?", "소변 검사를 해 볼게요"], a: "spotting", o: ["discharge", "leaking", "staining"]}
  - {t: "공감", i: faceWorried, w: "I know this is…로 먼저 감정을 인정하면 뒤의 but we're here가 위로로 들려요. 임신 중 출혈은 유산 걱정으로 환자가 크게 불안해하는 증상이에요.", d: "for the doctor", k: ["피검사 결과는 곧 나올 거예요", "보호자분께 연락드릴까요?"], a: "frightening", o: ["embarrassing", "exhausting", "confusing"]}
  - {t: "안정 유도", i: shield, w: "Try to…는 명령보다 부드러운 부탁이에요. 뒤에 돌봄 약속을 붙이면 환자가 차분해질 이유를 함께 들어요.", d: "on your own", k: ["초음파 준비가 곧 끝나요", "혈압을 다시 재 볼게요"], a: "calm", o: ["still", "awake", "positive"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "임신 초기 출혈 문진 4문장 순서"
    why: "주수와 시작 시점을 먼저 묻고, 시작된 뒤의 출혈량을 묻고, 어떤 양이든 통증이 있는지 확인한 뒤, 들은 내용을 받아 바로 살피겠다고 말해요. 'Since it started'·'Whichever it is'·'all that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How far along are you, and when did the bleeding start?", icon: calendar, ko: "임신 몇 주째이고, 출혈은 언제 시작됐나요?", note: "시점"}
    - {en: "Since it started, is it more like spotting, or heavier than your period?", icon: monitor, ko: "시작된 뒤로, 소량인가요 아니면 생리보다 많은가요?", note: "출혈량"}
    - {en: "Whichever it is, are you having any pain or cramping with it?", icon: stetho, ko: "어느 쪽이든, 통증이나 쥐어짜는 느낌이 함께 있나요?", note: "통증"}
    - {en: "Thanks for telling me all that — we'll check on you and the baby right away.", icon: baby, ko: "말씀해 주셔서 고마워요, 당신과 아기를 바로 확인할게요", note: "안심"}
- title: 마지막 월경일 청취
  s:
  - {t: "마지막 생리", i: calendar, w: "마지막 생리의 '첫날'을 묻는 이유는 임신 주수를 그날부터 세기 때문이에요. even roughly를 붙이면 정확히 모르는 환자도 대략 답할 수 있어요.", d: "to the day", k: ["생리 주기가 규칙적인 편인가요?", "생리통이 심하셨나요?"], a: "period", o: ["pregnancy", "delivery", "visit"]}
  - {t: "임신 가능성", i: baby, w: "Is there any chance…는 단정하지 않고 가능성만 묻는 완곡한 질문이라 부담이 적어요. 임신 가능성이 있는 환자는 영상 검사나 약 처방 전에 반드시 이를 확인해요.", d: "you must be", k: ["마지막으로 임신 검사를 한 게 언제인가요?", "피임약을 복용하고 계신가요?"], a: "pregnant", o: ["anemic", "dehydrated", "infected"]}
  - {t: "안심", i: shield, w: "It's okay if…로 모른다고 말해도 된다고 먼저 허락하면 환자가 추측으로 답하지 않아요. 확실하지 않아도 소변 검사로 임신 여부를 바로 확인할 수 있어요.", d: "unless you're", k: ["소변 검사는 몇 분이면 끝나요", "그날 이후로 달라진 증상이 있었나요?"], a: "not sure", o: ["nervous", "embarrassed", "upset"]}
  - {t: "기억 유도", i: bulb, w: "well enough to…로 정확하지 않아도 되는 수준을 알려 줘서 환자가 부담 없이 답해요. rough estimate는 날짜를 정확히 모르는 환자에게 대략의 시기를 묻는 말이에요.", d: "a short summary", k: ["마지막 생리가 평소보다 일찍 시작했나요?", "생리 양은 평소와 비슷했나요?"], a: "a rough estimate", o: ["an exact date", "a full history", "a written list"]}
  - {t: "이유 설명", i: bulb, w: "because로 왜 묻는지 먼저 밝히면 개인적인 질문에도 거부감이 줄어요. 마지막 생리일은 임신 주수와 출산 예정일을 계산하는 기준이에요.", d: "for your insurance", k: ["의사 선생님이 곧 결과를 설명해 드릴 거예요", "소변 검사를 잠시 해 볼게요"], a: "how far along you are", o: ["how healthy the baby is", "how much pain you have", "where the pain is"]}
  - {t: "부담 덜기", i: shield, w: "so로 앞 말의 결론을 이어 '정확해야 한다'는 부담을 덜어요. 마지막 생리일은 대략이라도 임신 주수를 짐작하는 데 쓸 수 있어요.", d: "to the hour", k: ["다음 검사는 소변으로 할게요", "복용 중인 약이 있으면 알려 주세요"], a: "exact", o: ["late", "embarrassed", "quick"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "마지막 월경일 청취 4문장 순서"
    why: "마지막 생리 첫날을 먼저 묻고, 그 날짜와 별개로 임신 가능성을 묻고, 어느 쪽 답이든 소변 검사를 하겠다고 말한 뒤, 날짜와 검사로 주수를 알아낸다고 설명해요. 'that date'·'yes or no'·'the test'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When was the first day of your last period, even roughly?", icon: calendar, ko: "마지막 생리 첫날이 언제였나요, 대략이라도요?", note: "날짜"}
    - {en: "Aside from that date, is there any chance you could be pregnant?", icon: baby, ko: "그 날짜 말고, 임신하셨을 가능성이 있나요?", note: "가능성"}
    - {en: "Whether it's yes or no, we'll do a quick urine test to check.", icon: lab, ko: "예든 아니오든, 소변 검사로 빠르게 확인할게요", note: "검사"}
    - {en: "That date and the test will help us figure out how far along you are.", icon: bulb, ko: "그 날짜와 검사로 임신 주수를 알아볼 수 있어요", note: "이유"}
- title: 골반통 초기 사정
  s:
  - {t: "위치 확인", i: pushpin, w: "point to로 손가락으로 짚게 하면 말로 설명하기 어려운 부위도 정확히 알 수 있어요. 골반통은 오른쪽·왼쪽·정중앙 중 어디인지가 원인을 좁히는 단서예요.", d: "to the side", k: ["통증이 언제부터 있었나요?", "체온을 재 볼게요"], a: "point", o: ["reach", "turn", "look"]}
  - {t: "통증 양상", i: stetho, w: "sharp·dull·crampy처럼 보기를 주면 환자가 통증을 설명할 말을 몰라도 고를 수 있어요. 날카로운지 쥐어짜는지에 따라 의심하는 원인이 달라져요.", d: "like a burn", k: ["통증이 허리로도 번지나요?", "소변볼 때 아프지는 않으세요?"], a: "dull", o: ["burning", "throbbing", "itchy"]}
  - {t: "동반 증상", i: stetho, w: "열·분비물·메스꺼움을 한 문장에 묶어 물으면 환자가 한 번에 답할 수 있어요. 골반통에 열과 분비물이 함께 있으면 골반 감염을 의심하는 단서가 돼요.", d: "from your leg", k: ["아랫배를 눌러 볼게요", "소변 검사를 위해 컵을 드릴게요"], a: "discharge", o: ["bruising", "dizziness", "vomiting"]}
  - {t: "통증 경과", i: chartup, w: "두 가지 선택지를 or로 이어 주면 환자가 '계속'과 '왔다갔다' 중 골라 답하기 쉬워요. 간헐적인 쥐어짜는 통증과 지속적인 통증은 원인을 가르는 단서예요.", d: "keep getting worse", k: ["열이 나는지 재 볼게요", "통증이 몇 점인지 말씀해 주세요"], a: "come and go", o: ["get worse", "move around", "spread out"]}
  - {t: "발병 시점", i: calendar, w: "pain and fever를 한 번에 묶어 물으면 두 증상이 같은 때 시작됐는지 함께 알 수 있어요. 어느 증상이 먼저인지는 원인을 추정하는 데 도움이 돼요.", d: "come back", k: ["혈압과 맥박을 재겠습니다", "마지막으로 드신 게 언제인가요?"], a: "start", o: ["stop", "return", "ease"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "골반통 초기 사정 4문장 순서"
    why: "아픈 자리를 먼저 짚게 하고, 그 자리의 통증 양상을 묻고, 그 통증이 얼마나 오래됐는지 확인한 뒤, 그 기간 동안의 열·분비물을 물어요. 'that spot'·'like that'·'that time'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Can you point to exactly where it hurts?", icon: pushpin, ko: "정확히 어디가 아픈지 가리켜 주시겠어요?", note: "위치"}
    - {en: "Is the pain in that spot sharp, dull, or crampy?", icon: stetho, ko: "그 자리의 통증이 날카로운가요, 둔한가요, 쥐어짜는 듯한가요?", note: "양상"}
    - {en: "How long has it been like that?", icon: calendar, ko: "그런 상태가 얼마나 됐나요?", note: "기간"}
    - {en: "Over that time, have you had any fever, discharge, or nausea?", icon: stetho, ko: "그 기간 동안 열이나 분비물, 메스꺼움이 있었나요?", note: "동반"}
- title: 임신 확인 검사 안내
  sw: {ko: "검사 결과가 양성이면, 다음에 어떻게 할지 함께 이야기할게요"}
  s:
  - {t: "검사 순서", i: lab, w: "먼저 쉬운 검사를 하고 필요하면 더 정확한 검사로 넘어간다고 순서를 알려 주면 환자가 앞으로의 일을 예상할 수 있어요. 소변 임신 검사는 빠르고 간단해서 보통 먼저 해요.", d: "with a swab", k: ["먼저 혈압과 체온을 재겠습니다", "결과는 의사 선생님이 설명해 주실 거예요"], a: "urine", o: ["stool", "saliva", "sputum"]}
  - {t: "검사 차이", i: lab, w: "more precise로 두 검사의 차이를 한 단어로 비교해요. 혈액 검사는 hCG 수치를 정확히 재서 필요하면 변화를 추적할 수 있어요.", d: "to your doctor", k: ["소변 컵은 화장실에 있어요", "결과는 곧 알려 드릴게요"], a: "precise", o: ["basic", "general", "limited"]}
  - {t: "정서 지지", i: handshake2, w: "However…로 어떤 반응도 괜찮다고 먼저 열어 두면 기다리던 결과든 아니든 환자가 감정을 말하기 쉬워요. 결과가 나오기 전에 판단하지 않겠다는 약속이에요.", d: "to hurry you", k: ["결과가 나오면 바로 알려 드릴게요", "화장실은 복도 끝에 있어요"], a: "feeling", o: ["thinking", "deciding", "reacting"]}
  - {t: "소요 안내", i: lab, w: "usually와 just a few minutes로 시간을 대략이라도 알려 주면 기다리는 환자의 불안이 줄어요. 소변 임신 검사는 보통 몇 분 안에 결과가 나와요.", d: "about a day", k: ["이 컵에 소변을 받아 오세요", "컵에 이름 라벨을 붙여 드릴게요"], a: "urine", o: ["blood", "swab", "tissue"]}
  - {t: "다음 안내", i: speech, w: "If로 결과에 따라 이야기하겠다고 하되 together로 함께 정한다는 뜻을 보여 줘요. 결과 뒤의 계획은 환자의 상황과 바람에 따라 달라서 환자와 같이 이야기해요.", d: "we'll check the chart", k: ["혈액 검사도 함께 해 볼게요", "검사 컵은 화장실에 있어요"], a: "together", o: ["alone", "later", "quietly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "임신 확인 검사 안내 4문장 순서"
    why: "검사 순서를 먼저 알리고, 그 소변 검사의 소요 시간을 말하고, 나온 결과가 무엇이든 함께 이야기하겠다고 한 뒤, 그 대화가 어디로 가든 곁에서 돕겠다고 해요. 'The urine test'·'those few minutes'·'that conversation'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We'll start with a urine test, then confirm with blood if needed.", icon: lab, ko: "먼저 소변 검사를 하고, 필요하면 혈액으로 확인할게요", note: "순서"}
    - {en: "The urine test usually takes just a few minutes.", icon: lab, ko: "소변 검사는 보통 몇 분이면 돼요", note: "소요"}
    - {en: "Whatever it shows after those few minutes, we'll talk through what happens next.", icon: speech, ko: "몇 분 뒤 결과가 무엇이든, 다음에 어떻게 할지 이야기할게요", note: "결과"}
    - {en: "Wherever that conversation goes, we're here to support you.", icon: handshake2, ko: "그 대화가 어디로 가든, 저희가 곁에서 지지할게요", note: "지지"}
- title: 산전 기록 확인
  s:
  - {t: "G·P 확인", i: board, w: "임신 횟수와 출산 횟수를 한 문장에서 나란히 물어요. 의료진은 이를 gravida·para로 줄여 쓰지만 환자에게는 풀어서 물어야 정확히 답해요.", d: "and checkups", k: ["이번 임신은 몇 주째인가요?", "마지막 출산은 언제였나요?"], a: "deliveries", o: ["surgeries", "infections", "transfusions"]}
  - {t: "지난 임신", i: calendar, w: "last pregnancy로 범위를 지난 임신에 한정해 환자가 무엇을 말해야 할지 알게 해요. 지난 임신의 문제(자간전증·조산 등)는 이번 임신의 위험을 가늠하는 단서예요.", d: "next pregnancy", k: ["산전 검진은 어디에서 받으셨나요?", "출산은 병원에서 하셨나요?"], a: "last", o: ["first", "current", "second"]}
  - {t: "산전 기록", i: board, w: "with you로 지금 지니고 있는지를 물어서 예·아니오로 짧게 답하게 해요. 산전 기록은 이전 검사와 합병증을 빠르게 확인할 수 있는 자료예요.", d: "in your car", k: ["이 서류에 서명해 주시겠어요?", "보험 카드를 보여 주시겠어요?"], a: "prenatal", o: ["billing", "insurance", "vaccine"]}
  - {t: "횟수 확인", i: board, w: "임신 횟수와 낳은 아기 수를 같은 틀로 따로 물어 두 숫자를 헷갈리지 않게 해요. 쌍둥이 임신이나 유산이 있으면 두 숫자가 달라질 수 있어요.", d: "have you adopted", k: ["유산한 적이 있으신가요?", "제왕절개로 낳으셨나요?"], a: "pregnant", o: ["hospitalized", "injured", "married"]}
  - {t: "합병증", i: stetho, w: "like로 고혈압·당뇨 같은 보기를 들어 주면 환자가 합병증이 무슨 뜻인지 알아듣고 답해요. 지난 임신의 고혈압과 당뇨는 이번 임신의 위험과 관련돼요.", d: "like a cold", k: ["진료 기록은 어디에서 받으셨나요?", "혈압은 지금 재 볼게요"], a: "complications", o: ["allergies", "injuries", "procedures"]}
  - {t: "이유 설명", i: shield, w: "지금까지 물은 질문이 왜 필요한지 마지막에 한 줄로 설명하면 환자가 캐묻는다는 느낌을 덜 받아요. 과거 임신력은 지금 임신의 위험을 가늠하는 데 쓰여요.", d: "for the insurance", k: ["체온을 한 번 재 볼게요", "궁금하신 점이 있으면 편하게 물어보세요"], a: "baby", o: ["family", "partner", "staff"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "산전 기록 확인 4문장 순서"
    why: "임신·출산 횟수를 먼저 묻고, 그중 가장 최근 임신의 합병증을 묻고, 그 임신의 기록을 가지고 있는지 확인한 뒤, 이 병력이 왜 필요한지 마무리해요. 'those'·'that pregnancy'·'this history'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How many pregnancies and deliveries have you had?", icon: board, ko: "임신은 몇 번, 출산은 몇 번 하셨나요?", note: "횟수"}
    - {en: "Thinking of the most recent of those, were there any complications?", icon: stetho, ko: "그중 가장 최근 임신에서 합병증이 있었나요?", note: "합병증"}
    - {en: "Do you have records from that pregnancy with you?", icon: board, ko: "그 임신의 기록을 가지고 계신가요?", note: "기록"}
    - {en: "Any of this history helps us take better care of you and the baby now.", icon: shield, ko: "이런 병력이 지금 당신과 아기를 더 잘 돌보는 데 도움이 돼요", note: "이유"}
