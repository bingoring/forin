- title: 자간전증·자간증
  s:
  - {t: "혈압 알림", i: monitor, w: "수치 대신 high라는 쉬운 말로 알리고 treating it now로 이미 치료 중이라고 말해 안심시켜요. 임신 중 혈압 상승은 자간전증으로 이어질 수 있어서 바로 치료해요.", d: "we're moving you", k: ["두통이 있는지 말씀해 주세요", "소변 검사를 해 볼게요"], a: "high", o: ["low", "normal", "steady"]}
  - {t: "즉시 알림", i: bell, w: "right away와 if절로 어떤 증상이 생기면 곧바로 부르라는 기준을 줘요. 심한 두통은 경련이 오기 전 신호일 수 있어서 놓치지 않게 해요.", d: "Tell the doctor", k: ["산소 수치를 확인할게요", "혈압을 한 번 더 재 볼게요"], a: "headache", o: ["dizziness", "nausea", "swelling"]}
  - {t: "환경 조성", i: shield, w: "소리와 빛 같은 자극을 줄이는 것이 자간전증 환자의 경련 예방 간호의 기본이에요. to protect you로 이유를 붙여 이 조치가 환자를 위한 것임을 알려요.", d: "to test you", k: ["침대 난간을 올려 둘게요", "혈압을 계속 다시 재 볼게요"], a: "quiet", o: ["cool", "clean", "tidy"]}
  - {t: "부종 확인", i: magnify, w: "손이나 얼굴처럼 환자가 직접 보고 확인할 수 있는 부위를 짚어 물어요. 갑자기 심해지는 손·얼굴 부종은 자간전증에서 볼 수 있는 증상이에요.", d: "in your ears", k: ["체중이 갑자기 늘었나요?", "소변량은 어떤가요?"], a: "swelling", o: ["bruising", "itching", "redness"]}
  - {t: "시야 확인", i: magnify, w: "눈앞의 반점처럼 눈으로 보이는 모양을 예로 들면 환자가 증상을 쉽게 알아봐요. 시야 이상은 자간전증의 심한 징후라 놓치지 않고 물어요.", d: "noises", k: ["두통이 심해지지는 않았나요?", "명치 쪽이 아프지는 않으세요?"], a: "spots", o: ["shadows", "colors", "shapes"]}
  - {t: "경련 예방", i: pill, w: "to help prevent로 약을 주는 목적이 이미 시작된 경련을 멈추는 것이 아니라 막는 것임을 알려요. 자간전증 환자에게는 경련 예방으로 황산마그네슘을 쓰는 것이 표준이에요.", d: "to help the doctor", k: ["약을 정맥으로 천천히 넣을 거예요", "약 때문에 얼굴이 화끈거릴 수 있어요"], a: "prevent", o: ["stop", "treat", "watch"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "자간전증·자간증 4문장 순서"
    why: "높은 혈압을 먼저 알리고, 그래서 경련 예방 약을 쓰고, 같은 이유로 방을 조용하게 유지하며, 조용한 방에서도 두통이 심해지면 바로 알려 달라고 해요. 'Because of that'·'the same reason'·'Even in this quiet room'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your blood pressure is high, and we're treating it now.", icon: monitor, ko: "혈압이 높아서 지금 치료하고 있어요", note: "혈압"}
    - {en: "Because of that, we're giving you medication to help prevent a seizure.", icon: pill, ko: "그래서 경련을 예방하려고 약을 드리고 있어요", note: "약"}
    - {en: "For the same reason, we're keeping the room calm and quiet.", icon: shield, ko: "같은 이유로 방을 차분하고 조용하게 유지해요", note: "환경"}
    - {en: "Even in this quiet room, tell me right away if your headache gets worse.", icon: bell, ko: "이 조용한 방에서도 두통이 심해지면 바로 말씀해 주세요", note: "알림"}
- title: ER 내 급속 분만
  sw: {ko: "머리가 보여요 — 힘주기를 멈추고 숨을 쉬어 주세요"}
  s:
  - {t: "격려", i: star, w: "You're doing great처럼 짧은 칭찬으로 산모가 지금 해내고 있다는 확신을 줘요. 급속 분만에서는 간호사가 곁에서 목소리로 이끌어 주는 것이 산모를 안정시켜요.", d: "to watch you", k: ["산부인과 의사가 곧 도착해요", "아기 머리가 보이는지 확인할게요"], a: "deliver", o: ["relax", "sleep", "eat"]}
  - {t: "호흡 유도", i: speech, w: "Listen to me로 주의를 모으고 breathe로 할 일을 하나만 줘서 겁먹은 산모가 따라 하기 쉽게 해요. we'll do this together로 혼자가 아님을 알려요.", d: "and count", k: ["다리를 편안하게 벌려 주세요", "곧 아기 머리가 나올 거예요"], a: "together", o: ["quickly", "slowly", "quietly"]}
  - {t: "신생아 준비", i: baby, w: "ready로 이미 준비를 마쳤다고 말해 산모가 아기 걱정 없이 자기 호흡에 집중하게 해요. 급속 분만에서는 신생아를 받을 팀과 보온·소생 장비를 미리 준비해요.", d: "to wait for", k: ["소아과 의사에게도 연락했어요", "산모분 혈압은 제가 계속 확인할게요"], a: "your baby", o: ["your placenta", "your cord", "your wound"]}
  - {t: "힘주기 멈춤", i: siren, w: "머리가 보일 때 계속 힘주면 머리가 빠르게 나와 회음부가 크게 찢어질 수 있어서 이유(head is showing)를 먼저 말하고 멈추게 해요. for a moment로 잠깐이라는 점을 알려 따르기 쉽게 해요.", d: "to look at me", k: ["제 눈을 보세요", "손으로 침대 난간을 잡으세요"], a: "already", o: ["finally", "slowly", "suddenly"]}
  - {t: "힘주기 안내", i: speech, w: "one more으로 끝이 가깝다는 신호를 주고 수축이 올 때를 기준으로 삼아 힘줄 때를 알려 줘요. 힘은 수축과 함께 줄 때 효과적이에요.", d: "after this contraction", k: ["손으로 아기 머리를 받치고 있어요", "곧 아기가 태어날 거예요"], a: "contraction", o: ["doctor", "nurse", "breath"]}
  - {t: "신생아 보온", i: baby, w: "as soon as they're born으로 태어나는 순간부터 보온이 시작된다는 점을 알려요. 신생아는 체온을 쉽게 잃어서 출생 직후 말리고 따뜻하게 하는 것이 기본이에요.", d: "as soon as you're home", k: ["탯줄은 의사 선생님이 자르실 거예요", "남편분께 아기를 보여 드릴게요"], a: "warmer", o: ["scale", "bassinet", "monitor"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "ER 내 급속 분만 4문장 순서"
    why: "격려로 시작하고, 머리가 보이면 힘주기를 멈추게 하고, 그 충동을 숨으로 넘기게 하고, 그 호흡으로 다음 수축에 한 번 더 힘주게 해요. 'done so well'·'it'·'that breathing'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "You're doing great — I'm right here to help you deliver.", icon: star, ko: "정말 잘하고 계세요, 제가 바로 옆에서 도울게요", note: "격려"}
    - {en: "You've done so well the head is showing — please stop pushing for a moment.", icon: siren, ko: "정말 잘하셔서 머리가 보여요, 잠시 힘주기를 멈춰 주세요", note: "멈춤"}
    - {en: "Listen to me and breathe through it; we'll do this together.", icon: speech, ko: "제 말을 듣고 그 시간을 숨으로 넘겨요, 함께 해낼 거예요", note: "호흡"}
    - {en: "With that breathing, give me one more big push when the next contraction comes.", icon: speech, ko: "그 호흡으로, 다음 수축이 오면 한 번 더 크게 힘주세요", note: "힘주기"}
- title: 자궁외임신 파열 쇼크
  s:
  - {t: "상태 설명", i: monitor, w: "pressure is dropping으로 지금 상태를 숨기지 않고 말하고 acting fast로 이미 움직이고 있다는 점을 붙여요. 자궁외임신 파열에서는 혈압이 떨어지는 것이 대량 출혈의 신호예요.", d: "we're drawing labs", k: ["수술실에 연락해 두었어요", "정맥 주사를 두 군데 잡을게요"], a: "dropping", o: ["changing", "rising", "climbing"]}
  - {t: "의식 유지", i: faceWorried, w: "Stay with me와 keep your eyes on me는 환자를 깨어 있게 붙드는 짧은 부탁이에요. 쇼크에서는 반응이 떨어지는지가 중요한 신호라 말을 걸어 의식을 계속 확인해요.", d: "on the ceiling", k: ["이름이 어떻게 되세요?", "숨을 깊게 쉬어 보세요"], a: "eyes", o: ["hands", "head", "ears"]}
  - {t: "수술 이동", i: scalpel, w: "quickly and safely를 함께 말해 서두르지만 거칠게 다루지는 않는다는 뜻을 전해요. 파열된 자궁외임신은 출혈을 막는 수술이 근본 치료예요.", d: "very quietly", k: ["수술 전에 마지막으로 드신 때를 확인할게요", "마취팀이 곧 와요"], a: "safely", o: ["quietly", "calmly", "privately"]}
  - {t: "복부 소견", i: stetho, w: "rigid와 tender로 손으로 확인한 소견을 쉬운 말로 설명하고 that tells us로 그래서 서두른다고 연결해요. 배가 판자처럼 단단해지는 것은 복강 내 출혈이나 복막 자극을 시사해요.", d: "and very quiet", k: ["숨이 차거나 어지러운가요?", "어깨 쪽으로 퍼지는 통증이 있나요?"], a: "rigid", o: ["swollen", "bruised", "warm"]}
  - {t: "수액·수혈", i: hospital, w: "fluids and blood로 무엇을 주는지, to bring your pressure back up으로 왜 주는지를 함께 말해요. 출혈성 쇼크에서는 잃은 혈액량을 수액과 수혈로 채워요.", d: "to bring your color back", k: ["수혈 전에 이름과 팔찌를 한 번 더 확인할게요", "피 검사를 위해 피를 뽑았어요"], a: "blood", o: ["vitamins", "oxygen", "antibiotics"]}
  - {t: "외과의 도착", i: scalpel, w: "on the way로 곧 도착한다는 것을 알려 환자가 혼자 기다린다는 느낌을 덜어요. 내부 출혈을 직접 막는 일은 수술로 해요.", d: "to start", k: ["수술실이 지금 준비되고 있어요", "수혈이 곧 시작돼요"], a: "surgeon", o: ["pharmacist", "therapist", "dietitian"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "자궁외임신 파열 쇼크 4문장 순서"
    why: "혈압이 떨어진다고 먼저 알리고, 그 이유(딱딱한 배)를 설명하고, 그 때문에 수액과 혈액을 주며, 그것이 들어가는 동안 수술실로 모셔요. 'That's because'·'that serious'·'those fluids and blood'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your pressure is dropping and we're acting fast to stabilize you.", icon: monitor, ko: "혈압이 떨어지고 있어서 안정시키려고 빠르게 조치하고 있어요", note: "상태"}
    - {en: "That's because your belly is rigid and very tender — something serious is happening.", icon: stetho, ko: "배가 딱딱하고 아주 아파서예요, 심각한 일이 생기고 있어요", note: "이유"}
    - {en: "To treat something that serious, we're giving you fluids and blood.", icon: hospital, ko: "그렇게 심각한 일이라 수액과 혈액을 드려요", note: "수혈"}
    - {en: "With those fluids and blood going in, we're getting you to surgery quickly.", icon: scalpel, ko: "그 수액과 혈액이 들어가는 동안 빠르게 수술실로 모실게요", note: "수술"}
- title: 산후 대량출혈
  s:
  - {t: "자궁 마사지", i: hospital, w: "처치 두 가지를 한 문장에 말해 무엇을 하는 중인지 알려요. 산후 출혈에서는 자궁 마사지와 자궁수축제로 자궁을 수축시켜 출혈을 줄여요.", d: "We're weighing", k: ["정맥 라인을 하나 더 잡을게요", "수혈 준비를 하고 있어요"], a: "massaging", o: ["scanning", "measuring", "checking"]}
  - {t: "의식 유지", i: faceWorried, w: "Stay with me로 의식을 붙들고 we're on top of this로 상황을 통제하고 있다는 뜻을 전해요. 출혈 중 환자는 불안과 어지러움으로 의식이 흐려질 수 있어 계속 말을 걸어요.", d: "we're on the phone", k: ["눈을 뜨고 저를 봐 주세요", "이름이 어떻게 되세요?"], a: "Stay", o: ["Talk", "Breathe", "Look"]}
  - {t: "혼자 아님", i: handshake2, w: "You're not alone으로 환자가 가장 두려워하는 고립감을 먼저 덜어 줘요. 대량 출혈에서는 여러 직군이 동시에 움직여서 환자에게 팀이 곁에 있다고 알려요.", d: "is in the hall", k: ["남편분도 곧 오실 거예요", "아기는 다른 팀이 돌보고 있어요"], a: "alone", o: ["late", "wrong", "lost"]}
  - {t: "출혈량", i: bandage, w: "since the delivery로 기준 시점을 분명히 해서 환자가 출산 이후의 양만 떠올려 말하게 해요. 분만 후 출혈량은 처치의 강도를 정하는 근거가 돼요.", d: "since the visit", k: ["혈압과 맥박을 다시 잴게요", "어지럽거나 춥게 느껴지세요?"], a: "delivery", o: ["surgery", "discharge", "admission"]}
  - {t: "자궁 상태", i: stetho, w: "soft라는 쉬운 말로 자궁이 물렁하다고 알리고 so로 그래서 수축을 도와야 한다는 이유를 이어요. 산후 출혈의 가장 흔한 원인은 자궁이 잘 수축하지 않는 자궁이완증이에요.", d: "to watch it", k: ["지금 자궁을 눌러서 확인할게요", "소변줄로 방광을 비워 드릴게요"], a: "soft", o: ["warm", "tender", "large"]}
  - {t: "수혈 안내", i: hospital, w: "to replace what you've lost로 지금 주는 혈액과 수액이 잃은 만큼을 채우는 것이라고 설명해요. 산후 출혈에서는 출혈량에 맞춰 수혈과 수액으로 순환 혈액량을 유지해요.", d: "to explain what you've lost", k: ["혈액형을 다시 확인하고 있어요", "주사 부위가 아프면 말씀해 주세요"], a: "replace", o: ["measure", "count", "record"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "산후 대량출혈 4문장 순서"
    why: "하고 있는 처치를 먼저 알리고, 그 이유(물렁한 자궁)를 설명하고, 그 상태를 감안해 출혈량을 묻고, 잃은 만큼을 채운다고 말해요. 'That's because'·'that soft'·'what you've lost'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We're massaging your uterus and giving medication to stop the bleeding.", icon: hospital, ko: "자궁을 마사지하고 출혈을 멈추도록 약을 드리고 있어요", note: "처치"}
    - {en: "That's because your uterus feels soft, so we need to help it contract.", icon: stetho, ko: "자궁이 물렁해서, 수축하도록 도와야 하기 때문이에요", note: "이유"}
    - {en: "With your uterus that soft, how much blood have you lost since the delivery?", icon: bandage, ko: "자궁이 그렇게 물렁하니, 분만 이후 출혈이 얼마나 있었나요?", note: "출혈량"}
    - {en: "We're giving you more blood and fluids to replace what you've lost.", icon: hospital, ko: "잃은 만큼 채우도록 혈액과 수액을 더 드릴게요", note: "수혈"}
- title: 태아 사망 고지
  sw: {ko: "정말 안타까워요 — 아기가 사망했어요"}
  s:
  - {t: "사실 고지", i: faceWorried, w: "I'm so deeply sorry로 나쁜 소식 앞에 공감부터 놓고 not able to find로 사실을 담담히 말해요. 심박을 찾지 못했다는 한 가지 사실을 먼저 짧게 전하는 것이 좋아요.", d: "we're ready to", k: ["지금 초음파로 다시 확인하고 있어요", "남편분을 불러 드릴까요?"], a: "heartbeat", o: ["position", "movement", "head"]}
  - {t: "죄책감 덜기", i: shield, w: "fault와 wrong 두 말로 환자가 속으로 묻는 내 탓인가에 직접 답해요. 사산을 겪은 부모는 자책하는 경우가 많아서 일찍 분명하게 말해 줘요.", d: "and you couldn't", k: ["의사 선생님이 곧 오실 거예요", "마실 물을 드릴까요?"], a: "wrong", o: ["special", "unusual", "different"]}
  - {t: "곁에 있음", i: handshake2, w: "through whatever comes next로 앞으로의 과정 전부에 함께한다고 약속해요. 사산 직후 부모는 앞으로 무슨 일이 생길지 몰라 막막해서 곁에 있겠다는 약속이 먼저 필요해요.", d: "through the paperwork", k: ["원하시면 상담사를 불러 드릴게요", "아기를 안아 보고 싶으시면 말씀하세요"], a: "next", o: ["first", "last", "early"]}
  - {t: "예고", i: faceWorried, w: "something difficult로 나쁜 소식이 올 것을 미리 알려 충격이 한꺼번에 오지 않게 해요. 사망을 알리기 전에 짧은 예고 문장을 두는 것은 나쁜 소식 전달의 기본 단계예요.", d: "a few words", k: ["의사 선생님과 같이 말씀드릴게요", "잠시 앉으시겠어요?"], a: "difficult", o: ["new", "strange", "personal"]}
  - {t: "사실 전달", i: faceWorried, w: "has died처럼 뜻이 하나로만 들리는 말로 직접 전해요. 완곡하게 말하면 충격 속의 부모가 뜻을 놓치거나 아직 살아 있는지 되물을 수 있어요.", d: "so very worried", k: ["의사 선생님이 같이 설명드릴 거예요", "남편분께 연락해 드릴까요?"], a: "has died", o: ["has passed", "is gone", "is lost"]}
  - {t: "죄책감 덜기", i: shield, w: "could have done으로 지난 일을 돌아보며 자책하는 마음에 답해요. 부모가 자신을 탓하는 말을 하기 전에 먼저 꺼내 주면 자책이 깊어지는 것을 줄일 수 있어요.", d: "to explain this", k: ["조용한 방으로 옮겨 드릴게요", "가족분께 연락해 드릴까요?"], a: "done", o: ["said", "eaten", "noticed"]}
  - {t: "시간 주기", i: coffee, w: "Take all the time you need로 서두르지 않아도 된다고 말해 압박을 덜어요. 사산 직후에는 결정을 재촉하지 않고 부모가 소식을 받아들일 시간을 줘요.", d: "Take a short break", k: ["아기를 안아 보시겠어요?", "기념이 될 만한 것을 남길 수 있어요"], a: "before", o: ["after", "while", "since"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "태아 사망 고지 4문장 순서"
    why: "어려운 이야기가 있다고 예고하고, 심박을 찾지 못했다는 사실을 말하고, 그 말이 무슨 뜻인지 분명히 전하고, 부모 탓이 아니며 곁에 있겠다고 말해요. 'it'·'That means'·'your baby's death'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I need to tell you something difficult about your baby's heartbeat.", icon: faceWorried, ko: "아기 심박에 대해 어려운 이야기를 드려야 해요", note: "예고"}
    - {en: "I'm so deeply sorry — we're not able to find it.", icon: faceWorried, ko: "정말 안타깝습니다, 심박을 찾을 수가 없어요", note: "사실"}
    - {en: "That means your baby has died, and I am so very sorry.", icon: faceWorried, ko: "그건 아기가 사망했다는 뜻이에요, 정말 안타깝습니다", note: "고지"}
    - {en: "Nothing you did caused your baby's death — and we're here with you.", icon: handshake2, ko: "당신이 한 일 때문이 아니에요, 저희가 곁에 있어요", note: "위로"}
- title: 패혈성 유산
  s:
  - {t: "원인 설명", i: bulb, w: "point to로 증상이 가리키는 방향을 말해 아직 확진은 아니라는 뉘앙스를 지켜요. 유산 후 열과 악취 나는 분비물은 자궁 안 감염을 의심하게 하는 증상이에요.", d: "we need to explain", k: ["지금 체온을 다시 재 볼게요", "수액을 먼저 연결할게요"], a: "infection", o: ["allergy", "injury", "obstruction"]}
  - {t: "즉시 치료", i: pill, w: "right away로 지금 시작한다고 분명히 말해 환자가 기다리는 불안을 덜어요. 패혈증이 의심되면 항생제와 수액을 가능한 한 빨리 시작하는 것이 기본이에요.", d: "We're writing", k: ["피 검사와 배양을 위해 피를 뽑을게요", "열이 언제부터 있었는지 말씀해 주세요"], a: "antibiotics", o: ["vitamins", "oxygen", "nutrition"]}
  - {t: "칭찬·안심", i: handshake2, w: "You did the right thing으로 병원에 온 결정을 먼저 인정해 늦게 왔다는 자책을 덜어 줘요. 유산 후 열·오한은 빨리 치료받을수록 경과가 좋아서 온 것이 옳은 선택이에요.", d: "staying calm", k: ["지금 혈압과 맥박을 재 볼게요", "불편하신 곳이 있으면 바로 말씀해 주세요"], a: "coming in", o: ["speaking up", "calling", "asking"]}
  - {t: "경고 증상", i: siren, w: "증상 세 가지를 한 문장에 나열해 환자가 자신의 증상과 맞춰 볼 수 있게 해요. 유산 후 열·오한·심한 분비물은 자궁 안 감염의 경고 신호예요.", d: "can mean a transfer", k: ["체온이 몇 도인지 재 볼게요", "출혈은 얼마나 있으셨나요?"], a: "chills", o: ["itching", "nausea", "swelling"]}
  - {t: "경과 확인", i: calendar, w: "since the miscarriage로 기준 시점을 정해 환자가 유산 이후만 떠올려 답하게 해요. 증상이 시작된 시점은 감염의 진행 정도를 가늠하는 데 쓰여요.", d: "since the visit", k: ["어지럽거나 숨이 차지는 않으세요?", "출혈은 지금 얼마나 있나요?"], a: "miscarriage", o: ["surgery", "procedure", "delivery"]}
  - {t: "수액 목적", i: hospital, w: "also로 앞서 말한 처치에 하나를 더 얹고 to support…로 목적을 붙여요. 패혈증에서는 혈관이 늘어나 혈압이 떨어질 수 있어서 수액으로 순환을 유지해요.", d: "to explain", k: ["항생제도 같이 들어갈 거예요", "소변량도 같이 재야 해요"], a: "support", o: ["record", "measure", "check"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "패혈성 유산 4문장 순서"
    why: "감염 가능성을 먼저 알리고, 그래서 항생제와 수액을 시작하고, 그 수액이 혈압을 지탱한다고 설명하고, 치료가 시작된 상태에서 온 것이 잘한 일이라고 안심시켜요. 'That's why'·'Those fluids'·'the treatment started'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your symptoms point to an infection we need to treat urgently.", icon: bulb, ko: "증상이 감염을 가리켜서 서둘러 치료해야 해요", note: "설명"}
    - {en: "That's why we're starting antibiotics and fluids right away.", icon: pill, ko: "그래서 지금 바로 항생제와 수액을 시작해요", note: "치료"}
    - {en: "Those fluids will support your blood pressure.", icon: hospital, ko: "그 수액이 혈압을 지탱해 줄 거예요", note: "수액"}
    - {en: "With treatment started, we'll care for you — you did well to come in.", icon: handshake2, ko: "치료가 시작됐으니 돌봐 드릴게요, 잘 오셨어요", note: "안심"}
