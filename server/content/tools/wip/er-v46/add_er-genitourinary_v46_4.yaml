- title: 폐쇄성 요로감염 패혈증
  s:
  - t: 긴급 설명
    i: siren
    w: make this an…으로 두 소견이 합쳐져 응급이 된다는 이유를 말해요. 감염 중 열과 낮은 혈압은 감염이 온몸에 영향을 주는 위험한 신호예요.
    d: for you
    k:
    - 혈압은 곧 다시 재 볼게요
    - 열은 해열제로 내릴게요
    a: fever
    o:
    - rash
    - cough
    - headache
  - t: 즉시 치료
    i: pill
    w: We're starting…right away로 지금 시작한다는 진행형이에요. 패혈증이 의심되면 수액과 항생제를 서둘러 시작하는 것이 치료의 핵심이에요.
    d: in an hour
    k:
    - 혈액 배양을 위해 피를 뽑을게요
    - 항생제 알레르기가 있나요?
    a: antibiotics
    o:
    - surgery
    - dialysis
    - chemotherapy
  - t: 시술 안내
    i: scalpel
    w: may need로 아직 확정이 아닌 가능성을 알려요. 소변이 막힌 채 감염이 생기면 약만으로는 부족해서 막힌 곳을 뚫는 시술이 필요할 수 있어요.
    d: this week
    k:
    - 가족께 시술을 설명해 드릴게요
    - 동의서를 받아야 해요
    a: urgent
    o:
    - annual
    - optional
    - elective
  - t: 상태 설명
    i: bulb
    w: fighting을 써서 몸이 감염과 싸우는 모습으로 풀어 줘요. 어려운 용어 없이 지금 상태가 위중하다는 것을 솔직하게 알려요.
    d: for days
    k:
    - 수액이 몸의 균형을 맞춰 줄 거예요
    - 가족에게 연락해 드릴까요?
    a: serious
    o:
    - mild
    - slight
    - rare
  - t: 이유 설명
    i: siren
    w: because로 서두르는 이유를 바로 붙여요. 패혈증은 감염에 대한 몸의 반응이 장기를 해치는 상태라 몇 시간 안에도 나빠질 수 있어요.
    d: on the monitor
    k:
    - 수액을 더 빠르게 넣고 있어요
    - 혈액 배양을 위해 피를 뽑을게요
    a: sepsis
    o:
    - eczema
    - acne
    - arthritis
  - t: 전문의 연계
    i: hospital
    w: as soon as possible은 가능한 한 빨리라는 뜻이에요. 전문의가 막힌 소변길을 뚫어 주는 것이 감염을 잡는 핵심이에요.
    d: during rounds
    k:
    - 시술 뒤에도 계속 지켜볼 거예요
    - 시술 동의서에 서명해 주세요
    a: specialist
    o:
    - pharmacist
    - dietitian
    - receptionist
  order:
    tag: 대화 흐름
    icon: compass
    ko: 폐쇄성 요로감염 패혈증 4문장 순서
    why: 몸이 심각한 감염과 싸우고 있다고 알리고, 열과 낮은 혈압이 그 감염의 심각성을 보여 준다고 하고, 혈압이 그만큼 낮아 수액과 항생제를 바로 시작하며, 그에 더해 막힌 곳을 뚫는 시술이 필요할 수 있다고 해요. 'that infection'·'that low'·'those'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Your body is fighting a serious infection right now.
      icon: bulb
      ko: 지금 몸이 심각한 감염과 싸우고 있어요
      note: 상태
    - en: Your fever and low blood pressure show how serious that infection is.
      icon: siren
      ko: 열과 낮은 혈압이 그 감염이 얼마나 심각한지 보여 줘요
      note: 근거
    - en: With your pressure that low, we're starting fluids and antibiotics right away.
      icon: pill
      ko: 혈압이 그렇게 낮아서 수액과 항생제를 바로 시작해요
      note: 치료
    - en: On top of those, you may need an urgent procedure to relieve the blockage.
      icon: scalpel
      ko: 거기에 더해 폐쇄를 풀 긴급 시술이 필요할 수도 있어요
      note: 시술
  sw:
    ko: 이 감염이 심각해서 저희가 빠르게 움직이고 있어요
- title: 고칼륨혈증 위기(무뇨)
  s:
  - t: 심전도
    i: monitor
    w: We're getting…right away로 지금 바로 한다는 진행형이에요. 칼륨이 높으면 심장 리듬에 변화가 생길 수 있어서 심전도로 먼저 확인해요.
    d: this afternoon
    k:
    - 혈압을 한 번 더 재 볼게요
    - 수액을 천천히 맞으실 거예요
    a: ECG
    o:
    - X-ray
    - MRI
    - EEG
  - t: 위험 설명
    i: siren
    w: may be로 아직 확정 전임을 정직하게 말하고, so로 서두르는 이유를 이어요. 높은 칼륨은 심장 리듬을 위험하게 만들 수 있어서 시간이 중요해요.
    d: at the bedside
    k:
    - 칼륨 수치를 곧 다시 확인할게요
    - 음식은 지금 드시지 마세요
    a: dangerously
    o:
    - slightly
    - mildly
    - barely
  - t: 투석 안내
    i: hospital
    w: may need로 가능성으로 알리면서 emergency를 붙여 급하다는 점은 분명히 해요. 칼륨이 매우 높고 소변이 나오지 않으면 투석으로 칼륨을 빼는 방법이 있어요.
    d: after the scan
    k:
    - 투석 전에 금식해야 할 수 있어요
    - 투석 센터에 연락해 둘게요
    a: emergency
    o:
    - routine
    - regular
    - weekly
  - t: 소변량
    i: calendar
    w: at all은 '조금이라도'라는 뜻의 강조 표현이에요. 소변이 전혀 나오지 않으면 칼륨이 몸 밖으로 못 나가 쌓여서 위험해져요.
    d: for now
    k:
    - 오늘 투석은 받으셨나요?
    - 소변 색깔이 어땠나요?
    a: urinate
    o:
    - eat
    - sleep
    - drink
  - t: 원인 설명
    i: bulb
    w: can affect로 가능한 영향을 알려요. 칼륨은 심장 근육의 전기 신호에 관여해서 너무 높으면 리듬이 불안정해질 수 있어요.
    d: by morning
    k:
    - 약으로 칼륨을 낮출 수 있어요
    - 칼륨이 많은 음식은 피하세요
    a: affect
    o:
    - improve
    - repair
    - cure
  - t: 모니터링
    i: monitor
    w: closely for any changes로 계속 살피고 있음을 알려요. 칼륨이 높은 동안은 심전도 변화를 놓치지 않으려고 심장 모니터를 계속 봐요.
    d: twice a day
    k:
    - 모니터 알람이 울릴 수 있어요
    - 전극이 불편하면 말씀해 주세요
    a: closely
    o:
    - rarely
    - hardly
    - never
  order:
    tag: 대화 흐름
    icon: compass
    ko: 고칼륨혈증 위기 4문장 순서
    why: 칼륨이 위험하게 높을 수 있다고 알리고, 그 칼륨을 소변으로 빼내고 있는지 묻고, 높은 칼륨이 심장 리듬에 줄 영향 때문에 심전도를 바로 찍고, 그 심전도 뒤로 모니터를 계속 지켜요. 'it'·'It'·'that ECG'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Your potassium may be dangerously high, so we're acting fast.
      icon: siren
      ko: 칼륨이 위험할 정도로 높을 수 있어서 빠르게 대처하고 있어요
      note: 위험
    - en: Have you been able to urinate at all today to get rid of it?
      icon: calendar
      ko: 그걸 내보내도록 오늘 소변을 조금이라도 볼 수 있었나요?
      note: 소변량
    - en: It can affect your heart rhythm, so we're getting an ECG right away to check your heart.
      icon: monitor
      ko: 심장 리듬에 영향을 줄 수 있어서 바로 심전도로 심장을 확인할게요
      note: 심전도
    - en: We're watching your heart monitor closely for any changes after that ECG.
      icon: monitor
      ko: 그 심전도 뒤에도 변화가 있는지 모니터를 면밀히 보고 있어요
      note: 관찰
  ctx:
    word: potassium
    ko: 칼륨
    sc:
      0:
        en: Potassium is 7.1 with peaked T waves — anuric dialysis patient.
      1:
        en: Potassium 7.1. ECG with peaked T waves. MD notified.
      2:
        en: Your potassium is 7.1 with peaked T waves.
    why: 모두 칼륨이 높아 심전도에 변화가 생겼다는 같은 말이에요. 뾰족한 T파는 고칼륨혈증의 대표 변화예요. 환자에게는 수치·T파 대신 무엇이 문제이고 어떻게 하는지를 말해요.
- title: 신부전 폐부종
  s:
  - t: 즉시 조치
    i: stetho
    w: to help you breathe로 조치의 목적을 알려요. 몸을 세우면 폐에 찬 체액이 아래로 가라앉아 숨쉬기가 한결 편해져요.
    d: very gently
    k:
    - 혈압을 한 번 더 재 볼게요
    - 산소 수치를 확인할게요
    a: oxygen
    o:
    - fluids
    - insulin
    - antibiotics
  - t: 투석 안내
    i: hospital
    w: may need로 가능성으로 알려요. 신부전으로 소변이 나오지 않으면 약만으로는 체액을 빼기 어려워서 투석으로 빼야 할 수 있어요.
    d: for the nurse
    k:
    - 수분 섭취를 제한할 거예요
    - 혈압은 곧 다시 재 볼게요
    a: dialysis
    o:
    - surgery
    - massage
    - radiation
  - t: 안심 말
    i: faceWorried
    w: 숨찬 환자에게 할 일(slow breaths)과 안심(we're right here)을 한 문장에 함께 줘요. 겁이 나면 호흡이 더 빨라지니 곁에 있다는 말이 도움이 돼요.
    d: in the hallway
    k:
    - 산소 수치를 다시 확인할게요
    - 편한 자세를 찾아 드릴게요
    a: slow
    o:
    - fast
    - shallow
    - quick
  - t: 자세 설명
    i: bulb
    w: make it easier to…는 '…하기 쉽게 만들다'라는 틀이에요. 앉으면 횡격막이 내려가 폐가 잘 펴져서 숨쉬기가 편해져요.
    d: for a while
    k:
    - 숨이 차면 바로 알려 주세요
    - 산소 마스크를 조금 조일게요
    a: easier
    o:
    - harder
    - slower
    - tougher
  - t: 조치 이유
    i: shield
    w: to ease…로 조치의 이유를 이어요. 폐에 체액이 차면 산소가 부족해지고 심장이 더 힘들게 일해서, 자세와 산소로 부담을 덜어요.
    d: next visit
    k:
    - 산소는 필요하면 조절할게요
    - 몸을 눕혀서 쉬게 해 드릴게요
    a: ease
    o:
    - raise
    - hide
    - count
  - t: 회복 안내
    i: check
    w: should improve는 개선이 예상됨을 부드럽게 말해요. 몸에 쌓인 체액이 빠지면 다리 부종도 함께 가라앉아요.
    d: for sure
    k:
    - 다리를 높이 올려 두세요
    - 양말을 신으셔도 돼요
    a: improve
    o:
    - worsen
    - double
    - spread
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신부전 폐부종 4문장 순서
    why: 산소와 자세로 숨쉬기를 돕는다고 알리고, 그 호흡곤란 뒤의 체액 과부하에 투석이 필요할 수 있다고 하고, 그 체액이 빠지면 다리 부종이 나아진다고 하고, 그 모든 일 동안 곁에 있다고 해요. 'behind it'·'that fluid'·'all of that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: We're giving you oxygen and sitting you upright to help you breathe.
      icon: stetho
      ko: 산소를 드리고 몸을 세워서 숨쉬기를 도와드릴게요
      note: 조치
    - en: The fluid overload behind it may need urgent dialysis to remove.
      icon: hospital
      ko: 그 뒤의 체액 과부하는 긴급 투석으로 제거해야 할 수도 있어요
      note: 투석
    - en: The swelling in your legs should improve once that fluid comes off.
      icon: check
      ko: 그 체액이 빠지면 다리 부종도 나아질 거예요
      note: 전망
    - en: Try to take slow breaths through all of that — we're right here.
      icon: faceWorried
      ko: 그 모든 동안 천천히 숨을 쉬어 보세요, 저희가 여기 있어요
      note: 안심
  sw:
    ko: 천천히 숨을 쉬어 보세요, 저희가 바로 여기 있어요
- title: 음경지속발기증
  s:
  - t: 지속 시간
    i: calendar
    w: How many hours…?로 시간 단위로 정확히 답하게 해요. 지속발기는 시간이 길수록 조직 손상 위험이 커져서 몇 시간째인지가 치료의 시급성을 정해요.
    d: at triage
    k:
    - 통증은 얼마나 심한가요?
    - 지금 어떤 약을 드시고 계세요?
    a: hours
    o:
    - years
    - months
    - weeks
  - t: 긴급성
    i: siren
    w: time-sensitive는 시간이 결과를 좌우한다는 뜻이에요. so로 긴급한 이유와 지금 하는 행동을 이어요.
    d: over the phone
    k:
    - 진통제를 먼저 드릴게요
    - 혈압부터 재 볼게요
    a: contacting
    o:
    - avoiding
    - forgetting
    - cancelling
  - t: 통증 조절
    i: pill
    w: while…로 두 일이 동시에 진행된다고 알려요. 지속발기는 통증이 심할 수 있어서 치료를 준비하는 동안 통증을 줄여요.
    d: this week
    k:
    - 곧 의사가 설명해 드릴 거예요
    - 동의서에 서명해 주세요
    a: prepare
    o:
    - cancel
    - refuse
    - forget
  - t: 원인 탐색
    i: magnify
    w: that might explain this로 원인이 될 만한 것을 열어 두고 물어요. 외상이나 새로 먹기 시작한 약은 지속발기의 원인으로 흔히 확인해요.
    d: last week
    k:
    - 이런 일이 전에도 있었나요?
    - 지금 통증은 어느 정도인가요?
    a: injury
    o:
    - rash
    - cough
    - headache
  - t: 위험 설명
    i: bulb
    w: the longer…, the higher…는 한쪽이 커질수록 다른 쪽도 커지는 비례 구문이에요. 지속발기는 시간이 길수록 조직에 피가 돌지 못해 손상될 위험이 커져요.
    d: very soon
    k:
    - 통증이 줄면 말씀해 주세요
    - 조직 검사를 할 거예요
    a: higher
    o:
    - lower
    - smaller
    - safer
  - t: 전문의 호출
    i: bell
    w: on-call은 호출에 대기 중인 당직이라는 뜻이에요. 지속발기는 비뇨의학과의 즉각적인 평가가 필요한 응급이라 바로 부르는 중임을 알려요.
    d: on the monitor
    k:
    - 외과 의사를 부르고 있어요
    - 응급실 의사가 곧 올 거예요
    a: urologist
    o:
    - pharmacist
    - dietitian
    - receptionist
  order:
    tag: 대화 흐름
    icon: compass
    ko: 지속발기증 4문장 순서
    why: 몇 시간째인지 묻고, 그 시간이 길수록 조직 위험이 커진다고 설명하고, 시간이 중요해서 당직 비뇨의학과를 바로 부르고, 전문의가 오는 동안 통증을 줄여 준다고 해요. 'this goes on'·'the urologist'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: How many hours has this been going on?
      icon: calendar
      ko: 이게 몇 시간이나 지속되고 있나요?
      note: 시간
    - en: The longer this goes on, the higher the risk to the tissue.
      icon: bulb
      ko: 이게 오래 지속될수록 조직에 대한 위험이 높아져요
      note: 위험
    - en: This is time-sensitive, so we're calling the on-call urologist right away.
      icon: bell
      ko: 시간이 중요해서 지금 바로 당직 비뇨기과 전문의를 부르고 있어요
      note: 호출
    - en: We'll give you pain medicine while the urologist is on the way.
      icon: pill
      ko: 전문의가 오는 동안 진통제를 드릴게요
      note: 통증
  ctx:
    word: urology
    ko: 비뇨의학과
    sc:
      0:
        en: Urology, I've got a man with painful priapism for six hours — can you come now?
      1:
        en: Priapism, onset 6 h ago. Urology paged.
      2:
        en: You have priapism, onset six hours ago; urology has been paged.
        fix: This has gone on long enough to harm the tissue, so we've called urology to come right away.
- title: 외상성 방광파열
  s:
  - t: 배뇨 여부
    i: calendar
    w: pass urine은 소변을 본다는 뜻이고, since the accident로 사고 이후만 따로 짚어요. 외상 뒤 소변을 못 보거나 피가 섞이면 방광이나 요도 손상을 의심하는 단서예요.
    d: during rounds
    k:
    - 골반이 어느 쪽이 더 아프세요?
    - 사고 때 의식을 잃으셨나요?
    a: accident
    o:
    - surgery
    - holiday
    - wedding
  - t: 검사 안내
    i: monitor
    w: a special X-ray…with contrast로 어떤 검사인지 풀어 말해요. 조영제를 방광에 채워 찍으면 방광이 찢어져 새는 곳을 볼 수 있어요.
    d: at the bedside
    k:
    - 혈액검사를 먼저 할게요
    - 소변을 컵에 받아 주세요
    a: contrast
    o:
    - sedation
    - anesthesia
    - oxygen
  - t: 팀 연계
    i: hospital
    w: keep…involved는 계속 함께 보게 한다는 표현이에요. 골반 손상은 다른 장기 손상과 출혈이 같이 있을 수 있어서 외상팀이 함께 평가해요.
    d: after the scan
    k:
    - 정형외과에도 연락할게요
    - 골반 사진을 한 번 더 찍을게요
    a: trauma
    o:
    - dental
    - eye
    - hearing
  - t: 촉진 사정
    i: stetho
    w: when I press here로 곧 누르는 동작과 위치를 미리 알려 놀라지 않게 해요. 골반을 눌렀을 때의 통증은 골절이나 장기 손상의 단서가 돼요.
    d: for now
    k:
    - 다리를 움직일 수 있나요?
    - 숨 쉴 때도 아프신가요?
    a: pelvis
    o:
    - shoulder
    - knee
    - neck
  - t: 요도 확인
    i: magnify
    w: before we place…로 순서를 밝혀요. 골반 외상에서 요도 끝에 피가 보이면 요도 손상일 수 있어서 도뇨관을 넣기 전에 먼저 확인해요.
    d: by morning
    k:
    - 소변 주머니를 확인하고 있어요
    - 요도 주변을 닦고 있어요
    a: before
    o:
    - after
    - while
    - unless
  - t: 수술 안내
    i: scalpel
    w: may need to로 아직 확정이 아닌 가능성을 알려요. 방광이 복강 쪽으로 터진 경우에는 수술로 꿰매는 경우가 많아서 외과의가 판단해요.
    d: for the nurse
    k:
    - 수술 전에 금식하셔야 해요
    - 마취과 의사가 와서 설명해 드릴 거예요
    a: repair
    o:
    - remove
    - replace
    - borrow
  order:
    tag: 대화 흐름
    icon: compass
    ko: 방광파열 의심 4문장 순서
    why: 사고 후 소변을 봤는지 묻고, 그 일을 돕는 관을 넣기 전에 끝의 피를 살피고, 그 피가 무엇을 뜻하는지 특수 엑스레이로 확인하고, 그 결과에 따라 수술을 안내해요. 'that'·'that blood'·'that X-ray'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Have you been able to pass any urine since the accident?
      icon: calendar
      ko: 사고 이후 소변을 조금이라도 볼 수 있었나요?
      note: 배뇨
    - en: We're watching for blood at the tip before we place any tube to help with that.
      icon: magnify
      ko: 그걸 돕는 관을 넣기 전에 끝부분에 피가 있는지 살펴보고 있어요
      note: 요도
    - en: A special X-ray of your bladder with contrast will show what that blood means.
      icon: monitor
      ko: 조영제를 쓴 방광 특수 엑스레이로 그 피가 무슨 뜻인지 볼 수 있어요
      note: 엑스레이
    - en: Depending on what that X-ray shows, the surgeon may need to repair the bladder in the operating room.
      icon: scalpel
      ko: 그 엑스레이 결과에 따라 외과의가 수술실에서 방광을 복구해야 할 수도 있어요
      note: 수술
  ctx:
    word: Foley
    ko: 폴리 도뇨관
    sc:
      2:
        en: There's blood at your urethral meatus, so the Foley is deferred pending a RUG.
        fix: We saw a little blood at the tip, so we'll do a special X-ray before we put in a Foley, the tube that drains your bladder.
- title: 신성 위기 급변 인계
  s:
  - t: 소변량
    i: chartup
    w: How much…?로 양을 묻고, over the last few hours로 기간을 좁혀요. 소변량은 콩팥 기능을 가장 쉽게 볼 수 있는 지표예요.
    d: in the hallway
    k:
    - 지난 몇 시간 동안 물을 얼마나 드셨나요?
    - 마지막으로 화장실에 간 게 언제였나요?
    a: urinated
    o:
    - eaten
    - slept
    - walked
  - t: 변화 보고
    i: speech
    w: have changed는 지금까지 이어진 변화를 말해요. so로 이유와 행동을 이어 환자가 왜 의사에게 알리는지 이해하게 해요.
    d: next visit
    k:
    - 검사를 다시 할게요
    - 보호자에게 설명해 드릴게요
    a: updating
    o:
    - avoiding
    - ignoring
    - forgetting
  - t: 보고 내용
    i: board
    w: I'll report…clearly로 무엇을 어떻게 보고할지 약속해요. 소변량과 칼륨 추이는 콩팥이 나빠지는 속도를 알려 줘서 의사가 판단하는 핵심 정보예요.
    d: to your family
    k:
    - 차트에 기록만 해 둘게요
    - 퇴원 서류를 준비할게요
    a: report
    o:
    - hide
    - ignore
    - delay
  - t: 추이 설명
    i: chartup
    w: has been climbing은 지금까지 계속 오르고 있다는 현재완료진행형이에요. 한 번의 수치보다 계속 오르는 추이가 더 위험한 신호일 수 있어요.
    d: since tomorrow
    k:
    - 칼륨 수치를 한 번 더 확인할게요
    - 오늘은 칼륨이 많은 음식을 피하세요
    a: climbing
    o:
    - falling
    - dropping
    - sinking
  - t: 호출 안내
    i: bell
    w: I'm going to…로 곧 할 행동을 미리 알려요. 숫자(these numbers)를 가지고 전화하면 의사가 상황을 한 번에 파악해요.
    d: at triage
    k:
    - 당직 의사가 곧 올 거예요
    - 수치는 차트에 적어 둘게요
    a: numbers
    o:
    - names
    - pictures
    - stories
  - t: 보고 약속
    i: board
    w: give a clear report로 보고를 명확하게 하겠다고 약속해요. 소변량과 활력징후를 함께 보고하면 의사가 지금 상태를 정확히 잡아요.
    d: to the front desk
    k:
    - 활력징후를 15분마다 잴게요
    - 소변량은 매시간 기록할게요
    a: clear
    o:
    - long
    - late
    - private
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신성 위기 급변 인계 4문장 순서
    why: 칼륨이 계속 오르고 있다고 알리고, 그 몇 시간 동안 소변량을 묻고, 그 수치들을 가지고 당직 의사에게 전화하며, 그 통화에서 소변량과 활력징후를 보고해요. 'those hours'·'those numbers'·'that call'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Your potassium has been climbing for the past few hours.
      icon: chartup
      ko: 지난 몇 시간 동안 칼륨이 계속 오르고 있어요
      note: 추이
    - en: How much have you urinated over those hours?
      icon: chartup
      ko: 그 시간 동안 소변을 얼마나 보셨나요?
      note: 소변량
    - en: With that amount and those numbers, I'm going to call the on-call doctor now.
      icon: bell
      ko: 그 양과 수치를 가지고 지금 당직 의사에게 연락할 거예요
      note: 호출
    - en: On that call, I'll give a clear report of your urine output and vital signs.
      icon: board
      ko: 그 통화에서 소변량과 활력징후를 명확하게 보고할게요
      note: 보고
  ctx:
    word: potassium
    ko: 칼륨
    sc:
      0:
        en: Urine output's been 10 an hour for three hours, and potassium went from 5.8 to 6.6 — can you come see him?
      1:
        en: UO 30 mL over 3 h. Potassium 5.8 → 6.6. On-call MD notified.
      2:
        en: Your UO is 10 mL per hour and your potassium is 6.6.
    why: 모두 소변량이 줄고 칼륨이 올랐다는 같은 말이에요. 당직의에게는 숫자와 추이를 정확히, 환자에게는 UO 같은 약어 대신 무엇이 달라졌고 무엇을 하는지를 말해요.
