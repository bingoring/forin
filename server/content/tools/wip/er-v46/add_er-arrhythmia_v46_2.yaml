- title: 발작성 SVT 미주신경자극 설명
  s:
  - {t: "동작 지시", i: me, w: "I want you to …는 환자에게 구체적인 동작을 부탁하는 모양이에요. bear down은 배변할 때처럼 힘을 주는 동작이라 쉬운 말로 따라 하게 할 수 있고, 이런 동작은 미주신경을 자극하는 방법(발살바)으로 쓰여요.", d: "and sit up", k: ["숨을 크게 들이쉬었다 내쉬세요", "눈을 감고 천천히 세어 보세요"], a: "hold", o: ["release", "lift", "pass"]}
  - {t: "다음 단계", i: pill, w: "If that doesn't work로 다음 계획을 미리 알려 주면 첫 시도가 안 들어도 환자가 놀라지 않아요. 발작성 SVT에서 이런 동작이 안 들으면 정맥으로 빠르게 작용하는 약을 쓰는 것이 일반적인 다음 단계예요.", d: "by mouth", k: ["그래도 안 되면 바로 수술해요", "그래도 안 되면 집에 가서 쉬세요"], a: "fast", o: ["slow", "daily", "weekly"]}
  - {t: "부작용 안내", i: bell, w: "You may feel …로 생길 수 있는 느낌을 미리 알려 주면 막상 느껴도 놀라지 않아요. 이런 약을 쓸 때 얼굴이 화끈거리거나 가슴이 답답한 느낌이 몇 초 가는 경우가 흔해요.", d: "for an hour", k: ["몇 시간 동안 가슴이 아플 수 있어요", "아무 느낌도 없을 거예요"], a: "brief", o: ["long", "severe", "constant"]}
  - {t: "이유 설명", i: shield, w: "so로 지금의 빠른 심박수와 이 방법을 쓰는 이유를 이어 줘요. 미주신경을 자극하는 동작은 약이나 전기 치료 전에 먼저 시도해 볼 수 있는 안전한 방법이에요.", d: "next week", k: ["심박수가 낮아서 약을 줄일 거예요", "심박수는 정상이니 걱정 마세요"], a: "safe", o: ["risky", "painful", "rough"]}
  - {t: "안심 설명", i: shield, w: "normal을 먼저 말해 그 느낌이 이상 신호가 아님을 알려요. 뒤에 and goes away quickly를 붙이면 곧 끝난다는 점이 함께 전해져요.", d: "and lasts all day", k: ["화끈거림은 위험한 신호예요", "화끈거림은 하루 종일 가요"], a: "normal", o: ["dangerous", "rare", "harmful"]}
  - {t: "안심 설명", i: monitor, w: "the whole time으로 처음부터 끝까지 곁에서 보고 있다는 점을 강조해요. 이런 시도 중에는 리듬을 계속 지켜보는 것이 안전 관리의 일부예요.", d: "once in a while", k: ["모니터는 잠깐만 확인할게요", "모니터를 끄고 진행할게요"], a: "watching", o: ["moving", "charging", "silencing"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "미주신경 자극 설명 4문장 순서"
    why: "먼저 동작을 지시하고, 그것이 안 되면 쓸 약을 알리고, 약이 들어갈 때의 느낌을 알리고, 그 느낌이 있어도 지켜보고 있다고 안심시킵니다. 'that'·'it goes in'·'that feeling'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I want you to bear down like you're straining, and hold it.", icon: me, ko: "힘주듯이 아랫배에 힘을 주고 그대로 참아보세요", note: "동작"}
    - {en: "If that doesn't work, we'll give a fast medicine through your IV.", icon: pill, ko: "그래도 안 되면 정맥주사로 빠르게 작용하는 약을 드릴게요", note: "다음 단계"}
    - {en: "You may feel a brief flushing or heavy chest when it goes in — it passes in seconds.", icon: bell, ko: "들어갈 때 잠깐 화끈거리거나 가슴이 무거울 수 있어요, 몇 초면 지나가요", note: "부작용"}
    - {en: "Even with that feeling, we're watching your monitor the whole time.", icon: monitor, ko: "그런 느낌이 있어도 저희가 계속 모니터를 보고 있어요", note: "안심"}
  sw: {ko: "힘주듯이 아랫배에 힘을 주고 그대로 참아보세요."}
- title: 서맥·현기증 감별
  s:
  - {t: "어지럼 양상", i: faceWorried, w: "when you stand up or all the time처럼 두 경우를 비교하게 하면 일어설 때만 생기는지 늘 있는지를 가를 수 있어요. 자세와 관련된 어지럼과 계속되는 어지럼은 원인이 다를 수 있어요.", d: "after you eat", k: ["어지러울 때 구토도 하셨나요?", "어지러울 때 눈이 침침한가요?"], a: "lightheaded", o: ["nauseous", "thirsty", "sleepy"]}
  - {t: "복용 약", i: pill, w: "on any …?는 지금 쓰고 있는 약을 묻기에 알맞은 말이에요. 혈압약 중에는 심박수를 느리게 하는 약이 있어서 어지럼의 원인을 가늠하는 중요한 정보예요.", d: "or cold", k: ["어떤 약에 알레르기가 있으세요?", "오늘 약을 드셨나요?"], a: "blood pressure", o: ["diabetes", "allergy", "cholesterol"]}
  - {t: "기절 여부", i: bulb, w: "actually … or just …로 실제로 일어난 일과 그럴 뻔한 느낌을 구분해 달라고 해요. 실제 실신인지 실신할 것 같은 느낌인지에 따라 평가가 달라질 수 있어요.", d: "or nearly fell", k: ["넘어져서 다치신 적이 있나요?", "어지러울 때 가슴도 아팠나요?"], a: "passed out", o: ["thrown up", "fallen down", "woken up"]}
  - {t: "원인 설명", i: bulb, w: "can sometimes로 가능성을 부드럽게 말해요. 심박수가 느리면 뇌로 가는 혈류가 줄 수 있어서 특히 갑자기 일어날 때 어지러울 수 있어요.", d: "after you eat", k: ["빠른 심박수 때문에 열이 날 수 있어요", "느린 심박수는 아무 증상이 없어요"], a: "lightheaded", o: ["hungry", "thirsty", "cold"]}
  - {t: "약 설명", i: pill, w: "Some …은 모든 약이 아니라 일부만 그렇다는 뜻이라 환자가 약을 임의로 끊지 않게 도와줘요. 베타차단제 같은 일부 혈압약은 심박수를 느리게 만들어요.", d: "very quickly", k: ["혈압약은 모두 끊으셔야 해요", "혈압약은 심박수를 올려요"], a: "blood pressure", o: ["allergy", "cholesterol", "stomach"]}
  - {t: "검사 안내", i: stetho, w: "now와 again으로 두 번 잰다는 순서를 알려 줘요. 누웠을 때와 섰을 때의 맥박을 비교하면 자세에 따라 심박수가 어떻게 달라지는지 알 수 있어요.", d: "after you eat", k: ["지금 앉아서 체온을 잴게요", "누워서 소변 검사를 할게요"], a: "pulse", o: ["weight", "height", "temperature"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "어지럼 감별 문진 4문장 순서"
    why: "어지러운 양상을 묻고, 실제 기절 여부를 묻고, 어느 쪽이든 약 때문일 수 있다며 복용 약을 묻고, 모아서 맥박을 재겠다고 합니다. 'That helps'·'Either way'·'all of that'이 앞 줄을 받아 순서가 하나예요."
    lines:
    - {en: "Do you feel lightheaded when you stand up or all the time?", icon: faceWorried, ko: "일어설 때 어지러우세요, 아니면 계속 그러세요?", note: "양상"}
    - {en: "That helps. Have you actually passed out or just felt close to it?", icon: bulb, ko: "도움이 돼요. 실제로 기절하셨나요, 그럴 뻔한 느낌이었나요?", note: "기절"}
    - {en: "Either way, some blood pressure medications can slow your heart rate — are you on any?", icon: pill, ko: "어느 쪽이든 일부 혈압약은 심박수를 느리게 해요 — 드시는 게 있나요?", note: "복용 약"}
    - {en: "Thanks. With all of that in mind, let's check your pulse lying down and again standing up.", icon: stetho, ko: "고마워요. 이걸 다 고려해서 누웠을 때와 섰을 때 맥박을 확인해 볼게요", note: "검사"}
  ctx: {word: "pass out", ko: "기절하다"}
- title: 갑상선기능항진 의심
  s:
  - {t: "체중 변화", i: chartup, w: "without trying은 일부러 뺀 것이 아닌 변화를 묻는다는 뜻이에요. 이유 없는 체중 감소는 갑상선기능항진 같은 대사 문제를 의심하는 단서가 될 수 있어요.", d: "on purpose", k: ["최근에 식욕이 늘었나요?", "최근에 다이어트를 시작하셨나요?"], a: "loss", o: ["gain", "lifting", "training"]}
  - {t: "증상 확인", i: faceWorried, w: "more than usual로 평소와 비교하게 해서 환자 본인의 기준에 맞춰 답하게 해요. 더위를 못 참거나 땀이 많고 손이 떨리는 것은 갑상선기능항진에서 흔한 증상이에요.", d: "less than before", k: ["평소보다 기운이 없고 졸리신가요?", "평소보다 숨이 더 차시나요?"], a: "hot", o: ["cold", "sleepy", "weak"]}
  - {t: "과거력", i: board, w: "Have you ever …?는 과거 전체를 묻고, 병과 약을 한 문장에 묶어 두 가지를 한 번에 확인해요. 갑상선약을 과하게 복용하면 맥박이 빨라질 수 있어요.", d: "or had surgery", k: ["심장 수술을 받으신 적이 있나요?", "갑상선 검사를 오늘 받으셨나요?"], a: "pills", o: ["tests", "scans", "shots"]}
  - {t: "원인 설명", i: bulb, w: "working overtime은 '과하게 일한다'는 비유라서 갑상선이 호르몬을 너무 많이 만든다는 개념을 쉬운 말로 전해요. 갑상선 호르몬이 많으면 심박수가 빨라질 수 있어요.", d: "all by itself", k: ["빠른 심박수는 갑상선이 쉬고 있다는 뜻이에요", "빠른 심박수는 늘 심장병 때문이에요"], a: "overtime", o: ["slowly", "backwards", "alone"]}
  - {t: "단서 설명", i: magnify, w: "often이 단정을 피해 '그럴 때가 많다'로 말해 줘요. 손 떨림과 빠른 심장 박동이 함께 보이면 갑상선 문제를 의심하는 단서가 돼요.", d: "very rarely", k: ["손 떨림은 심장이 느리다는 뜻이에요", "손 떨림은 늘 불안 때문이에요"], a: "hands", o: ["legs", "knees", "lips"]}
  - {t: "검사 안내", i: lab, w: "along with로 채혈과 심장 리듬 확인을 함께 한다고 알려 줘요. 갑상선 수치는 혈액 검사로 확인하고 심장 리듬은 모니터나 심전도로 확인해요.", d: "and your weight", k: ["심장 리듬만 확인하고 채혈은 안 해요", "소변을 받아서 갑상선을 볼게요"], a: "levels", o: ["size", "shape", "history"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "갑상선 의심 문진 4문장 순서"
    why: "체중 변화를 묻고, 그와 함께 다른 증상을 묻고, 증상들이 갑상선과 이어질 수 있다고 설명하고, 확인하려고 채혈한다고 알립니다. 'Along with that'·'Those symptoms'·'To confirm that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Have you noticed any weight loss without trying?", icon: chartup, ko: "일부러 애쓰지 않았는데 체중이 줄었나요?", note: "체중"}
    - {en: "Thanks. Along with that, do you feel hot, sweaty, or shaky more than usual?", icon: faceWorried, ko: "고마워요. 그와 함께 평소보다 덥거나 땀이 나거나 손이 떨리나요?", note: "증상"}
    - {en: "Those symptoms together can mean your thyroid is working overtime.", icon: bulb, ko: "그런 증상이 함께 있으면 갑상선이 과하게 일하는 걸 수 있어요", note: "설명"}
    - {en: "To confirm that, we'll draw blood to check your thyroid levels.", icon: lab, ko: "그걸 확인하려고 채혈해서 갑상선 수치를 볼게요", note: "검사"}
  sw: {ko: "평소보다 덥거나 땀이 나거나 손이 떨리시나요?"}
- title: 증상 축소 환자 위험신호
  s:
  - {t: "공감 전환", i: handshake2, w: "I hear you로 먼저 환자의 말을 받아 주고 but으로 필요한 질문을 이어요. 환자가 증상을 줄여 말해도 말을 끊지 않고 존중하면 더 솔직하게 말해 줘요.", d: "right away", k: ["걱정 마세요, 질문은 하지 않을게요", "그럼 바로 퇴원하셔도 돼요"], a: "important", o: ["personal", "simple", "routine"]}
  - {t: "위험신호", i: siren, w: "any chest pain or …로 가슴 통증과 실신 직전의 느낌을 함께 확인해요. 가슴 통증이나 실신에 가까운 증상은 두근거림을 가볍게 넘기면 안 되는 위험 신호예요.", d: "or run a fever", k: ["열이 나거나 기침을 하셨나요?", "최근에 넘어지신 적이 있나요?"], a: "fainting", o: ["crying", "sneezing", "vomiting"]}
  - {t: "설득", i: shield, w: "Even if …로 환자가 작게 여기는 마음을 인정하면서 확인의 필요성을 말해요. worth checking은 '확인할 가치가 있다'는 표현이라 지시가 아니라 이유로 들려요.", d: "unless it stops", k: ["사소하다면 확인하지 않아도 돼요", "이 증상은 이미 다 해결됐어요"], a: "minor", o: ["painful", "sudden", "scary"]}
  - {t: "공감", i: faceWorried, w: "I know …, but …은 환자의 생각을 먼저 인정한 뒤 내 의도를 말하는 구조예요. the full picture는 일부가 아니라 전체 상황을 알고 싶다는 관용 표현이에요.", d: "so skip the rest", k: ["큰 일처럼 느껴지시는 거 알아요, 그래서 걱정돼요", "작게 느껴지니 더 묻지 않을게요"], a: "small", o: ["scary", "sudden", "short"]}
  - {t: "설득", i: bulb, w: "Sometimes와 actually로 사소해 보여도 중요할 수 있다는 반전을 부드럽게 말해요. 짧게 지나간 증상도 병력에서는 부정맥을 찾는 중요한 단서가 될 수 있어요.", d: "and often useless", k: ["짧은 느낌은 보통 의미가 없어요", "짧은 느낌은 검사로 알 수 없어요"], a: "brief", o: ["strange", "sudden", "heavy"]}
  - {t: "다음 계획", i: check, w: "Let's …는 함께하는 계획으로 들려요. so we don't miss anything serious는 신중히 보는 목적이 환자를 위한 것임을 알려요.", d: "so we can leave", k: ["빨리 끝내고 퇴원해요", "중요한 건 나중에 확인해요"], a: "carefully", o: ["quickly", "briefly", "privately"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "증상을 축소하는 환자 응대 4문장 순서"
    why: "환자의 말을 받아 주며 질문을 시작하고, 위험 신호를 묻고, 그 증상이 사소해도 확인할 가치가 있다고 설득하고, 그래서 신중히 확인하자고 마무리합니다. 'The first one'·'those symptoms'·'Because of that'이 앞 줄을 가리켜요."
    lines:
    - {en: "I hear you, but I need to ask a few important questions.", icon: handshake2, ko: "말씀 잘 들었어요, 그래도 중요한 질문 몇 가지를 해야 해요", note: "공감"}
    - {en: "The first one: did you have any chest pain or come close to fainting?", icon: siren, ko: "첫 번째로, 가슴 통증이 있었거나 실신할 뻔했나요?", note: "질문"}
    - {en: "Even if it felt minor, those symptoms are worth checking.", icon: shield, ko: "사소하게 느껴졌더라도 그런 증상은 확인할 가치가 있어요", note: "설득"}
    - {en: "Because of that, let's check this carefully so we don't miss anything serious.", icon: check, ko: "그래서 놓치는 게 없도록 신중하게 확인해 봐요", note: "계획"}
  sw: {ko: "말씀 잘 들었어요, 그래도 중요한 질문 몇 가지를 여쭤봐야 해요."}
- title: 심계항진+공황 감별
  s:
  - {t: "공황 감별", i: faceWorried, w: "start with …로 두근거림과 감정 중 무엇이 먼저였는지를 물어요. 공황이 먼저인지 두근거림이 먼저인지는 원인을 가르는 데 도움이 돼요.", d: "after a meal", k: ["두근거림이 식사 직후에 시작됐나요?", "두근거림이 운동하는 중에 시작됐나요?"], a: "panic", o: ["anger", "shame", "relief"]}
  - {t: "과거력", i: calendar, w: "before와 what helped로 과거 경험과 효과가 있었던 대처를 함께 물어요. 환자가 전에 효과를 본 방법은 이번에 도울 방법을 찾는 단서가 돼요.", d: "or why not", k: ["이런 약을 드신 적이 있나요?", "이런 일이 처음이신가요?"], a: "helped", o: ["hurt", "failed", "worsened"]}
  - {t: "호흡 유도", i: me, w: "Let's …와 together가 환자를 혼자 두지 않고 같이 한다는 느낌을 줘요. 천천히 호흡하면 불안으로 빨라진 호흡과 심박이 안정되는 데 도움이 될 수 있어요.", d: "on your own", k: ["숨을 더 빠르게 쉬어 봐요", "숨을 오래 참아 봐요"], a: "slow", o: ["count", "record", "measure"]}
  - {t: "감별 설명", i: bulb, w: "but so can …은 두 가지 가능성을 나란히 놓아 공황이라고 단정하지 않는 말투예요. 공황으로도 심박이 빨라질 수 있지만 부정맥도 같은 증상을 낼 수 있어 확인이 필요해요.", d: "and so will", k: ["공황은 심장에 전혀 영향을 주지 않아요", "리듬은 이미 모두 정상으로 확인됐어요"], a: "race", o: ["slow", "shake", "sink"]}
  - {t: "호흡 지시", i: me, w: "with me로 같이 한다는 느낌을 주고 for a count of four로 길이를 숫자로 알려 줘요. 구체적인 숫자가 있으면 불안한 환자가 따라 하기 쉬워요.", d: "as hard as you can", k: ["숨을 내쉬고 다섯을 세 보세요", "숨을 최대한 빨리 들이쉬세요"], a: "four", o: ["ten", "twenty", "thirty"]}
  - {t: "결과 안심", i: check, w: "which is reassuring은 앞 내용 전체를 받아 '안심이 되는 소견'이라고 평가해 줘요. 지금 리듬이 안정적이라는 사실을 짚어 주면 환자의 불안이 줄어요.", d: "although it's worrying", k: ["지금 리듬이 많이 불규칙해요", "지금 심박수가 아주 느려요"], a: "steady", o: ["irregular", "dangerous", "chaotic"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "공황·부정맥 감별 4문장 순서"
    why: "공황과 두근거림의 선후를 묻고, 호흡을 같이 늦추겠다고 하고, 구체적인 호흡을 지시하고, 그 호흡 뒤의 리듬을 알려 줍니다. 'Thanks'·'For that'·'those breaths'가 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "Did the racing start with a feeling of panic or fear?", icon: faceWorried, ko: "빠르게 뛰는 느낌이 공황이나 두려움과 함께 시작됐나요?", note: "질문"}
    - {en: "Thanks. Let's slow your breathing together while we check your heart.", icon: me, ko: "고마워요. 심장을 확인하는 동안 같이 호흡을 늦춰 봐요", note: "제안"}
    - {en: "For that, breathe in slowly with me for a count of four.", icon: speaker, ko: "그러려면 저와 함께 넷을 세며 천천히 들이쉬어 보세요", note: "지시"}
    - {en: "After those breaths, your rhythm looks steady, which is reassuring.", icon: check, ko: "그렇게 숨 쉬고 나니 리듬이 안정적이라 다행이에요", note: "결과"}
  sw: {ko: "같이 해봐요 — 저와 함께 넷을 세면서 천천히 숨을 들이쉬어 보세요."}
- title: 항부정맥제 복약 순응도
  s:
  - {t: "마지막 복용", i: pill, w: "When did you last …?는 마지막으로 한 때를 묻는 틀이라 정확한 시점을 말하게 해요. 부정맥 약은 마지막 복용 시간을 알아야 약효가 남아 있는지 가늠할 수 있어요.", d: "at the clinic", k: ["심장약을 하루에 몇 번 드세요?", "심장약을 누가 처방해 줬나요?"], a: "heart", o: ["allergy", "pain", "sleep"]}
  - {t: "중단 이유", i: bulb, w: "What made you …?는 추궁이 아니라 이유를 궁금해하는 말투예요. 비난하지 않고 물어야 환자가 부작용이나 비용 같은 진짜 이유를 말해 줘요.", d: "so you quit", k: ["약을 어디에서 받으셨어요?", "약을 몇 알 드시나요?"], a: "stop", o: ["start", "keep", "resume"]}
  - {t: "복약 중요성", i: pill, w: "can은 '그럴 수 있다'는 가능성으로 말해 겁주지 않아요. 항부정맥제를 거르면 약효가 떨어져 이전의 불규칙한 리듬이 다시 나타날 수 있어요.", d: "can keep away", k: ["약을 거르면 리듬이 더 좋아져요", "약을 거르면 혈압이 바로 올라요"], a: "doses", o: ["meals", "visits", "tests"]}
  - {t: "공감 설명", i: faceWorried, w: "Some people …로 다른 사람들도 그렇다고 말하면 환자가 비난받는 느낌 없이 이유를 털어놓기 쉬워요. 부작용은 환자가 약을 끊는 흔한 이유예요.", d: "because of the weather", k: ["어떤 사람들은 약값 때문에 병원에 안 와요", "어떤 사람들은 약을 두 배로 먹어요"], a: "tired", o: ["dizzy", "nauseous", "itchy"]}
  - {t: "복약 중요성", i: pill, w: "even a few로 몇 번만 걸러도 영향이 있다는 점을 강조해요. 항부정맥제는 몸에 일정한 양이 유지되어야 효과가 나서 거르면 리듬이 다시 흐트러질 수 있어요.", d: "and never", k: ["약을 거르면 오히려 리듬이 안정돼요", "약을 거르면 맥박이 느려져요"], a: "abnormal", o: ["steady", "healthy", "slow"]}
  - {t: "해결 제안", i: handshake2, w: "Let's talk about …은 해결책을 함께 찾자는 제안이라 환자를 꾸짖는 말이 되지 않아요. ways to make … easier는 복약을 어렵게 만드는 이유를 같이 줄이자는 뜻이에요.", d: "why you won't", k: ["약을 더 많이 드시도록 설득할게요", "약값을 환자가 직접 내셔야 해요"], a: "easier", o: ["stronger", "shorter", "harder"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "복약 순응도 확인 4문장 순서"
    why: "마지막 복용을 묻고, 중단한 이유를 묻고, 중단이 리듬에 미치는 영향을 말하고, 그걸 바탕으로 해결을 제안합니다. 'I see'·'it'·'Knowing that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did you last take your heart medication?", icon: pill, ko: "심장약을 마지막으로 언제 드셨어요?", note: "마지막"}
    - {en: "I see. What made you stop taking it?", icon: bulb, ko: "그렇군요. 왜 중단하게 되셨어요?", note: "이유"}
    - {en: "Stopping it can bring the irregular rhythm back, which is why I'm asking.", icon: stetho, ko: "중단하면 불규칙한 리듬이 돌아올 수 있어서 여쭤보는 거예요", note: "설명"}
    - {en: "Knowing that, let's talk about ways to make taking it easier for you.", icon: handshake2, ko: "그러니 약을 더 편하게 드실 방법을 이야기해 봐요", note: "제안"}
  sw: {ko: "왜 약을 드시지 않게 되셨어요?"}
