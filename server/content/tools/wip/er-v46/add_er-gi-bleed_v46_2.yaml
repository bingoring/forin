    i: cross
    w: the first few times로 맨 처음 몇 번을 짚어 물어요. 처음엔 음식물만 나오다가 반복 끝에 피가 나오면 구토로 인한 점막 손상을 시사해요.
    d: this morning
    k: ['처음 토하셨을 때 음식이 섞였나요?', '처음 토하신 게 언제였나요?']
