  - t: 구토 횟수
    i: faceWorried
    w: had vomited로 피를 알아차리기 전 과거의 구토 횟수를 묻고 beforehand로 시점을 못 박아요. 피가 나오기 전에 구토를 반복했는지가 감별의 핵심 단서예요.
    d: in a row
    k: ['구토하기 전에 무엇을 드셨나요?', '구토가 몇 시간째 계속되나요?']
    a: beforehand
    o: [afterwards, later, tomorrow]
  - t: 음주 문진
    i: me
    w: recently로 최근 음주를 짚어 물어요. 과음 뒤의 반복 구토는 Mallory-Weiss의 흔한 배경이라서 탓하는 투가 아니게 담담하게 물어요.
    d: at night
    k: ['술을 마신 뒤에 토하셨나요?', '술을 얼마나 오래 드셨나요?']
