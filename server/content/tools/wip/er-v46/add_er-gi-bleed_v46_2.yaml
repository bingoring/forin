    i: compass
    w: the vomiting or the blood로 두 선택지를 나란히 줘 환자가 순서만 고르면 돼요. 구토가 먼저였다면 구토 중 압력이 올라 점막이 찢어졌을 가능성을 떠올려요.
    d: again
    k: ['둘이 같이 나왔나요?', '어느 쪽이 더 많았나요?']
    a: first
    o: [last, second, next]
