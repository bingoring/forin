- title: 당뇨 언어장벽 교육
  s:
  - {t: "통역 안내", i: speech, w: "so we can으로 통역을 부르는 목적을 밝히고 explain clearly로 정확한 전달이 목표임을 말해요. 미국 병원은 영어가 서툰 환자에게 자격 있는 통역을 무료로 제공해야 하고, 가족 통역은 정확성 문제 때문에 피해요.", d: "your neighbor", k: ["통역사가 곧 전화로 연결돼요", "설명은 천천히 할게요"], a: "interpreter", o: ["educator", "advocate", "assistant"]}
  - {t: "시연", i: pill, w: "Let me show you로 말로만 설명하지 않고 직접 보여 주겠다고 해요. 언어 장벽이 있을 때는 단계별로 보여 주는 시연이 말보다 전달이 잘 돼요.", d: "all at once", k: ["설명서는 모국어로 드릴게요", "궁금한 건 통역사에게 말씀하세요"], a: "step by step", o: ["all at once", "in a hurry", "from memory"]}
  - {t: "질문 확인", i: speech, w: "any questions로 '있다면 무엇이든'을 열어 두고 about the insulin으로 범위를 정해요. 'Do you understand?'는 예 하고 넘어가기 쉬워서 질문이 있는지를 물어요.", d: "about the doctor", k: ["통역이 필요하면 말씀하세요", "설명서를 한 부 드릴게요"], a: "insulin", o: ["diet", "procedure", "discharge"]}
  - {t: "되짚기 확인", i: check, w: "show me back은 teach-back, 곧 환자가 직접 해 보이게 하는 방법이에요. 'Do you understand?'에는 예 하고 넘어가기 쉬워서, 되짚어 보게 하는 것이 이해했는지 확인하는 정확한 방법이에요.", d: "so you can", k: ["제가 한 번 더 보여 드릴게요", "통역사에게 물어보세요"], a: "understand", o: ["agree", "forget", "refuse"]}
  - {t: "시연 요청", i: pill, w: "Please로 요청을 정중하게 하고 how you would로 가정해서 보여 달라고 해 틀려도 부담이 적게 해요. draw up은 주사기나 펜에 약을 정해진 양만큼 채우는 동작이에요.", d: "put away", k: ["주사 부위는 어디로 하세요?", "바늘은 새것을 쓰세요?"], a: "draw up", o: ["throw away", "put away", "give up"]}
  - {t: "칭찬", i: star, w: "exactly right로 맞은 부분을 구체적으로 짚어 칭찬해요. 교육 중에 잘한 점을 먼저 확인해 주면 환자가 자신감을 얻어 집에서도 따라 하기 쉬워요.", d: "That's not quite", k: ["한 번만 더 해 보세요", "집에서도 그렇게 하시면 돼요"], a: "exactly", o: ["almost", "partly", "barely"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "통역 곁들인 인슐린 교육 4문장 순서"
    why: "통역을 부른다고 알리고, 그 통역과 함께 단계별로 보여 주고, 그것을 환자가 직접 해 보게 하고, 맞게 하면 칭찬해요. 'the interpreter's help'·'do it'·'That'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'll bring an interpreter so we can explain clearly.", icon: speech, ko: "정확히 설명드릴 수 있게 통역사를 모셔올게요", note: "통역"}
    - {en: "With the interpreter's help, let me show you step by step how to use the insulin.", icon: pill, ko: "통역사와 함께 인슐린 사용법을 한 단계씩 보여드릴게요", note: "시연"}
    - {en: "Please show me how you would do it yourself.", icon: pill, ko: "직접 어떻게 하실지 보여주세요", note: "되짚기"}
    - {en: "That's exactly right, you understand this well.", icon: star, ko: "맞아요, 정확히 이해하고 계세요", note: "칭찬"}
  sw: {ko: "설명을 정확히 드릴 수 있게 통역사를 모셔올게요"}
- title: DKA 중증 저칼륨
  s:
  - {t: "증상 문진", i: stetho, w: "Tell me about…으로 질문 대신 자유롭게 말하게 해서 환자가 느낀 그대로 들어요. 칼륨이 낮으면 근육이 약해지고 쥐가 나며 심하면 부정맥이 와서 증상을 먼저 확인해요.", d: "pain or swelling", k: ["언제부터 그러셨어요?", "다리가 저리진 않으세요?"], a: "cramping", o: ["bleeding", "swelling", "itching"]}
  - {t: "증상 문진", i: stetho, w: "feeling weak or crampy로 두 느낌을 형용사로 나란히 줘서 환자가 '네, 그거예요'라고 고르기 쉬워요. crampy는 '쥐가 나는 듯한'이라는 일상어예요.", d: "or numb", k: ["어느 근육이 가장 심하세요?", "걸을 때 힘이 드세요?"], a: "weak", o: ["strong", "sore", "stiff"]}
  - {t: "순서 설명", i: lab, w: "so로 결과와 계획을, before로 행동의 순서를 알려 줘요. 인슐린은 칼륨을 세포 안으로 밀어 넣어 혈중 칼륨을 더 떨어뜨려서, DKA에서 칼륨이 낮으면 먼저 채워요.", d: "after more", k: ["심전도 모니터를 붙일게요", "칼륨은 정맥으로 천천히 들어가요"], a: "before", o: ["after", "during", "along with"]}
  - {t: "감시 안내", i: monitor, w: "We're watching…closely는 지금 하는 일을 진행형으로 알려 안심시켜요. 칼륨이 낮으면 심전도가 변하고 위험한 부정맥이 올 수 있어서 모니터로 계속 봐요.", d: "on the phone", k: ["심전도 전극을 붙일게요", "칼륨 수치를 다시 확인할게요"], a: "monitor", o: ["scale", "thermometer", "scanner"]}
  - {t: "보류 안내", i: pill, w: "hold는 '쓰지 않고 보류한다'는 병원 말이고 until이 풀리는 조건을 알려요. DKA에서 칼륨이 3.3 mEq/L 미만이면 인슐린을 미루고 칼륨부터 채우라는 것이 ADA 지침이에요.", d: "start", k: ["칼륨을 정맥으로 넣을게요", "혈액검사를 다시 할게요"], a: "hold", o: ["give", "add", "start"]}
  - {t: "감시 안내", i: bell, w: "Any changes로 작은 변화도 놓치지 않는다는 뜻을 담고 right away로 바로 알아챈다고 말해요. 칼륨이 떨어지면 T파가 납작해지고 U파가 생기는 식으로 심전도에 먼저 드러나요.", d: "next week", k: ["알람이 울려도 놀라지 마세요", "전극이 떨어지면 알려 주세요"], a: "right away", o: ["next week", "in a month", "eventually"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "DKA 저칼륨 설명 4문장 순서"
    why: "근육 증상을 묻고, 그 증상과 연결된 낮은 칼륨이 심장 리듬에도 영향을 준다고 하고, 그래서 리듬을 모니터로 본다고 알린 뒤, 그 리듬 변화를 보며 인슐린을 보류한다고 해요. 'that'·'because of that'·'that rhythm'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Tell me about any muscle weakness or cramping.", icon: stetho, ko: "근육이 약해지거나 쥐가 나는지 말씀해 주세요", note: "증상"}
    - {en: "Low potassium can cause that, and it can also upset your heart rhythm.", icon: lab, ko: "칼륨이 낮으면 그럴 수 있고 심장 리듬도 흐트러질 수 있어요", note: "원인"}
    - {en: "We're watching your heart rhythm closely on the monitor because of that.", icon: monitor, ko: "그래서 모니터로 심장 리듬을 자세히 보고 있어요", note: "감시"}
    - {en: "We'll hold extra insulin until your potassium improves, and any change in that rhythm will tell us right away.", icon: pill, ko: "칼륨이 좋아질 때까지 인슐린을 보류하고 그 리듬이 변하면 바로 알 수 있어요", note: "보류"}
  ctx: {word: "potassium", ko: "칼륨", sc: {1: {en: "Potassium 3.1; insulin held per protocol, KCl infusing, continuous cardiac monitoring."}, 2: {en: "Your potassium is 3.1, so we're holding the drip pending repletion."}}, why: "인슐린은 칼륨을 세포 안으로 밀어 넣어 혈중 칼륨을 더 떨어뜨려요. 그래서 DKA에서 칼륨이 3.3 mEq/L 미만이면 인슐린을 미루고 칼륨부터 채워요(ADA). 같은 potassium이라도 환자에게는 3.1 같은 수치와 repletion 대신 쉬운 말로 순서를 알려요."}
- title: DKA 뇌부종(소아)
  s:
  - {t: "경과 문진", i: calendar, w: "When…start로 두 증상이 시작된 시점을 한 번에 물어요. DKA 치료 중에 새로 생긴 두통과 처짐은 뇌부종의 경고일 수 있어서 시작 시점을 정확히 잡아요.", d: "and the fever", k: ["두통이 어디가 가장 아픈가요?", "구토는 없었나요?"], a: "drowsiness", o: ["itching", "cough", "rash"]}
  - {t: "변화 비교", i: calendar, w: "more…than으로 한 시간 전과 비교하게 해서 보호자가 느낀 변화를 짚어요. 한 번의 상태보다 점점 더 처지는 방향이 뇌부종의 단서라 비교가 중요해요.", d: "less sleepy", k: ["깨우면 일어나나요?", "눈은 뜨고 있나요?"], a: "sleepy", o: ["hungry", "cheerful", "talkative"]}
  - {t: "신경 확인", i: stetho, w: "neurological status는 의식·동공·운동을 합쳐 부르는 말이고 closely로 자주 본다고 알려요. 소아 DKA에서는 의식 수준의 변화가 뇌부종의 가장 빠른 신호라 반복해서 살펴요.", d: "briefly", k: ["수액 속도를 조절하고 있어요", "의사 선생님이 곧 오실 거예요"], a: "neurological", o: ["respiratory", "cardiac", "renal"]}
  - {t: "동공 확인", i: magnify, w: "pupils and alertness 두 가지를 짚어 무엇을 보는지 구체적으로 알려요. 동공이 한쪽으로 커지거나 반응이 느려지면 뇌압이 오른다는 신호일 수 있어요.", d: "and appetite", k: ["혈압도 자주 재고 있어요", "산소 수치도 보고 있어요"], a: "alertness", o: ["breathing", "color", "posture"]}
  - {t: "긴급 설명", i: siren, w: "immediately로 지체 없이 움직인다고 알리고 because로 이유를 바로 붙여 보호자가 납득하게 해요. can be serious라고 말해 위협적이지 않게 가능성으로 전해요.", d: "calmly", k: ["의사가 곧 설명해 드릴 거예요", "잠시 밖에서 기다려 주세요"], a: "immediately", o: ["calmly", "slowly", "quietly"]}
  - {t: "대응 안내", i: shield, w: "The team으로 혼자가 아니라 팀이 움직인다고 알려 보호자를 안심시켜요. to keep him safe로 지금의 대응이 아이를 지키기 위한 것임을 밝혀요.", d: "to keep him calm", k: ["아이 곁에 계셔도 돼요", "가족은 대기실에서 기다리셔도 돼요"], a: "right away", o: ["tomorrow", "eventually", "next week"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "소아 DKA 뇌부종 의심 4문장 순서"
    why: "두통과 졸림이 언제 시작됐는지 묻고, 시작했을 때보다 더 졸린지 묻고, 그 변화 때문에 신경 상태를 본다고 알리고, 팀이 바로 움직인다고 닫아요. 'it'·'That change'·'from it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did the headache and drowsiness start?", icon: calendar, ko: "두통과 졸림이 언제부터 시작됐어요?", note: "시점"}
    - {en: "Is he more sleepy now than when it started?", icon: calendar, ko: "시작했을 때보다 지금 더 졸려 하나요?", note: "변화"}
    - {en: "That change is why we're checking his neurological status closely right now.", icon: stetho, ko: "그 변화 때문에 지금 신경 상태를 자세히 보고 있어요", note: "확인"}
    - {en: "The team is responding right away to keep him safe from it.", icon: shield, ko: "팀이 그것으로부터 아이를 지키려고 바로 대응하고 있어요", note: "대응"}
  ctx: {word: "cerebral edema", ko: "뇌부종", sc: {1: {en: "New HA and decreased LOC during DKA treatment; concern for cerebral edema, MD notified at bedside."}}}
- title: HHS 쇼크 동반
  s:
  - {t: "반응 문진", i: speech, w: "How responsive로 반응의 정도를 척도처럼 묻고 over the last hour로 최근 한 시간으로 좁혀요. 의식이 나빠지는 쪽인지 좋아지는 쪽인지 방향을 알아야 해요.", d: "since Monday", k: ["오늘 아침에는 어땠어요?", "어젯밤에 약은 드셨나요?"], a: "responsive", o: ["comfortable", "active", "talkative"]}
  - {t: "의식 확인", i: speech, w: "눈을 뜨는지와 목소리에 반응하는지를 한 문장에 함께 물어 의식 수준을 가늠해요. 눈 뜨기와 말 반응은 GCS(의식 점수)를 이루는 항목이에요.", d: "or smiling", k: ["통증에는 반응하나요?", "마지막으로 말을 한 게 언제예요?"], a: "eyes", o: ["arms", "hands", "lips"]}
  - {t: "처치 설명", i: pill, w: "so로 원인(혈압이 낮다)과 조치(수액)를 이어 가족이 이유를 따라가게 해요. 혈압이 낮은 HHS는 혈액량이 크게 줄어든 상태라 수액을 빠르게 넣어 혈압을 먼저 회복시켜요.", d: "oxygen slowly", k: ["혈압은 계속 재고 있어요", "소변량을 같이 재고 있어요"], a: "low", o: ["high", "steady", "normal"]}
  - {t: "목적 설명", i: pill, w: "to bring…back up으로 목적을 부정사로 밝히고 back up으로 '다시 올린다'는 방향을 말해요. 수액으로 혈액량이 늘면 혈압이 오르고 장기로 가는 혈류가 회복돼요.", d: "temperature back down", k: ["수액 양을 조절하고 있어요", "혈압을 5분마다 재고 있어요"], a: "fast", o: ["slowly", "gently", "carefully"]}
  - {t: "감시 안내", i: monitor, w: "continuously로 중간에 쉬지 않고 계속 본다고 알려요. 많은 수액은 심장에 부담을 줄 수 있고 혈당이 빠르게 변해서 둘 다 지속적으로 살펴요.", d: "occasionally", k: ["수액 양도 기록하고 있어요", "소변량도 재고 있어요"], a: "continuously", o: ["occasionally", "rarely", "briefly"]}
  - {t: "위치 안내", i: hospital, w: "keep monitoring…closely로 계속 지켜본다고 하고 in the trauma bay로 있는 장소를 알려 가족이 어디서 무슨 일이 일어나는지 알게 해요. 위중한 환자는 처치 공간과 장비가 갖춰진 곳에서 봐요.", d: "in the lobby", k: ["가족분은 대기실에서 기다리셔도 돼요", "곧 의사 선생님이 오실 거예요"], a: "trauma", o: ["triage", "imaging", "minor"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "HHS 쇼크 가족 응대 4문장 순서"
    why: "최근 한 시간의 반응을 묻고, 같은 시간 동안 눈과 목소리 반응을 묻고, 그 답을 근거로 혈압이 낮아 수액을 준다고 하고, 그래서 계속 지켜본다고 닫아요. 'during that time'·'those answers'·'That's also why'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How responsive has she been over the last hour?", icon: speech, ko: "지난 한 시간 동안 반응이 어땠어요?", note: "반응"}
    - {en: "Is she opening her eyes or responding to your voice during that time?", icon: speech, ko: "그동안 눈을 뜨거나 목소리에 반응하시나요?", note: "의식"}
    - {en: "Given those answers, her pressure is low, so we're giving fluids quickly.", icon: pill, ko: "그 답을 보면 혈압이 낮아서 수액을 빠르게 드리고 있어요", note: "처치"}
    - {en: "That's also why we'll keep monitoring her closely in the trauma bay.", icon: monitor, ko: "그래서 외상 구역에서 계속 자세히 지켜볼게요", note: "감시"}
  sw: {ko: "혈압이 낮아서 수액을 빠르게 드리고 있어요"}
