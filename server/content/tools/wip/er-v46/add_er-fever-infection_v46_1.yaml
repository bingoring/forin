- title: 발열 시작·양상 문진
  s:
  - {t: "발열 경과", i: calendar, w: "두 질문을 and로 한 문장에 묶어 '언제부터'와 '얼마나'를 한 번에 물어요. 시작 시점과 최고 체온은 감염이 얼마나 진행됐는지 가늠하는 첫 단서예요.", d: "how long ago", k: ["열이 며칠째 이어졌어요?", "지금 체온부터 재볼게요"], a: "high", o: ["low", "far", "often"]}
  - {t: "동반 증상", i: stetho, w: "증상 이름을 나열해 환자가 해당하는 것만 고르게 해요. 열과 함께 오는 기침·인후통·배뇨통은 감염이 어느 장기에 있는지 가리키는 단서예요.", d: "a headache", k: ["최근에 여행을 다녀오셨어요?", "열이 며칠째 이어졌어요?"], a: "burning urine", o: ["blood in stool", "ear drainage", "chest tightness"]}
  - {t: "악화·완화", i: bulb, w: "better or worse를 한 문장에 놓아 나아진 것과 나빠진 것을 동시에 끌어내요. 무엇에 달라졌는지가 원인을 좁히는 단서가 돼요.", d: "last night", k: ["어떤 약을 드셨는지 알려주세요", "열이 처음 난 게 언제예요?"], a: "worse", o: ["milder", "lower", "slower"]}
  - {t: "자가 체온", i: monitor, w: "at home을 붙여 병원 밖에서 잰 값을 묻고 before you came in으로 내원 전 시점을 못 박아요. 집에서 잰 최고 체온은 응급실에서 잰 값과 다를 수 있어 따로 확인해요.", d: "at work", k: ["지금 열이 몇 도인지 재볼게요", "집에서 해열제를 드셨어요?"], a: "temperature", o: ["pressure", "weight", "pulse"]}
  - {t: "복약 확인", i: pill, w: "bring the fever down은 열을 끌어내리다라서 약을 먹은 목적까지 함께 묻는 틀이에요. 해열제를 먹었다면 지금 잰 체온이 실제보다 낮게 나올 수 있어 꼭 확인해요.", d: "this morning", k: ["열이 어디서부터 시작됐는지 알려주세요", "체온을 다시 재볼게요"], a: "medicine", o: ["vaccine", "exercise", "antacid"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "발열 경과 문진 4문장 순서"
    why: "시작 시점을 묻고, 그때부터 얼마나 올랐는지 묻고, 그 수준에서 약을 먹었는지 묻고, 약을 먹은 뒤 체온 변화를 물어요. 'since then'·'that level'·'it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did the fever start?", icon: calendar, ko: "열이 언제 시작됐어요?", note: "시작"}
    - {en: "How high has it gotten since then?", icon: chartup, ko: "그때부터 얼마나 올랐어요?", note: "최고"}
    - {en: "Did you take anything to bring it down from that level?", icon: pill, ko: "그 정도 열에서 내리려고 뭘 드셨어요?", note: "복약"}
    - {en: "Did your temperature change after you took it?", icon: monitor, ko: "드신 뒤에 체온이 달라졌어요?", note: "변화"}
  sw: {ko: "소변을 볼 때 화끈거림이 있나요?"}
- title: 활력·감염원 초기 사정
  s:
  - {t: "활력 확인", i: monitor, w: "Let me…로 허락을 구하듯 알려 환자가 놀라지 않게 해요. 체온·맥박·호흡은 가장 먼저 보는 활력징후라 문진보다 앞서 몸 상태의 위급도를 가늠해요.", d: "your weight", k: ["키와 몸무게를 먼저 잴게요", "먼저 증상부터 말씀해 주세요"], a: "temperature", o: ["height", "vision", "hearing"]}
  - {t: "감염원 문진", i: magnify, w: "a few common sources로 범위를 정해 모든 걸 의심한다는 인상 없이 짚어요. 열은 증상일 뿐이라 소변·폐·피부 같은 흔한 감염 부위를 차례로 물어 원인을 찾아요.", d: "of pain", k: ["체온을 한 번 더 재볼게요", "어떤 약을 드시는지 여쭤볼게요"], a: "infection", o: ["pain", "bleeding", "anxiety"]}
  - {t: "감염 부위", i: stetho, w: "Any pain…으로 문장을 줄여 빠르게 훑어요. 소변·기침·상처는 요로·폐·피부 감염의 대표 부위라 한 번에 짚고, pee는 일상어라 환자가 편히 답해요.", d: "when you eat", k: ["소변 색깔이 어때요?", "기침이 언제부터 시작됐어요?"], a: "pee", o: ["swallow", "sleep", "walk"]}
  - {t: "결과 안내", i: faceWorried, w: "a little fast로 수치 대신 정도를 낮춰 말해 환자가 놀라지 않게 해요. but 뒤에 괜찮은 점을 붙이면 나쁜 소식과 안심이 한 문장에서 균형을 이뤄요.", d: "very slow", k: ["산소 수치를 지금 확인할게요", "열이 조금 내렸어요"], a: "fast", o: ["slow", "weak", "strong"]}
  - {t: "검사 계획", i: lab, w: "signs of infection으로 감염이라는 확정이 아니라 징후를 찾는다고 말해 아직 진단 전임을 알려요. 소변·피부·폐는 발열의 흔한 감염 부위라 차례로 확인해요.", d: "in your ears", k: ["귀와 목을 먼저 살펴볼게요", "엑스레이로 뼈를 확인할게요"], a: "skin", o: ["blood", "heart", "brain"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "활력 확인 후 감염원 문진 4문장 순서"
    why: "활력징후를 먼저 재고, 맥박이 빠른 것을 알리고, 그 맥박이 감염과 관련될 수 있어 흔한 원인 부위를 묻겠다고 한 뒤 증상을 하나씩 물어요. 'that pulse'·'those sources'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Let me check your temperature, pulse, and breathing first.", icon: monitor, ko: "체온, 맥박, 호흡을 먼저 확인할게요", note: "활력"}
    - {en: "Your pulse is a little fast, but that's common with a fever.", icon: faceWorried, ko: "맥박이 조금 빠른데 열이 있으면 흔해요", note: "결과"}
    - {en: "Since that pulse can point to infection, I'll ask about a few common sources.", icon: magnify, ko: "그 맥박은 감염과 관련될 수 있어서 흔한 원인을 여쭤볼게요", note: "이유"}
    - {en: "Starting with those sources, any pain when you pee, cough, or a wound anywhere?", icon: stetho, ko: "그 원인부터, 소변·기침·상처에 통증이 있나요?", note: "문진"}
  ctx: {word: "pulse", ko: "맥박", sc: {0: {en: "T 38.9, pulse 112, RR 18."}, 1: {en: "She's febrile, and her pulse is 112."}, 2: {en: "You're febrile and tachycardic — your pulse is 112."}}}
- title: 격리 필요성 판단
  s:
  - {t: "마스크 안내", i: shield, w: "Because of로 이유를 앞에 두면 지시가 벌이 아니라 근거 있는 조치로 들려요. have you wear는 시키기보다 함께하는 느낌이라 환자가 거부감이 덜해요.", d: "wear gloves", k: ["열 때문에 해열제를 드릴게요", "이 방에서 잠깐 기다려 주세요"], a: "wear", o: ["remove", "borrow", "replace"]}
  - {t: "격리실 안내", i: lock, w: "may로 확정이 아닌 가능성을 말하고 to protect others로 목적을 붙여 환자가 격리를 벌로 받아들이지 않게 해요.", d: "for your comfort", k: ["검사 결과가 나오면 퇴원하실 수 있어요", "침대 난간을 올려 둘게요"], a: "separate", o: ["shared", "crowded", "waiting"]}
  - {t: "접촉력 문진", i: plane, w: "Have you been…or traveled로 접촉과 여행을 한 문장에 묶어 두 위험 요인을 함께 물어요. recently로 기간을 열어 두어 환자가 최근 몇 주 일을 떠올려요.", d: "moved house", k: ["최근에 예방접종을 받으셨어요?", "기침이 언제부터 시작됐어요?"], a: "traveled", o: ["exercised", "retired", "relocated"]}
  - {t: "기침 경과", i: calendar, w: "How long have you had는 지금까지 이어진 기간을 묻는 현재완료예요. is it getting worse로 방향을 이어 물어 기간과 악화 여부를 함께 알아요.", d: "getting better", k: ["기침할 때 가래가 나오나요?", "기침약을 드셨어요?"], a: "worse", o: ["thinner", "shorter", "quieter"]}
  - {t: "공감·설명", i: faceWorried, w: "I know…로 불편함을 먼저 인정한 뒤 but으로 이유를 잇는 순서예요. 마스크는 기침으로 나오는 비말을 줄여 주변 사람을 지키는 데 도움이 돼요.", d: "it is the rule", k: ["마스크는 코까지 덮어 주세요", "마스크는 한 번 쓰면 버려 주세요"], a: "uncomfortable", o: ["pointless", "embarrassing", "expensive"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "기침·발열 환자 마스크·격리 안내 4문장 순서"
    why: "기침 경과를 묻고, 그 기침 때문에 마스크를 쓰게 하고, 마스크와 함께 별도 병실 가능성을 알린 뒤, 그 방이 불편해도 모두를 지킨다고 닫아요. 'that cough'·'that mask'·'that room'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How long have you had this cough, and is it getting worse?", icon: calendar, ko: "이 기침이 얼마나 오래됐고 심해지고 있나요?", note: "경과"}
    - {en: "Because of that cough and the fever, I'll have you wear a mask.", icon: shield, ko: "그 기침과 열 때문에 마스크를 써 주시도록 할게요", note: "마스크"}
    - {en: "Along with that mask, we may place you in a separate room.", icon: lock, ko: "그 마스크와 함께 별도 병실로 옮길 수도 있어요", note: "격리"}
    - {en: "I know that room feels uncomfortable, but it helps keep everyone safe.", icon: faceWorried, ko: "그 방이 불편하신 거 알지만 모두를 지켜줘요", note: "공감"}
  sw: {ko: "기침과 열이 있으니 마스크를 써 주시도록 할게요."}
- title: 해열제 투여 설명
  s:
  - {t: "약 효과", i: pill, w: "will help로 반드시 낫는다는 약속 대신 도움이 된다고 말해요. 해열제는 열을 낮추고 오한과 몸살을 덜어 환자를 편하게 해 줘요.", d: "treat your cough", k: ["약은 물과 함께 삼키세요", "수액을 먼저 놓을게요"], a: "comfortable", o: ["sleepy", "thirsty", "hungry"]}
  - {t: "재측정 안내", i: calendar, w: "recheck의 re-가 다시를, in about an hour가 대략의 시점을 알려요. 약을 쓴 뒤 효과를 보려면 시간이 필요해서 시점을 미리 말해 두면 환자가 기다릴 수 있어요.", d: "in the morning", k: ["한 시간쯤 후에 검사 결과를 알려 드릴게요", "체온은 겨드랑이에서 잴게요"], a: "hour", o: ["evening", "afternoon", "overnight"]}
  - {t: "수분 섭취", i: coffee, w: "Keep …ing는 이미 하고 있는 일을 계속하라는 부드러운 지시예요. 열이 나면 땀과 호흡으로 수분이 빠져나가 탈수되기 쉬워서 수분 섭취가 도움이 돼요.", d: "eating less", k: ["식사는 하지 않아도 괜찮아요", "얼음물은 천천히 드세요"], a: "helps", o: ["hurts", "worsens", "delays"]}
  - {t: "효과 시간", i: calendar, w: "within…or so로 정확한 시각 대신 대략의 범위를 말해 기대를 현실적으로 맞춰요. 먹는 약은 효과가 나타나기까지 시간이 걸려요.", d: "after an hour", k: ["이 약은 알약이라 삼키시면 돼요", "체온이 내려가면 알려 주세요"], a: "thirty", o: ["two", "five", "ten"]}
  - {t: "재발열 보고", i: bell, w: "If…로 아직 일어나지 않은 일을 조건으로 걸어 환자가 어떤 때 알려야 하는지 분명히 해요. 열이 다시 오르면 약 효과나 원인을 다시 판단해야 해요.", d: "if you feel hungry", k: ["열이 다 내렸으니 퇴원하셔도 돼요", "그 전에 화장실에 다녀오셔도 돼요"], a: "back up", o: ["back down", "back in", "back out"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "해열제 투여 설명 4문장 순서"
    why: "약이 무엇을 하는지 말하고, 그 약이 언제쯤 듣기 시작하는지 알리고, 그에 맞춰 체온을 재측정할 시점을 정하고, 그 시점 전에 다시 오르면 알려 달라고 닫아요. 'It'·'before then'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This will help lower your fever and make you more comfortable.", icon: pill, ko: "열을 낮추고 더 편안하게 해드릴 거예요", note: "효과"}
    - {en: "It should start working within thirty minutes or so.", icon: calendar, ko: "삼십 분쯤 안에 듣기 시작할 거예요", note: "시간"}
    - {en: "We'll recheck your temperature in about an hour.", icon: monitor, ko: "한 시간쯤 후에 체온을 다시 잴게요", note: "재측정"}
    - {en: "If your fever goes back up before then, please let us know.", icon: bell, ko: "그 전에 다시 오르면 알려주세요", note: "보고"}
  ctx: {word: "recheck", ko: "다시 재다", sc: {2: {en: "Antipyretic administered; recheck T in sixty minutes."}}}
- title: 여행력·접촉력 문진
  s:
  - {t: "여행 문진", i: plane, w: "Where와 when을 and로 이어 장소와 귀국 시점을 한 번에 물어요. 어느 지역에 다녀왔는지와 돌아온 뒤 지난 시간이 의심 감염을 좁히는 기본 정보예요.", d: "how long ago", k: ["지금 열이 몇 도예요?", "여행 중에 아프셨어요?"], a: "travel", o: ["shop", "stay", "study"]}
  - {t: "노출 문진", i: magnify, w: "벌레 물림과 특이한 음식은 여행 중 감염이 들어오는 흔한 경로라 한 문장에서 둘 다 물어요. unusual은 평소 안 먹던 것을 뜻해 환자가 떠올리기 쉬워요.", d: "any vaccines", k: ["여행 중에 예방접종을 받으셨어요?", "벌레 물린 곳이 가려우세요?"], a: "unusual", o: ["spicy", "expensive", "sweet"]}
  - {t: "동행자 문진", i: handshake2, w: "you traveled with로 동행자를 짚고 also sick로 환자와 같은 증상을 물어요. 같이 다닌 사람도 아팠다면 같은 곳에서 감염됐을 가능성이 커져요.", d: "you work with", k: ["여행은 혼자 가셨어요?", "같이 가신 분 연락처를 알려 주세요"], a: "sick", o: ["tired", "injured", "vaccinated"]}
  - {t: "방문지 문진", i: compass, w: "Which로 선택지를 열어 두고 countries or cities로 나라와 도시 어느 단위로 답해도 되게 해요. 방문 지역은 어떤 지역성 감염을 의심할지 정해요.", d: "Which airports", k: ["이번에 처음 해외에 나가셨어요?", "여행 기간은 얼마나 되셨어요?"], a: "visit", o: ["avoid", "clean", "drive"]}
  - {t: "검사 안내", i: lab, w: "sometimes로 흔한 일이 아니라 가끔 있는 일이라고 말해 환자가 겁먹지 않게 해요. 해외 유입 감염은 여행지에 따라 종류가 달라서 문진 결과로 검사를 골라요.", d: "that locals spread", k: ["지금 바로 예방접종을 할게요", "여행 일정을 알려 주세요"], a: "abroad", o: ["upstairs", "nearby", "indoors"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "여행력 문진 4문장 순서"
    why: "어디를 다녀왔는지와 귀국 시점을 묻고, 그 여행의 방문지를 구체적으로 묻고, 거기서 함께한 사람의 증상을 묻고, 모든 답을 근거로 검사를 알려요. 'that trip'·'those places'·'those answers'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Where did you travel, and when did you get back?", icon: plane, ko: "어디를 여행하셨고 언제 돌아오셨어요?", note: "여행"}
    - {en: "Which countries or cities did you visit on that trip?", icon: compass, ko: "그 여행에서 어느 나라나 도시를 방문하셨어요?", note: "방문지"}
    - {en: "Was anyone who went to those places with you also sick?", icon: handshake2, ko: "그곳들에 함께 간 분 중에 아픈 사람이 있었나요?", note: "동행"}
    - {en: "Based on those answers, we'll check for infections that travelers sometimes bring back.", icon: lab, ko: "그 답을 근거로 여행자가 가끔 가져오는 감염을 확인할게요", note: "검사"}
  ctx: {word: "travel", ko: "여행", sc: {0: {en: "He traveled to Ghana and got back ten days ago."}}}
- title: 폐렴 의심 발열
  s:
  - {t: "의심 설명", i: stetho, w: "make us think of로 폐렴이다가 아니라 떠오른다고 말해 아직 확정 전임을 알려요. 열과 기침, 숨가쁨이 함께 있으면 폐 감염을 먼저 의심해요.", d: "point to asthma", k: ["열이 며칠째인지 말씀해 주세요", "가슴이 아프신 곳을 짚어 주세요"], a: "shortness", o: ["tightness", "dryness", "weakness"]}
  - {t: "검사 계획", i: lab, w: "get과 check 두 동사로 영상과 산소 수치 두 검사를 한 문장에 알려요. 흉부 엑스레이는 폐의 침윤을 보고, 산소 수치는 숨쉬기가 얼마나 힘든지 알려 줘요.", d: "a urine sample", k: ["심전도를 바로 찍을게요", "소변 검사를 먼저 할게요"], a: "oxygen", o: ["sugar", "iron", "calcium"]}
  - {t: "치료 계획", i: pill, w: "If로 아직 확정이 아닌 일을 조건으로 걸고 promptly로 확정되면 지체 없이 시작한다고 약속해요. 세균성 폐렴은 항생제 치료가 필요해요.", d: "if it's allergies", k: ["폐렴이 아니면 퇴원하실 수 있어요", "항생제는 식사 후에 드세요"], a: "pneumonia", o: ["a cold", "allergies", "a virus"]}
  - {t: "기간 문진", i: calendar, w: "How many days로 날짜를 세어 답하게 해 기간이 구체적으로 나와요. 기간은 갑자기 시작됐는지 서서히 나빠졌는지 가르는 단서가 돼요.", d: "how many times", k: ["기침할 때 가슴이 아프세요?", "가래 색깔은 어때요?"], a: "deep", o: ["dry", "wet", "barking"]}
  - {t: "혈액 검사", i: lab, w: "also로 앞서 한 검사에 더해 혈액을 본다고 알려요. 혈액검사 수치로 감염의 정도와 몸 상태를 가늠하고 치료를 정해요.", d: "your urine", k: ["소변 검사는 이미 마쳤어요", "엑스레이 결과를 기다리고 있어요"], a: "serious", o: ["rare", "painful", "strange"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "폐렴 의심 설명 4문장 순서"
    why: "기침과 열이 며칠 됐는지 묻고, 그 증상으로 폐렴을 의심한다고 알리고, 확인하려고 엑스레이와 산소 수치를 보고, 엑스레이로 폐렴이 나오면 항생제를 시작한다고 말해요. 'those'·'To check'·'the X-ray'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How many days have you had this deep cough and fever?", icon: calendar, ko: "이 깊은 기침과 열이 며칠이나 됐나요?", note: "기간"}
    - {en: "From what you've told me, your cough and shortness of breath make us think of pneumonia.", icon: stetho, ko: "말씀하신 걸 보면 기침과 숨가쁨은 폐렴이 떠올라요", note: "의심"}
    - {en: "To check, we'll get a chest X-ray and check your oxygen level.", icon: lab, ko: "확인하려고 흉부 엑스레이와 산소 수치를 볼게요", note: "검사"}
    - {en: "If the X-ray shows pneumonia, we'll start antibiotics promptly.", icon: pill, ko: "엑스레이에서 폐렴이 보이면 바로 항생제를 시작할게요", note: "치료"}
  sw: {ko: "흉부 엑스레이를 찍고 산소 수치를 확인할게요."}
- title: 요로감염 발열 노인
  s:
  - {t: "비전형 증상", i: bulb, w: "In older adults로 대상을 한정하고 can으로 그럴 수 있다는 가능성만 말해요. 노인은 열이나 배뇨통 없이 혼란 같은 변화로 요로감염이 드러나기도 해요.", d: "in young children", k: ["어르신은 낙상 위험이 높아요", "소변 검사는 아주 간단해요"], a: "confusion", o: ["itching", "stiffness", "hair loss"]}
  - {t: "검사 안내", i: lab, w: "to look for로 검사의 목적을 알려 보호자가 왜 소변과 피를 보는지 이해하게 해요. 소변은 요로의 염증을, 혈액은 감염이 몸 전체에 영향을 주는지를 보는 데 써요.", d: "and sugar", k: ["엑스레이를 먼저 찍을게요", "어머님 약 목록을 확인할게요"], a: "urine", o: ["stool", "sputum", "skin"]}
  - {t: "배뇨 변화", i: magnify, w: "any change로 빈도·양·색 같은 변화를 넓게 열어 두고 new incontinence로 새로 생긴 실금만 짚어요. 새로 생긴 변화는 요로감염을 의심하는 단서가 돼요.", d: "in appetite", k: ["어머님이 물은 충분히 드셨나요?", "낙상하신 적 있나요?"], a: "incontinence", o: ["bleeding", "vomiting", "cramping"]}
  - {t: "평소와 비교", i: calendar, w: "than usual로 평소 기준과 비교하게 하고 is this new로 처음인지 되물어요. 가족만 아는 평소 모습이 급성 변화인지 가르는 가장 좋은 기준이에요.", d: "than yesterday", k: ["어머님이 어디가 아프다고 하셨나요?", "식사는 잘 하시나요?"], a: "new", o: ["rare", "mild", "brief"]}
  - {t: "가족 안심", i: faceWorried, w: "her age group으로 어머님 개인이 아니라 연령대의 일반 경향을 말해 가족의 걱정을 덜어요. often으로 흔하다고 알리되 단정하지 않아요.", d: "is rarely", k: ["어머님 연세에는 낙상에 조심하셔야 해요", "어머님은 병실에서 쉬고 계세요"], a: "first", o: ["last", "only", "worst"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "노인 혼란·요로감염 가족 설명 4문장 순서"
    why: "평소와 달라졌는지 묻고, 그와 함께 배뇨 변화를 묻고, 이 연령대에서 혼란이 감염의 첫 신호일 수 있다고 설명한 뒤, 그래서 검사를 한다고 이어요. 'that'·'Along with that'·'That's why'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Has she seemed more confused than usual, or is this new for her?", icon: calendar, ko: "평소보다 더 혼란스러워 보이셨나요, 처음 있는 일인가요?", note: "혼란"}
    - {en: "Along with that, has she had any change in urination or new incontinence?", icon: magnify, ko: "그와 함께 배뇨 변화나 새 요실금이 있었나요?", note: "배뇨"}
    - {en: "In her age group, confusion or changes like those are often the first sign of a urine infection.", icon: bulb, ko: "이 연령대에서는 그런 혼란이 흔히 요로감염의 첫 징후예요", note: "설명"}
    - {en: "That's why we'll check her urine and blood to look for infection.", icon: lab, ko: "그래서 감염을 찾으려고 소변과 혈액을 확인할게요", note: "검사"}
  ctx: {word: "confused", ko: "혼란스러운", sc: {0: {en: "New confusion, acute onset; baseline A&Ox3 per daughter."}, 2: {en: "Your mother is confused — she has acute altered mental status."}}, why: "평소보다 혼란스러워졌다는 같은 말이에요. 차트에는 confusion·A&Ox3(사람·장소·시간 인식)로 적고, 보호자에게는 AMS 같은 용어 대신 쉬운 말로 말하며 감염이 원인일 수 있다는 것까지 알려 주면 덜 놀라요."}
