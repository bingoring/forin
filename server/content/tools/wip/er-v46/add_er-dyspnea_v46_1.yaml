- title: 호흡곤란 초기 문진
  s:
  - {t: "발병 시점", i: calendar, w: "when 절로 시작 시점을 물으면 환자가 시간 순서로 떠올려 답하기 쉬워요. 호흡곤란은 언제부터 시작됐는지가 원인을 가르는 첫 단서예요.", d: "of air", k: ["숨이 찰 때 가슴이 아프세요?", "지금도 숨쉬기가 힘드세요?"], a: "start", o: ["stop", "improve", "return"]}
  - {t: "악화 요인", i: stetho, w: "A or B 형태로 두 상황을 직접 주면 환자가 고르기만 하면 돼요. 누우면 심해지는 숨참(기좌호흡)과 움직이면 심해지는 숨참을 가르는 질문이에요.", d: "when you cough", k: ["밤에 자다가 숨이 차서 깬 적 있나요?", "걸으면 몇 걸음 만에 숨이 차나요?"], a: "lie", o: ["sit", "kneel", "bend"]}
  - {t: "동반 증상", i: chartup, w: "any를 앞에 두면 하나라도 있는지 넓게 물어서 환자가 빠뜨린 증상을 떠올려요. 기침·열·가슴 통증은 호흡곤란의 원인을 가를 때 같이 확인해요.", d: "when you walk", k: ["기침이 나오면 가래도 같이 나오나요?", "가슴이 아프면 숨 쉴 때 더 아픈가요?"], a: "fever", o: ["dizziness", "swelling", "nausea"]}
  - {t: "현재 상태", i: faceWorried, w: "trouble breathing은 환자가 알아듣기 쉬운 부드러운 표현이에요. right now를 붙여 과거 증상이 아니라 지금 어떤지를 먼저 확인해요.", d: "last night", k: ["가슴이 답답하거나 조이는 느낌이 있나요?", "숨이 차기 시작한 지 얼마나 됐나요?"], a: "breathing", o: ["swallowing", "speaking", "walking"]}
  - {t: "자세 문진", i: me, w: "sitting up처럼 자세를 한 단어로 묻는 질문은 환자가 몸으로 바로 느껴 보고 답할 수 있어요. 숨찬 환자는 상체를 세우면 편해하는 경우가 많아요.", d: "lying down", k: ["침대 머리를 올려 드릴까요?", "베개를 하나 더 드릴까요?"], a: "breathe", o: ["cough", "swallow", "sleep"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "호흡곤란 문진 4문장 순서"
    why: "시작 시점을 먼저 묻고, 시작된 뒤 상황별 악화를 묻고, 그때 따라오는 증상을 묻고, 지금 상태로 마무리합니다. 'Since it started'·'like that'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did the shortness of breath start?", icon: calendar, ko: "호흡곤란이 언제 시작됐나요?", note: "시작"}
    - {en: "Since it started, is it worse when you lie down?", icon: me, ko: "시작된 뒤로 누우면 더 힘든가요?", note: "악화"}
    - {en: "When it gets worse like that, do you also have a cough or chest pain?", icon: stetho, ko: "그렇게 심해질 때 기침이나 가슴 통증도 있나요?", note: "동반"}
    - {en: "Are you having trouble breathing with all of that right now?", icon: faceWorried, ko: "그 모든 것과 함께 지금 숨쉬기 힘드신가요?", note: "현재"}
  sw: {ko: "호흡곤란이 언제 시작됐나요?"}
- title: 산소포화·호흡수 사정 설명
  s:
  - {t: "기구 설명", i: monitor, w: "환자가 알 만한 모양의 말(clip)로 기구를 부르고 무엇을 재는지를 바로 붙이면 낯선 기계가 덜 무서워요. 의료진끼리는 pulse oximeter라고 하지만 환자에게는 쉬운 말이 좋아요.", d: "in your arm", k: ["이 커프가 혈압을 재 줘요", "이 기구가 체온을 재 줘요"], a: "oxygen", o: ["sugar", "iron", "pressure"]}
  - {t: "호흡수 확인", i: stetho, w: "how many … per minute는 호흡수를 환자에게 쉬운 말로 풀어 설명하는 틀이에요. 환자가 숨쉬기를 의식하면 호흡이 달라질 수 있어서 설명을 짧게 하고 조용히 세요.", d: "your heartbeat", k: ["1분 동안 맥박이 몇 번 뛰는지 재고 있어요", "숨소리를 들어 보고 있어요"], a: "minute", o: ["second", "hour", "visit"]}
  - {t: "통증 안심", i: shield, w: "won't hurt처럼 가장 궁금해하는 걱정에 먼저 답해 주면 환자가 힘을 빼요. 산소포화도 측정은 손가락에 끼우는 비침습 검사예요.", d: "for long", k: ["손가락에 끼우기만 하면 돼요", "1분 정도 걸려요"], a: "hurt", o: ["bleed", "shock", "cut"]}
  - {t: "조치 안내", i: pill, w: "If it's low, …처럼 조건과 조치를 한 문장에 묶어 두면 수치가 낮게 나와도 환자가 놀라지 않아요. a little은 산소를 약간 쓴다는 점을 부드럽게 전해요.", d: "a lot of", k: ["수치가 낮으면 다시 한 번 재 볼게요", "수치가 낮으면 의사 선생님을 부를게요"], a: "low", o: ["high", "normal", "steady"]}
  - {t: "결과 안내", i: check, w: "결과를 바로 알려 주면 환자가 안심해요. looks okay는 확정이 아니라 지금 보이는 상태를 말하는 부드러운 표현이에요.", d: "last time", k: ["산소 수치가 조금 낮아졌어요", "산소 수치를 다시 재 볼게요"], a: "okay", o: ["low", "high", "weak"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "산소포화도 측정 4문장 순서"
    why: "집게를 끼운다고 알리고, 그 집게가 아프지 않다고 안심시키고, 재는 동안 호흡수를 세고, 두 수치가 나온 뒤 필요한 조치를 알립니다. 'It'·'that minute'·'both numbers'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to put this clip on your finger to check your oxygen.", icon: monitor, ko: "산소를 확인하려고 이 집게를 손가락에 끼울게요", note: "부착"}
    - {en: "It's painless, and it only needs to stay on for a minute.", icon: shield, ko: "아프지 않고, 1분만 끼우고 있으면 돼요", note: "안심"}
    - {en: "While it reads, I'll also count your breaths for that minute.", icon: stetho, ko: "재는 동안 그 1분 동안 숨 쉬는 횟수도 셀게요", note: "호흡수"}
    - {en: "Once we have both numbers, if the oxygen is low, we'll give you some.", icon: pill, ko: "두 수치가 나오면 산소가 낮을 때 산소를 드릴게요", note: "조치"}
- title: 비강 캐뉼라 산소 적용
  s:
  - {t: "착용 안내", i: me, w: "prongs·inside your nose처럼 어디에 무엇이 닿는지 미리 말해 주면 코에 뭔가 들어간다는 불안이 줄어요. 비강 캐뉼라는 짧은 갈래 두 개가 콧구멍 입구에 놓여요.", d: "behind your ears", k: ["줄은 귀 뒤로 걸어 드릴게요", "마스크를 얼굴에 씌워 드릴게요"], a: "inside", o: ["around", "above", "beside"]}
  - {t: "시작 안내", i: monitor, w: "for now가 지금 설정이 정해진 값이 아니라 상태를 보며 바꿀 수 있다는 여지를 줘요. 산소는 처방된 유량으로 시작해요.", d: "for the night", k: ["유량은 의사 선생님이 정하신 대로 맞출게요", "산소 마스크로 바꿔 드릴게요"], a: "low", o: ["high", "full", "maximum"]}
  - {t: "상태 확인", i: stetho, w: "through your nose처럼 숨 쉬는 경로를 콕 집어 물으면 환자가 코가 막혔는지 바로 답할 수 있어요. 코가 막히면 캐뉼라의 산소가 잘 안 들어갈 수 있어요.", d: "with your lips closed", k: ["코가 막혀서 답답하세요?", "입으로 숨 쉬는 게 더 편하세요?"], a: "nose", o: ["mouth", "mask", "tube"]}
  - {t: "불편 확인", i: faceWorried, w: "Let me know if …로 불편을 말해도 된다고 열어 주면 환자가 참지 않아요. 산소는 건조해서 코 안이 마르거나 간질거릴 수 있어요.", d: "too loose", k: ["코가 막히면 말해 주세요", "귀 뒤가 아프면 바로 말해 주세요"], a: "dry", o: ["wet", "hot", "noisy"]}
  - {t: "조절 약속", i: bandage, w: "I'll adjust …로 환자가 해야 할 일이 아니라 간호사가 할 일로 말해 주면 부담이 줄어요. 줄이 귀 뒤나 볼에 오래 닿으면 압박 자국이 생길 수 있어요.", d: "if it slips", k: ["줄을 귀 뒤로 다시 걸어 드릴게요", "산소 유량을 한 번 더 확인할게요"], a: "tight", o: ["loose", "long", "heavy"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "비강 캐뉼라 4문장 순서"
    why: "착용을 알리고, 그 갈래로 숨 쉬는 것이 괜찮은지 묻고, 괜찮다면 산소를 틀고, 켜진 뒤 불편을 확인합니다. 'them'·'If you can'·'Once it's running'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to put a thin tube with two soft prongs in your nose.", icon: me, ko: "부드러운 갈래 두 개가 달린 가는 관을 코에 넣을게요", note: "착용"}
    - {en: "Can you breathe through them okay?", icon: stetho, ko: "그걸로 숨 쉬는 게 괜찮으세요?", note: "확인"}
    - {en: "If you can, I'll turn the oxygen on at a low flow.", icon: monitor, ko: "괜찮으면 낮은 유량으로 산소를 틀게요", note: "시작"}
    - {en: "Once it's running, tell me if it feels dry or too tight.", icon: faceWorried, ko: "켜지면 건조하거나 너무 조이는지 말해 주세요", note: "불편"}
  ctx: {word: "dry", ko: "건조한"}
- title: 과호흡 증후군 진정 코칭
  s:
  - {t: "안심 시작", i: shield, w: "공황 상태의 환자에게는 안전하다는 말을 먼저 건네는 편이 효과적이에요. let's는 지시가 아니라 함께 한다는 신호예요.", d: "by yourself", k: ["지금 손을 좀 잡아 드려도 될까요?", "어지러우면 바로 말씀하세요"], a: "safe", o: ["alone", "late", "dizzy"]}
  - {t: "호흡 코칭", i: speech, w: "숫자를 같이 세면 환자가 따라 하기 쉬워요. 들이쉬는 것보다 천천히 내쉬는 쪽에 초점을 두는 것이 과호흡을 가라앉히는 데 도움이 돼요.", d: "for ten", k: ["코로 들이쉬고 입술을 오므려 내쉬세요", "제 손을 보면서 숨을 맞춰 보세요"], a: "slowly", o: ["quickly", "loudly", "hard"]}
  - {t: "함께 호흡", i: me, w: "together와 nice and slow가 혼자가 아니라는 느낌과 속도를 같이 줘요. 간호사가 같은 속도로 숨 쉬어 보이면 환자가 따라가기 쉬워요.", d: "one more time", k: ["숨이 안정되면 말씀해 주세요", "어깨에 힘을 빼 보세요"], a: "slow", o: ["fast", "loud", "hard"]}
  - {t: "증상 설명", i: bulb, w: "증상이 호흡과 연결돼 있고 지나간다고 알려 주면 두려움이 줄어요. 과호흡이면 손발이 저릴 수 있는데, 숨이 안정되면 대개 가라앉아요.", d: "after you cough", k: ["지금 어지러운 것도 호흡 때문이에요", "저림이 심해지면 바로 알려 주세요"], a: "tingling", o: ["itching", "burning", "swelling"]}
  - {t: "격려", i: star, w: "You're doing great처럼 지금 하고 있는 것을 칭찬하면 환자가 계속 따라가요. just keep이 새로 할 일이 아니라 지금 하는 걸 이어 가라는 뜻이에요.", d: "on your own", k: ["손은 가슴 위에 올려 보세요", "어지러우면 앉아도 돼요"], a: "breathing", o: ["counting", "resting", "sitting"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "과호흡 코칭 4문장 순서"
    why: "안심을 먼저 건네고, 그다음 들이쉬기, 이어서 내쉬기, 마지막에 증상이 가라앉는다고 알립니다. 'Since you're safe'·'Now out'·'like that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm right here with you, and you're safe.", icon: shield, ko: "제가 바로 옆에 있어요, 안전해요", note: "안심"}
    - {en: "Since you're safe, let's start slow: breathe in for four with me.", icon: speech, ko: "안전하니까 천천히 시작해요, 저랑 같이 넷 세며 들이쉬세요", note: "들숨"}
    - {en: "Now out slowly for four — that's it.", icon: me, ko: "이제 넷 세며 천천히 내쉬세요, 그렇게요", note: "날숨"}
    - {en: "Keep going like that, and the tingling will ease.", icon: bulb, ko: "그렇게 계속하면 저림이 나아질 거예요", note: "안내"}
  sw: {ko: "안전해요 — 같이 천천히 숨을 늦춰봐요"}
- title: 상기도 감염성 호흡곤란 문진
  s:
  - {t: "열 문진", i: stetho, w: "How high …?는 정도를 물어서 환자가 숫자나 느낌으로 답하게 해요. 열의 높이는 감염이 얼마나 심한지 가늠하는 단서가 돼요.", d: "since morning", k: ["열이 언제부터 있었나요?", "열이 날 때 약을 드셨나요?"], a: "high", o: ["long", "low", "often"]}
  - {t: "가래 문진", i: bulb, w: "bring up은 가래를 기침으로 올려 낸다는 쉬운 구동사예요. anything으로 넓게 물으면 환자가 색이나 양을 따로 몰라도 있는지 없는지는 답할 수 있어요.", d: "any blood", k: ["가래 색이 어떤가요?", "기침이 밤에 더 심한가요?"], a: "cough", o: ["fever", "pain", "chest"]}
  - {t: "열 확인", i: monitor, w: "at home을 붙이면 병원에서 잰 것이 아니라 집에서 느낀 열을 묻게 돼요. 열은 체온계로 잰 숫자가 없어도 몸으로 느낀 것을 먼저 물어요.", d: "at work", k: ["집에서 체온을 재 보셨어요?", "열이 났을 때 약을 드셨나요?"], a: "fever", o: ["chills", "rash", "pain"]}
  - {t: "목 증상", i: me, w: "hurt or feel swollen처럼 두 증상을 묶어 물으면 환자가 둘 중 하나만 있어도 답할 수 있어요. 목이 붓는 느낌은 기도가 좁아질 수 있다는 단서라 따로 확인해요.", d: "or feel dry", k: ["목소리가 변했나요?", "귀도 아프신가요?"], a: "throat", o: ["ear", "jaw", "tooth"]}
  - {t: "호흡 영향", i: faceWorried, w: "make it hard to breathe로 기침이 호흡에 미치는 영향을 한 번에 묻고, 예·아니오로 답하게 해요. 기침 때문에 숨이 막히는 정도를 가늠하는 질문이에요.", d: "at night", k: ["기침 때문에 잠을 못 주무시나요?", "기침할 때 가슴이 아픈가요?"], a: "hard", o: ["easy", "painful", "safe"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "상기도 감염 문진 4문장 순서"
    why: "열의 높이를 묻고, 그 열에 집에서 무엇을 했는지 묻고, 그 조치로 열이 내렸는지 묻고, 열이 내린 뒤에도 기침이 숨쉬기를 방해하는지 묻습니다. 'for it'·'that'·'still'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How high has your fever been?", icon: stetho, ko: "열이 얼마나 높았나요?", note: "열"}
    - {en: "Did you take anything for it at home?", icon: pill, ko: "집에서 그 열에 뭔가 드셨나요?", note: "조치"}
    - {en: "Did that bring it down at all?", icon: chartup, ko: "그걸로 열이 조금이라도 내렸나요?", note: "반응"}
    - {en: "If the fever is down, does the cough still make it hard to breathe?", icon: faceWorried, ko: "열이 내렸어도 기침 때문에 여전히 숨쉬기 힘든가요?", note: "기침"}
  ctx: {word: "bring up", ko: "뱉어 내다"}
- title: 급성 폐부종 기좌호흡
  s:
  - {t: "자세 안내", i: me, w: "Let's …로 같이 한다는 말투를 쓰고 to help you breathe로 이유를 붙여요. 폐부종이 의심되는 숨찬 환자는 눕히지 않고 상체를 세워 앉혀요.", d: "to help you sleep", k: ["팔을 베개 위에 올려 드릴게요", "산소를 먼저 드릴게요"], a: "upright", o: ["sideways", "forward", "still"]}
  - {t: "걱정 공유", i: faceWorried, w: "worries me처럼 간호사의 걱정을 솔직히 말하면 지시가 아니라 이유가 전해져요. 분홍빛 거품 가래는 폐부종에서 알려진 소견이에요.", d: "about your heart", k: ["지금 가슴이 아프신가요?", "폐렴일 수도 있어서 걱정돼요"], a: "frothy", o: ["dry", "loud", "weak"]}
  - {t: "처치 안내", i: stetho, w: "지금 하는 일을 진행형으로 알려 주면 급한 상황에서도 환자가 무슨 일인지 알 수 있어요. 폐 소리를 듣는 것과 산소 연결은 같이 시작해요.", d: "your pulse", k: ["혈압을 재고 약을 준비하고 있어요", "심전도를 붙이고 있어요"], a: "lungs", o: ["heart", "back", "belly"]}
  - {t: "자세 주의", i: shield, w: "Try not to …로 금지 대신 노력해 보라고 부드럽게 말해요. 폐부종 환자는 누우면 폐로 체액이 더 몰려 숨이 더 차요.", d: "on your side", k: ["다리를 침대 아래로 내려도 돼요", "지금은 아무것도 드시지 마세요"], a: "flat", o: ["still", "low", "long"]}
  - {t: "과거력", i: calendar, w: "before를 붙이면 지금이 아니라 이전의 경험을 묻는 질문이 돼요. 이전에도 분홍빛 거품 가래가 나왔다면 폐부종이 반복됐을 수 있어요.", d: "this week", k: ["밤에 숨이 차서 깬 적 있나요?", "기침 때문에 잠을 설치시나요?"], a: "pink", o: ["yellow", "dark", "clear"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "폐부종 대응 4문장 순서"
    why: "먼저 앉혀 호흡을 돕고, 앉은 뒤 폐 소리를 듣고, 듣는 동안 거품 가래 경험을 묻고, 그렇다면 산소를 준비하는 이유를 설명합니다. 'Now that'·'While I listen'·'If so'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Let's sit you upright to help you breathe.", icon: me, ko: "숨쉬기 편하게 앉혀 드릴게요", note: "자세"}
    - {en: "Now that you're sitting up, I'm listening to your lungs.", icon: stetho, ko: "앉으셨으니 폐 소리를 듣고 있어요", note: "청진"}
    - {en: "While I listen, have you ever coughed up anything pink or frothy?", icon: calendar, ko: "듣는 동안, 분홍빛이나 거품 섞인 기침을 한 적이 있나요?", note: "문진"}
    - {en: "If so, that fluid is why I'm getting oxygen on you.", icon: faceWorried, ko: "그렇다면 그 물이 산소를 연결하는 이유예요", note: "이유"}
  sw: {ko: "폐에 물이 찬 것 같아 걱정돼요 — 그래서 앉혀 드리는 거예요"}
