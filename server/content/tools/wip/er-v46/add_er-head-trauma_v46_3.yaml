  - {t: "변화 확인", i: magnify, w: "minutes ago와 now를 나란히 두어 짧은 시간 안에 달라진 점을 환자가 스스로 말하게 해요. 괜찮다가 갑자기 나빠지는 경과(명료기 뒤 악화)가 경막외혈종의 특징이에요.", d: "days ago—now", k: ["언제부터 머리가 아프기 시작했는지 말씀해 주세요", "지금 어떤 느낌인지 숫자로 말씀해 주세요"], a: "fine", o: ["ill", "weak", "sick"]}
