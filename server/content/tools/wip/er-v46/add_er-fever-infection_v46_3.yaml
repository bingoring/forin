- title: 여행 후 열대열 의심
  s:
  - {t: "검사 필요", i: plane, w: "needs urgent testing으로 서둘러 검사해야 한다는 기준을 한 문장으로 말해요. 말라리아 지역 여행 뒤 열은 먼저 배제해야 하고, 진단이 늦어지면 위험해질 수 있어요.", d: "needs a vaccine", k: ["여행 전에 예방접종을 받으셨나요?", "여행 중에 모기에 물리셨어요?"], a: "urgent", o: ["routine", "optional", "annual"]}
  - {t: "예방약 확인", i: pill, w: "and finish them으로 복용 여부뿐 아니라 끝까지 먹었는지도 한 번에 물어요. 예방약은 귀국 후에도 일정 기간 이어서 먹어야 효과가 있는 경우가 많아요.", d: "any sleeping pills", k: ["말라리아 약은 어디서 구하셨어요?", "여행 중에 모기장을 쓰셨어요?"], a: "finish", o: ["share", "lose", "crush"]}
  - {t: "신속 검사", i: lab, w: "run a test는 검사를 돌린다는 뜻이고 rapid가 빠르게 결과가 나온다는 걸 알려요. now로 바로 한다고 말해 기다려야 하는지 불안해하는 환자를 안심시켜요.", d: "a lung scan", k: ["검사 결과는 한 시간쯤 걸려요", "검사는 소변으로 할게요"], a: "rapid", o: ["slow", "routine", "painful"]}
  - {t: "귀국 시점", i: calendar, w: "exactly로 대략이 아닌 정확한 날짜를 요청해요. 귀국일과 증상 시작일의 간격으로 잠복기 안에 들어가는지 가늠해요.", d: "Where exactly", k: ["그 여행은 누구와 가셨어요?", "여행지에서 열이 났었어요?"], a: "exactly", o: ["probably", "finally", "hopefully"]}
  - {t: "검사 이유", i: bulb, w: "can look like로 초기 증상이 독감과 닮았다고 말해 검사를 하는 이유를 설명해요. so we test to be sure는 확실히 하려고라서 환자가 불필요한 검사로 느끼지 않게 해요.", d: "a week later", k: ["말라리아는 약으로 치료할 수 있어요", "결과는 곧 알려 드릴게요"], a: "flu", o: ["fracture", "sprain", "migraine"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "여행 후 열 말라리아 검사 4문장 순서"
    why: "여행에서 돌아온 정확한 날짜를 묻고, 그날 돌아오기 전 예방약을 끝까지 먹었는지 묻고, 그 답을 근거로 검사가 급하다고 말한 뒤, 말라리아가 의심되니 신속 검사를 한다고 닫아요. 'that trip'·'that day'·'those answers'·'it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When exactly did you get back from that trip?", icon: calendar, ko: "그 여행에서 정확히 언제 돌아오셨어요?", note: "귀국"}
    - {en: "Before you came back that day, did you take any malaria prevention pills, and finish them?", icon: pill, ko: "그날 돌아오기 전에 말라리아 예방약을 드셨고 끝까지 드셨나요?", note: "예방약"}
    - {en: "Based on those answers, a fever after travel to a malaria area needs urgent testing.", icon: plane, ko: "그 답을 보면 말라리아 지역 여행 후 열은 신속 검사가 필요해요", note: "필요성"}
    - {en: "We'll run a rapid blood test to check for it now.", icon: lab, ko: "지금 신속 혈액검사로 확인해볼게요", note: "검사"}
  ctx: {word: "malaria", ko: "말라리아"}
- title: 호중구감소성 발열 패혈증
  s:
  - {t: "위급 보고", i: siren, w: "until proven otherwise는 아니라고 증명되기 전까지는 그렇다고 본다는 임상 관용구예요. 호중구감소 환자의 저혈압은 패혈증으로 간주하고 먼저 움직여요.", d: "and now bleeding", k: ["항암치료는 어제 마쳤어요", "환자 가족이 도착했어요"], a: "septic", o: ["dehydrated", "anemic", "allergic"]}
  - {t: "항생제 요청", i: pill, w: "세미콜론으로 배양은 끝났다를 먼저 보고하고 바로 지시를 이어요. 호중구감소성 열이 있으면 배양 뒤 한 시간 안에 광범위 항생제를 시작하는 것이 기본이에요.", d: "twice daily", k: ["항생제 알레르기는 없다고 확인했어요", "환자는 중환자실로 옮겨요"], a: "antibiotics", o: ["vitamins", "antacids", "laxatives"]}
  - {t: "도움 요청", i: bell, w: "문장 앞에 진단명을 먼저 던져 상황을 한 줄로 알리고 I need로 필요한 것을 직접 말해요. 위급 보고는 무엇이 문제인지, 지금 무엇이 필요한지 순서가 빠르고 명확해요.", d: "and a chaplain", k: ["약국에 항생제를 요청했어요", "환자는 지금 잠들어 있어요"], a: "physician", o: ["pharmacist", "chaplain", "dietitian"]}
  - {t: "즉시 투여", i: pill, w: "don't wait for로 하지 말아야 할 일을 분명히 못 박아요. 호중구감소성 발열은 검사 결과를 기다리지 않고 첫 용량을 바로 줘요.", d: "for visiting hours", k: ["첫 용량은 이미 어제 줬어요", "용량은 약사가 다시 확인했어요"], a: "first", o: ["last", "extra", "second"]}
  - {t: "즉시 호출", i: siren, w: "Pressure's dropping으로 진행형을 써 지금 나빠지고 있다는 걸 알리고 I need you in here now로 와 달라는 요청을 분명히 해요. 부탁이 아닌 필요로 말해야 급하다는 게 전해져요.", d: "at the desk", k: ["심박수도 올라가고 있어요", "산소 수치는 아직 괜찮아요"], a: "dropping", o: ["rising", "steady", "holding"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "호중구감소 패혈증 의사 호출 4문장 순서"
    why: "호중구감소 환자의 저혈압을 패혈증으로 본다고 보고하고, 혈압이 계속 떨어져 와 달라고 요청하고, 이 혈압 하락에 광범위 항생제를 한 시간 안에 줘야 한다고 요청하고, 그 첫 용량은 검사를 기다리지 말라고 닫아요. 'still'·'this drop in pressure'·'that first dose'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Neutropenic and now hypotensive — this is septic until proven otherwise.", icon: siren, ko: "호중구감소에 저혈압까지 — 반증 전까진 패혈증이에요", note: "보고"}
    - {en: "Pressure's still dropping — I need you in here now.", icon: bell, ko: "혈압이 계속 떨어져요 — 지금 와 주셔야 해요", note: "호출"}
    - {en: "Cultures are drawn, so for this drop in pressure give broad-spectrum antibiotics within the hour.", icon: pill, ko: "배양은 채취했고 이 혈압 하락에 한 시간 안에 광범위 항생제를 주세요", note: "항생제"}
    - {en: "Don't wait for the workup to finish before that first dose.", icon: pill, ko: "그 첫 용량 전에 검사가 끝나길 기다리지 마세요", note: "즉시"}
  sw: {ko: "혈압이 떨어지고 있어요 — 지금 와 주셔야 해요."}
- title: 수막구균혈증 진행
  s:
  - {t: "위험 신호", i: siren, w: "dangerous sign을 숨기지 않고 말하되 we're acting now를 곧바로 붙여 보호자가 방치되지 않는다는 느낌을 줘요. 눌러도 사라지지 않는 자반과 졸림은 수막구균혈증의 위험 신호예요.", d: "are a rare sight", k: ["반점이 언제 처음 보였는지 알려 주세요", "아이 옆에서 손을 잡아 주세요"], a: "dangerous", o: ["common", "minor", "harmless"]}
  - {t: "즉시 치료", i: pill, w: "immediately를 붙여 한 순간도 미루지 않는다고 알려요. 수막구균혈증은 몇 시간 안에 악화될 수 있어 항생제와 수액을 서둘러 시작해요.", d: "and taking pictures", k: ["아이 체온을 다시 잴게요", "가족분들은 대기실에서 기다려 주세요"], a: "antibiotics", o: ["vitamins", "lotion", "cough syrup"]}
  - {t: "격리·접촉자", i: shield, w: "isolating him으로 지금 하는 일을, will need to로 앞으로 할 일을 시제로 나눠 말해요. 수막구균은 가까운 접촉으로 퍼질 수 있어 접촉자 보호도 같이 챙겨요.", d: "strangers too", k: ["아이가 쓰던 물건은 따로 모아 둘게요", "면회는 한 번에 한 분만 가능해요"], a: "isolating", o: ["bathing", "dressing", "feeding"]}
  - {t: "진행 속도", i: magnify, w: "How quickly로 속도를 묻고 after they first appeared로 기준 시점을 정해요. 자반이 몇 시간 안에 빠르게 퍼졌다면 병이 빠르게 진행한다는 뜻이라 중요한 정보예요.", d: "how often", k: ["반점을 눌러 보면 사라지나요?", "아이가 열이 나기 시작한 건 언제예요?"], a: "appeared", o: ["healed", "faded", "vanished"]}
  - {t: "접촉자 예방", i: pill, w: "Anyone who's been close to him으로 대상을 가까이 있던 모두로 넓혀 말해요. 수막구균 환자와 가까이 접촉한 사람에게는 감염을 막으려고 예방적 항생제를 줘요.", d: "will need a checkup", k: ["가까이 지낸 분 명단을 알려 주세요", "접촉하신 분께도 설명해 드릴게요"], a: "preventive", o: ["expensive", "topical", "herbal"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수막구균혈증 보호자 설명 4문장 순서"
    why: "반점이 얼마나 빨리 퍼졌는지 묻고, 그 반점과 졸림이 위험 신호라고 알리고, 그에 대응해 항생제와 수액을 시작하고, 항생제가 가까이 지낸 사람에게도 필요하다고 닫아요. 'the spots'·'Those'·'that dangerous sign'·'too'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How quickly did the spots spread after they first appeared?", icon: magnify, ko: "반점이 처음 나타난 뒤 얼마나 빨리 퍼졌어요?", note: "속도"}
    - {en: "Those purple spots with drowsiness are a dangerous sign — we're acting now.", icon: siren, ko: "저 자주색 반점에 졸림은 위험한 징후예요 — 지금 움직여요", note: "위험"}
    - {en: "For that dangerous sign, we're giving antibiotics immediately and starting fluids.", icon: pill, ko: "그 위험 신호 때문에 항생제를 즉시 드리고 수액을 시작해요", note: "치료"}
    - {en: "Anyone who's been close to him will need preventive antibiotics too.", icon: shield, ko: "가까이 지낸 사람도 예방적 항생제가 필요해요", note: "접촉자"}
  ctx: {word: "purpura", ko: "자반", sc: {1: {en: "Purpura spreading; pt lethargic. Abx given, isolation initiated."}}}
- title: 괴사성 근막염
  s:
  - {t: "위험 설명", i: faceWorried, w: "worries me로 의료진의 걱정을 솔직히 말해 왜 서두르는지 이유를 줘요. 겉보기보다 심한 통증에 열이 더해지면 깊은 조직 감염을 의심해요.", d: "calms me", k: ["통증약을 바로 드릴게요", "다리를 높이 올려 드릴게요"], a: "deep", o: ["minor", "mild", "simple"]}
  - {t: "외과 호출", i: bell, w: "calling surgery로 누구를 부르는지, urgently로 급하다는 걸 알려요. 괴사성 근막염은 수술로 죽은 조직을 걷어내는 것이 핵심이라 외과 평가가 시간과의 싸움이에요.", d: "the dietitian", k: ["마취과에도 연락할게요", "수술 동의서를 준비할게요"], a: "evaluate", o: ["feed", "bathe", "dress"]}
  - {t: "치료 시작", i: pill, w: "right now로 지금 바로 시작한다고 알려요. 깊은 감염에는 정맥으로 강한 항생제와 수액을 먼저 시작해요.", d: "a mild cream", k: ["알레르기 여부를 먼저 확인할게요", "다리를 소독하고 붕대를 감을게요"], a: "fluids", o: ["lotion", "bandages", "vitamins"]}
  - {t: "통증 설명", i: magnify, w: "much worse than…would explain으로 보이는 것에 비해 통증이 너무 크다는 판단을 말해요. 이처럼 소견보다 통증이 큰 것이 괴사성 근막염의 중요한 단서예요.", d: "than the fever", k: ["이 통증은 언제부터 심해졌어요?", "통증을 0에서 10으로 말하면 몇이에요?"], a: "worse", o: ["milder", "smaller", "slower"]}
  - {t: "외과 평가", i: scalpel, w: "right away와 before it spreads further로 서두르는 이유를 한 문장에 담아요. 괴사성 근막염은 몇 시간 만에 번질 수 있어 외과가 빨리 보는 것이 중요해요.", d: "this chart", k: ["외과 팀이 곧 도착해요", "다리는 움직이지 말고 가만히 두세요"], a: "leg", o: ["arm", "back", "neck"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "괴사성 근막염 의심 4문장 순서"
    why: "통증이 겉보기보다 심하다고 짚고, 그 정도의 통증에 열이 더해져 깊은 감염이 걱정된다고 말하고, 그 깊은 감염을 염두에 두고 항생제와 수액을 시작하고, 항생제와 함께 외과를 부른다고 닫아요. 'Pain this severe'·'that deep infection'·'the antibiotics'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This pain is much worse than the redness alone would explain.", icon: magnify, ko: "이 통증은 발적만으로 설명이 안 될 만큼 심해요", note: "통증"}
    - {en: "Pain this severe with a fever worries me about a deep infection.", icon: faceWorried, ko: "이렇게 심한 통증에 열까지 있으면 깊은 감염이 걱정돼요", note: "걱정"}
    - {en: "With that deep infection in mind, we're starting strong antibiotics and fluids right now.", icon: pill, ko: "그 깊은 감염을 염두에 두고 강한 항생제와 수액을 지금 바로 시작해요", note: "치료"}
    - {en: "Along with the antibiotics, we're calling surgery urgently to evaluate you.", icon: scalpel, ko: "항생제와 함께 긴급히 외과를 불러 평가받게 할게요", note: "외과"}
  ctx: {word: "surgery", ko: "외과"}
- title: 독성쇼크증후군
  s:
  - {t: "판단 설명", i: stetho, w: "세 가지 소견을 나열한 뒤 point to로 한 방향을 가리켜 판단의 근거를 보여 줘요. 발진·발열·저혈압이 함께 있으면 독성쇼크증후군을 먼저 의심해요.", d: "come from the heat", k: ["탐폰을 사용하고 계세요?", "몸 어디에 상처가 있어요?"], a: "pressure", o: ["sugar", "oxygen", "weight"]}
  - {t: "치료 시작", i: pill, w: "pouring in은 쏟아붓듯 빠르게 넣는다는 구어 표현이라 수액을 서둘러 준다는 느낌을 줘요. 독성쇼크는 수액으로 혈압을 지키고 항생제로 원인 균을 치료해요.", d: "and waiting", k: ["혈압을 5분마다 재볼게요", "소변량도 같이 확인할게요"], a: "antibiotics", o: ["vitamins", "lotion", "blankets"]}
  - {t: "원인 문진", i: magnify, w: "recent wound, surgery, tampons는 독성쇼크를 일으키는 균이 몸에 들어갈 수 있는 길목이에요. 환자가 먼저 말하기 어려운 내용도 담담히 물어요.", d: "any recent travel", k: ["최근에 생리를 하셨어요?", "피임약을 드시고 계세요?"], a: "wound", o: ["bite", "burn", "fall"]}
  - {t: "증상 설명", i: faceWorried, w: "can mean으로 가능성만 말해 환자를 놀라게 하지 않아요. 어지러움은 혈압이 떨어져 장기로 가는 피가 줄었다는 신호일 수 있어요.", d: "can just be anxiety", k: ["어지러우시면 일어나지 마세요", "누워서 쉬고 계세요"], a: "organs", o: ["bones", "teeth", "nails"]}
  - {t: "수액 이유", i: pill, w: "bring your pressure back up으로 목적을 혈압을 다시 올린다고 풀어서 말해요. 쇼크에서는 몸 안의 혈액량을 빨리 채워야 혈압이 회복돼요.", d: "to bring your fever", k: ["수액이 들어가는 동안 편하게 계세요", "수액이 새면 바로 알려 주세요"], a: "fast", o: ["gently", "quietly", "lightly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "독성쇼크 의심 설명 4문장 순서"
    why: "발진·열·저혈압이 독성쇼크를 가리킨다고 말하고, 그 판단을 근거로 상처·수술·탐폰을 묻고, 원인과 상관없이 수액과 항생제를 시작하고, 그 수액을 빨리 넣는 이유를 설명해요. 'Given that'·'Whatever the cause'·'The fluids'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "The rash, fever, and low pressure point to toxic shock.", icon: stetho, ko: "발진, 열, 낮은 혈압이 독성쇼크를 가리켜요", note: "판단"}
    - {en: "Given that, have you had any recent wound, surgery, or been using tampons?", icon: magnify, ko: "그렇다면 최근 상처·수술·탐폰 사용이 있었나요?", note: "원인"}
    - {en: "Whatever the cause, we're pouring in fluids and starting antibiotics now.", icon: pill, ko: "원인이 뭐든 지금 수액을 쏟아붓고 항생제를 시작해요", note: "치료"}
    - {en: "The fluids need to run fast to bring your pressure back up.", icon: monitor, ko: "그 수액은 혈압을 올리려고 빠르게 들어가야 해요", note: "이유"}
  ctx: {word: "toxic shock", ko: "독성쇼크", sc: {1: {en: "Fever, diffuse erythroderma, hypotension; concern for toxic shock syndrome."}, 2: {en: "You meet criteria for toxic shock syndrome with multiorgan involvement."}}}
- title: 발열 급속악화 쇼크 이행
  s:
  - {t: "상황 설명", i: monitor, w: "dropping fast라는 사실을 숨기지 않고 so we're moving quickly now로 곧바로 대응을 이어요. 환자에게 무슨 일이 일어나는지와 우리가 하는 일을 함께 말하면 불안이 줄어요.", d: "is rising slowly", k: ["혈압 커프를 팔에 감을게요", "가족분께 상황을 알릴게요"], a: "dropping", o: ["rising", "steady", "improving"]}
  - {t: "수액·항생제", i: pill, w: "wide open은 수액 속도 조절기를 활짝 열어 최대 속도로 넣는다는 현장 표현이에요. 패혈성 쇼크에서는 수액과 항생제를 지체 없이 시작해요.", d: "kept slow", k: ["링거 줄을 하나 더 확보할게요", "소변량을 재려고 소변줄을 놓을게요"], a: "antibiotics", o: ["vitamins", "lotion", "bandages"]}
  - {t: "곁 지키기", i: handshake2, w: "Stay with me로 의식이 흐려지는 환자에게 계속 깨어 있자고 직접 말을 걸어요. I'm getting the team in here로 곁을 떠나 혼자 두는 게 아니라 도움을 불러온다고 알려요.", d: "Look at the monitor", k: ["제 손을 잡아 보세요", "이름을 말씀해 보세요"], a: "team", o: ["family", "chaplain", "dietitian"]}
  - {t: "변화 설명", i: calendar, w: "An hour ago와 now를 대비해 짧은 시간에 얼마나 달라졌는지 보여 줘요. 패혈증은 좋아 보이다가도 빠르게 나빠질 수 있어서 한 시간 전과 비교해 변화를 설명해요.", d: "Last week", k: ["한 시간 전에도 안색이 안 좋았어요", "한 시간 전에 약을 드셨어요"], a: "stable", o: ["pale", "hungry", "sleepy"]}
  - {t: "번들 가동", i: siren, w: "activating the sepsis bundle로 패혈증 처치 묶음을 한꺼번에 가동한다고 알려요. 번들은 젖산·배양·항생제·수액 같은 처치를 정해진 시간 안에 하는 체크리스트예요.", d: "the discharge plan", k: ["번들 체크리스트를 같이 읽어 드릴게요", "중환자실 자리를 확인할게요"], a: "physician", o: ["pharmacist", "dietitian", "chaplain"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "발열 환자 급속 악화 대응 4문장 순서"
    why: "한 시간 전과 달라졌다고 알리고, 그 변화 중 혈압이 빠르게 떨어져 서두른다고 말하고, 그래서 패혈증 번들을 가동하고 의사를 부르고, 그 번들의 일부로 수액과 항생제를 준다고 닫아요. 'that change'·'That's why'·'that bundle'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "An hour ago you looked stable — now everything is changing fast.", icon: calendar, ko: "한 시간 전엔 안정적이었는데 지금은 빠르게 변하고 있어요", note: "변화"}
    - {en: "Part of that change is your pressure, which is dropping fast, so we're moving quickly now.", icon: monitor, ko: "그 변화 중 하나가 혈압인데 빠르게 떨어져서 저희도 서둘러요", note: "설명"}
    - {en: "That's why we're activating the sepsis bundle and calling the physician right now.", icon: siren, ko: "그래서 지금 패혈증 번들을 가동하고 의사를 불러요", note: "번들"}
    - {en: "As part of that bundle, we're giving fluids wide open and antibiotics right away.", icon: pill, ko: "그 번들로 수액을 활짝 열고 항생제를 바로 드려요", note: "치료"}
  sw: {ko: "혈압이 낮아서 수액 1리터를 활짝 열어 놓았어요."}
- title: 고위험 감염 이송 인계
  s:
  - {t: "의심·격리", i: siren, w: "Suspected로 확진 전임을 먼저 밝히고 대시 뒤에 격리 상태를 이어요. 인계는 진단 의심과 현재 격리 조치를 첫 줄에 말해야 받는 쪽이 방과 보호구를 준비해요.", d: "Probable measles", k: ["환자는 중환자실에서 오는 중입니다", "환자는 의식이 또렷합니다"], a: "Suspected", o: ["Confirmed", "Resolved", "Cleared"]}
  - {t: "투여 시각", i: calendar, w: "시각을 nineteen-hundred처럼 24시간제로 말하면 오전과 오후를 헷갈릴 일이 없어요. 배양을 먼저 채취했고 첫 항생제를 줬다는 순서가 인계에서 가장 먼저 확인하는 정보예요.", d: "twenty-one-hundred", k: ["첫 항생제는 오늘 아침에 투여했습니다", "혈액배양은 한 번만 채취했습니다"], a: "drawn", o: ["canceled", "lost", "repeated"]}
  - {t: "활력·격리", i: monitor, w: "마지막 혈압 수치를 숫자로 먼저 말하고 on fluids로 처치 중임을 붙여 받는 쪽이 추세를 가늠해요. please continue로 이송 후에도 격리를 이어 달라는 요청을 분명히 해요.", d: "heart rate", k: ["마지막 맥박은 백십이었습니다", "마지막 체온은 삼십구 도였습니다"], a: "systolic", o: ["diastolic", "pulse", "mean"]}
  - {t: "이송 중 격리", i: plane, w: "keep him isolated during transport로 이송 중에도 격리가 이어져야 한다고 분명히 말해요. 이송 경로의 다른 환자와 직원을 보호하려고 인계 때 격리 상태를 꼭 전해요.", d: "keep him seated", k: ["이송은 간호사 두 명이 함께 합니다", "이송 전에 혈압을 다시 재겠습니다"], a: "isolated", o: ["upright", "awake", "warm"]}
  - {t: "정맥로·수액량", i: pill, w: "large-bore는 굵은 바늘이라 수액을 빨리 넣을 수 있다는 뜻이에요. so far로 지금까지의 누적량임을 밝혀 이송 후 받는 쪽이 이어서 계산해요.", d: "two units of blood", k: ["중심정맥관은 아직 넣지 않았습니다", "소변량은 시간당 삼십 밀리리터입니다"], a: "liter", o: ["gallon", "teaspoon", "pint"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "고위험 감염 이송 인계 4문장 순서"
    why: "의심 진단과 격리를 먼저 보고하고, 그 의심에 대한 배양과 첫 항생제 시각을 말하고, 항생제와 함께 정맥로와 수액량을 알리고, 마지막 혈압과 격리 유지 요청으로 닫아요. 'that'·'the antibiotics'·'that liter'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Suspected meningococcemia — he's on airborne and contact precautions.", icon: siren, ko: "수막구균혈증 의심 — 공기 및 접촉 격리 중입니다", note: "상황"}
    - {en: "For that, cultures were drawn and first antibiotic dose given at nineteen-hundred.", icon: calendar, ko: "그에 대해 배양을 채취했고 첫 항생제를 19시에 투여했습니다", note: "배경"}
    - {en: "Alongside the antibiotics, two large-bore IVs are in, and he's had one liter of fluids so far.", icon: pill, ko: "항생제와 함께 굵은 정맥주사 두 개, 지금까지 수액 1리터입니다", note: "처치"}
    - {en: "On that liter, last pressure eighty-five systolic — please continue isolation.", icon: monitor, ko: "마지막 혈압 수축기 85, 수액 중입니다 — 격리를 유지해 주세요", note: "요청"}
  ctx: {word: "drawn", ko: "채취된"}
