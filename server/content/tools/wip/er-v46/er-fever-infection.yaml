    - '?'
    words:
    - w-fever
    - w-start
    - w-high
    - w-get
    goal: 1
    tag: 발열 경과
    icon: calendar
    why: 두 질문을 and로 한 문장에 묶어 '언제부터'와 '얼마나'를 한 번에 물어요. 시작 시점과 최고 체온은 감염이 얼마나 진행됐는지 가늠하는 첫 단서예요.
    decoy: how long ago
    distractorsKo:
    - 열이 며칠째 이어졌어요?
    - 지금 체온부터 재볼게요
    blank:
