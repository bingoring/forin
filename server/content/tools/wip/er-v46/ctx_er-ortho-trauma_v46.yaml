사지 손상 초기 사정: {word: "wound", ko: "상처"}
신경혈관(5P) 확인: {word: "injury", ko: "손상"}
통증 척도·기전 청취:
  word: "fall"
  ko: "낙상"
  sc:
    1: {en: "He had a fall, about six feet off a ladder, and landed on an outstretched hand."}
    2: {en: "Describe the mechanism of your fall: height, surface, and landing position.", fix: "Can you tell me how you fell and what you landed on?"}
  why: "mechanism, landing position 같은 말은 차트와 의료진끼리 쓰는 말이에요. 환자에게는 어떻게 넘어졌고 무엇 위로 떨어졌는지 쉬운 말로 물어요."
RICE·거상 교육:
  word: "ice"
  ko: "얼음"
  sc:
    0: {en: "Ice 20 min TID-QID; elevate; ACE wrap."}
    2: {en: "Apply ice for 20 minutes TID to QID.", fix: "Put an ice pack on it for twenty minutes, then take it off for a while, a few times today."}
  why: "TID·QID 같은 약어는 차트에나 쓰는 말이에요. 환자 교육에는 하루에 몇 번, 한 번에 몇 분인지를 쉬운 말로 풀어요."
개방골절 감염 예방:
  word: "tetanus"
  ko: "파상풍"
  sc:
    0: {en: "Tetanus: last Td > 10 yrs ago; Tdap given 1415."}
    2: {en: "What's your tetanus immunization status?"}
  why: "immunization status는 의료진과 차트의 말이에요. 환자에게는 tetanus shot을 언제 맞았는지 물어야 기억을 떠올려요. 오염된 상처는 마지막 접종이 5년을 넘었으면 추가 접종을 고려해요."
관절 탈구 정복 준비: {word: "reduce", ko: "정복하다"}
소아 성장판 손상:
  word: "growth plate"
  ko: "성장판"
  sc:
    0: {en: "Salter-Harris II fx through the growth plate, distal radius; ortho f/u 1 wk."}
    2: {en: "Your son has a Salter-Harris II fracture through the growth plate."}
  why: "Salter-Harris II 같은 분류명은 차트와 의료진끼리 쓰는 말이에요. 보호자에게는 growth plate가 무엇인지, 왜 다시 보는지를 쉬운 말로 풀어 줘요."
병적 골절 의심:
  word: "cancer"
  ko: "암"
  sc:
    0: {en: "PMH: breast cancer, s/p mastectomy 2019."}
    2: {en: "Do you have a history of malignancy or metastatic cancer?"}
  why: "malignancy·metastatic은 의료진끼리 쓰는 말이고 환자에게는 겁을 줘요. 환자에게는 cancer를 그대로, 치료받은 적이 있는지처럼 담담하게 물어요."
언어장벽 골절:
  word: "interpreter"
  ko: "통역사"
  sc:
    2: {en: "Interpreter, please tell her I need to know if she's allergic to anything."}
  why: "통역을 쓸 때는 통역사가 아니라 환자를 보고 1인칭으로 말해요. 'Interpreter, tell her…'처럼 통역사에게 말하면 환자가 대화에서 밀려나요."
구획증후군 급속진행:
  word: "pressure"
  ko: "압력"
  sc:
    0: {en: "I'm concerned about compartment syndrome: high compartment pressure, pain with passive stretch, and the calf is tense."}
    1: {en: "Compartment pressure high; pain w/ passive stretch, compartments tense; ortho notified 2140."}
    2: {en: "You need an emergent fasciotomy to relieve compartment pressure."}
대퇴골 골절 지방색전:
  word: "short of breath"
  ko: "숨이 차다"
  sc:
    0: {en: "Pt newly short of breath (dyspnea), SpO2 88% RA, petechiae across chest."}
    2: {en: "Any dyspnea on exertion, orthopnea, or shortness of breath?"}
  why: "dyspnea·orthopnea는 차트와 의료진의 말이에요. 환자에게는 short of breath로 짧게 물어야 바로 알아듣고 대답해요."
개방골절 SBAR 인계: {word: "intact", ko: "이상 없다"}
