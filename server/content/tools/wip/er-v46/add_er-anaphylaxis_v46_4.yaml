    why: "상황(혈압 저하)을 먼저 말하고, 'Before that'이 그 저하 이전을 가리켜 배경을 대고, 'it'이 그 저하를 가리켜 평가와 조치를 말하고, 마지막에 와서 봐 달라고 요청해요. 앞 줄을 가리키는 말이 줄마다 있어 순서가 하나예요."
    lines:
    - {en: "Calling about my post-anaphylaxis obs patient — his blood pressure dropped to ninety over fifty.", icon: speech, ko: "아나필락시스 후 관찰 환자인데 혈압이 90/50으로 떨어졌습니다", note: "상황"}
