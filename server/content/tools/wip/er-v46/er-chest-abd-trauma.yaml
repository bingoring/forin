    - w-side
    - w-feel
    - w-different
    - w-breathe
    goal: 1
    tag: 증상 문진
    icon: faceWorried
    why: one side로 좌우를 나눠 물으면 환자가 비교해서 답하기 쉬워요. 한쪽만 다르게 느껴지면 그쪽 폐나 흉벽에 문제가 있는지 보는 단서가 돼요.
    decoy: after you cough
    distractorsKo:
    - 어느 쪽이 더 아픈지 말씀해 주세요
    - 숨쉬기가 아까보다 힘든가요?
    blank:
      answer: different
      options:
      - en: equal
      - en: stronger
      - en: different
      - en: normal
  - en: Point to where it hurts the most when you breathe in.
    ko: 숨을 들이쉴 때 가장 아픈 곳을 가리켜 주세요.
