situations:
- title: 흉부외상 호흡 사정
  sentences:
  - en: I'm going to listen to your breathing on both sides.
    ko: 양쪽 호흡음을 들어볼게요.
    chunks:
    - I'm going to
    - listen to
    - your breathing
    - on both sides
    - .
    words:
    - w-listen
    - w-breathe
    - w-side
    goal: 1
    tag: 호흡음 청진
    icon: stetho
    why: on both sides로 양쪽을 다 듣는다고 미리 알려 주면 청진기가 옮겨 가는 이유를 환자가 알아요. 흉부 외상에서는 양쪽 호흡음을 비교해 한쪽이 약한지 살펴봐요.
    decoy: for one minute
    distractorsKo:
    - 숨을 참고 계세요
    - 산소 마스크를 씌워 드릴게요
    blank:
      answer: breathing
      options:
      - en: breathing
      - en: heartbeat
      - en: voice
      - en: cough
  - en: Your chest should rise and fall evenly on both sides.
    ko: 가슴은 양쪽이 고르게 오르내려야 해요.
    chunks:
    - Your chest
    - should rise
    - and fall
    - evenly
    - on both sides
    - .
    words:
    - w-chest
    - w-rise
    - w-fall
    - w-even
    - w-side
    goal: 1
    tag: 정상 기준
    icon: magnify
    why: should는 정상이라면 이래야 한다는 기준을 말해요. 흉벽이 양쪽 똑같이 움직이는지는 한쪽 폐에 문제가 있는지 찾는 첫 단서예요.
    decoy: only on one side
    distractorsKo:
    - 가슴에 멍이 있는지 볼게요
    - 숨소리를 먼저 들어 볼게요
    blank:
      answer: evenly
      options:
      - en: separately
      - en: evenly
      - en: unevenly
      - en: weakly
  - en: Does one side feel different when you take a breath?
    ko: 숨을 들이쉴 때 한쪽이 다르게 느껴지세요?
    chunks:
