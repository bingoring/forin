    word: deep
    ko: 깊은
  order:
    tag: 대화 흐름
    icon: compass
    ko: 흉부외상 호흡 사정 4문장 순서
    why: 먼저 듣겠다고 알리고, 듣는 동안 아픈 곳을 가리키게 한 뒤, 그 지점을 다시 들으며 심호흡을 부탁하고, 마지막에 달라졌는지 물어요. 'While I do'·'that spot'·'that breath'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: I'm going to listen to your breathing on both sides.
      icon: stetho
      ko: 양쪽 호흡음을 들어볼게요
      note: 안내
    - en: While I do, point to where it hurts the most when you breathe in.
      icon: pushpin
      ko: 듣는 동안 숨 쉴 때 가장 아픈 곳을 가리켜 주세요
      note: 위치
    - en: Thanks, I'll listen to that spot again, so take a slow, deep breath for me.
      icon: me
      ko: 고마워요, 그 지점을 다시 들을게요, 천천히 깊게 숨 쉬어 보세요
      note: 요청
    - en: Does it feel different after that breath?
      icon: faceWorried
      ko: 그 숨을 쉰 뒤에 다르게 느껴지세요?
      note: 확인
