- title: 무반응 환자 초기 인지
  s:
  - {t: "반응 확인", i: speaker, w: "먼저 부르고 그다음 눈을 뜨라고 시키는 순서예요. 큰 소리로 말을 걸어 반응이 있는지 보는 것이 무반응 확인의 첫 단계예요.", d: "Close your eyes", k: ["환자분, 어디가 아프세요?", "환자분, 성함이 어떻게 되세요?"], a: "hear", o: ["see", "follow", "answer"]}
  - {t: "상태 보고", i: stetho, w: "지금 하고 있는 행동을 -ing로 같이 말하면 옆 동료가 상황을 바로 따라와요. 호흡과 맥박은 함께 확인해요.", d: "on the monitor", k: ["의식이 돌아왔어요 — 혈압을 재고 있어요", "숨은 쉬어요 — 체온을 확인하고 있어요"], a: "pulse", o: ["cough", "fever", "murmur"]}
  - {t: "코드 선언", i: siren, w: "확인 결과를 먼저 말하고 바로 두 가지 행동을 이어 말해요. 결과와 다음 행동을 한 문장에 담으면 팀이 곧바로 움직여요.", d: "a page", k: ["맥박이 잡혀요 — 모니터를 붙이고 있어요", "맥박이 약해요 — 의사를 호출하고 산소를 줄게요"], a: "compressions", o: ["shocks", "fluids", "pacing"]}
  - {t: "확인 지시", i: magnify, w: "Check로 시작하는 짧은 명령이라 코드 상황에서 가장 빨리 전달돼요. 시간을 for ten seconds로 못 박으면 확인이 길어지지 않아요.", d: "on the monitor", k: ["30초 동안 호흡만 확인해 주세요", "2분 뒤에 맥박을 다시 확인해 주세요"], a: "ten", o: ["thirty", "sixty", "two"]}
  - {t: "코드 요청", i: bell, w: "판단(This is…)을 먼저 말하고 요청을 이어요. 이유를 앞에 두면 상대가 되묻지 않고 바로 호출해요.", d: "later", k: ["호흡곤란이에요 — 산소를 올려 주세요", "맥박이 있어요 — 모니터만 붙여 주세요"], a: "cardiac", o: ["respiratory", "septic", "diabetic"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "무반응 환자 발견 후 4문장 순서"
    why: "반응을 먼저 보고, 반응이 없으면 호흡과 맥박을 확인하고, 맥박이 없으면 코드를 선언한 뒤 카트를 부르는 순서예요. Still nothing과 Compressions are going이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Sir, can you hear me? Open your eyes!", icon: speaker, ko: "환자분, 들리세요? 눈 떠 보세요", note: "반응"}
    - {en: "Still nothing — I'm checking his breathing and pulse.", icon: stetho, ko: "여전히 반응이 없어요 — 호흡과 맥박을 확인해요", note: "확인"}
    - {en: "No pulse — I'm calling a code and starting compressions.", icon: siren, ko: "맥박이 없어요 — 코드를 부르고 압박을 시작해요", note: "선언"}
    - {en: "Compressions are going — someone bring the crash cart over.", icon: hospital, ko: "압박 중이에요 — 누가 응급 카트를 가져와 주세요", note: "카트"}
- title: 응급코드 호출·역할 배정
  s:
  - {t: "역할 지정", i: me, w: "I need you on …은 이름 대신 '당신'을 콕 집어 역할을 주는 말이에요. 누구에게 하는 지시인지 분명해야 서로 미루지 않아요.", d: "— stop now", k: ["당신은 기록을 맡아 주세요", "모니터를 보고 리듬을 알려 주세요"], a: "compressions", o: ["charting", "suction", "medications"]}
  - {t: "역할 지정", i: speech, w: "You take …는 역할을 통째로 넘기는 직접적인 말이에요. bag은 동사로 쓰면 백밸브마스크로 환기한다는 뜻이에요.", d: "and chart it", k: ["당신은 제세동기를 맡아 주세요", "당신은 정맥주사를 맡아 주세요"], a: "airway", o: ["monitor", "defibrillator", "medications"]}
  - {t: "일 분배", i: pushpin, w: "Someone …은 특정인을 부르지 않는 지시라서 카트 가져오기 같은 잔일에 알맞아요. 코드에서는 시각 기록이 나중에 약물과 충격 간격을 맞추는 데 쓰여요.", d: "the next dose", k: ["누군가 기도를 맡아 주세요", "누군가 보호자를 대기실로 모셔 주세요"], a: "crash cart", o: ["stretcher", "ultrasound", "suction"]}
  - {t: "자기소개", i: mic, w: "call out은 큰 소리로 알린다는 구동사예요. 이름과 역할을 소리 내어 말하면 코드 리더가 누가 무엇을 맡았는지 한눈에 알아요.", d: "to the family", k: ["이름과 생년월일을 확인해 주세요", "역할은 나중에 정해 드릴게요"], a: "role", o: ["shift", "unit", "license"]}
  - {t: "인원 요청", i: monitor, w: "someone on …을 되풀이해 비어 있는 역할을 하나씩 짚어 말해요. 빈 자리를 소리 내어 말해야 리더가 인원 배치를 정리할 수 있어요.", d: "in the waiting room", k: ["모니터와 기도는 이미 맡았어요", "압박을 맡을 사람이 필요해요"], a: "monitor", o: ["phone", "chart", "suction"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "코드 리더의 역할 배정 4문장 순서"
    why: "리더라고 밝힌 뒤 압박부터 맡기고, 압박이 정해진 다음에 기도를 맡기고, 나머지에게 이름과 역할을 말하게 해요. First가 1·2줄을, With compressions covered와 Everyone else가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Code Blue, bed four — I'm the team leader.", icon: siren, ko: "코드 블루, 4번 침상 — 제가 팀 리더예요", note: "선언"}
    - {en: "First, you on compressions — start now.", icon: me, ko: "먼저 당신이 압박을 맡아 지금 시작해요", note: "압박"}
    - {en: "With compressions covered, you take the airway and bag him.", icon: speech, ko: "압박이 정해졌으니 당신은 기도를 맡아 백으로 환기해요", note: "기도"}
    - {en: "Everyone else, call out your name and your role.", icon: mic, ko: "나머지는 이름과 역할을 소리 내어 말해 주세요", note: "소개"}
  sw: {ko: "파란 수술복 입은 분, 지금 압박을 시작하세요"}
- title: 흉부압박 기본 수행
  s:
  - {t: "압박 지시", i: chartup, w: "hard and fast는 압박의 핵심 두 가지를 짧게 묶은 말이에요. 코드에서는 길게 설명하지 않고 이렇게 단어를 짧게 던져요.", d: "of the stomach", k: ["배 중앙을 천천히 눌러 주세요", "가슴을 가볍게 두드려 주세요"], a: "center", o: ["side", "top", "edge"]}
  - {t: "목표 수치", i: compass, w: "Aim for는 지켜야 할 목표 수치를 알릴 때 쓰는 말이에요. 미국 심폐소생 지침은 깊이 최소 2인치(5cm), 속도 분당 100~120회예요.", d: "an hour", k: ["손가락 한 마디 깊이로 천천히 누르세요", "분당 30회씩 가볍게 누르세요"], a: "deep", o: ["long", "wide", "thick"]}
  - {t: "교대 제안", i: redo, w: "Let's …는 함께 하자는 제안이라 압박자에게 지적처럼 들리지 않아요. 압박은 힘들어서 보통 2분마다 교대해요.", d: "to save time", k: ["압박은 계속하고 교대는 하지 않을게요", "지금 바로 압박을 멈추고 쉬어요"], a: "cycle", o: ["shock", "dose", "breath"]}
  - {t: "긍정 피드백", i: star, w: "잘하고 있다는 피드백은 압박자가 속도와 깊이를 그대로 유지하게 해요. 코드 중에는 짧고 구체적인 칭찬이 방향 지시 역할을 해요.", d: "too slow", k: ["너무 느려요 — 더 빠르게 눌러 주세요", "너무 깊이 누르고 있어요 — 살살 하세요"], a: "keep", o: ["stop", "quit", "start"]}
  - {t: "깊이 기준", i: monitor, w: "every time으로 한 번도 얕아지면 안 된다고 강조해요. 압박 깊이는 지치면 얕아지기 쉬워서 반복해서 일러 줘요.", d: "once in a while", k: ["매번 최대 2인치 깊이로 눌러 주세요", "가끔씩 깊게 눌러 주세요"], a: "at least", o: ["at most", "about", "exactly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "압박 지시에서 교대까지 4문장 순서"
    why: "먼저 위치와 속도를 알리고, 그 속도에 깊이를 더하고, 힘이 떨어지기 전에 교대를 제안한 뒤, 교대하는 사람이 같은 기준을 이어받아요. That's the right speed, hold that depth, the last cycle이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Push hard and fast in the center of the chest.", icon: chartup, ko: "가슴 중앙을 세게 빠르게 눌러 주세요", note: "시작"}
    - {en: "That's the right speed — keep each push at least two inches deep.", icon: star, ko: "속도 좋아요 — 매번 최소 2인치 깊이로 눌러요", note: "깊이"}
    - {en: "When this cycle ends, let's switch so you can hold that depth.", icon: redo, ko: "이번 주기가 끝나면 교대해서 그 깊이를 유지해요", note: "교대"}
    - {en: "I'm in — same speed and depth as the last cycle.", icon: play, ko: "제가 이어받아요 — 지난 주기와 같은 속도와 깊이로요", note: "인수"}
  ctx: {word: "push", ko: "누르다"}
- title: BVM 환기 협조
  s:
  - {t: "기도 확보", i: stetho, w: "머리 젖히고 턱 들기(head tilt-chin lift)는 혀가 기도를 막지 않게 하는 기본 동작이에요. 동사 두 개를 and로 이어 한 번에 지시해요.", d: "and cover the mouth", k: ["양손으로 가슴을 눌러 주세요", "머리를 옆으로 돌리고 입을 닦아 주세요"], a: "back", o: ["forward", "down", "sideways"]}
  - {t: "마스크 밀착", i: handshake2, w: "두 사람이 환기할 때는 한 사람이 양손으로 마스크를 밀착시키고 다른 사람이 백을 짜는 방법이 밀착에 유리해요. I'll …은 자기 역할을 먼저 밝히는 말이에요.", d: "a one-handed grip", k: ["마스크를 잠시 떼어 주세요", "백은 제가 아니라 당신이 짜세요"], a: "bag", o: ["cuff", "tube", "syringe"]}
  - {t: "환기 확인", i: magnify, w: "chest rise는 공기가 폐로 들어가는지 눈으로 보는 가장 간단한 확인이에요. with each breath로 한 번 한 번 확인하라는 뜻을 담아요.", d: "in the morning", k: ["가슴이 내려가는 속도를 재 보세요", "숨을 한 번 넣고 잠시 기다려 보세요"], a: "rise", o: ["fall", "shake", "stop"]}
  - {t: "천천히 환기", i: play, w: "천천히 짜는 것은 과환기를 막는 요령이에요. 세게 빨리 넣으면 공기가 위로 들어가 위가 부풀 수 있어요.", d: "fall", k: ["백을 세게 빠르게 짜서 가슴을 올려 주세요", "백을 내려놓고 가슴을 눌러 주세요"], a: "slowly", o: ["quickly", "hard", "forcefully"]}
  - {t: "새는 경우", i: redo, w: "if 절로 문제가 생기는 조건을 먼저 말해 둬요. 마스크가 새면 머리 자세와 밀착을 다시 잡는 것이 첫 대응이에요.", d: "twice", k: ["밀착이 새도 계속 짜 주세요", "밀착이 새면 압박을 멈춰 주세요"], a: "leaking", o: ["tight", "secure", "firm"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "백밸브마스크 환기 4문장 순서"
    why: "기도를 연 뒤에 마스크를 밀착시키고, 백을 짜며 가슴이 올라오는지 보고, 올라오지 않으면 다시 조정해요. With the airway open, Squeezing slowly now, If it stops rising의 it이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Tilt the head back and lift the chin to open the airway.", icon: stetho, ko: "머리를 젖히고 턱을 들어 기도를 열어요", note: "기도"}
    - {en: "With the airway open, hold a two-handed seal — I'll squeeze the bag.", icon: handshake2, ko: "기도가 열렸으니 양손으로 밀착해 주세요 — 제가 짤게요", note: "밀착"}
    - {en: "Squeezing slowly now — I see his chest rising with each breath.", icon: play, ko: "천천히 짜고 있어요 — 숨마다 가슴이 올라와요", note: "환기"}
    - {en: "If it stops rising, the seal is leaking — tilt his head again.", icon: redo, ko: "안 올라오면 밀착이 새는 거예요 — 머리를 다시 젖혀요", note: "조정"}
  ctx: {word: "chest", ko: "가슴"}
- title: 제세동 패드 부착 안전
  s:
  - {t: "패드 위치", i: pushpin, w: "right of와 below로 두 위치를 방향 말로 짚어요. 성인의 표준 위치는 오른쪽 가슴 위쪽 흉골 옆과 왼쪽 겨드랑이 아래 옆구리예요.", d: "the right knee", k: ["패드를 배 위에 나란히 붙여 주세요", "패드를 팔과 다리에 붙여 주세요"], a: "sternum", o: ["navel", "shoulder", "hip"]}
  - {t: "방전 전 외침", i: siren, w: "나, 너, 모두를 차례로 짚으며 주위를 훑어보는 안전 확인이에요. 문구는 병원마다 조금씩 달라도 모두 떨어졌음을 확인하는 점은 같아요.", d: ", she's clear", k: ["방전했어요, 계속 압박하세요", "저는 아직 환자를 잡고 있어요"], a: "everybody", o: ["nobody", "somebody", "anybody"]}
  - {t: "접촉 확인", i: shield, w: "Make sure …는 직접 확인하라고 시키는 말이에요. 방전 전에 침대나 환자에 닿은 사람이 있으면 그 사람도 충격을 받을 수 있어요.", d: "or the floor", k: ["침대와 환자를 꼭 붙잡아 주세요", "침대 난간을 모두 올려 주세요"], a: "touching", o: ["moving", "lifting", "cleaning"]}
  - {t: "부착 확인", i: check, w: "that 절로 확인할 내용을 한 번에 말해요. 패드가 피부에 제대로 붙어 있어야 제세동기가 리듬을 읽고 충격을 전달할 수 있어요.", d: "that the wheels", k: ["패드를 떼고 피부를 닦아 주세요", "패드 위에 거즈를 덮어 주세요"], a: "skin", o: ["gown", "sheet", "bed"]}
  - {t: "방전 직전", i: siren, w: "before you …로 순서를 못 박아요. 모두 떨어졌는지 확인하는 일이 방전보다 먼저예요. deliver the shock은 제세동기 버튼을 눌러 충격을 준다는 뜻이에요.", d: "after you charge", k: ["충격을 준 뒤에 모두 물러나세요", "충격을 주기 전에 패드를 떼세요"], a: "deliver", o: ["cancel", "stop", "remove"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "패드 부착부터 방전까지 4문장 순서"
    why: "패드를 붙이고, 피부에 붙었는지 보고 충전하고, 충전된 뒤 접촉을 확인하고, 마지막에 클리어를 외치며 방전해요. they, it's charged가 앞 줄을 가리키고 방전은 마지막 줄이라 순서가 하나예요."
    lines:
    - {en: "Place the pads right of the sternum and below the left armpit.", icon: pushpin, ko: "패드를 흉골 오른쪽과 왼쪽 겨드랑이 아래에 붙여요", note: "부착"}
    - {en: "Check that they're sticking to the skin, then I'll charge.", icon: check, ko: "피부에 잘 붙었는지 보고 충전할게요", note: "확인"}
    - {en: "Now that it's charged, make sure no one is touching the bed.", icon: shield, ko: "충전됐으니 아무도 침대를 안 만지는지 확인해요", note: "접촉"}
    - {en: "I'm clear, you're clear, everybody clear — shocking now!", icon: siren, ko: "저도, 당신도, 모두 물러났어요 — 방전해요", note: "방전"}
  sw: {ko: "저 물러났고, 당신도 물러났고, 모두 물러나세요!"}
- title: 제세동 가능 리듬(VF/pVT) 판단
  s:
  - {t: "리듬 확인", i: monitor, w: "for …로 멈추는 이유를 짧게 붙여요. 리듬 확인은 보통 2분마다, 압박 한 주기가 끝나는 시점에 해요.", d: "for a break", k: ["리듬 확인을 위해 환기를 멈추세요", "압박을 계속하면서 리듬을 확인하세요"], a: "rhythm", o: ["temperature", "glucose", "pressure"]}
  - {t: "리듬 판독", i: chartup, w: "리듬 이름을 먼저 말하고 바로 다음 행동을 이어요. 충전 에너지는 제세동기 종류와 병원 지침을 따라요.", d: "— pace at 70", k: ["무수축이에요 — 압박을 계속하세요", "심실세동이에요 — 압박을 멈추지 마세요"], a: "V-fib", o: ["asystole", "PEA", "bradycardia"]}
  - {t: "방전 후", i: play, w: "충격 직후에는 맥박을 확인하느라 시간을 쓰지 않고 곧바로 압박을 이어 가요. resume은 멈췄던 일을 다시 이어 간다는 뜻이에요.", d: ", stop", k: ["충격을 주지 않았어요, 압박을 멈추세요", "방전됐어요, 맥박을 먼저 확인하세요"], a: "immediately", o: ["later", "eventually", "tomorrow"]}
  - {t: "제세동 판단", i: bulb, w: "shockable은 제세동으로 교정할 수 있는 리듬(심실세동과 무맥성 심실빈맥)을 가리켜요. so는 앞의 판단이 뒤 행동의 이유가 되게 이어 줘요.", d: ", so wait", k: ["이 리듬은 제세동이 안 되니 압박을 계속하세요", "이 리듬은 규칙적이니 모니터만 보세요"], a: "shockable", o: ["slow", "regular", "narrow"]}
  - {t: "즉시 재개", i: redo, w: "the moment …는 '그 순간 바로'라는 뜻의 접속 표현이에요. 충격과 압박 재개 사이를 최대한 짧게 하라는 뜻이에요.", d: "the shock is charged", k: ["충전되는 즉시 압박을 멈추세요", "방전된 뒤 2분 쉬고 압박하세요"], a: "Resume", o: ["Stop", "Pause", "Delay"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "리듬 확인에서 압박 재개까지 4문장 순서"
    why: "압박을 멈추고 리듬을 보고, 제세동 가능한 리듬이면 충전해 방전하고, 곧바로 압박을 재개해요. Compressions are stopped, It's charged가 앞 줄을 가리키고 마지막 줄의 Shock delivered가 방전 뒤라 순서가 하나예요."
    lines:
    - {en: "Stop compressions for a rhythm check.", icon: monitor, ko: "리듬 확인을 위해 압박을 멈춰요", note: "확인"}
    - {en: "Compressions are stopped — that's V-fib, charge to 200.", icon: chartup, ko: "압박을 멈췄어요 — 심실세동이에요, 200으로 충전해요", note: "충전"}
    - {en: "It's charged and everybody's clear — delivering the shock.", icon: siren, ko: "충전됐고 모두 물러났어요 — 방전해요", note: "방전"}
    - {en: "Shock delivered — resume compressions immediately.", icon: play, ko: "방전됐어요 — 즉시 압박을 재개해요", note: "재개"}
  ctx: {word: "V-fib", ko: "심실세동"}
