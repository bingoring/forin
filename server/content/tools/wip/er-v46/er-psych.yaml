    icon: me
    before:
    - 'Are you thinking about '
    - not being around anymore
    - '?'
    options:
    - killing yourself
    - not being around anymore
    - doing something silly
    answer: killing yourself
    notes:
      killing yourself: 분명한 말로 묻는다. 환자도 분명하게 답할 수 있다.
      not being around anymore: 돌려 물으면 환자도 돌려 답해서 위험을 놓치기 쉽다.
      doing something silly: 환자의 고통을 가볍게 만들어 입을 닫게 한다.
    why: 자살을 직접 묻는다고 그 생각을 심어 주지 않아요 — 연구로 확인된 사실이에요. 그래서 선별 질문은 돌려 말하지 않고 '자살'을 분명히 넣어 물어요. C-SSRS처럼 '죽었으면 하는 바람'부터 묻는 순서는 괜찮아요 — 어느 단계에서든 '자살'이라는 말 자체를 돌려 말하지 않는 것이 핵심이에요.
