    - w-hurt
    goal: 1
    tag: 자해 질문
    icon: speech
    why: any thoughts of로 행동이 아니라 '생각'부터 물어요. hurting yourself는 자해를 묻는 말이라, 자살은 이어서 ending your life처럼 분명한 말로 따로 물어요.
    decoy: for your doctor
    distractorsKo:
    - 어젯밤에 잠은 좀 주무셨어요?
    - 지금 몸 어디가 아프세요?
    blank:
