    - I have news
    - .
    words:
    - w-find
    - w-news
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-shortly
    - w-update
    cue: 'Nurse: "The doctor is two patients away — maybe ten minutes."'
    scale:
    - right away
    - shortly
    - later
    answerAt: 1
    why: 몇 분 안쪽이면 shortly예요. right away는 '지금 당장'이라 지키지 못할 약속이 되고, later는 언제인지 알 수 없어 기다리는 환자에게 더 막연하게 들려요.
    example: The doctor will be with you shortly.
    exKo: 곧 의사가 올 거예요.
  - kind: swap
    words:
    - w-first
    - w-explain
    who: 환자에게 · 진료 순서 설명
    icon: me
    before:
    - 'Patients with life-threatening issues are '
    - triaged by acuity
    - .
    options:
    - seen first
    - triaged by acuity
    - more important than you
    answer: seen first
    notes:
      seen first: 순서의 기준만 쉬운 말로 알린다. 환자를 깎아내리지 않는다.
      triaged by acuity: 의료진끼리의 말. 환자는 acuity가 무슨 뜻인지 모른다.
      more important than you: 환자 자신을 덜 중요한 사람으로 만드는 말로 들려 불만을 키운다.
    why: 같은 트리아지 설명도 환자에게는 '위급한 분이 먼저 진료받는다'처럼 기준만 쉽게 말해요.
