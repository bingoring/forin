situations:
- title: 대기 지연 불만 환자
  sentences:
  - en: I'm sorry for the long wait — let me explain what's happening.
    ko: 오래 기다리게 해서 죄송해요, 지금 상황을 설명해 드릴게요.
    chunks:
    - I'm sorry
