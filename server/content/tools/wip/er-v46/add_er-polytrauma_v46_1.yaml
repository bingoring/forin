- title: "1차평가 ABCDE 순서"
  s:
  - {t: "경위 문진", i: speech, w: "Can you …?로 부탁하는 형태라 다친 환자도 부담 없이 답해요. 또렷하게 말로 답하면 기도가 열려 있고 의식이 있다는 첫 단서가 돼요.", d: "at the scene", k: ["통증이 몇 점인지 말씀해 주세요", "약 알레르기가 있는지 말씀해 주세요"], a: "name", o: ["address", "blood type", "birthday"]}
  - {t: "호흡 확인", i: stetho, w: "for me를 붙이면 지시가 부탁처럼 들려요. 숨쉴 때의 통증은 갈비뼈 골절이나 폐 손상 같은 호흡 문제의 단서라 B 단계에서 확인해요.", d: "all at once", k: ["목이 아픈지 말씀해 주세요", "오른팔을 한번 살펴볼게요"], a: "breathe", o: ["swallow", "cough", "bend"]}
  - {t: "전신 확인", i: magnify, w: "head to toe는 부위를 하나씩 읽기 전에 전체를 훑는다는 틀을 줘서 환자가 손길을 예상할 수 있어요. 몸 전체를 드러내 보는 것이 1차평가의 마지막 E 단계예요.", d: "on the chart", k: ["머리 CT를 찍으러 갈게요", "팔에 정맥로를 잡을게요"], a: "now", o: ["later", "tomorrow", "twice"]}
  - {t: "우선순위", i: siren, w: "first로 순서를 먼저 밝히면 다른 곳이 아파도 기다려 달라는 이유가 전해져요. 생명을 가장 빨리 위협하는 기도, 호흡, 순환을 먼저 보는 것이 1차평가의 원칙이에요.", d: "last of all", k: ["아픈 곳을 차트에 표시할게요", "수액 속도부터 올릴게요"], a: "circulation", o: ["disability", "exposure", "digestion"]}
  - {t: "위험 먼저", i: shield, w: "what's most serious로 대상을 가장 심각한 것으로 좁혀 말하면 다른 통증이 있어도 기다려 달라는 이유가 전해져요. 외상에서는 눈에 띄는 상처보다 생명을 위협하는 손상을 먼저 찾아요.", d: "for later", k: ["가장 아픈 곳부터 치료할게요", "보이는 상처부터 소독할게요"], a: "serious", o: ["obvious", "recent", "unusual"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "1차평가 시작 4문장 순서"
    why: "먼저 이름과 경위를 묻고, 그 답을 받아 호흡을 확인하고, 이어서 맥박과 혈압을 재고, 마지막에 몸 전체를 살핍니다. 'Thanks'·'That'·'those'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Can you tell me your name and what happened?", icon: speech, ko: "이름이 뭐고 무슨 일이 있었는지 말씀해 주시겠어요?", note: "경위"}
    - {en: "Thanks, you're talking well, so now take a deep breath for me.", icon: stetho, ko: "고마워요, 말씀을 잘 하시니 이제 숨을 깊게 쉬어 보세요", note: "호흡"}
    - {en: "That sounded clear, so I'm checking your pulse and blood pressure next.", icon: monitor, ko: "숨소리가 또렷했으니 다음으로 맥박과 혈압을 잴게요", note: "순환"}
    - {en: "Now that I've checked those, I'll look you over head to toe.", icon: magnify, ko: "그걸 확인했으니 이제 머리부터 발끝까지 살펴볼게요", note: "노출"}
  ctx: {word: "patent", ko: "열려 있는(개방된)"}
  sw: {ko: "지금 머리부터 발끝까지 살펴볼게요"}
- title: "경추 보호 설명"
  s:
  - {t: "움직임 통제", i: lock, w: "Please don't …로 금지를 정중하게 시작하고 for me로 부탁처럼 마무리해요. 경추 손상이 의심되면 환자가 스스로 목을 움직이다 척수를 더 다칠 수 있어서 가만히 있게 해요.", d: "to the side", k: ["눈을 감고 계세요", "팔을 옆으로 펴 주세요"], a: "neck", o: ["jaw", "shoulders", "elbows"]}
  - {t: "이유 설명", i: shield, w: "to protect …로 목적을 붙여 말하면 환자가 불편해도 따를 이유가 생겨요. 머리와 목, 몸통을 일직선으로 유지하면 불안정한 척추뼈가 어긋나 척수를 누르는 것을 막아요.", d: "from the cold", k: ["머리에 얼음주머니를 대고 있어요", "머리가 아프면 약을 드릴게요"], a: "spine", o: ["skull", "lungs", "hips"]}
  - {t: "유지 안내", i: lock, w: "until we clear …로 끝나는 시점을 알려 주면 환자가 언제까지 참아야 하는지 알 수 있어요. 목 보호대는 의사가 검사나 영상으로 경추 손상을 배제하기 전까지 유지해요.", d: "while you eat", k: ["목 보호대가 조이면 말씀해 주세요", "목 보호대 밑 피부를 살필게요"], a: "collar", o: ["blanket", "splint", "sling"]}
  - {t: "환자 안심", i: shield, w: "just a precaution이라고 하면 척추가 이미 다쳤다는 확정이 아니라 예방 차원이라는 뜻이 전해져요. 영상으로 확인하기 전까지는 척추를 다쳤을 수 있다고 보고 움직임을 막아요.", d: "from the pain", k: ["척추 엑스레이는 곧 찍을 거예요", "곧 통증약을 드릴게요"], a: "precaution", o: ["procedure", "medication", "treatment"]}
  - {t: "공감", i: faceWorried, w: "I know it's …로 불편함을 먼저 인정하고 but으로 이유를 잇는 순서라 불평을 막지 않고 수긍하게 해요.", d: "for a while", k: ["답답하신 건 알지만 숨은 편히 쉬어도 돼요", "추우시면 담요를 덮어 드릴게요"], a: "uncomfortable", o: ["tight", "hot", "itchy"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "경추 보호 설명 4문장 순서"
    why: "머리를 가만히 두라고 부탁하고, 그것을 돕는 칼라를 대고, 불편함을 인정하며 이유를 말한 뒤, 의사가 확인할 때까지 참아 달라고 닫아요. 'that'·'the collar'·'So'가 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "I need you to keep your head still for me.", icon: lock, ko: "머리를 가만히 두셔야 해요", note: "요청"}
    - {en: "To help with that, I'm putting a collar on your neck.", icon: shield, ko: "그걸 돕기 위해 목에 보호대를 대고 있어요", note: "시행"}
    - {en: "I know the collar is uncomfortable, but it keeps your spine lined up.", icon: faceWorried, ko: "보호대가 불편한 건 알지만 척추를 일직선으로 지켜 줘요", note: "공감"}
    - {en: "So please bear with us until the doctor clears your neck.", icon: check, ko: "그러니 의사가 목을 확인할 때까지 조금만 참아 주세요", note: "부탁"}
  ctx: {word: "precautions", ko: "예방 조치"}
  sw: {ko: "의사가 경추 손상이 없다고 확인할 때까지 목 보호대는 그대로 둡니다"}
- title: "활력·쇼크지수 사정"
  s:
  - {t: "활력 측정", i: monitor, w: "I'm …ing now로 지금 하는 일을 알리면 팔을 잡는 손길에 놀라지 않아요. 맥박과 혈압은 출혈 같은 순환 문제를 가장 빨리 보여 주는 지표예요.", d: "for you", k: ["체온을 재고 있어요", "소변량을 확인하고 있어요"], a: "pulse", o: ["temperature", "weight", "height"]}
  - {t: "증상 문진", i: me, w: "when you lift your head처럼 상황을 구체화하면 막연히 어지럽냐고 묻는 것보다 답하기 쉬워요. 머리를 들 때 어지러우면 혈압이 떨어졌을 수 있다는 단서예요.", d: "in the car", k: ["머리를 들 때 목이 아픈가요?", "머리를 들 때 구역질이 나나요?"], a: "dizzy", o: ["nauseous", "sleepy", "sore"]}
  - {t: "상태 알림", i: monitor, w: "high 뒤에 we're watching을 바로 붙여 수치를 알리면서 곧 대응한다는 걸 같이 전해요. 외상에서 빠른 맥박은 출혈로 혈액이 모자라 심장이 더 빨리 뛰는 신호일 수 있어요.", d: "this morning", k: ["산소 수치는 괜찮아요", "체온이 조금 높아요"], a: "heart rate", o: ["temperature", "oxygen level", "weight"]}
  - {t: "결과 안내", i: chartup, w: "a little로 수치를 부드럽게 전하면 환자가 놀라지 않아요. right now는 지금 이 순간의 값이라 곧 달라질 수 있다는 뜻이라 재측정을 자연스럽게 이어 가요.", d: "all day", k: ["산소 수치가 조금 낮아요", "체온이 조금 낮아요"], a: "low", o: ["high", "strong", "fast"]}
  - {t: "재측정 안내", i: calendar, w: "every few minutes처럼 간격을 말해 주면 계속 재는 이유가 불안한 신호가 아니라 정해진 감시라는 걸 알아요. 쇼크가 의심되면 수치가 바뀌는 추세를 보려고 자주 재요.", d: "once a day", k: ["수치가 바뀌면 바로 알려 드릴게요", "측정값은 차트에 기록해 둘게요"], a: "these numbers", o: ["your bandage", "your pupils", "your airway"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "활력 사정 4문장 순서"
    why: "측정을 알리고, 나온 수치를 전한 뒤, 그래서 어지러움을 묻고, 어떤 답이든 계속 잰다고 닫아요. 'The pulse'·'That's why'·'Either way'가 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "I'm going to take your pulse and a blood pressure.", icon: monitor, ko: "맥박과 혈압을 잴게요", note: "측정"}
    - {en: "The pulse is fast, and the pressure is a little low.", icon: chartup, ko: "맥박은 빠르고 혈압은 조금 낮아요", note: "결과"}
    - {en: "That's why I'm asking: do you feel dizzy when you lift your head?", icon: me, ko: "그래서 묻는데, 머리를 들 때 어지러우세요?", note: "문진"}
    - {en: "Either way, we'll keep checking those numbers every few minutes.", icon: calendar, ko: "어느 쪽이든 그 수치를 몇 분마다 계속 확인할게요", note: "감시"}
  ctx: {word: "tachycardic", ko: "빈맥인"}
- title: "통증 부위 신속 확인"
  s:
  - {t: "위치 확인", i: pushpin, w: "Point to로 말 대신 손가락으로 답하게 하면 통증이 심해 말하기 힘든 환자도 쉽게 답해요. 단, 다른 큰 손상이 통증에 가려질 수 있어서 그곳만 보지는 않아요.", d: "if you can", k: ["어디서 피가 나는지 가리켜 주세요", "아프지 않은 곳도 가리켜 주세요"], a: "exactly", o: ["roughly", "slowly", "gently"]}
  - {t: "압통 확인", i: magnify, w: "when I press here처럼 내 행동과 위치를 함께 말하면 환자가 눌리는 순간을 미리 알고 반응을 말해 줘요. 누를 때 아픈 곳은 골절이나 장기 손상을 의심하는 단서가 돼요.", d: "for you", k: ["여기가 저린지 말씀해 주세요", "여기 피부가 따가운지 말씀해 주세요"], a: "press", o: ["bend", "twist", "lift"]}
  - {t: "부위 질문", i: me, w: "Any pain in …?은 줄여 쓰는 구어 질문이라 급한 상황에서 빠르게 묻기 좋아요. 등과 배는 겉으로 안 보이는 출혈이나 장기 손상이 숨어 있을 수 있는 부위예요.", d: "after lunch", k: ["다리에 감각이 있나요?", "가슴이 답답하신가요?"], a: "belly", o: ["knee", "elbow", "ankle"]}
  - {t: "의식 확인", i: bell, w: "wide awake or feeling drowsy처럼 양쪽 상태를 말로 보여 주면 환자가 어느 쪽인지 고르기 쉬워요. 의식이 처지는 것은 출혈이나 머리 손상의 경고일 수 있어요.", d: "at all", k: ["졸릴 때 눈을 감지 말고 계세요", "지금이 몇 시인지 알려 주세요"], a: "drowsy", o: ["dizzy", "nauseous", "thirsty"]}
  - {t: "부위 기록", i: pencil, w: "I'm marking …은 지금 기록하는 중이라고 알려 환자가 같은 말을 되풀이하지 않아도 돼요. 아픈 부위를 한 장에 모아 두면 빠뜨린 부위를 나중에 찾기 쉬워요.", d: "for the doctor", k: ["아픈 부위 사진을 찍고 있어요", "아픈 부위마다 진통제를 놓을게요"], a: "chart", o: ["wristband", "monitor", "blanket"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "통증 부위 확인 4문장 순서"
    why: "의식을 확인하고, 그 답에 감사하며 아픈 곳을 짚게 한 뒤, 거기를 눌러 보고, 느낌을 차트에 적습니다. 'Thanks'·'there'·'when I pressed'가 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "Can you tell me if you're wide awake or drowsy?", icon: bell, ko: "완전히 깨어 있는지 졸린지 말씀해 주시겠어요?", note: "의식"}
    - {en: "Thanks, now point to where it hurts the most.", icon: pushpin, ko: "고마워요, 이제 가장 아픈 곳을 가리켜 주세요", note: "위치"}
    - {en: "I'm pressing gently right there, so tell me how that feels.", icon: magnify, ko: "바로 거기를 살살 누르고 있으니 어떤지 말씀해 주세요", note: "압통"}
    - {en: "I'm writing down how it felt when I pressed, on this chart.", icon: pencil, ko: "눌렀을 때 느낌을 이 차트에 적고 있어요", note: "기록"}
  ctx: {word: "owie", ko: "아픈 곳(아이 말투)"}
- title: "수상기전(MOI) 청취"
  s:
  - {t: "속도 질문", i: gear, w: "How fast …?는 숫자로 답할 수 있게 열어 둔 질문이라 환자가 대략의 속도를 말하기 쉬워요. 충돌 속도는 부상이 얼마나 클지 가늠하는 중요한 단서예요.", d: "on the road", k: ["차가 어느 쪽에서 부딪혔나요?", "차가 몇 대나 부딪혔나요?"], a: "fast", o: ["far", "heavy", "old"]}
  - {t: "안전벨트", i: shield, w: "Were you …?처럼 과거형으로 물으면 사고 당시를 묻는 것임이 분명해요. 안전벨트 착용 여부는 흉복부와 경추 손상 가능성을 가늠하는 정보라 외상 보고에 항상 들어가요.", d: "at the time", k: ["에어백이 터졌나요?", "차 문은 열려 있었나요?"], a: "seatbelt", o: ["helmet", "backpack", "jacket"]}
  - {t: "튕김 확인", i: siren, w: "at all을 붙이면 조금이라도 몸이 차 밖으로 나갔는지 묻는 것이라 '아니요'도 확실한 정보가 돼요. 차 밖으로 튕겨 나가면 심한 다발 손상 위험이 크게 올라가요.", d: "by the door", k: ["사고 뒤에 스스로 걸어 나왔나요?", "차 안에 다른 사람도 있었나요?"], a: "thrown", o: ["pulled", "lifted", "carried"]}
  - {t: "기억 확인", i: bulb, w: "Do you remember …?는 기억이 없을 수도 있다는 걸 열어 두는 질문이라 모른다고 대답해도 부담이 없어요. 사고 장면을 기억하지 못하면 머리 손상이나 의식 소실을 의심하는 단서가 돼요.", d: "from the start", k: ["충돌 직전에 무엇을 하고 계셨나요?", "충돌 뒤에 누가 구급차를 불렀나요?"], a: "crash", o: ["storm", "fire", "fight"]}
  - {t: "좌석 위치", i: me, w: "Which part of the car …?로 앉은 위치를 물으면 충돌 방향에 따라 다치기 쉬운 부위를 예측할 수 있어요. 운전석·조수석·뒷좌석에 따라 손상 양상이 달라요.", d: "on the road", k: ["차 안에 몇 명이 타고 있었나요?", "차가 몇 번 구르며 멈췄나요?"], a: "sitting", o: ["standing", "sleeping", "kneeling"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수상기전 청취 4문장 순서"
    why: "속도를 먼저 묻고, 그 속도에서 벨트를 맸는지, 벨트가 잡아 줬는지 튕겼는지를 묻고, 전부를 바탕으로 기억을 묻습니다. 'that speed'·'the belt'·'all of that'이 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "Can you tell me how fast the car was going?", icon: gear, ko: "차가 얼마나 빠르게 가고 있었는지 말씀해 주시겠어요?", note: "속도"}
    - {en: "Thanks, and were you wearing a seatbelt at that speed?", icon: shield, ko: "고마워요, 그 속도에서 안전벨트를 매고 계셨나요?", note: "벨트"}
    - {en: "Did the belt hold you in, or were you thrown from the vehicle at all?", icon: siren, ko: "벨트가 잡아 줬나요, 아니면 차 밖으로 튕겨나가셨나요?", note: "튕김"}
    - {en: "After all of that, do you remember how the crash ended?", icon: bulb, ko: "그 모든 일 뒤에 충돌이 어떻게 끝났는지 기억하세요?", note: "기억"}
  sw: {ko: "차량 밖으로 튕겨나가셨나요?"}
- title: "둔상 다발외상 트리아지"
  s:
  - {t: "상황 안내", i: siren, w: "both of you로 두 사람 모두 지금 살펴보고 있다고 알려야 한 사람이 방치됐다고 느끼지 않아요. 여러 명이 다치면 생명 위협이 있는지부터 빠르게 훑어요.", d: "one by one", k: ["두 분 모두 CT를 찍을 거예요", "두 분 가족께 연락했어요"], a: "assessing", o: ["calling", "thanking", "warning"]}
  - {t: "우선 확인", i: bell, w: "who로 사람을 물으면 환자들이 서로를 가리킬 수 있어요. 숨쉬기 힘든 사람과 심하게 출혈하는 사람은 가장 먼저 도움이 필요한 환자로 가려내요.", d: "at the scene", k: ["누가 운전하고 있었는지 말씀해 주세요", "누가 먼저 다쳤는지 말씀해 주세요"], a: "heavily", o: ["slowly", "lightly", "rarely"]}
  - {t: "팀 배분", i: star, w: "The team이 주어라 내가 아니라 팀이 맡는다는 말로 안심시켜요. 여러 명이 다치면 팀을 나눠 환자마다 한 명씩 붙이는 것이 흔한 방식이에요.", d: "for lunch", k: ["보호자분께 연락할게요", "사고 경위를 경찰이 물을 거예요"], a: "dividing up", o: ["lining up", "speeding up", "giving up"]}
  - {t: "동행인 안내", i: me, w: "is being cared for처럼 지금 진행 중인 수동태로 말하면 누가 하는지보다 돌봄이 이루어지고 있다는 점이 앞에 서요. 동행인이 걱정되면 자기 사정에 집중하기 어려워서 먼저 알려 줘요.", d: "at home", k: ["친구분 연락처를 알려 주시겠어요?", "친구분이 어디를 다치셨는지 아세요?"], a: "nurse", o: ["officer", "driver", "stranger"]}
  - {t: "소식 약속", i: bell, w: "as soon as I know more로 시각 대신 알게 되는 즉시라고 약속해 지킬 수 없는 시간 약속을 피해요. 응급 상황에서는 상태가 계속 바뀌어 정확한 시간을 말하기 어려워요.", d: "every day", k: ["친구분이 다치신 경위를 적어 둘게요", "친구분 가족에게 먼저 알릴게요"], a: "update", o: ["warn", "thank", "visit"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "두 환자 트리아지 4문장 순서"
    why: "두 사람을 살피고 있다고 알리고, 그동안 누가 위급한지 묻고, 답에 감사하며 친구 상황을 알린 뒤, 소식을 약속합니다. 'that'·'Thanks for telling me'·'that'이 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "We're assessing both of you right now.", icon: siren, ko: "지금 두 분 모두 사정하고 있어요", note: "안내"}
    - {en: "While we do that, tell me who has trouble breathing or is bleeding heavily.", icon: bell, ko: "그동안 누가 숨쉬기 힘든지, 심하게 출혈되는지 말씀해 주세요", note: "확인"}
    - {en: "Thanks for telling me—your friend is with another nurse now.", icon: me, ko: "알려 줘서 고마워요, 친구분은 지금 다른 간호사와 있어요", note: "안심"}
    - {en: "I'll update you on that as soon as I know more.", icon: bell, ko: "더 알게 되는 대로 그 일을 알려 드릴게요", note: "약속"}
  ctx: {word: "triaged", ko: "응급도 분류를 받은"}
