- title: 천공성 궤양(판자복부)
  sw: {ko: "배가 아주 딱딱해요, 심각한 징후예요"}
  s:
  - {t: "소견 설명", i: stetho, w: "board-like 같은 전문 표현 대신 very rigid로 쉽게 말하고, which is…로 왜 중요한지 덧붙여요. 판자처럼 단단한 배는 복막염을 의심하는 소견이에요.", d: "since you arrived", k: ["지금 외과 선생님께 보고할게요", "열이 있었나요?"], a: "rigid", o: ["warm", "pale", "itchy"]}
  - {t: "자세 안내", i: check, w: "to reduce the pain으로 가만히 누워 있는 이유를 붙여요. 움직이면 복막이 자극되어 더 아플 수 있어서 안정을 도와요.", d: "in the hallway", k: ["수술실을 준비하고 있어요", "금식을 유지하세요"], a: "flat", o: ["warm", "upright", "awake"]}
  - {t: "보고 안내", i: speech, w: "SBAR는 상황·배경·평가·권고 순으로 짧게 보고하는 틀이에요. 환자 앞에서 보고한다고 알리면 방치되지 않는다고 느껴요.", d: "tomorrow", k: ["움직이지 말고 가만히 계세요", "열이 있는지 확인할게요"], a: "surgeon", o: ["radiologist", "pharmacist", "chaplain"]}
  - {t: "동반 증상", i: faceWorried, w: "열은 복강 안 염증이 퍼졌는지, 숨참은 호흡이나 다른 장기 문제가 겹쳤는지 가늠하는 질문이에요.", d: "last night", k: ["배가 딱딱해요", "수술팀에 연락할게요"], a: "fever", o: ["bruise", "cough", "rash"]}
  - {t: "수술 안내", i: scalpel, w: "needs to로 필요성을 말하고 as soon as possible로 시간이 중요하다고 알려요. 천공은 수술이 필요한 경우가 많아 시간이 중요해요.", d: "on the unit", k: ["지금은 아무것도 드시지 마세요", "SBAR로 보고했어요"], a: "operate", o: ["discharge", "transfer", "observe"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "천공 의심 급성 복증 4문장 순서"
    why: "단단한 배가 심각한 징후임을 먼저 알리고, 그 징후 때문에 외과에 SBAR로 보고하고, 외과를 기다리는 동안 가만히 누워 있게 하고, 그 보고를 바탕으로 수술 가능성을 안내해요. 'that sign'·'the surgeon'·'that report'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your belly is very rigid, which is a serious sign.", icon: stetho, ko: "배가 아주 딱딱해요, 이건 심각한 징후예요", note: "소견"}
    - {en: "Because of that sign, I'm calling the surgeon now with an SBAR report.", icon: speech, ko: "그 징후 때문에 지금 SBAR 형식으로 외과 선생님께 보고할게요", note: "보고"}
    - {en: "Since you'll be waiting for the surgeon, we're going to keep you flat and still to reduce the pain.", icon: check, ko: "외과 선생님을 기다리시는 동안 통증을 줄이려고 눕히고 가만히 계시게 할게요", note: "자세"}
    - {en: "Based on that report, the team may need to operate as soon as possible.", icon: scalpel, ko: "그 보고를 바탕으로 팀이 최대한 빨리 수술해야 할 수도 있어요", note: "수술"}
- title: 담관염(Charcot 3징)
  sw: {ko: "담관을 배액하기 위해 ERCP라는 시술이 필요할 수도 있어요"}
  s:
  - {t: "황달 확인", i: magnify, w: "jaundice 대신 skin or eyes turning yellow라고 풀어 물어요. 피부와 눈 흰자가 노래지는 것은 담즙이 막혔을 때 나타나는 흔한 신호예요.", d: "overnight", k: ["열이 나나요?", "오른쪽 갈비뼈 아래가 아픈가요?"], a: "yellow", o: ["red", "dry", "itchy"]}
  - {t: "중요성 설명", i: siren, w: "that we take seriously로 환자의 증상을 가볍게 보지 않는다고 알려요. 열·황달·오른쪽 윗배 통증이 함께 있으면 담관염을 떠올려 서둘러 확인해요.", d: "for now", k: ["황달이 있는지 볼게요", "항생제를 시작할게요"], a: "right-sided", o: ["left-sided", "chest", "muscle"]}
  - {t: "시술 안내", i: scalpel, w: "이름이 어려운 시술은 a procedure called…로 소개하고 목적(to drain)을 이어 말해요. ERCP는 내시경으로 막힌 담관을 뚫는 시술이에요.", d: "in your arm", k: ["항생제를 바로 시작할게요", "금식하셔야 해요"], a: "drain", o: ["seal", "shrink", "replace"]}
  - {t: "통증 위치", i: pushpin, w: "sit mostly on처럼 통증이 머무는 자리를 말하게 해요. 오른쪽 갈비뼈 아래는 담낭과 담관 통증의 대표 위치예요.", d: "all night", k: ["피부가 노래졌나요?", "열은 있나요?"], a: "right", o: ["left", "back", "front"]}
  - {t: "치료 안내", i: pill, w: "to treat the infection으로 약의 목적을 말해요. 담관염은 감염이라 항생제를 빨리 시작하는 것이 치료의 핵심이에요.", d: "tomorrow", k: ["내시경 시술을 설명해 드릴게요", "통증약도 드릴게요"], a: "antibiotics", o: ["laxatives", "vitamins", "sedatives"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "담관염 의심 4문장 순서"
    why: "통증 위치를 먼저 묻고, 그 통증과 함께 황달을 확인하고, 열과 합쳐 감염이라 항생제를 시작한다고 알리고, 항생제 말고 시술이 필요할 수 있다고 안내해요. 'that pain'·'that's why'·'Beyond antibiotics'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Does your pain sit mostly on your right side, under the ribs?", icon: pushpin, ko: "통증이 주로 오른쪽, 갈비뼈 아래쪽에 있나요?", note: "위치"}
    - {en: "Along with that pain, have you noticed your skin or eyes turning yellow?", icon: magnify, ko: "그 통증과 함께 피부나 눈이 노랗게 변한 걸 알아차리셨나요?", note: "황달"}
    - {en: "Together with your fever, that's why we'll start antibiotics right away to treat the infection.", icon: pill, ko: "열과 합쳐서, 그래서 감염을 치료하려고 바로 항생제를 시작할게요", note: "항생제"}
    - {en: "Beyond antibiotics, you may need a procedure called ERCP to drain the bile duct.", icon: scalpel, ko: "항생제 말고도 담관을 배액하는 ERCP 시술이 필요할 수도 있어요", note: "시술"}
- title: 급성 복증 급속악화
  s:
  - {t: "상황 설명", i: monitor, w: "has dropped는 이미 일어난 변화를 말하는 현재완료예요. so로 이어 우리가 서두르는 이유를 한 문장에 담아요.", d: "an hour ago", k: ["지금 팀을 부르고 있어요", "수액을 시작할게요"], a: "dropped", o: ["risen", "steadied", "improved"]}
  - {t: "정신 붙잡기", i: faceWorried, w: "Stay with me는 환자에게 정신 놓지 마세요, 계속 대답해 주세요라는 뜻이에요. 뒤의 I'm calling…으로 곁을 지키며 도움을 부르고 있다고 알려요.", d: "on my phone", k: ["혈압이 떨어졌어요", "수액을 바로 시작할게요"], a: "calling", o: ["waiting", "looking", "asking"]}
  - {t: "즉시 조치", i: hospital, w: "immediately는 right away보다 더 급박한 느낌이에요. 혈압이 떨어진 환자는 수액과 산소로 먼저 상태를 지지해요.", d: "before dinner", k: ["혈압이 낮아졌어요", "팀을 부를게요"], a: "oxygen", o: ["insulin", "antibiotics", "food"]}
  - {t: "악화 알림", i: bell, w: "right away로 기다리지 말고 바로 말해 달라고 해요. any worse는 조금이라도라서 작은 변화도 알려 달라는 뜻이에요.", d: "at home", k: ["팀이 곧 올 거예요", "수액이 들어가고 있어요"], a: "worse", o: ["warmer", "colder", "heavier"]}
  - {t: "치료 목적", i: chartup, w: "to bring…back up으로 수액의 목적을 쉽게 풀어요. pressure는 blood pressure를 줄인 말이고, 환자에게는 이 편이 덜 무섭게 들려요.", d: "to the unit", k: ["산소도 시작했어요", "혈압이 떨어졌어요"], a: "pressure", o: ["temperature", "sugar", "pulse"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "급속 악화 복증 대응 4문장 순서"
    why: "혈압이 떨어졌음을 먼저 알리고, 그래서 곁에서 팀을 부르고, 그 팀이 수액을 시작한다고 말하고, 그들이 무엇을 하든 악화되면 바로 알려 달라고 해요. 'Because of that'·'the team'·'they'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your blood pressure has dropped, so we're acting quickly.", icon: monitor, ko: "혈압이 떨어져서 저희가 빠르게 대응하고 있어요", note: "상황"}
    - {en: "Because of that, stay with me — I'm calling for the team right now.", icon: faceWorried, ko: "그래서 정신 놓지 마세요, 지금 바로 팀을 부를게요", note: "호출"}
    - {en: "The team is starting fluids to bring your pressure back up.", icon: chartup, ko: "팀이 혈압을 다시 끌어올리기 위해 수액을 시작하고 있어요", note: "수액"}
    - {en: "Whatever they do, tell me right away if you feel any worse.", icon: bell, ko: "그들이 무엇을 하든 더 안 좋아지면 바로 말씀해 주세요", note: "알림"}
- title: 다발외상 동반 복강내출혈
  sw: {ko: "사고로 어디가 가장 아픈지 말씀해 주세요"}
  s:
  - {t: "FAST 안내", i: monitor, w: "called a FAST exam으로 이름을 뒤에 붙여 환자가 쉬운 설명을 먼저 듣게 해요. FAST는 외상 환자에게 배 안에 피가 고였는지 빠르게 보는 초음파예요.", d: "in your arm", k: ["어디가 가장 아픈지 말씀해 주세요", "혈액을 준비하고 있어요"], a: "quick", o: ["slow", "long", "scheduled"]}
  - {t: "통증 부위", i: pushpin, w: "from the crash로 사고와 연결해 물으면 환자가 다친 곳을 떠올리기 쉬워요. 가장 아픈 곳이 가장 심한 손상은 아닐 수 있어서 여러 곳을 함께 살펴요.", d: "since morning", k: ["수혈 준비 중이에요", "초음파로 배를 볼게요"], a: "crash", o: ["fall", "fight", "lift"]}
  - {t: "수혈 대비", i: lab, w: "in case로 필요할 수도 있다는 대비임을 밝혀 불안을 줄여요. 복강 내 출혈이 의심되면 수혈에 대비해 혈액을 준비해 두는 게 보통이에요.", d: "for the OR", k: ["외상팀이 와 있어요", "혈압과 맥박을 확인할게요"], a: "a transfusion", o: ["an injection", "a splint", "a catheter"]}
  - {t: "활력징후 의미", i: chartup, w: "수치가 의미하는 바를 tell us…로 알려 환자가 왜 자꾸 재는지 이해해요. 혈압이 떨어지고 맥박이 빨라지면 출혈량이 많을 수 있다는 단서예요.", d: "every minute", k: ["초음파로 배를 볼게요", "수혈 준비를 하고 있어요"], a: "pulse", o: ["weight", "height", "age"]}
  - {t: "팀 안심", i: hospital, w: "is here로 이미 와 있다고 말하면 환자가 혼자가 아니라고 느껴요. 외상 환자에게는 팀이 도착했음을 소리 내어 알려요.", d: "in the hallway", k: ["어디가 아픈지 알려 주세요", "수혈이 필요할 수도 있어요"], a: "trauma", o: ["radiology", "pharmacy", "dietary"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "외상 복강내출혈 4문장 순서"
    why: "외상팀이 와 있다고 알리고, 그 팀이 FAST를 하고, 그 검사와 활력징후가 심각도를 알려 주고, 심각할 경우를 대비해 혈액을 준비한다고 말해요. 'They'·'that scan'·'that could be serious'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "The trauma team is here to help you right now.", icon: hospital, ko: "외상팀이 지금 바로 도와드리러 왔어요", note: "안심"}
    - {en: "They're doing a quick ultrasound of your belly called a FAST exam.", icon: monitor, ko: "그분들이 배에 빠른 초음파, 즉 FAST 검사를 하고 있어요", note: "검사"}
    - {en: "Together with that scan, your blood pressure and pulse tell us how serious this is.", icon: chartup, ko: "그 검사와 함께 혈압과 맥박을 보면 얼마나 심각한지 알 수 있어요", note: "심각도"}
    - {en: "Because that could be serious, we're getting blood ready for a transfusion.", icon: lab, ko: "그게 심각할 수 있어서 수혈용 혈액을 준비하고 있어요", note: "혈액"}
