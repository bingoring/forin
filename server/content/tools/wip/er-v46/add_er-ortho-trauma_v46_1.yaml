- title: 사지 손상 초기 사정
  s:
  - {t: "진찰 안내", i: magnify, w: "look at and gently check로 보는 것과 만지는 것을 나눠 말하면, 아픈 팔에 손이 닿는 순간을 환자가 미리 알아요. gently는 만지는 방식을 먼저 약속하는 말이에요.", d: "after the x-ray", k: ["손목 맥박부터 짚어 볼게요", "팔에 부목을 대 드릴게요"], a: "gently", o: ["roughly", "hastily", "suddenly"]}
  - {t: "상처 확인", i: bandage, w: "any open cut or just …로 두 갈래를 주면 환자가 보이는 대로 고를 수 있어요. 피부가 열려 있는지는 감염 위험과 치료 방향을 가르는 첫 구분이에요.", d: "at the elbow", k: ["어디에 부딪히셨는지 말씀해 주세요", "붓기가 언제부터 시작됐나요?"], a: "open", o: ["closed", "sealed", "healed"]}
  - {t: "압통 확인", i: pushpin, w: "when I touch로 만지는 순간을 짚어 주면 환자가 가만히 있다가 아픈 곳에서 바로 알릴 수 있어요. tender는 누르거나 만질 때 아픈 것을 가리켜요.", d: "after you stand", k: ["팔을 한번 들어 보세요", "통증이 몇 점인가요?"], a: "tender", o: ["sticky", "itchy", "stiff"]}
  - {t: "위치 짚기", i: pushpin, w: "show me exactly로 말로 설명하기 힘든 통증 위치를 손가락으로 답하게 해요. Can you …?는 지시보다 부드러운 부탁이라 아픈 환자도 거부감이 적어요.", d: "with your good hand", k: ["손가락을 움직여 보시겠어요?", "언제부터 아팠는지 말씀해 주세요"], a: "hurts", o: ["itches", "bleeds", "swells"]}
  - {t: "변형 설명", i: magnify, w: "compared to the other side로 비교 기준을 말해 주면 변형이 막연한 겁이 아니라 반대쪽과 다르다는 관찰로 들려요. a little로 수위를 낮춰 환자가 놀라지 않게 해요.", d: "since this morning", k: ["반대쪽 팔도 볼게요", "팔을 움직이지 마세요"], a: "deformed", o: ["healed", "rested", "cleaned"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "사지 손상 사정 4문장 순서"
    why: "눈으로 보겠다고 먼저 알리고, 그 사이 아픈 곳을 가리키게 한 뒤, 그 지점 주변을 만지며 압통을 묻고, 마지막에 찾은 것을 기록한다고 마무리해요. 'do that'·'that spot'·'everything we found'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to look at your arm first, and I'll be gentle.", icon: magnify, ko: "먼저 팔을 살펴볼게요, 살살 할게요", note: "안내"}
    - {en: "As I do that, point to the spot that hurts the most.", icon: pushpin, ko: "그러는 동안 가장 아픈 곳을 가리켜 주세요", note: "위치"}
    - {en: "Now I'll gently touch around that spot, so tell me where it's most tender.", icon: me, ko: "이제 그 지점 주변을 살살 만질게요, 가장 아픈 곳을 말씀해 주세요", note: "압통"}
    - {en: "Thanks, I'll write down everything we found for the doctor.", icon: pencil, ko: "고마워요, 확인한 것을 모두 의사 선생님께 드릴 기록에 적을게요", note: "기록"}
  sw: null
- title: 신경혈관(5P) 확인
  s:
  - {t: "감각 확인", i: me, w: "feel me touching처럼 환자가 느끼는 것을 주어로 물어서, 눈을 감고 있어도 대답할 수 있어요. 감각이 있는지는 신경이 손상됐는지 보는 확인이에요.", d: "on your shoulder", k: ["손가락 색깔이 어떤가요?", "손가락을 꼼지락거려 보세요"], a: "feel", o: ["see", "hear", "imagine"]}
  - {t: "운동 확인", i: me, w: "for me는 부탁하는 말투고 if you can은 아프면 무리하지 않아도 된다는 여지를 줘요. 손가락과 발가락이 움직이는지는 신경과 근육이 살아 있는지 보는 확인이에요.", d: "one at a time", k: ["제 손을 힘껏 잡아 보세요", "손가락이 저린가요?"], a: "Wiggle", o: ["Wave", "Tap", "Fold"]}
  - {t: "맥박 확인", i: stetho, w: "below your injury로 어디를 짚는지 말해 줘요. 손상 아래쪽 맥박은 혈류가 이어지는지 보는 기본 확인이라, 이유 없이 손목을 잡는 것처럼 느끼지 않게 해요.", d: "above your shoulder", k: ["발가락 색깔을 보고 있어요", "손목을 움직이지 마세요"], a: "pulse", o: ["pressure", "temperature", "size"]}
  - {t: "색 확인", i: magnify, w: "from the other side로 반대쪽을 기준 삼게 해서, 환자가 다르다는 것을 스스로 판단할 수 있어요. 창백하거나 푸르스름한 색은 혈류가 줄었다는 단서예요.", d: "since this morning", k: ["손가락을 꼼지락거려 보세요", "어디가 가장 아픈가요?"], a: "color", o: ["texture", "temperature", "thickness"]}
  - {t: "근력 확인", i: me, w: "as hard as you can는 최대한이라는 기준을 줘서 양손의 힘을 같은 조건에서 비교할 수 있어요. on both hands로 좌우를 모두 시키는 것도 비교를 위해서예요.", d: "for a long time", k: ["손끝이 차가운지 만져 볼게요", "숨을 깊게 쉬어 보세요"], a: "Squeeze", o: ["Release", "Drop", "Tap"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "5P 확인 4문장 순서"
    why: "무엇을 확인할지 먼저 알리고, 만지는 감각을 묻고, 'them'으로 이어서 손가락을 움직이게 한 뒤, 마지막에 'all of that'으로 반대쪽과 비교한다고 닫아요. 'them'·'all that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to check a few things in your hand, starting with the pulse.", icon: stetho, ko: "맥박부터 손의 몇 가지를 확인할게요", note: "안내"}
    - {en: "Tell me if you feel my touch on your fingers.", icon: me, ko: "손가락에 제 손길이 느껴지면 말씀해 주세요", note: "감각"}
    - {en: "Good, now wiggle them for me as best you can.", icon: me, ko: "좋아요, 이제 그 손가락들을 최대한 꼼지락거려 보세요", note: "운동"}
    - {en: "Thanks, I'll compare all of that with your other hand.", icon: magnify, ko: "고마워요, 그 모든 걸 반대쪽 손과 비교할게요", note: "비교"}
  sw: null
- title: 부목 고정 설명
  s:
  - {t: "이유 설명", i: bandage, w: "so it can heal로 부목의 이유를 먼저 말해 주면 움직이지 말라는 지시가 납득돼요. 뼈가 움직이지 않아야 제자리에서 붙는다는 설명이라 환자 협조를 이끌어요.", d: "while you walk", k: ["부목 위에 얼음을 올릴게요", "다리를 높이 올려 주세요"], a: "still", o: ["loose", "dry", "wide"]}
  - {t: "활동 제한", i: lock, w: "move or put weight on으로 움직임과 체중 싣기를 나눠 말해, 앉아서 다리를 흔드는 것도 안 된다는 범위를 분명히 해요. Please로 금지 지시를 부드럽게 시작해요.", d: "until tomorrow", k: ["다리를 심장보다 높게 올려 두세요", "다리가 저리면 바로 말씀해 주세요"], a: "weight", o: ["tape", "water", "oil"]}
  - {t: "경고 증상", i: bell, w: "feels too tight or numb로 환자가 느끼는 증상을 그대로 말하게 해요. 부목이 너무 조이면 혈류가 줄 수 있어서 환자가 직접 알려야 빨리 풀 수 있어요.", d: "after you sleep", k: ["부목은 며칠 뒤에 풀 거예요", "통증이 0에서 10 중 몇 점이에요?"], a: "tight", o: ["heavy", "hot", "wet"]}
  - {t: "순환 확인", i: monitor, w: "every hour로 확인 주기를 약속해 두면 환자가 기다리며 불안해하지 않아요. 색과 온기는 부목 아래쪽으로 혈류가 가는지 보는 단서예요.", d: "with ice", k: ["발가락 움직임을 볼게요", "부목 아래 붕대를 갈아 드릴게요"], a: "color", o: ["weight", "length", "shape"]}
  - {t: "퇴원 교육", i: home, w: "at home을 끝에 붙여 병원 밖에서도 이어 가야 한다는 점을 분명히 해요. 다리를 올려 두면 붓기가 줄어 부목 안이 덜 조여요.", d: "on the stairs", k: ["내일 다시 와서 부목을 확인하세요", "샤워할 때는 부목을 덮으세요"], a: "raised", o: ["bent", "crossed", "hanging"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "부목 설명 4문장 순서"
    why: "부목을 댄다고 알리고, 'It'으로 이유와 체중 제한을 말한 뒤, 'Even when careful'로 지켜도 생길 수 있는 경고 증상을 알리고, 마지막에 'Either way'로 매시간 확인을 약속해요. 'It'·'Even when you're careful'·'Either way'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to put a splint on your leg now.", icon: bandage, ko: "지금 다리에 부목을 댈게요", note: "안내"}
    - {en: "It keeps the bone still, so please don't put weight on it.", icon: shield, ko: "뼈를 가만히 잡아 주니 체중을 싣지 마세요", note: "이유"}
    - {en: "Even when careful, tell me if it feels too tight or your toes feel numb.", icon: bell, ko: "조심해도 너무 조이거나 발가락이 저리면 말씀해 주세요", note: "경고"}
    - {en: "Either way, I'll check your toes every hour.", icon: monitor, ko: "어느 쪽이든 한 시간마다 발가락을 확인할게요", note: "확인"}
  sw: {ko: "발가락이 찌릿하거나 저리면 바로 말씀해 주세요."}
- title: 통증 척도·기전 청취
  s:
  - {t: "기전 질문", i: magnify, w: "exactly를 끝에 붙여 대충 말고 자세히 말해 달라는 뜻을 전해요. 어떻게 다쳤는지에 따라 함께 다쳤을 수 있는 곳이 달라서 첫 질문으로 물어요.", d: "at work", k: ["지금 통증이 몇 점이에요?", "마지막으로 드신 게 언제예요?"], a: "happen", o: ["heal", "spread", "change"]}
  - {t: "통증 점수", i: chartup, w: "zero to ten으로 범위를 정해 줘서 숫자로 답하기 쉬워요. 같은 숫자를 나중에 다시 물으면 진통제가 듣는지 비교할 수 있어요.", d: "at rest", k: ["통증이 언제 시작됐나요?", "어디가 제일 아픈지 짚어 주세요"], a: "scale", o: ["map", "list", "menu"]}
  - {t: "통증 양상", i: faceWorried, w: "보기를 직접 주면 통증을 말로 설명하기 어려운 환자도 고르기만 하면 돼요. 날카로운 통증과 욱신거리는 통증은 원인이 달라서 구별해서 물어요.", d: "or itchy", k: ["통증이 가슴 쪽으로 퍼지나요?", "통증이 언제 가장 심한가요?"], a: "throbbing", o: ["itching", "tingling", "freezing"]}
  - {t: "기전 선택", i: compass, w: "fall과 something heavy land on it, 두 가지 가능성을 보여 줘서 네/아니오보다 구체적으로 답하게 해요. 넘어졌는지 눌렸는지에 따라 함께 다친 곳이 달라져요.", d: "or did you jump", k: ["얼마나 높은 곳이었어요?", "누가 같이 있었나요?"], a: "heavy", o: ["hot", "wet", "loud"]}
  - {t: "높이 확인", i: pushpin, w: "how high you fell from처럼 의문사 뒤를 평서문 어순으로 이으면 지시문 안에서도 질문이 정중해져요. 떨어진 높이는 부상 정도를 가늠하는 기준이에요.", d: "last night", k: ["얼마나 아픈지 말씀해 주세요", "어디를 먼저 다쳤는지 알려 주세요"], a: "high", o: ["warm", "loud", "wide"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "기전·통증 청취 4문장 순서"
    why: "'First'로 무슨 일이 있었는지 알고 싶다고 시작하고, 넘어졌는지 물체가 떨어졌는지 묻고, 'Whichever it was'로 높이나 무게를 묻고, 'Last'로 통증 점수를 물어요. 'First'·'Whichever it was'·'Last'가 위치를 정해 줘서 순서가 하나예요."
    lines:
    - {en: "First, I need to understand how this happened.", icon: magnify, ko: "먼저 이게 어떻게 생겼는지 알아야 해요", note: "안내"}
    - {en: "Did you fall, or did something land on it?", icon: compass, ko: "넘어지셨나요, 아니면 뭔가 떨어졌나요?", note: "기전"}
    - {en: "Whichever it was, tell me exactly how high or how heavy.", icon: pushpin, ko: "어느 쪽이든 정확히 얼마나 높거나 무거웠는지 말씀해 주세요", note: "정도"}
    - {en: "Last, on a scale of zero to ten, how bad is the pain?", icon: chartup, ko: "마지막으로 0에서 10 중 통증이 얼마나 심하세요?", note: "통증"}
  sw: null
- title: RICE·거상 교육
  s:
  - {t: "거상 교육", i: home, w: "above your heart로 높이의 기준을 심장으로 주면 몇 센티를 올려야 하는지 몰라도 따라 할 수 있어요. 다친 곳을 심장보다 높이면 붓기가 빠지는 데 도움이 돼요.", d: "when walking", k: ["붕대는 너무 조이지 않게 감으세요", "얼음은 천으로 싸서 대세요"], a: "raised", o: ["lowered", "bent", "dangling"]}
  - {t: "냉찜질", i: bandage, w: "at a time과 a few times a day로 한 번의 길이와 하루 횟수를 따로 알려 줘요. 얼음을 너무 오래 대면 피부가 상할 수 있어서 시간을 정해 줘요.", d: "right after you eat", k: ["아플 때 진통제를 드세요", "다리를 심장보다 높이 올리세요"], a: "ice", o: ["tape", "soap", "gauze"]}
  - {t: "재방문 기준", i: bell, w: "much worse로 조금 불편한 정도가 아니라 눈에 띄게 나빠졌을 때가 기준이라고 선을 그어 줘요. 언제 다시 와야 하는지를 아는 것은 퇴원 교육에서 중요해요.", d: "in the morning", k: ["내일 아침에 다시 확인해 드릴게요", "붓기가 가라앉으면 알려 주세요"], a: "worse", o: ["better", "lighter", "smaller"]}
  - {t: "압박 붕대", i: bandage, w: "but not too tight를 덧붙여 조임의 상한을 알려 줘요. 너무 조이면 아래쪽으로 피가 덜 가서 저리거나 붓거나 창백해질 수 있어요.", d: "every hour", k: ["붕대 위에 얼음을 올리세요", "붕대가 젖으면 바로 갈아 주세요"], a: "tight", o: ["hot", "wet", "wide"]}
  - {t: "휴식 교육", i: home, w: "stay off는 딛지 않는다를 짧게 말한 구어체예요. as much as you can는 완벽하지 않아도 최대한 하라는 말이라 환자가 부담 없이 따라와요.", d: "for a week", k: ["발을 높이 올리고 계세요", "내일 외래에 오세요"], a: "rest", o: ["stretch", "bounce", "scratch"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "발목 손상 교육 4문장 순서"
    why: "'First'로 쉬게 하는 것부터 시작하고, 'With your foot rested'로 이어 얼음을, 'Between icing sessions'로 붕대를, 'Last'로 쉴 때 높이 올리는 것을 말해요. 앞 줄을 가리키는 말과 'First'·'Last'가 위치를 정해서 순서가 하나예요."
    lines:
    - {en: "First, stay off your foot as much as you can.", icon: home, ko: "먼저 발을 최대한 딛지 마세요", note: "휴식"}
    - {en: "With your foot rested, put ice on it for twenty minutes at a time.", icon: bandage, ko: "발을 쉬게 한 상태에서 한 번에 20분씩 얼음을 대세요", note: "냉찜질"}
    - {en: "Between icing sessions, wrap it with a bandage, but not too tight.", icon: bandage, ko: "얼음찜질 사이에는 붕대를 감되 너무 조이지 마세요", note: "압박"}
    - {en: "Last, whenever you rest, keep the ankle above your heart.", icon: home, ko: "마지막으로 쉴 때는 발목을 심장보다 높게 두세요", note: "거상"}
  sw: null
- title: 개방골절 감염 예방
  s:
  - {t: "상처 덮기", i: bandage, w: "right away는 열린 상처를 오래 드러내 두지 않겠다는 약속이에요. 멸균 드레싱은 개방골절의 오염을 줄이기 위해 가장 먼저 하는 조치 중 하나예요.", d: "with a towel", k: ["상처 크기를 재 볼게요", "항생제 알레르기가 있나요?"], a: "sterile", o: ["dirty", "wet", "stiff"]}
  - {t: "예방 설명", i: pill, w: "to prevent infection으로 항생제를 주는 목적을 말해 줘요. 개방골절은 감염 위험이 커서 항생제를 되도록 일찍 시작해요.", d: "for the pain", k: ["진통제를 정맥으로 드릴게요", "수액을 연결하고 있어요"], a: "prevent", o: ["cause", "spread", "hide"]}
  - {t: "접종 확인", i: calendar, w: "When was your last …?로 정확한 날짜가 아니라 대략의 시기를 떠올리게 해요. 오염된 상처는 마지막 파상풍 접종이 5년을 넘었으면 추가 접종을 고려해요.", d: "at school", k: ["어떻게 다치셨는지 말씀해 주세요", "알레르기가 있는 약이 있나요?"], a: "shot", o: ["test", "scan", "visit"]}
  - {t: "세척 이유", i: magnify, w: "We can see the bone이라는 이유를 앞에 두고 so로 이어, 철저히 씻는 것이 왜 필요한지 이해시켜요. 개방골절은 오염된 상처라 세척이 중요해요.", d: "with your hand", k: ["지금 바로 수술장으로 가요", "뼈를 만지지 마세요"], a: "clean", o: ["sew", "scratch", "measure"]}
  - {t: "진료 순서", i: scalpel, w: "before we close the skin으로 순서를 알려 주면, 피부를 닫기 전에 의사가 뼈를 직접 본다는 그림이 그려져요.", d: "after the x-ray", k: ["엑스레이를 먼저 찍을게요", "상처는 이미 소독했어요"], a: "close", o: ["open", "stretch", "press"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "개방골절 감염 예방 4문장 순서"
    why: "뼈가 보여서 바로 덮는다고 알리고, 항생제를 주는 이유를 말한 뒤, 'For the same reason'으로 파상풍 접종을 묻고, 'With all that done'으로 의사가 뼈를 본다고 이어요. 'For the same reason'·'all that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We can see the bone, so I'm covering the wound with a sterile dressing now.", icon: bandage, ko: "뼈가 보여서 지금 멸균 드레싱으로 상처를 덮고 있어요", note: "덮기"}
    - {en: "You'll get antibiotics to help prevent infection.", icon: pill, ko: "감염을 막는 데 도움이 되도록 항생제를 맞으실 거예요", note: "예방"}
    - {en: "For the same reason, when was your last tetanus shot?", icon: calendar, ko: "같은 이유로 마지막 파상풍 주사는 언제 맞으셨나요?", note: "접종"}
    - {en: "With all that done, the doctor will check the bone before we close the skin.", icon: scalpel, ko: "그게 다 끝나면 피부를 닫기 전에 의사가 뼈를 확인할 거예요", note: "진료"}
  sw: null
- title: 원위부 맥박 소실 골절
  s:
  - {t: "긴급 알림", i: siren, w: "so로 이유와 행동을 이어서, 서두르는 것이 불안한 선언이 아니라 설명으로 들려요. 골절 아래쪽 맥박이 없으면 혈류가 막혔을 수 있다는 신호라 시간이 중요해요.", d: "like before", k: ["발에 얼음을 대 드릴게요", "발가락이 움직이는지 볼게요"], a: "act", o: ["wait", "rest", "stop"]}
  - {t: "원인 설명", i: bulb, w: "may be로 아직 확정이 아닌 가능성이라는 것을 알려 줘요. 부러진 뼈 끝이 혈관을 누르면 그 아래쪽으로 가는 혈류가 줄 수 있어요.", d: "behind the knee", k: ["혈관에 주사를 놓을게요", "피가 많이 나고 있어요"], a: "pressing", o: ["tapping", "sliding", "waiting"]}
  - {t: "치료 계획", i: play, w: "to restore blood flow로 치료의 목적을 말해 줘요. 뼈를 제자리로 맞추면 눌려 있던 혈관이 풀려 혈류가 돌아올 수 있어요.", d: "by tomorrow", k: ["진통제를 먼저 놓을게요", "발에 맥박이 있는지 다시 볼게요"], a: "restore", o: ["stop", "reduce", "block"]}
  - {t: "소견 설명", i: faceWorried, w: "feels cold과 looks pale처럼 느낌과 보이는 것을 나눠 말하면 환자가 같은 변화를 스스로 확인해 볼 수 있어요. 차갑고 창백한 발은 혈류가 모자라다는 단서예요.", d: "from the knee", k: ["발이 많이 부어 있어요", "발가락이 따뜻한지 만져 볼게요"], a: "pale", o: ["dark", "bright", "green"]}
  - {t: "시술 안내", i: pill, w: "numb the area로 먼저 통증을 막는다고 알려 주면 환자가 시술을 덜 두려워해요. move quickly로 서두르는 이유까지 전해져요.", d: "after dinner", k: ["수술실로 이동할 거예요", "다리를 움직이지 마세요"], a: "numb", o: ["wash", "wrap", "mark"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "맥박 소실 설명 4문장 순서"
    why: "맥박이 없다고 알리고 바로 의사에게 알린다고 말한 뒤, 'That'으로 이유를, 'To fix that'으로 치료를, 'Afterward'로 다시 확인할 것을 말해요. 'That'·'To fix that'·'Afterward'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I can't feel a pulse in your foot, so I'm telling the doctor right now.", icon: siren, ko: "발에서 맥박이 안 느껴져서 지금 바로 의사 선생님께 알리고 있어요", note: "알림"}
    - {en: "That tells us the bone may be pressing on a blood vessel.", icon: bulb, ko: "그건 뼈가 혈관을 누르고 있을 수 있다는 뜻이에요", note: "이유"}
    - {en: "To fix that, we'll numb the area and realign the bone.", icon: play, ko: "그걸 해결하려고 부위를 마취하고 뼈를 맞출 거예요", note: "치료"}
    - {en: "Afterward, I'll check the pulse in your foot again.", icon: stetho, ko: "끝난 뒤 발의 맥박을 다시 확인할게요", note: "재확인"}
  sw: {ko: "혈액이 다시 흐르도록 뼈를 곧게 맞출 거예요."}
