- title: 신산통(요관결석)
  s:
  - t: 통증 양상
    i: pushpin
    w: come in waves or stay constant처럼 두 양상을 대비시켜 고르게 해요. 요관결석 통증은 요관이 수축하면서 파도처럼 오르내리는 경우가 많아요.
    d: all day
    k:
    - 통증이 언제 시작됐나요?
    - 토하신 적은 없나요?
    a: waves
    o:
    - drops
    - layers
    - sizes
  - t: 방사 확인
    i: compass
    w: travel from…down toward로 통증이 이동하는 경로를 말로 그려 줘요. 옆구리에서 서혜부 쪽으로 내려가는 통증은 요관결석에서 전형적으로 묻는 양상이에요.
    d: up to your neck
    k:
    - 어느 쪽 옆구리가 아프세요?
    - 통증이 심해지는 자세가 있나요?
    a: groin
    o:
    - knee
    - foot
    - ankle
  - t: 치료 계획
    i: pill
    w: We'll…and…로 두 가지 계획을 한 문장에 묶어 알려요. 통증 조절과 영상 확인을 함께 진행한다고 말하면 환자가 기다리는 이유를 이해해요.
    d: after dinner
    k:
    - 수액을 달고 소변을 받아 볼게요
    - 결석이 나올 때까지 지켜볼게요
    a: arrange
    o:
    - cancel
    - remove
    - refuse
  - t: 통증 점수
    i: chartup
    w: On a scale of one to ten은 통증 강도를 숫자로 답하게 하는 정해진 표현이에요. 숫자로 적어 두면 진통제를 쓴 뒤 변화를 비교할 수 있어요.
    d: since yesterday
    k:
    - 통증은 언제부터 시작됐나요?
    - 어느 쪽이 더 아프세요?
    a: scale
    o:
    - list
    - chart
    - level
  - t: 양상 안내
    i: speech
    w: might는 확신이 없을 때 쓰는 말이라 환자가 선택지를 편하게 고를 수 있어요. 두 양상을 예로 들어 어느 쪽인지 대답하기 쉽게 해요.
    d: for the nurse
    k:
    - 얼마나 오래 아프셨나요?
    - 그 통증이 허리까지 퍼지나요?
    a: constant
    o:
    - sharp
    - mild
    - dull
  - t: 안심 안내
    i: bell
    w: get you comfortable은 환자가 편해지도록 필요한 것을 해 주겠다는 말이에요. while we wait로 기다리는 시간에도 돌보고 있음을 알려요.
    d: in the hallway
    k:
    - 스캔은 15분쯤 걸려요
    - 결과는 의사가 설명해 드릴 거예요
    a: wait
    o:
    - pay
    - apply
    - push
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신산통 사정 4문장 순서
    why: 통증의 양상을 묻고, 그 통증이 내려가는 경로를 묻고, 그 경로를 따라 강도를 점수로 묻고, 점수와 상관없이 진통제와 CT를 안내해요. 'that pain'·'that path'·'the number'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Does the pain come in waves or stay constant?
      icon: pushpin
      ko: 통증이 파도처럼 오나요, 아니면 계속되나요?
      note: 양상
    - en: Does that pain travel from your side down toward your groin?
      icon: compass
      ko: 그 통증이 옆구리에서 서혜부 쪽으로 내려가나요?
      note: 방사
    - en: How bad is it along that path, on a scale of one to ten?
      icon: chartup
      ko: 그 경로를 따라 얼마나 심한가요, 1부터 10까지로요?
      note: 강도
    - en: Whatever the number, we'll give you pain medicine and arrange a CT scan.
      icon: pill
      ko: 점수가 몇이든 진통제를 드리고 CT를 준비할게요
      note: 계획
  sw:
    ko: 옆구리에서 사타구니 쪽으로 퍼지나요?
- title: 급성 신우신염
  s:
  - t: 타진 안내
    i: stetho
    w: when I tap…here로 곧 할 동작과 위치를 같이 알려서 환자가 놀라지 않게 해요. 등의 신장 부위를 두드려 아프면 신장 염증을 의심하는 단서가 돼요.
    d: very hard
    k:
    - 등이 언제부터 아프기 시작했나요?
    - 몸을 옆으로 돌려 눕혀 주시겠어요?
    a: hurt
    o:
    - itch
    - bleed
    - swell
  - t: 동반 증상
    i: stetho
    w: 증상을 나열해 하나씩 답하게 하는 질문이에요. 열·오한·메스꺼움은 감염이 신장까지 올라갔을 때 함께 나타나기 쉬운 증상이에요.
    d: this week
    k:
    - 물은 잘 드시고 계세요?
    - 옆구리를 눌러 보면 아프세요?
    a: chills
    o:
    - rash
    - cough
    - itching
  - t: 배양 설명
    i: lab
    w: before starting으로 일의 순서를 알려요. 항생제가 먼저 들어가면 소변 배양에서 균이 자라지 않을 수 있어서 배양 검체를 먼저 받아요.
    d: to be safe
    k:
    - 항생제는 정맥으로 드릴 거예요
    - 피검사는 이미 끝났어요
    a: before
    o:
    - after
    - without
    - instead of
  - t: 증상 설명
    i: bulb
    w: is common with…로 지금 증상이 이 병에서 흔하다고 설명해 환자의 불안을 줄여요. 신우신염은 방광염과 달리 등과 옆구리 통증이 함께 오기 쉬워요.
    d: from lifting
    k:
    - 열이 나면 해열제를 드릴게요
    - 소변 검사를 한 번 더 할 거예요
    a: kidney
    o:
    - skin
    - lung
    - bone
  - t: 치료 순서
    i: pill
    w: as soon as는 앞 일이 끝나자마자라는 뜻이라 지체 없이 시작한다는 약속이에요. 배양 검체만 받으면 바로 항생제를 시작해요.
    d: tomorrow
    k:
    - 항생제 알레르기가 있으신가요?
    - 수액도 같이 달아 드릴게요
    a: collected
    o:
    - cancelled
    - printed
    - approved
  - t: 활력징후
    i: monitor
    w: Let's…는 함께 하자는 말투라 지시보다 부드러워요. 체온과 혈압은 감염이 온몸에 영향을 주는지 보는 기본 활력징후예요.
    d: every minute
    k:
    - 소변을 컵에 받아 주세요
    - 아랫배를 눌러 볼게요
    a: temperature
    o:
    - weight
    - height
    - age
  order:
    tag: 대화 흐름
    icon: compass
    ko: 신우신염 설명 4문장 순서
    why: 등을 두드려 통증을 확인하고, 그 통증이 신장 감염에서 흔하다고 설명하고, 그것을 확인하려 배양을 먼저 하고, 검체가 모이는 대로 항생제를 시작해요. 'That pain'·'it'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Does it hurt when I tap over your back here?
      icon: stetho
      ko: 여기 등을 두드릴 때 아픈가요?
      note: 타진
    - en: That pain in your back and side is common with a kidney infection.
      icon: bulb
      ko: 등과 옆구리의 그 통증은 신장 감염에서 흔해요
      note: 설명
    - en: To confirm it, we'll get a urine culture before starting antibiotics.
      icon: lab
      ko: 확인하려고 항생제 전에 소변 배양을 할게요
      note: 배양
    - en: We'll start antibiotics as soon as it is collected.
      icon: pill
      ko: 채취가 끝나는 대로 항생제를 시작할게요
      note: 항생제
  ctx:
    word: culture
    ko: 배양
    sc:
      2:
        en: Culture sent, OK to hang abx.
        fix: We've sent a urine culture to check for bacteria, so we can start your antibiotics now.
- title: 남성 요폐(전립선)
  s:
  - t: 배뇨 증상
    i: pushpin
    w: for a while은 정확한 기간 대신 '한동안'이라는 느낌으로 묻는 편한 표현이에요. 약한 줄기와 시작의 지연은 전립선이 요도를 눌러서 생기는 대표 증상이에요.
    d: next visit
    k:
    - 소변을 볼 때 따갑나요?
    - 소변에서 피가 나왔나요?
    a: weak
    o:
    - strong
    - dark
    - loud
  - t: 검사 안내
    i: monitor
    w: a quick…으로 금방 끝나는 검사라고 알려 부담을 줄여요. 방광 스캔은 배 위에 초음파 기기를 대어 방광에 찬 소변량을 보는 검사라 관을 넣지 않아도 돼요.
    d: in the morning
    k:
    - 소변 검사를 먼저 할게요
    - 피검사부터 할게요
    a: quick
    o:
    - slow
    - long
    - big
  - t: 결과 설명
    i: bulb
    w: This는 앞 문장의 스캔을 가리켜 검사의 목적을 풀어 줘요. how much…is left는 배뇨 뒤에 방광에 남은 양, 곧 잔뇨량을 묻는 말이에요.
    d: at triage
    k:
    - 이 검사는 조금 아파요
    - 몸을 눕혀 주세요
    a: urine
    o:
    - blood
    - air
    - gas
  - t: 기간 확인
    i: calendar
    w: How long have you been…ing?는 지금까지 이어진 기간을 묻는 현재완료진행형이에요. 오래된 증상이 갑자기 나빠졌는지 새로 생겼는지 구분해요.
    d: over the phone
    k:
    - 평소에는 하루에 몇 번 소변을 보세요?
    - 약은 어떤 걸 드시나요?
    a: starting
    o:
    - finishing
    - emptying
    - wasting
  - t: 잔뇨감
    i: stetho
    w: feel like…는 객관적 사실이 아니라 환자의 느낌을 묻는 말이에요. after you go의 go는 소변을 본다는 뜻의 완곡한 말이에요.
    d: before you go
    k:
    - 밤에 소변 때문에 자주 깨시나요?
    - 소변을 참기 힘드신가요?
    a: completely
    o:
    - barely
    - rarely
    - never
  - t: 도뇨 안내
    i: gear
    w: pass a catheter는 도뇨관을 요도로 통과시켜 넣는다는 뜻이에요. 방광에 찬 소변을 빼면 압박감이 풀려요.
    d: this week
    k:
    - 지금 초음파를 한 번 더 볼게요
    - 소변 색을 보고 결정할게요
    a: relieve
    o:
    - measure
    - record
    - increase
  order:
    tag: 대화 흐름
    icon: compass
    ko: 전립선 요폐 4문장 순서
    why: 증상을 묻고, 그 증상이 얼마나 오래됐는지 묻고, 그 병력을 바탕으로 방광 스캔을 안내하고, 그 스캔을 근거로 도뇨한다고 알려요. 'that'·'that history'·'that scan'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Have you had a weak stream or trouble starting for a while?
      icon: pushpin
      ko: 소변 줄기가 약하거나 시작하기 어려운 게 한동안 있었나요?
      note: 증상
    - en: How long has that been going on?
      icon: calendar
      ko: 그게 얼마나 오래됐나요?
      note: 기간
    - en: With that history, we'll do a quick bladder scan to see how full it is.
      icon: monitor
      ko: 그런 병력이라 얼마나 찼는지 방광스캔을 빠르게 할게요
      note: 스캔
    - en: Based on that scan, we'll pass a catheter to relieve the pressure and drain your bladder.
      icon: gear
      ko: 그 스캔 결과에 따라 카테터를 넣어 압박감을 풀고 방광을 비울게요
      note: 도뇨
  sw:
    ko: 얼마나 찼는지 보려고 방광스캔을 빠르게 할게요
- title: 고환염전 청소년
  s:
  - t: 발현 시각
    i: calendar
    w: Exactly로 대략이 아니라 정확한 시각을 묻고 있어요. 고환 염전은 통증이 시작된 시각이 치료 시한을 정하는 근거라 시간이 가장 중요한 정보예요.
    d: on the monitor
    k:
    - 어디가 가장 아픈가요?
    - 통증이 점점 심해지고 있나요?
    a: pain
    o:
    - fever
    - cough
    - rash
  - t: 편측 확인
    i: pushpin
    w: one side와 both sides를 대비시켜 고르게 해요. 고환 염전은 보통 한쪽에서 갑자기 시작해서 한쪽인지 양쪽인지가 중요한 단서예요.
    d: during rounds
    k:
    - 통증이 배까지 올라오나요?
    - 소변볼 때 아프세요?
    a: only
    o:
    - always
    - never
    - mostly
  - t: 외관 변화
    i: magnify
    w: notice는 환자가 직접 본 변화를 묻는 동사예요. 음낭이 붓거나 붉어지는 것은 염전이나 염증에서 눈에 띄는 변화예요.
    d: since lunch
    k:
    - 최근에 다친 적 있나요?
    - 소변에 피가 섞였나요?
    a: redness
    o:
    - itching
    - fever
    - dizziness
  - t: 긴급 설명
    i: siren
    w: can be는 확정이 아닌 가능성을 말하고, so로 이유와 행동을 이어요. 서두르는 까닭을 알려 주면 환자와 보호자가 덜 불안해요.
    d: this evening
    k:
    - 진통제부터 드릴게요
    - 보호자께 연락해도 될까요?
    a: quickly
    o:
    - slowly
    - randomly
    - quietly
  - t: 조치 안내
    i: monitor
    w: 현재진행형으로 지금 하고 있는 일이라고 알려요. 초음파로 고환의 혈류를 보고, 비뇨의학 전문의를 불러 처치 시점을 정해요.
    d: at the bedside
    k:
    - 피검사를 먼저 하고 있어요
    - 진통제를 놓고 있어요
    a: calling
    o:
    - avoiding
    - forgetting
    - ignoring
  - t: 이유 설명
    i: shield
    w: can protect로 빨리 움직이는 이유를 결과로 설명해요. 꼬인 고환은 혈류가 막혀서 시간이 지나면 조직이 손상될 수 있어 빠를수록 살릴 가능성이 커요.
    d: by itself
    k:
    - 수술은 몇 시간 걸릴 거예요
    - 지금부터는 금식하셔야 해요
    a: fast
    o:
    - slowly
    - late
    - alone
  order:
    tag: 대화 흐름
    icon: compass
    ko: 고환염전 의심 4문장 순서
    why: 통증이 시작된 때를 묻고, 그 뒤로 한쪽인지 양쪽인지 묻고, 그쪽의 붓기와 발적을 확인하고, 그 모든 소견으로 응급일 수 있어 초음파와 전문의를 부른다고 알려요. 'Since it started'·'that side'·'all of that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Exactly when did the pain start?
      icon: calendar
      ko: 정확히 언제 통증이 시작됐나요?
      note: 시각
    - en: Since it started, is the pain only on one side, or on both sides?
      icon: pushpin
      ko: 시작된 뒤로 통증이 한쪽뿐인가요, 양쪽인가요?
      note: 편측
    - en: Did you notice any swelling or redness on that side?
      icon: magnify
      ko: 그쪽이 붓거나 붉어진 걸 알아차리셨나요?
      note: 외관
    - en: With all of that, this can be an emergency, so we're arranging an urgent ultrasound and calling the specialist.
      icon: siren
      ko: 그 모든 걸 보면 응급일 수 있어서 긴급 초음파를 준비하고 전문의를 부르고 있어요
      note: 조치
  ctx:
    word: ultrasound
    ko: 초음파
    sc:
      0:
        en: 15-year-old, sudden left testicular pain two hours ago, concern for torsion — we're getting a stat ultrasound.
      1:
        en: I need a stat scrotal ultrasound — possible torsion.
      2:
        en: Concern for testicular torsion; stat scrotal ultrasound ordered.
        fix: The blood flow to your testicle might be blocked, so we're getting an ultrasound right away and calling a specialist.
    why: 모두 염전이 의심돼 바로 초음파를 한다는 같은 말이에요. 겁먹은 청소년에게는 torsion·scrotal 같은 용어 대신 무엇이 문제이고 무엇을 하는지 쉬운 말로 알려요.
- title: 카테터 관련 요로감염
  s:
  - t: 유치 기간
    i: calendar
    w: in place는 '제자리에 들어가 있는'이라는 뜻이에요. 도뇨관을 오래 둘수록 감염 위험이 커져서 얼마나 두었는지가 중요한 정보예요.
    d: after the scan
    k:
    - 소변 색이 어떻게 변했나요?
    - 열은 나지 않으세요?
    a: place
    o:
    - charge
    - control
    - trouble
  - t: 소변 변화
    i: magnify
    w: become은 상태가 변해 가는 과정을 묻는 동사예요. 소변이 뿌옇거나 악취가 나는 것은 카테터 관련 요로감염을 의심하게 하는 변화예요.
    d: this morning
    k:
    - 카테터 주변이 아프신가요?
    - 소변이 얼마나 나오나요?
    a: cloudy
    o:
    - sticky
    - bubbly
    - oily
  - t: 교체 안내
    i: gear
    w: We may need to…로 확정이 아닌 가능성으로 알려요. 카테터 관련 감염이 의심되면 오래된 카테터를 바꾸고 감염 여부를 확인해요.
    d: for now
    k:
    - 카테터 위치를 확인해 볼게요
    - 소변 주머니를 비워 드릴게요
    a: change
    o:
    - ignore
    - hide
    - borrow
  - t: 교체 이력
    i: calendar
    w: Has anyone…?은 누가 했는지 모를 때 쓰는 질문이에요. 최근 교체 여부는 감염의 원인을 따질 때 필요한 이력이에요.
    d: by morning
    k:
    - 카테터를 언제 처음 넣었나요?
    - 소변이 새고 있나요?
    a: catheter
    o:
    - dressing
    - bandage
    - sheet
  - t: 배양 채취
    i: lab
    w: from the catheter port로 채취 위치를 정확히 말해요. 소변 주머니에 오래 고인 소변은 쓰지 않고, 카테터의 채취 포트에서 새 소변을 받아요.
    d: for the nurse
    k:
    - 소변 주머니를 새것으로 바꿀게요
    - 검체는 내일 보낼게요
    a: port
    o:
    - bag
    - door
    - floor
  - t: 기대 안내
    i: bell
    w: should는 높은 가능성을 부드럽게 말해요. once…는 앞 일이 끝난 뒤를 가리켜 새 카테터가 자리 잡은 다음의 편안함을 말해요.
    d: in the hallway
    k:
    - 새 카테터는 더 얇은 걸로 쓸 거예요
    - 교체하는 동안 숨을 편히 쉬세요
    a: comfortable
    o:
    - expensive
    - crowded
    - strict
  order:
    tag: 대화 흐름
    icon: compass
    ko: 카테터 감염 사정 4문장 순서
    why: 카테터를 넣은 기간을 묻고, 그것을 교체한 적을 묻고, 마지막 교체 이후 소변의 변화를 묻고, 그 소변을 알아보려고 포트에서 배양 검체를 보내요. 'it'·'the last change'·'that urine'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: How long has the catheter been in place?
      icon: calendar
      ko: 카테터가 자리 잡은 지 얼마나 됐나요?
      note: 기간
    - en: Has anyone changed it recently?
      icon: calendar
      ko: 최근에 그걸 교체한 적이 있나요?
      note: 교체
    - en: Since the last change, has your urine become cloudy or foul-smelling?
      icon: magnify
      ko: 마지막 교체 이후 소변이 뿌옇거나 악취가 났나요?
      note: 소변
    - en: To see what that urine is telling us, we'll send a sample from the catheter port for culture.
      icon: lab
      ko: 그 소변을 알아보려고 카테터 포트에서 검체를 배양으로 보낼게요
      note: 배양
  ctx:
    word: port
    ko: 포트
