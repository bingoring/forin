- title: 실혈성 쇼크 급속진행
  s:
  - {t: "수혈 안내", i: pill, w: "You've lost…, so we're…로 현재 상태 뒤에 행동을 이어 말해요. 많은 피를 잃으면 혈압을 지키려고 혈액으로 채워 줘요.", d: "sending you home", k: ["지금 바로 수술실로 가실 거예요", "혈액형부터 다시 확인할게요"], a: "lost", o: ["gained", "donated", "hidden"]}
  - {t: "상태 설명", i: monitor, w: "Your pressure is very low로 혈압을 '압력'이라고 쉽게 말해요. 낮은 혈압은 장기로 피가 충분히 가지 않는다는 신호라 빠르게 대응해요.", d: "slightly high", k: ["혈압은 다시 재 볼게요", "보호자분께 연락드릴게요"], a: "low", o: ["high", "steady", "normal"]}
  - {t: "수술 준비", i: scalpel, w: "preparing you for…로 환자가 대상임을 분명히 말해요. 약과 수액으로 잡히지 않는 출혈은 수술로 멈춰야 해서 수술팀과 함께 준비해요.", d: "calling you", k: ["가족분께 연락드릴게요", "수술 전에 피를 한 번 더 뽑을게요"], a: "surgery", o: ["discharge", "lunch", "dialysis"]}
  - {t: "환자 호소", i: faceWorried, w: "feel + 형용사로 몸의 감각을 말해요. 몸이 차갑고 눈앞이 흐려지는 것은 피가 부족해 쇼크로 가는 신호일 수 있어 바로 알려요.", d: "burning hot", k: ["숨을 쉬기가 힘들어요", "가슴이 두근거려요"], a: "freezing", o: ["boiling", "starving", "itchy"]}
  - {t: "상태 설명", i: bulb, w: "faster than…으로 비교해 '따라잡지 못한다'는 위급함을 전해요. 이런 상태에서는 보충만으로 부족해 출혈 자체를 멈추는 처치가 필요해요.", d: "slower than", k: ["피를 지금 더 빨리 넣고 있어요", "수술팀이 곧 도착해요"], a: "losing", o: ["making", "saving", "finding"]}
  - {t: "준비 안내", i: hospital, w: "ready·on standby처럼 '준비된 상태'를 말해요. 출혈이 멈추지 않으면 바로 쓸 수 있게 혈액과 수술팀을 미리 대기시켜요.", d: "off duty", k: ["수술 동의서에 서명해 주세요", "수액을 한 병 더 걸게요"], a: "ready", o: ["gone", "empty", "closed"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "실혈성 쇼크 4문장 순서"
    why: "혈압이 낮아 빠르게 움직인다고 알리고, 그래서 바로 혈액을 주고, 혈액만으로 부족할 수 있어 수술을 준비하고, 그 모든 일 속에서 증상 변화를 알려 달라고 해요. 'Because of that'·'blood alone'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your blood pressure is lower than we'd like, so we're moving quickly.", icon: monitor, ko: "혈압이 바라는 것보다 낮아서 빠르게 움직이고 있어요", note: "상태"}
    - {en: "Because of that, we're giving you blood right now.", icon: pill, ko: "그래서 지금 바로 혈액을 드리고 있어요", note: "수혈"}
    - {en: "I'm also keeping surgery ready, because blood alone may not stop the bleeding.", icon: scalpel, ko: "혈액만으로는 출혈이 멈추지 않을 수 있어 수술도 준비해 두고 있어요", note: "수술"}
    - {en: "With all of that, tell me right away if you feel colder or faint.", icon: bell, ko: "그 모두와 함께 더 춥거나 어지러우면 바로 말씀해 주세요", note: "알림"}
  ctx:
    word: "blood pressure"
    ko: "혈압"
    scenes:
      0: "Blood pressure is 78 over 40 and dropping."
      1: "Your blood pressure is lower than we'd like, so we're moving quickly."
      2: "Blood pressure 78 over 40 — you're hypotensive and tachycardic."
    why: "hypotensive·tachycardic은 의료진의 말이에요. 환자에게는 같은 사실을 쉬운 말로, 지금 무엇을 하는지와 함께 말해요."
  sw: {ko: "피를 많이 잃으셔서 수혈을 해드리고 있어요"}
- title: 경부 창상 기도·혈관 위기
  s:
  - {t: "위험 설명", i: bulb, w: "can으로 가능성을 말해 겁주지 않으면서 위험을 알려요. 목 상처의 출혈과 붓기(혈종)는 빠르게 커져 기도를 누를 수 있어요.", d: "can shrink", k: ["숨이 편한지 계속 확인할게요", "목을 움직이지 말고 가만히 계세요"], a: "neck", o: ["knee", "foot", "hand"]}
  - {t: "처치 설명", i: shield, w: "controlling과 protecting을 -ing로 나란히 써서 두 가지를 동시에 하고 있다고 알려요. 목 출혈은 지혈과 기도 확보를 함께 해야 해요.", d: "checking your teeth", k: ["지금 산소를 달아 드릴게요", "의사가 곧 올 거예요"], a: "controlling", o: ["ignoring", "hiding", "delaying"]}
  - {t: "증상 보고 요청", i: bell, w: "if breathing gets harder로 알릴 신호를 구체적으로 알려 줘요. 목 부종은 갑자기 심해질 수 있어 환자의 말이 가장 빠른 신호예요.", d: "when you can", k: ["목소리가 변하면 바로 말씀해 주세요", "어지러우면 바로 말씀해 주세요"], a: "harder", o: ["easier", "slower", "quieter"]}
  - {t: "환자 호소", i: siren, w: "it's getting hard to…로 점점 나빠지는 변화를 말해요. 목 출혈 환자가 숨쉬기 힘들다고 하면 기도 위기이므로 바로 도움을 불러요.", d: "easy to swallow", k: ["목이 아프고 삼키기 힘들어요", "목소리가 갈라져서 안 나와요"], a: "neck", o: ["knee", "foot", "ankle"]}
  - {t: "기도 확인", i: stetho, w: "Let me…로 허락을 구하듯 말해 검사에 협조하게 해요. 목 상처는 기도가 막혀 가는지 말소리와 호흡으로 반복해 확인해요.", d: "still closed", k: ["입을 크게 벌려 보세요", "숨을 크게 쉬어 보세요"], a: "airway", o: ["pulse", "pupil", "pressure"]}
  - {t: "위험 설명", i: bulb, w: "fast를 문장 끝에 두어 '빠르게'를 강조해요. 목 부종이 있는 환자는 상태가 갑자기 나빠질 수 있어 계속 지켜봐요.", d: "slowly", k: ["숨소리를 계속 확인할게요", "목에 감은 붕대는 풀지 마세요"], a: "block", o: ["clear", "open", "widen"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "경부 창상 4문장 순서"
    why: "숨이 힘들어지면 바로 알려 달라고 하고, 그 이유로 목 부종이 기도를 누를 수 있다고 알리고, 부종이 빠르다는 점에서 지혈과 기도 보호를 하고, 그 모두와 함께 기도를 확인해요. 'That's because'·'Because swelling can build fast'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Tell me right away if your breathing gets any harder.", icon: bell, ko: "숨쉬기가 조금이라도 더 힘들어지면 바로 말씀해 주세요", note: "요청"}
    - {en: "That's because a neck wound can swell and press on your airway.", icon: bulb, ko: "목 상처는 부어올라 기도를 누를 수 있기 때문이에요", note: "이유"}
    - {en: "Because swelling can build fast, we're controlling the bleeding and protecting your airway.", icon: shield, ko: "붓기가 빠르게 생길 수 있어서 출혈을 조절하고 기도를 보호하고 있어요", note: "처치"}
    - {en: "With all of that, let me check your airway is still open.", icon: stetho, ko: "그 모두와 함께 기도가 아직 열려 있는지 확인할게요", note: "확인"}
  sw: {ko: "붓기가 숨쉬기를 더 힘들게 할 수 있으니, 숨쉬기가 더 힘들어지면 바로 말씀해 주세요"}
- title: 절단부 대량출혈
  s:
  - {t: "지혈대 적용", i: bandage, w: "to stop the bleeding now처럼 목적과 시점을 함께 말해요. 절단 부위의 큰 출혈은 지체 없이 지혈대로 막아요.", d: "to watch", k: ["절단된 부위를 가져와 주세요", "혈압을 지금 재 볼게요"], a: "tourniquet", o: ["splint", "blanket", "mask"]}
  - {t: "절단부 보존", i: shield, w: "cool and moist로 보존 상태를 형용사 둘로 말해요. 절단된 부위는 젖은 거즈로 싸서 비닐에 넣어 얼음 위에 두고, 얼음에 직접 닿게 하지 않아요.", d: "warm and dry", k: ["절단된 부위는 환자와 함께 가져갈게요", "부위 사진을 찍어 둘게요"], a: "moist", o: ["dry", "hot", "tight"]}
  - {t: "수술팀 호출", i: bell, w: "is being called처럼 수동 진행형으로 '지금 호출되는 중'임을 알려요. 재접합은 시간이 중요해서 수술팀을 일찍 부르고 절단부를 잘 보존해요.", d: "was sent home", k: ["가족분께 연락을 드렸어요", "절단된 부위를 비닐에 넣어 둘게요"], a: "called", o: ["canceled", "delayed", "ignored"]}
  - {t: "환자 호소", i: siren, w: "was cut off는 수동태로 '잘려 나갔다'는 결과를 말하고, it's bleeding everywhere로 지금 상황을 이어요. 대량 출혈과 절단을 한 번에 알리는 말이에요.", d: "got burned", k: ["손가락이 하나 잘렸어요", "손에 감각이 없어요"], a: "hand", o: ["foot", "finger", "arm"]}
  - {t: "유지 안내", i: lock, w: "must stay on until…로 '풀지 말고 그대로'라는 기한을 정해요. 지혈대는 수술에서 출혈 부위를 직접 잡을 때까지 두는 것이 원칙이라 임의로 풀지 않아요.", d: "can come off", k: ["지혈대 시각은 차트에 적어 뒀어요", "붕대는 풀지 마세요"], a: "stay", o: ["slip", "come", "fall"]}
  - {t: "보존 이유", i: bulb, w: "to give it the best chance로 보존의 목적을 알려요. 절단부를 차갑게 보존하면 조직이 상하는 속도가 느려져 재접합 가능성이 높아져요.", d: "to save time", k: ["절단부는 비닐에 따로 담았어요", "얼음이 녹으면 갈아 줄게요"], a: "cold", o: ["warm", "dry", "bright"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "절단부 대량출혈 4문장 순서"
    why: "먼저 지혈대를 바로 적용하고, 그 지혈대는 수술 때까지 둔다고 알리고, 그와 함께 절단부를 차갑게 보존하고, 그 기회를 위해 수술팀을 부른다고 닫아요. 'That tourniquet'·'Alongside that'·'that chance'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We're placing a tourniquet now to stop the bleeding.", icon: bandage, ko: "출혈을 멈추려고 지금 지혈대를 적용하고 있어요", note: "지혈"}
    - {en: "That tourniquet must stay on until surgery, so please don't touch it.", icon: lock, ko: "그 지혈대는 수술 때까지 그대로 있어야 하니 손대지 마세요", note: "유지"}
    - {en: "Alongside that, we're keeping the amputated part cool and moist for the best chance.", icon: shield, ko: "그와 함께 가장 좋은 가능성을 위해 절단된 부위를 차갑고 촉촉하게 보존하고 있어요", note: "보존"}
    - {en: "To give it that chance, the surgical team is being called for possible reattachment.", icon: bell, ko: "그 가능성을 위해 재접합을 대비해 수술팀을 부르고 있어요", note: "호출"}
  ctx:
    word: "tourniquet"
    ko: "지혈대"
    scenes:
      1: "This tourniquet has to stay on until surgery, even if it hurts."
    fix: "That tourniquet is what's holding the bleeding back, so please don't touch it."
  sw: {ko: "수술팀이 다시 붙일 수 있는지 보러 오고 있어요"}
- title: 위장관 대량출혈 토혈
  s:
  - {t: "자세 안내", i: shield, w: "position you to…로 '자세를 잡아 주겠다'고 목적과 함께 말해요. 토혈 환자는 피가 기도로 넘어가기 쉬워 자세로 기도를 지켜요.", d: "from the noise", k: ["입 안의 피는 이 그릇에 뱉으세요", "산소를 달아 드릴게요"], a: "protect", o: ["block", "narrow", "close"]}
  - {t: "상태 설명", i: monitor, w: "internally로 눈에 보이지 않는 몸속 출혈임을 알려요. 소화관 출혈은 혈압이 떨어질 수 있어 수액과 혈액을 먼저 채워 줘요.", d: "externally", k: ["내시경은 오늘 안에 할 거예요", "음식은 드시지 마세요"], a: "internally", o: ["externally", "slightly", "rarely"]}
  - {t: "내시경 안내", i: stetho, w: "will do a scope에서 scope는 내시경을 쉽게 부르는 말이에요. 출혈 부위를 찾아 내시경으로 직접 멎게 하는 치료가 많이 쓰여요.", d: "a scan", k: ["소화기팀이 곧 도착할 거예요", "피를 토하면 이 그릇에 뱉으세요"], a: "scope", o: ["swab", "splint", "stitch"]}
  - {t: "환자 호소", i: siren, w: "keep + -ing로 반복되는 증상을 말해요. 피를 계속 토하고 힘이 없다는 것은 출혈이 이어지고 몸속 혈액이 줄고 있다는 신호예요.", d: "feeling hot", k: ["배가 너무 아파요", "변이 검게 나왔어요"], a: "vomiting", o: ["donating", "selling", "drawing"]}
  - {t: "자세 안내", i: shield, w: "turn you on your side로 어느 쪽으로 돌리는지까지 구체적으로 말해요. 옆으로 누우면 토한 피가 입 밖으로 흘러 기도로 들어갈 위험이 줄어요.", d: "on your back", k: ["토하면 이 그릇에 뱉으세요", "움직이기 힘들면 저희가 도와 드릴게요"], a: "side", o: ["back", "stomach", "knees"]}
  - {t: "수혈 안내", i: hospital, w: "quickly를 문장 끝에 두어 '빠르게'를 강조해요. 토혈로 몸속 혈액이 줄면 수액과 혈액을 빠르게 넣어 혈압을 지켜요.", d: "later", k: ["수액을 한 병 더 걸게요", "피를 한 번 더 뽑을게요"], a: "quickly", o: ["slowly", "rarely", "never"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "토혈 환자 4문장 순서"
    why: "먼저 옆으로 돌려 기도를 지키고, 그렇게 누운 채 피를 뱉게 하고, 그와 함께 수액·혈액을 넣고, 그것들이 들어가는 동안 소화기팀이 내시경으로 출혈 부위를 찾는다고 닫아요. 'like that'·'Along with that'·'those going in'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We'll turn you on your side to keep your airway clear.", icon: shield, ko: "기도를 깨끗하게 유지하려고 옆으로 돌려드릴게요", note: "자세"}
    - {en: "Lying like that, spit any blood into this basin.", icon: check, ko: "그렇게 누운 채 입 안의 피는 이 그릇에 뱉으세요", note: "지시"}
    - {en: "Along with that, the team will give you fluids and blood quickly.", icon: hospital, ko: "그와 함께 팀에서 수액과 혈액을 빠르게 드릴 거예요", note: "수혈"}
    - {en: "With those going in, the GI team will do a scope to find the bleeding.", icon: stetho, ko: "그것들이 들어가는 동안 소화기팀이 내시경으로 출혈 부위를 찾을 거예요", note: "내시경"}
  ctx:
    word: "turn"
    ko: "돌리다"
    scenes:
      0: "Help me turn him on his side — he's vomiting again."
      2: "We're going to turn you to lateral decubitus for aspiration precautions."
    fix: "We're going to turn you onto your side so the blood can drain out of your mouth."
  sw: {ko: "소화기팀이 카메라로 속을 들여다보며 출혈 부위를 찾아 멈출 거예요"}
- title: 출혈 SBAR 인계
  s:
  - {t: "상황 보고", i: speech, w: "This is로 시작해 누구인지와 문제를 한 문장에 말하는 SBAR의 S(상황) 문장이에요. 나이와 핵심 문제를 먼저 말해 듣는 사람이 바로 상황을 잡아요.", d: "light venous", k: ["이 환자는 36세 남자입니다", "팔다리 출혈은 멈춘 상태입니다"], a: "heavy", o: ["mild", "slight", "minimal"]}
  - {t: "처치 보고", i: bandage, w: "과거 수동태와 현재형을 and로 이어 '무엇을 했고 지금 어떤지'를 한 문장에 전해요. 적용 시각과 현재 상태를 함께 말해야 받는 사람이 다음을 판단해요.", d: "was removed", k: ["14시 20분에 수혈을 시작했습니다", "출혈 부위는 왼쪽 허벅지입니다"], a: "applied", o: ["removed", "loosened", "skipped"]}
  - {t: "경과 보고", i: monitor, w: "We've given…으로 지금까지 투여한 양을 현재완료로 말하고 pressure is improving으로 반응을 덧붙여요. 투여량과 반응을 함께 말해야 받는 쪽이 수혈이 듣는지 알아요.", d: "a liter", k: ["혈액 한 유닛을 더 준비해 두었습니다", "수액도 계속 투여 중입니다"], a: "improving", o: ["falling", "dropping", "crashing"]}
  - {t: "인계 요청", i: speech, w: "wants a handoff—give me…로 요청을 직접 말해요. 수술팀이 받으려는 보고는 한 문장씩 짧게 순서대로 전하는 것이 좋아요.", d: "Radiology wants", k: ["수술팀이 곧 환자를 데려갈 거예요", "보호자께는 제가 말씀드릴게요"], a: "handoff", o: ["blanket", "uniform", "badge"]}
  - {t: "상태 보고", i: monitor, w: "Vitals are stable로 활력징후를 한 줄에 전하고, the limb is warm으로 팔다리 상태를 덧붙여요. 지혈과 수혈 뒤에는 활력징후와 팔다리 상태를 함께 알려요.", d: "and the chart", k: ["혈압은 118에 72입니다", "맥박은 분당 96회입니다"], a: "stable", o: ["unstable", "falling", "unclear"]}
  - {t: "후속 안내", i: compass, w: "She'll need…로 앞으로 필요한 것을 예고해요. 수술실에서도 활력징후와 출혈을 계속 감시하라는 인계의 마지막 R(제안)에 해당해요.", d: "discharge", k: ["수술실에서 혈액을 더 요청해 주세요", "보호자께 수술 동의를 받아 주세요"], a: "monitoring", o: ["discharge", "visiting", "feeding"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "출혈 SBAR 인계 4문장 순서"
    why: "환자와 문제를 먼저 말하고, 그 출혈에 한 처치를 말하고, 그 뒤의 투여와 반응을 말한 뒤, 그 반응을 근거로 수술실 관찰을 요청해요. 'that bleeding'·'Since then'·'that response'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This is a 36-year-old with heavy arterial limb bleeding.", icon: speech, ko: "동맥성 팔다리 출혈이 심한 36세 환자입니다", note: "상황"}
    - {en: "For that bleeding, a tourniquet was applied at 14:20, and it is controlled.", icon: bandage, ko: "그 출혈에 14시 20분에 지혈대를 적용했고 조절되었습니다", note: "처치"}
    - {en: "Since then, we've given two units of blood and pressure is improving.", icon: monitor, ko: "그 뒤로 혈액 두 유닛을 투여했고 혈압은 호전되고 있습니다", note: "경과"}
    - {en: "With that response, vitals are stable and she'll need ongoing monitoring in the OR.", icon: compass, ko: "그 반응으로 활력징후는 안정적이고 수술실에서 지속적인 관찰이 필요합니다", note: "제안"}
  ctx:
    word: "stable"
    ko: "안정적인"
  sw: {ko: "혈역학적으로 안정적이고, 두 유닛 투여 후 심박수 96, 혈압 118/72예요"}
