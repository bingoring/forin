    why: "모니터로 두 번째 반응을 지켜본다고 알리고, 'That wave'가 앞의 두 번째 반응을 가리키며 괜찮아진 뒤에도 온다고 하고, 'Even then'이 그 시점을 가리켜 안정을 부탁하고, 'that wave'가 다시 그 반응을 가리켜 호출을 부탁해요. 앞 줄을 가리키는 말이 줄마다 있어 순서가 하나예요."
    lines:
    - {en: "We're watching you on the monitor for a second wave.", icon: monitor, ko: "두 번째 반응이 오는지 모니터로 지켜보고 있어요", note: "관찰"}
    - {en: "That wave can come even after you start feeling fine.", icon: faceWorried, ko: "그 반응은 괜찮다고 느낀 뒤에도 올 수 있어요", note: "설명"}
