- title: 조영제 반응
  s:
  - {t: "즉시 중단", i: siren, w: "I'm …ing right now로 지금 이 순간 하는 일을 알려요. 조영제 반응이 의심되면 주입부터 멈추고, 그다음에 증상을 사정해요.", d: "in a minute", k: ["지금 호흡이 괜찮으신지 볼게요", "팔의 주사 부위를 확인할게요"], a: "stopping", o: ["starting", "increasing", "repeating"]}
  - {t: "증상 보고", i: bell, w: "Tell me if로 환자에게 알릴 몫을 맡겨 관찰이 혼자만의 일이 아니게 해요. 조영제 반응도 목 조임·호흡 변화가 나타나면 아나필락시스로 보고 에피네프린이 필요해요.", d: "when you're ready", k: ["얼굴이 화끈거리는지 알려 주세요", "주사 부위가 아픈지 말씀해 주세요"], a: "breathing", o: ["vision", "hearing", "balance"]}
  - {t: "이동 안내", i: hospital, w: "where로 이동하는 이유를 장소의 특성으로 설명해 겁을 줄이고, and treat this로 지켜보기만 하는 게 아님을 밝혀요. 반응이 있으면 모니터와 응급 약이 가까운 곳으로 옮겨요.", d: "to the waiting room", k: ["보호자께 상황을 알려 드릴게요", "휠체어를 가져올게요"], a: "closely", o: ["briefly", "rarely", "quickly"]}
  - {t: "증상 문진", i: magnify, w: "Any 뒤에 증상 셋을 나열해 하나씩 짚어 가며 답하게 해요. since로 시점을 주입 시작에 고정해서 조영제와 증상의 시간 관계를 확인해요.", d: "before the scan", k: ["주사 맞은 팔은 어느 쪽이에요?", "예전에 조영제를 쓴 적이 있나요?"], a: "flushing", o: ["bleeding", "bruising", "shivering"]}
  - {t: "활력 감시", i: monitor, w: "every few minutes로 감시 간격을 알려 환자가 자주 오가는 이유를 이해하게 해요. 아나필락시스에서는 혈압 저하와 산소 포화도 저하를 놓치지 않는 것이 중요해요.", d: "once an hour", k: ["심전도 전극을 붙일게요", "정맥 라인을 하나 더 잡을게요"], a: "checking", o: ["skipping", "ignoring", "delaying"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "조영제 반응 대응 4문장 순서"
    why: "먼저 조영제를 멈추고, 'the contrast is off'가 멈춘 뒤임을 가리키며 증상을 묻고, 'Thanks'가 그 대답에 답하며 활력징후를 확인하고, 'those numbers'가 그 수치를 가리켜 이동을 알려요. 앞 줄을 가리키는 말이 줄마다 있어 순서가 하나예요."
    lines:
    - {en: "I'm stopping the contrast right now.", icon: siren, ko: "지금 바로 조영제를 멈출게요", note: "중단"}
    - {en: "Now that the contrast is off, any itching, flushing, or swelling?", icon: magnify, ko: "조영제를 멈췄으니 가려움, 홍조, 부기가 있나요?", note: "문진"}
    - {en: "Thanks. I'm checking your blood pressure and oxygen every few minutes.", icon: monitor, ko: "고마워요. 몇 분마다 혈압과 산소를 확인할게요", note: "감시"}
    - {en: "We're moving you where we can watch those numbers closely and treat this.", icon: hospital, ko: "그 수치를 가까이서 지켜보고 치료할 수 있는 곳으로 옮길게요", note: "이동"}
  ctx:
    word: "stop"
    ko: "멈추다"
    sc:
      0: {en: "I'm stopping the contrast right now."}
      2: {en: "Contrast infusion stopped; pt symptomatic with urticaria and flushing.", fix: "We've stopped the dye, and I'm staying right here with you."}
    why: "infusion·symptomatic·urticaria는 차트와 의료진끼리의 말이에요. 미국 환자는 조영제를 흔히 'dye'라고 부르니, 환자에게는 그 말로 멈췄다고 하고 곁에 있다는 점을 전해요."
- title: 항생제 IV 중 반응
  s:
  - {t: "투약 중단", i: siren, w: "stopping과 flushing을 and로 이어 두 행동을 한 번에 알려요. 반응이 의심되면 먼저 주입을 멈춰야 더 들어가지 않고, 정맥 라인은 필요한 약을 넣어야 할 수 있어서 살려 둬요.", d: "later on", k: ["다른 항생제로 바꿀 수 있는지 의사에게 물어볼게요", "팔을 편하게 두고 계세요"], a: "antibiotic", o: ["painkiller", "insulin", "vitamin"]}
  - {t: "부종 문진", i: faceWorried, w: "Are you feeling any…로 지금 느끼는 증상을 묻고 in your face·trouble swallowing으로 얼굴과 삼킴을 짚어요. 얼굴 부기와 삼킴 곤란은 기도 부종으로 이어질 수 있는 증상이에요.", d: "since last week", k: ["주사 부위가 아프세요?", "열이 나는 느낌이 있으세요?"], a: "swallowing", o: ["hearing", "seeing", "walking"]}
  - {t: "준비 안내", i: shield, w: "in case로 지금 쓰는 게 아니라 만약을 위한 준비라고 구분해 환자를 안심시켜요. 반응이 진행하면 에피네프린 근육주사를 지체 없이 놓아야 해서 미리 가까이 준비해 둬요.", d: "for later today", k: ["산소를 연결해 둘게요", "의사 선생님이 곧 오실 거예요"], a: "epinephrine", o: ["lidocaine", "heparin", "naloxone"]}
  - {t: "중증 신호", i: stetho, w: "두 질문을 or로 이어 가슴과 목 중 한쪽만 해당해도 답하게 해요. closing up은 목이 막히는 느낌을 그대로 옮긴 쉬운 표현이고, 이 증상이 있으면 에피네프린을 쓸 때예요.", d: "if it hurts", k: ["주사 맞은 팔이 저린가요?", "메스꺼움이 있으세요?"], a: "closing", o: ["opening", "drying", "healing"]}
  - {t: "미리 준비", i: bell, w: "now와 the moment를 맞세워 지금 준비해서 필요한 순간에 지연이 없게 한다고 알려요. so로 준비하는 이유를 바로 붙여요. 약을 주사기에 미리 뽑아 두면 투여가 빨라져요.", d: "after you ask", k: ["라인으로 수액을 더 넣을게요", "혈압은 계속 재고 있을게요"], a: "now", o: ["later", "tomorrow", "eventually"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항생제 반응 대응 4문장 순서"
    why: "먼저 항생제를 멈추고, 'the antibiotic stopped'가 멈춘 뒤임을 가리키며 얼굴·삼킴을 묻고, 'Besides that'이 그 증상 말고 가슴·목을 묻고, 'Thanks'가 답을 받아 에피네프린을 준비했다고 닫아요. 앞 줄을 가리키는 말이 줄마다 있어 순서가 하나예요."
    lines:
    - {en: "I'm stopping the antibiotic right now.", icon: siren, ko: "지금 항생제를 멈출게요", note: "중단"}
    - {en: "With the antibiotic stopped, are you feeling any swelling in your face or trouble swallowing?", icon: faceWorried, ko: "항생제를 멈췄는데, 얼굴이 붓거나 삼키기 힘드세요?", note: "문진"}
    - {en: "Besides that, does your chest feel tight, or is your throat closing up?", icon: stetho, ko: "그 밖에 가슴이 조이거나 목이 막히는 느낌이 있나요?", note: "추가"}
    - {en: "Thanks. I have epinephrine ready, and I'll give it the moment you need it.", icon: shield, ko: "고마워요. 에피네프린을 준비했고 필요한 순간 바로 드릴게요", note: "준비"}
  ctx:
    word: "ready"
    ko: "준비된"
    sc:
      0: {en: "Antibiotic stopped, possible anaphylaxis — epi 0.3 IM drawn up and ready."}
      2: {en: "Epi's ready in case you code.", fix: "I'm right here, and the medicine is ready if your breathing gets worse."}
    why: "code는 심정지를 뜻하는 의료진 말이라 환자에게는 겁을 주는 말이 돼요. 준비되어 있다는 사실만 차분하게 전해요."
- title: 벌쏘임 전신반응
  s:
  - {t: "전신 판단", i: stetho, w: "tells me this is…로 증상 두 가지를 근거로 판단했다는 흐름을 보여 줘요. 쏘인 곳만이 아니라 어지러움과 온몸 가려움이 함께 있으면 전신 반응(아나필락시스)으로 봐요.", d: "from the sting", k: ["쏘인 곳에 얼음을 대 드릴게요", "벌침이 남아 있는지 볼게요"], a: "whole-body", o: ["local", "mild", "minor"]}
  - {t: "재투여 가능", i: siren, w: "may need to로 아직 정해진 건 아니지만 대비하고 있다고 말해요. 에피네프린 효과는 오래가지 않아서 증상이 계속 진행하면 5~15분 간격으로 다시 놓을 수 있어요.", d: "in an hour", k: ["항히스타민제는 이미 드렸어요", "수액도 같이 맞게 될 거예요"], a: "progressing", o: ["improving", "fading", "resolving"]}
  - {t: "과거력", i: calendar, w: "been stung처럼 수동태로 벌이 한 일에 초점을 두고, reacted like this before로 전에도 같은 반응이 있었는지 물어요. 전에 전신 반응이 있었다면 다시 쏘였을 때 반응할 가능성이 커서 꼭 물어요.", d: "last summer", k: ["벌에 쏘인 곳이 어디예요?", "벌침은 직접 빼셨어요?"], a: "stung", o: ["burned", "scratched", "bruised"]}
  - {t: "악화 보고", i: bell, w: "Tell me if로 환자가 변화를 알아챌 기준을 주고 starts to swell로 아직 시작 전인 변화를 말해요. 얼굴 부기와 번지는 가려움은 반응이 진행 중이라는 신호예요.", d: "when it stops", k: ["손바닥도 가려운지 말씀해 주세요", "어지러움은 어느 정도인지 알려 주세요"], a: "swell", o: ["peel", "bleed", "shake"]}
  - {t: "재투여 이유", i: shield, w: "still로 지금도 반응이 계속된다는 근거를 주고 so로 결론을 이어요. 에피네프린은 효과가 짧아서 증상이 남아 있으면 한 번 더 놓는 것이 안전한 방법이에요.", d: "for the night", k: ["심장이 빨리 뛰는 건 약 때문이에요", "얼굴 부기는 사진으로 남길게요"], a: "still", o: ["never", "hardly", "rarely"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "벌쏘임 전신반응 4문장 순서"
    why: "전신 반응이라고 판단을 말하고, 'That's why'가 그 판단을 이유로 에피네프린을 놓고, 'It'이 그 약을 가리켜 효과가 짧다고 하고, 'that'이 재투여 결정을 가리켜 환자가 알릴 신호를 말해요. 앞 줄을 가리키는 말이 줄마다 있어 순서가 하나예요."
    lines:
    - {en: "The dizziness with itching tells me this is a whole-body reaction.", icon: stetho, ko: "어지러움과 가려움이 같이 있어 전신 반응이에요", note: "판단"}
    - {en: "That's why I'm giving you epinephrine in your thigh now.", icon: siren, ko: "그래서 지금 허벅지에 에피네프린을 놓을게요", note: "투여"}
    - {en: "It wears off quickly, so we may need to repeat it.", icon: calendar, ko: "효과가 금방 줄어서 다시 놓아야 할 수도 있어요", note: "재투여"}
    - {en: "To decide that, tell me if the itching spreads or your face swells.", icon: bell, ko: "그걸 정하려면 가려움이 번지거나 얼굴이 붓는지 말해 주세요", note: "보고"}
  ctx:
    word: "repeat"
    ko: "반복하다"
    sc:
      0: {en: "If this keeps getting worse, we may need to repeat the shot."}
      2: {en: "Refractory symptoms — repeating IM epi q5-15 min per protocol.", fix: "If this keeps getting worse, we may need to give you another shot."}
    why: "refractory·IM·q5-15 min은 팀끼리 쓰는 말이에요. 환자에게는 '더 나빠지면 한 번 더 놓을 수 있다'로 말해요."
- title: 음식(견과) 아나필락시스
  s:
  - {t: "에피 투여", i: siren, w: "I'm giving…now로 지금 하는 행동을, for this reaction으로 이유를 짧게 함께 말해요. 음식 알레르기로 인한 아나필락시스도 치료는 에피네프린 근육주사가 먼저예요.", d: "for this test", k: ["입안에 남은 음식이 있으면 뱉어 주세요", "누운 채로 다리를 올려 드릴게요"], a: "reaction", o: ["fall", "fever", "wound"]}
  - {t: "원인 확인", i: magnify, w: "that you know of로 모르는 것까지는 답할 수 없다는 점을 인정해 부담 없이 답하게 해요. 땅콩과 견과류는 아나필락시스를 일으키는 흔한 음식이에요.", d: "in the sauce", k: ["이 음식은 어디서 드셨어요?", "같이 드신 분은 괜찮으세요?"], a: "peanuts", o: ["eggs", "shrimp", "wheat"]}
  - {t: "사후 계획", i: calendar, w: "After this로 지금은 치료가 먼저이고 교육은 그다음이라는 순서를 알려 환자가 지금 할 일에 집중하게 해요. 퇴원 전에는 원인 회피와 에피펜 소지를 꼭 교육해요.", d: "before lunch", k: ["지금은 가만히 누워 계세요", "알레르기 검사는 나중에 받으실 수 있어요"], a: "avoid", o: ["order", "share", "cook"]}
  - {t: "상황 설명", i: faceWorried, w: "so로 관찰한 사실을 곧바로 행동의 이유로 이어요. 얼굴·입술이 빠르게 붓는 건 기도 침범 가능성이 있다는 뜻이라 지체 없이 치료해요.", d: "on your hands", k: ["얼굴 사진을 찍어 둘게요", "입을 크게 벌려 보시겠어요?"], a: "fast", o: ["slowly", "slightly", "gradually"]}
  - {t: "회피 교육", i: board, w: "Read…and ask…로 두 행동을 명령형으로 이어 습관처럼 외우기 쉽게 해요. 포장 식품의 라벨과 음식점에서의 질문은 견과류에 다시 노출되는 것을 막는 기본 방법이에요.", d: "after you eat", k: ["외식할 때는 에피펜을 꼭 챙기세요", "증상이 생기면 바로 911에 전화하세요"], a: "hidden", o: ["roasted", "salted", "extra"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "견과 아나필락시스 4문장 순서"
    why: "부기를 보고 치료한다고 알리고, 'That's why'가 그 부기를 이유로 에피네프린을 놓고, 'it's in'이 방금 놓은 약을 가리키며 원인 음식을 묻고, 'it'이 그 견과를 가리키며 사후 교육을 예고해요. 앞 줄을 가리키는 말이 줄마다 있어 순서가 하나예요."
    lines:
    - {en: "Your face and lips are swelling fast, so I'm treating this right away.", icon: faceWorried, ko: "얼굴과 입술이 빨리 붓고 있어 바로 치료할게요", note: "판단"}
    - {en: "That's why I'm giving you epinephrine now.", icon: siren, ko: "그래서 지금 에피네프린을 놓을게요", note: "투여"}
    - {en: "Now that it's in, did the food have peanuts or tree nuts?", icon: magnify, ko: "들어갔으니 음식에 땅콩이나 견과류가 있었나요?", note: "원인"}
    - {en: "After this, we'll talk about how to avoid it and carry an EpiPen.", icon: calendar, ko: "이후에 그걸 피하는 법과 에피펜 소지를 이야기해요", note: "교육"}
- title: 이상성 반응 관찰
  s:
  - {t: "관찰 이유", i: monitor, w: "Sometimes로 흔한 일이 아니라 가끔 있는 일이라고 말해 겁주지 않으면서, that's why로 지켜보는 이유를 바로 이어요. 아나필락시스는 첫 증상이 가라앉은 뒤 다시 나타나는 이상성 반응이 있을 수 있어요.", d: "after you leave", k: ["지금은 가려움이 가라앉았나요?", "물은 마셔도 돼요"], a: "kept", o: ["moved", "sent", "drove"]}
  - {t: "즉시 보고", i: bell, w: "the moment로 바뀌는 즉시라는 시점을 분명히 하고 again으로 아까 같은 변화가 다시 올 수 있다고 알려요. 목과 호흡의 변화는 두 번째 반응에서 가장 중요한 신호예요.", d: "when you leave", k: ["가려운 곳이 생기면 알려 주세요", "열이 나면 말씀해 주세요"], a: "changes", o: ["improves", "clears", "heals"]}
