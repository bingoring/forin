- title: 신환 1형 당뇨 발현
  s:
  - {t: "공감", i: faceWorried, w: "'This is a lot to take in'으로 정보량이 많다는 걸 먼저 인정하고 it's okay to feel로 감정을 허락해요. 새 진단 직후에는 설명이 잘 기억나지 않는 일이 많아 공감이 먼저예요.", d: "to feel relieved", k: ["천천히 하나씩 설명해 드릴게요", "가족에게 연락드릴까요?"], a: "overwhelmed", o: ["embarrassed", "annoyed", "guilty"]}
  - {t: "정상화", i: shield, w: "It's normal to로 감정을 병적인 것이 아니라 흔한 반응으로 돌려놓아요. right after로 지금이 가장 힘든 시기임을 짚어 이후엔 나아진다는 여지를 남겨요.", d: "to feel numb", k: ["걱정되는 점을 말씀해 주세요", "당뇨는 관리할 수 있어요"], a: "diagnosis", o: ["prescription", "admission", "appointment"]}
  - {t: "질문 권유", i: speech, w: "I'm here to로 필요할 때 곁에 있다고 알려요. any questions you have로 질문의 범위를 제한하지 않아서 부담 없이 물을 수 있어요.", d: "to watch", k: ["가족분도 함께 들으셔도 돼요", "천천히 하나씩 설명해 드릴게요"], a: "answer", o: ["avoid", "limit", "skip"]}
  - {t: "교육 예고", i: pill, w: "which로 앞 절의 insulin을 받아 사용법을 가르쳐 주겠다고 이어서 불안을 행동 계획으로 바꿔요. 1형 당뇨는 췌장이 인슐린을 거의 만들지 못해 평생 인슐린이 필요해요.", d: "to avoid", k: ["인슐린은 처음에는 낯설 수 있어요", "혈당 측정도 같이 배우실 거예요"], a: "teach", o: ["force", "warn", "forbid"]}
  - {t: "교육 예고", i: bulb, w: "what…are와 why…matter 두 의문절을 나란히 두어 '무엇인지'와 '왜 중요한지'를 함께 약속해요. 1형 당뇨에서 케톤이 쌓이면 DKA로 갈 수 있어서 처음부터 가르치는 항목이에요.", d: "how they smell", k: ["케톤은 소변으로도 확인할 수 있어요", "오늘은 기본만 알려 드릴게요"], a: "matter", o: ["hurt", "vanish", "spread"]}
  - {t: "진행 안내", i: compass, w: "start with the basics로 가장 쉬운 것부터 시작한다고 알려 부담을 줄여요. 한 번에 다 가르치지 않고 단계로 나누면 새 진단 환자가 소화하기 쉬워요.", d: "day by day", k: ["오늘은 여기까지만 할게요", "나머지는 내일 이어서 해요"], a: "basics", o: ["details", "exceptions", "extras"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "새 진단 환자 정서 지지 4문장 순서"
    why: "압도되는 마음을 먼저 인정하고, 그 마음이 정상이라고 하고, 그 진단에 대해 묻는 건 뭐든 답하겠다고 한 뒤, 그 답을 기초부터 단계로 풀겠다고 해요. 'That's normal'·'about it'·'those answers'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This is a lot to take in, and it's okay to feel overwhelmed.", icon: faceWorried, ko: "받아들이기 힘드실 텐데, 압도되는 기분이 드셔도 괜찮아요", note: "공감"}
    - {en: "That's normal — most people feel scared right after a new diagnosis.", icon: shield, ko: "당연해요, 새 진단 직후엔 대부분 겁이 나요", note: "정상화"}
    - {en: "I'm here to answer any questions you have about it.", icon: speech, ko: "그것에 대해 궁금한 점은 뭐든 답해 드릴게요", note: "질문"}
    - {en: "We'll go through those answers step by step, starting with the basics.", icon: compass, ko: "그 답을 기초부터 한 단계씩 풀어 드릴게요", note: "계획"}
  sw: {ko: "새로 진단받으면 겁이 나는 게 당연해요"}
- title: HHS 노인
  s:
  - {t: "경과 문진", i: calendar, w: "How long…been으로 지금까지 이어진 시간을 묻고 drowsy and confused 두 증상을 한 번에 묶어요. HHS는 며칠에 걸쳐 서서히 진행돼서 졸림이 시작된 시점을 알아야 해요.", d: "dizzy and weak", k: ["최근에 약을 바꾸신 적 있으세요?", "평소 혼자 지내세요?"], a: "drowsy", o: ["thirsty", "hungry", "angry"]}
  - {t: "상태 설명", i: chartup, w: "extremely와 severe로 정도를 강조해 가족이 심각함을 알아차리게 해요. HHS는 혈당이 아주 높고 물이 크게 빠져 혈액이 진해진 상태예요.", d: "with mild swelling", k: ["지금 수액을 놓고 있어요", "의사 선생님이 곧 오실 거예요"], a: "extremely", o: ["slightly", "mildly", "moderately"]}
  - {t: "섭취 문진", i: coffee, w: "last see her drink로 보호자가 직접 본 마지막 순간을 물어요. 고령자는 갈증을 덜 느끼고 스스로 말하기도 어려워서 보호자의 관찰이 중요한 단서예요.", d: "last hear", k: ["평소 하루에 물을 얼마나 드세요?", "소변을 마지막으로 본 게 언제예요?"], a: "normally", o: ["alone", "quickly", "loudly"]}
  - {t: "섭취 문진", i: coffee, w: "less than usual로 평소와 비교해 줄었는지만 물어 보호자가 답하기 쉬워요. 감염 같은 다른 병으로 먹고 마시는 양이 줄면 고혈당과 탈수가 겹쳐 HHS로 갈 수 있어요.", d: "more often", k: ["식사는 누가 챙겨 드려요?", "최근에 체중이 줄었나요?"], a: "less", o: ["more", "faster", "slower"]}
  - {t: "치료 안내", i: pill, w: "carefully로 한 번에 많이 넣지 않는다는 걸 말해 천천히 하는 이유를 가족이 이해하게 해요. 고령자는 심장·신장이 약할 수 있어 수액을 너무 빨리 넣으면 폐에 물이 찰 수 있어요.", d: "and leave her alone", k: ["수액은 팔 정맥으로 넣어요", "혈당은 한 시간마다 확인해요"], a: "carefully", o: ["quickly", "freely", "rarely"]}
  - {t: "감시 안내", i: monitor, w: "keep a close eye on은 '유심히 지켜본다'는 관용 표현이에요. 수액이 많이 들어가면 심장과 신장이 감당하는지가 가장 먼저 영향을 받아요.", d: "a loose grip", k: ["신장 기능은 혈액검사로 봐요", "소변량도 같이 재요"], a: "kidneys", o: ["liver", "skin", "spine"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "HHS 노인 가족 응대 4문장 순서"
    why: "졸림이 언제부터인지 묻고, 그 뒤로 먹고 마신 양이 줄었는지 묻고, 그것이 높은 혈당·탈수를 설명한다고 말한 뒤 치료와 감시를 알려요. 'since then'·'That'·'it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How long has she been drowsy and confused?", icon: calendar, ko: "언제부터 졸리고 혼란스러워하셨어요?", note: "경과"}
    - {en: "Has she been eating or drinking less than usual since then?", icon: coffee, ko: "그 뒤로 평소보다 덜 드시거나 덜 마셨나요?", note: "섭취"}
    - {en: "That could explain why her sugar is extremely high and she's so dehydrated.", icon: chartup, ko: "그래서 혈당이 아주 높고 탈수도 심한 걸 수 있어요", note: "설명"}
    - {en: "To treat it, we'll give fluids carefully and keep a close eye on her heart and kidneys.", icon: pill, ko: "치료로 수액을 조심스럽게 주고 심장과 신장을 지켜볼게요", note: "치료"}
  ctx: {word: "dehydrated", ko: "탈수된", sc: {0: {en: "Glucose is over 600 and she's severely dehydrated — looks like HHS."}, 2: {en: "She's in a hyperosmolar hyperglycemic state with profound dehydration."}}, why: "hyperosmolar hyperglycemic state는 의료진의 말이에요. 가족에게는 dehydrated처럼 쉬운 말로 혈당이 아주 높고 탈수가 심하다는 것, 그래서 혼란스러워한다는 것을 이어서 말해요."}
- title: 인슐린 펌프 사용자
  s:
  - {t: "교체 시점", i: calendar, w: "last change로 마지막 교체 한 번을 짚고 pump site and reservoir로 교체하는 두 부분을 같이 물어요. 주입 세트가 오래되면 막히거나 인슐린이 제대로 안 들어가 혈당이 올라요.", d: "and battery", k: ["펌프는 언제부터 쓰셨어요?", "오늘 펌프 알람이 울렸어요?"], a: "reservoir", o: ["case", "strap", "screen"]}
  - {t: "점검 안내", i: magnify, w: "Let's check로 함께 살펴본다는 말투로 열고 whether…or…로 두 가지 가능성을 한 문장에 담아요. 튜브가 꺾이거나 삽입 부위에 문제가 있으면 인슐린이 들어가지 않는 흔한 원인이에요.", d: "or the alarm is loud", k: ["펌프를 잠깐 멈출게요", "새 세트로 바꿔 드릴게요"], a: "red", o: ["cold", "dry", "heavy"]}
  - {t: "시작 시점", i: chartup, w: "start rising으로 오르기 '시작한' 때를 물어 변화의 출발점을 잡아요. 펌프는 속효성 인슐린만 써서 주입이 끊기면 몇 시간 안에 혈당이 오르기 시작해요.", d: "stop rising", k: ["펌프를 마지막으로 확인한 게 언제예요?", "지금 혈당은 얼마예요?"], a: "rising", o: ["falling", "dropping", "crashing"]}
  - {t: "설정 확인", i: gear, w: "current로 지금 설정값만 묻고 set at으로 숫자를 대답하게 이끌어요. basal은 하루 종일 조금씩 들어가는 배경 인슐린이라, 기저율이 맞아야 식사 사이 혈당이 안정돼요.", d: "bolus ratio", k: ["식사 때는 얼마나 주입하세요?", "펌프는 어디에 달고 계세요?"], a: "basal", o: ["bolus", "target", "delivery"]}
  - {t: "대안 안내", i: pill, w: "We may need to로 가능성으로 먼저 알려 환자가 놀라지 않게 해요. 펌프가 멈추면 몇 시간 만에 DKA로 갈 수 있어서 주사가 안전한 대안이에요.", d: "by video", k: ["펌프는 잠시 빼 둘게요", "새 장치를 갖다 드릴게요"], a: "injection", o: ["mouth", "tablet", "spray"]}
  - {t: "전환 안내", i: gear, w: "until로 일시적인 조치임을 알려 펌프를 영영 못 쓰는 게 아니라는 안심을 줘요. 문제를 고치거나 새 세트로 바꾼 뒤 다시 펌프로 돌아가는 경우가 많아요.", d: "is thrown away", k: ["펌프는 보관해 두세요", "주사 놓는 법은 알려 드릴게요"], a: "injections", o: ["pills", "patches", "drops"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "인슐린 펌프 문제 4문장 순서"
    why: "혈당이 언제부터 올랐는지 묻고, 그 원인이 될 수 있는 튜브와 부위를 점검하고, 이 문제를 해결하는 동안 주사를 쓰겠다고 하고, 해결되면 펌프로 돌아간다고 닫아요. 'that'·'whatever we find'·'back to the pump'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did your sugar start rising?", icon: chartup, ko: "혈당이 언제부터 오르기 시작했어요?", note: "시점"}
    - {en: "Let's check whether the tubing is kinked or the site is red, since that can cause it.", icon: magnify, ko: "그 원인이 될 수 있어서 튜브와 부위를 확인해 볼게요", note: "점검"}
    - {en: "We'll give insulin by injection while we sort out whatever we find.", icon: pill, ko: "찾은 문제를 해결하는 동안 인슐린을 주사로 놓을게요", note: "대안"}
    - {en: "We'll switch you back to the pump once it's fixed.", icon: gear, ko: "고쳐지면 다시 펌프로 바꿔 드릴게요", note: "복귀"}
  ctx: {word: "pump", ko: "펌프", sc: {2: {en: "Your insulin pump has malfunctioned, so we're transitioning you to subcutaneous insulin."}}, why: "malfunctioned·transitioning·subcutaneous는 의료진의 말이에요. 펌프는 속효성 인슐린만 쓰기 때문에 멈추면 몇 시간 만에 DKA로 갈 수 있어서 바로 주사로 바꿔요. 환자에게는 쉬운 말로, 언제까지인지도 함께 말해요."}
- title: 스테로이드 유발 고혈당
  s:
  - {t: "시작 시점", i: calendar, w: "start the steroid로 복용을 시작한 시점을 묻고 medication으로 약임을 분명히 해요. 스테로이드는 복용 후 수 시간에서 며칠 안에 혈당을 올리기 시작하는 경우가 많아 시점이 중요해요.", d: "stop the", k: ["지금은 하루에 몇 번 드세요?", "몇 mg을 드시고 계세요?"], a: "steroid", o: ["antibiotic", "vitamin", "thyroid"]}
  - {t: "목적 문진", i: pill, w: "taking…for의 전치사가 문장 끝에 와서 '무엇 때문에'를 묻는 자연스러운 형태예요. 천식·염증·알레르기처럼 이유에 따라 스테로이드를 쓰는 기간이 달라 혈당에 미치는 영향도 가늠돼요.", d: "with", k: ["하루에 몇 알 드세요?", "처방은 누가 해 주셨어요?"], a: "taking", o: ["stopping", "skipping", "refusing"]}
  - {t: "원인 설명", i: bulb, w: "can으로 모든 사람이 그런 건 아니라는 여지를 두고 temporarily로 일시적이라는 한계를 밝혀요. 스테로이드는 간에서 당을 더 만들고 인슐린 작용을 떨어뜨려 혈당을 올려요.", d: "permanently", k: ["약은 임의로 끊지 마세요", "혈당은 수치로 확인할게요"], a: "raise", o: ["lower", "steady", "reduce"]}
  - {t: "안심", i: faceWorried, w: "usually로 대부분 그렇지만 예외가 있다는 여지를 남겨요. 용량을 줄이거나 끊으면 대개 혈당이 내려가지만, 그동안은 혈당 감시가 필요해요.", d: "is rarely temporary", k: ["이 약은 천식 때문에 쓰는 거예요", "당분간 식단을 조금 바꿔 볼게요"], a: "temporary", o: ["permanent", "constant", "dangerous"]}
  - {t: "계획 안내", i: monitor, w: "monitor와 adjust 두 동사로 '지켜보고, 필요하면 바꾼다'는 순서를 말해요. 스테로이드 고혈당은 식후와 오후에 두드러져서 그 시간대 혈당 추이를 보며 인슐린을 조정해요.", d: "and stop your treatment", k: ["혈당은 하루 몇 번 재요", "식사는 평소대로 하셔도 돼요"], a: "adjust", o: ["cancel", "delay", "repeat"]}
  - {t: "치료 안내", i: pill, w: "may need으로 확정이 아닌 가능성으로 알려요. 스테로이드를 줄이거나 끊으면 인슐린 필요량도 다시 줄어서 그때는 저혈당에 주의해야 해요.", d: "extra food", k: ["식사 시간은 평소와 같게 하세요", "혈당 수치는 기록해 두세요"], a: "extra", o: ["less", "little", "no"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "스테로이드 고혈당 4문장 순서"
    why: "스테로이드를 왜 먹는지 묻고, 그걸 언제 시작했는지 묻고, 그것이 혈당을 올렸을 수 있다고 설명하고, 그 상승을 지켜보며 치료를 조정한다고 닫아요. 'it'·'that rise'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "What are you taking the steroid for?", icon: pill, ko: "스테로이드는 무엇 때문에 드시는 거예요?", note: "목적"}
    - {en: "How long ago did you start it?", icon: calendar, ko: "그걸 언제부터 드셨어요?", note: "시점"}
    - {en: "Steroids can temporarily raise your blood sugar, which may explain why it has risen.", icon: bulb, ko: "스테로이드가 일시적으로 혈당을 올릴 수 있어서 그래서 올랐을 수 있어요", note: "설명"}
    - {en: "We'll monitor that rise and adjust your treatment, which may mean extra insulin while you're on it.", icon: monitor, ko: "그 상승을 지켜보며 치료를 조정할 거고 추가 인슐린이 필요할 수도 있어요", note: "계획"}
  sw: {ko: "스테로이드는 일시적으로 혈당을 올릴 수 있어요"}
- title: 당뇨+감염 혈당불안정
  s:
  - {t: "증상 문진", i: stetho, w: "What…have you had로 증상의 종류를, for how long으로 기간을 한 문장에 함께 물어 대답 한 번에 두 정보를 얻어요. 감염이 있으면 스트레스 호르몬이 올라 혈당이 오르고 인슐린이 덜 듣는 일이 흔해요.", d: "or why", k: ["열이 나거나 오한이 있으세요?", "기침이나 가래가 있으세요?"], a: "infection", o: ["allergy", "stomach", "heart"]}
  - {t: "기간 문진", i: calendar, w: "have you had로 앓기 시작한 때부터 지금까지를 묻는 현재완료예요. 독감 같은 열병은 며칠만 지나도 먹고 마시는 양이 줄어 혈당이 흔들리기 쉬워요.", d: "how often", k: ["독감 주사는 맞으셨어요?", "지금 열은 얼마나 되세요?"], a: "flu", o: ["rash", "cough", "headache"]}
  - {t: "이유 설명", i: bulb, w: "make…harder to로 '더 어렵게 만든다'는 구조예요. 아프면 스트레스 호르몬이 늘고 먹는 양이 불규칙해져서 평소 용량으로는 혈당이 잘 안 잡혀요.", d: "simpler to", k: ["약은 평소대로 드세요", "혈당은 더 자주 재 보세요"], a: "harder", o: ["easier", "quicker", "safer"]}
  - {t: "섭취 문진", i: coffee, w: "Have you been able to로 '못 했나'를 직접 묻는 대신 가능했는지를 묻는 부드러운 형태예요. 아플 때는 먹지 못해도 인슐린은 계속 필요해서 세 가지를 같이 확인해요.", d: "and refuse", k: ["구토나 설사는 없으셨어요?", "수분은 충분히 드셨어요?"], a: "insulin", o: ["aspirin", "vitamins", "supplements"]}
  - {t: "혈당 확인", i: lab, w: "Keep…ing로 한 번이 아니라 계속하라고 하고 while you're sick로 기간을 아픈 동안으로 정해요. 아플 때는 혈당이 빠르게 변해서 보통 몇 시간마다 재라고 안내해요.", d: "every other week", k: ["물을 충분히 드세요", "열이 나면 바로 알려 주세요"], a: "more often", o: ["less often", "once a month", "only at night"]}
  - {t: "당부", i: shield, w: "Never로 예외 없는 규칙임을 분명히 하고 even if로 흔한 오해('못 먹으니 안 맞아도 된다')를 먼저 막아요. 아플 때도 몸에는 기저 인슐린이 필요해서 걸러서는 안 돼요.", d: "Please delay", k: ["못 드시면 주스라도 드세요", "용량은 의사와 상의해서 정하세요"], a: "skip", o: ["double", "share", "borrow"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "아플 때 혈당 관리 4문장 순서"
    why: "독감이 얼마나 됐는지 묻고, 그 뒤로 먹고 마시고 인슐린을 맞았는지 묻고, 그것을 건너뛰면 혈당이 더 안 잡힌다고 설명한 뒤, 그래서 인슐린은 거르지 말라고 당부해요. 'since it started'·'any of those'·'that reason'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How long have you had the flu?", icon: calendar, ko: "독감을 앓으신 지 얼마나 되셨어요?", note: "기간"}
    - {en: "Have you been able to eat, drink, and take your insulin since it started?", icon: coffee, ko: "시작된 뒤로 먹고 마시고 인슐린도 맞을 수 있으셨어요?", note: "섭취"}
    - {en: "Skipping any of those can make your sugars harder to control, so keep checking them more often.", icon: bulb, ko: "그걸 거르면 혈당 조절이 더 어려워져서 더 자주 확인하세요", note: "이유"}
    - {en: "For that reason, never skip your insulin, even if you can't eat much.", icon: shield, ko: "그래서 잘 못 드셔도 인슐린은 절대 거르지 마세요", note: "당부"}
  ctx: {word: "sick", ko: "아픈", sc: {0: {en: "Pt sick with influenza x3 days; labile BG; sick-day plan reviewed."}, 1: {en: "He's sick with the flu and his sugars are all over the place."}, 2: {en: "You are sick, and that is causing significant glycemic lability."}}, why: "glycemic lability(혈당 변동)는 차트의 말이에요. 같은 sick이라도 환자에게는 아프면 혈당이 흔들려 조절이 더 어려워진다고 쉬운 말로 알려요."}
- title: 저혈당 반복 고령자
  s:
  - {t: "약 문진", i: pill, w: "Which…로 약 이름을, at what times로 시간을 한 문장에 함께 물어 복용 일정을 한 번에 파악해요. 설폰요소제나 인슐린은 고령자에서 저혈당을 일으키기 쉬워서 약과 시간을 먼저 확인해요.", d: "and from where", k: ["약은 누가 챙겨 드려요?", "약통은 가져오셨어요?"], a: "diabetes", o: ["heart", "thyroid", "stomach"]}
  - {t: "빈도 문진", i: calendar, w: "How many times로 횟수를 묻고 this month로 기간을 한정해 반복 정도를 숫자로 잡아요. 반복되는 저혈당은 약 용량이나 식사 패턴을 다시 봐야 한다는 신호예요.", d: "how long", k: ["가장 최근에는 언제 있었어요?", "그때 혼자 계셨어요?"], a: "happened", o: ["improved", "stopped", "spread"]}
  - {t: "낙상 문진", i: faceWorried, w: "caused you to fall로 저혈당이 낙상의 원인이었는지 묻고 or nearly fall로 '넘어질 뻔'까지 포함해요. 고령자의 저혈당은 낙상과 골절로 이어지기 쉬워 아찔했던 순간까지 확인해요.", d: "or nearly drive", k: ["넘어졌을 때 다치신 데는 없으세요?", "집에 손잡이가 있으세요?"], a: "low", o: ["high", "steady", "normal"]}
  - {t: "전조 증상", i: stetho, w: "before you fell로 넘어지기 전의 순서를 묻고 dizzy or faint로 전조 증상을 고르게 해요. 어지러움이 먼저 왔다면 저혈당 때문일 가능성이 커서 앞뒤 순서가 원인을 가려 줘요.", d: "after you", k: ["넘어진 곳은 어디였어요?", "옆에 누가 있었어요?"], a: "fell", o: ["ate", "stood up", "left"]}
  - {t: "약 조정", i: pill, w: "review and adjust는 먼저 살펴보고 그다음 바꾼다는 순서를 한 쌍으로 말해요. 고령자는 혈당 목표를 느슨하게 잡아 저혈당 위험이 큰 약의 용량을 줄이는 경우가 있어요.", d: "and forget", k: ["약사도 같이 볼 거예요", "약 이름은 목록으로 드릴게요"], a: "adjust", o: ["refill", "repeat", "return"]}
  - {t: "계획 안내", i: shield, w: "set up a plan으로 구체적인 계획을 세운다고 약속하고 safer처럼 비교급으로 '더 낫게'만 말해 과장하지 않아요. 저혈당 응급 대처와 낙상 예방을 집 환경에 맞춰 세워요.", d: "at the clinic", k: ["가족에게도 설명해 드릴게요", "당분은 집에 두세요"], a: "safer", o: ["sicker", "quieter", "busier"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "반복 저혈당 고령자 4문장 순서"
    why: "이번 달 횟수를 묻고, 그 저혈당 때문에 넘어졌는지 묻고, 넘어지기 전 증상을 묻고, 그런 일을 막도록 약을 조정한다고 해요. 'these low sugars'·'you fell'·'those spells'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How many times has this happened this month?", icon: calendar, ko: "이번 달에 몇 번이나 이런 일이 있었어요?", note: "횟수"}
    - {en: "Have these low sugars caused you to fall or nearly fall?", icon: faceWorried, ko: "이런 저혈당 때문에 넘어지거나 넘어질 뻔하셨어요?", note: "낙상"}
    - {en: "Did you feel dizzy or faint before you fell?", icon: stetho, ko: "넘어지시기 전에 어지럽거나 실신할 것 같으셨어요?", note: "전조"}
    - {en: "We may need to adjust your medications to prevent those spells and any more falls.", icon: pill, ko: "그런 어지럼과 낙상을 막으려고 약을 조정해야 할 수도 있어요", note: "조정"}
  ctx: {word: "fall", ko: "낙상", sc: {1: {en: "That's her third low this month and she almost had a fall — can pharmacy review her meds?"}}}
- title: 임신성/임신 당뇨 위기
  s:
  - {t: "임신 주수", i: baby, w: "How many weeks로 주수를 숫자로 묻고 pregnant가 are you 앞에 형용사로 놓여요. 임신 주수에 따라 혈당 목표와 태아를 살피는 방법이 달라서 첫 질문 중 하나예요.", d: "sick", k: ["마지막 생리는 언제였어요?", "출산 예정일이 언제예요?"], a: "pregnant", o: ["overdue", "early", "late"]}
  - {t: "병력 문진", i: board, w: "before로 지난 임신까지 시야를 넓히고 had로 진단받은 적이 있는지 묻는 현재완료예요. 이전 임신에서 임신성 당뇨가 있었다면 이번에 다시 생길 위험이 높아요.", d: "recently", k: ["가족 중에 당뇨가 있으세요?", "임신 전에는 혈당이 정상이었어요?"], a: "gestational", o: ["chronic", "borderline", "juvenile"]}
  - {t: "목표 설명", i: bulb, w: "In pregnancy로 상황 조건을 앞에 두고 we aim for로 의도를 말해요. 임신 중 혈당이 높으면 태아가 크게 자라 출산 때 합병증이 늘어서 임신하지 않았을 때보다 목표를 엄격히 잡아요.", d: "higher sugar targets", k: ["식사는 하루 여섯 번으로 나눠 드세요", "아기는 초음파로 확인할게요"], a: "protect", o: ["weigh", "examine", "deliver"]}
  - {t: "이유 설명", i: shield, w: "Keeping으로 시작하는 동명사 주어가 '꾸준히 해 나갈 일'을 말해요. you both로 엄마와 아기를 함께 가리켜 혈당 관리가 아기를 위한 일이기도 하다고 동기를 줘요.", d: "worries you both", k: ["식후 혈당을 같이 볼게요", "식단은 영양사가 도와줄 거예요"], a: "protects", o: ["harms", "hurts", "bothers"]}
  - {t: "감시 안내", i: monitor, w: "also로 혈당 관리에 한 가지를 더한다고 알리고 the baby라는 일상어로 태아를 가리켜요. 산모의 혈당 위기에서는 태아 심박과 움직임을 같이 확인해요.", d: "your husband", k: ["가족분은 대기실에서 기다리셔도 돼요", "수액은 팔로 놓을 거예요"], a: "sugar", o: ["pain", "weight", "pressure"]}
  - {t: "심박 확인", i: monitor, w: "check on은 '상태를 살펴보다'로 단순한 check보다 돌보는 느낌이 있어요. as well로 앞서 말한 일에 더한다고 덧붙여요.", d: "weight as well", k: ["아기가 움직이는 게 느껴지세요?", "초음파를 한 번 더 볼게요"], a: "heartbeat", o: ["weight", "position", "gender"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "임신 중 혈당 위기 4문장 순서"
    why: "주수를 묻고, 그 시기에는 혈당 목표를 엄격히 잡는다고 설명하고, 목표 안에 유지하는 것이 두 사람을 지킨다고 하고, 그 방식으로 혈당을 관리하며 아기 심박도 확인한다고 해요. 'At that stage'·'both'·'that way'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How many weeks pregnant are you?", icon: baby, ko: "임신 몇 주 되셨어요?", note: "주수"}
    - {en: "At that stage we aim for tighter sugar targets to protect the baby.", icon: bulb, ko: "그 시기에는 아기를 보호하려고 혈당 목표를 더 엄격히 잡아요", note: "목표"}
    - {en: "Keeping your sugar in range protects you both.", icon: shield, ko: "혈당을 범위 안에 유지하면 두 분 모두에게 좋아요", note: "이유"}
    - {en: "We'll manage your sugar that way and check the baby's heartbeat too.", icon: monitor, ko: "그렇게 혈당을 관리하고 아기 심박도 확인할게요", note: "감시"}
  sw: {ko: "혈당을 관리하면서 아기도 함께 살펴볼게요"}
