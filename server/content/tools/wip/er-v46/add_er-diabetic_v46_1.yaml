- title: 혈당 측정·병력 문진
  s:
  - {t: "복용 시점", i: pill, w: "last를 take 앞에 두어 '마지막 한 번'을 묻고 시점을 하나로 좁혀요. 인슐린을 맞은 시각은 지금 혈당이 왜 이런지 읽는 첫 단서예요.", d: "how often", k: ["인슐린을 하루에 몇 번 맞으세요?", "지금 혈당부터 재 볼게요"], a: "insulin", o: ["metformin", "glipizide", "lisinopril"]}
  - {t: "식사 시점", i: coffee, w: "last eat는 마지막 식사 한 번을 짚어요. 인슐린 시각과 마지막 식사 시각을 맞춰 보면 저혈당 쪽인지 고혈당 쪽인지 가늠돼요.", d: "how much", k: ["오늘 뭘 드셨어요?", "지금 속이 메스꺼우세요?"], a: "eat", o: ["exercise", "vomit", "sleep"]}
  - {t: "종류 확인", i: pill, w: "Can you tell me…로 요청을 부드럽게 열고 what type of로 묻는 대상을 좁혀요. 속효성과 지속형은 작용 시간이 달라서, 종류를 알아야 저혈당 위험이 언제까지 갈지 어림돼요.", d: "what dose", k: ["인슐린을 하루에 몇 번 맞으세요?", "인슐린은 어디에 보관하세요?"], a: "type", o: ["dose", "brand", "amount"]}
  - {t: "검사 안내", i: lab, w: "I'm going to로 하려는 일을 미리 알려 환자가 놀라지 않게 해요. 증상만으로는 저혈당과 고혈당을 구분할 수 없어서 수치부터 확인해요.", d: "later today", k: ["혈압부터 재 볼게요", "피를 뽑아 검사실로 보낼게요"], a: "sugar", o: ["pressure", "type", "count"]}
  - {t: "채혈 안내", i: bandage, w: "prick은 '살짝 찌르다'라서 아프다는 걸 숨기지 않으면서 가볍게 알려요. 손끝 모세혈관에서 나온 피 한 방울이면 혈당 측정에 충분해요.", d: "your arm", k: ["팔에 정맥주사를 놓을게요", "상처 부위를 소독할게요"], a: "prick", o: ["wrap", "wash", "numb"]}
  - {t: "증상 확인", i: stetho, w: "any를 넣어 '있다면 뭐든'으로 열어 두고 right now로 지금 상태에 초점을 맞춰요. 고혈당과 저혈당은 증상이 겹쳐서 환자가 느끼는 것부터 들어요.", d: "last week", k: ["지금 드시는 약이 있으세요?", "최근에 넘어지신 적 있으세요?"], a: "right now", o: ["this week", "after meals", "at night"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "혈당 측정 전 문진 4문장 순서"
    why: "인슐린 시점을 묻고, 그 뒤에 먹은 것을 묻고, 두 답을 근거로 혈당을 재겠다고 알린 뒤 손끝을 찌른다고 말해요. 'after that'·'both answers'·'for it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did you last take your insulin?", icon: pill, ko: "마지막으로 인슐린을 언제 맞으셨어요?", note: "인슐린"}
    - {en: "Did you eat anything after that?", icon: coffee, ko: "그 뒤에 뭔가 드셨어요?", note: "식사"}
    - {en: "Going by both answers, I'm going to check your blood sugar now.", icon: lab, ko: "두 답을 보고 지금 혈당을 확인할게요", note: "검사"}
    - {en: "I'll prick your finger for it.", icon: bandage, ko: "그걸 위해 손끝을 찌를게요", note: "채혈"}
  sw: {ko: "지금 혈당을 확인할게요"}
- title: 저혈당 초기(경증)
  s:
  - {t: "증상 확인", i: stetho, w: "Do you feel…로 선택지 셋을 한꺼번에 던져 해당하는 것만 고르게 해요. 떨림·식은땀·어지러움은 저혈당일 때 아드레날린이 올라 나타나는 대표 증상이에요.", d: "or feverish", k: ["최근에 식사는 하셨어요?", "지금 바로 혈당을 재 볼게요"], a: "dizzy", o: ["feverish", "itchy", "swollen"]}
  - {t: "용량 확인", i: pill, w: "How much로 양을, today로 범위를 정해 오늘 맞은 총량을 물어요. 평소보다 많이 맞았거나 맞고 나서 식사를 거르면 저혈당이 잘 와요.", d: "how often", k: ["오늘 뭘 드셨어요?", "마지막으로 인슐린을 언제 맞으셨어요?"], a: "insulin", o: ["metformin", "glucose", "juice"]}
  - {t: "경구 당 투여", i: coffee, w: "Let's have you…는 '~하시게 할게요'로 지시를 함께하는 말투로 바꿔요. 의식이 또렷하고 삼킬 수 있는 경증 저혈당은 입으로 먹는 빠른 당(주스·포도당 정제)이 첫 처치예요.", d: "or a sandwich", k: ["우선 편하게 앉아 계세요", "오늘 식사는 하셨어요?"], a: "juice", o: ["insulin", "black coffee", "antacid"]}
  - {t: "재측정 안내", i: calendar, w: "recheck의 re-가 '다시'를, in fifteen minutes가 시점을 알려요. 당을 먹고 15분 뒤 혈당이 올랐는지 다시 재고, 안 올랐으면 다시 먹이는 것이 '15-15 규칙'이에요.", d: "after lunch", k: ["그동안 여기서 쉬고 계세요", "주스를 한 잔 더 가져올게요"], a: "fifteen", o: ["five", "thirty", "sixty"]}
  - {t: "경과 안내", i: faceWorried, w: "might로 낫는다고 단정하지 않으면서 once로 '이 조건이 되면'의 시점을 줘요. 먹은 당이 흡수되면 몇 분 안에 증상이 풀리는 경우가 많아 환자가 안심해요.", d: "even though", k: ["증상이 심해지면 바로 말씀해 주세요", "저혈당은 흔한 일이에요"], a: "better", o: ["worse", "weaker", "sicker"]}
  - {t: "경과 관찰", i: monitor, w: "keep watching은 한 번이 아니라 계속 지켜본다는 뜻이고 until이 끝나는 시점을 말해 줘요. 당을 먹은 뒤에도 혈당이 다시 떨어질 수 있어 증상이 가라앉을 때까지 곁에서 봐요.", d: "from the hallway", k: ["필요하면 언제든 부르세요", "간식을 하나 더 드릴게요"], a: "normal", o: ["tired", "thirsty", "sleepy"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "경증 저혈당 처치 4문장 순서"
    why: "증상을 묻고, 그 증상에 맞춰 주스를 권하고, 마신 뒤 혈당을 다시 재겠다고 알리고, 수치가 오르면 나아진다고 안심시켜요. 'that'·'it'·'it comes back up'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Do you feel shaky, sweaty, or dizzy?", icon: stetho, ko: "떨리거나 땀이 나거나 어지러우신가요?", note: "증상"}
    - {en: "Let's have you drink some juice for that.", icon: coffee, ko: "그것 때문에 주스를 좀 드시게 할게요", note: "처치"}
    - {en: "We'll recheck your sugar fifteen minutes after you finish it.", icon: calendar, ko: "다 드시고 십오 분 뒤에 혈당을 다시 잴게요", note: "재측정"}
    - {en: "Once it comes back up, you should feel better.", icon: faceWorried, ko: "수치가 다시 오르면 나아지실 거예요", note: "안심"}
  ctx: {word: "juice", ko: "주스", sc: {2: {en: "Administer 4 oz of juice PO now; BG recheck in 15 minutes."}}}
- title: 다뇨·다갈 고혈당 주소
  s:
  - {t: "빈도 문진", i: magnify, w: "How often으로 하루 몇 번인지 횟수를 끌어내요. have you been …ing는 지금까지 이어진 변화를 묻는 현재완료진행형이라 최근 패턴이 드러나요.", d: "how long ago", k: ["소변 색깔이 어떤가요?", "밤에도 소변 때문에 깨세요?"], a: "urinating", o: ["vomiting", "coughing", "sweating"]}
  - {t: "증상 문진", i: stetho, w: "unusually로 평소와 다른 정도만 짚게 해요. 고혈당이면 소변으로 물이 빠져나가 갈증이 생기고, 세포가 당을 못 써서 피로해져요.", d: "or itchy", k: ["체중이 줄지 않으셨어요?", "시야가 흐려지지 않으셨어요?"], a: "thirsty", o: ["achy", "itchy", "feverish"]}
  - {t: "수분 섭취", i: coffee, w: "keep up with는 필요한 양을 꾸준히 따라가는 것을 말해요. 고혈당으로 소변이 많아지면 마시는 양이 못 따라가서 탈수가 빨리 와요.", d: "to cut back", k: ["수분은 천천히 드세요", "마지막으로 소변 본 게 언제예요?"], a: "keep up with", o: ["cut back on", "give up on", "catch up on"]}
  - {t: "기간 문진", i: calendar, w: "How many days로 날짜를 세어 달라고 구체적으로 물어요. 며칠째인지에 따라 탈수와 고혈당이 얼마나 진행됐을지 가늠돼요.", d: "how many times", k: ["이런 증상이 전에도 있었나요?", "오늘 식사는 하셨어요?"], a: "this way", o: ["better", "worse", "sick"]}
  - {t: "가족력", i: home, w: "a history of로 과거부터 있었는지, in your family로 범위를 가족으로 한정해요. 가까운 가족에게 당뇨가 있으면 본인의 발병 위험도 높아져요.", d: "a habit of", k: ["지금 복용하시는 약이 있으세요?", "최근에 체중이 변하셨어요?"], a: "diabetes", o: ["asthma", "epilepsy", "glaucoma"]}
  - {t: "검사 안내", i: lab, w: "too로 혈당 말고 하나 더 본다는 걸 덧붙여요. 케톤은 몸이 당 대신 지방을 태울 때 생기는 물질이라 고혈당에서 산증(DKA) 여부를 가려 줘요.", d: "for fever too", k: ["수액을 먼저 시작할게요", "혈압도 같이 재 볼게요"], a: "ketones", o: ["infection", "bleeding", "bruises"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "고혈당 증상 문진 4문장 순서"
    why: "소변 빈도를 묻고, 그게 며칠째인지 묻고, 그동안 수분을 따라가는지 묻고, 모두 종합해 검사를 알려요. 'that'·'in that time'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How often have you been urinating?", icon: magnify, ko: "소변을 얼마나 자주 보셨어요?", note: "빈도"}
    - {en: "How many days has that been going on?", icon: calendar, ko: "그게 며칠째 계속됐어요?", note: "기간"}
    - {en: "Have you been able to keep up with drinking fluids in that time?", icon: coffee, ko: "그동안 수분은 충분히 드셨어요?", note: "수분"}
    - {en: "Given all of that, we'll check your blood sugar and look for ketones.", icon: lab, ko: "그 모든 걸 보고 혈당과 케톤을 확인할게요", note: "검사"}
  sw: {ko: "소변을 얼마나 자주 보셨어요?"}
- title: 인슐린 사용법 확인
  s:
  - {t: "방법 확인", i: pill, w: "show me로 말 대신 직접 보여 달라고 해서 실제 손놀림의 틀린 점을 찾아요. usually는 늘 하는 방식을 묻는 말이라 '오늘만'이 아닌 평소 습관이 드러나요.", d: "how often", k: ["인슐린은 어디에 보관하세요?", "펜 바늘은 매번 새것으로 바꾸세요?"], a: "usually", o: ["rarely", "first", "quickly"]}
  - {t: "부위 순환", i: pushpin, w: "Which spots로 부위를 먼저 묻고 rotate로 돌려 쓰는지를 이어서 물어요. 같은 자리에 계속 놓으면 피하지방이 단단해져 인슐린 흡수가 들쭉날쭉해져요.", d: "do you skip", k: ["주사 바늘은 어디에 버리세요?", "주사한 부위를 문지르시나요?"], a: "rotate", o: ["reuse", "cover", "rub"]}
  - {t: "누락 확인", i: calendar, w: "any doses로 '한 번이라도'를 묻고 recently로 최근으로 좁혀요. 빠뜨렸는지만 비난 없이 묻는 중립적인 말이라 환자가 솔직하게 답하기 쉬워요.", d: "any appointments", k: ["주사는 몇 시에 맞으세요?", "펜 바늘은 새것을 쓰세요?"], a: "doses", o: ["meals", "appointments", "checkups"]}
  - {t: "주사 부위", i: pushpin, w: "Where on your body로 신체 부위를 직접 묻고 inject로 '주사를 놓다'를 정확히 써요. 인슐린은 복부·허벅지·팔 윗부분의 피하지방층에 놓고, 부위마다 흡수 속도가 달라요.", d: "Where in town", k: ["주사는 하루에 몇 번 놓으세요?", "바늘은 한 번만 쓰세요?"], a: "inject", o: ["bruise", "itch", "sweat"]}
  - {t: "재설명", i: speech, w: "Let me…로 허락을 구하듯 제안해서 '또 설명한다'는 부담을 줄여요. walk you through는 한 단계씩 함께 따라가며 설명한다는 뜻이에요.", d: "all by yourself", k: ["제가 대신 주사해 드릴게요", "설명서는 집에서 읽어 보세요"], a: "one more time", o: ["at night", "once a day", "in a hurry"]}
  - {t: "이유 설명", i: shield, w: "helps prevent로 '막아 준다'는 효과를 말해 지시가 아닌 이유로 들려요. 같은 곳에 반복 주사하면 피부 아래가 단단히 뭉치고 그 자리에서는 인슐린이 제대로 흡수되지 않아요.", d: "keeps you from", k: ["주사 부위가 아프면 알려 주세요", "새 바늘로 바꿔서 놓으세요"], a: "prevent", o: ["cause", "spread", "cure"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "인슐린 사용법 확인 4문장 순서"
    why: "평소 놓는 방법을 보여 달라고 하고, 그 인슐린을 놓는 부위를 묻고, 그 부위를 돌려 쓰는 이유를 설명한 뒤, 모든 것을 한 번 더 안내해요. 'for it'·'those spots'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Can you show me how you usually give your insulin?", icon: pill, ko: "평소 인슐린을 어떻게 놓으시는지 보여주시겠어요?", note: "시연"}
    - {en: "Which spots do you use for it?", icon: pushpin, ko: "그걸 어느 부위에 놓으세요?", note: "부위"}
    - {en: "Rotating those spots helps prevent skin problems.", icon: shield, ko: "그 부위들을 돌려 놓으면 피부 문제를 예방해요", note: "이유"}
    - {en: "Let me walk you through all of that one more time.", icon: speech, ko: "그 모든 걸 한 번 더 안내해 드릴게요", note: "안내"}
  sw: {ko: "최근에 주사를 빠뜨리신 적 있으세요?"}
- title: 발 상처 당뇨 환자
  s:
  - {t: "기간 문진", i: calendar, w: "How long으로 지속 기간을 묻고 been there로 이미 있던 상처임을 전제해요. 당뇨 환자는 신경병증으로 발 감각이 둔해서 상처를 늦게 알아차리는 일이 많아 시점을 꼭 물어요.", d: "how deep", k: ["상처가 어떻게 생겼는지 기억하세요?", "지금 통증이 있으세요?"], a: "sore", o: ["rash", "bruise", "swelling"]}
  - {t: "병력 문진", i: board, w: "have you had로 진단 시점부터 지금까지를 묻는 현재완료예요. 당뇨를 앓은 기간이 길수록 신경·혈관 합병증이 쌓여 발 상처가 잘 낫지 않아요.", d: "how old", k: ["당뇨약은 어떤 걸 드세요?", "발은 매일 살펴보세요?"], a: "diabetes", o: ["asthma", "arthritis", "hypertension"]}
  - {t: "감염 징후", i: magnify, w: "redness·warmth·drainage 세 가지를 한 번에 나열해 감염 징후를 빠짐없이 묻는 틀이에요. around it으로 상처 주변만 보게 범위를 정해요.", d: "or numbness", k: ["발이 저리거나 감각이 없으세요?", "열이 나거나 오한이 있으세요?"], a: "warmth", o: ["itching", "dryness", "bruising"]}
  - {t: "이유 설명", i: bulb, w: "can으로 늘 그런 건 아니라는 여지를 두고 so로 확인하는 이유를 이어요. 혈당이 높으면 백혈구 기능과 혈류가 떨어져 상처가 늦게 아물고 감염에 약해져요.", d: "so we'll skip", k: ["상처에 연고를 바를게요", "발을 높이 올려 두세요"], a: "slow", o: ["speed", "improve", "support"]}
  - {t: "상처 처치", i: bandage, w: "clean and dress는 상처 처치의 두 단계를 한 묶음으로 말해요. carefully로 부드럽게 한다고 알려 아픔을 걱정하는 환자를 안심시켜요.", d: "and cut", k: ["상처 사진을 찍어 둘게요", "발에 체중이 실리지 않게 할게요"], a: "dress", o: ["measure", "photograph", "numb"]}
  - {t: "교육", i: shield, w: "Keeping으로 시작하는 동명사 주어가 '꾸준히 하는 일'을 말해요. 혈당이 안정되면 혈류와 면역이 나아져 상처가 낫는 속도가 빨라져요.", d: "slower", k: ["상처에 물이 닿지 않게 하세요", "신발은 꼭 신고 다니세요"], a: "faster", o: ["slower", "later", "harder"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "발 상처 문진 4문장 순서"
    why: "상처가 얼마나 됐는지 묻고, 그 주변의 감염 징후를 묻고, 그 징후가 왜 중요한지 혈당과 연결하고, 그래서 혈당 조절이 상처를 낫게 한다고 닫아요. 'it'·'Those signs'·'That's why'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How long has the sore been there?", icon: calendar, ko: "상처가 생긴 지 얼마나 되셨어요?", note: "기간"}
    - {en: "Is there any redness, warmth, or drainage around it?", icon: magnify, ko: "그 주변에 발적이나 열감, 삼출물이 있나요?", note: "징후"}
    - {en: "Those signs matter more because high blood sugar can slow healing.", icon: bulb, ko: "혈당이 높으면 회복이 늦어서 그 징후가 더 중요해요", note: "이유"}
    - {en: "That's why keeping your sugar controlled helps it heal faster.", icon: shield, ko: "그래서 혈당을 조절하면 더 빨리 나아요", note: "교육"}
  ctx: {word: "ulcer", ko: "궤양"}
- title: 전형 DKA
  s:
  - {t: "누락 확인", i: pill, w: "any insulin doses로 인슐린을 빠뜨린 적이 한 번이라도 있는지 묻고 recently로 최근으로 좁혀요. 인슐린을 걸렀거나 아플 때 못 맞은 일이 DKA의 흔한 계기예요.", d: "any visits", k: ["오늘 식사는 하셨어요?", "소변을 얼마나 자주 보세요?"], a: "insulin", o: ["steroid", "vitamin", "antibiotic"]}
  - {t: "호흡 문진", i: stetho, w: "faster or deeper를 나란히 놓아 환자가 느낀 쪽을 고르게 해요. 산증이 오면 몸이 이산화탄소를 내보내려고 깊고 빠르게 숨 쉬어요(Kussmaul 호흡).", d: "or noisier", k: ["숨 쉴 때 가슴이 아프세요?", "기침이나 가래가 있으세요?"], a: "deeper", o: ["slower", "quieter", "lighter"]}
  - {t: "냄새 문진", i: magnify, w: "냄새를 fruity or sweet 두 말로 설명해 주어 환자나 보호자가 떠올리기 쉬워요. DKA에서는 케톤(아세톤)이 날숨으로 나와 과일·단 냄새가 나요.", d: "or sour", k: ["입이 마르거나 쓴맛이 나세요?", "최근에 구토하셨어요?"], a: "fruity", o: ["minty", "smoky", "musty"]}
  - {t: "검사 안내", i: lab, w: "We're checking은 지금 진행 중인 일을 알리는 진행형이에요. 혈당·케톤·혈액가스 세 가지가 DKA 진단과 산증 정도를 가르는 기본 검사예요.", d: "your allergies", k: ["지금 정맥주사를 놓을게요", "가족에게 연락할게요"], a: "ketones", o: ["cholesterol", "vitamins", "hormones"]}
  - {t: "치료 안내", i: pill, w: "start IV fluids and insulin으로 치료의 두 축을 한 문장에 말해요. DKA는 탈수가 심해서 수액이 먼저이고, 인슐린은 케톤 생성을 멈추게 해요.", d: "and antibiotics", k: ["모니터를 연결할게요", "팔에 정맥주사를 놓을게요"], a: "fluids", o: ["antibiotics", "steroids", "vitamins"]}
  - {t: "준비 안내", i: check, w: "getting everything ready로 지금 준비 중이라는 진행 상황을 알려 불안을 줄여요. 아무 말 없이 기다리게 하는 것보다 지금 무엇이 진행 중인지 말해 주는 편이 환자를 안심시켜요.", d: "for your discharge", k: ["가족이 곧 오실 거예요", "이 자리에서 잠깐 기다려 주세요"], a: "ready", o: ["cleaned", "labeled", "ordered"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "DKA 의심 환자 4문장 순서"
    why: "인슐린 누락을 묻고, 그 뒤 호흡이 달라졌는지 묻고, 그 변화를 근거로 검사를 알리고, 검사 결과에 맞춰 치료를 시작한다고 말해요. 'since then'·'Those changes'·'those tests'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Have you missed any insulin doses recently?", icon: pill, ko: "최근에 인슐린 주사를 빠뜨리신 적 있으세요?", note: "누락"}
    - {en: "Has your breathing changed since then?", icon: stetho, ko: "그 뒤로 숨쉬기가 달라졌어요?", note: "호흡"}
    - {en: "Those changes can point to ketones, so we're checking your sugar, ketones, and blood gas now.", icon: lab, ko: "그런 변화는 케톤을 가리킬 수 있어서 지금 검사하고 있어요", note: "검사"}
    - {en: "Based on those tests, we'll start IV fluids and insulin.", icon: pill, ko: "그 검사 결과에 따라 수액과 인슐린을 시작할게요", note: "치료"}
  ctx: {word: "breathing", ko: "호흡", sc: {0: {en: "Kussmaul-type breathing, fruity breath odor."}, 2: {en: "Are you having Kussmaul breathing?"}}, why: "Kussmaul은 의료진과 차트의 말이에요. 같은 breathing도 환자에게는 faster·deeper처럼 스스로 느끼는 대로 답할 수 있게 풀어서 물어요."}
- title: 저혈당 의식저하
  s:
  - {t: "경과 문진", i: calendar, w: "notice로 '언제 알아차렸나'를 물어 보호자가 관찰한 시점을 끌어내요. 의식이 흐려진 시점과 마지막으로 정상이던 시점을 알아야 저혈당이 얼마나 이어졌는지 가늠돼요.", d: "unsteady", k: ["평소에도 이렇게 혼란스러워하세요?", "마지막으로 식사한 게 언제예요?"], a: "confused", o: ["thirsty", "angry", "upset"]}
  - {t: "반응 확인", i: speech, w: "responding when you speak to him은 목소리에 반응하는지 보는 AVPU의 'V'를 일상어로 풀었어요. 부르면 반응하는지가 의식 수준을 가르는 가장 빠른 단서예요.", d: "when you shake", k: ["지금 눈을 뜨고 있나요?", "어제도 이런 적이 있었나요?"], a: "responding", o: ["sleeping", "drinking", "walking"]}
  - {t: "처치 설명", i: pill, w: "directly into his vein으로 입이 아니라 정맥으로 넣는다는 걸 분명히 해요. 의식이 흐리면 삼키다 기도로 넘어갈 위험이 있어 입으로 먹이지 않고 정맥 포도당을 써요.", d: "under his tongue", k: ["혈당을 다시 재고 있어요", "산소를 연결하고 있어요"], a: "vein", o: ["mouth", "muscle", "stomach"]}
  - {t: "경과 안내", i: faceWorried, w: "should로 대개 그럴 것이라는 기대를 말하되 보장하지는 않아요. 정맥 포도당은 몇 분 안에 혈당을 올려서 의식이 돌아오기 시작하는 경우가 많아요.", d: "by next week", k: ["지금 의식이 돌아오고 있어요", "곧 식사를 하실 수 있어요"], a: "come back up", o: ["go back down", "drop off", "level off"]}
  - {t: "원인 문진", i: pill, w: "without eating으로 '먹지 않고'라는 조건을 붙여 저혈당의 흔한 원인을 직접 묻는 질문이에요. 인슐린은 혈당을 내리므로 식사 없이 맞으면 혈당이 지나치게 떨어질 수 있어요.", d: "without water", k: ["오늘 운동을 많이 하셨어요?", "술을 드셨나요?"], a: "insulin", o: ["metformin", "aspirin", "steroid"]}
  - {t: "병력 문진", i: board, w: "any other로 이미 말한 당뇨 외에 더 있는지 묻고 medical conditions로 지병을 넓게 포괄해요. 신장 질환이 있으면 인슐린이 몸에 오래 남아 저혈당이 길어질 수 있어요.", d: "recent injuries", k: ["평소 드시는 약이 있으세요?", "알레르기가 있으세요?"], a: "medical conditions", o: ["drug allergies", "recent injuries", "family members"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "저혈당 의식저하 가족 응대 4문장 순서"
    why: "혼란이 언제 시작됐는지 묻고, 그 전에 인슐린을 먹지 않고 맞았는지 묻고, 그것이 혈당을 떨어뜨렸다고 보고 정맥 당을 준다고 알린 뒤, 곧 오를 거라고 안심시켜요. 'before that'·'That'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did you notice he became confused?", icon: calendar, ko: "언제부터 혼란스러워하는 걸 알아차리셨어요?", note: "시점"}
    - {en: "Did he take his insulin without eating before that?", icon: pill, ko: "그 전에 식사 없이 인슐린을 맞으셨나요?", note: "원인"}
    - {en: "That could drop his sugar, so we're giving sugar directly into his vein right now.", icon: pill, ko: "그럼 혈당이 떨어질 수 있어서 지금 정맥으로 당을 주고 있어요", note: "처치"}
    - {en: "That should bring his sugar back up in a few minutes.", icon: faceWorried, ko: "그러면 몇 분 안에 혈당이 다시 오를 거예요", note: "안심"}
  sw: {ko: "지금 정맥으로 바로 당을 주고 있어요"}
