- title: 학대 의심 정황
  s:
  - {t: "경위 문진", i: magnify, w: "Help me understand로 추궁이 아니라 이해를 돕는 부탁으로 시작해요. 설명이 상처와 맞는지 보려고 경위를 구체적으로 묻는 것이 아동 학대 평가의 기본이에요.", d: "to school", k: ["아이가 평소에 어디서 노나요?", "아이가 최근에 아픈 적은 있었나요?"], a: "injury", o: ["fall", "burn", "bruise"]}
  - {t: "공통 질문", i: shield, w: "for every child로 이 질문이 이 가족만을 겨냥한 것이 아니라 모든 아이에게 하는 표준 절차라고 알려요. 비난으로 들리지 않게 하는 데 핵심이에요.", d: "on your own", k: ["아이는 지금 안전한 곳에 있어요", "질문이 불편하시면 말씀해 주세요"], a: "yours", o: ["mine", "ours", "theirs"]}
  - {t: "목적 강조", i: shield, w: "My main focus로 질문의 목적이 누군가를 찾는 것이 아니라 아이의 안전이라고 밝혀요. 보호자의 방어적 반응을 낮추고 협조를 얻는 데 도움이 돼요.", d: "at school", k: ["의사 선생님이 곧 진찰하실 거예요", "아이는 지금 편안하게 있어요"], a: "okay", o: ["hungry", "asleep", "cold"]}
  - {t: "경위 구체화", i: speech, w: "walk me through로 사건을 순서대로 차근차근 말하게 해요. just before처럼 특정 시점을 짚으면 기억이 구체적으로 나오고 설명이 일관적인지도 가늠할 수 있어요.", d: "at the park", k: ["넘어진 뒤 아이가 바로 울었나요?", "바닥은 어떤 재질이었나요?"], a: "before", o: ["after", "during", "since"]}
  - {t: "일상 절차", i: board, w: "part of our routine으로 특별한 의심이 아니라 일상 절차라고 설명해요. 모든 아이에게 같은 진찰을 한다는 점이 보호자의 방어감을 줄여요.", d: "for adults", k: ["검사는 오래 걸리지 않아요", "기록은 의사가 확인해요"], a: "routine", o: ["rare", "special", "private"]}
  - {t: "역할 설명", i: shield, w: "My job…is to keep him safe, nothing more으로 간호사의 역할을 아이 보호로 한정해요. 수사나 판단이 아니라는 점을 분명히 하면 보호자가 덜 방어적이 돼요.", d: "at the desk", k: ["아이를 여기 눕혀 주시겠어요?", "필요한 건 말씀해 주세요"], a: "safe", o: ["busy", "hungry", "quiet"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "경위 문진 4문장 순서"
    why: "경위를 이해하고 싶다고 부탁하고, 'it'이 그 손상을 가리켜 직전 상황을 묻고, 'These questions'가 방금의 질문들을 가리켜 일상 절차라고 설명하고, 'them'이 그 질문들을 받아 간호사의 역할을 아이 보호로 한정해요. 'it'·'These questions'·'them'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Help me understand exactly how the injury happened.", icon: magnify, ko: "다치신 경위를 정확히 이해할 수 있게 말씀해 주세요", note: "경위"}
    - {en: "Can you walk me through what happened just before it?", icon: speech, ko: "그 직전에 무슨 일이 있었는지 차근차근 말씀해 주시겠어요?", note: "구체화"}
    - {en: "These questions are part of our routine exam for every child who comes in.", icon: board, ko: "이 질문들은 오는 모든 아이에게 하는 일상적인 진찰의 일부예요", note: "절차"}
    - {en: "Beyond them, my job right now is to keep him safe, nothing more.", icon: shield, ko: "그 밖에 지금 제 역할은 아이를 안전하게 지키는 것뿐이에요", note: "역할"}
  sw: {ko: "어떻게 된 건지 정확히 이해할 수 있게 도와주세요"}
- title: 자폐·감각 예민 아동
  s:
  - {t: "진정 방법", i: handshake2, w: "Tell me what…으로 부모를 아이에 대한 전문가로 존중해요. 자폐 아동은 진정시키는 방법이 아이마다 달라서 보호자가 가장 잘 알아요.", d: "in the car", k: ["아이가 평소에 어떤 소리를 싫어하나요?", "아이가 말로 표현하는 편인가요?"], a: "calm", o: ["awake", "hungry", "busy"]}
  - {t: "감각 조정", i: bulb, w: "I'll…and…로 불빛과 목소리라는 두 가지 자극을 낮추겠다고 구체적으로 말해요. 감각에 예민한 아이는 밝은 조명과 큰 소리에 쉽게 압도돼요.", d: "at night", k: ["문을 닫아 둘까요?", "기다리는 동안 조용한 방으로 옮길게요"], a: "soft", o: ["loud", "sharp", "fast"]}
  - {t: "속도 존중", i: handshake2, w: "go at his pace로 진행 속도를 아이에게 맞추겠다고 하고 follow your lead로 보호자의 안내를 따르겠다고 해요. 예고 없는 변화에 힘들어하는 아이에게는 속도와 방식을 존중하는 것이 협조를 이끌어요.", d: "at school", k: ["아이가 불안해하면 알려 주세요", "순서는 미리 말씀드릴게요"], a: "follow", o: ["ignore", "change", "question"]}
  - {t: "감각 도구", i: speaker, w: "favorite toy or some headphones로 아이가 좋아하는 물건과 소리를 줄이는 도구를 함께 제안해요. 익숙한 물건과 헤드폰은 낯선 소음 속에서 아이를 안정시키는 데 흔히 써요.", d: "in the room", k: ["아이가 좋아하는 노래가 있나요?", "아이가 앉아 있을 의자를 가져올게요"], a: "headphones", o: ["sunglasses", "blankets", "bandages"]}
  - {t: "천천히 진행", i: check, w: "We can…and…로 속도와 범위를 조절할 수 있다고 알려요. 검사 중 소리·접촉 자극을 줄이면 자극에 민감한 아이가 덜 힘들어해요.", d: "at once", k: ["보호자분이 옆에 계셔도 돼요", "큰 소리가 나면 미리 말씀드릴게요"], a: "slowly", o: ["quickly", "loudly", "suddenly"]}
  - {t: "피드백 요청", i: speech, w: "let me know로 아이의 신호를 알려 달라고 부탁해요. 말이 적은 아이의 불편은 보호자가 가장 먼저 알아채서, 그 관찰에 의지한다는 뜻을 전해요.", d: "at the door", k: ["아이가 소리를 지르면 알려 주세요", "필요하면 의사에게 바로 전할게요"], a: "much", o: ["little", "slow", "far"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "자폐 아동 진료 4문장 순서"
    why: "진정 방법을 묻고, 'Thank you'가 그 대답을 받아 조명과 목소리를 조절하고, 'the lights'가 앞 줄의 조명을 가리켜 장난감과 헤드폰을 더 제안하고, 'them'이 그 물건들을 가리켜 속도를 맞추고 피드백을 부탁해요. 'Thank you'·'the lights'·'them'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Tell me what usually helps him stay calm.", icon: handshake2, ko: "평소에 뭐가 아이를 진정시키는지 알려주세요", note: "문진"}
    - {en: "Thank you. I'll dim the lights and keep my voice soft.", icon: bulb, ko: "고마워요. 불빛을 어둡게 하고 목소리도 부드럽게 할게요", note: "조정"}
    - {en: "Besides the lights, would his favorite toy or some headphones help?", icon: speaker, ko: "불빛 말고도 좋아하는 장난감이나 헤드폰이 도움이 될까요?", note: "제안"}
    - {en: "With them in place, we'll go at his pace, and please tell me if anything I'm doing is too much for him.", icon: check, ko: "그게 갖춰지면 아이 속도에 맞출게요. 제가 하는 게 과하면 알려주세요", note: "진행"}
  sw: {ko: "아이 속도에 맞춰 진행할게요"}
- title: 청소년 비밀보장 경계
  s:
  - {t: "비밀보장", i: lock, w: "Some of…로 전부가 아니라 일부라고 한정해 거짓 약속을 피해요. 청소년 면담은 비밀을 지키되 안전이 걸리면 예외가 있다는 점을 먼저 정직하게 밝혀야 해요.", d: "in school", k: ["여기서는 편하게 물어봐도 돼", "오늘은 어디가 불편해서 왔어?"], a: "private", o: ["public", "recorded", "shared"]}
  - {t: "예외 안내", i: shield, w: "The only thing…is if your safety was at risk로 비밀을 지킬 수 없는 예외를 분명히 말해요. 자해·타해 위험이나 학대 같은 안전 문제는 비밀로 둘 수 없다고 미리 알려 주는 것이 청소년 면담의 기본이에요.", d: "in class", k: ["필요하면 언제든 다시 물어봐도 돼", "오늘 여기까지 오느라 힘들었지?"], a: "safety", o: ["address", "grade", "mood"]}
  - {t: "비판단", i: handshake2, w: "no judgment here로 솔직히 말해도 평가받지 않는다는 점을 먼저 보장해요. 청소년은 혼날까 봐 위험 행동을 숨기기 쉬워서 비판단적 태도가 정확한 정보를 얻게 해요.", d: "in class", k: ["어디가 불편한지 말해 줄래?", "오늘 기분은 어때?"], a: "honest", o: ["quiet", "careful", "polite"]}
  - {t: "선택 제안", i: me, w: "Would you like…?로 내보낸다고 통보하지 않고 청소년에게 선택을 물어요. 민감한 질문은 보호자 없이 따로 하는 것이 일반적이지만 정중하게 제안해야 해요.", d: "for this call", k: ["부모님께는 곧 다시 들어오시라고 할게", "이 부분은 금방 끝날 거야"], a: "step out", o: ["sit down", "come in", "stay close"]}
  - {t: "위험 문진", i: magnify, w: "Are you…, or…?로 성·약물·술을 직설적이고 판단 없이 한 번에 묻는 말투예요. 청소년 진료에서는 이런 위험 요인을 본인에게 따로 묻는 것이 표준이에요.", d: "at night", k: ["최근에 다친 적이 있니?", "학교생활은 어때?"], a: "alcohol", o: ["vitamins", "caffeine", "candy"]}
  - {t: "안전 확인", i: shield, w: "If you ever…로 지금이 아니어도 언제든 말해도 된다는 열린 문을 둬요. 집에서의 안전 문제는 아이가 먼저 꺼내기 어려워서 의료진이 먼저 길을 열어 주는 것이 중요해요.", d: "at school", k: ["연락처를 적어 줄게", "오늘 얘기는 여기까지만 할게"], a: "unsafe", o: ["bored", "tired", "hungry"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "청소년 비밀보장 4문장 순서"
    why: "비밀로 남는 부분이 있다고 말하고, 'exception'이 그 비밀의 예외를 가리켜 안전 문제를 말하고, 'the private part'가 처음 말한 비밀 부분을 가리켜 부모의 퇴실을 제안하고, 'Whatever you decide'가 그 제안에 대한 선택을 받아 솔직히 말해도 된다고 안심시켜요. 'exception'·'the private part'·'Whatever you decide'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Some of what we talk about can stay private.", icon: lock, ko: "우리가 나누는 얘기 중 일부는 비밀로 남을 수 있어", note: "비밀"}
    - {en: "The only exception I'd make is if your safety was at risk.", icon: shield, ko: "내가 예외로 두는 건 네 안전이 위험할 때뿐이야", note: "예외"}
    - {en: "Would you like your parents to step out for the private part?", icon: me, ko: "비밀로 할 부분은 부모님이 잠시 나가 계셨으면 좋겠어?", note: "제안"}
    - {en: "Whatever you decide, you can be honest with me — no judgment here.", icon: handshake2, ko: "어떻게 정하든 나한테는 솔직해도 돼 — 판단하지 않아", note: "안심"}
  sw: {ko: "네가 나한테 말하는 대부분은 비밀로 지켜질 거야"}
- title: 신생아 이상 징후
  s:
  - {t: "수유·기면", i: coffee, w: "When…and how long…으로 마지막으로 잘 먹은 시점과 처진 기간을 한 문장에 묻는 두 질문이에요. 신생아가 먹기를 거부하고 유난히 처지는 것은 감염이나 황달의 단서일 수 있어요.", d: "since birth", k: ["출산은 순조로웠나요?", "아이가 몇 주 만에 태어났나요?"], a: "sleepy", o: ["hungry", "fussy", "cold"]}
  - {t: "황달 안내", i: magnify, w: "right away로 지금 바로 확인한다고 말해 부모의 걱정을 덜어요. 신생아의 노란 빛은 황달일 수 있고 수치가 높은지 빠르게 확인해야 해요.", d: "in the hall", k: ["아이 몸무게도 같이 잴게요", "피부색을 밝은 불빛 아래서 볼게요"], a: "yellow", o: ["red", "green", "brown"]}
  - {t: "부모 인정", i: handshake2, w: "You were right to…로 데려온 판단이 맞았다고 확인해 줘요. 생후 한 달 안의 신생아는 증상이 빨리 나빠질 수 있어서 빨리 오는 것이 맞아요.", d: "back home", k: ["퇴원한 지 며칠 됐나요?", "임신 중에 별다른 문제는 없었나요?"], a: "newborns", o: ["toddlers", "teenagers", "adults"]}
  - {t: "배설 문진", i: calendar, w: "fewer…than usual로 평소와 비교한 기저귀 수의 감소를 물어요. 신생아는 소변이 줄면 수분 섭취 부족이나 탈수를 의심해요.", d: "than her sister", k: ["오늘 변은 어떤 색이었나요?", "열을 재 보셨나요?"], a: "fewer", o: ["more", "heavier", "bigger"]}
  - {t: "검사 설명", i: lab, w: "how high…level로 수치가 얼마인지를 본다고 설명해요. 황달 정도는 혈액의 빌리루빈 수치로 확인하고 치료가 필요한지 정해요.", d: "with a mask", k: ["결과가 나오면 의사가 먼저 설명해 드릴게요", "아이 체중도 같이 잴게요"], a: "jaundice", o: ["iron", "salt", "calcium"]}
  - {t: "신속 대응", i: bell, w: "so로 빨리 움직이는 이유를 앞 절에서 이어 줘요. 신생아는 감염이나 황달이 빠르게 진행할 수 있어서 증상이 있으면 서둘러 평가해요.", d: "at night", k: ["아이가 태어난 병원은 어디예요?", "집에서 열을 잰 적이 있나요?"], a: "sick", o: ["hungry", "tired", "cold"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "신생아 이상 징후 4문장 순서"
    why: "수유와 처진 기간을 묻고, 'Thank you'가 그 대답을 받아 노란빛을 바로 확인하겠다고 하고, 'it'이 그 노란빛을 가리켜 혈액 검사를 설명하고, 'That's why'가 앞의 검사와 신속함을 이유로 받아 부모의 판단을 인정해요. 'Thank you'·'it'·'That's why'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "When did she last feed well, and how long has she been sleepy?", icon: coffee, ko: "마지막으로 잘 먹은 게 언제고, 얼마나 오래 처져 있었나요?", note: "문진"}
    - {en: "Thank you. The yellow color is something we'll check right away.", icon: magnify, ko: "고마워요. 노란빛은 지금 바로 확인해 볼게요", note: "확인"}
    - {en: "To check it, we'll test her blood to see how high her jaundice level is.", icon: lab, ko: "확인하려고 혈액 검사로 황달 수치가 얼마나 높은지 볼게요", note: "검사"}
    - {en: "That's why newborns need quick attention — you were right to bring her in.", icon: handshake2, ko: "그래서 신생아는 빠른 대응이 필요해요 — 데려오신 게 맞아요", note: "인정"}
  ctx:
    word: "jaundice"
    ko: "황달"
    sc:
      2: {en: "Her jaundice is to the chest, and TSB's been sent to check her bili."}
- title: 소아 아나필락시스
  s:
  - {t: "응급 투약", i: siren, w: "right now와 it works fast로 지금 즉시 한다는 것과 효과가 빠르다는 것을 알려요. 에피네프린은 아나필락시스의 1차 치료약이라 가장 먼저 투여해요.", d: "for his rash", k: ["알레르기 반응을 확인하고 있어요", "아이 혈압을 계속 재고 있어요"], a: "epinephrine", o: ["lotion", "vitamins", "antacid"]}
  - {t: "보호자 안정", i: handshake2, w: "Stay with me로 보호자에게 곁에 있어 달라고 짧게 말하고 on top of…로 상황을 챙기고 있다고 전해요. 아이의 기도가 가장 급하다는 것을 부모에게도 정확히 알려요.", d: "by the door", k: ["아이는 저희가 계속 지켜보고 있어요", "곧 의사 선생님이 오실 거예요"], a: "airway", o: ["rash", "fever", "cough"]}
  - {t: "부모 인정", i: star, w: "in time으로 제때 왔다는 사실을 짚어 부모의 죄책감을 덜어요. 아나필락시스는 빨리 치료할수록 경과가 좋아요.", d: "at lunch", k: ["땅콩을 먹은 시간을 기억하세요?", "아이가 먹은 걸 말씀해 주시겠어요?"], a: "time", o: ["bed", "line", "trouble"]}
  - {t: "위급 설명", i: siren, w: "so로 목이 붓고 있다는 이유와 바로 조치한다는 결과를 이어요. 목구멍·기도가 붓는 것은 숨길을 막을 수 있어서 가장 급한 소견이에요.", d: "in the hall", k: ["숨소리를 계속 확인하고 있어요", "산소를 연결해서 숨을 도울게요"], a: "swelling", o: ["itching", "burning", "shaking"]}
  - {t: "부모 협조", i: me, w: "Try to…로 명령이 아니라 시도해 보라는 부드러운 요청이고 이유를 덧붙여 따르게 해요. 응급 중에는 보호자가 침착해야 의료진이 안내하기 쉬워요.", d: "for a while", k: ["아이 옆에서 목소리를 들려주세요", "필요한 건 저희가 곧 알려 드릴게요"], a: "harder", o: ["easier", "faster", "simpler"]}
  - {t: "원인 안내", i: shield, w: "We know…, so…로 원인과 앞으로의 계획을 이어 말해요. 원인 식품을 확인하면 이후 피하는 계획과 응급약 교육을 이어 갈 수 있어요.", d: "from school", k: ["퇴원할 때 응급약 사용법을 알려 드릴게요", "알레르기 전문의 진료를 안내해 드릴게요"], a: "caused", o: ["cured", "stopped", "treated"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "아나필락시스 설명 4문장 순서"
    why: "에피네프린을 지금 투여한다고 알리고, 'That's because'가 그 투여를 이유로 받아 목이 붓는다고 설명하고, 'That's why'가 그 위급함을 가리켜 보호자에게 곁에 있어 달라고 하고, 'what matters'가 지금까지의 모든 상황을 받아 제때 온 것을 인정해요. 'That's because'·'That's why'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We're giving him epinephrine right now — it works fast.", icon: siren, ko: "지금 바로 에피네프린을 투여하고 있어요 — 빠르게 들어요", note: "투약"}
    - {en: "That's because his throat is swelling and we need to act immediately.", icon: siren, ko: "목이 붓고 있어서 바로 조치해야 하기 때문이에요", note: "이유"}
    - {en: "That's why I need you to stay close — we're on top of his airway.", icon: handshake2, ko: "그래서 곁에 계셔 주세요 — 기도는 저희가 챙기고 있어요", note: "안정"}
    - {en: "You got him here in time — that's what matters most right now.", icon: star, ko: "제때 데려오셨어요 — 지금 가장 중요한 게 그거예요", note: "인정"}
  sw: {ko: "지금 바로 에피네프린을 놓고 있어요 — 빠르게 들어요"}
