- title: tPA 후 신경학 악화
  s:
  - {t: "투약 중단", i: siren, w: "tPA를 쓰는 중에 신경학적 악화나 두통·구토가 생기면 출혈을 의심해 먼저 투여를 멈춰요. I'm … right now로 지금 하는 일을 짧게 알려 환자를 안심시켜요.", d: "starting", k: ["약을 맞는 팔의 혈압을 다시 잴게요", "약 이름을 다시 확인할게요"], a: "stopping", o: ["changing", "checking", "refilling"]}
  - {t: "악화 보고", i: bell, w: "tPA를 투여하는 동안 위약감이 심해지면 출혈 같은 합병증의 신호일 수 있어서 환자에게도 말해 달라고 해요. if로 환자가 무엇을 알려야 하는지 분명히 해요.", d: "better", k: ["숨쉬기 힘들면 말씀해 주세요", "입술이 붓는 것 같으면 말씀해 주세요"], a: "weakness", o: ["headache", "nausea", "swelling"]}
  - {t: "재촬영 필요", i: monitor, w: "tPA 뒤에 상태가 나빠지면 출혈 여부를 확인하려고 바로 CT를 다시 찍어요. urgent는 기다릴 수 없는 검사라는 뜻이에요.", d: "of your chest", k: ["머리 MRI를 내일 예약할게요", "머리 사진을 가족에게 보여 드릴게요"], a: "an urgent", o: ["a routine", "an optional", "a scheduled"]}
  - {t: "새 증상 문진", i: faceWorried, w: "tPA 뒤의 새로운 두통이나 혼돈은 뇌출혈의 경고일 수 있어서 투여 중에 계속 물어요. new와 since …로 약을 쓴 이후에 달라진 점만 짚어요.", d: "since you arrived", k: ["약을 맞은 후에 식사를 하셨나요?", "약을 맞는 곳이 아프지 않으세요?"], a: "confusion", o: ["itching", "cough", "fever"]}
  - {t: "우려 전달", i: faceWorried, w: "I'm worried는 불확실한 가능성을 솔직하게 말하면서 단정은 피하는 표현이에요. could mean으로 확정이 아님을 분명히 해요.", d: "hopeful", k: ["이건 피가 부족해서 생겼을 수 있어요", "이건 약이 안 들어서 생겼을 수 있어요"], a: "bleeding", o: ["swelling", "infection", "clotting"]}
  - {t: "속도 약속", i: siren, w: "as … as possible은 결과를 장담하지 않으면서 최대한 노력하겠다는 약속이에요. 기다리는 동안 무엇이 진행되는지 알려 줘요.", d: "tomorrow morning", k: ["촬영은 한 시간 뒤에 할게요", "촬영 비용은 보험으로 처리해요"], a: "fast", o: ["carefully", "quietly", "gently"]}
  - {t: "변화 관찰", i: bandage, w: "이전 상태와 비교하는 말(than it did …)을 쓰면 악화가 느낌이 아니라 관찰된 변화임을 전할 수 있어요. 신경학적 악화는 시간 순으로 비교해 기록해요.", d: "more swollen", k: ["오른팔의 혈압이 한 시간 전보다 높아요", "오른팔에 맞던 주사를 빼 드릴게요"], a: "weaker", o: ["stiffer", "heavier", "redder"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "tPA 후 악화 대응 4문장 순서"
    why: "악화된 팔을 먼저 알리고, 그 변화 때문에 투약을 멈추고, 멈춘 상태에서 출혈을 걱정해 긴급 재촬영을 알리고, 마지막에 그 촬영을 최대한 빨리 한다고 약속해요. 뒤 줄이 앞 줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "Your right arm looks weaker than it did an hour ago.", icon: bandage, ko: "오른팔이 한 시간 전보다 약해 보여요", note: "변화"}
    - {en: "Because of that change, I'm stopping the medication right now.", icon: siren, ko: "그 변화 때문에 지금 바로 약을 멈출게요", note: "중단"}
    - {en: "Now that it's stopped, we need an urgent repeat scan because I'm worried about bleeding in the brain.", icon: monitor, ko: "멈췄으니 뇌출혈이 걱정돼서 긴급 재촬영이 필요해요", note: "재촬영"}
    - {en: "We'll get the scan done as fast as possible.", icon: siren, ko: "최대한 빨리 촬영을 끝낼게요", note: "약속"}
  ctx: {word: "stop", ko: "멈추다"}
- title: 뇌간 경색 급속 의식저하
  s:
  - {t: "의식 확인", i: speaker, w: "의식이 떨어지는 환자에게는 목소리가 들리는지 물어 반응 수준을 확인해요. Stay with me는 환자를 놓치지 않겠다는 뜻이에요.", d: "feel my hand", k: ["제가 누구인지 알아보시겠어요?", "지금 눈을 뜰 수 있겠어요?"], a: "voice", o: ["name", "footsteps", "phone"]}
  - {t: "기도 확보", i: shield, w: "의식이 급히 떨어지면 혀나 분비물이 기도를 막을 수 있어서 기도를 먼저 확보해요. 기도, 호흡, 순환 순서에서 기도가 맨 앞이에요.", d: "your vision", k: ["호흡이 편해지도록 침대를 올려 드릴게요", "호흡수를 1분 동안 세어 볼게요"], a: "breathing", o: ["circulation", "swallowing", "speech"]}
  - {t: "팀 호출", i: bell, w: "삽관은 숙련된 의사 팀이 하는 시술이고, 간호사는 팀을 부르고 준비물을 챙겨요. I'm getting …은 지금 진행 중이라는 걸 알려 줘요.", d: "your family", k: ["지금 가족을 병실로 모실게요", "지금 산소 마스크를 가져올게요"], a: "intubation", o: ["dialysis", "surgery", "imaging"]}
  - {t: "상태 보고", i: monitor, w: "눈이 감기고 말에 반응하지 않는다는 관찰을 그대로 객관적으로 전하면 팀이 상황의 급함을 바로 이해해요. 해석보다 본 것을 먼저 말해요.", d: "opening", k: ["눈이 많이 붓고 눈물을 흘려요", "눈이 한쪽으로 쏠려 있어요"], a: "closing", o: ["rolling", "tearing", "twitching"]}
  - {t: "마취과 호출", i: bell, w: "어려운 기도 확보는 마취과가 도와요. 병원마다 호출 체계가 달라서 응급실 규정에 따라 부르고 상황을 짧게 전달해요.", d: "the surgeon", k: ["영상의학과에 촬영을 요청할게요", "약사에게 약 확인을 요청할게요"], a: "anesthesia", o: ["radiology", "pharmacy", "cardiology"]}
  - {t: "관찰 지시", i: monitor, w: "삽관 준비가 끝나기 전까지는 호흡 상태를 쉬지 않고 지켜보는 사람이 필요해요. while은 동시에 일어나는 일을 묶어 각자의 역할을 알려요.", d: "his blood sugar", k: ["그동안 그의 가족을 안내해 주세요", "그동안 그의 혈압을 낮춰 주세요"], a: "breathing", o: ["pulse", "color", "pupils"]}
  - {t: "준비 상황", i: bell, w: "가족에게 팀이 이미 움직이고 있다고 알리면 불안이 줄어요. now는 지금 진행 중이라는 점을 분명히 해요.", d: "tomorrow", k: ["팀이 지금 병실에서 나가고 있어요", "팀이 시술 결과를 확인하고 있어요"], a: "getting ready", o: ["practicing", "waiting", "training"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "뇌간 경색 의식저하 응대 4문장 순서"
    why: "의식을 붙잡는 질문으로 시작하고, 대답이 없자 기도를 확보하겠다고 알리고, 그 일을 위해 삽관 팀을 부르고, 준비하는 동안 호흡을 계속 지켜보게 해요. 뒤 줄이 앞 줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "Stay with me—can you hear my voice?", icon: speaker, ko: "정신 잃지 마세요, 제 목소리가 들리세요?", note: "의식"}
    - {en: "Since he can't answer me, we're securing his airway to protect his breathing.", icon: shield, ko: "대답을 못 하니 호흡을 보호하려고 기도를 확보해요", note: "기도"}
    - {en: "To do that, I'm getting the team for intubation now.", icon: bell, ko: "그러려고 지금 삽관할 팀을 부르고 있어요", note: "팀"}
    - {en: "Keep watching his breathing while we get everything ready.", icon: monitor, ko: "모두 준비하는 동안 계속 호흡을 지켜봐 주세요", note: "관찰"}
  sw: {ko: "기도를 보호하려고 호흡관을 넣어야 해요"}
- title: 뇌졸중 SBAR 인계
  s:
  - {t: "LKW 보고", i: calendar, w: "SBAR에서 마지막 정상 시각과 발현 시각을 구분해 말하면 의사가 치료 시간창을 바로 계산해요. 알 수 없는 것은 모른다고 분명히 보고해요.", d: "was 09:40", k: ["환자는 08:15에 응급실에 도착했습니다", "환자는 08:15에 마지막 식사를 했습니다"], a: "unclear", o: ["witnessed", "sudden", "gradual"]}
  - {t: "점수 변화", i: chartup, w: "처음 점수와 지금 점수를 함께 보고하면 악화 폭이 숫자로 바로 보여요. now up to는 올라갔다는 방향까지 짧게 말해요. NIHSS는 높을수록 증상이 심해요.", d: "Discharge", k: ["초기 혈당은 120이었고, 지금은 90입니다", "초기 혈압은 150이었고, 지금은 180입니다"], a: "up", o: ["down", "back", "close"]}
  - {t: "투약 보고", i: pill, w: "tPA를 시작한 시각을 정확히 알려야 인계받는 사람이 투여 후 경과 시간을 계산하고 관찰 일정을 맞춰요. watch for는 앞으로 지켜볼 위험을 말해요.", d: "ended", k: ["tPA는 09:40에 용량을 줄였습니다", "tPA 투여 전에 혈압을 재 보세요"], a: "started", o: ["stopped", "ordered", "finished"]}
  - {t: "환자 소개", i: me, w: "SBAR의 앞부분은 나이와 성별과 주된 문제를 한 문장으로 소개해요. 한쪽 위약은 방향까지 적어 줘야 의사가 어느 쪽 뇌를 의심할지 알아요.", d: "with chest pain", k: ["60세 남성 환자이고 흉통이 있습니다", "그는 60세 환자이고 오늘 퇴원합니다"], a: "left-sided", o: ["right-sided", "bilateral", "facial"]}
  - {t: "혈압 보고", i: monitor, w: "혈압 상태와 혈압약 투여 여부를 한 문장에 함께 보고하면 인계받는 사람이 치료 이력을 바로 알아요. no … given은 투여하지 않았다는 보고 문체예요.", d: "no insulin given", k: ["혈압은 안정적이었고 혈당도 정상이었습니다", "혈압을 오른팔에서 쟀습니다"], a: "antihypertensives", o: ["antibiotics", "anticoagulants", "analgesics"]}
  - {t: "후속 계획", i: monitor, w: "인계에는 앞으로 예정된 검사와 목적도 넣어요. 시간과 목적을 함께 말하면 받는 사람이 재촬영 시각에 맞춰 준비할 수 있어요.", d: "tomorrow morning", k: ["재촬영은 가족 도착 후에 예정돼 있습니다", "혈액검사는 한 시간 후에 예정돼 있습니다"], a: "bleeding", o: ["swelling", "fractures", "infection"]}
  - {t: "연락 요청", i: bell, w: "작은 변화라도 알려 달라는 요청은 신경학적 상태가 빨리 바뀌는 환자에게 중요해요. at all은 사소해 보이는 변화도 포함한다는 뜻이에요.", d: "when he wakes", k: ["그의 가족이 오면 연락 주세요", "그의 퇴원 서류가 나오면 연락 주세요"], a: "exam", o: ["diet", "room", "family"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "뇌졸중 SBAR 인계 4문장 순서"
    why: "누구에 대한 보고인지 밝히고, 그 환자의 시각 정보를 말하고, 그 이후의 점수 변화를 이어 말한 뒤, 그 증가를 근거로 후속 계획과 연락 요청을 해요. 뒤 줄이 앞 줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "I'm calling about a sixty-year-old man with left-sided weakness.", icon: me, ko: "좌측 위약이 있는 60세 남성 환자 건으로 연락드려요", note: "상황"}
    - {en: "For him, last known well was 08:15 and tPA was started at 09:40.", icon: calendar, ko: "그 환자의 마지막 정상 확인은 08:15, tPA는 09:40에 시작했어요", note: "배경"}
    - {en: "Since then, his NIHSS has gone from 12 up to 15.", icon: chartup, ko: "그 뒤로 NIHSS가 12에서 15로 올랐어요", note: "평가"}
    - {en: "Given that increase, repeat CT is in one hour, so please call me if his exam changes.", icon: bell, ko: "그 상승 때문에 한 시간 후 재촬영이니 검사 변화가 있으면 연락 주세요", note: "요청"}
  ctx: {word: "deterioration", ko: "악화"}
- title: 젊은 환자 경동맥 박리
  s:
  - {t: "목 외상 문진", i: bandage, w: "경동맥 박리는 목 외상이나 갑작스러운 목 움직임 뒤에 생길 수 있어요. sudden strain으로 눈에 띄는 부상이 없는 무리한 동작도 떠올리게 해요.", d: "any leg", k: ["목에 통증이 며칠이나 지속됐나요?", "목에 새로 생긴 혹이 만져지나요?"], a: "neck", o: ["back", "knee", "shoulder"]}
  - {t: "증상 순서", i: calendar, w: "목 통증이 신경 증상보다 먼저 시작됐는지는 박리를 의심하는 단서가 될 수 있어요. compared to로 두 증상의 시간 순서를 한 문장에 비교해 물어요.", d: "compared to the headache", k: ["목 통증이 지금 얼마나 심한가요?", "저림이 어느 쪽 몸에 있나요?"], a: "pain", o: ["swelling", "stiffness", "rash"]}
  - {t: "유발 활동", i: bandage, w: "목을 갑자기 꺾는 시술이나 무거운 것을 드는 동작이 동맥 벽에 손상을 줄 수 있어요. recent로 최근 일에 초점을 맞춰 기억을 더듬게 해요.", d: "daily", k: ["최근에 비행기로 장거리 여행을 하셨나요?", "최근에 새로운 약을 시작하셨나요?"], a: "recent", o: ["frequent", "regular", "painful"]}
  - {t: "원인 탐색", i: magnify, w: "젊은 환자의 뇌졸중은 고혈압 같은 흔한 원인보다 박리나 심장 문제처럼 덜 흔한 원인을 더 찾아봐요. so로 왜 다른 검사를 하는지 이유를 이어 줘요.", d: "old", k: ["젊으셔서 회복이 빠를 거예요", "젊으셔서 가족력부터 확인할게요"], a: "other", o: ["common", "simple", "usual"]}
  - {t: "원인 설명", i: stetho, w: "목 동맥 벽이 찢어지면 그 틈에 혈전이 생기거나 혈관이 좁아져 뇌로 가는 피가 줄어들어 뇌졸중이 올 수 있어요. tear는 환자가 이해하는 쉬운 말이에요.", d: "a bruise", k: ["목 동맥 수술을 받으셔야 할 수도 있어요", "이런 뇌졸중은 나이가 많을 때만 생겨요"], a: "artery", o: ["muscle", "bone", "nerve"]}
  - {t: "재문진", i: bandage, w: "앞에서 물은 요인을 다른 말로 한 번 더 물으면 환자가 놓친 기억을 떠올릴 수 있어요. Any …?는 짧게 줄인 문진 표현이에요.", d: "weekly", k: ["최근에 목을 심하게 다치셨나요?", "최근 운동 후에 다리가 아팠나요?"], a: "heavy", o: ["light", "short", "easy"]}
  - {t: "혈관 촬영", i: monitor, w: "박리는 목 혈관 영상으로 확인해요. to check for …는 검사의 목적을 밝혀 환자가 왜 찍는지 알게 해요.", d: "to repair", k: ["목 혈관에 약을 주사할게요", "목 혈관 수술 일정을 잡을게요"], a: "neck", o: ["leg", "brain", "heart"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "경동맥 박리 의심 문진 4문장 순서"
    why: "젊은 환자라 다른 원인을 찾는다고 알리고, 그 원인 중 하나로 목 동맥을 들어 외상을 묻고, 있었다면 통증 순서를 묻고, 어느 쪽이든 목 혈관을 촬영해요. 뒤 줄이 앞 줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "You're young for a stroke, so we look for other causes.", icon: magnify, ko: "뇌졸중을 겪기엔 젊으셔서 다른 원인을 찾아봐요", note: "이유"}
    - {en: "One cause is a tear in the neck artery, so did you have any neck injury?", icon: bandage, ko: "원인 하나는 목 동맥의 찢어짐인데, 목을 다친 적이 있나요?", note: "외상"}
    - {en: "If so, when did the neck pain start compared to the numbness?", icon: calendar, ko: "그렇다면 목 통증은 무감각과 비교해 언제 시작됐나요?", note: "순서"}
    - {en: "Either way, we'll image the neck vessels to check for a tear.", icon: monitor, ko: "어느 쪽이든 찢어졌는지 목 혈관을 촬영할게요", note: "촬영"}
  sw: {ko: "목 동맥이 찢어지면 이런 뇌졸중이 생길 수 있어요"}
- title: 악성 부종 감시
  s:
  - {t: "부종 감시", i: monitor, w: "큰 뇌졸중 뒤에는 며칠에 걸쳐 뇌가 부을 수 있어서 의식과 동공을 자주 확인하며 지켜봐요. closely는 간격을 좁혀 자주 본다는 뜻이에요.", d: "in the lungs", k: ["뇌 영상은 이미 다 끝났어요", "뇌압을 낮추는 수술을 예약했어요"], a: "swelling", o: ["bleeding", "infection", "clots"]}
  - {t: "동공 변화", i: magnify, w: "한쪽 동공이 커지는 것은 뇌압이 올라간다는 신호일 수 있어서 바로 알려야 하는 변화예요. that's an important change는 겁주지 않고 중요성을 알려 줘요.", d: "Both pupils", k: ["한쪽 눈꺼풀이 처졌어요", "오른쪽 눈이 충혈됐어요"], a: "larger", o: ["smaller", "redder", "cloudier"]}
  - {t: "즉시 보고", i: bell, w: "중요한 변화를 보면 혼자 판단하지 않고 바로 팀에 알려요. right away는 기록이나 다른 일보다 먼저라는 뜻이에요.", d: "after rounds", k: ["지금 바로 가족에게 알릴게요", "지금 바로 약을 투여할게요"], a: "team", o: ["family", "pharmacy", "chaplain"]}
  - {t: "원인 설명", i: stetho, w: "큰 뇌졸중에서는 손상된 뇌가 붓고, 두개골 안은 공간이 한정돼 압력이 오를 수 있어요. as는 한 일이 일어나는 동안 다른 일이 함께 진행됨을 보여 줘요.", d: "shrinks", k: ["이런 일은 며칠에 걸쳐 서서히 좋아져요", "이런 일은 약을 먹으면 바로 가라앉아요"], a: "large", o: ["mild", "old", "silent"]}
  - {t: "점검 지시", i: monitor, w: "동공은 뇌압 변화를 가장 빨리 보여 주는 신호 중 하나라서 간격을 정해 반복해서 봐요. for now는 지금 상태에 한정한 지시이며 의사 지시에 따라 바뀔 수 있어요.", d: "once a day", k: ["그의 침대 난간을 올려 주세요", "그의 체온을 기록해 주세요"], a: "pupils", o: ["pulse", "pain", "sugar"]}
  - {t: "의미 설명", i: faceWorried, w: "한쪽 동공이 커지는 것은 뇌압이 올라 뇌 일부가 눌릴 때 나타날 수 있어요. can mean은 가능성을 말하는 표현이라 확정적으로 들리지 않아요.", d: "an infection", k: ["동공이 커지는 것은 약 부작용일 수 있어요", "동공이 한쪽만 커지면 반드시 눈 질환이에요"], a: "pressure", o: ["fever", "sugar", "pulse"]}
  - {t: "외과 연락", i: bell, w: "큰 뇌졸중에서 뇌부종이 심해지면 수술 여부를 외과의가 판단해요. may need to는 확정이 아니라 가능성을 알리는 말이에요.", d: "this order", k: ["이 변화를 가족에게 설명해야 할 수도 있어요", "이 변화를 영상의학과에 알려야 할 수도 있어요"], a: "surgeon", o: ["dietitian", "pharmacist", "chaplain"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "뇌부종 악화 대응 4문장 순서"
    why: "감시 중에 동공이 커진 것을 알리고, 그 변화가 뇌압 상승일 수 있어 팀을 부른다고 하고, 팀이 오기 전까지 동공을 15분마다 확인하게 해요. 뒤 줄이 앞 줄을 가리켜서 순서가 하나예요."
    lines:
    - {en: "We're watching closely for swelling in the brain.", icon: monitor, ko: "뇌부종이 없는지 자세히 지켜보고 있어요", note: "감시"}
    - {en: "While we watch, one pupil is now larger—that's an important change.", icon: magnify, ko: "지켜보는 중 한쪽 동공이 커졌어요, 중요한 변화예요", note: "변화"}
    - {en: "That can mean rising pressure, so I'm alerting the team right away.", icon: bell, ko: "뇌압이 오른다는 뜻일 수 있어서 바로 팀에 알릴게요", note: "알림"}
    - {en: "Until they arrive, check his pupils every fifteen minutes.", icon: monitor, ko: "그들이 올 때까지 15분마다 동공을 확인해 주세요", note: "점검"}
  ctx: {word: "pupil", ko: "동공"}
