    goal: 1
    tag: 주수·출혈량
    icon: calendar
    why: 두 가지를 한 문장에 묻되 weeks along으로 주수를 쉬운 말로 물어요. 주수와 출혈량은 임신 초기 출혈의 위험도를 가늠하는 첫 정보예요.
    decoy: were you given
    distractorsKo:
    - 마지막으로 소변을 본 게 언제인가요?
    - 임신 검사는 해 보셨나요?
    blank:
      answer: bleeding
      options:
      - en: bleeding
      - en: discharge
      - en: nausea
      - en: swelling
  - en: Are you having any pain or cramping with it?
