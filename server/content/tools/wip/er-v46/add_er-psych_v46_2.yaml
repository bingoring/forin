- title: 자살 시도 직후 소통
  s:
  - {t: "곁에 있음", i: shield, w: "I'm glad you're here로 환자가 살아서 여기 있다는 사실을 환영해요. 시도 직후에는 수치심이 커서, 설명을 요구하지 않는다는 말이 먼저 부담을 덜어 줘요.", d: "for you", k: ["지금 가족분께 연락드릴까요?", "물을 좀 드시겠어요?"], a: "glad", o: ["sure", "afraid", "aware"]}
  - {t: "비난 안 함", i: shield, w: "You're not being judged로 환자가 두려워하는 것을 먼저 부정으로 말해 줘요. 이어 I just want to understand로 질문의 목적이 평가가 아니라 이해라고 밝혀요.", d: "for now", k: ["오늘 처음 입원하신 거예요?", "아픈 곳이 어디예요?"], a: "understand", o: ["measure", "record", "rate"]}
  - {t: "속도 존중", i: handshake2, w: "at your pace로 진행 속도를 환자에게 맡겨 통제감을 돌려줘요. 시도 직후에는 자기 삶을 통제할 수 없다는 느낌이 커서, 작은 선택권을 주면 협조가 늘어요.", d: "for the chart", k: ["다음 단계는 의사 선생님이 설명해 주실 거예요", "오늘 밤 담당 간호사는 저예요"], a: "next", o: ["last", "final", "same"]}
  - {t: "시간 주기", i: calendar, w: "Take all the time you need로 서두르지 않겠다는 허락을 직접 말로 줘요. 시도 직후에는 말을 꺼내기 어려워서, 대화를 시작하는 시점을 환자가 정하게 하면 방어가 줄어요.", d: "at the desk", k: ["침대 머리를 올려 드릴까요?", "불을 좀 낮춰 드릴까요?"], a: "time", o: ["paper", "coffee", "snacks"]}
  - {t: "비난 없음", i: shield, w: "No one here로 한 사람의 약속이 아니라 이곳 전체의 분위기를 말해요. 팀 전체가 비난하지 않는다고 하면 환자가 믿기 쉬워요.", d: "in this room", k: ["지금 몸 상태를 확인해 볼게요", "이 방은 조용히 유지할게요"], a: "judging", o: ["charging", "testing", "timing"]}
  - {t: "돌봄 약속", i: shield, w: "We're going to로 앞으로의 일을 확정적으로 약속하고 from here로 지금부터라는 시점을 줘요. 막막한 환자에게는 앞으로 누군가 돌본다는 확신이 불안을 가라앉혀요.", d: "at home", k: ["오늘 밤은 이 방에서 쉬실 거예요", "담요를 가져다 드릴까요?"], a: "care", o: ["notes", "pictures", "samples"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "자살 시도 직후 4문장 순서"
    why: "곁에 있어 기쁘다고 먼저 말하고, 그 말을 이어 설명하지 않아도 된다고 하고, 이야기하기 전의 시간을 주며 비난이 없다고 하고, 무슨 이야기든 속도에 맞춰 다음 단계로 간다고 닫아요. 'That's all'과 'Whatever we talk about'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm glad you're here.", icon: shield, ko: "여기 있어 다행이에요", note: "환영"}
    - {en: "That's all that matters right now, so you don't have to explain anything.", icon: check, ko: "지금은 그것만 중요해요, 설명하지 않아도 돼요", note: "안심"}
    - {en: "Take all the time you need before we talk — no one here is judging you.", icon: calendar, ko: "이야기하기 전에 시간을 가지세요 — 여기서는 아무도 비난하지 않아요", note: "시간"}
    - {en: "Whatever we talk about, we'll get through the next steps together, at your pace.", icon: handshake2, ko: "무슨 이야기든 다음 단계를 당신의 속도에 맞춰 함께 해요", note: "함께"}
  sw: {ko: "여기 있어 다행이에요 — 지금 당장 설명하지 않으셔도 돼요"}
- title: 자해 반복 청소년
  s:
  - {t: "비밀 한계", i: lock, w: "Some things…but safety로 지킬 수 있는 약속과 못 지키는 예외를 한 문장에 함께 말해요. 처음부터 예외를 말해 두면, 나중에 안전 때문에 알려야 할 때 신뢰가 덜 깨져요.", d: "with your friends", k: ["요즘 학교에서 힘든 일이 있었어요?", "집에서는 누구랑 같이 지내요?"], a: "stay", o: ["go", "fall", "move"]}
  - {t: "요구 존중", i: handshake2, w: "I hear that…으로 청소년이 말한 요구를 먼저 정확히 되받아 줘요. that's fair로 동의할 부분은 인정해서, 이어지는 안전 이야기가 협상이 아니라 협력으로 들리게 해요.", d: "with mom", k: ["학교 상담 선생님도 알고 계세요?", "이 방에서 편하게 앉으세요"], a: "talk", o: ["sleep", "study", "eat"]}
  - {t: "혼내지 않음", i: shield, w: "You're not in trouble로 환자가 가장 두려워하는 것을 먼저 부정해 줘요. 자해한 청소년은 혼날까 봐 숨기는 경우가 많아서, 돕기 위한 자리라는 목적을 바로 밝혀요.", d: "at school", k: ["학교는 어떻게 다니고 있어요?", "친한 친구는 있어요?"], a: "feel", o: ["look", "sound", "smell"]}
  - {t: "안전 우선", i: shield, w: "Before anything else로 질문의 순서를 말해 우선순위를 알려요. 자해 위험은 다른 이야기보다 먼저 확인해야 하고, 그 이유를 청소년에게 숨기지 않고 말해 줘요.", d: "for the doctor", k: ["요즘 학교 성적은 어때요?", "좋아하는 음악이 있어요?"], a: "safety", o: ["grades", "hobbies", "friends"]}
  - {t: "보호자 연결", i: handshake2, w: "Your mom wants to help로 보호자를 감시자가 아니라 돕는 사람으로 소개해요. that works for you로 방법을 청소년에게 맞춘다고 하면 보호자에게 알려도 자기 이야기를 빼앗기지 않는다는 느낌이 들어요.", d: "at home", k: ["어머니 연락처를 다시 확인할게요", "어머니와 따로 이야기해도 괜찮을까요?"], a: "works", o: ["pays", "waits", "ends"]}
  - {t: "비밀 허용", i: lock, w: "It's okay to로 원하는 마음 자체를 허락해 줘요. 사생활을 원하는 것은 청소년의 정상적인 발달이라서, 먼저 인정해 준 뒤 안전에 관한 예외를 따로 말해요.", d: "from school", k: ["그 이야기는 다음에 해도 괜찮아요", "편한 자리로 옮겨서 이야기할까요?"], a: "kept", o: ["shared", "posted", "repeated"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "자해 청소년 면담 4문장 순서"
    why: "혼내려는 게 아니라고 먼저 말하고, 그러려면 안전부터 물어야 한다고 이어 말하고, 안전 문제는 공유해야 한다고 한계를 밝히고, 그 보호자도 돕고 싶어 한다고 닫아요. 'To do that'과 'even with your mom'과 'She'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "You're not in trouble here; we just want to help you feel better.", icon: shield, ko: "여기서 혼나는 게 아니에요; 기분이 나아지도록 돕고 싶을 뿐이에요", note: "안심"}
    - {en: "To do that, I need to ask about your safety.", icon: shield, ko: "그러려면 안전에 대해 여쭤봐야 해요", note: "안전"}
    - {en: "Some things stay between us, but safety I must share, even with your mom.", icon: lock, ko: "어떤 건 우리끼리 두지만 안전은 어머니께도 공유해야 해요", note: "한계"}
    - {en: "She wants to help, and we'll find a way that works for you.", icon: handshake2, ko: "어머니도 돕고 싶어 하시고 당신에게 맞는 방법을 찾을 거예요", note: "보호자"}
  sw: {ko: "말씀하신 것 중 일부는 우리끼리만 두겠지만, 안전이 걱정되면 제가 알려야 해요"}
- title: 홀딩(비자의 억류) 고지
  s:
  - {t: "일시적 안내", i: lock, w: "temporary로 기한이 정해져 있다는 것을, while we assess로 끝나는 조건을 함께 알려요. 비자의 입원은 법으로 정해진 기한이 있어서(캘리포니아 5150은 72시간) 끝이 있다는 말이 사실이에요.", d: "at the desk", k: ["지금 입으신 옷은 보관해 둘게요", "가족에게 연락할 수 있어요"], a: "temporary", o: ["voluntary", "routine", "private"]}
  - {t: "권리 고지", i: shield, w: "You still have rights로 입원 중에도 환자의 권리가 남아 있다고 먼저 말해요. 비자의 입원 환자에게는 병원 정책과 주법에 따라 권리를 알려야 하므로, 간호사는 각 단계를 설명하는 역할을 맡아요.", d: "at home", k: ["물 한 잔 가져다 드릴게요", "앉으실 자리를 안내할게요"], a: "rights", o: ["debts", "pills", "rooms"]}
  - {t: "공감 후 설명", i: faceWorried, w: "I know…로 환자의 감정을 인정하고 let me walk you through로 설명을 안내처럼 제안해요. 부당하다고 느끼는 환자에게는 반박하기보다 이유를 차근차근 보여 주는 방식이 협조를 얻기 쉬워요.", d: "for you", k: ["의사 선생님이 곧 오셔서 설명해 주실 거예요", "편하게 앉아 계세요"], a: "unfair", o: ["tiny", "simple", "cheap"]}
  - {t: "사정 필요", i: stetho, w: "have to로 선택이 아니라 필요한 절차임을 말하고 before로 보내드릴 수 있는 조건을 알려요. 조건을 숨기지 않고 말하면 환자가 언제 나갈 수 있는지 예측할 수 있어요.", d: "at the clinic", k: ["이쪽에서 잠깐 기다려 주세요", "담당 의사 선생님을 불러 드릴게요"], a: "assess", o: ["discharge", "bill", "vaccinate"]}
  - {t: "이유 설명", i: speech, w: "I know this feels unfair로 감정을 먼저 받고 I want to explain으로 설명하겠다는 의지를 밝혀요. 환자와 맞서지 않고 이유를 말해 주겠다는 태도를 보이는 문장이에요.", d: "in the hallway", k: ["다른 병원에서도 이런 일이 있었어요?", "오늘 오신 이유를 다시 말씀해 주세요"], a: "explain", o: ["debate", "defend", "deny"]}
  - {t: "참여 보장", i: handshake2, w: "You still have a say로 입원 자체는 바꾸지 못해도 진행 방식에는 의견을 낼 수 있다고 말해요. 비자의 상황에서는 작은 선택권을 주면 통제감이 돌아와 협조가 늘어요.", d: "at night", k: ["드시고 싶은 음료가 있으세요?", "불을 좀 낮춰 드릴까요?"], a: "together", o: ["quickly", "privately", "formally"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "비자의 억류 고지 4문장 순서"
    why: "일시적인 억류임을 먼저 알리고, 부당하게 느껴질 것을 인정하며 설명하겠다고 하고, 그 설명의 일부로 권리를 알리고, 그 권리에 이어 진행 방식에 의견이 있다고 닫아요. 'this'·'Part of that explanation'·'those rights'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This is a temporary hold to keep you safe while we assess.", icon: lock, ko: "사정하는 동안 안전을 지키기 위한 일시적인 억류예요", note: "고지"}
    - {en: "I know this feels unfair, and I want to explain why it's happening.", icon: faceWorried, ko: "부당하게 느껴지는 걸 알아요, 왜 이런지 설명하고 싶어요", note: "공감"}
    - {en: "Part of that explanation: you still have rights, and I'll explain each step.", icon: shield, ko: "그 설명의 일부는 여전히 권리가 있다는 것, 각 단계를 설명할게요", note: "권리"}
    - {en: "With those rights, you still have a say in how we do this together.", icon: handshake2, ko: "그 권리에 따라 이 과정을 어떻게 할지 의견을 낼 수 있어요", note: "참여"}
  ctx:
    word: "5150"
    ko: "5150(비자의 입원 조항)"
- title: 물질 유발 정신증
  s:
  - {t: "감정 인정", i: faceWorried, w: "I can see…로 환자의 겉모습에서 보이는 감정을 말로 짚어 줘요. 환각이 있는 환자는 현실을 다투기보다 두려움을 인정받을 때 안정되기 쉬워요.", d: "for you", k: ["지금 어떤 약을 드셨는지 알려 주세요", "의사 선생님이 곧 오실 거예요"], a: "scared", o: ["tired", "hungry", "bored"]}
  - {t: "경험 인정", i: speech, w: "I don't hear what you hear로 함께 듣는 척하지 않고 사실대로 말해요. but I believe it feels real to you로 환자에게 진짜처럼 느껴진다는 것만 인정해서 환각을 사실로 동의하지도 반박하지도 않아요.", d: "to the doctor", k: ["그 소리가 언제부터 들렸는지 기억하세요?", "어젯밤에 잠은 주무셨어요?"], a: "real", o: ["familiar", "quiet", "pleasant"]}
  - {t: "문 열어 둠", i: shield, w: "Let's로 함께 정하는 말투로 시작하고 so you can see로 이유가 환자 자신에게 이득임을 밝혀요. 피해 망상이 있는 환자는 갇힌 느낌에 더 불안해져서 열린 문과 보이는 사람들이 안정에 도움이 돼요.", d: "in the hallway", k: ["불은 그대로 켜 둘게요", "침대는 이쪽에 둘게요"], a: "open", o: ["closed", "shut", "blocked"]}
  - {t: "믿어 줌", i: check, w: "I believe that…으로 환자의 경험을 의심하지 않는다고 분명히 말해요. 환각이나 망상을 사실로 믿는다는 뜻이 아니라, 환자에게 그렇게 느껴진다는 것만 인정해서 신뢰를 쌓아요.", d: "from me", k: ["약은 의사 선생님이 정해 주실 거예요", "이쪽으로 앉으시겠어요?"], a: "believe", o: ["doubt", "deny", "question"]}
  - {t: "안전 보장", i: shield, w: "You're safe with me로 나라는 구체적인 사람을 안전의 근거로 들고 no one here로 장소 전체로 넓혀요. 피해 사고가 있는 환자는 누가 해치려 한다고 믿기 때문에 이 두 가지를 분명히 말해요.", d: "at night", k: ["지금 열은 없으세요?", "사물함에 넣어 둘 물건이 있어요?"], a: "hurt", o: ["hire", "tutor", "pay"]}
  - {t: "경험 묻기", i: speech, w: "Tell me what…으로 환자가 직접 설명하게 해요. 무엇이 보이고 들리는지 구체적으로 알아야 명령하는 환청처럼 위험한 내용인지 가려낼 수 있어요.", d: "from the doctor", k: ["마지막으로 드신 게 언제예요?", "지금 어지러우세요?"], a: "seeing", o: ["eating", "reading", "wearing"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "환각 환자 응대 4문장 순서"
    why: "두려움을 인정하며 안전하다고 알리고, 보이고 들리는 것을 묻고, 어떤 답이든 같이 듣지는 못해도 진짜처럼 느껴진다는 것을 믿는다고 하고, 문을 열어 두는 구체적인 행동으로 닫아요. 'Whatever you describe'와 'Since it feels so real'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I can see you're scared — you're safe in this room with me.", icon: faceWorried, ko: "겁먹은 게 보여요 — 이 방에서는 저와 함께 안전해요", note: "안심"}
    - {en: "Tell me what you're seeing or hearing right now.", icon: speech, ko: "지금 무엇이 보이거나 들리는지 말씀해 주세요", note: "질문"}
    - {en: "Whatever you describe, I can't hear it, but I believe it feels real.", icon: check, ko: "무엇이든 저는 듣지 못하지만, 진짜처럼 느껴진다는 걸 믿어요", note: "인정"}
    - {en: "Since it feels so real, let's keep the door open so you see everyone.", icon: shield, ko: "그만큼 진짜처럼 느껴지니 사람들이 다 보이게 문을 열어 둘게요", note: "행동"}
  ctx:
    word: "voices"
    ko: "환청(목소리)"
    sc:
      1: {en: "Pt reports hearing voices; appears to be responding to internal stimuli."}
- title: 자살 위험 부정 환자
  s:
  - {t: "재확인", i: magnify, w: "I hear you say…로 환자의 말을 먼저 받아 주고 just want to double-check로 의심이 아니라 확인이라고 낮춰 말해요. 자살 위험이 있어도 괜찮다고 답하는 환자가 있어서 한 번에 믿지 않고 되묻는 것이 안전해요.", d: "for the doctor", k: ["어디서 오셨어요?", "오늘 몇 시에 일어나셨어요?"], a: "double-check", o: ["overlook", "postpone", "forget"]}
  - {t: "일반화", i: bulb, w: "Sometimes people로 환자 개인이 아니라 사람들 일반의 이야기로 돌려 말해요. 지목받으면 방어하기 쉬워서, 일반화가 솔직해질 틈을 열어 줘요.", d: "at home", k: ["질문이 많아서 힘드시죠?", "같이 오신 가족분이 있으세요?"], a: "struggling", o: ["sleeping", "traveling", "eating"]}
  - {t: "정답 없음", i: shield, w: "no wrong answer로 환자가 맞는 답을 찾으려 애쓰지 않아도 된다고 알려요. 정답을 골라야 한다고 오해하면 사실을 숨기기 쉬워서 이 점을 풀어 줘요.", d: "for you", k: ["질문은 몇 가지만 더 할게요", "물 한 잔 드릴까요?"], a: "wrong", o: ["easy", "simple", "quick"]}
  - {t: "귀가 전 확인", i: calendar, w: "before you go home으로 확인할 시점을 귀가 전으로 정해 말해요. 집에 돌아가기 전에 위험을 다시 확인하는 것이 안전 평가의 목적이고, 퇴원 결정은 의사가 해요.", d: "at the desk", k: ["집에 가는 길에 도와주실 분이 있으세요?", "집에는 몇 분이나 같이 사세요?"], a: "before", o: ["after", "unless", "while"]}
  - {t: "솔직 허락", i: handshake2, w: "It's okay to로 괜찮지 않다고 말해도 된다는 허락을 줘요. more than fine으로 괜찮다는 말 이상을 말해도 된다고 표현해서, 환자가 거짓말쟁이로 몰리지 않고 사실을 말하게 해요.", d: "to me", k: ["최근에 힘든 일이 있었어요?", "잠은 잘 주무세요?"], a: "true", o: ["costly", "legal", "rare"]}
  - {t: "공감", i: faceWorried, w: "it's hard to admit로 인정하기 어려운 마음을 환자 대신 말로 꺼내 줘요. how much로 정도를 말하게 해서 '괜찮다/안 괜찮다'의 이분법을 풀어요.", d: "for most people", k: ["얼마나 오래 이렇게 지내셨어요?", "같이 사는 가족이 있어요?"], a: "admit", o: ["measure", "estimate", "predict"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "자살 위험 부정 환자 4문장 순서"
    why: "괜찮다는 말을 받아 주며 재확인한다고 하고, 그 이유로 힘들어도 괜찮다고 하는 사람이 있다고 설명하고, 그래서 틀린 답이 없고 괜찮다는 말 이상을 해도 된다고 하고, 어떤 답이든 안전을 지키고 싶을 뿐이라고 닫아요. 'That's because'·'That's why'·'Whatever you say'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I hear you say you're fine — I just want to double-check a few things.", icon: magnify, ko: "괜찮다는 말씀은 들었어요 — 몇 가지만 다시 확인할게요", note: "재확인"}
    - {en: "That's because sometimes people say they're okay when they're really struggling.", icon: bulb, ko: "사람들은 정말 힘들어도 괜찮다고 말할 때가 있어서예요", note: "이유"}
    - {en: "That's why there's no wrong answer — it's okay to say more than fine.", icon: shield, ko: "그래서 틀린 답은 없어요 — 괜찮다는 말 이상을 해도 돼요", note: "허락"}
    - {en: "Whatever you say, I only want to keep you safe.", icon: handshake2, ko: "무슨 말씀이든 저는 당신을 안전하게 지키고 싶을 뿐이에요", note: "목적"}
  ctx:
    word: "deny"
    ko: "부인하다"
