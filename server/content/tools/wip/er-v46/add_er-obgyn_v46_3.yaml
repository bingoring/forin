- title: 산과 병력 언어장벽
  sw: {ko: "고맙지만 통역사를 따로 불러서 빠지는 게 없게 할게요"}
  s:
  - {t: "통역 연결", i: speech, w: "I'm getting…으로 통역사를 부르는 것을 환자에게 직접 알려요. 영어가 서툰 환자에게는 가족이 아니라 자격 있는 의료 통역사를 쓰는 것이 원칙이에요.", d: "a pharmacist", k: ["곧 의사 선생님이 오실 거예요", "서류에 서명해 주시겠어요?"], a: "understand", o: ["meet", "help", "thank"]}
  - {t: "손짓 요청", i: pushpin, w: "말이 통하지 않을 때는 point or show me처럼 몸짓으로 답할 수 있게 해 줘요. 통역사가 연결되기 전에도 통증 부위를 알 수 있어요.", d: "or tell me", k: ["침대에 편하게 앉아 계세요", "통증이 심해지면 이 벨을 눌러 주세요"], a: "where", o: ["when", "how", "why"]}
  - {t: "여유 주기", i: shield, w: "Take your time으로 서두르지 않아도 된다고 말해 압박을 덜어요. 통역을 거치면 말이 길어지니 환자가 이해하고 답할 시간을 충분히 줘요.", d: "Speak louder", k: ["천천히 숨을 쉬어 보세요", "필요하면 다시 설명해 드릴게요"], a: "missed", o: ["hidden", "rushed", "ignored"]}
  - {t: "가족 통역 X", i: speech, w: "so 뒤에 이유를 붙여 환자와 가족이 서운해하지 않게 해요. 가족 통역은 말이 빠지거나 바뀌기 쉽고, 환자가 가족 앞에서 말하기 어려운 이야기도 있어요.", d: "to wait outside", k: ["통역사가 비밀을 지키니 안심하세요", "통역은 보통 금방 연결돼요"], a: "interpret", o: ["wait", "leave", "help"]}
  - {t: "병력 청취", i: board, w: "through the interpreter로 통역사를 거쳐 묻는다고 알리면 환자가 누구에게 말하면 되는지 알아요. 통역을 쓸 때는 통역사가 아니라 환자를 보며 말하는 것이 기본이에요.", d: "through the form", k: ["약 알레르기가 있으신가요?", "지금 통증은 몇 점인가요?"], a: "pregnancies", o: ["allergies", "surgeries", "medications"]}
  - {t: "천천히", i: shield, w: "one question at a time으로 질문을 하나씩 나눠 통역과 대답이 섞이지 않게 해요. 통역을 쓸 때는 짧은 문장으로 끊어 말해야 정확해요.", d: "all questions", k: ["이해가 안 되면 언제든 말씀해 주세요", "통역사 번호는 이 종이에 있어요"], a: "slowly", o: ["quickly", "quietly", "politely"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "산과 병력 언어장벽 4문장 순서"
    why: "통역사를 부른다고 먼저 알리고, 그래서 가족에게 통역을 맡기지 않는다고 설명하고, 가족이 통역하지 않으니 환자에게 병력을 묻고, 각 질문마다 천천히 진행한다고 말해요. 'That's why'·'With your family'·'each question'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm getting an interpreter so we can understand each other.", icon: speech, ko: "서로 이해할 수 있도록 통역사를 부를게요", note: "통역"}
    - {en: "That's why I won't ask your family to interpret, so nothing gets lost or confused.", icon: shield, ko: "그래서 가족에게 통역을 맡기지 않을게요, 내용이 빠지거나 헷갈리지 않게요", note: "이유"}
    - {en: "With your family not interpreting, tell me about your pregnancies through the interpreter.", icon: board, ko: "가족이 통역하지 않으니, 통역사를 통해 이전 임신에 대해 말씀해 주세요", note: "병력"}
    - {en: "For each question, take your time — we'll go slowly until we understand everything.", icon: coffee, ko: "질문마다 천천히 하세요, 다 이해할 때까지 천천히 갈게요", note: "여유"}
- title: 조기 진통 징후
  s:
  - {t: "수축 간격", i: monitor, w: "How far apart로 간격을 물으면 환자가 시계를 보며 몇 분마다인지 답할 수 있어요. 수축 간격은 진통이 진행 중인지 가늠하는 핵심 정보예요.", d: "how strong", k: ["양수가 샌 것 같으신가요?", "허리 통증도 있나요?"], a: "tightenings", o: ["kicks", "headaches", "hiccups"]}
  - {t: "양수 상태", i: lab, w: "color or odor처럼 구체적인 보기를 주면 환자가 본 것을 말로 옮기기 쉬워요. 양수의 색과 냄새는 감염이나 태변이 섞였는지 가늠하는 단서예요.", d: "any amount", k: ["양수가 터진 시각이 언제인가요?", "배가 얼마나 자주 뭉치나요?"], a: "odor", o: ["amount", "texture", "thickness"]}
  - {t: "관찰 안내", i: monitor, w: "monitor you and the baby로 산모와 태아를 함께 지켜본다고 알려요. 조기 진통이 의심되면 태아 심박과 수축을 이어서 모니터해 진행 여부를 살펴요.", d: "weigh you", k: ["지금 소변 검사를 해 볼게요", "혈압을 재 볼게요"], a: "closely", o: ["quietly", "privately", "gently"]}
  - {t: "수축 양상", i: chartup, w: "regularly와 come and go를 맞세워 규칙적인지 불규칙한지 고르게 해요. 일정한 간격으로 점점 잦아지는 수축은 진짜 진통을 의심하는 단서예요.", d: "stay the same", k: ["수축이 시작된 지 얼마나 됐나요?", "아기가 움직이는 게 느껴지나요?"], a: "regularly", o: ["constantly", "suddenly", "painfully"]}
  - {t: "양수 시점", i: calendar, w: "notice로 터졌다는 판단이 아니라 환자가 알아차린 시점을 묻고 how much로 양도 함께 물어요. 양수가 샌 시각은 감염 위험을 가늠하고 분만 시기를 정하는 데 쓰여요.", d: "drink", k: ["수축은 얼마나 자주 오나요?", "배가 아픈 정도는 몇 점인가요?"], a: "fluid", o: ["bleeding", "cramping", "kicking"]}
  - {t: "모니터 부착", i: monitor, w: "모니터를 붙이는 위치(belly)와 목적(contractions·heartbeat)을 함께 알려 환자가 무엇을 보는지 알게 해요. 태아 심박과 수축을 함께 보면 아기가 수축을 잘 견디는지 알 수 있어요.", d: "on your arm", k: ["젤이 조금 차가울 수 있어요", "모니터 소리가 날 수 있어요"], a: "heartbeat", o: ["position", "weight", "temperature"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "조기 진통 징후 4문장 순서"
    why: "수축 간격을 먼저 묻고, 그 수축이 규칙적인지 묻고, 그 수축이 규칙적이든 아니든 양수가 샌 시점과 색을 묻고, 그 양수가 무엇이든 모니터를 붙인다고 알려요. 'they'·'Regular or not'·'Whatever it turns out to be'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How far apart are the tightenings coming?", icon: monitor, ko: "수축이 얼마나 자주 오나요?", note: "간격"}
    - {en: "Are they coming regularly, or do they come and go?", icon: chartup, ko: "그 수축이 규칙적으로 오나요, 아니면 왔다갔다 하나요?", note: "양상"}
    - {en: "Regular or not, when did you notice any fluid, and what color was it?", icon: calendar, ko: "규칙적이든 아니든, 양수는 언제 느끼셨고 색은 어땠나요?", note: "양수"}
    - {en: "Whatever it turns out to be, we'll put a monitor on your belly.", icon: monitor, ko: "그게 무엇이든, 배에 모니터를 붙일게요", note: "모니터"}
- title: 부인과 감염·분비물
  sw: {ko: "최근에 새로운 성 파트너가 있었나요?"}
  s:
  - {t: "수치심 덜기", i: shield, w: "no need to로 감정을 부정하지 않고 가볍게 풀어 주고 very common으로 흔한 일임을 알려 환자가 숨기지 않고 말하게 해요. 분비물이나 감염은 창피해서 늦게 오는 경우가 많아요.", d: "feel hurried", k: ["분비물은 언제부터 있었나요?", "최근에 새 비누나 세정제를 쓰셨나요?"], a: "embarrassed", o: ["rushed", "tired", "surprised"]}
  - {t: "증상 청취", i: stetho, w: "about으로 범위를 열어 두고 any other symptoms로 환자가 덧붙이게 해요. 분비물의 색·냄새·양과 동반 증상은 감염 종류를 가르는 첫 정보예요.", d: "about the visit", k: ["마지막 생리는 언제였나요?", "소변볼 때 따갑지는 않으세요?"], a: "discharge", o: ["odor", "swelling", "rash"]}
  - {t: "비밀 보장", i: lock, w: "stays confidential로 말한 내용이 밖으로 나가지 않는다고 약속해 환자가 민감한 이야기도 꺼낼 수 있게 해요. 병원은 환자 정보를 법으로 보호하고, 치료팀 안에서는 필요한 만큼만 공유해요.", d: "you hear", k: ["이 검사는 몇 분 안 걸려요", "문진표를 작성해 주세요"], a: "confidential", o: ["temporary", "optional", "billable"]}
  - {t: "성병력", i: stetho, w: "partners로 상대의 성별이나 관계를 가정하지 않고 물어요. 새 파트너 여부는 성매개감염 가능성을 가늠하는 문진 항목이에요.", d: "any new doctors", k: ["피임은 어떤 방법을 쓰시나요?", "마지막 성관계는 언제였나요?"], a: "new", o: ["other", "regular", "past"]}
  - {t: "동반 증상", i: stetho, w: "burning·itching·unusual smell을 나열해 환자가 해당하는 것을 고르게 해요. 증상마다 의심하는 감염이 달라서 하나씩 짚어 물어요.", d: ", or strange taste", k: ["분비물 색이 어떤가요?", "최근에 항생제를 드셨나요?"], a: "itching", o: ["bleeding", "swelling", "fever"]}
  - {t: "검사 안내", i: lab, w: "to find out으로 검사의 목적을 알려 환자가 불안해하지 않게 해요. 질 분비물 면봉 검사로 세균·곰팡이·성매개감염 병원체를 가려내요.", d: "to write down", k: ["검사 중에 불편하면 말씀해 주세요", "지금 가운으로 갈아입어 주세요"], a: "swab", o: ["saliva", "stool", "sweat"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "부인과 감염·분비물 4문장 순서"
    why: "민감한 질문을 시작한다고 알리며 안심시키고, 그 말에 이어 비밀 보장과 함께 증상을 묻고, 그 증상이 생기기 전의 성병력을 묻고, 그 병력을 근거로 검사를 안내해요. 'private questions'·'those symptoms'·'that history'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'll ask some private questions — there's no need to feel embarrassed.", icon: shield, ko: "민감한 질문을 드릴 건데, 창피해하실 필요 없어요", note: "안심"}
    - {en: "Everything you share stays confidential, so tell me about the discharge and any other symptoms.", icon: lock, ko: "말씀하신 건 비밀이 지켜지니, 분비물과 다른 증상을 알려 주세요", note: "증상"}
    - {en: "In the weeks before those symptoms, have you had any new sexual partners?", icon: stetho, ko: "그 증상이 생기기 몇 주 전에 새로운 성 파트너가 있었나요?", note: "병력"}
    - {en: "With that history, we'll do a swab test to find out exactly what's causing this.", icon: lab, ko: "그 병력을 바탕으로, 정확한 원인을 찾기 위해 면봉 검사를 할게요", note: "검사"}
- title: 피임·응급피임 상담
  sw: {ko: "혹시 어떤 피임법을 쓰셨는지, 쓰셨다면 여쭤봐도 될까요?"}
  s:
  - {t: "선택지 안내", i: compass, w: "options로 환자에게 선택지가 있음을 먼저 알려 막막함을 덜고 the sooner…the better로 서두를 이유를 붙여요. 응급피임은 성관계 후 빨리 쓸수록 효과가 좋아요.", d: "we ask", k: ["지금 복용 중인 약이 있나요?", "마지막 생리가 언제였나요?"], a: "options", o: ["rules", "risks", "limits"]}
  - {t: "설명 제안", i: speech, w: "Let me…로 허락을 구하듯 설명을 시작해 환자가 듣는 입장에 서게 해요. 각 방법이 어떻게 작용하는지 알아야 환자가 스스로 고를 수 있어요.", d: "the results", k: ["궁금한 점은 편하게 물어보세요", "보험 처리는 나중에 안내해 드릴게요"], a: "works", o: ["costs", "lasts", "starts"]}
  - {t: "판단 없음", i: shield, w: "judgment-free로 상담이 평가가 아니라 정보 제공이라고 못 박아 환자가 솔직하게 말하게 해요. 부끄러움 때문에 정보를 숨기면 안전한 선택이 어려워져요.", d: "for your partner", k: ["혹시 약 알레르기가 있으신가요?", "지금 임신 가능성은 없으신가요?"], a: "judgment-free", o: ["private", "short", "quiet"]}
  - {t: "경과 확인", i: calendar, w: "환자가 말한 시점을 되짚어 확인하고 hours ago로 정확한 경과 시간을 물어요. 응급피임은 성관계 후 시간이 지날수록 효과가 떨어져서 경과 시간이 선택에 영향을 줘요.", d: "in March", k: ["소변 검사로 임신 여부를 먼저 확인할게요", "평소에 피임약을 복용하시나요?"], a: "last night", o: ["this morning", "last week", "last month"]}
  - {t: "복용 시기", i: pill, w: "The sooner…, the more…의 비례 구조로 서두를 이유를 한 문장에 담아요. 응급피임약은 가능한 한 빨리 복용할수록 효과가 높아요.", d: "you ask for it", k: ["약은 물과 함께 삼키시면 돼요", "복용 후 구토하면 알려 주세요"], a: "take", o: ["buy", "get", "start"]}
  - {t: "선택 존중", i: shield, w: "Whatever you decide로 어떤 결정이든 존중한다고 밝혀 환자가 눈치 보지 않고 고르게 해요. 피임 선택은 환자의 상황과 가치에 달려 있어 정답이 하나가 아니에요.", d: "only one right", k: ["필요하시면 상담 자료를 드릴게요", "결정이 되면 간호사에게 말씀해 주세요"], a: "decide", o: ["feel", "say", "hear"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "피임·응급피임 상담 4문장 순서"
    why: "선택지가 있고 서둘러야 한다고 먼저 알리고, 그 선택에 영향을 주는 경과 시간을 묻고, 그 시간을 감안해 선택지를 설명하고, 어느 쪽을 정하든 정답이 없다고 마무리해요. 'the right one'·'that timing'·'those'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "There are options, and the sooner we act the better.", icon: compass, ko: "선택지가 있고, 빨리 조치할수록 좋아요", note: "안내"}
    - {en: "To choose the right one, when did it happen — how many hours ago?", icon: calendar, ko: "알맞은 것을 고르려면, 언제 있었던 일인가요, 몇 시간 전인가요?", note: "경과"}
    - {en: "Given that timing, let me explain the choices and how each one works.", icon: speech, ko: "그 시점을 감안해 선택지와 각각의 작용을 설명해 드릴게요", note: "설명"}
    - {en: "Whichever of those you decide on, there's no right or wrong answer here.", icon: shield, ko: "그중 무엇을 정하시든 맞고 틀린 답은 없어요", note: "존중"}
- title: 임신 후기 대량출혈
  s:
  - {t: "신속 대응", i: siren, w: "moving fast로 서두르는 모습의 이유를 to keep…safe로 바로 붙여 환자가 겁먹지 않게 해요. 임신 후기 대량 출혈은 산모와 태아 모두 빠르게 나빠질 수 있어요.", d: "and your family", k: ["정맥 라인을 두 군데 잡을게요", "남편분께 연락해 드릴게요"], a: "safe", o: ["calm", "still", "quiet"]}
  - {t: "곁에 있음", i: handshake2, w: "Stay with me는 의식을 붙잡으라는 짧은 부탁이고, 뒤에 팀이 곁에 있다는 말로 불안을 눌러 줘요. 대량 출혈 중 환자의 반응은 의식 상태를 보는 단서이기도 해요.", d: "is in the lobby", k: ["숨을 깊게 쉬어 보세요", "이름이 어떻게 되세요?"], a: "team", o: ["family", "hospital", "floor"]}
  - {t: "과정 안내", i: speech, w: "every step of the way로 한 번이 아니라 끝까지 계속 알려 주겠다고 약속해요. 응급 상황에서는 모르는 데서 오는 공포가 더 커서 진행 상황을 짧게 계속 알려 줘요.", d: "from the hall", k: ["지금 팔에 주사를 놓을게요", "산소마스크를 씌워 드릴게요"], a: "happening", o: ["changing", "missing", "coming"]}
  - {t: "원인 설명", i: bulb, w: "may be로 확진 전이라는 점을 지키면서 and that's causing으로 출혈의 이유를 쉬운 말로 이어요. 태반이 일찍 떨어지는 태반조기박리는 임신 후기 출혈과 배가 단단해지는 증상을 일으킬 수 있어요.", d: "growing slowly", k: ["산소를 드릴게요", "혈압을 다시 재고 있어요"], a: "separating", o: ["growing", "shrinking", "leaking"]}
  - {t: "복부 확인", i: stetho, w: "feeling으로 지금 손으로 확인 중이라는 것을 알려 환자가 몸을 만지는 이유를 이해해요. 배가 계속 단단하면 태반이 떨어졌을 때 나타나는 소견일 수 있어요.", d: "in your back", k: ["아기가 마지막으로 움직인 게 언제예요?", "통증이 어디가 가장 심한가요?"], a: "tightness", o: ["swelling", "warmth", "softness"]}
  - {t: "수술실 이동", i: hospital, w: "to protect you both로 서두르는 목적을 두 사람을 위한 것으로 말해요. 태반조기박리로 출혈이 많거나 태아가 위험하면 응급 제왕절개를 위해 수술실로 가요.", d: "to weigh you both", k: ["지금 팔에 주사를 하나 더 잡을게요", "아기를 돌볼 소아팀도 준비하고 있어요"], a: "quickly", o: ["quietly", "carefully", "calmly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "임신 후기 대량출혈 4문장 순서"
    why: "서두르는 이유를 먼저 알리고, 출혈의 원인을 설명하고, 그 원인을 확인하는 중이라고 말한 뒤, 그 때문에 수술실로 모신다고 해요. 'That's because'·'To check that'·'that tightness'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We're moving fast to keep you and your baby safe.", icon: siren, ko: "당신과 아기를 지키려고 빠르게 움직일게요", note: "신속"}
    - {en: "That's because your placenta may be separating early, and that's causing this bleeding.", icon: bulb, ko: "태반이 일찍 떨어지고 있을 수 있고, 그래서 출혈이 생기고 있어서예요", note: "원인"}
    - {en: "To check that, we're feeling the tightness in your belly right now.", icon: stetho, ko: "그걸 확인하려고 지금 배의 딱딱함을 만져 보고 있어요", note: "확인"}
    - {en: "Because of that tightness, we're getting you to the operating room quickly.", icon: hospital, ko: "그 딱딱함 때문에 빠르게 수술실로 모실게요", note: "수술실"}
