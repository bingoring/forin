  - t: 변화 설명
    i: faceWorried
    w: we expect that으로 지금 상태를 말한 뒤 기대하는 경과를 덧붙여요. 확정이 아니라 예상이라고 표현하면 가족이 과한 기대나 불안 없이 상태를 따라가요.
    d: as the day goes
