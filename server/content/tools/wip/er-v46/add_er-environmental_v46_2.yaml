    tag: 대화 흐름
    icon: compass
    ko: 중등도 저체온 가족 안내 4문장 순서
    why: 왜 위험한지를 말하고, 그래서 하는 치료를 알리고, 피할 일을 덧붙인 뒤, 심장 리듬 감시로 마무리해요. 'That's why'·'that'·'leaving his limbs alone'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: When shivering stops, the cold has gone deeper — this is serious.
      icon: siren
      ko: 떨림이 멎으면 추위가 더 깊이 들어간 거예요, 심각해요
      note: 위험
    - en: That's why we're actively warming him with heated blankets and warm fluids.
      icon: bandage
      ko: 그래서 가온 담요와 따뜻한 수액으로 적극적으로 데우고 있어요
      note: 치료
    - en: To help with that, try not to rub or massage his arms and legs.
      icon: lock
      ko: 도우시려면 팔다리를 문지르거나 주무르지 마세요
      note: 금지
    - en: Along with leaving his limbs alone, we'll watch his heart rhythm closely.
      icon: monitor
      ko: 팔다리를 가만히 두는 것과 함께 심장 리듬을 계속 볼게요
      note: 감시
