  - t: 이동 주의
    i: shield
    w: to avoid…로 부드럽게 옮기는 이유를 붙여요. 심한 저체온의 심장은 움직임과 충격에 예민해서 부정맥이 생기기 쉬워요.
    d: the whole time
    k:
    - 담요를 더 가져올게요.
