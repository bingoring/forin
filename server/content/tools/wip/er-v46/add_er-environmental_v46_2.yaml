    - minor
    - fine
  - t: 재가온
    i: bandage
    w: actively는 몸이 스스로 데워지길 기다리는 것이 아니라 담요와 수액 같은 열을 더해 직접 데운다는 뜻이에요. 가족에게도 지켜만 보는 게 아니라 적극 치료한다는 느낌을 줘요.
    d: since morning
    k:
