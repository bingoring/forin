  - t: 모니터링
    i: monitor
    w: while we로 재가온 중에도 지켜본다고 말해요. 저체온에서는 재가온하는 동안에도 심장 리듬이 변할 수 있어서 계속 모니터로 봐요.
    d: once a day
    k:
    - 체온을 다시 재 볼게요.
