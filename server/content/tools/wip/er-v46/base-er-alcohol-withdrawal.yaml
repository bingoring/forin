situations:
- title: 음주력·마지막 음주 문진
  sentences:
  - en: It helps me care for you to know how much you usually drink.
    ko: 얼마나 드시는지 알아야 잘 돌봐드릴 수 있어요.
    chunks:
    - It helps me care for you
    - to know
    - how much
    - you usually drink
    - .
    words:
    - w-help
    - w-care
    - w-usually
    - w-drink
    goal: 1
  - en: When was your last drink? That tells us what to watch for.
    ko: 마지막으로 언제 드셨어요? 그게 뭘 지켜봐야 할지 알려줘요.
    chunks:
    - When was
    - your last drink
    - '? That tells us'
    - what to watch for
    - .
    words:
    - w-last
    - w-drink
    - w-tell
    - w-watch
    goal: 1
  - en: I'm not here to judge — this is just about keeping you safe.
    ko: 판단하려는 게 아니에요 — 그냥 안전하게 봐드리려는 거예요.
    chunks:
    - I'm not here
    - to judge
    - — this is just about
    - keeping you safe
    - .
    words:
    - w-judge
    - w-safe
    goal: 2
  - en: Can you tell me how many drinks you usually have in a day?
    ko: 하루에 보통 몇 잔 드시는지 말해주실 수 있어요?
    chunks:
    - Can you tell me
    - how many drinks
    - you usually have
    - in a day
    - '?'
    words:
    - w-tell
    - w-drink
    - w-usually
    goal: 1
  - en: I ask everyone these questions, so please don't feel singled out.
    ko: 모든 분께 여쭤보는 질문이니 혼자 지목됐다고 느끼지 않으셔도 돼요.
    chunks:
    - I ask everyone
    - these questions
    - ', so please don''t'
    - feel singled out
    - .
    words:
    - w-ask
    - w-question
    - w-feel
    goal: 2
  - en: How many days has it been since your last drink?
    ko: 마지막으로 드신 지 며칠이나 됐어요?
    chunks:
    - How many days
    - has it been
    - since your
    - last drink
    - '?'
    words:
    - w-last
    - w-drink
    goal: 1
  nuance:
  - kind: slider
    words:
    - w-drink
    - w-usually
    cue: 'Patient: "Maybe two beers on the weekend, that''s about it."'
    scale:
    - light
    - moderate
    - heavy
    answerAt: 0
    why: 주말에 맥주 두어 잔이면 light 쪽이에요. 다만 차트에는 light·heavy 같은 형용사보다 환자가 말한 잔 수와 빈도를 그대로 적어요.
    example: He reports heavy drinking, about ten beers a day.
    exKo: 하루 맥주 열 캔 정도로 과음한다고 해요.
  - kind: context
    words:
    - w-drink
    - w-usually
    scenes:
    - who: 환자에게
      icon: me
      en: How many drinks do you usually have in a day?
      ok: true
    - who: 차트 기록
      icon: board
      en: Pt reports EtOH 6-8 beers/day, last drink 0800.
      ok: true
    - who: 환자에게
      icon: me
      en: What's your daily EtOH intake?
      ok: false
      fix: How much do you usually drink in a day?
    why: EtOH(에탄올)는 차트와 의료진끼리 쓰는 약어예요. 환자에게는 '보통 하루에 얼마나 드세요?'처럼 풀어서 물어요.
  - kind: swap
    words:
    - w-judge
    - w-safe
    who: 환자에게 · 음주 문진을 여는 말
    icon: me
    before:
    - 'I''m not here to '
    - lecture you about drinking
    - ' — this is just about keeping you safe.'
    options:
    - judge
    - lecture you about drinking
    - get you in trouble
    answer: judge
    notes:
      judge: 짧고 분명하게 '비난하려는 게 아니다'를 전한다.
      lecture you about drinking: 훈계를 먼저 떠올리게 해서, 부정하는 말인데도 방어하게 만든다.
      get you in trouble: 법적 문제를 먼저 꺼내 오히려 불안을 키운다.
    why: 음주 문진은 비판단적으로 여는 게 핵심이에요. 'not here to judge'는 미국 응급실에서 흔히 쓰는 여는 말이에요.
