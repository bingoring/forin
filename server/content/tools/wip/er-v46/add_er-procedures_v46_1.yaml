  - {t: "재시도 제안", i: coffee, w: "Let's …는 '우리가 함께'라는 뜻이라 환자도 결정에 참여한다는 느낌을 줘요. short break로 쉬는 시간이 길지 않다고 알려요.", d: "a long wait and", k: ["이제 그만하고 다음에 해요", "쉬지 않고 바로 다시 할게요"], a: "break", ai: pushpin, o: [["photo", "magnify"], ["bath", "bandage"], ["test", "lab"]]}
