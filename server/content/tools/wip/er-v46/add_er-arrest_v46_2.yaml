- title: 무수축/PEA 대응
  s:
  - {t: "리듬 판단", i: monitor, w: "isn't shockable로 제세동이 필요 없는 리듬이라고 밝힌 뒤 다음 행동을 이어요. 무수축과 PEA는 제세동 대신 압박과 약물로 이어 가요.", d: "stopped", k: ["이 리듬은 제세동이 가능해요 — 충전하세요", "이 리듬은 규칙적이에요 — 압박을 멈추세요"], a: "shockable", o: ["dangerous", "reversible", "regular"]}
  - {t: "약물 지시", i: pill, w: "Give로 시작하는 짧은 명령에 약 이름, 용량 순으로 말해요. 심정지에서 에피네프린은 1mg을 정맥이나 골내로 3~5분마다 줘요.", d: "later", k: ["에피네프린은 아직 주지 마세요", "아미오다론 300밀리그램을 지금 주세요"], a: "milligram", o: ["microgram", "gram", "liter"]}
  - {t: "계속·재평가", i: redo, w: "Continue …and reassess …로 지금 할 일과 다음 확인 시점을 함께 말해요. CPR은 보통 2분 단위로 돌고 그때 리듬을 다시 봐요.", d: "in two hours", k: ["CPR을 멈추고 10분 뒤에 재평가하세요", "CPR은 충분하니 바로 이송하세요"], a: "two", o: ["ten", "twenty", "thirty"]}
  - {t: "PEA 설명", i: stetho, w: "even though로 겉보기와 실제가 다르다는 대비를 말해요. 모니터에 리듬이 보여도 맥박이 없으면 PEA(무맥성 전기활동)라서 심정지로 다뤄요.", d: "a pulse", k: ["맥박이 잡혀서 모니터를 계속 봐요", "모니터에 아무 리듬도 보이지 않아요"], a: "even though", o: ["because", "so", "unless"]}
  - {t: "반복 투약", i: bell, w: "every …minutes로 반복 간격을 말해요. 에피네프린은 3~5분 간격이라서 투여 시각 기록이 중요해요.", d: "hours", k: ["에피네프린은 한 번만 주고 멈추세요", "에피네프린은 30분마다 주세요"], a: "every", o: ["after", "within", "for"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "무수축·PEA 대응 4문장 순서"
    why: "제세동이 안 되는 리듬이라고 판단한 뒤 압박을 이어 가며 에피네프린을 주고, 두 분 뒤 재평가하고, 여전히 그 리듬이면 투약을 이어 가요. While they push, With the epinephrine in, still not shockable의 it이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This rhythm isn't shockable — keep compressions going.", icon: monitor, ko: "제세동이 안 되는 리듬이에요 — 압박을 계속해요", note: "판단"}
    - {en: "While they push, give epinephrine, one milligram.", icon: pill, ko: "압박하는 동안 에피네프린 1밀리그램을 줘요", note: "투약"}
    - {en: "After two minutes with the epinephrine in, reassess the rhythm.", icon: redo, ko: "에피네프린을 넣고 2분 뒤에 리듬을 재평가해요", note: "재평가"}
    - {en: "If it's still not shockable, keep giving it every three to five minutes.", icon: bell, ko: "여전히 제세동이 안 되면 3~5분마다 계속 줘요", note: "간격"}
  sw: {ko: "제세동이 안 되는 리듬이에요 — 압박을 계속하세요"}
- title: 가역적 원인(H's&T's) 점검
  s:
  - {t: "원인 점검", i: compass, w: "run through는 빠짐없이 한 번 훑는다는 구동사예요. H's and T's는 심정지의 가역적 원인을 머리글자로 정리한 체크리스트예요.", d: "the S's", k: ["H's와 T's를 가족에게 설명해요", "ABC를 다시 한번 확인해요"], a: "through", o: ["around", "into", "past"]}
  - {t: "원인 후보", i: bulb, w: "Could this be …?는 확정하지 않고 가능성을 묻는 말이라 팀이 함께 생각하게 해요. 저산소증과 저칼륨은 H에, 긴장성 기흉은 T에 들어가요.", d: ", or a stroke", k: ["이건 저혈당일 수 있나요? 포도당을 줄까요?", "이 리듬은 제세동이 가능한가요?"], a: "potassium", o: ["sodium", "glucose", "calcium"]}
  - {t: "병력 질문", i: board, w: "Any …?는 목록을 열어 두고 하나라도 있는지 묻는 질문이에요. 지난 병력은 가역적 원인을 좁히는 단서가 돼요.", d: ", or travel", k: ["최근에 응급실에 온 적이 있나요?", "가족 중에 심장병이 있나요?"], a: "overdose", o: ["surgery", "seizures", "fainting"]}
  - {t: "검사 제안", i: lab, w: "We should …는 지시 대신 팀의 할 일로 제안하는 말이에요. 칼륨 이상은 가역적 원인이라 수치를 빨리 알아야 해요.", d: "next week", k: ["그의 칼륨 약을 바로 줘야 해요", "그의 나트륨 수치를 내일 확인해요"], a: "level", o: ["dose", "intake", "order"]}
  - {t: "가족 문의", i: speech, w: "Ask … about …은 누구에게 무엇을 물을지 한 문장에 담아요. 환자가 말할 수 없으면 가족이 병력을 알려 주는 중요한 정보원이에요.", d: "of food allergy", k: ["가족에게 혈전약을 주라고 하세요", "가족을 대기실로 모셔 주세요"], a: "family", o: ["pharmacist", "dentist", "chaplain"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "원인 점검 4문장 순서"
    why: "점검을 시작한다고 알리고, H부터 짚고, T로 넘어간 뒤, 모아 본 결과로 검사를 정해요. Starting with the H's, For the T's, all of that이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Let's run through the H's and T's.", icon: compass, ko: "H's와 T's를 한번 훑어봐요", note: "시작"}
    - {en: "Starting with the H's — could this be hypoxia or low potassium?", icon: bulb, ko: "H부터요 — 저산소증이나 저칼륨일까요?", note: "H"}
    - {en: "For the T's, any history of clots or overdose?", icon: board, ko: "T는요 — 혈전이나 과다복용 병력이 있나요?", note: "T"}
    - {en: "Based on all of that, I want his potassium level checked right away.", icon: lab, ko: "그걸 모두 보면 칼륨 수치를 바로 확인하고 싶어요", note: "검사"}
  ctx: {word: "pneumo", ko: "기흉(약칭)"}
- title: 정맥로/골내로 확보 소통
  s:
  - {t: "경로 전환", i: redo, w: "실패한 사실을 먼저 말하고 바꾸는 행동을 -ing로 이어요. 정맥로가 안 잡히면 골내로(IO)로 넘어가는 것이 심정지의 흔한 대응이에요.", d: "to a PICC", k: ["정맥주사는 성공했어요 — 약을 줄게요", "골내로가 실패했어요 — 정맥을 다시 잡을게요"], a: "failed", o: ["succeeded", "worked", "stopped"]}
  - {t: "위치 보고", i: check, w: "위치와 상태를 한 문장에 보고해요. IO는 정강뼈나 위팔뼈 위쪽에 넣고, 잘 들어갔는지는 생리식염수를 밀어 보며 확인해요.", d: "poorly", k: ["골내로가 안 들어가서 팔에 다시 시도할게요", "골내로는 들어갔는데 아직 안 흘러요"], a: "tibia", o: ["skull", "spine", "rib"]}
  - {t: "준비 완료", i: bell, w: "ready for …는 다음 단계로 넘어갈 준비가 됐다는 신호예요. 라인이 확보됐다고 알려야 리더가 약을 주라고 지시할 수 있어요.", d: ", not ready", k: ["라인이 막혔어요, 다시 잡을게요", "라인은 됐고, 수액만 준비됐어요"], a: "medications", o: ["surgery", "recovery", "discharge"]}
  - {t: "시도 제안", i: pencil, w: "Try … before …로 한 번 더 해 볼 여지를 주되 기한을 정해요. 심정지에서는 정맥로에 오래 매달리지 않는 것이 중요해서 횟수를 제한해요.", d: "return", k: ["정맥주사 말고 바로 골내로를 넣어요", "골내로를 한 번 더 시도하고 정맥으로 바꿔요"], a: "before", o: ["after", "until", "unless"]}
  - {t: "투약 전", i: lab, w: "before …ing로 순서를 말해요. 골내로는 생리식염수를 밀어 넣어 흐름을 확인한 뒤에 약을 줘야 약이 잘 들어가요.", d: "without giving", k: ["약을 준 뒤에 정맥 라인을 빼세요", "골내로 라인은 흘려보내지 마세요"], a: "Flush", o: ["Clamp", "Remove", "Cut"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "골내로 확보 4문장 순서"
    why: "정맥 시도가 실패해 골내로로 전환하고, 들어간 위치를 보고하고, 확보를 알린 뒤, 첫 약을 주기 전 다시 흘려보내요. Okay, Since access is secured의 again이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Two IV attempts failed — switching to an IO now.", icon: redo, ko: "정맥 시도 두 번 실패 — 지금 골내로로 바꿔요", note: "전환"}
    - {en: "Okay, the IO is in the tibia and flushing well.", icon: check, ko: "자, 골내로가 정강뼈에 들어갔고 잘 흘러요", note: "보고"}
    - {en: "Access is secured — ready for medications.", icon: bell, ko: "확보됐어요 — 투약 준비됐어요", note: "확보"}
    - {en: "Since access is secured, flush the IO line again before the first medication.", icon: lab, ko: "확보됐으니 첫 약을 주기 전에 라인을 다시 흘려요", note: "투약"}
  ctx: {word: "IO", ko: "골내로"}
- title: ROSC 후 초기 안정화
  s:
  - {t: "ROSC 선언", i: star, w: "ROSC는 자발순환 회복의 약어로, 팀에게 상태가 바뀌었다고 알리는 말이에요. 맥박이 돌아온 직후에는 활력징후를 한 세트 다시 재요.", d: "of lab tubes", k: ["자발순환이 아직 없어요 — 압박을 계속하세요", "자발순환이 돌아왔어요 — 모니터를 모두 떼세요"], a: "vitals", o: ["labs", "orders", "charts"]}
  - {t: "목표 설정", i: chartup, w: "Let's keep … above …로 목표 수치와 방향을 함께 말해요. ROSC 후에는 수축기혈압을 90 아래로 떨어뜨리지 않는 것이 목표 중 하나예요.", d: "the sugar below 90", k: ["수축기혈압이 90 아래로 떨어졌어요", "기도 삽관을 지금 제거해요"], a: "above", o: ["below", "under", "beneath"]}
  - {t: "다음 단계", i: hospital, w: "Get …과 prepare …를 and로 이어 할 일 두 가지를 한 번에 시켜요. ROSC 후에는 12유도 심전도로 원인을 찾고 중환자실로 옮겨요.", d: "to the roof", k: ["활력징후를 재고 퇴원을 준비하세요", "혈액검사를 하고 병동으로 옮길 준비를 하세요"], a: "ICU", o: ["pharmacy", "lobby", "nursery"]}
  - {t: "주의 당부", i: magnify, w: "but으로 좋은 소식 뒤에 경계를 붙여요. ROSC 직후에는 다시 심정지가 오기도 해서 계속 지켜봐요.", d: "his chart", k: ["맥박이 없으니 압박을 계속하세요", "맥박이 돌아왔으니 모니터는 꺼도 돼요"], a: "closely", o: ["rarely", "briefly", "lightly"]}
  - {t: "이송 준비", i: plane, w: "again으로 이전 측정과 비교해 보겠다는 뜻을 담아요. 이송 전 마지막 활력징후는 인계에서 변화를 보여 주는 기준이 돼요.", d: "to the lobby", k: ["활력징후는 생략하고 바로 이송하세요", "활력징후를 재고 환자를 퇴원시키세요"], a: "vitals", o: ["labs", "an ECG", "weights"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "ROSC 직후 4문장 순서"
    why: "ROSC를 알리고 활력징후를 다시 재고, 맥박이 돌아왔어도 지켜보며 혈압 목표를 잡은 뒤, 혈압이 유지되면 이송을 준비해요. His pulse is back, While you watch it, Once the pressure holds가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We have ROSC — recheck a full set of vitals.", icon: star, ko: "자발순환이 돌아왔어요 — 활력징후를 다시 전부 확인해요", note: "선언"}
    - {en: "His pulse is back, but keep watching the monitor closely.", icon: magnify, ko: "맥박은 돌아왔지만 모니터를 계속 잘 지켜봐요", note: "관찰"}
    - {en: "While you watch it, let's keep the systolic above 90.", icon: chartup, ko: "지켜보면서 수축기혈압을 90 이상으로 유지해요", note: "목표"}
    - {en: "Once the pressure holds, get a twelve-lead and prepare to move to the ICU.", icon: hospital, ko: "혈압이 유지되면 12유도를 찍고 중환자실 이송을 준비해요", note: "이송"}
  sw: {ko: "일단 좋은 소식이에요 — 심장이 다시 뛰기 시작했어요"}
- title: 소생 중 SBAR 리더 보고
  s:
  - {t: "경과 시간", i: monitor, w: "SBAR의 상황(S)에 해당하는 한 줄로, 동사 없이 숫자만 짧게 말해요. down은 쓰러진 뒤 흐른 시간, round는 CPR 한 주기(보통 2분)예요.", d: "of fluids", k: ["다운타임은 알 수 없고, CPR은 아직 시작 안 했어요", "다운타임 약 2분, CPR은 한 라운드 했어요"], a: "eight", o: ["five", "ten", "twenty"]}
  - {t: "시행 내역", i: pill, w: "충격과 약물 횟수를 짧은 구로 나열하고 마지막 투여 시점을 덧붙여요. 마지막 에피 시점을 알아야 다음 투여 시각을 3~5분 간격에 맞출 수 있어요.", d: "an hour ago", k: ["충격은 아직 없고, 에피는 한 번 줬어요", "충격 세 번, 에피 세 번, 마지막 투여는 1분 전이에요"], a: "epi", o: ["amio", "atropine", "bicarb"]}
  - {t: "현재 상태", i: chartup, w: "still과 yet이 아직 변화가 없다는 것을 두 번 짚어 줘요. 리더는 이 한 줄로 지금 리듬에 맞는 다음 처치를 정해요.", d: "anymore", k: ["현재 리듬은 정상 동성이고, 자발순환이 돌아왔어요", "현재 리듬은 무수축이고, 충격이 필요해요"], a: "still", o: ["now", "already", "usually"]}
  - {t: "투약 횟수", i: pill, w: "We've given …은 현재완료로 지금까지 쌓인 횟수를 말해요. so far로 지금까지의 합계라는 점을 분명히 해요.", d: "last night", k: ["이번 라운드에서 에피는 한 번도 안 줬어요", "이번 라운드에서 충격을 두 번 줬어요"], a: "given", o: ["held", "stopped", "checked"]}
  - {t: "보고 요청", i: speech, w: "Let … know는 누군가에게 알려 주라는 흔한 지시 틀이에요. 코드 리더는 리듬과 경과 시간으로 다음 처치를 정해요.", d: "the room number", k: ["리더에게 알리지 말고 기록만 해 주세요", "리더에게 가족이 와 있다고 알려 주세요"], a: "leader", o: ["pharmacist", "porter", "clerk"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "소생 중 리더 보고 4문장 순서"
    why: "경과 시간으로 시작해 그동안 한 처치를 말하고, 현재 상태를 알린 뒤 다음 판단을 요청해요. In that time, After all of that, Given all that이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Down about eight minutes, three rounds of CPR so far.", icon: monitor, ko: "다운타임 약 8분, 지금까지 CPR 세 라운드예요", note: "경과"}
    - {en: "In that time, two shocks delivered and epi given twice.", icon: pill, ko: "그동안 충격 두 번, 에피 두 번 줬어요", note: "처치"}
    - {en: "After all of that, rhythm is still V-fib, no ROSC yet.", icon: chartup, ko: "그러고도 리듬은 여전히 심실세동, 자발순환은 아직 없어요", note: "현재"}
    - {en: "Given all that, what's your next step?", icon: speech, ko: "이 모든 걸 보면 다음 단계는 무엇인가요?", note: "요청"}
  ctx: {word: "epi", ko: "에피(약칭)"}
