- title: 신규 심방세동 빠른 심실반응
  s:
  - {t: "모니터 부착", i: monitor, w: "I'm going to …로 곧 할 일을 알리고 now로 지금 시작한다는 것을 분명히 해요. 새로 심방세동이 의심되면 리듬을 계속 지켜보는 것이 먼저예요.", d: "in the room", k: ["지금 심전도 결과를 보여 드릴게요", "지금 정맥주사를 놓을게요"], a: "heart", o: ["oxygen", "fetal", "glucose"]}
  - {t: "병력 확인", i: stetho, w: "Have you ever been told …?는 의사에게 들은 적이 있는지 물어 환자가 진단명을 몰라도 들은 말로 답할 수 있게 해요. 예전에 불규칙한 심장 소견이 있었는지는 중요한 단서예요.", d: "last year", k: ["심장약을 드신 적이 있나요?", "가족 중에 심장병이 있나요?"], a: "irregularly", o: ["slowly", "loudly", "strongly"]}
  - {t: "현재 증상", i: faceWorried, w: "right now가 지금 이 순간의 증상을 묻는다는 점을 분명히 해요. 어지럼이나 숨참은 심장이 너무 빠르게 뛸 때 나타날 수 있는 증상이라 먼저 확인해요.", d: "last night", k: ["가슴이 아프거나 답답하신가요?", "팔다리가 저리거나 약하신가요?"], a: "dizzy", o: ["thirsty", "hungry", "sleepy"]}
  - {t: "과거력", i: board, w: "ever와 before로 지금까지 전체 기간을 묻고 있어요. 뇌졸중이나 혈전 이력은 심방세동 환자의 혈전 위험을 가늠하는 중요한 정보예요.", d: "this morning", k: ["예전에 심장 수술을 받으셨나요?", "예전에 폐렴을 앓으신 적이 있나요?"], a: "stroke", o: ["seizure", "fracture", "ulcer"]}
  - {t: "복용 약", i: pill, w: "like warfarin처럼 예를 들면 환자가 약 이름을 몰라도 알아듣기 쉬워요. 와파린 같은 항응고제를 먹는지는 혈전 예방과 이후 치료 선택에 영향을 줘요.", d: "such as Tylenol", k: ["지금 인슐린을 맞고 계신가요?", "최근 수술을 받으셨나요?"], a: "warfarin", o: ["insulin", "metformin", "albuterol"]}
  - {t: "이유 설명", i: shield, w: "so로 이유와 조치를 연결해 왜 자세히 보는지 알려 줘요. 심방세동에서는 심방이 제대로 수축하지 못해 피가 고여 혈전이 생길 위험이 높아져요.", d: "and calms", k: ["이 리듬은 곧 저절로 사라져요", "이 리듬은 혈압을 크게 낮춰요"], a: "raises", o: ["lowers", "removes", "hides"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "심방세동 환자 문진 4문장 순서"
    why: "모니터를 붙이고, 화면의 리듬을 근거로 증상을 묻고, 답에 감사한 뒤 항응고제를 묻고, 그 답이 중요한 이유를 설명합니다. 'here'·'Thanks for telling me'·'That matters'가 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "I'm going to put you on the heart monitor now.", icon: monitor, ko: "지금 심장 모니터를 붙여드릴게요", note: "부착"}
    - {en: "I can see an irregular rhythm here — are you dizzy or short of breath?", icon: faceWorried, ko: "여기 불규칙한 리듬이 보여요 — 어지럽거나 숨이 차세요?", note: "증상"}
    - {en: "Thanks for telling me. Are you taking a blood thinner like warfarin?", icon: pill, ko: "말씀 고마워요. 와파린 같은 혈액 희석제를 드시나요?", note: "복용 약"}
    - {en: "That matters, because this kind of rhythm raises your risk of clots.", icon: shield, ko: "중요한 질문이에요, 이런 리듬은 혈전 위험을 높이거든요", note: "이유"}
