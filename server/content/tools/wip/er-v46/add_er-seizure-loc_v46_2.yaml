- title: 발작 후 혼돈(postictal)
  s:
  - {t: "상황 알림", i: hospital, w: "어디에 있고 무슨 일이 있었는지를 짧게 두 문장으로 알려요. 발작 직후에는 긴 설명보다 핵심만 전하는 편이 이해하기 쉬워요.", d: "ward", k: ["가족분께 연락해 두었어요", "팔에 혈압 커프를 감을게요"], a: "emergency", o: ["waiting", "operating", "recovery"]}
  - {t: "지남력 확인", i: board, w: "이름과 날짜를 함께 물으면 사람과 시간에 대한 지남력을 한 번에 봐요. 발작 후 혼돈은 반복해서 물으며 회복 정도를 가늠해요.", d: "full", k: ["여기 누구와 같이 오셨는지 기억나세요?", "누구와 함께 지내시나요?"], a: "name", o: ["address", "weight", "height"]}
  - {t: "안심 안내", i: star, w: "It's okay로 먼저 진정시킨 뒤 곧 나아진다고 알려요. 발작 후 혼돈은 대개 시간이 지나며 풀려서 사실에 맞는 안심이에요.", d: "later", k: ["곧 CT를 찍으러 갈 거예요", "곧 다른 병실로 옮길 거예요"], a: "confusion", o: ["headache", "nausea", "rash"]}
  - {t: "안전 안내", i: shield, w: "발작 후에는 낯선 곳이라 불안하거나 거칠어질 수 있어서 안전하다고 먼저 말해요. 짧은 문장이 혼란스러운 환자에게 더 잘 들려요.", d: "sure", k: ["가족분이 곧 도착할 거예요", "불편하시면 말씀해 주세요"], a: "safe", o: ["alone", "lost", "cold"]}
  - {t: "상황 반복", i: redo, w: "같은 설명을 다시 해 주는 것이 발작 후 혼돈 환자에게는 정상적인 대응이에요. 기억이 이어지지 않아서 같은 질문이 반복될 수 있어요.", d: "home", k: ["지금 의사 선생님이 오실 거예요", "머리를 다치지는 않으셨어요"], a: "hospital", o: ["kitchen", "bedroom", "office"]}
  - {t: "재확인 예고", i: redo, w: "같은 질문을 다시 하겠다고 미리 알리면 환자가 이상하게 느끼지 않아요. 반복해서 물어 지남력이 돌아오는지 추이를 봐요.", d: "once", k: ["오늘 안에 퇴원하실 수 있어요", "검사 결과는 의사 선생님이 설명해 드릴 거예요"], a: "few", o: ["hundred", "thousand", "dozen"]}
  order: {tag: "대화 흐름", icon: compass, ko: "발작 후 혼돈 환자 응대 4문장 순서", why: "있는 곳과 일어난 일을 알리고, 안심시킨 뒤, 'Now'로 이름·날짜를 물어 지남력을 확인하고, 'Good'으로 받아 곧 다시 묻겠다고 예고해요. Now와 Good이 순서를 고정해요.", lines: [
    {en: "You're in the emergency room; you had a seizure.", icon: hospital, ko: "여기는 응급실이에요. 발작을 하셨어요", note: "알림"},
    {en: "You're safe here, and this confusion will pass.", icon: shield, ko: "여긴 안전하고, 이 혼란은 지나갈 거예요", note: "안심"},
    {en: "Now, can you tell me your name and today's date?", icon: board, ko: "이제 이름과 오늘 날짜를 말씀해 주시겠어요?", note: "확인"},
    {en: "Good, I'll ask you again in a few minutes.", icon: redo, ko: "좋아요, 몇 분 뒤에 다시 물어볼게요", note: "재확인"}]}
  ctx: {word: "postictal", ko: "발작 후"}
- title: 항경련제 누락 재발
  s:
  - {t: "중단 기간", i: calendar, w: "off your medication은 약을 안 먹은 상태를 담담하게 말하는 표현이에요. 얼마나 끊었는지가 약 농도와 재발 위험을 가늠하는 단서예요.", d: "away", k: ["약은 어느 약국에서 받으시나요?", "약을 먹고 부작용이 있었나요?"], a: "off", o: ["on", "under", "beyond"]}
  - {t: "약물 농도", i: lab, w: "일부 항경련제는 혈중 농도를 재서 약이 충분히 들어 있는지 확인할 수 있어요. We'll로 앞으로 할 검사를 미리 알려요.", d: "count", k: ["혈압을 한 번 더 잴게요", "소변 검사를 하겠습니다"], a: "blood", o: ["urine", "saliva", "sweat"]}
  - {t: "중단 위험", i: bell, w: "can은 '그럴 수 있다'는 가능성이라 단정하지 않으면서 위험을 알려요. 항경련제를 갑자기 끊으면 발작이 다시 생길 수 있어요.", d: "daily", k: ["약을 줄이면 부작용도 줄어요", "약은 식후에 드세요"], a: "suddenly", o: ["slowly", "carefully", "gradually"]}
  - {t: "약 소진", i: pill, w: "run out of는 '다 떨어지다'라서 환자 탓이 아니라 약이 없었던 상황으로 물어요. 약이 없어서 끊은 것인지 가려내요.", d: "away", k: ["약이 몸에 안 맞았나요?", "약을 누가 처방해 줬나요?"], a: "run", o: ["come", "get", "go"]}
  - {t: "복약 당부", i: shield, w: "Please를 붙여 부탁으로 말하면 야단치는 느낌이 줄어요. 증상이 좋아 보여도 임의로 끊지 않도록 알려요.", d: "ever", k: ["약은 아침저녁으로 드세요", "남은 약은 약국에 가져오세요"], a: "stop", o: ["share", "hide", "lose"]}
  - {t: "재시작 안내", i: redo, w: "restart는 '다시 시작'이라 이어 가던 약을 재개한다는 뜻이에요. 용량과 시작은 처방한 의사가 정해요.", d: "twice", k: ["오늘 퇴원 후 약국에서 약을 받으세요", "내일 신경과 외래에 가세요"], a: "restart", o: ["change", "double", "stop"]}
  order: {tag: "대화 흐름", icon: compass, ko: "약 중단 재발 응대 4문장 순서", why: "얼마나 끊었는지 묻고, 'That'이 그 중단을 가리켜 발작 유발 가능성을 알리고, 'So'로 농도 검사를 잇고, 마지막에 앞으로 임의로 끊지 말라고 당부해요. That·So가 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "How long have you been off your seizure medication?", icon: calendar, ko: "발작 약을 끊으신 지 얼마나 됐나요?", note: "기간"},
    {en: "That can trigger seizures like this one.", icon: bell, ko: "그러면 이런 발작이 생길 수 있어요", note: "위험"},
    {en: "So we'll check your medication level in your blood.", icon: lab, ko: "그래서 혈중 약 농도를 확인할게요", note: "검사"},
    {en: "Please don't stop it on your own again.", icon: shield, ko: "다시는 임의로 끊지 말아 주세요", note: "당부"}]}
  ctx: {word: "nonadherent", ko: "복약을 안 지킨"}
- title: 알코올 금단 발작
  s:
  - {t: "마지막 음주", i: calendar, w: "very를 붙이면 '정확히 마지막'을 묻는 말이 돼요. 금단은 마지막 음주 뒤 시간에 따라 달라서 시각이 중요해요.", d: "full", k: ["지금 어디가 가장 불편하세요?", "오늘 식사는 하셨나요?"], a: "drink", o: ["meal", "pill", "cigarette"]}
  - {t: "음주량 문진", i: coffee, w: "usually로 평소 습관을, in a day로 하루 기준을 정해 줘서 대답이 구체적인 양으로 나와요. 판단하는 말투를 빼야 솔직한 양이 나와요.", d: "ever", k: ["술을 시작한 지 얼마나 됐나요?", "술을 끊으려고 해 본 적이 있나요?"], a: "usually", o: ["never", "suddenly", "secretly"]}
  - {t: "금단 증상", i: faceWorried, w: "땀·떨림·헛것은 알코올 금단의 대표 증상이라 한 문장으로 묻고, 환자가 해당되는 것만 답하게 해요.", d: "chills", k: ["배가 아프거나 토하셨나요?", "가슴이 아프거나 답답하세요?"], a: "tremors", o: ["hiccups", "rashes", "itching"]}
  - {t: "금주 기간", i: calendar, w: "since you stopped는 마지막 음주 이후 경과를 며칠 단위로 세게 해요. 금단은 보통 마지막 술 뒤 몇 시간에서 며칠 사이에 나타나서 이 숫자가 중요해요.", d: "while", k: ["하루에 몇 잔씩 드셨나요?", "마지막 술은 무엇을 드셨나요?"], a: "since", o: ["before", "after", "until"]}
  - {t: "관찰 전달", i: magnify, w: "look like로 본 것을 전하면 판단 없이 관찰만 말해요. 손 떨림은 금단 말고도 원인이 많아서 단정하지 않아요.", d: "very", k: ["숨을 가쁘게 쉬고 있는 것 같아요", "얼굴이 많이 창백해 보여요"], a: "hands", o: ["eyes", "knees", "lips"]}
  - {t: "치료 설명", i: pill, w: "to prevent로 약의 목적을 말해 주면 환자가 약을 받아들이기 쉬워요. 금단 치료는 증상이 심해지기 전에 약을 쓰는 것이 핵심이에요.", d: "stronger", k: ["술을 줄이는 방법을 알려 드릴게요", "상담 선생님을 불러 드릴게요"], a: "prevent", o: ["cause", "increase", "ignore"]}
  order: {tag: "대화 흐름", icon: compass, ko: "알코올 금단 응대 4문장 순서", why: "마지막 음주를 묻고, 'after you stop'으로 손 떨림이 금단일 수 있다고 알리고, 'it'이 가리키는 증상이 심해지지 않게 약을 주고, 'After that'으로 이상을 알려 달라고 당부해요. it과 After that이 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "When was your very last drink?", icon: calendar, ko: "마지막으로 술을 드신 게 정확히 언제였나요?", note: "문진"},
    {en: "Your hands look shaky, and that can happen after you stop.", icon: magnify, ko: "손이 떨리는데, 끊고 나면 그럴 수 있어요", note: "관찰"},
    {en: "We're giving you medication to keep it from getting worse.", icon: pill, ko: "나빠지지 않게 약을 드릴게요", note: "치료"},
    {en: "After that, tell me right away if you see or feel anything strange.", icon: bell, ko: "그다음엔 이상한 게 보이거나 느껴지면 바로 말해 주세요", note: "당부"}]}
  sw: {ko: "보통 하루에 술을 얼마나 드시나요?"}
- title: 열성 경련 소아 부모 안심
  s:
  - {t: "경련 설명", i: shield, w: "frightening과 harmless를 but으로 이어 놀란 마음을 인정하면서 안심시켜요. 열성 경련은 대부분 뇌에 장기적인 손상을 남기지 않아요.", d: "rarely", k: ["해열제는 이미 드셨나요?", "아이의 예방접종은 마쳤나요?"], a: "harmless", o: ["deadly", "contagious", "permanent"]}
  - {t: "현재 상태", i: monitor, w: "지금 상태를 가장 먼저 전하면 부모가 제일 궁금한 것(숨을 쉬는지)에 답해요. starting to로 아직 회복 중이라는 사실도 정직하게 말해요.", d: "slowly", k: ["체온은 아직 높은 상태예요", "곧 의사 선생님이 오실 거예요"], a: "breathing", o: ["eating", "sleeping", "crying"]}
  - {t: "치료 방향", i: chartup, w: "Let's로 함께 한다는 느낌을 줘요. 열성 경련에서는 경련 자체보다 열의 원인을 찾고 열을 내리는 것이 치료의 초점이에요.", d: "make", k: ["아이를 잠시 안아 주셔도 돼요", "물을 조금 마시게 해 볼게요"], a: "focus", o: ["agree", "wait", "hurry"]}
  - {t: "공감", i: faceWorried, w: "I know로 시작하면 부모의 놀란 마음을 먼저 인정해요. 설명이나 지시 앞에 공감을 두면 이어지는 말이 잘 들려요.", d: "quite", k: ["아이가 많이 우는 건 정상이에요", "잘 대처하셨어요"], a: "scary", o: ["boring", "funny", "easy"]}
  - {t: "예후 안내", i: star, w: "Most는 '대부분'이라 모두라고 단정하지 않아요. 열성 경련은 어린 시기에만 생기고 대개 자라면서 멈춰요.", d: "never", k: ["해열제 용량은 체중으로 정해요", "아이는 오늘 밤 병원에서 지켜볼 수 있어요"], a: "outgrow", o: ["develop", "inherit", "forget"]}
  - {t: "약 설명", i: pill, w: "safely를 붙이면 약이 위험하지 않다는 점을 부모에게 전해요. 해열제는 열의 불편함을 줄이지만 열성 경련을 막지는 않아요.", d: "ahead", k: ["수액을 맞혀 줄게요", "아이에게 산소를 대 줄게요"], a: "fever", o: ["pain", "cough", "rash"]}
  order: {tag: "대화 흐름", icon: compass, ko: "열성 경련 부모 안심 4문장 순서", why: "부모의 놀람을 인정하고, 지금 숨을 잘 쉰다고 전하고, 'That kind of seizure'로 앞의 일을 가리켜 무해하다고 설명하고, 'For now'로 지금 하는 열 치료를 알려요. 앞 줄을 가리키는 말이 순서를 고정해요.", lines: [
    {en: "I know this looked very scary.", icon: faceWorried, ko: "정말 무섭게 보였을 거예요", note: "공감"},
    {en: "She's breathing well now and starting to recover.", icon: monitor, ko: "지금은 숨도 잘 쉬고 회복되기 시작했어요", note: "상태"},
    {en: "That kind of seizure is frightening but usually harmless.", icon: shield, ko: "그런 경련은 무섭지만 대개 무해해요", note: "설명"},
    {en: "For now, we're giving her medicine to bring the fever down.", icon: pill, ko: "지금은 열을 내리는 약을 드리고 있어요", note: "치료"}]}
  sw: {ko: "아이가 5분 넘게 경련하면 911에 전화하세요"}
- title: 임신부 자간증 발작
  s:
  - {t: "임신 주수", i: baby, w: "How many weeks로 주수를 바로 물어요. 임신 20주 이후에 생긴 발작은 자간증을 의심하게 되므로 주수가 첫 단서예요.", d: "since", k: ["이번이 첫 임신인가요?", "산전 진료는 어디서 받으세요?"], a: "weeks", o: ["hours", "pounds", "inches"]}
  - {t: "부종 문진", i: magnify, w: "얼굴과 손의 붓기는 전자간증의 흔한 징후라서 두 부위를 함께 물어요. 발이 붓는 것은 임신 중 흔해서 구별 가치가 낮아요.", d: "pain", k: ["하루에 소변은 몇 번 보세요?", "아기 태동은 느끼셨나요?"], a: "swelling", o: ["bruising", "itching", "numbness"]}
  - {t: "조치 알림", i: stetho, w: "지금 하는 일과 부르는 사람을 함께 알려요. 혈압은 전자간증과 자간증을 가르는 핵심 수치라 바로 재요.", d: "off", k: ["산소포화도를 재고 정맥주사를 놓을게요", "소변 검사를 위해 소변을 받아 주세요"], a: "calling", o: ["skipping", "forgetting", "canceling"]}
  - {t: "두통 문진", i: bell, w: "bad을 붙이면 평소와 다른 심한 두통인지 묻게 돼요. 심한 두통은 전자간증이 심해졌다는 경고 증상이에요.", d: "ever", k: ["배가 아프거나 단단해지나요?", "질에서 출혈이 있었나요?"], a: "headache", o: ["nosebleed", "backache", "fever"]}
  - {t: "시야 문진", i: magnify, w: "점이나 번쩍임, 흐린 시야는 전자간증이 심해졌을 때 나타나는 징후예요. 환자의 말로 풀어 물으면 의학 용어를 모르는 사람도 답해요.", d: "dark", k: ["귀에서 소리가 들리나요?", "숨이 차거나 가슴이 답답한가요?"], a: "blurry", o: ["clear", "perfect", "colorful"]}
  - {t: "태아 감시", i: monitor, w: "임신부 발작에서는 엄마와 아기를 함께 봐서 태아 심박도 확인해요. too가 '엄마뿐 아니라'라는 뜻을 더해요.", d: "bed", k: ["아기의 크기를 초음파로 잴게요", "아기 이름은 정하셨나요?"], a: "monitor", o: ["scale", "chart", "phone"]}
  order: {tag: "대화 흐름", icon: compass, ko: "임신부 발작 응대 4문장 순서", why: "주수를 묻고, 'because of that'으로 그 주수 때문에 혈압을 재고 산과를 부르고, 증상을 묻고, 'too'로 아기도 본다고 마무리해요. because of that과 too가 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "How many weeks pregnant are you?", icon: baby, ko: "임신 몇 주차이신가요?", note: "주수"},
    {en: "Because of that, we're checking your blood pressure and calling OB.", icon: stetho, ko: "그래서 혈압을 재고 산부인과를 부를게요", note: "조치"},
    {en: "Have you had a bad headache or blurry vision today?", icon: bell, ko: "오늘 심한 두통이나 흐린 시야가 있었나요?", note: "증상"},
    {en: "We'll watch the baby's heart rate on the monitor too.", icon: monitor, ko: "아기 심박수도 모니터로 지켜볼게요", note: "태아"}]}
  ctx: {word: "photopsia", ko: "번쩍이는 빛"}
- title: 실신 vs 발작 감별
  s:
  - {t: "전조 확인", i: faceWorried, w: "passed out 전의 어지러움은 실신에서 흔한 전조예요. 발작은 전조 없이 갑자기 시작하는 경우가 많아서 감별 단서가 돼요.", d: "after", k: ["넘어질 때 머리를 부딪혔나요?", "기절한 게 몇 시쯤이었나요?"], a: "lightheaded", o: ["embarrassed", "hungry", "excited"]}
  - {t: "회복 속도", i: chartup, w: "실신은 보통 몇 초에서 몇 분 안에 정신이 돌아오고, 발작은 회복이 더 오래 걸려요. quickly로 묻는 이유예요.", d: "soon", k: ["기절하고 나서 몸 어디가 아프세요?", "기절한 적이 전에도 있나요?"], a: "quickly", o: ["loudly", "politely", "angrily"]}
  - {t: "목격 확인", i: speech, w: "본 사람이 있는지 물으면 환자가 모르는 장면을 알 수 있어요. 뻣뻣해지거나 떠는 움직임은 발작을 시사해요(실신에서도 짧은 경련이 있을 수 있어요).", d: "twice", k: ["쓰러질 때 누가 옆에 있었나요?", "쓰러진 뒤 누가 119를 불렀나요?"], a: "stiffening", o: ["bleeding", "coughing", "sweating"]}
  - {t: "심계항진", i: monitor, w: "심장이 빨리 뛰었다는 말은 부정맥으로 인한 실신의 단서예요. 심장 문제는 위험해서 실신을 가릴 때 꼭 물어요.", d: "afterward", k: ["가슴이 답답하거나 아팠나요?", "숨이 차서 걷기 힘들었나요?"], a: "racing", o: ["resting", "sleeping", "laughing"]}
  - {t: "유발 상황", i: compass, w: "오래 서 있는 것은 혈관미주신경성 실신의 흔한 유발 상황이에요. 상황을 물으면 원인 후보가 좁혀져요.", d: "sleeping", k: ["기절하기 전에 무엇을 드셨나요?", "오늘 물은 충분히 마셨나요?"], a: "standing up", o: ["sitting down", "lying down", "walking around"]}
  - {t: "의식 회복", i: bulb, w: "발작 뒤에는 혼란이 몇 분 넘게 가는 일이 흔하고, 실신 뒤에는 바로 맑아지는 편이에요. 두 경우를 한 문장에 놓아 비교해 물어요.", d: "alone", k: ["기절한 뒤 구토를 하셨나요?", "병원에 오기 전에 약을 드셨나요?"], a: "clearheaded", o: ["angry", "hungry", "cheerful"]}
  order: {tag: "대화 흐름", icon: compass, ko: "실신 감별 문진 4문장 순서", why: "기절 전 전조를 묻고, 'while you were out'으로 그 사이 목격된 움직임을 묻고, 'afterward'로 회복을 묻고, 마지막에 감별에 도움이 됐다고 정리해요. while you were out과 afterward가 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "Did you feel lightheaded before you passed out?", icon: faceWorried, ko: "기절하기 전에 어지러웠나요?", note: "전조"},
    {en: "Did anyone see stiffening or shaking while you were out?", icon: speech, ko: "의식이 없는 동안 뻣뻣해지거나 떠는 걸 본 사람이 있나요?", note: "목격"},
    {en: "How quickly did you wake up and feel clear afterward?", icon: chartup, ko: "그 후 얼마나 빨리 깨어나 정신이 맑아졌나요?", note: "회복"},
    {en: "Thanks, that helps me tell a faint from a seizure.", icon: check, ko: "고마워요, 실신과 발작을 가리는 데 도움이 돼요", note: "정리"}]}
  ctx: {word: "postictal", ko: "발작 후"}
