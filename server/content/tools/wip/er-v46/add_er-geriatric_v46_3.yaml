- title: 학대·방임 의심
  s:
  - {t: 중립적 시작, i: magnify, w: "noticed와 understand better로 판단이나 추궁 없이 관찰한 것을 이해하고 싶다고 말해요. 학대가 의심될 때는 환자가 방어적이 되지 않게 중립적으로 시작해요.", d: "in the hallway", k: ["가족분이 같이 계시나요?", "최근에 병원에 오신 적이 있으세요?"], a: "noticed", o: ["repaired", "borrowed", "ordered"]}
  - {t: 안전한 대화, i: shield, w: "You're safe to talk with me로 말해도 안전하다는 느낌을 먼저 줘요. 다만 미국에서는 노인 학대가 의심되면 병원 지침과 주법에 따라 보고해야 할 수 있어서, 비밀 보장은 약속하지 않고 절차를 정직하게 설명하는 것이 안전해요.", d: "on the phone", k: ["지금 불편한 점이 있으세요?", "물이나 담요를 드릴까요?"], a: "safe", o: ["late", "upset", "busy"]}
  - {t: 목적 설명, i: handshake2, w: "My only goal로 목적을 하나로 좁혀 추궁이 아니라 돌봄이 목적임을 밝혀요. cared for는 돌봄을 받는다는 뜻이라 환자가 안전하게 보살핌받는지 확인하겠다는 말이에요.", d: "at the clinic", k: ["도움이 필요한 부분이 있으면 말씀해 주세요", "필요하시면 사회복지사와 이야기할 수 있어요"], a: "goal", o: ["fear", "habit", "hobby"]}
  - {t: 관찰 말하기, i: magnify, w: "보이는 멍을 판단 없이 말하고 질문을 시작해요. 환자가 스스로 설명할 여지를 줘서 누구 탓인지 묻는 질문보다 답을 얻기 쉬워요.", d: "from the fall", k: ["이 멍은 아프세요?", "팔을 움직이면 아프세요?"], a: "bruises", o: ["tattoos", "freckles", "calluses"]}
  - {t: 식사 확인, i: coffee, w: "enough food로 굶주림 같은 방임의 징후를 열린 질문으로 확인해요. at home이 집에서의 생활을 가리켜 돌봄 환경을 자연스럽게 물어요.", d: "from the church", k: ["식사는 누가 차려 주세요?", "약은 누가 챙겨 주세요?"], a: "enough", o: ["spicy", "frozen", "salty"]}
  - {t: 안전 확인, i: shield, w: "I ask everyone this로 환자를 의심해서가 아니라 모든 사람에게 하는 질문이라고 말해 부담을 덜어요. 안전한지는 예·아니오로 답할 수 있는 직접 질문이에요.", d: "in the room", k: ["혼자 사세요?", "집에 같이 사는 분이 있으세요?"], a: "live", o: ["work", "shop", "travel"]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 학대 의심 사정 4문장 순서
    why: 관찰한 것을 이해하고 싶다고 열고, 돌봄이 목적임을 밝히고, 그 목적을 위해 멍을 묻고, 마지막으로 안전을 묻습니다. 'in asking'·'To do that'·'the bruises'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: "I noticed some things I'd like to understand better.", icon: magnify, ko: "몇 가지 알아차린 점이 있어서 더 이해하고 싶어요", note: 시작}
    - {en: "My only goal in asking is to make sure you're cared for.", icon: handshake2, ko: "여쭤보는 제 목표는 돌봄을 잘 받으시도록 하는 것뿐이에요", note: 목적}
    - {en: "To do that, I want to ask about some bruises I noticed on your arm.", icon: bandage, ko: "그러려면 팔에 있는 멍에 대해 여쭤보고 싶어요", note: 멍}
    - {en: "Whatever the bruises turn out to be, I ask everyone this — do you feel safe where you live?", icon: shield, ko: "멍이 무엇이든 모든 분께 여쭤봐요, 사시는 곳에서 안전하다고 느끼세요?", note: 안전}
  sw: {ko: "제가 본 멍에 대해 여쭤보고 싶어요."}
- title: 진통제 신중 투여
  s:
  - {t: 용량 설명, i: pill, w: "start low and adjust로 적은 용량에서 시작해 반응을 보며 조절한다고 알려요. 나이가 들면 신장이 약을 천천히 내보내서 같은 용량도 더 오래 남을 수 있어요.", d: "in the morning", k: ["통증이 몇 점인지 0에서 10으로 말씀해 주세요", "알레르기가 있는지 다시 확인할게요"], a: "kidneys", o: ["hair", "nails", "teeth"]}
  - {t: 부작용 예방, i: shield, w: "avoid feeling too ...로 부작용을 미리 말하고 그걸 막도록 돕겠다고 알려요. 노인은 진통제로 몽롱하거나 휘청거리면 낙상 위험이 커져서 미리 짚어요.", d: "after surgery", k: ["부작용이 걱정되시나요?", "통증이 계속되면 말씀해 주세요"], a: "groggy", o: ["hungry", "thirsty", "itchy"]}
  - {t: 보고 요청, i: bell, w: "at any point로 언제든 말해도 된다고 알려요. 노인은 불편을 참는 경우가 있어서 증상이 생기면 바로 알려 달라고 분명히 말해 둬요.", d: "after lunch", k: ["혈압은 한 번 더 확인할게요", "다음 약은 시간이 되면 드릴게요"], a: "dizzy", o: ["cold", "hot", "bored"]}
  - {t: 이유 설명, i: bulb, w: "as you age로 나이가 들면서 생기는 변화임을 말해 환자 탓이 아니라고 알려요. 신장 기능이 떨어지면 약이 몸에 더 오래 남아 같은 양도 더 세게 작용할 수 있어요.", d: "as you sleep", k: ["신장 기능 검사 결과를 먼저 볼게요", "다른 약도 함께 확인할게요"], a: "kidneys", o: ["eyes", "bones", "hands"]}
  - {t: 관찰 안내, i: monitor, w: "closely로 자주 살피겠다는 약속을, any side effects로 어떤 부작용이든 보겠다는 범위를 알려요. 진통제를 쓴 노인은 졸림·호흡·어지럼을 가까이서 확인해요.", d: "in the lobby", k: ["약 효과가 얼마나 가는지 말씀드릴게요", "통증이 다시 오면 바로 말씀해 주세요"], a: "side effects", o: ["rumors", "bills", "delays"]}
  - {t: 낙상 예방, i: bell, w: "don't try to get up alone으로 혼자 일어나지 말라고 분명히 말하고 until we check on you로 저희가 곁에 올 때까지라고 이유를 붙여요. 진정이나 어지럼이 있는 노인은 혼자 일어나다 낙상할 수 있어요.", d: "for the nurse", k: ["화장실은 저희가 같이 가 드릴게요", "침대 높이를 낮춰 드릴게요"], a: "alone", o: ["barefoot", "early", "outside"]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 노인 진통제 안내 4문장 순서
    why: 신장이 약을 천천히 처리한다고 설명하고, 그래서 적게 시작한다고 말하고, 몽롱함·어지럼을 알려 달라 하고, 그 예방으로 혼자 일어나지 말라고 합니다. 'your kidneys'·'that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: "Your kidneys process medication more slowly as you age.", icon: bulb, ko: "나이가 드시면 신장이 약을 더 천천히 처리해요", note: 이유}
    - {en: "So we'll start low and adjust carefully for your kidneys.", icon: pill, ko: "그래서 적은 용량으로 시작해 신장에 맞춰 조절할게요", note: 용량}
    - {en: "I'll help you avoid feeling too groggy or unsteady, so tell me if you feel dizzy at any point.", icon: shield, ko: "너무 몽롱하거나 휘청거리지 않도록 도울게요, 어지러우시면 언제든 말씀해 주세요", note: 보고}
    - {en: "Part of that: please don't try to get up alone until we check on you.", icon: bell, ko: "그 일환으로 저희가 확인할 때까지 혼자 일어나려 하지 마세요", note: 낙상}
- title: 보청기·안경 보조기구
  s:
  - {t: 보조 제안, i: bulb, w: "Let's see if로 확정이 아니라 함께 알아본다는 말투예요. hearing and seeing 두 감각을 한 번에 말해 보청기와 안경 모두 이야기를 열어요.", d: "at the pharmacy", k: ["안경이나 보청기를 집에 두고 오셨나요?", "눈이 침침하신 지 오래되셨나요?"], a: "hearing", o: ["walking", "writing", "remembering"]}
  - {t: 소통 방식, i: speech, w: "stay in your view는 환자 시야 안에 머물겠다는 뜻이에요. 노인은 시야에서 사라지면 불안해지기 쉽고, 얼굴이 보여야 입 모양으로 말을 보충할 수 있어요.", d: "by the window", k: ["큰 소리로 말씀드릴게요", "자리를 바꿔 앉을게요"], a: "view", o: ["pocket", "dream", "shadow"]}
  - {t: 이유 설명, i: bulb, w: "Having your glasses will help로 안경이 혼란을 줄이는 이유를 짚어요. 잘 보이지 않으면 환경을 오해하기 쉬워서 안경과 보청기는 섬망 예방에도 쓰여요.", d: "in your purse", k: ["안경은 어디에 두셨나요?", "눈이 아프신가요?"], a: "glasses", o: ["keys", "coat", "wallet"]}
  - {t: 보조 확인, i: me, w: "usually로 평소 습관을 묻고 glasses or contact lenses로 두 가지를 같이 보여 줘요. 환자가 어느 쪽을 쓰는지 알아야 어디서 찾을지 알 수 있어요.", d: "to bed", k: ["지금 안경을 가지고 계신가요?", "보청기는 어느 쪽 귀에 끼세요?"], a: "glasses", o: ["hats", "gloves", "jewelry"]}
  - {t: 배터리 교체, i: gear, w: "if needed로 필요할 때만 교체한다는 조건을 붙여요. 보청기가 소리를 내지 못하는 흔한 이유 중 하나가 배터리라 먼저 확인해 봐요.", d: "on the table", k: ["보청기를 이쪽에 보관해 드릴게요", "보청기 소리는 제가 확인할게요"], a: "batteries", o: ["lenses", "frames", "hinges"]}
  - {t: 이유 설명, i: bulb, w: "much less와 here로 지금 이 낯선 곳에서 안경의 효과가 크다고 강조해요. 낯선 병원에서는 잘 보이는 것이 혼란을 줄이는 데 도움이 돼요.", d: "in your purse", k: ["안경을 닦아 드릴까요?", "안경이 불편하지 않으세요?"], a: "Wearing", o: ["Breaking", "Losing", "Borrowing"]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 보조기구 안내 4문장 순서
    why: 듣고 보는 데 도움을 찾자고 열고, 평소 쓰는 것을 묻고, 그것을 쓰면 혼란이 줄어든다고 설명하고, 효과를 위해 배터리를 점검합니다. 'for that'·'them'·'For that to help'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: "Let's see if we can get you some help hearing and seeing better.", icon: bulb, ko: "듣고 보시는 데 도움이 될 만한 걸 함께 찾아볼게요", note: 제안}
    - {en: "Do you usually wear glasses or hearing aids for that?", icon: me, ko: "그러려고 평소 안경이나 보청기를 쓰시나요?", note: 확인}
    - {en: "Having them on will help you feel less confused here.", icon: bulb, ko: "그걸 쓰시면 여기서 덜 혼란스러우실 거예요", note: 이유}
    - {en: "For that to help, let's replace your hearing aid batteries if needed.", icon: gear, ko: "그게 도움이 되도록 필요하면 보청기 배터리를 교체해드릴게요", note: 배터리}
  sw: {ko: "박 여사님, 저를 보실 수 있게 안경을 써 보세요."}
- title: 사전연명의료의향 확인
  s:
  - {t: 의향서 확인, i: board, w: "Do you know if로 환자 대신 답하는 가족이 확실히 몰라도 답하기 쉽게 물어요. POLST는 의사 지시가 되는 치료 선호 양식이고 advance directive는 사전의향서예요.", d: "in his wallet", k: ["그분 주치의가 누구세요?", "그분이 어떤 약을 드시나요?"], a: "POLST", o: ["mortgage", "warranty", "lease"]}
  - {t: 가치 질문, i: star, w: "What matters most로 환자가 가장 중요하게 여기는 것을 열린 질문으로 물어요. 예·아니오 대신 가치를 묻는 질문이라 치료 방향을 정하는 대화의 시작이에요.", d: "in the hospital", k: ["그분이 지금 통증이 있으신가요?", "그분이 병원에 오신 지 얼마나 되셨나요?"], a: "care", o: ["diet", "home", "hobbies"]}
  - {t: 약속, i: handshake2, w: "as best we can로 가능한 범위에서 최선을 다하겠다고 약속해요. 모든 것을 보장하는 것처럼 말하지 않아 법과 의학의 한계 안에서 정직하게 말하는 방식이에요.", d: "in writing", k: ["그분 뜻을 다시 확인할게요", "의사에게 바로 전달할게요"], a: "wishes", o: ["taxes", "rooms", "bills"]}
  - {t: 평소 대화, i: speech, w: "Has he ever talked about으로 환자가 평소 한 말을 가족이 기억하는지 물어요. 서류가 없을 때는 환자가 전에 한 말이 치료 방향을 정하는 근거가 돼요.", d: "to the pastor", k: ["그분이 유언장을 쓰셨나요?", "그분 가족이 모두 오셨나요?"], a: "kind", o: ["cost", "brand", "color"]}
  - {t: 사본 요청, i: pencil, w: "a copy ... with you today로 오늘 가져왔는지를 구체적으로 물어요. 사본이 있으면 환자의 뜻을 서류로 바로 확인해 치료에 반영할 수 있어요.", d: "from the lawyer", k: ["POLST는 누가 작성했나요?", "서류를 팩스로 받을 수 있나요?"], a: "copy", o: ["bill", "receipt", "ticket"]}
  - {t: 지지 표현, i: handshake2, w: "respect와 support를 나란히 놓아 환자의 뜻과 가족 모두를 돕겠다는 두 가지 약속을 해요. 가족이 결정의 짐을 혼자 지는 것처럼 느끼지 않게 해 줘요.", d: "in this hospital", k: ["그분과 가족분들께 사회복지사를 연결해 드릴게요", "원하시는 건 언제든 말씀해 주세요"], a: "family", o: ["landlord", "lawyer", "insurer"]}
  order:
    tag: 대화 흐름
    icon: compass
    ko: 의향 확인 4문장 순서
    why: 서류가 있는지 묻고, 서류 여부와 상관없이 그분께 중요한 것을 묻고, 그것을 평소 말한 적 있는지 묻고, 뜻을 지키겠다고 약속합니다. 'Whether or not'·'that'·'his wishes'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: "Do you know if he has a POLST or advance directive?", icon: board, ko: "POLST나 사전의향서가 있으신지 아시나요?", note: 서류}
    - {en: "Whether or not there's a paper, what matters most to him about his care?", icon: star, ko: "서류가 있든 없든 그분께 치료에서 가장 중요한 게 뭘까요?", note: 가치}
    - {en: "Has he ever talked about that — what kind of care he'd want?", icon: speech, ko: "그것에 대해, 원하시는 치료 방식을 말씀하신 적이 있나요?", note: 평소}
    - {en: "We'll honor his wishes as best we can.", icon: handshake2, ko: "할 수 있는 한 그분의 뜻을 지켜 드릴게요", note: 약속}
- title: 노인 패혈증 급속 진행
  s:
  - {t: 상태 공유, i: monitor, w: "worry me로 가족에게 걱정을 솔직히 말하고 we're acting fast로 바로 움직인다고 이어요. 노인 패혈증은 열이 아니라 저체온이나 저혈압으로 나타나기도 해서 가족에게 이유를 알려요.", d: "with the doctor", k: ["환자분 병력을 알려 주시겠어요?", "환자분 약은 잠시 보관할게요"], a: "temperature", o: ["appetite", "hearing", "vision"]}
  - {t: 비전형 설명, i: bulb, w: "look different로 노인 패혈증이 흔한 모습과 다를 수 있다고 알려요. we're on it은 이미 대응 중이라는 구어체라 가족이 안심할 수 있어요.", d: "in the lab", k: ["따님께 곧 상황을 다시 설명드릴게요", "환자분 병력을 알려 주시겠어요?"], a: "sepsis", o: ["anemia", "arthritis", "glaucoma"]}
