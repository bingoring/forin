- title: "출혈성 쇼크 급속진행"
  s:
  - {t: "치료 알림", i: lab, w: "as fast as we can으로 속도를 숫자 대신 최대치로 말해요. 출혈성 쇼크는 잃은 피를 빨리 채우는 것이 핵심 치료예요.", d: "by mouth", k: ["지금 산소를 최대로 올리고 있어요", "지금 수액 주머니를 바꾸고 있어요"], a: "blood", o: ["fluids", "oxygen", "medicine"]}
  - {t: "지혈", i: bandage, w: "Applying pressure처럼 주어를 생략한 진행형은 팀 안에서 하는 일을 짧게 알리는 말이에요. 출혈 부위를 직접 압박하는 것은 대량 출혈에서 미루지 않고 하는 지혈이에요.", d: "with a belt", k: ["붕대를 풀고 상처를 확인하고 있어요", "상처 부위를 소독하고 있어요"], a: "pressure", o: ["ice", "tape", "heat"]}
  - {t: "의식 유지", i: faceWorried, w: "if you can을 붙여 힘든 환자에게 할 수 있는 만큼만 해도 된다고 허락해 줘요. 눈 뜨기 같은 쉬운 지시로 의식 상태를 확인해요.", d: "right now", k: ["제 말이 들리면 손을 쥐어 보세요", "제 이름을 불러 보세요"], a: "eyes", o: ["hand", "mouth", "ears"]}
  - {t: "상태 알림", i: monitor, w: "getting weak처럼 진행형이라 상태가 나빠지는 중임을 전해요. 맥박이 약해지는 것은 혈액이 모자라 순환이 떨어진다는 신호예요.", d: "this morning", k: ["산소 수치는 아직 괜찮아요", "체온을 한 번 더 잴게요"], a: "weak", o: ["strong", "regular", "irregular"]}
  - {t: "곁 지킴", i: faceWorried, w: "but we're right here로 상태를 전한 뒤 곁에 있다고 잇는 순서라 걱정만 남기고 끝내지 않아요. 반응이 약해도 환자가 들을 수 있다고 보고 계속 말을 걸어요.", d: "all day", k: ["가족분을 곧 모셔 올게요", "모든 처치를 설명해 드릴게요"], a: "barely", o: ["fully", "quickly", "clearly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "출혈성 쇼크 대응 4문장 순서"
    why: "지혈 압박을 먼저 시작하고, 압박하는 동안 혈액을 주고, 그 혈액이 들어가는데도 맥박이 약하다고 알리고, 곁에 있다고 닫아요. 'it'·'That blood'·'Even so'가 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "I'm pressing hard on the wound right now to control the bleeding.", icon: bandage, ko: "지금 출혈을 조절하려고 상처를 세게 누르고 있어요", note: "지혈"}
    - {en: "While I hold it, we're giving blood as fast as we can.", icon: lab, ko: "제가 누르는 동안 최대한 빠르게 혈액을 드리고 있어요", note: "수혈"}
    - {en: "That blood is running in, but your pulse is still weak, so we're moving fast.", icon: monitor, ko: "그 혈액이 들어가고 있지만 맥박이 아직 약해서 서두르고 있어요", note: "상태"}
    - {en: "Even so, stay with me—we're right here with you.", icon: faceWorried, ko: "그래도 정신 차리세요, 저희가 바로 곁에 있어요", note: "안심"}
  sw: {ko: "정신 차리세요—할 수 있으면 눈을 떠 보세요"}
- title: "외상성 심정지 대응"
  s:
  - {t: "팀 지시", i: siren, w: "동사 원형으로 시작하는 짧은 지시는 코드 중 소리가 큰 환경에서도 한 번에 전달돼요. 외상성 심정지에서는 압박을 이어 가면서 긴장성 기흉 같은 되돌릴 수 있는 원인을 동시에 찾아요.", d: "for ten", k: ["압박 멈춰요—맥박 확인해요", "압박은 교대하고—기도를 확인해요"], a: "compressions", o: ["ventilations", "fluids", "pressure"]}
  - {t: "시술 지시", i: scalpel, w: "Bilateral은 양쪽 모두라는 뜻이라 한쪽만 하는 실수를 막아요. 외상성 심정지에서는 양쪽 흉강을 감압해 긴장성 기흉 가능성을 바로 배제하는 것이 권고돼요.", d: "after this", k: ["양측 호흡음 청진 지금", "흉부 엑스레이 지금"], a: "Bilateral", o: ["Unilateral", "Partial", "Gentle"]}
  - {t: "원인 확인", i: monitor, w: "with ultrasound로 도구를 같이 말해 지금 무엇을 하는지 팀이 바로 알아요. 심장 주변에 피가 차 심장이 눌리는 압전도 되돌릴 수 있는 원인이라 초음파로 확인해요.", d: "by hand", k: ["초음파로 복강 출혈을 확인 중", "초음파로 폐 허탈을 확인 중"], a: "ultrasound", o: ["x-ray", "CT", "MRI"]}
  - {t: "맥박 확인", i: stetho, w: "now와 hold를 짧게 붙여 말해 압박을 잠깐 멈추라는 신호를 명확히 해요. 맥박 확인 때는 압박을 오래 멈추지 않도록 시간을 짧게 잡아요.", d: "for ten", k: ["지금 리듬 확인—충격 준비", "지금 약 투여—압박 계속"], a: "hold", o: ["start", "count", "switch"]}
  - {t: "교대 지시", i: redo, w: "압박자 교대는 피로로 압박 질이 떨어지는 것을 막으려고 보통 2분마다 해요. same rate로 속도를 이어 가라고 하면 교대 순간에도 흐름이 끊기지 않아요.", d: "every minute", k: ["압박자 교대 준비—기도 확보", "압박 계속—에피네프린 투여"], a: "rate", o: ["depth", "time", "force"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "외상성 심정지 4문장 순서"
    why: "압박을 이어 가며 기흉을 확인하고, 그걸 배제하려 양측 감압을 하고, 감압이 끝나면 초음파로 압전을 보고, 스캔이 끝나면 맥박을 확인합니다. 'that'·'Decompression done'·'Scan done'이 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "Continue compressions—checking for tension pneumothorax.", icon: siren, ko: "압박 계속—긴장성 기흉 확인 중", note: "압박"}
    - {en: "Bilateral chest decompression now, to rule that out.", icon: scalpel, ko: "그걸 배제하려고 양측 흉강 감압 지금", note: "감압"}
    - {en: "Decompression done—assessing for cardiac tamponade with ultrasound.", icon: monitor, ko: "감압 완료—초음파로 심장압전 사정 중", note: "초음파"}
    - {en: "Scan done—pulse check now, hold compressions.", icon: stetho, ko: "스캔 완료—지금 맥박 확인, 압박 잠깐 멈춰", note: "맥박"}
  ctx: {word: "pulse", ko: "맥박"}
- title: "다발외상 핸드오프"
  s:
  - {t: "기전 보고", i: siren, w: "MVC처럼 줄인 약어와 명사구만 이어 붙이는 것이 핸드오프의 압축된 형식이에요. 고속과 안전벨트 미착용은 심한 손상을 예상하게 하는 기전이라 맨 앞에 말해요.", d: "on the road", k: ["후방 추돌 사고, 안전벨트 착용한 승객", "보행자 충돌, 시속 이십 마일"], a: "unrestrained", o: ["restrained", "injured", "ejected"]}
  - {t: "손상 보고", i: bandage, w: "binder in place처럼 장비를 상태로 말하면 이미 처치가 끝났다는 것이 한눈에 보여요. 골반과 대퇴골은 골절 시 출혈량이 커서 인계에서 따로 짚어요.", d: "on the left", k: ["두개골 골절, 경추 칼라 적용", "갈비뼈 골절, 흉관 삽입"], a: "femur", o: ["humerus", "tibia", "clavicle"]}
  - {t: "치료 보고", i: lab, w: "수와 단위(Two units)로 말해야 인수하는 사람이 얼마나 들어갔는지 정확히 알아요. now stabilizing은 변하는 중인 추세를 한 마디로 줘요.", d: "by hand", k: ["수액 이 리터 투여, 혈압 계속 하락 중", "혈소판 한 팩 투여, 맥박 안정 중"], a: "stabilizing", o: ["dropping", "fluctuating", "crashing"]}
  - {t: "상태 보고", i: stetho, w: "Airway is secure처럼 상태를 한 문장씩 끊어 ABCDE 순서대로 말하면 받는 사람이 놓치지 않아요. on his own은 인공호흡기 없이 스스로 호흡한다는 뜻이에요.", d: "with a mask", k: ["기도에 튜브가 들어가 있고 인공호흡 중", "기도가 부어서 삽관 준비 중"], a: "secure", o: ["blocked", "swollen", "narrow"]}
  - {t: "계획 보고", i: calendar, w: "next scan in an hour처럼 다음 계획을 시각과 함께 붙이면 인계받는 사람이 해야 할 일이 보여요. 안쪽 출혈은 겉으로 안 보여 경과를 보며 영상으로 다시 확인해요.", d: "in the morning", k: ["수술 일정 한 시간 후, 금식 유지", "재검사 한 시간 후, 소변량 기록"], a: "scan", o: ["dose", "visit", "shift"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "다발외상 인계 4문장 순서"
    why: "기전을 먼저 말하고, 그에 따른 골절을 보고하고, 그 출혈에 쓴 혈액과 혈압을 말하고, 혈압이 안정돼도 내부출혈을 지켜본다고 닫아요. 'from that'·'for that'·'the BP stabilizing'이 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "MVC at highway speed, unrestrained driver.", icon: siren, ko: "고속도로 속도 자동차 사고, 안전벨트 미착용 운전자", note: "기전"}
    - {en: "Pelvic and femur fractures from that, binder in place.", icon: bandage, ko: "그로 인한 골반과 대퇴골 골절, 바인더 적용", note: "손상"}
    - {en: "Two units of blood given for that, BP now stabilizing.", icon: lab, ko: "그 때문에 혈액 두 팩 투여, 현재 혈압 안정되는 중", note: "치료"}
    - {en: "Even with the BP stabilizing, watching for internal bleeding—next scan in an hour.", icon: calendar, ko: "혈압이 안정돼도 내부출혈 관찰 중—다음 스캔은 한 시간 후", note: "계획"}
  ctx: {word: "highway", ko: "고속도로"}
- title: "수술실 즉시 이송 조율"
  s:
  - {t: "상황 설명", i: scalpel, w: "that needs surgery now로 지금 필요한 처치를 한 문장에 담아 보호자가 다음 단계를 바로 이해해요. 안쪽 출혈이 계속되면 약이나 수액만으로 멈출 수 없어서 수술로 멈춰야 해요.", d: "in the morning", k: ["골절 수술은 내일 해요", "검사 결과를 지금 기다리고 있어요"], a: "surgery", o: ["medicine", "scans", "rest"]}
  - {t: "이송 안내", i: hospital, w: "straight to로 중간에 다른 곳을 거치지 않는다고 알려서 지체가 없다는 느낌을 줘요. 수술이 필요한 출혈은 영상 검사 같은 중간 단계를 건너뛰고 바로 수술실로 가기도 해요.", d: "by the stairs", k: ["중환자실로 옮겨 관찰할 거예요", "CT실로 먼저 옮길 거예요"], a: "straight", o: ["slowly", "later", "back"]}
  - {t: "동의 요청", i: pencil, w: "I need your consent로 필요한 것이 동의라고 분명히 말해요. 환자가 직접 동의할 수 없는 응급에서는 가족의 동의를 구하고, 구할 시간이 없으면 응급 예외로 진행하기도 해요.", d: "for the form", k: ["동의서 서명 전에 약을 드릴게요", "동의서를 읽어 드릴 통역사를 부를게요"], a: "consent", o: ["insurance", "address", "phone"]}
  - {t: "공감", i: faceWorried, w: "I know로 보호자가 느끼는 속도감을 먼저 인정하고 but으로 서두르는 이유를 설명해요. 출혈이 계속되는 동안은 수술이 늦어질수록 더 많은 피를 잃어요.", d: "for you", k: ["수술 설명서는 이따가 드릴게요", "수술 팀 인사는 이따가 할게요"], a: "matters", o: ["waits", "ends", "stops"]}
  - {t: "소식 약속", i: bell, w: "as soon as he's out of surgery로 시각 대신 기준 시점을 말해서 수술이 길어져도 약속을 지킬 수 있어요. 수술 중에는 보호자가 대기실에서 기다리도록 안내해요.", d: "in an hour", k: ["수술이 끝나면 담당 의사가 먼저 전화할 거예요", "수술 중에 경과를 알려 드릴게요"], a: "update", o: ["warn", "thank", "visit"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수술실 이송 조율 4문장 순서"
    why: "수술이 필요하다고 알리고, 그래서 수술실로 바로 간다고 하고, 그러기 위해 동의를 구하고, 동의하면 수술 후에 알리겠다고 닫아요. 'Because of that'·'To do that'·'Once you've agreed'가 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "He has internal bleeding that needs surgery now.", icon: scalpel, ko: "내부출혈이 있어서 지금 수술이 필요해요", note: "설명"}
    - {en: "Because of that, we're taking him straight to the operating room.", icon: hospital, ko: "그래서 바로 수술실로 데려갈 거예요", note: "이송"}
    - {en: "To do that, I need your consent to proceed immediately.", icon: pencil, ko: "그러려면 즉시 진행할 동의가 필요해요", note: "동의"}
    - {en: "Once you've agreed, I'll come back and update you when he's out of surgery.", icon: bell, ko: "동의해 주시면 수술이 끝나는 대로 와서 알려 드릴게요", note: "약속"}
  ctx: {word: "stat", ko: "즉시(지금 당장)"}
  sw: {ko: "지금 바로 출혈을 멈추는 수술이 필요해요"}
- title: "기도 화상·안면외상 기도위기"
  s:
  - {t: "증상 문진", i: me, w: "getting harder라는 변화를 묻는 표현이라 점점 나빠지는지 한 번에 알 수 있어요. 기도 화상이나 안면 외상에서 점점 심해지는 호흡·삼킴 곤란은 기도가 붓는 신호예요.", d: "at night", k: ["목이 건조한지 말씀해 주세요", "목소리가 쉬었는지 말씀해 주세요"], a: "swallow", o: ["cough", "speak", "sleep"]}
  - {t: "이유 설명", i: shield, w: "may swell로 가능성을 말하고 so로 대응을 잇는 구조라 겁주지 않으면서 이유를 설명해요. 기도 화상은 시간이 지나며 붓기가 심해져 나중에는 관을 넣기 어려워서 일찍 확보해요.", d: "very late", k: ["기도에 가래가 차서 빼내고 있어요", "기도가 부어서 약을 먹으면 안 돼요"], a: "early", o: ["late", "slowly", "gently"]}
  - {t: "시술 준비", i: gear, w: "preparing to로 아직 넣기 전이라는 단계를 정확히 알려 환자가 놀라지 않아요. 기도가 완전히 막히기 전에 호흡관을 넣어야 더 안전하게 넣을 수 있어요.", d: "in the room", k: ["산소마스크를 씌울 준비를 하고 있어요", "수액을 연결할 준비를 하고 있어요"], a: "breathing tube", o: ["feeding tube", "chest tube", "urine catheter"]}
  - {t: "증상 알림", i: bell, w: "right away로 기다리지 말고 즉시 알리라고 못 박아요. 목이 조이는 느낌은 기도가 좁아지는 신호일 수 있어 바로 알려야 해요.", d: "after dinner", k: ["어지러우면 바로 말씀해 주세요", "숨이 차면 손을 들어 주세요"], a: "throat", o: ["tongue", "face", "jaw"]}
  - {t: "동시 확인", i: magnify, w: "together로 얼굴과 기도를 따로 보는 것이 아니라 한 번에 본다고 말해 시간이 짧다는 걸 전해요. 얼굴 화상이나 외상은 기도 손상과 함께 오는 경우가 많아서 같이 살펴요.", d: "in the dark", k: ["얼굴 사진을 찍어서 기록하고 있어요", "얼굴에 연고를 바르고 있어요"], a: "face", o: ["neck", "chest", "hands"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "기도 위기 대응 4문장 순서"
    why: "숨쉬기가 힘들어지는지 묻고, 그게 기도가 붓는 뜻일 수 있어 일찍 확보한다고 하고, 그러기 위해 호흡관을 준비하고, 그 전까지 목이 막히는 느낌을 알려 달라고 합니다. 'That'·'To do that'·'Until then'이 앞 줄에 기대어 순서가 하나예요."
    lines:
    - {en: "Is it getting harder to breathe or swallow?", icon: me, ko: "숨쉬거나 삼키기가 점점 더 힘드세요?", note: "문진"}
    - {en: "That could mean your airway is swelling, so we're securing it early.", icon: shield, ko: "기도가 붓는 중일 수 있어서 미리 확보하고 있어요", note: "이유"}
    - {en: "To do that, we're preparing to place a breathing tube now.", icon: gear, ko: "그러려고 지금 호흡관을 넣을 준비를 하고 있어요", note: "준비"}
    - {en: "Until then, tell me right away if your throat feels like it's swelling shut.", icon: bell, ko: "그때까지 목이 부어서 막히는 느낌이면 바로 말씀해 주세요", note: "요청"}
  ctx: {word: "intubate", ko: "기관삽관하다"}
