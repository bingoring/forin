- title: 정맥류 대량 토혈 기도위험
  s:
  - t: 체위 안내
    i: shield
    w: turning you on your side로 지금 하는 동작을 먼저 말한 뒤 to protect your airway로 이유를 붙여요. 토혈 중에는 옆으로 누우면 피나 토물이 기도로 넘어가는 것을 막을 수 있어요.
    d: on your back
    k: [숨을 편하게 쉬도록 침대를 올릴게요, 토할 수 있게 그릇을 대 드릴게요]
    a: protect
    o: [block, close, hide]
  - t: 흡인 준비
    i: gear
    w: is ready로 아직 쓰지 않았어도 이미 준비되어 있다고 알려 환자가 안심해요. 흡인기는 입안에 고인 피를 바로 빨아내 기도를 확보하는 데 쓰여요.
    d: for later
    k: [산소 마스크가 준비됐어요, 수액이 준비됐어요]
    a: ready
    o: [broken, empty, loud]
  - t: 시술 예고
    i: bell
    w: may need로 필요할 수도 있다는 가능성만 말해 겁주지 않아요. special tube는 정확한 이름을 대지 않고도 무엇이 올지 미리 알려 주는 쉬운 말이에요.
    d: next week
    k: [입으로 관을 넣어 영양을 드릴게요, 코로 관을 넣어 산소를 드릴게요]
    a: control
    o: [cause, hide, create]
  - t: 상태 알림
    i: cross
    w: bringing up은 vomit보다 부드러운 구어체 구동사예요. a lot of blood very quickly처럼 사실은 분명히 말하되 환자를 탓하거나 겁주지 않고 지금 상황만 담담히 전해요.
    d: last night
    k: [지금 토한 것을 담아 둘게요, 지금 토한 양을 재고 있어요]
    a: bringing
    o: [keeping, holding, drinking]
  - t: 흡인 안내
    i: gear
    w: We're going to로 곧 할 일을 미리 알려 환자가 놀라지 않게 해요. 입을 흡인하면 입안에 고인 피를 빼서 숨 쉬는 길이 열려요.
    d: from the side
    k: [입안에 물을 조금 넣어 드릴게요, 입을 크게 벌려 보세요]
    a: help
    o: [stop, force, teach]
  - t: 작동 설명
    i: bandage
    w: press on …으로 관이 어떻게 출혈을 멈추는지 누른다는 쉬운 동사로 설명해요. 식도 정맥류 출혈에서 풍선이 혈관을 눌러 일시적으로 지혈하는 것을 환자의 말로 풀어요.
    d: from above
    k: [이 관으로 영양을 넣을 거예요, 이 관으로 피를 빼낼 거예요]
    a: press
    o: [cut, burn, drain]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 대량 토혈 응급 설명 4문장 순서
    why: 자세로 기도를 지키고, 흡인 준비를 알리고, 관이 필요할 수 있다고 예고하고, 그 관이 하는 일을 설명해요. 'it'·'On top of that'·'That tube'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: We're turning you on your side to protect your airway., icon: shield, ko: 기도를 보호하려고 옆으로 돌려드릴게요, note: 체위}
    - {en: 'Suction is ready, so we can keep it clear.', icon: gear, ko: 흡인 준비가 돼서 기도를 깨끗하게 유지할 수 있어요, note: 흡인}
    - {en: 'On top of that, we may need a special tube to control the bleeding.', icon: bell, ko: 그에 더해 출혈을 조절할 특수한 관이 필요할 수도 있어요, note: 예고}
    - {en: That tube will press on the bleeding vessel to stop it., icon: bandage, ko: 그 관이 출혈 혈관을 눌러서 멈추게 할 거예요, note: 설명}
  sw: {ko: 출혈을 조절하기 위해 특수한 관이 필요할 수도 있어요}
- title: 응고병증 동반 출혈
  s:
  - t: 병력 문진
    i: board
    w: known disorder로 진단받은 병이 있는지 먼저 물어요. bleeding or clotting을 함께 줘 피가 잘 안 멎는 병과 피가 잘 엉기는 병을 둘 다 가려요.
    d: at work
    k: ['가족 중에 출혈 질환이 있으세요?', '피가 잘 안 멎는 걸 느끼신 적 있나요?']
    a: bleeding
    o: [breathing, sleeping, eating]
  - t: 혈액 제제
    i: bandage
    w: to help you clot으로 약이 아니라 몸이 피를 엉기게 돕는 일이라고 설명해요. 혈소판은 피를 엉기게 하는 세포이고 혈장에는 응고인자가 들어 있어요.
    d: right now
    k: [혈액형 검사를 다시 할게요, 혈소판과 혈장 둘 다 검사실에 확인할게요]
    a: platelets
    o: [antibiotics, vitamins, oxygen]
  - t: 보고 안내
    i: speech
    w: I'm giving the team …now로 지금 하는 일을 알리면 환자가 간호사가 왜 바쁜지 이해해요. SBAR은 상황·배경·평가·권고 순으로 짧게 전하는 보고 틀이에요.
    d: last week
    k: [지금 검사실에 직접 전화할게요, 지금 환자분 가족께 보고할게요]
    a: labs
    o: [x-rays, meals, visitors]
  - t: 출혈 지속
    i: cross
    w: still로 아까부터 계속인지를, same spot으로 한 곳에서인지 여러 곳인지를 가려 물어요. 한 곳에서만 나면 국소 문제, 여러 곳이면 응고 문제를 의심하는 단서예요.
    d: since lunch
    k: ['다른 곳에서도 피가 나나요?', '피가 나는 곳을 눌러 보셨나요?']
    a: still
    o: [never, ever, hardly]
  - t: 상태 설명
    i: lab
    w: isn't clotting the way it should로 응고가 안 된다는 사실을 환자의 말로 풀어요. 피가 나는 곳이 아물지 않아서가 아니라 피 자체가 잘 엉기지 않아서라는 점을 알려 줘요.
    d: for you
    k: [지금 혈액 검사 결과가 나왔어요, 지금 혈액이 부족해지고 있어요]
    a: should
    o: [could, would, might]
  - t: 보고 필요
    i: bell
    w: as soon as possible로 서두르는 정도를 분명히 해요. 검사 결과가 나오면 치료를 정하는 의사가 가장 먼저 알아야 해서 간호사가 전달을 맡아요.
    d: tomorrow
    k: [검사실에는 제가 직접 다녀올게요, 가족분께는 의사 선생님이 연락하실 거예요]
    a: labs
    o: [x-rays, vitals, meds]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 응고병증 출혈 설명 4문장 순서
    why: 병력을 먼저 묻고, 답과 관계없이 출혈이 계속되는지 묻고, 검사로 본 상태를 알린 뒤, 그 결과에 맞는 치료를 알려요. 'Either way'·'Your labs show'·'that result'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: 'Do you have a known bleeding or clotting disorder?', icon: board, ko: '알려진 출혈이나 응고 장애가 있으세요?', note: 병력}
    - {en: 'Either way, are you still bleeding from the same spot?', icon: cross, ko: '어느 쪽이든 여전히 같은 부위에서 피가 나나요?', note: 출혈}
    - {en: Your labs show your blood isn't clotting the way it should., icon: lab, ko: 검사에서 혈액이 제대로 응고되지 않고 있어요, note: 상태}
    - {en: 'Because of that result, we''re ordering platelets and plasma to help you clot.', icon: bandage, ko: 그 결과 때문에 응고를 돕는 혈소판과 혈장을 처방할게요, note: 치료}
  sw: {ko: 응고를 돕기 위해 혈소판과 혈장을 처방할게요}
- title: 내시경 중 급속악화
  s:
  - t: 상태 알림
    i: monitor
    w: Your vitals are dropping, so …로 이유를 먼저 말하고 결정을 알려요. 시술 중 활력징후가 떨어지면 시술을 멈추고 원인을 먼저 찾는 것이 안전해요.
    d: slowly
    k: [활력징후를 보면서 마취를 조금 더 할게요, 활력징후를 의사 선생님께 직접 보여 드릴게요]
    a: pausing
    o: [starting, finishing, repeating]
  - t: 조치 안내
    i: siren
    w: giving … and calling …으로 지금 하는 두 가지를 한 문장에 담아요. 수액과 추가 인력은 급속히 나빠지는 환자에게 동시에 투입하는 기본 대응이에요.
    d: in the hall
    k: [산소를 올리고 가족을 부를게요, 약을 바꾸고 침대를 낮출게요]
    a: fluids
    o: [ice, stitches, bandages]
  - t: 곁에 있기
    i: handshake2
    w: Stay with me — we're right here에서 환자에게 요청과 약속을 한 호흡에 줘요. 위급할 때는 짧고 분명한 말이 전달되고, 곁에 있다는 말이 환자의 불안을 줄여요.
    d: in the hall
    k: [심호흡을 해 보세요, 손을 이쪽으로 주세요]
    a: Stay
    o: [Leave, Hide, Run]
  - t: 상태 알림
    i: monitor
    w: oxygen level은 sats·SpO2 대신 환자도 아는 말이에요. falling quickly right now로 지금 빠르게 떨어진다는 사실을 숨기지 않고 알려 환자가 곧 있을 조치를 이해해요.
    d: slowly
    k: [산소 수치를 다시 재 볼게요, 산소 수치는 의사 선생님께 알릴게요]
    a: falling
    o: [rising, climbing, jumping]
  - t: 안심 설명
    i: shield
    w: to keep you safe로 시술을 멈추는 이유를 환자의 안전으로 밝혀요. 환자가 시술이 실패했다고 오해하지 않도록 중단이 보호를 위한 결정이라고 말해 줘요.
    d: for good
    k: [마취를 더 하려고 잠깐 기다려 주세요, 보호자분을 모셔 오려고 문을 열게요]
    a: stopping
    o: [starting, continuing, extending]
  - t: 도움 안내
    i: siren
    w: More help …로 누가 오는지가 아니라 도움이 늘어난다는 사실만 말해 환자가 혼자가 아니라고 느끼게 해요. right now로 곧바로 오고 있다는 점을 강조해요.
    d: from home
    k: [보호자분이 방으로 들어오고 있어요, 마취과 선생님께 전화하고 있어요]
    a: coming
    o: [leaving, staying, hiding]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 내시경 중 악화 응대 4문장 순서
    why: 상태를 알리고 시술을 멈춘다고 말한 뒤, 되돌리려는 조치를 알리고, 오는 도움을 알리고, 그 도움이 들어올 때 곁에 있겠다고 닫아요. 'that'·'That help'·'they'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: 'Your vitals are dropping, so we''re pausing the procedure.', icon: monitor, ko: 활력징후가 떨어져서 시술을 잠시 멈출게요, note: 상태}
    - {en: 'To turn that around, we''re giving you fluids and calling for extra help.', icon: siren, ko: 그걸 되돌리려고 수액을 드리고 추가 도움을 요청할게요, note: 조치}
    - {en: That help is coming into the room right now., icon: siren, ko: 그 도움이 지금 병실로 오고 있어요, note: 도움}
    - {en: 'Keep your eyes on me as they come in, and tell me how you feel.', icon: handshake2, ko: 그분들이 들어오는 동안 저를 보시고 느낌을 말씀해 주세요, note: 곁에}
  sw: {ko: 산소 수치가 지금 빠르게 떨어지고 있어요}
- title: 하부출혈 지속 색전술 이송
  s:
  - t: 이송 안내
    i: hospital
    w: hasn't stopped, so로 이유를 먼저 말하고 결정을 알려요. 약과 내시경으로 멎지 않는 출혈은 혈관을 직접 막는 시술이 필요할 수 있어요.
    d: to the lab
    k: ['약을 한 번 더 드려 볼게요, 지켜보세요', 가족분께 연락해 상황을 알려 드릴게요]
    a: stopped
    o: [started, returned, begun]
  - t: 시술 설명
    i: scalpel
    w: block the bleeding vessel을 쉬운 동사로 말해 시술이 하는 일을 한 가지로 줄여요. through a small catheter로 수술이 아니라 가는 관으로 하는 시술임을 알려 줘요.
    d: from outside
    k: [큰 수술로 혈관을 꿰맬 거예요, 내시경으로 출혈 부위를 태울 거예요]
    a: block
    o: [open, widen, stretch]
  - t: 인계 안내
    i: speech
    w: hand off all your information은 환자의 정보를 빠짐없이 다음 팀에 넘기는 일이라는 것을 말해요. 이송 때 병력·알레르기·투약을 잃지 않고 전하는 것이 안전의 핵심이에요.
    d: by phone
    k: [환자분 짐은 병실에 두고 갈게요, 환자분 정보는 가족분께 먼저 드릴게요]
    a: next
    o: [previous, same, old]
  - t: 목적 설명
    i: magnify
    w: find and stop으로 시술이 두 가지를 순서대로 한다고 알려요. 피가 나는 혈관을 찾아서 막는 것이라 환자가 왜 하는 시술인지 이해해요.
    d: in the room
    k: [배 속 염증을 가라앉히는 약을 쓸 거예요, 시술 뒤에는 한동안 누워 계셔야 해요]
    a: find
    o: [hide, create, protect]
  - t: 이동 안내
    i: hospital
    w: You'll be moved로 환자가 주어인 수동태를 써서 이동은 팀이 맡는다고 알려요. 시술은 전용 장비가 있는 곳에서 하는 경우가 많아서 장소가 바뀐다고 미리 말해요.
    d: by yourself
    k: [이 시술에는 금식이 필요해요, 이 시술은 마취과 선생님이 도와요]
    a: different
    o: [sunny, cozy, tiny]
  - t: 정보 전달
    i: speech
    w: will know로 환자 대신 팀이 미리 알고 있다고 말해 같은 이야기를 반복하지 않아도 된다고 안심시켜요. 인계는 병력과 현재 상태를 함께 전하는 것이라 둘을 나란히 말해요.
    d: by phone
    k: [가족분께는 담당 간호사가 연락할 거예요, 새 처방은 그 팀이 받아 올 거예요]
    a: know
    o: [lose, forget, hide]
  order:
    tag: 대화 흐름
    icon: compass
    ko: 색전술 이송 설명 4문장 순서
    why: 전문의에게 보낸다고 알리고, 그 전문의가 하는 일을 설명하고, 이동을 알리고, 그 방에서 팀이 이미 정보를 안다고 닫아요. 'They'·'that procedure'·'that room'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - {en: 'The bleeding hasn''t stopped, so we''re sending you to a specialist.', icon: hospital, ko: 출혈이 멈추지 않아서 전문의에게 보내드릴게요, note: 이송}
    - {en: They'll block the bleeding vessel through a small catheter., icon: scalpel, ko: 그분들이 작은 카테터로 출혈 혈관을 막을 거예요, note: 시술}
    - {en: You'll be moved to a different room for that procedure., icon: hospital, ko: 그 시술을 위해 다른 방으로 옮겨질 거예요, note: 이동}
    - {en: 'In that room, that team will already know your full history and current condition.', icon: speech, ko: 그 방에서는 그 팀이 이미 전체 병력과 현재 상태를 알고 있을 거예요, note: 인계}
  sw: {ko: 출혈이 멈추지 않아서 전문의에게 보내드릴게요}
- title: 재출혈 급변 야간 SBAR
  s:
  - t: 경과 문진
    i: compass
    w: compare to earlier tonight으로 처음과 지금을 견주게 하면 환자가 변화를 말하기 쉬워요. 재출혈은 이전 출혈과 양·색이 어떻게 달라졌는지가 판단의 단서예요.
    d: last year
    k: ['처음 피가 난 게 언제였나요?', '낮에는 피가 얼마나 있었나요?']
    a: bleeding
    o: [pain, nausea, dizziness]
  - t: 호출 안내
    i: bell
    w: have changed, so …로 변화를 이유로 들어 호출을 알려요. 활력징후가 달라졌다는 사실을 숨기지 않으면서 지금 의사를 부르는 행동을 함께 말해 안심시켜요.
    d: from home
    k: [활력징후를 방금 다시 쟀어요, 활력징후를 차트에 적어 둘게요]
    a: doctor
    o: [pharmacist, manager, chaplain]
  - t: 보고 안내
    i: speech
    w: situation, background, and vitals는 SBAR의 앞부분을 환자도 아는 말로 풀어 쓴 거예요. 순서대로 짧게 말하는 보고 틀이라 의사가 한 번에 상황을 파악해요.
    d: tonight
    k: [환자분 이름과 생년월일을 확인할게요, 환자분 상황을 차트에 먼저 적을게요]
    a: clearly
    o: [slowly, badly, quietly]
  - t: 색 비교
    i: magnify
    w: darker or lighter than before로 두 방향을 열어 주면 환자가 변화를 비교해 말하기 쉬워요. 검은색은 오래된 피나 위쪽 출혈, 선홍색은 새로 나는 피일 수 있어요.
    d: in the toilet
    k: ['피가 아까보다 더 많은가요?', '피가 덩어리로 나오나요?']
    a: blood
    o: [urine, vomit, stool]
  - t: 관찰 안내
    i: monitor
    w: tonight으로 지켜보는 기간을 밤으로 짚어 밤새 지켜본다는 점을 알려요. closely는 감시보다 돌봄으로 들리는 말이라 불안한 환자에게 안정감을 줘요.
    d: at home
    k: [오늘 밤 소변량을 같이 재 볼게요, 오늘 밤 침대 알람을 켜 둘게요]
    a: closely
    o: [rarely, barely, vaguely]
  - t: 즉시 보고
    i: bell
    w: needs to hear로 의사가 직접 듣는다는 점과 right away로 지금 바로라는 점을 분명히 해요. 재출혈에서 활력징후나 출혈 양상이 바뀌면 기다리지 않고 바로 의사에게 알리는 것이 원칙이에요.
    d: next week
    k: [가족분께도 이 변화를 곧 전해 드릴게요, 차트에는 이 변화를 시간과 함께 적어 둘게요]
    a: doctor
    o: [family, chaplain, visitor]
  order:
