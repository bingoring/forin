situations:
- title: 무반응 환자 초기 인지
  sentences:
  - en: Sir, can you hear me? Open your eyes!
    ko: 환자분, 제 목소리 들리세요? 눈 떠보세요!
    chunks:
    - Sir,
    - can you hear me
    - '?'
    - Open your eyes
    - '!'
    words:
    - w-hear
    - w-open
    - w-eye
    goal: 1
  - en: He's not responding — checking for breathing and a pulse.
    ko: 반응이 없어요 — 호흡과 맥박을 확인하고 있어요.
    chunks:
    - He's not responding
    - — checking
    - for breathing
    - and a pulse
    - .
    words:
    - w-respond
    - w-breath
    - w-pulse
    goal: 1
  - en: No pulse — I'm calling a code and starting compressions.
    ko: 맥박이 없어요 — 코드를 부르고 압박을 시작할게요.
    chunks:
    - No pulse
    - — I'm calling
    - a code
    - and starting compressions
    - .
    words:
    - w-pulse
    - w-call
    - w-code
    - w-start
    - w-compression
    goal: 2
  - en: Check for breathing and a pulse for ten seconds.
    ko: 10초 동안 호흡과 맥박을 확인해 주세요.
    chunks:
    - Check
    - for breathing
    - and a pulse
    - for ten seconds
    - .
    words:
    - w-breath
    - w-pulse
    - w-second
    goal: 1
  - en: This is a cardiac arrest — call the code now.
    ko: 심정지예요 — 지금 코드를 불러 주세요.
    chunks:
    - This is
    - a cardiac arrest
    - — call the code
    - now
    - .
    words:
    - w-arrest
    - w-call
    - w-code
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-respond
    cue: 'Colleague: "He groans when I rub his sternum, but his eyes stay closed when I call him."'
    scale:
    - alert
    - responds to voice
    - responds to pain
    - unresponsive
    answerAt: 2
    why: AVPU 순서예요. 불러도 눈을 안 뜨는데 흉골을 문지르면 신음한다면 responds to pain(통증에만 반응) 단계예요. 아무 자극에도 반응이 없으면 unresponsive이고, 그때 바로 호흡과 맥박을 봐요.
    example: He only responds to pain.
    exKo: 통증 자극에만 반응해요.
  - kind: context
    words:
    - w-code
    - w-call
    scenes:
    - who: 동료에게
      icon: speech
      en: No pulse — call a code now!
      ok: true
    - who: 병원 방송 요청
      icon: siren
      en: Code Blue, ER hallway bed three.
      ok: true
    - who: 옆에 있던 보호자에게
      icon: me
      en: We're calling a code on him.
      ok: false
      fix: His heart has stopped. Our team is starting CPR right now.
    why: code는 병원 안에서 쓰는 호출 이름이라 의료진끼리는 가장 빠른 말이에요. 보호자는 뜻을 모를 수 있으니, 무슨 일이 일어났고 무엇을 하는지를 쉬운 말로 알려요.
- title: 응급코드 호출·역할 배정
  sentences:
  - en: I need you on compressions — start now.
    ko: 당신은 압박을 맡아 주세요 — 지금 시작하세요.
