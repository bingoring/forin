- title: 관절 탈구 정복 준비
  s:
  - {t: "진정 안내", i: pill, w: "before putting it back으로 순서를 말해 줘요. 약이 먼저고 맞추는 것은 그다음이에요. 근육이 풀려야 어긋난 관절이 더 수월하게 들어가요.", d: "after you eat", k: ["어깨에 얼음을 대 드릴게요", "엑스레이를 한 장 더 찍을게요"], a: "relax", o: ["walk", "laugh", "chew"]}
  - {t: "재확인 안내", i: stetho, w: "After we reset it으로 시점을 먼저 말해 주면, 맞춘 뒤에 맥박과 감각을 또 보는 것이 순서의 일부라고 알아요. 정복 뒤에는 신경과 혈관이 괜찮은지 다시 확인해요.", d: "before the x-ray", k: ["팔을 쓰지 말고 가만히 계세요", "정복 전에 맥박을 확인했어요"], a: "pulse", o: ["weight", "height", "grip"]}
  - {t: "협조 요청", i: me, w: "Try to로 부탁하고 뒤에 이유를 붙여, 힘을 빼라는 말이 잔소리가 아니라 도움이 되는 말로 들려요. 근육에 힘이 들어가면 관절이 제자리로 들어가기 어려워요.", d: "while we count", k: ["이 약은 졸릴 수 있어요", "어깨를 돌리지 마세요"], a: "tensing", o: ["relaxing", "breathing", "waiting"]}
  - {t: "진행 안내", i: compass, w: "should는 확신하는 기대를 말해요. in a moment로 곧 끝난다고 알리면 긴장한 환자가 마음의 준비를 해요.", d: "on its own", k: ["어깨를 위로 들어 보세요", "지금 약이 들어가고 있어요"], a: "slide", o: ["jump", "drip", "float"]}
  - {t: "기억 안내", i: bell, w: "won't remember로 진정 중에는 그 순간이 기억나지 않을 수 있다고 미리 알려 줘요. 환자가 걱정을 덜고 진정에 들어가도록 돕는 말이에요.", d: "after the x-ray", k: ["어깨가 많이 부어 있어요", "다시 맞출 때 아플 수 있어요"], a: "remember", o: ["enjoy", "ignore", "describe"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "탈구 정복 준비 4문장 순서"
    why: "약을 먼저 준다고 알리고, 'it works'로 약이 듣는 동안 긴장을 풀게 하고, 'With that'으로 어깨가 들어가는 것을, 'Afterward'로 맥박·감각 재확인을 말해요. 'it works'·'With that'·'Afterward'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We'll give you medicine first so you can relax.", icon: pill, ko: "먼저 긴장을 풀어드릴 약을 드릴게요", note: "약"}
    - {en: "Try to stay as relaxed as you can while it works.", icon: me, ko: "약이 듣는 동안 최대한 편안하게 계세요", note: "협조"}
    - {en: "With that, your shoulder should slide back into place.", icon: compass, ko: "그러면 어깨가 제자리로 들어갈 거예요", note: "정복"}
    - {en: "Afterward, I'll recheck your pulse and feeling in that arm.", icon: stetho, ko: "끝난 뒤 그 팔의 맥박과 감각을 다시 확인할게요", note: "재확인"}
  sw: null
- title: 고관절 골절 고령
  s:
  - {t: "통증 관리", i: pill, w: "while you wait for surgery로 수술을 기다리는 시간에도 통증을 관리한다고 약속해요. 고관절 골절은 많이 아프고 수술 전 대기가 있을 수 있어서 환자와 가족이 먼저 궁금해하는 부분이에요.", d: "at home", k: ["수술은 내일 아침이에요", "지금은 금식 중이에요"], a: "manage", o: ["ignore", "delay", "hide"]}
  - {t: "지남력 확인", i: compass, w: "where you are and what day it is로 장소와 요일을 물어 정신이 또렷한지 가볍게 확인해요. 고령 환자는 낙상이나 입원 뒤 갑자기 혼란스러워질 수 있어서 처음에 기준을 잡아 둬요.", d: "in this room", k: ["성함과 생년월일을 말씀해 주세요", "지금 가장 아픈 곳이 어디예요?"], a: "where", o: ["why", "how", "when"]}
  - {t: "안심 시키기", i: shield, w: "keep you oriented and comfortable로 환자가 해야 할 일이 아니라 간호사가 해 줄 일을 주어로 말해요. 고령 환자는 낯선 병원 환경에서 혼란스러워질 수 있어서 시간과 장소를 알려 주고 편하게 해 드려요.", d: "next week", k: ["보호자분께 전화해 드릴게요", "저녁은 금식이에요"], a: "oriented", o: ["busy", "bored", "excited"]}
  - {t: "활동 제한", i: lock, w: "Your hip is broken이라는 사실을 먼저 말하고 so로 서지 못하게 하는 이유를 이어요. 이유 없이 서지 말라고 하면 고령 환자가 일어나려 할 수 있어서 이유를 같이 말해요.", d: "without help", k: ["엉덩이에 얼음을 대 드릴게요", "누워서 다리를 곧게 펴 보세요"], a: "stand", o: ["kneel", "jump", "dance"]}
  - {t: "자주 확인", i: bell, w: "checking on you often으로 혼자 두지 않겠다는 약속을 해요. 낯선 병원에서 아픈 고령 환자는 불안하기 쉬워서 확인 주기를 알려 주는 것만으로도 안심이 돼요.", d: "all night", k: ["수술 전에 금식해 주세요", "가족분께 연락드릴게요"], a: "often", o: ["rarely", "seldom", "barely"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "고관절 골절 고령 환자 4문장 순서"
    why: "골절이라는 사실을 먼저 말하고, 'Because of that'으로 서지 못하는 이유를, 'With that in mind'로 통증 관리와 자주 확인을, 'Last'로 밤새 혼란을 막는 말을 이어요. 앞 줄을 가리키는 말과 'First'·'Last'가 위치를 정해서 순서가 하나예요."
    lines:
    - {en: "First, let me tell you what we found: your hip is broken.", icon: board, ko: "먼저 확인한 걸 말씀드릴게요, 고관절이 부러졌어요", note: "상태"}
    - {en: "Because of that, we can't let you stand on it.", icon: lock, ko: "그래서 그 다리로 서게 할 수는 없어요", note: "이유"}
    - {en: "With that in mind, we'll manage your pain and check on you often.", icon: pill, ko: "그걸 감안해서 통증을 관리하고 자주 살펴볼게요", note: "관리"}
    - {en: "Last, we'll keep you oriented tonight, so tell me if you feel confused.", icon: shield, ko: "마지막으로 오늘 밤 혼란스럽지 않게 도울게요, 혼란스러우면 말씀해 주세요", note: "안심"}
  sw: {ko: "지금 어디 계신지 말씀해 주시겠어요?"}
- title: 손가락 절단 이송
  s:
  - {t: "보존 안내", i: bandage, w: "cool and moist로 차갑고 촉촉하게 보관한다고 말해, 손가락이 어떻게 다뤄지는지 환자가 알 수 있어요. 절단된 부분은 마르지 않도록 젖은 거즈로 싸서 차게 보관해요.", d: "with a towel", k: ["손가락에 압박 붕대를 감고 있어요", "전문의가 곧 도착해요"], a: "moist", o: ["dry", "hot", "dusty"]}
  - {t: "재접합 설명", i: scalpel, w: "may be able to로 가능성만 말하고 약속하지 않아요. 재접합이 가능한지는 전문의가 절단 상태를 보고 판단해서 간호사가 단정하지 않아요.", d: "this afternoon", k: ["이송은 구급차로 할 거예요", "출혈은 지금 조절 중이에요"], a: "reattach", o: ["wash", "measure", "photograph"]}
  - {t: "출혈 조절", i: bandage, w: "while we prepare transfer로 이송 준비와 지혈이 함께 진행된다고 알려 줘요. 이송을 기다리는 사이에도 출혈 조절이 가장 먼저예요.", d: "after the call", k: ["손가락은 따로 보관할게요", "전문의에게 곧 전화할게요"], a: "control", o: ["ignore", "hide", "forget"]}
  - {t: "보관 주의", i: lock, w: "directly를 넣어 얼음에 직접 닿지 않게 하라는 점을 정확히 짚어요. 얼음에 바로 닿으면 조직이 얼어 상할 수 있어서 거즈나 비닐로 싸서 얼음 위에 둬요.", d: "in water", k: ["손가락은 젖은 거즈로 감싸 주세요", "손가락을 비닐봉지에 넣어 주세요"], a: "directly", o: ["gently", "quickly", "slowly"]}
  - {t: "이송 연락", i: speech, w: "now를 넣어 지금 연락 중이라는 사실을 알려 줘요. 절단 손상은 재접합할 수 있는 시간이 한정돼서 전문의 연락과 이송을 서둘러요.", d: "tomorrow morning", k: ["손가락은 얼음 위에 올려 둘게요", "보호자분께 연락드릴게요"], a: "calling", o: ["writing", "visiting", "thanking"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "손가락 절단 이송 4문장 순서"
    why: "전문의를 먼저 부르고, 'They'로 재접합을 위해 손가락을 차갑고 촉촉하게 보관한다고 이어, 'For that reason'으로 얼음에 직접 두지 않게 하고, 'Through all of this'로 출혈 조절을 이어 간다고 마무리해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "I'm calling the hand surgeon now to arrange the transfer.", icon: speech, ko: "이송을 준비하려고 지금 손 외과의에게 전화하고 있어요", note: "연락"}
    - {en: "They'll want the best chance to reattach it, so we'll keep the finger cool and moist.", icon: bandage, ko: "재접합 가능성을 높이려고 손가락을 시원하고 촉촉하게 보관할게요", note: "보관"}
    - {en: "For that reason, please don't put the finger directly on ice.", icon: lock, ko: "그래서 손가락을 얼음에 직접 닿게 하지 마세요", note: "주의"}
    - {en: "Through all of this, we'll keep controlling your bleeding.", icon: bandage, ko: "그러는 내내 출혈을 계속 조절할게요", note: "지혈"}
  sw: {ko: "손가락은 밀봉한 비닐봉지에 담아 얼음 위에 올려 주세요."}
- title: 항응고제 골절 혈종
  s:
  - {t: "이유 설명", i: pill, w: "Because로 이유를 앞에 두어 왜 붓기를 더 조심하는지 먼저 이해시켜요. 혈액 희석제를 먹으면 출혈이 잘 멎지 않아 같은 손상에도 붓기와 멍이 커질 수 있어요.", d: "last week", k: ["약 이름을 알려 주시겠어요?", "붓기에 얼음을 대 드릴게요"], a: "grow", o: ["shrink", "vanish", "freeze"]}
  - {t: "복용약 확인", i: pill, w: "두 질문을 and로 이어 약 이름과 마지막 복용 시각을 한 번에 물어요. 마지막 복용 시각은 약 효과가 얼마나 남았는지 가늠하는 기준이에요.", d: "for your heart", k: ["어제 피검사를 하셨나요?", "혈압약도 드시나요?"], a: "dose", o: ["refill", "visit", "test"]}
  - {t: "자주 확인", i: monitor, w: "often으로 확인이 잦다는 것을 알려 줘요. 혈액 희석제를 먹으면 팔다리 안에서 출혈이 늘어 조직이 팽팽해질 수 있어서 조임과 색을 자주 봐요.", d: "after dinner", k: ["약은 의사 선생님과 먼저 상의할게요", "팔을 심장보다 높이 올릴게요"], a: "tightness", o: ["dryness", "wetness", "noise"]}
  - {t: "소견 설명", i: faceWorried, w: "spreading과 very dark로 멍이 변하는 방향을 그대로 말해 줘요. 혈액 희석제를 먹는 환자에게 번지는 멍은 안쪽 출혈이 늘고 있다는 단서일 수 있어요.", d: "since you came in", k: ["의사 선생님께 멍을 보여 드릴게요", "멍 크기를 펜으로 표시해 둘게요"], a: "spreading", o: ["fading", "shrinking", "healing"]}
  - {t: "악화 보고", i: bell, w: "right away로 기다리지 말고 바로 알리라고 해요. 혈액 희석제를 먹는 환자는 출혈이 늘어 붓기와 통증이 빨리 심해질 수 있어서 바로 알려야 해요.", d: "in the morning", k: ["얼음은 천으로 싸서 대세요", "팔을 높이 올려 두세요"], a: "worse", o: ["milder", "fainter", "flatter"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항응고제 골절 4문장 순서"
    why: "복용 중인 약을 먼저 묻고, 'That'으로 그 약 때문에 붓기가 커질 수 있다고 이유를 말하고, 'For the same reason'으로 자주 확인하겠다고 하고, 'Between our checks'로 그 사이에 악화되면 알리라고 해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "You take a blood thinner, so I need to ask which one and when you last took it.", icon: pill, ko: "혈액 희석제를 드시니 어떤 약이고 마지막 복용이 언제인지 물어야 해요", note: "문진"}
    - {en: "That matters because the swelling can grow faster with it.", icon: bulb, ko: "그 약 때문에 붓기가 더 빨리 커질 수 있어서 중요해요", note: "이유"}
    - {en: "For the same reason, we'll check the limb often for tightness and color.", icon: monitor, ko: "같은 이유로 사지를 자주 확인해서 조임과 색을 볼게요", note: "확인"}
    - {en: "Between our checks, tell us right away if the pain or swelling gets worse.", icon: bell, ko: "확인하는 사이에도 통증이나 붓기가 심해지면 바로 알려 주세요", note: "보고"}
  sw: {ko: "혹시 혈액 희석제를 드시나요?"}
- title: 소아 성장판 손상
  s:
  - {t: "위치 설명", i: bulb, w: "so로 위치(growth plate 근처)와 지켜보는 이유를 이어요. 성장판은 뼈 끝에서 뼈가 자라는 부분이라 이곳을 다치면 성장에 영향을 줄 수 있어 경과를 살펴요.", d: "after the cast", k: ["엑스레이는 한 장 더 찍을 거예요", "깁스를 하고 갈 거예요"], a: "near", o: ["behind", "inside", "under"]}
  - {t: "경과 설명", i: calendar, w: "Most heal well로 안심을 주고 but으로 추적 관찰이 중요하다는 점을 이어요. 성장판 손상은 나중에 성장이 틀어지는지 확인해야 해서 외래 방문을 지키도록 말해요.", d: "next month", k: ["아이는 오늘 집에 갈 수 있어요", "깁스는 한 달 뒤에 풀어요"], a: "important", o: ["optional", "painful", "simple"]}
  - {t: "추적 계획", i: stetho, w: "over time으로 한 번이 아니라 시간을 두고 반복해서 본다고 알려 줘요. 정렬이 틀어지면 자라면서 모양이 변할 수 있어 간격을 두고 확인해요.", d: "this afternoon", k: ["엑스레이 결과를 보고 알려 드릴게요", "진통제는 약국에서 사세요"], a: "alignment", o: ["weight", "color", "temperature"]}
  - {t: "보호자 공감", i: faceWorried, w: "It's normal to worry로 걱정을 먼저 인정한 뒤 but으로 희망을 줘요. 공감이 먼저 나와야 뒤의 안심이 변명처럼 들리지 않아요.", d: "for your son", k: ["아이가 울어도 괜찮아요", "얼음찜질을 해 주세요"], a: "worry", o: ["smile", "guess", "argue"]}
  - {t: "검사 안내", i: monitor, w: "now와 at the follow-up visit으로 엑스레이를 찍는 시점을 둘로 나눠 말해, 경과를 보려고 한 번 더 찍는다는 것을 알려 줘요.", d: "at home", k: ["오늘 깁스를 풀 거예요", "약은 하루에 세 번 드세요"], a: "x-ray", o: ["ultrasound", "MRI", "exam"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "소아 성장판 손상 4문장 순서"
    why: "성장판 근처라는 설명으로 시작하고, '\"growth plate\"'를 가리켜 걱정을 인정하고 안심을 주고, 'watching it'으로 엑스레이 계획을 말한 뒤, 'that follow-up'으로 추적 관찰의 중요성을 마무리해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "This injury is near the growth plate, so we're going to watch it closely.", icon: bulb, ko: "이 손상이 성장판 근처라 자세히 지켜볼 거예요", note: "설명"}
    - {en: "Hearing \"growth plate\" can sound scary, but the plate often heals well.", icon: faceWorried, ko: "성장판이라는 말이 무섭게 들릴 수 있지만 대개 잘 나아요", note: "공감"}
    - {en: "Because we're watching it, we'll take an x-ray now and another one at the follow-up.", icon: monitor, ko: "지켜봐야 해서 지금 엑스레이를 찍고 추적 때 한 번 더 찍을 거예요", note: "계획"}
    - {en: "Most heal well, but that follow-up is important for growth.", icon: calendar, ko: "대부분 잘 낫지만 그 추적 방문이 성장에 중요해요", note: "당부"}
  sw: null
- title: 병적 골절 의심
  s:
  - {t: "소견 설명", i: bulb, w: "which is unusual로 앞 내용을 한 번 더 평가해서, 왜 추가 질문을 하는지 이유를 깔아 줘요. 약한 힘에 부러진 뼈는 뼈가 원래 약해져 있는지 살펴보게 해요.", d: "last week", k: ["어떻게 다치셨는지 말씀해 주세요", "엑스레이를 한 장 더 찍을게요"], a: "unusual", o: ["normal", "expected", "routine"]}
  - {t: "병력 확인", i: board, w: "any history of로 지금 병이 있는지뿐 아니라 과거까지 포함해 물어요. 암이나 뼈 질환은 뼈가 약해져서 약한 힘에도 부러지는 원인이 될 수 있어요.", d: "last year", k: ["지금 드시는 약이 있나요?", "최근에 넘어지신 적이 있나요?"], a: "history", o: ["habit", "plan", "fear"]}
  - {t: "증상 문진", i: faceWorried, w: "unexplained로 이유가 분명하지 않은 통증이나 체중 감소를 묻고 있다는 점을 짚어 줘요. 이유 없는 체중 감소와 통증은 뼈 약화의 원인을 찾을 때 묻는 증상이에요.", d: "since this morning", k: ["최근에 열이 났나요?", "암 진단을 받으신 적이 있나요?"], a: "weight", o: ["hair", "sleep", "hearing"]}
  - {t: "이유 설명", i: bulb, w: "this weak으로 이 환자의 뼈 상태를 가리켜, 사고가 작아도 부러질 수 있다는 설명이 자기 이야기로 들려요. 뼈가 약해진 이유는 검사로 찾아봐요.", d: "when you walk", k: ["골절 부위에 부목을 댈게요", "최근 엑스레이를 찍으셨나요?"], a: "weak", o: ["strong", "thick", "clean"]}
  - {t: "검사 안내", i: monitor, w: "to see why로 검사를 하는 이유를 말해 줘요. 병적 골절이 의심되면 뼈가 왜 약한지 영상으로 찾아봐요.", d: "this evening", k: ["지금 뼈 사진을 찍을 거예요", "약은 이따가 드릴게요"], a: "scans", o: ["meals", "casts", "crutches"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "병적 골절 의심 4문장 순서"
    why: "약한 힘에 부러졌다는 소견으로 시작하고, 'Because of that'으로 병력을 묻고, 'that history'로 이어 증상을 묻고, 'Whatever you tell me'로 어떤 답이어도 검사를 한다고 마무리해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "This break happened with very little force, which is unusual.", icon: bulb, ko: "이 골절은 아주 약한 힘에 생겼는데 이례적이에요", note: "소견"}
    - {en: "Because of that, I need to ask if you have any history of cancer or bone disease.", icon: board, ko: "그래서 암이나 뼈 질환 병력이 있는지 물어야 해요", note: "병력"}
    - {en: "Along with that history, have you had unexplained pain or weight loss recently?", icon: faceWorried, ko: "그 병력과 함께 최근 원인 모를 통증이나 체중 감소가 있었나요?", note: "증상"}
    - {en: "Whatever you tell me, we'll order scans to see why this bone is weak.", icon: monitor, ko: "어떻게 답하셔도 왜 뼈가 약한지 보려고 검사를 지시할 거예요", note: "검사"}
  sw: null
- title: 언어장벽 골절
  s:
  - {t: "통역 안내", i: speaker, w: "so we understand each other로 통역사를 부르는 이유를 서로를 위한 것으로 말해요. 가족이나 지인보다 의료 통역사를 쓰는 편이 정확하게 전달돼요.", d: "after lunch", k: ["의사 선생님을 모셔 올게요", "엑스레이를 찍으러 가요"], a: "interpreter", o: ["manager", "neighbor", "cousin"]}
  - {t: "알레르기", i: pill, w: "Are you allergic to any …?로 짧게 물어, 통역을 거쳐도 의미가 흐려지지 않게 해요. 약 알레르기는 어떤 약을 쓸지 정하기 전에 꼭 확인해요.", d: "in the past", k: ["어디가 가장 아프세요?", "지금 드시는 약이 있나요?"], a: "medicines", o: ["foods", "insects", "pets"]}
  - {t: "손짓 요청", i: pushpin, w: "Point처럼 동작 동사로 시작하면 말이 통하지 않아도 몸짓으로 답할 수 있어요. show me how bad로 정도도 손가락 숫자나 표정으로 보여 달라고 해요.", d: "on the paper", k: ["손으로 숫자를 보여 주세요", "통증이 언제 시작됐는지 알려 주세요"], a: "Point", o: ["Move", "Turn", "Look"]}
  - {t: "이해 확인", i: me, w: "Nod처럼 말 대신 고개로 답하게 해서 이해했는지 가볍게 확인해요. what I'm asking으로 질문의 내용을 이해했는지를 확인한다는 점을 알려 줘요.", d: "when you're ready", k: ["성함을 말씀해 주세요", "통역사가 곧 도착해요"], a: "Nod", o: ["Frown", "Cough", "Kneel"]}
  - {t: "통역 역할", i: speaker, w: "help us check으로 통역사를 옆에서 거드는 사람이 아니라 함께 확인하는 사람으로 소개해요. 통증과 병력처럼 정확해야 하는 내용을 통역사와 같이 확인해요.", d: "at the desk", k: ["의사 선생님이 곧 오실 거예요", "통증약은 곧 드릴게요"], a: "interpreter", o: ["receptionist", "janitor", "driver"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "언어장벽 골절 4문장 순서"
    why: "통역사를 부른다고 알리고, 'They'로 통역사가 올 때까지 손으로 아픈 곳을 가리키게 하고, 'that spot'으로 확인하고, 'Last'로 통역사가 통증과 병력을 도와 확인한다고 마무리해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "I'll get an interpreter so we understand each other.", icon: speaker, ko: "서로 이해할 수 있도록 통역사를 부를게요", note: "통역"}
    - {en: "They'll be here soon, so point to where it hurts and show me how bad.", icon: pushpin, ko: "곧 오실 테니 아픈 곳을 가리키고 얼마나 아픈지 보여 주세요", note: "손짓"}
    - {en: "Nod if that spot is where it hurts the most.", icon: me, ko: "그곳이 가장 아픈 곳이면 고개를 끄덕여 주세요", note: "확인"}
    - {en: "Last, the interpreter will help us check your pain and history.", icon: speaker, ko: "마지막으로 통역사가 통증과 병력을 확인하는 걸 도와줄 거예요", note: "마무리"}
  sw: null
