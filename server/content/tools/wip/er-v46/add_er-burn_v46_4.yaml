- title: 언어장벽 화상
  s:
  - {t: "통역 안내", i: speech, w: "I'm getting으로 지금 부르고 있다고 알려 환자가 안심해요. 병원은 영어가 서툰 환자에게 자격 있는 통역사를 제공해야 해요.", d: "a family member", k: ["통역은 무료로 제공돼요", "그림 카드로 아픈 곳을 가리켜 보실 수 있어요"], a: "interpreter", o: ["electrician", "engineer", "accountant"]}
  - {t: "원인 질문", i: magnify, w: "보기를 세 개 주어 짧은 말이나 손짓으로도 답할 수 있게 해요. 열·화학물질·전기에 따라 처치가 달라서 먼저 가려야 해요.", d: "or sunlight", k: ["화상은 언제 입으셨어요?", "화상 말고 다른 곳은 다치지 않으셨나요?"], a: "caused", o: ["cured", "soothed", "treated"]}
  - {t: "접촉 시간", i: calendar, w: "in contact with it은 닿은 대상을 몰라도 물을 수 있는 형태예요. 열이든 화학물질이든 닿은 시간이 길수록 깊게 손상돼요.", d: "last night", k: ["그것이 옷 위로 닿았나요, 피부에 직접 닿았나요?", "닿은 직후에 물로 씻으셨나요?"], a: "long", o: ["far", "tall", "wide"]}
  - {t: "알레르기 확인", i: pill, w: "any allergies to로 범위를 넓게 물어 놓치는 약이 없게 해요. 진통제나 항생제를 쓰기 전에 알레르기를 확인하는 것은 안전의 기본이에요.", d: "to pollen", k: ["지금 드시는 약이 있으세요?", "임신 중이거나 모유 수유 중이세요?"], a: "allergies", o: ["questions", "insurance", "plans"]}
  - {t: "통역 방식", i: speaker, w: "everything으로 중간에 줄이지 않고 전부 옮긴다고 약속해요. 의료 통역사는 말을 줄이거나 바꾸지 않고 그대로 옮기도록 훈련받아요.", d: "in plain English", k: ["통역사는 환자 정보의 비밀을 지켜 줘요", "모르는 말은 언제든 다시 물어보세요"], a: "repeat", o: ["ignore", "delete", "hide"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "언어장벽 화상 4문장 순서"
    why: "통역사를 부른다고 알리고, 통역사가 모든 말을 옮긴다고 약속하고, 원인을 묻고, 그 원인에 닿은 시간을 물어요. 'The interpreter'·'it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm getting an interpreter to help us communicate.", icon: speech, ko: "소통을 돕도록 통역사를 부를게요", note: "통역"}
    - {en: "The interpreter will repeat everything in your language.", icon: speaker, ko: "통역사가 모든 내용을 당신의 언어로 다시 말해줄 거예요", note: "약속"}
    - {en: "What caused the burn—heat, chemical, or electricity?", icon: magnify, ko: "화상 원인이 뭐였나요—열, 화학물질, 전기?", note: "원인"}
    - {en: "How long was your skin in contact with it?", icon: calendar, ko: "피부가 그것과 얼마나 오래 접촉했나요?", note: "시간"}
  sw: {ko: "의료 통역사를 쓰죠, 그래야 모든 내용을 정확히 전해요"}
- title: 화상센터 이송 기준
  s:
  - {t: "전원 이유", i: hospital, w: "for burns like yours로 환자 본인의 화상에 맞는 곳이라고 설명해요. 화상센터는 큰 화상의 수액·수술·재활을 한 팀이 맡아요.", d: "for any illness", k: ["센터에는 소아 화상 전문 병동도 있어요", "이송 전에 센터와 먼저 통화할 거예요"], a: "burns", o: ["fractures", "strokes", "infections"]}
  - {t: "이송 전 처치", i: bandage, w: "Before transfer로 시간 순서를 먼저 말해 환자가 준비된 상태로 떠난다고 느껴요. 이송 전 화상은 깨끗한 마른 드레싱으로 덮어 통증과 감염 위험을 줄여요.", d: "After lunch", k: ["이송 전에 혈액 검사를 한 번 더 할게요", "가족에게 이송 소식을 전해 드릴게요"], a: "cover", o: ["freeze", "shave", "peel"]}
  - {t: "이송 준비", i: board, w: "keep you warm과 send your records 두 약속을 and로 묶어요. 화상 환자는 열 손실이 커서 이송 중 따뜻하게 두고, 기록이 같이 가야 센터가 이어서 치료해요.", d: "and call your family", k: ["검사 결과는 센터에서 따로 알려 줄 거예요", "이송 중 구급대원이 곁에서 살펴볼 거예요"], a: "warm", o: ["cold", "wet", "damp"]}
  - {t: "신뢰 형성", i: star, w: "knows how to로 팀의 전문성을 말해 불안을 줄여요. 화상센터는 화상 치료 경험이 많은 의사·간호사·재활팀이 함께 일해요.", d: "was asked to", k: ["센터에서는 수술이 필요할 수도 있어요", "센터 위치는 보호자분께 알려 드릴게요"], a: "treat", o: ["ignore", "avoid", "forget"]}
  - {t: "통증 관리", i: pill, w: "before you go로 이송 전에 미리 약을 준다고 약속해요. 이동 중 흔들림과 자세 변화로 통증이 커질 수 있어서 미리 조절해 둬요.", d: "if you ask", k: ["통증이 심하면 이송 중에도 말씀하세요", "약 때문에 졸릴 수 있어요"], a: "pain", o: ["cough", "cold", "allergy"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "화상센터 이송 4문장 순서"
    why: "전원하는 이유를 알리고, 이송 전에 할 처치를 말하고, 이동 중에 할 일을 알린 뒤, 센터가 바로 이어받는다고 닫아요. 'transfer'·'the trip itself'·'That way'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "A burn center has specialists for burns like yours.", icon: hospital, ko: "화상센터에는 이런 화상을 다루는 전문의가 있어요", note: "이유"}
    - {en: "Before transfer, we'll cover the burns and manage your pain.", icon: bandage, ko: "이송 전에 화상 부위를 덮고 통증을 관리할게요", note: "준비"}
    - {en: "For the trip itself, we'll keep you warm and send your records with you.", icon: board, ko: "이동 중에는 따뜻하게 해드리고 기록도 함께 보내드릴게요", note: "이동"}
    - {en: "That way, the burn center team can take over right away.", icon: star, ko: "그러면 화상센터 팀이 바로 이어받을 수 있어요", note: "인수"}
  sw: {ko: "화상센터로 가시는 건 그곳에 이런 화상을 다루는 전문의가 있어서예요"}
- title: 기도 화상 부종 진행
  s:
  - {t: "긴급 안내", i: siren, w: "so로 이유와 행동을 이어 짧게 설명해요. 기도 부종은 빠르게 진행해 막힐 수 있어서 설명은 짧게, 조치는 바로 시작해요.", d: "when it closes", k: ["산소를 먼저 마스크로 드릴게요", "곧 마취과 의사가 올 거예요"], a: "swelling", o: ["clearing", "opening", "healing"]}
  - {t: "삽관 안내", i: gear, w: "before it closes로 지금 하는 이유를 시간 압박과 함께 알려요. 부은 기도는 막히면 관을 넣기 어려워져서 막히기 전에 넣는 쪽이 안전해요.", d: "after it heals", k: ["넣는 동안에는 약으로 잠들게 해 드릴게요", "관을 넣은 뒤에는 말씀을 못 하실 수 있어요"], a: "breathing", o: ["feeding", "urine", "chest"]}
  - {t: "환자 안심", i: me, w: "Try to로 명령이 아니라 시도해 보라는 부드러운 말투예요. 불안해서 숨이 빨라지면 부은 기도에 더 힘이 들어서 차분함이 도움이 돼요.", d: "Please sit up", k: ["고개를 들고 편히 앉아 계세요", "잠시 눈을 감고 쉬세요"], a: "calm", o: ["busy", "loud", "angry"]}
  - {t: "소견 전달", i: stetho, w: "I hear로 들은 것을 그대로 말해 진단을 단정하지 않아요. 쉰 소리나 높은 숨소리는 기도가 좁아졌다는 소리 단서예요.", d: "I feel", k: ["목이 쉬었는지 한번 말해 보세요", "숨을 들이쉴 때 가슴이 아프신가요?"], a: "hear", o: ["smell", "taste", "touch"]}
  - {t: "준비 안내", i: gear, w: "We're getting…ready로 팀이 이미 움직이고 있다고 알려 안심시켜요. 흡입 손상 환자는 기도가 막히기 전에 장비와 약을 미리 준비해 둬요.", d: "to cover your burn", k: ["가족분께는 곧 상황을 설명해 드릴게요", "도와줄 의료진이 곧 올 거예요"], a: "protect", o: ["block", "close", "narrow"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "기도 부종 대응 4문장 순서"
    why: "숨소리의 변화를 말하고, 기도가 붓는다고 알리고, 준비하고 삽관할 것이라 말한 뒤, 차분함이 도움이 된다고 닫아요. 'I hear'·'it'·'as we do this'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I hear a change in how you sound when you breathe.", icon: stetho, ko: "숨쉴 때 소리가 달라진 게 들려요", note: "소견"}
    - {en: "Your airway is swelling, so we need to secure it now.", icon: siren, ko: "기도가 붓고 있어서 지금 확보해야 해요", note: "긴급"}
    - {en: "We're getting everything ready, and we'll place a breathing tube before it closes.", icon: gear, ko: "준비를 하고 있고 기도가 막히기 전에 호흡관을 넣을 거예요", note: "준비"}
    - {en: "Staying calm will help you breathe safely as we do this.", icon: me, ko: "차분히 계시면 이 과정에서 안전하게 숨 쉬는 데 도움이 돼요", note: "안심"}
  sw: {ko: "기도가 부어서 막히기 전에 호흡관을 넣을 거예요"}
- title: 대면적 화상 저혈량 쇼크
  s:
  - {t: "원인과 조치", i: bulb, w: "cause와 so로 원인에서 조치로 흐르는 인과 문장이에요. 큰 화상은 모세혈관에서 체액이 새어 혈압이 떨어질 수 있어서 처음 몇 시간 수액이 중요해요.", d: "pills daily", k: ["혈관을 하나 더 확보할게요", "수액이 따뜻한지 확인할게요"], a: "heavy", o: ["light", "tiny", "rare"]}
  - {t: "소변량 확인", i: lab, w: "tells us if…로 소변량이 하는 일을 말해 소변을 재는 이유가 분명해져요. 시간당 소변량은 장기로 가는 혈류가 충분한지 알려 주는 대표 지표예요.", d: "if you slept", k: ["소변이 마려우면 바로 말씀해 주세요", "소변량은 소변줄로 정확히 잴게요"], a: "working", o: ["spilling", "freezing", "melting"]}
  - {t: "활력 감시", i: monitor, w: "We're watching으로 계속 지켜본다고 알려요. 체액이 빠지면 혈압이 떨어지고 심박수가 올라가서 두 값을 함께 봐요.", d: "every morning", k: ["산소 수치도 계속 지켜볼게요", "체온이 내려가지 않게 담요를 덮을게요"], a: "pressure", o: ["height", "vision", "hearing"]}
  - {t: "상태 설명", i: bulb, w: "This is…, so…로 큰 화상이라는 사실을 먼저 말하고 결과를 이어요. 몸에서 일어나는 일을 쉬운 말로 알려 주면 수액을 많이 맞는 이유가 납득돼요.", d: "at home", k: ["화상 때문에 몸이 많이 붓고 있어요", "수액은 필요한 만큼만 조절해서 드릴게요"], a: "losing", o: ["making", "saving", "hiding"]}
  - {t: "목표 안내", i: chartup, w: "We want…to로 목표를 함께 정한 것처럼 말해 환자가 협력자가 돼요. 혈압과 맥박이 안정적이면 수액이 충분히 들어가고 있다는 뜻이에요.", d: "to jump up", k: ["맥박이 빨라지면 바로 알려 드릴게요", "혈압은 15분마다 재 볼게요"], a: "stable", o: ["loud", "dark", "empty"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "대면적 화상 쇼크 4문장 순서"
    why: "큰 화상으로 체액이 빠진다고 알리고, 그래서 수액을 빨리 준다고 설명하고, 수액이 듣는지 소변량으로 보고, 혈압과 맥박도 함께 본다고 닫아요. 'That's why'·'the fluids'·'Along with that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This is a large burn, so your body is losing a lot of fluid.", icon: bulb, ko: "넓은 화상이라 몸에서 체액이 많이 빠져나가고 있어요", note: "상태"}
    - {en: "That's why we're giving fluids fast.", icon: bulb, ko: "그래서 수액을 빠르게 드리고 있어요", note: "조치"}
    - {en: "Your urine output tells us if the fluids are working.", icon: lab, ko: "소변량이 수액이 효과가 있는지 알려줘요", note: "소변"}
    - {en: "Along with that, we're watching your pressure and heart rate closely.", icon: monitor, ko: "그와 함께 혈압과 심박수를 면밀히 지켜보고 있어요", note: "감시"}
  ctx:
    word: "urine"
    ko: "소변"
    sc:
      1: {en: "Urine's only 20 this hour — below goal, let's tell the doctor."}
      2: {en: "Your urine output is 20 mL per hour, below goal."}
    why: "소변량을 mL 같은 수치로만 읽어 주면 환자는 알아듣기 어려워요. 의료진끼리는 수치로 말하지만, 환자에게는 소변이 기대만큼 나오지 않는다는 사실과 다음 조치를 쉬운 말로 전해요."
- title: 일산화탄소/시안 중독
  s:
  - {t: "측정 한계", i: monitor, w: "even with로 정상 수치와 위험이 동시에 가능하다는 반전을 말해요. 일산화탄소는 헤모글로빈에 붙어도 기계가 산소로 읽어서 포화도가 정상으로 나올 수 있어요.", d: "if you are calm", k: ["센서가 손가락에 잘 닿는지 볼게요", "검사 결과는 의사 선생님이 설명해 드릴 거예요"], a: "normal", o: ["low", "fast", "blank"]}
  - {t: "산소 투여", i: me, w: "right away로 지금 바로 한다고 알려요. 일산화탄소 중독에서는 고농도 산소가 헤모글로빈에 붙은 일산화탄소를 떼어내는 속도를 높여요.", d: "if you ask", k: ["마스크가 답답하면 말씀해 주세요", "마스크를 쓴 채로 편하게 숨 쉬세요"], a: "oxygen", o: ["nitrogen", "steam", "smoke"]}
  - {t: "위험 신호", i: bell, w: "important warning signs로 놓치기 쉬운 증상이 중요하다고 짚어요. 화재 뒤 두통과 혼돈은 일산화탄소나 시안화물 중독의 대표 증상이에요.", d: "usually harmless", k: ["어지러우면 바로 눕혀 드릴게요", "혼돈이 있으면 가족에게 연락해 둘게요"], a: "fire", o: ["nap", "meal", "trip"]}
  - {t: "혈액 검사", i: lab, w: "blood test와 poison level로 무엇을 재는지 구체적으로 알려요. 일산화탄소는 카복시헤모글로빈을 재는 혈액 검사로 확인해요.", d: "for the sugar", k: ["채혈할 때 따끔할 수 있어요", "동맥혈로 검사해야 할 수도 있어요"], a: "blood", o: ["saliva", "skin", "hair"]}
  - {t: "수치 해석", i: monitor, w: "can look fine even when…으로 수치가 정상이어도 안심할 수 없다고 짚어요. 일산화탄소가 붙은 헤모글로빈도 산소처럼 읽혀서 포화도가 높게 나올 수 있어요.", d: "after you leave", k: ["산소 수치는 계속 지켜볼게요", "가족에게 중독 사실을 알려 드릴게요"], a: "look", o: ["sound", "taste", "smell"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "CO 중독 4문장 순서"
    why: "측정기가 정상으로 나올 수 있다고 알리고, 그래서 산소를 바로 주고, 혈액 검사로 확인한 뒤, 그 결과가 두통·혼돈의 원인을 알려 준다고 닫아요. 'So'·'it'·'Your results'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "The pulse oximeter can read normal even with this poisoning.", icon: monitor, ko: "산소포화도 측정기는 이런 중독에도 정상으로 나타날 수 있어요", note: "한계"}
    - {en: "So we're giving you high-flow oxygen right away.", icon: me, ko: "그래서 고농도 산소를 바로 드리고 있어요", note: "산소"}
    - {en: "To confirm it, we'll check a blood test for the poison level.", icon: lab, ko: "확인하려고 중독 수치를 보는 혈액 검사를 할게요", note: "검사"}
    - {en: "Your results will show whether the poison is behind your headache and confusion.", icon: bulb, ko: "결과로 중독이 두통과 혼돈의 원인인지 알 수 있어요", note: "결과"}
  sw: {ko: "SpO2는 99%지만 일산화탄소 중독에서는 거짓으로 정상일 수 있어요 — 화재 후 두통과 혼돈이 있어요"}
- title: 흉부 원주형 화상 환기장애
  s:
  - {t: "상태 설명", i: faceWorried, w: "restricting으로 화상이 숨쉬기를 조인다는 원인과 결과를 한 문장에 말해요. 가슴을 두른 딱딱한 가피는 가슴이 부풀지 못하게 해서 호흡이 힘들어져요.", d: "is relaxing", k: ["화상 때문에 가슴이 아플 수 있어요", "산소는 계속 드리고 있어요"], a: "restricting", o: ["improving", "soothing", "supporting"]}
  - {t: "절개 안내", i: scalpel, w: "We may…로 확정이 아닌 가능성으로 말해요. 조여든 가피에 작은 절개를 내면 가슴이 다시 부풀 수 있게 돼요.", d: "to let it dry", k: ["절개 전에 통증 약을 충분히 드릴게요", "가슴 사진을 먼저 찍어 볼게요"], a: "small", o: ["huge", "giant", "wide"]}
  - {t: "이유 설명", i: bulb, w: "This will help…so로 처치가 가져올 변화를 먼저 말해요. 가슴이 움직일 수 있어야 폐가 부풀어서 숨을 쉴 수 있어요.", d: "so you can sleep", k: ["숨쉬기가 편해지면 말씀해 주세요", "산소 수치는 계속 재고 있어요"], a: "move", o: ["freeze", "shrink", "harden"]}
  - {t: "공감", i: faceWorried, w: "It's hard로 환자의 힘든 점을 먼저 인정하는 공감 표현이에요. 가슴이 조이면 깊이 들이쉬기 어려운 게 당연하다고 말해 불안을 덜어요.", d: "at night", k: ["숨이 가쁘면 침대 머리를 올려 드릴게요", "가슴을 한 번 눌러 볼게요"], a: "tight", o: ["loose", "empty", "light"]}
  - {t: "절개 필요성", i: scalpel, w: "may need…to로 필요하다면 하게 될 일을 목적과 함께 말해요. 환기가 나아지지 않으면 의사가 가슴 둘레의 가피를 절개해 호흡 운동을 되살려요.", d: "to cover your chest", k: ["의사 선생님이 절개 부위를 설명해 드릴 거예요", "절개 부위는 거즈로 덮을 거예요"], a: "expand", o: ["shrink", "stop", "sink"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "흉부 화상 4문장 순서"
    why: "화상이 숨쉬기를 조인다고 알리고, 그 때문에 깊은 숨이 힘들다고 공감하고, 그래서 절개가 필요할 수 있다고 하고, 그것이 가슴 움직임을 돕는다고 닫아요. 'That'·'That's why'·'This'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "The burn around your chest is restricting your breathing.", icon: faceWorried, ko: "가슴 주변 화상이 호흡을 제한하고 있어요", note: "상태"}
    - {en: "That makes it hard to take a full breath when your chest feels tight.", icon: faceWorried, ko: "그래서 가슴이 조이면 숨을 완전히 들이쉬기 힘들어요", note: "공감"}
    - {en: "That's why we may need small cuts to help your chest expand.", icon: scalpel, ko: "그래서 가슴이 팽창하도록 작은 절개가 필요할 수도 있어요", note: "절개"}
    - {en: "This will help your chest move so you can breathe.", icon: bulb, ko: "이렇게 하면 가슴이 움직여서 숨을 쉴 수 있어요", note: "효과"}
  ctx: {word: "chest", ko: "가슴"}
- title: 전기화상 횡문근융해
  s:
  - {t: "소견 해석", i: lab, w: "can mean으로 단정하지 않고 가능성으로 말해요. 근육이 깨지면 미오글로빈이 소변으로 나와 콜라색처럼 어두워져요.", d: "from the medicine", k: ["소변은 모아서 검사실로 보낼게요", "소변량을 시간마다 재고 있어요"], a: "Dark", o: ["Clear", "Pale", "Cold"]}
  - {t: "수액 목적", i: shield, w: "to protect로 수액의 목적을 밝혀요. 수액으로 소변을 충분히 내보내 근육 단백질이 신장을 막지 않게 해요.", d: "your liver", k: ["수액을 맞으면 소변을 자주 볼 수 있어요", "소변 색이 맑아지는지 지켜볼게요"], a: "protect", o: ["warm", "cool", "feed"]}
  - {t: "전해질 감시", i: monitor, w: "potassium과 heart rhythm을 짝으로 말해 왜 둘을 같이 보는지 전해요. 근육이 깨지면 칼륨이 혈액으로 쏟아져 심장 리듬을 위협할 수 있어요.", d: "every month", k: ["채혈은 몇 시간마다 반복할 거예요", "심장 모니터 소리가 나도 놀라지 마세요"], a: "heart", o: ["lung", "kidney", "liver"]}
  - {t: "경과 설명", i: bulb, w: "after로 원인과 결과를 시간 순서로 이어요. 전류와 열이 근육 세포를 깨뜨려 속의 물질이 혈액과 소변으로 새 나와요.", d: "after the surgery", k: ["근육통이 있는 곳이 어디인지 알려 주세요", "소변이 어두워지면 바로 말씀해 주세요"], a: "muscles", o: ["nails", "hairs", "teeth"]}
  - {t: "수액 증량", i: shield, w: "extra로 평소보다 더 많이 준다고 알려 이유를 이해시켜요. 소변량을 충분히 유지해 신장을 지켜요.", d: "to keep your heart rate up", k: ["소변 색은 이제 걱정 안 하셔도 돼요", "수액이 들어갈 때 팔이 부을 수 있어요"], a: "extra", o: ["less", "no", "fewer"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "횡문근융해 4문장 순서"
    why: "어두운 소변이 근육 파괴일 수 있다고 알리고, 그래서 수액을 준다고 하고, 수액이 들어가는 동안 칼륨과 리듬을 보고, 필요하면 수액을 더한다고 닫아요. 'That's why'·'the fluids'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Dark urine can mean your muscles are breaking down.", icon: lab, ko: "짙은 소변은 근육이 파괴되고 있다는 뜻일 수 있어요", note: "해석"}
    - {en: "That's why we're giving fluids to protect your kidneys.", icon: shield, ko: "그래서 신장을 보호하려고 수액을 드리고 있어요", note: "수액"}
    - {en: "With the fluids running, we're watching your potassium and heart rhythm closely.", icon: monitor, ko: "수액이 들어가는 동안 칼륨과 심장 리듬을 면밀히 지켜보고 있어요", note: "감시"}
    - {en: "We'll give extra fluids as needed to keep your kidneys safe.", icon: shield, ko: "신장을 안전하게 지키려고 필요하면 수액을 더 드릴게요", note: "증량"}
  sw: {ko: "소변이 어두우면 근육이 파괴되고 있다는 뜻일 수 있어요"}
- title: 화상 SBAR 인계
  s:
  - {t: "상황 보고", i: board, w: "This is로 시작해 누구 이야기인지 먼저 밝히는 SBAR의 S 문장이에요. 나이와 화상 크기(TBSA)를 첫 줄에 넣으면 받는 사람이 위중도를 바로 알아요.", d: "with fever", k: ["이 환자는 화상센터로 전원 예정입니다", "환자는 현재 통증을 호소하고 있습니다"], a: "TBSA", o: ["BMI", "BUN", "INR"]}
  - {t: "현재 조치", i: lab, w: "한 일과 그 반응을 한 문장에 묶는 보고예요. Parkland는 체중과 화상 크기로 첫 24시간 수액량을 정하는 공식이고, 소변량으로 속도를 조절해요.", d: "and the burn is covered", k: ["수액 속도를 소변량에 맞춰 조절하고 있습니다", "정맥 라인은 두 개 확보했습니다"], a: "adequate", o: ["absent", "bloody", "painful"]}
  - {t: "기도 상태", i: stetho, w: "but으로 현재 상태와 우려를 한 문장에 대비시켜요. patent는 지금 열려 있어 공기가 통한다는 의료진 용어고, 부종 가능성 때문에 계속 봐요.", d: "waiting for the CT", k: ["기도 삽관은 이미 완료했습니다", "산소는 마스크로 투여 중입니다"], a: "patent", o: ["sealed", "closed", "blocked"]}
  - {t: "화상 규모", i: chartup, w: "about thirty percent와 mostly partial thickness로 크기와 깊이를 숫자와 분류어로 압축해요. 부분층은 표피와 진피 일부가 손상된 화상이에요.", d: "and deep scars", k: ["화상은 얼굴과 손에 집중돼 있습니다", "손과 얼굴 화상은 없습니다"], a: "partial", o: ["total", "double", "hidden"]}
  - {t: "인계 마무리", i: check, w: "stable과 ready for transfer로 현재 상태와 다음 단계를 한 문장에 닫아요. 받는 쪽이 이송 직전 상태를 가장 먼저 알고 싶어 해요.", d: "and she's asleep", k: ["활력징후는 다시 확인할 예정입니다", "이송 구급차가 도착했습니다"], a: "stable", o: ["dropping", "rising", "missing"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "화상 SBAR 4문장 순서"
    why: "환자와 화상 크기로 시작하고, 그 화상에 한 일을 말하고, 수액 말고 기도 상태를 말한 뒤, 전체 상태와 이송 준비로 닫아요. 'for that'·'Besides the fluids'·'Overall'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "This is a 35-year-old with 30 percent TBSA burns.", icon: board, ko: "35세 환자로 체표면적 30퍼센트 화상입니다", note: "상황"}
    - {en: "We started Parkland fluids for that, and urine output is adequate.", icon: lab, ko: "그에 대해 Parkland 수액을 시작했고 소변량은 적정합니다", note: "조치"}
    - {en: "Besides the fluids, the airway is patent, but we're watching for swelling.", icon: stetho, ko: "수액 외에 기도는 열려 있지만 부종을 지켜보고 있습니다", note: "기도"}
    - {en: "Overall, vitals are stable and we're ready for transfer.", icon: check, ko: "전반적으로 활력징후는 안정적이고 이송 준비가 되었습니다", note: "마무리"}
  sw: {ko: "기도는 열려 있지만 부종을 지켜보고 있습니다"}
