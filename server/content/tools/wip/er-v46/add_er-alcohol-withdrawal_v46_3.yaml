- title: 알코올성 간질환 동반
  s:
  - {t: "소견 설명", i: stetho, w: "struggling은 간이 힘들어한다는 쉬운 비유라 황달·부기라는 말 없이도 뜻이 전해져요. 피부가 노랗고 붓는 것은 간 기능이 떨어질 때 함께 나타날 수 있어요.", d: "suggest your heart", k: ["출혈 위험도 높아져요", "금단도 같이 관리할게요"], a: "yellow", o: ["dry", "pale", "red"]}
  - {t: "위험 설명", i: bell, w: "위험을 알린 뒤 so we'll be careful로 우리가 대비한다고 이어 환자가 불안만 안고 남지 않게 해요. 간이 나빠지면 피를 굳히는 단백질을 덜 만들어 출혈 위험이 올라요.", d: "be quick", k: ["간이 힘들어한다는 뜻이에요", "금단을 함께 관리해요"], a: "raises", o: ["lowers", "hides", "ends"]}
  - {t: "동시 치료", i: gear, w: "두 가지를 함께 한다고 말해 금단을 치료하느라 간이 뒷전이 될까 걱정하지 않게 해요. 간질환이 있으면 약 선택과 용량을 더 신중히 해서 둘을 같이 봐요.", d: "while we move your bed", k: ["간이 힘들어하고 있어요", "출혈 위험이 높아요"], a: "liver", o: ["kidney", "heart", "lung"]}
  - {t: "원인 설명", i: faceWorried, w: "because로 눈에 보이는 변화와 몸속 이유를 이어 주면 환자가 이해해요. 간이 빌리루빈을 잘 처리하지 못하면 피부가 노래져요.", d: "because you're cold", k: ["배가 붓는 것도 간 때문일 수 있어요", "금단을 치료하면서 간을 지지해요"], a: "because", o: ["although", "unless", "until"]}
  - {t: "부기 설명", i: faceWorried, w: "too로 앞서 말한 피부 변화와 같은 원인일 수 있다고 연결해요. 간이 나쁘면 배에 물이 차서 불러지기도 해요.", d: "in your ears", k: ["피부가 노랗게 보여요", "금단을 같이 치료해요"], a: "belly", o: ["ears", "teeth", "wrists"]}
  - {t: "동시 진행", i: gear, w: "at the same time으로 두 가지를 번갈아 하지 않고 같이 한다고 밝혀요. 간이 안 좋으면 진정제 선택과 용량을 신중히 해야 해서 carefully가 들어가요.", d: "at the same table", k: ["부기는 간 때문일 수 있어요", "피부가 노랗게 보여요"], a: "carefully", o: ["quietly", "politely", "loudly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "간질환 동반 4문장 순서"
    why: "피부가 노란 이유를 먼저 설명하고, 부기도 같은 원인이라고 잇고, 두 징후를 합쳐 출혈 위험이 높다고 알린 뒤, 그러니 금단 치료와 간 지지를 같이 한다고 닫아요. 'the same thing'·'both of those signs'·'So'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Your skin looks yellow because your liver isn't working well.", icon: faceWorried, ko: "간이 잘 기능하지 못해서 피부가 노랗게 보여요", note: "원인"}
    - {en: "The swelling in your belly can mean the same thing.", icon: faceWorried, ko: "배가 붓는 것도 같은 뜻일 수 있어요", note: "부기"}
    - {en: "With both of those signs, your bleeding risk is also higher, so we'll be careful.", icon: bell, ko: "그 두 징후가 있어서 출혈 위험도 높아 저희가 조심할게요", note: "위험"}
    - {en: "So we'll treat the withdrawal carefully and support your liver at the same time.", icon: gear, ko: "그래서 금단을 조심스럽게 치료하면서 동시에 간을 지지할게요", note: "계획"}
- title: 금단+정신질환
  sw: {ko: "지금 자신을 해치고 싶은 생각이 있으세요?"}
  s:
  - {t: "통합 치료", i: handshake2, w: "both … together로 정신 건강도 치료 대상이라고 한 번에 말하면 환자가 '술 문제만 본다'고 느끼지 않아요. 금단과 우울·불안은 함께 있는 경우가 많아서 같이 봐요.", d: "and your diet", k: ["안전하신지부터 확인할게요", "정신과 팀이 도와줄 거예요"], a: "together", o: ["separately", "alone", "privately"]}
  - {t: "자해 선별", i: shield, w: "돌려 말하지 않고 직접 묻는 문장이에요. 직접 물어도 위험이 커지지 않고, right now로 지금 있는지를 물어 바로 안전 조치가 필요한지 가려요.", d: "of going home", k: ["정신과 팀이 도와줄 거예요", "안전한 계획을 세울게요"], a: "hurting", o: ["helping", "washing", "trusting"]}
  - {t: "팀 소개", i: handshake2, w: "help us로 팀이 환자를 대신하는 게 아니라 우리와 함께 계획을 짠다고 말해요. 자해 위험이 있으면 정신과 평가와 안전 계획이 이어져요.", d: "A kitchen team", k: ["금단과 정신 건강을 함께 치료해요", "지금 자해할 생각이 있나요?"], a: "psychiatry", o: ["dental", "laundry", "kitchen"]}
  - {t: "동시 치료", i: gear, w: "at the same time을 현재진행형과 써서 지금 둘 다 하고 있다고 알려요. 정신 건강 문제가 있어도 금단 치료는 멈추지 않아요.", d: "at the same hospital", k: ["정신과 팀이 계획을 도와줄 거예요", "지금 자해 생각이 있으세요?"], a: "mental", o: ["dental", "financial", "legal"]}
  - {t: "안전 우선", i: shield, w: "before we make any plan으로 계획보다 안전이 먼저라고 순서를 말해요. 자해 위험이 있으면 계획을 세우기 전에 안전 확보가 먼저예요.", d: "before we make any noise", k: ["정신과 팀이 같이 일해요", "금단과 정신 건강을 동시에 치료해요"], a: "safe", o: ["warm", "hungry", "rested"]}
  - {t: "협진 안내", i: handshake2, w: "work with us로 팀이 대체가 아니라 협력한다고 말해요. 협진은 간호사·의사·정신과가 한 계획을 공유하는 방식이에요.", d: "on your discharge", k: ["계획을 세우기 전에 안전부터 확인해요", "금단과 정신 건강을 동시에 치료해요"], a: "psychiatry", o: ["parking", "billing", "front-desk"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "금단과 정신 건강 4문장 순서"
    why: "금단과 정신 건강을 함께 치료한다고 알리고, 그 일부로 자해 생각을 직접 묻고, 대답이 무엇이든 계획 전에 안전부터 확인한다고 하며, 그 대답을 가지고 정신과 팀이 계획을 돕는다고 닫아요. 'As part of that'·'Whatever you tell me'·'your answer'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We'll treat both the withdrawal and your mental health together.", icon: handshake2, ko: "금단과 정신 건강을 함께 치료할게요", note: "통합"}
    - {en: "As part of that, I need to ask: are you having any thoughts of hurting yourself right now?", icon: shield, ko: "그 일부로 여쭤봐야 해요: 지금 자신을 해치고 싶은 생각이 있으세요?", note: "선별"}
    - {en: "Whatever you tell me, I want to make sure you're safe before we make any plan.", icon: shield, ko: "뭐라고 하셔도 계획을 세우기 전에 안전하신지부터 확인하고 싶어요", note: "안전"}
    - {en: "With your answer in mind, a psychiatry team will help us make a safe plan for you.", icon: handshake2, ko: "그 대답을 바탕으로 정신과 팀이 안전한 계획을 세우도록 도와줄 거예요", note: "협진"}
- title: 음주 부인 환자
  s:
  - {t: "증상 설명", i: stetho, w: "can happen으로 가능성을 말하고, 술 이야기 대신 '몸이 알코올을 찾는다'고 풀어 환자를 추궁하지 않아요. 떨림과 발한은 금단의 대표 증상이에요.", d: "when the room is cold", k: ["양이 얼마든 안전하게 해드릴게요", "아침마다 이런 적 있었어요?"], a: "tremor", o: ["cough", "rash", "headache"]}
  - {t: "비판단", i: handshake2, w: "Whatever the amount로 양을 따지지 않겠다고 먼저 밝히면 환자가 방어를 풀어요. 부인하는 환자에게는 사실 확인보다 안전을 약속하는 말이 신뢰를 만들어요.", d: "Whatever the weather", k: ["이런 징후는 술을 적게 마셔도 나타나요", "아침마다 이런 느낌이 있었나요?"], a: "comfortable", o: ["quiet", "busy", "warm"]}
  - {t: "아침 증상", i: calendar, w: "in the mornings로 시간대를 좁히면 대답하기 쉬워요. 아침 떨림은 밤새 술이 끊긴 뒤 금단이 나타나는 흔한 양상이에요.", d: "in the evenings", k: ["떨림은 알코올 때문일 수 있어요", "뭐라고 하셔도 괜찮아요"], a: "mornings", o: ["weekends", "winters", "vacations"]}
  - {t: "낙인 완화", i: shield, w: "someone으로 주어를 일반화하면 환자를 직접 지목하지 않고도 사실을 알릴 수 있어요. 본인은 적게 마신다고 느껴도 규칙적으로 마셨다면 금단이 올 수 있어요.", d: "they don't sleep much", k: ["아침마다 이런 느낌이 있었나요?", "몸이 알코올을 찾아서 떨려요"], a: "drink", o: ["sleep", "eat", "smoke"]}
  - {t: "안심", i: handshake2, w: "is fine으로 어떤 대답도 괜찮다고 먼저 말하면 환자가 사실대로 말하기 쉬워요. 부인하는 환자를 반박하지 않고 안전을 목표로 삼아요.", d: "to keep you updated", k: ["떨림이 알코올 때문일 수 있어요", "몸이 알코올을 찾는 신호예요"], a: "safe", o: ["warm", "quiet", "busy"]}
  - {t: "초기 징후", i: stetho, w: "can be로 가능성만 말하고 단정하지 않아요. early sign은 금단이 막 시작되는 단계라는 뜻이라, 환자에게 앞으로 지켜볼 이유를 줘요.", d: "your body misses sleep", k: ["아침마다 이런 적 있었어요?", "양이 얼마든 괜찮아요"], a: "tremor", o: ["rash", "bruise", "cramp"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "음주 부인 환자 4문장 순서"
    why: "어떤 대답도 괜찮다고 안심시키고, 아침에 이런 느낌이 있었는지 묻고, 그 대답이 무엇이든 떨림이 금단 초기일 수 있다고 설명하고, 그런 징후가 적게 마셨다고 느끼는 사람에게도 나타난다고 닫아요. 'Whatever the answer'·'Those signs'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Whatever you tell me is fine — I just want to keep you safe.", icon: handshake2, ko: "뭐라고 말씀하셔도 괜찮아요 — 안전하게 해드리고 싶을 뿐이에요", note: "안심"}
    - {en: "Have you noticed feeling like this in the mornings before?", icon: calendar, ko: "예전에도 아침마다 이런 느낌을 알아채신 적 있어요?", note: "문진"}
    - {en: "Whatever the answer, a tremor like this can be an early sign your body misses alcohol.", icon: stetho, ko: "대답이 무엇이든 이런 떨림은 몸이 알코올을 찾는 초기 징후일 수 있어요", note: "설명"}
    - {en: "Those signs can show up even when someone feels they don't drink much.", icon: shield, ko: "그런 징후는 술을 많이 안 마신다고 느끼는 사람에게도 나타날 수 있어요", note: "일반화"}
- title: 진전섬망
  sw: {ko: "심하게 초조해하고 있어요 — 고혈압에 빈맥이에요"}
  s:
  - {t: "상태 보고", i: siren, w: "진단명을 먼저 말하고 활력징후와 행동을 이어 대며 한 문장에 상황을 압축해요. 의사에게 보고할 때는 severely처럼 정도까지 넣어요.", d: ", bradycardic", k: ["벤조디아제핀 진정이 필요해요", "지금 혈압과 심박수가 높아요"], a: "severely", o: ["mildly", "slightly", "briefly"]}
  - {t: "치료 요청", i: pill, w: "needs로 필요한 것을 한 줄로 나열해 의사가 바로 오더를 낼 수 있게 해요. 진전섬망은 벤조디아제핀으로 충분히 진정시키고 곁에서 안전을 지키는 것이 같이 필요해요.", d: "and a private room", k: ["CIWA가 척도를 벗어났어요", "혈압과 심박수가 높아요"], a: "safety", o: ["feeding", "teaching", "billing"]}
  - {t: "호출 요청", i: bell, w: "점수가 척도를 벗어났다는 사실과 필요한 사람(의사·ICU)을 한 문장에 담아요. 직접 필요하다고 말해 호출의 긴급도가 전해져요.", d: "and possibly a translator now", k: ["혈압과 심박수가 높아요", "적극적인 진정이 필요해요"], a: "physician", o: ["pharmacist", "dietitian", "chaplain"]}
  - {t: "활력징후", i: monitor, w: "both로 두 수치를 묶고 right now로 시점을 박아 지금 값이라는 것을 분명히 해요. 진전섬망에서는 자율신경이 흥분해 혈압과 심박수가 함께 올라요.", d: "have both been checked", k: ["CIWA가 척도를 벗어났어요", "적극적인 진정이 필요해요"], a: "heart rate", o: ["weight", "height", "hearing"]}
  - {t: "즉시 호출", i: siren, w: "now를 앞에 두어 긴급하다는 것부터 말하고 이유를 뒤에 붙여요. 보고에서는 요청을 먼저 말하고 근거를 이어요.", d: "this needs a signature", k: ["CIWA가 척도를 벗어났어요", "1:1 안전 관리가 필요해요"], a: "sedation", o: ["hydration", "imaging", "paperwork"]}
  - {t: "병상 요청", i: hospital, w: "possibly로 아직 확정이 아닌 부분은 가능성으로 표현해요. 진전섬망 환자는 집중 감시가 필요할 수 있어서 ICU 병상을 미리 의논해요.", d: "and possibly a wheelchair", k: ["지금 의사가 필요해요", "혈압이 높아요"], a: "bed", o: ["chair", "cart", "badge"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "진전섬망 보고 4문장 순서"
    why: "상태를 먼저 보고하고, 점수가 척도를 벗어나 의사가 필요하다고 이어 호출하고, 의사에게 필요한 오더를 요청하고, 그 진정에도 반응이 없으면 ICU 병상이 필요할 수 있다고 닫아요. 'On top of that'·'For that'·'that sedation'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "He's in delirium tremens — hypertensive, tachycardic, and severely agitated.", icon: siren, ko: "진전섬망 상태예요 — 고혈압, 빈맥이고 심하게 초조해해요", note: "상태"}
    - {en: "On top of that, his CIWA is off the scale, so I need a physician now.", icon: bell, ko: "게다가 CIWA가 척도를 벗어나서 지금 의사가 필요해요", note: "호출"}
    - {en: "For that, please order aggressive benzodiazepine sedation and one-to-one safety for him.", icon: pill, ko: "그래서 그분께 적극적인 벤조디아제핀 진정과 1:1 안전 관리를 오더해 주세요", note: "요청"}
    - {en: "If he doesn't respond to that sedation, we may need an ICU bed.", icon: hospital, ko: "그 진정에도 반응이 없으면 ICU 병상이 필요할 수 있어요", note: "대비"}
- title: 불응성 금단 발작 중첩
  s:
  - {t: "투약 지시", i: siren, w: "상태를 짧게 말한 뒤 곧바로 지시를 이어요. 긴박할 땐 give … now처럼 동사로 시작하는 짧은 명령이 오해가 적어요.", d: "— check the next chart", k: ["기도를 보호하고 산소를 준비하세요", "멈추지 않으면 삽관을 준비해요"], a: "benzodiazepine", o: ["antibiotic", "saline", "vaccine"]}
  - {t: "기도 확보", i: stetho, w: "Protect the airway를 맨 앞에 둬 가장 먼저 할 일임을 보여 줘요. 발작 중에는 기도가 막히거나 토한 것이 들어갈 수 있어서 흡인기와 산소를 미리 준비해요.", d: "and get a form ready", k: ["벤조디아제핀을 한 번 더 투여하세요", "멈추지 않으면 삽관을 준비해요"], a: "airway", o: ["chart", "door", "schedule"]}
  - {t: "단계 상향", i: gear, w: "If로 이어질 단계를 미리 말해 두면 팀이 다음 행동을 준비해요. 약으로 발작이 멈추지 않으면 기도 확보(삽관)로 넘어가는 것이 정해진 순서예요.", d: "and prepare the paperwork", k: ["벤조디아제핀을 한 번 더 투여하세요", "기도 카트를 가져오세요"], a: "intubate", o: ["extubate", "ambulate", "vaccinate"]}
  - {t: "경과 보고", i: bell, w: "third로 횟수를 말해 발작이 반복된다는 근거를 줘요. 횟수와 간격은 팀이 다음 용량을 정할 때 필요한 정보예요.", d: "This is his third visit", k: ["기도 카트를 가져오세요", "멈추지 않으면 삽관을 준비해요"], a: "third", o: ["first", "last", "only"]}
  - {t: "장비 준비", i: gear, w: "airway cart는 기도 확보 장비가 든 카트라 한 단어로 팀이 무엇을 가져올지 알아요. 장비를 미리 준비하면 삽관이 필요할 때 시간을 아껴요.", d: "and have forms ready", k: ["벤조디아제핀을 한 번 더 투여하세요", "세 번째 발작이에요"], a: "cart", o: ["form", "menu", "ticket"]}
  - {t: "삽관 대비", i: siren, w: "soon으로 기다릴 시간이 길지 않다고 알려 팀이 미리 움직이게 해요. 발작이 길어지면 호흡 보호가 필요해져서 삽관 준비를 일찍 말해요.", d: "we need to prepare the room", k: ["이번이 세 번째 발작이에요", "기도 카트를 가져오세요"], a: "intubate", o: ["transfuse", "vaccinate", "weigh"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "발작 중첩 4문장 순서"
    why: "먼저 벤조디아제핀을 한 번 더 주라고 지시하고, 그 약과 함께 기도와 흡인·산소를 챙기고, 그 용량에도 발작이 멈추지 않으면 단계를 올리고, 그에 맞춰 기도 카트를 가져온다고 이어요. 'that dose'·'Along with that dose'·'escalation'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "He's in status — give another dose of benzodiazepine now.", icon: siren, ko: "발작이 지속되고 있어요 — 벤조디아제핀을 한 번 더 투여하세요", note: "투약"}
    - {en: "Along with that dose, protect the airway and get suction and oxygen ready.", icon: stetho, ko: "그 용량과 함께 기도를 보호하고 흡인과 산소를 준비하세요", note: "기도"}
    - {en: "If that dose doesn't break the seizure, we escalate.", icon: gear, ko: "그 용량으로도 발작이 멈추지 않으면 단계를 올려요", note: "상향"}
    - {en: "Get the airway cart now, so we're ready if escalation means intubating.", icon: gear, ko: "기도 카트를 지금 가져와서 단계 상향이 삽관이 되더라도 준비돼 있게 하세요", note: "장비"}
- title: 베르니케-코르사코프 진행
  sw: {ko: "기억 상실을 채우려고 이야기를 지어내고 있어요"}
  s:
  - {t: "소견 설명", i: stetho, w: "두 소견을 나열하고 suggest로 결론을 가능성으로 말해요. 기억 상실과 지어낸 이야기는 베르니케 뇌병증이 코르사코프 증후군으로 진행했을 때 나타나는 소견이에요.", d: "suggest the fever has advanced", k: ["긴급히 티아민을 드리고 있어요", "언제부터 기억이 안 좋았나요?"], a: "advanced", o: ["improved", "vanished", "stopped"]}
  - {t: "치료와 한계", i: pill, w: "though로 치료를 먼저 말하고 한계를 솔직히 덧붙여 가족이 기대를 맞춰요. 이미 생긴 일부 손상은 돌아오지 않을 수 있어서 거짓 희망을 주지 않아요.", d: "though some paperwork may be late", k: ["기억 상실은 진행의 신호예요", "언제부터 기억이 안 좋았나요?"], a: "urgent", o: ["routine", "daily", "weekly"]}
  - {t: "경과 문진", i: calendar, w: "How long은 시작 시점을 묻는 가장 쉬운 말이에요. 기억 문제가 갑자기 생겼는지 서서히 왔는지가 원인을 좁히는 단서예요.", d: "How long has his sleep", k: ["일부 손상은 되돌릴 수 없어요", "지어낸 이야기를 하고 있어요"], a: "memory", o: ["appetite", "hearing", "vision"]}
  - {t: "경과 의미", i: chartup, w: "can mean으로 단정하지 않고 가능성을 말해요. advancing은 상태가 진행 중이라는 쉬운 표현이에요.", d: "the condition is improving", k: ["긴급히 티아민을 드려요", "지어낸 이야기를 하고 있어요"], a: "advancing", o: ["improving", "ending", "clearing"]}
  - {t: "긴급 이유", i: bell, w: "because로 서두르는 이유를 말해 가족이 이해해요. 이미 생긴 손상은 되돌릴 수 없어서 더 진행되기 전에 줘요.", d: "because some paperwork is late", k: ["언제부터 기억이 안 좋았나요?", "기억의 빈자리를 이야기로 채워요"], a: "reversed", o: ["repeated", "erased", "ordered"]}
  - {t: "작화 설명", i: speech, w: "making up stories는 작화를 가족이 알아듣는 말로 풀어요. 일부러 속이는 게 아니라 빈 기억을 채우는 증상이라는 점을 이어서 말해 주면 오해를 막아요.", d: "to fill in the forms", k: ["기억 상실은 진행의 신호예요", "언제부터 이랬나요?"], a: "stories", o: ["songs", "lists", "rules"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "코르사코프 진행 4문장 순서"
    why: "기억이 언제부터 그랬는지 묻고, 그 설명에 비추어 기억 상실과 지어낸 이야기가 진행의 신호라고 말하고, 그 이야기들이 일부러가 아니라 빈 기억을 채우는 것이라고 풀고, 그래서 서둘러 티아민을 준다고 닫아요. 'what you describe'·'those stories'·'That's why'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How long has his memory been like this?", icon: calendar, ko: "언제부터 이렇게 기억이 안 좋으셨어요?", note: "문진"}
    - {en: "From what you describe, the memory loss and made-up stories suggest the deficiency has advanced.", icon: stetho, ko: "말씀하신 걸 보면 기억 상실과 지어낸 이야기는 결핍이 진행됐다는 뜻이에요", note: "소견"}
    - {en: "He's making up those stories to fill in the memory loss — it isn't on purpose.", icon: speech, ko: "기억 상실을 채우려고 그 이야기를 지어내는 거예요 — 일부러가 아니에요", note: "작화"}
    - {en: "That's why we're giving urgent high-dose thiamine, though some damage may be lasting.", icon: pill, ko: "그래서 긴급히 고용량 티아민을 드리고 있어요, 다만 일부 손상은 남을 수 있어요", note: "치료"}
