situations:
- title: 대기 지연 불만 환자
  sentences:
  - en: I'm sorry for the long wait — let me explain what's happening.
    ko: 오래 기다리게 해서 죄송해요, 지금 상황을 설명해 드릴게요.
    chunks:
    - I'm sorry
    - for the long wait
    - — let me explain
    - what's happening
    - .
    words:
    - w-sorry
    - w-long
    - w-wait
    - w-explain
    - w-happen
    goal: 1
    tag: 사과·설명
    icon: faceWorried
    why: 사과를 먼저 하고 let me explain으로 설명을 약속하면 변명이 아니라 정보 공유로 들려요. 환자는 이유를 모를 때 더 화나기 쉬워요.
    decoy: for the noise
    distractorsKo:
    - 물이나 담요가 필요하세요?
    - 의사 선생님께 바로 전달할게요.
    blank:
      answer: wait
      options:
      - en: visit
      - en: wait
      - en: shift
      - en: drive
  - en: Patients with life-threatening issues are seen first.
    ko: 생명이 위독한 환자분들이 먼저 진료를 받으세요.
    chunks:
    - Patients with
    - life-threatening issues
    - are seen
    - first
    - .
    words:
    - w-first
    goal: 1
    tag: 우선순위
    icon: siren
    why: 대기 순서가 도착 순이 아니라 위급한 정도 순이라는 사실을 그대로 알려요. 누구를 탓하지 않고 체계를 설명하는 문장이에요.
    decoy: in arrival order
    distractorsKo:
    - 보험 정보를 확인할게요.
    - 화장실은 복도 끝에 있어요.
    blank:
      answer: life-threatening
      options:
      - en: chronic
      - en: life-threatening
      - en: minor
      - en: routine
  - en: I'll check on your place in line and update you shortly.
    ko: 순서를 확인하고 곧 알려드릴게요.
    chunks:
    - I'll check
    - on your place
    - in line
    - and update you
    - shortly
    - .
    words:
    - w-check
    - w-place
    - w-line
    - w-update
    - w-shortly
    goal: 2
    tag: 순서 확인
    icon: magnify
    why: check on으로 직접 알아보겠다는 약속과 update you로 내가 다시 알려 주겠다는 약속을 한 문장에 담아요. 환자가 다시 물으러 오지 않아도 돼요.
    decoy: and move you
    distractorsKo:
    - 접수 번호를 다시 알려 주세요.
    - 차트에 메모를 남길게요.
    blank:
      answer: update
      options:
      - en: triage
      - en: register
      - en: move
      - en: update
  - en: I know three hours can feel like forever.
    ko: 세 시간이 정말 길게 느껴지실 거예요.
    chunks:
    - I know
    - three hours
    - can feel
    - like forever
    - .
    words:
    - w-feel
    goal: 2
    tag: 공감
    icon: faceWorried
    why: I know로 환자의 느낌을 먼저 인정해요. forever라는 환자 쪽 표현을 반박하지 않고 그대로 받아 주면 방어하는 말로 들리지 않아요.
    decoy: like a minute
    distractorsKo:
    - 진료비는 나중에 안내해 드릴게요.
    - 제가 직접 모시고 갈게요.
    blank:
      answer: forever
      options:
      - en: a moment
      - en: nothing
      - en: a break
      - en: forever
  - en: I'll come find you as soon as I have news.
    ko: 소식이 있으면 바로 찾아뵐게요.
    chunks:
    - I'll come
    - find you
    - as soon as
    - I have news
    - .
    words:
    - w-find
    - w-news
    goal: 2
    tag: 약속
    icon: bell
    why: come find you는 환자가 와서 묻게 하지 않고 내가 찾아가겠다는 약속이라 기다리는 부담을 덜어요. as soon as로 시점을 소식이 생기는 때에 맞추면 지키지 못할 시각을 말하지 않아도 돼요.
    decoy: when you leave
    distractorsKo:
    - 담요 하나 가져다 드릴게요.
    - 대기실 TV를 켜 드릴게요.
    blank:
      answer: as soon as
      options:
      - en: as soon as
      - en: unless
      - en: although
      - en: even if
  nuance:
  - kind: slider
    words:
    - w-shortly
    - w-update
    cue: 'Nurse: "The doctor is two patients away — maybe ten minutes."'
    scale:
    - right away
    - shortly
    - later
    answerAt: 1
    why: 몇 분 안쪽이면 shortly예요. right away는 '지금 당장'이라 지키지 못할 약속이 되고, later는 언제인지 알 수 없어 기다리는 환자에게 더 막연하게 들려요.
    example: The doctor will be with you shortly.
    exKo: 곧 의사가 올 거예요.
  - kind: swap
    words:
    - w-first
    - w-explain
    who: 환자에게 · 진료 순서 설명
    icon: me
    before:
    - 'Patients with life-threatening issues are '
    - triaged by acuity
    - .
    options:
    - seen first
    - triaged by acuity
    - more important than you
    answer: seen first
    notes:
      seen first: 순서의 기준만 쉬운 말로 알린다. 환자를 깎아내리지 않는다.
      triaged by acuity: 의료진끼리의 말. 환자는 acuity가 무슨 뜻인지 모른다.
      more important than you: 환자 자신을 덜 중요한 사람으로 만드는 말로 들려 불만을 키운다.
    why: 같은 트리아지 설명도 환자에게는 '위급한 분이 먼저 진료받는다'처럼 기준만 쉽게 말해요.
    ko: 생명이 위독한 환자분들이 먼저 진료를 받으세요.
  order:
    tag: 대화 흐름
    icon: compass
    ko: 대기 지연 불만 응대 4문장 순서
    why: 사과가 먼저, 대기가 긴 이유가 그 뒤를 받고('That's because'), 이유를 알린 상태에서 순서를 확인하고('With that in mind'), 확인한 결과를 직접 알려 주는('Whatever I find out') 흐름이에요.
    lines:
    - en: I'm sorry the wait has been so long.
      icon: faceWorried
      ko: 오래 기다리게 해서 죄송해요
      note: 사과
    - en: That's because the sickest patients are seen first.
      icon: siren
      ko: 가장 위급한 분들이 먼저 진료를 받기 때문이에요
      note: 이유
    - en: With that in mind, I'll check on your place in line.
      icon: magnify
      ko: 그걸 감안해서 대기 순서를 확인할게요
      note: 확인
    - en: Whatever I find out, I'll come tell you myself.
      icon: bell
      ko: 무엇을 알게 되든 제가 직접 알려 드릴게요
      note: 보고
