- title: 패혈증성 쇼크 조기 인지
  s:
  - {t: "우려 전달", i: faceWorried, w: "관찰한 사실(warm, racing)을 먼저 말하고 concerned로 걱정을 이어요. 열과 빠른 맥박은 감염에 대한 몸의 반응이라 패혈증을 의심하는 단서예요.", d: "about the cost", k: ["몸이 따뜻하니 이불을 걷어 드릴게요", "심장이 빠르니 심전도를 붙일게요"], a: "racing", o: ["slowing", "skipping", "fluttering"]}
  - {t: "감염원 문진", i: magnify, w: "Where do you think …?로 환자 자신의 생각을 물으면 최근의 기침·배뇨통·상처를 스스로 떠올려요. 패혈증은 감염원을 찾아야 치료 방향이 정해져요.", d: "this morning", k: ["언제부터 열이 났는지 말씀해 주시겠어요?", "최근에 여행을 다녀오셨나요?"], a: "infection", o: ["bleeding", "pain", "swelling"]}
  - {t: "치료 시작", i: lab, w: "and로 세 가지를 한 호흡에 이어 말해 지금 한꺼번에 진행 중임을 알려요. 배양과 젖산은 패혈증 초기 검사이고, 수액은 바로 시작하는 기본 치료예요.", d: "for the doctor", k: ["소변과 대변 검사를 같이 할게요", "흉부 엑스레이를 찍을 거예요"], a: "fast", o: ["slowly", "later", "gently"]}
  - {t: "순서 이유", i: lab, w: "before로 순서를 못 박아 왜 배양이 먼저인지 알려요. 항생제가 들어가면 배양에서 균이 안 자랄 수 있어서 먼저 채취해요. 단, 검체 때문에 항생제를 크게 늦추지는 않아요.", d: "after the doctor", k: ["항생제는 정맥으로 들어갈 거예요", "항생제 알레르기가 있으신지 볼게요"], a: "before", o: ["after", "until", "while"]}
  - {t: "증상 설명", i: faceWorried, w: "can be an early sign으로 가능성만 말해 단정과 환자 탓을 피해요. 갑작스러운 혼란은 뇌로 가는 혈류가 줄거나 감염이 몸 전체로 퍼졌다는 신호일 수 있어요.", d: "of old age", k: ["혼란스러운 건 약 때문일 수 있어요", "혼란스러운 건 잠을 못 자서일 수 있어요"], a: "confused", o: ["drowsy", "shaky", "cold"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "패혈증 의심 설명 4문장 순서"
    why: "걱정을 전하고, 감염원을 묻고, 생각하는 동안 채취를 알리고, 채취가 끝나면 항생제와 수액을 시작한다고 이어요. 'it'·'that'·'those'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "You feel warm and your heart is racing — I'm concerned about infection.", icon: faceWorried, ko: "몸이 따뜻하고 심장이 빨리 뛰네요 — 감염이 걱정돼요", note: "우려"}
    - {en: "Where do you think it might be coming from?", icon: magnify, ko: "어디에서 시작됐다고 생각하세요?", note: "감염원"}
    - {en: "While you think about that, we're drawing blood cultures and lactate.", icon: lab, ko: "생각하시는 동안 혈액배양과 젖산을 채취할게요", note: "채취"}
    - {en: "Once those are drawn, we'll start antibiotics and fluids.", icon: bandage, ko: "채취가 끝나면 항생제와 수액을 시작할게요", note: "치료"}
  ctx: {word: "infection", ko: "감염"}
- title: 심인성 쇼크 감별
  s:
  - {t: "방사통 문진", i: magnify, w: "spread to …로 통증이 퍼지는 방향을 묻고 arm or jaw로 부위를 두 곳 짚어 줘요. 팔이나 턱으로 퍼지는 가슴 압박감은 심장 원인을 시사해요.", d: "after you eat", k: ["가슴이 두근거리면서 아프신가요?", "숨을 들이쉴 때 더 아픈가요?"], a: "jaw", o: ["wrist", "knee", "ankle"]}
  - {t: "호흡 문진", i: me, w: "harder to …로 비교해 묻고 when you lie flat으로 조건을 줘요. 누우면 숨이 더 차는 것은 폐에 물이 차는 심부전의 단서가 될 수 있어요.", d: "when you walk", k: ["숨 쉴 때 쌕쌕 소리가 나나요?", "기침할 때 가래가 나오나요?"], a: "harder", o: ["easier", "safer", "better"]}
  - {t: "검사 안내", i: stetho, w: "now로 지금 바로 한다고 말해 급한 상황임을 전해요. 심전도는 심장 이상을, 폐 청진은 폐에 물이 찼는지를 확인해요.", d: "in the morning", k: ["흉부 엑스레이를 찍으러 가요", "피검사 결과를 기다리고 있어요"], a: "lungs", o: ["belly", "neck", "legs"]}
  - {t: "위험 신호", i: siren, w: "needs urgent attention으로 기다려도 되는 증상이 아님을 분명히 해요. 턱으로 퍼지는 압박감은 심근경색 같은 급한 원인을 시사해서 바로 평가해요.", d: "a quick rest", k: ["가슴 압박감이 있으면 바로 말씀해 주세요", "움직이지 말고 누워 계세요"], a: "urgent", o: ["routine", "regular", "casual"]}
  - {t: "청진 안내", i: stetho, w: "Let's로 함께 한다는 느낌을 주고 now로 곧바로 시작함을 알려요. 심음과 폐음을 함께 들으면 심장이 약해져 폐에 물이 찼는지 알아볼 수 있어요.", d: "again later", k: ["이제 배를 눌러 볼게요", "이제 다리 부종을 볼게요"], a: "heart", o: ["belly", "throat", "ears"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "심인성 쇼크 감별 4문장 순서"
    why: "통증이 퍼지는지 묻고, 그렇다면 급하다고 알리며 심전도를 시작하고, 심전도가 도는 동안 호흡을 묻고, 답을 받아 청진으로 넘어가요. 'it does'·'the ECG'·'that helps'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Does the chest heaviness spread to your arm or jaw?", icon: magnify, ko: "가슴 압박감이 팔이나 턱으로 퍼지나요?", note: "문진"}
    - {en: "If it does, that needs urgent attention, so we're getting an ECG now.", icon: siren, ko: "그렇다면 긴급해서 지금 심전도를 찍을게요", note: "검사"}
    - {en: "While the ECG runs, is it harder to breathe when you lie flat?", icon: me, ko: "심전도가 도는 동안, 누우면 숨쉬기 더 힘드세요?", note: "호흡"}
    - {en: "Thanks, that helps. Let's listen to your heart and lungs now.", icon: stetho, ko: "고마워요, 도움이 돼요. 이제 심장과 폐 소리를 들어볼게요", note: "청진"}
  sw: {ko: "누우면 숨쉬기가 더 힘드세요?"}
- title: 아나필락시스 분포성 쇼크
  s:
  - {t: "투약 안내", i: siren, w: "right now로 지체 없이 바로 준다고 알려요. 아나필락시스의 첫 치료는 에피네프린 근육주사이고, 허벅지 바깥쪽에 놓는 것이 표준이에요.", d: "in your arm", k: ["지금 항히스타민제를 드릴게요", "지금 스테로이드를 정맥으로 드릴게요"], a: "thigh", o: ["arm", "hip", "shoulder"]}
  - {t: "유발 확인", i: magnify, w: "eat or take로 음식과 약을 한 번에 묻고 before this started로 시점을 못 박아요. 아나필락시스의 흔한 원인은 음식·약·벌레 독이라 노출을 먼저 확인해요.", d: "at lunch", k: ["평소에 알레르기 약을 드시나요?", "전에도 이런 적이 있었나요?"], a: "started", o: ["ended", "changed", "stopped"]}
  - {t: "증상 확인", i: faceWorried, w: "throat or tongue으로 기도와 이어지는 두 부위를 짚어 물어요. 목이나 혀가 조이거나 붓는 것은 기도가 막힐 수 있다는 위험 신호예요.", d: "when you swallow", k: ["입술이 가려우세요?", "피부에 두드러기가 났나요?"], a: "tight", o: ["dry", "numb", "sore"]}
  - {t: "경과 관찰", i: monitor, w: "while …로 약이 듣는 동안 곁을 지킨다고 알려요. 에피네프린이 듣는 동안에도 기도 증상이 나빠질 수 있어서 계속 지켜봐요.", d: "from the door", k: ["효과가 없으면 한 번 더 놓을게요", "주사 놓은 자리를 눌러 드릴게요"], a: "airway", o: ["skin", "pulse", "pupils"]}
  - {t: "상태 설명", i: bulb, w: "can mean으로 지금 증상이 무엇을 뜻하는지 쉬운 말로 알려요. 두드러기에 목 조임이 겹치면 한 곳의 알레르기를 넘어 전신 반응일 수 있어요.", d: "from stress", k: ["피부 발진은 약으로 가라앉힐 수 있어요", "이런 반응이 생긴 건 처음이세요?"], a: "serious", o: ["mild", "minor", "slight"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "아나필락시스 대응 4문장 순서"
    why: "증상을 확인하고, 심한 반응이라 바로 주사한다고 알리고, 약이 듣는 동안 기도를 본다고 하고, 가라앉은 뒤 원인을 묻습니다. 'That'·'it'·'this settles down'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Does your throat or tongue feel tight?", icon: faceWorried, ko: "목이나 혀가 조이는 느낌이 있으세요?", note: "증상"}
    - {en: "That could be a serious allergic reaction, so I'm giving you epinephrine in your thigh right now.", icon: siren, ko: "심한 알레르기 반응일 수 있어서 지금 허벅지에 에피네프린을 놓을게요", note: "투약"}
    - {en: "While it works, I'll watch your airway closely.", icon: monitor, ko: "듣는 동안 기도를 꼼꼼히 지켜볼게요", note: "관찰"}
    - {en: "Once this settles down, what did you eat or take before it started?", icon: magnify, ko: "가라앉으면 시작 전에 무엇을 드셨거나 복용하셨는지 알려 주세요", note: "원인"}
  ctx: {word: "epinephrine", ko: "에피네프린"}
- title: 수액 반응성 평가
  s:
  - {t: "결과 안내", i: chartup, w: "After the fluid로 시점을 먼저 짚고 came up a little로 변화를 사실대로 전해요. 수액 뒤의 혈압 변화는 쇼크가 수액에 반응하는지 보는 첫 지표예요.", d: "since morning", k: ["수액이 거의 다 들어갔어요", "팔이 아프면 말씀해 주세요"], a: "up", o: ["down", "off", "back"]}
  - {t: "지표 설명", i: monitor, w: "as a good sign으로 소변량이 왜 중요한지 이유를 같이 알려요. 소변량은 신장으로 가는 혈류, 즉 장기 관류가 회복되는지 보여 주는 지표예요.", d: "every minute", k: ["소변을 보시면 컵에 받아 주세요", "침대에서 일어나지 말고 쉬세요"], a: "good", o: ["bad", "warning", "first"]}
  - {t: "계획 안내", i: compass, w: "If you don't improve로 조건을 앞에 두면 지금 상태가 나쁘다는 선언이 아니라 대비책임이 분명해져요. 수액에 반응하지 않으면 승압제 등 치료를 더하는 것이 쇼크의 단계적 접근이에요.", d: "by tonight", k: ["호전되면 퇴원 준비를 할게요", "수액을 잠시 쉬고 지켜볼게요"], a: "add", o: ["stop", "skip", "cancel"]}
  - {t: "재측정 안내", i: stetho, w: "recheck의 re-는 이미 쟀고 다시 잰다는 뜻이에요. bolus는 짧은 시간에 한꺼번에 주는 수액이라, 끝난 뒤 반응을 다시 재서 확인해요.", d: "before lunch", k: ["볼루스 중에는 팔을 움직이지 마세요", "볼루스를 한 번 더 드릴 거예요"], a: "after", o: ["before", "during", "without"]}
  - {t: "계획 안내", i: compass, w: "stays low는 한 번이 아니라 계속 낮은 경우를 가리켜요. may로 정해진 계획이 아니라 상황에 따른 가능성임을 전해요.", d: "this evening", k: ["소변이 안 나오면 소변줄을 넣을 수도 있어요", "소변량은 시간마다 적어 둘게요"], a: "low", o: ["high", "steady", "normal"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수액 반응 평가 4문장 순서"
    why: "수액 뒤의 혈압을 전하고, 좋은 신호라며 재측정을 예고하고, 그때까지 소변량을 본다고 하고, 둘 다 호전이 없으면 치료를 더한다고 마무리해요. 'That'·'Until then'·'neither one'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "After the fluid, your pressure came up a little.", icon: chartup, ko: "수액 뒤에 혈압이 조금 올랐어요", note: "결과"}
    - {en: "That's a good sign. We'll recheck your blood pressure after the bolus.", icon: stetho, ko: "좋은 신호예요. 볼루스 뒤에 혈압을 다시 잴게요", note: "재측정"}
    - {en: "Until then, we're watching your urine output as another sign.", icon: monitor, ko: "그때까지 소변량도 또 다른 신호로 보고 있어요", note: "소변량"}
    - {en: "If neither one improves, we'll add another treatment.", icon: compass, ko: "둘 다 호전이 없으면 다른 치료를 더할게요", note: "계획"}
  ctx: {word: "output", ko: "배출량"}
- title: 승압제 시작 전 설명
  s:
  - {t: "약 설명", i: pill, w: "raise and hold로 올리는 일과 유지하는 일을 나눠 말해 약이 계속 필요한 이유를 알려요. 승압제는 혈관을 조여 혈압을 목표 수준으로 유지하게 도와요.", d: "by itself", k: ["이 약은 통증을 줄여 줘요", "이 약은 심장 박동을 느리게 해요"], a: "hold", o: ["lower", "change", "reset"]}
  - {t: "라인 설명", i: bandage, w: "so it works …로 목에 라인을 쓰는 이유를 목적으로 밝혀요. 승압제는 팔의 가는 혈관으로 새면 조직이 상할 수 있어서 보통 큰 혈관의 중심정맥관을 선호해요.", d: "for the doctor", k: ["목 라인은 소독하고 나서 쓸 거예요", "목 라인은 이틀 뒤에 뺄 거예요"], a: "quickly", o: ["slowly", "gently", "quietly"]}
  - {t: "감시 안내", i: monitor, w: "very closely로 평소보다 더 자주 본다고 알려 안심시켜요. 승압제 용량은 혈압에 맞춰 계속 조절해서 연속 모니터링과 잦은 측정이 따라와요.", d: "from home", k: ["들어가는 동안 침대에서 움직이지 마세요", "불편하면 호출벨을 눌러 주세요"], a: "closely", o: ["quickly", "quietly", "briefly"]}
  - {t: "공감", i: faceWorried, w: "It's okay to …로 감정을 정상으로 인정해 줘요. 새 약과 집중 치료는 환자를 긴장시키므로 설명 전에 감정부터 받아 주는 것이 좋아요.", d: "for the team", k: ["궁금한 건 언제든 물어보세요", "가족분께도 설명해 드릴게요"], a: "nervous", o: ["angry", "tired", "lonely"]}
  - {t: "라인 설명", i: bandage, w: "placed로 이미 넣었다고 과거형으로 말해 지금 보이는 라인이 무엇인지 알려요. 중심정맥관은 약이 큰 혈관으로 바로 들어가 빨리 퍼져요.", d: "while you slept", k: ["이 라인으로 피도 뽑을 수 있어요", "이 라인은 오늘 안에 뺄 거예요"], a: "placed", o: ["removed", "cleaned", "flushed"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "승압제 시작 설명 4문장 순서"
    why: "약의 역할을 알리고, 그 약이 들어가는 길을 설명하고, 라인이 들어간 뒤의 감시를 알리고, 가까이서 보는 것이 이 약에서는 정상이라며 긴장을 받아 줍니다. 'It'·'the line'·'this close'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'd like to start a medicine to raise and hold your blood pressure.", icon: pill, ko: "혈압을 올리고 유지하는 약을 시작하려고 해요", note: "약"}
    - {en: "It goes through a line in your neck, so it works quickly.", icon: bandage, ko: "목의 라인으로 들어가서 빨리 작용해요", note: "라인"}
    - {en: "Once the line is in, we'll watch you very closely while it runs.", icon: monitor, ko: "라인이 들어가면 약이 들어가는 동안 꼼꼼히 지켜볼게요", note: "감시"}
    - {en: "Having us this close is normal for this medicine, and it's okay to feel nervous.", icon: faceWorried, ko: "이 약은 가까이서 보는 게 정상이고, 긴장되는 것도 자연스러워요", note: "공감"}
  ctx: {word: "hold", ko: "유지하다"}
- title: 항응고제 복용 저혈압
  s:
  - {t: "복약 확인", i: pill, w: "Which …로 이름을, when …으로 마지막 시점을 한 문장에서 물어요. 항응고제는 종류에 따라 작용 시간과 해독 방법이 달라서 이름과 마지막 복용 시각이 모두 필요해요.", d: "for your heart", k: ["약은 식사 전에 드시나요, 후에 드시나요?", "약을 누가 챙겨 주시나요?"], a: "last", o: ["first", "next", "usual"]}
  - {t: "출혈 징후", i: magnify, w: "명사만 나열한 짧은 문진이에요. 항응고제를 쓰는 사람은 넘어짐(머리 외상), 멍, 검은 변이 숨은 출혈의 단서라 세 가지를 같이 물어요.", d: "last year", k: ["코피나 잇몸 출혈은 있으세요?", "소변에 피가 섞여 나오나요?"], a: "bruising", o: ["itching", "burning", "cramping"]}
  - {t: "검사 안내", i: lab, w: "right away로 곧바로 한다고 알려요. 혈구 수는 출혈로 빈혈이 생겼는지, 응고 검사는 항응고제가 얼마나 작용 중인지 보여 줘요.", d: "on Monday", k: ["소변 검사와 심전도를 같이 할게요", "간 기능 검사는 내일 할게요"], a: "count", o: ["sugar", "type", "pressure"]}
  - {t: "위험 설명", i: bulb, w: "quietly로 겉으로 피가 안 보여도 혈압이 떨어질 수 있다는 점을 짚어요. 항응고제를 쓰면 몸속 출혈이 오래 모르게 진행될 수 있어요.", d: "from outside", k: ["혈압이 낮으면 피가 묽다는 뜻이에요", "항응고제를 오래 먹으면 혈압이 떨어져요"], a: "quietly", o: ["loudly", "visibly", "rarely"]}
  - {t: "복용 확인", i: pill, w: "Let's ask if …로 확인을 함께 하는 일로 말해 추궁하는 느낌을 피해요. 약을 거르거나 더 먹은 경우 모두 응고 수치에 영향을 줘서 둘 다 물어요.", d: "on purpose", k: ["약을 바꾼 적이 있는지 여쭤볼게요", "약값이 부담되는지 여쭤볼게요"], a: "missed", o: ["refilled", "shared", "changed"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항응고제 복용 확인 4문장 순서"
    why: "약 이름과 마지막 복용 시각을 묻고, 그 뒤로 출혈 징후를 묻고, 해당되면 검사를 알린 뒤, 검사를 하는 이유를 설명해요. 'since then'·'those'·'That's because'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Which blood thinner do you take, and when was your last dose?", icon: pill, ko: "어떤 항응고제를 드시고 마지막 복용은 언제였나요?", note: "복약"}
    - {en: "Thanks. Any falls, bruising, or dark stools since then?", icon: magnify, ko: "고마워요. 그 뒤로 넘어지거나 멍이 들거나 검은 변을 보셨나요?", note: "징후"}
    - {en: "If any of those happened, we're checking your blood count and clotting right away.", icon: lab, ko: "그중 하나라도 있었다면 혈구 수와 응고 기능을 바로 확인할게요", note: "검사"}
    - {en: "That's because bleeding inside can quietly drop your blood pressure.", icon: bulb, ko: "안에서 출혈이 있으면 혈압이 조용히 떨어질 수 있어서예요", note: "이유"}
  sw: {ko: "혹시 항응고제를 드시고 계세요?"}
