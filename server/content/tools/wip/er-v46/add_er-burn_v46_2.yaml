- title: 초기 냉각·세척
  s:
  - {t: "냉각 안내", i: bandage, w: "to stop the heat로 왜 헹구는지 목적을 붙여요. 열이 피부에 남아 있으면 계속 깊이 타 들어가서 흐르는 시원한 물로 식혀요.", d: "to stop the bleeding", k: ["물집은 터뜨리지 않을 거예요", "통증 때문에 진통제를 먼저 드릴게요"], a: "cool", o: ["hot", "soapy", "icy"]}
  - {t: "주의 사항", i: shield, w: "so we don't…로 금지의 이유를 붙이면 환자가 얼음을 달라고 하지 않아요. 얼음은 혈관을 수축시키고 이미 다친 피부에 추가 손상을 줄 수 있어요.", d: "for the pain", k: ["얼음 대신 마른 거즈로 덮을게요", "추우면 담요를 가져다 드릴게요"], a: "avoid", o: ["add", "need", "prefer"]}
  - {t: "증상 보고", i: bell, w: "if you start로 지금은 괜찮아도 시작되면 알려 달라고 미리 부탁해요. 넓은 화상을 오래 식히면 체온이 떨어질 수 있어서 오한이 첫 신호예요.", d: "when you finish", k: ["물 온도가 괜찮은지 알려 주세요", "통증이 심해지면 말씀해 주세요"], a: "shivery", o: ["itchy", "tight", "sweaty"]}
  - {t: "시간 안내", i: calendar, w: "for about으로 정확한 초가 아니라 대략 20분이라고 말해 환자가 기대를 맞춰요. 열화상은 보통 20분 정도 흐르는 물로 식히는 것이 권고돼요.", d: "until tomorrow", k: ["10분 뒤에 다시 와서 볼게요", "헹군 뒤에 붕대를 감을게요"], a: "twenty", o: ["two", "five", "sixty"]}
  - {t: "온도 주의", i: faceWorried, w: "but으로 도움이 되는 점과 해로운 점을 대비해요. 너무 찬물은 혈관을 수축시키고 체온을 떨어뜨려 오히려 손상과 저체온 위험을 키워요.", d: "can warm you", k: ["물은 계속 흐르게 둘게요", "수돗물도 충분히 깨끗해요"], a: "hurt", o: ["warm", "heal", "calm"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "초기 냉각 4문장 순서"
    why: "시원한 물로 헹군다고 알리고, 얼음은 쓰지 않는 이유를 말하고, 그래도 추위가 오면 알리게 한 뒤, 오한이 뜻하는 것과 조치를 닫아요. 'Cool is enough'·'Even so'·'A chill'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We'll rinse the burn with cool water to stop the heat.", icon: bandage, ko: "열을 멈추려고 시원한 물로 헹굴게요", note: "냉각"}
    - {en: "Cool is enough — ice would damage the skin further.", icon: shield, ko: "시원한 정도면 충분해요 — 얼음은 피부를 더 상하게 해요", note: "이유"}
    - {en: "Even so, tell me if the water makes you feel cold or shivery.", icon: bell, ko: "그래도 물 때문에 춥거나 오한이 들면 말씀해 주세요", note: "보고"}
    - {en: "A chill means the water is cooling you too much, so we'll stop and warm you up.", icon: me, ko: "오한은 물이 너무 식힌다는 뜻이라 멈추고 따뜻하게 해 드릴게요", note: "조치"}
  ctx: {word: "cold", ko: "추운", sc: {2: {en: "You're getting cold, which means you're developing hypothermia.", fix: "You feel cold because of the water, so I'll stop rinsing and get you a warm blanket."}}}
- title: 통증 척도·기전 청취
  s:
  - {t: "노출 문진", i: magnify, w: "what caused와 how long을 한 문장에 묶어 원인과 노출 시간을 함께 물어요. 열이 닿은 시간이 길수록 화상이 깊어져서 시간이 중요한 정보예요.", d: "were you sleeping", k: ["파상풍 주사는 언제 맞으셨어요?", "처음에 응급처치를 하셨나요?"], a: "exposed", o: ["injured", "treated", "wrapped"]}
  - {t: "흡입 위험", i: bell, w: "enclosed, smoky 두 낱말로 흡입 손상 위험 단서를 한 번에 물어요. 밀폐된 공간의 연기는 기도와 폐 손상 위험을 높이는 대표 단서예요.", d: "Did you stay in", k: ["연기를 마신 뒤 기침이 났나요?", "불이 난 곳에서 직접 나오셨나요?"], a: "smoky", o: ["noisy", "crowded", "bright"]}
  - {t: "통증 점수", i: chartup, w: "On a scale of로 범위를 먼저 알려 주면 환자가 숫자로 답하기 쉬워요. 같은 척도를 계속 쓰면 치료 뒤 통증이 줄었는지 비교할 수 있어요.", d: "of one to five", k: ["통증이 언제부터 시작됐나요?", "통증 때문에 움직이기 힘드세요?"], a: "scale", o: ["list", "map", "clock"]}
  - {t: "원인 구분", i: bulb, w: "보기를 셋 주면 환자가 설명 대신 하나만 고르면 돼서 급할 때 빨라요. 열·불·화학물질은 처치가 달라서 처음에 가려야 해요.", d: "or a shock", k: ["몇 시쯤 화상을 입으셨나요?", "화상을 입은 곳이 어디였나요?"], a: "chemical", o: ["cream", "medicine", "bandage"]}
  - {t: "위험 설명", i: bell, w: "can으로 가능성을 말해 겁주지 않으면서 이유를 알려요. 연기를 들이마시면 뜨거운 가스와 그을음이 기도를 붓게 하고 폐를 자극해요.", d: "your eyes and ears", k: ["산소 수치를 확인해 볼게요", "코와 입 주변을 살펴볼게요"], a: "hurt", o: ["warm", "clean", "cool"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "기전 청취 4문장 순서"
    why: "원인을 묻고, 연기 공간에 있었는지 묻고, 그 질문을 하는 이유를 설명한 뒤, 마지막으로 통증 점수를 물어요. 'it'·'That'·'Last question'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Was it hot water, fire, or a chemical?", icon: bulb, ko: "뜨거운 물이었나요, 불이었나요, 화학물질이었나요?", note: "원인"}
    - {en: "Were you in an enclosed, smoky space during it?", icon: bell, ko: "그때 밀폐되고 연기 찬 공간에 있었나요?", note: "연기"}
    - {en: "That matters because breathing in smoke can hurt your lungs and airway.", icon: lab, ko: "연기를 마시면 폐와 기도가 상할 수 있어서 중요해요", note: "이유"}
    - {en: "Last question: on a scale of zero to ten, how bad is the pain?", icon: chartup, ko: "마지막 질문, 0에서 10까지 통증이 얼마나 심하세요?", note: "통증"}
- title: 흡입 손상 의심
  s:
  - {t: "구강 확인", i: magnify, w: "I need to로 필요해서 하는 일이라고 알려 환자가 입을 벌리는 데 협조해요. 입과 목구멍의 그을음이나 붓기는 흡입 손상을 가늠하는 단서예요.", d: "look behind", k: ["산소 마스크를 씌워 드릴게요", "목 주변 부기를 만져 볼게요"], a: "mouth", o: ["ears", "eyes", "hands"]}
  - {t: "증상 문진", i: speech, w: "voice changed와 hurt to swallow 두 가지를 한 번에 물어 하나만 해당해도 말하게 해요. 쉰 목소리와 삼킴 통증은 기도 부종이 시작됐다는 신호일 수 있어요.", d: "last night", k: ["기침할 때 검은 가래가 나오나요?", "숨 쉴 때 쌕쌕 소리가 나나요?"], a: "voice", o: ["vision", "hearing", "mood"]}
  - {t: "기도 계획", i: shield, w: "may need로 아직 확정이 아니라 가능성이라고 알려 환자가 놀라지 않게 해요. 흡입 손상은 기도 부종이 몇 시간에 걸쳐 진행해서 막히기 전에 관을 넣는 쪽이 안전해요.", d: "after the scan", k: ["산소 수치는 지금 괜찮아요", "목을 쉬게 하려고 말을 줄이세요"], a: "protect", o: ["close", "block", "lower"]}
  - {t: "소견 전달", i: magnify, w: "I see로 본 것을 그대로 말해 진단을 단정하지 않아요. 입·코 주변과 가래의 그을음은 뜨거운 연기를 들이마셨다는 단서예요.", d: "on your shoes", k: ["코와 입 주변이 붉게 부었어요", "코에 산소 튜브를 걸어 드릴게요"], a: "soot", o: ["pollen", "paint", "chalk"]}
  - {t: "즉시 보고", i: bell, w: "right away로 기다리지 말고 바로 알려 달라고 분명히 해요. 흡입 손상에서는 숨쉬기가 갑자기 어려워질 수 있어서 변화를 빨리 아는 것이 중요해요.", d: "when you can", k: ["숨이 가쁠 때는 앉아서 쉬어 보세요", "목이 따갑거나 쉬면 알려 주세요"], a: "right away", o: ["tomorrow", "next week", "after lunch"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "흡입 손상 의심 4문장 순서"
    why: "입안을 보겠다고 알리고, 본 소견을 말하고, 그 소견 때문에 증상을 묻고, 어떤 답이든 숨쉬기가 힘들어지면 바로 알리라고 닫아요. 'I see'·'Because of that'·'In any case'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I need to look inside your mouth and throat.", icon: magnify, ko: "입과 목구멍 안을 살펴봐야 해요", note: "안내"}
    - {en: "I see soot around your mouth and nose.", icon: magnify, ko: "입과 코 주변에 그을음이 보이네요", note: "소견"}
    - {en: "Because of that, has your voice changed or does it hurt to swallow?", icon: speech, ko: "그래서 목소리가 변했거나 삼킬 때 아프신가요?", note: "문진"}
    - {en: "In any case, tell me right away if breathing gets harder.", icon: bell, ko: "어떤 경우든 숨쉬기가 힘들어지면 바로 말씀해 주세요", note: "보고"}
  sw: {ko: "그의 입과 코 주변에 그을음이 보여요"}
- title: 대면적 화상 수액소생
  s:
  - {t: "수액 이유", i: bulb, w: "so로 원인과 대책을 한 문장에 이어요. 큰 화상은 혈관에서 체액이 새어 나가 혈압이 떨어질 수 있어서 너무 적게도 많게도 주지 않으려고 신중히 보충해요.", d: "right away", k: ["정맥 주사를 두 군데 확보할게요", "체중을 먼저 재 볼게요"], a: "replace", o: ["drain", "hide", "remove"]}
  - {t: "소변량 측정", i: lab, w: "to make sure로 측정의 목적을 밝혀요. 소변량은 수액이 장기로 충분히 가고 있는지 알려 주는 가장 쉬운 지표예요.", d: "right now", k: ["소변 색이 어두워지면 알려 주세요", "피검사로 신장 수치도 볼게요"], a: "urine", o: ["sweat", "saliva", "tears"]}
  - {t: "증상 보고", i: bell, w: "if you feel로 증상이 느껴지면 말해 달라고 환자에게 역할을 줘요. 갈증과 심한 피로는 체액이 모자라다는 몸의 신호일 수 있어요.", d: "after you drink", k: ["소변이 마려우면 알려 주세요", "어지러우면 눕혀 드릴게요"], a: "thirsty", o: ["itchy", "greasy", "sticky"]}
  - {t: "수액 계산", i: board, w: "using으로 계산에 쓰는 두 재료를 분명히 말해요. 화상 수액은 체중과 화상 면적을 공식에 넣어 첫 24시간 양을 정해요.", d: "using your height", k: ["화상 크기는 나중에 다시 확인할게요", "수액 속도는 소변량을 보고 조절할게요"], a: "weight", o: ["height", "birthday", "insurance"]}
  - {t: "결과 해석", i: chartup, w: "tells us로 수치가 알려 주는 것을 말해 줘요. 소변량이 목표 범위면 장기로 가는 혈류가 충분하다는 뜻이라 수액 속도를 조절하는 기준이 돼요.", d: "is leaking", k: ["소변량은 한 시간마다 확인할게요", "소변 색도 함께 볼게요"], a: "working", o: ["spilling", "expiring", "freezing"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수액 소생 4문장 순서"
    why: "체액 손실과 보충을 알리고, 그 양을 계산하는 재료를 말하고, 양이 맞는지 소변으로 확인한다고 설명한 뒤, 결과가 뜻하는 바를 닫아요. 'the amount'·'To check that amount'·'a good result'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Large burns lose fluid, so we replace it carefully.", icon: bulb, ko: "넓은 화상은 체액이 빠져나가서 조심스럽게 보충해요", note: "이유"}
    - {en: "We calculate the amount using your weight and burn size.", icon: board, ko: "체중과 화상 크기로 그 양을 계산해요", note: "계산"}
    - {en: "To check that amount, we measure your urine.", icon: lab, ko: "그 양이 맞는지 소변량을 측정해요", note: "측정"}
    - {en: "A good result tells us the fluid is working.", icon: chartup, ko: "결과가 좋으면 수액이 잘 듣고 있다는 뜻이에요", note: "결과"}
  sw: {ko: "넓은 화상은 몸에서 체액이 빠져나가게 해서 수액을 많이 드리고 있어요"}
- title: 화학 화상
  s:
  - {t: "물질 확인", i: lab, w: "its name까지 물어 정확한 이름을 얻어요. 물질 이름이 있으면 안전 자료나 독극물 센터에서 맞는 처치를 찾을 수 있어요.", d: "from the label", k: ["피부에 닿은 지 얼마나 됐나요?", "냄새나 연기가 났나요?"], a: "name", o: ["price", "age", "address"]}
  - {t: "처치 원칙", i: shield, w: "not neutralize로 하지 않을 일을 짚어 줘요. 산과 염기를 서로 섞어 중화하면 열이 나서 화상이 더 나빠질 수 있어 물로 씻어 내요.", d: "and scrub it", k: ["묻은 가루가 있으면 먼저 털어낼게요", "물이 닿는 부위를 잘 봐 주세요"], a: "water", o: ["soap", "alcohol", "vinegar"]}
  - {t: "지속 요청", i: me, w: "Keep …로 멈추지 말고 이어 가라는 부탁이에요. 흐르는 물은 피부에 남은 화학물질을 계속 씻어 내서 손상이 더 깊어지는 것을 막아요.", d: "this cools", k: ["물이 너무 차가우면 말씀해 주세요", "눈에 들어가지 않게 조심하세요"], a: "removes", o: ["adds", "hides", "spreads"]}
  - {t: "옷 제거", i: bandage, w: "any로 조금이라도 묻은 옷은 모두 벗긴다는 뜻이에요. 옷에 남은 화학물질이 계속 피부를 태우기 때문에 서둘러 벗겨요.", d: "with scissors", k: ["옷은 따로 비닐봉투에 담아 둘게요", "눈에 들어갔는지도 확인할게요"], a: "take off", o: ["put on", "hand over", "fold up"]}
  - {t: "시간 안내", i: calendar, w: "at least로 최소 시간을 못 박아 중간에 멈추지 않게 해요. 화학 화상은 보통 20분 이상 씻고, 알칼리처럼 더 오래 씻어야 하는 물질도 있어요.", d: "if possible", k: ["물이 닿지 않게 비닐로 덮어 드릴게요", "헹구는 중에 통증이 줄면 말씀해 주세요"], a: "keep", o: ["stop", "skip", "avoid"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "화학 화상 4문장 순서"
    why: "물질 이름을 묻고, 묻은 옷을 벗기고, 옷을 벗은 채 많은 물로 헹구고, 20분 이상 계속하게 해요. 'it'·'With them off'·'keep rinsing'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "What chemical was it, and do you know its name?", icon: lab, ko: "어떤 화학물질이었고, 이름을 아세요?", note: "확인"}
    - {en: "Whatever it was, we'll take off any clothes with it on them.", icon: bandage, ko: "뭐든 그것이 묻은 옷은 벗을게요", note: "옷"}
    - {en: "With them off, we'll rinse your skin with lots of water, not neutralize it.", icon: shield, ko: "옷을 벗은 채 중화하지 않고 물을 많이 써서 헹굴게요", note: "헹굼"}
    - {en: "Please keep rinsing for at least twenty minutes.", icon: calendar, ko: "적어도 20분은 계속 헹궈 주세요", note: "시간"}
  sw: {ko: "화끈거림이 멎도록 물을 많이 써서 계속 헹굴게요"}
