- title: 열사병
  s:
  - t: 상태 설명
    i: siren
    w: dangerously high로 위험하다는 사실을 숨기지 않고 짧게 말해요. 이어서 we're cooling you fast로 지금 대처 중이라고 함께 알려야 혼란한 환자도 겁먹지 않고 협조해요.
    d: for a while
    k:
    - 제 손을 꽉 쥐어 보세요.
    - 성함이 어떻게 되세요?
    a: dangerously
    o:
    - slightly
    - usually
    - hardly
  - t: 냉각 설명
    i: bandage
    w: to bring it down으로 목적을 붙여 두 가지 처치가 하나의 목표라는 것이 보여요. 열사병에서는 체온을 빨리 내리는 것이 가장 중요해서 짧게 알려요.
    d: a few seconds
    k:
    - 눈을 떠 보세요.
    - 숨을 크게 쉬어 보세요.
    a: misting
    o:
    - turning
    - lifting
    - weighing
  - t: 의식 확인
    i: me
    w: name과 where you are 두 가지를 한 문장에 묻는 것은 의식과 지남력을 가볍게 확인하는 방법이에요. 열사병에서는 의식 변화가 핵심 징후라 대답이 또렷한지 보면서 자극하지 않는 말투로 물어요.
    d: last night
    k:
    - 체온을 다시 잴게요.
    - 어디가 가장 아프세요?
    a: where
    o:
    - why
    - when
    - how
  - t: 반응 확인
    i: handshake2
    w: Can you…for me?로 지시가 아니라 부탁의 형태라 혼란한 환자도 덜 놀라요. 손을 쥐게 하면 반응과 근력, 의식 상태를 한 번에 볼 수 있어요.
    d: your own
    k:
