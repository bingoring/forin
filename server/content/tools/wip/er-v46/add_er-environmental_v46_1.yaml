    why: 상태를 보고, 진찰하고, 진찰 결과를 바탕으로 입으로 마시기를 시작한 뒤, 부족할 때의 대안을 말해요. 'that exam'·'those sips'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
