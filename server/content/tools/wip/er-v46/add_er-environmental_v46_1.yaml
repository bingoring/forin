    - Leave
    - Move
  order:
    tag: 대화 흐름
    icon: compass
    ko: 열사병 응대 4문장 순서
    why: 상태와 냉각을 말하고, 그 상태에서 의식을 확인한 뒤, 묻는 이유를 알려요. 'it'·'those packs'·'asking'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Your body temperature is dangerously high, and we're cooling you fast.
      icon: siren
      ko: 체온이 위험할 정도로 높아서 빠르게 식히고 있어요
      note: 상태
    - en: We're putting cool packs and misting you to bring it down.
      icon: bandage
      ko: 체온을 낮추려고 찜질팩을 대고 분무를 하고 있어요
      note: 냉각
    - en: With those packs on, stay with me — can you tell me your name and where you are?
      icon: me
      ko: 팩을 댄 채로 정신 놓지 말고 성함과 어디인지 말해 주세요
      note: 의식
    - en: I'm asking because confusion can be a sign the heat is affecting you.
      icon: faceWorried
      ko: 혼란은 더위가 몸에 영향을 준다는 신호일 수 있어서 묻는 거예요
      note: 이유
  sw:
    ko: 빠르게 식혀 드리고 있어요, 괜찮아지실 거예요.
