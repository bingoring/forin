    - raise
    - wave
  - t: 안심
    i: shield
    w: We're going to로 곧 일어날 일을 미리 알려요. 혼란스러운 환자에게는 짧게 반복해서 말해 주는 것이 도움이 돼요.
    d: to you
    k:
    - 성함을 말씀해 주세요.
    - 숨이 차세요?
    a: temperature
    o:
    - weight
    - voice
    - cholesterol
  - t: 안심
    i: handshake2
    w: Stay with me는 의식을 놓지 말고 이어 가자는 말이에요. 대시 뒤에 짧은 안심을 붙이는데, 의식이 흐린 환자는 긴 설명보다 짧은 말과 목소리 톤에 반응해요.
    d: Sit up now
    k:
    - 체온이 아주 높아요.
    - 지금 식혀 드리고 있어요.
    a: Stay
    o:
