    - en: Let's check how dehydrated you are with a quick exam.
      icon: stetho
      ko: 간단히 진찰해서 얼마나 탈수됐는지 확인해 볼게요
      note: 진찰
    - en: Based on that exam, let's start with small sips of fluid.
      icon: coffee
      ko: 진찰 결과로 수분을 조금씩 마시는 것부터 시작해요
