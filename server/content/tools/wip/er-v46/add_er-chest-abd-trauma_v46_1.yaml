- title: 흉부외상 호흡 사정
  s:
  - {t: "호흡음 청진", i: stetho, w: "on both sides로 양쪽을 다 듣는다고 미리 알려 주면 청진기가 옮겨 가는 이유를 환자가 알아요. 흉부 외상에서는 양쪽 호흡음을 비교해 한쪽이 약한지 살펴봐요.", d: "for one minute", k: ["숨을 참고 계세요", "산소 마스크를 씌워 드릴게요"], a: "breathing", o: ["heartbeat", "voice", "cough"]}
  - {t: "정상 기준", i: magnify, w: "should는 정상이라면 이래야 한다는 기준을 말해요. 흉벽이 양쪽 똑같이 움직이는지는 한쪽 폐에 문제가 있는지 찾는 첫 단서예요.", d: "only on one side", k: ["가슴에 멍이 있는지 볼게요", "숨소리를 먼저 들어 볼게요"], a: "evenly", o: ["unevenly", "weakly", "separately"]}
  - {t: "증상 문진", i: faceWorried, w: "one side로 좌우를 나눠 물으면 환자가 비교해서 답하기 쉬워요. 한쪽만 다르게 느껴지면 그쪽 폐나 흉벽에 문제가 있는지 보는 단서가 돼요.", d: "after you cough", k: ["어느 쪽이 더 아픈지 말씀해 주세요", "숨쉬기가 아까보다 힘든가요?"], a: "different", o: ["normal", "equal", "stronger"]}
  - {t: "통증 위치", i: pushpin, w: "Point to …로 말 대신 손으로 답하게 하면 위치를 정확히 알 수 있어요. 숨 쉴 때 아픈 한 지점이 갈비뼈 골절의 단서가 될 수 있어요.", d: "at your back", k: ["가슴을 한번 눌러 볼게요", "숨 쉴 때 소리가 나는지 들어 볼게요"], a: "hurts", o: ["itches", "bleeds", "swells"]}
  - {t: "심호흡 요청", i: me, w: "for me는 부탁하는 말투라 아픈 환자도 거부감 없이 따라 해요. if you can으로 아프면 무리하지 않아도 된다는 여지를 줘요.", d: "in a row", k: ["코로 숨을 내쉬어 보세요", "기침을 한번 해 보세요"], a: "slow", o: ["quick", "shallow", "short"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "흉부외상 호흡 사정 4문장 순서"
    why: "먼저 듣겠다고 알리고, 듣는 동안 아픈 곳을 가리키게 한 뒤, 그 지점을 다시 들으며 심호흡을 부탁하고, 마지막에 달라졌는지 물어요. 'While I do'·'that spot'·'that breath'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to listen to your breathing on both sides.", icon: stetho, ko: "양쪽 호흡음을 들어볼게요", note: "안내"}
    - {en: "While I do, point to where it hurts the most when you breathe in.", icon: pushpin, ko: "듣는 동안 숨 쉴 때 가장 아픈 곳을 가리켜 주세요", note: "위치"}
    - {en: "Thanks, I'll listen to that spot again, so take a slow, deep breath for me.", icon: me, ko: "고마워요, 그 지점을 다시 들을게요, 천천히 깊게 숨 쉬어 보세요", note: "요청"}
    - {en: "Does it feel different after that breath?", icon: faceWorried, ko: "그 숨을 쉰 뒤에 다르게 느껴지세요?", note: "확인"}
  ctx: {word: "Inspire", ko: "숨을 들이쉬다"}
- title: 복부외상 초기 사정
  s:
  - {t: "촉진 안내", i: magnify, w: "gently와 in a few spots로 얼마나 세게, 어디를 누를지 미리 알려 줘요. 예고 없이 배를 누르면 환자가 배에 힘을 줘서 진찰이 어려워져요.", d: "all over", k: ["배에 청진기를 대 볼게요", "누운 채로 무릎을 세워 보세요"], a: "gently", o: ["roughly", "suddenly", "hardly"]}
  - {t: "증상 보고", i: bell, w: "if any area …로 해당되는 곳이 있으면 말하라고 하면 환자가 눌리는 동안 직접 알려 줄 수 있어요. 만졌을 때 아프거나 단단한 배는 복강 안 손상의 단서가 될 수 있어요.", d: "or looks red", k: ["어느 쪽으로 누워 계신가요?", "마지막으로 식사한 게 언제인가요?"], a: "tender", o: ["warm", "numb", "itchy"]}
  - {t: "통증 변화", i: faceWorried, w: "when I push here처럼 누르는 순간의 통증 변화를 물어요. 누를 때 커지는 통증은 그 아래 어느 부위가 문제인지 가늠하게 해 줘요.", d: "after I let go", k: ["이 아픔이 계속 이어지나요?", "아플 때 구역질이 나나요?"], a: "more", o: ["less", "only", "still"]}
  - {t: "관찰 소견", i: magnify, w: "looks처럼 보이는 것을 그대로 말해 진단을 단정하지 않아요. 한쪽이 부은 배는 안쪽 출혈 같은 문제를 의심하게 하는 소견이라 팀에 알려야 해요.", d: "very clearly", k: ["이쪽 배에 상처가 없는지 볼게요", "이쪽으로 돌아누워 보세요"], a: "swollen", o: ["flat", "pale", "dry"]}
  - {t: "허락 구하기", i: shield, w: "Can I see …?로 먼저 허락을 구해 환자가 옷을 걷는 데 동의하게 해요. 안전벨트가 지나간 자리는 멍이 남아 복부 손상의 단서가 될 수 있어요.", d: "over your lap", k: ["충돌 때 앉아 있던 자리를 알려 주시겠어요?", "에어백이 어디에 닿았나요?"], a: "seatbelt", o: ["airbag", "dashboard", "bumper"]}
  - {t: "의미 설명", i: bulb, w: "can tell us처럼 단정하지 않고 가능성으로 말해요. 자국의 위치와 모양은 충돌의 힘이 몸의 어디로 전해졌는지 보여 줘서 숨은 손상을 찾는 단서가 돼요.", d: "for the doctor", k: ["그 자국이 어디까지 번졌는지 표시해 둘게요", "그 자국은 의사 선생님도 확인하실 거예요"], a: "impact", o: ["weight", "recovery", "surgery"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "복부 사정 4문장 순서"
    why: "누르겠다고 알리고, 누른 곳 중에 아픈 곳을 말하게 한 뒤, 그 답을 바탕으로 벨트 자국을 보고, 그 자국이 알려 주는 것을 설명해요. 'any of them'·'That'·'it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to gently press on your belly in a few spots.", icon: magnify, ko: "배 몇 군데를 살살 눌러볼게요", note: "안내"}
    - {en: "Tell me if any of them feels tender or hard.", icon: bell, ko: "그중 아프거나 딱딱한 곳이 있으면 말씀해 주세요", note: "보고"}
    - {en: "That tells me where to look, so can I see where the seatbelt crossed your body?", icon: shield, ko: "어디를 봐야 할지 알 수 있어요, 안전벨트가 지나간 자리를 봐도 될까요?", note: "허락"}
    - {en: "Whatever mark it left can tell us how hard the impact was.", icon: bulb, ko: "그게 남긴 자국이 충격이 얼마나 셌는지 알려 줘요", note: "설명"}
  ctx: {word: "palpate", ko: "촉진하다"}
- title: 활력·쇼크 징후 감시
  s:
  - {t: "활력 확인", i: monitor, w: "I'm checking처럼 진행형으로 지금 하는 일을 알려요. closely는 한 번 재고 끝이 아니라 계속 살핀다는 뜻이에요. 외상 후 출혈이 있으면 활력징후가 시간에 따라 달라져요.", d: "once a day", k: ["산소 수치를 재 볼게요", "열이 있는지 재 볼게요"], a: "closely", o: ["rarely", "lightly", "quietly"]}
  - {t: "맥박 소견", i: chartup, w: "faster than before처럼 이전과 비교해 말해요. 출혈이 있으면 몸이 혈압을 유지하려고 맥박을 올리는 일이 많아 빨라진 맥박은 중요한 단서예요.", d: "on the monitor", k: ["맥박이 잡히는 곳을 찾아볼게요", "심전도 스티커를 붙일게요"], a: "faster", o: ["slower", "softer", "lighter"]}
  - {t: "혈압 안내", i: chartup, w: "a little로 수치를 부드럽게 전하고 right now로 지금 값이라고 한정해요. 외상 후 낮은 혈압은 출혈에 의한 쇼크를 의심하게 하는 신호예요.", d: "since lunch", k: ["혈압을 한 번 더 재 볼게요", "수액을 놓을 준비를 할게요"], a: "low", o: ["high", "uneven", "strong"]}
  - {t: "증상 문진", i: faceWorried, w: "or like …로 두 가지를 한 번에 물어 가볍게 어지러운 정도인지 쓰러질 것 같은지 환자가 고르게 해요. 어지러움은 혈압이 떨어져 뇌로 가는 피가 모자랄 때 생기는 흔한 증상이에요.", d: "after the crash", k: ["숨쉬기가 힘든가요?", "토할 것 같은가요?"], a: "lightheaded", o: ["thirsty", "hungry", "sleepy"]}
  - {t: "피부 관찰", i: magnify, w: "so we're …로 관찰한 것과 우리가 하는 일을 이어 말해 환자가 덜 불안해해요. 창백한 피부는 피가 중요한 장기로 쏠린다는 신호라 쇼크를 의심하는 단서예요.", d: "all day", k: ["피부에 멍이 든 곳이 없는지 볼게요", "피부가 건조하지 않게 로션을 발라 드릴게요"], a: "pale", o: ["flushed", "dry", "rough"]}
  - {t: "변화 보고", i: speech, w: "if anything changes는 달라지는 점이 있으면 알린다는 약속이에요. 환자 곁에서 계속 보며 변화를 팀에 전하는 것이 간호사의 몫이에요.", d: "right now", k: ["필요하면 가족에게 연락할게요", "검사 결과가 나오면 설명해 드릴게요"], a: "know", o: ["wait", "leave", "rest"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "쇼크 징후 감시 4문장 순서"
    why: "측정을 알리고, 그 수치를 전한 뒤, 그에 따른 증상을 묻고, 마지막에 변화를 팀에 알리겠다고 닫아요. 'Those numbers'·'with that'·'Whatever you tell me'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm checking your blood pressure and heart rate closely.", icon: monitor, ko: "혈압과 맥박을 자세히 확인하고 있어요", note: "측정"}
    - {en: "Those numbers show your heart is beating faster and your pressure is a little low.", icon: chartup, ko: "그 수치를 보면 맥박이 빨라지고 혈압이 조금 낮아요", note: "결과"}
    - {en: "Do you feel lightheaded or like you might pass out with that?", icon: faceWorried, ko: "그래서 어지럽거나 기절할 것 같으세요?", note: "문진"}
    - {en: "Whatever you tell me, I'll let the team know if anything changes.", icon: speech, ko: "뭐든 말씀해 주세요, 변화가 있으면 팀에 알릴게요", note: "보고"}
  sw: {ko: "기절할 것 같은 느낌이 드세요?"}
- title: 통증 척도·부위 청취
  s:
  - {t: "통증 점수", i: chartup, w: "zero to ten처럼 범위를 먼저 말해 주면 환자가 숫자로 답하기 쉬워요. 같은 척도를 계속 쓰면 시간이 지나며 통증이 달라지는지 비교할 수 있어요.", d: "this morning", k: ["어디가 제일 아프세요?", "통증이 언제부터 시작됐나요?"], a: "scale", o: ["chart", "list", "line"]}
  - {t: "통증 악화", i: faceWorried, w: "get worse로 변화를 물어 숨 쉴 때 아픈지 확인해요. 숨을 들이쉴 때 커지는 통증은 갈비뼈나 폐 주위 조직의 손상에서 흔해요.", d: "at night", k: ["통증이 가슴 한가운데인가요?", "통증 때문에 잠을 못 주무셨나요?"], a: "worse", o: ["better", "louder", "faster"]}
  - {t: "척도 설명", i: bulb, w: "would be로 가정해서 기준을 잡아 줘요. 양 끝을 정해 주면 사람마다 숫자의 뜻이 달라지는 것을 줄일 수 있어요.", d: "from before", k: ["0은 전혀 아프지 않은 거예요", "5는 중간 정도의 통증이에요"], a: "worst", o: ["first", "longest", "only"]}
  - {t: "위치 짚기", i: pushpin, w: "with one finger로 방법을 정해 주면 막연한 위치가 아니라 한 지점을 알 수 있어요. 말이 서툰 환자에게도 통하는 방식이에요.", d: "on the chart", k: ["숫자로 아픈 정도를 말씀해 주세요", "아프기 시작한 시간을 말씀해 주세요"], a: "where", o: ["when", "why", "who"]}
  - {t: "통증 양상", i: faceWorried, w: "sharp·dull·aching처럼 보기를 주면 환자가 설명하기 쉬워요. 통증의 양상은 어떤 구조가 다쳤는지 가늠하는 단서가 돼요.", d: "or burning", k: ["통증이 계속 같은 곳인가요?", "통증이 가슴 쪽인가요, 배 쪽인가요?"], a: "aching", o: ["itching", "swelling", "bleeding"]}
  - {t: "통증 이동", i: bell, w: "anywhere else로 다른 곳까지 열어 둬요. 통증이 어깨나 등으로 퍼지면 안쪽 장기 손상의 단서일 수 있어 위치 변화를 계속 확인해요.", d: "to your back", k: ["통증이 줄어들면 말씀해 주세요", "통증이 심해지면 벨을 눌러 주세요"], a: "moves", o: ["ends", "fades", "waits"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "통증 사정 4문장 순서"
    why: "점수를 먼저 묻고, 그 통증의 위치를 짚게 한 뒤, 그 자리의 양상을 묻고, 어떤 양상이든 이동하면 알려 달라고 닫아요. 'that pain'·'that spot'·'Whichever it is'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "On a scale of zero to ten, how bad is the pain now?", icon: chartup, ko: "0에서 10까지 중에 지금 통증이 얼마나 심하세요?", note: "점수"}
    - {en: "Thanks, and show me exactly where that pain is with one finger.", icon: pushpin, ko: "고마워요, 그 통증이 어디인지 손가락 하나로 짚어 주세요", note: "위치"}
    - {en: "Is it sharp, dull, or aching in that spot?", icon: faceWorried, ko: "그 자리가 날카롭나요, 둔한가요, 욱신거리나요?", note: "양상"}
    - {en: "Whichever it is, tell me if it moves anywhere else.", icon: bell, ko: "어느 쪽이든 다른 곳으로 옮겨 가면 말씀해 주세요", note: "요청"}
  ctx: {word: "intensity", ko: "강도"}
- title: 수상기전(MOI) 확보
  s:
  - {t: "사고 경위", i: speech, w: "how로 시작하는 열린 질문이라 환자가 사고를 자기 말로 이어 가요. 사고가 어떻게 났는지(수상 기전)를 알면 어디를 다쳤을지 예상하는 단서가 돼요.", d: "this morning", k: ["사고가 난 시각이 몇 시쯤이에요?", "사고 당시에 혼자였나요?"], a: "happened", o: ["stopped", "ended", "cost"]}
  - {t: "속도 확인", i: chartup, w: "How fast …?로 속도를 직접 물어요. 충돌 속도는 몸에 가해진 힘의 크기를 가늠하는 단서예요.", d: "on the road", k: ["충돌한 차가 몇 대였나요?", "차가 어디로 가던 중이었나요?"], a: "fast", o: ["far", "long", "often"]}
  - {t: "보호장치", i: shield, w: "두 질문을 and로 이어 한 번에 확인해요. 안전벨트 착용과 에어백 작동은 충돌의 세기와 몸이 받은 충격을 짐작하게 해요.", d: "or the radio", k: ["운전하고 계셨나요, 동승하셨나요?", "뒷좌석에 누가 있었나요?"], a: "seatbelt", o: ["helmet", "backpack", "raincoat"]}
  - {t: "충돌 부위", i: magnify, w: "chest or belly로 부위를 짚고 wheel or dashboard로 부딪힌 물체를 물어요. 핸들에 부딪힌 가슴·배는 흉부·복부 둔상을 의심하게 하는 단서예요.", d: "a tree", k: ["머리를 어디에 부딪혔나요?", "다리가 어디에 끼었나요?"], a: "dashboard", o: ["trunk", "tire", "bumper"]}
  - {t: "충돌 방향", i: compass, w: "Which direction …?으로 앞·옆·뒤 중 어디에서 왔는지 물어요. 충돌 방향에 따라 다치기 쉬운 곳이 달라서 옆에서 받았다면 그쪽 갈비뼈와 장기를 더 살펴봐요.", d: "at night", k: ["차가 어떤 종류였나요?", "차 안에 몇 명이 있었나요?"], a: "direction", o: ["lane", "street", "speed"]}
  - {t: "위험 설명", i: bulb, w: "can injure처럼 가능성으로 말해 겁주지 않으면서 검사가 필요한 이유를 전해요. 겉은 멀쩡해도 큰 충격이면 안쪽 장기가 다칠 수 있어서 영상 검사와 관찰을 해요.", d: "from outside", k: ["그래서 몇 가지 검사를 할 거예요", "그래서 지금은 아무것도 드시지 마세요"], a: "injure", o: ["heal", "cure", "feed"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "사고 경위 확인 4문장 순서"
    why: "사고 경위를 열린 질문으로 묻고, 그 충돌의 속도를, 그 속도에서 어디를 부딪혔는지 물은 뒤, 그런 충격의 위험을 설명해요. 'that crash'·'At that speed'·'A hit like that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Can you tell me how the accident happened?", icon: speech, ko: "사고가 어떻게 일어났는지 말씀해 주시겠어요?", note: "경위"}
    - {en: "In that crash, how fast were the cars going?", icon: chartup, ko: "그 충돌에서 차들이 얼마나 빨리 달렸나요?", note: "속도"}
    - {en: "At that speed, did your chest or belly hit the wheel or dashboard?", icon: magnify, ko: "그 속도에서 가슴이나 배가 핸들이나 계기판에 부딪혔나요?", note: "부위"}
    - {en: "A hit like that can injure organs we can't see, so we'll check carefully.", icon: bulb, ko: "그런 충격은 안 보이는 장기를 다치게 할 수 있어서 꼼꼼히 확인할게요", note: "설명"}
  ctx: {word: "mechanism", ko: "기전"}
- title: 늑골 다발골절 호흡저하
  s:
  - {t: "원인 설명", i: bulb, w: "make breathing painful로 원인과 결과를 이어 말하고 so we'll …로 우리가 할 일을 바로 붙여요. 갈비뼈 골절은 숨 쉴 때마다 아파서 얕게 쉬게 되고 폐가 덜 펴져요.", d: "in the morning", k: ["갈비뼈가 몇 개 부러졌는지 설명드릴게요", "숨쉬기 운동기구를 가져다 드릴게요"], a: "manage", o: ["ignore", "hide", "forget"]}
  - {t: "수치 설명", i: monitor, w: "because로 수치가 낮은 이유를 바로 알려요. 아파서 숨을 얕게 쉬면 폐가 덜 펴져 산소가 충분히 들어오지 않아요.", d: "since morning", k: ["산소 수치를 매시간 확인할게요", "호흡 연습 기구를 가져와서 해 볼게요"], a: "limits", o: ["improves", "deepens", "fixes"]}
  - {t: "재청진 안내", i: stetho, w: "again으로 아까 들은 것과 비교하려는 목적을 알려요. 흉부 외상에서는 시간이 지나며 호흡음이 달라질 수 있어 반복해서 들어요.", d: "on both sides", k: ["숨쉬는 횟수를 세어 볼게요", "가슴을 눌러서 아픈 데를 찾을게요"], a: "lungs", o: ["liver", "kidneys", "bladder"]}
  - {t: "심호흡 격려", i: me, w: "even though it hurts로 아픈 줄 안다고 인정하면서 해 보자고 권해요. 깊은 호흡은 폐를 펴 줘서 폐렴 같은 합병증을 줄이는 데 도움이 돼요.", d: "through your mouth", k: ["기침할 때는 베개를 안아 보세요", "진통제를 드린 뒤에 해 볼게요"], a: "slow", o: ["fast", "quick", "short"]}
  - {t: "통증 조절", i: pill, w: "will help you …로 통증 조절의 목적을 숨쉬기와 이어서 말해요. 통증이 줄어야 깊게 숨 쉴 수 있고 폐가 덜 가라앉아요.", d: "this evening", k: ["진통제는 정해진 시간마다 드릴게요", "통증이 올라가면 바로 말씀해 주세요"], a: "control", o: ["history", "scale", "chart"]}
  - {t: "예방 설명", i: bulb, w: "now로 지금 하는 이유를 말해요. 깊게 숨 쉬면 폐의 작은 공기주머니가 열린 채로 유지돼 폐가 가라앉는 것을 막는 데 도움이 돼요.", d: "all night", k: ["한 시간마다 열 번씩 해 보세요", "기침도 같이 해 보세요"], a: "open", o: ["closed", "dry", "small"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "늑골골절 호흡 안내 4문장 순서"
    why: "골절이 숨을 아프게 하고 통증을 관리하겠다고 말한 뒤, 그것과 함께 심호흡을 권하고, 그 호흡의 효과를 설명하고, 폐가 열린 동안 다시 듣겠다고 해요. 'With that'·'Those breaths'·'they'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "The rib fractures make breathing painful, so we'll manage the pain.", icon: pill, ko: "골절 때문에 숨쉬기가 아프니 통증을 관리해 드릴게요", note: "원인"}
    - {en: "With that, try to take slow deep breaths even though it still hurts.", icon: me, ko: "그와 함께 아파도 천천히 깊게 숨을 쉬어 보세요", note: "권유"}
    - {en: "Those breaths will help your lungs stay open.", icon: bulb, ko: "그 호흡이 폐가 펴진 상태를 유지하게 도와줘요", note: "효과"}
    - {en: "While they stay open, I'm going to listen to your lungs again.", icon: stetho, ko: "펴져 있는 동안 폐 소리를 다시 들어볼게요", note: "청진"}
  ctx: {word: "hypoventilating", ko: "환기저하 상태"}
