- title: 소아 발열 초기 문진
  s:
  - {t: "발열 문진", i: monitor, w: "When으로 시작 시점, how high로 열의 높이를 물어 경과를 한 문장에 묶어요. 열이 언제 시작됐는지와 몇 도까지 올랐는지는 소아 발열 평가의 기본 정보예요.", d: "and how often", k: ["어떤 약을 먹여 보셨나요?", "아이가 아프기 전에 어디에 다녀왔나요?"], a: "fever", o: ["cough", "rash", "vomiting"]}
  - {t: "수분·배설", i: coffee, w: "drinking과 wet diapers를 and로 묶어 마시는 양과 소변량을 함께 물어요. 영아는 젖은 기저귀가 줄면 수분이 모자란다는 신호로 봐요.", d: "with a bottle", k: ["마지막으로 약을 먹인 게 언제예요?", "토하거나 설사한 적이 있나요?"], a: "drinking", o: ["eating", "sleeping", "playing"]}
  - {t: "부모 안심", i: handshake2, w: "You're doing the right thing으로 부모가 내린 결정을 먼저 인정해요. 아픈 아이를 데려온 보호자가 자책하거나 괜히 왔나 망설이지 않게 도와요.", d: "back home", k: ["아이가 오늘 뭘 먹었는지 알려 주세요", "접종 기록은 가져오셨나요?"], a: "right", o: ["easy", "usual", "small"]}
  - {t: "활동성 문진", i: faceWorried, w: "Has she seemed…으로 부모가 본 변화를 묻고 than usual로 평소 모습과 견주게 해요. 평소보다 많이 처지거나 깨우기 힘든 것은 소아에서 중요한 위험 신호라 일상과 비교해서 확인해요.", d: "after lunch", k: ["오늘 몇 번 토했나요?", "집에서 해열제를 먹였나요?"], a: "tired", o: ["hungry", "cranky", "thirsty"]}
  - {t: "호칭·접촉", i: me, w: "Can I…?로 만지기 전에 먼저 허락을 구하고, sweetie 같은 다정한 호칭으로 아이의 긴장을 풀어요. 미국에서는 아이에게 sweetie·buddy 같은 호칭을 흔히 써요.", d: "your tummy", k: ["배가 아픈지 한번 볼까?", "곰인형도 같이 봐도 될까?"], a: "sweetie", o: ["ma'am", "sir", "madam"]}
  - {t: "처치 예고", i: monitor, w: "I'm going to…로 하려는 일을 미리 알려 부모와 아이가 놀라지 않게 해요. 영유아의 체온은 나이에 맞는 방법으로 재요.", d: "last night", k: ["체중부터 먼저 잴게요", "호흡 소리를 들어 볼게요"], a: "temperature", o: ["weight", "pulse", "height"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "소아 발열 문진 4문장 순서"
    why: "먼저 체온을 재겠다고 알리고, 'It's'가 그 측정값을 가리키며 시작 시점을 묻고, 'Since then'이 그 시작 시점을 받아 수분·배설을 묻고, 'all that'이 앞의 대답을 모두 받아 부모를 안심시켜요. 'It's'·'Since then'·'all that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm going to take her temperature now.", icon: monitor, ko: "지금 체온을 재 볼게요", note: "예고"}
    - {en: "It's 101.2, so she does have a fever. When did it start?", icon: bell, ko: "101.2도라 열이 있네요. 언제 시작됐나요?", note: "문진"}
    - {en: "Since then, is she still drinking and making wet diapers?", icon: coffee, ko: "그 뒤로 아직 잘 마시고 기저귀도 젖고 있나요?", note: "수분"}
    - {en: "Thank you for telling me all that. You're doing the right thing by bringing her in.", icon: handshake2, ko: "말씀 고마워요. 데려오신 게 잘하신 거예요", note: "안심"}
  sw: {ko: "평소보다 더 피곤해 보이던가요?"}
- title: 체중 기반 투약 설명
  s:
  - {t: "용량 근거", i: pill, w: "based on으로 용량의 근거를 먼저 밝혀 '왜 이 양인가'를 설명해요. 소아 약 용량은 보통 체중에 맞춰(mg/kg) 계산해서 아이마다 달라요.", d: "every hour", k: ["아이가 알레르기가 있는지 확인할게요", "약은 천천히 들어갈 거예요"], a: "weight", o: ["temperature", "pulse", "appetite"]}
  - {t: "안전 안내", i: shield, w: "safe와 carefully measured를 함께 말해 이 아이에게 맞춰 잰 양이라는 점을 강조해요. 소아 투약은 정확한 용량이 안전의 핵심이라 그 점을 말로 확인시켜요.", d: "on the shelf", k: ["처방이 바뀌면 바로 알려 드릴게요", "이 약은 몇 시간 간격으로 줄 거예요"], a: "amount", o: ["color", "taste", "smell"]}
  - {t: "이중 확인", i: check, w: "double-check로 한 번 더 본다고 약속해 부모의 걱정을 덜어요. 약 이름·용량·환자를 투여 전에 다시 대조하는 것이 투약 안전의 기본이에요.", d: "after lunch", k: ["투여가 끝나면 바로 알려 드릴게요", "먹이는 방법은 따로 알려 드릴게요"], a: "number", o: ["price", "color", "shape"]}
  - {t: "체중 기준", i: chartup, w: "not just…로 '나이로만 정한다'는 흔한 오해를 바로잡아요. 소아 용량은 보통 체중에 맞추되 성인 최대 용량을 넘기지 않게 정해요.", d: "by the clock", k: ["약마다 이름을 한 번씩 읽어 드릴게요", "약이 효과를 내려면 시간이 걸려요"], a: "weight", o: ["appetite", "schedule", "mood"]}
  - {t: "공감", i: faceWorried, w: "I know…로 부모의 감정을 먼저 인정하고 but으로 이유를 이어요. 감정을 먼저 받아 주면 뒤따르는 설명이 변명이 아니라 안심으로 들려요.", d: "for a while", k: ["곧 의사 선생님이 오실 거예요", "아이가 잠들면 알려 주세요"], a: "scary", o: ["easy", "boring", "simple"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "투약 설명 4문장 순서"
    why: "용량 계산 근거를 말하고, 'That's why'가 그 근거를 이유로 받아 아이마다 양이 다르다고 하고, 'it'이 앞의 용량을 가리켜 투여 전 확인을 약속하고, 'all of this'가 앞의 모든 과정을 받아 공감과 안심으로 닫아요. 'That's why'·'it'·'all of this'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We calculate the dose based on his exact weight.", icon: pill, ko: "정확한 체중을 기준으로 용량을 계산해요", note: "근거"}
    - {en: "That's why the amount is different for every child.", icon: chartup, ko: "그래서 아이마다 양이 달라요", note: "이유"}
    - {en: "I'll double-check the numbers with a second nurse before he gets it.", icon: check, ko: "투여 전에 다른 간호사와 숫자를 다시 확인할게요", note: "확인"}
    - {en: "I know it's a lot to watch, but all of this keeps him safe.", icon: faceWorried, ko: "지켜보기 힘드시겠지만 이 모든 게 아이를 지켜줘요", note: "공감"}
  ctx:
    word: "dose"
    ko: "용량"
    sc:
      0: {en: "Dose 15 mg/kg = 273 mg PO; wt 18.2 kg."}
- title: 예방접종력 확인
  s:
  - {t: "접종 기록", i: board, w: "Do you have…?로 가진 것을 묻는 말이라 부담 없이 시작해요. 접종 기록은 종이 카드 말고도 앱이나 병원 포털에 남아 있는 경우가 많아요.", d: "at school", k: ["아이가 알레르기가 있나요?", "언제 마지막으로 병원에 갔어요?"], a: "vaccine", o: ["insurance", "allergy", "medication"]}
  - {t: "함께 확인", i: check, w: "Let's…는 '같이 한다'는 말투라 기록이 비어 있어도 추궁처럼 들리지 않아요. which ones she's had로 맞은 백신을 하나씩 짚어요.", d: "from home", k: ["아이 몸무게를 다시 재 볼게요", "담당 의사 선생님께 물어볼게요"], a: "which", o: ["who", "where", "why"]}
  - {t: "안심", i: handshake2, w: "It's okay if…로 빠진 것이 있어도 괜찮다고 먼저 말해 부모가 위축되지 않게 해요. 접종이 늦어진 아이는 남은 접종을 이어서 맞추는 catch-up 일정으로 따라잡아요.", d: "for school", k: ["접종 때문에 열이 날 수 있어요", "병원에서 다시 연락드릴게요"], a: "missing", o: ["ready", "clear", "closed"]}
  - {t: "기록 조회", i: magnify, w: "so we don't…으로 기록을 찾아보는 이유를 밝혀요. 기억에만 의존하면 접종 횟수나 날짜를 틀리기 쉬워서 기록으로 확인해요.", d: "to your phone", k: ["기록 사본을 드릴게요", "이름과 생년월일을 한 번 더 말씀해 주세요"], a: "guess", o: ["hurry", "worry", "forget"]}
  - {t: "비난 없음", i: handshake2, w: "no blame으로 비난이 아니라는 점을 먼저 못 박고, we just want…로 목적을 아이의 보호로 돌려요. 접종이 비어 있어도 판단하지 않는 말이 부모가 사실대로 말하게 해요.", d: "of course", k: ["접종 기록 사본을 따로 드릴게요", "다음 방문은 소아과 선생님과 정하세요"], a: "blame", o: ["rush", "fee", "pressure"]}
  - {t: "후속 계획", i: calendar, w: "I'll note…과 we can schedule…로 지금 할 일과 나중에 할 일을 나눠 말해요. 빠진 접종은 소아과 주치의와 일정을 잡아 이어서 맞추는 것이 일반적이에요.", d: "at the door", k: ["다음 방문 때 영수증을 드릴게요", "접종 카드는 돌려드릴게요"], a: "note", o: ["cancel", "delay", "miss"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "접종력 확인 4문장 순서"
    why: "접종 카드를 먼저 요청하고, 'which ones'가 그 기록 속 백신을 가리켜 하나씩 확인하자고 하고, 'some'이 그 백신 중 빠진 것을 받아 괜찮다고 안심시키고, 'the rest'가 빠진 것들을 가리켜 일정을 잡아요. 'which ones'·'some'·'the rest'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Do you have her vaccine card or an app record with you?", icon: board, ko: "접종 카드나 앱 기록 가지고 오셨나요?", note: "요청"}
    - {en: "Let's go through which ones she's had so far.", icon: check, ko: "지금까지 맞은 것들을 같이 확인해 볼게요", note: "확인"}
    - {en: "It's okay if some are missing — we can catch up.", icon: handshake2, ko: "빠진 게 있어도 괜찮아요 — 지금부터 채우면 돼요", note: "안심"}
    - {en: "I'll note today's visit, and we can schedule the rest.", icon: calendar, ko: "오늘 방문을 기록해 두고 나머지는 일정을 잡을게요", note: "계획"}
  sw: {ko: "빠진 게 있어도 괜찮아요 — 지금부터 채우면 돼요"}
- title: 연령별 정상 활력
  s:
  - {t: "정상 범위", i: monitor, w: "For his age로 기준을 먼저 밝혀요. 영유아는 어른보다 안정 시 심박수가 빨라서 나이별 정상 범위와 견줘서 판단해요.", d: "at night", k: ["지금 혈압도 같이 확인할게요", "숨 쉬는 속도를 세어 볼게요"], a: "age", o: ["weight", "height", "size"]}
  - {t: "수치 설명", i: chartup, w: "right where we'd expect로 '예상 범위 안'이라는 뜻을 쉬운 말로 풀어요. numbers는 심박수·호흡수 같은 측정값을 두루 가리켜요.", d: "in a hurry", k: ["수치가 변하면 바로 알려 드릴게요", "나머지 수치는 의사가 설명할 거예요"], a: "numbers", o: ["weights", "names", "dates"]}
  - {t: "정상 안내", i: board, w: "Let me show you…으로 말로만이 아니라 기준을 보여 주며 설명한다고 알려요. 연령별 정상 범위를 보여 주면 부모가 '빠르다'는 숫자를 스스로 확인할 수 있어요.", d: "in your room", k: ["수치가 올라가면 바로 알려 드릴게요", "아이를 침대에 눕혀 주세요"], a: "normal", o: ["unusual", "rare", "abnormal"]}
  - {t: "원리 설명", i: bulb, w: "naturally로 병 때문이 아니라 원래 그렇다는 점을 한 단어로 전해요. 영유아는 심장이 작아서 박동수를 높여 혈액을 내보내므로 심박수가 어른보다 빨라요.", d: "after meals", k: ["운동하면 심장이 더 빨리 뛰어요", "잠잘 때는 심박수가 더 느려져요"], a: "naturally", o: ["suddenly", "slowly", "quietly"]}
  - {t: "기준표 대조", i: board, w: "against the chart로 무엇과 견주는지 밝혀 확인이 객관적이라는 인상을 줘요. 소아 활력징후는 나이별 정상 범위표와 맞춰 판단해요.", d: "with a ruler", k: ["숫자는 의사 선생님과 같이 볼게요", "체중은 따로 적어 둘게요"], a: "chart", o: ["calendar", "report", "form"]}
  - {t: "청진 허락", i: stetho, w: "Can I…?로 청진기를 대기 전에 허락을 구해요. count your heartbeats는 하는 일을 아이도 알아듣는 말로 풀어 겁을 덜어요.", d: "on the scale", k: ["이 청진기가 차가운지 만져 볼래?", "엄마 무릎에 앉아 볼까?"], a: "stethoscope", o: ["thermometer", "scale", "flashlight"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "정상 활력 설명 4문장 순서"
    why: "수치가 정상이라고 먼저 알리고, 'That's because'가 그 판단을 이유로 받아 설명하고, 'your'로 아이에게 돌아가 청진을 허락받고, 'Both counts'가 모니터와 직접 센 두 값을 가리켜 기준표와 맞다고 마무리해요. 'That's because'·'Both counts'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "His heart rate is 128, which is completely normal for a boy his age.", icon: monitor, ko: "심박수 128, 이 나이 남자아이에게 완전히 정상이에요", note: "결과"}
    - {en: "That's because children's hearts naturally beat faster than adult hearts.", icon: bulb, ko: "아이들 심장은 원래 어른보다 빨리 뛰기 때문이에요", note: "이유"}
    - {en: "Can I count your heartbeats with my stethoscope, buddy?", icon: stetho, ko: "청진기로 심장 소리 세어 봐도 될까, 친구야?", note: "허락"}
    - {en: "Both counts match the chart for his age, so we're right where we'd expect.", icon: board, ko: "두 수치 모두 이 나이 기준표와 맞아서 예상한 그대로예요", note: "확인"}
  ctx:
    word: "heart rate"
    ko: "심박수"
    sc:
      0: {en: "Heart rate 128 bpm; WNL for age."}
      2: {en: "His heart rate's 128, WNL for age.", fix: "His heart rate is 128, which is completely normal for a boy his age."}
