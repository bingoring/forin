  - kind: slider
    words:
    - w-fever
    - w-high
    cue: 'Patient: "I''ve been burning up — it hit 104 last night."'
    scale:
    - low-grade fever
    - fever
    - high fever
    answerAt: 2
    why: 104°F는 40℃예요. 이만큼 오르면 high fever 쪽이에요. 미국 환자는 체온을 화씨로 말하니 숫자를 바로 섭씨로 옮겨 들을 수 있어야 해요. 38℃를 조금 넘는 정도는 low-grade fever(미열)라고 해요.
    example: She's had a low-grade fever since yesterday.
    exKo: 어제부터 미열이 있어요.
  - kind: swap
    words:
