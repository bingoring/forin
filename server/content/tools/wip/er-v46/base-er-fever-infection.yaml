    - w-urine
    who: 환자에게 · 요로 증상 문진
    icon: me
    before:
    - 'Do you have any '
    - dysuria
    - '?'
    options:
    - burning when you urinate
    - dysuria
    - urinary symptoms
    answer: burning when you urinate
    notes:
      burning when you urinate: 환자가 느끼는 그대로의 말. 무엇을 묻는지 바로 알아듣는다.
      dysuria: 배뇨통을 뜻하는 의료진의 말. 차트에는 맞지만 환자는 대개 모른다.
      urinary symptoms: 너무 넓어서 환자가 무엇을 말해야 할지 모른다.
    why: 차트에는 dysuria라고 적어도, 환자에게는 느끼는 증상 그대로 물어요. 그래야 '네/아니요'가 정확하게 나와요.
