    - severe
    answerAt: 2
    why: 0~10 숫자 척도는 흔히 1~3을 mild, 4~6을 moderate, 7~10을 severe로 묶어요. 7이면 severe 쪽이에요. 기록은 단어보다 숫자 그대로(7/10)가 기본이에요.
    example: She rates her pain seven out of ten.
    exKo: 환자는 통증을 10점 중 7점으로 표현해요.
  - kind: swap
    words:
    - w-eat
    - w-drink
    who: 환자에게 · 금식 안내
    icon: me
    before:
    - 'Please don''t have '
    - any oral intake
    - ' for now.'
    options:
    - anything to eat or drink
    - any oral intake
    - any PO intake
    answer: anything to eat or drink
    notes:
      anything to eat or drink: 환자가 바로 알아듣는 말. 물도 포함된다는 게 분명하다.
      any oral intake: 간호 기록의 말(oral intake). 문법은 맞지만 환자에게는 딱딱하고 낯설다.
      any PO intake: PO는 차트 약어. 환자는 뜻을 모른다.
    why: NPO는 의료진끼리의 약어예요. 환자에게는 'nothing by mouth'도 통하지만, '먹지도 마시지도 마세요'라고 풀어 말하는 것이 물 한 모금까지 가장 분명하게 전해져요.
