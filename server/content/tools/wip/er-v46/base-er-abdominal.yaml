      ok: true
    - who: 환자에게
      icon: me
      en: Does your pain radiate anywhere?
      ok: false
      fix: Does the pain move or spread anywhere else?
    - who: 의사에게 보고
      icon: speech
      en: She says the pain radiates to her back.
