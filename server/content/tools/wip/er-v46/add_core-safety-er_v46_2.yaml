- title: 침상 안전 설정
  s:
  - {t: "침상 설정", i: gear, w: "-ing로 지금 하는 일을 환자에게 그대로 중계해요. 침대를 낮추고 난간을 올리는 것은 낙상 예방의 기본 설정이에요.", d: "the lights off", k: ["침대를 높여서 편하게 해 드릴게요", "침대 시트를 바꿔 드릴게요"], a: "lowering", ai: chevronDown, o: [["selling", "pencil"], ["painting", "bulb"], ["breaking", "cross"]]}
  - {t: "호출벨 안내", i: bell, w: "This is …로 이름을 알려 주고 바로 사용법을 붙이는 순서예요. 도움이 필요한 순간 환자가 직접 부를 수 있게 하는 것이 낙상 예방의 기본이에요.", d: "hold it", k: ["이건 침대 높이 조절 버튼이에요", "불편하면 말로만 해 주세요"], a: "press", ai: bell, o: [["ignore", "cross"], ["cover", "lock"], ["hide", "pushpin"]]}
  - {t: "행동 요청", i: shield, w: "don't로 금지만 하지 않고 call me first로 대신 할 행동을 바로 이어 줘요. 해도 되는 행동을 함께 말하면 환자가 꾸지람 듣는 느낌이 덜해요.", d: "text me", k: ["어서 일어나 보세요", "화장실에 지금 가셔도 돼요"], a: "on your own", ai: me, o: [["with my help", "handshake2"], ["with a nurse", "stetho"], ["together", "home"]]}
  - {t: "이유 설명", i: shield, w: "so it's safe …로 침대를 낮게 두는 이유를 덧붙여요. 침대가 낮으면 앉았다 일어날 때 발이 바닥에 닿기 쉬워서 안전해요.", d: "so it's quiet", k: ["침대를 높게 올려 둘게요", "침대 시트를 갈아 드릴게요"], a: "low", ai: chevronDown, o: [["high", "chevronUp"], ["wet", "bandage"], ["tall", "trophy"]]}
  - {t: "난간 안내", i: lock, w: "whenever로 난간을 올려 두는 시점을 분명히 말해요. 곁에 있을 때와 없을 때의 규칙을 구분해 알려 주면 환자가 혼동하지 않아요.", d: "until I'm", k: ["난간은 제가 나갈 때 내릴게요", "침대 난간은 만지지 마세요"], a: "up", ai: chevronUp, o: [["down", "chevronDown"], ["open", "home"], ["loose", "gear"]]}
  - {t: "호출 안내", i: bell, w: "anytime으로 언제든 불러도 된다고 말하면 환자가 부르기를 망설이지 않아요. 부르라고 한 다음 don't try로 하지 말 행동을 덧붙이는 흐름이에요.", d: "feel free", k: ["도움이 필요 없으면 누르지 마세요", "호출벨은 간호사만 눌러요"], a: "Press", ai: bell, o: [["Hide", "lock"], ["Break", "cross"], ["Remove", "scalpel"]]}
  - {t: "낙상 예방", i: shield, w: "Setting up …처럼 동사 -ing로 시작하는 주어는 설정하는 일 자체가 예방이라고 한 번에 말해요. 침대와 호출벨을 제대로 두는 것이 낙상 예방의 기본 조치예요.", d: "can cause", k: ["침대 시트를 새로 깔아 드릴게요", "호출벨은 쓰지 않아도 돼요"], a: "falls", ai: chevronDown, o: [["infections", "lab"], ["bills", "board"], ["noise", "speaker"]]}
  - {t: "마무리 확인", i: check, w: "Let's …로 함께 하자고 하면 환자가 지켜보는 사람이 아니라 참여자가 돼요. 자리를 뜨기 전 침대 높이를 마지막으로 확인하는 습관이에요.", d: "after lunch", k: ["침대 높이는 제가 혼자 조절할게요", "제가 올 때까지 기다려 주세요"], a: "height", ai: chartup, o: [["color", "star"], ["price", "board"], ["brand", "pushpin"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "침상 안전 설정 4단계"
    why: "침대를 먼저 설정하고, 호출벨을 알려 준 뒤 그 벨을 먼저 누르라고 요청하고, 떠나기 전 마지막으로 높이를 확인해요. 앞 줄이 뒤 줄의 전제라 순서가 하나예요."
    lines:
    - {en: "First, I'm lowering the bed and putting the rails up.", icon: gear, ko: "먼저 침대를 낮추고 난간을 올릴게요", note: "설정"}
    - {en: "This is your call button — press it if you need help.", icon: bell, ko: "호출벨이에요, 도움이 필요하면 누르세요", note: "안내"}
    - {en: "So please press it before you try to get up.", icon: shield, ko: "그러니 일어나기 전에 먼저 누르세요", note: "요청"}
    - {en: "Before I go, let's check the bed height together.", icon: check, ko: "가기 전에 침대 높이를 같이 확인해요", note: "확인"}
  ctx: {word: "call", ko: "부르다·호출하다"}
- title: 알레르기 밴드 확인
  s:
  - {t: "정보 확인", i: bandage, w: "밴드에 적힌 내용을 먼저 말하고 correct?로 맞는지 묻는 방식이에요. 환자는 맞다·아니다만 답하면 되고, 밴드와 본인 말이 어긋나는지도 바로 드러나요.", d: "shows you're", k: ["페니실린을 드시고 계세요?", "밴드를 새로 채워 드릴게요"], a: "correct", ai: check, o: [["finished", "trophy"], ["tired", "faceWorried"], ["cold", "monitor"]]}
  - {t: "추가 확인", i: pencil, w: "Any other …?로 이미 아는 것 말고 더 있는지 열어 두고 물어요. 알레르기는 약뿐 아니라 음식·라텍스도 있어서 한 번 더 묻는 것이 안전해요.", d: "we should skip", k: ["페니실린 알레르기는 언제 생겼어요?", "다른 약을 드시고 계세요?"], a: "add", ai: pencil, o: [["skip", "cross"], ["hide", "lock"], ["forget", "bulb"]]}
  - {t: "색 밴드", i: bandage, w: "alert는 누군가에게 주의를 알린다는 동사예요. 알레르기 밴드는 말 없이도 팀 모두가 알아보게 하는 시각 경고예요.", d: "at the door", k: ["이 밴드는 환자분만 보는 거예요", "빨간 밴드는 퇴원 표시예요"], a: "alerts", ai: siren, o: [["bothers", "faceAngry"], ["hides", "lock"], ["tires", "coffee"]]}
  - {t: "기록 대조", i: board, w: "Let me …는 하려는 일을 정중히 알리는 말이에요. 밴드와 차트를 서로 맞춰 봐야 한쪽에만 적힌 알레르기를 놓치지 않아요.", d: "to erase", k: ["밴드를 풀어 드릴게요", "차트에 새로 적을게요"], a: "confirm", ai: check, o: [["erase", "cross"], ["hide", "lock"], ["forget", "bulb"]]}
  - {t: "불일치 발견", i: magnify, w: "I don't see …는 차트에 없다는 사실만 담담하게 말해요. 환자 말과 차트가 다르면 추측하지 않고 알려서 기록을 맞출 계기로 삼아요.", d: "on the wall", k: ["차트에 페니실린 알레르기가 확실히 있네요", "밴드에 이름이 없네요"], a: "see", ai: magnify, o: [["hear", "speaker"], ["smell", "coffee"], ["taste", "pill"]]}
  - {t: "기록 추가", i: pencil, w: "that으로 방금 들은 알레르기를 가리키고 band와 chart 둘 다에 더한다고 말해요. 한쪽만 고치면 서로 어긋나므로 함께 갱신해요.", d: "to the bill", k: ["그 알레르기는 지우겠습니다", "다른 환자분 차트에 적을게요"], a: "add", ai: pencil, o: [["send", "plane"], ["move", "compass"], ["lend", "handshake2"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "알레르기 밴드 불일치 대응 순서"
    why: "밴드 내용을 먼저 확인하고, 차트와 대조해서, 차트에 없다는 결과를 말한 뒤, 기록을 바로잡아요. 각 줄이 앞 줄의 결과에 이어져서 순서가 하나예요."
    lines:
    - {en: "Your band says you're allergic to penicillin, correct?", icon: bandage, ko: "밴드에는 페니실린 알레르기라고 되어 있네요, 맞나요?", note: "확인"}
    - {en: "Let me check your chart to confirm this allergy record.", icon: board, ko: "차트에서 이 알레르기 기록을 대조할게요", note: "대조"}
    - {en: "I don't see any penicillin allergy on your chart.", icon: magnify, ko: "차트에는 페니실린 알레르기가 없네요", note: "결과"}
    - {en: "I'll update the chart now so it matches your band.", icon: pencil, ko: "밴드에 맞게 차트를 바로 고칠게요", note: "수정"}
  ctx: {word: "allergies", ko: "알레르기"}
- title: 이송 전 안전 확인
  s:
  - {t: "줄 고정", i: check, w: "make sure는 확실히 해 둔다는 구예요. -ing로 지금 하는 확인을 알려 주면 환자도 줄이 괜찮은지 안심해요.", d: "is cold", k: ["정맥 주사 바늘을 빼 드릴게요", "수액이 거의 다 들어갔어요"], a: "secure", ai: lock, o: [["loose", "gear"], ["tangled", "pushpin"], ["bent", "chevronDown"]]}
  - {t: "산소 확인", i: gear, w: "tank is full은 이송 중 쓸 산소가 충분하다는 사실을 한 문장으로 알려요. 이송 전에 산소통 잔량을 확인하는 것은 이동 안전의 기본이에요.", d: "for the night", k: ["산소통을 지금 바꿔 드릴게요", "산소는 필요하지 않아요"], a: "full", ai: chartup, o: [["empty", "cross"], ["broken", "scalpel"], ["missing", "magnify"]]}
  - {t: "자세 안내", i: shield, w: "stay lying down은 누운 자세를 유지하라는 요청이에요. while we move you로 언제까지인지 말해 이동 중 협조를 구해요.", d: "while we talk", k: ["이동 중에는 일어나 앉으세요", "이동 전에 물을 드릴게요"], a: "lying down", ai: bandage, o: [["standing up", "chevronUp"], ["walking around", "compass"], ["jumping up", "trophy"]]}
  - {t: "출발 전 확인", i: check, w: "Before we leave로 확인 시점을 못 박아요. 이송 중에는 줄이 당기거나 빠지기 쉬워서 출발 전에 고정 상태를 모두 확인해요.", d: "when we return", k: ["도착하면 줄을 모두 빼 드릴게요", "줄은 이동한 뒤에 확인할게요"], a: "leave", ai: plane, o: [["eat", "coffee"], ["pray", "star"], ["argue", "faceAngry"]]}
  - {t: "낙상 예방", i: shield, w: "in place는 필요한 조치가 갖춰져 있다는 뜻이에요. 이송 중에는 환경이 바뀌므로 낙상 예방 조치도 함께 점검해요.", d: "in doubt", k: ["이동한 뒤에 낙상 예방 조치를 해제할게요", "혼자 걸어서 이동하셔도 돼요"], a: "precautions", ai: shield, o: [["rumors", "speech"], ["hobbies", "star"], ["snacks", "coffee"]]}
  - {t: "도착 후 안내", i: me, w: "until the team says로 일어나 앉아도 되는 시점을 환자가 아닌 팀의 판단에 둬요. 도착 직후 상태를 팀이 먼저 확인한다는 뜻이에요.", d: "since we left", k: ["도착하면 바로 일어나 앉으세요", "도착하면 식사를 하실 거예요"], a: "safe", ai: shield, o: [["loud", "speaker"], ["late", "calendar"], ["rude", "faceAngry"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "이송 전후 안전 안내 순서"
    why: "출발 전에 줄을 확인하고, 산소를 이어서(too) 알리고, 이동 중 자세를 요청하고, 도착 뒤 팀이 앉는 것을 돕는 시간 순서예요."
    lines:
    - {en: "Before we leave, I'm making sure your IV line is secure.", icon: check, ko: "출발 전에 정맥 주사줄이 고정됐는지 볼게요", note: "줄"}
    - {en: "Your oxygen tank is full for the trip, too.", icon: gear, ko: "산소통도 이송에 충분히 차 있어요", note: "산소"}
    - {en: "Now please stay lying down while we move you.", icon: bandage, ko: "이제 옮기는 동안 누워 계세요", note: "자세"}
    - {en: "Once we arrive, the team will help you sit up.", icon: me, ko: "도착하면 팀이 앉는 걸 도와드려요", note: "도착"}
  ctx: {word: "secure", ko: "고정하다"}
- title: 고위험 낙상 환자 관리
  s:
  - {t: "상태 설명", i: me, w: "a bit은 단정을 누그러뜨리는 완곡어예요. so로 상태에서 곧바로 도움 제안으로 이어서 환자가 약해 보인다는 말로 듣지 않게 해요.", d: "so please", k: ["혼자 걸으셔도 될 것 같아요", "어지러운 약을 드릴게요"], a: "unsteady", ai: faceWorried, o: [["cheerful", "star"], ["thirsty", "coffee"], ["sleepy", "home"]]}
  - {t: "호출 안내", i: bell, w: "right away는 곧바로 오겠다는 약속이에요. 호출벨을 누르면 바로 응답한다는 믿음이 있어야 환자가 부르기를 망설이지 않아요.", d: "if I'm free", k: ["이 버튼을 누르면 불이 켜져요", "제가 올 때까지 기다려 주세요"], a: "right away", ai: bell, o: [["next week", "calendar"], ["someday", "star"], ["much later", "plane"]]}
  - {t: "안내", i: shield, w: "For now는 지금만의 한시적 요청이라는 신호예요. so you don't fall로 이유를 붙이면 지시가 아니라 배려로 들려요.", d: "to rest well", k: ["침대에서 내려와 걸어 보세요", "지금 퇴원하실 수 있어요"], a: "stay", ai: lock, o: [["jump", "trophy"], ["climb", "chevronUp"], ["hide", "pushpin"]]}
  - {t: "이유 설명", i: stetho, w: "check on은 사람의 상태를 들여다본다는 구예요. since로 자주 보는 이유를 말하면 감시가 아니라 안전 조치로 받아들여져요.", d: "even though you're calm", k: ["오늘은 한 번만 확인할게요", "혼자 계셔도 안전해요"], a: "often", ai: calendar, o: [["rarely", "chevronDown"], ["never", "cross"], ["seldom", "pushpin"]]}
  - {t: "관찰", i: magnify, w: "keep a close watch는 계속 주의 깊게 지켜본다는 관용 표현이에요. because of 뒤에는 이유가 명사구로 와요.", d: "a quick glance", k: ["오늘 밤에는 확인하지 않을게요", "낙상 위험이 낮아요"], a: "close", ai: magnify, o: [["careless", "cross"], ["distant", "plane"], ["lazy", "coffee"]]}
  - {t: "재안내", i: speech, w: "remind you again은 이미 말했다는 걸 꾸짖음 없이 다시 알린다는 말이에요. 혼란이 있는 환자는 안내를 잊기 쉬워서 짧게 반복해 줘요.", d: "I told you", k: ["이번이 처음 알려 드리는 거예요", "침대에서 내려오세요"], a: "remind", ai: bell, o: [["scold", "faceAngry"], ["blame", "cross"], ["forget", "bulb"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "고위험 낙상 환자 안내 순서"
    why: "상태를 먼저 설명하고 도움을 제안한 뒤, 침대에 있도록 요청하고, 필요하면 벨을 누르라고 이어서(And) 알리고, 마지막으로 자주 확인하겠다고 해요."
    lines:
    - {en: "You're a bit unsteady, so let me help you move.", icon: me, ko: "조금 불안정하시니 제가 도와드릴게요", note: "상태"}
    - {en: "For now, stay in bed so you don't fall.", icon: lock, ko: "지금은 넘어지지 않게 침대에 계세요", note: "요청"}
    - {en: "And if you need anything, press this button and I'll come right away.", icon: bell, ko: "필요하면 이 버튼을 누르세요, 바로 갈게요", note: "호출"}
    - {en: "I'll also check on you often, since you're at high risk.", icon: stetho, ko: "위험이 높아서 자주 확인할게요", note: "관찰"}
  ctx: {word: "remind", ko: "상기시키다"}
- title: 투약 오류 예방
  s:
  - {t: "유사 약명", i: pill, w: "hydralazine(혈압약)과 hydroxyzine(항히스타민제)은 이름이 비슷해 혼동 주의 약으로 꼽혀요. 이름을 나란히 말하며 확인하면 잘못 읽는 것을 막아요.", d: "Let's guess", k: ["이 약은 하루에 한 번 드세요", "약이 다 떨어졌어요"], a: "confirm", ai: check, o: [["guess", "bulb"], ["skip", "cross"], ["hide", "lock"]]}
  - {t: "이중 확인", i: check, w: "verify는 직접 대조해 확인한다는 동사예요. with me로 혼자가 아니라 둘이 함께하는 독립 이중 확인을 청해요.", d: "without me", k: ["농도는 제가 혼자 확인할게요", "약을 바로 주사해 주세요"], a: "verify", ai: check, o: [["ignore", "cross"], ["change", "gear"], ["sign", "pencil"]]}
