situations:
- title: 노출 환경·시간 문진
  sentences:
  - en: How long were you out in the heat, and were you drinking water?
    ko: 더운 데 얼마나 오래 계셨어요, 그리고 물은 드셨어요?
    chunks:
    - How long were you
    - out in the heat
    - ', and were you'
    - drinking water
    - '?'
    words:
    - w-long
    - w-heat
    - w-drink
    - w-water
    goal: 1
    tag: 노출 시간
    icon: magnify
    why: How long으로 시간을 먼저 열어 묻고, 뒤에 물 섭취를 한 문장으로 이어 물어요. 노출 시간과 수분 섭취는 더위로 인한 탈수와 열 손상 정도를 가늠하는 단서예요.
    decoy: in the shade
    distractorsKo:
    - 언제부터 어지러우셨어요?
    - 지금 체온을 재 볼게요.
    blank:
      answer: heat
      options:
      - en: heat
      - en: cold
      - en: rain
      - en: wind
  - en: When did you start feeling dizzy or sick?
    ko: 언제부터 어지럽거나 메스꺼우셨어요?
    chunks:
    - When did you
    - start feeling
    - dizzy or sick
    - '?'
    words:
    - w-start
    - w-feel
    - w-dizzy
    - w-sick
    goal: 2
    tag: 증상 시작
    icon: calendar
    why: start feeling으로 증상이 처음 시작된 시점을 물어요. 노출 시간과 증상이 나타난 시점을 맞춰 보면 더위와의 연관을 가늠하기 쉬워요.
    decoy: since last week
    distractorsKo:
    - 어디가 가장 불편하세요?
    - 물은 좀 드셨어요?
    blank:
      answer: When
      options:
      - en: How
      - en: When
      - en: Where
      - en: Why
  - en: Were you able to find any shade or rest?
    ko: 그늘을 찾거나 쉴 수는 있으셨어요?
    chunks:
    - Were you able
    - to find
    - any shade
    - or rest
    - '?'
    words:
    - w-find
    - w-shade
    - w-rest
    goal: 1
    tag: 그늘·휴식
    icon: home
    why: able to find로 찾을 수 있었는지 여건을 물어요. 쉬지 않았다고 탓하는 말이 아니라 상황을 묻는 말이라 편하게 답해요. 그늘과 휴식은 열 노출을 줄이는 기본 조건이에요.
    decoy: in the car
    distractorsKo:
    - 점심은 드셨어요?
    - 드시는 약이 있으세요?
    blank:
      answer: shade
      options:
      - en: ice
      - en: food
      - en: shade
      - en: sun
  - en: Tell me where you were and for how long.
    ko: 어디에 얼마나 오래 계셨는지 말씀해 주세요.
    chunks:
    - Tell me
    - where you were
    - and for
    - how long
    - .
    words:
    - w-long
    goal: 1
    tag: 장소·기간
    icon: pushpin
    why: Tell me로 질문 대신 요청의 형태라 환자가 자유롭게 풀어 말해요. 장소와 기간을 한 문장에 묶어 실내외와 햇빛 노출 여부, 시간을 한꺼번에 파악해요.
    decoy: on that day
    distractorsKo:
    - 증상은 지금도 계속되나요?
    - 같이 계셨던 분이 있나요?
    blank:
      answer: where
      options:
      - en: who
      - en: why
      - en: how
      - en: where
  - en: Did you have any water with you out there?
    ko: 거기 계실 때 물을 갖고 계셨어요?
    chunks:
    - Did you have
    - any water
    - with you
    - out there
    - '?'
    words:
    - w-water
    goal: 1
    tag: 물 소지
    icon: coffee
    why: with you out there로 그 자리에 갖고 있었는지를 구체적으로 물어요. 마신 양이 아니라 접근 여건을 물어서 탓하는 느낌이 줄어요.
    decoy: in your car
    distractorsKo:
    - 지금도 목이 마르세요?
    - 술은 드셨어요?
    blank:
      answer: water
      options:
      - en: water
      - en: food
      - en: ice
      - en: medicine
  - en: I'm going to check your temperature and pulse now.
    ko: 지금 체온과 맥박을 확인해 볼게요.
    chunks:
    - I'm going
    - to check
    - your temperature
    - and pulse now
    - .
    words:
    - w-check
    - w-temperature
    - w-pulse
    goal: 2
    tag: 활력징후
    icon: stetho
    why: I'm going to로 곧 할 일을 미리 알려요. 하는 일을 먼저 말해 주면 환자의 불안이 줄고 협조가 쉬워져요. 체온과 맥박은 더위 노출 환자를 살필 때 기본이 되는 수치예요.
    decoy: for you
    distractorsKo:
    - 지금 물을 드릴게요.
    - 그늘로 모셔 드릴게요.
    blank:
      answer: temperature
      options:
      - en: hearing
      - en: temperature
      - en: weight
      - en: height
  nuance:
  - kind: slider
    words:
    - w-sick
    cue: 'Patient: "My stomach''s a little off, but I haven''t thrown up."'
    scale:
    - queasy
    - nauseous
    - about to throw up
    answerAt: 0
    why: queasy는 속이 살짝 울렁거리는 정도, nauseous는 뚜렷한 메스꺼움, about to throw up은 곧 토할 것 같은 정도예요. '안 토했다, 살짝 이상하다'면 queasy 쪽이에요.
    example: I feel a little queasy, but I'm not going to throw up.
    exKo: 속이 좀 울렁거리지만 토할 것 같지는 않아요.
  - kind: swap
    words:
    - w-long
    - w-heat
    who: 환자에게 · 노출 시간 문진
    icon: me
    before:
    - ''
    - What was the duration of your heat exposure
    - '?'
    options:
    - How long were you out in the heat
    - What was the duration of your heat exposure
    - Why did you stay out in the heat so long
    answer: How long were you out in the heat
    notes:
      How long were you out in the heat: 환자가 바로 알아듣는 쉬운 질문이다.
      What was the duration of your heat exposure: 차트·인계에 어울리는 딱딱한 말이라 어지러운 환자에게는 한 번 더 생각하게 만든다.
      Why did you stay out in the heat so long: 시간을 묻는 게 아니라 탓하는 말로 들린다.
    why: 같은 노출 시간을 묻더라도 환자에게는 how long으로 짧고 쉽게, 탓하는 느낌 없이 물어요.
    ko: 더운 데 얼마나 오래 계셨어요?
  order:
    tag: 대화 흐름
    icon: compass
    ko: 더위 노출 문진 4문장 순서
    why: 노출 시간으로 시작해 증상이 시작된 때를 묻고, 도움이 된 것을 이어 물은 뒤 그것을 감안해 체온과 맥박을 재요. 'out there'·'it'·'whatever helped'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: How long were you out in the heat today?
      icon: calendar
      ko: 오늘 더운 데 얼마나 오래 계셨어요?
      note: 노출
    - en: When did you start feeling dizzy or sick out there?
      icon: magnify
      ko: 거기서 언제부터 어지럽거나 메스꺼우셨어요?
      note: 시작
    - en: Did anything help with it, like shade, rest or water?
      icon: coffee
      ko: 그늘, 휴식, 물처럼 도움이 된 게 있었어요?
      note: 대처
    - en: With whatever helped in mind, I'm going to check your temperature and pulse now.
      icon: stetho
      ko: 도움이 된 것을 감안해서 체온과 맥박을 재 볼게요
      note: 측정
