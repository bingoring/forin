- title: 언어 선호 확인
  s:
  - {t: "언어 질문", i: speech, w: "언어를 추측하지 않고 직접 묻는 것이 첫 단계예요. 국적이나 외모로 짐작하면 틀리기 쉬워요.", d: "for your visit", k: ["영어를 할 줄 아세요?", "통역사를 원하세요?"], a: "What", ai: bulb, o: ["Why", "Where", "When"]}
  - {t: "선호 질문", i: monitor, w: "읽기와 듣기를 나란히 물으면 어느 쪽이 약한지 환자가 부담 없이 고를 수 있어요. 말하는 언어와 읽는 언어가 다른 환자도 많아요.", d: "or to write", k: ["읽고 쓰는 법을 배우셨나요?", "설명서를 드릴까요?"], a: "for you", ai: me, o: ["for me", "for us", "for them"]}
  - {t: "자료 안내", i: board, w: "통역뿐 아니라 동의서나 퇴원 안내문 같은 서류도 환자 언어로 제공해야 하는 경우가 많아요. 제공할 수 있다고 먼저 알리면 환자가 요청하기 쉬워요.", d: "in English", k: ["영어 자료만 준비돼 있어요", "서류에 서명하세요"], a: "get", ai: pencil, o: ["lose", "sell", "refuse"]}
  - {t: "선호 질문", i: speech, w: "prefer로 물으면 능력이 아니라 선택을 묻는 모양이라 영어가 서툴러도 부끄럽지 않아요. 영어를 할 수 있어도 의료 대화는 모국어를 원하는 환자가 많아요.", d: "to read", k: ["영어 수업을 들으셨나요?", "통역사가 필요 없으세요?"], a: "own", ai: compass, o: ["old", "next", "last"]}
  - {t: "편한 언어", i: coffee, w: "편한 언어를 물으면 말하기·듣기·읽기를 그 언어에 맞출 수 있어요. 가장 편한 언어가 하나가 아닐 수도 있어요.", d: "at home", k: ["영어가 얼마나 편하세요?", "가장 아픈 곳이 어디세요?"], a: "to you", ai: me, o: ["to me", "to us", "to them"]}
  - {t: "서류 준비", i: pencil, w: "if you'd like to …는 선택을 환자에게 넘기는 정중한 조건문이에요. 읽기를 원하는 환자에게 환자 언어로 된 서류를 줄 수 있다고 알려요.", d: "if you're ready", k: ["서류를 오늘 서명해 주세요", "설명서는 영어로만 있어요"], a: "prepare", ai: compass, o: ["forget", "cancel", "lose"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "언어 선호 확인 순서"
    why: "먼저 어떤 언어를 쓸지 묻고, 그 언어로 읽기와 듣기 중 무엇이 편한지 묻고, 읽기가 편하면 서류를 준비하겠다고 하고, 마지막에 차트에 남긴다고 알려요. that language, reading is easier, all of that이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "What language would you like us to use?", icon: speech, ko: "어떤 언어를 사용해 드릴까요?", note: "질문"}
    - {en: "Is it easier for you to read or to listen in that language?", icon: monitor, ko: "그 언어로는 읽는 게 편하세요, 듣는 게 편하세요?", note: "선호"}
    - {en: "If reading is easier, we'll prepare written materials for you.", icon: board, ko: "읽는 게 편하시면 문서 자료를 준비해 드릴게요", note: "서류"}
    - {en: "I'll note all of that in your chart so the whole team knows.", icon: pencil, ko: "팀 모두가 알도록 그 내용을 차트에 적어 둘게요", note: "기록"}
  sw: {ko: "영어를 읽는 게 편하세요, 아니면 듣는 게 편하세요?"}
- title: 통역 3자 대화 구조
  s:
  - {t: "직접 대화", i: speech, w: "통역을 쓸 때는 통역사가 아니라 환자를 보고 직접 말해요. 3인칭이 아니라 '나'와 '당신'으로 말해야 통역도 그대로 옮길 수 있어요.", d: "to the doctor", k: ["전화기에게 말씀하세요", "저는 의사에게 말하고 있어요"], a: "to you", ai: me, o: ["to her", "to them", "to him"]}
  - {t: "시선 안내", i: magnify, w: "환자와 눈을 맞추면 통역사는 소리로 따라가요. 통역사가 아니라 환자와 대화한다는 것을 몸으로 보여 줘요.", d: "so you can rest", k: ["통역사를 바라봐 주세요", "전화기를 꺼 주세요"], a: "follow", ai: handshake2, o: ["leave", "hang up", "argue"]}
  - {t: "짧게 말하기", i: pencil, w: "통역은 말을 듣고 옮기는 방식이라 문장이 길면 중간을 놓치기 쉬워요. 한두 문장씩 끊어 말하게 안내해요.", d: "in one breath", k: ["천천히 길게 한 번에 말씀하세요", "통역사에게 말씀하세요"], a: "nothing", ai: compass, o: ["something", "everything", "anything"]}
  - {t: "짧게 말하기", i: pencil, w: "so는 이유를 이끌어 문장을 짧게 해야 하는 까닭을 알려요. 통역사가 따라가기 쉬워야 환자의 말이 빠지지 않아요.", d: "and slow", k: ["문장을 길게 말씀해 주세요", "통역사가 말을 잘라요"], a: "short", ai: bell, o: ["long", "loud", "soft"]}
  - {t: "시선 안내", i: magnify, w: "말하는 동안 전화기가 아니라 간호사를 보면 환자가 대화의 중심이 돼요. 표정과 몸짓도 의사소통의 일부예요.", d: "at the monitor", k: ["전화기를 보고 말씀하세요", "말을 멈추고 기다려 주세요"], a: "speak", ai: star, o: ["sleep", "eat", "drink"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "통역 3자 대화 시작 순서"
    why: "시선 안내를 먼저 하고, 그렇게 하면 직접 말하고 통역사가 따라온다고 설명하고, 환자 차례에 짧게 말하게 한 뒤, 시작해요. That way, your turn, all of that이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Please look at me, not at the phone, while we talk.", icon: magnify, ko: "말하는 동안 전화기 말고 저를 봐 주세요", note: "시선"}
    - {en: "That way, I'll speak to you directly, and the interpreter will follow.", icon: speech, ko: "그러면 제가 직접 말하고 통역사가 따라올 거예요", note: "방식"}
    - {en: "When it's your turn, please use short sentences so nothing is missed.", icon: pencil, ko: "환자분 차례에는 놓치는 게 없도록 짧게 말해 주세요", note: "짧게"}
    - {en: "Okay, with all of that in mind, let's begin.", icon: play, ko: "좋아요, 그 점을 생각하며 시작해요", note: "시작"}
  sw: {ko: "환자분의 검사는 오후 3시예요"}
- title: 방언·소수언어 대응
  s:
  - {t: "방언 확인", i: compass, w: "같은 나라 말이라도 방언이 다르면 알아듣기 어려운 경우가 있어요. 통역을 연결하기 전에 방언까지 확인하면 오해가 줄어요.", d: "for the form", k: ["영어 방언이 필요해요", "어떤 약인지 확인하고 싶어요"], a: "right", ai: gear, o: ["wrong", "old", "cheap"]}
  - {t: "지연 안내", i: calendar, w: "may로 확정이 아닌 지연을 예고하면 환자가 기다릴 마음의 준비를 해요. 소수 언어는 통역사 연결에 시간이 더 걸릴 수 있어요.", d: "to call back", k: ["통역사는 바로 올 거예요", "통역사를 찾지 못했어요"], a: "find", ai: coffee, o: ["lose", "pay", "thank"]}
  - {t: "격려", i: star, w: "기다림이나 언어 문제로 환자가 위축될 수 있어요. 잘하고 있다고 말하면 말이 서툰 것이 문제가 아니라는 신호가 돼요.", d: "if you can", k: ["서두르셔야 해요", "잘못하고 계세요"], a: "fine", ai: coffee, o: ["terrible", "wrong", "awful"]}
  - {t: "양해 요청", i: bell, w: "Please be patient는 부탁의 모양이라 기다리라는 명령보다 부드러워요. 이유(방언)를 함께 말하면 기다림이 납득돼요.", d: "so it is free", k: ["방언은 상관없어요", "곧 퇴원하실 거예요"], a: "patient", ai: star, o: ["rude", "upset", "angry"]}
  - {t: "곁에 있기", i: handshake2, w: "곁에서 함께 기다린다고 말하면 낯선 통역을 기다리는 환자가 혼자라고 느끼지 않아요.", d: "and I'll go", k: ["저는 다른 환자를 보러 갈게요", "여기서 혼자 기다려 주세요"], a: "wait", ai: coffee, o: ["leave", "pay", "argue"]}
  - {t: "진행 상황", i: magnify, w: "지금 하고 있는 일을 알려 주면 기다리는 시간이 덜 불안해요. 통역 서비스가 환자의 방언을 쓰는 통역사를 찾아 연결해 줘요.", d: "for a doctor", k: ["통역사가 방언을 가르쳐 드려요", "통역사가 이미 와 있어요"], a: "speaks", ai: speech, o: ["forgets", "fears", "sells"]}
  - {t: "감사", i: trophy, w: "기다림에 감사하면 환자의 인내를 인정하는 거예요. 이 방법이 정확도를 높인다는 이유도 덧붙여요.", d: "for your name", k: ["기다리게 해서 미안해요", "통역은 다음 주에 해요"], a: "right", ai: gear, o: ["wrong", "late", "small"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "방언 통역 지연 안내 순서"
    why: "방언 통역사를 찾아야 한다고 알리고, 시간이 걸려도 그것이 정확도를 높인다고 설명하고, 기다리는 동안 편히 있게 하고, 연결되면 감사해요. that, While we wait이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I need to find an interpreter who speaks your dialect.", icon: compass, ko: "환자분 방언을 하는 통역사를 찾아야 해요", note: "알림"}
    - {en: "It may take a little longer, but that helps us get it right.", icon: calendar, ko: "조금 더 걸릴 수 있지만 그래야 정확해져요", note: "이유"}
    - {en: "While we wait, please take your time and rest.", icon: coffee, ko: "기다리는 동안 편히 쉬세요", note: "배려"}
    - {en: "Thank you for waiting. The interpreter is here now.", icon: star, ko: "기다려 주셔서 감사해요. 통역사가 왔어요", note: "감사"}
  ctx: {word: "find", ko: "찾다"}
- title: 통역 오역 감지
  s:
  - {t: "경청", i: speaker, w: "환자가 길게 말했는데 통역이 짧으면 빠진 부분이 있을 수 있어요. 전부 듣고 싶다고 말하면 통역사에게도 생략하지 말라는 신호예요.", d: "for the team", k: ["말씀이 너무 길어요", "요약해서 들을게요"], a: "all", ai: gear, o: ["none", "half", "most"]}
  - {t: "전체 요청", i: mic, w: "in full은 줄이거나 요약하지 말고 전부라는 뜻이에요. 통역은 요약하지 않고 환자의 말을 그대로 옮기는 것이 원칙이에요.", d: "in brief", k: ["통역사가 요약해 줄 수 있나요?", "그 말은 필요 없어요"], a: "repeat", ai: redo, o: ["skip", "shorten", "hide"]}
  - {t: "재질문", i: compass, w: "같은 질문을 다른 말로 다시 하면 처음 질문 때문에 오해가 생겼는지 구분할 수 있어요. 환자 탓이 아니라 내 질문 탓으로 말하면 덜 부담스러워요.", d: "in the same way", k: ["같은 질문을 똑같이 다시 할게요", "질문은 이게 마지막이에요"], a: "different", ai: bulb, o: ["longer", "louder", "harder"]}
  - {t: "전체 요청", i: redo, w: "every word는 한 마디도 빼지 말라는 강한 요청이에요. 환자 앞에서 통역사에게 정중하게 요청하면 환자도 안심해요.", d: "in short", k: ["통역사에게 대강만 전해 달라고 해 주세요", "통역사에게 천천히 말하라고 해 주세요"], a: "every", ai: star, o: ["no", "some", "half"]}
  - {t: "재확인", i: magnify, w: "통역이 짧게 느껴졌을 때 곧바로 지적하지 않고 다시 확인하자고 하면 통역사도 환자도 체면이 상하지 않아요.", d: "so we'll stop", k: ["길게 느껴졌으니 넘어가요", "짧아서 이만 끝낼게요"], a: "short", ai: chartup, o: ["loud", "late", "rude"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "통역 오역이 의심될 때 순서"
    why: "환자가 말한 것을 다 듣고 싶다고 하고, 통역이 짧게 느껴졌다고 전체를 요청하고, 질문을 바꿔 다시 확인한 뒤, 그래도 안 맞으면 한 번 더 확인해요. it, Thank you, it still이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "You said a lot, and I want to hear all of it.", icon: speaker, ko: "말씀을 많이 하셨고, 전부 듣고 싶어요", note: "경청"}
    - {en: "That felt short, so can the interpreter repeat it in full?", icon: redo, ko: "짧게 느껴졌는데, 전부 다시 말해 줄 수 있나요?", note: "요청"}
    - {en: "Thank you. Let me ask again a different way to be sure.", icon: bulb, ko: "감사해요. 확실히 하려고 다르게 다시 여쭤볼게요", note: "재질문"}
    - {en: "If it still doesn't match, we'll check once more.", icon: magnify, ko: "그래도 맞지 않으면 한 번 더 확인할게요", note: "재확인"}
  sw: {ko: "그걸 전부 다시 말해 줄 수 있어요?"}
