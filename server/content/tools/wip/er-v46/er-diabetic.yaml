      ok: true
    - who: 환자에게
      icon: me
      en: You are sick, and that is causing significant glycemic lability.
      ok: false
      fix: Being sick with the flu can make your sugars harder to control.
    why: glycemic lability(혈당 변동)는 차트의 말이에요. 같은 sick이라도 환자에게는 아프면 혈당이 흔들려 조절이 더 어려워진다고 쉬운 말로 알려요.
    word: sick
    ko: 아픈
  order:
    tag: 대화 흐름
    icon: compass
    ko: 아플 때 혈당 관리 4문장 순서
