      note: 시연
    - en: Please show me how you would do it yourself.
      icon: pill
      ko: 직접 어떻게 하실지 보여주세요
      note: 되짚기
    - en: That's exactly right, you understand this well.
      icon: star
      ko: 맞아요, 정확히 이해하고 계세요
      note: 칭찬
- title: DKA 중증 저칼륨
  sentences:
  - en: Tell me about any muscle weakness or cramping.
    ko: 근육이 약해지거나 쥐가 나는지 말씀해 주세요.
    chunks:
    - Tell me
    - about any muscle
    - weakness or cramping
    - .
    words:
    - w-tell
    - w-muscle
    - w-weakness
    - w-cramp
    goal: 1
    tag: 증상 문진
    icon: stetho
    why: Tell me about…으로 질문 대신 자유롭게 말하게 해서 환자가 느낀 그대로 들어요. 칼륨이 낮으면 근육이 약해지고 쥐가 나며 심하면 부정맥이 와서 증상을 먼저 확인해요.
    decoy: fever or chills
    distractorsKo:
    - 언제부터 그러셨어요?
    - 다리가 저리진 않으세요?
    blank:
      answer: cramping
      options:
      - en: bleeding
      - en: swelling
      - en: itching
      - en: cramping
  - en: Are your muscles feeling weak or crampy?
    ko: 근육이 약하거나 쥐가 나는 느낌이 있으세요?
    chunks:
    - Are your muscles
    - feeling weak
    - or crampy
    - '?'
    words:
    - w-muscle
    - w-feel
    - w-weak
    goal: 1
    tag: 증상 문진
    icon: stetho
    why: feeling weak or crampy로 두 느낌을 형용사로 나란히 줘서 환자가 '네, 그거예요'라고 고르기 쉬워요. crampy는 '쥐가 나는 듯한'이라는 일상어예요.
    decoy: or numb
    distractorsKo:
    - 어느 근육이 가장 심하세요?
    - 걸을 때 힘이 드세요?
    blank:
      answer: weak
      options:
      - en: weak
      - en: strong
      - en: sore
      - en: stiff
  - en: Your potassium is low, so we'll correct it before more insulin.
    ko: 칼륨이 낮아서 인슐린을 더 넣기 전에 먼저 교정할게요.
    chunks:
    - Your potassium is low,
    - so we'll correct it
    - before more
    - insulin
    - .
    words:
    - w-potassium
    - w-low
    - w-correct
    - w-insulin
    goal: 2
    tag: 순서 설명
    icon: lab
    why: so로 결과와 계획을, before로 행동의 순서를 알려 줘요. 인슐린은 칼륨을 세포 안으로 밀어 넣어 혈중 칼륨을 더 떨어뜨려서, DKA에서 칼륨이 낮으면 먼저 채워요.
    decoy: so we'll recheck it
    distractorsKo:
    - 심전도 모니터를 붙일게요
    - 근육 경련은 좀 어떠세요?
    blank:
      answer: before
      options:
      - en: along with
      - en: before
      - en: after
      - en: during
  - en: We're watching your heart rhythm closely on the monitor.
    ko: 모니터로 심장 리듬을 계속 지켜보고 있어요.
    chunks:
    - We're watching
    - your heart rhythm
    - closely
    - on the monitor
    - .
    words:
    - w-watch
    - w-heart
    - w-rhythm
    - w-monitor
    goal: 2
    tag: 감시 안내
    icon: monitor
    why: We're watching…closely는 지금 하는 일을 진행형으로 알려 안심시켜요. 칼륨이 낮으면 심전도가 변하고 위험한 부정맥이 올 수 있어서 모니터로 계속 봐요.
    decoy: on the phone
    distractorsKo:
    - 심전도 전극을 붙일게요
    - 칼륨 수치를 다시 확인할게요
    blank:
      answer: monitor
      options:
      - en: thermometer
      - en: scanner
      - en: monitor
      - en: scale
  - en: We'll hold extra insulin until your potassium improves.
    ko: 칼륨이 좋아질 때까지 인슐린을 잠시 보류할게요.
    chunks:
    - We'll hold
    - extra insulin
    - until your potassium improves
    - .
    words:
    - w-hold
    - w-insulin
    - w-potassium
    goal: 2
    tag: 보류 안내
    icon: pill
    why: hold는 '쓰지 않고 보류한다'는 병원 말이고 until이 풀리는 조건을 알려요. DKA에서 칼륨이 3.3 mEq/L 미만이면 인슐린을 미루고 칼륨부터 채우라는 것이 ADA 지침이에요.
    decoy: boost
    distractorsKo:
    - 칼륨을 정맥으로 넣을게요
    - 혈액검사를 다시 할게요
    blank:
      answer: potassium
      options:
      - en: potassium
      - en: sodium
      - en: calcium
      - en: oxygen
  - en: Any changes on the monitor will tell us right away.
    ko: 모니터에 변화가 있으면 바로 알려드릴게요.
    chunks:
    - Any changes
    - on the monitor
    - will tell us
    - right away
    - .
    words:
    - w-monitor
    - w-tell
    goal: 2
    tag: 감시 안내
    icon: bell
    why: Any changes로 작은 변화도 놓치지 않는다는 뜻을 담고 right away로 바로 알아챈다고 말해요. 칼륨이 떨어지면 T파가 납작해지고 U파가 생기는 식으로 심전도에 먼저 드러나요.
    decoy: by phone
    distractorsKo:
    - 알람이 울려도 놀라지 마세요
    - 전극이 떨어지면 알려 주세요
    blank:
      answer: right away
      options:
      - en: right away
      - en: next week
      - en: in a month
      - en: eventually
  nuance:
  - kind: slider
    words:
    - w-weak
    - w-muscle
    cue: 'Patient: "I can lift my arms, but they feel heavy and I can''t hold them up for long."'
    scale:
    - slightly weak
    - weak
    - paralyzed
    answerAt: 1
    why: 들 수는 있지만 오래 버티지 못하면 weak 쪽이에요. 저칼륨이 심해지면 마비까지 갈 수 있어서 근력 변화를 계속 확인해요.
    example: My legs feel weak, and I'm cramping.
    exKo: 다리에 힘이 없고 쥐가 나요.
  - kind: context
    words:
    - w-potassium
    - w-low
    - w-hold
    - w-insulin
    scenes:
    - who: 동료에게
      icon: monitor
      en: K is 3.1 — we need to hold the insulin drip and start potassium first.
      ok: true
    - who: 차트 기록
      icon: board
      en: Potassium 3.1; insulin held per protocol, KCl infusing, continuous cardiac monitoring.
      ok: true
    - who: 환자에게
      icon: me
      en: Your potassium is 3.1, so we're holding the drip pending repletion.
      ok: false
      fix: Your potassium is low, so we'll give you potassium first and hold off on more insulin.
    why: 인슐린은 칼륨을 세포 안으로 밀어 넣어 혈중 칼륨을 더 떨어뜨려요. 그래서 DKA에서 칼륨이 3.3 mEq/L 미만이면 인슐린을 미루고 칼륨부터 채워요(ADA). 같은 potassium이라도 환자에게는 3.1 같은 수치와 repletion 대신 쉬운 말로 순서를 알려요.
    word: potassium
    ko: 칼륨
  order:
    tag: 대화 흐름
    icon: compass
    ko: DKA 저칼륨 설명 4문장 순서
    why: 칼륨이 낮아 인슐린 전에 교정한다고 알리고, 그것이 일으키는 근육 증상을 묻고, 심장도 영향을 받아 모니터로 본다고 알린 뒤, 그 모니터의 변화로 바로 알 수 있다고 닫아요. 'That'·'too'·'that monitor'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Your potassium is low, so we'll correct it before more insulin.
      icon: lab
      ko: 칼륨이 낮아서 인슐린을 더 넣기 전에 먼저 교정할게요
      note: 칼륨
    - en: That can cause muscle weakness or cramping — have you noticed any?
      icon: stetho
      ko: 그래서 근육이 약해지거나 쥐가 날 수 있는데, 느끼셨어요?
      note: 증상
    - en: Your heart can be affected too, so we're watching its rhythm on the monitor.
      icon: monitor
      ko: 심장도 영향을 받을 수 있어서 모니터로 그 리듬을 지켜보고 있어요
      note: 감시
    - en: Any change on that monitor will tell us right away.
      icon: monitor
      ko: 그 모니터에 변화가 생기면 저희가 바로 알 수 있어요
      note: 알림
- title: DKA 뇌부종(소아)
