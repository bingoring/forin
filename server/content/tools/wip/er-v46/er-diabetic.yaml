    answerAt: 1
    why: 말하다가 잠들지만 건드리면 깨면 drowsy 쪽이에요. HHS는 혈당과 삼투압이 오를수록 의식이 더 떨어지므로, 의식 변화를 계속 비교해 봐요.
    example: She's drowsy but wakes up when I touch her.
