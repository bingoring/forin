      normal: 감정을 있는 그대로 인정한다. 환자가 혼자가 아니라고 느낀다.
      silly: 감정을 깎아내린다. 환자가 속마음을 더 말하지 않게 된다.
      unnecessary: 걱정할 것 없다고 단정해 거짓 안심을 준다. 1형 당뇨는 평생 관리가 필요한 병이다.
