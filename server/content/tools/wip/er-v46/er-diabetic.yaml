      ko: 당연해요, 새 진단 직후엔 대부분 겁이 나요
      note: 정상화
    - en: I'm here to answer any questions you have about it.
      icon: speech
      ko: 그것에 대해 궁금한 점은 뭐든 답해 드릴게요
      note: 질문
    - en: We'll go through those answers step by step, starting with the basics.
      icon: compass
      ko: 그 답을 기초부터 한 단계씩 풀어 드릴게요
      note: 계획
- title: HHS 노인
