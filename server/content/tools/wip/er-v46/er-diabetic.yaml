    lines:
    - en: How long have you had the flu?
      icon: calendar
      ko: 독감을 앓으신 지 얼마나 되셨어요?
      note: 기간
    - en: Have you been able to eat, drink, and take your insulin since it started?
      icon: coffee
      ko: 시작된 뒤로 먹고 마시고 인슐린도 맞을 수 있으셨어요?
      note: 섭취
    - en: Skipping any of those can make your sugars harder to control.
      icon: bulb
      ko: 그걸 거르면 혈당 조절이 더 어려워질 수 있어요
