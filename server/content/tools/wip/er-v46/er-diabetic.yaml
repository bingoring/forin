    - understand
    why: 바이알에서 주사기로 약을 뽑는 것은 draw up the dose, 차근차근은 step by step, 자격을 갖춘 의료 통역사는 a qualified interpreter예요 — 미국 연방 규정이 쓰는 말이 qualified예요.
  - kind: swap
    words:
    - w-bring
    - w-interpreter
    - w-explain
    - w-clearly
    who: 환자에게 · 통역 연결
    icon: me
    before:
    - 'I''ll bring '
    - your son to translate
    - ' so we can explain clearly.'
    options:
    - an interpreter
    - your son to translate
    - a bilingual coworker
    answer: an interpreter
    notes:
      an interpreter: 병원이 무료로 제공하는 자격 있는 의료 통역. 미국 연방 규정(Section 1557)이 병원에 요구한다.
      your son to translate: 가족 통역은 누락·오역이 잦다. 성인 가족은 무료 통역을 안내받은 환자가 원할 때만, 미성년 자녀는 급박한 위험 상황에서 통역을 바로 구할 수 없을 때만 된다.
      a bilingual coworker: 말을 할 줄 아는 것과 의료 통역은 다르다. 통역 자격이 확인된 직원이 아니면 맡기지 않는다.
    why: 인슐린 교육처럼 안전이 걸린 설명에는 자격 있는 통역을 써요. 영어가 서툰 환자에게 미국 병원은 무료 통역을 제공해야 해요.
    ko: 설명을 정확히 드릴 수 있게 통역사를 모셔올게요
  order:
    tag: 대화 흐름
    icon: compass
    ko: 통역 곁들인 인슐린 교육 4문장 순서
    why: 통역을 부른다고 알리고, 그 통역사가 있는 자리에서 단계별로 보여 주고, 그것을 환자가 직접 해 보게 하고, 맞게 하면 칭찬해요. 'the interpreter here'·'do it'·'That'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: I'll bring an interpreter so we can explain clearly.
