  order:
    tag: 대화 흐름
    icon: compass
    ko: 저체온 심정지 지시 4문장 순서
    why: 원칙을 말하고, 그래서 ECMO를 부르고, 그 준비를 알린 뒤, 그 모든 동안의 취급을 당부해요. 'So'·'For that'·'Through all of that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: He's not dead until he's warm and dead — keep resuscitating.
      icon: siren
      ko: 따뜻해질 때까지는 죽은 게 아니에요, 계속 소생시키세요
      note: 원칙
    - en: So it's a deep hypothermic arrest — let's activate the ECMO team now.
      icon: siren
      ko: 그러니 심부저체온 심정지예요, 지금 ECMO 팀을 활성화합시다
      note: 요청
    - en: For that, we're prepping the room for ECMO right now.
      icon: gear
      ko: 그걸 위해 지금 ECMO 방을 준비하고 있어요
      note: 준비
    - en: Through all of that, keep him horizontal and avoid rough handling.
      icon: lock
      ko: 그 모든 동안 수평으로 두고 거친 조작은 피하세요
      note: 취급
