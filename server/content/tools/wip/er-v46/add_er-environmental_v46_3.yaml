- title: 열경련 전해질
  s:
  - t: 원인 설명
    i: bulb
    w: often으로 흔한 원인이라고 말해요. 땀과 함께 염분이 빠지면 근육이 경련하기 쉬워서, 뒤에 나오는 전해질 보충의 이유가 돼요.
    d: after meals
    k:
    - 쥐가 난 곳이 어디예요?
    - 언제부터 쥐가 났어요?
    a: often
    o:
    - rarely
    - never
    - hardly
  - t: 처치 설명
    i: pill
    w: to replace what you lost로 처치의 목적을 쉬운 말로 설명해요. 땀으로 잃은 물과 염분을 다시 채운다는 뜻이라 환자가 수액이 왜 필요한지 이해해요.
    d: in a drink
    k:
    - 스트레칭을 해 볼게요.
    - 쥐가 난 데를 보여 주세요.
    a: replace
    o:
    - remove
    - repeat
    - remember
  - t: 예방 교육
    i: calendar
    w: Next time으로 지금 처치가 아니라 앞으로의 예방으로 말머리를 옮겨요. 땀으로 염분도 빠지니 물만으로는 채워지지 않을 수 있다는 점을 not just water로 덧붙여요.
    d: for a week
    k:
    - 오늘은 쉬세요.
    - 물은 얼마나 드셨어요?
    a: breaks
    o:
    - naps
    - trips
    - notes
  - t: 원인 설명
    i: faceWorried
    w: because로 다리에 쥐가 나는 이유를 알려요. 땀으로 염분이 빠지면 근육이 경련하기 쉬워서, 원인을 설명하면 환자가 자신이 뭘 잘못했다고 느끼지 않아요.
    d: in the morning
    k:
    - 다리를 쭉 펴 보세요.
    - 어디가 제일 아프세요?
    a: because
    o:
    - although
    - unless
    - whereas
  - t: 처치 제안
    i: handshake2
    w: Let's…gently로 같이 한다는 어감과 부드러운 방법을 함께 알려요. 쥐가 난 근육은 천천히 늘려 주면 풀리는 데 도움이 돼요.
    d: in the sun
    k:
    - 다리를 올려 둘게요.
    - 시원한 물을 드릴게요.
    a: ease
    o:
    - spread
    - return
    - repeat
  - t: 예방 교육
    i: calendar
    w: every hour or so로 쉬는 간격을 대략으로 말해 부담을 줄여요. 더위에서 일할 땐 주기적으로 쉬고 수분을 채우는 것이 열 관련 질환의 기본 예방이에요.
    d: at lunch
    k:
    - 오늘 일은 어디서 하세요?
    - 물을 드실 수 있어요?
    a: hour
    o:
    - week
    - month
    - year
  order:
    tag: 대화 흐름
    icon: compass
    ko: 열경련 설명과 예방 4문장 순서
    why: 원인을 말하고, 보충 치료를 알리고, 스트레칭을 더한 뒤, 재발 예방으로 마무리해요. "That's why"·'the fluids'·'it'이 앞 줄을 가리키고 예방은 마지막이라 순서가 하나예요.
    lines:
    - en: Your legs are cramping because your body lost salt through sweat.
      icon: faceWorried
      ko: 땀으로 염분을 잃어서 다리에 쥐가 나는 거예요
      note: 원인
    - en: That's why we'll give you fluids with electrolytes to replace what you lost.
      icon: pill
      ko: 그래서 잃은 걸 보충하려고 전해질이 든 수액을 드릴게요
      note: 보충
    - en: Besides the fluids, let's stretch your leg gently to help the cramp ease.
      icon: handshake2
      ko: 수액 말고도 쥐가 풀리게 다리를 부드럽게 늘려 볼게요
      note: 스트레칭
    - en: Last of all, to keep it from coming back, take breaks and drink electrolyte drinks.
      icon: calendar
      ko: 마지막으로 다시 안 생기게 쉬어 가며 전해질 음료를 드세요
      note: 예방
- title: 고산/환경 노출 언어장벽
  s:
  - t: 통역 문진
    i: speech
    w: Through the interpreter로 통역을 거친다는 것을 먼저 밝혀 질문이 통역을 통해 전달된다는 걸 분명히 해요. 질문은 how high·how fast처럼 짧게 두 가지만 물어야 통역에서 뜻이 덜 흐려져요.
    d: to the top
    k:
    - 언제부터 두통이 있었나요?
    - 산소를 드릴게요.
    a: climb
    o:
    - swim
    - jump
    - throw
  - t: 증상 시작
    i: calendar
    w: When…start로 시작 시점을 묻고 두통과 숨참을 한 문장에 묶어요. 높은 곳에서 두통과 숨참이 언제 생겼는지는 고산병 경과와 위중도를 가늠하는 핵심 단서예요.
    d: again
    k:
    - 지금도 어지러운가요?
    - 같이 가신 분이 있었나요?
    a: When
    o:
    - Why
    - Where
    - How
  - t: 처치 안내
    i: speaker
    w: and로 처치와 설명을 한 문장에 묶어요. 통역을 거치는 환자는 무엇을 하는지 모른 채 처치를 받기 쉬워서 각 단계를 설명하겠다고 미리 약속해요.
    d: by phone
    k:
    - 어디가 가장 불편하세요?
    - 언제 내려오셨어요?
    a: oxygen
    o:
    - food
    - juice
    - ice
  - t: 통역 요청
    i: speech
    w: Please ask him으로 통역사에게 부탁해요. 묻는 내용(how high·how quickly)을 문장에 그대로 넣어 통역사가 바꾸지 않고 옮기게 해요.
    d: if he ate
    k:
    - 환자에게 산소를 드릴게요.
    - 통역사님 잠시 기다려 주세요.
    a: ask
    o:
    - show
    - remind
    - teach
  - t: 증상 확인
    i: faceWorried
    w: Is he still…로 지금도 계속되는지 묻고, 가슴 통증과 혼란을 or로 묶어요. 높은 곳에서 가슴 통증이나 혼란이 있으면 위험한 고산병의 신호일 수 있어 따로 짚어 물어요.
    d: last night
    k:
    - 지금 두통이 가라앉았나요?
    - 산소를 더 드릴까요?
    a: chest
    o:
    - knee
    - wrist
    - ankle
  - t: 설명 안내
    i: speech
    w: slowly는 통역 환자에게 중요한 말투예요. 천천히 짧게 말하면 통역사가 정확히 옮기고 환자가 이해할 시간이 생겨요. everything은 숨기는 것이 없다는 신뢰도 전해요.
    d: in English
    k:
    - 지금 통역사를 연결할게요.
    - 질문이 있으면 말씀하세요.
    a: slowly
    o:
    - quickly
    - loudly
    - secretly
  order:
    tag: 대화 흐름
    icon: compass
    ko: 통역을 통한 고산 문진 4문장 순서
    why: 설명 방식을 알리고, 올라간 높이와 속도를 묻고, 그 답 뒤에 시작 시점을 묻고, 두 답을 바탕으로 지금 증상을 확인해요. 'So'·'that answer'·'both answers'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: We'll explain everything slowly through the interpreter.
      icon: speech
      ko: 통역을 통해 천천히 다 설명해 드릴게요
      note: 안내
    - en: So, please ask him how high he climbed and how quickly.
      icon: speaker
      ko: 그러니 얼마나 높이, 얼마나 빨리 올라갔는지 여쭤봐 주세요
      note: 요청
    - en: With that answer, ask him when the headache and shortness of breath started.
      icon: calendar
      ko: 그 답과 함께 두통과 숨참이 언제 시작됐는지 여쭤봐 주세요
      note: 시작
    - en: Based on both answers, ask if he's still having chest pain or feeling confused.
      icon: faceWorried
      ko: 두 답을 바탕으로 아직 가슴 통증이나 혼란이 있는지 여쭤봐 주세요
      note: 증상
- title: 약물 유발 고체온 감별
  s:
  - t: 원인 추정
    i: bulb
    w: makes me wonder if로 아직 확인 중인 가능성을 가능성으로만 말해요. 뻣뻣함이 있는 고체온은 더위만이 아니라 약물 반응일 수도 있어 원인을 열어 두고 병력을 이어 물어요.
    d: in this room
    k:
    - 약은 언제부터 드셨어요?
    - 몸이 뻣뻣한 곳이 어디예요?
    a: causing
    o:
    - curing
    - treating
    - preventing
  - t: 약 문진
    i: pill
    w: What new…and when으로 새 약과 시작 시점을 한 번에 물어요. 고체온을 일으키는 약은 시작하거나 용량을 바꾼 직후 문제가 생기는 일이 많아서 시점을 같이 물어요.
    d: last year
    k:
    - 어제 먹은 음식이 뭐예요?
    - 체온을 다시 재 볼게요.
    a: medications
    o:
    - jobs
    - hobbies
    - exercises
  - t: 냉각 설명
    i: bandage
    w: while we로 냉각과 원인 찾기를 같이 한다고 알려요. 원인을 찾느라 처치를 미루지 않는다는 점이 환자에게 안심이 돼요.
    d: in an hour
    k:
    - 지금 열이 몇 도예요?
    - 가족에게 연락할까요?
    a: cause
    o:
    - price
    - color
    - number
  - t: 증상 확인
    i: magnify
    w: anywhere besides…로 이미 아는 부위(목·턱)는 빼고 다른 곳을 열어 물어요. 뻣뻣함이 몸 전체로 퍼졌는지는 약물에 의한 근육 경직을 가늠하는 단서예요.
    d: in your sleep
    k:
    - 언제부터 뻣뻣했어요?
    - 드신 약이 있나요?
    a: stiff
    o:
    - numb
    - itchy
    - hungry
  - t: 약 이름
    i: pill
    w: Tell me…and when으로 약 이름과 시작 시점을 요청형으로 물어요. 이름을 정확히 알아야 그 약이 고체온이나 근육 경직과 관련이 있는지 약사와 확인해요.
    d: of your doctor
    k:
    - 약을 몇 알 드셨어요?
    - 그 약을 처방한 분은 누구예요?
    a: name
    o:
    - price
    - owner
    - smell
  - t: 감별 설명
    i: monitor
    w: to see if…or…로 자주 확인하는 이유를 두 가지 가능성으로 설명해요. 환자가 자주 재는 이유를 알면 협조해요.
    d: once a day
    k:
    - 얼음을 대 드릴게요.
    - 약 이름을 알려 주세요.
    a: closely
    o:
    - rarely
    - briefly
    - loosely
  order:
    tag: 대화 흐름
    icon: compass
    ko: 약물 의심 고체온 감별 4문장 순서
    why: 가설을 말하고, 새 약을 묻고, 그 위에 뻣뻣함을 묻고, 둘을 합쳐 체온을 지켜본다고 말해요. 'To find out'·'the medicines'·'both answers'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: The stiffness makes me wonder if a medication is causing this, not just heat.
      icon: bulb
      ko: 이 뻣뻣함 때문에 약물이 원인일 수도 있나 싶어요, 더위만은 아닌 것 같아요
      note: 가설
    - en: To find out, what new medications did you start, and when?
      icon: pill
      ko: 알아보려고요, 어떤 새 약을 언제부터 시작하셨어요?
      note: 약 문진
    - en: On top of the medicines, are you feeling stiff anywhere besides your neck and jaw?
      icon: magnify
      ko: 약 말고도 목과 턱 말고 다른 데도 뻣뻣하세요?
      note: 증상
    - en: With both answers, we're checking your temperature closely.
      icon: monitor
      ko: 두 답을 함께 보면서 체온을 자세히 확인할게요
      note: 감시
  sw:
    ko: 이 뻣뻣함 때문에 약물이 원인일 수도 있나 싶어요.
- title: 열사병 다장기부전
  s:
  - t: 상태 보고
    i: siren
    w: 주어와 수치(core temp)를 앞에 두고 critically high로 심각도를 한 단어에 담아요. with signs of…로 조직 손상의 근거를 뒤에 붙이면 받는 사람이 위중도를 바로 가늠해요.
    d: per protocol
    k:
    - 혈액검사를 지금 보낼게요.
    - 중환자실 병상을 요청해 주세요.
    a: critically
    o:
    - slightly
    - mildly
    - barely
  - t: 처치 보고
    i: bandage
    w: aggressively cooling은 열사병에서 체온을 빠르게 내리는 처치를 가리켜요. checking for…로 합병증(근육 분해, DIC)을 함께 확인한다고 말해 팀이 검사를 준비해요.
    d: for sepsis
    k:
    - 소변이 어두운 색이에요.
    - 중환자실에 연락해 주세요.
    a: muscle
    o:
    - bone
    - tooth
    - hair
  - t: 요청
    i: lab
    w: 진단명 — 필요한 것 순서로 말해요. ready로 미리 준비해 달라고 요청하면 팀이 혈액제제와 검사를 기다리지 않고 준비해요.
    d: right now
    k:
    - 체온이 아직 떨어지지 않아요.
    - 소변 색이 어두워요.
    a: ready
    o:
    - late
    - open
    - empty
  - t: 수치 보고
    i: chartup
    w: despite cooling으로 냉각에도 불구하고 오른다는 위험 신호를 짧게 보고해요. 숫자와 추세(climbing)를 같이 말해야 받는 사람이 긴급도를 알아요.
    d: with fluids
    k:
    - 소변량이 줄고 있어요.
    - 혈압이 떨어지고 있어요.
    a: despite
    o:
    - without
    - after
    - besides
  - t: 소견 보고
    i: lab
    w: 소견 — 걱정 순서로 짧게 말해요. dark urine은 근육 분해로 생기는 흔한 단서라 rhabdo(횡문근융해)를 의심하는 이유를 바로 보여 줘요.
    d: this morning
    k:
    - 소변이 거의 안 나와요.
    - CK 수치를 보냈어요.
    a: dark
    o:
    - clear
    - pale
    - light
  - t: 인계 요청
    i: speaker
    w: 명령(Call the ICU) — 이유(we'll need…) 순서로 짧게 말해요. 이유를 붙이면 중환자실이 어떤 병상과 지지가 필요한지 미리 준비해요.
    d: this afternoon
    k:
    - 혈액제제를 준비해 주세요.
    - 체온은 아직 높아요.
    a: bed
    o:
    - chair
    - form
    - desk
  order:
    tag: 대화 흐름
    icon: compass
    ko: 열사병 다장기부전 보고 4문장 순서
    why: 진단과 요청으로 열고, 처치에도 오르는 체온을 보고하고, 그 체온을 근거로 소견을 더하고, 이 모두를 이유로 중환자실을 부르는 순서예요. 'For that'·'temp that high'·'all of that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Heat stroke with multi-organ failure — I need labs and blood products ready.
      icon: lab
      ko: 다장기부전을 동반한 열사병이에요, 검사와 혈액제제를 준비해 주세요
      note: 진단
    - en: For that, we're cooling aggressively, but his temp's forty-one and climbing.
      icon: chartup
      ko: 그래서 적극 냉각 중인데 체온이 41도이고 오르고 있어요
      note: 체온
    - en: With temp that high, I'm worried about rhabdo — urine is dark.
      icon: lab
      ko: 체온이 그렇게 높아서 횡문근융해가 걱정돼요, 소변이 어두워요
      note: 소견
    - en: Because of all of that, call the ICU — we'll need a bed for multi-organ support.
      icon: speaker
      ko: 그 모두 때문에 중환자실에 연락해 주세요, 다장기 지지 병상이 필요해요
      note: 요청
- title: 심부저체온 심정지
  s:
  - t: 소생 원칙
    i: siren
    w: warm and dead는 저체온 소생의 격언이에요. 차가운 환자는 대사가 낮아 죽은 것처럼 보여도 따뜻하게 만든 뒤에야 판단하므로, 그때까지 소생을 계속하라는 뜻으로 팀에 말해요.
    d: until morning
    k:
    - 심장 리듬을 확인해 주세요.
    - ECMO 팀에 연락해 주세요.
    a: resuscitating
    o:
    - charting
    - talking
    - texting
  - t: 지시
    i: play
    w: Continue…while…으로 지시와 동시에 하는 일을 한 문장에 담아요. 저체온 심정지에서는 재가온하는 동안에도 압박을 멈추지 않는다는 점을 팀이 함께 알아야 해요.
    d: for two minutes
    k:
    - 리듬을 확인할게요.
    - ECMO 팀을 부르세요.
    a: actively
    o:
    - rarely
    - briefly
    - quietly
  - t: 요청
    i: siren
    w: 진단 — 지시 순서예요. let's로 팀이 함께 하는 일로 말하고 now로 급함을 전해요. ECMO는 체온을 올리면서 순환을 대신해 줄 수 있는 치료예요.
    d: for you
    k:
    - 압박을 계속해 주세요.
    - 체온을 다시 재 주세요.
    a: activate
    o:
    - meet
    - train
    - thank
  - t: 상태 보고
    i: monitor
    w: still은 아직 변화가 없다는 뜻이고 so we continue…로 그래서 하는 일을 이어요. 이유와 행동을 한 문장에 붙이면 팀이 왜 압박을 이어 가는지 알아요.
    d: after two shocks
    k:
    - ECMO 팀이 오고 있어요.
    - 체온이 아직 낮아요.
    a: still
    o:
