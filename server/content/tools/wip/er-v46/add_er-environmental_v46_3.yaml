    - rarely
    - barely
  - t: 취급 주의
    i: lock
    w: Keep…and avoid…로 해야 할 일과 피할 일을 한 문장에 나눠요. 심한 저체온 환자의 심장은 거친 조작에 예민해서 자세와 이동을 조심스럽게 다뤄야 해요.
    d: in the hallway
    k:
