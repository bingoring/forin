    i: gear
    w: We're prepping…right now는 지금 진행 중인 준비를 알려요. 팀이 ECMO를 곧 시작할 수 있게 방과 장비를 미리 준비하는 일이라 진행 상황을 알려야 서로 기다리지 않아요.
    d: this evening
