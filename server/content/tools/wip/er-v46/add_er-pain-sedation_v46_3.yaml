- title: 진통제 거부 환자
  s:
  - {t: "걱정 묻기", i: speech, w: "what worries you는 거부의 이유를 판단 없이 열어 주는 질문이에요. 거부 이유(부작용이나 중독 걱정 등)를 알아야 대안을 제안할 수 있어요.", d: "what helps you", k: ["약을 먹기 싫으신 이유를 적어 둘게요", "약은 꼭 드셔야 해요"], a: "medicine", ai: pill, o: [["food", "coffee"], ["bed", "home"], ["schedule", "calendar"]]}
  - {t: "선택 존중", i: handshake2, w: "choice를 존중한다고 먼저 말하면 거절이 논쟁으로 번지지 않아요. 환자에게는 치료를 거부할 권리가 있고, 그 뒤에 대안을 이야기하는 것이 이어지는 돌봄이에요.", d: "— let's skip", k: ["선택을 바꾸셔야 해요", "의사에게 말씀하셔도 소용없어요"], a: "respect", ai: check, o: [["doubt", "cross"], ["question", "bulb"], ["hate", "faceAngry"]]}
  - {t: "단계적 제안", i: pill, w: "if you prefer는 환자에게 선택권을 돌려줘요. 순한 약부터 시작해 필요하면 올리는 단계적 접근은 걱정이 큰 환자가 받아들이기 쉬워요.", d: "if you must", k: ["더 센 약으로 바로 시작할게요", "약 없이 끝까지 참으셔야 해요"], a: "milder", ai: shield, o: [["stronger", "chartup"], ["sweeter", "coffee"], ["faster", "play"]]}
  - {t: "일반화", i: faceWorried, w: "Some patients …로 일반화하면 환자가 자기 걱정을 이상하게 여기지 않고 말해요. 졸림과 통제력 상실은 진정 효과가 있는 진통제를 꺼리는 흔한 이유예요.", d: "about visiting", k: ["대부분의 환자는 약을 걱정하지 않아요", "환자분만 그렇게 걱정하세요"], a: "sleepy", ai: bell, o: [["hungry", "coffee"], ["proud", "trophy"], ["busy", "gear"]]}
  - {t: "대안 약", i: pill, w: "non-opioid는 마약성이 아닌 진통제(아세트아미노펜, NSAID 등)를 가리켜요. 마약성 약을 꺼리는 환자에게도 통증 조절을 포기하지 않는다는 뜻을 전해요.", d: "an opioid option", k: ["마약성 진통제를 더 드릴게요", "진통제는 쓰지 않을 거예요"], a: "instead", ai: compass, o: [["later", "calendar"], ["again", "redo"], ["tomorrow", "home"]]}
  - {t: "자기결정", i: star, w: "whatever you decide는 어떤 결정이든 존중한다는 뜻이라 거부하는 환자가 압박받지 않아요. 다만 필요하면 의사에게 알리고 위험을 설명해야 하는 책임은 남아 있어요.", d: ", but I'll argue", k: ["결정은 제가 대신 할게요", "환자분의 선택은 중요하지 않아요"], a: "support", ai: handshake2, o: [["question", "bulb"], ["judge", "faceAngry"], ["change", "redo"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "진통제를 거부하는 환자 4문장 순서"
    why: "걱정이 무엇인지 먼저 물어요. 그 걱정(that)이 흔하다고 알린 뒤, 더 순한 약이나 비마약성 약을 제안해요. 마지막은 어떤 결정이든 지지한다는 말이에요(Whatever you decide)."
    lines:
    - {en: "First, can you tell me what worries you about the medicine?", icon: speech, ko: "먼저 약에 대해 어떤 점이 걱정되세요?", note: "질문"}
    - {en: "Thank you. Many patients worry about that.", icon: faceWorried, ko: "감사해요. 많은 분들이 그 점을 걱정해요", note: "공감"}
    - {en: "If you prefer, we can try something milder or a non-opioid option.", icon: pill, ko: "원하시면 순한 약이나 비마약성 약을 해볼 수 있어요", note: "제안"}
    - {en: "Whatever you decide, it's your choice, and I'll support it.", icon: star, ko: "무엇을 결정하시든 환자분의 선택이고 지지할게요", note: "지지"}
  sw: {ko: "선택을 존중해요, 다른 방법도 이야기해봐요"}
- title: 다중 약물 병용 통증
  s:
  - {t: "복용약 나열", i: pill, w: "Can you list는 한 번에 모두 말해 달라는 부드러운 부탁이에요. 사 먹는 약, 수면제, 보충제까지 포함해 물어야 병용 위험을 빠뜨리지 않아요.", d: "the doctors you", k: ["오늘 몇 시에 일어나셨어요?", "오늘 식사를 하셨나요?"], a: "list", ai: pencil, o: [["sell", "star"], ["hide", "lock"], ["forget", "cross"]]}
  - {t: "위험 안내", i: bell, w: "together라는 한 단어로 약이 합쳐질 때 문제가 생긴다는 핵심을 전해요. 졸리게 하는 약끼리는 효과가 겹쳐 더 졸릴 수 있어요.", d: "one by one", k: ["이 약들은 서로 아무 문제가 없어요", "이 약 하나만으로도 위험해요"], a: "together", ai: handshake2, o: [["alone", "me"], ["tomorrow", "calendar"], ["outside", "home"]]}
  - {t: "안전 선택", i: shield, w: "이미 먹는 약을 고려해 고른다고 알리면 환자가 약 때문에 위험해질까 하는 걱정을 덜어요. 약의 상호작용은 약사와 의사가 함께 확인하는 것이 안전해요.", d: "risky with", k: ["제일 센 약부터 고를게요", "드시는 약을 모두 끊을게요"], a: "safe", ai: check, o: [["cheap", "star"], ["heavy", "chevronDown"], ["fast", "play"]]}
  - {t: "위험 설명", i: lock, w: "진정 효과가 있는 약과 마약성 진통제를 함께 쓰면 호흡을 느리게 하는 효과가 겹칠 수 있어요. 환자에게는 slow your breathing처럼 그려지는 말로 설명해요.", d: "can help your", k: ["진정제는 호흡에 도움이 돼요", "진통제를 섞으면 더 빨리 나아요"], a: "slow", ai: siren, o: [["speed", "play"], ["improve", "star"], ["boost", "chartup"]]}
  - {t: "위험 설명", i: faceWorried, w: "too … to … 틀은 졸림이 안전을 해칠 정도라는 뜻이에요. 너무 졸리면 낙상이나 호흡 문제의 위험이 커져서 미리 알려요.", d: "keep you", k: ["이 조합은 아주 안전해요", "이 조합은 잠을 못 자게 해요"], a: "drowsy", ai: bell, o: [["hungry", "coffee"], ["angry", "faceAngry"], ["late", "calendar"]]}
  - {t: "용량 선택", i: gear, w: "that risk로 앞에서 설명한 위험을 가리켜 이어 말해요. 병용 위험이 있을 때는 처방 범위 안에서 용량을 낮추거나 조정하고, 그 계획을 환자에게 풀어 설명해요.", d: "that will add", k: ["위험을 더 크게 할 용량을 고를게요", "용량은 환자분이 직접 고르세요"], a: "risk", ai: siren, o: [["cost", "star"], ["weight", "chartup"], ["noise", "speaker"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "여러 약을 함께 먹는 환자 4문장 순서"
    why: "먹은 약부터 말하게 해요. 그 약들(those)이 함께 졸리게 할 수 있다고 알리고, 진통제를 더하면 그것(that)이 호흡까지 느리게 할 수 있다고 설명해요. 그래서(that risk) 용량을 고른다고 마무리해요."
    lines:
    - {en: "Can you list the medicines you took today?", icon: pencil, ko: "오늘 드신 약들을 말씀해 주시겠어요?", note: "확인"}
    - {en: "Some of those can make you very sleepy together.", icon: bell, ko: "그중 몇 가지는 함께면 많이 졸리게 해요", note: "위험"}
    - {en: "With pain medicine added, that can even slow your breathing.", icon: lock, ko: "진통제까지 더하면 호흡이 느려질 수도 있어요", note: "설명"}
    - {en: "So I'll pick a dose that won't add to that risk.", icon: gear, ko: "그 위험을 더하지 않을 용량으로 고를게요", note: "선택"}
  ctx: {word: "slow", ko: "느려지게 하다"}
- title: 언어장벽 통증 사정
  s:
  - {t: "통역 연결", i: speech, w: "자격을 갖춘 의료 통역사를 쓰면 통증 설명이 정확해져요. 미국 병원은 영어가 서툰 환자에게 통역 서비스(대면·전화·화상)를 제공해야 해요.", d: "so we argue", k: ["가족을 불러올게요", "의사 선생님을 불러올게요"], a: "get", ai: check, o: [["fire", "cross"], ["hide", "lock"], ["ignore", "bell"]]}
  - {t: "얼굴 척도", i: faceWorried, w: "통증 얼굴 척도(Wong-Baker FACES 등)는 말이 통하지 않아도 강도를 표현하게 해 줘요. 숫자 대신 얼굴을 고르게 하면 영어가 서툰 환자나 아이도 답할 수 있어요.", d: "that scares", k: ["통증이 있는 부위를 가리켜 주세요", "통증이 시작된 날짜를 가리켜 주세요"], a: "matches", ai: check, o: [["hides", "lock"], ["causes", "siren"], ["fixes", "gear"]]}
  - {t: "손짓 사정", i: me, w: "Show me …는 말을 못 해도 몸짓으로 답할 수 있게 해요. 짧고 쉬운 동사 위주 문장은 통역이 오기 전에도 알아듣기 쉬워요.", d: "with your foot", k: ["아픈 날짜를 말씀해 주세요", "아픈 정도를 숫자로 말씀해 주세요"], a: "hurts", ai: faceWorried, o: [["heals", "bandage"], ["itches", "bell"], ["grows", "chartup"]]}
  - {t: "척도 설명", i: star, w: "양 끝(통증 없음, 가장 심한 통증)을 먼저 알려 주면 환자가 그 사이에서 고를 수 있어요. 척도의 끝은 쉬운 단어로 천천히 설명해요.", d: "means a happy day", k: ["이 얼굴은 가장 행복한 상태를 뜻해요", "두 얼굴 모두 같은 통증이에요"], a: "worst", ai: siren, o: [["best", "trophy"], ["same", "handshake2"], ["first", "calendar"]]}
  - {t: "비언어 응답", i: handshake2, w: "말하기 힘든 환자에게는 손을 쥐는 간단한 신호로 답하게 해요. 쥐기로 예·아니요를 미리 약속해 두면 통증과 의식 상태를 계속 확인할 수 있어요.", d: "when you can", k: ["숨을 크게 쉬어 보세요", "눈을 감고 계세요"], a: "Squeeze", ai: check, o: [["Drop", "chevronDown"], ["Wash", "bandage"], ["Paint", "pencil"]]}
  - {t: "관찰 안내", i: stetho, w: "말이 통하지 않을 때는 호흡과 표정 같은 비언어 신호가 중요한 단서예요. 지켜본다고 알리면 환자가 말하지 못해도 돌봄을 받고 있다고 느껴요.", d: "I'm asking about", k: ["숨 쉬는 소리는 안 들어요", "표정은 기록하지 않아요"], a: "watching", ai: monitor, o: [["ignoring", "lock"], ["forgetting", "cross"], ["missing", "magnify"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "영어가 서툰 환자의 통증 사정 4문장 순서"
    why: "통역사를 부르는 것이 먼저예요. 기다리는 동안(While we wait) 얼굴 척도를 가리키게 하고, 그것(that)이 어려우면 손으로 보여 달라고 해요. 어느 쪽이든(Either way) 호흡과 얼굴을 계속 지켜본다고 마무리해요."
    lines:
    - {en: "Let me get an interpreter so we understand each other.", icon: speech, ko: "서로 이해할 수 있게 통역사를 불러올게요", note: "통역"}
    - {en: "While we wait, point to the face that matches your pain.", icon: faceWorried, ko: "기다리는 동안 통증과 맞는 얼굴을 가리켜 주세요", note: "척도"}
    - {en: "If that's hard, just show me with your hand where it hurts.", icon: me, ko: "그게 어려우면 손으로 아픈 곳을 보여 주세요", note: "손짓"}
    - {en: "Either way, I'll keep watching your breathing and your face.", icon: monitor, ko: "어느 쪽이든 호흡과 표정을 계속 지켜볼게요", note: "관찰"}
  sw: {ko: "서로 이해할 수 있게 통역사를 불러올게요"}
- title: 회복 마취 후 관찰
  s:
  - {t: "지남력 확인", i: speech, w: "이름과 장소를 묻는 것은 마취에서 깨어난 환자의 지남력(의식과 방향 감각)을 확인하는 기본 질문이에요. 짧고 천천히 말해야 졸린 환자도 따라와요.", d: "your phone", k: ["어디가 아픈지 말씀해 주세요", "약을 언제 드셨는지 말씀해 주세요"], a: "name", ai: me, o: [["address", "home"], ["weight", "chartup"], ["diet", "coffee"]]}
  - {t: "호흡 요청", i: monitor, w: "nice deep breath는 환자가 숨을 스스로 깊게 쉬는지 확인하는 간단한 요청이에요. for me를 붙이면 지시가 아니라 부탁처럼 들려 졸린 환자가 따라 하기 쉬워요.", d: "long sigh", k: ["숨을 참고 계세요", "입을 크게 벌려 주세요"], a: "deep", ai: chartup, o: [["shallow", "chevronUp"], ["short", "play"], ["tiny", "baby"]]}
  - {t: "격려", i: trophy, w: "You did great로 환자를 칭찬하면서 all done으로 끝났음을 분명히 알려요. 깨어나는 환자에게는 3인칭 보고 말투 대신 you로 직접 말해요.", d: "visit is", k: ["시술이 이제 막 시작됐어요", "시술이 아직 절반 남았어요"], a: "procedure", ai: scalpel, o: [["paperwork", "board"], ["dinner", "coffee"], ["meeting", "speech"]]}
  - {t: "지남력 확인", i: compass, w: "날짜를 묻는 것은 마취에서 깨어난 환자의 지남력을 보는 질문이에요. 답이 흐리면 아직 약기운이 남아 있다는 신호라 계속 지켜봐요.", d: "how old", k: ["지금 몇 시인지 아세요?", "오늘 날씨를 아세요?"], a: "day", ai: calendar, o: [["color", "star"], ["size", "chevronUp"], ["weight", "gear"]]}
  - {t: "호흡 설명", i: stetho, w: "much better now로 이전과 비교해 좋아졌다고 알려 주면 환자가 안심해요. 호흡 상태를 말로 알려 주는 것은 회복 중 환자에게 중요한 피드백이에요.", d: "much worse", k: ["호흡이 아직 불안정해요", "호흡 소리가 시끄러워요"], a: "better", ai: star, o: [["worse", "faceWorried"], ["heavier", "chevronDown"], ["faster", "play"]]}
  - {t: "안심시키기", i: shield, w: "깨어나는 환자는 어디에 있는지 몰라 불안할 수 있어서 safe를 먼저 말해 줘요. 결과는 짧게 알리고 자세한 설명은 환자가 더 깨어난 뒤에 해요.", d: "but everything", k: ["아직 위험한 상태예요", "시술이 잘 안 됐어요"], a: "safe", ai: check, o: [["late", "calendar"], ["sorry", "faceWorried"], ["angry", "faceAngry"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "마취에서 깨어난 환자 4문장 순서"
    why: "끝났다는 말로 안심시킨 뒤 이름과 장소를 물어요. 답을 들으면 감사하고(Thank you) 날짜를 물어요. 마지막은 대답에 이어(Good) 호흡이 좋아졌다고 알려요."
    lines:
    - {en: "You did great — the procedure is all done.", icon: trophy, ko: "정말 잘하셨어요, 시술이 다 끝났어요", note: "격려"}
    - {en: "Can you tell me your name and where you are?", icon: speech, ko: "성함과 지금 계신 곳을 말씀해 주시겠어요?", note: "이름"}
    - {en: "Thank you. Do you know what day it is?", icon: compass, ko: "감사해요. 오늘이 며칠인지 아세요?", note: "날짜"}
    - {en: "Good, your breathing looks much better now.", icon: stetho, ko: "좋아요, 호흡이 훨씬 좋아지셨어요", note: "호흡"}
  ctx: {word: "procedure", ko: "시술"}
- title: 절차적 진정 중 호흡억제
  s:
  - {t: "호흡 지시", i: monitor, w: "호흡이 느려질 때는 짧고 구체적인 지시가 가장 잘 전달돼요. right now로 급하다는 점을 알리고 deeply로 행동을 정확히 말해요.", d: "for him", k: ["숨을 참고 계세요", "눈을 감고 쉬세요"], a: "deeply", ai: chevronDown, o: [["lightly", "chevronUp"], ["quietly", "mic"], ["rarely", "calendar"]]}
  - {t: "각성 자극", i: faceWorried, w: "눈을 뜨고 손을 쥐게 하는 것은 의식과 반응을 확인하는 가장 단순한 명령이에요. 두 동작을 한 번에 말해 환자의 반응 정도를 한눈에 봐요.", d: "— shake", k: ["눈을 감고 계세요", "다리를 움직여 보세요"], a: "squeeze", ai: handshake2, o: [["drop", "chevronDown"], ["wash", "bandage"], ["hide", "lock"]]}
  - {t: "산소 투여", i: lab, w: "extra oxygen이라고 쉬운 말로 알려 주면 환자가 지금 무슨 일이 일어나는지 알아요. 진정 중 호흡이 느려지면 먼저 산소를 올리고 기도를 열어 주는 것이 기본이에요.", d: "to let you", k: ["수액을 더 드리고 있어요", "약을 더 드리고 있어요"], a: "oxygen", ai: monitor, o: [["water", "coffee"], ["pillows", "home"], ["blankets", "bandage"]]}
  - {t: "도움 요청", i: siren, w: "수치가 떨어지는 사실을 알리고 그래서 도움을 부른다고 이유를 이으면 환자가 불안한 와중에도 상황을 이해해요. 진정 중에는 도움 요청이 지체 없이 이뤄져야 해요.", d: ", so I'm leaving", k: ["산소가 충분히 올라가고 있어요", "산소가 필요 없어졌어요"], a: "dropping", ai: chevronDown, o: [["rising", "chevronUp"], ["improving", "star"], ["growing", "chartup"]]}
  - {t: "기도 확보", i: stetho, w: "기도를 연다는 말을 미리 하면 머리나 턱을 만져도 환자가 놀라지 않아요. 진정 중 호흡이 약하면 턱을 들거나 기도를 열어 주는 조치를 해요.", d: "check your arm", k: ["지금 바로 침대에서 내려오세요", "지금 산소 마스크를 벗겨 드릴게요"], a: "open", ai: play, o: [["close", "lock"], ["block", "cross"], ["cover", "shield"]]}
  - {t: "의식 유지", i: me, w: "Stay with me는 곁에 있겠다는 신호이면서 환자가 의식을 붙잡게 해요. 눈 뜨기 같은 행동 지시는 반응을 확인하는 수단도 돼요.", d: "and let go", k: ["눈을 감고 쉬세요", "저를 보지 말고 누워 계세요"], a: "open", ai: magnify, o: [["closed", "lock"], ["shut", "cross"], ["down", "chevronDown"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "진정 중 호흡이 느려질 때 4문장 순서"
    why: "수치가 떨어진다고 알리며 숨을 크게 쉬게 해요. 그것(that)을 돕는 산소를 준다고 말하고, 그래도 오르지 않으면(it) 기도를 연다고 알려요. 마지막은 그 조치(that) 동안 눈을 뜨게 해요."
    lines:
    - {en: "Your oxygen level is dropping, so breathe deeply for me.", icon: monitor, ko: "산소포화도가 떨어져서 깊게 숨을 쉬어 주세요", note: "지시"}
    - {en: "We're giving you extra oxygen to help with that.", icon: lab, ko: "그걸 돕도록 산소를 더 드리고 있어요", note: "산소"}
    - {en: "If it doesn't come up, I'm going to open your airway.", icon: stetho, ko: "오르지 않으면 기도를 열어 드릴게요", note: "기도"}
    - {en: "Stay with me and keep your eyes open while I do that.", icon: me, ko: "제가 그걸 하는 동안 눈을 계속 뜨고 계세요", note: "의식"}
  ctx: {word: "oxygen level", ko: "산소포화도"}
- title: 오피오이드 과다·날록손
  s:
  - {t: "상황 설명", i: bell, w: "reversal medicine은 약의 효과를 되돌리는 약이라는 쉬운 설명이에요. 왜 약을 줬는지(숨을 잘 못 쉬었다)를 먼저 말하면 환자가 놀라지 않아요.", d: ", so we told you", k: ["숨 쉬는 게 더 좋아져서 약을 줄였어요", "수면제를 드렸어요"], a: "reversal", ai: redo, o: [["sleeping", "coffee"], ["cough", "speaker"], ["heart", "stetho"]]}
  - {t: "복용 확인", i: pill, w: "무엇을 얼마나 복용했는지는 과다복용 치료에서 가장 중요한 정보예요. 판단하지 않는 말투로 물어야 환자가 사실대로 답해요.", d: "what you need", k: ["오늘 뭘 드셔야 하는지 아세요?", "오늘 몇 시에 일어나셨는지 아세요?"], a: "took", ai: check, o: [["wore", "home"], ["sold", "star"], ["painted", "pencil"]]}
  - {t: "증상 안내", i: faceWorried, w: "날록손 뒤에는 약효가 갑자기 풀려 메스꺼움·떨림 같은 금단 증상이 올 수 있어요. that will pass로 일시적이라고 알리면 환자가 놀라지 않아요.", d: "— that will stay", k: ["메스꺼움은 오래 갈 거예요", "떨림은 위험해서 약을 더 드릴게요"], a: "shaky", ai: siren, o: [["hungry", "coffee"], ["proud", "trophy"], ["calm", "star"]]}
  - {t: "지속 시간", i: calendar, w: "날록손은 작용 시간이 짧아서, 마약성 약이 더 오래 남으면 호흡이 다시 느려질 수 있어요. 그래서 약이 풀린 뒤에도 환자를 지켜봐요.", d: ", so it lasts", k: ["이 약은 마약성 약보다 오래 가요", "이 약은 한 번 맞으면 영구히 가요"], a: "sooner", ai: play, o: [["later", "redo"], ["easier", "faceWorried"], ["louder", "speaker"]]}
  - {t: "통증 재발", i: chartup, w: "역전제는 진통 효과까지 되돌리므로 통증이 다시 올 수 있어요. 미리 알리면 통증이 돌아와도 약이 잘못된 게 아니라고 이해해요.", d: "away when", k: ["통증은 이제 다시 안 올 거예요", "약이 오래 남아서 통증이 없을 거예요"], a: "once", ai: calendar, o: [["unless", "lock"], ["because", "bell"], ["while", "play"]]}
  - {t: "관찰 약속", i: monitor, w: "역전제 뒤에는 약효가 다시 올라올 수 있어서 몇 시간 지켜보는 것이 일반적이에요. 얼마나 지켜볼지는 약과 환자 상태에 따라 병원 지침으로 정해요.", d: "for the days", k: ["한 시간 안에 퇴원하실 거예요", "저는 바로 자리를 비울 거예요"], a: "hours", ai: coffee, o: [["seconds", "play"], ["weeks", "home"], ["years", "star"]]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "날록손 투여 후 설명 4문장 순서"
    why: "숨을 못 쉬어서 역전제를 줬다고 먼저 알려요. 그 뒤 올 수 있는 증상(that will pass)을 말하고, 약이 풀리면(it wears off) 통증이 돌아올 수 있다고 해요. 그래서(So) 몇 시간 곁에서 지켜본다고 마무리해요."
    lines:
    - {en: "You stopped breathing well, so we gave you a reversal medicine.", icon: bell, ko: "호흡이 잘 안 되셔서 역전제를 드렸어요", note: "설명"}
    - {en: "You may feel sick or shaky for a bit, but that will pass.", icon: faceWorried, ko: "잠시 속이 안 좋거나 떨릴 수 있지만 곧 지나가요", note: "증상"}
    - {en: "It works fast, but your pain may come back as it wears off.", icon: calendar, ko: "빨리 듣지만 약효가 풀리면 통증이 돌아올 수 있어요", note: "재발"}
    - {en: "So we'll stay close and watch you for a few hours.", icon: monitor, ko: "그러니 몇 시간 동안 가까이서 지켜볼게요", note: "관찰"}
  sw: {ko: "숨 쉬는 걸 돕는 나르칸이라는 약을 드렸어요"}
