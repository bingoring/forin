- title: 저나트륨성 의식저하
  s:
  - {t: "수분 섭취", i: coffee, w: "each day로 하루 기준을 정해 대답이 양으로 나와요. 물을 지나치게 많이 마셔도 혈중 나트륨이 묽어져 낮아질 수 있어서 많은 양도 중요한 단서예요.", d: "salt", k: ["소금은 얼마나 드세요?", "하루에 소변은 몇 번 보세요?"], a: "water", o: ["coffee", "soda", "milk"]}
  - {t: "구토·설사", i: bell, w: "구토와 설사는 수분과 나트륨을 잃는 흔한 원인이라 최근 일을 먼저 물어요. Any로 시작하면 환자가 짧게 예·아니요로 답해요.", d: "constant", k: ["최근에 이뇨제를 시작하셨나요?", "최근에 열이 난 적이 있나요?"], a: "vomiting", o: ["bleeding", "coughing", "headaches"]}
  - {t: "검사 알림", i: lab, w: "electrolytes는 나트륨·칼륨 같은 혈중 전해질을 뜻해요. 의식이 흐린 환자에게 지금 하는 일을 알리면 협조가 쉬워요.", d: "levels", k: ["소변을 받아서 검사할게요", "전해질 주사를 놓을게요"], a: "electrolytes", o: ["allergies", "vitamins", "medicines"]}
  - {t: "과음수", i: coffee, w: "than usual로 평소와 비교해 물어요. 물을 갑자기 훨씬 많이 마시는 것은 호르몬이나 정신과적 원인의 단서가 될 수 있어요.", d: "extra", k: ["평소에 짠 음식을 많이 드세요?", "소변 색이 평소와 다른가요?"], a: "drink", o: ["boil", "waste", "spill"]}
  - {t: "결과 안내", i: chartup, w: "dangerously로 위험하다는 점을 숨기지 않고 알려요. 나트륨이 많이 낮으면 뇌가 붓고 경련이 생길 수 있어요.", d: "slightly", k: ["칼륨 수치는 정상이에요", "혈당은 정상이에요"], a: "sodium", o: ["potassium", "calcium", "glucose"]}
  - {t: "치료 설명", i: gear, w: "너무 빨리 올리면 뇌세포가 손상될 수 있어서 천천히 올린다고 알려요. 자주 다시 재면서 속도를 조절해요.", d: "double", k: ["물 섭취를 제한할게요", "내일 아침에 다시 채혈할게요"], a: "raise", o: ["lower", "drop", "cut"]}
  order: {tag: "대화 흐름", icon: compass, ko: "저나트륨 의식저하 4문장 순서", why: "수분 섭취를 묻고, 'because of that'으로 전해질 검사를 알리고, 나트륨이 낮다고 결과를 전하고, 'it'이 가리키는 수치를 천천히 올린다고 알려요. because of that과 it이 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "How much water do you drink each day?", icon: coffee, ko: "하루에 물을 얼마나 드시나요?", note: "문진"},
    {en: "I'll check your electrolytes right now because of that.", icon: lab, ko: "그래서 지금 전해질을 확인할게요", note: "검사"},
    {en: "Your sodium level is dangerously low.", icon: chartup, ko: "나트륨 수치가 위험할 정도로 낮아요", note: "결과"},
    {en: "We'll raise it slowly and carefully.", icon: gear, ko: "천천히, 신중하게 올릴게요", note: "치료"}]}
  sw: {ko: "나트륨을 천천히 조심스럽게 올릴 거예요"}
- title: 약물 과량 의식저하
  s:
  - {t: "섭취 확인", i: pill, w: "무엇을과 얼마나를 한 문장에 묻으면 놓치는 것이 적어요. 약의 종류와 양은 해독제와 감시 수준을 정해요.", d: "drink", k: ["처음 발견한 게 언제인가요?", "평소 어떤 약을 드시나요?"], a: "take", o: ["wear", "sell", "hide"]}
  - {t: "증상 보고", i: magnify, w: "바늘구멍 동공과 느린 호흡은 아편류 과량의 대표 소견이에요. 눈과 호흡을 한 문장에 묶어 간결하게 보고해요.", d: "round", k: ["맥박이 매우 빨라요", "혈압은 정상이에요"], a: "pinpoint", o: ["dilated", "uneven", "large"]}
  - {t: "해독제 투여", i: pill, w: "naloxone은 아편류가 일으킨 호흡 억제를 되돌리는 해독제예요. 지금 하는 일을 현재진행형으로 알려요.", d: "again", k: ["지금 산소를 대 드릴게요", "지금 심전도를 찍을게요"], a: "naloxone", o: ["insulin", "heparin", "dextrose"]}
  - {t: "현장 단서", i: magnify, w: "빈 약병이 있으면 무슨 약을 얼마나 먹었는지 알아낼 수 있어요. nearby는 환자 곁에서 찾았는지를 뜻해요.", d: "broken", k: ["환자가 약을 먹는 걸 본 사람이 있나요?", "현장 근처에 술병은 없었나요?"], a: "nearby", o: ["abroad", "overseas", "downtown"]}
  - {t: "기도 평가", i: stetho, w: "호흡이 약하면 삽관이 필요할 수 있어서 미리 평가해요. a breathing tube는 환자와 가족에게 쓰는 쉬운 말이에요.", d: "long", k: ["산소포화도가 떨어지는지 보고 있어요", "혈압이 괜찮은지 확인하고 있어요"], a: "breathing", o: ["feeding", "chest", "urine"]}
  - {t: "경과 예고", i: chartup, w: "should는 '그럴 것이다'라는 예상이라 확답이 아니에요. 날록손은 몇 분 안에 호흡이 좋아지지만 다시 나빠질 수 있어서 계속 지켜봐요.", d: "slowly", k: ["맥박이 곧 안정될 거예요", "곧 중환자실로 옮길 거예요"], a: "improve", o: ["worsen", "return", "resume"]}
  order: {tag: "대화 흐름", icon: compass, ko: "약물 과량 응대 4문장 순서", why: "눈과 호흡 소견을 보고하고, 'So'로 해독제를 이어 알리고, 'that'이 가리키는 약이 듣는 동안 기도를 평가하고, 'After that'으로 호흡이 좋아질 것이라 알려요. So·that·After that이 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "His pupils are pinpoint and his breathing is slow.", icon: magnify, ko: "동공이 바늘구멍만하고 호흡이 느려요", note: "소견"},
    {en: "So we're giving naloxone right now.", icon: pill, ko: "그래서 지금 날록손을 투여할게요", note: "해독제"},
    {en: "While that works, we're checking if he needs a breathing tube.", icon: stetho, ko: "그게 듣는 동안 호흡 튜브가 필요한지 확인할게요", note: "기도"},
    {en: "After that, his breathing should improve within a few minutes.", icon: chartup, ko: "그다음엔 몇 분 안에 호흡이 좋아질 거예요", note: "경과"}]}
  ctx: {word: "toxidrome", ko: "중독 증후군"}
- title: 언어장벽 발작 병력
  s:
  - {t: "횟수 확인", i: me, w: "통역이 오기 전에는 낱말을 줄이고 손가락 같은 동작으로 답하게 해요. point to를 쓰면 말 없이도 숫자를 보여 줄 수 있어요.", d: "tell", k: ["몇 살인지 손가락으로 알려 주세요", "오늘 먹은 약을 가리켜 주세요"], a: "point", o: ["jump", "look", "nod"]}
  - {t: "복약 확인", i: pill, w: "한 번에 한 가지만 묻고 Yes or no로 답을 좁히면 통역 없이도 대답할 수 있어요. 짧게 끊어 말하는 것이 핵심이에요.", d: "bring", k: ["오늘 아침에 약 먹었나요? 네, 아니요?", "발작할 때 아픈가요? 네, 아니요?"], a: "take", o: ["sell", "lose", "see"]}
  - {t: "통역 안내", i: mic, w: "통역사를 부르고 있다고 알리면 환자가 이해받을 수 있다는 안심을 해요. 정확한 병력은 가족보다 전문 통역사를 통하는 것이 원칙이에요.", d: "tonight", k: ["의사 선생님을 불러 드릴게요", "가족분께 전화해 드릴게요"], a: "interpreter", o: ["assistant", "orderly", "operator"]}
  - {t: "손가락 표현", i: me, w: "말이 안 통하면 손가락으로 숫자를 보여 달라고 요청해요. Can you…?는 환자가 거절할 수도 있는 부드러운 부탁이에요.", d: "point", k: ["제 입 모양을 따라 해 보시겠어요?", "숫자를 종이에 써 보시겠어요?"], a: "show", o: ["call", "tell", "ask"]}
  - {t: "이해 확인", i: check, w: "이해했는지를 말 대신 고개 끄덕임으로 확인해요. understand me로 내 말이 전달됐는지를 물어요.", d: "Lower", k: ["제 말이 들리면 손을 들어 주세요", "아프면 손을 들어 주세요"], a: "Nod", o: ["Shake", "Raise", "Touch"]}
  - {t: "통역 도움", i: speech, w: "will로 곧 올 도움을 알려요. 통역사는 환자의 약 이야기를 정확히 옮기는 역할이에요.", d: "wait", k: ["의사 선생님이 약을 처방해 줄 거예요", "약사가 약 이름을 알려 줄 거예요"], a: "talk", o: ["argue", "shop", "sing"]}
  order: {tag: "대화 흐름", icon: compass, ko: "언어장벽 병력 청취 4문장 순서", why: "통역사를 부르겠다고 알리고, 'Until then'으로 그동안 손가락으로 답하게 하고, 'Thank you'로 받아 복약을 예/아니요로 묻고, 'the rest'로 남은 이야기는 통역사와 한다고 마무리해요. Until then과 the rest가 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "I'm getting an interpreter for you.", icon: mic, ko: "통역사를 불러 드릴게요", note: "통역"},
    {en: "Until then, show me on your fingers how many seizures.", icon: me, ko: "그때까지 발작이 몇 번인지 손가락으로 보여 주세요", note: "횟수"},
    {en: "Thank you. Medicine—do you take it? Yes or no?", icon: pill, ko: "고마워요. 약—드시나요? 네, 아니요?", note: "복약"},
    {en: "Good. The interpreter will help us with the rest.", icon: speech, ko: "좋아요. 나머지는 통역사가 도와줄 거예요", note: "마무리"}]}
  ctx: {word: "Ask", ko: "묻다"}
- title: 지속상태(status epilepticus)
  s:
  - {t: "응급 알림", i: siren, w: "prolonged는 오래 이어진다는 뜻이에요. 발작이 5분 넘게 이어지면 지속상태로 보고 바로 약을 써야 해서 가족에게 응급임을 숨기지 않아요.", d: "repeated", k: ["가족분은 대기실에서 기다려 주세요", "보호자 성함을 알려 주세요"], a: "prolonged", o: ["brief", "mild", "minor"]}
  - {t: "약 투여", i: pill, w: "now로 지금 바로 치료한다는 점을 알려요. 지속 발작에는 정맥으로 쓰는 약을 먼저 써서 멈춰요.", d: "after", k: ["지금 산소 수치를 보고 있어요", "혈당을 먼저 확인할게요"], a: "stop", o: ["start", "repeat", "delay"]}
  - {t: "기도·산소", i: stetho, w: "경련 중에는 숨길이 막히거나 산소가 떨어질 수 있어서 기도 보호와 산소를 함께 해요. and로 두 가지를 동시에 한다는 뜻을 전해요.", d: "testing", k: ["혈압을 재고 있어요", "정맥주사를 하나 더 확보하고 있어요"], a: "protecting", o: ["blocking", "closing", "ignoring"]}
  - {t: "지속 시간", i: calendar, w: "has been going on for는 지금도 이어지는 시간을 말해요. 5분 넘는 발작은 저절로 멎기를 기다리지 않고 치료를 시작하는 기준이에요.", d: "ago", k: ["이전에도 이런 적이 있었나요?", "시작할 때 무엇을 하고 있었나요?"], a: "more", o: ["less", "fewer", "other"]}
  - {t: "약 필요", i: pill, w: "need to는 '해야 한다'는 필요를 말해요. 의견을 묻는 Do you want…?와 달리 응급이라 치료를 시작한다는 뜻을 전해요.", d: "pain", k: ["가족에게 상황을 설명할게요", "의사 선생님이 곧 오세요"], a: "seizure", o: ["headache", "infection", "fever"]}
  - {t: "마스크 착용", i: gear, w: "to help him breathe로 마스크의 목적을 말해요. 가족이 마스크를 보고 놀라지 않게 이유를 같이 전해요.", d: "pillow", k: ["산소 수치를 계속 보고 있어요", "머리를 조금 높여 줄게요"], a: "mask", o: ["bandage", "tray", "belt"]}
  order: {tag: "대화 흐름", icon: compass, ko: "지속 발작 응급 안내 4문장 순서", why: "5분 넘은 시간을 알리고, 'That'이 가리키는 시간 때문에 응급이라며 약을 주고, 'while that works'로 기도를 보호하고, 마지막에 마스크로 산소를 준다고 알려요. That과 that이 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "This has been going on for more than five minutes.", icon: calendar, ko: "5분 넘게 계속되고 있어요", note: "시간"},
    {en: "That makes it an emergency, so we're giving medication to stop it.", icon: siren, ko: "그래서 응급이고, 멈추는 약을 드리고 있어요", note: "약"},
    {en: "We're protecting his airway while that works.", icon: stetho, ko: "그 약이 듣는 동안 기도를 보호하고 있어요", note: "기도"},
    {en: "We'll give oxygen through a mask to help him breathe.", icon: gear, ko: "호흡을 돕도록 마스크로 산소를 드릴게요", note: "산소"}]}
  ctx: {word: "benzos", ko: "벤조디아제핀"}
- title: 의식저하 기도 위기
  s:
  - {t: "기도 확보", i: stetho, w: "suction은 분비물을 빨아내고 reposition은 머리와 턱의 위치를 다시 잡는 거예요. 기도가 막혔을 때 가장 먼저 하는 조치예요.", d: "drying", k: ["산소포화도를 확인하고 있어요", "정맥주사를 놓고 있어요"], a: "suctioning", o: ["closing", "blocking", "filling"]}
  - {t: "환기 시작", i: siren, w: "상황 보고와 지시를 한 문장에 이어 팀이 바로 움직이게 해요. 수치가 떨어지는 중이면 백밸브마스크로 직접 환기를 시작해요.", d: "above", k: ["혈압이 떨어지고 있어요—수액 열어요", "맥박이 빨라지고 있어요—모니터 확인해요"], a: "dropping", o: ["rising", "holding", "improving"]}
  - {t: "삽관 준비", i: hospital, w: "보고할 때 주어를 줄이고 진행 중인 동작만 말하는 것이 팀 안에서 쓰는 짧은 표현이에요. to protect로 삽관의 목적을 밝혀요.", d: "careful", k: ["이송 준비를 하고 있어요", "흉부 엑스레이를 준비하고 있어요"], a: "intubation", o: ["discharge", "surgery", "transport"]}
  - {t: "수치 보고", i: chartup, w: "level is very low로 수치가 위험하다고 있는 그대로 말해요. right now는 지금 이 순간의 값이라는 표시예요.", d: "slow", k: ["그의 호흡수가 아주 빨라요", "그의 맥박이 매우 약해요"], a: "low", o: ["high", "normal", "stable"]}
  - {t: "백 환기", i: gear, w: "bagging은 팀 안에서 쓰는 말로 백으로 환기한다는 뜻이에요. 가족에게는 helping him breathe처럼 풀어 말해요.", d: "turning", k: ["그를 침대로 옮기고 있어요", "그의 옷을 풀고 있어요"], a: "bagging", o: ["feeding", "washing", "dressing"]}
  - {t: "준비 지시", i: siren, w: "Get … ready right now는 급한 상황의 짧은 지시예요. 필요한 물건을 목적어로 분명히 지정해요.", d: "wire", k: ["산소통을 지금 가져오세요", "의사를 지금 호출하세요"], a: "tray", o: ["chart", "bed", "phone"]}
  order: {tag: "대화 흐름", icon: compass, ko: "기도 위기 팀 지시 4문장 순서", why: "수치를 보고하고, 환기를 시작하고, 'While we do that'으로 삽관 준비를 지시하고, 'That way'로 준비의 이유를 말해요. While we do that과 That way가 앞 줄을 가리켜 순서가 하나예요.", lines: [
    {en: "His oxygen level is very low right now.", icon: chartup, ko: "지금 산소 수치가 매우 낮아요", note: "보고"},
    {en: "Start bagging him to help him breathe.", icon: gear, ko: "호흡을 돕도록 백으로 환기 시작하세요", note: "환기"},
    {en: "While we do that, get the intubation tray ready.", icon: siren, ko: "그러는 동안 삽관 트레이를 준비하세요", note: "준비"},
