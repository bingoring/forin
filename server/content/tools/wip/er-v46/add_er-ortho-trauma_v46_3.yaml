- title: 석고붕대 후 교육
  s:
  - {t: "깁스 관리", i: bandage, w: "dry and elevated로 두 가지 관리를 한 번에 말하고 to reduce swelling으로 이유를 붙여요. 깁스를 높이 두면 붓기가 줄고, 깁스가 젖으면 안쪽 피부가 상할 수 있어요.", d: "at night", k: ["깁스 속을 긁지 마세요", "샤워할 때 비닐로 덮으세요"], a: "elevated", o: ["lowered", "hidden", "painted"]}
  - {t: "재방문 기준", i: bell, w: "pale, numb, or very painful로 눈에 띄는 증상을 직접 말해 줘서 환자가 무엇을 봐야 하는지 알아요. 깁스가 너무 조이면 손가락의 혈류와 감각이 변할 수 있어요.", d: "after a week", k: ["깁스가 젖으면 말씀해 주세요", "내일 정형외과 외래에 오세요"], a: "fingers", o: ["elbows", "ears", "knees"]}
  - {t: "금지 사항", i: lock, w: "Never로 예외 없이 하지 말라고 못 박고, 금지할 행동을 구체적으로 말해요. 깁스 속에 물건을 넣으면 피부에 상처가 나 감염될 수 있어요.", d: "at the edge", k: ["가려우면 찬 바람을 불어 넣으세요", "깁스 가장자리는 부드러운 천으로 덮어 두세요"], a: "push", o: ["pour", "drop", "spray"]}
  - {t: "샤워 교육", i: home, w: "covered and dry로 샤워할 때 필요한 상태를 두 단어로 말해요. 깁스가 젖으면 속의 패드가 오래 젖어 피부가 짓무를 수 있어요.", d: "every day", k: ["샤워 후 깁스 안쪽이 젖었는지 보세요", "샤워 후에는 팔을 높이 두세요"], a: "covered", o: ["exposed", "hidden", "lowered"]}
  - {t: "손가락 운동", i: me, w: "You can으로 허락하는 형태라 움직여도 된다는 안심을 줘요. gently는 무리하지 않는 정도를 알려 줘요. 손가락을 움직이면 뻣뻣해지는 것을 막는 데 도움이 돼요.", d: "all day", k: ["손가락을 세게 쥐어 보세요", "손가락 색깔을 매일 확인하세요"], a: "stiff", o: ["wet", "dirty", "noisy"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "깁스 후 교육 4문장 순서"
    why: "깁스를 했으니 집에서 관리하는 법을 알려 준다고 시작하고, 'it'으로 마르게 높이 두라고 하고, 'Along with that'으로 손가락 운동을, 'they'로 그 손가락이 이상해지면 오라고 마무리해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "Your cast is on, so let's go over how to care for it at home.", icon: home, ko: "깁스를 했으니 집에서 관리하는 법을 알려 드릴게요", note: "안내"}
    - {en: "Keep it dry and elevated to reduce swelling.", icon: bandage, ko: "붓기를 줄이려면 깁스를 마르게 하고 높이 두세요", note: "관리"}
    - {en: "Along with that, you can move your fingers gently to keep them from getting stiff.", icon: me, ko: "그와 함께 손가락을 살살 움직여 뻣뻣해지지 않게 하세요", note: "운동"}
    - {en: "Come back if they turn pale, numb, or very painful.", icon: bell, ko: "손가락이 창백해지거나 저리거나 많이 아프면 다시 오세요", note: "재방문"}
  sw: {ko: "가려우면 헤어드라이어로 찬바람을 불어 넣으세요."}
- title: 구획증후군 급속진행
  s:
  - {t: "경고 징후", i: siren, w: "serious warning sign으로 이 증상을 가볍게 넘기지 않는다고 분명히 해요. 손상에 비해 지나치게 심한 통증은 구획증후군을 의심하게 하는 대표적인 징후예요.", d: "in the leg", k: ["손가락이 저린가요?", "다리를 높이 올려 주세요"], a: "serious", o: ["rare", "minor", "random"]}
  - {t: "신장 통증", i: faceWorried, w: "hurt more when I stretch로 언제 더 아픈지를 조건으로 물어요. 근육을 수동으로 늘릴 때 통증이 커지는 것은 구획증후군의 단서예요.", d: "after you eat", k: ["손가락 색깔이 어떤가요?", "손끝이 차갑게 느껴지세요?"], a: "stretch", o: ["freeze", "cover", "wash"]}
  - {t: "수술 설명", i: scalpel, w: "to relieve the pressure로 수술의 목적을 말해 줘요. 구획증후군은 근육을 감싼 공간의 압력을 풀어 주는 수술이 필요할 수 있어요.", d: "next week", k: ["압력을 먼저 재 볼게요", "정형외과 의사가 곧 올 거예요"], a: "relieve", o: ["raise", "increase", "create"]}
  - {t: "통증 평가", i: bulb, w: "than we'd expect from the injury로 손상 크기에 비해 통증이 과하다는 비교를 말해요. 손상에 비해 심한 통증은 구획증후군을 의심하게 해서 의사에게 알리는 근거가 돼요.", d: "at rest", k: ["통증이 가라앉으면 알려 주세요", "진통제를 먼저 드릴게요"], a: "worse", o: ["calmer", "gentler", "quieter"]}
  - {t: "소견 설명", i: magnify, w: "feels very tight and hard to the touch로 만져서 느낀 것을 그대로 말해요. 팽팽하고 딱딱한 근육은 근막 안 압력이 올라가 있다는 단서예요.", d: "on the surface", k: ["다리가 많이 부어 있어요", "발가락이 움직이는지 볼게요"], a: "tight", o: ["loose", "soft", "thin"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "구획증후군 4문장 순서"
    why: "통증이 손상에 비해 심하다는 관찰로 시작하고, 'That'으로 심각한 징후라서 지금 의사를 부른다고 하고, 'the doctor'로 수술 가능성을 말하고, 'Last'로 근육을 계속 확인한다고 닫아요. 의사 호출은 두 번째 줄에서 기다리지 않고 바로 이뤄져요."
    lines:
    - {en: "This pain is much worse than we'd expect from the injury.", icon: bulb, ko: "이 손상치고는 통증이 예상보다 훨씬 심해요", note: "관찰"}
    - {en: "That's a serious warning sign, so I'm calling the doctor right now.", icon: siren, ko: "그건 심각한 경고 징후라서 지금 바로 의사 선생님을 부르고 있어요", note: "호출"}
    - {en: "When the doctor arrives, the plan may be surgery soon to relieve the pressure.", icon: scalpel, ko: "의사 선생님이 오시면 압력을 풀기 위해 곧 수술하자고 할 수 있어요", note: "계획"}
    - {en: "Last, I'll keep checking whether the muscle feels very tight and hard to the touch.", icon: magnify, ko: "마지막으로 근육이 아주 팽팽하고 딱딱한지 계속 확인할게요", note: "관찰"}
  sw: null
- title: 골반골절 혈역학 불안정
  s:
  - {t: "고정 안내", i: bandage, w: "to stabilize ... and slow bleeding으로 바인더의 목적 두 가지를 말해요. 골반 바인더는 골반을 모아 주어 안쪽 출혈을 줄이는 데 도움이 돼요.", d: "around your knees", k: ["지금 수혈을 시작할게요", "골반을 만져 볼게요"], a: "stabilize", o: ["measure", "clean", "remove"]}
  - {t: "수혈 설명", i: pill, w: "may be로 아직 확인 전이지만 가능성이 높아 수혈한다고 말해요. 골반 골절은 몸속으로 피가 많이 날 수 있어 겉으로 안 보여도 미리 대비해요.", d: "in your leg", k: ["수액을 빠르게 넣고 있어요", "혈압을 다시 재 볼게요"], a: "internally", o: ["externally", "softly", "rarely"]}
  - {t: "협조 요청", i: me, w: "Try to로 부탁하는 말투를 써서, 아파서 움직이는 환자에게도 잔소리처럼 들리지 않아요. 골반이 부러졌을 때는 움직이면 출혈이 늘 수 있어서 가만히 있게 해요.", d: "on your side", k: ["숨을 천천히 쉬어 보세요", "팔을 올려 주세요"], a: "still", o: ["upright", "away", "seated"]}
  - {t: "상태 설명", i: monitor, w: "dropping과 moving quickly를 so로 이어 상태가 나빠지니 서두른다는 이유를 알려 줘요. 혈압이 떨어지는 것은 출혈로 혈액량이 줄었다는 신호일 수 있어요.", d: "since you arrived", k: ["혈액 검사 결과가 나왔어요", "혈압을 한 번 더 잴게요"], a: "dropping", o: ["rising", "climbing", "improving"]}
  - {t: "치료 설명", i: pill, w: "to keep your pressure up으로 수액과 혈액을 주는 목적을 말해요. 출혈로 혈압이 떨어질 때는 줄어든 혈액량을 채워서 혈압을 유지해요.", d: "through your arm", k: ["진통제를 천천히 놓을게요", "산소를 더 높여 드릴게요"], a: "fluids", o: ["pills", "gauze", "ice"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "골반골절 불안정 4문장 순서"
    why: "혈압이 떨어져 서두른다고 알리고, 'The reason'으로 내부 출혈 가능성을 말하고, 'To slow it down'으로 바인더를 적용한다고 하고, 'all of this'로 가만히 있어 달라고 부탁해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "Your blood pressure is dropping, so we're moving quickly.", icon: monitor, ko: "혈압이 떨어지고 있어서 빠르게 움직이고 있어요", note: "상황"}
    - {en: "The reason is that you may be bleeding internally.", icon: bulb, ko: "이유는 내부 출혈이 있을 수 있어서예요", note: "이유"}
    - {en: "To slow it down, we're placing a binder to stabilize your pelvis.", icon: bandage, ko: "그걸 늦추려고 골반을 고정하는 바인더를 적용하고 있어요", note: "처치"}
    - {en: "For all of this to work, try to stay still while we stabilize you.", icon: me, ko: "이게 다 잘되려면 고정하는 동안 가만히 계셔 주세요", note: "협조"}
  sw: {ko: "골반을 붙잡아 주고 출혈을 늦추기 위해 바인더를 채우고 있어요."}
- title: 대퇴골 골절 지방색전
  s:
  - {t: "우려 설명", i: faceWorried, w: "concerns us처럼 we를 주어로 해서 환자 탓이 아니라 팀이 걱정한다고 말해요. 큰 뼈 골절 뒤 새로 생긴 호흡곤란은 폐와 관련된 문제를 의심하게 해서 바로 확인해요.", d: "since breakfast", k: ["산소 마스크를 씌워 드릴게요", "가슴에 통증이 있으세요?"], a: "shortness", o: ["dryness", "fullness", "slowness"]}
  - {t: "산소·발진", i: monitor, w: "두 동작을 and로 이어 말해서 지금 무엇을 하는지 환자가 따라갈 수 있어요. 큰 뼈 골절 뒤에는 지방색전을 의심해 산소 수치와 가슴 부위의 점상 발진을 살펴요.", d: "on your legs", k: ["가슴 사진을 찍으러 갈 거예요", "심전도를 붙일게요"], a: "oxygen", o: ["weight", "height", "hearing"]}
  - {t: "치료 안내", i: monitor, w: "giving과 monitoring을 and로 이어 지금 하는 일을 한 번에 알려요. closely로 지켜보는 강도도 전해서 환자가 혼자 두지 않는다고 느껴요.", d: "at the desk", k: ["다리를 움직이지 않게 고정할게요", "수액을 놓을게요"], a: "monitoring", o: ["weighing", "feeding", "washing"]}
  - {t: "증상 보고", i: bell, w: "Tell me if로 증상을 알려 달라고 하고 confused를 함께 넣어, 숨찬 것뿐 아니라 정신이 흐려지는 것도 알리게 해요. 지방색전은 호흡 증상과 함께 혼란이 올 수 있어요.", d: "after you rest", k: ["가슴이 아프면 알려 주세요", "어지러우면 앉아 계세요"], a: "confused", o: ["excited", "relaxed", "grateful"]}
  - {t: "관찰 이유", i: monitor, w: "after this kind of break로 왜 이 환자를 유독 자세히 보는지 이유를 밝혀요. 큰 뼈 골절 뒤에는 산소 수치가 떨어질 수 있어서 지켜봐요.", d: "this week", k: ["다리를 움직이지 마세요", "산소 마스크가 불편하면 말씀해 주세요"], a: "watching", o: ["lowering", "blocking", "raising"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "지방색전 의심 4문장 순서"
    why: "새로 생긴 호흡곤란이 걱정이라고 알리고, 'Because of that'으로 산소와 발진을 확인하고, 'the results'로 결과와 상관없이 산소와 관찰을 한다고 하고, 'Last'로 증상을 알려 달라고 해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "New shortness of breath after this fracture concerns us.", icon: faceWorried, ko: "골절 후 새로 생긴 호흡곤란이 걱정돼요", note: "우려"}
    - {en: "Because of that, I'm checking your oxygen and looking for a rash.", icon: monitor, ko: "그래서 산소 수치를 확인하고 발진이 있는지 보고 있어요", note: "확인"}
    - {en: "Whatever the results show, we're giving you oxygen and monitoring you closely.", icon: monitor, ko: "결과가 어떻든 산소를 드리고 자세히 관찰할 거예요", note: "처치"}
    - {en: "Last, tell me if you feel confused or more short of breath.", icon: bell, ko: "마지막으로 혼란스럽거나 숨이 더 차면 말씀해 주세요", note: "보고"}
  sw: null
- title: 다발 장골골절 출혈성 쇼크
  s:
  - {t: "위험 설명", i: bulb, w: "can hide로 겉으로 안 보여도 안에서 피가 날 수 있다고 알려 줘요. 대퇴골 같은 긴 뼈가 부러지면 다리 안쪽으로 피가 많이 날 수 있어 활력징후를 자주 봐요.", d: "in your arm", k: ["다리에 부목을 댈게요", "혈압이 낮아요"], a: "long", o: ["small", "thin", "soft"]}
  - {t: "수혈 안내", i: pill, w: "Your pressure is low를 이유로 먼저 말하고 so로 수혈이라는 조치를 이어요. 혈압이 낮을 때 수혈은 줄어든 혈액량을 채우기 위한 거예요.", d: "in the morning", k: ["수액을 더 빠르게 넣을게요", "혈액형을 한 번 더 확인할게요"], a: "transfusion", o: ["biopsy", "ventilator", "scan"]}
  - {t: "보온·고정", i: bandage, w: "splint와 keep you warm 두 가지를 and로 이어 앞으로 할 일을 알려요. 다발 골절 환자는 출혈로 체온이 내려가기 쉬워서 보온도 같이 해요.", d: "in the hallway", k: ["다리를 심장보다 높이 올릴게요", "피를 더 가져올게요"], a: "splint", o: ["massage", "measure", "shave"]}
  - {t: "이동 안내", i: lock, w: "so로 양쪽 다리가 부러졌다는 이유에 이어 조심스럽게 움직인다고 알려요. 부러진 뼈가 움직이면 통증과 출혈이 늘 수 있어서 신중하게 옮겨요.", d: "to the scan", k: ["지금 바로 CT실로 갈 거예요", "다리가 많이 부어 있어요"], a: "carefully", o: ["carelessly", "roughly", "casually"]}
  - {t: "수혈 이유", i: pill, w: "because 뒤에 이유를 붙여 빠르게 주는 까닭을 알려요. 출혈이 많은 환자는 잃은 만큼 빨리 채워야 해서 속도를 서둘러요.", d: "through your leg", k: ["혈액이 더 필요한지 피검사를 할게요", "다리를 가만히 두세요"], a: "losing", o: ["gaining", "saving", "drinking"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "다발 골절 출혈성 쇼크 4문장 순서"
    why: "긴 뼈 골절이 출혈을 숨긴다는 설명으로 시작하고, '\"That's why\"'로 혈압이 낮아 빠르게 수혈한다고 이어, 'the blood'로 부목과 보온을 말하고, 'Last'로 조심스럽게 움직인다고 닫아요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "Broken long bones can hide a lot of blood loss.", icon: bulb, ko: "긴 뼈가 부러지면 많은 출혈이 겉으로 안 보일 수 있어요", note: "설명"}
    - {en: "That's why your pressure is low, and we're giving you blood quickly.", icon: pill, ko: "그래서 혈압이 낮고, 그래서 빠르게 수혈하고 있어요", note: "수혈"}
    - {en: "Along with the blood, we'll splint your legs and keep you warm.", icon: bandage, ko: "수혈과 함께 다리를 부목으로 고정하고 따뜻하게 유지할게요", note: "처치"}
    - {en: "Last, because both your legs are broken, we're moving carefully.", icon: lock, ko: "마지막으로 양쪽 다리가 부러져서 조심스럽게 움직이고 있어요", note: "이동"}
  sw: {ko: "피를 많이 잃으셔서 혈액을 드리고 있어요."}
- title: 개방골절 SBAR 인계
  s:
  - {t: "상황 보고", i: board, w: "SBAR의 첫머리로 무슨 손상인지 한 문장에 말해요. open, tibia, five-centimeter처럼 종류·부위·크기를 한 번에 알려요.", d: "from a fall", k: ["항생제는 이미 투여했습니다", "혈압은 안정적입니다"], a: "open", o: ["old", "unhealed", "infected"]}
  - {t: "신경혈관", i: stetho, w: "Distal pulse와 sensation을 한 문장에 묶어 신경혈관 상태를 간결하게 보고해요. 받는 사람이 손상 아래쪽 순환과 감각이 유지되는지 바로 알 수 있어요.", d: "on the left", k: ["손가락 색은 분홍색입니다", "통증 점수는 3점입니다"], a: "intact", o: ["absent", "weak", "lost"]}
  - {t: "예방 보고", i: pill, w: "updated와 were given으로 한 일을 짧게 보고해요. at ten past처럼 시각을 말해 주면 인계받는 사람이 다음 투약 시점을 가늠할 수 있어요.", d: "by the doctor", k: ["상처는 세척했습니다", "수술 동의서는 받았습니다"], a: "antibiotics", o: ["fluids", "analgesics", "vitamins"]}
  - {t: "처치 보고", i: bandage, w: "clean, dressed, splinted로 처치를 세 단어로 나열해 한눈에 보게 해요. for transport로 이송에 맞춰 준비했다는 목적까지 알려요.", d: "by the bed", k: ["항생제는 투여했습니다", "다른 손상은 없습니다"], a: "splinted", o: ["sutured", "glued", "stapled"]}
  - {t: "마무리", i: check, w: "noted로 확인한 범위 안에서만 말해서 다른 손상이 전혀 없다고 단정하지 않아요. pain is controlled로 마지막에 통증 상태를 알려 인계를 닫아요.", d: "since arrival", k: ["상처는 세척하고 드레싱했습니다", "원위부 맥박은 정상입니다"], a: "controlled", o: ["worsening", "severe", "spreading"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "개방골절 SBAR 인계 4문장 순서"
    why: "어떤 손상인지 먼저 말하고, 'On that leg'로 그 다리의 신경혈관 상태를, 'those findings'로 그에 맞춰 한 처치를, 'With that done'으로 처치 상태와 통증을 보고해요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "This is an open tibia fracture with a five-centimeter wound.", icon: board, ko: "5센티미터 상처를 동반한 개방 경골 골절입니다", note: "상황"}
    - {en: "On that leg, distal pulse is intact and sensation is normal.", icon: stetho, ko: "그 다리의 원위부 맥박은 정상이고 감각도 정상입니다", note: "사정"}
    - {en: "Given those findings, we updated tetanus and gave antibiotics at ten past.", icon: pill, ko: "그 소견에 맞춰 파상풍을 갱신했고 항생제는 10분에 투여했습니다", note: "처치"}
    - {en: "With that done, the wound is clean, dressed, and splinted for transport.", icon: bandage, ko: "그걸 마친 뒤 상처는 세척, 드레싱했고 이송을 위해 부목했습니다", note: "상태"}
  sw: null
- title: 외상성 절단 지혈대 관리
  s:
  - {t: "지혈대 설명", i: bandage, w: "stops와 noted the time 두 가지를 and로 이어 효과와 기록을 한 번에 알려요. 지혈대는 채운 시각을 꼭 적어 두어야 얼마나 오래 있었는지 알 수 있어요.", d: "on the leg", k: ["출혈은 아직 조금 있어요", "수술실에서 풀 거예요"], a: "noted", o: ["forgot", "skipped", "lost"]}
  - {t: "유지 약속", i: lock, w: "won't loosen it until로 임의로 풀지 않겠다고 약속해요. 지혈대는 정해진 시점에 안전하게 풀 때까지 그대로 두는 것이 원칙이에요.", d: "after dinner", k: ["지혈대 아래 피부를 확인할게요", "출혈이 멈췄는지 볼게요"], a: "loosen", o: ["tighten", "tie", "cover"]}
  - {t: "변화 보고", i: bell, w: "if the pain or numbness changes로 통증과 저림의 변화를 알려 달라고 해요. 지혈대를 찬 팔다리는 감각이 변할 수 있어서 변화를 바로 알려야 해요.", d: "in your hand", k: ["손가락이 움직이는지 볼게요", "얼음을 대 드릴게요"], a: "numbness", o: ["itchiness", "tiredness", "dryness"]}
  - {t: "시각 기록", i: pencil, w: "the exact time으로 정확한 시각을 적었다고 말해요. 지혈대를 채운 시각은 얼마나 오래 있었는지 판단하는 기준이라 인계 때 꼭 전해요.", d: "on the chart", k: ["지혈대는 의사 선생님이 풀 거예요", "시간은 차트에 기록할게요"], a: "exact", o: ["wrong", "late", "first"]}
  - {t: "해제 안내", i: monitor, w: "Once it's safe로 풀 시점이 안전해진 뒤라는 조건을 알려 줘요. watch your leg로 푼 뒤에도 계속 지켜본다고 말해 안심시켜요.", d: "this evening", k: ["지혈대 부위를 계속 확인할게요", "다리를 가만히 두세요"], a: "release", o: ["tighten", "cover", "tie"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "지혈대 관리 4문장 순서"
    why: "지혈 효과와 시각 기록을 알리고, 'it'으로 안전해질 때까지 풀지 않겠다고 말하고, 'Throughout that'으로 그동안 통증이나 저림 변화를 알려 달라고 하고, 'Last'로 풀 때 지켜본다고 닫아요. 앞 줄을 가리키는 말이 순서를 정해 줘요."
    lines:
    - {en: "The tourniquet stops the bleeding, and we noted the time.", icon: bandage, ko: "지혈대가 출혈을 멈췄고 시각을 기록했어요", note: "설명"}
    - {en: "We won't loosen it until it's safe to do so.", icon: lock, ko: "안전해질 때까지는 느슨하게 하지 않을 거예요", note: "유지"}
    - {en: "Throughout that, tell me if the pain or numbness changes.", icon: bell, ko: "그동안 통증이나 저림이 달라지면 말씀해 주세요", note: "보고"}
    - {en: "Last, once it's safe, we'll release the tourniquet and watch your leg.", icon: monitor, ko: "마지막으로 안전해지면 지혈대를 풀고 다리를 지켜볼게요", note: "해제"}
  sw: {ko: "외과의가 출혈을 잡을 때까지 그대로 둘 거예요."}
