- title: 수막염 의심 두통·발열
  s:
  - {t: "의심 설명", i: faceWorried, w: "concerns me로 의료진의 걱정을 직접 말해 검사가 필요한 이유를 알려요. 목 뻣뻣함·열·두통은 수막염을 의심하는 대표 조합이라 서둘러 확인해요.", d: "reassures me", k: ["두통약을 바로 드릴게요", "목 베개를 가져다 드릴게요"], a: "meningitis", o: ["migraine", "sinusitis", "arthritis"]}
  - {t: "척수천자", i: lab, w: "We'll need로 필요성을 알리고 to check로 목적을 붙여 시술의 이유가 먼저 들려요. 척수천자는 뇌척수액을 얻어 수막염 여부를 가려요.", d: "a blood draw", k: ["뇌 사진을 먼저 찍어야 할 수도 있어요", "검사 전에 동의서에 서명해 주세요"], a: "fluid", o: ["blood", "bone", "tissue"]}
  - {t: "광선 과민", i: bulb, w: "bright light bother your eyes는 빛이 눈을 괴롭히냐로 광선공포증을 일상어로 물어요. right now로 지금 상태만 물어 답이 분명해요. 수막염에서는 빛에 민감한 증상이 흔해요.", d: "loud noise", k: ["지금 눈이 충혈됐어요?", "시야가 흐려요?"], a: "bright", o: ["dim", "soft", "warm"]}
  - {t: "목 굴곡", i: stetho, w: "for me로 환자를 돕는 부탁처럼 들려 목이 아파도 시도하기 쉬워요. 턱이 가슴에 닿는지 보는 이 동작으로 경부 강직을 확인해요.", d: "up toward the ceiling", k: ["고개를 좌우로 돌려 보시겠어요?", "누워서 다리를 올려 보시겠어요?"], a: "chin", o: ["toe", "wrist", "tongue"]}
  - {t: "검사 목적", i: bulb, w: "tells us if로 검사가 무엇을 알려 주는지 먼저 밝혀 환자의 불안을 줄여요. 뇌척수액에서 염증 세포나 균이 보이면 수막염으로 진단해요.", d: "if there's a fracture", k: ["검사 결과는 몇 시간 뒤에 나와요", "검사 전에 금식하실 필요는 없어요"], a: "spine", o: ["skull", "heart", "lungs"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "수막염 의심 평가 4문장 순서"
    why: "수막염이 걱정된다고 알리고, 그 걱정을 확인하려 목 동작을 부탁하고, 그 동작이 어땠는지에 이어 빛 과민을 묻고, 모든 걸 근거로 척수천자를 안내해요. 'To check your neck'·'how that felt'·'all of that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "The stiff neck with fever and headache concerns me about meningitis.", icon: faceWorried, ko: "뻣뻣한 목에 열과 두통이라 수막염이 걱정돼요", note: "걱정"}
    - {en: "To check your neck, can you bring your chin down toward your chest for me?", icon: stetho, ko: "목을 확인하려고 턱을 가슴 쪽으로 내려 보시겠어요?", note: "목 검사"}
    - {en: "Along with how that felt, does bright light bother your eyes right now?", icon: bulb, ko: "그 느낌과 함께 지금 밝은 빛이 눈에 거슬리세요?", note: "빛"}
    - {en: "Based on all of that, we'll need a spinal tap to check the fluid around your brain.", icon: lab, ko: "그걸 근거로 뇌 주변 체액을 보려고 척수천자가 필요해요", note: "검사"}
  sw: {ko: "뇌 주변 체액을 확인하려고 척수천자가 필요해요."}
- title: 결핵 의심 만성기침
  s:
  - {t: "의심 설명", i: stetho, w: "can suggest로 확정이 아니라 가능성을 말해요. 오래 가는 기침·야간 발한·체중 감소는 결핵의 전형적인 조합이라 격리와 검사를 서둘러요.", d: "can prove", k: ["가족 중에 결핵 환자가 있으세요?", "기침할 때 피가 섞여 나와요?"], a: "weight", o: ["hair", "height", "skin"]}
  - {t: "격리실 이동", i: lock, w: "right away로 지체 없이 옮긴다고 말해요. 결핵 의심 환자는 음압격리실에 들이고, 이유를 설명하면 환자가 격리를 벌로 느끼지 않아요.", d: "like the others", k: ["병실에서 식사는 따로 드릴게요", "격리실에서는 문이 닫혀 있어요"], a: "isolation", o: ["waiting", "recovery", "family"]}
  - {t: "가래 검사", i: lab, w: "test와 check for로 검사 방법과 목적을 나눠 말해요. sputum은 환자가 알아듣기 어려운 말이라 가래를 깊이 뱉어 달라고 풀어서 설명해요.", d: "your saliva", k: ["가래는 아침에 한 번만 뱉으시면 돼요", "피 검사로 결핵을 확인할게요"], a: "sputum", o: ["saliva", "urine", "stool"]}
  - {t: "기간 문진", i: calendar, w: "How many weeks로 주 단위로 세어 답하게 해 만성 여부를 가려요. 기침이 몇 주 이상 이어지면 결핵을 포함해 만성 원인을 따져요.", d: "how many hours", k: ["가족도 기침을 하나요?", "체중이 얼마나 줄었어요?"], a: "weeks", o: ["days", "months", "years"]}
  - {t: "격리 이유", i: shield, w: "keeps the air from spreading은 공기가 퍼지지 않게 한다로 방이 하는 일을 쉽게 알려요. 결핵은 공기로 전파돼서 음압격리실은 공기가 방 밖으로 새지 않게 해요.", d: "your family", k: ["격리실에서도 TV는 보실 수 있어요", "격리실에 들어갈 때 의료진은 N95를 써요"], a: "air", o: ["door", "floor", "light"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "결핵 의심 격리 설명 4문장 순서"
    why: "기침과 식은땀이 몇 주 됐는지 묻고, 그렇게 오래 가는 기침과 증상이 결핵을 시사한다고 말하고, 그 이유로 격리실에 들이고, 그 방이 공기 전파를 막는다고 설명해요. 'that long'·'that reason'·'the room'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "How many weeks have you had this cough and the night sweats?", icon: calendar, ko: "이 기침과 밤 땀이 몇 주나 됐나요?", note: "기간"}
    - {en: "A cough that long, with night sweats and weight loss, can suggest TB.", icon: stetho, ko: "그렇게 오래된 기침에 밤 땀과 체중 감소는 결핵을 의심하게 해요", note: "의심"}
    - {en: "For that reason, we'll place you in a special isolation room right away.", icon: lock, ko: "그래서 바로 특별 격리실로 옮겨드릴게요", note: "격리"}
    - {en: "The room keeps the air from spreading TB to others.", icon: shield, ko: "그 방은 공기로 결핵이 퍼지지 않게 막아줘요", note: "이유"}
  ctx: {word: "isolation", ko: "격리", sc: {1: {en: "Pt placed in airborne isolation (AIIR); N95 required for staff."}, 2: {en: "You're being placed in an AIIR for airborne isolation."}}}
