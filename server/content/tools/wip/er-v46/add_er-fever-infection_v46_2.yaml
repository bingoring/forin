- title: 봉와직염 발열
  s:
  - {t: "경계 표시", i: pencil, w: "I'm marking으로 지금 하는 일을 알려 환자가 펜이 닿는 것에 놀라지 않게 해요. 경계선은 시간이 지나 발적이 넓어졌는지 비교할 기준이 돼요.", d: "the middle", k: ["발적 부위를 문질러 닦을게요", "발적 부위에 연고를 바를게요"], a: "edge", o: ["center", "color", "shape"]}
  - {t: "치료 이유", i: pill, w: "may로 퍼지고 있을 수 있다는 가능성으로 말하고 so로 치료 결정을 바로 이어요. 피부 감염에 열이 동반되면 국소를 넘어 퍼질 수 있다는 신호예요.", d: "will heal itself", k: ["다리를 쿠션 위에 올려 둘게요", "열은 바로 해열제로 내릴게요"], a: "spreading", o: ["healing", "shrinking", "clearing"]}
  - {t: "통증 보고", i: bell, w: "Tell me if…로 환자가 직접 알릴 기준을 줘요. 겉보기보다 훨씬 심한 통증은 깊은 감염의 경고 신호일 수 있어 놓치지 않아야 해요.", d: "when it itches", k: ["통증은 약을 먹으면 가라앉을 거예요", "붓기가 좀 가라앉았어요"], a: "suddenly", o: ["slowly", "slightly", "rarely"]}
  - {t: "변화 관찰", i: pencil, w: "so we can…으로 선을 긋는 목적을 함께 말해요. 선 밖으로 번지면 감염이 진행하는 것이라 시간을 두고 비교해요.", d: "so it dries", k: ["발적이 커지면 선을 새로 그을게요", "선은 건드리지 말고 그대로 두세요"], a: "grows", o: ["itches", "bleeds", "hurts"]}
  - {t: "항생제 시작", i: pill, w: "now를 붙여 지체 없이 시작한다고 알려요. to keep…from…은 하지 않게 막다로 치료의 목적을 말해요. 피부 감염은 일찍 항생제를 쓸수록 퍼지는 걸 막기 쉬워요.", d: "to prove", k: ["상처 부위를 깨끗이 닦을게요", "열은 한 시간 뒤에 다시 잴게요"], a: "antibiotics", o: ["steroids", "painkillers", "lotion"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "봉와직염 관찰·치료 4문장 순서"
    why: "발적 경계를 표시하고, 그 발적이 퍼질 수 있다고 보고 항생제를 시작하고, 항생제와 함께 통증이 갑자기 커지면 알려 달라고 하고, 다음 확인 때 선과 환자가 말한 것을 함께 본다고 닫아요. 'it'·'the antibiotics'·'that line'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "I'm marking the edge of the redness to see if it spreads.", icon: pencil, ko: "퍼지는지 보려고 발적 경계를 표시하고 있어요", note: "표시"}
    - {en: "Since the fever means it may be spreading, we'll start antibiotics now.", icon: pill, ko: "열이 있어 퍼질 수 있으니 지금 항생제를 시작할게요", note: "치료"}
    - {en: "Along with the antibiotics, tell me if the pain suddenly gets much worse than it looks.", icon: bell, ko: "항생제와 함께 통증이 겉보기보다 갑자기 심해지면 말씀해 주세요", note: "보고"}
    - {en: "At our next check, we'll compare the redness to that line and to what you told me.", icon: magnify, ko: "다음 확인 때 그 선과 말씀하신 내용을 비교할게요", note: "재확인"}
  sw: {ko: "발적이 퍼지는지 보려고 경계를 표시하고 있어요."}
- title: 인플루엔자 시즌 선별
  s:
  - {t: "검사 안내", i: lab, w: "swab이 동사로 면봉으로 닦아 채취하다라서 무엇을 하는지 바로 알려요. 독감은 코 안쪽 점막을 면봉으로 채취해 빠르게 확인하는 검사가 흔해요.", d: "to clean your", k: ["독감 예방주사를 놓을게요", "피를 뽑아 검사할게요"], a: "flu", o: ["strep", "covid", "pinkeye"]}
  - {t: "치료 설명", i: pill, w: "If 안에 positive와 early 두 조건을 걸어 이럴 때 도움이 된다고 말하고 may로 효과를 약속하지 않아요. 항바이러스제는 증상 초기에 쓸 때 효과가 가장 커요.", d: "and it's late", k: ["결과는 몇 시간 뒤에 나와요", "약은 식후에 드세요"], a: "antiviral", o: ["antibiotic", "antacid", "antihistamine"]}
  - {t: "마스크 유지", i: shield, w: "Please keep…on으로 계속 쓰고 있어 달라고 정중하게 요청해요. to protect others로 마스크가 나를 위한 게 아니라 주변을 위한 것임을 알려요.", d: "to protect yourself", k: ["마스크가 답답하면 말씀해 주세요", "장갑도 끼고 계세요"], a: "protect", o: ["scare", "annoy", "remind"]}
  - {t: "가능성 설명", i: handshake2, w: "Everyone…having the flu가 통째로 주어가 돼 모두가 걸렸다는 사실이 이유가 돼요. very likely는 확정 전이라 검사로 확인하자는 여지를 남겨요.", d: "makes this less", k: ["직장에 언제 복귀하실 수 있는지 알려 드릴게요", "같은 팀 분들도 검사받으셨나요?"], a: "likely", o: ["serious", "urgent", "painful"]}
  - {t: "시작 시점", i: calendar, w: "works best if로 효과가 가장 큰 조건을 알려요. 독감 항바이러스제는 증상이 시작되고 이틀 안에 쓸 때 가장 효과적이에요.", d: "after the first week", k: ["약은 처방을 받아 약국에서 받으세요", "약은 식사 후에 드세요"], a: "within", o: ["after", "outside", "beyond"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "독감 선별·치료 설명 4문장 순서"
    why: "검사를 알리고, 그 결과에 따른 항바이러스제 가능성을 말하고, 그 약이 가장 잘 듣는 시점을 설명한 뒤, 결과가 어떻든 마스크를 유지해 달라고 닫아요. 'it'·'the antiviral'·'Either way'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "We'll swab you to check for the flu.", icon: lab, ko: "독감 검사를 위해 면봉검사를 할게요", note: "검사"}
    - {en: "If it's positive and it's early, an antiviral may help.", icon: pill, ko: "양성이고 초기라면 항바이러스제가 도움이 될 수 있어요", note: "치료"}
    - {en: "The antiviral works best if we start it within the first two days.", icon: calendar, ko: "그 약은 처음 이틀 안에 시작하면 가장 좋아요", note: "시점"}
    - {en: "Either way, please keep the mask on to protect others while you're here.", icon: shield, ko: "어느 쪽이든 마스크를 계속 써 주세요", note: "마스크"}
  sw: {ko: "양성이고 초기라면 항바이러스제가 도움이 될 수 있어요."}
- title: 면역저하 발열
  s:
  - {t: "위급성 설명", i: siren, w: "With chemo로 이유를 먼저 대고 so로 결과를 잇는 이유에서 결론의 구조예요. 항암치료 중에는 백혈구가 줄어 있어 열이 곧 심한 감염의 신호일 수 있어요.", d: "after chemo", k: ["항암 주사는 언제 맞으셨어요?", "체온을 다시 재볼게요"], a: "emergency", o: ["exception", "error", "irritation"]}
  - {t: "배양·항생제", i: lab, w: "We're …ing 진행형이라 지금 하는 중인 일을 알려요. 배양은 균을 찾는 검사이고 항생제는 결과를 기다리지 않고 바로 시작해요.", d: "a urine sample", k: ["배양은 소변으로만 할게요", "항암제 용량을 다시 확인할게요"], a: "cultures", o: ["scans", "x-rays", "stitches"]}
  - {t: "감염 예방", i: shield, w: "protected from other infections로 우리가 지켜 드린다는 주체를 말해 환자를 안심시켜요. 항암치료 중에는 면역이 약해 다른 감염에도 취약해서 주변 접촉을 관리해요.", d: "from falling", k: ["다른 환자와 병실을 따로 쓸게요", "손 씻기를 자주 부탁드려요"], a: "infections", o: ["injuries", "allergies", "accidents"]}
  - {t: "위험 설명", i: faceWorried, w: "Even으로 이 정도 열이라도를 강조해 가볍게 보지 않게 해요. 호중구가 낮으면 작은 감염도 빠르게 패혈증으로 번질 수 있어요.", d: "can go away", k: ["밤에도 체온을 자주 재볼게요", "열이 내려도 계속 지켜볼게요"], a: "mild", o: ["high", "brief", "new"]}
  - {t: "칭찬·안심", i: star, w: "was right to로 환자가 이미 한 행동을 인정해 죄책감이나 불안을 덜어요. 항암 중 발열은 빨리 올수록 치료가 빨라져요.", d: "to warn you", k: ["오시는 데 오래 걸리셨죠?", "간호사분 성함이 어떻게 되세요?"], a: "immediately", o: ["alone", "upstairs", "separately"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "항암 중 발열 설명 4문장 순서"
    why: "가벼운 열도 빨리 나빠질 수 있다고 말하고, 그래서 항암 중 열은 응급이라고 하고, 그 응급 때문에 배양과 항생제를 시작한다고 알리고, 그 배양과 항생제를 근거로 바로 오라고 한 간호사가 옳았다고 닫아요. 'that'·'that emergency'·'the cultures and antibiotics'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Even a mild fever like this can turn serious very quickly for you.", icon: faceWorried, ko: "이런 가벼운 열도 아주 빠르게 심각해질 수 있어요", note: "위험"}
    - {en: "With chemo, that makes a fever an emergency, so we act fast.", icon: siren, ko: "항암치료 중이면 그래서 열은 응급이라 빠르게 움직여요", note: "응급"}
    - {en: "Because of that emergency, we're drawing cultures and starting antibiotics quickly.", icon: lab, ko: "그 응급 때문에 배양을 채취하고 항생제를 신속히 시작해요", note: "처치"}
    - {en: "Given the cultures and antibiotics, your nurse was right to send you in immediately.", icon: star, ko: "배양과 항생제를 보면 간호사분이 바로 오시라고 한 게 맞았어요", note: "안심"}
  ctx: {word: "antibiotics", ko: "항생제", sc: {1: {en: "Febrile, on chemo. BCx drawn, empiric antibiotics started."}, 2: {en: "You're presumed febrile neutropenic, so we're initiating empiric antibiotics."}}}
- title: 소아 고열 보호자
  s:
  - {t: "치료 계획", i: pill, w: "We'll로 의료진이 함께 한다는 주체를 밝히고 열 내리기와 편안하게 하기 두 목표를 and로 묶어요. 열성경련이 걱정인 보호자에게 해야 할 일이 있다는 안정감을 줘요.", d: "wake him up", k: ["아이를 침대에 눕혀 둘게요", "지금 바로 혈액검사를 할게요"], a: "comfortable", o: ["awake", "busy", "dressed"]}
  - {t: "안심 설명", i: faceWorried, w: "Most로 예외가 있음을 인정하되 대부분은 괜찮다고 말해 보호자의 공포를 줄여요. 단순 열성경련은 대개 몇 분 안에 끝나고 후유증을 남기지 않는 경우가 많아요.", d: "need surgery", k: ["열성경련은 6세 이후에는 거의 없어요", "아이가 이전에 경련한 적이 있나요?"], a: "brief", o: ["rare", "painful", "silent"]}
  - {t: "관찰 요청", i: bell, w: "Keep offering은 계속 시도하라는 지시고 let me know if로 알려야 할 기준을 줘요. 경련 뒤 졸린 것은 흔하지만 깨우기 힘들면 의식이 떨어진 신호일 수 있어 알려야 해요.", d: "and give him juice", k: ["아이 체온은 제가 다시 재볼게요", "아이 옆에 계셔 주세요"], a: "hard", o: ["easy", "quick", "ready"]}
  - {t: "경련 설명", i: faceWorried, w: "look scary로 보호자의 공포를 먼저 인정한 뒤 but으로 대개 저절로 멈춘다는 사실을 이어요. 단순 열성경련은 대개 몇 분 안에 저절로 멈춰요.", d: "need an injection", k: ["경련 중에는 아이를 옆으로 눕혀 주세요", "경련이 시작된 시간을 알려 주세요"], a: "scary", o: ["loud", "rare", "silent"]}
  - {t: "수분 공급", i: coffee, w: "small sips와 every few minutes로 양과 간격을 구체적으로 말해 아이가 토하지 않게 조금씩 먹이도록 해요. 열이 나면 수분이 빠져 탈수되기 쉬워요.", d: "big gulps", k: ["수분은 차갑게 드리세요", "아이가 토하면 알려 주세요"], a: "sips", o: ["bites", "pills", "slices"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "열성경련 우려 보호자 설명 4문장 순서"
    why: "경련이 무서워 보여도 대개 저절로 멈춘다고 말하고, 그런 경련은 대부분 짧고 후유증이 없다고 이어서 안심시키고, 후유증이 드물다는 말에 이어 열을 내리고 편안하게 해 주겠다고 알리고, 그를 돕는 수분 공급과 관찰 요청으로 닫아요. 'them'·'they'·'it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Seizures like this look scary, but they usually stop on their own within a minute.", icon: faceWorried, ko: "이런 경련은 무서워 보이지만 보통 1분 안에 저절로 멈춰요", note: "경련"}
    - {en: "Most of them are brief and don't cause lasting harm.", icon: bulb, ko: "대부분은 짧고 지속적인 해를 남기지 않아요", note: "안심"}
    - {en: "Since they rarely leave lasting harm, we'll just bring his fever down and keep him comfortable.", icon: pill, ko: "후유증이 거의 없으니 열을 내리고 편안하게 해드릴게요", note: "치료"}
    - {en: "To help bring it down, keep offering fluids, and let me know if he becomes hard to wake.", icon: coffee, ko: "열 내리는 걸 돕게 수분을 권하고 깨우기 힘들면 알려주세요", note: "요청"}
  ctx: {word: "seizure", ko: "경련"}
- title: 발열+발진 감별
  s:
  - {t: "원인 추정", i: pill, w: "makes me wonder if로 약 때문이라고 단정하지 않고 궁금증으로 말해 환자를 놀라게 하지 않아요. 새 약 시작 뒤 생긴 발진은 약물 반응을 먼저 떠올려요.", d: "I'm sure the rash", k: ["발진이 언제 생겼는지 알려 주세요", "새로 드신 약 이름을 알려 주세요"], a: "reaction", o: ["habit", "shortage", "trial"]}
  - {t: "발진 관찰", i: magnify, w: "how와 whether로 퍼지는 모양과 물집 여부 두 가지를 관찰 항목으로 알려요. 물집이 생기거나 빠르게 퍼지는 발진은 심한 약물 반응의 경고 신호일 수 있어요.", d: "how it smells", k: ["발진 부위에 연고를 바를게요", "발진 사진을 찍어 둘게요"], a: "blisters", o: ["itches", "fades", "bleeds"]}
  - {t: "점막 증상", i: stetho, w: "mouth sores와 eye irritation은 점막이 침범됐는지 보는 질문이에요. 입과 눈의 병변이 함께 있으면 심한 피부 약물 반응일 수 있어 더 서둘러 살펴봐요.", d: "ear pain", k: ["가려움이 심하세요?", "열이 언제부터 있었어요?"], a: "mouth", o: ["ear", "knee", "scalp"]}
  - {t: "시점 확인", i: calendar, w: "before or after로 두 선택지를 놓고 시간 순서를 짚어요. 발진이 약보다 먼저 났다면 약물 반응일 가능성이 낮아져서 순서가 핵심 단서예요.", d: "while you slept", k: ["새 약은 몇 알 드셨어요?", "새 약은 누가 처방했어요?"], a: "began", o: ["stopped", "finished", "refused"]}
  - {t: "경과 관찰", i: monitor, w: "Let's로 함께 지켜보자고 제안해 불안을 낮추고 closely로 자세히 본다고 알려요. 물집과 피부 벗겨짐은 진행 신호라 몇 시간 단위로 확인해요.", d: "for bruising", k: ["몇 시간마다 체온을 재볼게요", "피부를 문지르지 마세요"], a: "peeling", o: ["bruising", "swelling", "itching"]}
  order:
    tag: "대화 흐름"
    icon: compass
