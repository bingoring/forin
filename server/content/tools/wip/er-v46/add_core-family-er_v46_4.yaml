  - {t: "선택권", i: shield, w: "no pressure로 압박이 없다고 먼저 말하고 entirely로 결정권이 전적으로 가족에게 있다고 강조해요. 기증은 설득이 아니라 선택으로 전해야 해요.", d: "of mine", k: ["의사 선생님이 결정하실 거예요", "기증은 꼭 하셔야 해요"], a: "entirely", ai: handshake2, o: [["partly", "redo"], ["hardly", "chevronDown"], ["rarely", "calendar"]]}
