  - {t: "환자의 뜻", i: speech, w: "would have wanted는 지금 말할 수 없는 환자가 그때 원했을 것을 짐작하는 말이에요. 가족이 원하는 것이 아니라 환자의 뜻을 묻게 해서 결정의 무게를 덜어 줘요.", d: "for her", k: ["가족분이 원하는 걸 말해 보세요", "어머님이 좋아하시던 음식은요?"], a: "wanted", ai: star, o: [["cooked", "coffee"], ["painted", "pencil"], ["bought", "board"]]}
