    lines:
    - {en: "There are no words for this kind of loss.", icon: baby, ko: "이런 상실에는 어떤 말도 부족해요", note: "인정"}
    - {en: "That's why I'm right here with you — I am so deeply sorry.", icon: me, ko: "그래서 곁에 있어요, 정말 깊이 애도를 표합니다", note: "곁에"}
    - {en: "You can hold her for as long as you need.", icon: handshake2, ko: "필요한 만큼 오래 아이를 안고 계셔도 돼요", note: "허락"}
    - {en: "Afterward, we can make a keepsake if you'd like.", icon: pushpin, ko: "그 뒤에 원하시면 기념물을 만들 수 있어요", note: "제안"}
  ctx: {word: "keepsake", ko: "기념물"}
