  - {t: "담당자 안내", i: speech, w: "will은 앞으로 이어질 일을 알리는 약속의 말이에요. 코디네이터가 전부 설명하고 질문에 답한다고 하면 간호사가 모르는 것을 아는 척하지 않아도 돼요.", d: "to him", k: ["제가 모든 걸 설명할게요", "질문은 받을 수 없어요"], a: "coordinator", ai: handshake2, o: [["cashier", "board"], ["driver", "plane"], ["reporter", "mic"]]}
