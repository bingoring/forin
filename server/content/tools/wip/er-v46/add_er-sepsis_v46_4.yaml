- title: 면역저하 잠복 패혈증
  s:
  - {t: "면역저하 주의", i: shield, w: "even mild symptoms로 가벼운 증상도 가볍게 넘기지 않겠다는 기준을 먼저 알려요. 면역억제제를 쓰면 감염이 있어도 열이나 염증 반응이 약하게 나타나 위험을 놓치기 쉬워요.", d: "in the past", k: ["복용 중인 약을 모두 알려 주세요", "마지막으로 약 드신 때를 말씀해 주세요"], a: "mild", o: ["brief", "strange", "sudden"]}
  - {t: "기다리지 않음", i: bell, w: "won't wait와 we'll check now를 대비시켜 고열이 날 때까지 기다리지 않는다는 결정을 분명히 해요. 면역이 억제된 환자는 열이 늦거나 약해서, 열이 없어도 일찍 철저히 확인해요.", d: "in the lab", k: ["최근 항암이나 이식 이력을 말씀해 주세요", "복용 중인 약을 다시 확인할게요"], a: "thoroughly", o: ["slowly", "partly", "lightly"]}
  - {t: "배양+감시", i: lab, w: "cultures와 watching you closely를 and로 이어 검사와 지켜보기를 함께 한다고 알려요. 면역이 억제된 환자는 증상만으로 판단하기 어려워 배양으로 감염을 확인하면서 상태를 계속 살펴요.", d: "at the door", k: ["상처가 있으면 보여 주세요", "오늘 열이 몇 도까지 올랐나요?"], a: "cultures", o: ["pictures", "circles", "maps"]}
  - {t: "미세 단서", i: monitor, w: "slightly와 only clue로 아주 작은 변화가 유일한 신호일 수 있다는 점을 한 문장에 넣어요. 면역억제 환자는 열 대신 약간 빨라진 심박수가 첫 신호인 경우가 있어요.", d: "last year", k: ["열은 없지만 계속 지켜볼게요", "심장 모니터를 붙일게요"], a: "faster", o: ["slower", "lower", "weaker"]}
  - {t: "조기 대응", i: shield, w: "Because로 이유를 먼저 말하고 we act early rather than wait로 결정을 붙여, 서두르는 것이 과잉이 아니라 이유 있는 선택임을 보여 줘요. 면역이 억제된 환자는 빨리 나빠질 수 있어서 근거가 다 모이기 전에 움직여요.", d: "for you", k: ["약 복용은 의사와 상의해 정해요", "검사 결과는 곧 알려 드릴게요"], a: "immune", o: ["digestive", "skeletal", "muscular"]}
  - {t: "무열 가능성", i: faceWorried, w: "Even without로 열이 없어도라는 예외를 먼저 말해, 열이 없으면 안전하다는 흔한 오해를 바로잡아요. may로 가능성만 말해 겁은 덜 주면서 경계는 풀지 않게 해요.", d: "by the bed", k: ["열이 없어도 계속 확인할게요", "피검사 결과를 기다리고 있어요"], a: "Even", o: ["Only", "Just", "Also"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "면역저하 환자 설명 4문장 순서"
    why: "위험을 알리고, 'That's why'가 그것을 이유로 받아 기다리지 않겠다고 하고, 'Instead'가 그 '기다림'의 반대로 지금 하는 일을 말하고, 'that'이 그 행동을 가리켜 이유를 덧붙여요. 'That's why'·'Instead'·'that'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "You're on medicine that weakens your immune system, so even mild symptoms can be serious.", icon: shield, ko: "면역을 약하게 하는 약을 드시고 있어서 가벼운 증상도 심각할 수 있어요", note: "위험"}
    - {en: "That's why we won't wait for a high fever before we start checking.", icon: bell, ko: "그래서 고열이 날 때까지 기다리지 않고 확인을 시작할 거예요", note: "결정"}
    - {en: "Instead, we're drawing cultures and watching you closely.", icon: lab, ko: "대신 배양을 채취하고 계속 지켜볼게요", note: "행동"}
    - {en: "We do that because even with no fever, you may be fighting a serious infection.", icon: faceWorried, ko: "열이 없어도 심각한 감염과 싸우고 있을 수 있어서 그렇게 해요", note: "이유"}
  sw: {ko: "고열이 날 때까지 기다리지 않고 지금 철저히 확인할게요"}
- title: 카테터 관련 균혈증
  s:
  - {t: "오한 단서", i: bell, w: "when your line is used로 증상이 생기는 때를 짚어 라인과 증상 사이의 연결을 보여 줘요. 투석이나 라인 사용 직후의 오한은 카테터 안쪽의 균이 혈류로 들어갔다는 흔한 신호예요.", d: "last night", k: ["라인 주변이 아프신가요?", "오한은 하루에 몇 번 오나요?"], a: "Chills", o: ["Hiccups", "Yawning", "Sneezing"]}
  - {t: "양쪽 채취", i: lab, w: "from the line and from your arm으로 두 곳에서 따로 채취한다고 말해요. 라인과 말초 정맥에서 함께 뽑아 비교하면 라인이 감염원인지 가려내는 데 도움이 돼요.", d: "by phone", k: ["채혈은 두 번 따끔할 수 있어요", "라인은 소독하고 쓸게요"], a: "cultures", o: ["pictures", "stories", "plans"]}
  - {t: "라인 제거", i: scalpel, w: "may need to로 아직 결정이 아니라 가능성임을 분명히 해요. 카테터 안에 균이 막을 만들어 붙으면 항생제만으로는 없어지지 않아서 라인을 빼야 할 수 있어요.", d: "for you", k: ["제거는 의사가 정해요", "새 라인은 다른 곳에 넣을 수 있어요"], a: "remove", o: ["cover", "paint", "shorten"]}
  - {t: "투석 직후", i: calendar, w: "right after로 시점을 붙여 증상과 투석 사이의 연결을 보여 줘요. 투석 카테터로 균이 혈류에 들어가 투석 중이나 직후에 열과 오한이 오는 일이 흔해요.", d: "last week", k: ["출구 부위를 한번 볼게요", "열은 투석 중에도 났나요?"], a: "dialysis", o: ["breakfast", "bathing", "visiting"]}
  - {t: "라인 부위", i: faceWorried, w: "also로 앞서 말한 열·오한에 더해 한 가지 더 있다고 알려요. 카테터가 나오는 피부 부위의 발적·통증·분비물은 출구 부위 감염의 전형적인 신호예요.", d: "this morning", k: ["그 부위는 만지지 말아 주세요", "드레싱은 제가 갈아 드릴게요"], a: "Redness", o: ["Freckles", "Wrinkles", "Tattoos"]}
  - {t: "제거 후 경과", i: calendar, w: "Once로 라인이 빠진 뒤에 일어날 일을 말하고 usually로 예외가 있음을 남겨 약속을 과장하지 않아요. 감염원이던 카테터를 빼고 항생제를 쓰면 대개 경과가 좋아져요.", d: "by itself", k: ["항생제는 계속 필요할 수 있어요", "열이 내리는지 지켜볼게요"], a: "line", o: ["light", "door", "bed"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "카테터 균혈증 설명 4문장 순서"
    why: "증상과 라인의 연결을 알리고, 'the line is the source'가 그 의심을 확인하는 검사를 말하고, 'it'이 그 라인을 가리켜 감염 시 제거 가능성을 말하고, 'it's out'이 그 제거를 가리켜 그 뒤 경과를 말해요. 'it'·'Once it's out'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "You have chills and fever right after dialysis, which often points to the line.", icon: calendar, ko: "투석 직후 오한과 열이 있어서 라인을 의심해요", note: "의심"}
    - {en: "We'll draw cultures from the line and your arm to see if it's the source.", icon: lab, ko: "라인과 팔에서 배양을 채취해 라인이 원인인지 볼게요", note: "검사"}
    - {en: "If it is infected, we may need to remove the line to clear the infection.", icon: scalpel, ko: "라인이 감염됐다면 감염을 없애려고 제거해야 할 수 있어요", note: "제거"}
    - {en: "Once it's out, the infection usually starts to clear.", icon: check, ko: "라인을 빼고 나면 감염은 보통 가라앉기 시작해요", note: "경과"}
  ctx:
    word: "peripheral"
    ko: "말초"
- title: 산모 패혈증
  s:
  - {t: "동시 관리", i: baby, w: "treating과 watching을 and로 이어 산모와 아기를 둘 다 본다고 한 문장에 말해요. 임신 중 패혈증은 산모를 치료하는 것이 곧 태아를 지키는 길이어서 둘을 함께 살펴요.", d: "by yourself", k: ["진통이 있으면 바로 말씀해 주세요", "아기 심장 소리를 들려 드릴게요"], a: "same", o: ["next", "other", "last"]}
  - {t: "임신 안전", i: shield, w: "that are safe in pregnancy로 약이 안전하다는 점을 수식으로 붙여 산모의 가장 큰 걱정(아기에게 해로울까)에 먼저 답해요. 임신 중 패혈증도 항생제를 미루지 않고 임신에 안전한 계열로 골라 바로 시작해요.", d: "for now", k: ["수액은 팔로 들어가요", "알레르기가 있는지 확인할게요"], a: "pregnancy", o: ["winter", "summer", "school"]}
  - {t: "태아 감시", i: monitor, w: "continuously로 중간중간이 아니라 끊김 없이 본다고 분명히 말해요. 산모가 아프면 태아도 영향을 받아 산소가 모자랄 수 있어서 태아 심박동을 지속적으로 확인해요.", d: "at home", k: ["아기 움직임을 세어 보세요", "진통 간격을 알려 주세요"], a: "heartbeat", o: ["weight", "size", "name"]}
  - {t: "빠른 치료", i: siren, w: "both of you로 산모와 아기 모두에게 해당한다고 말해 치료가 산모만을 위한 것이 아님을 알려요. 산모의 열과 빠른 맥은 태아에게 가는 산소를 줄일 수 있어서 빠른 치료가 둘 다를 지켜요.", d: "for now", k: ["아기 상태를 계속 볼게요", "의사가 곧 올 거예요"], a: "fever", o: ["rash", "bruise", "cough"]}
  - {t: "태동 보고", i: baby, w: "less than usual로 평소 대비 변화를 기준으로 삼아 산모가 자기 아기의 평소 움직임을 기준으로 판단하게 해요. 태동이 줄면 태아 상태가 나빠졌다는 신호일 수 있어서 바로 알려야 해요.", d: "at home", k: ["진통 간격을 재 주세요", "배가 단단해지면 말씀해 주세요"], a: "less", o: ["more", "faster", "harder"]}
  - {t: "약 안전성", i: pill, w: "are chosen으로 행위자를 앞세우지 않고 선택이 이루어졌다는 수동태라, 우연이 아니라 신중하게 골랐다는 느낌을 줘요. 임신 중에는 태아 위험이 적은 약을 우선해 고르고 의사·약사가 확인해요.", d: "by chance", k: ["약 이름이 궁금하면 말씀해 주세요", "의사가 약을 하나씩 설명할 거예요"], a: "medicines", o: ["visitors", "forms", "rooms"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "산모 패혈증 설명 4문장 순서"
    why: "감염이 둘 다에게 영향을 준다고 알리고, 'That's why'가 그것을 이유로 받아 안전한 치료를 말하고, 'those'가 그 치료를 가리켜 태아 감시를 더하고, 'the monitor'가 그 감시를 가리켜 태동 보고를 부탁해요. 'That's why'·'Along with those'·'the monitor'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "You have an infection, and it's affecting both you and your baby.", icon: baby, ko: "감염이 있고 산모님과 아기 모두에게 영향을 주고 있어요", note: "상황"}
    - {en: "That's why we're starting fluids and antibiotics that are safe in pregnancy.", icon: shield, ko: "그래서 임신 중에 안전한 수액과 항생제를 시작할게요", note: "치료"}
    - {en: "Along with those, we're monitoring your baby's heartbeat continuously.", icon: monitor, ko: "그와 함께 아기 심장박동을 계속 확인하고 있어요", note: "감시"}
    - {en: "Tell me if the baby moves less than usual, even if the monitor looks fine.", icon: bell, ko: "모니터가 괜찮아 보여도 아기가 평소보다 덜 움직이면 말씀해 주세요", note: "보고"}
  sw: {ko: "아기의 심장박동을 계속 확인하고 있어요"}
- title: 패혈증 언어장벽 위중
  s:
  - {t: "통역 전달", i: speech, w: "Through the interpreter를 문장 앞에 두어 이 말이 통역을 거쳐 전달된다는 것을 먼저 밝혀요. believe로 확진 전의 판단임을 정직하게 말하면서 serious로 긴급성은 분명히 해요.", d: "by phone", k: ["통역사를 전화로 연결할게요", "성함 철자를 확인해 주세요"], a: "infection", o: ["burn", "bruise", "blister"]}
  - {t: "긴급 설명", i: bell, w: "urgently와 I'll explain으로 급하게 움직이지만 설명은 빼놓지 않겠다고 한 문장에 담아요. 통역을 쓰는 환자와 가족은 상황을 모른 채 처치를 받기 쉬워서 단계마다 설명하겠다고 먼저 약속해요.", d: "in the hall", k: ["가족분께 설명서를 드릴게요", "서명은 통역사와 함께 받을게요"], a: "urgently", o: ["quietly", "politely", "cheerfully"]}
  - {t: "통역 요청", i: speech, w: "Please ask her…로 통역사에게 부탁하는 문장이라 where와 when 두 질문을 간단하게 한 번에 건네요. 질문을 짧고 분명하게 줘야 통역에서 뜻이 덜 흐려져요.", d: "for me", k: ["보호자분 연락처를 물어봐 주세요", "병원에 오기 전 무엇을 드셨는지 물어봐 주세요"], a: "feels", o: ["sees", "hears", "tastes"]}
  - {t: "알레르기 확인", i: shield, w: "Ask the interpreter to…로 통역사를 거쳐 물어보는 순서를 분명히 하고 find out if로 예/아니오로 답할 수 있는 질문으로 만들어요. 항생제를 쓰기 전에는 알레르기 확인이 기본 안전 확인이에요.", d: "at home", k: ["환자분이 쓰는 언어를 한 번 더 확인해 주세요", "글을 읽을 수 있는지도 물어봐 주세요"], a: "allergies", o: ["pets", "hobbies", "cousins"]}
  - {t: "단계 전 설명", i: speech, w: "before로 새 처치 전에 통역을 거쳐 먼저 설명한다는 순서를 약속해요. 통역은 시간이 더 걸려서 한 번에 한 가지씩 짧게 전하는 것이 좋아요.", d: "on the phone", k: ["통역사가 곧 도착할 거예요", "환자분이 이해했는지 확인해 주세요"], a: "new", o: ["old", "tiny", "quiet"]}
  - {t: "긴급 이유", i: siren, w: "because로 서두르는 이유를 바로 밝혀 가족이 놀라거나 오해하지 않게 해요. very serious로 심각도를 숨기지 않으면서 설명은 짧고 담담하게 해요.", d: "for lunch", k: ["다른 가족분도 곧 부를게요", "의사가 곧 설명해 줄 거예요"], a: "serious", o: ["common", "new", "strange"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "통역 환자 설명 4문장 순서"
    why: "가족에게 전할 상황을 말하고, 'That's why'가 그 상황을 이유로 받아 치료와 설명을 약속하고, 'the antibiotic'이 그 치료를 가리켜 시작 전 확인을 부탁하고, 'Thank you'가 그 대답을 받아 다음 질문을 해요. 'That's why'·'the antibiotic'·'Thank you'가 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Please tell the family that we believe she has a serious infection.", icon: speech, ko: "가족분께 심각한 감염이 있다고 생각한다고 전해 주세요", note: "전달"}
    - {en: "That's why we're starting fluids and antibiotics now, and I'll explain each step.", icon: bell, ko: "그래서 수액과 항생제를 지금 시작하고, 각 단계를 설명할게요", note: "약속"}
    - {en: "Before we start the antibiotic, please ask her whether she has any allergies.", icon: shield, ko: "항생제를 시작하기 전에 알레르기가 있는지 물어봐 주세요", note: "알레르기"}
    - {en: "Thank you. Now please ask where she feels pain and when this started.", icon: speech, ko: "고마워요. 이제 어디가 아프고 언제 시작됐는지 물어봐 주세요", note: "증상"}
  ctx:
    word: "infection"
    ko: "감염"
    sc:
      0: {en: "Suspected sepsis, likely urinary infection. Family updated via Spanish interpreter."}
      1: {en: "She's likely septic from a urinary infection — I updated the family through the interpreter."}
      2: {en: "She's got a nasty infection, but hang in there.", fix: "We believe she has a serious infection, and we are treating it now."}
    why: "통역을 거칠 때는 관용어·속어(hang in there)를 피하고 짧고 분명한 문장으로 말해요. 관용어는 다른 언어로 그대로 옮겨지지 않아 뜻이 흐려지거나 가볍게 들려요."
- title: 패혈성 쇼크 승압제
  s:
  - {t: "승압제 시작", i: siren, w: "Fluid-refractory shock으로 상태를 먼저 말하고 we need to start…로 요청을 붙여, SBAR의 평가와 요청이 한 문장에 담겨요. 수액에도 혈압이 오르지 않으면(수액 불응) 노르에피네프린 같은 승압제를 시작해요.", d: "for pain", k: ["수액을 한 팩 더 걸겠습니다", "혈액배양은 이미 나갔습니다"], a: "shock", o: ["pain", "nausea", "itching"]}
  - {t: "중심라인 준비", i: pill, w: "Prepare for…로 앞으로 필요한 것을 미리 준비하라는 지시예요. safely로 이유를 덧붙여요. 승압제는 말초로 오래 주면 혈관 밖으로 새어 조직이 상할 수 있어서 중심 정맥로가 더 안전해요.", d: "for lunch", k: ["가족에게 상황을 알려 주세요", "동의서를 가져와 주세요"], a: "central", o: ["oral", "nasal", "rectal"]}
  - {t: "SBAR 요청", i: speech, w: "Septic shock, MAP under sixty-five로 상황과 평가를 숫자로 먼저 말하고, 마지막 I need…로 SBAR의 R(요청)을 분명히 해요. 수액 뒤에도 MAP이 65 미만이면 승압제를 시작하는 기준이에요.", d: "by phone", k: ["혈액배양은 이미 나갔습니다", "젖산은 4로 나왔습니다"], a: "physician", o: ["dietitian", "chaplain", "porter"]}
  - {t: "보고 한 줄", i: monitor, w: "수액 양과 반응을 먼저 말하고 대시 뒤에 하는 일을 붙여, 한 문장에 상태에서 행동까지 담아요. 수액 2리터 이상에도 혈압이 낮으면 승압제로 넘어가는 신호예요.", d: "for now", k: ["동의서에 서명받았습니다", "중심라인 준비해 주세요"], a: "Two", o: ["Five", "Ten", "Twenty"]}
  - {t: "역할 분담", i: board, w: "I'll…while you…로 두 사람이 동시에 할 일을 나눠 말해 시간을 아껴요. 중심라인 트레이를 미리 준비해 두면 의사가 오자마자 삽입을 시작할 수 있어요.", d: "in the room", k: ["제가 의사에게 전화할게요", "트레이는 선생님이 가져오세요"], a: "tray", o: ["door", "floor", "window"]}
  - {t: "임시 경로", i: pill, w: "until로 임시 조치가 언제까지인지 끝을 정해 둬서 말초 투여가 계속되는 방법이 아니라 다리 역할임을 분명히 해요. 응급에서는 중심라인을 기다리느라 지체하지 않고 말초로 승압제를 먼저 시작하기도 하며, 새는지 부위를 자주 살펴요.", d: "all day", k: ["말초라인 부위는 자주 확인할게요", "중심라인 동의서는 받았어요"], a: "peripheral", o: ["central", "urinary", "feeding"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "승압제 시작 보고 4문장 순서"
    why: "상태와 행동을 보고하고, 'That's'가 그 상태를 가리켜 의사를 요청하고, 'they'가 그 의사를 가리켜 중심라인 준비를 말하고, 'it'이 그 라인을 가리켜 승압제를 옮긴다고 말해요. 'That's'·'they'·'Once they place it'이 앞 줄을 가리켜 순서가 하나예요."
    lines:
    - {en: "Two liters in and pressure still low — I'm starting the pressor.", icon: monitor, ko: "2리터가 들어갔는데 혈압이 여전히 낮아서 승압제를 시작할게요", note: "보고"}
    - {en: "That's septic shock, so I need the physician at bedside.", icon: speech, ko: "패혈성 쇼크라서 의사가 침상 곁에 필요해요", note: "요청"}
    - {en: "I'll get the central line tray ready now so they can place it right away.", icon: board, ko: "그분이 바로 넣을 수 있게 지금 중심라인 트레이를 준비할게요", note: "준비"}
    - {en: "Once they place it, I'll move the pressor over to the new line.", icon: pill, ko: "넣고 나면 승압제를 새 라인으로 옮길게요", note: "이동"}
  sw: {ko: "패혈성 쇼크, 2리터 수액 뒤에도 MAP이 65 미만이에요 — 의사가 침상 곁에 필요해요"}
