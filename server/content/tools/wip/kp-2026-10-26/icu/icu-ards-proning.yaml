situations:
- title: ARDS 산소화 지표 이해
  sentences:
  - en: That ratio tells us how well his lungs are moving oxygen into his blood.
    ko: 그 비율은 폐가 혈액으로 산소를 얼마나 잘 보내는지 알려줘요.
    chunks:
    - That ratio
    - tells us
    - how well his lungs
    - are moving oxygen
    - into his blood
    - .
    words:
    - w-ratio
    - w-lung
    - w-move
    - w-oxygen
    - w-blood
    goal: 1
    tag: 수치 설명
    icon: chartup
    why: '''how well''로 정도를 묻는 간접 의문문을 쓰면 숫자 하나가 폐의 산소 전달 능력을 말해 준다는 점이 가족에게도 쉽게 들려요.'
    decoy: from his kidneys
    distractorsKo:
    - 그 비율은 폐가 혈액으로 당을 얼마나 잘 보내는지 알려줘요.
    - 그 비율은 심장이 혈액으로 산소를 얼마나 잘 보내는지 알려줘요.
    blank:
      answer: oxygen
      options:
      - en: oxygen
      - en: fluid
      - en: medicine
      - en: sugar
  - en: A lower number means his lung injury is more severe right now.
    ko: 숫자가 낮을수록 지금 폐 손상이 더 심하다는 뜻이에요.
    chunks:
    - A lower number
    - means
    - his lung injury
    - is more severe
    - right now
    - .
    words:
    - w-lower
    - w-number
    - w-mean
    - w-lung
    - w-injury
    - w-severe
    goal: 1
    tag: 수치 해석
    icon: monitor
    why: '''A lower number means…''는 숫자의 방향과 의미를 한 문장에 묶어요. ''right now''를 붙이면 지금 상태라는 점이 분명해 가족이 영구적 판정으로 오해하지 않아요.'
    decoy: in his kidneys
    distractorsKo:
    - 숫자가 낮을수록 지금 신장 손상이 더 심하다는 뜻이에요.
    - 숫자가 낮을수록 어제 폐 손상이 더 심했다는 뜻이에요.
    blank:
      answer: severe
      options:
      - en: severe
      - en: mild
      - en: recent
      - en: common
  - en: We track it to see whether his lungs are improving.
    ko: 폐가 좋아지고 있는지 보려고 이 수치를 계속 지켜봐요.
    chunks:
    - We track it
    - to see
    - whether his lungs
    - are improving
    - .
    words:
    - w-track
    - w-lung
    - w-improve
    goal: 2
    tag: 추적 이유
    icon: magnify
    why: '''to see whether…''로 목적을 먼저 밝히면 수치를 계속 보는 이유가 불안이 아니라 회복 확인이라는 인상을 줘요.'
    decoy: twice a day
    distractorsKo:
    - 폐가 좋아지고 있는지 보려고 이 수치를 계속 알려드려요.
    - 간이 좋아지고 있는지 보려고 이 수치를 계속 지켜봐요.
    blank:
      answer: lungs
      options:
      - en: lungs
      - en: kidneys
      - en: veins
      - en: bones
  - en: It compares the oxygen in his blood to the oxygen he's breathing in.
    ko: 혈액 속 산소와 들이마시는 산소를 비교하는 거예요.
    chunks:
    - It compares
    - the oxygen in his blood
    - to the oxygen
    - he's breathing in
    - .
    words:
    - w-compare
    - w-oxygen
    - w-blood
    - w-breathe
    goal: 1
    tag: 비교 설명
    icon: compass
    why: '''compares A to B''로 두 값을 나란히 놓으면 비율이 무엇을 비교하는지 쉽게 그려져요.'
    decoy: with his heart rate
    distractorsKo:
    - 혈액 속 당과 들이마시는 산소를 비교하는 거예요.
    - 소변 속 산소와 들이마시는 산소를 비교하는 거예요.
    blank:
      answer: blood
      options:
      - en: blood
      - en: urine
      - en: saliva
      - en: skin
  - en: I'll explain what each new number means as we go.
    ko: 새 수치가 나올 때마다 무슨 뜻인지 설명해 드릴게요.
    chunks:
    - I'll explain
    - what each new number
    - means
    - as we go
    - .
    words:
    - w-explain
    - w-number
    - w-mean
    goal: 2
    tag: 소통 약속
    icon: speech
    why: '''as we go''는 수치가 나올 때마다 곧바로 설명하겠다는 약속이에요. 가족이 숫자 앞에서 혼자 남지 않게 해요.'
    decoy: to your family
    distractorsKo:
    - 새 수치가 나올 때마다 무슨 뜻인지 메모해 드릴게요.
    - 새 사진이 나올 때마다 무슨 뜻인지 설명해 드릴게요.
    blank:
      answer: means
      options:
      - en: means
      - en: counts
      - en: lists
      - en: weighs
  nuance:
  - kind: slider
    words:
    - w-severe
    cue: 'Doctor to the family: "His P/F ratio is 80 right now."'
    scale:
    - mild
    - moderate
    - severe
    answerAt: 2
    why: P/F 비율이 100 이하면 중증(severe) ARDS로 분류해요. mild는 200~300, moderate는 100~200 사이로, 같은 '폐가 안 좋다'여도 단계가 달라요.
    example: His lung injury is severe right now.
    exKo: 지금 폐 손상이 심한 상태예요.
  - kind: context
    words:
    - w-improve
    word: improve
    ko: 호전되다
    scenes:
    - who: 의사 회진
      icon: monitor
      en: His P/F ratio has improved since we proned him.
      ok: true
    - who: 차트 기록
      icon: board
      en: Oxygenation improved overnight; P/F 90 to 140.
      ok: true
    - who: 가족에게
      icon: me
      en: Your son's PaO2 to FiO2 index has improved by fifty points.
      ok: false
      fix: He's improving a little. The oxygen in his blood is better than it was yesterday.
    why: 의료진끼리와 차트에서는 수치를 그대로 말해도 되지만, 가족에게는 PaO2·FiO2 같은 지표를 풀어서 '산소가 좋아지고 있다'로 말해요.
  order:
    tag: 대화 흐름
    icon: compass
    ko: 산소화 지표 설명 4문장 순서
    why: 숫자가 무엇인지 먼저 소개하고, 무엇을 비교하는지 풀어 준 뒤, 낮을 때의 의미를 알려요. 마지막에 그래서 계속 지켜본다고 이어요.
    lines:
    - en: That number shows how well his lungs move oxygen.
      icon: chartup
      ko: 그 숫자는 폐가 산소를 얼마나 잘 보내는지 보여줘요
      note: 소개
    - en: It compares the oxygen in his blood to what he breathes in.
      icon: compass
      ko: 혈액 속 산소와 들이마시는 산소를 비교해요
      note: 비교
    - en: When that comparison comes out lower, the injury is more severe.
      icon: monitor
      ko: 그 비교 결과가 낮으면 손상이 더 심해요
      note: 의미
    - en: Because a lower result means a worse injury, we keep watching it as new results come in.
      icon: magnify
      ko: 낮은 결과는 더 심한 손상이라서 새 결과가 나올 때마다 계속 지켜봐요
      note: 추적
