  fields:
  - ko
  why: ko '구령'은 call the count 한 곳뿐 — TOF count(세어진 수)까지 덮도록 '카운트(셈)'로
- kind: word
  id: w-move
  fields:
  - ko
  why: ko '이동시키다'는 타동사 한 가지인데 문장은 moves him·isn't moving·before we move 등 '움직이다'가 대부분
