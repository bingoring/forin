# 상황 6~10.
6:
  s:
    - {tag: "상황 보고", icon: chartup, why: "despite 뒤에는 명사구가 와서 그럼에도라는 대비를 만들어요. adequate ventilation을 먼저 못 박으면 호흡 탓이 아니라는 근거가 되어 MH 의심에 설득력이 생겨요.", decoy: "after the alarm", d: ["충분한 진정에도 EtCO2가 오르고 있어요.", "적절한 환기에도 체온이 오르고 있어요."], a: "ventilation", o: ["sedation", "positioning", "monitoring"]}
    - {tag: "의심 표현", icon: bulb, why: "makes me think는 확정이 아니라 의심을 말하는 완곡한 모양이라 진단을 단정하지 않고도 팀을 움직여요. early를 붙여 아직 심해지기 전에 일찍 알아챘다는 뜻을 담아요.", decoy: "about lunch", d: ["이 양상을 보면 조기 감염이 생각나요.", "이 환자를 보면 조기 MH가 생각나요."], a: "pattern", o: ["color", "sound", "smell"]}
    - {tag: "경보·준비", icon: siren, why: "alert … and get ready는 알리는 일과 준비하는 일을 한 문장에 묶어 동시에 시작하자는 모양이에요. get ready는 준비된 상태가 되라는 구동사라 증상이 심해지기 전에 움직이게 해요.", decoy: "and call it", d: ["외과팀에 경고하고 준비합시다.", "약국에 경고하고 준비합시다."], a: "ready", o: ["calm", "dressed", "busy"]}
    - {tag: "원인 배제", icon: check, why: "so로 앞의 관찰을 근거 삼아 결론을 이끌어요. isn't from … 모양은 원인을 하나씩 지워 가며 남은 가능성으로 좁혀 가는 말투예요.", decoy: "from the cuff", d: ["환기는 적절해 보이니 이 상승은 저산소 때문이 아니에요.", "환기는 적절해 보이니 이 상승은 저혈압 때문이 아니에요."], a: "rise", o: ["alarm", "cable", "probe"]}
    - {tag: "선제 준비", icon: shield, why: "just in case는 아직 확실하지 않지만 대비한다는 뜻의 관용구예요. getting … ready는 진행형이라 지금 준비를 시작했다는 것을 팀에 보여 줘요.", decoy: "right after lunch", d: ["혹시 몰라서 청소 카트를 준비하고 있어요.", "혹시 몰라서 식사 카트를 준비하고 있어요."], a: "ready", o: ["dirty", "empty", "broken"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "EtCO2 상승 조기 대응 4문장 순서"
    why: "환기가 적절하다는 확인이 먼저여야 환기 문제를 배제할 수 있고, that ruled out으로 그 배제를 받아 MH 의심을 말하며, for it으로 그 의심에 대비해 마취팀을 부르고 준비해요. 각 줄이 앞 줄의 결과를 받아 순서가 하나예요."
    lines:
      - {en: "EtCO2 is rising despite adequate ventilation.", icon: chartup, ko: "적절한 환기에도 EtCO2가 오르고 있어요", note: "관찰"}
      - {en: "Ventilation looks adequate, so it isn't hypoventilation.", icon: check, ko: "환기는 적절해 보여서 저환기가 아니에요", note: "배제"}
      - {en: "With that ruled out, this pattern makes me think early MH.", icon: bulb, ko: "그걸 배제하니 이 양상은 조기 MH가 생각나요", note: "의심"}
      - {en: "Let's alert anesthesia and get ready for it.", icon: siren, ko: "마취팀에 알리고 그에 대비합시다", note: "대비"}
7:
  s:
    - {tag: "소견 보고", icon: stetho, why: "There's … 모양은 새로 발견한 것을 처음 꺼내는 말이라 보고의 첫 문장으로 알맞아요. after induction으로 마취 유도 직후라는 시점을 붙이면 어떤 약과 이어지는지 따져 볼 수 있어요.", decoy: "in the hallway", d: ["유도 후에 교근 통증이 있어요.", "유도 후에 눈꺼풀 강직이 있어요."], a: "rigidity", o: ["swelling", "bleeding", "numbness"]}
    - {tag: "의미 설명", icon: bulb, why: "tight jaw처럼 쉬운 말로 말해 두면 masseter 같은 전문어를 모르는 팀원도 같은 것을 봐요. can be는 단정이 아닌 가능성이라 이 징후 하나로 MH를 선언하지 않고 주의를 돌리는 말이에요.", decoy: "a minor", d: ["뻣뻣한 턱이 조기 감염 징후일 수 있어요.", "뻣뻣한 목이 조기 MH 징후일 수 있어요."], a: "tight", o: ["sore", "swollen", "dry"]}
    - {tag: "추가 관찰", icon: monitor, why: "Let's watch … and prep는 지켜보는 일과 준비하는 일을 같이 하자는 모양이에요. other signs라고 하면 이 하나로 끝내지 않고 다른 단서도 함께 찾으라는 뜻이에요.", decoy: "for other staff", d: ["다른 징후를 살피며 장갑을 준비합시다.", "다른 환자를 살피며 카트를 준비합시다."], a: "prep", o: ["clean", "paint", "weigh"]}
    - {tag: "현황 보고", icon: stetho, why: "but으로 이상한 소견과 정상 소견을 한 문장에 나란히 놓으면 전체 그림이 한 번에 전달돼요. so far는 지금까지는이라는 뜻이라 상황이 바뀔 수 있다는 단서를 남겨요.", decoy: "by now", d: ["손은 뻣뻣하지만 나머지는 아직 이완돼 보여요.", "턱은 뻣뻣하지만 나머지는 아직 창백해 보여요."], a: "relaxed", o: ["pale", "flushed", "swollen"]}
    - {tag: "조기 보고", icon: bell, why: "in case 뒤에 절이 오면 그럴 수도 있으니 미리라는 뜻이라, 확신이 없어도 보고해도 된다는 근거를 줘요. early를 붙여 완전히 확인되기 전에 알린다는 점을 분명히 해요.", decoy: "it's an allergy", d: ["감염 경고 징후일 수 있어 조기에 보고하고 있어요.", "알레르기 경고 징후일 수 있어 조기에 보고하고 있어요."], a: "reporting", o: ["cleaning", "moving", "signing"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "교근 강직 발견 시 4문장 순서"
    why: "소견을 처음 말하고, That tight jaw로 그 소견을 가리켜 MH 징후일 수 있다고 설명하고, it으로 그 징후를 가리켜 조기에 보고하며, along with that으로 보고와 함께 다른 징후를 살피고 카트를 준비해요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      - {en: "There's masseter rigidity after induction.", icon: stetho, ko: "유도 후에 교근 강직이 있어요", note: "소견"}
      - {en: "That tight jaw can be an early MH sign.", icon: bulb, ko: "그 뻣뻣한 턱은 조기 MH 징후일 수 있어요", note: "설명"}
      - {en: "So I'm reporting it early, in case it is.", icon: bell, ko: "그래서 혹시 모르니 일찍 보고해요", note: "보고"}
      - {en: "Along with that, let's watch for other signs and prep the cart.", icon: monitor, ko: "그와 함께 다른 징후를 살피고 카트를 준비합시다", note: "준비"}
8:
  s:
    - {tag: "소견 보고", icon: chartup, why: "with ectopy는 오르는 심박수에 이소성 박동이 함께 있다는 점을 붙여, 빈맥만 말할 때보다 정보가 많아요. is climbing은 진행형이라 지금 변하는 중이라는 뜻이에요.", decoy: "with caution", d: ["혈압이 이소성 박동과 함께 오르고 있어요.", "심박수가 두통과 함께 오르고 있어요."], a: "ectopy", o: ["pain", "cough", "rash"]}
    - {tag: "종합 판단", icon: compass, why: "correlate A with B는 두 수치가 함께 움직이는지 맞춰 본다는 모양이에요. 심박·EtCO2·체온이 같이 오를 때 MH 가능성이 커져서 하나만 보지 않고 묶어 봐요.", decoy: "with the report", d: ["리듬을 EtCO2와 혈압과 연관지어 봅시다.", "리듬을 산소와 체온과 연관지어 봅시다."], a: "correlate", o: ["print", "label", "rename"]}
    - {tag: "보고 약속", icon: siren, why: "any run of …는 한두 박동이 아니라 연속해서 이어지는 구간을 말하는 표현이에요. call out은 팀이 다 듣게 소리 내어 알린다는 뜻이라 모니터만 보고 있는 것과 달라요.", decoy: "of the alarm", d: ["알람이 연속으로 오면 바로 알릴게요.", "기침이 연속으로 오면 바로 알릴게요."], a: "call", o: ["write", "hand", "sort"]}
    - {tag: "변화 보고", icon: chartup, why: "jumped는 올랐다보다 짧은 시간에 확 올랐다는 느낌의 동사예요. ten points와 in the last two minutes로 크기와 기간을 숫자로 말하면 막연한 느낌이 아니라 판단할 수 있는 보고가 돼요.", decoy: "over the weekend", d: ["지난 5분 동안 심박수가 열 포인트 급증했어요.", "지난 2분 동안 혈압이 열 포인트 급증했어요."], a: "jumped", o: ["slipped", "drifted", "settled"]}
    - {tag: "동시 대응", icon: shield, why: "turns unstable의 turn은 상태가 변해서 ~가 된다는 뜻이에요. alongside는 MH 검사를 끝낸 뒤가 아니라 같은 시간에 병행한다는 뜻이라 불안정한 리듬의 처치를 미루지 않게 해요.", decoy: "along the hallway", d: ["리듬이 불안정해지면 폐 검사와 함께 처치합니다.", "혈압이 불안정해지면 MH 검사와 함께 처치합니다."], a: "unstable", o: ["steady", "quiet", "regular"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "빈맥·부정맥 대응 4문장 순서"
    why: "소견을 먼저 말하고, that으로 그 소견을 EtCO2·체온과 맞춰 보고, Those numbers together로 앞에서 모은 수치를 묶어 MH를 의심해 검사를 부르며, alongside that으로 그 검사와 병행해 리듬이 불안정할 때 처치한다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      - {en: "The heart rate is climbing with ectopy.", icon: chartup, ko: "심박수가 이소성 박동과 함께 오르고 있어요", note: "소견"}
      - {en: "Let's correlate that with EtCO2 and temp.", icon: compass, ko: "그걸 EtCO2와 체온과 연관지어 봅시다", note: "대조"}
      - {en: "Those numbers together could point to MH, so I'll call for the workup.", icon: bulb, ko: "그 수치들을 합치면 MH일 수 있어서 검사를 요청할게요", note: "의심"}
      - {en: "If the rhythm turns unstable, we treat it alongside that.", icon: shield, ko: "리듬이 불안정해지면 그와 함께 처치해요", note: "병행"}
9:
  s:
    - {tag: "검사 결과", icon: lab, why: "shows는 검사가 보여 주는 결과를 주어로 삼아 내 의견이 아니라 데이터가 말한다는 모양이에요. mixed acidosis는 호흡성과 대사성 원인이 함께 있다는 뜻이에요.", decoy: "an old sample", d: ["소변검사에서 혼합성 산증이 보여요.", "혈액가스에서 혼합성 탈수가 보여요."], a: "mixed", o: ["pure", "simple", "chronic"]}
    - {tag: "종합 판단", icon: compass, why: "With the rising temperature로 근거를 먼저 놓고 this fits로 판단을 말하는 순서예요. fits는 확정이 아니라 들어맞는다는 뜻이라 임상 그림을 말하는 표현이에요.", decoy: "the new alarm", d: ["혈압 상승과 함께 이건 MH에 부합해요.", "체온 상승과 함께 이건 감염에 부합해요."], a: "fits", o: ["hides", "blocks", "replaces"]}
    - {tag: "사정 반영", icon: board, why: "factor A into B는 A를 B의 판단 재료에 넣는다는 구동사 모양이에요. crisis assessment는 지금 위기가 어디까지 왔는지를 한 번에 보는 판단이에요.", decoy: "into the supply list", d: ["이걸 위기 일정에 반영합시다.", "이걸 위기 예산에 반영합시다."], a: "factor", o: ["paste", "pour", "ship"]}
    - {tag: "연관 설명", icon: chartup, why: "and로 두 변화를 이어 말하고 it correlates with로 둘이 같이 움직인다고 짚어요. 연관된다는 것은 같이 움직인다는 뜻이지 한쪽이 다른 쪽의 원인이라는 증명은 아니에요.", decoy: "with the long wait", d: ["pH가 떨어지고 있고 혈압 상승과 연관돼요.", "칼륨이 떨어지고 있고 체온 상승과 연관돼요."], a: "correlates", o: ["competes", "argues", "plays"]}
    - {tag: "소견 추가", icon: pencil, why: "we're building은 앞의 assessment를 꾸미는 관계절로, 위기 사정이 한 번에 끝나는 게 아니라 쌓아 가는 중이라는 뜻이에요. add는 새 소견을 기존 판단에 합친다는 뜻이에요.", decoy: "to the visitor log", d: ["이 소견을 지금 만들고 있는 위기 목록에 더할게요.", "이 소견을 지금 읽고 있는 위기 사정에 더할게요."], a: "finding", o: ["bill", "photo", "label"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "대사성 산증 확인 4문장 순서"
    why: "결과를 먼저 말하고, that으로 그 결과를 체온과 맞춰 MH에 부합한다고 판단하고, all of that으로 앞서 나온 것을 위기 사정에 반영하며, it으로 그 사정에 새 소견을 계속 더한다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      - {en: "The blood gas shows a mixed acidosis.", icon: lab, ko: "혈액가스에서 혼합성 산증이 보여요", note: "결과"}
      - {en: "With the rising temperature, that fits MH.", icon: compass, ko: "체온 상승과 함께 그건 MH에 부합해요", note: "판단"}
      - {en: "Let's factor all of that into the crisis assessment.", icon: board, ko: "그 전부를 위기 사정에 반영합시다", note: "반영"}
      - {en: "I'll keep adding new findings to it as they come in.", icon: pencil, ko: "새 소견이 나오는 대로 계속 더할게요", note: "갱신"}
10:
  s:
    - {tag: "이유 설명", icon: shield, why: "Because of + 명사는 이유를 먼저 말해서 환자가 조치를 지시가 아니라 이유 있는 결정으로 받아들여요. your를 붙여 환자 본인의 이야기라는 점을 분명히 해요.", decoy: "of your age", d: ["알레르기 병력이 있으니 유발 약제를 피합니다.", "MH 병력이 있으니 유발 음식을 피합니다."], a: "history", o: ["price", "wish", "size"]}
    - {tag: "준비 안내", icon: board, why: "have … ready는 이미 준비해 둔 상태를 말하는 모양이라 불안한 환자에게 지금 안심할 근거를 줘요. special plan으로 이 환자를 위해 따로 짠 계획이라는 점을 알려요.", decoy: "for the team", d: ["당신을 위한 특별한 계획과 음식을 준비해 두었어요.", "당신을 위한 특별한 침대와 약물을 준비해 두었어요."], a: "plan", o: ["menu", "gown", "bed"]}
    - {tag: "안심 말", icon: handshake2, why: "in safe hands는 믿고 맡겨도 된다는 관용구로, 돌봄이 안전하다는 뜻이에요. we've prepared는 현재완료라 미리 준비해 온 일이 지금 도움이 된다는 뜻이에요.", decoy: "for lunch", d: ["안전한 손에 맡겨져 있어요 — 저희가 이걸 설명해 왔어요.", "안전한 손에 맡겨져 있어요 — 저희가 이걸 주문해 왔어요."], a: "safe", o: ["small", "busy", "empty"]}
    - {tag: "예방 안내", icon: shield, why: "known은 이미 확인된 위험이라는 뜻이라 막연한 걱정이 아니라는 점을 분명히 해요. extra precautions는 평소 안전 절차에 더한 조치이고, we'll로 병원이 책임지고 한다고 말해요.", decoy: "extra charges", d: ["알려진 알레르기 위험이 있으니 추가 예방조치를 취할 거예요.", "알려진 MH 위험이 있으니 추가 서류를 작성할 거예요."], a: "precautions", o: ["forms", "charges", "visits"]}
    - {tag: "안심 말", icon: handshake2, why: "I want you to + 동사원형은 내 바람을 말하는 모양이라 지시보다 따뜻해요. feel safe는 안전하다는 사실보다 환자가 느끼는 감정을 먼저 말해 공감을 보여요.", decoy: "for lunch", d: ["안심하셨으면 해요 — 저희 팀 전체가 출근해 있어요.", "안심하셨으면 해요 — 저희 병원 전체가 준비되어 있어요."], a: "safe", o: ["tired", "hungry", "proud"]}
