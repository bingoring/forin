타임아웃 참여 저조:
  - kind: slider
    words: [w-need, w-pause, w-present, w-participate, w-watch]
    cue: "Half the room is looking at their phones during the time-out. The patient is stable and nothing has started."
    scale: ["Let's all be present for this.", "I need everyone to pause and be present for this.", "Nobody touches anything until everyone participates."]
    answerAt: 1
    why: "아직 위험은 없고 집중만 흐트러진 상황이라면, 'I need everyone to pause and be present'처럼 분명하게 멈춰 달라고 요청하는 정도가 알맞아요. 맨 마지막 말은 누군가 행동을 시작하려는 순간에 쓰는 강한 제동이에요."
    example: "I need everyone to pause and be present for this."
    exKo: "다들 멈추고 이 자리에 집중해 주셔야 합니다."
  - kind: context
    words: [w-participate]
    word: participate
    ko: 참여하다
    scenes:
      - {who: 순환 간호사 → 팀, icon: speech, en: "The time-out only works if everyone participates.", ok: true}
      - {who: 안전 점검 기록, icon: board, en: "Time-out audit: full team participation, all items verbalized.", ok: true}
      - {who: 처음 들어온 실습생에게, icon: me, en: "Participate or step out — I don't have time for bystanders.", ok: false, fix: "Please speak up if anything looks off — your voice matters in this time-out."}
    why: "participate 자체는 팀 안에서 자연스러운 말이에요. 하지만 신입이나 실습생에게 쏘아붙이는 투로 쓰면 입을 닫게 만들어요. 안전을 위해서는 누구든 말해도 된다는 분위기를 만드는 말이 맞아요."
시술 변경 재확인:
  - kind: slider
    words: [w-plan, w-change, w-redo, w-timeout]
    cue: "After the time-out, the surgeon decides to add a meniscus repair to the planned right knee arthroscopy."
    scale: ["Mention it out loud.", "Update the plan on the board.", "Re-do the time-out."]
    answerAt: 2
    why: "시술 내용이 바뀌면 처음 확인한 시술과 달라지니, 보통 병원 정책에 따라 타임아웃을 다시 해요. 말로 알리거나 보드만 고치면 팀 전원의 확인이 빠져요."
    example: "The procedure changed, so we need a new time-out."
    exKo: "시술이 바뀌었으니 새 타임아웃이 필요합니다."
  - kind: context
    words: [w-change]
    word: change
    ko: 바뀌다
    scenes:
      - {who: 순환 간호사 → 팀, icon: speech, en: "The procedure changed, so we need a new time-out.", ok: true}
      - {who: 마취과 → 순환 간호사, icon: speech, en: "Plan changed — add the meniscus repair, same knee.", ok: true}
      - {who: 깨어 있는 환자에게, icon: me, en: "There's been a change in your operative plan, and we're re-verifying elements.", ok: false, fix: "Your surgeon is adjusting the plan, so we're stopping to double-check everything with you."}
    why: "change는 팀끼리 짧고 정확하게 말할 때 좋아요. 환자에게는 'operative plan'이나 're-verifying elements'처럼 딱딱하게 말하지 말고, 왜 멈추고 다시 확인하는지 쉽게 설명해요."
검체 처리 사전 확인:
  - kind: pair
    words: [w-frozen, w-permanent, w-label]
    pairs: [[frozen section, sent fresh right away], [permanent section, placed in formalin], [label, with the patient's name]]
    decoys: [left on the back table]
    why: "냉동절편(frozen section)은 고정하지 않은 신선한 조직을 바로 병리과에 보내고, 영구 표본(permanent section)은 포르말린에 담가 고정해요. 라벨에는 환자 이름 같은 식별 정보를 적어요."
  - kind: context
    words: [w-handle]
    word: handle
    ko: 다루다
    scenes:
      - {who: 순환 간호사 → 스크럽 테크, icon: speech, en: "Let's clarify how we'll handle each specimen.", ok: true}
      - {who: 병리 의뢰 기록, icon: board, en: "Specimen handled per pathology protocol.", ok: true}
      - {who: 수술 후 환자에게, icon: me, en: "We'll handle your specimen according to protocol.", ok: false, fix: "The sample we took is going to the lab, and we'll share the results as soon as we have them."}
    why: "handle은 팀과 기록에서 쓰는 정확한 말이에요. 환자에게 'handle your specimen'이라고 하면 내 몸의 일부가 물건처럼 취급되는 느낌이라, 무엇을 하는지와 다음 단계를 쉽게 알려 줘요."
타임아웃 중 부위 불일치:
  - kind: slider
    words: [w-stop, w-discrepancy, w-site, w-consent, w-match]
    cue: "The site mark is on the right knee, but the consent says left. The surgeon says, \"Probably just a typo, let's go.\""
    scale: ["Hold on a second.", "Stop everything — we have a discrepancy here.", "Everyone leave the room."]
    answerAt: 1
    why: "표시와 동의서가 어긋난 것은 확인될 때까지 아무것도 진행하지 않아야 하는 일이에요. 'Stop everything — we have a discrepancy'처럼 분명하게 멈추게 하고, 'Hold on'은 너무 약해서 '오타겠지' 하는 말에 밀려요."
    example: "Stop everything — we have a discrepancy here."
    exKo: "다 멈추세요 — 여기 불일치가 있습니다."
  - kind: context
    words: [w-discrepancy]
    word: discrepancy
    ko: 불일치
    scenes:
      - {who: 순환 간호사 → 팀, icon: speech, en: "We have a discrepancy between the consent and the site mark.", ok: true}
      - {who: 안전 사건 기록, icon: board, en: "Time-out stopped for discrepancy; resolved after consent re-verified.", ok: true}
      - {who: 마취 직전 환자에게, icon: me, en: "There's a discrepancy in your paperwork regarding laterality.", ok: false, fix: "I want to double-check one thing with you — which knee are we operating on today?"}
    why: "discrepancy는 팀과 기록에서 쓰는 정확한 말이에요. 환자에게 'laterality'를 들먹이면 어려운 데다 서류 문제로 불안하게 들려요. 환자가 직접 답할 수 있게 어느 무릎인지 묻는 것이 확인도 되고 쉬워요."
