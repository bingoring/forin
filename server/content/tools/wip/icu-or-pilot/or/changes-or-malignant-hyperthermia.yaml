theme: or-malignant-hyperthermia
changes:
- kind: word
  id: w-notify
  fields:
  - ko
  why: 알리다가 notify·call·tell 셋이라 듣고 뜻 고르기에서 정답이 여럿 — notify는 공식적으로 알리는 통보
- kind: word
  id: w-case
  fields:
  - ko
  why: 증례(환자 사례)는 이 주제의 수술 한 건이라는 뜻과 다름 — 문장 ko는 케이스
- kind: word
  id: w-call
  fields:
  - ko
  why: 알리다가 notify·tell과 같았고, 태그 문장은 call it out(외쳐 알림)·call for help(호출)
- kind: word
  id: w-first
  fields:
  - ko
  why: 태그 문장이 the first MH sign(첫)과 push calcium first(먼저) — 형용사·부사 둘을 함께 담음
- kind: word
  id: w-tell
  fields:
  - ko
  why: 알리다가 notify·call과 같아 정답이 여럿 — tell은 입으로 전해 주는 말
- kind: word
  id: w-tight
  fields:
  - ko
  why: w-rigid(뻣뻣한)와 ko가 같아 정답이 둘 — tight는 꽉 조여 열리지 않는 쪽
- kind: word
  id: w-prep
  fields:
  - ko
  why: w-prepare(준비하다)와 ko가 같아 정답이 둘
- kind: word
  id: w-rigid
  fields:
  - ko
  why: w-tight와 ko(뻣뻣한)가 같아 정답이 둘 — rigid는 굳어 경직된 쪽
- kind: word
  id: w-colored
  fields:
  - ko
  why: w-color(색깔)와 거의 같아 정답이 겹침 — colored는 ~색을 띤
- kind: word
  id: w-respond
  fields:
  - ko
  why: w-react(반응하다)와 ko가 같아 정답이 둘 — respond는 치료에 대한 반응
