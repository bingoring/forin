# 상황 16~20.
16:
  s:
    - {tag: "역할 분담", icon: pill, why: "All hands는 모두가 손을 보탠다는 관용구이고, 뒤의 -ing는 지금 진행 중인 일을 간결하게 말하는 모양이에요. reconstituting은 가루 약에 멸균수를 섞어 주사할 수 있는 액으로 만드는 일이에요.", decoy: "upstairs", d: ["마취팀만 손을 보태 지금 단트롤렌을 재구성합니다.", "간호사만 손을 보태 지금 단트롤렌을 재구성합니다."], a: "reconstituting", o: ["counting", "labeling", "ordering"]}
    - {tag: "용량 원칙", icon: board, why: "dose는 여기서 명사가 아니라 동사로, 약을 얼마나 줄지 정해서 준다는 뜻이에요. by weight는 정해진 숫자가 아니라 환자 체중에 맞춘다는 기준이라, 실제 용량은 처방과 프로토콜 카드를 따라요.", decoy: "in silence", d: ["체중에 따라 투여하고 필요하면 공유합니다.", "체중에 따라 투여하고 필요하면 보고합니다."], a: "repeat", o: ["rest", "relax", "retire"]}
    - {tag: "계속 지시", icon: pill, why: "Keep + -ing 명령은 멈추지 말고 이어서 하라는 뜻이에요. a lot of는 많은 수량을 말하는 표현이라 한 병으로 끝나지 않는다는 이유를 알려요.", decoy: "of boxes", d: ["계속 섞어 주세요 — 장갑이 많이 필요할 거예요.", "계속 섞어 주세요 — 주사기가 많이 필요할 거예요."], a: "mixing", o: ["sorting", "counting", "wrapping"]}
    - {tag: "역할 분담", icon: pill, why: "while이 두 사람이 동시에 하는 일을 이어 주어 한 사람은 주입하고 한 사람은 다음 병을 준비하는 흐름이 돼요. next vial은 쉬는 틈 없이 약이 끊기지 않게 이어서 준비한다는 뜻이에요.", decoy: "hold this one", d: ["당신이 이걸 주입하는 동안 다음 바이알을 세어 둘게요.", "당신이 이걸 주입하는 동안 빈 바이알을 치울게요."], a: "next", o: ["last", "first", "empty"]}
    - {tag: "반복 투여", icon: pill, why: "keep + -ing가 dosing과 repeating 두 동사를 함께 이끌어 멈추지 않고 이어 간다는 뜻이에요. until he responds는 정해진 횟수가 아니라 환자의 반응이 기준이라는 말이에요.", decoy: "with a nurse", d: ["반응할 때까지 계속 투여하고 알릴게요.", "반응할 때까지 계속 투여하고 기록할게요."], a: "repeating", o: ["labeling", "wrapping", "signing"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "단트롤렌 혼합·투여 4문장 순서"
    why: "모두가 혼합을 시작하고, the first vial이 섞여야 주입할 수 있으며, that one은 앞 줄에서 주입하는 병을 가리켜 다음 병을 섞는 분담을 말하고, that cycle은 그 반복을 가리켜 환자가 반응할 때까지 이어 간다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      - {en: "All hands on dantrolene — start mixing now.", icon: pill, ko: "모두 단트롤렌에 손을 보태 지금 섞기 시작해요", note: "시작"}
      - {en: "As soon as the first vial is mixed, push it.", icon: pill, ko: "첫 바이알이 섞이는 대로 주입하세요", note: "주입"}
      - {en: "I'll mix the next vial while you push that one.", icon: board, ko: "당신이 그걸 주입하는 동안 다음 바이알을 섞을게요", note: "분담"}
      - {en: "We'll keep that cycle going until he responds.", icon: shield, ko: "그 순환을 반응할 때까지 계속할게요", note: "반복"}
17:
  s:
    - {tag: "냉각 시작", icon: shield, why: "명령문 Start 뒤에 두 가지를 and로 이어 안에서와 밖에서 동시에 식히라는 뜻이에요. surface cooling은 몸 겉면에서 열을 빼는 방법이라 정맥으로 들어가는 찬 수액과 서로 보완돼요.", decoy: "and bed rest", d: ["찬 정맥 수액과 표면 체온 기록을 시작하세요.", "찬 정맥 수액과 표면 소독을 시작하세요."], a: "surface", o: ["central", "internal", "deep"]}
    - {tag: "냉각 부위", icon: shield, why: "명사만 나열하고 to로 어디에 대는지 말하는 짧은 지시문이에요. groin과 axillae는 큰 혈관이 피부 가까이 지나는 곳이라 얼음이 열을 빨리 빼앗아요.", decoy: "in the box", d: ["서혜부와 겨드랑이 얼음팩을 확인하세요.", "서혜부와 겨드랑이 얼음팩을 세어 주세요."], a: "packs", o: ["pillows", "gloves", "trays"]}
    - {tag: "냉각 중단", icon: monitor, why: "Stop + -ing는 하던 일을 그만두라는 뜻이에요(to + 동사원형이 오면 하려고 멈춘다는 뜻이라 달라요). before we overshoot는 목표 체온을 지나쳐 너무 내려가기 전에라는 뜻이에요.", decoy: "at the door", d: ["과냉각되기 전에 체온을 확인하세요.", "과냉각되기 전에 시간을 기록하세요."], a: "cooling", o: ["labeling", "counting", "mixing"]}
    - {tag: "냉각 시행", icon: shield, why: "pack A to B는 A를 B에 빈틈없이 채워 댄다는 동사 모양이에요. Let's로 시작해 지시가 아니라 함께 하자는 말투이면서 right now로 미루지 않는다는 뜻을 더해요.", decoy: "for the nurse", d: ["지금 바로 서혜부와 겨드랑이 얼음을 세어 봅시다.", "지금 바로 서혜부와 겨드랑이 얼음팩을 확인해 봅시다."], a: "ice", o: ["gauze", "tape", "foam"]}
    - {tag: "감시 지시", icon: monitor, why: "so 뒤에 절이 오면 앞의 행동의 목적을 나타내요. closely는 수치를 가끔 보는 게 아니라 눈을 떼지 말라는 뜻으로, 멈출 순간을 놓치지 않기 위한 거예요.", decoy: "from the door", d: ["과냉각 전에 보고할 수 있게 체온을 면밀히 지켜보세요.", "과냉각 전에 기록할 수 있게 체온을 면밀히 지켜보세요."], a: "closely", o: ["quietly", "lazily", "loosely"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "급속 냉각 4문장 순서"
    why: "냉각을 시작하고, that으로 그 냉각을 가속하며, all of that으로 앞의 모든 냉각을 받아 체온을 지켜보고, the temp로 그 체온이 목표에 닿으면 멈춘다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      - {en: "Start cold IV saline and surface cooling.", icon: shield, ko: "찬 정맥 수액과 표면 냉각을 시작하세요", note: "시작"}
      - {en: "Pack ice to the groin and axillae to speed that up.", icon: shield, ko: "그걸 빠르게 하려고 서혜부와 겨드랑이에 얼음을 대세요", note: "가속"}
      - {en: "With all of that going, watch the temp closely.", icon: monitor, ko: "그 모두가 진행되는 동안 체온을 면밀히 지켜보세요", note: "감시"}
      - {en: "When the temp reaches the target, we stop cooling.", icon: check, ko: "체온이 목표에 닿으면 식히기를 멈춰요", note: "중단"}
18:
  s:
    - {tag: "위험 보고", icon: siren, why: "critically는 high를 꾸며 위험한 수준이라는 뜻의 부사라 단순히 높다보다 급하다는 신호예요. Potassium is …처럼 짧게 결과만 말하면 바쁜 위기에서 팀이 바로 알아들어요.", decoy: "still pending", d: ["혈당 수치가 위중하게 높아요.", "나트륨 수치가 위중하게 높아요."], a: "critically", o: ["recently", "randomly", "rarely"]}
    - {tag: "약물 열거", icon: pill, why: "per protocol은 개인 판단이 아니라 정해진 프로토콜의 용량과 순서를 따른다는 뜻이에요. 약 이름만 부르는 것은 구두 지시에서 쓰는 짧은 형식이라 용량은 프로토콜 카드를 따라요.", decoy: "per bottle", d: ["칼슘, 포도당을 곁들인 인슐린, 그리고 프로토콜 카드 확인이요.", "칼슘, 포도당을 곁들인 인슐린, 그리고 프로토콜에 따른 혈액가스요."], a: "per", o: ["near", "after", "behind"]}
    - {tag: "감시 지시", icon: monitor, why: "Watch A for B는 A를 보면서 B가 나타나는지 찾으라는 모양이에요. rhythm changes는 고칼륨혈증이 심장에 영향을 줄 때 모니터에 드러나는 신호라 계속 봐야 해요.", decoy: "for paper jams", d: ["혈압 변화가 있는지 모니터를 지켜보세요.", "리듬 변화가 있는지 약병을 지켜보세요."], a: "monitor", o: ["pump", "cuff", "probe"]}
    - {tag: "약물 순서", icon: pill, why: "to protect the heart는 to + 동사원형으로 목적을 말해 왜 먼저인지 설명해요. first가 순서를 정해서 칼슘이 고칼륨의 심장 영향을 막는 첫 단계로 놓인다는 뜻이에요.", decoy: "to help the team", d: ["시간을 아끼려면 먼저 칼슘을 주입합시다.", "기록을 남기려면 먼저 칼슘을 주입합시다."], a: "heart", o: ["lungs", "liver", "kidneys"]}
    - {tag: "반복 계획", icon: shield, why: "keeps changing은 keep + -ing로 한 번 바뀌고 끝나는 게 아니라 계속 바뀐다는 뜻이에요. repeat the protocol은 약을 임의로 다시 쓰는 게 아니라 정해진 절차를 다시 따른다는 말이에요.", decoy: "the report", d: ["혈압이 계속 바뀌면 프로토콜을 반복합니다.", "리듬이 계속 바뀌면 프로토콜을 확인합니다."], a: "repeat", o: ["read", "copy", "sign"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "고칼륨 부정맥 대응 4문장 순서"
    why: "위험한 수치를 먼저 말하고, Because of that으로 그 수치를 이유로 심장 보호가 목적인 칼슘을 먼저 주입하며, The rest로 칼슘 말고 남은 약을 말하고, all of that으로 앞 처치 전체 뒤에도 리듬이 계속 바뀌면 반복한다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      - {en: "Potassium is critically high.", icon: siren, ko: "칼륨 수치가 위중하게 높아요", note: "수치"}
      - {en: "Because of that, let's push calcium first to protect the heart.", icon: pill, ko: "그래서 심장을 보호하려고 칼슘부터 주입합시다", note: "첫 약"}
      - {en: "The rest, insulin with glucose and bicarb, follows per protocol.", icon: board, ko: "나머지, 인슐린과 포도당 그리고 중탄산염은 프로토콜대로 해요", note: "나머지"}
      - {en: "If the rhythm keeps changing after all of that, we repeat the protocol.", icon: shield, ko: "그 뒤에도 리듬이 계속 바뀌면 프로토콜을 반복해요", note: "반복"}
19:
  s:
    - {tag: "결과 보고", icon: lab, why: "on the gas는 혈액가스 검사 결과를 근거로 한다는 말이라 환자의 느낌이 아니라 수치에서 나온 판단이에요. severe는 acidosis의 정도를 말하는 형용사로 다음 처치가 필요하다는 신호예요.", decoy: "on the wall", d: ["소변검사에서 산증이 심각해요.", "혈액가스에서 탈수가 심각해요."], a: "gas", o: ["scan", "film", "strip"]}
    - {tag: "처치 지시", icon: pill, why: "명령문 두 개를 and로 이어 환기와 약물이라는 두 처치를 함께 시키는 모양이에요. per protocol은 용량과 방법을 개인 판단이 아니라 정해진 절차에 맞춘다는 뜻이에요.", decoy: "per request", d: ["환기를 확인하고 프로토콜에 따라 기록해 주세요.", "과호흡을 확인하고 프로토콜에 따라 서명해 주세요."], a: "per", o: ["near", "past", "after"]}
    - {tag: "재검 계획", icon: lab, why: "re-가 붙은 resample은 같은 검사를 다시 한다는 뜻이라 처음 결과와 비교할 수 있어요. after treatment는 처치가 효과가 있었는지 확인하는 시점을 정해 줘요.", decoy: "after lunch", d: ["치료 후에 혈액가스를 설명합시다.", "치료 후에 결과를 공유합시다."], a: "resample", o: ["relabel", "reprint", "rename"]}
    - {tag: "지난 결과", icon: chartup, why: "was getting worse는 과거진행형이라 그 검사를 했을 때 이미 나빠지던 중이었다는 뜻이에요. The last gas로 어느 검사인지 못 박아 지금 값과 비교할 수 있게 해요.", decoy: "the infection", d: ["지난 혈액가스에서는 감염이 더 나빠지고 있었어요.", "지난 소변검사에서는 산증이 더 나빠지고 있었어요."], a: "showed", o: ["hid", "broke", "sold"]}
    - {tag: "반복 검사", icon: lab, why: "keep + -ing로 한 번에 끝내지 않고 계속한다는 뜻이에요. until the numbers look better는 횟수가 아니라 결과가 기준이라, 좋아질 때까지 이어 간다는 뜻이에요.", decoy: "with a nurse", d: ["수치가 나아질 때까지 계속 확인할게요.", "수치가 나아질 때까지 계속 설명할게요."], a: "resampling", o: ["relabeling", "reprinting", "renaming"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "대사성 산증 교정 4문장 순서"
    why: "결과를 먼저 말하고, 그 결과에 대한 처치를 지시하고, after treatment로 처치가 끝난 시점에 재검을 계획하며, that으로 재검을 가리켜 수치가 좋아질 때까지 반복한다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      - {en: "The acidosis is severe on the gas.", icon: lab, ko: "혈액가스에서 산증이 심각해요", note: "결과"}
      - {en: "Hyperventilate and give bicarbonate per protocol.", icon: pill, ko: "과호흡시키고 프로토콜에 따라 중탄산염을 주세요", note: "처치"}
      - {en: "Let's resample the gas after treatment.", icon: lab, ko: "치료 후에 혈액가스를 재채취합시다", note: "재검"}
      - {en: "We'll keep doing that until the numbers look better.", icon: chartup, ko: "수치가 나아질 때까지 그걸 계속할게요", note: "반복"}
20:
  s:
    - {tag: "상태 보고", icon: monitor, why: "but으로 좋아지는 소식과 계속 필요한 일을 한 문장에 나란히 놓아 아직 끝이 아니라는 점을 분명히 해요. ICU-level monitoring은 병동이 아니라 중환자실에서 하는 수준의 감시라는 뜻이에요.", decoy: "extra snacks", d: ["안정화되고 있지만 중환자실 수준의 장비가 필요해요.", "안정화되고 있지만 중환자실 수준의 인력이 필요해요."], a: "stabilizing", o: ["waking", "moving", "drifting"]}
    - {tag: "인수인계", icon: speech, why: "give A B 모양은 ICU를 받는 사람으로 먼저 말하고 handoff를 건네는 물건처럼 말해요. full은 일부가 아니라 MH 경과 전체를 빠짐없이 넘긴다는 뜻이에요.", decoy: "a free", d: ["약국에 완전한 MH 인수인계를 합시다.", "병동에 완전한 MH 인수인계를 합시다."], a: "full", o: ["free", "loud", "new"]}
    - {tag: "지속 지시", icon: pill, why: "Continue와 watch를 and로 이어 하던 치료를 이어 가는 일과 지켜보는 일을 함께 시켜요. recrudescence는 한동안 가라앉았던 증상이 다시 심해지는 현상을 가리키는 의학 용어예요.", decoy: "for visitors", d: ["단트롤렌을 계속하고 방문객이 있는지 지켜보세요.", "단트롤렌을 계속하고 소음이 있는지 지켜보세요."], a: "watch", o: ["wait", "hope", "search"]}
    - {tag: "경과 설명", icon: speech, why: "walk A through B는 A에게 B를 차근차근 짚어 준다는 구동사예요. everything that happened라고 해야 약과 시간, 변화까지 전체 경과를 빠짐없이 넘기겠다는 뜻이 돼요.", decoy: "to the door", d: ["일어난 모든 일을 외과 팀에 설명해 줄게요.", "일어난 모든 일을 중환자실 팀에 정리해 줄게요."], a: "walk", o: ["drive", "carry", "push"]}
    - {tag: "지속 안내", icon: pill, why: "but으로 좋아졌다는 소식 뒤에 계속하는 치료를 붙여 안심만 하지 않게 해요. keep … running은 약을 끊지 않고 계속 들어가게 둔다는 모양이라 안정됐다고 바로 멈추지 않는다는 뜻이에요.", decoy: "in the hall", d: ["지금은 더 안정됐지만 병동에서도 단트롤렌을 계속 투여할 거예요.", "지금은 더 안정됐지만 수술실에서도 단트롤렌을 계속 투여할 거예요."], a: "stable", o: ["awake", "calm", "quiet"]}
