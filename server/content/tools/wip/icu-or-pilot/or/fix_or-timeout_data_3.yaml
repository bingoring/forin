remove_words: [w-patient, w-name, w-nurse, w-know, w-time, w-hour, w-go, w-give, w-use, w-take, w-new, w-long, w-stay, w-other, w-put, w-down]

# 단어 패치(set은 필드 덮어쓰기)
words:
  - {id: w-circulating, set: {ko: "순환하는", distractorsKo: ["소독하는", "멸균된"]}}
  - id: w-type
    set:
      ko: "혈액형 검사"
      distractorsKo: ["혈액량 검사", "혈당 검사"]
      cue: "수혈 전 ABO·Rh를 정하는 일 — 'and cross'와 한 쌍"
  - {id: w-double, set: {ko: "이중의(두 번)", distractorsKo: ["단일의(한 번)", "마지막의(끝)"]}}
  - id: w-vital
    set:
      en: vitals
      ipa: "/ˈvaɪtəlz/"
      cue: "맥박·혈압·호흡·체온처럼 생명을 가늠하는 가장 기본적인 신호 (명사, 늘 복수)"
      chips: [[vi, tals]]
      distractorsEn: [vials, visuals]
  - id: w-hold
    set:
      example: "Can we hold the incision until they're given?"
      exKo: "투여될 때까지 절개를 보류할 수 있을까요?"
  - {id: w-confirm, set: {distractorsKo: ["생략하다", "거절하다"]}}
  - {id: w-special, rep: {distractorsEn: {specific: spacious}}}
  - {id: w-chart, rep: {distractorsKo: {"기록지 양식": "처방전"}}}
  - id: w-sponge
    rep: {distractorsKo: {"(수술용) 솜뭉치": "(수술용) 봉합사"}}
    set: {cue: "피를 닦고 누르는 흰 천 — 봉합 전에 개수를 센다"}
  - {id: w-timer, set: {chips: [[tim, er]], decoyChips: [tam, or]}}
  - id: w-stabilize
    set:
      cue: "혈압이 갑자기 떨어진 환자를 수액·승압제로 더 나빠지지 않게 붙잡아 두는 일 (동사)"
    rep: {distractorsEn: {stabilizer: sterilize}}
  - {id: w-procedure, rep: {distractorsEn: {proceed: process}}}
  - {id: w-proceed, rep: {distractorsEn: {procedure: progress}}}
  - {id: w-right, rep: {distractorsEn: {write: tight}}, add_decoy: [write]}
  - {id: w-knee, rep: {distractorsEn: {need: knot}}}
  - {id: w-agree, rep: {distractorsEn: {agent: disagree}}}
  - {id: w-correct, rep: {distractorsEn: {collect: corrupt}}}
  - {id: w-imaging, rep: {distractorsEn: {imagine: imagery}}, add_decoy: [imagine]}
  - {id: w-anticipate, rep: {distractorsEn: {anticipation: articulate}}}
  - {id: w-significant, rep: {distractorsEn: {signature: magnificent}}}
  - {id: w-open, rep: {distractorsEn: {oven: opaque, often: even}}}
  - {id: w-due, rep: {distractorsEn: {dew: dual, duty: dull}}}
  - {id: w-miss, rep: {distractorsEn: {mass: mix, mist: mess}}}
  - {id: w-second, rep: {distractorsEn: {sacred: section, secure: segment}}}
  - {id: w-aware, rep: {distractorsEn: {ware: awake, away: wary}}}
  - {id: w-continue, rep: {distractorsEn: {continuous: contribute}}}
  - {id: w-voice, rep: {distractorsEn: {vice: void, choice: vouch}}}
  - {id: w-quick, rep: {distractorsEn: {quite: slick}}}
  - {id: w-quiet, rep: {distractorsEn: {quit: quaint}}}
  - {id: w-fully, rep: {distractorsEn: {fuel: freely}}}
  - {id: w-size, rep: {distractorsEn: {seize: side}}}
  - {id: w-close, rep: {distractorsEn: {clause: cause}}}
  - {id: w-loss, rep: {distractorsEn: {loose: lapse}}}
  - {id: w-blood, rep: {distractorsEn: {bleed: blot}}}
  - {id: w-participate, rep: {distractorsEn: {partition: precipitate}}}
  - {id: w-hold, rep: {distractorsEn: {hole: hoard}}}

# 뉘앙스 패치: s=상황, kind=종류, n=그 종류의 몇 번째(0부터, 기본 0)
nuance:
  - {s: 8, kind: pair, set: {words: [w-type, w-cross, w-access, w-unit]}}
  - s: 0
    kind: pair
    set_pair: {idx: 0, value: [mark, "the site with a skin marker"]}
    set:
      why: "수술 부위는 mark the site with a skin marker(집도의가 피부에 펜으로 직접 표시), 동의는 obtain informed consent(환자가 위험과 이득을 듣고 받아들인 뒤 서명), 신원은 이름과 생년월일을 직접 말하게 해서(state) 확인해요. 환자 팔찌만 보고 넘어가지 않아요."
  - s: 5
    kind: pair
    set:
      pairs: [[count, "the sponges"], [label, "with two identifiers"], [send, "to pathology"]]
      why: "닫기 전에 거즈(sponge)를 세고, 검체는 식별자 두 개(이름과 생년월일 등)로 라벨을 붙인 다음 병리과로 보내요. 거즈·날카로운 물품·기구 계수는 절개를 닫기 시작하기 전에 맞는지 확인하는 것이 원칙이에요."
      words: [w-count, w-sponge, w-label, w-send]
  - s: 7
    kind: pair
    set:
      why: "영상 필름의 좌우 표기(labeled left)가 수술 계획과 몸에 표시한 부위(the marked site)와 맞는지 보고, 드레이프(drape)를 덮기 전에 확인해요. 드레이프를 덮으면 몸 전체의 좌우를 한눈에 보기 어려워서 그 전에 맞춰 봐요. 부위 표시는 덮은 뒤에도 보여야 해요."
  - s: 14
    kind: pair
    set_pair: {idx: 2, value: [label, "with two patient identifiers"]}
    set:
      why: "냉동절편(frozen section)은 고정하지 않은 신선한 조직을 바로 병리과에 보내고, 영구 표본(permanent section)은 포르말린에 담가 고정해요. 라벨에는 이름과 생년월일처럼 식별자 두 개를 적고, 검체 부위도 함께 적어요."
  - s: 5
    kind: context
    scene: {idx: 1, en: "Final counts correct, verified by scrub and circulator."}
  - s: 18
    kind: swap
    set:
      options: ["I might be wrong, but", "stop right now —", "you always do this —"]
      answer: "stop right now —"
      notes:
        "stop right now —": "짧고 직접적인 명령이라 즉시 행동이 멈춘다. 사람을 탓하지 않고 사실만 말한다."
        "I might be wrong, but": "시간이 없을 때는 망설이는 말이 몇 초를 잡아먹는다. 상대도 '아니겠지' 하고 계속할 수 있다."
        "you always do this —": "사실이 아닌 비난이라 방어를 부르고, 지금 필요한 행동을 늦춘다."
  # --- context 핸드오프 모양 정비 ---
  - s: 1
    kind: context
    scene: {idx: 2, en: "Hang on — we're calling a time-out."}
    set:
      why: "time-out은 팀과 기록에서는 정식 절차 이름이지만, 환자에게는 '경기 중단'처럼 들려 무슨 문제가 생긴 줄 알 수 있어요. 무엇을 확인하는지 풀어 말해요."
  - s: 2
    kind: context
    scene: {idx: 2, en: "Do you agree it's your right knee?", fix: "Can you tell me which knee we're operating on today?"}
    set:
      why: "팀끼리는 agree로 각자의 동의를 받지만, 긴장한 환자에게 예/아니요로 물으면 그냥 '네' 하기 쉬워요. 환자 확인은 직접 말하게 하는 열린 질문으로 해요."
  - s: 4
    kind: context
    scene: {idx: 2, en: "Your antibiotic administration has been documented."}
    set:
      why: "기록에 남겼다는 보고는 팀 안의 말이에요. 환자에게는 무엇을 왜 했는지가 필요해요."
  - s: 7
    kind: context
    set:
      word: imaging
      ko: "영상"
      words: [w-imaging]
      why: "imaging은 X선·MRI를 통틀어 부르는 의료진 말이라, 환자에게는 엑스레이처럼 구체적으로 말해요."
    scenes_en: ["Let's verify the imaging matches the marked side.", "Imaging reviewed: left knee, matches site marking.", "We're checking your imaging against the mark."]
  - s: 9
    kind: context
    scene: {idx: 2, en: "Your implant is open on the back table."}
    set:
      why: "implant가 개봉됐는지는 팀의 확인 사항이에요. 환자에게는 '열려 있다'가 무슨 뜻인지 모르고 걱정만 줘요."
  - s: 12
    kind: context
    scene: {idx: 2, en: "You will participate in this time-out — no exceptions.", fix: "We'd like you to participate too — if anything looks off, please speak up."}
  - s: 13
    kind: context
    scene: {idx: 2, en: "Change of plan — we're adding a meniscus repair."}
    set:
      why: "팀끼리는 짧게 '변경'만 말해도 되지만, 깨어 있는 환자에게 설명 없이 던지면 놀라요. 왜 멈추고 다시 확인하는지 함께 말해요."
  - s: 15
    kind: context
    scene: {idx: 2, en: "There's a discrepancy in your paperwork."}
    set:
      why: "discrepancy는 팀과 기록에서 쓰는 정확한 말이에요. 환자에게는 서류 문제처럼 불안하게 들려요. 환자가 직접 답할 수 있게 어느 무릎인지 묻는 것이 확인도 되고 쉬워요."
  - s: 16
    kind: context
    set:
      word: critical
      ko: "중대한"
      words: [w-critical]
      why: "critical은 팀끼리는 '핵심'이지만 환자에게는 '위독하다'로 들려요."
    scenes_en: ["Give me ten seconds for the critical checks.", "Abbreviated time-out: critical items confirmed.", "We're only doing the critical checks on you."]
  - s: 20
    kind: context
    set:
      word: vitals
      ko: "활력징후"
      words: [w-vital]
      why: "vitals는 팀끼리의 줄임말이라, 가족에게는 무엇이 어떻게 바뀌었고 무엇을 하는지 말해요."
    scenes_en: ["His vitals just changed — let's hold the incision.", "Vitals unstable after time-out; incision held.", "His vitals changed, so we're holding."]
  - s: 13
    kind: slider
    append_why: " 추가하는 시술이 동의서에 들어 있는지도 함께 확인해요."
  - s: 15
    kind: slider
    scale_idx: {idx: 2, value: "Nobody touches anything — I'm calling the charge nurse."}

# order 패치: line은 1부터
order:
  - {s: 5, line: 3, set: {en: "That covers the counts — the specimen is labeled and ready to send."}}
  - {s: 7, line: 3, set: {en: "So both say right — does everyone agree?", ko: "둘 다 오른쪽이니, 모두 동의하시나요?"}}
  - {s: 10, line: 3, set: {en: "With everyone aware, please confirm we're using latex-free supplies.", ko: "모두 알고 있으니, 라텍스 없는 물품인지 확인해 주세요"}}
  - s: 12
    swap_lines: [2, 3]
    line: 2
    set: {en: "It only takes thirty seconds.", ko: "삼십 초면 돼요"}
    order_set: {why: "멈춰 달라고 청하고, 부담이 작다고 설득한 뒤, 하지만 모두 참여해야 효과가 있다고 이유를 대고 감사해요."}
  - {s: 12, line: 3, set: {en: "But it only works if we all participate.", ko: "하지만 모두 참여해야만 효과가 있어요"}}
  - {s: 14, line: 3, set: {en: "Once that's sorted, I'll label each one right away.", ko: "정리되면 각각 바로 라벨을 붙일게요"}}
  - {s: 15, line: 2, set: {en: "It's the marked side — it doesn't match the consent.", ko: "표시된 쪽이 동의서와 맞지 않습니다"}}
  - {s: 15, line: 4, set: {en: "Until we've done that, nothing proceeds.", ko: "그때까지는 아무것도 진행하지 않아요"}}
  - {s: 17, line: 2, set: {en: "So I need to voice a concern before we go further.", ko: "그래서 더 나아가기 전에 우려를 말씀드려야겠어요"}}
  - {s: 19, line: 3, set: {en: "Yes — I'm drawing it up right now, thirty seconds.", ko: "네 — 지금 바로 준비 중이에요, 삼십 초면 돼요"}}
  - {s: 20, line: 3, set: {en: "While we hold, give me a moment to reassess with anesthesia.", ko: "보류하는 동안 마취과와 재평가할 시간을 주세요"}}
  - {s: 5, line: 4, set: {ko: "다 끝났으니 회복 관리를 위한 장비 우려가 있나요?"}}
  - {s: 8, line: 2, set: {ko: "그래서 혈액형·교차 검사는 끝났고 혈액 팩은 확보돼 있습니다"}}
  - s: 13
    line: 4
    set: {ko: "감사합니다 — 계속하기 전에 그것에 다 같이 생각이 맞았으면 해요"}
    order_set: {why: "변경을 알리고, 그래서 새 타임아웃이 필요하다고 하고, 새 내용을 확인시키고, 다 같이 생각이 맞는지 점검해요."}
