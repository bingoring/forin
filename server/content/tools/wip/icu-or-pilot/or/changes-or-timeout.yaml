theme: or-timeout
changes:
- kind: word
  id: w-start
  fields:
  - ko
  why: w-begin과 ko(시작하다)가 같아 정답이 둘 — start는 수술·타임아웃에 들어가는 착수
- kind: word
  id: w-note
  fields:
  - ko
  why: w-document와 ko(기록하다)가 같아 정답이 둘 — note는 시각 등을 적어 두는 기재
- kind: word
  id: w-check
  fields:
  - ko
  why: w-confirm과 ko(확인하다)가 같아 듣고 뜻 고르기에서 정답이 둘 — check는 눈으로 살펴 점검하는 쪽
- kind: word
  id: w-run
  fields:
  - ko
  why: w-proceed(진행하다)와 겹치고, 태그 문장은 the case runs longer — 수술이 예정보다 이어진다는 뜻
- kind: word
  id: w-align
  fields:
  - ko
  why: w-match(일치하다)와 ko(일치시키다)가 겹친다 — align은 팀원의 이해·계획을 한 방향으로 맞추는 쪽
