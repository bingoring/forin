- title: MH 가족력 선별
  sentences:
  - en: Has any family member reacted badly to anesthesia?
    ko: 가족 중 누군가 마취에 나쁘게 반응한 적이 있나요?
    chunks:
    - Has any family member
    - reacted badly
    - to anesthesia
    - '?'
    words:
    - w-member
    - w-react
    - w-anesthesia
    goal: 1
  - en: This helps us screen for malignant hyperthermia risk.
    ko: 이건 악성 고열 위험을 선별하는 데 도움이 됩니다.
    chunks:
    - This helps us
    - screen for
    - malignant hyperthermia risk
    - .
    words:
    - w-screen
    - w-mhfull
    - w-risk
    goal: 1
  - en: Any high fevers or muscle problems under anesthesia?
    ko: 마취 중에 고열이나 근육 문제가 있었나요?
    chunks:
    - Any high fevers
    - or muscle problems
    - under anesthesia
    - '?'
    words:
    - w-fever
    - w-muscle
    - w-anesthesia
    goal: 1
  - en: I need to ask about your family's medical history before surgery.
    ko: 수술 전에 가족 병력을 여쭤봐야 해요.
    chunks:
    - I need to ask
    - about your family's
    - medical history
    - before surgery
    - .
    words:
    - w-history
    - w-surgery
    goal: 1
  - en: I'll notify the anesthesia team if there's a positive family history.
    ko: 가족력이 있으면 마취팀에 알릴게요.
    chunks:
    - I'll notify
    - the anesthesia team
    - if there's
    - a positive family history
    - .
    words:
    - w-notify
    - w-team
    - w-anesthesia
    - w-history
    goal: 2
  nuance:
  - kind: slider
    words:
    - w-history
    - w-notify
    - w-team
    - w-react
    cue: 'Patient: "My cousin got really hot during an operation once, but nobody ever told us what it was."'
    scale:
    - That's probably nothing — we don't need to mention it.
    - Thank you — I'll note that and tell the anesthesia team.
    - Then you definitely have malignant hyperthermia.
    answerAt: 1
    why: 정확한 병명을 몰라도 가족이 마취 중 심한 고열을 겪었다면 가족력 양성 가능성으로 보고 마취팀에 알려요. '별일 아니에요'로 넘기지도, 검사 없이 '당신은 MH예요'라고 단정하지도 않아요.
    example: Thank you — I'll note that and tell the anesthesia team.
    exKo: 알려 주셔서 감사합니다 — 기록해 두고 마취팀에 알릴게요.
  - kind: context
    words:
    - w-history
    word: history
    ko: 병력
    scenes:
    - who: 간호사 → 마취과
      icon: speech
      en: Positive family history of MH — her brother had a reaction under anesthesia.
      ok: true
    - who: 마취 전 차트
      icon: board
      en: 'Family history: father with unexplained high fever during surgery.'
      ok: true
    - who: 불안한 환자에게
      icon: me
      en: Your family history is positive for MH, so you're a high-risk patient.
      ok: false
      fix: Because someone in your family reacted badly to anesthesia, we'll plan yours extra carefully.
    why: history는 의료진끼리와 차트에서는 'positive family history'처럼 짧고 정확하게 써요. 환자에게 같은 표현을 그대로 들려주면 '고위험 환자'라는 말만 남아 겁이 나요. 가족에게 어떤 일이 있었는지, 그래서 무엇을 다르게 하는지를 풀어서 말해요.
