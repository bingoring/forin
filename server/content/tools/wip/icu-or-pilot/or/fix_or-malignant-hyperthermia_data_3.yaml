nuance:
  # ---- slider 정답 위치·길이 편향 + 사실 오류
  - s: 0
    kind: slider
    set:
      scale:
        - "That's probably nothing — we don't need to bring it up."
        - "Thank you — I'll note that and tell the anesthesia team."
        - "Then you definitely have malignant hyperthermia — that's a diagnosis."
  - s: 2
    kind: slider
    set:
      cue: "The anesthesiologist asks, \"Where's the dantrolene?\" You checked the MH cart in this room this morning."
      scale:
        - "I think it's on the MH cart somewhere, but I'm not sure."
        - "It should be on the MH cart by the door, I believe."
        - "It's on the MH cart — I checked it this morning."
      answerAt: 2
  - s: 3
    kind: slider
    set:
      scale:
        - "I'll note it and replace it at next month's check."
        - "I'll replace it now, before the next case."
        - "Cancel all of today's surgeries until the whole cart is restocked."
  - s: 4
    kind: slider
    set:
      cue: "Over the last half hour the core temp has stayed within a tenth of a degree. The EtCO2 and heart rate are steady, and nothing else has changed."
      scale:
        - "Temp is stable — nothing to report."
        - "Temp is trending up slowly — I'm staying on top of it."
        - "Temp is spiking — I'm declaring MH!"
      answerAt: 0
      why: "거의 변하지 않는 체온은 있는 그대로 안정적이라고 보고해요. 오르지 않는데 오르는 중이라고 하면 불필요한 경보가 되고, 다른 징후도 없이 MH를 선언하지는 않아요. 오르는 추세가 보이면 그때 바로 알려요."
      example: "Temp is stable — nothing to report, but I'm still watching it."
      exKo: "체온은 안정적이에요 — 보고할 건 없지만 계속 보고 있어요."
  - s: 5
    kind: slider
    set:
      cue: "The EtCO2 went up one point for a minute, then returned to baseline after anesthesia adjusted the ventilation. Nothing else has changed. You're the nurse watching the monitor."
      scale:
        - "That settled after the vent change — I'll keep watching the trend."
        - "That's an unexplained rise — I'm telling anesthesia right away."
        - "He's definitely in an MH crisis — start the dantrolene!"
      answerAt: 0
      why: "환기를 조정한 뒤 바로 돌아온 한 번의 상승은 원인이 설명된 것이라 추세를 계속 지켜보면 돼요. 원인을 모르는 채 계속 오르면 그때 바로 마취과에 알리고, 마취과가 판단하기 전에 MH를 확정해 약을 달라고 하지는 않아요."
      example: "That settled after the vent change — I'll keep watching the trend closely."
      exKo: "환기 조정 후 가라앉았어요 — 추세를 계속 면밀히 지켜볼게요."
  - s: 6
    kind: slider
    set:
      scale:
        - "Let's say nothing and wait until the temperature starts to go up."
        - "This makes me think early MH — let's alert the team and get the cart ready."
        - "Declare MH yourself and start giving the dantrolene on your own right away."
  - s: 7
    kind: slider
    set:
      words: [w-masseter, w-jaw, w-tight, w-rigid, w-induction]
      cue: "While you assist with intubation, the jaw won't open at all after induction. The other vitals look normal so far."
      scale: ["a little stiff", "tight", "rigid"]
      answerAt: 2
      why: "유도 뒤 턱이 아예 벌어지지 않을 만큼 굳었다면 a little stiff나 tight가 아니라 rigid예요. 가볍게 말하면 MH의 이른 징후가 대수롭지 않게 들려서, 정확한 임상어 rigid로 바로 보고해요. 진단과 단트롤렌 결정은 마취과가 해요."
      example: "His jaw is rigid — I'm reporting it now."
      exKo: "턱이 경직됐어요 — 지금 보고할게요."
  - s: 8
    kind: slider
    set:
      scale:
        - "His heart rate is up a little, but I wouldn't worry about it yet."
        - "His rate jumped about thirty in a few minutes, with ectopy; EtCO2 is up too."
        - "His heart is acting up badly — it's really bad, and I'm very scared!"
  - s: 10
    kind: slider
    set:
      scale:
        - "Don't worry at all — I promise nothing bad is going to happen to you."
        - "We've planned for this — no triggers, and the medicine is ready."
        - "It's a dangerous condition and you could have a life-threatening crisis."
      example: "We've planned for this — no triggers, and the medicine is ready."
      exKo: "미리 계획해 뒀어요 — 유발 약은 쓰지 않고 약은 준비돼 있어요."
  - s: 11
    kind: slider
    set:
      scale:
        - "Off is good enough — nothing's running, so let's go ahead and start."
        - "Off isn't the same as removed — let's remove or disable them per the checklist."
        - "We can't safely do this case at all — let's cancel it and reschedule it."
  - s: 12
    kind: slider
    set:
      scale:
        - "They're down the hall in the supply room — we can fetch them if we need them."
        - "I'll stage cold saline, ice packs, and the blanket within reach in the room."
        - "Let's delay the case until we get a second cooling blanket from storage."
    append_why: " 준비가 끝났는데 수술을 미룰 일도 아니에요."
  - s: 14
    kind: slider
    set:
      scale:
        - "The urine looks a little different, but it's probably nothing to worry about."
        - "Cola-colored urine suggests myoglobinuria — I'm noting output and sending labs."
        - "His kidneys have already failed — this is definitely kidney failure."
  - s: 15
    kind: slider
    set:
      scale:
        - "This could possibly be MH, but I'm really not sure yet."
        - "This looks a lot like MH, so let's keep an eye on it."
        - "This is malignant hyperthermia — I'm declaring it."
      answerAt: 2
      why: "위기 선언은 분명하고 단정적으로 해요. could be와 looks like는 팀이 움직일 신호가 되지 못해요. 마취과가 MH로 판단했다면 'I'm declaring it'처럼 선언하는 말투로 바로 말하고, 곧이어 할 일(카트, 도움 요청)을 붙여요."
  - s: 19
    kind: slider
    set:
      scale:
        - "The gas looks a lot better now — I think we can stop checking it."
        - "It's better but still low — keep treating and resample the gas."
        - "The treatment didn't work at all — let's stop everything we're doing."
      example: "It's better but still low — keep treating and resample the gas."
      exKo: "나아지고 있지만 아직 낮아요 — 치료를 이어 가고 혈액가스를 다시 채취하세요."
  # ---- pair
  - s: 1
    kind: pair
    pair_idx: 2
    pair: ["Tell", "the whole team which drugs we're avoiding"]
    set:
      why: "MH 유발 요인은 휘발성 마취 가스와 석시닐콜린이에요. 피할 약을 정하고(avoid), 기계에서 꺼져 있는지 확인하고(confirm), 어떤 약을 피하는지 시작 전에 팀 전체에 알려(tell) 같은 계획으로 움직여요."
  - s: 17
    kind: pair
    set:
      why: "냉각은 찬 정맥 수액으로 안에서(start cold IV saline), 얼음을 서혜부와 겨드랑이처럼 큰 혈관이 지나는 곳에 대서 겉에서 해요. 목표 체온(병원 프로토콜)에 이르면 능동 냉각을 멈춰요 — 계속하면 저체온으로 넘어가요(stop before we overshoot)."
  - s: 20
    kind: pair
    pair_idx: 2
    pair: ["I'll walk the ICU team", "through everything that happened"]
  # ---- context
  - s: 10
    kind: context
    scene: {idx: 0, en: "Known MH risk for this patient — please plan a trigger-free anesthetic."}
  - s: 11
    kind: context
    scene: {idx: 2, en: "The vaporizers are off the machine and we're running TIVA."}
  - s: 16
    kind: context
    scene: {idx: 2, en: "We've dosed him by weight and are titrating to his response."}
  - s: 17
    kind: context
    scene: {idx: 2, en: "We'll stop active cooling before we overshoot the target."}
  - s: 18
    kind: context
    set:
      words: [w-protocol]
      word: protocol
      ko: 프로토콜
      why: "protocol은 팀 안에서 정해진 순서와 용량을 따른다는 짧은 말이에요. 보호자에게 per protocol이라고만 하면 무엇을 왜 하는지 알 수 없어요. 무엇을 위해 어떻게 하고 있는지를 쉬운 말로 풀어 줘요."
    scenes:
      - {who: "마취과 → 팀", icon: speech, en: "Bicarb per protocol — push calcium first.", ok: true}
      - {who: "위기 기록", icon: board, en: "Hyperkalemia treated per protocol: calcium, insulin with glucose, bicarbonate.", ok: true}
      - {who: "대기실 보호자에게", icon: me, en: "We're managing his hyperkalemia per protocol.", ok: false, fix: "We're following a well-tested plan to bring his blood salts back to normal."}
order:
  - s: 2
    ko: 단트롤렌 재고 점검 4문장 순서
    why: "위치를 먼저 찾아야 그곳의 바이알을 셀 수 있고(there), 센 결과가 부족해야 약국에 요청하며, 마지막 줄은 Whatever we end up with로 그 결과가 어떻든 전부를 유도 전에 손닿게 두자고 닫아요. there와 Whatever we end up with가 앞 줄을 받아 순서가 하나예요."
    lines:
      2: {en: "Count how many vials are on hand there.", ko: "거기에 바이알이 몇 개 있는지 세 보세요"}
      4: {en: "Whatever we end up with, I want all of it accessible before we induce.", ko: "어떻게 되든 그 전부를 유도 전에 손닿게 두고 싶어요"}
  - s: 3
    why: "함께 점검하자고 시작하고, For that으로 그 점검을 위해 바이알을 목록과 맞춰 센 뒤, That count로 센 결과를 받아 부족하면 약국에 요청하고, they로 그 바이알이 오면 채워 넣는다는 순서예요. 각 줄이 앞 줄의 결과를 받아 순서가 하나예요."
    lines:
      2: {en: "For that, count every vial against the list on the card.", ko: "그러려면 카드 목록과 맞춰 바이알을 다 세 봅시다"}
  - s: 5
    why: "지켜보라는 지시가 먼저, That's because로 그 지시의 이유를 설명하고, So로 그 결과 오르면 바로 알리겠다고 약속하고, Every flag I make로 앞에서 말한 표시가 곧장 마취팀에 간다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      2: {en: "That's because an unexplained rise can be the first MH sign.", ko: "원인 불명의 상승이 첫 MH 징후일 수 있기 때문이에요"}
      4: {en: "Every flag I make goes straight to anesthesia.", ko: "제가 표시한 건 전부 곧장 마취팀에 가요"}
  - s: 10
    why: "이유를 먼저 말하고, That is why로 그 이유의 결과인 준비를 알리며, With that plan으로 그 계획을 가리켜 팀 전체가 준비돼 안심해도 된다고 말한 뒤, all of that으로 앞 말 전체가 도움이 됐는지 환자에게 확인해요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      3: {en: "With that plan, our whole team is ready, so you're in safe hands.", ko: "그 계획으로 팀 전체가 준비돼 있으니 안심하셔도 돼요"}
  - s: 12
    lines:
      4: {ko: "그래서 MH로 선언하는 순간 바로 시작할 수 있어요"}
  - s: 18
    lines:
      1: {ko: "칼륨 수치가 위험할 만큼 높아요"}
  - s: 13
    lines:
      1: {ko: "지금 칼륨 수치 검사를 보냅시다"}
  - s: 15
    why: "먼저 선언하고, Because of that으로 선언의 첫 결과인 유발 약제 중단을 말하고, While the agents are being stopped로 중단과 동시에 하는 카트·도움 요청을 이어요. 마지막 줄은 that cart로 그 카트를 가리켜 100% 산소와 단트롤렌 혼합을 시작한다고 닫아요. 앞 줄을 가리키는 말 때문에 줄 순서가 하나예요."
    lines:
      3: {en: "While the agents are being stopped, get the MH cart and call for help.", ko: "약제를 멈추는 동안 MH 카트를 가져오고 도움을 요청하세요"}
      4: {en: "Go 100% oxygen at high flow and mix dantrolene from that cart.", ko: "산소를 100% 고유량으로 걸고 그 카트의 단트롤렌을 섞어요", note: 처치}
  - s: 17
    why: "냉각을 시작하고, that으로 그 냉각을 가속하며, Once the ice is on으로 얼음을 댄 뒤에 체온을 지켜보고, the temp로 그 체온이 목표에 이르면 멈춘다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      2: {en: "Pack ice around the groin and axillae to speed that up.", ko: "그걸 빠르게 하려고 서혜부와 겨드랑이에 얼음을 대세요"}
      3: {en: "Once the ice is on, watch the temp closely.", ko: "얼음을 대고 나면 체온을 면밀히 지켜보세요"}
  - s: 19
    why: "결과를 먼저 말하고, For that으로 그 결과에 대한 처치를 지시하고, after treatment로 처치가 끝난 시점에 재검을 계획하며, that으로 재검을 가리켜 수치가 좋아질 때까지 반복한다고 닫아요. 각 줄이 앞 줄을 받아 순서가 하나예요."
    lines:
      2: {en: "For that, hyperventilate and give bicarbonate per protocol.", ko: "그러려면 과호흡시키고 프로토콜에 따라 중탄산염을 주세요"}
