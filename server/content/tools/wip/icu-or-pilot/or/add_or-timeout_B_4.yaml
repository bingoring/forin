- t: "응급 타임아웃 생략 압박"
  s:
  - {tag: "응급에도 확인", icon: siren, why: "Even in …으로 시작해 압박 속에서도 원칙은 바뀌지 않는다고 먼저 말해요 — 환자와 부위는 가장 짧은 필수 확인이에요.", decoy: "a drill", dko: ["응급 상황이라도 환자와 부위를 소개합시다.", "야간 근무라도 환자와 부위를 확인합시다."], ans: "emergency", wr: [inspection, evening, interview]}
  - {tag: "시간 요청", icon: calendar, why: "Give me + 시간 + for …는 요청을 구체적인 숫자로 줄여요 — 짧고 정확한 시간이 압박 속 설득에 효과적이에요.", decoy: "thirty minutes", dko: ["중대한 확인을 위해 삼십 초만 주세요.", "간단한 보고를 위해 십 초만 주세요."], ans: "critical", wr: [casual, random, optional]}
  - {tag: "핵심 항목", icon: bell, why: "명사 둘 + quick confirm — 동사를 줄인 짧은 말투로, 급할 때 핵심 항목만 부르는 방식이에요.", decoy: "and bed", dko: ["알레르기와 장비 확보 여부 — 빠르게 확인하죠.", "알레르기와 혈액 확보 여부 — 빠르게 정하죠."], ans: "confirm", wr: [skip, hide, delay]}
  - {tag: "핵심 확인", icon: check, why: "we confirm은 현재형으로 '늘 그렇게 한다'는 규칙을 말해요 — quickly는 확인을 줄이는 게 아니라 빠르게 하는 거예요.", decoy: ", we explain", dko: ["응급 상황이라도 중대한 항목은 신속히 전달합니다.", "야간이라도 중대한 항목은 신속히 확인합니다."], ans: "quickly", wr: [loudly, privately, blindly]}
  - {tag: "가치 설득", icon: star, why: "still이 '그래도'를 만들어요 — 시간 압박이 있어도 확인의 가치는 변하지 않는다는 반박이에요.", decoy: "late", dko: ["십 분만 주세요 — 그래도 할 가치가 있습니다.", "십 초만 주세요 — 그래도 할 시간이 있습니다."], ans: "still", wr: [never, hardly, seldom]}
  o:
    tag: "대화 흐름"
    icon: compass
    ko: "응급 타임아웃 생략 압박 4문장 순서"
    why: "응급에도 확인해야 한다고 원칙을 말하고, 짧은 시간을 청하고, 확인할 항목을 짚은 뒤, 빠르게 하자고 요청해요."
    lines:
    - {en: "Even in an emergency, let's confirm patient and site.", icon: siren, ko: "응급이라도 환자와 부위를 확인합시다", note: 원칙}
    - {en: "Give me ten seconds for the critical checks.", icon: calendar, ko: "중대한 확인을 위해 십 초만 주세요", note: 시간}
    - {en: "The critical ones are allergies and blood availability.", icon: bell, ko: "중대한 건 알레르기와 혈액 확보 여부예요", note: 항목}
    - {en: "A quick confirm from everyone, please.", icon: check, ko: "모두 빠르게 확인해 주세요", note: 요청}
- t: "팀 침묵 속 오류 방치"
  s:
  - {tag: "우려 제기", icon: speech, why: "voice a concern은 '우려를 입 밖에 내다'라는 뜻이에요 — I need to로 시작하면 선택이 아니라 의무라는 느낌을 줘요.", decoy: "a compliment", dko: ["더 나아가기 전에 의견을 말씀드려야겠습니다.", "마치기 전에 우려를 말씀드려야겠습니다."], ans: "concern", wr: [joke, song, secret]}
  - {tag: "용기 있는 말", icon: shield, why: "I'd rather A than B로 두 선택을 견줘요 — 틀릴 위험보다 침묵의 위험이 크다는 뜻이라 의견을 낼 때 부담을 낮춰 줘요.", decoy: "than stay late", dko: ["이 일에 조용히 있느니 늦는 게 낫겠어요.", "저 일에 조용히 있느니 틀리는 게 낫겠어요."], ans: "wrong", wr: [late, slow, busy]}
  - {tag: "재확인 제안", icon: redo, why: "Can we …?는 We should보다 열린 제안이에요 — 거절하기 쉬워 보이지만 오히려 협력을 끌어내요.", decoy: "and take notes", dko: ["잠시 앉아서 함께 재확인할 수 있을까요?", "잠시 멈추고 함께 쉴 수 있을까요?"], ans: "pause", wr: [leave, hide, eat]}
  - {tag: "침묵 속 발언", icon: speech, why: "No one else …, but I …로 대비를 만들어요 — 남들이 말하지 않아도 나는 말해야 한다는 책임을 보여 줘요.", decoy: ", while I", dko: ["다른 사람은 일어나지 않았지만, 저는 이걸 말씀드려야겠습니다.", "다른 사람은 말하지 않았지만, 저는 이걸 정리해야겠습니다."], ans: "spoke", wr: [left, slept, stood]}
  - {tag: "재확인", icon: redo, why: "before we proceed로 재확인의 마감 시점을 정해요 — pause and double-check 두 동사로 멈춤 다음 점검 순서를 담아요.", decoy: "and relax", dko: ["퇴근하기 전에 잠시 멈추고 재확인합시다.", "진행하기 전에 잠시 멈추고 사진 찍읍시다."], ans: "proceed", wr: [retire, depart, transfer]}
  o:
    tag: "대화 흐름"
    icon: compass
    ko: "팀 침묵 속 오류 방치 4문장 순서"
    why: "이상함을 느꼈다고 말하고, 우려를 공식적으로 꺼내고, 함께 재확인하자고 제안한 뒤, 들어 준 데 감사해요."
    lines:
    - {en: "I think something's off here.", icon: faceWorried, ko: "여기 뭔가 이상한 것 같아요", note: 감지}
    - {en: "I need to voice a concern before we go further.", icon: speech, ko: "더 나아가기 전에 우려를 말씀드려야겠어요", note: 우려}
    - {en: "Can we pause and double-check together?", icon: redo, ko: "잠시 멈추고 함께 재확인할 수 있을까요?", note: 제안}
    - {en: "Thank you for hearing me out.", icon: star, ko: "끝까지 들어 주셔서 감사합니다", note: 감사}
- t: "wrong-site 임박 차단"
  s:
  - {tag: "즉시 정지", icon: siren, why: "짧은 명령 Stop을 먼저, 이유를 대시 뒤에 말해요 — 시간이 없을 때는 설명보다 정지가 먼저예요.", decoy: "the wrong room", dko: ["멈추세요 — 그건 잘못된 기구입니다.", "멈추세요 — 그건 잘못된 수술실입니다."], ans: "wrong", wr: [sterile, empty, loud]}
  - {tag: "내려놓기", icon: shield, why: "짧은 명령에 please를 붙여 다급해도 무례하지 않게 하고, 이유를 대시 뒤에 이어 말해요.", decoy: "Pass it over", dko: ["내려놔 주세요 — 다시 소독해야 합니다.", "내려놔 주세요 — 다시 세어야 합니다."], ans: "need", wr: [forget, refuse, hope]}
  - {tag: "표시 위치", icon: pushpin, why: "the other side는 '반대쪽'을 가리키는 정해진 말이에요 — 좌우를 말하기 전에 '다른 쪽'이라고 짚어 충돌을 알려요.", decoy: "is near", dko: ["메스는 반대쪽에 있습니다.", "트레이는 반대쪽에 있습니다."], ans: "mark", wr: [tray, light, cord]}
  - {tag: "즉시 정지", icon: scalpel, why: "right now로 지연 없는 즉시를 요구하고, 이어서 구체적인 행동(put … down)을 말해요.", decoy: "— put the clamp", dko: ["지금 당장 멈추세요 — 가위를 내려놓으세요.", "잠시만 멈추세요 — 메스를 내려놓으세요."], ans: "scalpel", wr: [tray, clamp, retractor]}
  - {tag: "재확인", icon: redo, why: "which side — 어느 쪽인지 묻는 의문사절을 목적어로 써서 무엇을 확인하는지 분명히 해요. before continuing은 계속하기 전 확인을 못 박아요.", decoy: "to re-schedule", dko: ["마무리하기 전에 어느 쪽인지 다시 확인해야 합니다.", "계속하기 전에 어느 쪽인지 다시 그려야 합니다."], ans: "continuing", wr: [leaving, closing, resting]}
  o:
    tag: "대화 흐름"
    icon: compass
    ko: "wrong-site 임박 차단 4문장 순서"
    why: "먼저 멈추게 하고, 메스를 내려놓게 하고, 감사와 함께 표시를 가리킨 뒤, 계속하기 전에 재확인을 요구해요."
    lines:
    - {en: "Stop — that is the wrong site.", icon: siren, ko: "멈추세요 — 그건 잘못된 부위입니다", note: 정지}
    - {en: "Please put the scalpel down.", icon: scalpel, ko: "메스를 내려놓아 주세요", note: 내려놓기}
    - {en: "Thank you — now look at the mark: it's on the other side.", icon: pushpin, ko: "감사합니다 — 표시를 보세요, 반대쪽에 있어요", note: 표시}
    - {en: "We need to re-confirm which side before continuing.", icon: redo, ko: "계속하기 전에 어느 쪽인지 다시 확인해야 합니다", note: 재확인}
- t: "항생제 누락 절개 임박"
  s:
  - {tag: "누락 보고", icon: pill, why: "haven't … yet은 현재완료 부정이에요 — 지금까지 안 들어갔다는 현재 상태를 알려요. 절개 전에 누락을 일찍 알리는 틀이에요.", decoy: "have been ordered", dko: ["예방적 항생제가 아직 도착하지 않았습니다.", "예방적 항생제가 아직 준비되지 않았습니다."], ans: "prophylactic", wr: [oral, expensive, old]}
  - {tag: "절개 보류", icon: lock, why: "Can we hold …?로 지시가 아닌 질문을 해요 — 팀원에게 동의할 여지를 주면서도 절개를 막을 수 있어요.", decoy: "the lights", dko: ["도착할 때까지 절개를 보류할 수 있을까요?", "허가될 때까지 절개를 보류할 수 있을까요?"], ans: "hold", wr: [mark, close, clean]}
  - {tag: "준비 중", icon: pill, why: "drawing it up은 주사기에 약을 '뽑아 담다'는 뜻의 숙어예요. 현재진행형과 right now로 지금 하는 중임을 알려요.", decoy: "it out", dko: ["지금 바로 준비하고 있어요 — 삼 분이면 됩니다.", "지금 바로 확인하고 있어요 — 삼십 초면 됩니다."], ans: "thirty", wr: [three, fifteen, sixty]}
  - {tag: "절개 보류", icon: lock, why: "hold를 '잡아 두다'로 쓰고 until 절로 풀리는 조건을 말해요 — 조건이 해결되기 전엔 절개하지 않는다는 뜻이에요.", decoy: "until the lights", dko: ["소독이 끝날 때까지 절개를 보류합시다.", "항생제가 투여될 때까지 드레이프를 보류합시다."], ans: "antibiotics", wr: [gloves, lights, instruments]}
  - {tag: "준비 약속", icon: pill, why: "draw up the dose는 '준비 → 투여'의 앞 단계예요. 끝에 시간(thirty seconds)을 붙여 팀이 기다릴 길이를 알려요.", decoy: "the order", dko: ["지금 바로 투여량을 계산할게요, 삼십 초입니다.", "지금 바로 투여량을 준비할게요, 삼 분입니다."], ans: "dose", wr: [label, tray, chart]}
  o:
    tag: "대화 흐름"
    icon: compass
    ko: "항생제 누락 절개 임박 4문장 순서"
    why: "누락을 알리고, 절개 보류를 청하고, 지금 준비 중임을 알린 뒤, 투여가 끝날 때까지 기다리겠다고 합의해요."
    lines:
    - {en: "The prophylactic antibiotics haven't gone in yet.", icon: pill, ko: "예방적 항생제가 아직 들어가지 않았습니다", note: 보고}
    - {en: "Can we hold the incision until they're given?", icon: lock, ko: "투여될 때까지 절개를 보류할 수 있을까요?", note: 요청}
    - {en: "I'm drawing it up right now — thirty seconds.", icon: pill, ko: "지금 바로 준비하고 있어요 — 삼십 초면 돼요", note: 준비}
    - {en: "Thank you — we'll hold until the dose is in.", icon: handshake2, ko: "감사합니다 — 투여될 때까지 보류하겠습니다", note: 합의}
- t: "타임아웃 후 상태 급변"
  s:
  - {tag: "상태 변화", icon: monitor, why: "just changed의 just가 '방금'을 만들어 가장 최근의 변화임을 알려요 — 대시 뒤에 바로 할 행동(hold)을 붙여요.", decoy: "the lights", dko: ["활력징후가 방금 입력됐습니다 — 절개를 보류합시다.", "근무자가 방금 바뀌었습니다 — 절개를 보류합시다."], ans: "vitals", wr: [lights, tray, chart]}
  - {tag: "안정화", icon: stetho, why: "stabilize는 '안정시키다'라는 동사예요 — before 절이 그 전에는 진행하지 않는다는 순서를 정해요.", decoy: "to discuss", dko: ["마무리하기 전에 안정시켜야 합니다.", "진행하기 전에 소독해야 합니다."], ans: "stabilize", wr: [celebrate, argue, pack]}
  - {tag: "재평가", icon: stetho, why: "Give me a moment는 짧은 시간을 정중히 청해요 — with anesthesia로 혼자가 아니라 마취과와 함께 판단한다는 걸 밝혀요.", decoy: "to rest", dko: ["외과와 함께 재평가할 시간을 주세요.", "마취과와 함께 보고할 시간을 주세요."], ans: "reassess", wr: [relax, reply, rehearse]}
  - {tag: "재평가", icon: monitor, why: "reassess는 re(다시)와 assess(평가)예요 — 이미 한 번 본 것을 다시 평가한다는 뜻이고, vitals는 늘 복수형으로 써요.", decoy: "his schedule", dko: ["퇴실하기 전에 활력징후를 재평가합시다.", "진행하기 전에 활력징후를 전달합시다."], ans: "vitals", wr: [bed, badge, tray]}
  - {tag: "시간 요청", icon: calendar, why: "Give us a moment의 us로 팀 전체의 시간을 청해요 — before we continue는 안정화가 끝나기 전엔 이어가지 않는다는 뜻이에요.", decoy: "to organize", dko: ["마치기 전에 안정시킬 시간을 주세요.", "계속하기 전에 정리할 시간을 주세요."], ans: "Give", wr: [Take, Sell, Hide]}
  o:
    tag: "대화 흐름"
    icon: compass
    ko: "타임아웃 후 상태 급변 4문장 순서"
    why: "변화를 알리고, 절개 보류를 선언하고, 마취과와 재평가할 시간을 청한 뒤, 그 결과로 진행을 함께 정해요."
    lines:
    - {en: "His pressure just dropped.", icon: faceWorried, ko: "혈압이 방금 떨어졌어요", note: 변화}
    - {en: "So let's hold the incision.", icon: lock, ko: "그러니 절개를 보류합시다", note: 보류}
    - {en: "Give me a moment to reassess with anesthesia.", icon: stetho, ko: "마취과와 재평가할 시간을 주세요", note: 재평가}
    - {en: "After that reassessment, we'll decide together whether to proceed.", icon: handshake2, ko: "재평가 뒤에 진행 여부를 함께 정하겠습니다", note: 결정}
