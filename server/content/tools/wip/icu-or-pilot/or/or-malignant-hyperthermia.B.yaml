      - en: insurance
      - en: expenses
      - en: supplies
      - en: history
  - en: I'll notify the anesthesia team if there's a positive family history.
    ko: 가족력이 있으면 마취팀에 알릴게요.
    chunks:
    - I'll notify
    - the anesthesia team
    - if there's
    - a positive family history
    - .
    words:
    - w-notify
    - w-team
    - w-anesthesia
    - w-family
    - w-history
    goal: 2
    tag: 보고 약속
    icon: bell
    why: I'll은 말하는 순간 정한 약속이라 다음에 일어날 일을 바로 알려 줘요. if there's a positive family history라는 조건을 붙여 병력이 확인될 때 마취팀이 계획을 바꾼다는 흐름이 분명해져요.
    decoy: the front desk
    distractorsKo:
    - 가족력이 있으면 외과팀에 알릴게요.
