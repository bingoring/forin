situations:
- title: MH 가족력 선별
  sentences:
  - en: Has any family member reacted badly to anesthesia?
    ko: 가족 중 누군가 마취에 나쁘게 반응한 적이 있나요?
    chunks:
    - Has any family member
    - reacted badly
    - to anesthesia
    - '?'
    words:
    - w-family
    - w-member
    - w-react
    - w-anesthesia
    goal: 1
    tag: 가족력 질문
    icon: board
    why: Has any … reacted는 살면서 한 번이라도 있었는지 묻는 현재완료 모양이에요. any family member로 범위를 넓혀야 환자가 직접 겪지 않은 친척의 마취 사고까지 떠올려요.
    decoy: to antibiotics
    distractorsKo:
    - 가족 중 누군가 수술에 나쁘게 반응한 적이 있나요?
    - 친구 중 누군가 마취에 나쁘게 반응한 적이 있나요?
    blank:
      answer: badly
      options:
      - en: badly
      - en: slowly
      - en: calmly
      - en: rarely
  - en: This helps us screen for malignant hyperthermia risk.
    ko: 이건 악성 고열 위험을 선별하는 데 도움이 됩니다.
    chunks:
    - This helps us
    - screen for
    - malignant hyperthermia risk
    - .
    words:
    - w-screen
    - w-mhfull
    - w-risk
    goal: 1
    tag: 이유 설명
    icon: shield
    why: helps us + 동사원형은 이 질문이 누구를 위한 것인지 우리를 도와준다는 모양으로 풀어 줘요. 묻는 까닭을 알면 환자가 낯선 가족 병력도 더 열심히 떠올려요.
    decoy: pay for
    distractorsKo:
    - 이건 약물 알레르기 위험을 선별하는 데 도움이 됩니다.
    - 이건 저혈압 위험을 선별하는 데 도움이 됩니다.
    blank:
      answer: risk
      options:
      - en: rate
      - en: risk
      - en: cost
      - en: fee
  - en: Any high fevers or muscle problems under anesthesia?
    ko: 마취 중에 고열이나 근육 문제가 있었나요?
    chunks:
    - Any high fevers
    - or muscle problems
    - under anesthesia
    - '?'
    words:
    - w-fever
    - w-muscle
    - w-anesthesia
    goal: 1
    tag: 증상 질문
    icon: faceWorried
    why: Any …?는 Have you had any …?를 줄인 구어 질문이라 짧게 묻고 바로 답을 들을 수 있어요. high fevers와 muscle problems를 함께 말해 두면 MH의 두 대표 증상을 같이 떠올리게 해요.
    decoy: at home
    distractorsKo:
    - 마취 중에 저혈압이나 근육 문제가 있었나요?
    - 마취 중에 고열이나 피부 문제가 있었나요?
    blank:
      answer: muscle
      options:
      - en: bone
      - en: nerve
      - en: muscle
      - en: skin
  - en: I need to ask about your family's medical history before surgery.
    ko: 수술 전에 가족 병력을 여쭤봐야 해요.
    chunks:
    - I need to ask
    - about your family's
    - medical history
    - before surgery
    - .
    words:
    - w-family
    - w-history
    - w-surgery
    goal: 1
    tag: 질문 이유
    icon: pencil
    why: I need to는 내 취향이 아니라 절차상 해야 하는 일이라는 모양이에요. before surgery로 시점을 밝히면 지금 묻는 것이 수술 준비의 일부라는 점이 전해져요.
    decoy: before dinner
    distractorsKo:
    - 입원 전에 가족 병력을 여쭤봐야 해요.
    - 수술 전에 가족 연락처를 여쭤봐야 해요.
    blank:
