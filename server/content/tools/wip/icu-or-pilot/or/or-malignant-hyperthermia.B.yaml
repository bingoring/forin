    - en: Has anyone in your family ever had a bad reaction to anesthesia?
      icon: faceWorried
      ko: 가족 중에 마취 부작용을 겪은 분이 있나요?
      note: 질문
    - en: That includes any high fever or muscle problem during a past surgery.
      icon: stetho
