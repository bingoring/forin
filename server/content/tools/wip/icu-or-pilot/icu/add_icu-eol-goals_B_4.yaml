- title: 대리결정 부재·윤리위원회 연계
  s:
  - {t: "절차 사유", i: board, w: "no identified surrogate로 확인된 대리결정자가 없다는 사실을, so로 그 결과인 윤리위원회 필요로 이어요. 차트에 쓰는 말은 이유와 결과를 한 문장에 묶어 읽는 사람이 바로 이해하게 해요.", d: "for the family", k: ["확인된 대리결정자가 없어서 사회복지사가 필요해요", "확인된 대리결정자가 없어서 법률팀이 필요해요"], a: "surrogate", o: ["insurance", "password", "passport"]}
  - {t: "기록 요청", i: pencil, w: "Let's document는 담당자 한 사람이 아니라 팀이 함께 기록하자는 권유예요. everything we know about…으로 확실한 것만이 아니라 알고 있는 모든 단서를 적으라는 범위를 말해요.", d: "for the family", k: ["알고 있는 사전 의사를 전부 확인해둡시다", "알고 있는 사전 병력을 전부 기록해둡시다"], a: "wishes", o: ["debts", "hobbies", "addresses"]}
  - {t: "절차 약속", i: compass, w: "follow the process로 개인의 판단이 아니라 정해진 절차를 따른다고 밝혀요. in his best interest는 대리인이 없을 때 결정의 기준이 환자의 최선의 이익이라는 뜻이에요.", d: "for the family", k: ["그분께 최선인 결정을 내리는 일정을 따를게요", "그분께 최선인 결정을 서류로 남기는 절차를 따를게요"], a: "process", o: ["schedule", "menu", "rumor"]}
  - {t: "가족 탐색", i: magnify, w: "차트식 문장이라 We 같은 주어와 be동사를 줄여 짧게 적어요. after multiple attempts로 몇 번 찾아봤는지 근거를 같이 적어 찾으려는 노력이 있었음이 드러나요.", d: "in the unit", k: ["여러 차례 시도했으나 가까운 지인을 찾지 못함", "한 차례 시도했으나 가까운 가족을 찾지 못함"], a: "multiple", o: ["private", "random", "rapid"]}
  - {t: "기록 부재", i: board, w: "차트식 문장이라 are를 줄인 not documented 형태예요. anywhere in the chart로 일부가 아니라 차트 전체를 찾아봤다는 범위를 밝혀 기록이 없다는 결론에 근거를 줘요.", d: "for the family", k: ["사전 의사가 병동 어디에도 기록되어 있지 않음", "사전 병력이 차트 어디에도 기록되어 있지 않음"], a: "documented", o: ["delivered", "painted", "framed"]}
  - {t: "자문 상태", i: board, w: "placed는 의뢰를 넣었다는 병원 용어이고 awaiting은 지금 기다리는 중이라는 상태 표시예요. 차트는 한 일과 지금 상태를 대시로 나눠 적어 다음 근무자가 이어 갈 수 있게 해요.", d: "for the family", k: ["법률자문 의뢰함 — 위원회 검토 대기 중", "윤리자문 의뢰함 — 병동 회의 대기 중"], a: "awaiting", o: ["avoiding", "attending", "adopting"]}
  - {t: "판단 능력", i: stetho, w: "Two physicians로 판정한 사람 수를 먼저 밝혀 한 사람의 판단이 아니라는 근거를 줘요. lacks는 현재 능력이 없다는 뜻의 동사이고 confirmed가 확인을 마쳤다는 과거형이에요.", d: "for the family", k: ["간호사 2인이 의사결정 능력 없음을 확인함", "의사 3인이 의사결정 능력 없음을 확인함"], a: "physicians", o: ["pharmacists", "chaplains", "lawyers"]}
  order:
    tag: "차트 흐름"
    icon: compass
    ko: "대리결정자 부재 기록 4문장 순서"
    why: "먼저 능력 판정을 쓰고, 2줄의 that이 그 판정을 이유로 삼아 대리인을 찾은 결과를 써요. 3줄의 the same search가 2줄의 탐색을 가리키고, 4줄의 both가 2·3줄 결과를 받아 의뢰로 이어서 순서가 하나예요."
    lines:
    - {en: "Two physicians confirmed he lacks decision-making capacity.", icon: stetho, ko: "의사 2인이 의사결정 능력 없음을 확인함", note: "판정"}
    - {en: "Because of that, we looked for a surrogate; no next of kin was located after multiple attempts.", icon: magnify, ko: "그래서 대리인을 찾았으나 여러 차례 시도에도 가까운 가족을 찾지 못함", note: "탐색"}
    - {en: "In the same search, his prior wishes were not documented anywhere in the chart.", icon: board, ko: "같은 탐색에서 사전 의사도 차트 어디에도 기록돼 있지 않음", note: "기록"}
    - {en: "With no surrogate and no documented wishes, an ethics consult was placed.", icon: compass, ko: "대리인도 기록된 의사도 없어 윤리자문을 의뢰함", note: "의뢰"}
- title: 젊은 환자 임종 특수 상황
  s:
  - {t: "공감", i: handshake2, w: "There is no easy way로 쉬운 방법이 없다는 사실을 먼저 인정해 위로를 서두르지 않아요. you don't have to face it alone으로 혼자가 아니라는 말을 이어요.", d: "for the family", k: ["쉬운 방법은 없지만, 혼자 기다리지 않으셔도 돼요", "빠른 방법은 없지만, 혼자 감당하지 않으셔도 돼요"], a: "easy", o: ["cheap", "safe", "free"]}
  - {t: "전문가 소개", i: handshake2, w: "Child life specialists는 아이들의 이해를 돕는 전문가 직군 이름이에요. can help you talk with는 대신 말해 주는 게 아니라 부모가 직접 말하도록 돕는다는 뜻이에요.", d: "for the family", k: ["아동생활전문가가 자녀분들과 놀아주시는 걸 도와드릴 수 있어요", "상담사가 자녀분들과 이야기하시는 걸 도와드릴 수 있어요"], a: "specialists", o: ["electricians", "cooks", "guards"]}
  - {t: "지지 약속", i: shield, w: "through every step으로 일부 구간이 아니라 전 과정이라는 범위를 말해요. you and her family를 함께 부르면 말하는 사람과 환자의 가족 모두를 지지 대상에 넣어요.", d: "for the day", k: ["매 단계마다 가족분과 함께 안내해드릴게요", "매일 아침 가족분과 함께 지지해드릴게요"], a: "step", o: ["floor", "door", "season"]}
  - {t: "공감", i: faceWorried, w: "this young으로 나이가 슬픔의 특별함을 만든다고 짚어요. that's real은 그 느낌이 상상이나 과장이 아니라고 확인해 주는 말이에요.", d: "for the family", k: ["이렇게 갑작스럽게 잃는 건 다르게 느껴지고, 그건 실제예요", "이렇게 젊은 나이에 아프면 다르게 느껴지고, 그건 실제예요"], a: "young", o: ["tall", "loud", "fast"]}
  - {t: "아이 이해", i: bulb, w: "often은 늘이 아니라 흔히라는 정도라 아이들이 모든 걸 안다고 단정하지 않아요. in their own way로 어른과 같은 방식은 아니지만 나름의 이해가 있다고 말해요.", d: "for the family", k: ["아이들은 저희가 생각하는 것보다 나름의 방식으로 더 많이 기억해요", "어른들은 저희가 생각하는 것보다 나름의 방식으로 더 많이 이해해요"], a: "understand", o: ["ignore", "imagine", "borrow"]}
  - {t: "말 찾기", i: speech, w: "find the right words는 정답이 하나 있는 게 아니라 알맞은 표현을 함께 찾는다는 뜻이에요. We can help you로 대신 말하는 게 아니라 부모의 말을 돕는다는 점을 분명히 해요.", d: "for the family", k: ["자녀분들께 할 알맞은 책을 찾도록 도와드릴 수 있어요", "조카분들께 할 알맞은 말을 찾도록 도와드릴 수 있어요"], a: "words", o: ["books", "toys", "gifts"]}
  - {t: "곁 약속", i: shield, w: "carry this는 무거운 짐을 나르는 비유라 감당해야 할 슬픔을 짐으로 말해요. by yourself로 혼자라는 점을 짚어 함께라는 뜻을 반대편에서 전해요.", d: "for the day", k: ["이걸 혼자 결정하실 필요는 없어요", "이걸 모두 짊어지실 필요는 없어요"], a: "carry", o: ["sign", "hide", "read"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "젊은 환자 가족 지지 4문장 순서"
    why: "먼저 쉬운 방법이 없다고 인정하고, 2줄의 That이 그 말을 받아 젊은 나이의 상실을 짚어요. 3줄에서 자녀를 처음 말하고, 4줄의 them이 3줄의 아이들을 가리켜서 마지막에 와요."
    lines:
    - {en: "There is no easy way, and you don't have to face it alone.", icon: handshake2, ko: "쉬운 방법은 없지만 혼자 감당하지 않으셔도 돼요", note: "공감"}
    - {en: "That is especially true when someone this young is lost.", icon: faceWorried, ko: "이렇게 젊은 분을 잃을 때는 더욱 그래요", note: "인정"}
    - {en: "Her children may understand more than we expect, in their own way.", icon: bulb, ko: "자녀분들은 생각보다 나름의 방식으로 더 많이 이해할 수 있어요", note: "아이들"}
    - {en: "Child life specialists can help you find the right words for them.", icon: handshake2, ko: "아동생활전문가가 그들에게 할 알맞은 말을 찾도록 도와드려요", note: "지원"}
