# 상황 16~20
16:
  s:
    - {tag: "응급 환기", icon: siren, why: "명령문으로 시작하고 while 절로 같은 때 진행되는 일을 붙여서, 응급 상황의 동시 진행을 짧게 말해요.", decoy: "for the family", d: ["의사를 기다리는 동안 100퍼센트 산소로 백 환기하세요.", "카트를 가져오는 동안 100퍼센트 산소로 백 환기하세요."], a: "prepare", o: ["refuse", "forget", "pretend"]}
    - {tag: "장비 보고", icon: check, why: "I've got … ready는 이미 준비가 끝났다는 현재완료 보고라서, 듣는 사람이 바로 다음 단계로 넘어갈 수 있어요.", decoy: "in the cart", d: ["튜브, 후두경, 거즈를 준비해 뒀어요.", "튜브, 청진기, 흡인기를 준비해 뒀어요."], a: "laryngoscope", o: ["stethoscope", "thermometer", "otoscope"]}
    - {tag: "응급 호출", icon: bell, why: "stat은 즉시라는 의료 약어이고, for the airway가 호출의 이유를 짧게 알려요.", decoy: "to the lab", d: ["기도 때문에 의사를 즉시 병동으로 불러 주세요.", "기침 때문에 의사를 즉시 침상으로 불러 주세요."], a: "physician", o: ["pharmacist", "dietitian", "chaplain"]}
    - {tag: "진행 보고", icon: monitor, why: "We're bagging처럼 현재진행형으로 말하면 지금 이 순간 하고 있다는 사실이 팀에 전해져요.", decoy: "for the family", d: ["팀이 장비를 준비하는 동안 100퍼센트로 백 환기하고 있어요.", "팀이 이동하는 동안 100퍼센트로 백 환기하고 있어요."], a: "bagging", o: ["taping", "charting", "weighing"]}
    - {tag: "장비 보고", icon: check, why: "at the bedside로 장비가 놓인 위치까지 말해서, 바로 쓸 수 있다는 보고가 돼요.", decoy: "in the hall", d: ["흡인기와 후두경을 입구에 준비해 뒀어요.", "흡인기와 가위를 침상 곁에 준비해 뒀어요."], a: "bedside", o: ["entrance", "pharmacy", "storeroom"]}
    - {tag: "상황 안내", icon: handshake2, why: "to secure the airway로 의사가 오는 목적을 밝혀서 팀이 무엇을 준비할지 알 수 있어요.", decoy: "for the rounds", d: ["의사가 기도를 확인하러 즉시 오고 있어요.", "간호사가 기도를 확보하러 즉시 오고 있어요."], a: "secure", o: ["measure", "label", "rename"]}
  order:
    tag: "대화 흐름"
    icon: siren
    ko: "발관 실패 응급 재삽관 4문장 순서"
    why: "먼저 산소로 환기를 시작하고, 이어서 의사를 호출하고, 의사가 오기 전에 장비를 준비하며, 기도가 확보된 뒤 다음 단계를 말해요."
    lines:
      - {en: "He's failing — bag him with 100 percent oxygen.", icon: siren, ko: "상태가 나빠요, 100퍼센트 산소로 백 환기하세요", note: "환기"}
      - {en: "Keep bagging; I'm calling the physician stat to secure the airway.", icon: bell, ko: "환기를 계속하세요, 의사를 즉시 부를게요", note: "호출"}
      - {en: "For when they arrive, I've got the tube, laryngoscope, and suction ready.", icon: check, ko: "오시면 쓰도록 장비를 준비해 뒀어요", note: "장비"}
      - {en: "Once the airway is secure, we'll go back to ventilator support.", icon: monitor, ko: "기도가 확보되면 다시 호흡기를 달아요", note: "다음"}
17:
  s:
    - {tag: "구조 NIV", icon: monitor, why: "If절의 두 조건(각성, 다룰 만한 기도)이 시도의 전제이고, briefly가 짧게만 한다는 한도를 붙여요.", decoy: "for the doctor", d: ["각성돼 있고 보호자가 동의하면 잠시 구조 NIV를 시도할 수 있어요.", "각성돼 있고 기도가 다룰 만하면 잠시 구조 NIV를 설명할 수 있어요."], a: "briefly", o: ["boldly", "blindly", "bravely"]}
    - {tag: "중단 기준", icon: siren, why: "But으로 앞 시도와 대비시키고, without delay로 악화 시 기다리지 않는다는 뜻을 분명히 해요.", decoy: "in the unit", d: ["하지만 계속 악화되면 지체 없이 팀을 부를게요.", "하지만 계속 악화되면 지체 없이 동료에게 알릴게요."], a: "reintubate", o: ["rehydrate", "relocate", "rename"]}
    - {tag: "시간 제한", icon: calendar, why: "so we don't lose the window로 시간 제한을 두는 이유를 말해서, 지체하다 시기를 놓치는 것을 막아요.", decoy: "for the visit", d: ["기회를 놓치지 않도록 짧은 시간 제한을 알립시다.", "약속을 놓치지 않도록 짧은 시간 제한을 정합시다."], a: "window", o: ["door", "wall", "floor"]}
    - {tag: "시도 제안", icon: play, why: "so로 앞의 두 관찰(각성, 기도)에서 시도 제안으로 이어져, 판단 근거가 문장에 같이 있어요.", decoy: "for lunch", d: ["각성돼 있고 기도도 다룰 만해 보여서 구조 NIV를 설명해 봅시다.", "각성돼 있고 아침이 되어서 구조 NIV를 시도해 봅시다."], a: "alert", o: ["anxious", "angry", "afraid"]}
    - {tag: "중단 기준", icon: siren, why: "past the time limit으로 시간 제한을 넘기는 순간이 기준임을 말해요.", decoy: "in the bed", d: ["시간 제한을 넘어 계속 악화되면 팀에 알릴게요.", "시간 제한을 넘어 계속 악화되면 모니터를 확인할게요."], a: "limit", o: ["zone", "bell", "watch"]}
    - {tag: "호출 요청", icon: bell, why: "the moment로 상태가 변하는 바로 그 순간에 알려 달라고 시점을 정확히 말해요.", decoy: "for the rounds", d: ["약속을 놓치지 않을게요, 상태가 나빠지는 순간 저를 불러 주세요.", "기회를 놓치지 않을게요, 상태가 나빠지는 순간 팀장을 불러 주세요."], a: "lose", o: ["open", "break", "clean"]}
  order:
    tag: "대화 흐름"
    icon: monitor
    ko: "발관 직후 호흡부전 판단 4문장 순서"
    why: "시도의 근거를 말하고, 시도에 시간 제한을 걸고, 제한을 넘어 악화될 때의 행동을 말한 뒤, 그 결정을 빨리 내리도록 호출을 요청해요."
    lines:
      - {en: "He's alert and his airway looks manageable, so let's try rescue NIV.", icon: play, ko: "각성돼 있고 기도도 괜찮아 구조 NIV를 해요", note: "시도"}
      - {en: "Let's set a short time limit on that, so we don't lose the window.", icon: calendar, ko: "그것에 짧은 시간 제한을 정해요", note: "한도"}
      - {en: "If he keeps deteriorating past that limit, we reintubate.", icon: siren, ko: "한도를 넘어 악화되면 재삽관해요", note: "기준"}
      - {en: "To make that call quickly, tell me the moment he looks worse.", icon: bell, ko: "빨리 결정하게 악화되는 순간 알려 주세요", note: "호출"}
18:
  s:
    - {tag: "계획 필요", icon: chartup, why: "so로 반복된 실패라는 사실에서 장기 계획이 필요하다는 결론을 이어요.", decoy: "for the family", d: ["반복해서 시험에 실패해서 장기적인 퇴원 계획이 필요해요.", "처음으로 시험에 실패해서 장기적인 이탈 계획이 필요해요."], a: "repeated", o: ["simple", "skipped", "future"]}
    - {tag: "논의 제안", icon: speech, why: "Let's discuss는 결정하자가 아니라 같이 의논해 보자는 제안이라 부담이 적어요.", decoy: "in the unit", d: ["점진적인 이탈을 지지하도록 영양 보충을 논의해 봅시다.", "점진적인 전원을 지지하도록 기관절개를 논의해 봅시다."], a: "gradual", o: ["painful", "public", "formal"]}
    - {tag: "팀 소집", icon: handshake2, why: "bring ... together는 흩어진 사람들을 한자리에 모은다는 뜻이고, to reset으로 모으는 목적을 붙여요.", decoy: "for the rounds", d: ["목표를 재설정하도록 간호 팀을 모을게요.", "목표를 확인하도록 다학제 팀을 모을게요."], a: "goals", o: ["bills", "beds", "doors"]}
    - {tag: "계획 필요", icon: chartup, why: "Repeated failed trials가 주어라서 한 번의 실패가 아니라 반복된 양상이 근거임을 알려요.", decoy: "to the lab", d: ["반복된 실패는 그의 아내에게 장기적인 계획이 필요하다는 뜻이에요.", "반복된 검사는 그에게 장기적인 계획이 필요하다는 뜻이에요."], a: "failed", o: ["passed", "silent", "tidy"]}
    - {tag: "제안 설명", icon: shield, why: "might suit him better의 might가 단정하지 않고 가능성으로 제안하는 말투예요.", decoy: "for the visit", d: ["기관절개를 통한 점진적인 이탈이 그의 아내에게 더 맞을 수 있어요.", "기관절개를 통한 점진적인 이송이 그에게 더 맞을 수 있어요."], a: "suit", o: ["bore", "tire", "scare"]}
    - {tag: "일정 안내", icon: calendar, why: "will meet today처럼 미래형에 today를 붙여 모임이 오늘 있다는 구체적인 일정을 알려요.", decoy: "in the hall", d: ["다학제 팀이 내일 만나 목표를 재설정할 거예요.", "다학제 팀이 오늘 만나 목표를 설명할 거예요."], a: "meet", o: ["vote", "rest", "sleep"]}
  order:
    tag: "대화 흐름"
    icon: chartup
    ko: "반복 SBT 실패 장기 이탈 4문장 순서"
    why: "반복된 실패를 근거로 장기 계획 필요성을 말하고, 구체적 방안을 제안한 뒤, 그 결정을 위해 팀을 모으고, 모임에서 목표를 재설정한다고 닫아요."
    lines:
      - {en: "He's failed repeated trials, so we need a longer-term weaning plan.", icon: chartup, ko: "반복 실패로 장기 이탈 계획이 필요해요", note: "근거"}
      - {en: "A gradual wean with a tracheostomy might suit him better.", icon: shield, ko: "기관절개 점진적 이탈이 더 맞을 수 있어요", note: "제안"}
      - {en: "To decide that, I'll bring the multidisciplinary team together.", icon: handshake2, ko: "결정하려고 다학제 팀을 모을게요", note: "소집"}
      - {en: "They'll reset his goals at today's meeting.", icon: calendar, ko: "오늘 회의에서 목표를 재설정해요", note: "일정"}
19:
  s:
    - {tag: "상황 설명", icon: chartup, why: "increasing과 causing 두 현재분사로 원인(부담)과 결과(허혈)를 한 문장에 이어 말해요.", decoy: "for the family", d: ["이탈이 폐 부담을 늘려서 허혈을 일으키고 있어요.", "이탈이 심장 부담을 늘려서 통증을 일으키고 있어요."], a: "cardiac", o: ["kidney", "liver", "lung"]}
    - {tag: "조치 제안", icon: shield, why: "to rest his heart로 완전 지지로 돌리는 목적을 밝혀서 이유가 분명해요.", decoy: "in the unit", d: ["폐를 쉬게 하도록 다시 완전 지지로 돌립시다.", "다리를 쉬게 하도록 다시 완전 지지로 돌립시다."], a: "heart", o: ["legs", "eyes", "voice"]}
    - {tag: "즉시 보고", icon: bell, why: "and로 검사와 보고 두 행동을 묶고 right away로 지체하지 않겠다고 말해요.", decoy: "for the rounds", d: ["12유도 심전도를 찍고 즉시 팀장에게 알릴게요.", "12유도 심전도를 찍고 즉시 수간호사에게 알릴게요."], a: "notify", o: ["thank", "invite", "hire"]}
    - {tag: "원인 설명", icon: chartup, why: "that's causing에서 that이 앞 절 전체를 가리켜서 원인과 결과를 한 문장으로 이어요.", decoy: "in the lab", d: ["심장 부담이 오르고 있고, 그것이 지금 보이는 부종을 일으키고 있어요.", "신장 부담이 오르고 있고, 그것이 지금 보이는 허혈을 일으키고 있어요."], a: "rising", o: ["easing", "shifting", "hiding"]}
    - {tag: "조치 설명", icon: shield, why: "so his heart can rest에서 so가 조치의 목적을 이끌어서 지금 하는 일의 이유가 전해져요.", decoy: "for the visit", d: ["폐가 쉴 수 있도록 다시 완전 지지로 돌리고 있어요.", "다리가 쉴 수 있도록 다시 완전 지지로 돌리고 있어요."], a: "rest", o: ["race", "skip", "pound"]}
    - {tag: "보고 약속", icon: bell, why: "as soon as I see로 보고 시점을 12유도를 확인하는 순간에 묶어서 약속해요.", decoy: "for lunch", d: ["12유도를 보는 대로 바로 팀장에게 알릴게요.", "12유도를 보는 대로 바로 간호사에게 알릴게요."], a: "physician", o: ["pharmacist", "chaplain", "dietitian"]}
  order:
    tag: "대화 흐름"
    icon: chartup
    ko: "이탈 중 심근허혈 4문장 순서"
    why: "원인을 먼저 설명하고, 그 원인을 줄이도록 완전 지지로 돌리고, 돌린 뒤에 심전도를 찍으며, 그 기록으로 의사에게 바로 알려요."
    lines:
      - {en: "The weaning is increasing his cardiac workload and causing ischemia.", icon: chartup, ko: "이탈이 심장 부담을 늘려 허혈을 일으켜요", note: "원인"}
      - {en: "Let's put him back on full support to rest his heart.", icon: shield, ko: "심장이 쉬게 완전 지지로 돌려요", note: "조치"}
      - {en: "With him back on full support, I'll get a twelve-lead.", icon: monitor, ko: "완전 지지로 돌리고 12유도를 찍어요", note: "검사"}
      - {en: "I'll notify the physician right away with that tracing.", icon: bell, ko: "그 기록으로 의사에게 즉시 알려요", note: "보고"}
20:
  s:
    - {tag: "응급 지시", icon: siren, why: "명령문에 now를 붙여서 한시도 미루지 말라는 급한 상황을 짧게 전해요.", decoy: "for the family", d: ["지금 적극적으로 흡인해서 흡인된 내용물을 확인해 주세요.", "지금 적극적으로 흡인해서 흡인된 내용물을 모아 주세요."], a: "aspirated", o: ["hidden", "labeled", "spilled"]}
    - {tag: "자세 지시", icon: siren, why: "동사 두 개를 and로 이어서 급한 상황에서 해야 할 두 조치를 한 번에 지시해요.", decoy: "in the unit", d: ["옆으로 돌리고 호출벨을 눌러 주세요.", "옆으로 돌리고 도움을 요청해 주세요."], a: "side", o: ["bed", "floor", "couch"]}
    - {tag: "대비 계획", icon: shield, why: "If절 조건(완전 폐색)이 생기면 준비한다는 순서를 말하고, immediately가 지체 없음을 알려요.", decoy: "to the lab", d: ["일부 막히면 즉시 재삽관을 준비할게요.", "완전히 막히면 즉시 동료에게 재삽관을 설명할게요."], a: "immediately", o: ["eventually", "politely", "gradually"]}
    - {tag: "처치 설명", icon: gear, why: "before he obstructs completely로 지금 흡인하는 이유가 막히기 전에 막으려는 것임을 말해요.", decoy: "for the rounds", d: ["완전히 막힌 뒤에 적극적으로 흡인해서 내용물을 없애고 있어요.", "완전히 막히기 전에 적극적으로 흡인해서 내용물을 확인하고 있어요."], a: "obstructs", o: ["wakes", "relaxes", "recovers"]}
    - {tag: "자세 설명", icon: stetho, why: "Turning him처럼 동명사를 주어로 써서 자세를 바꾸는 행동 자체가 어떤 도움이 되는지 설명해요.", decoy: "in the bed", d: ["옆으로 돌리면 흡인된 내용물이 보이는 데 도움이 돼요.", "옆으로 돌리면 흡인된 내용물이 검사되는 데 도움이 돼요."], a: "drain", o: ["trap", "weigh", "test"]}
    - {tag: "대비 계획", icon: shield, why: "if this doesn't clear로 흡인 효과를 먼저 보고 재삽관을 준비한다는 조건과 순서를 알려요.", decoy: "for lunch", d: ["이게 없어지지 않으면 즉시 동료에게 상황을 설명할게요.", "이게 없어지지 않으면 즉시 시간을 기록할게요."], a: "prepare", o: ["pretend", "promise", "pray"]}
  order:
    tag: "대화 흐름"
    icon: siren
    ko: "발관 후 흡인 기도폐색 4문장 순서"
    why: "자세를 바꾸고 흡인하는 것이 먼저이고, 그 자세의 효과를 설명하고, 그 배액에 맞춰 산소를 주며, 없어지지 않을 때를 말해 닫아요."
    lines:
      - {en: "Turn him on his side and suction him aggressively now.", icon: siren, ko: "옆으로 돌리고 지금 적극적으로 흡인하세요", note: "조치"}
      - {en: "Turning him that way helps drain the aspirated material.", icon: stetho, ko: "그렇게 돌리면 내용물이 배출돼요", note: "효과"}
      - {en: "Along with that drainage, give high-flow oxygen.", icon: monitor, ko: "그와 함께 고유량 산소를 주세요", note: "산소"}
      - {en: "If this doesn't clear, we prepare to reintubate immediately.", icon: shield, ko: "없어지지 않으면 즉시 재삽관을 준비해요", note: "대비"}
