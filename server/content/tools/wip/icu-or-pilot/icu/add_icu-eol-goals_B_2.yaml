- title: 임종기 증상 사정
  s:
  - {t: "관찰 약속", i: monitor, w: "I'm watching은 진행형이라 지금 이 순간에도 살피고 있다는 느낌을 줘요. closely와 for any sign of를 붙여 무엇을 보는지 알려 주면, 말로 표현하지 못하는 환자도 놓치지 않는다는 것이 가족에게 전해져요.", d: "on the monitor", k: ["표정과 호흡을 계속 유심히 살펴보고 있어요, 졸린 기색이 있는지요", "표정과 자세를 계속 유심히 살펴보고 있어요, 불편한 기색이 있는지요"], a: "discomfort", o: ["boredom", "pride", "laughter"]}
  - {t: "증상 설명", i: speaker, w: "common은 흔한 일이라는 뜻이라 가족의 놀란 마음을 가라앉혀요. and we can ease it으로 지켜만 보는 게 아니라 도울 방법이 있다고 덧붙여서, 괜찮다는 말로 넘기지 않는 모양이에요.", d: "in the morning", k: ["그 소리는 이 시기에 드물게 나는 것이고 저희가 완화해드릴 수 있어요", "그 소리는 이 시기에 흔히 나는 것이고 저희가 설명해드릴 수 있어요"], a: "common", o: ["rare", "unusual", "unclear"]}
  - {t: "약 설명", i: pill, w: "so she stays comfortable은 약을 주는 목적을 문장 안에 바로 붙인 모양이에요. 목적을 함께 말하면 가족이 약의 이유를 알고 받아들여요.", d: "for the doctor", k: ["담요를 드려서 편안하게 계시도록 할게요", "약을 드려서 따뜻하게 계시도록 할게요"], a: "comfortable", o: ["awake", "alone", "upright"]}
  - {t: "증상 설명", i: stetho, w: "but으로 눈에 보이는 증상과 가족이 떠올리는 걱정 사이의 연결을 풀어 줘요. always를 넣어서 항상은 아니라는 정도로 말하니, 통증이 없다고 단정하지 않으면서 과한 불안은 덜어 줘요.", d: "from the bed", k: ["호흡이 힘겨워 보여도 그게 꼭 열이 있다는 뜻은 아니에요", "호흡이 힘겨워 보여도 그게 꼭 두려움을 뜻하는 건 아니에요"], a: "breathing", o: ["heartbeat", "cough", "stomach"]}
  - {t: "통증 사정", i: faceWorried, w: "every time은 그때마다 빠뜨리지 않는다는 빈도를 말해요. for grimacing으로 무엇을 보는지 정해 두면, 말하기 어려운 환자의 통증을 표정으로 살핀다는 것이 가족에게 분명해져요.", d: "on the chart", k: ["제가 방에 들어갈 때마다 얼굴색이 변하는지 확인해요", "제가 방을 나갈 때마다 얼굴을 찡그리시는지 확인해요"], a: "grimacing", o: ["smiling", "sleeping", "coughing"]}
  - {t: "즉시 조치", i: pill, w: "If 절로 조건을 먼저 말하고 right away로 지체 없다는 점을 끝에 붙여요. 불편해 보이는 기색이 있으면 기다리지 않고 약을 조절한다는 약속이라 가족이 마음을 놓아요.", d: "with the team", k: ["불편해 보이시면 바로 조명을 조절해드려요", "피곤해 보이시면 바로 약을 조절해드려요"], a: "uncomfortable", o: ["thirsty", "cheerful", "hungry"]}
  - {t: "투명한 설명", i: speech, w: "I'll let you know는 앞으로 계속 알려 주겠다는 약속이에요. exactly로 얼버무리지 않고 본 것과 한 일을 모두 말하겠다고 하면 가족이 상황에서 소외되지 않아요.", d: "to the doctor", k: ["제가 뭘 보고 있는지, 어떻게 하고 있는지 정확히 적어 둘게요", "제가 뭘 들었는지, 어떻게 하고 있는지 정확히 알려드릴게요"], a: "exactly", o: ["roughly", "partly", "briefly"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "임종기 증상 사정 4문장 순서"
    why: "먼저 살피고 있다고 알리고, 불편해 보이면 약을 조절하고, 3줄의 it은 2줄의 약이 듣는지 다시 보는 것을 가리켜요. 마지막 줄의 what I changed는 2줄의 조절이 있어야 말할 수 있어서 순서가 하나예요."
    lines:
    - {en: "I'm keeping a close eye on her face and breathing.", icon: monitor, ko: "표정과 호흡을 가까이서 계속 지켜보고 있어요", note: "관찰"}
    - {en: "If I see any sign she is uncomfortable, I adjust her medication right away.", icon: pill, ko: "불편한 기색이 보이면 바로 약을 조절해요", note: "조치"}
    - {en: "I look at her face again to see whether it is working.", icon: magnify, ko: "그게 듣고 있는지 얼굴을 다시 살펴봐요", note: "재확인"}
    - {en: "I'll tell you what I saw and what I changed.", icon: speech, ko: "제가 본 것과 바꾼 것을 말씀드릴게요", note: "공유"}
- title: 편안함 중심 간호
  s:
  - {t: "돌봄 목표", i: shield, w: "Our whole focus now에서 now가 이전과 달라진 지금의 방향을 짚어요. whole로 일부가 아니라 전체 초점이라고 하면, 돌봄이 끝난 것이 아니라 목표가 바뀐 것이라는 뜻이 전해져요.", d: "for the family", k: ["지금 저희의 모든 초점은 그분의 안전함과 존엄이에요", "지금 저희의 모든 초점은 가족분의 편안함과 존엄이에요"], a: "focus", o: ["rule", "problem", "schedule"]}
  - {t: "돌봄 범위", i: bandage, w: "세 동사를 쉼표로 이어 편안함 중심 돌봄의 구체적인 모습을 한눈에 보여 줘요. that don't help를 붙이면 검사를 전부 끊는 게 아니라 도움이 안 되는 것만 멈춘다는 뜻이 정확해져요.", d: "for the doctor", k: ["통증은 치료하고, 따뜻하게 해드리고, 도움이 안 되는 검사는 멈출게요", "통증은 치료하고, 청결히 해드리고, 도움이 안 되는 소음은 멈출게요"], a: "tests", o: ["noises", "lights", "smells"]}
  - {t: "곁에 있기", i: home, w: "as much as you'd like로 시간의 한계를 가족이 정하게 해요. 제한을 먼저 말하지 않고 허락부터 해 주면 가족이 마지막 시간을 눈치 보지 않고 보내요.", d: "in the hallway", k: ["원하시는 만큼 밖에 계셔도 돼요", "원하시는 만큼 사진을 찍으셔도 돼요"], a: "with", o: ["without", "against", "under"]}
  - {t: "목표 전환", i: compass, w: "from A to B로 치료의 대상이 바뀐 방향을 한 줄로 보여 줘요. 치료를 그만두는 것이 아니라 대상을 옮기는 것이라고 말하면 가족이 포기로 듣지 않아요.", d: "in the morning", k: ["저희가 치료하는 방법이 달라졌어요 — 병이 아니라 그분이 느끼시는 것을요", "저희가 치료하는 대상이 달라졌어요 — 병이 아니라 그분이 말씀하시는 것을요"], a: "feels", o: ["looks", "says", "eats"]}
  - {t: "포기 아님", i: handshake2, w: "not giving up on her은 가족이 속으로 품은 두려움을 그대로 꺼내 먼저 부정해요. 이어서 differently now로 돌봄은 계속되고 방식만 달라졌다고 말해요.", d: "any more", k: ["포기하는 게 아니라 이제 가족과 함께 돌봐드리는 거예요", "포기하는 게 아니라 다른 방식으로 설명해드리는 거예요"], a: "differently", o: ["rarely", "partly", "briefly"]}
  - {t: "자리 안내", i: home, w: "if you'd like는 권유를 부드럽게 만드는 가정법 어투예요. right by로 의자의 위치를 구체적으로 말해 주면 가족이 찾아 헤매지 않고 바로 곁에 앉을 수 있어요.", d: "behind the curtain", k: ["창문 바로 옆에 의자가 있으니 앉으셔도 돼요", "침대 바로 옆에 담요가 있으니 덮으셔도 돼요"], a: "chair", o: ["table", "blanket", "phone"]}
  - {t: "곁 보장", i: shield, w: "You don't have to는 의무가 없다는 모양이라 떠나야 한다는 오해를 직접 풀어 줘요. 가족이 목표가 바뀌면 면회가 제한된다고 오해할 수 있어서 먼저 말해 줘요.", d: "for the night", k: ["목표가 바뀌었다고 해서 서두르실 필요는 없어요", "의사가 바뀌었다고 해서 떠나실 필요는 없어요"], a: "leave", o: ["sign", "pay", "pack"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "편안함 중심 돌봄 4문장 순서"
    why: "목표를 먼저 말하고, That means로 그 목표가 무엇을 뜻하는지 풀어요. 3줄의 None of this는 앞 두 줄 전체를 가리키고, 4줄의 So는 곁에 있어도 된다는 3줄의 결론을 받아요."
    lines:
    - {en: "Our focus now is her comfort and dignity.", icon: shield, ko: "지금 저희의 초점은 편안함과 존엄이에요", note: "목표"}
    - {en: "That means we treat pain, keep her clean, and stop tests that don't help.", icon: bandage, ko: "그건 통증 치료, 청결, 도움 안 되는 검사 중단을 뜻해요", note: "내용"}
    - {en: "None of this means you have to leave her side.", icon: handshake2, ko: "이 어느 것도 곁을 떠나야 한다는 뜻은 아니에요", note: "오해 방지"}
    - {en: "So please stay as long as you'd like, and I'll bring you a chair.", icon: home, ko: "그러니 원하는 만큼 계세요, 의자를 가져다드릴게요", note: "안내"}
- title: 가족 면회·임종 지지
  s:
  - {t: "허락", i: handshake2, w: "Of course로 가족의 요청이나 망설임에 먼저 흔쾌히 답해요. please hold…and talk…은 명령이 아니라 허락과 권유로 쓰인 요청이에요.", d: "from the bed", k: ["물론이죠 — 손을 잡고 노래를 불러주세요", "물론이죠 — 발을 잡고 말을 걸어주세요"], a: "hold", o: ["wash", "cover", "wave"]}
  - {t: "근거 설명", i: speaker, w: "often은 늘이 아니라 흔히라는 정도라 단정을 피한 정확한 말이에요. so로 앞의 사실을 이유로 삼아 목소리가 중요하다는 결론을 이어요.", d: "in the room", k: ["청각은 마지막까지 남는 감각이라 손길이 중요해요", "시각은 마지막까지 남는 감각이라 목소리가 중요해요"], a: "matters", o: ["changes", "hurts", "fades"]}
  - {t: "곁에 대기", i: bell, w: "right outside로 멀지 않다는 거리를 알려 줘요. if you need anything at all로 부탁의 범위를 제한하지 않아서 가족이 작은 일도 요청해도 된다고 느껴요.", d: "for a moment", k: ["필요하신 게 있으면 언제든 바로 안에 있을게요", "필요하신 게 있으면 언제든 바로 옆에 있을게요"], a: "outside", o: ["upstairs", "downstairs", "overseas"]}
  - {t: "면회 시간", i: calendar, w: "as long as you'd like로 기간을 가족이 정하게 하고, day or night로 시간대 제한도 없다고 확인해 줘요. 면회 시간 규칙이 따로 있을 수 있어서 분명히 말해 주면 가족이 안심해요.", d: "for dinner", k: ["밤이든 낮이든 원하시는 만큼 곁에서 주무셔도 돼요", "주말이든 평일이든 원하시는 만큼 곁에 계셔도 돼요"], a: "stay", o: ["pay", "shop", "drive"]}
  - {t: "감정 허용", i: faceWorried, w: "it's all right to…를 두 번 반복해 울음과 웃음을 똑같이 허용해요. 슬픔 속의 웃음도 괜찮다고 말해 주면 가족이 감정을 눌러 참지 않아요.", d: "for a while", k: ["우셔도 괜찮고, 그분을 떠올리며 노래하셔도 괜찮아요", "쉬셔도 괜찮고, 그분을 떠올리며 웃으셔도 괜찮아요"], a: "remembering", o: ["forgetting", "blaming", "leaving"]}
  - {t: "말 걸기 권유", i: speech, w: "even quietly로 큰 소리나 긴 말이 필요 없다고 문턱을 낮춰 줘요. still은 반응이 보이지 않아도 의미가 있다는 뜻을 담아요.", d: "to the nurse", k: ["조용히 손을 잡아드리는 것만으로도 그분께 위안이 돼요", "조용히 말을 걸어드리는 것만으로도 가족분께 위안이 돼요"], a: "quietly", o: ["slowly", "rarely", "loudly"]}
  - {t: "환경 조성", i: bulb, w: "dim과 keep…calm 두 동사로 환경을 직접 바꾸겠다고 약속해요. for you both로 환자뿐 아니라 곁의 가족도 배려한다고 말해요.", d: "for the visitors", k: ["커튼을 닫고 두 분 모두를 위해 차분한 환경을 만들어드릴게요", "조명을 낮추고 두 분 모두를 위해 따뜻한 차를 준비해드릴게요"], a: "calm", o: ["busy", "loud", "bright"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "임종 면회 지지 4문장 순서"
    why: "곁에 머물러도 된다고 허락한 뒤, 말을 걸라고 권하고, 3줄에서 조용한 말도 괜찮다고 낮춰 줘요. 4줄의 those quiet moments는 3줄의 quiet words를 가리켜서 순서가 하나예요."
    lines:
    - {en: "You're welcome to stay by her side as long as you'd like.", icon: home, ko: "원하시는 만큼 곁에 계셔도 돼요", note: "허락"}
    - {en: "Hearing is often the last sense to go, so please keep talking to her.", icon: speaker, ko: "청각은 마지막까지 남으니 계속 말을 걸어주세요", note: "권유"}
    - {en: "Even quiet words can comfort her.", icon: speech, ko: "조용한 말도 위안이 돼요", note: "격려"}
    - {en: "I'll keep the room calm for those quiet moments with her.", icon: bulb, ko: "그 조용한 시간을 위해 방을 차분하게 해드릴게요", note: "환경"}
- title: 사후 처치·존엄 관리
  s:
  - {t: "작별 시간", i: home, w: "all the time you need로 시간을 가족이 정하게 해요. 사후에는 병원 일정이 앞서기 쉬워서, 시간부터 허락하는 말이 가족에게 큰 배려가 돼요.", d: "before the doctor", k: ["마지막 사진 찍으실 시간, 필요하신 만큼 충분히 가지세요", "기도하실 시간, 필요하신 만큼 충분히 가지세요"], a: "goodbye", o: ["hello", "sorry", "please"]}
  - {t: "돌봄 약속", i: shield, w: "gently and respectfully 두 부사로 어떻게 돌보는지를 말해요. 사후에도 환자를 사람으로 대한다는 약속이라 가족이 마음을 놓아요.", d: "at the bedside", k: ["다정하고 정중하게 그분의 가족을 돌봐드릴게요", "빠르고 정중하게 그분을 돌봐드릴게요"], a: "gently", o: ["quickly", "briefly", "coldly"]}
  - {t: "관습 존중", i: compass, w: "Let me know if…는 요청이 아니라 가족이 말할 기회를 여는 모양이에요. honor는 존중하고 따른다는 동사라, 가족의 관습이 병원 절차에 밀리지 않는다는 뜻을 담아요.", d: "for the staff", k: ["지켜드리고 싶은 약속이 있으면 말씀해주세요", "지켜드리고 싶은 식사가 있으면 말씀해주세요"], a: "customs", o: ["debts", "fees", "complaints"]}
  - {t: "시간 보장", i: shield, w: "no rush at all로 서두르지 않는다는 점을 분명히 하고, 뒤의 take as long as you need로 시간의 결정권을 가족에게 줘요. 같은 뜻을 두 번 말해 가족이 마음 놓고 머물게 해요.", d: "before noon", k: ["전혀 걱정하실 것 없어요 — 필요하신 만큼 시간을 가지세요", "전혀 서두르실 것 없어요 — 필요하신 만큼 물을 드세요"], a: "rush", o: ["doubt", "cost", "charge"]}
  - {t: "처치 설명", i: bandage, w: "before anyone else comes in으로 다른 사람이 보기 전에 끝낸다는 순서와 이유를 알려요. carefully는 몸을 함부로 다루지 않겠다는 뜻이에요.", d: "in the morning", k: ["다른 분들이 들어오시기 전에 조심스럽게 눕히고 옷을 입혀드릴게요", "다른 분들이 나가신 뒤에 조심스럽게 씻기고 옷을 입혀드릴게요"], a: "carefully", o: ["quickly", "loudly", "roughly"]}
  - {t: "선택 존중", i: handshake2, w: "stay…or step out으로 두 선택을 같은 무게로 열어 줘요. whatever feels right로 결정을 가족의 마음에 맡겨요. 어느 쪽도 틀리지 않아요.", d: "for you", k: ["제가 이 일을 끝낸 뒤에 곁에 계셔도 되고, 잠시 나가 계셔도 돼요 — 편하신 대로요", "제가 이 일을 하는 동안 곁에 계셔도 되고, 잠시 앉아 계셔도 돼요 — 편하신 대로요"], a: "welcome", o: ["required", "forced", "afraid"]}
  - {t: "존중 약속", i: star, w: "the same … as before로 죽음 전과 후를 비교해 존중이 변하지 않는다고 말해요. after death라는 말을 돌려 말하지 않고 쓰면 가족이 지금 상황을 정확히 이해하는 데 도움이 돼요.", d: "in the room", k: ["돌아가신 후에도 살아계실 때와 같은 존중으로 가족을 대해드릴게요", "돌아가신 날에도 살아계실 때와 같은 존중으로 대해드릴게요"], a: "respect", o: ["speed", "volume", "noise"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "사후 돌봄 안내 4문장 순서"
    why: "작별 시간을 먼저 주고, 준비되면 몸을 정리하겠다고 알리고, 3줄의 that은 그 정리를, 4줄의 Whatever you choose는 3줄의 두 선택을 가리켜요. 앞 줄이 뒤 줄의 전제라 순서가 하나예요."
    lines:
    - {en: "Please take all the time you need to say goodbye.", icon: home, ko: "작별인사 할 시간을 충분히 가지세요", note: "시간"}
    - {en: "When you're ready, I'll clean and dress him carefully.", icon: bandage, ko: "준비되시면 조심스럽게 씻기고 옷을 입혀드릴게요", note: "안내"}
    - {en: "You're welcome to stay with me while I do that, or step out.", icon: handshake2, ko: "제가 하는 동안 곁에 계셔도, 나가 계셔도 돼요", note: "선택"}
    - {en: "Whatever you choose, we'll treat him with the same respect as before.", icon: star, ko: "어느 쪽이든 예전과 같은 존중으로 대할게요", note: "약속"}
- title: 목표설정 회의 소통 지원
  s:
  - {t: "쉬운 설명", i: speech, w: "Let me는 허락을 구하듯 설명을 시작하는 모양이라 앞 설명이 어려웠다는 지적처럼 들리지 않아요. plainer는 plain의 비교급으로 앞서 쓴 말보다 쉬운 말로 바꾸겠다는 뜻이에요.", d: "for the team", k: ["그걸 더 짧은 말로 정리해드릴게요", "그걸 더 자세한 말로 설명해드릴게요"], a: "plainer", o: ["harder", "longer", "fancier"]}
  - {t: "상태 전달", i: stetho, w: "is saying으로 한 사람의 의견이 아니라 팀의 공통된 판단이라고 전달해요. as we'd hoped는 기대와 다르다는 사실을 완곡하게 말하지만, aren't recovering으로 내용은 숨기지 않아요.", d: "from the ICU", k: ["간호사들은 장기 기능이 바라던 만큼 회복되고 있지 않다고 말하고 있어요", "팀에서는 콩팥 기능이 바라던 만큼 회복되고 있지 않다고 말하고 있어요"], a: "hoped", o: ["feared", "guessed", "promised"]}
  - {t: "질문 돕기", i: speech, w: "can I help you ask는 질문을 대신하는 게 아니라 가족이 직접 묻도록 돕는 모양이에요. right now로 지금 바로 준비할 수 있다고 알려 주면 회의 중에 말문이 막히지 않아요.", d: "for the team", k: ["지금 의사 선생님께 여쭤보고 싶은 질문, 제가 기록해드릴게요", "지금 간호사에게 여쭤보고 싶은 질문, 제가 도와드릴게요"], a: "doctor", o: ["pharmacist", "landlord", "driver"]}
  - {t: "쉬운 설명", i: board, w: "In simple words로 시작해 지금부터 쉽게 말하겠다고 신호를 줘요. despite로 치료를 했는데도 나아지지 않는다는 대비를 한 단어로 알려요.", d: "after the surgery", k: ["쉽게 말하면, 치료에도 불구하고 호흡이 나아지고 있지 않은 거예요", "쉽게 말하면, 치료에도 불구하고 식사가 나아지고 있지 않은 거예요"], a: "simple", o: ["medical", "technical", "formal"]}
  - {t: "재질문 허용", i: check, w: "It's okay to…로 허락을 직접 말해 가족이 되묻는 것을 미안해하지 않게 해요. more than once는 두 번 이상이라는 표현이라 횟수 제한이 없다는 뜻이에요.", d: "to the nurse", k: ["같은 질문을 여러 번 적으셔도 괜찮아요", "같은 질문을 아침에 물으셔도 괜찮아요"], a: "once", o: ["day", "week", "month"]}
  - {t: "재설명", i: bulb, w: "anything that felt는 가족의 느낌을 기준으로 삼아서 이해하지 못한 것이 가족 탓이 아니게 해요. in the meeting으로 이미 지나간 회의 내용도 다시 설명할 수 있다고 알려요.", d: "after lunch", k: ["회의에서 헷갈리셨던 부분은 무엇이든 다시 적어드릴 수 있어요", "회의에서 힘드셨던 부분은 무엇이든 다시 설명해드릴 수 있어요"], a: "confusing", o: ["boring", "exciting", "interesting"]}
  - {t: "이해 점검", i: check, w: "Let's pause and check…는 함께 멈추는 모양이라 가족만 점검받는 느낌이 들지 않아요. so far로 지금까지의 내용만 확인한다는 범위를 알려 줘요.", d: "with the doctor", k: ["잠시 멈추고 여기까지 질문이 있으신지 확인해볼까요", "잠시 쉬고 여기까지 이해가 되시는지 확인해볼까요"], a: "check", o: ["promise", "pretend", "argue"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "회의 소통 지원 4문장 순서"
    why: "쉬운 말로 바꾸겠다고 예고하고, 쉬운 말로 내용을 전한 뒤, 3줄의 that은 2줄의 내용을 가리켜 이해를 묻고, 4줄은 그 답 뒤에 이어지는 재설명 제안이에요. 앞 줄이 뒤 줄의 전제라 순서가 하나예요."
    lines:
    - {en: "I'm going to put this in plainer terms for you.", icon: speech, ko: "더 쉬운 말로 설명해드릴게요", note: "예고"}
    - {en: "In simple words, his organs are not recovering as we'd hoped.", icon: stetho, ko: "쉽게 말하면 장기가 바라던 만큼 회복되지 않고 있어요", note: "전달"}
    - {en: "Does that make sense so far?", icon: check, ko: "여기까지 이해가 되시나요?", note: "확인"}
    - {en: "If anything is unclear, we can go over it again as many times as you like.", icon: bulb, ko: "헷갈리면 원하는 만큼 다시 짚어볼 수 있어요", note: "제안"}
- title: 연명치료 중단 계획 실행
  s:
  - {t: "계획 개요", i: board, w: "gradually는 한꺼번에가 아니라 단계적으로라는 뜻이고, throughout은 처음부터 끝까지라는 뜻이에요. 중단과 편안함 유지를 한 문장에 묶어 말하면 가족이 중단을 방치로 받아들이지 않아요.", d: "for now", k: ["치료들을 서서히 철회하면서 그동안 계속 따뜻하게 해드릴게요", "치료들을 서서히 철회하면서 그동안 계속 설명해드릴게요"], a: "gradually", o: ["secretly", "angrily", "rarely"]}
  - {t: "1단계", i: pill, w: "First로 순서를 알려서 가족이 각 단계를 예측할 수 있게 해요. that aren't helping him이 어떤 약인지 한정해서 모든 약이 아니라 도움이 안 되는 약만 멈추는 것임을 분명히 해요.", d: "for the team", k: ["다음으로 도움이 안 되는 약물을 중단할게요", "마지막으로 도움이 안 되는 약물을 중단할게요"], a: "medications", o: ["gloves", "bandages", "slippers"]}
  - {t: "우선순위", i: shield, w: "At every step으로 범위를 전 과정으로 넓혀요. comfort is our priority는 간단한 현재형 단정이라 약속이 아니라 변하지 않는 원칙처럼 들려요.", d: "for him", k: ["매 단계마다 안전함이 최우선이에요", "매일 아침 편안함이 최우선이에요"], a: "priority", o: ["problem", "mistake", "exception"]}
  - {t: "2단계", i: gear, w: "when you're ready로 시기를 가족의 준비에 맞춘다고 말해요. 속도를 가족이 쥐고 있다는 뜻이고, 준비되기 전에는 진행하지 않는다는 약속이에요.", d: "after lunch", k: ["다음으로, 가족분들이 모이시면 호흡관을 제거할게요", "마지막으로, 준비되시면 호흡관을 제거할게요"], a: "ready", o: ["tired", "upset", "hungry"]}
  - {t: "증상 관리", i: monitor, w: "treat any discomfort right away는 증상이 보이면 기다리지 않겠다는 약속이에요. watch him closely를 먼저 말하면 증상을 놓치지 않고 알아본다는 전제가 함께 전달돼요.", d: "after the shift", k: ["계속 유심히 살펴보면서 기침이 있으면 바로 완화해드릴게요", "계속 유심히 살펴보면서 구역감이 있으면 바로 완화해드릴게요"], a: "watch", o: ["weigh", "wash", "hold"]}
  - {t: "속도 보장", i: shield, w: "faster than…is ready for는 비교 구문으로 속도의 상한을 가족의 준비에 맞춘다는 뜻이에요. Nothing으로 시작해 어떤 단계도 예외가 아니라고 말해요.", d: "for the team", k: ["가족분들이 원하신 것보다 더 빨리 진행되는 일은 없어요", "가족분들이 준비되신 것보다 더 빨리 설명되는 일은 없어요"], a: "faster", o: ["louder", "stronger", "higher"]}
  - {t: "사전 안내", i: speech, w: "what to expect는 앞으로 무엇이 일어날지라는 명사절이에요. before each step으로 일이 일어난 뒤가 아니라 일어나기 전에 설명한다고 말해서 가족이 놀라지 않게 해요.", d: "after the visit", k: ["각 단계가 있기 전에 무엇을 준비하시면 되는지 미리 설명해드릴게요", "각 단계가 있기 전에 누가 오는지 미리 설명해드릴게요"], a: "expect", o: ["bring", "order", "avoid"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "치료 중단 진행 4문장 순서"
    why: "단계마다 먼저 설명하겠다고 약속하고, First와 Next로 두 단계를 순서대로 말해요. 4줄의 all of it은 앞의 단계들을 가리켜서 마지막에 와요."
    lines:
    - {en: "I'll explain each step to you before it happens.", icon: speech, ko: "각 단계를 일어나기 전에 설명해드릴게요", note: "약속"}
    - {en: "First, we'll stop the medications that aren't helping him.", icon: pill, ko: "먼저 도움이 안 되는 약물을 중단할게요", note: "1단계"}
    - {en: "Next, we'll remove the breathing tube when you're ready.", icon: gear, ko: "다음으로 준비되시면 호흡관을 제거할게요", note: "2단계"}
    - {en: "Through all of it, we'll keep him comfortable.", icon: shield, ko: "그 모든 과정에서 편안하게 해드릴게요", note: "유지"}
