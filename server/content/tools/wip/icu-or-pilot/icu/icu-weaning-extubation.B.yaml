    - Weak cough
    - or heavy secretions
    - would make me cautious
    - about extubating
    - .
    words:
    - w-weakcough
    - w-heavysecretion
    - w-cautious
    - w-extubate
    goal: 2
    tag: 위험 조건
    icon: bell
    why: would는 아직 일어나지 않은 가정이라, 지금 환자가 아니라 판단 기준을 설명하는 말이에요.
