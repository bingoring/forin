    decoy: for the doctor
    distractorsKo:
    - 먼저 진정제를 잠시 멈추고 얼마나 설 수 있는지 봅니다.
    - 먼저 진정제를 잠시 멈추고 얼마나 숨쉴 수 있는지 봅니다.
    blank:
      answer: awake
      options:
