    icon: lab
    ko: 분비물·기침 사정 4문장 순서
    why: 먼저 흡인해서 양을 확인하고, 그 결과를 말한 뒤, 기침 평가를 얹고, 둘을 합쳐 계속 확인하겠다는 말로 닫아요.
    lines:
    - en: I'm suctioning now so we can see how much is really there.
      icon: gear
      ko: 양을 보려고 지금 흡인해요
      note: 흡인
    - en: That tells me his secretions are minimal and clear.
      icon: lab
      ko: 분비물은 적고 맑아요
      note: 결과
    - en: On top of that, he has a strong cough, so he can protect his airway.
      icon: stetho
      ko: 기침도 강해 기도를 지킬 수 있어요
      note: 기침
    - en: With both of those looking good, I'll keep checking every hour before we decide.
      icon: calendar
      ko: 둘 다 좋지만 결정 전 매시간 확인해요
