    goal: 1
    tag: 흡인 설명
    icon: gear
    why: so we can see로 흡인의 목적이 양을 확인하는 것임을 밝히고, now가 지금 진행 중임을 알려요.
    decoy: to the sink
    distractorsKo:
    - 실제로 무슨 색인지 보려고 지금 흡인하고 있어요.
    - 실제로 어디에 있는지 보려고 지금 흡인하고 있어요.
