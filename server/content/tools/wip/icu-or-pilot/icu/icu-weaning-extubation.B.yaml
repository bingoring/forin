    - w-check
    - w-comeoff
    - w-ventilator
    goal: 2
    tag: 확인 이유
    icon: calendar
    why: help us know가 확인은 결정을 돕는 재료라는 뜻이라, 가족이 매일 검사하는 이유를 납득해요.
