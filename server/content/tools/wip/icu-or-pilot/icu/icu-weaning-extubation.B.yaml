    tag: 기침 강도
    icon: stetho
    why: strong enough to ~는 기준을 넘었다는 뜻이라, 강하다는 사실보다 충분하다는 판단을 전해요.
    decoy: for the shift
    distractorsKo:
    - 기침이 충분히 강해서 스스로 소변을 배출할 수 있어요.
    - 기침이 충분히 강해서 스스로 분비물을 닦을 수 있어요.
    blank:
      answer: strong
      options:
      - en: strong
      - en: loud
      - en: wet
      - en: short
  - en: I'll keep checking his secretions every hour before we decide.
    ko: 결정하기 전에 매시간 분비물을 계속 확인할게요.
    chunks:
    - I'll keep checking
    - his secretions
    - every hour
    - before we decide
    - .
    words:
    - w-check
    - w-secretion
    goal: 2
    tag: 지속 확인
    icon: calendar
    why: keep ~ing는 한 번이 아니라 계속한다는 뜻이고, every hour가 간격을 정해 줘요.
    decoy: at the desk
    distractorsKo:
    - 결정하기 전에 매시간 소변을 계속 확인할게요.
    - 퇴근하기 전에 매시간 분비물을 계속 확인할게요.
    blank:
      answer: hour
      options:
      - en: hour
      - en: week
      - en: year
