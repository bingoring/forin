    icon: gear
    ko: 발관 물품 준비 4문장 순서
    why: 전체 목표를 먼저 말하고, 필요한 장비를 열거한 뒤, 그 위에 응급 장비 확인을 얹고, 확인이 끝났다는 말로 시작 신호를 줘요.
    lines:
    - en: Let's get everything ready at the bedside before we extubate.
      icon: gear
      ko: 발관 전에 침상에 모두 준비해요
      note: 목표
    - en: That means the high-flow cannula, with NIV set up as a backup.
      icon: shield
      ko: 고유량 캐뉼라와 예비 NIV예요
      note: 장비
    - en: With that in place, I'll confirm suction and the reintubation kit are within reach.
      icon: siren
      ko: 흡인기와 재삽관 세트가 손닿는지 볼게요
      note: 응급
    - en: Once those are confirmed, we're ready to start.
      icon: check
      ko: 확인되면 시작할 수 있어요
      note: 시작
- title: 분비물·기침력 사정
  sentences:
  - en: His secretions are minimal and clear right now.
    ko: 지금은 분비물이 적고 맑아요.
    chunks:
    - His secretions
    - are minimal
    - and clear
    - right now
    - .
    words:
    - w-secretion
    - w-minimal
    - w-clear
    goal: 1
    tag: 분비물 상태
    icon: lab
    why: minimal과 clear 두 형용사로 양과 상태를 함께 보고하면 발관 판단에 필요한 정보가 한 번에 전해져요.
    decoy: in the bag
    distractorsKo:
    - 지금은 분비물이 적고 끈적해요.
