    goal: 1
    tag: 시험 설명
    icon: stetho
    why: Then은 앞 단계 다음이라는 표시이고, on his own이 기계 도움 없이라는 핵심을 짚어 줘요.
    decoy: by phone
    distractorsKo:
    - 그다음엔 시험 삼아 스스로 숨쉬게 해서 통증이 있는지 봅니다.
