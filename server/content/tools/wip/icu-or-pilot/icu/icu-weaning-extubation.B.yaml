    - w-suction
    - w-backup
    - w-oxygen
    goal: 2
    tag: 준비 완료
    icon: check
    why: Everything's set 뒤에 대시로 목록을 이어서 무엇이 준비됐는지 구체적으로 보고해요.
    decoy: for tonight
    distractorsKo:
    - 침대, 흡인기, 예비 산소까지 다 준비됐어요.
    - 카트, 흡인기, 예비 전원까지 다 준비됐어요.
    blank:
      answer: set
      options:
