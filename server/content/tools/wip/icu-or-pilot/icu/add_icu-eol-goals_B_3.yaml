- title: 인공호흡기 철회 준비
  s:
  - {t: "사전 약물", i: pill, w: "Before 절로 순서를 앞에 놓아 약이 관을 빼기 전에 먼저 준비된다는 점을 알려요. so she stays comfortable로 약의 목적을 붙여 가족이 이유를 알고 받아들여요.", d: "after lunch", k: ["관을 빼기 전에 약을 드려서 따뜻하게 계시도록 할게요", "관을 빼기 전에 약을 드려서 아버님이 편안하게 계시도록 할게요"], a: "comfortable", o: ["alert", "upset", "active"]}
  - {t: "변화 예고", i: stetho, w: "may change로 가능성을 말하고 that's expected로 이상이 아니라 예상된 과정이라고 알려요. we'll manage it으로 가족이 혼자 지켜보는 게 아니라는 점을 이어요.", d: "for a while", k: ["피부색이 달라질 수 있는데 그건 예상된 거예요 — 저희가 조절할게요", "의식이 달라질 수 있는데 그건 예상된 거예요 — 저희가 조절할게요"], a: "expected", o: ["unusual", "unclear", "sudden"]}
  - {t: "곁 보장", i: home, w: "the whole time으로 중단 과정 내내 곁에 있어도 된다고 보장해요. right by her side는 손이 닿는 거리라는 뜻이라 가족이 마지막까지 가까이 함께할 수 있어요.", d: "in the hallway", k: ["문 바로 앞에 계속 계셔도 돼요", "그분 곁, 바로 옆에 이틀 내내 계셔도 돼요"], a: "side", o: ["door", "window", "wall"]}
  - {t: "고통 최소화", i: shield, w: "won't suffer는 단정적인 약속이라 뒤에 근거가 필요해요. we prepare medication before we start가 그 근거로, 시작 전에 약을 준비해 둔다는 구체적인 행동을 말해요.", d: "for the doctor", k: ["혼자 계시지 않을 거예요 — 시작 전에 약을 미리 준비해요", "무서워하시지 않으실 거예요 — 시작 전에 약을 미리 준비해요"], a: "medication", o: ["music", "tea", "paperwork"]}
  - {t: "호흡 설명", i: stetho, w: "may look은 겉모습이 그렇게 보일 수 있다는 추측 표현이에요. but she won't feel that으로 보이는 것과 환자가 느끼는 것을 나눠 말해 가족의 걱정을 덜어요.", d: "to the family", k: ["숨이 불규칙해 보일 수 있지만 가족분은 그걸 느끼지 못하세요", "숨이 불규칙하게 들릴 수 있지만 그분은 그걸 느끼지 못하세요"], a: "feel", o: ["smell", "taste", "copy"]}
  - {t: "용어 설명", i: board, w: "We call this…는 낯선 전문 용어를 가족에게 알려 주는 모양이에요. done slowly and gently로 용어 뒤에 과정의 성격을 쉬운 말로 덧붙여 전문 용어가 차갑게 들리지 않게 해요.", d: "for now", k: ["이 과정을 terminal weaning이라고 하는데, 빠르고 다정하게 진행해요", "이 과정을 terminal weaning이라고 하는데, 천천히 조용하게 진행해요"], a: "process", o: ["machine", "symptom", "schedule"]}
  - {t: "곁 약속", i: monitor, w: "the entire time은 중간에 자리를 비우지 않는다는 뜻을 강조해요. I'm watching으로 진행형을 써서 지금 이 순간에도 지켜보고 있다는 느낌을 줘요.", d: "from the desk", k: ["이 시간 내내 제가 계속 그분을 도와드릴게요", "이 시간 내내 제가 계속 가족분을 지켜보고 있을게요"], a: "entire", o: ["empty", "quiet", "same"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "인공호흡기 철회 안내 4문장 순서"
    why: "약으로 시작한다고 알리고, 관을 뺀 뒤의 변화를 예고하고, 3줄의 all of it은 앞의 과정 전체를 가리켜 곁에 있어도 된다고 말해요. 4줄의 For my part는 3줄의 당신 몫과 대비되는 말이라 마지막에 와요."
    lines:
    - {en: "We'll start by giving her medication so she stays comfortable.", icon: pill, ko: "먼저 약을 드려서 편안하게 계시도록 할게요", note: "약물"}
    - {en: "Once the tube is out, her breathing may change, and that is expected.", icon: stetho, ko: "관을 빼면 호흡이 달라질 수 있는데 예상된 거예요", note: "변화"}
    - {en: "You can stay right by her side through all of it.", icon: home, ko: "그 모든 과정 동안 곁에 계셔도 돼요", note: "곁"}
    - {en: "For my part, I'll be watching her the whole time.", icon: monitor, ko: "저는 내내 그분을 지켜볼게요", note: "약속"}
- title: 임종기 진정·진통 적정
  s:
  - {t: "약 조절", i: pill, w: "titrate는 반응을 보면서 조금씩 양을 맞춘다는 전문 동사예요. until he looks settled로 끝나는 기준이 정해진 양이 아니라 환자의 모습이라고 알려 주면 가족이 안심해요.", d: "for the family", k: ["가족분이 안정되어 보이실 때까지 약물을 적정해드릴게요", "열이 내려 보이실 때까지 약물을 적정해드릴게요"], a: "settled", o: ["hungry", "angry", "dry"]}
  - {t: "목표 설명", i: shield, w: "not to hasten anything으로 약의 목적이 죽음을 앞당기는 것이 아니라고 가족의 가장 큰 걱정을 먼저 풀어 줘요. 목적을 comfort 하나로 말해 가족이 약의 이유를 정확히 이해해요.", d: "for him", k: ["목표는 안전함이지, 서두르는 게 아니에요", "목표는 편안함이지, 바꾸는 게 아니에요"], a: "hasten", o: ["wake", "repeat", "measure"]}
  - {t: "관찰 요청", i: bell, w: "Tell me if you notice…는 가족을 관찰의 동료로 세우는 요청이에요. any sign으로 작은 변화도 말해도 된다고 알려서 가족이 이상한가 망설이지 않아요.", d: "to the doctor", k: ["불편해 보이는 기색이 있으면 의사 선생님께 말씀해주세요", "배고파 보이는 기색이 있으면 저에게 말씀해주세요"], a: "notice", o: ["bring", "sell", "draw"]}
  - {t: "적정 투여", i: pill, w: "just enough는 필요한 만큼만이라는 뜻이라 약을 더 주거나 덜 주는 두 극단을 모두 피한다는 말이에요. to ease는 목적을 나타내는 부정사라 약의 이유가 불편함 완화라고 말해요.", d: "for the family", k: ["기침을 덜어드릴 만큼만 약을 드려요", "통증을 덜어드릴 만큼만 약을 드려요"], a: "restlessness", o: ["happiness", "hunger", "loneliness"]}
  - {t: "의도 설명", i: compass, w: "not trying to … or …로 두 방향을 모두 부정해서 약이 죽음의 시간을 바꾸려는 것이 아니라고 말해요. 앞당긴다는 오해와 늘린다는 오해를 한 문장에서 함께 풀어요.", d: "for the family", k: ["빨리 진행시키거나 멈추려는 게 아니에요", "빨리 정리하거나 늦추려는 게 아니에요"], a: "slow", o: ["shut", "cut", "break"]}
  - {t: "용량 기준", i: stetho, w: "will guide는 몸의 반응이 용량을 이끈다는 뜻이라 정해진 양이 아니라 반응을 보며 맞춘다는 설명이에요. 가족에게 약의 양이 임의로 정해지지 않는다는 점을 알려 줘요.", d: "for the nurse", k: ["차트가 약이 얼마나 필요한지 알려줄 거예요", "그분 몸이 약이 언제 필요한지 알려줄 거예요"], a: "guide", o: ["hide", "block", "cover"]}
  - {t: "가족 존중", i: handshake2, w: "You know him best로 가족의 지식을 전문가의 지식과 같은 무게로 인정해요. so로 그 인정을 요청의 이유로 이어서 가족의 보고가 환자를 위한 것임을 분명히 해요.", d: "to the doctor", k: ["그분을 가장 오래 보셨으니, 알아차리시는 걸 저에게 말씀해주세요", "그분을 가장 잘 아시니, 알아차리시는 걸 의사 선생님께 말씀해주세요"], a: "best", o: ["least", "little", "rarely"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "임종기 진정·진통 설명 4문장 순서"
    why: "목표를 먼저 말하고, So로 그 목표에 맞춘 투여 원칙을 이어요. 3줄의 it은 2줄의 약을, 4줄의 those signs는 3줄의 signs를 가리켜서 순서가 하나예요."
    lines:
    - {en: "The goal is comfort, not to hasten anything.", icon: shield, ko: "목표는 편안함이지, 서두르는 게 아니에요", note: "목표"}
    - {en: "So we give just enough medication to ease his restlessness.", icon: pill, ko: "그래서 불안정함을 덜 만큼만 약을 드려요", note: "원칙"}
    - {en: "His body will show us whether it is enough, through signs like his face and breathing.", icon: stetho, ko: "충분한지는 표정과 호흡 같은 몸의 신호로 알려줘요", note: "신호"}
    - {en: "You can help me read those signs, because you know him best.", icon: handshake2, ko: "그분을 가장 잘 아시니 그 신호를 읽도록 도와주세요", note: "요청"}
- title: 죽음의 질 지표 관리
  s:
  - {t: "사정 항목", i: monitor, w: "face, breathing, and body로 세 가지 관찰 항목을 나열해 어디를 보는지 구체적으로 말해요. any sign of distress로 작은 신호도 놓치지 않는다는 범위를 알려요.", d: "on the chart", k: ["표정과 호흡, 몸 전체를 살펴서 졸린 기색이 있는지 확인해요", "표정과 호흡, 목소리를 살펴서 힘들어하는 기색이 있는지 확인해요"], a: "distress", o: ["pride", "humor", "hunger"]}
  - {t: "상태 해석", i: pill, w: "tells me는 관찰한 것이 판단의 근거라는 모양이에요. 가족이 보는 자세가 왜 중요한지 풀어 줘서 조용히 누운 모습을 걱정하지 않게 돕고, 판단의 근거가 겉모습이라는 점을 분명히 해요.", d: "for the family", k: ["이완된 자세를 보면 방이 따뜻하다는 걸 알 수 있어요", "이완된 자세를 보면 잠이 들었다는 걸 알 수 있어요"], a: "relaxed", o: ["swollen", "bandaged", "painted"]}
  - {t: "계속 조절", i: pill, w: "keep + -ing는 한 번이 아니라 계속 반복한다는 뜻이에요. so she stays peaceful로 조절의 목적을 붙여, 상태가 달라지면 그에 맞춰 계속 바꾼다는 점을 알려 줘요.", d: "for the day", k: ["계속 조절해서 따뜻한 상태를 유지시켜드려요", "계속 조절해서 깨끗한 상태를 유지시켜드려요"], a: "peaceful", o: ["awake", "busy", "restless"]}
  - {t: "조용함 주의", i: faceWorried, w: "doesn't always mean은 항상은 아니라는 정도로 말해서 조용하다고 편안하다고 단정하지 않는 임상 판단을 보여 줘요. so I look closely로 그래서 더 자세히 본다는 행동을 이어요.", d: "for the family", k: ["조용하다고 꼭 잠든 건 아니라서 자세히 살펴봐요", "웃는다고 꼭 편안한 건 아니라서 자세히 살펴봐요"], a: "look", o: ["sit", "stand", "turn"]}
  - {t: "근육 긴장", i: stetho, w: "loose, not tense처럼 반대말을 나란히 두면 무엇이 좋은 신호인지 대비로 보여 줘요. a good sign은 확정이 아니라 신호라는 말이라 과장 없이 안심을 줘요.", d: "on the bed", k: ["손발이 긴장되지 않고 풀려 있는 게 좋은 신호예요", "근육이 긴장되지 않고 풀려 있는 게 중요한 신호예요"], a: "loose", o: ["swollen", "cold", "pale"]}
  - {t: "척도 사용", i: chartup, w: "use A to B로 도구와 목적을 한 문장에 담아요. every hour로 점수를 매시간 반복한다고 말하면 편안함이 느낌이 아니라 규칙적으로 확인되는 지표임을 알려 줘요.", d: "on the chart", k: ["저는 척도를 써서 통증을 매시간 점수화해요", "저는 척도를 써서 가족의 편안함을 매시간 점수화해요"], a: "scale", o: ["menu", "brush", "key"]}
  - {t: "즉시 조절", i: pill, w: "If anything changes로 조건을 가장 넓게 잡아 작은 변화도 포함해요. right away는 기다리지 않고 바로라는 뜻이라 변화에 맞춰 약이 지체 없이 조절된다는 약속이에요.", d: "for the family", k: ["뭔가 변화가 있으면 바로 조명을 조절해요", "소리가 변하면 바로 약을 조절해요"], a: "anything", o: ["everyone", "someone", "nobody"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "편안함 확인 4문장 순서"
    why: "무엇을 보는지 말하고, 편안해 보이는 모습을 근거로 들고, 3줄의 Looking relaxed가 2줄을 받아 겉모습만으로는 부족해서 점수를 매긴다고 말해요. 4줄의 the score는 3줄에서 처음 나와요."
    lines:
    - {en: "I check her face, breathing, and body for any sign of distress.", icon: monitor, ko: "표정, 호흡, 몸에서 힘들어하는 기색을 확인해요", note: "사정"}
    - {en: "A relaxed posture and loose muscles tell me the medication is working.", icon: stetho, ko: "이완된 자세와 풀린 근육은 약이 듣고 있다는 신호예요", note: "해석"}
    - {en: "Looking relaxed is not proof, so I score her comfort on a scale every hour.", icon: chartup, ko: "편안해 보이는 것만으론 증거가 아니라 매시간 점수를 매겨요", note: "척도"}
    - {en: "If the score changes, we adjust the medication right away.", icon: pill, ko: "점수가 바뀌면 바로 약을 조절해요", note: "조절"}
- title: 완화의료팀 협진 연계
  s:
  - {t: "팀 소개", i: hospital, w: "specializes in은 전문 분야를 소개하는 동사 표현이에요. comfort and support로 팀이 하는 일을 먼저 말하면 가족이 완화의료라는 낯선 이름의 뜻을 바로 알 수 있어요.", d: "for the family", k: ["완화의료팀은 편안함과 교육을 전문으로 해요", "소아팀은 편안함과 지지를 전문으로 해요"], a: "specializes", o: ["interferes", "succeeds", "delights"]}
  - {t: "도움 범위", i: handshake2, w: "with를 두 번 반복해 증상과 결정이라는 두 가지 도움을 나란히 보여 줘요. decisions ahead라고 하면 결정은 가족이 앞으로 내릴 것이고 팀이 대신 내리는 게 아님이 드러나요.", d: "for the nurse", k: ["그들이 증상과 앞으로의 일정들을 도와드릴 거예요", "그들이 식사와 앞으로의 결정들을 도와드릴 거예요"], a: "decisions", o: ["schedules", "visitors", "payments"]}
  - {t: "조율 약속", i: handshake2, w: "on the same page는 같은 정보를 공유한다는 관용 표현이에요. I'll coordinate로 누가 무엇을 맡는지 간호사가 맞춘다는 뜻이라 가족이 같은 질문을 여러 번 하지 않아도 돼요.", d: "for tomorrow", k: ["제가 조율해서 모두가 같은 시간에 오시도록 할게요", "제가 조율해서 모두가 같은 방에서 쉬시도록 할게요"], a: "coordinate", o: ["apologize", "volunteer", "interrupt"]}
  - {t: "오해 풀기", i: compass, w: "isn't just for…— it's about…은 오해를 먼저 부정하고 실제 뜻을 말하는 대비 구조예요. quality of life라는 말로 완화의료가 삶을 편안하게 하는 일임을 알려 줘요.", d: "for the family", k: ["완화의료는 임종기만을 위한 게 아니라 삶의 속도에 관한 거예요", "완화의료는 중환자만을 위한 게 아니라 삶의 질에 관한 거예요"], a: "quality", o: ["speed", "price", "season"]}
  - {t: "가족 대화", i: speech, w: "what matters most는 의학적 선택지가 아니라 가족이 중요하게 여기는 가치를 가리켜요. all of you로 환자만이 아니라 가족 모두의 마음을 포함한다고 말해요.", d: "for the nurse", k: ["그들이 가족분들께 무엇이 가장 필요한지 함께 이야기 나눌 수 있어요", "그들이 환자분께 무엇이 가장 중요한지 함께 이야기 나눌 수 있어요"], a: "matters", o: ["changes", "happens", "remains"]}
  - {t: "방문 일정", i: calendar, w: "I'll set up은 일정을 직접 잡아 준다는 약속이에요. today or tomorrow로 범위를 구체적으로 말해 가족이 언제쯤인지 막연하게 기다리지 않아요.", d: "next month", k: ["오늘이나 내일 그들이 전화할 시간을 잡아드릴게요", "오늘이나 내일 의사가 방문할 시간을 잡아드릴게요"], a: "tomorrow", o: ["yesterday", "midnight", "Friday"]}
  - {t: "역할 설명", i: handshake2, w: "work alongside us, not replace는 같은 편에서 함께 일한다는 대비 표현이에요. 새 팀이 오면 기존 간호사가 빠진다고 느끼는 가족이 안심하도록 돌봄이 겹쳐서 이어진다고 알려 줘요.", d: "for the family", k: ["그들의 역할은 저희를 평가하는 게 아니라 함께 일하는 거예요", "그들의 역할은 저희를 대신하는 게 아니라 가족과 함께 일하는 거예요"], a: "alongside", o: ["against", "without", "behind"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "완화의료팀 연계 4문장 순서"
    why: "팀을 소개하고, 2줄의 do that이 아니라 3줄의 To do that이 2줄의 일을 가리켜 방법을 말하고, 4줄의 that conversation은 3줄의 대화를 가리켜서 일정을 묻는 질문이 마지막에 와요."
    lines:
    - {en: "I'd like to bring in the palliative care team.", icon: hospital, ko: "완화의료팀을 연결해드리고 싶어요", note: "소개"}
    - {en: "They specialize in comfort and support for you and for him.", icon: handshake2, ko: "그들은 두 분을 위한 편안함과 지지를 전문으로 해요", note: "역할"}
    - {en: "To do that, they work alongside us and talk with your family about what matters most.", icon: speech, ko: "그러려고 저희와 함께 일하며 가족분들과 가장 중요한 것을 이야기해요", note: "방법"}
    - {en: "Would it help if I set up a time for that conversation today?", icon: calendar, ko: "그 대화를 오늘 하도록 시간을 잡아드릴까요?", note: "제안"}
- title: 문화·종교 임종 요구 반영
  s:
  - {t: "관습 묻기", i: speech, w: "가족을 주어로 what rituals are important to your family라고 물으면 병원 기준이 아니라 가족의 기준에서 묻는다는 뜻이 돼요. Please tell me는 명령이 아니라 정중한 부탁이에요.", d: "for the team", k: ["가족분들께 중요한 음식이 무엇인지 말씀해주세요", "가족분들께 불편한 의례가 무엇인지 말씀해주세요"], a: "rituals", o: ["receipts", "passwords", "deadlines"]}
  - {t: "최선 약속", i: shield, w: "do our best는 반드시라는 보장 대신 최선을 다한다는 약속이라, 병원이 지킬 수 있는 만큼만 말해 신뢰를 잃지 않아요. make space and time으로 공간과 시간이라는 구체적인 것을 마련하겠다고 해요.", d: "for the staff", k: ["그것을 위한 공간과 음식을 마련하도록 최선을 다할게요", "그것을 위한 공간과 시간을 마련하도록 부탁드릴게요"], a: "best", o: ["worst", "fastest", "cheapest"]}
  - {t: "팀 전달", i: bell, w: "let the team know는 가족이 한 말을 직접 전달하겠다는 약속이에요. so we can honor로 전달하는 이유를 붙여 가족이 같은 말을 반복하지 않아도 되게 해요.", d: "for the doctor", k: ["의사에게만 알려서 바라시는 바를 지킬 수 있도록 할게요", "팀에 알려서 바라시는 바를 기록할 수 있도록 할게요"], a: "honor", o: ["review", "print", "copy"]}
  - {t: "존중 표현", i: star, w: "just as much as로 신앙과 의학을 같은 무게로 놓아요. matter to us로 병원이 존중한다는 것을 우리라는 주어로 직접 말해요.", d: "for the family", k: ["신앙과 관습도 음식만큼이나 저희에게 중요해요", "신앙과 관습도 의학만큼이나 가족에게 중요해요"], a: "faith", o: ["fees", "luck", "hobbies"]}
  - {t: "원목·공간", i: compass, w: "if you need 뒤에 chaplain과 specific space를 or로 이어 두 가지 선택지를 보여 줘요. Let us know로 요청하는 부담을 가족에게 두지 않고 먼저 문을 열어 둬요.", d: "for the staff", k: ["상담사나 기도하실 특별한 공간이 필요하시면 알려주세요", "원목이나 쉬실 특별한 공간이 필요하시면 알려주세요"], a: "chaplain", o: ["lawyer", "banker", "tailor"]}
  - {t: "안전 범위", i: shield, w: "as much as we safely can으로 약속의 한계를 안전이라고 정직하게 밝혀요. work around는 의례를 막지 않고 의료 일정을 거기에 맞춰 조정한다는 구동사예요.", d: "for the family", k: ["안전한 범위 안에서 최대한 식사에 맞춰드릴게요", "편한 범위 안에서 최대한 의례에 맞춰드릴게요"], a: "safely", o: ["easily", "rarely", "quietly"]}
  - {t: "평안 묻기", i: faceWorried, w: "what would bring your family peace는 병원이 정한 선택지가 아니라 가족이 말하는 평안을 묻는 열린 질문이에요. right now로 지금 당장 할 수 있는 일을 묻고 있다고 알려요.", d: "for the nurse", k: ["지금 가족분들께 간식을 드릴 수 있는 게 무엇인지 말씀해주세요", "지금 환자분께 평안을 드릴 수 있는 게 무엇인지 말씀해주세요"], a: "peace", o: ["trouble", "noise", "debt"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "문화·종교 요구 반영 4문장 순서"
    why: "먼저 가족에게 묻고, 2줄의 what you've told me가 그 대답을 가리켜 팀에 전하고, 3줄의 Once they know가 팀이 알게 된 뒤를 말해요. 4줄의 any of that은 3줄의 계획을 가리켜서 마지막에 와요."
    lines:
    - {en: "Please tell me what rituals matter most to your family.", icon: speech, ko: "가족분들께 가장 중요한 의례를 말씀해주세요", note: "질문"}
    - {en: "I'll tell the team what you've told me.", icon: bell, ko: "말씀해주신 내용을 팀에 전할게요", note: "전달"}
    - {en: "Once they know, we'll make space and time for those rituals as much as we safely can.", icon: shield, ko: "팀이 알면 안전한 범위에서 의례를 위한 공간과 시간을 마련할게요", note: "계획"}
    - {en: "If any of that isn't possible, I'll tell you honestly and we'll look for another way.", icon: handshake2, ko: "안 되는 게 있으면 솔직히 말씀드리고 다른 방법을 찾을게요", note: "대안"}
- title: 가족 예기 애도 지원
  s:
  - {t: "감정 정상화", i: faceWorried, w: "a normal part of는 그 감정이 정상적인 과정의 일부라고 알려 줘요. 가족의 감정을 고치거나 평가하지 않고 이름만 붙여 주는 모양이에요.", d: "for the family", k: ["지금 느끼시는 감정은 질병에 따르는 정상적인 반응이에요", "지금 느끼시는 피로는 상실에 따르는 정상적인 반응이에요"], a: "normal", o: ["small", "early", "hidden"]}
  - {t: "예기 애도", i: faceWorried, w: "Grieving before goodbye라고 이름을 붙여 작별 전에 슬퍼하는 것이 이상하지 않다고 말해요. very human은 약함이 아니라 사람다움이라는 뜻으로 감정을 긍정해요.", d: "for a while", k: ["작별 후에 슬퍼하는 것은 아주 인간적인 거예요", "작별 전에 미리 걱정하는 것은 아주 인간적인 거예요"], a: "human", o: ["quiet", "brief", "busy"]}
  - {t: "지원 안내", i: handshake2, w: "There are…here로 이 병원 안에 있다고 위치를 말해서 가족이 따로 찾아 나설 필요가 없다는 것을 알려요. to support you로 그들의 목적이 지지라는 점을 분명히 해요.", d: "for the staff", k: ["여기 의사와 원목님들이 지지해드리려고 계세요", "여기 상담사와 원목님들이 안내해드리려고 계세요"], a: "chaplains", o: ["lawyers", "auditors", "plumbers"]}
  - {t: "자책 덜기", i: shield, w: "Nothing is wrong with you로 가족이 스스로를 탓하지 않게 먼저 말해요. grief doesn't wait for…로 슬픔이 죽음 이후에야 시작되는 게 아니라는 사실을 설명해요.", d: "for the family", k: ["잘못된 게 아니에요 — 애도는 장례가 오기를 기다리지 않아요", "아픈 게 아니에요 — 애도는 죽음이 오기를 기다리지 않아요"], a: "wait", o: ["stop", "hide", "break"]}
  - {t: "정상화", i: calendar, w: "heavier than others로 비교급을 써서 무게가 날마다 다르다는 것을 보여 줘요. that's okay too의 too는 앞의 감정도 괜찮고 이것도 괜찮다는 뜻으로 가족의 변동을 허용해요.", d: "for the family", k: ["어떤 날은 더 바쁘실 수 있고, 그것도 괜찮아요", "어떤 밤은 더 힘드실 수 있고, 그것도 괜찮아요"], a: "heavier", o: ["louder", "colder", "whiter"]}
  - {t: "곁 약속", i: handshake2, w: "You don't have to는 의무가 없다는 모양이라 혼자 견뎌야 한다는 부담을 덜어 줘요. we're here with you로 지금 곁에 있다는 현재 사실을 말해 약속을 구체화해요.", d: "for the day", k: ["혼자 기도하지 않으셔도 돼요 — 저희가 곁에 있어요", "혼자 애도하지 않으셔도 돼요 — 저희가 밖에 있어요"], a: "alone", o: ["soon", "early", "long"]}
  - {t: "상담 제안", i: speech, w: "Would it help to…는 권하는 대신 도움이 될지 묻는 정중한 제안이에요. this week로 시기를 가까운 때로 정해 주면 가족이 막연히 미루지 않아요.", d: "for the family", k: ["이번 주에 원목님과 이야기 나눠보시는 게 도움이 될까요?", "다음 주에 상담사와 이야기 나눠보시는 게 도움이 될까요?"], a: "help", o: ["hurt", "cost", "matter"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "예기 애도 지지 4문장 순서"
    why: "감정을 정상이라고 말한 뒤, 2줄의 It이 그 감정을 가리켜 죽음 전에도 시작될 수 있다고 알려요. 3줄의 as it goes on이 2줄의 It을 받고, 4줄의 the heavier days가 3줄에서 처음 나와요."
    lines:
    - {en: "What you're feeling is a normal part of loss.", icon: faceWorried, ko: "지금 느끼시는 건 상실에 따르는 정상적인 일부예요", note: "정상화"}
    - {en: "It can begin long before anyone dies, and nothing is wrong with you for feeling it.", icon: shield, ko: "누가 돌아가시기 훨씬 전에 시작될 수 있고 느끼셔도 잘못이 아니에요", note: "설명"}
    - {en: "Some days will feel heavier than others as it goes on.", icon: calendar, ko: "이어지는 동안 어떤 날은 더 무겁게 느껴질 거예요", note: "예고"}
    - {en: "On the heavier days, would it help to talk with a counselor?", icon: speech, ko: "더 무거운 날에는 상담사와 이야기해보면 도움이 될까요?", note: "제안"}
- title: 장기기증 옵션 소통
  s:
  - {t: "선택지 소개", i: star, w: "some families find meaningful로 모든 가족이 아니라 일부가 느끼는 것이라고 말해서 권유가 아니라 정보로 들려요. an option이라는 말로 선택이라는 점을 분명히 해요.", d: "for the staff", k: ["장기기증은 어떤 가족들에게는 부담스럽게 느껴지는 선택지예요", "장기기증은 어떤 환자들에게는 의미 있게 느껴지는 선택지예요"], a: "option", o: ["opinion", "order", "outcome"]}
  - {t: "전문팀 안내", i: stetho, w: "can explain은 설명해 줄 수 있다는 가능을 말해서 가족이 들을지 말지를 정하게 해요. what it would involve에서 would는 아직 정하지 않은 가정의 일이라는 뜻이에요.", d: "for the family", k: ["전문팀이 그게 어떤 비용인지 설명해드릴 수 있어요", "간호팀이 그게 어떤 과정인지 설명해드릴 수 있어요"], a: "explain", o: ["print", "hide", "mail"]}
  - {t: "압박 없음", i: shield, w: "no pressure로 선택을 강요하지 않는다고 먼저 말해요. we'll follow whatever you decide로 결정권이 가족에게 있고 병원은 그것을 따른다고 분명히 해요.", d: "for the family", k: ["압박은 전혀 없어요 — 결정하시는 대로 알릴게요", "압박은 전혀 없어요 — 결정하시는 때에 따를게요"], a: "pressure", o: ["problem", "charge", "trouble"]}
  - {t: "질문 허용", i: speech, w: "any question과 no wrong time으로 질문의 내용과 시기를 모두 열어 둬요. 민감한 주제는 언제 꺼내도 되는지 몰라 머뭇거리기 쉬워서 시기까지 말해 주는 거예요.", d: "for the staff", k: ["어떤 질문이든 하셔도 되고, 지금 물으시면 안 되는 곳이란 없어요", "어떤 질문이든 적으셔도 되고, 지금 물으시면 안 되는 때란 없어요"], a: "wrong", o: ["short", "cold", "empty"]}
  - {t: "별도 대화", i: handshake2, w: "if you're open to it으로 가족이 원할 때만 한다고 조건을 달아 선택권을 지켜요. separately로 치료팀과 분리된 팀이라는 점을 알려 줘서 치료 결정과 섞이지 않는다는 인상을 줘요.", d: "for the nurse", k: ["기증팀이 원하시면 따로 방문할 수도 있어요", "치료팀이 원하시면 따로 이야기 나눌 수도 있어요"], a: "separately", o: ["together", "publicly", "briefly"]}
  - {t: "돌봄 보장", i: shield, w: "won't change the care는 결정이 어느 쪽이든 돌봄이 같다는 약속이에요. 기증을 선택하면 치료가 소홀해질까 하는 두려움을 직접 풀어 줘요.", d: "for the family", k: ["무엇을 결정하시든 그분이 받는 식사는 달라지지 않아요", "무엇을 결정하시든 가족이 받는 돌봄은 달라지지 않아요"], a: "decide", o: ["hear", "pack", "borrow"]}
  - {t: "시간 보장", i: calendar, w: "Take your time으로 먼저 속도를 가족에게 넘겨요. there's no need to…today로 오늘 안에 답해야 한다는 압박을 직접 없애요.", d: "for the family", k: ["천천히 생각하세요 — 내일 답을 드릴 필요는 없어요", "천천히 생각하세요 — 오늘 서명하실 필요는 없어요"], a: "answer", o: ["leave", "sign", "pay"]}
  order:
    tag: "대화 흐름"
    icon: compass
    ko: "장기기증 안내 4문장 순서"
    why: "선택지로 소개하고, 원하면 설명해 줄 팀이 있다고 알리고, 3줄의 Whatever you decide로 결정권이 가족에게 있음을 확인해요. 4줄의 with it은 3줄의 결정을 가리켜서 마지막에 와요."
    lines:
    - {en: "Donation is an option some families find meaningful.", icon: star, ko: "기증은 어떤 가족에게는 의미 있게 느껴지는 선택지예요", note: "소개"}
    - {en: "A specialized team can explain what it would involve, if you'd like.", icon: stetho, ko: "원하시면 전문팀이 어떤 과정인지 설명해드릴 수 있어요", note: "안내"}
    - {en: "Whatever you decide, we'll follow it, and it won't change his care.", icon: shield, ko: "어떻게 결정하셔도 따르고, 그분의 돌봄은 달라지지 않아요", note: "보장"}
    - {en: "Take your time with it; there's no need to answer today.", icon: calendar, ko: "천천히 생각하세요, 오늘 답하실 필요는 없어요", note: "시간"}
