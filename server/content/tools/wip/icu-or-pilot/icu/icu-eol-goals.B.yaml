situations:
- title: 사전연명의향·DNR 확인
  sentences:
  - en: Your father completed an advance directive and a DNR order.
    ko: 아버님은 사전연명의향서와 DNR 지시를 작성하셨어요.
    chunks:
    - Your father
    - completed
    - an advance directive
    - and a DNR order
    - .
    words:
    - w-father
    - w-complete
    - w-directive
    - w-dnr
    - w-order
    goal: 1
    tag: 문서 확인
    icon: board
    why: completed는 이미 끝난 일을 말하는 과거형이라 아버님이 미리 직접 작성해 둔 문서라는 점이 분명해져요. 환자 본인이 한 일로 말하면 가족이 문서를 병원의 결정이 아니라 본인의 뜻으로 받아들여요.
    decoy: last week
    distractorsKo:
    - 어머님은 사전연명의향서와 DNR 지시를 작성하셨어요
    - 아버님은 사전연명의향서와 DNR 지시를 설명받으셨어요
    blank:
      answer: completed
      options:
      - en: completed
      - en: canceled
      - en: rejected
      - en: postponed
  - en: That means we won't do CPR, but we'll keep him comfortable.
    ko: 그건 심폐소생술은 안 한다는 뜻이지만, 편안하게는 계속 돌봐드릴 거예요.
    chunks:
    - That means
    - we won't do CPR
    - ','
    - but we'll
    - keep him comfortable
    - .
    words:
    - w-mean
    - w-cpr
    - w-keep
    - w-comfortable
    goal: 1
    tag: 범위 설명
    icon: shield
    why: That means로 문서의 말을 풀어 주고, but으로 하지 않는 것과 계속하는 것을 한 문장에 함께 말해요. 중단되는 처치만 말하면 가족이 돌봄 전체가 끝나는 것으로 오해해요.
    decoy: for now
    distractorsKo:
    - 그건 심폐소생술은 안 한다는 뜻이지만, 어머님은 편안하게 계속 돌봐드릴 거예요
    - 그건 심폐소생술은 안 한다는 뜻이지만, 소식은 계속 알려드릴 거예요
    blank:
      answer: comfortable
      options:
      - en: awake
      - en: comfortable
      - en: conscious
      - en: stable
  - en: Let's go through exactly what he asked for and didn't want.
    ko: 그분이 원하신 것과 원치 않으신 것을 정확히 짚어볼게요.
    chunks:
    - Let's go through
    - exactly
    - what he asked for
    - and didn't want
    - .
    words:
    - w-exactly
    - w-ask
    - w-want
    goal: 1
    tag: 문서 대조
    icon: magnify
    why: Let's go through는 함께 하나씩 짚자는 권유 모양이라 일방적인 통보로 들리지 않아요. exactly를 넣으면 대충이 아니라 문서에 적힌 그대로 확인하겠다는 뜻이 돼요.
    decoy: he mentioned
    distractorsKo:
    - 그분이 원하신 것과 원치 않으신 것을 차례로 짚어볼게요
    - 그분이 말씀하신 것과 적으신 것을 정확히 짚어볼게요
    blank:
      answer: exactly
      options:
      - en: quickly
      - en: briefly
      - en: exactly
      - en: roughly
  - en: The chart lists exactly what he did and didn't want.
    ko: 차트에 그분이 원하신 것과 원치 않으신 것이 정확히 나와 있어요.
    chunks:
    - The chart
    - lists exactly
    - what he did
    - and didn't want
    - .
    words:
    - w-chart
    - w-list
    - w-exactly
    - w-want
    goal: 2
    tag: 차트 근거
    icon: board
    why: The chart lists는 근거가 말이 아니라 기록에 있다고 밝히는 모양이에요. 가족의 기억이 아니라 문서를 기준으로 삼으면 의견 충돌 없이 환자의 뜻을 확인할 수 있어요.
    decoy: that he said
    distractorsKo:
    - 차트에 그분이 원하신 것과 원치 않으신 것이 대략 나와 있어요
    - 차트에 그분 가족이 원하신 것과 원치 않으신 것이 정확히 나와 있어요
    blank:
      answer: lists
      options:
      - en: hides
      - en: cancels
      - en: replaces
      - en: lists
  - en: DNR doesn't mean we'll stop treating his pain.
    ko: DNR이라고 해서 통증 치료를 멈춘다는 뜻은 아니에요.
    chunks:
    - DNR doesn't mean
    - we'll stop
    - treating his pain
    - .
    words:
    - w-dnr
    - w-mean
    - w-stop
    - w-treat
    - w-pain
    goal: 2
    tag: 오해 방지
    icon: faceWorried
    why: doesn't mean은 흔한 오해를 먼저 꺼내 바로잡는 모양이에요. DNR이 심폐소생술에 대한 지시일 뿐이라는 점을 분명히 해야 가족이 통증 치료까지 끝난다고 걱정하지 않아요.
    decoy: to wait
    distractorsKo:
    - DNR이라고 해서 통증 치료를 늦춘다는 뜻은 아니에요
    - DNR이라고 해서 면회를 멈춘다는 뜻은 아니에요
    blank:
      answer: stop
      options:
      - en: stop
      - en: delay
      - en: forget
      - en: refuse
  - en: We'll keep treating his pain and keeping him comfortable.
    ko: 통증 치료는 계속하면서 편안하게 해드릴 거예요.
    chunks:
    - We'll keep treating
    - his pain
    - and keeping him
    - comfortable
    - .
    words:
    - w-keep
    - w-treat
    - w-pain
    - w-comfortable
    goal: 2
    tag: 돌봄 약속
    icon: shield
    why: keep 뒤에 -ing를 붙이면 지금 하는 일을 계속한다는 모양이에요. 통증 치료와 편안함 유지를 함께 약속하면 돌봄이 이어진다는 확신이 가족에게 전해져요.
    decoy: from home
    distractorsKo:
    - 통증 치료는 계속하면서 몸을 닦아 드릴 거예요
    - 호흡 치료는 계속하면서 편안하게 해드릴 거예요
    blank:
      answer: keeping
      options:
      - en: asking
      - en: keeping
      - en: leaving
      - en: moving
  - en: Let's confirm the directive matches what your family understands.
    ko: 지시서 내용이 가족분들 이해와 맞는지 함께 확인해볼게요.
    chunks:
    - Let's confirm
    - the directive
    - matches what
    - your family understands
    - .
    words:
    - w-confirm
    - w-directive
    - w-match
    - w-family
    - w-understand
    goal: 2
    tag: 이해 확인
    icon: check
    why: Let's confirm은 가족을 점검하는 말이 아니라 함께 맞춰 보자는 모양이에요. 문서와 가족의 이해가 다를 수 있어서, 지시를 따르기 전에 서로 같은 뜻으로 알고 있는지 확인해요.
    decoy: with the doctor
    distractorsKo:
    - 지시서 내용이 가족분들 기억과 맞는지 함께 확인해볼게요
    - 지시서 내용이 의사 선생님 설명과 맞는지 함께 확인해볼게요
    blank:
      answer: matches
      options:
      - en: follows
      - en: becomes
      - en: matches
      - en: replaces
  order:
    tag: 대화 흐름
    icon: compass
    ko: DNR 지시서 확인 4문장 순서
    why: 지시서를 함께 보자고 시작하고, It says로 내용을 읽은 뒤, That으로 오해를 풀고, all of that으로 가족의 이해와 맞는지 묻는 순서예요. 앞 줄이 뒤 줄이 가리키는 말의 전제라 순서가 하나예요.
    lines:
    - en: I'd like to go over your father's directive with you.
      icon: board
      ko: 아버님의 지시서를 함께 살펴보고 싶어요
      note: 시작
    - en: It says he does not want CPR if his heart stops.
      icon: cross
      ko: 심장이 멈추면 심폐소생술을 원치 않으신다고 적혀 있어요
      note: 내용
    - en: That does not mean we will stop treating his pain.
      icon: shield
      ko: 그렇다고 통증 치료를 멈추는 건 아니에요
      note: 오해 방지
    - en: Does all of that match what your family understands?
      icon: check
      ko: 이 모든 게 가족분들 이해와 맞나요?
      note: 확인
- title: 목표설정 대화 준비 지원
  sentences:
  - en: The team wants to meet so we can plan the next steps together.
    ko: 팀에서 다음 단계를 함께 계획하려고 만나고 싶어 해요.
    chunks:
    - The team wants
    - to meet
    - so we can plan
    - the next steps together
    - .
    words:
    - w-team
    - w-meet
    - w-plan
    - w-step
    - w-together
    goal: 1
    tag: 회의 안내
    icon: handshake2
    why: so we can은 만나는 목적을 함께라는 말로 풀어 주는 모양이에요. 결정을 미리 정해 놓고 통보하는 자리가 아니라 같이 계획하는 자리라고 알리면 가족의 부담이 줄어요.
    decoy: this morning
    distractorsKo:
    - 팀에서 다음 단계를 함께 계획하려고 이야기하고 싶어 해요
    - 팀에서 다음 단계를 함께 계획하려고 방문하고 싶어 해요
    blank:
      answer: plan
      options:
      - en: forget
      - en: plan
      - en: cancel
      - en: avoid
  - en: It helps to think about what matters most to your mother.
    ko: 어머님께 가장 중요한 게 무엇인지 생각해보시면 도움이 돼요.
    chunks:
    - It helps
    - to think about
    - what matters most
    - to your mother
    - .
    words:
    - w-think
    - w-matter
    - w-mother
    goal: 2
    tag: 생각 정리
    icon: bulb
    why: It helps to …는 해야 한다는 지시가 아니라 도움이 되는 방법을 알려 주는 모양이에요. matters most로 환자에게 중요한 것을 떠올리게 하면 회의에서 의학 용어보다 환자의 뜻이 중심이 돼요.
    decoy: to your sister
    distractorsKo:
    - 아버님께 가장 중요한 게 무엇인지 생각해보시면 도움이 돼요
    - 어머님께 가장 편한 게 무엇인지 생각해보시면 도움이 돼요
    blank:
      answer: matters
      options:
      - en: changes
      - en: remains
      - en: matters
      - en: happens
  - en: You can write down any questions you want to ask the doctor.
    ko: 의사 선생님께 묻고 싶은 질문을 적어두셔도 좋아요.
    chunks:
    - You can write down
    - any questions
    - you want to ask
    - the doctor
    - .
    words:
    - w-write
    - w-question
    - w-ask
    - w-doctor
    goal: 1
    tag: 질문 준비
    icon: pencil
    why: write down은 미리 적어 두라는 구동사예요. 가족이 긴장하면 회의 중에 질문을 잊기 쉬워서 적어 두면 묻고 싶은 것을 놓치지 않아요.
    decoy: for the nurse
    distractorsKo:
    - 간호사에게 묻고 싶은 질문을 적어두셔도 좋아요
    - 의사 선생님께 묻고 싶은 질문을 외워두셔도 좋아요
    blank:
      answer: write
      options:
      - en: throw
      - en: cross
      - en: keep
      - en: write
  - en: What would your mother say if she could speak for herself?
    ko: 어머님이 직접 말씀하실 수 있다면 뭐라고 하셨을까요?
    chunks:
    - What would your mother
    - say
    - if she could speak
    - for herself
    - '?'
    words:
    - w-mother
    goal: 2
    tag: 환자 입장
    icon: speech
    why: if she could speak for herself는 사실과 다른 가정을 나타내는 would 문장이에요. 가족이 자기 생각이 아니라 환자 본인의 목소리로 생각하게 해서, 결정을 대신 내려 주지 않고 환자의 뜻을 찾게 돕는 질문이에요.
    decoy: to us
    distractorsKo:
    - 아버님이 직접 말씀하실 수 있다면 뭐라고 하셨을까요?
    - 어머님이 직접 결정하실 수 있다면 어떻게 하셨을까요?
    blank:
      answer: herself
      options:
      - en: herself
      - en: himself
      - en: yourself
      - en: ourselves
  - en: Think about her values, not just the medical options.
    ko: 의학적 선택지보다 그분의 가치관을 먼저 생각해보세요.
    chunks:
    - Think about
    - her values
    - ','
    - not just
    - the medical options
    - .
    words:
    - w-think
    - w-value
    - w-option
    goal: 2
    tag: 가치관
    icon: compass
    why: not just는 앞의 것만이 아니라 뒤의 것도 있다는 모양이에요. 선택지만 비교하면 결정이 어려워서 환자가 어떤 사람이었는지를 먼저 떠올리게 해요.
    decoy: or the cost
    distractorsKo:
    - 의학적 선택지보다 그분의 취미를 먼저 생각해보세요
    - 의학적 선택지보다 그분의 가치관을 나중에 생각해보세요
    blank:
      answer: values
      options:
      - en: reports
      - en: values
      - en: rooms
      - en: habits
  - en: We'll make sure your questions get answered at the meeting.
    ko: 회의에서 질문하신 것에 반드시 답을 드릴게요.
    chunks:
    - We'll make sure
    - your questions
    - get answered
    - at the meeting
    - .
    words:
    - w-question
    - w-answer
    - w-meet
    goal: 1
    tag: 약속
    icon: shield
    why: make sure는 빠뜨리지 않고 챙기겠다는 약속의 모양이에요. 질문에 답이 돌아온다는 확신을 주면 가족이 회의 중에 묻는 것을 덜 망설여요.
    decoy: by tomorrow
    distractorsKo:
    - 회의에서 질문하신 것을 반드시 적어 드릴게요
    - 회의 뒤에 질문하신 것에 반드시 답을 드릴게요
    blank:
      answer: answered
      options:
      - en: repeated
      - en: removed
      - en: answered
      - en: ignored
  - en: There's no wrong question to bring to this meeting.
    ko: 이 회의에 가져오시기에 잘못된 질문이란 없어요.
    chunks:
    - There's no
    - wrong question
    - to bring
    - to this meeting
    - .
    words:
    - w-question
    - w-meet
    goal: 1
    tag: 안심 말
    icon: handshake2
    why: There's no …는 그런 것은 없다고 단정하는 모양이라, 질문해도 된다는 허락을 분명하게 줘요. wrong을 질문 앞에 붙여 질문의 수준을 평가하지 않겠다고 알려요.
