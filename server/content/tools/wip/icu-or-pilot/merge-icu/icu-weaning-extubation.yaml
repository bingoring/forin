situations:
- title: SAT·SBT 개념·일정 이해
  sentences:
  - en: First we pause his sedation to see how awake he can get.
    ko: 먼저 진정제를 잠시 멈추고 얼마나 깰 수 있는지 봅니다.
    chunks:
    - First we pause
    - his sedation
    - to see
    - how awake he can get
    - .
    words:
    - w-pause
    - w-sedation
    - w-awake
    goal: 1
    tag: 진정 중단
    icon: pill
    why: First로 순서를 먼저 못 박고 pause(잠시 멈춤)라고 해야 끊는 게 아니라 일시적이라는 뜻이 가족에게 전해져요.
    decoy: for the doctor
    distractorsKo:
    - 먼저 진정제를 잠시 멈추고 얼마나 설 수 있는지 봅니다.
    - 먼저 진정제를 잠시 멈추고 얼마나 숨쉴 수 있는지 봅니다.
    blank:
      answer: awake
      options:
      - en: awake
      - en: tired
      - en: stable
      - en: weak
  - en: Then we let him breathe on his own for a trial to test his readiness.
    ko: 그다음엔 시험 삼아 스스로 숨쉬게 해서 준비가 됐는지 봅니다.
    chunks:
    - Then we let him breathe
    - on his own
    - for a trial
    - to test
    - his readiness
    - .
    words:
    - w-breathe
    - w-onhisown
    - w-trial
    - w-readiness
    goal: 1
    tag: 시험 설명
    icon: stetho
    why: Then은 앞 단계 다음이라는 표시이고, on his own이 기계 도움 없이라는 핵심을 짚어 줘요.
    decoy: by phone
    distractorsKo:
    - 그다음엔 시험 삼아 스스로 숨쉬게 해서 통증이 있는지 봅니다.
    - 그다음엔 시험 삼아 스스로 숨쉬게 해서 기침이 나는지 봅니다.
    blank:
      answer: readiness
      options:
      - en: readiness
      - en: comfort
      - en: hearing
      - en: weight
  - en: These daily checks help us know when he can come off the ventilator.
    ko: 이 매일의 확인이 언제 인공호흡기를 뗄 수 있는지 알려줍니다.
    chunks:
    - These daily checks
    - help us know
    - when he can
    - come off
    - the ventilator
    - .
    words:
    - w-daily
    - w-check
    - w-comeoff
    - w-ventilator
    goal: 2
    tag: 확인 이유
    icon: calendar
    why: help us know가 확인은 결정을 돕는 재료라는 뜻이라, 가족이 매일 검사하는 이유를 납득해요.
    decoy: to the family
    distractorsKo:
    - 이 매일의 확인이 언제 병실을 옮길 수 있는지 알려줍니다.
    - 이 매일의 확인이 언제 가족이 면회할 수 있는지 알려줍니다.
    blank:
      answer: daily
      options:
      - en: daily
      - en: weekly
      - en: nightly
      - en: monthly
  - en: He's still on the ventilator, but we're checking every day to see if he's ready.
    ko: 아직 인공호흡기를 달고 있지만, 준비됐는지 매일 확인하고 있어요.
    chunks:
    - He's still
    - on the ventilator
    - ', but we''re checking'
    - every day
    - to see if he's ready
    - .
    words:
    - w-ventilator
