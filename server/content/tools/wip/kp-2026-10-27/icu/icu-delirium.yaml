situations:
- title: CAM-ICU 선별 시행
  sentences:
  - en: Let's start CAM-ICU with his baseline mental status.
    ko: 기저 정신 상태부터 CAM-ICU를 시작할게요.
    chunks:
    - Let's start
    - CAM-ICU
    - with his baseline
    - mental status
    - .
    words:
    - w-start
    - w-camicu
    - w-baseline
    - w-mental
    - w-status
    goal: 1
    tag: 선별 시작
    icon: board
    why: Let's …는 함께 시작하자는 제안 모양이에요. with his baseline으로 기준 상태를 먼저 잡아야 이후 변화를 견줄 수 있다는 순서가 보여요.
    decoy: with his family
    distractorsKo:
    - 어제 정신 상태부터 CAM-ICU를 시작할게요.
    - 기저 활력 상태부터 CAM-ICU를 시작할게요.
    blank:
      answer: mental
      options:
      - en: mental
      - en: physical
      - en: nutritional
      - en: social
  - en: First we check for an acute change or a fluctuating course.
    ko: 먼저 급성 변화나 변동하는 경과가 있는지 확인해요.
    chunks:
    - First
    - we check
    - for an acute change
    - or a fluctuating course
    - .
    words:
    - w-check
    - w-acute
    - w-change
    - w-fluctuating
    - w-course
    goal: 1
    tag: 첫 항목
    icon: magnify
    why: First로 순서를 먼저 밝혀 첫 확인 항목임을 알려요. for A or B 한 구조에 두 증상을 묶어 말할 수 있어요.
    decoy: for a sudden fever
    distractorsKo:
    - 다음으로 급성 변화나 변동하는 경과가 있는지 확인해요.
    - 마지막으로 급성 변화나 변동하는 경과가 있는지 확인해요.
    blank:
      answer: fluctuating
      options:
      - en: fluctuating
      - en: stable
      - en: prolonged
      - en: painful
  - en: We check inattention and disorganized thinking next.
    ko: 다음으로 부주의와 사고 와해를 확인해요.
    chunks:
    - We check
    - inattention and disorganized thinking
    - next
    - .
    words:
    - w-check
    - w-inattention
    - w-disorganized
    - w-thinking
    goal: 1
    tag: 다음 항목
    icon: magnify
    why: next를 문장 끝에 두면 앞 항목에 이어 확인한다는 흐름만 알려요. 부주의는 CAM-ICU의 특징 2, 와해된 사고는 특징 4예요(특징 3은 의식 수준).
    decoy: later today
    distractorsKo:
    - 먼저 부주의와 사고 와해를 확인해요.
    - 마지막으로 부주의와 사고 와해를 확인해요.
    blank:
      answer: next
      options:
      - en: next
      - en: first
      - en: again
      - en: daily
  - en: He can't squeeze my hand on the letter A when I ask him to.
    ko: 글자 A가 들릴 때 손을 쥐라고 해도 쥐지 못해요.
    chunks:
    - He can't squeeze
    - my hand
    - on the letter A
    - when I ask him to
    - .
    words:
    - w-squeeze
    - w-ask
    goal: 2
    tag: 관찰 결과
    icon: stetho
    why: on the letter A처럼 검사 조건을 구체적으로 말하면 '주의력이 없다'는 평가가 관찰로 뒷받침돼요. CAM-ICU 주의력 검사는 글자 A가 들릴 때 손을 쥐게 해요.
    decoy: my arm
    distractorsKo:
    - 글자 B가 들릴 때 손을 쥐라고 해도 쥐지 못해요.
    - 글자 A가 들릴 때 손을 놓으라고 해도 놓지 못해요.
    blank:
      answer: letter
      options:
      - en: letter
      - en: number
      - en: color
      - en: shape
  - en: That means the inattention feature is positive.
    ko: 그건 부주의 항목이 양성이라는 뜻이에요.
    chunks:
    - That means
    - the inattention feature
    - is positive
    - .
    words:
    - w-inattention
    - w-feature
    - w-positive
    goal: 2
    tag: 결과 해석
    icon: chartup
    why: That means …는 앞 관찰의 결론을 이끄는 말이에요. positive는 '좋다'가 아니라 그 특징이 '있다'는 검사 용어예요.
    decoy: on the monitor
    distractorsKo:
    - 그건 호흡 항목이 양성이라는 뜻이에요.
    - 그건 기억력 항목이 양성이라는 뜻이에요.
    blank:
      answer: inattention
      options:
      - en: inattention
      - en: orientation
      - en: pain
      - en: vision
  - en: If features 1 and 2, plus 3 or 4, are positive, he screens delirious.
    ko: 1번과 2번 항목에 더해 3번이나 4번이 양성이면 섬망으로 판정돼요.
    chunks:
    - If features 1 and 2
    - ', plus 3 or 4'
    - ', are positive'
    - ', he screens delirious'
    - .
    words:
    - w-feature
    - w-positive
    - w-screen
    - w-delirious
    goal: 2
    tag: 판정 기준
    icon: board
    why: '''plus 3 or 4''를 쉼표 사이에 끼워 꼭 있어야 하는 항목(1·2)과 둘 중 하나면 되는 항목(3·4)을 한 문장에서 갈라요. 급성 변화·변동과 부주의가 모두 있고, 의식 수준 변화나 사고 와해 중 하나가 더 있어야 양성이에요.'
    decoy: at night
    distractorsKo:
    - 1번과 2번 항목에 더해 3번이나 4번이 양성이면 감염으로 판정돼요.
    - 1번과 2번 환자에 더해 3번이나 4번이 양성이면 섬망으로 판정돼요.
    blank:
      answer: features
      options:
      - en: features
      - en: patients
      - en: nurses
      - en: alarms
  - en: I'll document the result and update the team.
    ko: 결과를 기록하고 팀에 알릴게요.
    chunks:
    - I'll document
    - the result
    - and update
    - the team
    - .
    words:
    - w-document
    - w-result
    - w-update
    - w-team
    goal: 2
    tag: 기록·공유
    icon: pencil
    why: document와 update 두 동사를 and로 이어 '남기기'와 '알리기'를 한 약속으로 말해요.
    decoy: with the lab
    distractorsKo:
    - 결과를 기록하고 가족에게 알릴게요.
    - 결과를 출력하고 팀에 알릴게요.
    blank:
      answer: document
      options:
      - en: document
      - en: reread
      - en: print
      - en: copy
  nuance:
  - kind: pair
    words:
    - w-screen
    - w-squeeze
    - w-document
    pairs:
    - - screen
      - for delirium
    - - squeeze
      - my hand on the letter A
    - - document
      - the result
    decoys:
    - the ceiling
    why: screen은 '걸러 보다'라 for delirium과, squeeze는 손을 '꽉 쥐다'라 my hand on the letter A와, document는 결과를 '기록으로 남기다'라 the result와 짝이에요.
  - kind: context
    words:
    - w-delirious
    word: delirious
    ko: 섬망 상태인
    scenes:
    - who: 의료진끼리 보고
      icon: stetho
      en: CAM-ICU positive — he screens delirious.
      ok: true
    - who: 차트 기록
      icon: board
      en: Pt screens delirious on CAM-ICU this shift.
      ok: true
    - who: 딸에게 설명
      icon: me
      en: Your father is delirious and not making sense.
      ok: false
      fix: Your father is confused right now — it's called delirium, and we're looking for the cause.
    why: 의료진끼리는 'screens delirious'가 짧고 정확해요. 가족에게는 'delirious'가 '헛소리한다'처럼 들려 마음을 다치게 하니, 상태를 풀어서 설명해요.
  order:
    tag: 대화 흐름
    icon: compass
    ko: CAM-ICU 시행 4문장 순서
    why: 기준 상태를 먼저 잡고, 특징을 확인해 결과를 해석한 뒤, 마지막에 기록과 공유로 닫아요. 해석은 확인한 내용을 가리켜야 해서 앞뒤가 바뀌지 않아요.
    lines:
    - en: Let's start with his baseline mental status.
      icon: board
      ko: 기저 정신 상태부터 시작해요
      note: 시작
    - en: We check each feature against that baseline.
      icon: magnify
      ko: 그 기준에 비춰 각 항목을 확인해요
      note: 확인
    - en: Those findings tell us whether he screens positive.
      icon: chartup
      ko: 그 결과로 양성인지 알 수 있어요
      note: 해석
    - en: Either way, I'll document it and update the team.
      icon: pencil
      ko: 어느 쪽이든 기록하고 팀에 알릴게요
      note: 공유
