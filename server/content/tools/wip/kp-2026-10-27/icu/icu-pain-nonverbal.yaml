      options:
      - en: tolerating
      - en: silencing
      - en: cleaning
      - en: fighting
  - en: Let's total the score and document it.
    ko: 점수를 합산해서 기록해요.
    chunks:
    - Let's total
    - the score
    - and document it
    - .
    words:
    - w-total
    - w-score
    - w-document
    goal: 2
    tag: 합산·기록
    icon: pencil
    why: Let's total … and document it은 and로 계산과 기록을 한 세트로 묶어요. it은 방금 합친 점수를 가리켜요.
    decoy: the alarms
    distractorsKo:
