situations:
- title: CPOT 통증 사정
  sentences:
  - en: CPOT looks at facial expression, muscle tension, and vent tolerance.
    ko: CPOT는 표정과 근긴장, 인공호흡기 순응을 봐요.
    chunks:
    - CPOT looks
    - at facial expression
    - ', muscle tension'
    - ', and vent tolerance'
    - .
    words:
    - w-cpot
    - w-look
    - w-muscle
    - w-tension
    - w-vent
    - w-tolerance
    goal: 1
    tag: 척도 구성
    icon: chartup
    why: looks at 뒤에 항목을 쉼표로 나열해 척도가 무엇을 보는지 전해요. CPOT는 표정·몸 움직임·근긴장·호흡기 순응(또는 발성)의 네 항목, 0~8점인데 이 문장은 그중 셋을 짚어요. 항목을 명사구로 말하는 것이 차팅 언어와 같아요.
    decoy: urine output
    distractorsKo:
    - CPOT는 표정과 소변량, 인공호흡기 순응을 봐요.
    - CPOT는 표정과 근긴장, 인공호흡기 경보를 봐요.
    blank:
      answer: muscle
      options:
      - en: muscle
      - en: joint
      - en: nerve
      - en: skin
  - en: Let's watch his face and note any rigid muscles.
    ko: 얼굴을 지켜보고 뻣뻣한 근육이 있는지 봐요.
    chunks:
    - Let's watch
    - his face
    - and note
    - any rigid muscles
    - .
    words:
    - w-watch
    - w-rigid
    - w-muscle
    goal: 1
    tag: 관찰 시작
    icon: magnify
    why: Let's …는 함께 하자는 제안이라 지시처럼 들리지 않아요. note any는 있으면 적어 두라는 완곡한 요청이에요.
    decoy: on the monitor
    distractorsKo:
    - 얼굴을 지켜보고 뻣뻣한 팔이 있는지 봐요.
    - 손을 지켜보고 뻣뻣한 근육이 있는지 봐요.
    blank:
      answer: rigid
      options:
      - en: warm
      - en: rigid
      - en: sore
      - en: tired
  - en: His brow is furrowed and he's tensing — that scores points.
    ko: 이마를 찌푸리고 몸에 힘이 들어가 있어요 — 점수에 들어가요.
    chunks:
    - His brow
    - is furrowed
    - and he's tensing
    - — that scores points
    - .
    words:
    - w-brow
    - w-furrow
    - w-tense
    - w-score
    - w-point
    goal: 2
    tag: 점수 기준
    icon: board
    why: that scores points의 that은 앞의 두 관찰을 가리켜요. 원인과 결과를 한 문장에 담는 모양이에요.
    decoy: at the bedside
    distractorsKo:
    - 이마에 땀이 나고 몸에 힘이 들어가 있어요 — 점수에 들어가요.
    - 이마를 찌푸리고 몸을 떨고 있어요 — 점수에 들어가요.
    blank:
      answer: brow
      options:
      - en: chin
      - en: nose
      - en: brow
      - en: lip
  - en: He's fighting the vent a little, so that scores too.
    ko: 인공호흡기와 조금 씨름해도 그것도 점수예요.
    chunks:
    - He's fighting
    - the vent
    - a little
    - ', so that scores too'
    - .
    words:
    - w-fight
    - w-vent
    - w-score
    goal: 2
    tag: 호흡기 순응
    icon: stetho
    why: a little이 약한 정도를 말하고 so that scores too가 약해도 점수에 들어간다는 결론을 이어요. 가벼운 신호도 놓치지 않게 하는 말이에요.
    decoy: for his family
    distractorsKo:
    - 침대와 조금 씨름해도 그것도 점수예요.
    - 인공호흡기와 조금 씨름해도 그것도 경보가 울려요.
    blank:
