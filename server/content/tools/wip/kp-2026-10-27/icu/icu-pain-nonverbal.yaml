    - .
    words:
    - w-cpot
    - w-mean
    - w-pain
    - w-control
    goal: 2
    tag: 점수 해석
    icon: chartup
    why: means 뒤에 isn't … yet을 써서 지금은 조절 전이라는 뜻을 전해요. yet은 앞으로 더 해야 한다는 다음 행동을 암시해요.
    decoy: in the chart
    distractorsKo:
    - CPOT가 4점이면 경련이 아직 조절되지 않은 거예요.
    - CPOT가 1점이면 통증이 아직 조절되지 않은 거예요.
    blank:
      answer: four
      options:
      - en: two
      - en: four
      - en: zero
      - en: one
