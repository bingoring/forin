situations:
- title: 수혈 전 확인·동의
  sentences:
  - en: Two of us will verify the patient ID and unit at the bedside.
    ko: 두 사람이 침상에서 환자 ID와 제제를 확인할 거예요.
    chunks:
    - Two of us
    - will verify
    - the patient ID
    - and unit
    - at the bedside
    - .
    words:
    - w-verify
    - w-unit
    - w-bedside
    goal: 1
    tag: 두 사람 확인
    icon: shield
    why: 독립 이중 확인은 두 사람이 침상에서 직접 해야 해요. 'Two of us'로 시작하면 혼자 하지 않는다는 점이 먼저 전해져요.
    decoy: at the front desk
    distractorsKo:
    - 세 사람이 침상에서 환자 ID와 제제를 확인할 거예요.
    - 네 사람이 침상에서 환자 ID와 제제를 확인할 거예요.
    blank:
      answer: bedside
      options:
      - en: bedside
      - en: nurses' station
      - en: blood bank
      - en: pharmacy
  - en: Let's read his name and date of birth out loud together.
    ko: 이름과 생년월일을 소리 내어 함께 읽어요.
    chunks:
    - Let's read
    - his name
    - and date of birth
    - out loud
    - together
    - .
    words:
    - w-read
    - w-birth
    goal: 1
    tag: 환자 식별
    icon: speech
    why: 이름과 생년월일은 환자 식별에 쓰는 두 가지 식별자예요. 소리 내어 읽으면 눈으로만 볼 때 놓치는 불일치를 잡아내요.
    decoy: and his diagnosis
    distractorsKo:
    - 이름과 생년월일을 소리 내면 불일치가 잘 들려요
    - 이름과 생년월일은 두 가지 식별자예요
    blank:
      answer: date of birth
      options:
      - en: date of birth
      - en: room number
      - en: blood type
      - en: diagnosis
  - en: I'll say the blood type and you check it against the bag.
    ko: 제가 혈액형을 말하면 백에 대조해서 확인해 주세요.
    chunks:
    - I'll say
    - the blood type
    - and you check it
    - against the bag
    - .
    words:
    - w-say
    - w-bloodtype
    - w-check
    - w-bag
    goal: 1
    tag: 백 대조
    icon: check
    why: 한 사람이 말하고 다른 사람이 백 라벨을 보며 확인해야 서로 독립된 확인이 돼요. 'against'는 말한 값을 실물과 맞대 본다는 뜻이에요.
