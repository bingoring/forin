- kind: word
  id: w-calm
  fields:
  - ko
  why: ko '진정시키다'가 w-sedation(진정)과 겹치고 형용사 용법(calm and quiet·calmer)을 못 담는다
- kind: word
  id: w-clear
  fields:
  - ko
  why: 문장 5개 중 3개가 동사(clear his secretions·the material·doesn't clear)라 형용사 ko만으로는 모자라다
- kind: word
  id: w-support
  fields:
