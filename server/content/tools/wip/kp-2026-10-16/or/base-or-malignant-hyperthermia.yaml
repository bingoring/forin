situations:
- title: MH 가족력 선별
  sentences:
  - en: Has any family member reacted badly to anesthesia?
    ko: 가족 중 누군가 마취에 나쁘게 반응한 적이 있나요?
    chunks:
    - Has any family member
    - reacted badly
    - to anesthesia
    - '?'
    words:
    - w-member
    - w-react
    - w-anesthesia
    goal: 1
    tag: 가족력 질문
    icon: board
    why: Has any … reacted는 살면서 한 번이라도 있었는지 묻는 현재완료 모양이에요. any family member로 범위를 넓혀야 환자가 직접 겪지 않은 친척의 마취 사고까지 떠올려요.
    decoy: to antibiotics
    distractorsKo:
    - 가족 중 누군가 수술에 나쁘게 반응한 적이 있나요?
    - 친구 중 누군가 마취에 나쁘게 반응한 적이 있나요?
    blank:
      answer: badly
      options:
      - en: badly
      - en: slowly
      - en: calmly
      - en: happily
  - en: This helps us screen for malignant hyperthermia risk.
    ko: 이건 악성 고열 위험을 선별하는 데 도움이 됩니다.
    chunks:
    - This helps us
    - screen for
    - malignant hyperthermia risk
    - .
    words:
    - w-screen
    - w-mhfull
    - w-risk
    goal: 1
    tag: 이유 설명
    icon: shield
    why: helps us + 동사원형으로 질문하는 목적을 밝히는 모양이에요. 묻는 까닭을 알면 환자가 낯선 가족 병력도 더 열심히 떠올려요.
    decoy: pay for
    distractorsKo:
    - 이건 약물 알레르기 위험을 선별하는 데 도움이 됩니다.
    - 이건 저혈압 위험을 선별하는 데 도움이 됩니다.
    blank:
      answer: risk
      options:
      - en: rate
      - en: risk
      - en: reversal
      - en: therapy
  - en: Any high fevers or muscle problems under anesthesia?
    ko: 마취 중에 고열이나 근육 문제가 있었나요?
    chunks:
    - Any high fevers
    - or muscle problems
    - under anesthesia
    - '?'
    words:
    - w-fever
    - w-muscle
    - w-anesthesia
    goal: 1
    tag: 증상 질문
    icon: faceWorried
    why: Any …?는 Have you had any …?를 줄인 구어 질문이라 짧게 묻고 바로 답을 들을 수 있어요. high fevers와 muscle problems를 함께 말해 두면 MH의 두 대표 증상을 같이 떠올리게 해요.
    decoy: at home
    distractorsKo:
    - 마취 중에 저혈압이나 근육 문제가 있었나요?
    - 마취 중에 고열이나 피부 문제가 있었나요?
    blank:
      answer: muscle
      options:
      - en: bone
      - en: nerve
      - en: muscle
      - en: skin
  - en: I need to ask about your family's medical history before surgery.
    ko: 수술 전에 가족 병력을 여쭤봐야 해요.
    chunks:
    - I need to
    - ask about
    - your family's medical history
    - before surgery
    - .
    words:
    - w-history
    - w-surgery
    goal: 1
    tag: 질문 이유
    icon: pencil
    why: I need to는 내 취향이 아니라 절차상 해야 하는 일이라는 모양이에요. before surgery로 시점을 밝히면 지금 묻는 것이 수술 준비의 일부라는 점이 전해져요.
    decoy: before dinner
    distractorsKo:
    - 입원 전에 가족 병력을 여쭤봐야 해요.
    - 수술 전에 가족 연락처를 여쭤봐야 해요.
    blank:
      answer: history
      options:
      - en: insurance
      - en: expenses
      - en: supplies
      - en: history
  - en: I'll notify the anesthesia team if there's a positive family history.
    ko: 가족력이 있으면 마취팀에 알릴게요.
    chunks:
    - I'll notify
    - the anesthesia team
    - if there's
    - a positive family history
    - .
    words:
    - w-notify
    - w-team
    - w-anesthesia
    - w-history
    goal: 2
    tag: 보고 약속
    icon: bell
    why: I'll은 말하는 순간 정한 약속이라 다음에 일어날 일을 바로 알려 줘요. if there's a positive family history라는 조건을 붙여 병력이 확인될 때 마취팀이 계획을 바꾼다는 흐름이 분명해져요.
    decoy: a positive allergy test
    distractorsKo:
    - 흡연력이 있으면 마취팀에 알릴게요.
    - 수술력이 있으면 마취팀에 알릴게요.
    blank:
      answer: notify
      options:
      - en: notify
      - en: replace
      - en: follow
      - en: visit
  nuance:
  - kind: slider
    words:
    - w-history
    - w-notify
    - w-team
    - w-react
    cue: 'Patient: "My cousin got really hot during an operation once, but nobody ever told us what it was."'
    scale:
    - That's probably nothing — we don't need to bring it up.
    - Thank you — I'll note that and tell the anesthesia team.
    - Then you definitely have malignant hyperthermia — that's a diagnosis.
    answerAt: 1
    why: 정확한 병명을 몰라도 가족이 마취 중 심한 고열을 겪었다면 가족력 양성 가능성으로 보고 마취팀에 알려요. '별일 아니에요'로 넘기지도, 검사 없이 '당신은 MH예요'라고 단정하지도 않아요.
    example: Thank you — I'll note that and tell the anesthesia team.
    exKo: 알려 주셔서 감사합니다 — 기록해 두고 마취팀에 알릴게요.
  - kind: context
    words:
    - w-history
    word: history
    ko: 병력
    scenes:
    - who: 간호사 → 마취과
      icon: speech
      en: Positive family history of MH — her brother had a reaction under anesthesia.
      ok: true
    - who: 마취 전 차트
      icon: board
      en: 'Family history: father with unexplained high fever during surgery.'
      ok: true
    - who: 불안한 환자에게
      icon: me
      en: Your family history is positive for MH, so you're a high-risk patient.
      ok: false
      fix: Because someone in your family reacted badly to anesthesia, we'll plan yours extra carefully.
    why: history는 의료진끼리와 차트에서는 'positive family history'처럼 짧고 정확하게 써요. 환자에게 같은 표현을 그대로 들려주면 '고위험 환자'라는 말만 남아 겁이 나요. 가족에게 어떤 일이 있었는지, 그래서 무엇을 다르게 하는지를 풀어서 말해요.
  order:
    tag: 대화 흐름
