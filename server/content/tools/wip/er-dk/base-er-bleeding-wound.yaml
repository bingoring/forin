    goal: 1
    tag: 출혈 경과
    icon: calendar
    why: How long과 how much를 한 문장에 묶어 시간과 양을 한꺼번에 물어요. 출혈이 시작된 때와 잃은 양은 얼마나 급한지 가르는 첫 정보예요.
