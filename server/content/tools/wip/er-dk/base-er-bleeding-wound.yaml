      pulsatile: '''박동성''이라는 의료진끼리의 말. 환자는 대답하기 어렵다.'
      gushing: '''콸콸 쏟아진다''는 양의 말이라, 박동에 맞춰 나오는지는 묻지 못한다.'
    why: 동맥성인지 가르는 질문은 환자가 눈으로 보고 답할 수 있는 말로 물어야 해요.
