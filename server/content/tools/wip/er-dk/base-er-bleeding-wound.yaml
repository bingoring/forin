- title: 항응고제 지속출혈
  sentences:
  - en: Which blood thinner do you take and when was your last dose?
    ko: 어떤 항응고제를 드시고, 마지막 복용은 언제였나요?
    chunks:
    - Which blood thinner
    - do you take
    - and when
    - was your last dose
    - '?'
    words:
    - w-blood
    - w-thinner
    - w-take
    - w-last
    - w-dose
    goal: 1
    tag: 복용약 문진
    icon: pill
    why: Which…?로 약 이름을 고르게 묻고, last dose로 마지막 복용 시각을 함께 물어요. 약 종류와 마지막 복용 시점은 지혈이 얼마나 어려울지, 효과를 되돌릴 약을 쓸지 정하는 단서예요.
    decoy: how much
    distractorsKo:
    - "어떤 항응고제를 드시고, 마지막 검사는 언제였나요?"
    - "어떤 항응고제를 드시고, 마지막 식사는 언제였나요?"
    blank:
      answer: blood thinner
      options:
      - en: vitamin
      - en: antibiotic
      - en: blood thinner
      - en: painkiller
  - en: We'll check your clotting labs to guide treatment.
    ko: 응고 검사를 확인해서 치료 방향을 정할게요.
    chunks:
    - We'll check
    - your clotting labs
    - to guide treatment
    - .
    words:
    - w-check
    - w-clot
    - w-lab
    - w-guide
    - w-treatment
    goal: 2
    tag: 검사 안내
    icon: lab
    why: to guide treatment로 검사의 목적을 알려 환자가 이유를 납득해요. 응고 검사(PT/INR 등)의 수치가 지혈 약을 쓸지 정하는 데 도움이 돼요.
    decoy: to cut costs
    distractorsKo:
    - "응고 검사를 확인해서 퇴원 시기를 정할게요."
    - "응고 검사를 확인해서 병실 위치를 정할게요."
    blank:
      answer: clotting
      options:
      - en: kidney
      - en: liver
      - en: clotting
      - en: thyroid
  - en: We may give medicine to help your blood clot.
    ko: 혈액이 응고되도록 돕는 약을 드릴 수도 있어요.
    chunks:
    - We may give
    - medicine
    - to help
    - your blood clot
    - .
    words:
    - w-give
    - w-medicine
    - w-help
    - w-blood
    - w-clot
    goal: 2
    tag: 치료 안내
    icon: pill
    why: may give로 약이 확정이 아니라 검사 결과에 따라 쓸 수 있다고 말해요. 항응고제는 종류에 따라 효과를 되돌리는 약이 따로 있어요.
    decoy: to slow your
    distractorsKo:
    - "혈액이 응고되는지 보는 검사를 할 수도 있어요."
    - "혈액이 응고되도록 압박을 더 오래 할 수도 있어요."
    blank:
      answer: clot
      options:
      - en: clot
      - en: thin
      - en: drain
      - en: flow
  - en: I'm on warfarin and it just keeps oozing.
    ko: 저는 와파린을 복용 중인데 계속 배어 나와요.
    chunks:
    - I'm on warfarin
    - and it just
    - keeps oozing
    - .
    words:
    - w-warfarin
    - w-keep
    - w-ooze
    goal: 1
    tag: 환자 호소
    icon: speech
    why: keeps oozing으로 '계속 배어 나온다'는 지속을 말해요. 와파린을 복용 중인 환자의 지속 출혈은 응고 수치(INR)를 확인해야 한다는 신호예요.
    decoy: just stopped
    distractorsKo:
    - "저는 와파린을 복용 중인데 계속 어지러워요."
    - "저는 와파린을 복용 중인데 계속 가려워요."
    blank:
      answer: warfarin
      options:
      - en: Tylenol
      - en: warfarin
      - en: insulin
      - en: metformin
  - en: When did you take your last dose?
    ko: 마지막 약은 언제 드셨나요?
    chunks:
    - When did you
    - take
    - your last dose
    - '?'
    words:
    - w-take
    - w-last
    - w-dose
    goal: 1
    tag: 복용 시각
    icon: calendar
    why: When did you…?로 과거 시점을 곧바로 묻는 가장 짧은 형태예요. 마지막 복용 시각이 약 효과가 얼마나 남았는지 가늠하는 기준이에요.
    decoy: Why did you
    distractorsKo:
    - "마지막 식사는 언제 드셨나요?"
    - "마지막 약은 어디서 드셨나요?"
    blank:
      answer: take
      options:
      - en: miss
      - en: take
      - en: skip
      - en: change
  - en: Your labs will tell us how well your blood clots.
    ko: 검사 결과로 혈액이 얼마나 잘 응고되는지 알 수 있어요.
    chunks:
    - Your labs
    - will tell us
    - how well
    - your blood clots
    - .
    words:
    - w-lab
    - w-tell
    - w-blood
    - w-clot
    goal: 2
    tag: 결과 설명
    icon: lab
    why: how well로 정도를 묻는 의문사 절이에요. 응고 검사 결과가 나오면 그 수치로 약을 쓸지 정해요.
    decoy: how much
    distractorsKo:
    - "검사 결과로 혈액이 얼마나 많은지 알 수 있어요."
    - "소변 검사로 혈액이 얼마나 잘 응고되는지 알 수 있어요."
    blank:
      answer: labs
      options:
      - en: labs
      - en: x-rays
      - en: scans
      - en: vitals
  nuance:
  - kind: slider
    words:
    - w-ooze
    cue: 'Patient: "It''s not pouring — it just keeps slowly seeping through the bandage."'
    scale:
    - ooze
    - flow
    - gush
    answerAt: 0
    why: 천천히 스며 나오면 ooze예요. 항응고제 환자는 작은 상처도 이렇게 오래 배어 나오는 경우가 많아요.
    example: It's been oozing since this morning.
    exKo: 아침부터 계속 배어 나와요.
  - kind: swap
    words:
    - w-thinner
    - w-take
    who: 환자에게 · 복용약 확인
    icon: me
    before:
    - 'Do you take any '
    - anticoagulants
    - '?'
    options:
    - blood thinners
    - anticoagulants
    - blood clotters
    answer: blood thinners
    notes:
      blood thinners: 미국 환자가 흔히 쓰는 말. 항응고제와 항혈소판제를 함께 가리킨다.
      anticoagulants: 의료진의 말. 환자는 자기 약이 여기에 드는지 모를 수 있다.
      blood clotters: 그런 약 이름은 없고, 뜻도 거꾸로(피를 굳히는 약)가 된다.
    why: 환자는 약 이름보다 'blood thinner'로 기억해요. 쉬운 말로 먼저 묻고, 이름은 이어서 확인해요.
    ko: 피를 묽게 하는 약을 드시고 계세요?
  - kind: context
    words:
    - w-lab
    - w-clot
    - w-check
    scenes:
    - who: 의사에게
      icon: stetho
      en: She's on warfarin — can we get a stat INR?
      ok: true
    - who: 검사실 전화
      icon: lab
      en: Can you run the PT/INR on bed 4 first?
      ok: true
    - who: 환자에게
      icon: me
      en: We're sending a PT/INR to evaluate for coagulopathy.
      ok: false
      fix: We'll check a blood test that shows how well your blood is clotting.
    why: INR·coagulopathy는 의료진의 말이에요. 환자에게는 '피가 얼마나 잘 굳는지 보는 피검사'로 말해요.
    word: INR
    ko: 응고 수치
  order:
    tag: 대화 흐름
    icon: compass
    ko: 항응고제 출혈 4문장 순서
    why: 복용약과 마지막 복용 시각을 묻고, 그 정보로 응고 검사를 알리고, 수치가 어떻든 압박은 계속하고, 그 압박에 더해 수치가 응고 약 필요 여부를 정한다고 알려요. 'With that information'·'the numbers'·'that pressure'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Which blood thinner do you take, and when was your last dose?
      icon: pill
      ko: 어떤 항응고제를 드시고 마지막 복용은 언제였나요?
      note: 문진
    - en: With that information, we'll check your clotting labs to guide treatment.
      icon: lab
      ko: 그 정보를 바탕으로 치료 방향을 정하려고 응고 검사를 확인할게요
      note: 검사
    - en: Whatever the numbers are, I'll keep pressing firmly on the wound.
      icon: bandage
      ko: 수치가 어떻든 계속 상처를 단단히 누르고 있을게요
      note: 압박
    - en: On top of that pressure, those numbers decide if you need clotting medicine.
      icon: pill
      ko: 그 압박에 더해, 그 수치로 응고를 돕는 약이 필요한지 정해요
      note: 치료
- title: 동물 교상 감염관리
  sentences:
  - en: We'll clean the bite thoroughly to lower infection risk.
    ko: 감염 위험을 낮추기 위해 물린 부위를 꼼꼼히 세척할게요.
    chunks:
    - We'll clean
    - the bite thoroughly
    - to lower
    - infection risk
    - .
    words:
    - w-clean
    - w-bite
    - w-thorough
    - w-low
    - w-infection
    - w-risk
    goal: 1
    tag: 세척 안내
    icon: bandage
    why: thoroughly로 '꼼꼼히'를 알려 오래 씻는 이유를 납득시켜요. 물린 상처는 입 안 세균이 깊이 들어가서 충분한 세척이 감염 예방의 기본이에요.
    decoy: to raise
    distractorsKo:
    - "출혈 위험을 낮추기 위해 물린 부위를 꼼꼼히 세척할게요."
    - "감염 위험을 낮추기 위해 물린 부위를 꼼꼼히 관찰할게요."
    blank:
      answer: thoroughly
      options:
      - en: barely
      - en: hastily
      - en: lightly
      - en: thoroughly
  - en: Do you know if the dog was vaccinated?
    ko: 그 개가 예방접종을 받았는지 아시나요?
    chunks:
    - Do you know
    - if the dog
    - was vaccinated
    - '?'
    words:
    - w-vaccinate
    goal: 2
    tag: 개 접종 확인
    icon: magnify
    why: if로 예/아니오 대답을 이끌어 확실히 모르면 모른다고 답하기 쉬워요. 개의 광견병 접종 여부와 그 개를 10일 동안 지켜볼 수 있는지가 예방 치료를 가르는 단서예요.
    decoy: when the dog
    distractorsKo:
    - "그 개가 목줄을 하고 있었는지 아시나요?"
    - "그 개가 주인이 있었는지 아시나요?"
    blank:
      answer: vaccinated
      options:
      - en: vaccinated
      - en: washed
      - en: trained
      - en: fed
  - en: You may need rabies prevention and antibiotics.
    ko: 광견병 예방과 항생제가 필요할 수 있어요.
    chunks:
    - You may need
    - rabies prevention
    - and antibiotics
    - .
    words:
    - w-need
    - w-rabies
    - w-prevention
    - w-antibiotic
    goal: 2
    tag: 치료 안내
    icon: pill
    why: may need로 필요할 수 있다고만 말해 결과를 미리 단정하지 않아요. 개 접종 여부와 물린 상황에 따라 광견병 예방 치료와 항생제 사용을 정해요.
    decoy: You can skip
    distractorsKo:
    - "광견병 예방과 상처 소독이 필요할 수 있어요."
    - "광견병 예방과 붕대가 필요할 수 있어요."
    blank:
      answer: antibiotics
      options:
      - en: steroids
      - en: antacids
      - en: stitches
      - en: antibiotics
  - en: A stray dog bit my arm at the park.
    ko: 공원에서 떠돌이 개가 제 팔을 물었어요.
    chunks:
    - A stray dog
    - bit
    - my arm
    - at the park
    - .
    words:
    - w-stray
    - w-bite
    goal: 1
    tag: 환자 설명
    icon: speech
    why: bit은 bite의 과거형이라 이미 일어난 일을 말해요. 떠돌이 개라는 말은 광견병 접종 여부를 알 수 없다는 뜻이라 예방 치료를 더 신중히 따져요.
    decoy: at the zoo
    distractorsKo:
    - "공원에서 이웃집 개가 제 팔을 물었어요."
    - "골목에서 떠돌이 개가 제 팔을 물었어요."
    blank:
      answer: park
      options:
      - en: gym
      - en: office
      - en: park
      - en: pool
  - en: Should I worry about getting rabies?
    ko: 광견병에 걸릴까 봐 걱정해야 하나요?
    chunks:
    - Should I worry
    - about getting
    - rabies
    - '?'
    words:
    - w-worry
    - w-rabies
    goal: 2
    tag: 환자 질문
    icon: faceWorried
    why: Should I worry about…?로 걱정을 그대로 꺼내 묻는 환자의 질문이에요. 광견병은 접종 여부와 노출 상황에 따라 위험이 달라서 단정 대신 위험을 함께 따져 줘요.
    decoy: Should I wait
    distractorsKo:
    - "광견병이 어떻게 퍼지는지 알아야 하나요?"
    - "광견병에 걸릴까 봐 격리해야 하나요?"
    blank:
      answer: rabies
      options:
      - en: measles
      - en: shingles
      - en: mumps
      - en: rabies
  - en: We'll also check your tetanus shot history.
    ko: 파상풍 접종 이력도 함께 확인할게요.
    chunks:
    - We'll also check
    - your tetanus shot
    - history
    - .
    words:
    - w-check
    - w-tetanus
    - w-shot
    - w-history
    goal: 1
    tag: 접종력 확인
    icon: calendar
    why: also로 앞 내용에 하나를 더 얹어 확인 항목을 늘려요. 동물에게 물린 상처는 파상풍 접종력도 함께 보는 것이 일반적이에요.
    decoy: We'll also skip
    distractorsKo:
    - "파상풍 접종 이력도 함께 설명할게요."
    - "파상풍 접종 이력도 함께 기록할게요."
    blank:
      answer: shot
      options:
      - en: shot
      - en: pill
      - en: visit
      - en: fee
  nuance:
  - kind: pair
    words:
    - w-stray
    - w-low
    - w-risk
    pairs:
    - - stray
      - dog
    - - lower
      - the risk
    - - vaccination
      - record
    decoys:
    - the bite
    why: stray dog은 주인 없이 떠도는 개, lower the risk는 위험을 낮추다, vaccination record는 접종 기록 — 동물 교상 문진에서 늘 같이 나오는 짝이에요.
  - kind: swap
    words:
    - w-worry
    - w-rabies
    who: 환자에게 · 광견병 걱정에 답하기
    icon: me
    before:
    - ''
    - Don't worry, you won't get rabies
    - .
    options:
    - That's a fair question — let's go over your risk
    - Don't worry, you won't get rabies
    - Rabies is almost always fatal
    answer: That's a fair question — let's go over your risk
    notes:
      That's a fair question — let's go over your risk: 걱정을 인정하고 함께 위험을 따져 보자는 말.
      Don't worry, you won't get rabies: 개의 접종·관찰 여부를 아직 모르는데 장담하는 거짓 안심.
      Rabies is almost always fatal: 증상이 나타난 광견병은 거의 치명적인 것이 사실이지만, 지금 이 말은 불안만 키운다.
    why: 위험을 판단하기 전에는 장담도, 겁주기도 하지 않아요. 걱정을 받아 주고 함께 확인해요.
    ko: 좋은 질문이에요, 위험이 어느 정도인지 같이 살펴봐요
  order:
    tag: 대화 흐름
    icon: compass
    ko: 동물 교상 관리 4문장 순서
    why: 개의 접종 여부를 묻고, 아는 만큼과 상관없이 세척을 시작하고, 그 세척과 함께 파상풍 접종력을 확인한 뒤, 이 모두를 바탕으로 광견병 예방과 항생제를 안내해요. 'Whatever you know'·'the cleaning'·'all of that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Do you know if the dog was vaccinated?
      icon: magnify
      ko: 그 개가 예방접종을 받았는지 아시나요?
      note: 개 확인
    - en: Whatever you know, we'll clean the bite thoroughly to lower infection risk.
      icon: bandage
      ko: 아시는 만큼과 상관없이 감염 위험을 낮추려고 물린 부위를 꼼꼼히 씻을게요
      note: 세척
    - en: Along with the cleaning, we'll check your tetanus shot history.
      icon: calendar
      ko: 세척과 함께 파상풍 접종 이력도 확인할게요
      note: 접종력
    - en: Based on all of that, you may need rabies prevention and antibiotics.
      icon: pill
      ko: 그 모두를 바탕으로 광견병 예방과 항생제가 필요할 수 있어요
      note: 치료
- title: 사람 교상 특수관리
  sentences:
  - en: Human bites carry a high risk of infection.
    ko: 사람에게 물린 상처는 감염 위험이 높아요.
    chunks:
    - Human bites
    - carry a high risk
    - of infection
    - .
    words:
    - w-human
    - w-bite
    - w-carry
    - w-high
    - w-risk
    - w-infection
    goal: 1
    tag: 위험 설명
    icon: bulb
    why: carry a high risk of…는 '위험을 안고 있다'는 정형 표현이에요. 사람의 입에는 세균이 많아 사람에게 물린 상처는 감염 위험이 높은 상처로 다뤄요.
    decoy: have a low
