    blank:
      answer: bleeding
      options:
      - en: bleeding
      - en: swelling
      - en: hurting
      - en: healing
  - en: Is the blood steady or does it spurt with your pulse?
    ko: 피가 계속 흐르나요, 아니면 맥박에 맞춰 뿜어져 나오나요?
