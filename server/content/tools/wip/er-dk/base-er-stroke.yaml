    - w-eye
    goal: 1
    tag: 팔 처짐
    icon: bandage
    why: 눈을 감게 하는 것은 눈의 도움 없이 팔 위치를 유지하는지 보려는 것이에요. 한쪽 팔이 아래로 처지면 그쪽 위약을 의심해요.
    decoy: behind your back
    distractorsKo:
    - 양팔을 옆으로 쭉 뻗고 눈을 감아 보세요.
    - 양팔을 앞으로 쭉 뻗고 입을 다물어 보세요.
    blank:
