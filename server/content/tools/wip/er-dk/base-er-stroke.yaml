    why: 의료진끼리는 presenting with·facial palsy 같은 임상 표현이 정확하지만, 환자에게는 눈에 보이고 들리는 대로 쉬운 말로 설명해야 해요.
    word: slurred
    ko: 뭉개진
  order:
    tag: 대화 흐름
    icon: compass
    ko: FAST 선별 4문장 순서
    why: 얼굴 확인으로 시작하고, 이어서 팔을 뻗게 하고, 팔을 든 채 말하기를 보고, 마지막에 팔을 내리게 한 뒤 전체 증상이 시작된 시각을 물어요. First가 첫 줄을, While your arms are up이 팔과 말 줄을 잡아 순서가 하나예요.
    lines:
    - en: First, please smile and show me your teeth.
