    - Can you smile
    - and show me
    - your teeth
    - for me
    - '?'
    words:
    - w-smile
    - w-teeth
    goal: 1
    tag: 안면 대칭
    icon: speech
    why: 웃어 보라고 하면 입꼬리가 양쪽 똑같이 올라가는지 바로 비교할 수 있어요. 동작을 말로 시키는 요청이라 환자가 따라 하기 쉬워요.
    decoy: your tongue
    distractorsKo:
    - 미소 지으면서 손을 보여주실 수 있나요?
    - 인사하면서 이를 보여주실 수 있나요?
    blank:
      answer: teeth
      options:
      - en: teeth
      - en: tongue
      - en: gums
      - en: dentures
  - en: Hold both arms straight out and close your eyes.
    ko: 양팔을 앞으로 쭉 뻗고 눈을 감아 보세요.
