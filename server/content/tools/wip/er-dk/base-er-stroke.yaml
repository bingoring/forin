      ko: 팔을 든 채로 제 뒤를 따라 이 문장을 말해 보세요
      note: 말
    - en: Thank you, you can lower your arms. When did all of this begin?
      icon: calendar
      ko: 고마워요, 팔을 내리세요. 이 모든 게 언제 시작됐나요?
      note: 시각
