      - en: honestly
      - en: exactly
      - en: quietly
  nuance:
  - kind: slider
    words:
    - w-numb
    cue: 'Patient: "I can barely feel you touching my cheek. It''s dull, like after the dentist."'
    scale:
    - slightly numb
    - numb
    - no feeling at all
    answerAt: 1
    why: slightly numb은 조금 둔한 정도, numb는 감각이 크게 둔해진 상태(치과 마취 뒤처럼), no feeling at all은 완전한 소실이에요. 환자가 쓰는 말대로 정도를 구분해 기록하세요.
    example: Does one side of your face feel numb?
    exKo: 얼굴 한쪽이 무감각하게 느껴지세요?
