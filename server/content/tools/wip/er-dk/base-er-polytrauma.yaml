    - w-happen
    goal: 1
    tag: 경위 문진
    icon: speech
    why: Can you …?로 부탁하는 형태라 다친 환자도 부담 없이 답해요. 또렷하게 말로 답하면 기도가 열려 있고 의식이 있다는 첫 단서가 돼요.
    decoy: at the scene
    distractorsKo:
    - 이름이 뭐고 언제 일이 있었는지 말씀해 주시겠어요?
    - 나이가 몇이고 무슨 일이 있었는지 말씀해 주시겠어요?
    blank:
      answer: name
      options:
      - en: name
      - en: address
      - en: blood type
      - en: birthday
  - en: Take a deep breath for me — does it hurt to breathe?
