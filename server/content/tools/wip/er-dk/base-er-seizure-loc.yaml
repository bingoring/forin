    chunks:
    - Do you know
    - where
    - you are right now
    - '?'
    words: []
    goal: 2
    tag: 장소 지남력
    icon: hospital
    why: 지금 있는 곳을 묻는 질문은 의식이 또렷한지 가늠하는 지남력 확인의 대표 질문이에요. Do you know…로 시작하면 부드럽게 들려요.
    decoy: from
    distractorsKo:
    - 오늘 아침에 뭘 드셨는지 기억하세요?
