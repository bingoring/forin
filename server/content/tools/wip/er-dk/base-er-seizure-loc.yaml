    - wait for it to stop
    answer: call 911
    notes:
      call 911: 5분 넘는 경련은 응급이다. 구급차를 부르는 것이 표준 귀가 교육이다.
      call us: 병원이나 진료실에 전화하면 치료가 늦어진다. 5분 넘는 경련은 911이다.
      wait for it to stop: 5분이 넘으면 저절로 멎기를 기다리지 않는다.
