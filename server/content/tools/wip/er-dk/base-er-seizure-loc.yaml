  - en: No further seizure activity since arrival.
    ko: 도착 이후 추가 발작 활동은 없습니다.
    chunks:
    - No further
    - seizure activity
    - since arrival
    - .
    words:
    - w-seizure
    - w-arrival
    goal: 1
