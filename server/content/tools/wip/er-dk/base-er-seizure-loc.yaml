    scale:
    - no eye opening
    - to pain
    - to voice
    - spontaneously
    answerAt: 2
    why: GCS 눈 반응은 1점(없음)·2점(통증에)·3점(소리·말에)·4점(자발적)이에요. 이름을 불러야 뜨면 3점 — 스스로 뜨고 있는지, 말에 뜨는지, 통증을 줘야 뜨는지 순서대로 확인해요.
    example: Eyes open to voice — that's a three.
    exKo: 말에 눈을 떠요 — 3점이에요.
  - kind: swap
    words:
    - w-squeeze
    - w-finger
    who: 환자에게 · GCS 운동 반응
    icon: me
    before:
    - 'Can you '
    - demonstrate grip strength
    - ' for me?'
    options:
    - squeeze my fingers
    - demonstrate grip strength
    - grab onto me
    answer: squeeze my fingers
    notes:
      squeeze my fingers: 무엇을 하라는지 분명한 쉬운 지시라 명령 수행을 바로 볼 수 있다.
      demonstrate grip strength: 평가 항목 이름을 그대로 말한 것 — 의식이 흐린 환자는 알아듣기 어렵다.
      grab onto me: 쉽지만 흐리다. 반사적으로 움켜쥐는 것과 구별이 안 된다.
    why: 운동 반응은 쉬운 지시로 확인해요. 반사로 쥐는 것과 가르려면 '쥐었다가 놓아 보세요'까지 시켜 봐요.
    ko: 제 손가락을 쥐어 보시겠어요?
  order:
    tag: 대화 흐름
    icon: compass
    ko: 의식 사정 4문장 순서
    why: 하려는 일을 알리고, 눈 뜨기(눈 반응)로 시작해, 장소를 묻고(언어 반응), 마지막에 손가락 쥐기(운동 반응)로 끝나요. 'Good'·'Thank you'가 앞 대답을 받아 순서가 하나예요.
    lines:
    - en: I'm going to check how awake you are.
      icon: stetho
      ko: 얼마나 깨어 계신지 확인할게요
      note: 예고
    - en: Can you open your eyes for me?
      icon: magnify
      ko: 눈을 떠 보시겠어요?
      note: 눈
    - en: Good. Now tell me where you are.
      icon: hospital
      ko: 좋아요. 이제 여기가 어디인지 말해 주세요
      note: 언어
