    answerAt: 1
    why: 5분을 넘기면 지속상태로 보고 바로 약을 써야 해서 길이가 곧 치료 결정이에요. 겁먹은 목격자는 시간을 실제보다 길게 느끼기 쉬워서, 시계나 휴대폰으로 잰 시간인지 되물어요.
    example: By the clock, the shaking lasted about a minute.
