    goal: 1
    tag: 눈 뜨기
    icon: magnify
    why: for me를 붙이면 명령이 아니라 부탁처럼 들려서 의식이 흐린 환자도 덜 놀라요. 눈 뜨기는 GCS의 첫 항목이에요.
    decoy: your mouth
    distractorsKo:
    - 제 이름을 따라 말해 보시겠어요?
    - 다리를 움직여 보시겠어요?
    blank:
