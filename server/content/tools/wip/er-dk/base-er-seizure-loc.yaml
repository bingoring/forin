    why: 눈과 호흡 소견을 보고하고, 'So'로 호흡을 돕고 날록손을 주겠다고 이어 알리고, 'Even with that'으로 그래도 튜브가 필요한지 보고, 'Either way'로 튜브가 필요하든 아니든 날록손 효과가 풀릴 수 있어 계속 지켜본다고 해요. So·that·Either way가 앞 줄을 가리켜 순서가 하나예요.
    lines:
