    blank:
      answer: once
      options:
      - en: because
      - en: although
      - en: once
      - en: unless
  - en: We'll recheck your sugar to make sure it stays up.
    ko: 혈당이 유지되는지 다시 확인할게요.
    chunks:
    - We'll recheck
    - your sugar
    - to make sure
    - it stays up
    - .
    words:
    - w-recheck
    - w-sugar
    goal: 2
    tag: 재측정
    icon: redo
    why: re-는 '다시'라서 이미 올린 혈당을 다시 재는 거예요. 인슐린이나 당뇨약 때문에 생긴 저혈당은 다시 떨어질 수 있어서 재확인이 중요해요.
    decoy: keep
    distractorsKo:
    - 저혈당 원인을 찾으려고 채혈할게요
    - 식사를 가져다 드릴게요
    blank:
      answer: recheck
      options:
      - en: lower
      - en: raise
      - en: stop
      - en: recheck
  - en: Your blood sugar was very low when you arrived.
    ko: 도착했을 때 혈당이 매우 낮았어요.
    chunks:
    - Your blood sugar
    - was very low
    - when you
    - arrived
    - .
    words:
    - w-blood
    - w-sugar
    - w-low
    - w-arrive
    goal: 1
    tag: 결과 설명
    icon: chartup
    why: 과거형 was로 도착했을 때의 상태라고 구분해요. 지금 상태는 따로 말해 줘야 환자가 헷갈리지 않아요.
    decoy: dropped
    distractorsKo:
    - 혈당이 지금은 정상으로 돌아왔어요
    - 도착했을 때 혈압이 매우 높았어요
    blank:
      answer: arrived
      options:
      - en: arrived
      - en: fainted
      - en: ate
      - en: fell
  - en: You should start waking up soon.
    ko: 곧 정신이 들기 시작하실 거예요.
    chunks:
    - You should
    - start waking up
    - soon
    - .
    words:
    - w-start
    - w-wake
    - w-soon
    goal: 1
    tag: 회복 예고
    icon: star
    why: should는 '그럴 것이다'라는 예상이라 약속보다 부드러워요. 포도당이 들어가면 몇 분 안에 깨어나는 경우가 많아요.
    decoy: getting
    distractorsKo:
    - 정신이 들면 뭘 좀 드시게 할게요
    - 곧 검사실로 이동할 거예요
    blank:
      answer: waking up
      options:
      - en: settling down
      - en: waking up
      - en: calming down
      - en: cooling down
  - en: We're watching for your sugar dropping again.
    ko: 혈당이 다시 떨어지는지 지켜보고 있어요.
    chunks:
    - We're watching
    - for your sugar
    - dropping again
    - .
    words:
    - w-watch
    - w-sugar
    - w-drop
    goal: 2
    tag: 재하락 관찰
    icon: magnify
    why: watching for는 '일어날지 지켜본다'는 뜻이에요. 혈당이 오른 뒤에도 약 효과가 길면 다시 떨어질 수 있어서 계속 봐요.
    decoy: jumping
    distractorsKo:
    - 혈당이 오를 때까지 기다려요
    - 혈당 수치를 기록하고 있어요
    blank:
      answer: dropping
      options:
      - en: spiking
      - en: climbing
      - en: dropping
      - en: rising
  nuance:
  - kind: pair
    words:
    - w-dextrose
    - w-iv
    - w-recheck
    pairs:
    - - IV
      - dextrose
    - - recheck
      - in 15 minutes
    - - make sure it
      - stays up
    decoys:
    - pinpoint
    why: 저혈당 교정의 흐름 그대로예요 — IV dextrose(정맥 포도당)를 주고, 15분 뒤 recheck, 혈당이 stays up(유지되는지)을 확인해요.
  - kind: context
    words:
    - w-sugar
    - w-recheck
    - w-watch
    scenes:
    - who: 동료 간호사에게
      icon: speech
      en: Glucose is up to 142 after the D50 — I'll keep rechecking.
      ok: true
    - who: 환자에게
      icon: me
      en: Your sugar is back up. We'll keep rechecking it, because it can drop again.
      ok: true
    - who: 환자에게
      icon: me
      en: Your BG has normalized; we'll recheck and trend it for recurrent hypoglycemia.
      ok: false
      fix: Your sugar is back up, and we'll keep rechecking it in case it drops again.
    why: BG·trend·recurrent hypoglycemia는 의료진의 말이에요. 설포닐우레아나 장시간형 인슐린 때문이면 다시 떨어질 수 있어 계속 재는데, 환자에게는 그 이유를 쉬운 말로 알려요.
    word: recheck
    ko: 다시 확인하다
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저혈당 혼수 교정 4문장 순서
    why: 포도당을 주고, 'That'이 가리키는 처치로 곧 깨어날 것이라 알리고, 의식이 돌아오면 이름을 말하게 하고, 'Good, you're answering'으로 받아 그래도(still) 혈당은 계속 재확인한다고 잇는 순서예요. That과 Good이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: We're giving IV dextrose to raise your sugar.
      icon: pill
      ko: 혈당을 올리려고 정맥으로 포도당을 드리고 있어요
      note: 투여
    - en: That should help you wake up soon.
      icon: star
      ko: 그러면 곧 정신이 들 거예요
      note: 예고
    - en: Tell me your name once you can hear me.
      icon: speaker
      ko: 제 말이 들리면 이름을 말해 주세요
      note: 확인
    - en: Good, you're answering — we'll still keep rechecking your sugar.
      icon: redo
      ko: 좋아요, 대답하시네요. 그래도 혈당은 계속 다시 확인할게요
      note: 재측정
- title: 발작 후 급성 결손
  sentences:
  - en: Can you lift your left arm at all?
    ko: 왼팔을 조금이라도 들어보시겠어요?
    chunks:
    - Can you lift
    - your left arm
    - at all
    - '?'
    words:
    - w-lift
    - w-arm
    - w-left
    goal: 1
    tag: 팔 들기
    icon: me
    why: at all은 '조금이라도'라서 힘이 거의 없는 환자도 시도하게 해요. 한쪽 약화는 뇌졸중과 발작 후 약화에서 모두 볼 수 있어서 좌우를 구분해 물어요.
    decoy: sore
    distractorsKo:
    - 오른쪽 다리를 움직여 보시겠어요?
    - 얼굴을 웃는 모양으로 해 보시겠어요?
    blank:
      answer: left
      options:
      - en: bad
      - en: tired
      - en: left
      - en: right
  - en: Is the weakness getting better or staying the same?
    ko: 약해진 게 나아지고 있나요, 그대로인가요?
    chunks:
    - Is the weakness
    - getting better
    - or staying
    - the same
    - '?'
    words:
    - w-weak
    goal: 1
    tag: 변화 추이
    icon: chartup
    why: better와 the same을 함께 제시해 변화를 있는 그대로 말하게 해요. 발작 후 약화는 대개 시간이 가며 나아져요.
    decoy: slowly
    distractorsKo:
    - 처음 약해진 게 언제인가요?
    - 말이 어눌해진 것 같나요?
    blank:
      answer: weakness
      options:
      - en: numbness
      - en: headache
      - en: pain
      - en: weakness
  - en: We need a scan to rule out a stroke.
    ko: 뇌졸중을 배제하려면 스캔이 필요해요.
    chunks:
    - We need
    - a scan
    - to rule out
    - a stroke
    - .
    words:
    - w-scan
    - w-stroke
    goal: 2
    tag: 영상 이유
    icon: monitor
    why: rule out은 '아닌지 확인해 배제한다'는 뜻이라 뇌졸중이라고 단정하지 않아요. 발작 후 약화와 뇌졸중은 치료가 달라서 영상으로 구분해요.
    decoy: heart
    distractorsKo:
    - 심전도부터 먼저 찍을게요
    - 혈당부터 먼저 잴게요
    blank:
      answer: stroke
      options:
      - en: stroke
      - en: fracture
      - en: tumor
      - en: sprain
  - en: Can you squeeze my hand with your left hand?
    ko: 왼손으로 제 손을 쥐어보시겠어요?
    chunks:
    - Can you squeeze
    - my hand
    - with your
    - left hand
    - '?'
    words:
    - w-squeeze
    - w-left
    goal: 1
    tag: 악력 확인
    icon: me
    why: 손으로 쥐어 보게 하면 힘의 차이를 바로 비교할 수 있어요. 왼손이라고 정해 주면 좌우 차이를 놓치지 않아요.
    decoy: by
    distractorsKo:
    - 오른쪽 다리를 들어 보시겠어요?
    - 제 손가락을 눈으로 따라가 보시겠어요?
    blank:
      answer: with
      options:
      - en: under
      - en: with
      - en: 'on'
      - en: from
  - en: If this is from the seizure, the weakness usually improves within a day or two.
    ko: 발작 때문이라면 이 약화는 대개 하루 이틀 안에 나아져요.
    chunks:
    - If this is
    - from the seizure
    - ', the weakness'
    - usually improves
    - within a day or two
    - .
    words:
    - w-weak
    - w-improve
    goal: 2
    tag: 경과 설명
    icon: star
    why: If로 가능성을 열어 두고 usually로 확답을 피해요. 발작 후 국소 약화는 대개 수 시간에서 수일 안에 회복돼요.
    decoy: soon
    distractorsKo:
    - 약화가 심해지면 바로 알려 주세요
    - 검사 결과는 의사 선생님이 설명할 거예요
    blank:
      answer: usually
      options:
      - en: always
      - en: rarely
      - en: usually
      - en: never
  - en: Even if it's improving, we still need to rule out a stroke.
    ko: 좋아지고 있어도 뇌졸중은 꼭 배제해야 해요.
    chunks:
    - Even if
    - it's improving
    - ', we still need'
    - to rule out
    - a stroke
    - .
    words:
    - w-stroke
    - w-improve
    goal: 2
    tag: 배제 필요
    icon: shield
    why: Even if…, we still…로 좋아지고 있어도 검사가 필요한 이유를 양보 구문으로 말해요. 좋아지는 것만으로 뇌졸중이 아니라고 단정하지 않아요.
    decoy: also
    distractorsKo:
    - 스캔 전까지는 아무것도 드시지 마세요
    - 약화가 있으면 운전은 하지 마세요
    blank:
      answer: improving
      options:
      - en: spreading
      - en: worsening
      - en: returning
      - en: improving
  nuance:
  - kind: slider
    words:
    - w-weak
    - w-arm
    cue: He can lift his arm off the bed, but can't hold it up against your hand.
    scale:
    - 0/5 no movement
    - 2/5 moves but not against gravity
    - 3/5 against gravity only
    - 4/5 against some resistance
    - 5/5 normal
    answerAt: 2
    why: 근력은 0~5점으로 적어요. 중력을 이기고 들지만 손으로 누르는 저항은 못 이기면 3/5예요. 점수로 적어 두면 좋아지는지 나빠지는지 다음 사람이 바로 비교할 수 있어요.
    example: Left arm strength is three out of five.
    exKo: 왼팔 근력은 5점 중 3점이에요.
  - kind: context
    words:
    - w-stroke
    - w-scan
    scenes:
    - who: 환자에게
      icon: me
      en: We need a scan to make sure this isn't a stroke.
      ok: true
    - who: 의사에게 보고
      icon: stetho
      en: New left arm weakness after the seizure — we need to rule out a stroke.
      ok: true
    - who: 환자에게
      icon: me
      en: We need neuroimaging to exclude an acute ischemic stroke.
      ok: false
      fix: We need a scan to make sure this isn't a stroke.
    why: neuroimaging·acute ischemic은 의료진의 말이에요. 발작 뒤 마비는 Todd 마비일 수 있지만 뇌졸중을 배제하기 전에는 단정하지 않고, 환자에게는 왜 스캔하는지를 쉬운 말로 알려요.
    word: stroke
    ko: 뇌졸중
  order:
    tag: 대화 흐름
    icon: compass
    ko: 발작 후 약화 사정 4문장 순서
    why: 팔을 들어 보게 하고, 'Good. Now'로 손 쥐기를 이어 비교하고, 'like that'으로 그런 약화가 대개 나아진다고 설명하고, 'Even so'로 그래도 뇌졸중 배제가 필요하다고 닫아요. Good. Now·Even so가 순서를 고정해요.
    lines:
    - en: Can you lift your left arm at all?
      icon: me
      ko: 왼팔을 조금이라도 들어보시겠어요?
      note: 팔
    - en: Good. Now squeeze my hand with your left hand.
      icon: me
      ko: 좋아요. 이제 왼손으로 제 손을 쥐어보세요
      note: 악력
    - en: Weakness like that usually improves within a day or two after a seizure.
      icon: star
      ko: 그런 약화는 발작 뒤 대개 하루 이틀 안에 나아져요
      note: 경과
    - en: Even so, we still need to rule out a stroke.
      icon: shield
      ko: 그래도 뇌졸중은 꼭 배제해야 해요
      note: 배제
- title: 의식저하 SBAR 인계
  sentences:
  - en: GCS was 8 on arrival, now improved to 12.
