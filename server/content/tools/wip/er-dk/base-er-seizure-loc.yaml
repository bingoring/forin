    why: 성인 정상 호흡수는 분당 12~20회예요. 12 미만이면 느린 호흡이고, 아편계 과량에서는 6회처럼 느려지다 멎을 수 있어요. 느리면 날록손과 백밸브마스크를 바로 준비하고, 멎으면 환기를 먼저 해요. 의식은 AVPU로 함께 봐요 — 흉골 문지르기에만 신음하면 P예요.
