    word: seizure
    ko: 발작
  order:
    tag: 대화 흐름
    icon: compass
    ko: 경련 목격자 문진 4문장 순서
    why: 먼저 목격자의 놀란 마음을 인정하고(First), 본 것을 말하게 한 뒤, 'that'이 가리키는 지속 시간을 묻고, 'those minutes'가 앞 답을 받아 멈춘 직후의 상태를 묻는 순서예요. 대명사와 앞 줄을 받는 말이 순서를 하나로 고정해요.
