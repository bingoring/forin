- title: 항경련제 누락 재발
  sentences:
  - en: How long have you been off your medication?
    ko: 약을 끊으신 지 얼마나 됐나요?
    chunks:
    - How long
    - have you been
    - off your medication
    - '?'
    words:
    - w-long
    - w-medication
    goal: 1
    tag: 중단 기간
    icon: calendar
    why: off your medication은 약을 안 먹은 상태를 담담하게 말하는 표현이에요. 얼마나 끊었는지가 약 농도와 재발 위험을 가늠하는 단서예요.
    decoy: away
    distractorsKo:
    - 약은 어느 약국에서 받으시나요?
    - 약을 먹고 부작용이 있었나요?
    blank:
      answer: 'off'
      options:
      - en: 'on'
      - en: under
      - en: beyond
      - en: 'off'
  - en: We'll check your medication level in your blood.
    ko: 혈중 약물 농도를 확인할게요.
    chunks:
    - We'll check
    - your medication level
    - in your blood
    - .
    words:
    - w-check
    - w-medication
    - w-level
    - w-blood
    goal: 1
    tag: 약물 농도
    icon: lab
    why: 일부 항경련제는 혈중 농도를 재서 약이 충분히 들어 있는지 확인할 수 있어요. We'll로 앞으로 할 검사를 미리 알려요.
    decoy: count
    distractorsKo:
    - 혈압을 한 번 더 잴게요
    - 소변 검사를 하겠습니다
    blank:
      answer: blood
      options:
      - en: blood
      - en: urine
      - en: saliva
      - en: sweat
  - en: Stopping suddenly can trigger seizures like this.
    ko: 갑자기 끊으면 이런 발작이 유발될 수 있어요.
    chunks:
    - Stopping suddenly
    - can trigger
    - seizures like this
    - .
    words:
    - w-stop
    - w-trigger
    - w-seizure
    goal: 2
    tag: 중단 위험
    icon: bell
    why: can은 '그럴 수 있다'는 가능성이라 단정하지 않으면서 위험을 알려요. 항경련제를 갑자기 끊으면 발작이 다시 생길 수 있어요.
    decoy: daily
    distractorsKo:
    - 약을 줄이면 부작용도 줄어요
    - 약은 식후에 드세요
    blank:
      answer: suddenly
      options:
      - en: gradually
      - en: suddenly
      - en: slowly
      - en: carefully
  - en: Did you run out of your pills?
    ko: 약이 다 떨어졌나요?
    chunks:
    - Did you
    - run out
    - of your pills
    - '?'
    words:
    - w-pill
    goal: 1
    tag: 약 소진
    icon: pill
    why: run out of는 '다 떨어지다'라서 환자 탓이 아니라 약이 없었던 상황으로 물어요. 약이 없어서 끊은 것인지 가려내요.
    decoy: away
    distractorsKo:
    - 약이 몸에 안 맞았나요?
    - 약을 누가 처방해 줬나요?
    blank:
      answer: run
      options:
      - en: get
      - en: go
      - en: run
      - en: come
  - en: Please don't stop your medication on your own.
    ko: 임의로 약을 끊지 말아 주세요.
    chunks:
    - Please don't stop
    - your medication
    - on your own
    - .
    words:
    - w-stop
    - w-medication
    goal: 2
    tag: 복약 당부
    icon: shield
    why: Please를 붙여 부탁으로 말하면 야단치는 느낌이 줄어요. 증상이 좋아 보여도 임의로 끊지 않도록 알려요.
    decoy: ever
    distractorsKo:
    - 약은 아침저녁으로 드세요
    - 남은 약은 약국에 가져오세요
    blank:
      answer: stop
      options:
      - en: share
      - en: hide
      - en: lose
      - en: stop
  - en: We need to restart your seizure medication today.
    ko: 오늘부터 항경련제를 다시 시작해야 해요.
    chunks:
    - We need
    - to restart
    - your seizure medication
    - today
    - .
    words:
    - w-restart
    - w-seizure
    - w-medication
    goal: 2
    tag: 재시작 안내
    icon: redo
    why: restart는 '다시 시작'이라 이어 가던 약을 재개한다는 뜻이에요. 용량과 시작은 처방한 의사가 정해요.
    decoy: twice
    distractorsKo:
    - 오늘 퇴원 후 약국에서 약을 받으세요
    - 내일 신경과 외래에 가세요
    blank:
      answer: restart
      options:
      - en: restart
      - en: change
      - en: double
      - en: stop
  nuance:
  - kind: slider
    words:
    - w-stop
    - w-medication
    cue: 'Patient: "I just quit all of them at once last week."'
    scale:
    - tapered off with the doctor
    - skipped a few doses
    - stopped abruptly
    answerAt: 2
    why: 항경련제를 갑자기 끊으면 발작이 다시 오기 쉽고 지속상태까지 올 수 있어요. 끊어야 할 때는 의사와 계획을 세워 서서히 줄여요.
    example: She stopped her seizure medication abruptly a week ago.
    exKo: 일주일 전에 항경련제를 갑자기 끊었어요.
  - kind: context
    words:
    - w-restart
    - w-medication
    - w-seizure
    scenes:
    - who: 차트 기록
      icon: board
      en: Nonadherent to levetiracetam x1 wk; restart per neuro.
      ok: true
    - who: 동료 간호사에게
      icon: speech
      en: He's been nonadherent — stopped his Keppra a week ago, and neuro wants it restarted.
      ok: true
    - who: 환자에게
      icon: me
      en: You've been nonadherent to your AED regimen.
      ok: false
      fix: You've been off your seizure medicine for a week, so we're restarting it today.
    why: AED(antiepileptic drug)·regimen·nonadherent는 의료진의 말이고, 환자에게는 탓하는 말로 들려요. 사실과 오늘 할 일을 쉬운 말로 말해요.
    word: nonadherent
    ko: 복약을 안 지킨
  order:
    tag: 대화 흐름
    icon: compass
    ko: 약 중단 재발 응대 4문장 순서
    why: 얼마나 끊었는지 묻고, 'That'이 그 중단을 가리켜 발작 유발 가능성을 알리고, 'that risk'로 그 위험을 받아 농도 검사를 잇고, 마지막에 앞으로 임의로 끊지 말라고 당부해요. That·that risk가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: How long have you been off your seizure medication?
      icon: calendar
      ko: 발작 약을 끊으신 지 얼마나 됐나요?
      note: 기간
    - en: That can trigger seizures like this one.
      icon: bell
      ko: 그러면 이런 발작이 생길 수 있어요
      note: 위험
    - en: Because of that risk, we'll check your medication level in your blood.
      icon: lab
      ko: 그 위험 때문에 혈중 약 농도를 확인할게요
      note: 검사
    - en: Please don't stop it on your own again.
      icon: shield
      ko: 다시는 임의로 끊지 말아 주세요
      note: 당부
- title: 알코올 금단 발작
  sentences:
  - en: When was your very last drink?
    ko: 마지막으로 술을 드신 게 정확히 언제였나요?
    chunks:
    - When was
    - your very last
    - drink
    - '?'
    words:
    - w-drink
    goal: 1
    tag: 마지막 음주
    icon: calendar
    why: very를 붙이면 '정확히 마지막'을 묻는 말이 돼요. 금단은 마지막 음주 뒤 시간에 따라 달라서 시각이 중요해요.
    decoy: full
    distractorsKo:
    - 지금 어디가 가장 불편하세요?
    - 오늘 식사는 하셨나요?
    blank:
      answer: drink
      options:
      - en: drink
      - en: meal
      - en: pill
      - en: cigarette
  - en: How much do you usually drink in a day?
    ko: 하루에 보통 얼마나 드시나요?
    chunks:
    - How much
    - do you usually
    - drink
    - in a day
    - '?'
    words:
    - w-drink
    goal: 1
    tag: 음주량 문진
    icon: coffee
    why: usually로 평소 습관을, in a day로 하루 기준을 정해 줘서 대답이 구체적인 양으로 나와요. 판단하는 말투를 빼야 솔직한 양이 나와요.
    decoy: ever
    distractorsKo:
    - 술을 시작한 지 얼마나 됐나요?
    - 술을 끊으려고 해 본 적이 있나요?
    blank:
      answer: usually
      options:
      - en: secretly
      - en: usually
      - en: still
      - en: suddenly
  - en: Are you having sweats, tremors, or seeing things?
    ko: 땀이 나거나, 떨리거나, 헛것이 보이나요?
    chunks:
    - Are you having
    - sweats, tremors
    - ', or seeing things'
    - '?'
    words:
    - w-sweat
    - w-tremor
    goal: 2
    tag: 금단 증상
    icon: faceWorried
    why: 땀·떨림·헛것은 알코올 금단의 대표 증상이라 한 문장으로 묻고, 환자가 해당되는 것만 답하게 해요.
    decoy: chills
    distractorsKo:
    - 배가 아프거나 토하셨나요?
    - 가슴이 아프거나 답답하세요?
    blank:
      answer: tremors
      options:
      - en: rashes
      - en: itching
      - en: tremors
      - en: hiccups
  - en: How many days has it been since you stopped drinking?
    ko: 술을 끊으신 지 며칠 됐나요?
    chunks:
    - How many days
    - has it been
    - since you stopped
    - drinking
    - '?'
    words:
    - w-stop
    - w-drink
    goal: 1
    tag: 금주 기간
    icon: calendar
    why: since you stopped는 마지막 음주 이후 경과를 며칠 단위로 세게 해요. 금단은 보통 마지막 술 뒤 몇 시간에서 며칠 사이에 나타나서 이 숫자가 중요해요.
    decoy: while
    distractorsKo:
    - 하루에 몇 잔씩 드셨나요?
    - 마지막 술은 무엇을 드셨나요?
    blank:
      answer: since
      options:
      - en: before
      - en: after
      - en: until
      - en: since
  - en: Your hands look like they're shaking a lot.
    ko: 손이 많이 떨리고 있는 것 같아요.
    chunks:
    - Your hands look
    - like they're shaking
    - a lot
    - .
    words:
    - w-shake
    goal: 2
    tag: 관찰 전달
    icon: magnify
    why: look like로 본 것을 전하면 판단 없이 관찰만 말해요. 손 떨림은 금단 말고도 원인이 많아서 단정하지 않아요.
    decoy: very
    distractorsKo:
    - 숨을 가쁘게 쉬고 있는 것 같아요
    - 얼굴이 많이 창백해 보여요
    blank:
      answer: hands
      options:
      - en: hands
      - en: eyes
      - en: knees
      - en: lips
  - en: We're giving you medication to prevent worse withdrawal.
    ko: 금단 증상이 심해지지 않게 약을 드릴게요.
    chunks:
    - We're giving you
    - medication
    - to prevent
    - worse withdrawal
    - .
    words:
    - w-give
    - w-medication
    - w-prevent
    - w-withdrawal
    goal: 2
    tag: 치료 설명
    icon: pill
    why: to prevent로 약의 목적을 말해 주면 환자가 약을 받아들이기 쉬워요. 금단 치료는 증상이 심해지기 전에 약을 쓰는 것이 핵심이에요.
    decoy: stronger
    distractorsKo:
    - 술을 줄이는 방법을 알려 드릴게요
    - 상담 선생님을 불러 드릴게요
    blank:
      answer: prevent
      options:
      - en: ignore
      - en: prevent
      - en: cause
      - en: increase
  nuance:
  - kind: slider
    words:
    - w-tremor
    - w-sweat
    - w-withdrawal
    cue: Last drink 36 hours ago. Tremor, sweating, fast heart rate — but fully oriented and no hallucinations.
    scale:
    - minor withdrawal
    - alcoholic hallucinosis
    - delirium tremens
    answerAt: 0
    why: 떨림·땀·빈맥만 있고 의식이 맑으면 가벼운 금단이에요. 의식은 맑은데 헛것이 보이면 알코올성 환각증, 혼돈과 자율신경 폭주가 오면 진전섬망(DTs)이에요. DTs는 대개 마지막 음주 48~96시간 뒤에 와서, 지금 가벼워도 계속 사정해요.
    example: He's in mild withdrawal — tremulous but oriented.
    exKo: 가벼운 금단 상태예요 — 떨리지만 지남력은 있어요.
  - kind: swap
    words:
    - w-drink
    who: 환자에게 · 음주량 문진
    icon: me
    before:
    - 'How much '
    - alcohol do you consume
    - ' in a typical day?'
    options:
    - do you drink
    - alcohol do you consume
    - booze do you put away
    answer: do you drink
    notes:
      do you drink: 담담하고 쉬운 질문. 판단 없이 물어야 솔직한 양이 나온다.
      alcohol do you consume: 뜻은 같지만 설문지처럼 딱딱하다.
      booze do you put away: 속어라 가볍게 비꼬는 말로 들릴 수 있다.
    why: 음주량은 판단 없이 담담하게 묻고, 대답이 나오면 무엇을 몇 잔인지 구체적으로 되물어요.
    ko: 보통 하루에 술을 얼마나 드시나요?
  order:
    tag: 대화 흐름
    icon: compass
    ko: 알코올 금단 응대 4문장 순서
    why: 마지막 음주를 묻고, 'after you stop'으로 손 떨림이 금단일 수 있다고 알리고, 'it'이 가리키는 증상이 심해지지 않게 약을 주고, 'Even with the medicine'으로 약을 써도 이상하면 바로 알리게 해요. it과 the medicine이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: When was your very last drink?
      icon: calendar
      ko: 마지막으로 술을 드신 게 정확히 언제였나요?
      note: 문진
    - en: Your hands look shaky, and that can happen after you stop.
      icon: magnify
      ko: 손이 떨리는데, 끊고 나면 그럴 수 있어요
      note: 관찰
    - en: We're giving you medication to keep it from getting worse.
      icon: pill
      ko: 나빠지지 않게 약을 드릴게요
      note: 치료
    - en: Even with the medicine, tell me right away if you see or feel anything strange.
      icon: bell
      ko: 약을 써도 이상한 게 보이거나 느껴지면 바로 말해 주세요
      note: 당부
- title: 열성 경련 소아 부모 안심
  sentences:
  - en: Febrile seizures are frightening but usually harmless.
    ko: 열성 경련은 무섭지만 대개 무해해요.
    chunks:
    - Febrile seizures
    - are frightening
    - but usually harmless
    - .
    words:
    - w-seizure
    - w-frighten
    - w-harmless
    goal: 2
    tag: 경련 설명
    icon: shield
    why: frightening과 harmless를 but으로 이어 놀란 마음을 인정하면서 안심시켜요. 열성 경련은 대부분 뇌에 장기적인 손상을 남기지 않아요.
    decoy: rarely
    distractorsKo:
    - 해열제는 이미 드셨나요?
    - 아이의 예방접종은 마쳤나요?
    blank:
      answer: harmless
      options:
      - en: permanent
      - en: harmless
      - en: brief
      - en: inherited
  - en: She's breathing well now and starting to recover.
    ko: 지금은 숨도 잘 쉬고 회복되기 시작했어요.
    chunks:
    - She's breathing well
    - now
    - and starting
    - to recover
    - .
    words:
    - w-breathe
    - w-recover
    goal: 2
    tag: 현재 상태
    icon: monitor
    why: 지금 상태를 전하면 부모가 제일 궁금한 것(숨을 쉬는지)에 답해요. starting to로 아직 회복 중이라는 사실도 정직하게 말해요.
    decoy: slowly
    distractorsKo:
    - 체온은 아직 높은 상태예요
    - 곧 의사 선생님이 오실 거예요
    blank:
      answer: breathing
      options:
      - en: sleeping
      - en: crying
      - en: breathing
      - en: eating
  - en: Let's focus on bringing her fever down.
    ko: 우선 열을 내리는 데 집중해요.
    chunks:
    - Let's focus
    - on bringing
    - her fever
    - down
    - .
    words:
    - w-focus
    - w-fever
    goal: 1
    tag: 치료 방향
    icon: chartup
    why: Let's로 함께 한다는 느낌을 줘요. 열을 내리는 것은 아이를 편하게 하려는 것이고, 경련을 막지는 않아서 열의 원인을 찾는 일이 함께 가요.
    decoy: make
    distractorsKo:
    - 아이를 잠시 안아 주셔도 돼요
    - 물을 조금 마시게 해 볼게요
    blank:
      answer: focus
      options:
      - en: agree
      - en: wait
      - en: hurry
      - en: focus
  - en: I know this looked very scary.
    ko: 정말 무섭게 보였을 거예요, 알아요.
    chunks:
    - I know
    - this looked
    - very scary
    - .
    words:
    - w-scary
    goal: 1
    tag: 공감
    icon: faceWorried
    why: I know로 시작하면 부모의 놀란 마음을 먼저 인정해요. 설명이나 지시 앞에 공감을 두면 이어지는 말이 잘 들려요.
    decoy: quite
    distractorsKo:
    - 아이가 많이 우는 건 정상이에요
    - 잘 대처하셨어요
    blank:
      answer: scary
      options:
      - en: scary
      - en: painful
      - en: serious
      - en: strange
  - en: Most children outgrow febrile seizures completely.
    ko: 대부분의 아이들은 열성 경련을 완전히 벗어나요.
    chunks:
    - Most children
    - outgrow
    - febrile seizures
    - completely
    - .
    words:
    - w-child
    - w-seizure
    goal: 2
    tag: 예후 안내
    icon: star
    why: Most는 '대부분'이라 모두라고 단정하지 않아요. 열성 경련은 어린 시기에만 생기고 대개 자라면서 멈춰요.
    decoy: never
    distractorsKo:
