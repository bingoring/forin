    - febrile status epilepticus
    answerAt: 0
    why: 단순 열성 경련은 전신성이고 15분 미만이며 24시간 안에 다시 오지 않아요. 15분 이상이거나 한쪽만이거나 24시간 안에 재발하면 complex, 30분 이상 이어지면 febrile status epilepticus예요.
