      ko: 심박수와 혈압이 다시 치솟고 있어요 — 자율신경 폭풍이에요
      note: 보고
    - en: To control it, we need to increase sedation.
      icon: pill
      ko: 그걸 조절하려고 진정을 늘려야 해요
      note: 요청
    - en: Since more sedation can slow his breathing, keep him on continuous monitoring.
      icon: monitor
      ko: 진정이 더해지면 호흡이 느려질 수 있으니 계속 감시를 이어 가세요
      note: 감시
    - en: Call the physician back in now and report what that monitoring shows.
      icon: bell
      ko: 지금 의사를 다시 불러서 그 감시가 보여 주는 걸 알려 주세요
      note: 호출
