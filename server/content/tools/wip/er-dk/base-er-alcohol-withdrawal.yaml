situations:
- title: 음주력·마지막 음주 문진
  sentences:
  - en: It helps me care for you to know how much you usually drink.
    ko: 얼마나 드시는지 알아야 잘 돌봐드릴 수 있어요.
    chunks:
    - It helps me care for you
    - to know
    - how much
    - you usually drink
    - .
    words:
    - w-help
    - w-care
    - w-usually
    - w-drink
    goal: 1
    tag: 이유 설명
    icon: board
    why: 질문의 목적을 먼저 말하면 추궁이 아니라 돌봄으로 들려요. 음주량은 금단 위험과 처치를 가늠하는 기본 정보예요.
    decoy: for the record
    distractorsKo:
    - 얼마나 아프신지 알아야 잘 돌봐드릴 수 있어요.
    - 얼마나 드시는지 알아야 잘 설명해드릴 수 있어요.
    blank:
      answer: how much
      options:
      - en: how much
      - en: how long
      - en: how fast
      - en: how soon
  - en: When was your last drink? That tells us what to watch for.
    ko: 마지막으로 언제 드셨어요? 그게 뭘 지켜봐야 할지 알려줘요.
    chunks:
    - When was
    - your last drink
    - '? That tells us'
    - what to watch for
    - .
    words:
    - w-last
    - w-drink
    - w-tell
    - w-watch
    goal: 1
    tag: 시점 질문
    icon: calendar
    why: 마지막 음주 시각을 묻는 이유를 바로 붙이면 환자가 숨기지 않고 답해요. 금단은 마지막 음주 후 시간이 흐르며 나타나서 그 시각이 기준이에요.
    decoy: your first drink
    distractorsKo:
    - 마지막으로 언제 드셨어요? 그게 뭘 준비해야 할지 알려줘요.
    - 마지막으로 얼마나 드셨어요? 그게 뭘 지켜봐야 할지 알려줘요.
    blank:
      answer: watch
      options:
      - en: ask
      - en: watch
      - en: wait
      - en: hope
  - en: I'm not here to judge — this is just about keeping you safe.
    ko: 판단하려는 게 아니에요 — 그냥 안전하게 봐드리려는 거예요.
    chunks:
    - I'm not here
    - to judge
    - — this is just about
    - keeping you safe
    - .
    words:
    - w-judge
    - w-safe
    goal: 2
    tag: 비난 아님
    icon: handshake2
    why: 비난하려는 게 아니라고 먼저 선을 그으면 환자가 방어를 풀어요. 이어서 목적이 안전이라고 밝히면 솔직한 답을 끌어내기 쉬워요.
    decoy: to quiz you
    distractorsKo:
    - 판단하려는 게 아니에요 — 그냥 빠르게 봐드리려는 거예요.
    - 설득하려는 게 아니에요 — 그냥 안전하게 봐드리려는 거예요.
    blank:
      answer: safe
      options:
      - en: quiet
      - en: still
      - en: safe
      - en: sober
  - en: Can you tell me how many drinks you usually have in a day?
    ko: 하루에 보통 몇 잔 드시는지 말해주실 수 있어요?
    chunks:
    - Can you tell me
    - how many drinks
    - you usually have
    - in a day
    - '?'
    words:
    - w-tell
    - w-drink
    - w-usually
    goal: 1
    tag: 음주량 질문
    icon: speech
    why: how many drinks처럼 잔 수로 물으면 '좀 마셔요' 같은 막연한 대답보다 정확한 양을 얻어요.
    decoy: how many hours
    distractorsKo:
    - 일주일에 보통 몇 잔 드시는지 말해주실 수 있어요?
    - 하루에 보통 몇 병 드시는지 말해주실 수 있어요?
    blank:
      answer: in a day
      options:
      - en: in a week
      - en: in a month
      - en: in an hour
      - en: in a day
  - en: I ask everyone these questions, so please don't feel singled out.
    ko: 모든 분께 여쭤보는 질문이니 혼자 지목됐다고 느끼지 않으셔도 돼요.
    chunks:
    - I ask everyone
    - these questions
    - ', so please don''t'
    - feel singled out
    - .
