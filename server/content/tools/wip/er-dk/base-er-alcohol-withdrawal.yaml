    - w-question
    - w-feel
    goal: 2
    tag: 낙인 방지
    icon: handshake2
    why: 모든 환자에게 묻는다고 밝히면 자기만 의심받는다는 느낌이 줄어요. 음주 문진은 낙인감을 덜어 주는 말투가 중요해요.
    decoy: feel left out
    distractorsKo:
    - 새로 오신 분께 여쭤보는 질문이니 혼자 지목됐다고 느끼지 않으셔도 돼요.
    - 모든 분께 여쭤보는 질문이니 혼자 창피하다고 느끼지 않으셔도 돼요.
