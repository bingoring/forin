    why: 다시 오는 시간을 먼저 알려요. 그 시간 전에 심해지면 호출하라고 하고(before then), 호출을 망설이지 않게 한 뒤(it) 돌아와서 통증을 다시 점수로 물어요. then, this, it이 앞 줄을 가리켜 순서가 하나예요.
    lines:
