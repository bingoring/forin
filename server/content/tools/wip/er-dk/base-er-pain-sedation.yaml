      - en: walking
      - en: reading
      - en: breathing
      - en: sleeping
  - en: Have you ever had an allergic reaction to ibuprofen or aspirin?
    ko: 이부프로펜이나 아스피린에 알레르기 반응을 보이신 적 있나요?
    chunks:
    - Have you ever had
    - an allergic reaction
    - to ibuprofen
    - or aspirin
    - '?'
    words:
    - w-allergic
    - w-ibuprofen
    - w-aspirin
    goal: 1
    tag: 진통제 알레르기
    icon: pill
    why: 이부프로펜과 아스피린 같은 비스테로이드 소염진통제(NSAID)는 서로 교차 반응할 수 있어서 함께 물어요. 경험을 묻는 Have you ever had …를 그대로 써요.
    decoy: taken a
    distractorsKo:
    - 이부프로펜이나 아스피린에 위장 장애를 보이신 적 있나요?
