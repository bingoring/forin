    - your pain
    - right now
    - '?'
    words:
    - w-scale
    - w-rate
    - w-pain
    goal: 1
    tag: 통증 점수
    icon: chartup
    why: 범위(zero to ten)를 먼저 주면 환자가 숫자로 답하기 쉬워요. how would you …는 would 덕분에 지시보다 부드러운 질문이 돼요.
    decoy: last night
    distractorsKo:
    - 0점에서 10점 척도로 어제 통증이 몇 점이었나요?
    - 0점에서 5점 척도로 지금 통증이 몇 점인가요?
    blank:
      answer: rate
      options:
      - en: rate
      - en: manage
      - en: treat
      - en: describe
  - en: Can you point to exactly where it hurts?
    ko: 정확히 어디가 아픈지 가리켜 주시겠어요?
