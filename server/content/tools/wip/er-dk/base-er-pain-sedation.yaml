    blank:
      answer: had
      options:
      - en: noticed
      - en: seen
      - en: reported
      - en: had
  - en: I'll note this in your chart so the team knows.
    ko: 팀에서 알 수 있게 차트에 기록해 둘게요.
    chunks:
    - I'll note this
    - in your chart
    - so the team
    - knows
    - .
    words:
    - w-chart
    - w-team
    goal: 2
    tag: 기록 안내
    icon: board
