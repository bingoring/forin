    decoy: in the lobby
    distractorsKo:
    - 팀에서 알 수 있게 약사에게 전해 둘게요.
    - 팀에서 알 수 있게 손목 밴드에 표시해 둘게요.
    blank:
      answer: knows
      options:
      - en: knows
      - en: forgets
      - en: guesses
      - en: ignores
  nuance:
  - kind: pair
    words:
    - w-allergic
    - w-rash
    - w-breathe
    pairs:
    - - allergic
      - to aspirin
    - - break out
      - in a rash
    - - have trouble
      - breathing
    decoys:
    - of codeine
    why: allergic은 전치사 to와 짝이에요('allergic to aspirin'). 'allergic of/with'는 틀려요. 발진이 돋는 건 break out in a rash, 숨이 찬 건 have trouble breathing이에요.
  - kind: swap
    words:
    - w-allergic
    - w-medication
    who: 환자에게 · 알레르기 확인
    icon: me
    before:
    - 'Are you '
    - hypersensitive
    - ' to any medications?'
    options:
    - allergic
    - intolerant
    - sensitive
