    notes:
      allergic: 환자에게 묻는 표준 질문이에요.
      intolerant: '''잘 못 견딘다''는 뜻으로, 메스꺼움 같은 부작용을 진짜 알레르기와 구분할 때 쓰는 말이라 이 질문에는 맞지 않아요.'
      sensitive: '''예민하다'' 정도로 들려 알레르기인지 부작용인지가 흐려져요.'
    why: hypersensitivity는 약리·차트 용어예요. 환자에게는 allergic to로 묻고, 대답이 나오면 무슨 일이 있었는지 이어 물어 알레르기와 부작용을 가려요.
    ko: 혹시 약물 알레르기가 있으세요?
  order:
    tag: 대화 흐름
    icon: compass
    ko: 약물 알레르기 확인 4문장 순서
    why: 알레르기가 있는지 먼저 묻고, 특정 약을 먹은 적이 있는지 물어요. 그 약을 먹었을 때 무슨 일이 있었는지 이어 묻고, 마지막에 기록하겠다고 해요. it과 that이 앞 줄을 가리켜서 순서가 하나예요.
    lines:
    - en: First, are you allergic to any medications?
      icon: shield
      ko: 먼저 약물 알레르기가 있으세요?
      note: 알레르기
    - en: Have you ever taken morphine before?
      icon: pill
      ko: 예전에 모르핀을 드신 적 있으세요?
      note: 복용력
    - en: What happened when you took it?
      icon: faceWorried
      ko: 드셨을 때 어떤 일이 있었나요?
      note: 반응
    - en: Thank you, I'll note all of that in your chart.
      icon: board
      ko: 감사해요, 모두 차트에 적어 둘게요
      note: 기록
- title: 통증 재평가 시점 안내
  sentences:
  - en: I'll check back with you in about twenty minutes.
