situations:
- title: 소아 발열 초기 문진
  sentences:
  - en: When did the fever start and how high has it been?
    ko: 열이 언제 시작됐고 얼마나 높이 올랐나요?
    chunks:
    - When did
    - the fever start
    - and how high
    - has it been
    - '?'
    words:
    - w-fever
    - w-start
    - w-high
    goal: 1
    tag: 발열 문진
    icon: monitor
    why: When으로 시작 시점, how high로 열의 높이를 물어 경과를 한 문장에 묶어요. 열이 언제 시작됐는지와 몇 도까지 올랐는지는 소아 발열 평가의 기본 정보예요.
    decoy: and how often
    distractorsKo:
    - 열이 어제 시작됐고 얼마나 높이 올랐나요?
    - 열이 언제 시작됐고 얼마나 오래 이어졌나요?
    blank:
      answer: fever
      options:
      - en: fever
      - en: cough
      - en: rash
      - en: vomiting
  - en: Is she still drinking and making wet diapers?
    ko: 아직 잘 마시고 기저귀도 젖고 있나요?
    chunks:
    - Is she still
    - drinking and making
    - wet diapers
    - '?'
    words:
    - w-drink
    - w-wet
    - w-diaper
    goal: 1
    tag: 수분·배설
    icon: coffee
    why: drinking과 wet diapers를 and로 묶어 마시는 양과 소변량을 함께 물어요. 영아는 젖은 기저귀가 줄면 수분이 모자란다는 신호로 봐요.
    decoy: with a bottle
    distractorsKo:
    - 아직 잘 자고 기저귀도 젖고 있나요?
    - 아직 잘 마시고 기저귀도 갈고 있나요?
    blank:
      answer: drinking
      options:
      - en: playing
      - en: drinking
      - en: eating
      - en: sleeping
  - en: You're doing the right thing by bringing her in.
    ko: 이렇게 데려오신 게 잘하신 거예요.
    chunks:
    - You're
    - doing the right thing
    - by bringing her
    - in
    - .
    words:
    - w-right
    - w-bring
    goal: 2
    tag: 부모 안심
    icon: handshake2
    why: You're doing the right thing으로 부모가 내린 결정을 먼저 인정해요. 아픈 아이를 데려온 보호자가 자책하거나 괜히 왔나 망설이지 않게 도와요.
    decoy: back home
    distractorsKo:
    - 이렇게 안고 오신 게 잘하신 거예요.
    - 이렇게 데려오신 게 놀라운 거예요.
    blank:
      answer: right
      options:
      - en: usual
      - en: small
      - en: right
      - en: easy
  - en: Has she seemed more tired than usual?
    ko: 평소보다 더 처져 보이던가요?
    chunks:
    - Has she seemed
    - more tired
    - than usual
    - '?'
    words:
    - w-tired
    - w-usual
    goal: 1
    tag: 활동성 문진
    icon: faceWorried
    why: Has she seemed…으로 부모가 본 변화를 묻고 than usual로 평소 모습과 견주게 해요. 평소보다 많이 처지거나 깨우기 힘든 것은 소아에서 중요한 위험 신호라 일상과 비교해서 확인해요.
    decoy: after lunch
    distractorsKo:
    - 평소보다 더 보채 보이던가요?
    - 어제보다 더 처져 보이던가요?
    blank:
      answer: tired
      options:
      - en: hungry
      - en: cranky
      - en: thirsty
      - en: tired
  - en: Can I feel your forehead, sweetie?
    ko: 이마 좀 만져봐도 될까, 아가?
    chunks:
    - Can I feel
    - your forehead
    - ', sweetie'
    - '?'
    words:
    - w-forehead
    - w-sweetie
    goal: 1
    tag: 호칭·접촉
    icon: me
    why: Can I…?로 만지기 전에 먼저 허락을 구하고, sweetie 같은 다정한 호칭으로 아이의 긴장을 풀어요. 미국에서는 아이에게 sweetie·buddy 같은 호칭을 흔히 써요.
    decoy: your tummy
    distractorsKo:
    - 손 좀 만져봐도 될까, 아가?
    - 이마 좀 닦아봐도 될까, 아가?
    blank:
      answer: sweetie
      options:
      - en: sweetie
      - en: ma'am
      - en: sir
      - en: madam
  - en: I'm going to take her temperature now.
    ko: 지금 체온을 재 볼게요.
    chunks:
    - I'm going to
    - take her temperature
    - now
    - .
    words:
    - w-take
    - w-temperature
    goal: 1
    tag: 처치 예고
    icon: monitor
    why: I'm going to…로 하려는 일을 미리 알려 부모와 아이가 놀라지 않게 해요. 영유아의 체온은 나이에 맞는 방법으로 재요.
    decoy: her pulse
    distractorsKo:
    - 지금 키를 재 볼게요.
    - 지금 체중을 재 볼게요.
    blank:
      answer: temperature
      options:
      - en: photograph
      - en: temperature
      - en: sweatshirt
      - en: appointment
  nuance:
  - kind: pair
    words:
    - w-high
    - w-wet
    - w-diaper
    - w-tired
    - w-usual
    pairs:
    - - how high has
      - it been
    - - wet
      - diapers
    - - more tired than
      - usual
    decoys:
    - fever
    why: 열이 몇 도까지 올랐는지는 how high has it been, 소변으로 젖은 기저귀는 wet diapers, 평소와 견줄 때는 more tired than usual이에요.
  - kind: swap
    words:
    - w-tired
    - w-usual
    who: 부모에게 · 활동성 사정
    icon: me
    before:
    - 'Has she seemed more '
    - lethargic
    - ' than usual?'
    options:
    - tired
    - lethargic
    - fatigued
    answer: tired
    notes:
      tired: 부모가 쓰는 쉬운 말. 평소 모습과 견줘 답하기 쉽다.
      lethargic: 의료진에게는 '깨우기 힘들 만큼 처짐'이라는 위험 소견을 뜻하는 임상어. 부모는 다른 뜻으로 알고 답할 수 있다.
      fatigued: 문서체라 대화에서는 딱딱하게 들린다.
    why: 소아에서 lethargic은 무게 있는 임상 소견이에요. 부모에게는 tired처럼 쉬운 말로 묻고, 들은 모습을 보고 의료진이 판단해요.
    ko: 평소보다 더 피곤해 보이던가요?
  order:
    tag: 대화 흐름
    icon: compass
    ko: 소아 발열 문진 4문장 순서
    why: 먼저 체온을 재겠다고 알리고, 'It's'가 그 측정값을 가리키며 시작 시점을 묻고, 'Since then'이 그 시작 시점을 받아 수분·배설을 묻고, 'all that'이 앞의 대답을 모두 받아 부모를 안심시켜요. 'It's'·'Since then'·'all that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: I'm going to take her temperature now.
      icon: monitor
      ko: 지금 체온을 재 볼게요
      note: 예고
    - en: It's 101.2, so she does have a fever. When did it start?
      icon: bell
      ko: 화씨 101.2도(약 38.4℃)라 열이 있네요. 언제 시작됐나요?
      note: 문진
    - en: Since then, is she still drinking and making wet diapers?
      icon: coffee
      ko: 그 뒤로 아직 잘 마시고 기저귀도 젖고 있나요?
      note: 수분
    - en: Thank you for all that. You're doing the right thing bringing her in.
      icon: handshake2
      ko: 말씀 고마워요. 데려오신 게 잘하신 거예요
      note: 안심
- title: 체중 기반 투약 설명
