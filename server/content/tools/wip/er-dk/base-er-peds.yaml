    icon: pill
    why: based on으로 용량의 근거를 먼저 밝혀 '왜 이 양인가'를 설명해요. 소아 약 용량은 보통 체중에 맞춰(mg/kg) 계산해서 아이마다 달라요.
    decoy: every hour
