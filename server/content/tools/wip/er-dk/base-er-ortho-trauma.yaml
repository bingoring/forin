situations:
- title: 사지 손상 초기 사정
  sentences:
  - en: I'm going to look at and gently check your arm.
    ko: 팔을 살펴보고 부드럽게 확인해 볼게요.
    chunks:
    - I'm going to
    - look at
    - and gently check
    - your arm
    - .
    words:
    - w-look
    - w-gently
    - w-check
    - w-arm
    goal: 1
    tag: 진찰 안내
    icon: magnify
    why: look at and gently check로 보는 것과 만지는 것을 나눠 말하면, 아픈 팔에 손이 닿는 순간을 환자가 미리 알아요. gently는 만지는 방식을 먼저 약속하는 말이에요.
    decoy: after the x-ray
    distractorsKo:
    - 다리를 살펴보고 부드럽게 확인해 볼게요.
    - 어깨를 살펴보고 부드럽게 확인해 볼게요.
    blank:
      answer: gently
      options:
      - en: gently
      - en: roughly
