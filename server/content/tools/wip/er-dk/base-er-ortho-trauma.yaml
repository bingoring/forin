    notes:
      tingly or numb: 환자가 알아듣는 쉬운 말이고, 무엇을 느끼면 알려야 하는지가 분명하다.
      paresthetic: 의학 용어(이상감각). 차트에는 맞지만 환자는 무슨 뜻인지 모른다.
      a bit funny: 쉽지만 너무 흐려서 저림·감각 소실을 알려야 한다는 뜻이 전해지지 않는다.
