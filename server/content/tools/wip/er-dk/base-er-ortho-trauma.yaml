  order:
    tag: 대화 흐름
    icon: compass
    ko: 부목 설명 4문장 순서
    why: 부목을 댄다고 알리고, 'It'으로 이유와 체중 제한을 말한 뒤, 'Even with no weight on it'으로 체중을 싣지 않아도 생길 수 있는 경고 증상을 알리고, 마지막에 'Either way'로 매시간 확인을 약속해요. 'It'·'no weight'·'Either way'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
