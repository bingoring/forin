    - w-take
    who: 환자에게 · 항응고제 복용력
    icon: me
    before:
    - 'Which '
    - DOAC
    - ' are you taking, and when was your last dose?'
    options:
    - blood thinner
    - anticoagulant
    - DOAC
    answer: blood thinner
    notes:
      blood thinner: 미국 환자들이 스스로 쓰는 말이라 바로 알아듣는다.
