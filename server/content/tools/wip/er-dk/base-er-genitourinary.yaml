  order:
    tag: 대화 흐름
    icon: compass
    ko: 혈뇨 항응고제 확인 4문장 순서
    why: 약 이름과 마지막 복용을 묻고, 그 복용 이후 외상이나 도뇨관이 있었는지 묻고, 어느 쪽이든 혈액 수치로 얼마나 묽은지 확인하고, 결과가 나올 때까지 다음 복용을 보류할 수 있다고 해요. 'that dose'·'Either way'·'those results'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Which blood thinner are you taking, and when was your last dose?
      icon: pill
      ko: 어떤 혈액희석제를 드시고, 마지막 복용은 언제였나요?
      note: 약물
    - en: Since that dose, have you had any injury or a catheter?
