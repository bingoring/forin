    why: 사고 후 소변을 봤는지 묻고, 관을 넣기 전에 끝의 피를 살피고, 피가 보이면 요도 특수 엑스레이(역행성 요도조영)를 먼저 하고, 요도가 괜찮으면 방광 엑스레이로 파열을 확인해요. 'that'·'If I see blood'·'Once the urethra is clear'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Have you been able to pass any urine since the accident?
      icon: calendar
      ko: 사고 이후 소변을 조금이라도 볼 수 있었나요?
      note: 배뇨
    - en: Before a tube helps with that, I'll check the tip for blood.
      icon: magnify
      ko: 그걸 돕는 관 전에 끝부분에 피가 있는지 확인할게요
      note: 요도
    - en: If I see blood, a special X-ray of the urethra comes first.
      icon: monitor
      ko: 피가 보이면 요도 특수 엑스레이를 먼저 해요
      note: 요도조영
    - en: Once the urethra is clear, a bladder X-ray will show any tear.
      icon: monitor
      ko: 요도가 괜찮으면 방광 엑스레이로 찢어진 곳을 확인해요
      note: 방광조영
