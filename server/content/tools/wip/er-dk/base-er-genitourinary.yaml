situations:
- title: 배뇨통·빈뇨 문진(UTI)
  sentences:
  - en: When did the burning with urination start?
    ko: 배뇨 시 화끈거림이 언제 시작됐나요?
    chunks:
    - When did
    - the burning
    - with urination
    - start
    - '?'
    words:
    - w-burn
    - w-urination
    - w-start
    goal: 1
    tag: 발현 시점
    icon: calendar
    why: When did…start?로 시작 시점을 묻는 기본 문형이에요. 증상이 하루 이틀 된 것인지 며칠 지난 것인지에 따라 감염 가능성과 진행 정도를 가늠해요.
    decoy: at night
    distractorsKo:
    - "배뇨 시 가려움이 언제 시작됐나요?"
    - 배뇨 시 화끈거림이 어디서 시작됐나요?
    blank:
      answer: burning
      options:
      - en: burning
      - en: swelling
      - en: bleeding
      - en: shaking
  - en: How often are you needing to urinate?
    ko: 얼마나 자주 소변을 봐야 하나요?
    chunks:
    - How often
    - are you needing
    - to urinate
    - '?'
    words:
    - w-often
    - w-need
    - w-urinate
    goal: 1
    tag: 빈도 확인
    icon: chartup
    why: How often…?은 횟수를 묻는 문형이에요. are you needing으로 지금 진행 중인 필요를 물어서 평소보다 자주 가는지 알 수 있어요.
    decoy: at the hospital
    distractorsKo:
    - 얼마나 자주 대변을 봐야 하나요?
    - 얼마나 자주 물을 마셔야 하나요?
    blank:
      answer: urinate
      options:
      - en: cough
      - en: urinate
      - en: drink
      - en: vomit
  - en: Have you noticed any blood or strong odor in your urine?
    ko: 소변에서 피나 강한 냄새를 알아차리셨나요?
    chunks:
    - Have you noticed
    - any blood
    - or strong odor
    - in your urine
    - '?'
    words:
    - w-notice
    - w-blood
    - w-odor
    - w-urine
    goal: 2
    tag: 소변 양상
