    blank:
      answer: fast
      options:
      - en: alone
      - en: fast
      - en: slowly
      - en: late
  nuance:
  - kind: slider
    words:
    - w-urgent
    - w-ultrasound
    cue: 'Charge nurse to radiology: 15-year-old, sudden severe testicular pain for 2 hours — how soon does he need the ultrasound?'
    scale:
    - routine
    - urgent
    - emergent
    answerAt: 2
    why: 고환염전은 증상이 생기고 몇 시간 안(흔히 6시간 안쪽)에 풀어야 고환을 살릴 가능성이 높아요. 미국 병원에서 emergent는 '지금 당장', urgent는 '서둘러서'에 가까워 검사 요청은 emergent(stat)로 해요. 환자·가족에게는 urgent·right away로 말해도 충분해요.
    example: This is an emergent ultrasound — possible torsion.
    exKo: 염전 가능성이 있어 즉시 해야 하는 초음파예요.
  - kind: context
    words:
    - w-ultrasound
    - w-specialist
    - w-call
    scenes:
    - who: 비뇨의학과 콜
      icon: monitor
      en: 15-year-old, sudden left testicular pain two hours ago, concern for torsion.
      ok: true
    - who: 영상의학과에
      icon: board
      en: I need a stat scrotal Doppler — possible torsion.
      ok: true
    - who: 청소년 환자에게
      icon: me
      en: Concern for testicular torsion; stat scrotal Doppler ordered.
      ok: false
      fix: The blood flow to your testicle might be blocked, so we're getting an ultrasound right away and calling a specialist.
    why: 모두 염전이 의심돼 바로 초음파를 한다는 같은 말이에요. 겁먹은 청소년에게는 torsion·Doppler 대신 무엇이 문제이고 무엇을 하는지 쉬운 말로 알려요.
    word: torsion
    ko: 염전
  order:
    tag: 대화 흐름
    icon: compass
    ko: 고환염전 의심 4문장 순서
    why: 통증이 시작된 때를 묻고, 그 뒤 한쪽인지 양쪽인지 묻고, 아픈 쪽의 붓기와 발적을 확인하고, 그 모든 소견으로 응급일 수 있어 빠르게 움직인다고 알려요. 'On whichever side'·'all of that'이 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Exactly when did the pain start?
      icon: calendar
      ko: 정확히 언제 통증이 시작됐나요?
      note: 시각
    - en: Is the pain only on one side, or on both sides?
      icon: pushpin
      ko: 통증이 한쪽에만 있나요, 아니면 양쪽 다 있나요?
      note: 편측
    - en: On whichever side hurts, any swelling or redness?
      icon: magnify
      ko: 아픈 쪽이 어디든 붓거나 붉은 곳이 있나요?
      note: 외관
    - en: With all of that, this can be an emergency — we're moving fast.
      icon: siren
      ko: 그 모든 걸 보면 응급일 수 있어서 빠르게 움직이고 있어요
      note: 조치
