    decoy: to measure the pressure
    distractorsKo:
    - "지금 카테터를 넣어서 통증을 풀고 방광을 배출시킬게요."
    - "지금 카테터를 넣어서 압박감을 풀고 소변을 검사할게요."
    blank:
      answer: relieve
      options:
      - en: relieve
      - en: measure
      - en: record
      - en: increase
  nuance:
  - kind: slider
    words:
    - w-weak
    - w-stream
    cue: 'Patient: "It just dribbles out, a few drops at a time."'
    scale:
    - a little slow
    - weak
    - dribbling
    answerAt: 2
    why: 방울방울 떨어진다면 가장 약한 쪽, dribbling이에요. 전립선비대 환자가 흔히 말하는 증상이고, 줄기가 약해지다 아예 안 나오면 급성 요폐예요.
    example: He says it's been dribbling for weeks, and now nothing comes out.
    exKo: 몇 주째 방울방울 나오다가 이제는 아예 안 나온대요.
  - kind: swap
    words:
    - w-quick
    - w-bladder
    - w-scan
    - w-full
    who: 환자에게 · 방광 스캔 안내
    icon: me
    before:
    - 'We''ll do a quick '
    - PVR
    - ' to see how full it is.'
    options:
    - bladder scan
    - PVR
    - post-void residual measurement
    answer: bladder scan
    notes:
      bladder scan: 무엇을 하는지 바로 알 수 있는 쉬운 말. 배에 젤을 바르고 초음파기를 대는 검사다.
      PVR: 의료진끼리의 약어(post-void residual, 배뇨 후 남은 양). 환자는 모르고, 아직 소변을 못 보는 환자의 방광 용적에는 맞지도 않는다.
      post-void residual measurement: 맞는 말이지만 환자에게는 길고 딱딱하다. 차트에 어울린다.
    why: 방광 스캔은 휴대용 초음파기로 방광에 찬 소변량을 재요. PVR 같은 약어 대신 환자에게는 bladder scan이라고 하면 무엇을 하는지 바로 알아요.
    ko: 얼마나 찼는지 보려고 방광스캔을 빠르게 할게요
  order:
    tag: 대화 흐름
    icon: compass
    ko: 전립선 요폐 4문장 순서
    why: 증상을 묻고, 얼마나 오래됐는지 묻고, 그 병력을 바탕으로 방광 스캔을 안내하고, 스캔에서 방광이 차 있으면 도뇨한다고 알려요. 'that'·'that history'·'it shows'가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Have you had a weak stream or trouble starting for a while?
      icon: pushpin
      ko: 소변 줄기가 약하거나 시작하기 어려운 게 한동안 있었나요?
      note: 증상
    - en: How long has that been going on?
      icon: calendar
      ko: 그게 얼마나 오래됐나요?
      note: 기간
    - en: With that history, we'll do a quick bladder scan to see how full it is.
      icon: monitor
      ko: 그런 병력이라 얼마나 찼는지 방광스캔을 빠르게 할게요
      note: 스캔
    - en: If it shows a full bladder, we'll pass a catheter to drain it.
      icon: gear
      ko: 방광이 가득 차 있으면 카테터를 넣어 비울게요
      note: 도뇨
- title: 고환염전 청소년
