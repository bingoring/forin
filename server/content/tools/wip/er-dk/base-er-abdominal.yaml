  nuance:
  - kind: slider
    words:
    - w-pain
    cue: 'Patient: "It''s not really painful — just uncomfortable, like I ate too much."'
    scale:
    - discomfort
    - pain
    - agony
    answerAt: 0
    why: '''아프다기보다 불편하다''면 discomfort 쪽이에요. 한국어로는 다 ''아프다''지만 영어는 세기에 따라 말이 달라요. 차트에는 환자가 말한 숫자(0~10)를 함께 적어요.'
    example: Some discomfort after a big meal is common.
