    decoy: in your car
    distractorsKo:
    - 거기 계실 때 모자를 쓰고 계셨어요?
    - 거기 계실 때 휴대폰을 갖고 계셨어요?
    blank:
      answer: water
      options:
      - en: water
      - en: food
      - en: ice
      - en: medicine
  - en: I'm going to check your temperature and pulse now.
    ko: 지금 체온과 맥박을 확인해 볼게요.
    chunks:
