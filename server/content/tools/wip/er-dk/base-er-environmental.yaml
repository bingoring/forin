    goal: 2
    tag: 활력징후
    icon: stetho
    why: I'm going to로 곧 할 일을 미리 알려요. 하는 일을 먼저 말해 주면 환자의 불안이 줄고 협조가 쉬워져요. 체온과 맥박은 더위 노출 환자를 살필 때 기본이 되는 수치예요.
    decoy: for you
    distractorsKo:
    - 지금 혈압과 맥박을 확인해 볼게요.
    - 지금 체온과 호흡을 확인해 볼게요.
    blank:
      answer: temperature
      options:
      - en: oxygen
      - en: temperature
      - en: weight
      - en: blood sugar
  nuance:
  - kind: slider
    words:
    - w-sick
    cue: 'Patient: "My stomach''s a little off, but I haven''t thrown up."'
    scale:
    - queasy
    - nauseous
    - about to throw up
    answerAt: 0
    why: queasy는 속이 살짝 울렁거리는 정도, nauseous는 뚜렷한 메스꺼움, about to throw up은 곧 토할 것 같은 정도예요. '안 토했다, 살짝 이상하다'면 queasy 쪽이에요.
    example: I feel a little queasy, but I'm not going to throw up.
    exKo: 속이 좀 울렁거리지만 토할 것 같지는 않아요.
  - kind: swap
    words:
    - w-long
    - w-heat
    who: 환자에게 · 노출 시간 문진
    icon: me
    before:
    - ''
    - What was the duration of your heat exposure
    - '?'
    options:
    - How long were you out in the heat
    - What was the duration of your heat exposure
    - Why did you stay out in the heat so long
    answer: How long were you out in the heat
    notes:
      How long were you out in the heat: 환자가 바로 알아듣는 쉬운 질문이다.
      What was the duration of your heat exposure: 차트·인계에 어울리는 딱딱한 말이라 어지러운 환자에게는 한 번 더 생각하게 만든다.
      Why did you stay out in the heat so long: 시간을 묻는 게 아니라 탓하는 말로 들린다.
    why: 같은 노출 시간을 묻더라도 환자에게는 how long으로 짧고 쉽게, 탓하는 느낌 없이 물어요.
    ko: 더운 데 얼마나 오래 계셨어요?
