situations:
- title: 노출 환경·시간 문진
  sentences:
  - en: How long were you out in the heat, and were you drinking water?
    ko: 더운 데 얼마나 오래 계셨어요, 그리고 물은 드셨어요?
    chunks:
    - How long were you
    - out in the heat
    - ', and were you'
    - drinking water
    - '?'
    words:
    - w-long
    - w-heat
    - w-drink
    - w-water
    goal: 1
    tag: 노출 시간
    icon: magnify
    why: How long으로 시간을 먼저 열어 묻고, 뒤에 물 섭취를 한 문장으로 이어 물어요. 노출 시간과 수분 섭취는 더위로 인한 탈수와 열 손상 정도를 가늠하는 단서예요.
    decoy: in the shade
    distractorsKo:
    - 더운 데 얼마나 오래 계셨어요, 그리고 식사는 하셨어요?
    - 더운 데 얼마나 오래 계셨어요, 그리고 혼자 계셨어요?
    blank:
      answer: heat
      options:
      - en: heat
      - en: cold
      - en: rain
      - en: wind
  - en: When did you start feeling dizzy or sick?
    ko: 언제부터 어지럽거나 메스꺼우셨어요?
    chunks:
    - When did you
    - start feeling
    - dizzy or sick
    - '?'
    words:
    - w-start
    - w-feel
    - w-dizzy
    - w-sick
    goal: 2
    tag: 증상 시작
    icon: calendar
    why: start feeling으로 증상이 처음 시작된 시점을 물어요. 노출 시간과 증상이 나타난 시점을 맞춰 보면 더위와의 연관을 가늠하기 쉬워요.
    decoy: since last week
    distractorsKo:
    - 언제부터 어지럽거나 두통이 있으셨어요?
    - 언제부터 가렵거나 메스꺼우셨어요?
    blank:
      answer: dizzy
      options:
      - en: itchy
      - en: dizzy
      - en: sore
      - en: thirsty
  - en: Were you able to find any shade or rest?
    ko: 그늘을 찾거나 쉴 수는 있으셨어요?
    chunks:
    - Were you able
    - to find
    - any shade
    - or rest
    - '?'
    words:
    - w-find
    - w-shade
    - w-rest
    goal: 1
    tag: 그늘·휴식
    icon: home
    why: able to find로 찾을 수 있었는지 여건을 물어요. 쉬지 않았다고 탓하는 말이 아니라 상황을 묻는 말이라 편하게 답해요. 그늘과 휴식은 열 노출을 줄이는 기본 조건이에요.
    decoy: in the car
    distractorsKo:
    - 그늘을 찾거나 물을 마실 수는 있으셨어요?
    - 차를 찾거나 쉴 수는 있으셨어요?
    blank:
      answer: shade
      options:
      - en: ice
      - en: food
      - en: shade
      - en: sun
  - en: Tell me where you were and for how long.
    ko: 어디에 얼마나 오래 계셨는지 말씀해 주세요.
    chunks:
    - Tell me
    - where you were
    - and for
    - how long
    - .
    words:
    - w-long
    goal: 1
    tag: 장소·기간
    icon: pushpin
    why: Tell me로 질문 대신 요청의 형태라 환자가 자유롭게 풀어 말해요. 장소와 기간을 한 문장에 묶어 실내외와 햇빛 노출 여부, 시간을 한꺼번에 파악해요.
    decoy: on that day
    distractorsKo:
    - 누구와 얼마나 오래 계셨는지 말씀해 주세요.
    - 어디에 몇 시에 계셨는지 말씀해 주세요.
    blank:
