  - example
  why: 태그 문장 여섯 중 다섯이 명사(any falls · prevent a fall · from the fall)인데 ko가 동사 '넘어지다'였다 — 예문도 명사로
- kind: word
  id: w-quick
  fields:
  - ko
  why: w-fast와 ko(빠른)가 같아 정답이 둘 — quick은 a quick pinch·give fluids quickly처럼 신속한
- kind: word
  id: w-throw
  fields:
  - en
  - ipa
  - example
  why: ko '토하다'는 throw 낱말이 아니라 구 throw up의 뜻 — 태그 문장이 Throwing up이라 구로
- kind: word
  id: w-bleed
  fields:
  - ko
  why: 태그 문장 넷이 모두 명사 bleeding(vaginal bleeding · Bleeding inside)인데 ko가 '출혈되다'였다
- kind: word
  id: w-draw
  fields:
  - ko
  why: 형제 주제 er-sepsis와 맞춤 — 태그 문장은 모두 draw cultures·labs(채혈)
- kind: word
  id: w-concern
  fields:
  - en
  - ipa
  - ko
  why: 태그 문장·예문이 형용사 I'm concerned about infection인데 헤드워드가 동사 concern, ko '걱정하다'였다
- kind: word
  id: w-culture
  fields:
  - ko
  why: 형제 주제 er-sepsis와 맞춤 — cultures는 검사
- kind: word
  id: w-hold
  fields:
  - ko
  why: w-keep과 ko(유지하다)가 겹쳐 듣고 뜻 고르기에서 정답이 둘 — hold는 혈압 수치를 받쳐 주는 쪽
- kind: word
  id: w-work
  fields:
  - ko
  why: '''작동하다''는 기계 같다 — so it works quickly(약·라인이 효과를 낸다); 형제 주제 er-sepsis와 맞춤'
- kind: word
  id: w-close
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드(close, ko '가까이')에 부사가 묶였다 — 태그 문장 둘 모두 watch closely
- kind: word
  id: w-go
  fields:
  - en
  - ipa
  - ko
  - example
  why: 공통 쉬운 말 go이지만 유일한 태그 문장이 go through(훑어보다)라 구 단위로 둔다
- kind: word
  id: w-water
  fields:
  - en
  - ipa
  - ko
  - icon
  - example
  why: ko '물'은 Water pills(이뇨제)에 맞지 않았다 — 태그 문장이 하나뿐이고 water pill은 구로 가르칠 값이 있다
- kind: word
  id: w-swell
  fields:
  - en
  - ipa
  - ko
  why: 태그 문장·예문이 형용사 The swollen leg인데 헤드워드가 동사 swell이었다
- kind: word
  id: w-rate
  fields:
  - ko
  why: 속도·수치를 두루 가리키는 '속도(맥박수)'를 heart rate의 뜻으로 좁히고 형제 주제 er-sepsis와 맞춤
- kind: word
  id: w-septic
  fields:
  - ko
  why: septic shock은 '패혈성 쇼크' — 형제 주제 er-sepsis의 w-septic과 맞춤
- kind: word
  id: w-climb
  fields:
  - ko
  why: 형제 주제 er-sepsis와 맞춤 — lactate is climbing
- kind: word-add
  id: w-squeeze
  why: 언어장벽 문장 3에 이미 있는 말 — 쉬운 w-hand·w-yes·w-no 태그를 빼면 그 문장에 태그가 없어져 새로 세웠다
- kind: word-add
  id: w-possible
  why: 언어장벽 상황의 서로 다른 단어가 7개로 줄어(V3) 문장 4에 이미 있는 as soon as possible의 possible을 세웠다
