"아나필락시스 분포성 쇼크":
  - kind: slider
    words: [w-tight, w-throat, w-airway]
    cue: "Patient, hoarse: \"My throat feels like it's closing and my voice is going.\""
    scale: [scratchy, tight, closing]
    answerAt: 2
    why: "목이 간지럽거나 따가운(scratchy) 건 초기이고, 조이는(tight) 느낌은 부종이 진행되는 신호예요. '닫히는 것 같다'는 기도가 막혀 가는 신호라 즉시 에피네프린과 기도 확보로 이어져요."
    example: "Does your throat feel tight, or like it's closing?"
    exKo: "목이 조이나요, 아니면 막히는 것 같나요?"
  - kind: context
    words: [w-epinephrine, w-give, w-thigh]
    scenes:
      - {who: 차트 기록, icon: board, en: "Epinephrine IM to the right thigh at 14:02.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "I'm giving epinephrine IM in the lateral thigh now.", ok: true}
      - {who: 환자에게, icon: me, en: "I'm administering IM epinephrine to your vastus lateralis.", ok: false, fix: "I'm giving you a shot of epinephrine in your thigh right now."}
    why: "vastus lateralis(외측광근) 같은 해부 용어는 환자에게 낯설어요. 환자에게는 'thigh'와 'shot'처럼 쉬운 말로 설명해요. 아나필락시스의 근육주사는 허벅지 바깥쪽에 놓는 것이 표준이에요."
"수액 반응성 평가":
  - kind: slider
    words: [w-improve]
    cue: "After the fluid bolus, BP went from 92/58 to 104/66. How do you tell the patient?"
    scale: [no change, a little better, much better]
    answerAt: 1
    why: "수치가 올랐지만 아직 지켜볼 단계라 'a little better'가 사실에 맞아요. 과장하지 않고 변화만 정확히 말해요."
    example: "Your pressure is a little better after the fluid."
    exKo: "수액을 드린 뒤 혈압이 조금 나아졌어요."
  - kind: context
    words: [w-urine, w-output, w-low]
    scenes:
      - {who: 차트 기록, icon: board, en: "UOP 20 mL/hr over the last 2 hrs.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "Urine output is 20 an hour, down from 50.", ok: true}
      - {who: 환자에게, icon: me, en: "Your UOP is 20 mL an hour.", ok: false, fix: "You're making less urine than we'd like, so we may give you more fluid."}
    why: "UOP 같은 약어와 mL/hr 수치는 의료진끼리의 말이에요. 환자에게는 '소변이 기대보다 적어서 수액을 더 줄 수 있다'로 풀어 말해요."
  - kind: reel
    words: [w-watch]
    word: watch
    scenes:
      - {who: "간호사 → 환자", en: "We're watching your urine output closely.", ko: "소변량을 꼼꼼히 지켜보고 있어요.", tone: 안내}
      - {who: 야간 인계, en: "Watch his pressure overnight and call me if it drops.", ko: "밤새 혈압을 지켜보다가 떨어지면 저를 호출하세요.", tone: 부탁}
      - {who: "동료에게", en: "Can you watch my patient while I get the fluids?", ko: "수액 가져오는 동안 제 환자 좀 봐 주실래요?", tone: 부탁}
      - {who: "환자에게는…", en: "We'll stay close and keep watching how you do.", ko: "곁에서 계속 상태를 지켜볼게요.", tone: 안심, swap: true}
    why: "watch는 눈을 떼지 않고 변화를 보는 말이에요. 환자에게는 감시가 아니라 곁에서 챙긴다는 느낌으로 말하면 안심이 돼요."
"승압제 시작 전 설명":
  - kind: slider
    words: [w-safe, w-line, w-neck]
    cue: "Patient: \"Is the line in my neck really safe?\" How do you answer?"
    scale: [risky, generally safe, risk-free]
    answerAt: 1
    why: "중심정맥관은 필요하고 널리 쓰이지만 감염·출혈 같은 위험이 0은 아니에요. 'risk-free'라고 약속하지 말고, 조심스럽게 넣고 자주 확인한다고 말해요."
    example: "It's generally safe, and we check it often."
    exKo: "대체로 안전하고, 우리가 자주 확인할게요."
  - kind: context
    words: [w-medicine, w-hold, w-line, w-neck, w-pressure]
    scenes:
      - {who: 차트 기록, icon: board, en: "Norepi 8 mcg/min via R IJ; MAP 66.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "Norepi's at 8, and the MAP is holding at 66.", ok: true}
      - {who: 환자에게, icon: me, en: "Norepi is at 8 mcg/min and titrating to MAP.", ok: false, fix: "This medicine is going in through your neck line to hold your blood pressure up."}
    why: "mcg/min, MAP, titrate 같은 수치와 말은 의료진끼리의 표현이에요. 환자에게는 '목의 라인으로 약이 들어가 혈압을 유지해 준다'처럼 풀어 말해요."
"항응고제 복용 저혈압":
  - kind: pair
    words: [w-count, w-dark, w-stool, w-dose]
    pairs: [[blood, count], [dark, stools], [missed, a dose]]
    decoys: [the weather]
    why: "blood count는 혈구 수 검사, dark stools는 위장관 출혈을 의심하는 대변 표현, miss a dose는 약을 한 번 거르는 것이에요. 항응고제를 쓰는 환자는 이 세 가지를 같이 확인해요."
  - kind: swap
    words: [w-thinner, w-take]
    who: "환자에게 · 약 확인"
    icon: me
    before: ["Are you taking any ", "anticoagulants", "?"]
    options: [blood thinners, anticoagulants, anti-clotting agents]
    answer: blood thinners
    notes:
      blood thinners: "환자가 가장 잘 알아듣는 말. 정확히는 피를 '묽게'가 아니라 응고를 늦추는 약이지만, 환자 대화에서는 이 말이 통한다."
      anticoagulants: "정확한 약리 용어. 환자 중에는 못 알아듣는 사람이 많다."
      anti-clotting agents: "뜻은 맞지만 풀어 쓴 말이라 길고 딱딱하다."
    why: "항응고제를 물을 때는 환자가 쓰는 'blood thinner'로 묻고, 약 이름도 함께 확인해요."
"언어장벽 쇼크 핵심 확인":
  - kind: slider
    words: [w-pain, w-point]
    cue: "No shared language. She points to the middle of a 0–10 pain scale card (about a 5)."
    scale: [mild, moderate, severe]
    answerAt: 1
    why: "숫자·얼굴 척도 카드를 보여 주고 가리키게 하면 말이 통하지 않아도 통증 강도를 알 수 있어요. 4~6점은 보통 moderate로 봐요."
    example: "Point to the number that shows your pain."
    exKo: "통증이 어느 정도인지 숫자를 짚어 주세요."
  - kind: swap
    words: [w-possible, w-interpreter, w-get]
    who: "환자에게 · 통역 기다리는 동안"
    icon: me
    before: ["We'll get the interpreter here ", "right now", "."]
    options: [as soon as possible, right now, in a while]
    answer: as soon as possible
    notes:
      as soon as possible: "지킬 수 있는 약속. 최대한 빨리 오도록 한다는 뜻이라 환자가 안심한다."
      right now: "지금 당장 온다는 약속이라 못 지키면 불안을 키운다."
      in a while: "막연해서 환자를 불안하게 만든다."
    why: "통역사가 언제 올지 확실하지 않을 때는 지킬 수 있는 말로 'as soon as possible'이라고 해요."
"노인 다약제 저혈압":
  - kind: slider
    words: [w-drop, w-pill, w-together]
    cue: "Her BP fell from 130 to 92 after she took all her pills together. She asks: \"Can my pills really make me dizzy?\""
    scale: [might, can, will definitely]
    answerAt: 1
    why: "약이 혈압을 떨어뜨릴 '수 있다'는 가능성의 말이에요. 'will definitely'는 단정이라 사실과 달라요. 원인을 확정하기 전에는 'can'으로 말해요."
    example: "Taking pills together can drop your pressure."
    exKo: "약을 함께 드시면 혈압이 떨어질 수 있어요."
  - kind: swap
    words: [w-go, w-medicine]
    who: "환자에게 · 약 검토"
    icon: me
    before: ["Can we ", "reconcile", " all the medicines you took today?"]
    options: [go through, review, reconcile]
    answer: go through
    notes:
      go through: "환자에게 쉬운 구어. 하나씩 같이 짚어 본다는 느낌이 난다."
      review: "틀린 말은 아니지만 문서 검토처럼 딱딱하다."
      reconcile: "'medication reconciliation'은 의료진의 업무 용어라 환자에게는 낯설다."
    why: "환자와 약을 하나씩 확인할 때는 'go through'가 가장 편하게 들려요."
"원인 미상 저혈압 계통 접근":
  - kind: slider
    words: [w-fever]
    cue: "Temp 99.1°F (37.3°C). Patient: \"Do I have a fever?\""
    scale: [a little warm, a low fever, a high fever]
    answerAt: 0
    why: "발열의 기준선은 보통 100.4℉(38℃)예요. 99.1℉는 아직 열이라고 하기 어려워서 'a little warm' 정도로 말하고 다시 재 봐요."
    example: "You're a little warm, but it's not a fever yet."
    exKo: "약간 따뜻하지만 아직 열은 아니에요."
  - kind: context
    words: [w-cause, w-find, w-run, w-lab]
    scenes:
      - {who: 차트 기록, icon: board, en: "Etiology of hypotension unclear; work-up in progress.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "Still no clear etiology — labs and ECG are pending.", ok: true}
      - {who: 환자에게, icon: me, en: "The etiology of your hypotension is undetermined.", ok: false, fix: "We don't know yet why your pressure is low, so we're running tests to find the cause."}
    why: "etiology, undetermined는 의료진끼리의 말이에요. 환자에게는 '아직 원인을 모르니 검사로 찾고 있다'고 풀어서 말해요."
"패혈증성 쇼크 급속 악화 번들":
  - kind: slider
    words: [w-call, w-pharmacy, w-antibiotic]
    cue: "Septic shock, fluids aren't holding, no antibiotic given yet. How urgently do you tell the pharmacy?"
    scale: [when convenient, soon, right now]
    answerAt: 2
    why: "패혈성 쇼크는 항생제가 늦어질수록 위험이 커져서, 가능한 한 빨리 늦어도 1시간 안에 투여하라고 권고해요(Surviving Sepsis Campaign). 약국에도 시급함을 분명히 말해요."
    example: "I need those antibiotics right now."
    exKo: "그 항생제가 지금 바로 필요해요."
  - kind: context
    words: [w-fluid, w-hold, w-norepinephrine, w-start]
    scenes:
      - {who: 차트 기록, icon: board, en: "Hypotension refractory to fluids; norepi started.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "She's still hypotensive after the fluids — starting norepi.", ok: true}
      - {who: 보호자에게, icon: me, en: "She's fluid-refractory, so we're starting a vasopressor.", ok: false, fix: "The fluids aren't raising her pressure enough, so we're starting a stronger medicine."}
    why: "refractory, vasopressor 같은 말은 의료진끼리의 표현이에요. 보호자에게는 '수액만으로 혈압이 안 올라서 더 강한 약을 시작한다'로 풀어 말해요."
