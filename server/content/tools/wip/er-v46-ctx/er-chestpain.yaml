    why: 아까와 비교해 묻고, 다시 아프다는 답을 근거로 재측정을 하고, 그 검사가 진행되는 동안 의사에게 알리고, 의사가 확인한 뒤 약에 반응하는지 지켜본다고 맺어요. 뒤 줄이 앞 줄을 가리켜서 순서가 하나예요.
    lines:
    - en: How does this pain compare to earlier — same, better, or worse?
      icon: chartup
      ko: 이 통증이 아까와 어떤가요 — 같나요, 나아졌나요, 나빠졌나요?
      note: 비교
    - en: Since it's back, I'm rechecking your vitals and getting a repeat ECG.
      icon: monitor
      ko: 다시 아프시니 활력징후와 심전도를 다시 확인해요
      note: 재측정
    - en: While those are going, I'll update the doctor right away about this change.
      icon: speech
      ko: 그동안 이 변화를 바로 의사에게 알릴게요
      note: 보고
    - en: After the doctor weighs in, let's see if this new pain responds to your medicine.
      icon: pill
      ko: 의사가 판단한 뒤 새 통증이 약에 반응하는지 봐요
      note: 반응
