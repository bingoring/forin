- title: 두부외상 초기 사정
  sentences:
  - en: How did you hit your head?
    ko: 어쩌다가 머리를 부딪히셨어요?
    chunks:
    - How did you
    - hit
    - your head
    - '?'
    words:
    - w-hit
    goal: 1
    tag: 경위 문진
    icon: me
    why: How did you…?로 열어 묻으면 환자가 '어쩌다'를 자기 말로 풀어 설명해요. 부딪힌 방식은 충격의 세기와 방향을 가늠하는 단서예요.
    decoy: your arm
    distractorsKo:
    - 머리 어디가 제일 아프세요?
    - 누가 같이 있었는지 말씀해 주세요
    blank:
      answer: head
      options:
      - en: head
      - en: neck
      - en: back
      - en: chin
  - en: Did you lose consciousness at all?
    ko: 잠깐이라도 의식을 잃으셨나요?
    chunks:
    - Did you lose
    - consciousness
    - at all
    - '?'
    words:
    - w-lose
    - w-consciousness
    goal: 1
    tag: 의식 확인
    icon: magnify
    why: at all을 덧붙이면 '아주 잠깐이라도'를 묻는 말이 돼요. 짧은 의식 소실도 두부외상의 위험도를 가르는 중요한 병력이라 놓치지 않으려는 거예요.
    decoy: at home
    distractorsKo:
    - 머리가 어지럽거나 핑 도세요?
    - 구역질이 나거나 토하셨어요?
    blank:
      answer: consciousness
      options:
      - en: feeling
      - en: consciousness
      - en: vision
      - en: hearing
  - en: Do you remember everything right before it happened?
    ko: 그 일이 있기 직전까지 다 기억나세요?
    chunks:
    - Do you remember
    - everything
    - right before
    - it happened
    - '?'
    words:
    - w-remember
    - w-happen
    goal: 2
    tag: 기억 확인
    icon: bulb
    why: right before로 사고 직전 시점을 짚어 물어요. 사고 직전의 기억이 비어 있는 것은 뇌진탕에서 흔히 보는 소견이에요.
    decoy: right after
    distractorsKo:
    - 그 뒤에 병원까지 어떻게 오셨는지 기억나세요?
    - 오늘 날짜가 며칠인지 아세요?
