  sentences:
  - en: What did you eat, take, or come into contact with before the hives started?
    ko: 두드러기가 시작되기 전에 무엇을 먹었거나 복용했거나, 무엇에 닿았나요?
    chunks:
    - What did you eat, take,
    - or come into contact with
    - before the hives
    - started
    - '?'
    words:
    - w-eat
    - w-take
    - w-contact
    - w-hive
    - w-start
    goal: 1
    tag: 노출원 문진
    icon: magnify
    why: eat·take·contact 세 동사를 한 문장에 묶어 입·약·피부로 들어온 모든 경로를 한 번에 묻고, before로 시점을 잡아 원인 후보를 좁혀요.
    decoy: last night
    distractorsKo:
    - 두드러기가 몇 시간째 계속되고 있나요?
    - 집에서 드시던 약이 있으면 보여 주시겠어요?
    blank:
      answer: hives
      options:
      - en: hives
      - en: fever
      - en: cough
      - en: dizziness
  - en: Have you ever had a reaction like this before?
    ko: 예전에 이런 반응이 있었던 적이 있나요?
    chunks:
    - Have you ever had
    - a reaction
    - like this
    - before
    - '?'
    words:
    - w-ever
    - w-reaction
    - w-before
    goal: 1
    tag: 과거력 문진
    icon: calendar
    why: Have you ever had…는 평생 한 번이라도 있었는지 묻는 현재완료예요. 전에 심한 반응이 있었는지는 이번 반응을 얼마나 경계할지 정하는 단서가 돼요.
    decoy: this morning
    distractorsKo:
    - 최근에 약을 새로 시작하셨나요?
    - 지금 가려운 곳이 어디예요?
    blank:
      answer: reaction
      options:
      - en: fall
      - en: reaction
      - en: fever
      - en: seizure
  - en: Any trouble breathing or tightness in your throat right now?
    ko: 지금 숨쉬기가 힘들거나 목이 조이는 느낌이 있나요?
    chunks:
