situations:
- title: SIRS/qSOFA 기초 사정
  sentences:
  - en: Let me check your temperature, heart rate, and breathing together.
    ko: 체온과 심박수, 호흡을 함께 확인할게요.
    chunks:
    - Let me check
    - your temperature,
    - heart rate,
    - and breathing
    - together
    - .
    words:
    - w-check
    - w-temperature
    - w-heart
    - w-rate
    - w-breathe
    - w-together
    goal: 1
    tag: 활력 측정
    icon: monitor
    why: Let me…는 측정을 하기 전에 먼저 알리는 말투라 환자가 갑작스럽게 느끼지 않아요. 체온·심박수·호흡수는 SIRS 선별에서 가장 먼저 보는 활력징후예요.
    decoy: in the hall
    distractorsKo:
    - 가슴 소리를 먼저 들어 볼게요
    - 지금 손목밴드를 확인할게요
    blank:
      answer: temperature
      options:
      - en: temperature
      - en: weight
      - en: height
      - en: vision
  - en: A few of these being off can be an early warning sign.
    ko: 몇 가지가 어긋나 있으면 조기 경고 신호일 수 있어요.
    chunks:
    - A few of these
    - being off
    - can be
    - an early
    - warning sign
    - .
    words:
    - w-few
    - w-off
    - w-early
    - w-warning
    - w-sign
    goal: 2
    tag: 조기 경고
    icon: bell
    why: can으로 가능성만 말해 겁을 주지 않으면서, early가 지금 살펴보는 이유를 줘요. 수치 하나가 아니라 여러 개가 함께 벗어날 때 패혈증을 의심해요.
    decoy: right now
    distractorsKo:
    - 혈액 검사 결과가 곧 나올 거예요
    - 숨이 차면 바로 알려 주세요
    blank:
