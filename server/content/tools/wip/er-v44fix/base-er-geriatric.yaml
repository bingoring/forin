    - just give out
    - '?'
    words:
    - w-trip
    - w-leg
    - w-give
    goal: 1
    tag: 원인 구분
    icon: compass
    why: or로 두 가능성을 나란히 주면 환자가 걸린 것인지 다리 힘이 풀린 것인지 고를 수 있어요. 걸림은 환경 요인, 힘이 풀림은 근력·혈압·신경 문제를 의심하는 단서예요.
    decoy: by yourself
