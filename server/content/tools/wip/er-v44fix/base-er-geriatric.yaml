situations:
- title: 노인 낙상 후 문진
  sentences:
  - en: Can you tell me what happened right before you fell?
    ko: 넘어지시기 직전에 무슨 일이 있었는지 말씀해 주시겠어요?
    chunks:
    - Can you tell me
    - what happened
    - right before
    - you fell
    - '?'
    words:
    - w-happen
    - w-fall
    goal: 1
    tag: 낙상 정황
    icon: magnify
    why: right before로 시점을 낙상 직전에 고정해요. 노인은 그냥 미끄러졌다고 줄여 말하기 쉬워서, 직전 상황을 열린 질문으로 물어야 어지럼이나 걸림 같은 단서가 나와요.
    decoy: right after
    distractorsKo:
    - 머리를 부딪히셨나요?
    - 그때 혼자 계셨나요?
    blank:
      answer: before
      options:
      - en: before
      - en: after
      - en: when
      - en: as
  - en: Do you remember feeling dizzy or faint before you fell?
    ko: 넘어지시기 전에 어지럽거나 아찔한 느낌이 있으셨나요?
    chunks:
    - Do you remember
    - feeling dizzy
    - or faint
    - before you fell
    - '?'
    words:
    - w-remember
    - w-dizzy
    - w-faint
    - w-fall
    goal: 1
    tag: 실신 전조
    icon: faceWorried
    why: dizzy or faint를 나란히 주면 환자가 어느 쪽에 가까운지 고르기 쉬워요. 낙상 전의 어지럼이나 아찔함은 실신이나 기립성 저혈압 같은 원인을 가르는 단서예요.
    decoy: after dinner
    distractorsKo:
    - 넘어진 뒤에 머리가 아프셨나요?
    - 어지러울 때 약을 드셨나요?
    blank:
      answer: faint
      options:
      - en: numb
      - en: faint
      - en: sleepy
      - en: thirsty
  - en: Did you lose consciousness at any point?
    ko: 잠깐이라도 의식을 잃으신 적이 있나요?
    chunks:
    - Did you lose
    - consciousness
    - at any point
    - '?'
    words:
    - w-lose
    - w-consciousness
    goal: 1
    tag: 의식 소실
    icon: stetho
    why: at any point로 잠깐이라도를 포함해 물어요. 노인은 짧은 실신을 그냥 넘어졌다고 기억하기도 해서 폭넓게 묻는 것이 좋아요.
    decoy: your balance
    distractorsKo:
    - 넘어진 뒤에 일어나기가 힘드셨나요?
    - 넘어질 때 머리를 부딪히셨나요?
    blank:
      answer: consciousness
      options:
      - en: appetite
      - en: hearing
      - en: consciousness
      - en: weight
  - en: Did you trip on something, or did your legs just give out?
    ko: 뭔가에 걸려 넘어지신 건가요, 아니면 다리에 힘이 풀리신 건가요?
    chunks:
    - Did you trip
