    icon: me
    before:
    - 'What '
    - precipitated
    - ' your asthma this time?'
    options:
    - set off
    - precipitated
    - exacerbated
    answer: set off
    notes:
      set off: 환자에게 쉬운 구동사. '뭐 때문에 도졌어요?'가 그대로 전해진다.
      precipitated: 차트나 의료진끼리 쓰는 격식어. 환자에게는 딱딱하고 어렵다.
      exacerbated: 의학 용어라 어렵고, '유발'이 아니라 '악화시켰다'로 뜻도 조금 어긋난다.
    why: 유발요인은 환자에게 set off나 trigger처럼 쉬운 말로 물어요. precipitate·exacerbate는 차트에서 쓰는 말이에요.
