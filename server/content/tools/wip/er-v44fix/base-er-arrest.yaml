    why: H's&T's를 훑을 때 자주 입에 올리는 짝이에요. tension pneumothorax(긴장성 기흉)와 cardiac tamponade(심장눌림증)는 T's, low potassium(저칼륨)은 H's의 칼륨 이상이에요. 굳어진 짝이라 통째로 외워요.
  - kind: context
