      ko: 압박 사이에 가슴이 완전히 이완되게 하세요
      note: 이완
    - en: Now it's right — good depth and full recoil on the monitor.
      icon: star
      ko: 이제 맞아요 — 모니터에 깊이도 이완도 좋아요
      note: 확인
- title: 저체온 심정지 연장 소생
  sentences:
  - en: He's not dead until he's warm and dead.
    ko: 따뜻해지고 나서도 죽어 있어야 사망이에요.
    chunks:
    - He's not dead
    - until he's warm
    - and dead
    - .
    words:
    - w-dead
    - w-warm
    goal: 1
    tag: 핵심 원칙
    icon: star
    why: 저체온 환자는 대사가 크게 줄어 몸이 차가울 때 사망 판단을 서두르지 않는다는 원칙을 짧게 외우는 말이에요. 차가운 몸 자체는 사망 선언의 근거가 되지 않아요.
    decoy: and awake
    distractorsKo:
    - 심부 체온을 식도 탐침으로 재 주세요
    - 따뜻한 수액을 준비해 주세요
    blank:
      answer: warm
      options:
      - en: hot
      - en: stable
      - en: warm
      - en: cold
  - en: Keep compressions going while we actively rewarm him.
    ko: 적극적으로 재가온하는 동안 압박을 계속하세요.
    chunks:
    - Keep compressions going
    - while we actively
    - rewarm him
    - .
    words:
    - w-keep
    - w-compression
    - w-rewarm
    goal: 2
    tag: 압박 유지
    icon: play
    why: while로 동시에 진행되는 두 가지를 이어요. 저체온 심정지는 체온을 올리는 동안에도 압박을 이어 가는 것이 기본이에요.
    decoy: Stop compressions now
    distractorsKo:
    - 젖은 옷을 벗겨 주세요
    - 가온 담요를 덮어 주세요
    blank:
      answer: rewarm
      options:
      - en: cool
      - en: chill
      - en: freeze
      - en: rewarm
  - en: Space out the medications until his core temperature rises.
    ko: 심부 체온이 오를 때까지 약물 간격을 두세요.
    chunks:
    - Space out
    - the medications
    - until his core temperature
    - rises
    - .
    words:
    - w-space
    - w-medication
    - w-core
    - w-temperature
    - w-rise
    goal: 2
    tag: 약물 간격
    icon: pill
    why: space out은 간격을 벌린다는 구동사예요. 저체온에서는 약이 몸에 오래 남아서, 유럽 지침은 30°C 아래에서 에피네프린을 미루고 그 위에서는 간격을 두 배로 늘려요. 미국은 병원 지침에 따라요.
    decoy: the compressions
    distractorsKo:
    - 심부 체온을 15분마다 알려 주세요
    - 체외순환(ECMO) 팀에 연락해 주세요
    blank:
      answer: rises
      options:
      - en: rises
      - en: drops
      - en: falls
      - en: sinks
  - en: His body is very cold, so we'll keep going.
    ko: 몸이 아주 차가워서 계속 소생을 이어갈게요.
    chunks:
    - His body is
    - very cold
    - ', so we''ll'
    - keep going
    - .
    words:
    - w-cold
    - w-keep
    goal: 1
    tag: 이유와 결정
    icon: shield
    why: so로 이유(몸이 매우 차다)와 결정을 이어요. 저체온에서는 뇌가 보호되어 있을 수 있어서 포기하지 않고 계속하는 것이 원칙이에요.
    decoy: stop here
    distractorsKo:
    - 심부 체온은 28도예요
    - 가족에게 상황을 알려 드릴게요
    blank:
      answer: cold
      options:
      - en: pale
      - en: cold
      - en: warm
      - en: wet
  - en: We won't call time of death until he's warm.
    ko: 따뜻해지기 전에는 사망 시각을 선언하지 않을게요.
    chunks:
    - We won't call
    - time of death
    - until he's
    - warm
    - .
    words:
    - w-call
    - w-warm
    goal: 1
    tag: 선언 보류
    icon: bell
    why: won't는 하지 않겠다는 분명한 약속이에요. call time of death에서 call은 사망 시각을 공식적으로 선언한다는 뜻이에요.
    decoy: dry
    distractorsKo:
    - 보호자분께 연락드렸어요
    - 체온을 다시 재 볼게요
    blank:
      answer: death
      options:
      - en: arrival
      - en: discharge
      - en: death
      - en: birth
  nuance:
  - kind: slider
    words:
    - w-core
    - w-temperature
    - w-cold
    cue: 'Esophageal probe: core temperature 27°C (80.6°F).'
    scale:
    - mild hypothermia
    - moderate hypothermia
    - severe hypothermia
    answerAt: 2
    why: 흔히 쓰는 구분은 32~35°C mild, 28~32°C moderate, 28°C 미만 severe예요. 27°C면 severe라 심정지가 올 수 있고, 재가온하며 오래 소생을 이어 가요.
    example: Core temp is 27 — this is severe hypothermia.
    exKo: 심부 체온 27도예요 — 중증 저체온이에요.
  - kind: context
    words:
    - w-dead
    - w-warm
    scenes:
    - who: 팀에게
      icon: speech
      en: He's not dead until he's warm and dead.
      ok: true
    - who: 리더에게 보고
      icon: monitor
      en: Core temp is 27 — we keep going until he's rewarmed.
      ok: true
    - who: 보호자에게
      icon: me
      en: He's not dead until he's warm and dead.
      ok: false
      fix: He's very cold, and cold can protect the brain, so we'll keep going while we warm him.
    why: '''warm and dead''는 팀이 소생을 멈추지 말자고 쓰는 격언이에요. 보호자에게는 dead라는 말만 크게 들리니, 왜 계속하는지를 쉬운 말로 설명해요.'
    word: warm
    ko: 따뜻한
  order:
    tag: 대화 흐름
    icon: compass
    ko: 저체온 심정지 4문장 순서
    why: 너무 차가워 사망을 선언할 수 없다고 판단하고, 그래서 재가온하는 동안 압박을 잇고, 그 재가온 동안 지침대로 에피 간격을 두고, 체온이 오르고 약이 들어간 뒤에야 멈출지 정해요. That means, that rewarming, those doses가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Core temp is 27 — he's too cold to call, so we keep going.
      icon: shield
      ko: 심부 체온 27도예요 — 너무 차가워서 사망 선언은 못 해요, 계속 가요
      note: 결정
    - en: That means compressions continue while we actively rewarm him.
      icon: play
      ko: 그러니 적극적으로 재가온하는 동안 압박은 계속해요
      note: 압박
    - en: During that rewarming, space out the epi per our protocol.
      icon: pill
      ko: 그 재가온 동안 우리 지침에 따라 에피 간격을 두어요
      note: 약물
    - en: Once he's warm and those doses are in, we'll decide whether to stop.
      icon: bell
      ko: 체온이 오르고 그 약이 들어가면 멈출지 정해요
      note: 판단
- title: 고칼륨혈증 심정지 표적치료
  sentences:
  - en: Missed dialysis makes hyperkalemia very likely.
    ko: 투석을 걸러서 고칼륨혈증일 가능성이 아주 높아요.
    chunks:
    - Missed dialysis
    - makes hyperkalemia
    - very likely
    - .
    words:
    - w-dialysis
    - w-hyperkalemia
    - w-likely
    goal: 1
    tag: 원인 추정
    icon: bulb
    why: makes …로 원인과 결과를 이어요. 투석을 거르면 칼륨이 몸에 쌓이기 쉬워서 투석 환자의 심정지에서는 고칼륨혈증을 먼저 의심해요.
    decoy: very rare
    distractorsKo:
    - 투석 카테터가 오른쪽 가슴에 있어요
    - 인슐린을 걸러서 고혈당일 수 있어요
    blank:
      answer: dialysis
      options:
      - en: dialysis
      - en: therapy
      - en: insulin
      - en: rehab
  - en: Give calcium to protect the heart right now.
    ko: 심장을 보호하기 위해 지금 칼슘을 주세요.
    chunks:
    - Give calcium
    - to protect the heart
    - right now
    - .
    words:
    - w-give
    - w-calcium
    - w-protect
    - w-heart
    goal: 2
    tag: 칼슘 투여
    icon: pill
    why: to protect …로 약을 주는 목적을 밝혀요. 칼슘은 칼륨 수치를 낮추지는 않지만 높은 칼륨이 심장에 미치는 영향을 막아 줘요.
    decoy: to lower the potassium
    distractorsKo:
    - 중탄산나트륨도 준비해 주세요
    - 칼륨 수치가 몇이었나요?
    blank:
      answer: calcium
      options:
      - en: calcium
      - en: heparin
      - en: sodium
      - en: potassium
  - en: Push insulin with dextrose to shift the potassium.
    ko: 칼륨을 이동시키기 위해 인슐린과 포도당을 주세요.
    chunks:
    - Push insulin
    - with dextrose
    - to shift the potassium
    - .
    words:
    - w-push
    - w-insulin
    - w-dextrose
    - w-shift
    - w-potassium
    goal: 2
    tag: 칼륨 이동
    icon: pill
    why: with dextrose로 두 약을 함께 준다는 뜻을 담아요. 인슐린은 칼륨을 세포 안으로 밀어 넣고, 포도당은 저혈당을 막아 줘요.
    decoy: to raise the sodium
    distractorsKo:
    - 알부테롤 흡입도 준비해 주세요
    - 30분 뒤에 혈당을 다시 재 주세요
    blank:
      answer: dextrose
      options:
      - en: adenosine
      - en: dextrose
      - en: saline
      - en: heparin
  - en: Ask when he had his last dialysis.
    ko: 마지막 투석이 언제였는지 물어보세요.
    chunks:
    - Ask when he
    - had his last
    - dialysis
    - .
    words:
    - w-dialysis
    goal: 1
    tag: 투석 시점
    icon: calendar
    why: when 절을 목적어로 넣어 물을 내용을 한 문장에 담아요. 마지막 투석 시점은 칼륨이 얼마나 쌓였을지 짐작하는 단서예요.
    decoy: meal
    distractorsKo:
    - 마지막 식사가 언제였는지 물어보세요
    - 투석 혈관이 어느 쪽 팔인지 물어보세요
    blank:
      answer: last
      options:
      - en: only
      - en: usual
      - en: last
      - en: first
  - en: Calcium protects the heart while insulin shifts the potassium.
    ko: 칼슘이 심장을 보호하는 동안 인슐린이 칼륨을 이동시켜요.
    chunks:
    - Calcium protects the heart
    - while insulin
    - shifts
    - the potassium
    - .
    words:
    - w-calcium
    - w-protect
    - w-heart
    - w-insulin
    - w-shift
    - w-potassium
    goal: 2
    tag: 역할 설명
    icon: bulb
    why: while로 두 약이 동시에 하는 서로 다른 일을 나란히 설명해요. 칼슘은 심장을 지키고 인슐린은 칼륨을 세포 안으로 옮겨요.
    decoy: stops
    distractorsKo:
    - 포도당은 저혈당을 막으려고 같이 줘요
    - 신장내과에 응급 투석을 요청할게요
    blank:
      answer: shifts
      options:
      - en: raises
      - en: increases
      - en: doubles
      - en: shifts
  nuance:
  - kind: pair
    words:
    - w-calcium
    - w-insulin
    - w-dextrose
    - w-protect
    - w-shift
    pairs:
    - - calcium
      - protects the heart
    - - insulin
      - shifts potassium into the cells
    - - dextrose
      - prevents low blood sugar
    decoys:
    - removes potassium from the body
    why: 칼슘은 심근막을 안정시켜 심장을 보호하지만 칼륨 수치를 낮추지는 않아요. 인슐린은 칼륨을 세포 안으로 옮기고, 포도당은 인슐린 때문에 혈당이 떨어지는 것을 막아요. 칼륨을 몸 밖으로 빼는 것은 투석 같은 다른 치료예요.
  - kind: swap
    words:
    - w-likely
    - w-hyperkalemia
    who: 리더에게 · 원인 제시
    icon: speech
    before:
    - 'Missed dialysis makes hyperkalemia '
    - definitely the cause
    - .
    options:
    - very likely
    - definitely the cause
    - kind of possible
    answer: very likely
    notes:
      very likely: 검사 전이라 가능성으로 말하되, 강하게 의심된다는 것이 분명하다.
      definitely the cause: 칼륨 수치가 나오기 전에 단정한다. 다른 원인을 찾는 눈이 닫힌다.
      kind of possible: 너무 약하게 들려 팀이 칼슘을 서두르지 않을 수 있다.
    why: 원인을 제시할 때는 확실성의 정도를 정확히 말해요. 병력만으로 강하게 의심되면 very likely로 분명히, 그러나 단정은 하지 않아요.
    ko: 투석을 걸러서 고칼륨혈증일 가능성이 아주 높아요
  order:
    tag: 대화 흐름
    icon: compass
    ko: 고칼륨혈증 대응 4문장 순서
    why: 투석 병력으로 고칼륨혈증을 의심하고, 심장을 먼저 보호한 뒤 칼륨을 옮기고, 인슐린이 듣는 동안 마지막 투석 시점을 물어요. If so, With the heart protected, While the insulin works가 앞 줄을 가리켜 순서가 하나예요.
    lines:
    - en: Missed dialysis makes hyperkalemia very likely.
      icon: bulb
      ko: 투석을 걸러서 고칼륨혈증일 가능성이 아주 높아요
      note: 의심
    - en: If so, give calcium to protect the heart right now.
      icon: pill
      ko: 그렇다면 심장을 보호하게 지금 칼슘을 주세요
      note: 칼슘
    - en: With the heart protected, push insulin with dextrose to shift the potassium.
      icon: pill
      ko: 심장이 보호되면 인슐린과 포도당으로 칼륨을 옮겨요
      note: 이동
    - en: While the insulin works, ask exactly when his last dialysis was.
      icon: calendar
      ko: 인슐린이 듣는 동안 마지막 투석이 정확히 언제였는지 물어봐요
      note: 병력
- title: 임산부 심정지 자궁 좌측 전위
  sentences:
  - en: Manually displace the uterus to the left.
    ko: 손으로 자궁을 왼쪽으로 밀어 주세요.
    chunks:
    - Manually displace
    - the uterus
    - to the left
    - .
    words:
    - w-manually
    - w-displace
    - w-uterus
    - w-left
    goal: 1
    tag: 자궁 이동
    icon: baby
    why: Manually는 기구가 아니라 손으로 한다는 부사예요. 임신 20주쯤부터(자궁 바닥이 배꼽 높이 이상) 자궁이 큰 혈관을 눌러 순환을 방해할 수 있어서 자궁을 왼쪽으로 밀어요.
    decoy: the bed
    distractorsKo:
    - 정맥로는 팔에 잡아 주세요
    - 태아 모니터는 떼어 주세요
    blank:
      answer: left
      options:
      - en: left
      - en: right
      - en: back
      - en: front
  - en: Call OB and neonatal — prepare for a perimortem C-section.
    ko: 산부인과와 신생아과를 불러서 임사 제왕절개를 준비하세요.
    chunks:
    - Call OB and neonatal
    - — prepare
    - for a perimortem
    - C-section
    - .
    words:
    - w-call
    - w-ob
    - w-neonatal
    - w-prepare
    - w-perimortem
    - w-csection
    goal: 2
    tag: 산과팀 호출
    icon: bell
    why: 두 팀을 먼저 부르고 준비할 일을 이어 말해요. perimortem C-section은 임산부가 심정지일 때 소생을 돕기 위해 하는 제왕절개예요. 심정지 4분 안에 자발순환이 없으면 시작해 5분 안에 아기를 꺼내는 것을 목표로 해서, 팀을 처음부터 같이 불러요.
    decoy: appendectomy
    distractorsKo:
    - 정형외과와 마취과를 불러서 기관 삽관을 준비하세요
    - 산부인과만 부르고 제왕절개는 하지 마세요
    blank:
      answer: OB
      options:
      - en: derm
      - en: OB
      - en: ENT
      - en: ortho
  - en: Keep compressions on the lower half of the sternum and continuous.
    ko: 흉골 아래쪽 절반에서 압박을 끊김 없이 계속하세요.
    chunks:
    - Keep compressions
    - on the lower half
    - of the sternum
    - and continuous
    - .
    words:
    - w-keep
    - w-compression
    - w-sternum
    - w-continuous
    goal: 1
    tag: 압박 위치
    icon: chartup
    why: continuous로 압박을 끊지 말라고 덧붙여요. 손 위치는 예전 지침의 '조금 높게'가 아니라 보통 환자와 같은 가슴 중앙(흉골 아래쪽 절반)이에요 — 병원 지침을 따라요.
    decoy: hard
    distractorsKo:
    - 2분마다 압박자를 바꿔요
    - 에피네프린은 평소와 같은 용량이에요
    blank:
      answer: continuous
      options:
      - en: delayed
      - en: optional
      - en: continuous
      - en: occasional
  - en: Someone needs to displace the uterus to the left side.
    ko: 누군가 자궁을 왼쪽으로 밀어야 해요.
    chunks:
    - Someone needs
    - to displace
    - the uterus
    - to the left side
    - .
    words:
    - w-displace
    - w-uterus
    - w-left
    goal: 1
