situations:
- title: 무반응 환자 초기 인지
  sentences:
  - en: Sir, can you hear me? Open your eyes!
    ko: 환자분, 제 목소리 들리세요? 눈 떠보세요!
    chunks:
    - Sir,
    - can you hear me
    - '?'
    - Open your eyes
    - '!'
    words:
    - w-hear
    - w-open
    - w-eye
    goal: 1
    tag: 반응 확인
    icon: speaker
    why: 먼저 부르고 그다음 눈을 뜨라고 시키는 순서예요. 큰 소리로 말을 걸어 반응이 있는지 보는 것이 무반응 확인의 첫 단계예요.
    decoy: Close your eyes
    distractorsKo:
    - 환자분, 어디가 아프세요?
    - 환자분, 성함이 어떻게 되세요?
    blank:
      answer: hear
      options:
      - en: hear
      - en: see
      - en: follow
      - en: answer
  - en: He's not responding — checking for breathing and a pulse.
    ko: 반응이 없어요 — 호흡과 맥박을 확인하고 있어요.
    chunks:
    - He's not responding
    - — checking
    - for breathing
    - and a pulse
    - .
    words:
    - w-respond
    - w-breath
    - w-pulse
    goal: 1
    tag: 상태 보고
    icon: stetho
    why: 지금 하고 있는 행동을 -ing로 같이 말하면 옆 동료가 상황을 바로 따라와요. 호흡과 맥박은 함께 확인해요.
    decoy: on the monitor
    distractorsKo:
    - 의식이 돌아왔어요 — 혈압을 재고 있어요
    - 숨은 쉬어요 — 체온을 확인하고 있어요
    blank:
      answer: pulse
      options:
      - en: murmur
      - en: pulse
      - en: cough
      - en: fever
  - en: No pulse — I'm calling a code and starting compressions.
    ko: 맥박이 없어요 — 코드를 부르고 압박을 시작할게요.
    chunks:
    - No pulse
    - — I'm calling
    - a code
    - and starting compressions
    - .
    words:
    - w-pulse
    - w-call
    - w-code
    - w-start
    - w-compression
    goal: 2
    tag: 코드 선언
    icon: siren
    why: 확인 결과를 먼저 말하고 바로 두 가지 행동을 이어 말해요. 결과와 다음 행동을 한 문장에 담으면 팀이 곧바로 움직여요.
    decoy: a page
    distractorsKo:
    - 맥박이 잡혀요 — 모니터를 붙이고 있어요
    - 맥박이 약해요 — 의사를 호출하고 산소를 줄게요
    blank:
      answer: compressions
      options:
      - en: fluids
      - en: pacing
      - en: compressions
      - en: shocks
  - en: Check for breathing and a pulse for ten seconds.
    ko: 10초 동안 호흡과 맥박을 확인해 주세요.
    chunks:
    - Check
    - for breathing
    - and a pulse
    - for ten seconds
    - .
    words:
    - w-breath
    - w-pulse
    - w-second
    goal: 1
    tag: 확인 지시
    icon: magnify
    why: Check로 시작하는 짧은 명령이라 코드 상황에서 가장 빨리 전달돼요. 시간을 for ten seconds로 못 박으면 확인이 길어지지 않아요.
    decoy: on the monitor
    distractorsKo:
    - 모니터 패드를 먼저 붙여 주세요
    - 2분 뒤에 맥박을 다시 확인해 주세요
    blank:
      answer: breathing
      options:
      - en: breathing
      - en: bleeding
      - en: swelling
      - en: sweating
  - en: This is a cardiac arrest — call the code now.
    ko: 심정지예요 — 지금 코드를 불러 주세요.
    chunks:
    - This is
    - a cardiac arrest
    - — call the code
    - now
    - .
    words:
    - w-arrest
    - w-call
    - w-code
    goal: 2
    tag: 코드 요청
    icon: bell
    why: 판단(This is…)을 먼저 말하고 요청을 이어요. 이유를 앞에 두면 상대가 되묻지 않고 바로 호출해요.
    decoy: later
    distractorsKo:
    - 호흡곤란이에요 — 산소를 올려 주세요
    - 맥박이 있어요 — 모니터만 붙여 주세요
    blank:
      answer: cardiac
      options:
      - en: cardiac
      - en: respiratory
      - en: septic
