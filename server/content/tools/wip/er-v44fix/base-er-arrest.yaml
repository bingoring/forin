    why: ACLS의 시간 기준이에요. 에피네프린 1 mg은 3~5분마다, 리듬 확인은 2분 압박 주기마다 해요. 그래서 에피는 보통 리듬 확인 한두 번에 한 번꼴로 들어가요.
