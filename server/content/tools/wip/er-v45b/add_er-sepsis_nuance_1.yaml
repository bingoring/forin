SIRS/qSOFA 기초 사정:
  - kind: slider
    words: [w-fast, w-heart, w-rate]
    cue: "Triage vitals: HR 96, temp 38.4°C, RR 22. How do you describe the heart rate to the patient?"
    scale: [normal, a little fast, dangerously fast]
    answerAt: 1
    why: "HR 96은 SIRS 기준(90 초과)을 넘지만 위험할 만큼 빠른 건 아니에요. 환자에게는 사실대로 'a little fast'라고 말하고, 다른 활력징후와 함께 봐요."
    example: "Your heart rate is a little fast right now."
    exKo: "지금 심박수가 조금 빨라요."
  - kind: context
    words: [w-infection, w-possible, w-warning, w-sign]
    scenes:
      - {who: 차트 기록, icon: board, en: "SIRS 3/4 (T 38.4, HR 96, RR 22); possible infection — sepsis screen positive.", ok: true}
      - {who: 차지 간호사에게, icon: speech, en: "She meets three SIRS criteria with a possible source — I'm flagging her for sepsis.", ok: true}
      - {who: 환자에게, icon: me, en: "You meet three SIRS criteria, so you screened positive for sepsis.", ok: false, fix: "A few of your numbers are off, which can be an early warning sign of infection, so we're checking closely."}
    why: "SIRS 기준·스크린 양성은 의료진끼리의 말이에요. 환자에게는 '몇 가지 수치가 벗어나 있고, 감염의 조기 경고 신호일 수 있다'처럼 풀어서 말해요."
감염 의심+활력 이상:
  - kind: pair
    words: [w-draw, w-blood, w-find, w-cause, w-race, w-heart]
    pairs: [[draw, blood], [find out, what's causing this], [racing, heart]]
    decoys: [belly]
    why: "피를 뽑는 건 draw blood, 원인을 알아내는 건 find out what's causing this, 심장이 쿵쿵 빠르게 뛰는 건 a racing heart예요."
  - kind: context
    words: [w-fast, w-breathe, w-fever]
    scenes:
      - {who: 차트 기록, icon: board, en: "T 38.9, HR 118, RR 26.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "She's febrile at 38.9, tachycardic at 118, and tachypneic at 26.", ok: true}
      - {who: 환자에게, icon: me, en: "You're febrile, tachycardic, and tachypneic.", ok: false, fix: "You have a fever, your heart is beating fast, and you're breathing fast."}
    why: "febrile·tachycardic·tachypneic은 의료진끼리 쓰는 임상어예요. 환자에게는 fever, heart beating fast, breathing fast처럼 쉬운 말로 풀어요."
배양 채취 설명:
  - kind: slider
    words: [w-delay, w-antibiotic, w-few]
    cue: "Patient: \"Why can't I just get the antibiotic first?\" Cultures take a few minutes to draw."
    scale: [slightly, significantly, dangerously]
    answerAt: 0
    why: "배양은 몇 분이면 뽑아요. 지침(Surviving Sepsis Campaign)도 항생제를 크게 늦추지 않는 한에서 배양을 먼저 뽑으라고 해요. 그래서 'slightly delays'가 사실에 맞아요."
    example: "Drawing cultures only slightly delays your antibiotic."
    exKo: "배양을 뽑는 건 항생제를 아주 조금 늦출 뿐이에요."
  - kind: swap
    words: [w-bug, w-exact, w-culture]
    who: "환자에게 · 배양 목적 설명"
    icon: me
    before: ["We draw blood cultures before antibiotics to find the exact ", "pathogen", "."]
    options: [bug, pathogen, organism]
    answer: bug
    notes:
      bug: "환자에게 세균을 쉽고 가볍게 말하는 구어. 미국 병원에서 환자와 대화할 때 흔히 쓴다."
      pathogen: "정확한 의학 용어지만 환자에게는 어렵고 딱딱하다."
      organism: "검사실·차트의 말. 환자에게는 낯설게 들린다."
    why: "같은 균이라도 환자에게는 bug처럼 쉬운 말로, 검사 결과를 논할 때는 organism·pathogen으로 말해요."
정맥로·수액 시작 설명:
  - kind: slider
    words: [w-cold, w-arm, w-feel]
    cue: "Patient: \"My arm feels a little chilly where the fluid goes in.\" No swelling, no pain at the site."
    scale: [cool, cold, freezing]
    answerAt: 0
    why: "실온 수액이 빠르게 들어가면 팔이 서늘하게 느껴질 수 있어요. 다만 부기·통증·창백함이 함께 있으면 침윤일 수 있으니 삽입 부위를 확인해요."
    example: "The fluid may feel cool going into your arm."
    exKo: "수액이 팔로 들어갈 때 서늘하게 느껴질 수 있어요."
  - kind: swap
    words: [w-give, w-quick, w-need, w-support]
    who: "환자에게 · 수액 속도 설명"
    icon: me
    before: ["We're giving them quickly because ", "it's just routine", "."]
    options: [your body needs the support, it's just routine, you're in septic shock]
    answer: your body needs the support
    notes:
      your body needs the support: "빠르게 주는 이유를 사실대로, 겁주지 않게 말한다."
      it's just routine: "빠르게 주는 진짜 이유를 감춘다. 나중에 사실을 알면 신뢰를 잃는다."
      you're in septic shock: "확정되지 않은 무거운 진단명을 불쑥 꺼내 불안만 키운다."
    why: "수액을 빨리 주는 이유는 숨기지도 부풀리지도 않고, 몸이 지금 도움이 필요하다고 말해요."
소변량 모니터링 설명:
  - kind: pair
    words: [w-urine, w-output, w-organ, w-get, w-blood]
    pairs: [[urine, output], [every, hour], [your organs are getting, blood]]
    decoys: [pressure]
    why: "소변량은 urine output, 매시간은 every hour, 장기에 피가 잘 간다는 건 your organs are getting blood예요."
  - kind: context
    words: [w-urine, w-output, w-kidney]
    scenes:
      - {who: 차트 기록, icon: board, en: "UOP 20 mL/hr x 2 hrs, below 0.5 mL/kg/hr goal.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "His urine output has been 20 an hour for the last two hours — below goal.", ok: true}
      - {who: 환자에게, icon: me, en: "Your UOP is below 0.5 mL/kg/hr.", ok: false, fix: "You're making less urine than we'd like, so we're watching your kidneys closely."}
    why: "UOP·mL/kg/hr는 차트와 의료진끼리의 말이에요(흔한 목표는 시간당 체중 1 kg마다 0.5 mL 이상). 환자에게는 '소변이 바라는 만큼 나오지 않는다'고 풀어요."
패혈증 1시간 번들:
  - kind: slider
    words: [w-lactate]
    cue: "Lab calls: lactate 4.6 mmol/L."
    scale: [normal, mildly elevated, markedly elevated]
    answerAt: 2
    why: "젖산은 2 mmol/L 이상이면 비정상, 4 이상이면 크게 오른 것으로 보고 30 mL/kg 수액 같은 적극 소생의 기준이 돼요. 4.6은 markedly elevated예요."
    example: "Her lactate is markedly elevated at 4.6."
    exKo: "젖산이 4.6으로 크게 올랐어요."
  - kind: context
    words: [w-explain, w-step]
    scenes:
      - {who: 차트 기록, icon: board, en: "Sepsis alert 1405. Hour-1 bundle initiated.", ok: true}
      - {who: 동료 간호사에게, icon: speech, en: "Sepsis alert in bed 4 — let's get the hour-1 bundle going.", ok: true}
      - {who: 환자에게, icon: me, en: "We're starting your hour-1 bundle.", ok: false, fix: "We have one hour to get four important things done, and I'll explain each step."}
    why: "hour-1 bundle은 의료진끼리 쓰는 말이에요. 환자에게는 '한 시간 안에 중요한 것 네 가지를 한다, 하나씩 설명하겠다'고 풀어야 빨라진 처치에 덜 놀라요."
젖산 상승 해석:
  - kind: slider
    words: [w-improve, w-lactate, w-recheck]
    cue: "Repeat lactate after fluids: 4.2 → 3.1 mmol/L."
    scale: [getting worse, improving, back to normal]
    answerAt: 1
    why: "4.2에서 3.1이면 좋아지는 중이지만 아직 2를 넘어 정상은 아니에요. 그래서 다시 재서 추적해요."
    example: "Your lactate is improving, but it's not normal yet."
    exKo: "젖산이 좋아지고 있지만 아직 정상은 아니에요."
  - kind: swap
    words: [w-mean, w-tissue, w-oxygen, w-enough]
    who: "환자에게 · 젖산 의미 설명"
    icon: me
    before: ["A high lactate means ", "you have lactic acidosis", "."]
    options: [your tissues aren't getting enough oxygen, you have lactic acidosis, your muscles are just tired]
    answer: your tissues aren't getting enough oxygen
    notes:
      your tissues aren't getting enough oxygen: "환자가 알아들을 수 있게 풀어서, 왜 수액을 주는지와 이어지게 말한다."
      you have lactic acidosis: "의학 용어라 환자는 뜻을 모른다. 설명이 아니라 진단명만 던진 말이 된다."
      your muscles are just tired: "운동 뒤 근육 피로와 섞은 설명이라, 지금 상태가 얼마나 무거운지 전해지지 않는다."
    why: "젖산은 환자에게 '조직에 산소가 충분히 가지 않는다'는 신호로 풀어 말해요. 그래야 수액과 재측정의 이유가 이어져요."
