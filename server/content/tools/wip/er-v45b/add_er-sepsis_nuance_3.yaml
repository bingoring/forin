패혈증 언어장벽 위중:
  - kind: slider
    words: [w-urgent, w-antibiotic, w-give]
    cue: "Possible septic shock: BP 78/40 after fluids. Antibiotics are not in yet."
    scale: [eventually, soon, urgently]
    answerAt: 2
    why: "패혈성 쇼크가 의심되면 인지 후 1시간 안에 항생제를 시작하라고 해요(Surviving Sepsis Campaign). 가족에게도 'urgently'라고 분명히 말해야 빠르게 진행되는 처치를 이해해요."
    example: "We're giving fluids and antibiotics urgently."
    exKo: "수액과 항생제를 긴급하게 드리고 있어요."
  - kind: context
    words: [w-interpreter, w-believe, w-serious, w-infection]
    scenes:
      - {who: 차트 기록, icon: board, en: "Suspected sepsis, likely urinary source. Family updated via Spanish interpreter.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "She's likely septic from a urinary source — I updated the family through the interpreter.", ok: true}
      - {who: 통역을 거쳐 가족에게, icon: me, en: "She's got a nasty bug, but hang in there.", ok: false, fix: "We believe she has a serious infection, and we are treating it now."}
    why: "통역을 거칠 때는 관용어·속어(nasty bug, hang in there)를 피하고 짧고 분명한 문장으로 말해요. 관용어는 다른 언어로 그대로 옮겨지지 않아 뜻이 흐려지거나 가볍게 들려요."
패혈성 쇼크 승압제:
  - kind: pair
    words: [w-refractory, w-shock, w-central, w-access, w-run, w-pressor]
    pairs: [[fluid-refractory, shock], [central, access], [run, the pressor]]
    decoys: [bedside]
    why: "수액에 반응하지 않는 쇼크는 fluid-refractory shock, 중심정맥 확보는 central access, 승압제를 펌프로 계속 주입하는 건 run the pressor예요."
  - kind: swap
    words: [w-physician, w-bedside, w-need, w-map, w-liter]
    who: "의사에게 · SBAR 요청"
    icon: speech
    before: ["Septic shock, MAP under sixty-five after two liters — I need the physician ", "whenever they're free", "."]
    options: [at bedside, whenever they're free, to call me back]
    answer: at bedside
    notes:
      at bedside: "원하는 것이 분명한 요청(SBAR의 R). 승압제와 중심라인을 침상에서 바로 정할 수 있다."
      whenever they're free: "급하지 않은 일처럼 들려, 수액 불응 쇼크의 무게가 전해지지 않는다."
      to call me back: "전화 회신만으로는 중심라인·승압제 결정을 침상에서 바로 내리기 어렵다."
    why: "SBAR의 마지막 R(요청)은 무엇을, 언제까지 원하는지 구체적으로 말해요. 수액 불응 쇼크라면 '지금 침상으로'예요."
다장기부전 진행:
  - kind: slider
    words: [w-kidney, w-number, w-get]
    cue: "Creatinine 1.2 → 2.0 → 3.1 over 12 hours. Family asks about her kidneys."
    scale: [improving, stable, getting worse]
    answerAt: 2
    why: "크레아티닌이 계속 오르면 신장 기능이 나빠지는 거예요. 가족에게는 수치 자체보다 'kidney numbers are getting worse'처럼 방향으로 말해요."
    example: "Her kidney numbers and liver numbers are both getting worse."
    exKo: "신장 수치와 간 수치가 둘 다 나빠지고 있어요."
  - kind: context
    words: [w-affect, w-several, w-organ, w-kidney, w-clot]
    scenes:
      - {who: 차트 기록, icon: board, en: "AKI (Cr 3.1), shock liver, evolving DIC — MODS.", ok: true}
      - {who: ICU 의사에게, icon: speech, en: "She's in multi-organ failure — kidneys, liver, and she's developing DIC.", ok: true}
      - {who: 가족에게, icon: me, en: "She has MODS with AKI, shock liver, and DIC.", ok: false, fix: "The infection is now affecting several of her organs — her kidneys, her liver, and her blood's ability to clot."}
    why: "MODS·AKI·DIC는 의료진끼리의 약어예요. 가족에게는 어떤 장기가 영향을 받는지 쉬운 말로 하나씩 짚어요."
  - kind: swap
    words: [w-blood, w-clot]
    who: "가족에게 · 응고 이상 설명"
    icon: me
    before: ["Her blood isn't ", "coagulating", " as well as it should right now."]
    options: [clotting, coagulating, thickening]
    answer: clotting
    notes:
      clotting: "가족이 바로 알아듣는 일상어."
      coagulating: "맞는 말이지만 의학 용어라 가족에게는 딱딱하다."
      thickening: "뜻이 다르다. 피가 진해진다는 말로 들려 오해를 부른다."
    why: "같은 응고 이상이라도 가족에게는 clotting처럼 쉬운 말로 말해요."
젖산 지속상승 위기:
  - kind: slider
    words: [w-lactate, w-climb]
    cue: "Lactate 4.1 → 4.8 → 5.6 despite 30 mL/kg of fluids."
    scale: [improving, holding steady, still climbing]
    answerAt: 2
    why: "충분한 수액에도 젖산이 계속 오르면 소생이 듣지 않는다는 신호예요. 바로 의사에게 올려 승압제 등 다음 단계를 논의해요."
    example: "Your lactate is still climbing, which tells me you need more support."
    exKo: "젖산이 계속 오르고 있어서 지지가 더 필요하다는 뜻이에요."
  - kind: context
    words: [w-mottle, w-skin, w-circulation, w-blotchy, w-cold]
    scenes:
      - {who: 차트 기록, icon: board, en: "Mottling to bilateral knees, extremities cool, cap refill 5 sec.", ok: true}
      - {who: 의사에게 보고, icon: speech, en: "She's mottled to the knees, her feet are cold, and cap refill is five seconds.", ok: true}
      - {who: 환자에게, icon: me, en: "You have mottling to bilateral knees with a cap refill of five seconds.", ok: false, fix: "Your skin is getting blotchy and cold, which means your circulation is struggling."}
    why: "차트와 보고에는 범위와 수치(무릎까지, 모세혈관 재충전 5초)를 정확히 적지만, 환자에게는 피부가 얼룩덜룩하고 차가워진다는 것과 그 뜻을 쉬운 말로 전해요."
  - kind: swap
    words: [w-call, w-physician, w-improve]
    who: "환자 곁에서 · 긴급 호출"
    icon: monitor
    before: ["I'm calling the physician back ", "sometime soon", " — this isn't improving."]
    options: [now, sometime soon, after the next bag]
    answer: now
    notes:
      now: "소생이 듣지 않을 때는 지체 없이 올린다. 환자에게도 바로 움직인다는 게 전해진다."
      sometime soon: "언제인지 흐려서 급한 상황이 급하게 들리지 않는다."
      after the next bag: "젖산이 오르는데 수액만 더 주며 기다리는 건 소생 실패를 놓치는 길이다."
    why: "젖산이 계속 오르고 피부가 얼룩덜룩해지면 '지금' 의사를 다시 불러요."
쇼크 급변 삽관:
  - kind: slider
    words: [w-work, w-hard, w-breathe]
    cue: "Speaking in one- or two-word bursts, RR 38, using neck muscles, SpO2 86% on a non-rebreather."
    scale: [breathing comfortably, a little short of breath, working very hard to breathe]
    answerAt: 2
    why: "한두 단어씩 끊어 말하고 목 근육까지 쓰는 건 호흡근이 지쳐 간다는 신호예요. 호흡부전이 가까우니 바로 알리고 기도확보를 준비해요."
    example: "You're working very hard to breathe right now."
    exKo: "지금 숨쉬려고 정말 애쓰고 계세요."
  - kind: swap
    words: [w-tube, w-help, w-breathe]
    who: "환자에게 · 삽관 설명"
    icon: me
    before: ["We're going to ", "intubate you", " to help you breathe."]
    options: [put a breathing tube in, intubate you, put you on life support]
    answer: put a breathing tube in
    notes:
      put a breathing tube in: "무엇을 하는지 환자가 바로 그려지는 쉬운 말."
      intubate you: "의료진의 말. 숨이 가쁜 환자가 뜻을 되묻기 어렵다."
      put you on life support: "틀린 말은 아니지만 생명이 끝나 간다는 말로 들려 공포를 키운다."
    why: "숨이 가쁜 환자에게는 짧고 쉬운 말로, 무엇을 왜 하는지만 전해요."
패혈증 심정지 전조:
  - kind: pair
    words: [w-crash, w-cart, w-imminent, w-arrest, w-pulse]
    pairs: [[crash, cart], [imminent, arrest], [thready, pulse]]
    decoys: [monitor]
    why: "심정지에 대비한 응급 카트는 crash cart, 곧 닥칠 심정지는 imminent arrest, 가늘고 약하게 만져지는 맥박은 thready pulse예요."
  - kind: swap
    words: [w-get, w-crash, w-cart]
    who: "팀에게 · 소생 준비 지시"
    icon: siren
    before: ["Sarah, ", "can someone get the crash cart", " — now."]
    options: [get the crash cart here, can someone get the crash cart, the crash cart might be needed]
    answer: get the crash cart here
    notes:
      get the crash cart here: "이름을 부른 한 사람에게 할 일을 분명히 맡긴다. 맡은 사람이 복창하면 고리가 닫힌다."
      can someone get the crash cart: "'someone'에게 맡기면 서로 미루다 아무도 움직이지 않을 수 있다."
      the crash cart might be needed: "지시인지 의견인지 흐려서, 들은 사람이 움직여야 하는지 모른다."
    why: "위기 상황의 지시는 이름을 불러 한 사람에게, 짧고 분명하게 해요(closed-loop communication)."
중증 패혈증 ICU 이송:
  - kind: pair
    words: [w-septic, w-shock, w-urine, w-output, w-bundle, w-complete]
    pairs: [[septic, shock], [urine, output], [bundle, completed]]
    decoys: [dose]
    why: "감염으로 온 쇼크는 septic shock, 시간당 소변량은 urine output, 번들을 다 마쳤다는 건 bundle completed라고 인계해요."
  - kind: swap
    words: [w-hold, w-map, w-norepinephrine]
    who: "ICU 간호사에게 · SBAR 인계"
    icon: speech
    before: ["He's on norepinephrine at eight, MAP ", "is fine", " at sixty-six."]
    options: [holding, is fine, dropping]
    answer: holding
    notes:
      holding: "승압제를 쓰면서 그 값이 유지되고 있다는 정확한 인계 말."
      is fine: "승압제가 필요한 쇼크 환자에게 '괜찮다'는 판단을 붙여, 받는 쪽이 상태를 가볍게 본다."
      dropping: "사실과 다르다. 수치가 내려가고 있다는 뜻이 되어 ICU가 다른 판단을 한다."
    why: "인계에서는 판단(fine)이 아니라 상태(holding at 66)를 말해요. 받는 쪽이 스스로 판단할 수 있게요."
