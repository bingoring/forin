- kind: word
  id: w-rate
  fields:
  - ko
  why: w-level·w-number와 ko(수치)가 셋이 같아 듣고 뜻 고르기에서 정답이 여럿 — 태그 문장은 모두 heart rate(형제 주제의 w-rate도 박동수)
- kind: word
  id: w-close
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드(close, ko '가까운')에 부사가 묶였다 — 태그 문장 8개 중 6개가 watch closely
- kind: word
  id: w-draw
  fields:
  - ko
  why: w-take와 ko(채취하다)가 같아 정답이 둘 — draw blood는 피를 뽑는 것
- kind: word
  id: w-choose
  fields:
  - ko
  why: w-pick과 ko(고르다)가 같아 정답이 둘
- kind: word
  id: w-quick
  fields:
  - ko
  why: w-fast와 ko(빠른)가 같아 정답이 둘 — 태그 문장은 quick treatment·giving them quickly·moving quickly
- kind: word
  id: w-short
  fields:
  - en
  - ipa
  why: ko '숨이 찬'은 낱말 short가 아니라 구의 뜻 — 태그 문장 셋 모두 short of breath라 구로
- kind: word
  id: w-move
  fields:
  - ko
  why: ko '진행하다'가 the baby moving less(태아 움직임)에 맞지 않았다
- kind: word
  id: w-level
  fields:
  - ko
  why: w-number와 ko(수치)가 같아 정답이 둘 — lactate level·oxygen level은 혈중 농도
- kind: word
  id: w-confuse
  fields:
  - en
  - ipa
  - ko
  why: 태그 문장·예문이 모두 형용사 confused(he's cold and confused)인데 헤드워드가 동사 confuse, ko '혼란스럽게 하다'였다
- kind: word
  id: w-run
  fields:
  - ko
  - example
  why: ko '(열이) 나다'는 태그 문장 넷 중 하나(run a fever)에만 맞았다 — 나머지 셋은 run the pressor; run a fever는 새 단어 w-runfever로
- kind: word
  id: w-side
  fields:
  - ko
  why: w-flank와 ko(옆구리)가 같아 정답이 둘 — flank가 임상어 옆구리, side는 일상어 옆
- kind: word
  id: w-come
  fields:
  - en
  - ipa
  - ko
  - example
  why: 공통 쉬운 말 come이지만 유일한 태그 문장이 blood pressure came up이라 구(come up)로 둔다; ko '오르다'가 w-rise와 겹쳐 가른다
- kind: word
  id: w-thorough
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드에 부사가 묶였다 — 태그 문장은 check thoroughly
- kind: word
  id: w-continuous
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드에 부사가 묶였다 — 태그 문장은 monitoring continuously
- kind: word
  id: w-urgent
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드에 부사가 묶였다 — 태그 문장은 giving … urgently
- kind: word
  id: w-climb
  fields:
  - ko
  why: w-rise·w-come과 ko(오르다)가 같아 정답이 여럿
- kind: word
  id: w-mottle
  fields:
  - en
  - ipa
  - ko
  why: 태그 문장·예문이 모두 명사 mottling(the mottling of your skin)인데 헤드워드가 동사 mottle이었다
- kind: word
  id: w-immediate
  fields:
  - en
  - ipa
  - ko
  - example
  why: 형용사 헤드워드에 부사가 묶였다 — 태그 문장은 immediately
- kind: word-add
  id: w-runfever
  why: 노인 비전형 패혈증 문장 3에 이미 있는 관용구 — w-run(주입하다)과 뜻이 달라 따로 세웠다
