# er-shock 결정 11 가벼운 정리 — build_er-shock.py가 읽는다.
word_edits:
  w-come:
    set: {en: "come up", ipa: "/ˌkʌm ˈʌp/", ko: "(수치가) 올라오다", example: "After the fluid, your pressure came up a little."}
    why: "공통 쉬운 말 come이지만 수액 반응 문장이 pressure came up이라 구(come up)로 둔다 — 형제 주제 er-sepsis와 같은 헤드워드·ko; coming from·is coming 문장은 태그를 뺐다"
  w-go:
    set: {en: "go through", ipa: "/ˌɡoʊ ˈθruː/", ko: "(하나씩) 살펴보다"}
    why: "공통 쉬운 말 go이지만 유일한 태그 문장이 go through all the medicines라 구동사로 둔다(ko '가다·훑다'는 낱말 뜻이 섞였다)"
  w-close:
    set: {en: "closely", ipa: "/ˈkloʊsli/", ko: "면밀히"}
    why: "형용사 헤드워드에 부사가 묶였다 — 태그 문장 둘 다 watch … closely(형제 주제 er-sepsis와 같게)"
  w-quick:
    set: {en: "quickly", ipa: "/ˈkwɪkli/", ko: "신속하게"}
    why: "형용사 헤드워드에 부사가 묶였다(태그 문장 4개 중 3개가 quickly) — a quick pinch 문장은 태그를 뺐고, w-fast(빠른)와 ko가 겹치던 것도 가른다(형제 주제의 '신속한'에 맞춘 부사형)"
  w-safe:
    set: {en: "safely", ipa: "/ˈseɪfli/", ko: "안전하게"}
    why: "형용사 헤드워드에 부사가 묶였다 — 유일한 태그 문장이 works quickly and safely"
  w-thinner:
    set: {en: "blood thinner", ipa: "/ˈblʌd ˌθɪnər/", ko: "항응고제"}
    why: "낱말 thinner는 항응고제가 아니다 — 태그 문장 둘 다 blood thinner(s)라 구로"
  w-water:
    set: {en: "water pill", ipa: "/ˈwɔːtər ˌpɪl/", ko: "이뇨제"}
    why: "ko '물'이 태그 문장(Water pills … heart pills)의 뜻과 다르다 — 환자가 이뇨제를 부르는 말이라 구로"
  w-throw:
    set: {en: "throw up", ipa: "/ˌθroʊ ˈʌp/", ko: "토하다"}
    why: "낱말 throw는 '토하다'가 아니다 — 태그 문장이 Throwing up이라 구동사로"
  w-rate:
    set: {ko: "박동수"}
    why: "태그 문장 둘 다 slow heart rate — '속도(맥박수)'를 형제 주제 er-sepsis의 ko에 맞췄다"
  w-run:
    set: {ko: "(약물을) 주입하다", example: "Her pressure keeps dropping despite two pressors running."}
    why: "태그 문장 넷 중 셋이 약물·수혈 주입(it's running·lines running·pressors running) — 형제 주제 ko에 맞추고, running labs 문장은 태그를 빼며 예문도 주입 문장으로"
  w-septic:
    set: {ko: "패혈성의"}
    why: "septic shock의 표준 번역은 '패혈성 쇼크' — 형제 주제 er-sepsis의 ko에 맞췄다"
  w-climb:
    set: {ko: "올라가다"}
    why: "w-come(올라오다)·w-raise(올리다)와 뜻이 붙어 있어 형제 주제 er-sepsis의 ko에 맞춰 가른다"
  w-right:
    set: {ko: "오른쪽의"}
    why: "'오른쪽·맞는'이 right now(지금 당장) 문장에까지 붙어 있었다 — 그 태그를 빼고 right heart 뜻만 남긴다"
  w-dark:
    set: {ko: "(색이) 짙은"}
    why: "w-black(검은)과 ko가 겹쳐 듣고 뜻 고르기에서 정답이 둘 — dark stools는 짙은 색 변"
  w-large:
    set: {ko: "굵은"}
    why: "w-big(큰)과 ko가 겹쳤다 — 태그 문장은 large-bore IV·large IV lines(굵은 정맥로)"
  w-work:
    set: {ko: "효과가 나다"}
    why: "'작동하다'는 기계에 쓰는 말 — 태그 문장은 약이 works quickly(효과가 나다); 형제 주제의 '효과가 있다'와 같은 뜻"
  w-slow:
    set: {example: "Low pressure with a slow heart rate points to neurogenic shock."}
    why: "형용사 slow에 부사 slowly 문장(small sips slowly) 둘이 묶여 있어 그 태그를 뺐다 — 예문도 형용사 문장으로"
word_remove:
  w-hand: "너무 쉬움(공통 목록) — 문장은 두고 태그만 뺐고, 어느 문장도 태그하지 않게 됐다"
  w-today: "너무 쉬움(공통 목록) — 문장은 두고 태그만 뺐고, 어느 문장도 태그하지 않게 됐다"
  w-see: "너무 쉬움(공통 목록) — 문장은 두고 태그만 뺐고, 어느 문장도 태그하지 않게 됐다"
  w-head: "너무 쉬움(공통 목록) — 문장은 두고 태그만 뺐고, 어느 문장도 태그하지 않게 됐다"
  w-minute: "너무 쉬움(공통 목록) — 문장은 두고 태그만 뺐고, 어느 문장도 태그하지 않게 됐다"
  w-hour: "너무 쉬움(공통 목록) — 문장은 두고 태그만 뺐고, 어느 문장도 태그하지 않게 됐다"
  w-yes: "너무 쉬움(판단) — 간호사가 이미 아는 말이고 YAML 예약어라 적재 위험도 있다; 어느 문장도 태그하지 않게 됐다"
  w-no: "너무 쉬움(판단) — 간호사가 이미 아는 말이고 YAML 예약어라 적재 위험도 있다; 어느 문장도 태그하지 않게 됐다"
  w-begin: "유일한 태그 문장이 명사 the beginning이라 동사 헤드워드와 맞지 않고 w-start(시작하다)와 ko도 같았다 — 쉬운 말이라 태그를 빼고 지웠다"
  w-through: "유일한 태그 문장(go through)이 w-go를 구동사 go through로 바꾸며 그쪽에 묶였다 — 전치사 단독 '~을 통해'는 그 문장의 뜻과 맞지 않았다"
word_add:
  - word: {id: w-squeeze, en: squeeze, ipa: "/skwiːz/", ko: "꽉 쥐다", icon: handshake2, example: "Squeeze my hand once for yes, twice for no."}
    why: "쉬운 w-hand·w-yes·w-no를 빼면 언어장벽 상황의 서로 다른 단어가 7개로 줄어 — 그 상황 문장 3에 이미 있는 가르칠 말"
sentence_edits:
  - {situation: "저혈압 초기 활력 인지", index: 1, untag: [w-hand]}
  - {situation: "기립성 저혈압 문진", index: 1, untag: [w-today]}
  - {situation: "대구경 정맥로·수액 설명", index: 2, untag: [w-quick], why: "w-quick을 quickly로 바꿨는데 여기는 형용사 a quick pinch라 태그를 뺐다"}
  - {situation: "탈수 관련 저혈압 교육", index: 2, untag: [w-slow], why: "형용사 w-slow(느린)가 부사 slowly 문장에 붙어 있어 태그를 뺐다"}
  - {situation: "탈수 관련 저혈압 교육", index: 4, untag: [w-slow], ko: "얼마나 마시는지 지켜보면서 조금씩 천천히 드시게 할게요.", why: "형용사 w-slow 태그를 뺐고, ko의 오타 '드리게요'를 고쳤다(조금씩 마시게 한다는 뜻)"}
  - {situation: "실신 후 내원 사정", index: 1, untag: [w-see]}
  - {situation: "실신 후 내원 사정", index: 2, untag: [w-head]}
  - {situation: "실신 후 내원 사정", index: 4, untag: [w-head]}
  - {situation: "패혈증성 쇼크 조기 인지", index: 1, untag: [w-come], why: "w-come을 come up(수치가 올라오다)으로 바꿨는데 여기는 coming from이라 태그를 뺐다"}
  - {situation: "아나필락시스 분포성 쇼크", index: 1, ko: "이렇게 되기 전에 무엇을 드셨거나 복용하셨나요?", why: "'드시거나 드셨나요'는 eat과 take를 한 동사로 뭉개 뜻이 흐리다 — en(keyPhrase)은 그대로 두고 ko만"}
  - {situation: "언어장벽 쇼크 핵심 확인", index: 0, untag: [w-yes, w-no]}
  - {situation: "언어장벽 쇼크 핵심 확인", index: 1, untag: [w-yes, w-no]}
  - {situation: "언어장벽 쇼크 핵심 확인", index: 2, untag: [w-come], why: "w-come을 come up으로 바꿨는데 여기는 Interpreter is coming이라 태그를 뺐다"}
  - {situation: "언어장벽 쇼크 핵심 확인", index: 3, untag: [w-hand, w-yes, w-no], tag: [w-squeeze], ko: "'예'면 손을 한 번, '아니오'면 두 번 꽉 쥐어 주세요.", why: "쉬운 w-hand·w-yes·w-no 태그를 빼고 w-squeeze를 태그했다; ko의 띄어쓰기('네 이면')를 고쳤다"}
  - {situation: "노인 다약제 저혈압", index: 0, untag: [w-today, w-through], why: "쉬운 w-today 태그를 뺐고, w-go가 go through로 바뀌어 w-through 태그를 뺐다"}
  - {situation: "원인 미상 저혈압 계통 접근", index: 0, untag: [w-begin], why: "명사 beginning에 동사 w-begin이 붙어 있어 태그를 뺐다(쉬운 말)"}
  - {situation: "원인 미상 저혈압 계통 접근", index: 2, untag: [w-run], why: "w-run을 '(약물을) 주입하다'로 가르는데 여기는 running labs라 태그를 뺐다"}
  - {situation: "패혈증성 쇼크 급속 악화 번들", index: 1, untag: [w-hour]}
  - {situation: "패혈증성 쇼크 급속 악화 번들", index: 4, untag: [w-minute]}
  - {situation: "폐색전 폐쇄성 쇼크", index: 3, untag: [w-right], why: "w-right(오른쪽의)가 right now 문장에 붙어 있어 태그를 뺐다"}
  - {situation: "부신위기 저혈압", index: 1, untag: [w-cause], why: "명사 w-cause(원인)가 동사 can cause 문장에 붙어 있어 태그를 뺐다"}
