- title: 전해질 패널 추세 사정
  sentences:
  - en: We check his electrolytes to see how well his body is keeping them balanced.
    ko: 몸이 전해질 균형을 얼마나 잘 지키고 있는지 보려고 전해질을 확인해요.
    chunks:
