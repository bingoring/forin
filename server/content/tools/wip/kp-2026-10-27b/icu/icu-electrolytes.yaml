    - his electrolytes
    - to see how well
    - his body
    - is keeping them balanced
    - .
    words:
    - w-check
    - w-electrolyte
    - w-keep
    - w-balance
    goal: 1
    tag: 목적 설명
    icon: lab
    why: '''to see how well''로 검사 목적을 먼저 말하면 가족이 왜 자꾸 피를 뽑는지 이해해요. ''keeping them balanced''는 몸이 전해질을 스스로 알맞게 맞춰 두는지를 본다는 뜻이에요.'
    decoy: his daughter
    distractorsKo:
    - 몸이 전해질 균형을 얼마나 잘 지키고 있는지 보려고 소변을 확인해요.
