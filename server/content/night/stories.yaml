# 오늘 밤의 이야기 — 나이트 근무 라디오의 3분 미니 스토리(v38 NightRadio).
#
# 서버 콘텐츠다: 이야기를 더 붙이려면 이 파일에 추가하고 서버만 배포하면 된다.
# 밤 근무 현장의 한 장면 → 그때 쓸 수 있는 영어 한 문장(keyLine)을 형광펜으로. 따라 말하기로 연결된다.
# title/body/keyGloss는 로케일별, en 폴백. keyLine은 실제로 쓰는 영어 문장(공용).

- id: nr-001
  title: { ko: "새벽 3시, 502호의 콜벨", en: "3 a.m., the call bell in 502" }
  body:
    ko: "콜벨이 두 번 울렸다 끊겼다. 가보니 할머니는 불을 끈 채 창밖만 보고 계셨다. 아프신 건 아니라고, 그냥 잠이 안 온다고. 이럴 때는 처치보다 곁에 있어 주는 한마디가 크다."
    en: "The call bell rang twice and stopped. She was sitting in the dark, watching the window. Not in pain — just can't sleep. On nights like this, a sentence that offers to stay means more than any task."
  keyLine: "Would you like some warm milk, or shall I sit with you for a bit?"
  keyGloss: { ko: "따뜻한 우유 드릴까요, 아니면 잠시 곁에 있어 드릴까요?", en: "offering comfort and company to a patient who can't sleep" }

- id: nr-002
  title: { ko: "인계 5분 전, 놓친 한 줄", en: "Five minutes to handoff, the missed line" }
  body:
    ko: "밤새 조용하던 환자가 인계 직전 열이 올랐다. 다음 조에게 넘길 때 중요한 건 순서다: 지금 상황, 배경, 내 판단, 부탁. SBAR 한 줄이면 상대도 바로 움직인다."
    en: "A quiet patient spiked a fever right before handoff. What matters when you pass it on is order: what's happening, the background, your read, your ask. One clean SBAR line and the next nurse moves right away."
  keyLine: "New fever of 38.9, no source yet — can you reassess her within the hour?"
  keyGloss: { ko: "38.9도 새 발열, 아직 원인 불명 — 한 시간 안에 다시 봐 주실 수 있어요?", en: "handing off a change and asking for a timely reassessment" }

- id: nr-003
  title: { ko: "겁먹은 보호자에게", en: "To a frightened family member" }
  body:
    ko: "보호자가 복도에서 서성였다. 모니터 알람 소리에 얼굴이 하얘져 있었다. 대부분의 알람은 위급이 아니라는 걸, 지금 우리가 지켜보고 있다는 걸 차분히 전하면 그 밤이 조금 견딜 만해진다."
    en: "The family member paced the hallway, pale at every monitor alarm. Most alarms aren't emergencies, and someone is watching — saying that, calmly, makes the night a little more bearable."
  keyLine: "That alarm just means the sensor moved — she's stable, and I'm keeping a close eye on her."
  keyGloss: { ko: "저 알람은 센서가 움직였다는 뜻이에요 — 상태는 안정적이고, 제가 계속 지켜보고 있어요.", en: "reassuring a worried family member about a monitor alarm" }

- id: nr-004
  title: { ko: "말이 안 통하던 밤", en: "The night the words wouldn't come" }
  body:
    ko: "통증을 호소하는데 서로 말이 막혔다. 완벽한 문장보다, 지금 필요한 걸 묻는 짧은 질문이 낫다. 0에서 10까지, 어디쯤인지. 그 한 문장이 다음을 연다."
    en: "He was in pain and the words stalled on both sides. Better than a perfect sentence is a short question about what's needed right now — a number from zero to ten. That one line opens the next step."
  keyLine: "On a scale of zero to ten, how bad is the pain right now?"
  keyGloss: { ko: "0에서 10까지, 지금 통증이 어느 정도인가요?", en: "asking a patient to rate their pain" }

- id: nr-005
  title: { ko: "낙상 직전, 반 발짝", en: "Half a step from a fall" }
  body:
    ko: "혼자 화장실에 가려던 어르신이 침대 난간을 넘고 있었다. 나무라기보다, 먼저 안심시키고 도움을 청하게 만드는 말이 그 밤의 낙상을 막는다."
    en: "An older patient was climbing over the rail to reach the bathroom alone. Not a scolding — a line that reassures first and invites them to ask for help is what prevents the fall that night."
  keyLine: "Please wait for me — press this button and I'll help you to the bathroom."
  keyGloss: { ko: "저를 기다려 주세요 — 이 버튼을 누르시면 화장실까지 도와드릴게요.", en: "keeping a fall-risk patient safe while offering help" }

- id: nr-006
  title: { ko: "퇴근길에 남는 말", en: "The line that stays with you" }
  body:
    ko: "밤새 힘들었던 환자가 아침에 손을 꼭 잡았다. 잘 알아듣지 못해 미안했다는 나에게, 그래도 곁에 있어 줘서 고맙다고 했다. 밤 근무의 무게는 그런 한마디로 조금 가벼워진다."
    en: "A patient who had a hard night held your hand in the morning. To your apology for not always understanding, they said thank you for staying anyway. A night shift gets a little lighter for a line like that."
  keyLine: "Thank you for staying with me — get home safe."
  keyGloss: { ko: "곁에 있어 줘서 고마워요 — 조심히 들어가요.", en: "a patient's parting thanks at the end of a night shift" }
