# 병원 은어 도감 — US 임상 현장 약어·은어. 하루 1장씩 떨어진다(SlangDeck, v38).
#
# 서버 콘텐츠다: 카드를 더 붙이려면 이 파일에 추가하고 서버만 배포하면 된다(앱 릴리스 불필요).
# gloss는 로케일별, en이 폴백. example은 현장에서 실제로 듣는 한 문장.
# 존중 원칙: 환자를 비하하는 은어(GOMER 등)는 넣지 않는다. 실무 약어 + 무해한 직장 은어만.
# hidden: 10·20·30번째 자리의 "진짜 위험한 코드들" — 마일스톤에서 개봉된다.

# ── 시간·빈도 ────────────────────────────────────────────────────────────────
- id: sl-001
  code: stat
  gloss: { ko: "지금 당장", en: "immediately, right now" }
  example: "Get me a 12-lead EKG, stat."
- id: sl-002
  code: PRN
  gloss: { ko: "필요시 (증상 있을 때만)", en: "as needed" }
  example: "Tylenol 650 mg PO PRN for pain."
- id: sl-003
  code: BID
  gloss: { ko: "하루 두 번", en: "twice a day" }
  example: "Metformin 500 mg BID with meals."
- id: sl-004
  code: TID
  gloss: { ko: "하루 세 번", en: "three times a day" }
  example: "She's on the eye drops TID."
- id: sl-005
  code: QID
  gloss: { ko: "하루 네 번", en: "four times a day" }
  example: "Accu-Cheks are QID before meals and at bedtime."
- id: sl-006
  code: q4h
  gloss: { ko: "4시간마다 (q + 숫자 = 몇 시간마다)", en: "every 4 hours" }
  example: "Turn and reposition q2h, vitals q4h."
- id: sl-007
  code: HS
  gloss: { ko: "취침 시 (자기 전)", en: "at bedtime" }
  example: "Give the melatonin at HS."
- id: sl-008
  code: AC / PC
  gloss: { ko: "식전 / 식후", en: "before meals / after meals" }
  example: "Insulin AC, and the antacid PC."

# ── 투여 경로 ────────────────────────────────────────────────────────────────
- id: sl-009
  code: PO
  gloss: { ko: "경구 (입으로)", en: "by mouth" }
  example: "Is she cleared for PO meds yet?"
# ── hidden #10 ──
- id: sl-010
  code: code blue
  gloss: { ko: "심정지·호흡정지 — 성인 응급 소생 호출", en: "cardiac/respiratory arrest — adult resuscitation call" }
  example: "Code blue, room 14 — grab the crash cart!"
  hidden: true
- id: sl-011
  code: IV
  gloss: { ko: "정맥 (주사)", en: "intravenous" }
  example: "Start a second IV in the left AC."
- id: sl-012
  code: IM
  gloss: { ko: "근육 (주사)", en: "intramuscular" }
  example: "The Toradol is IM, not IV."
- id: sl-013
  code: SubQ
  gloss: { ko: "피하 (주사)", en: "subcutaneous" }
  example: "Heparin 5,000 units SubQ."
- id: sl-014
  code: SL
  gloss: { ko: "설하 (혀 밑)", en: "sublingual" }
  example: "Nitro SL, one every five minutes, up to three."
- id: sl-015
  code: NG tube
  gloss: { ko: "비위관 (코-위)", en: "nasogastric tube" }
  example: "Put the meds down the NG and flush with 30 of water."
- id: sl-016
  code: foley
  gloss: { ko: "유치 도뇨관 (방광 카테터)", en: "indwelling urinary catheter" }
  example: "Is the foley draining? What's the output?"
- id: sl-017
  code: JP drain
  gloss: { ko: "잭슨-프랫 배액관", en: "Jackson-Pratt surgical drain" }
  example: "Strip the JP and record the drainage."
- id: sl-018
  code: gtt
  gloss: { ko: "방울 / 지속 정맥주입 (drip)", en: "drops / a continuous IV drip" }
  example: "She's on an insulin gtt, titrate per protocol."

# ── 지시·상태 ────────────────────────────────────────────────────────────────
- id: sl-019
  code: NPO
  gloss: { ko: "금식 (아무것도 입으로 못 먹음)", en: "nothing by mouth" }
# ── hidden #20 ──
- id: sl-020
  code: rapid response
  gloss: { ko: "급성 악화 — 정지 전 신속 대응팀 호출", en: "pre-arrest deterioration — rapid response team call" }
  example: "I'm calling a rapid response, her sats are dropping."
  hidden: true
- id: sl-021
  code: DNR
  gloss: { ko: "심폐소생 거부", en: "do not resuscitate" }
  example: "Confirm the code status — he's a DNR."
- id: sl-022
  code: DNI
  gloss: { ko: "기관삽관 거부", en: "do not intubate" }
  example: "DNR/DNI, comfort care only."
- id: sl-023
  code: NKDA
  gloss: { ko: "알려진 약물 알레르기 없음", en: "no known drug allergies" }
  example: "Allergies? Chart says NKDA."
- id: sl-024
  code: KVO / TKO
  gloss: { ko: "혈관 유지용 최소 주입 속도", en: "keep vein open — a minimal drip rate" }
  example: "Run the saline at KVO."
- id: sl-025
  code: I&O
  gloss: { ko: "섭취량/배설량", en: "intake and output" }
  example: "Strict I&O on this patient."
- id: sl-026
  code: c/o
  gloss: { ko: "호소함 (환자가 ~를 호소)", en: "complains of" }
  example: "Pt c/o chest pain radiating to the left arm."
- id: sl-027
  code: SOB
  gloss: { ko: "호흡곤란", en: "shortness of breath" }
  example: "He's SOB on exertion."
- id: sl-028
  code: N/V
  gloss: { ko: "오심/구토", en: "nausea and vomiting" }
  example: "Any N/V after the chemo?"
- id: sl-029
  code: amb
  gloss: { ko: "보행 (걸을 수 있음)", en: "ambulate / ambulatory" }
# ── hidden #30 ──
- id: sl-030
  code: code brown
  gloss: { ko: "대변 사고 처리 상황 (진짜 응급 코드 아님!)", en: "a soiled-bed cleanup — not a real emergency code" }
  example: "We've got a code brown in 12 — grab gloves."
  hidden: true

# ── 사정·차트 ────────────────────────────────────────────────────────────────
- id: sl-031
  code: VS
  gloss: { ko: "활력징후", en: "vital signs" }
  example: "VS stable, afebrile."
- id: sl-032
  code: LOC
  gloss: { ko: "의식 수준", en: "level of consciousness" }
  example: "Any change in LOC overnight?"
- id: sl-033
  code: A&Ox4
  gloss: { ko: "명료 · 사람/장소/시간/상황 지남력 온전", en: "alert and oriented to person, place, time, situation" }
  example: "Pt is A&Ox4 and cooperative."
- id: sl-034
  code: ADLs
  gloss: { ko: "일상생활동작 (씻기·먹기 등)", en: "activities of daily living" }
  example: "She needs help with ADLs."
- id: sl-035
  code: Hx / Dx / Tx
  gloss: { ko: "병력 / 진단 / 치료", en: "history / diagnosis / treatment" }
  example: "Hx of CHF, Dx is a COPD exacerbation."
- id: sl-036
  code: Rx
  gloss: { ko: "처방", en: "prescription / therapy" }
  example: "What's the Rx for the pain?"
- id: sl-037
  code: fx
  gloss: { ko: "골절", en: "fracture" }
  example: "Left hip fx, non-weight-bearing."
- id: sl-038
  code: WNL
  gloss: { ko: "정상 범위 내", en: "within normal limits" }
  example: "Labs all WNL."
- id: sl-039
  code: PT / OT
  gloss: { ko: "물리치료 / 작업치료", en: "physical therapy / occupational therapy" }
  example: "PT will eval for gait, OT for ADLs."

# ── 검사 ────────────────────────────────────────────────────────────────────
- id: sl-040
  code: CBC
  gloss: { ko: "전혈구 검사", en: "complete blood count" }
  example: "Draw a CBC and a BMP."
- id: sl-041
  code: BMP
  gloss: { ko: "기본 대사 패널 (전해질 등)", en: "basic metabolic panel" }
  example: "His BMP shows a low potassium."
- id: sl-042
  code: ABG
  gloss: { ko: "동맥혈 가스 검사", en: "arterial blood gas" }
  example: "Respiratory's coming for an ABG."
- id: sl-043
  code: EKG / ECG
  gloss: { ko: "심전도", en: "electrocardiogram" }
  example: "Get a stat EKG for the chest pain."
- id: sl-044
  code: UA
  gloss: { ko: "소변 검사", en: "urinalysis" }
  example: "Send a UA and culture."
- id: sl-045
  code: BP / HR / RR
  gloss: { ko: "혈압 / 심박수 / 호흡수", en: "blood pressure / heart rate / respiratory rate" }
  example: "BP 90 over 60, HR 118 — she's tachy."
- id: sl-046
  code: SpO2
  gloss: { ko: "산소포화도", en: "oxygen saturation" }
  example: "SpO2 dropped to 88 on room air."
- id: sl-047
  code: LOS
  gloss: { ko: "재원 기간", en: "length of stay" }
  example: "Long LOS — she's been here two weeks."

# ── 직장 은어(무해) ──────────────────────────────────────────────────────────
- id: sl-048
  code: walkie-talkie
  gloss: { ko: "혼자 걷고 말하는 안정 환자 (손 덜 가는 환자)", en: "a stable patient who walks and talks — low-maintenance" }
  example: "Nice assignment — all walkie-talkies today."
- id: sl-049
  code: banana bag
  gloss: { ko: "비타민 든 노란 수액 (티아민·엽산 등)", en: "a yellow IV vitamin bag (thiamine, folate…)" }
  example: "Hang a banana bag for the alcohol withdrawal."
- id: sl-050
  code: bounce back
  gloss: { ko: "퇴원 후 금방 재입원한 환자", en: "a patient readmitted soon after discharge" }
  example: "Room 8 is a bounce back from last week."

# ── 추가 시간·빈도 ───────────────────────────────────────────────────────────
- id: sl-051
  code: q shift
  gloss: { ko: "근무조마다", en: "every shift" }
  example: "Neuro checks q shift, more if he changes."
- id: sl-052
  code: qHS
  gloss: { ko: "매일 취침 시", en: "every night at bedtime" }
  example: "The statin is qHS."
- id: sl-053
  code: ASAP
  gloss: { ko: "가능한 한 빨리", en: "as soon as possible" }
  example: "I need that potassium result ASAP."
- id: sl-054
  code: QD
  gloss: { ko: "하루 한 번 (옛 차트에서 보이지만 오기 위험으로 'daily' 권장)", en: "once daily — seen in old charts, but 'daily' is preferred (error-prone)" }
  example: "Old order says QD; we'd write 'daily' now."

# ── 추가 경로 ────────────────────────────────────────────────────────────────
- id: sl-055
  code: PR
  gloss: { ko: "직장 (항문으로)", en: "per rectum" }
  example: "Acetaminophen PR since she's NPO."
- id: sl-056
  code: neb
  gloss: { ko: "네뷸라이저 흡입 치료", en: "nebulizer treatment" }
  example: "Give the duo-neb and reassess her wheezing."
- id: sl-057
  code: IVPB
  gloss: { ko: "정맥 곁줄 주입 (piggyback)", en: "IV piggyback — a secondary infusion" }
  example: "Hang the vanc as an IVPB over 90 minutes."
- id: sl-058
  code: IVP
  gloss: { ko: "정맥 직접 주사 (IV push)", en: "IV push — given directly, slowly" }
  example: "Push the Zofran IVP over two minutes."
- id: sl-059
  code: PCA
  gloss: { ko: "환자 자가조절 진통 (버튼 누르면 투여)", en: "patient-controlled analgesia" }
  example: "She's on a morphine PCA — teach her the button."

# ── 식이·활동 지시 ───────────────────────────────────────────────────────────
- id: sl-060
  code: DAT
  gloss: { ko: "가능한 만큼 식사 (일반식)", en: "diet as tolerated" }
  example: "He's cleared for DAT this morning."
- id: sl-061
  code: ADAT
  gloss: { ko: "견디는 대로 식이 단계 올리기", en: "advance diet as tolerated" }
  example: "ADAT from clears to full liquids."
- id: sl-062
  code: OOB
  gloss: { ko: "침대 밖으로 (앉기·서기·걷기)", en: "out of bed" }
  example: "OOB to chair for all meals."
- id: sl-063
  code: BRP
  gloss: { ko: "화장실 출입만 허용", en: "bathroom privileges" }
  example: "Bed rest with BRP only."
- id: sl-064
  code: CBR
  gloss: { ko: "절대 안정 (침상 안정)", en: "complete bed rest" }
  example: "CBR until the spinal team clears her."
- id: sl-065
  code: WBAT
  gloss: { ko: "견디는 만큼 체중 부하 가능", en: "weight-bearing as tolerated" }
  example: "Post-op day one, she's WBAT with a walker."
- id: sl-066
  code: HOB
  gloss: { ko: "침대 머리 쪽 (각도)", en: "head of bed" }
  example: "Keep the HOB up at 30 degrees."
- id: sl-067
  code: AMA
  gloss: { ko: "의학적 권고에 반한 자의 퇴원", en: "against medical advice" }
  example: "He's threatening to leave AMA — get the provider."
- id: sl-068
  code: SCDs
  gloss: { ko: "하지 압박 부츠 (혈전 예방)", en: "sequential compression devices" }
  example: "Put the SCDs back on when she's in bed."

# ── 사정 ─────────────────────────────────────────────────────────────────────
- id: sl-069
  code: AMS
  gloss: { ko: "의식·정신 상태 변화", en: "altered mental status" }
# ── hidden #70 ──
- id: sl-070
  code: code stroke
  gloss: { ko: "급성 뇌졸중 의심 — 신속 평가·영상 팀 소집", en: "suspected acute stroke — rapid workup and imaging team" }
  example: "New facial droop and slurred speech — call a code stroke."
  hidden: true
- id: sl-071
  code: PERRLA
  gloss: { ko: "동공 동일·원형·빛/조절 반응 정상", en: "pupils equal, round, reactive to light and accommodation" }
  example: "Pupils are PERRLA, no drift."
- id: sl-072
  code: GCS
  gloss: { ko: "글래스고 혼수 척도 (3~15점)", en: "Glasgow Coma Scale" }
  example: "GCS dropped from 15 to 12 overnight."
- id: sl-073
  code: CTAB
  gloss: { ko: "양측 폐음 청진상 깨끗함", en: "clear to auscultation bilaterally" }
  example: "Lungs CTAB, no crackles."
- id: sl-074
  code: soft, NT, ND
  gloss: { ko: "복부: 부드럽고·압통 없고·팽만 없음", en: "abdomen soft, non-tender, non-distended" }
  example: "Belly is soft, NT, ND, bowel sounds present."
- id: sl-075
  code: cap refill
  gloss: { ko: "모세혈관 재충전 시간 (순환 지표)", en: "capillary refill time" }
  example: "Cap refill is brisk, under two seconds."
- id: sl-076
  code: LOC
  gloss: { ko: "의식 수준", en: "level of consciousness" }
  example: "Document any change in LOC right away."
- id: sl-077
  code: baseline
  gloss: { ko: "그 환자의 평소 상태", en: "the patient's usual/normal state" }
  example: "Confused? Family says that's her baseline."
- id: sl-078
  code: sundowning
  gloss: { ko: "해질 무렵 악화되는 혼동 (주로 노인)", en: "evening confusion/agitation, often in the elderly" }
  example: "He's sundowning — reorient him and dim the lights."

# ── 활력·모니터링 ────────────────────────────────────────────────────────────
- id: sl-079
  code: afebrile
  gloss: { ko: "발열 없음 (정상 체온)", en: "no fever" }
# ── hidden #80 ──
- id: sl-080
  code: STEMI
  gloss: { ko: "ST상승 심근경색 — 응급 심도자실 활성화", en: "ST-elevation heart attack — activates the cath lab" }
  example: "EKG shows a STEMI — activate the cath lab now."
  hidden: true
- id: sl-081
  code: tachy / brady
  gloss: { ko: "빈맥 / 서맥 (빠른/느린 맥)", en: "tachycardic / bradycardic — fast / slow heart rate" }
  example: "She went from tachy to brady — recheck her."
- id: sl-082
  code: tele
  gloss: { ko: "원격 심전도 감시 (텔레메트리)", en: "telemetry — continuous cardiac monitoring" }
  example: "He's on tele; watch for runs of V-tach."
- id: sl-083
  code: NSR
  gloss: { ko: "정상 동조율 (정상 심장 리듬)", en: "normal sinus rhythm" }
  example: "Back in NSR after the diltiazem."
- id: sl-084
  code: afib
  gloss: { ko: "심방세동 (불규칙 리듬)", en: "atrial fibrillation" }
  example: "New-onset afib with a rapid ventricular response."
- id: sl-085
  code: MAP
  gloss: { ko: "평균 동맥압 (관류 지표)", en: "mean arterial pressure" }
  example: "Keep the MAP above 65 with the pressors."
- id: sl-086
  code: T
  gloss: { ko: "체온", en: "temperature" }
  example: "T is 38.9 — she spiked overnight."
- id: sl-087
  code: sat / satting
  gloss: { ko: "산소포화도 (수치/유지 상태)", en: "oxygen saturation / holding a saturation" }
  example: "He's satting 92 on two liters."

# ── 투약 ─────────────────────────────────────────────────────────────────────
- id: sl-088
  code: MAR
  gloss: { ko: "투약 기록지", en: "medication administration record" }
  example: "It's not on the MAR, so don't give it."
- id: sl-089
  code: sliding scale
  gloss: { ko: "혈당 수치에 따른 인슐린 용량표", en: "sliding-scale insulin — dose set by the glucose reading" }
- id: sl-090
  code: titrate
  gloss: { ko: "반응 보며 용량·속도 조절", en: "adjust the dose/rate to effect" }
  example: "Titrate the drip to keep her comfortable."
- id: sl-091
  code: hold
  gloss: { ko: "이번 투여를 보류", en: "withhold this dose" }
  example: "Hold the metoprolol if the HR is under 60."
- id: sl-092
  code: Abx
  gloss: { ko: "항생제", en: "antibiotics" }
  example: "Draw cultures before you start the Abx."
- id: sl-093
  code: bolus
  gloss: { ko: "일시 다량 투여 (수액·약)", en: "a rapid one-time dose/volume" }
  example: "Give a 500 mL bolus and recheck the pressure."
- id: sl-094
  code: pressors
  gloss: { ko: "혈압 상승제 (승압제)", en: "vasopressors — drugs that raise blood pressure" }
  example: "She's on two pressors and still soft."
- id: sl-095
  code: PRN med
  gloss: { ko: "필요시 투약 (증상 있을 때)", en: "an as-needed medication" }
  example: "Did she get her PRN for anxiety?"

# ── 검사 ─────────────────────────────────────────────────────────────────────
- id: sl-096
  code: CMP
  gloss: { ko: "종합 대사 패널 (전해질+간기능 등)", en: "comprehensive metabolic panel" }
  example: "Order a CMP and a magnesium."
- id: sl-097
  code: H&H
  gloss: { ko: "혈색소/적혈구용적 (빈혈·출혈 지표)", en: "hemoglobin and hematocrit" }
  example: "Recheck the H&H after the second unit."
- id: sl-098
  code: INR
  gloss: { ko: "항응고(와파린) 응고 지표", en: "clotting measure for warfarin dosing" }
# ── hidden #99 → keep as #100 hidden ──
- id: sl-099
  code: trop
  gloss: { ko: "트로포닌 (심근 손상 표지자)", en: "troponin — a cardiac injury marker" }
  example: "First trop is negative; recheck in three hours."
- id: sl-100
  code: sepsis alert
  gloss: { ko: "패혈증 조기 경보 — 번들 치료 개시", en: "early sepsis warning — starts the treatment bundle" }
  example: "Two SIRS criteria and a source — call a sepsis alert."
  hidden: true
- id: sl-101
  code: lactate
  gloss: { ko: "젖산 (관류·패혈증 지표)", en: "lactate — a marker of poor perfusion/sepsis" }
  example: "Lactate is 4.2 — redraw after the fluids."
- id: sl-102
  code: BNP
  gloss: { ko: "심부전 지표 (B형 나트륨이뇨펩타이드)", en: "a heart-failure marker" }
  example: "The BNP is sky-high — this is CHF."
- id: sl-103
  code: C&S
  gloss: { ko: "배양 및 감수성 검사", en: "culture and sensitivity" }
  example: "Send the urine for C&S."
- id: sl-104
  code: T&C
  gloss: { ko: "혈액형·교차적합 검사 (수혈 준비)", en: "type and cross — prep for a transfusion" }
  example: "T&C two units in case she keeps bleeding."
- id: sl-105
  code: BMP / lytes
  gloss: { ko: "기본 대사 패널 = 전해질", en: "basic metabolic panel — the electrolytes" }
  example: "Her lytes are back; potassium is low."

# ── 진단·상태 ────────────────────────────────────────────────────────────────
- id: sl-106
  code: MI
  gloss: { ko: "심근경색 (heart attack)", en: "myocardial infarction — a heart attack" }
  example: "Rule out MI — serial troponins and EKGs."
- id: sl-107
  code: CHF
  gloss: { ko: "울혈성 심부전", en: "congestive heart failure" }
  example: "CHF exacerbation — she's fluid overloaded."
- id: sl-108
  code: COPD
  gloss: { ko: "만성 폐쇄성 폐질환", en: "chronic obstructive pulmonary disease" }
  example: "COPD flare — nebs and steroids."
- id: sl-109
  code: CVA
  gloss: { ko: "뇌졸중 (뇌혈관 사고)", en: "cerebrovascular accident — a stroke" }
  example: "History of a CVA with left-sided weakness."
- id: sl-110
  code: DVT / PE
  gloss: { ko: "심부정맥혈전 / 폐색전", en: "deep vein thrombosis / pulmonary embolism" }
  example: "Sudden SOB post-op — rule out a PE."
- id: sl-111
  code: DKA
  gloss: { ko: "당뇨성 케톤산증", en: "diabetic ketoacidosis" }
  example: "She's in DKA — start the insulin drip per protocol."
- id: sl-112
  code: UTI
  gloss: { ko: "요로감염", en: "urinary tract infection" }
  example: "Confused and a positive UA — could be a UTI."
- id: sl-113
  code: GIB
  gloss: { ko: "위장관 출혈", en: "gastrointestinal bleed" }
  example: "Melena and a dropping H&H — that's a GIB."
- id: sl-114
  code: AKI
  gloss: { ko: "급성 신손상", en: "acute kidney injury" }
  example: "Creatinine doubled — AKI, hold the nephrotoxics."
- id: sl-115
  code: HTN / DM
  gloss: { ko: "고혈압 / 당뇨병", en: "hypertension / diabetes mellitus" }
  example: "PMH of HTN, DM, and CAD."

# ── 장비·라인 ────────────────────────────────────────────────────────────────
- id: sl-116
  code: NC
  gloss: { ko: "비강 캐뉼라 (코 산소)", en: "nasal cannula" }
  example: "Two liters via NC, sats came up to 96."
- id: sl-117
  code: NRB
  gloss: { ko: "비재호흡 마스크 (고농도 산소)", en: "non-rebreather mask" }
  example: "Put her on a NRB at 15 liters."
- id: sl-118
  code: BiPAP
  gloss: { ko: "이단계 양압 환기 (비침습)", en: "bilevel positive airway pressure" }
  example: "Trial of BiPAP before we call for a tube."
- id: sl-119
  code: central line / CVC
  gloss: { ko: "중심정맥관", en: "central venous catheter" }
# ── hidden #120 ──
- id: sl-120
  code: code gray
  gloss: { ko: "난폭·위협 상황 — 보안 지원 요청 (병원마다 다름)", en: "a combative person — a call for security (varies by hospital)" }
  example: "He's swinging — call a code gray."
  hidden: true
- id: sl-121
  code: PICC
  gloss: { ko: "말초삽입 중심정맥관", en: "peripherally inserted central catheter" }
  example: "The vanc needs to run through the PICC."
- id: sl-122
  code: art line
  gloss: { ko: "동맥압 감시선", en: "arterial line — continuous BP and ABG access" }
  example: "The art line reads a MAP of 58."
- id: sl-123
  code: chest tube
  gloss: { ko: "흉관 (공기·액체 배출)", en: "a chest tube — drains air or fluid from the pleural space" }
  example: "Watch the chest tube for air leaks."
- id: sl-124
  code: trach
  gloss: { ko: "기관절개관", en: "tracheostomy" }
  example: "Suction the trach if she sounds junky."
- id: sl-125
  code: wound vac
  gloss: { ko: "음압 상처 치료기", en: "negative-pressure wound therapy device" }
  example: "The wound vac lost its seal — re-dress it."
- id: sl-126
  code: BSC
  gloss: { ko: "이동식 좌변기 (침상 옆)", en: "bedside commode" }
  example: "She's too weak for the bathroom; use the BSC."
- id: sl-127
  code: EVD
  gloss: { ko: "뇌실외 배액관 (뇌압/뇌척수액)", en: "external ventricular drain" }
  example: "Keep the EVD leveled at the tragus."

# ── 인계·문서·역할 ───────────────────────────────────────────────────────────
- id: sl-128
  code: SBAR
  gloss: { ko: "상황-배경-사정-권고 (인계 형식)", en: "Situation, Background, Assessment, Recommendation — a handoff format" }
  example: "Give me a quick SBAR before you call the doc."
- id: sl-129
  code: report
  gloss: { ko: "근무 인계 (환자 상태 넘김)", en: "the shift handoff between nurses" }
  example: "I'll be with you after I give report."
- id: sl-130
  code: charge (nurse)
  gloss: { ko: "책임간호사 (그 조 총괄)", en: "the charge nurse running the unit that shift" }
  example: "Tell charge we need another admit nurse."
- id: sl-131
  code: house sup
  gloss: { ko: "병원 당직 총괄 (관리자)", en: "the house supervisor — hospital-wide manager on duty" }
  example: "No beds upstairs — call the house sup."
- id: sl-132
  code: float
  gloss: { ko: "타 병동 파견 근무", en: "being sent to work on another unit" }
  example: "I got floated to the ICU tonight."
- id: sl-133
  code: 1:1 / sitter
  gloss: { ko: "일대일 관찰자 (안전 감시)", en: "a one-to-one observer for patient safety" }
  example: "He needs a 1:1 — he keeps pulling at his lines."
- id: sl-134
  code: RN / LPN / CNA
  gloss: { ko: "정규간호사 / 실무간호사 / 간호조무사", en: "registered nurse / licensed practical nurse / certified nursing assistant" }
  example: "Ask the CNA to get a set of vitals."
- id: sl-135
  code: RT
  gloss: { ko: "호흡치료사", en: "respiratory therapist" }
  example: "RT is coming for the breathing treatment."
- id: sl-136
  code: POC
  gloss: { ko: "치료 계획 (care plan)", en: "plan of care" }
  example: "Update the POC after rounds."
- id: sl-137
  code: rounds / rounding
  gloss: { ko: "회진 (팀 순회 평가)", en: "the team's walk-through assessment of patients" }
  example: "The team is rounding — flag your questions."
- id: sl-138
  code: D/C
  gloss: { ko: "퇴원 / 중단 (문맥에 따라)", en: "discharge — or discontinue, depending on context" }
  example: "D/C the foley and D/C him home this afternoon."

# ── 현장 은어(무해) ──────────────────────────────────────────────────────────
- id: sl-139
  code: coding
  gloss: { ko: "심정지가 발생하는 중 (코드 상황)", en: "having a cardiac arrest — a code is in progress" }
# ── hidden #140 ──
- id: sl-140
  code: code red
  gloss: { ko: "화재 (또는 병원별 지정 상황)", en: "fire — or the hospital's designated meaning" }
  example: "Code red on 4 West — close the fire doors."
  hidden: true
- id: sl-141
  code: crashing
  gloss: { ko: "환자가 급격히 악화되는 중", en: "a patient deteriorating fast" }
  example: "Room 6 is crashing — I need help in here!"
- id: sl-142
  code: boarding
  gloss: { ko: "입원 결정 후 응급실에 대기 중", en: "an admitted patient still held in the ER" }
  example: "We're boarding six admits with no beds."
- id: sl-143
  code: on the floor
  gloss: { ko: "일반 병동에 입원한 (중환자실 아님)", en: "admitted to a general unit (not the ICU)" }
  example: "Once he's stable he goes up to the floor."
- id: sl-144
  code: drip
  gloss: { ko: "지속 정맥주입 (연속 투여)", en: "a continuous IV infusion" }
  example: "She's on a heparin drip for the clot."
- id: sl-145
  code: wean
  gloss: { ko: "지지 요법을 서서히 줄이기 (산소·약)", en: "to gradually reduce support (oxygen, meds)" }
  example: "We're weaning her oxygen as she tolerates it."
- id: sl-146
  code: found down
  gloss: { ko: "쓰러진 채 발견됨 (경위 불명)", en: "found collapsed, circumstances unknown" }
  example: "EMS says he was found down at home."
- id: sl-147
  code: wet read
  gloss: { ko: "영상의 예비 판독 (정식 판독 전)", en: "a preliminary radiology read before the final" }
  example: "Wet read says no bleed; final's pending."
- id: sl-148
  code: social admit
  gloss: { ko: "의학보다 돌봄·거처 사유의 입원", en: "an admission driven by care/placement needs, not acuity" }
  example: "Medically she's fine — it's basically a social admit."
- id: sl-149
  code: rapid
  gloss: { ko: "신속대응 호출(구어) (rapid response)", en: "short for a rapid response call" }
  example: "We called a rapid and she got transferred to the unit."

# ── 산과·소아 등 ─────────────────────────────────────────────────────────────
- id: sl-150
  code: L&D
  gloss: { ko: "분만실 (진통·분만)", en: "labor and delivery" }
  example: "She's contracting — send her to L&D."
- id: sl-151
  code: EDD / EDC
  gloss: { ko: "분만 예정일", en: "estimated due date / date of confinement" }
  example: "Her EDD is next Tuesday."
- id: sl-152
  code: NICU
  gloss: { ko: "신생아 중환자실", en: "neonatal intensive care unit" }
  example: "The 30-weeker is going to the NICU."
- id: sl-153
  code: G/P
  gloss: { ko: "임신력/출산력 (gravida/para)", en: "gravida / para — pregnancies and births" }
  example: "She's a G3 P2 at 39 weeks."
- id: sl-154
  code: LMP
  gloss: { ko: "마지막 월경 시작일", en: "last menstrual period" }
  example: "When was your LMP?"
- id: sl-155
  code: peds
  gloss: { ko: "소아과 (구어)", en: "pediatrics" }
  example: "Weight-based dosing — this is peds."

# ── 마무리 배치 ──────────────────────────────────────────────────────────────
- id: sl-156
  code: NKA
  gloss: { ko: "알려진 알레르기 없음", en: "no known allergies" }
  example: "Band says NKA, but double-check with her."
- id: sl-157
  code: ETOH
  gloss: { ko: "알코올 (음주·주정)", en: "alcohol" }
  example: "ETOH withdrawal — start CIWA monitoring."
- id: sl-158
  code: CIWA
  gloss: { ko: "알코올 금단 평가 척도", en: "an alcohol-withdrawal assessment scale" }
  example: "CIWA of 12 — give the PRN and reassess in an hour."
- id: sl-159
  code: NPO after MN
  gloss: { ko: "자정 이후 금식 (시술·수술 대비)", en: "nothing by mouth after midnight" }
  example: "OR case tomorrow — NPO after MN."
# ── hidden #160 ──
- id: sl-160
  code: code pink
  gloss: { ko: "영아 유괴·실종 (병원마다 다름)", en: "infant abduction (varies by hospital)" }
  example: "Code pink — lock the unit and check every exit."
  hidden: true
- id: sl-161
  code: fall risk
  gloss: { ko: "낙상 고위험 (표식·예방 조치)", en: "high fall risk — flagged with precautions" }
  example: "Yellow band — she's a fall risk, bed alarm on."
- id: sl-162
  code: bed alarm
  gloss: { ko: "침대 이탈 경보기", en: "a bed-exit alarm" }
  example: "Turn the bed alarm back on when you leave."
- id: sl-163
  code: restraints
  gloss: { ko: "억제대 (안전상 신체 제한)", en: "physical restraints" }
  example: "Restraints need a fresh order and q2h checks."
- id: sl-164
  code: precautions
  gloss: { ko: "감염 격리 주의 (접촉·비말 등)", en: "isolation precautions (contact, droplet…)" }
  example: "Contact precautions — gown and gloves before you go in."
- id: sl-165
  code: NPO / clear liq / full liq
  gloss: { ko: "금식 / 맑은 유동식 / 전유동식 (식이 단계)", en: "the diet ladder: nothing, clear liquids, full liquids" }
  example: "Advance from clear liq to full liq if no nausea."
- id: sl-166
  code: I/O / net
  gloss: { ko: "섭취·배설과 그 차이(균형)", en: "intake and output, and the net balance" }
  example: "She's net positive two liters over the shift."
- id: sl-167
  code: PMH
  gloss: { ko: "과거 병력", en: "past medical history" }
  example: "PMH is significant for CAD and DM."
- id: sl-168
  code: WNL / WDL
  gloss: { ko: "정상 범위 내 / 정해진 범위 내", en: "within normal limits / within defined limits" }
  example: "All the vitals are WNL this morning."
- id: sl-169
  code: pt / clt
  gloss: { ko: "환자 (차트 축약)", en: "patient — chart shorthand" }
  example: "Pt tolerated the procedure well."
- id: sl-170
  code: PTA
  gloss: { ko: "내원 전 (병원 오기 전)", en: "prior to arrival" }
  example: "He took his home meds PTA."
- id: sl-171
  code: WNL vitals / afeb
  gloss: { ko: "활력 정상·발열 없음 (구어 축약)", en: "vitals normal, afebrile — quick shorthand" }
  example: "Overnight she was afeb with WNL vitals."
- id: sl-172
  code: q shift / q4 neuro
  gloss: { ko: "근무조마다 / 4시간마다 신경학적 검사", en: "neuro checks every shift / every 4 hours" }
  example: "Head bleed — she's on q4 neuro checks."
- id: sl-173
  code: DNR / DNI / comfort care
  gloss: { ko: "소생 거부/삽관 거부/완화 중심 돌봄", en: "do not resuscitate / intubate / comfort-focused care" }
  example: "Goals of care changed to comfort care overnight."
- id: sl-174
  code: LWBS
  gloss: { ko: "진료 없이 떠남 (응급실)", en: "left without being seen" }
  example: "Two-hour wait and he LWBS."
- id: sl-175
  code: obs
  gloss: { ko: "관찰 입원 (정식 입원 아님)", en: "observation status — not a full admission" }
  example: "Keep her in obs and recheck the troponin."
- id: sl-176
  code: tele monitor tech
  gloss: { ko: "원격 심전도 감시 기사", en: "the tech watching the telemetry monitors" }
  example: "The monitor tech called — he's throwing PVCs."
- id: sl-177
  code: bili
  gloss: { ko: "빌리루빈 (황달 지표)", en: "bilirubin — a jaundice marker" }
  example: "The baby's bili is climbing — start phototherapy."
- id: sl-178
  code: glucose / accucheck
  gloss: { ko: "혈당 / 손끝 혈당 측정", en: "blood glucose / a fingerstick glucose" }
  example: "Accucheck before meals and cover with the scale."
- id: sl-179
  code: PO challenge
  gloss: { ko: "경구 섭취 시도(견디는지 확인)", en: "a trial of taking food/fluids by mouth" }
  example: "Give her a PO challenge before we pull the IV."
# ── hidden #180 ──
- id: sl-180
  code: ROSC
  gloss: { ko: "자발순환 회복 (소생 성공)", en: "return of spontaneous circulation" }
  example: "We got ROSC after the second round of epi."
  hidden: true
- id: sl-181
  code: RSI
  gloss: { ko: "신속 기관삽관 (진정+마비)", en: "rapid sequence intubation" }
  example: "RSI meds are drawn up at the bedside."
- id: sl-182
  code: vent
  gloss: { ko: "인공호흡기", en: "mechanical ventilator" }
  example: "He's on the vent, sedated and comfortable."
- id: sl-183
  code: extubate
  gloss: { ko: "발관 (기관관 제거)", en: "to remove the breathing tube" }
  example: "She's passing the trial — we may extubate today."
- id: sl-184
  code: pressure ulcer / stage
  gloss: { ko: "욕창(압박 궤양)과 단계", en: "a pressure injury and its stage" }
  example: "Stage 2 on the sacrum — off-load and document it."
- id: sl-185
  code: turn q2h
  gloss: { ko: "2시간마다 체위 변경", en: "reposition every two hours" }
  example: "Turn q2h to protect her skin."
- id: sl-186
  code: strict I&O
  gloss: { ko: "섭취·배설량 엄격 측정", en: "measure every intake and output exactly" }
  example: "Strict I&O — weigh the diapers."
- id: sl-187
  code: foley d/c
  gloss: { ko: "도뇨관 제거 (감염 예방)", en: "remove the urinary catheter" }
  example: "Foley d/c'd; watch that she voids within six hours."
- id: sl-188
  code: void
  gloss: { ko: "배뇨하다 (소변 보다)", en: "to urinate" }
  example: "Let me know when she voids after the catheter comes out."
- id: sl-189
  code: ambulate x3
  gloss: { ko: "하루 3회 보행 (조기 운동)", en: "walk three times a day" }
  example: "Post-op orders: ambulate x3 with assist."
# ── hidden #190 ──
- id: sl-190
  code: code silver
  gloss: { ko: "무기 소지·위협 상황 (병원마다 다름)", en: "a person with a weapon (varies by hospital)" }
  example: "Code silver in the lobby — shelter in place."
  hidden: true
- id: sl-191
  code: MRSA / VRE / C. diff
  gloss: { ko: "내성균/감염 (격리 대상)", en: "resistant organisms/infection needing isolation" }
  example: "C. diff positive — contact precautions and soap-and-water."
- id: sl-192
  code: NPO for procedure
  gloss: { ko: "시술 위해 금식", en: "kept fasting for a procedure" }
  example: "She's NPO for the scope at noon."
- id: sl-193
  code: consent
  gloss: { ko: "동의서 (시술·수술)", en: "informed consent for a procedure" }
  example: "Is the consent signed and on the chart?"
- id: sl-194
  code: time out
  gloss: { ko: "시술 직전 안전 확인(환자·부위·시술)", en: "the pre-procedure safety pause" }
  example: "Let's do the time out before we start."
- id: sl-195
  code: NG to LWS
  gloss: { ko: "비위관을 저압 간헐 흡인에 연결", en: "nasogastric tube to low wall suction" }
  example: "NG to LWS for the bowel obstruction."
- id: sl-196
  code: NPO / aspiration
  gloss: { ko: "흡인 위험으로 금식 (삼킴 문제)", en: "kept NPO due to aspiration risk" }
  example: "Failed the swallow eval — NPO, aspiration precautions."
- id: sl-197
  code: DAT / advance
  gloss: { ko: "견디는 대로 식사 진행", en: "diet as tolerated, advancing" }
  example: "No nausea overnight, so advance her DAT."
- id: sl-198
  code: q15
  gloss: { ko: "15분마다 관찰 (고위험 감시)", en: "checks every 15 minutes" }
  example: "Suicide precautions — q15 checks, document each one."
- id: sl-199
  code: PRN oxygen
  gloss: { ko: "필요시 산소 (사트 떨어질 때)", en: "oxygen as needed to keep sats up" }
  example: "PRN O2 to keep her above 92."
# ── hidden #200 ──
- id: sl-200
  code: MET / rapid response team
  gloss: { ko: "신속대응팀 (정지 전 급성 악화 대응)", en: "the medical emergency / rapid response team" }
  example: "The MET is on the way — keep bagging him."
  hidden: true
- id: sl-201
  code: handoff / handover
  gloss: { ko: "인수인계 (환자 넘김)", en: "passing responsibility for a patient" }
  example: "Do the handoff at the bedside with the family."
- id: sl-202
  code: code status
  gloss: { ko: "소생 방침 (full code / DNR 등)", en: "the resuscitation plan (full code, DNR…)" }
  example: "Confirm her code status on admission."
- id: sl-203
  code: full code
  gloss: { ko: "모든 소생술 시행 (기본 방침)", en: "do everything to resuscitate — the default" }
  example: "He's a full code — everything is on the table."
- id: sl-204
  code: goals of care
  gloss: { ko: "치료 목표 논의 (환자·가족과)", en: "a discussion of what care the patient wants" }
  example: "Palliative is coming to talk goals of care."
- id: sl-205
  code: discharge planning
  gloss: { ko: "퇴원 계획 (귀가·시설·재택 지원)", en: "planning the discharge — home, facility, or services" }
  example: "Case management started discharge planning today."
