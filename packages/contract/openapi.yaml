components:
  schemas:
    github_com_bingoring_forin_server_internal_curriculum.BuildingGroup:
      properties:
        building:
          type: string
        floors:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_curriculum.FloorGroup'
          type: array
          uniqueItems: false
      type: object
    github_com_bingoring_forin_server_internal_curriculum.CurriculumState:
      properties:
        building:
          type: string
        done:
          type: integer
        floor:
          type: string
        key:
          type: string
        name:
          type: string
        next:
          description: name of the current (now) step
          type: string
        resume:
          type: boolean
        state:
          description: done | doing | todo
          type: string
        steps:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_curriculum.StepState'
          type: array
          uniqueItems: false
        total:
          type: integer
        where:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_curriculum.FloorGroup:
      properties:
        curricula:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_curriculum.CurriculumState'
          type: array
          uniqueItems: false
        floor:
          type: string
        where:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_curriculum.StepState:
      properties:
        attempted:
          description: |-
            Attempted: played, graded below the bar. Orthogonal to State — a step you
            failed is still "now" (it is what you should do next) and its successors are
            still "lock" (clearing is what unlocks). Without this, a step you tried and a
            step you have never opened look identical, which is the one thing the learner
            cannot infer from anywhere else on the screen.
          type: boolean
        kind:
          type: string
        name:
          type: string
        optional:
          description: bonus practice; doesn't gate
          type: boolean
        scenarioId:
          type: string
        state:
          description: done | now | lock | optional
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_auth.TokenPair:
      properties:
        accessToken:
          type: string
        expiresIn:
          description: access token seconds-to-live
          type: integer
        refreshToken:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_colleague.Relation:
      enum:
      - peer
      - mentor
      - mentee
      type: string
      x-enum-varnames:
      - RelationPeer
      - RelationMentor
      - RelationMentee
    github_com_bingoring_forin_server_internal_domain_content.DeptSituation:
      properties:
        lv:
          type: string
        min:
          type: integer
        name:
          type: string
        room:
          type: string
        scenarioId:
          type: string
        tag:
          type: string
        tagCode:
          description: |-
            TagCode is the STATE ("cleared" | "urgent" | "new"); Tag is its label in the
            request's language. They were one Korean field, which forced the client to
            compare against "완료" — so the string could never be translated without
            breaking the comparison that decided which situations count as done.
          type: string
        urgent:
          description: high difficulty
          type: boolean
      type: object
    github_com_bingoring_forin_server_internal_domain_conversation.Correction:
      properties:
        cardId:
          type: string
        corrected:
          type: string
        note:
          type: string
        original:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_home.MentorNote:
      properties:
        id:
          type: string
        npc:
          properties:
            dept:
              type: string
            name:
              type: string
            role:
              type: string
          type: object
        text:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_home.Page:
      description: |-
        오늘의 호출 (v27). Absent when there is nothing live: no candidates to point it
        at, or it expired unanswered. The client draws nothing rather than a dead pager.
      properties:
        accepted:
          description: |-
            Accepted: the learner took the call and is expected in the scenario. The card
            stops counting down and says so, rather than either vanishing or claiming they
            already answered.
          type: boolean
        answered:
          type: boolean
        bonusXp:
          type: integer
        hint:
          type: string
        line:
          description: "* The pager's own two lines. Authored per department below
            rather than per\n\t *  scenario: the call is a summons, and it has to
            read the same whichever short\n\t *  scenario it happens to point at."
          type: string
        scenarioId:
          type: string
        secondsLeft:
          description: |-
            SecondsLeft is 0 once it has expired; the client then hides the card rather than
            drawing a dead one.
          type: integer
        totalSeconds:
          description: |-
            TotalSeconds is the whole window, so the time bar is a fraction of something.
            Without it the client can only draw "of what was left when the screen loaded",
            which always starts full however late the learner opened the app — and the
            window is NOT a constant: a call issued near midnight is clipped short.
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_home.Phrase:
      properties:
        en:
          type: string
        id:
          type: string
        ko:
          type: string
        note:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_home.Shift:
      properties:
        deptLabel:
          type: string
        shift:
          description: DAY | EVENING
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.Band:
      description: |-
        Band is the day's dominant band — where most of the work happened. A day split
        across two bands reports the busier one rather than both: the calendar cell has
        room for one mark, and the entries below it carry the detail.
      enum:
      - day
      - evening
      - night
      type: string
      x-enum-comments:
        BandDay: 06:00–13:59
        BandEvening: 14:00–21:59
        BandNight: 22:00–05:59
      x-enum-varnames:
      - BandDay
      - BandEvening
      - BandNight
    github_com_bingoring_forin_server_internal_domain_progress.CalendarDay:
      properties:
        band:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.Band'
        cleared:
          type: integer
        date:
          description: YYYY-MM-DD in the caller's timezone
          type: string
        entries:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.CalendarEntry'
          type: array
          uniqueItems: false
        sessions:
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.CalendarEntry:
      properties:
        cleared:
          type: boolean
        hour:
          description: local hour it started, 0-23
          type: integer
        scenarioId:
          type: string
        title:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.GrowthStats:
      properties:
        activeDates:
          description: yyyy-mm-dd (tz), the StreakWindowDays ending today
          items:
            type: string
          type: array
          uniqueItems: false
        conversationSecondsToday:
          type: integer
        conversationSecondsWeek:
          type: integer
        newCardsToday:
          type: integer
        newCardsWeek:
          type: integer
        scenariosToday:
          type: integer
        scenariosTotal:
          description: lifetime clears → praise stickers (1 each)
          type: integer
        scenariosWeek:
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.ModelAnswerCard:
      properties:
        createdAt:
          type: string
        model:
          type: string
        note:
          description: |-
            Note is the "왜 이 표현이 더 나은가" explanation. Often empty — the block
            simply omits the box then rather than drawing an empty one.
          type: string
        said:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.ModelAnswerGroup:
      properties:
        cards:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.ModelAnswerCard'
          type: array
          uniqueItems: false
        corrections:
          type: integer
        lastAt:
          type: string
        scenarioId:
          type: string
        title:
          description: |-
            Title is "" when the scenario is not in the content set the server is
            serving (an old card whose scenario was renamed or removed). The screen
            falls back to the id rather than showing a blank row.
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.ModelAnswerSummary:
      properties:
        groups:
          description: Groups is at most ModelAnswerPageSize entries; only the first
            carries Cards.
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.ModelAnswerGroup'
          type: array
          uniqueItems: false
        more:
          description: |-
            More is what "+ N개 더" says. 0 means the block showed everything and the
            row is omitted — never "+ 0개 더".
          type: integer
        total:
          description: Total is every scenario the player has corrections for, not
            just this page.
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.Progress:
      properties:
        level:
          type: integer
        rank:
          type: string
        reputation:
          description: |-
            Reputation is ordered for display and carries its own labels, so the client
            renders whatever the profession defines without knowing any of the names.
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.Standing'
          type: array
          uniqueItems: false
        streakCurrent:
          type: integer
        streakLongest:
          type: integer
        xp:
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.Standing:
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_user.Profile:
      properties:
        destination:
          description: e.g. "us"
          type: string
        displayName:
          description: |-
            DisplayName is what other people see. "" means the learner has not chosen one,
            and callers fall back to a short form of the user id — see ShortID.
          type: string
        equippedTitle:
          description: equipped career title id (may be empty)
          type: string
        job:
          description: 'MVP: "nurse"'
          type: string
        nativeLang:
          description: user's language, e.g. "ko"
          type: string
        onboarded:
          description: completed the onboarding wizard
          type: boolean
        targetLang:
          description: language being learned, e.g. "en", "de"
          type: string
        targetLevel:
          description: level in TargetLang, e.g. "B1"
          type: string
        uiLang:
          description: |-
            UILang is the language the SCREENS are drawn in, which is not NativeLang:
            NativeLang tells the AI which language to explain corrections in, so a user
            who wants an English interface must not thereby get English explanations.
            "" means follow NativeLang.
          type: string
        userId:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_user.User:
      properties:
        createdAt:
          type: string
        id:
          description: UUID
          type: string
        status:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_ports.PhonemeResult:
      properties:
        accuracy:
          type: number
        duration:
          type: integer
        offset:
          type: integer
        phoneme:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_ports.SentenceReferenceRow:
      properties:
        durationMs:
          type: integer
        ipa:
          type: string
        locale:
          type: string
        referenceText:
          type: string
        sentenceKey:
          type: string
        words:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.WordScore'
          type: array
          uniqueItems: false
      type: object
    github_com_bingoring_forin_server_internal_ports.SpeechAttemptRow:
      properties:
        accuracy:
          type: number
        attemptNo:
          type: integer
        completeness:
          type: number
        createdAt:
          type: string
        durationMs:
          type: integer
        fluency:
          type: number
        id:
          type: string
        overall:
          type: number
        prosody:
          type: number
        prosodyAvailable:
          description: false = NULL in storage, i.e. prosody was never scored — see
            SpeechAttemptInput
          type: boolean
        recognized:
          type: string
        words:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.WordScore'
          type: array
          uniqueItems: false
      type: object
    github_com_bingoring_forin_server_internal_ports.SpokenSentenceRow:
      properties:
        accuracy:
          type: number
        attempts:
          description: |-
            Attempts is the newest attempt_no, which IS the number of tries: attempt
            numbers are assigned 1..N per (user, sentence) with no gaps (I5).
          type: integer
        completeness:
          type: number
        createdAt:
          type: string
        fluency:
          type: number
        origin:
          type: string
        overall:
          type: number
        recognized:
          type: string
        referenceText:
          type: string
        scenarioId:
          description: |-
            ScenarioID lets the list derive its department chip (SCN-ER-00002 → ER)
            without a second lookup. "" for a sentence practised outside a scenario.
          type: string
        sentenceKey:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_ports.SyllableResult:
      properties:
        accuracy:
          type: number
        duration:
          type: integer
        grapheme:
          type: string
        offset:
          type: integer
        syllable:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_ports.WordScore:
      properties:
        accuracy:
          type: number
        errorType:
          type: string
        phonemes:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.PhonemeResult'
          type: array
          uniqueItems: false
        syllables:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.SyllableResult'
          type: array
          uniqueItems: false
        word:
          type: string
      type: object
    internal_adapters_http.attemptReq:
      properties:
        scenarioId:
          type: string
        score:
          type: integer
      type: object
    internal_adapters_http.correctReq:
      properties:
        context:
          type: string
        text:
          type: string
      type: object
    internal_adapters_http.discardResp:
      properties:
        discarded:
          type: boolean
      type: object
    internal_adapters_http.displayNameReq:
      properties:
        displayName:
          type: string
      type: object
    internal_adapters_http.economyConfigResp:
      properties:
        dailyClearedWeight:
          description: weight multiplier for already-cleared
          type: number
        dailyDeptCap:
          description: max scenarios per dept in a day's set
          type: integer
        dailyOffBandWeight:
          description: weight multiplier for off-level difficulty
          type: number
        dailyPoolSize:
          description: Daily situation pool.
          type: integer
        easeDefault:
          description: Spaced repetition (SM-2).
          type: number
        easeFloor:
          type: number
        firstInterval:
          description: days, reps 0 → 1
          type: integer
        masteryCap:
          description: mastery pips ceiling
          type: integer
        pronunciationEnabled:
          type: boolean
        rankHead:
          type: integer
        rankJunior:
          description: Rank thresholds (level → career title).
          type: integer
        rankSenior:
          type: integer
        readyDestinations:
          description: |-
            ReadyDestinations are the countries whose authored learning phrases exist, so
            the onboarding can offer the rest as intentions rather than as choices. It
            rides on this response for the same reason pronunciationEnabled does: the app
            fetches it on every launch, before login, and it is a deploy-wide fact.
          items:
            type: string
          type: array
          uniqueItems: false
        repBandCordial:
          description: ≥ → neutral/cordial
          type: integer
        repBandWarm:
          description: ≥ → NPC noticeably warm
          type: integer
        repBandWary:
          description: ≥ → slightly wary; below → guarded
          type: integer
        repGainMax:
          description: reputation gained by a perfect clear
          type: integer
        repLossMax:
          description: reputation lost by a zero-score attempt
          type: integer
        reputationDefault:
          description: Reputation (0..100).
          type: integer
        scenarioBaseXP:
          description: default XP for clearing a scenario
          type: integer
        scenarioMinXP:
          description: XP floor for a genuine attempt (score>0)
          type: integer
        scenarioPassScore:
          description: |-
            Scenario grading (AI-judged completion). A scenario is "cleared" (완료) only
            when the graded score ≥ ScenarioPassScore; below that it's an engaged attempt
            (재도전) that still earns score-scaled XP + streak but no clear/스티커.
          type: integer
        secondInterval:
          description: days, reps 1 → 2
          type: integer
        titleWarmthBonus:
          description: equipped "warm" title nudge
          type: integer
        topUpAdd:
          description: Rewarded-ad top-up.
          type: integer
        topUpCap:
          description: rewarded top-ups allowed per local day
          type: integer
        xpPerLevel:
          description: XP for one level (level = 1 + xp/XPPerLevel)
          type: integer
      type: object
    internal_adapters_http.gate:
      properties:
        id:
          type: string
        locked:
          type: boolean
        reason:
          type: string
      type: object
    internal_adapters_http.gradeReq:
      properties:
        grade:
          type: string
      type: object
    internal_adapters_http.homeColleague:
      properties:
        activeToday:
          type: boolean
        activity:
          type: string
        id:
          type: string
        name:
          type: string
        relation:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_colleague.Relation'
      type: object
    internal_adapters_http.homeResp:
      properties:
        colleagueTotal:
          type: integer
        colleagues:
          items:
            $ref: '#/components/schemas/internal_adapters_http.homeColleague'
          type: array
          uniqueItems: false
        date:
          type: string
        done:
          type: boolean
        firstRun:
          description: |-
            FirstRun is true until the learner clears anything. The home screen leads with
            the task instead of the streak in that state: a row of ten empty day-boxes is
            the first thing a new user would otherwise see, and it teaches nothing.
          type: boolean
        level:
          type: integer
        mentorNote:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_home.MentorNote'
        page:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_home.Page'
        pendingRequests:
          type: integer
        phrase:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_home.Phrase'
        review:
          $ref: '#/components/schemas/internal_adapters_http.homeReview'
        shift:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_home.Shift'
        situationsWaiting:
          type: integer
        streak:
          type: integer
        targetLevel:
          type: string
        todayOne:
          $ref: '#/components/schemas/internal_adapters_http.homeTodayOne'
        unreadCheers:
          type: integer
        week:
          description: |-
            A rolling window ending today (progress.StreakWindowDays long), not a
            calendar week. Kept as `week` on the wire so already-shipped clients keep
            parsing it; the length is what changed, and the client reads .length.
          items:
            type: integer
          type: array
          uniqueItems: false
        xp:
          type: integer
      type: object
    internal_adapters_http.homeReview:
      properties:
        front:
          type: string
        id:
          type: string
      type: object
    internal_adapters_http.homeTodayOne:
      properties:
        chapter:
          type: string
        kind:
          type: string
        scenarioId:
          type: string
        title:
          type: string
      type: object
    internal_adapters_http.loginResp:
      properties:
        tokens:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_auth.TokenPair'
        user:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_user.User'
      type: object
    internal_adapters_http.meResp:
      properties:
        profile:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_user.Profile'
        user:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_user.User'
      type: object
    internal_adapters_http.messageReq:
      properties:
        text:
          type: string
      type: object
    internal_adapters_http.modelAnswerPage:
      properties:
        groups:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.ModelAnswerGroup'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    internal_adapters_http.pageAnswerResp:
      properties:
        already:
          description: |-
            Already is true when this call had been answered before, in which case no XP was
            granted. The client still navigates — re-entering the scenario is harmless.
          type: boolean
        bonusXp:
          type: integer
        scenarioId:
          type: string
      type: object
    internal_adapters_http.phonemeTipDTO:
      properties:
        ipa:
          type: string
        message:
          type: string
      type: object
    internal_adapters_http.pronounceReq:
      properties:
        audioBase64:
          type: string
        origin:
          description: |-
            Origin/ScenarioID/ReviewCardID are all optional and new in Task 5 —
            existing clients that omit them get origin="freeform", no scenario,
            no linked card (business-rules §2, domain-entities §4).
          type: string
        referenceText:
          type: string
        reviewCardId:
          type: string
        scenarioId:
          type: string
      type: object
    internal_adapters_http.pronounceResp:
      properties:
        accuracy:
          type: number
        attemptId:
          type: string
        attemptNo:
          type: integer
        completeness:
          type: number
        durationMs:
          description: |-
            DurationMS is the recorded audio's length in milliseconds. Azure's
            pronunciation-assessment response does not carry this — it is NOT
            populated by the azurespeech adapter. The caller computes it from the
            WAV it captured (see business-rules R6 / domain-entities SpeechAttempt).
          type: integer
        fluency:
          type: number
        overall:
          type: number
        phonemeTips:
          additionalProperties:
            $ref: '#/components/schemas/internal_adapters_http.phonemeTipDTO'
          description: |-
            PhonemeTips is new in Task 11 — see phonemeTipsFor's doc for the shape
            and dedup rationale. omitempty: a scored attempt with no words at all
            (or no phoneme with a mapped tip) sends no field rather than `{}`.
          type: object
        prosody:
          description: |-
            Prosody (억양) only arrives when EnableProsodyAssessment is on AND the
            locale supports it. ProsodyOK distinguishes "scored 0" from "not scored" —
            rendering an absent score as 0 would tell the learner a falsehood.
          type: number
        prosodyAvailable:
          type: boolean
        recognized:
          type: string
        words:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.WordScore'
          type: array
          uniqueItems: false
      type: object
    internal_adapters_http.refreshReq:
      properties:
        refreshToken:
          type: string
      type: object
    internal_adapters_http.resumableResp:
      properties:
        sessionId:
          type: string
        turns:
          items:
            $ref: '#/components/schemas/internal_adapters_http.resumableTurn'
          type: array
          uniqueItems: false
      type: object
    internal_adapters_http.resumableTurn:
      properties:
        content:
          type: string
        role:
          type: string
      type: object
    internal_adapters_http.sessionReviewResp:
      properties:
        average:
          type: number
        sentences:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.SpokenSentenceRow'
          type: array
          uniqueItems: false
        weakest:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.SpokenSentenceRow'
          type: array
          uniqueItems: false
      type: object
    internal_adapters_http.socialLoginReq:
      properties:
        idToken:
          type: string
        provider:
          type: string
      type: object
    internal_adapters_http.speakSummaryResp:
      properties:
        high:
          type: integer
        low:
          type: integer
        mid:
          type: integer
        total:
          type: integer
        weakest:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.SpokenSentenceRow'
          type: array
          uniqueItems: false
      type: object
    internal_adapters_http.spokenSentencesResp:
      properties:
        depts:
          description: |-
            Depts is every department the learner has spoken in, regardless of the filter or
            how far they have scrolled. Sent so the chip row is complete and stable —
            deriving it from the loaded pages made chips appear mid-scroll.
          items:
            type: string
          type: array
          uniqueItems: false
        sentences:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.SpokenSentenceRow'
          type: array
          uniqueItems: false
        total:
          description: |-
            Total counts the sentences that match the CURRENT filter, not the whole bank:
            the list's count line reads "N문장 중 M개 표시", and reporting an unfiltered
            total there said "3 of 128" for a filter that matched 3.
          type: integer
      type: object
    internal_adapters_http.sttReq:
      properties:
        audioBase64:
          type: string
        scenarioId:
          type: string
        sessionId:
          description: |-
            SessionID/ScenarioID are optional: present when the audio came from a
            dialogue turn, in which case the utterance is also scored and filed under
            that run. Absent for any other dictation.
          type: string
      type: object
    internal_adapters_http.titleReq:
      properties:
        titleId:
          type: string
      type: object
    internal_adapters_http.uiLangReq:
      properties:
        uiLang:
          type: string
      type: object
    internal_adapters_http.updateProfileReq:
      properties:
        destination:
          type: string
        job:
          type: string
        nativeLang:
          type: string
        targetLang:
          type: string
        targetLevel:
          type: string
      type: object
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
