components:
  schemas:
    github_com_bingoring_forin_server_internal_curriculum.BuildingGroup:
      properties:
        building:
          type: string
        floors:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_curriculum.FloorGroup'
          type: array
          uniqueItems: false
      type: object
    github_com_bingoring_forin_server_internal_curriculum.CurriculumState:
      properties:
        building:
          type: string
        done:
          type: integer
        floor:
          type: string
        key:
          type: string
        name:
          type: string
        next:
          description: name of the current (now) step
          type: string
        resume:
          type: boolean
        state:
          description: done | doing | todo
          type: string
        steps:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_curriculum.StepState'
          type: array
          uniqueItems: false
        total:
          type: integer
        where:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_curriculum.FloorGroup:
      properties:
        curricula:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_curriculum.CurriculumState'
          type: array
          uniqueItems: false
        floor:
          type: string
        where:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_curriculum.StepState:
      properties:
        kind:
          type: string
        name:
          type: string
        optional:
          description: bonus practice; doesn't gate
          type: boolean
        scenarioId:
          type: string
        state:
          description: done | now | lock | optional
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_auth.TokenPair:
      properties:
        accessToken:
          type: string
        expiresIn:
          description: access token seconds-to-live
          type: integer
        refreshToken:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_colleague.Relation:
      enum:
      - peer
      - mentor
      - mentee
      type: string
      x-enum-varnames:
      - RelationPeer
      - RelationMentor
      - RelationMentee
    github_com_bingoring_forin_server_internal_domain_conversation.Correction:
      properties:
        cardId:
          type: string
        corrected:
          type: string
        note:
          type: string
        original:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_home.MentorNote:
      properties:
        id:
          type: string
        npc:
          properties:
            dept:
              type: string
            name:
              type: string
            role:
              type: string
          type: object
        text:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_home.Phrase:
      properties:
        en:
          type: string
        id:
          type: string
        ko:
          type: string
        note:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_home.Shift:
      properties:
        deptLabel:
          type: string
        shift:
          description: DAY | EVENING
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.GrowthStats:
      properties:
        activeDates:
          description: yyyy-mm-dd (tz), the StreakWindowDays ending today
          items:
            type: string
          type: array
          uniqueItems: false
        conversationSecondsToday:
          type: integer
        conversationSecondsWeek:
          type: integer
        newCardsToday:
          type: integer
        newCardsWeek:
          type: integer
        scenariosToday:
          type: integer
        scenariosTotal:
          description: lifetime clears → praise stickers (1 each)
          type: integer
        scenariosWeek:
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.Progress:
      properties:
        level:
          type: integer
        rank:
          type: string
        reputation:
          description: |-
            Reputation is ordered for display and carries its own labels, so the client
            renders whatever the profession defines without knowing any of the names.
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.Standing'
          type: array
          uniqueItems: false
        streakCurrent:
          type: integer
        streakLongest:
          type: integer
        xp:
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_progress.Standing:
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: integer
      type: object
    github_com_bingoring_forin_server_internal_domain_user.Profile:
      properties:
        destination:
          description: e.g. "us"
          type: string
        equippedTitle:
          description: equipped career title id (may be empty)
          type: string
        job:
          description: 'MVP: "nurse"'
          type: string
        nativeLang:
          description: user's language, e.g. "ko"
          type: string
        onboarded:
          description: completed the onboarding wizard
          type: boolean
        targetLang:
          description: language being learned, e.g. "en", "de"
          type: string
        targetLevel:
          description: level in TargetLang, e.g. "B1"
          type: string
        userId:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_domain_user.User:
      properties:
        createdAt:
          type: string
        id:
          description: UUID
          type: string
        status:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_ports.PhonemeResult:
      properties:
        accuracy:
          type: number
        duration:
          type: integer
        offset:
          type: integer
        phoneme:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_ports.SentenceReferenceRow:
      properties:
        durationMs:
          type: integer
        ipa:
          type: string
        locale:
          type: string
        referenceText:
          type: string
        sentenceKey:
          type: string
        words:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.WordScore'
          type: array
          uniqueItems: false
      type: object
    github_com_bingoring_forin_server_internal_ports.SpeechAttemptRow:
      properties:
        accuracy:
          type: number
        attemptNo:
          type: integer
        completeness:
          type: number
        createdAt:
          type: string
        durationMs:
          type: integer
        fluency:
          type: number
        id:
          type: string
        overall:
          type: number
        prosody:
          type: number
        prosodyAvailable:
          description: false = NULL in storage, i.e. prosody was never scored — see
            SpeechAttemptInput
          type: boolean
        recognized:
          type: string
        words:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.WordScore'
          type: array
          uniqueItems: false
      type: object
    github_com_bingoring_forin_server_internal_ports.SyllableResult:
      properties:
        accuracy:
          type: number
        duration:
          type: integer
        grapheme:
          type: string
        offset:
          type: integer
        syllable:
          type: string
      type: object
    github_com_bingoring_forin_server_internal_ports.WordScore:
      properties:
        accuracy:
          type: number
        errorType:
          type: string
        phonemes:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.PhonemeResult'
          type: array
          uniqueItems: false
        syllables:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.SyllableResult'
          type: array
          uniqueItems: false
        word:
          type: string
      type: object
    internal_adapters_http.attemptReq:
      properties:
        scenarioId:
          type: string
        score:
          type: integer
      type: object
    internal_adapters_http.correctReq:
      properties:
        context:
          type: string
        text:
          type: string
      type: object
    internal_adapters_http.economyConfigResp:
      properties:
        dailyClearedWeight:
          description: weight multiplier for already-cleared
          type: number
        dailyDeptCap:
          description: max scenarios per dept in a day's set
          type: integer
        dailyOffBandWeight:
          description: weight multiplier for off-level difficulty
          type: number
        dailyPoolSize:
          description: Daily situation pool.
          type: integer
        easeDefault:
          description: Spaced repetition (SM-2).
          type: number
        easeFloor:
          type: number
        firstInterval:
          description: days, reps 0 → 1
          type: integer
        masteryCap:
          description: mastery pips ceiling
          type: integer
        pronunciationEnabled:
          type: boolean
        rankHead:
          type: integer
        rankJunior:
          description: Rank thresholds (level → career title).
          type: integer
        rankSenior:
          type: integer
        repBandCordial:
          description: ≥ → neutral/cordial
          type: integer
        repBandWarm:
          description: ≥ → NPC noticeably warm
          type: integer
        repBandWary:
          description: ≥ → slightly wary; below → guarded
          type: integer
        repGainMax:
          description: reputation gained by a perfect clear
          type: integer
        repLossMax:
          description: reputation lost by a zero-score attempt
          type: integer
        reputationDefault:
          description: Reputation (0..100).
          type: integer
        scenarioBaseXP:
          description: default XP for clearing a scenario
          type: integer
        scenarioMinXP:
          description: XP floor for a genuine attempt (score>0)
          type: integer
        scenarioPassScore:
          description: |-
            Scenario grading (AI-judged completion). A scenario is "cleared" (완료) only
            when the graded score ≥ ScenarioPassScore; below that it's an engaged attempt
            (재도전) that still earns score-scaled XP + streak but no clear/스티커.
          type: integer
        secondInterval:
          description: days, reps 1 → 2
          type: integer
        titleWarmthBonus:
          description: equipped "warm" title nudge
          type: integer
        topUpAdd:
          description: Rewarded-ad top-up.
          type: integer
        topUpCap:
          description: rewarded top-ups allowed per local day
          type: integer
        xpPerLevel:
          description: XP for one level (level = 1 + xp/XPPerLevel)
          type: integer
      type: object
    internal_adapters_http.gate:
      properties:
        id:
          type: string
        locked:
          type: boolean
        reason:
          type: string
      type: object
    internal_adapters_http.gradeReq:
      properties:
        grade:
          type: string
      type: object
    internal_adapters_http.homeColleague:
      properties:
        activeToday:
          type: boolean
        activity:
          type: string
        id:
          type: string
        name:
          type: string
        relation:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_colleague.Relation'
      type: object
    internal_adapters_http.homeResp:
      properties:
        colleagueTotal:
          type: integer
        colleagues:
          items:
            $ref: '#/components/schemas/internal_adapters_http.homeColleague'
          type: array
          uniqueItems: false
        date:
          type: string
        done:
          type: boolean
        level:
          type: integer
        mentorNote:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_home.MentorNote'
        pendingRequests:
          type: integer
        phrase:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_home.Phrase'
        review:
          $ref: '#/components/schemas/internal_adapters_http.homeReview'
        shift:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_home.Shift'
        situationsWaiting:
          type: integer
        streak:
          type: integer
        targetLevel:
          type: string
        todayOne:
          $ref: '#/components/schemas/internal_adapters_http.homeTodayOne'
        unreadCheers:
          type: integer
        week:
          description: |-
            A rolling window ending today (progress.StreakWindowDays long), not a
            calendar week. Kept as `week` on the wire so already-shipped clients keep
            parsing it; the length is what changed, and the client reads .length.
          items:
            type: integer
          type: array
          uniqueItems: false
        xp:
          type: integer
      type: object
    internal_adapters_http.homeReview:
      properties:
        front:
          type: string
        id:
          type: string
      type: object
    internal_adapters_http.homeTodayOne:
      properties:
        chapter:
          type: string
        kind:
          type: string
        scenarioId:
          type: string
        title:
          type: string
      type: object
    internal_adapters_http.loginResp:
      properties:
        tokens:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_auth.TokenPair'
        user:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_user.User'
      type: object
    internal_adapters_http.meResp:
      properties:
        profile:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_user.Profile'
        user:
          $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_user.User'
      type: object
    internal_adapters_http.messageReq:
      properties:
        text:
          type: string
      type: object
    internal_adapters_http.phonemeTipDTO:
      properties:
        ipa:
          type: string
        message:
          type: string
      type: object
    internal_adapters_http.pronounceReq:
      properties:
        audioBase64:
          type: string
        origin:
          description: |-
            Origin/ScenarioID/ReviewCardID are all optional and new in Task 5 —
            existing clients that omit them get origin="freeform", no scenario,
            no linked card (business-rules §2, domain-entities §4).
          type: string
        referenceText:
          type: string
        reviewCardId:
          type: string
        scenarioId:
          type: string
      type: object
    internal_adapters_http.pronounceResp:
      properties:
        accuracy:
          type: number
        attemptId:
          type: string
        attemptNo:
          type: integer
        completeness:
          type: number
        durationMs:
          description: |-
            DurationMS is the recorded audio's length in milliseconds. Azure's
            pronunciation-assessment response does not carry this — it is NOT
            populated by the azurespeech adapter. The caller computes it from the
            WAV it captured (see business-rules R6 / domain-entities SpeechAttempt).
          type: integer
        fluency:
          type: number
        overall:
          type: number
        phonemeTips:
          additionalProperties:
            $ref: '#/components/schemas/internal_adapters_http.phonemeTipDTO'
          description: |-
            PhonemeTips is new in Task 11 — see phonemeTipsFor's doc for the shape
            and dedup rationale. omitempty: a scored attempt with no words at all
            (or no phoneme with a mapped tip) sends no field rather than `{}`.
          type: object
        prosody:
          description: |-
            Prosody (억양) only arrives when EnableProsodyAssessment is on AND the
            locale supports it. ProsodyOK distinguishes "scored 0" from "not scored" —
            rendering an absent score as 0 would tell the learner a falsehood.
          type: number
        prosodyAvailable:
          type: boolean
        recognized:
          type: string
        words:
          items:
            $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_ports.WordScore'
          type: array
          uniqueItems: false
      type: object
    internal_adapters_http.refreshReq:
      properties:
        refreshToken:
          type: string
      type: object
    internal_adapters_http.resumableResp:
      properties:
        sessionId:
          type: string
        turns:
          items:
            $ref: '#/components/schemas/internal_adapters_http.resumableTurn'
          type: array
          uniqueItems: false
      type: object
    internal_adapters_http.resumableTurn:
      properties:
        content:
          type: string
        role:
          type: string
      type: object
    internal_adapters_http.socialLoginReq:
      properties:
        idToken:
          type: string
        provider:
          type: string
      type: object
    internal_adapters_http.sttReq:
      properties:
        audioBase64:
          type: string
      type: object
    internal_adapters_http.titleReq:
      properties:
        titleId:
          type: string
      type: object
    internal_adapters_http.updateProfileReq:
      properties:
        destination:
          type: string
        job:
          type: string
        nativeLang:
          type: string
        targetLang:
          type: string
        targetLevel:
          type: string
      type: object
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: forin server API — Go stdlib, hexagonal. Contract is Go-first (swag
    → openapi → openapi-typescript).
  title: forin API
  version: 0.1.0
openapi: 3.1.0
paths:
  /attempts:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_adapters_http.attemptReq'
              description: scenario clear
              summary: body
        description: scenario clear
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_progress.Progress'
          description: OK
      security:
      - Bearer: []
      summary: Record a cleared scenario (awards XP, advances streak)
      tags:
      - progress
  /auth/dev:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_adapters_http.loginResp'
          description: OK
      summary: Dev login (no provider). Registered only in dev or where DEV_AUTH_SECRET
        is set.
      tags:
      - auth
  /auth/logout:
    post:
      responses: null
      security:
      - Bearer: []
      summary: Logout (revoke refresh tokens)
      tags:
      - auth
  /auth/refresh:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_adapters_http.refreshReq'
              description: refresh token
              summary: body
        description: refresh token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_auth.TokenPair'
          description: OK
      summary: Rotate refresh token
      tags:
      - auth
  /auth/social:
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_adapters_http.socialLoginReq'
                description: provider + ID token
                summary: body
        description: provider + ID token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_adapters_http.loginResp'
          description: OK
      summary: Social login (Apple/Google/Kakao)
      tags:
      - auth
  /board/today:
    get:
      responses: null
      summary: Today's situation board — a daily-rotated set of scenario cards
      tags:
      - content
  /config/economy:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_adapters_http.economyConfigResp'
          description: OK
      summary: Economy config (single source of truth mirrored to the client) + pronunciation
        feature flag
      tags:
      - content
  /content/manifest:
    get:
      responses: null
      summary: Content manifest (version)
      tags:
      - content
  /conversation/{sessionId}/complete:
    post:
      responses: null
      security:
      - Bearer: []
      summary: Grade the finished conversation, award scaled XP, return the result
      tags:
      - conversation
  /conversation/{sessionId}/message:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_adapters_http.messageReq'
              description: user message
              summary: body
        description: user message
        required: true
      responses: null
      security:
      - Bearer: []
      summary: Send a message; NPC replies in persona (LLM)
      tags:
      - conversation
  /conversation/{sessionId}/speech.wav:
    get:
      responses:
        "200":
          content:
            audio/wav:
              schema:
                type: file
          description: OK
      summary: Speak the latest NPC line of a conversation
      tags:
      - conversation
  /conversation/{sessionId}/stream:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_adapters_http.messageReq'
              description: user message
              summary: body
        description: user message
        required: true
      responses: null
      security:
      - Bearer: []
      summary: Send a message; NPC reply streamed as Server-Sent Events (LLM)
      tags:
      - conversation
  /correct:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_adapters_http.correctReq'
              description: utterance to correct
              summary: body
        description: utterance to correct
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_bingoring_forin_server_internal_domain_conversation.Correction'
          description: OK
      security:
      - Bearer: []
      summary: AI-correct an English utterance (creates a review card)
      tags:
      - conversation
  /departments:
    get:
      responses: null
      summary: List departments (optionally ?profession=nurse)
      tags:
      - content
  /events:
    get:
      responses: null
      summary: List events (optionally ?profession=nurse)
      tags:
      - content
  /interiors/{id}:
    get:
      responses: null
      summary: 'Get a department interior (tile map: regions/rooms/objects/hotspots)'
      tags:
      - content
  /invite/{code}:
    get:
      responses: null
      security:
      - Bearer: []
      summary: Preview the person behind an invite code
      tags:
      - colleagues
  /me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_adapters_http.meResp'
          description: OK
      security:
      - Bearer: []
      summary: Current user + profile
      tags:
      - user
  /me/access/{interiorId}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/internal_adapters_http.gate'
                  type: array
                type: object
          description: OK
      security:
      - Bearer: []
      summary: What the learner may enter in one interior
      tags:
      - access
  /me/cheers:
    get:
      responses: null
      security:
      - Bearer: []
      summary: Cheer inbox (marks them read)
      tags:
      - colleagues
  /me/colleague-prefs:
    get:
      responses: null
      security:
      - Bearer: []
      summary: Read or update colleague sharing preferences
      tags:
      - colleagues
  /me/colleague-requests:
    get:
      responses: null
      security:
      - Bearer: []
      summary: Pending colleague requests addressed to me
      tags:
      - colleagues
  /me/colleague-requests/{id}/accept:
    post:
      responses: null
      security:
      - Bearer: []
      summary: Accept a colleague request
      tags:
      - colleagues
  /me/colleague-requests/{id}/decline:
    post:
      responses: null
      security:
      - Bearer: []
      summary: Decline a colleague request
      tags:
      - colleagues
  /me/colleagues:
    get:
      responses: null
      security:
      - Bearer: []
      summary: My colleagues
      tags:
      - colleagues
    post:
      responses: null
      security:
      - Bearer: []
      summary: Redeem an invite code (creates a request, or links when mutual)
      tags:
      - colleagues
  /me/colleagues/{id}:
    delete:
      responses: null
      security:
      - Bearer: []
      summary: Remove a colleague
      tags:
      - colleagues
    get:
      responses: null
      security:
      - Bearer: []
      summary: One colleague's profile (404 unless linked)
      tags:
      - colleagues
  /me/colleagues/{id}/cheers:
    post:
      responses: null
      security:
      - Bearer: []
      summary: Send a cheer to a colleague
      tags:
      - colleagues
  /me/curriculum:
    get:
      responses:
